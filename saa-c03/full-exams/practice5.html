 monitoring đổi interval EC2 metrics mặc định 5 phút → 1 phút, đáp ứng yêu cầu ≤2 phút.</li><li><b>C. ✗</b> OpenSearch không thu thập sẵn metric CPU/memory EC2, cần tự xây pipeline log.</li><li><b>D. ✗</b> EventBridge + SNS dùng cho event/alerting, không phải giám sát hiệu năng liên tục.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các phương án custom (agent, OpenSearch, EventBridge) nghe mạnh hơn nhưng vi phạm yêu cầu 'nhanh triển khai, ít vận hành'.</p>","tip":"<p>EC2 metric mặc định: 5 phút. Cần chi tiết hơn nhanh gọn: bật Detailed Monitoring (1 phút) thay vì tự xây custom metrics.</p>"},{"id":29,"topic":"Design Secure Architectures – AWS Organizations Tag Policy + SCP","supplement":false,"stem":"An enterprise is developing an internal compliance framework for its cloud infrastructure hosted on AWS. The enterprise uses AWS Organizations to group accounts under various organizational units (OUs) based on departmental function. As part of its governance controls, the security team mandates that all Amazon EC2 instances must be tagged to indicate the level of data classification — either 'confidential' or 'public'. Additionally, the organization must ensure that IAM users cannot launch EC2 instances without assigning a classification tag, nor should they be able to remove the tag from running instances. A solutions architect must design a solution to meet these compliance controls while minimizing operational overhead.<br>Which combination of steps will meet these requirements? (Select two)","options":[{"html":"Create a tag enforcement Lambda function that runs on a schedule to identify EC2 instances without the required tag. The function sends a notification to administrators and optionally shuts down noncompliant resources","correct":false},{"html":"Define a tag policy in AWS Organizations that enforces the dataClassification key and restricts values to 'confidential' and 'public'. Attach this tag policy to the applicable organizational unit (OU) to enforce uniform tagging behavior across accounts","correct":true},{"html":"Create a service control policy (SCP) that denies the ec2:RunInstances API action unless the required tag key is present in the request. Create a second SCP that denies the ec2:DeleteTags action for EC2 resources. Attach both SCPs to the relevant OU in AWS Organizations","correct":true},{"html":"Enable AWS Config rules to detect noncompliant EC2 instances. Trigger an AWS Systems Manager Automation runbook to reapply missing tags automatically when noncompliance is detected","correct":false},{"html":"Use AWS Identity and Access Management (IAM) permission boundaries to restrict EC2-related actions unless the dataClassification tag is present. Apply these boundaries to all IAM roles used for EC2 provisioning","correct":false}],"multi":2,"analysis":"<p>Bắt buộc tagging + ngăn xoá tag ở mức tổ chức, chủ động (preventive) chứ không phải phát hiện sau (detective)</p>","answer":"<p>SCP có thể DENY hành động API nếu thiếu điều kiện tag (preventive); Tag Policy chuẩn hoá giá trị tag hợp lệ trên toàn OU.</p>","explain":"<ul><li><b>A. ✗</b> Cách tiếp cận phản ứng (sau khi tạo), không ngăn được việc tạo resource thiếu tag ngay từ đầu.</li><li><b>B. ✓</b> Tag Policy ở Organizations chuẩn hoá key/value cho phép, áp dụng cho cả OU.</li><li><b>C. ✓</b> SCP chặn hẳn hành động RunInstances thiếu tag và DeleteTags — ngăn chặn chủ động (preventive).</li><li><b>D. ✗</b> Config + remediation chỉ phát hiện và vá lại sau, không ngăn tạo resource sai ngay từ đầu.</li><li><b>E. ✗</b> Permission boundary áp cho role cụ thể, không phải cơ chế tổ chức-rộng như SCP/Tag Policy.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các giải pháp dùng Config/Lambda để 'phát hiện rồi xử lý' là detective, không đáp ứng yêu cầu ngăn chặn (prevent) từ đầu.</p>","tip":"<p>Ngăn chặn hành động API theo điều kiện (bắt buộc tag, chặn xoá tag) → SCP với condition key. Chuẩn hoá &amp; audit giá trị tag → Tag Policy.</p>"},{"id":30,"topic":"Design Resilient Architectures – Real-time search: Kinesis + OpenSearch","supplement":false,"stem":"A fintech company currently operates a real-time search and analytics platform on-premises. This platform ingests streaming data from multiple data-producing systems and provides immediate search capabilities and interactive visualizations for end users. As part of its cloud migration strategy, the company wants to rearchitect the solution using AWS-native services.<br>Which of the following represents the most efficient solution?","options":[{"html":"Use AWS Glue streaming ETL to process data streams and load the data into Amazon Redshift. Use Amazon Redshift’s full-text search capabilities for querying. Use Amazon QuickSight for data visualizations","correct":false},{"html":"Deploy Amazon EC2 instances to handle the ingestion and processing of streaming data, storing the results in Amazon S3. Utilize Amazon Athena to search the stored data, and use Amazon Managed Grafana to generate dashboards and visual insights","correct":false},{"html":"Ingest and process the streaming data using Amazon Kinesis Data Streams, then index the data with Amazon OpenSearch Service for real-time search capabilities. Use Amazon QuickSight to build interactive dashboards and visualizations based on the indexed data","correct":true},{"html":"Use Amazon Elastic Container Service (Amazon ECS) with AWS Fargate to ingest the data into Amazon DynamoDB to facilitate full text search. Use Amazon CloudWatch to create dashboards and query the data","correct":false}],"multi":1,"analysis":"<p>Ghép dịch vụ AWS-native cho stack search + analytics thời gian thực</p>","answer":"<p>OpenSearch Service được thiết kế chuyên cho tìm kiếm/chỉ mục toàn văn thời gian thực, Kinesis Data Streams lo phần ingest.</p>","explain":"<ul><li><b>A. ✗</b> Redshift không tối ưu cho full-text search độ trễ thấp, thêm phức tạp Glue+Redshift.</li><li><b>B. ✗</b> Dùng EC2 để ingest tăng overhead vận hành; Athena không phù hợp tìm kiếm real-time.</li><li><b>C. ✓</b> Kinesis Data Streams ingest real-time, OpenSearch index để tìm kiếm, QuickSight trực quan hoá — đúng chuỗi dịch vụ chuyên biệt.</li><li><b>D. ✗</b> DynamoDB không hỗ trợ full-text search; CloudWatch không phải công cụ visualize dữ liệu người dùng.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Redshift/DynamoDB nghe mạnh về dữ liệu lớn nhưng không chuyên cho full-text search độ trễ thấp.</p>","tip":"<p>Cần search + index thời gian thực → OpenSearch Service. Cần data warehouse/BI → Redshift. Trực quan hoá → QuickSight.</p>"},{"id":31,"topic":"Design High-Performing Architectures – DataSync + File Gateway","supplement":false,"stem":"A leading media company wants to do an accelerated online migration of hundreds of terabytes of files from their on-premises data center to Amazon S3 and then establish a mechanism to access the migrated data for ongoing updates from the on-premises applications.<br>As a solutions architect, which of the following would you select as the MOST performant solution for the given use-case?","options":[{"html":"Use AWS DataSync to migrate existing data to Amazon S3 and then use File Gateway to retain access to the migrated data for ongoing updates from the on-premises applications","correct":true},{"html":"Use Amazon S3 Transfer Acceleration (Amazon S3TA) to migrate existing data to Amazon S3 and then use AWS DataSync for ongoing updates from the on-premises applications","correct":false},{"html":"Use AWS DataSync to migrate existing data to Amazon S3 as well as access the Amazon S3 data for ongoing updates","correct":false},{"html":"Use File Gateway configuration of AWS Storage Gateway to migrate data to Amazon S3 and then use Amazon S3 Transfer Acceleration (Amazon S3TA) for ongoing updates from the on-premises applications","correct":false}],"multi":1,"analysis":"<p>Tách đúng vai trò: migrate 1 lần (nhanh) vs truy cập liên tục (file share)</p>","answer":"<p>DataSync tối ưu tốc độ cho đợt migrate ban đầu; File Gateway cung cấp SMB/NFS để on-prem tiếp tục truy cập/cập nhật dữ liệu trên S3.</p>","explain":"<ul><li><b>A. ✓</b> DataSync chỉ dùng để di chuyển dữ liệu, không hỗ trợ truy cập cập nhật liên tục sau đó.</li><li><b>B. ✗</b> S3TA tăng tốc truyền file nhưng không hỗ trợ cập nhật liên tục kiểu file share.</li><li><b>C. ✗</b> DataSync không thể dùng để truy cập/ghi liên tục — chỉ là công cụ transfer.</li><li><b>D. ✗</b> File Gateway không tối ưu cho khối lượng lớn ban đầu; S3TA không hỗ trợ update liên tục.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Dùng 1 dịch vụ (DataSync hoặc File Gateway) cho CẢ hai việc nghe gọn nhưng mỗi dịch vụ chỉ giỏi đúng 1 vai trò.</p>","tip":"<p>Chuyển dữ liệu khối lượng lớn 1 lần, nhanh → DataSync. Truy cập/'mount' liên tục từ on-prem vào S3 → Storage Gateway File Gateway.</p>"},{"id":32,"topic":"Design Resilient Architectures – RDS DR: cross-Region Read Replica & backups","supplement":false,"stem":"The engineering team at a retail company manages 3 Amazon EC2 instances that make read-heavy database requests to the Amazon RDS for the PostgreSQL database instance. As an AWS Certified Solutions Architect - Associate, you have been tasked to make the database instance resilient from a disaster recovery perspective.<br>Which of the following features will help you in disaster recovery of the database? (Select two)","options":[{"html":"Use Amazon RDS Provisioned IOPS (SSD) Storage in place of General Purpose (SSD) Storage","correct":false},{"html":"Use cross-Region Read Replicas","correct":true},{"html":"Enable the automated backup feature of Amazon RDS in a multi-AZ deployment that creates backups in a single AWS Region","correct":false},{"html":"Use the database cloning feature of the Amazon RDS Database cluster","correct":false},{"html":"Enable the automated backup feature of Amazon RDS in a multi-AZ deployment that creates backups across multiple Regions","correct":true}],"multi":2,"analysis":"<p>Disaster Recovery cấp Region cho RDS: Read Replica + Backup khác Region</p>","answer":"<p>Cross-Region Read Replica (promote khi cần) và cross-Region automated backup đều giúp khôi phục khi cả Region chính gặp sự cố.</p>","explain":"<ul><li><b>A. ✗</b> Provisioned IOPS cải thiện hiệu năng, không phải giải pháp DR.</li><li><b>B. ✓</b> Cross-Region Read Replica có thể promote thành primary độc lập khi mất cả Region.</li><li><b>C. ✗</b> Backup chỉ trong 1 Region không giúp DR khi mất cả Region đó.</li><li><b>D. ✗</b> Database cloning là tính năng của Aurora, RDS thường không có.</li><li><b>E. ✓</b> Automated backup cross-Region giúp khôi phục point-in-time dù mất cả Region gốc.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các tính năng hiệu năng (Provisioned IOPS) hay tính năng chỉ có ở Aurora (cloning) bị gài vào như distractor DR.</p>","tip":"<p>DR cấp Region cho RDS: Read Replica khác Region (promote khi cần) + Automated Backup cấu hình cross-Region.</p>"},{"id":33,"topic":"Design High-Performing Architectures – Kinesis Data Streams - batch records","supplement":false,"stem":"You are a cloud architect at an IT company. The company has multiple enterprise customers that manage their own mobile applications that capture and send data to Amazon Kinesis Data Streams. They have been getting a ProvisionedThroughputExceededException exception. You have been contacted to help and upon analysis, you notice that messages are being sent one by one at a high rate.<br>Which of the following options will help with the exception while keeping costs at a minimum?","options":[{"html":"Increase the number of shards","correct":false},{"html":"Use batch messages","correct":true},{"html":"Decrease the Stream retention duration","correct":false},{"html":"Use Exponential Backoff","correct":false}],"multi":1,"analysis":"<p>Khắc phục ProvisionedThroughputExceededException với chi phí thấp nhất</p>","answer":"<p>Gửi record theo batch (PutRecords) tận dụng throughput mỗi shard hiệu quả hơn gửi từng record một.</p>","explain":"<ul><li><b>A. ✗</b> Tăng shard tăng chi phí, chỉ là giải pháp ngắn hạn.</li><li><b>B. ✓</b> Gộp nhiều record vào 1 request (batch) giảm số lần gọi API, tăng hiệu quả dùng shard.</li><li><b>C. ✗</b> Giảm retention có thể gây mất dữ liệu, không giải quyết nghẽn throughput.</li><li><b>D. ✗</b> Exponential backoff chỉ giảm tải tạm thời, lỗi vẫn tái diễn khi tải cao trở lại.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Tăng số shard 'chắc chắn' hết lỗi nhưng tốn chi phí hơn nhiều so với tối ưu cách gửi dữ liệu.</p>","tip":"<p>Gặp ProvisionedThroughputExceededException trước tiên nghĩ tới batch + tối ưu producer, không vội tăng shard (tốn tiền) hay backoff (chỉ giảm nhẹ).</p>"},{"id":34,"topic":"Design High-Performing Architectures – Kinesis Enhanced Fan-Out","supplement":false,"stem":"A big data analytics company is using Amazon Kinesis Data Streams (KDS) to process IoT data from the field devices of an agricultural sciences company. Multiple consumer applications are using the incoming data streams and the engineers have noticed a performance lag for the data delivery speed between producers and consumers of the data streams.<br>As a solutions architect, which of the following would you recommend for improving the performance for the given use-case?","options":[{"html":"Swap out Amazon Kinesis Data Streams with Amazon SQS Standard queues","correct":false},{"html":"Use Enhanced Fanout feature of Amazon Kinesis Data Streams","correct":true},{"html":"Swap out Amazon Kinesis Data Streams with Amazon SQS FIFO queues","correct":false},{"html":"Swap out Amazon Kinesis Data Streams with Amazon Kinesis Data Firehose","correct":false}],"multi":1,"analysis":"<p>Nhiều consumer đọc song song cùng 1 stream mà không tranh chấp băng thông</p>","answer":"<p>Enhanced Fan-Out cấp riêng 2MB/s mỗi consumer mỗi shard, loại bỏ nghẽn khi nhiều consumer dùng chung throughput mặc định.</p>","explain":"<ul><li><b>A. ✗</b> Dùng SQS Standard không phù hợp khi cần nhiều consumer đọc độc lập cùng một stream dữ liệu.</li><li><b>B. ✓</b> Enhanced Fan-Out: mỗi consumer được 2MB/s/shard riêng, không chia sẻ throughput.</li><li><b>C. ✗</b> SQS FIFO không hỗ trợ nhiều consumer tiêu thụ độc lập cùng dữ liệu kiểu stream.</li><li><b>D. ✗</b> Kinesis Data Firehose chỉ có 1 đích, không hỗ trợ nhiều ứng dụng consumer.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đổi hẳn sang dịch vụ khác (SQS, Firehose) nghe như giải pháp triệt để nhưng không giữ được mô hình multi-consumer của Kinesis Streams.</p>","tip":"<p>Nhiều consumer, hiệu năng đọc độc lập trên Kinesis Data Streams → Enhanced Fan-Out (2MB/s/shard/consumer).</p>"},{"id":35,"topic":"Design Secure Architectures – S3 Object Lock (Compliance Mode)","supplement":false,"stem":"A financial auditing firm uses Amazon S3 to store sensitive client records that are subject to write-once-read-many (WORM) regulations to prevent alteration or deletion of records for a specific retention period. The firm wants to enforce immutable storage, such that even administrators cannot overwrite or delete the records during the lock duration. They also need audit-friendly enforcement to prevent accidental or malicious deletion.<br>Which configuration of S3 Object Lock will ensure that the retention policy is strictly enforced, and no user (including root or administrators) can override or delete protected objects during the lock period?","options":[{"html":"Use S3 Object Lock in Governance Mode, which allows only IAM users with elevated permissions to override or remove retention settings","correct":false},{"html":"Enable S3 Versioning and set a bucket policy that denies s3:DeleteObject to all users during the retention period","correct":false},{"html":"Use S3 Object Lock in Compliance Mode, which enforces retention policies strictly and prevents all users from modifying or deleting data during the retention period","correct":true},{"html":"Use S3 Lifecycle Policies to transition data to Glacier Deep Archive and treat it as immutable during the archival period","correct":false}],"multi":1,"analysis":"<p>WORM tuyệt đối, không ai (kể cả admin) can thiệp được trong thời gian giữ</p>","answer":"<p>Compliance Mode khoá retention cứng, không có cơ chế bypass cho bất kỳ ai kể cả root user.</p>","explain":"<ul><li><b>A. ✗</b> Governance Mode vẫn cho phép user có quyền đặc biệt (BypassGovernanceRetention) xoá/ghi đè.</li><li><b>B. ✗</b> Versioning + bucket policy có thể bị user có quyền sửa chính sách này vô hiệu hoá.</li><li><b>C. ✓</b> Compliance Mode: không ai, kể cả root, có thể sửa/xoá trong thời gian lock.</li><li><b>D. ✗</b> Lifecycle chuyển class lưu trữ không làm object bất biến (immutable).</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Governance Mode rất dễ nhầm với Compliance Mode — khác biệt mấu chốt là Governance CHO PHÉP user đặc quyền can thiệp.</p>","tip":"<p>Cần enforce tuyệt đối theo luật định (không ai sửa được) → Object Lock Compliance Mode. Cần linh hoạt vận hành hơn → Governance Mode.</p>"},{"id":36,"topic":"Design Resilient Architectures – S3 CRR + KMS multi-Region key + Athena","supplement":false,"stem":"A data analytics team at a global media firm is building a new analytics platform to process large volumes of both historical and real-time data. This data is stored in Amazon S3. The team wants to implement a serverless solution that allows them to query the data directly using SQL. Additionally, the solution must ensure that all data is encrypted at rest and automatically replicated to another AWS Region to support business continuity.<br>Which solution will meet these requirements with the LEAST operational overhead?","options":[{"html":"Enable Cross-Region Replication (CRR) on the existing Amazon S3 bucket. Apply server-side encryption using AWS KMS multi-Region keys (SSE-KMS). Use Amazon Athena to run SQL queries on the replicated data","correct":false},{"html":"Create an Amazon S3 bucket configured with server-side encryption using Amazon S3 managed keys (SSE-S3). Enable cross-Region replication (CRR) on the source bucket. Use Amazon Redshift Spectrum to query the S3 data using SQL","correct":false},{"html":"Enable Cross-Region Replication (CRR) on the existing Amazon S3 bucket. Apply server-side encryption using Amazon S3 managed keys (SSE-S3). Use Amazon Athena to run SQL queries on the replicated data","correct":false},{"html":"Create an Amazon S3 bucket configured with server-side encryption using AWS KMS multi-Region keys (SSE-KMS). Enable cross-Region replication (CRR) on the source bucket. Use Amazon Athena to run SQL queries on the data","correct":true}],"multi":1,"analysis":"<p>Mã hoá KMS + replicate đa Region + truy vấn SQL serverless, ít thao tác vận hành nhất</p>","answer":"<p>Phải tạo bucket đích trước khi cấu hình CRR; KMS multi-Region key hỗ trợ mã hoá đồng bộ ở cả 2 Region; Athena truy vấn trực tiếp không cần hạ tầng.</p>","explain":"<ul><li><b>A. ✗</b> Thiếu bước tạo bucket đích ở Region khác — không thể bật CRR nếu chưa có bucket đích.</li><li><b>B. ✗</b> Dùng SSE-S3 thay vì KMS không đáp ứng yêu cầu mã hoá bằng key KMS; Redshift Spectrum vẫn cần cluster Redshift, không hoàn toàn serverless.</li><li><b>C. ✗</b> Thiếu bước tạo bucket đích ở Region khác trước khi bật CRR.</li><li><b>D. ✓</b> Tạo bucket mới + SSE-KMS multi-Region key + CRR + Athena: đủ các bước và đúng dịch vụ serverless.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Nhiều phương án bỏ sót bước 'tạo bucket mới ở Region đích' — một điều kiện bắt buộc để bật CRR.</p>","tip":"<p>CRR luôn cần bucket ĐÍCH đã tồn tại trước. Muốn mã hoá đồng nhất khi replicate đa Region bằng KMS → dùng multi-Region KMS key.</p>"},{"id":37,"topic":"Design Resilient Architectures – EFS + AWS Backup cross-Region","supplement":false,"stem":"A SaaS analytics company is deploying a microservices-based application on Amazon ECS using the Fargate launch type. The application requires access to a shared, POSIX-compliant file system that is available across multiple Availability Zones for redundancy and availability. To meet compliance requirements, the system must support regional backups and cross-Region data recovery with a recovery point objective (RPO) of no more than 8 hours. A backup strategy will be implemented using AWS Backup to automate replication across Regions. As the lead cloud architect, you are evaluating file storage solutions that align with these requirements.<br>Which option best meets the application's availability, durability, and RPO objectives?","options":[{"html":"Use Amazon Elastic File System (Amazon EFS) with the Standard storage class and configure AWS Backup to create cross-Region backups on a scheduled basis","correct":true},{"html":"Configure Amazon S3 with the S3 Standard storage class and mount it in containers using Mountpoint for Amazon S3. Use AWS Backup to replicate objects to another Region","correct":false},{"html":"Deploy Amazon FSx for Lustre and configure a backup plan using AWS Backup for cross-Region replication of the file system metadata","correct":false},{"html":"Use Amazon FSx for NetApp ONTAP with a Multi-AZ deployment and rely on its native high availability and AWS Backup integration to replicate the file system to another Region automatically","correct":false}],"multi":1,"analysis":"<p>File system chia sẻ POSIX đa AZ + RPO cross-Region cụ thể bằng AWS Backup</p>","answer":"<p>EFS vừa đáp ứng yêu cầu POSIX/đa AZ cho Fargate, vừa được AWS Backup hỗ trợ cross-Region backup có lịch, đạt RPO theo yêu cầu.</p>","explain":"<ul><li><b>A. ✓</b> EFS Standard có sẵn mount target đa AZ, tích hợp AWS Backup cho cross-Region backup đạt RPO ≤8h.</li><li><b>B. ✗</b> S3 không phải file system POSIX, Mountpoint cũng không thay đổi bản chất object storage.</li><li><b>C. ✗</b> FSx for Lustre dành cho HPC, không có mount target đa AZ tự nhiên cho ứng dụng container thông thường.</li><li><b>D. ✗</b> FSx for ONTAP Multi-AZ chỉ HA trong 1 Region; cross-Region phải tự cấu hình SnapMirror thủ công, AWS Backup không tự làm được.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> FSx for ONTAP nghe như giải pháp doanh nghiệp mạnh hơn nhưng cross-Region lại KHÔNG được AWS Backup tự động hoá (cần SnapMirror thủ công).</p>","tip":"<p>POSIX + đa AZ + cross-Region backup bằng AWS Backup, ít vận hành nhất → EFS Standard + AWS Backup. FSx for Lustre/ONTAP có use-case và giới hạn riêng.</p>"},{"id":38,"topic":"Design Secure Architectures – AWS PrivateLink","supplement":false,"stem":"A tech company runs a web application that includes multiple internal services deployed across Amazon EC2 instances within a VPC. These services require communication with a third-party SaaS provider's API for analytics and billing, which is also hosted on the AWS infrastructure. The company is concerned about minimizing public internet exposure while maintaining secure and reliable connectivity. The solution must ensure private access without allowing unsolicited incoming traffic from the SaaS provider.<br>Which solution will best meet these requirements?","options":[{"html":"Set up VPC peering between the application VPC and the SaaS provider’s VPC to allow direct communication","correct":false},{"html":"Establish a VPN connection using AWS Site-to-Site VPN to create a secure tunnel between the internal services and the third-party SaaS provider","correct":false},{"html":"Use AWS CloudFront to route requests from the application’s internal services to the SaaS provider through edge locations","correct":false},{"html":"Use AWS PrivateLink to create a private endpoint within the application’s VPC that connects securely to the SaaS provider’s VPC","correct":true}],"multi":1,"analysis":"<p>Kết nối riêng tư một chiều tới dịch vụ bên thứ ba mà không mở traffic 2 chiều</p>","answer":"<p>PrivateLink về bản chất chỉ cho phép phía consumer khởi tạo kết nối tới provider, loại bỏ hoàn toàn rủi ro SaaS provider chủ động kết nối ngược vào VPC.</p>","explain":"<ul><li><b>A. ✗</b> VPC Peering mở kết nối mạng rộng hơn cần thiết, SaaS cũng hiếm khi hỗ trợ peering với từng khách hàng.</li><li><b>B. ✗</b> Site-to-Site VPN cần thiết bị tương thích IPSec, có thể vẫn đi qua internet tuỳ hạ tầng SaaS.</li><li><b>C. ✗</b> CloudFront chỉ phân phối nội dung cache, không tạo kết nối backend riêng tư tới SaaS.</li><li><b>D. ✓</b> PrivateLink tạo kết nối một chiều (consumer → provider) qua ENI riêng, không lộ traffic ra internet.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> VPC Peering 'nghe gần giống' PrivateLink nhưng cho phép truy cập mạng rộng 2 chiều, không đúng yêu cầu 'không cho phép traffic đến không mong muốn'.</p>","tip":"<p>Kết nối riêng tư, 1 chiều, chi tiết (granular) tới dịch vụ/SaaS cụ thể → PrivateLink (interface endpoint). Kết nối mạng rộng 2 VPC → Peering.</p>"},{"id":39,"topic":"Design Secure Architectures – AWS WAF supported integrations","supplement":false,"stem":"An application hosted on Amazon EC2 contains sensitive personal information about all its customers and needs to be protected from all types of cyber-attacks. The company is considering using the AWS Web Application Firewall (AWS WAF) to handle this requirement.<br>Can you identify the correct solution leveraging the capabilities of AWS WAF?","options":[{"html":"AWS WAF can be directly configured on Amazon EC2 instances for ensuring the security of the underlying application data","correct":false},{"html":"AWS WAF can be directly configured only on an Application Load Balancer or an Amazon API Gateway. One of these two services can then be configured with Amazon EC2 to build the needed secure architecture","correct":false},{"html":"Create Amazon CloudFront distribution for the application on Amazon EC2 instances. Deploy AWS WAF on Amazon CloudFront to provide the necessary safety measures","correct":true},{"html":"Configure an Application Load Balancer (ALB) to balance the workload for all the Amazon EC2 instances. Configure Amazon CloudFront to distribute from an Application Load Balancer since AWS WAF cannot be directly configured on ALB. This configuration not only provides necessary safety but is scalable too","correct":false}],"multi":1,"analysis":"<p>Nhận diện đúng-sai các phát biểu về nơi WAF có thể tích hợp</p>","answer":"<p>AWS WAF hỗ trợ gắn vào CloudFront, Application Load Balancer, và API Gateway — không trực tiếp trên EC2.</p>","explain":"<ul><li><b>A. ✗</b> WAF không thể gắn trực tiếp vào EC2 instance.</li><li><b>B. ✗</b> Phát biểu chỉ đúng một phần — bỏ sót CloudFront, một trong các nơi WAF có thể gắn.</li><li><b>C. ✓</b> WAF gắn vào CloudFront để bảo vệ ứng dụng chạy trên EC2 phía sau, đúng và đơn giản nhất.</li><li><b>D. ✗</b> Khẳng định sai: WAF HOÀN TOÀN gắn được trực tiếp vào ALB.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các đáp án sai thường đúng một phần rồi thêm 1 khẳng định sai (vd 'WAF không gắn được vào ALB') để đánh lừa.</p>","tip":"<p>WAF gắn được ở: CloudFront, ALB, API Gateway (REGIONAL), AppSync. Không bao giờ gắn trực tiếp vào EC2.</p>"},{"id":40,"topic":"Design Secure Architectures – AWS Transfer Family + EFS","supplement":false,"stem":"A biomedical research firm operates a file exchange system for external research partners to upload and download experimental data. Currently, the system runs on two Amazon EC2 Linux instances, each configured with Elastic IP addresses to allow access from trusted IPs. File transfers use the SFTP protocol, and Linux user accounts are manually provisioned to enforce file-level access control. Data is stored on a shared file system mounted to both EC2 instances. The firm wants to modernize the solution to a fully managed, serverless model with high IOPS, fine-grained user permission control, and strict IP-based access restrictions. They also want to reduce operational overhead without sacrificing performance or security.<br>Which solution best meets these requirements?","options":[{"html":"Use Amazon FSx for Lustre as the backend storage. Create an AWS Transfer Family SFTP service with a public endpoint. Configure IAM policies to manage user access and attach a security group that restricts access to trusted IP addresses","correct":false},{"html":"Use Amazon S3 with server-side encryption enabled. Create an AWS Transfer Family SFTP endpoint with a VPC endpoint in a private subnet. Restrict access to known IPs using security group rules. Manage user-level permissions using IAM role-based access mappings","correct":false},{"html":"Use Amazon EFS with encryption enabled. Create an AWS Transfer Family SFTP endpoint in a VPC with Elastic IP addresses. Restrict access using a security group that allows traffic only from known IPs. Manage user access using POSIX identity mappings and IAM policies","correct":true},{"html":"Use AWS Storage Gateway in file gateway mode to expose an NFS file share. Deploy AWS Transfer Family with a public endpoint and map user identities using IAM roles. Configure IP allow lists using AWS WAF","correct":false}],"multi":1,"analysis":"<p>SFTP serverless, hiệu năng IOPS cao, phân quyền theo user kiểu POSIX, giới hạn theo IP</p>","answer":"<p>EFS là 1 trong 2 backend được Transfer Family hỗ trợ chính thức và đáp ứng IOPS cao; POSIX mapping thay thế Linux user truyền thống.</p>","explain":"<ul><li><b>A. ✗</b> AWS Transfer Family chỉ hỗ trợ S3 và EFS làm backend — FSx for Lustre không được hỗ trợ trực tiếp.</li><li><b>B. ✗</b> S3 không có hiệu năng IOPS cao kiểu file system cho workload đọc/ghi tương tác thường xuyên.</li><li><b>C. ✓</b> EFS (IOPS cao, POSIX) + Transfer Family SFTP với EIP + POSIX identity mapping + IAM: đáp ứng đủ mọi yêu cầu.</li><li><b>D. ✗</b> Storage Gateway không tích hợp trực tiếp với Transfer Family; WAF không áp dụng cho giao thức SFTP (không phải HTTP).</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> FSx for Lustre nghe mạnh về hiệu năng nhưng KHÔNG phải backend được Transfer Family hỗ trợ.</p>","tip":"<p>AWS Transfer Family chỉ có 2 backend: Amazon S3 hoặc Amazon EFS. Cần hiệu năng IOPS cao, POSIX permission → chọn EFS.</p>"},{"id":41,"topic":"Design High-Performing Architectures – ElastiCache session store","supplement":false,"stem":"A Customer relationship management (CRM) application is facing user experience issues with users reporting frequent sign-in requests from the application. The application is currently hosted on multiple Amazon EC2 instances behind an Application Load Balancer. The engineering team has identified the root cause as unhealthy servers causing session data to be lost. The team would like to implement a distributed in-memory cache-based session management solution.<br>As a solutions architect, which of the following solutions would you recommend?","options":[{"html":"Use Amazon DynamoDB for distributed in-memory cache based session management","correct":false},{"html":"Use Application Load Balancer sticky sessions","correct":false},{"html":"Use Amazon RDS for distributed in-memory cache based session management","correct":false},{"html":"Use Amazon Elasticache for distributed in-memory cache based session management","correct":true}],"multi":1,"analysis":"<p>Session store phân tán, không phụ thuộc vào 1 server cụ thể</p>","answer":"<p>ElastiCache lưu session tập trung ngoài EC2 instance, nên server nào unhealthy cũng không làm mất session.</p>","explain":"<ul><li><b>A. ✗</b> DynamoDB là NoSQL, không phải in-memory cache.</li><li><b>B. ✗</b> Sticky session vẫn mất toàn bộ session nếu server đó unhealthy.</li><li><b>C. ✗</b> RDS là relational DB, không phải cache trong bộ nhớ.</li><li><b>D. ✓</b> ElastiCache (Redis/Memcached) là cache phân tán trong bộ nhớ, chuẩn cho session store.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Sticky session nghe như giải quyết được vấn đề nhưng thực chất gắn chặt user với 1 server — chính là nguyên nhân mất session khi server đó hỏng.</p>","tip":"<p>Session không phụ thuộc instance cụ thể, cần nhanh → ElastiCache (Redis/Memcached), không phải sticky session hay DB truyền thống.</p>"},{"id":42,"topic":"Design Resilient Architectures – Auto Scaling capacity across AZs","supplement":false,"stem":"A health-care company manages its web application on Amazon EC2 instances running behind Auto Scaling group (ASG). The company provides ambulances for critical patients and needs the application to be reliable. The workload of the company can be managed on 2 Amazon EC2 instances and can peak up to 6 instances when traffic increases.<br>As a Solutions Architect, which of the following configurations would you select as the best fit for these requirements?","options":[{"html":"The Auto Scaling group should be configured with the minimum capacity set to 4, with 2 instances each in two different AWS Regions. The maximum capacity of the Auto Scaling group should be set to 6","correct":false},{"html":"The Auto Scaling group should be configured with the minimum capacity set to 2, with 1 instance each in two different Availability Zones. The maximum capacity of the Auto Scaling group should be set to 6","correct":false},{"html":"The Auto Scaling group should be configured with the minimum capacity set to 4, with 2 instances each in two different Availability Zones. The maximum capacity of the Auto Scaling group should be set to 6","correct":true},{"html":"The Auto Scaling group should be configured with the minimum capacity set to 2 and the maximum capacity set to 6 in a single Availability Zone","correct":false}],"multi":1,"analysis":"<p>Tính capacity tối thiểu để chịu được mất 1 AZ mà vẫn đủ công suất cần thiết</p>","answer":"<p>Cần tối thiểu 2 instance hoạt động bình thường; để chịu mất 1 trong 2 AZ, phải có 2 instance ở MỖI AZ → min=4.</p>","explain":"<ul><li><b>A. ✗</b> Auto Scaling Group không thể trải nhiều AWS Region, chỉ nhiều AZ trong 1 Region.</li><li><b>B. ✗</b> Min=2 (1 mỗi AZ) không đủ dự phòng — mất 1 AZ sẽ chỉ còn 1 instance, dưới mức cần (2) để chạy.</li><li><b>C. ✓</b> Min=4 (2 mỗi AZ): đủ dự phòng để khi mất 1 AZ vẫn còn 2 instance (mức cần) ở AZ còn lại.</li><li><b>D. ✗</b> 1 AZ duy nhất không có khả năng chịu lỗi AZ, vi phạm yêu cầu reliable cho ứng dụng y tế quan trọng.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Min=2 nghe đúng với yêu cầu '2 instance tối thiểu' nhưng không tính đến trường hợp mất nguyên 1 AZ.</p>","tip":"<p>ASG trải nhiều AZ trong CÙNG 1 Region (không multi-Region) — tính min capacity = (số instance cần tối thiểu) × (số AZ) để chịu mất 1 AZ.</p>"},{"id":43,"topic":"Design Resilient Architectures – Route 53 Failover Routing","supplement":false,"stem":"A company's cloud architect has set up a solution that uses Amazon Route 53 to configure the DNS records for the primary website with the domain pointing to the Application Load Balancer (ALB). The company wants a solution where users will be directed to a static error page, configured as a backup, in case of unavailability of the primary website.<br>Which configuration will meet the company's requirements, while keeping the changes to a bare minimum?","options":[{"html":"Set up Amazon Route 53 active-passive type of failover routing policy. If Amazon Route 53 health check determines the Application Load Balancer endpoint as unhealthy, the traffic will be diverted to a static error page, hosted on Amazon S3 bucket","correct":true},{"html":"Use Amazon Route 53 Weighted routing to give minimum weight to Amazon S3 bucket that holds the error page to be displayed. In case of primary failure, the requests get routed to the error page","correct":false},{"html":"Set up Amazon Route 53 active-active type of failover routing policy. If Amazon Route 53 health check determines the Application Load Balancer endpoint as unhealthy, the traffic will be diverted to a static error page, hosted on Amazon S3 bucket","correct":false},{"html":"Use Amazon Route 53 Latency-based routing. Create a latency record to point to the Amazon S3 bucket that holds the error page to be displayed","correct":false}],"multi":1,"analysis":"<p>Chuyển hướng dự phòng (backup) khi endpoint chính lỗi, thay đổi tối thiểu</p>","answer":"<p>Failover routing policy (active-passive) đúng chuẩn cho tình huống có 1 primary + 1 backup resource.</p>","explain":"<ul><li><b>A. ✓</b> Active-passive failover routing: health check lỗi ALB → tự chuyển traffic sang static page trên S3.</li><li><b>B. ✗</b> Weighted routing định tuyến theo tỉ lệ cố định, không phải cơ chế failover theo health check.</li><li><b>C. ✗</b> Không tồn tại loại 'active-active failover routing policy' trong Route 53 — đây là tên gọi sai.</li><li><b>D. ✗</b> Latency-based routing chọn theo độ trễ thấp nhất, không phải cơ chế dự phòng khi lỗi.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 'Active-active failover routing policy' là cái tên bẫy — Route 53 không có loại routing policy này.</p>","tip":"<p>Có backup đứng chờ, chỉ dùng khi primary lỗi → Failover routing (active-passive). Nhiều resource cùng active → dùng routing policy khác (weighted/latency/geo) kết hợp health check = active-active.</p>"},{"id":44,"topic":"Design Resilient Architectures – ASG vs ALB health check types","supplement":false,"stem":"A streaming solutions company is building a video streaming product by using an Application Load Balancer (ALB) that routes the requests to the underlying Amazon EC2 instances. The engineering team has noticed a peculiar pattern. The Application Load Balancer removes an instance from its pool of healthy instances whenever it is detected as unhealthy but the Auto Scaling group fails to kick-in and provision the replacement instance.<br>What could explain this anomaly?","options":[{"html":"Both the Auto Scaling group and Application Load Balancer are using ALB based health check","correct":false},{"html":"The Auto Scaling group is using ALB based health check and the Application Load Balancer is using Amazon EC2 based health check","correct":false},{"html":"The Auto Scaling group is using Amazon EC2 based health check and the Application Load Balancer is using ALB based health check","correct":true},{"html":"Both the Auto Scaling group and Application Load Balancer are using Amazon EC2 based health check","correct":false}],"multi":1,"analysis":"<p>Hiểu đúng 2 loại health check khác nhau của ASG và ALB</p>","answer":"<p>EC2 health check chỉ kiểm tra trạng thái instance (running/stopped); ALB health check kiểm tra khả năng phản hồi request của ứng dụng — 2 tiêu chí khác nhau có thể cho kết quả trái ngược.</p>","explain":"<ul><li><b>A. ✗</b> Nếu cả 2 cùng dùng ALB health check thì sẽ đồng bộ, không xảy ra hiện tượng lệch như đề mô tả.</li><li><b>B. ✗</b> ALB không thể dùng kiểu 'EC2 based health check' — mô tả ngược vai trò, không đúng khả năng cấu hình.</li><li><b>C. ✓</b> ASG dùng EC2 health check (chỉ biết instance có 'running' hay không) trong khi ALB dùng health check riêng (biết app có phản hồi hay không) → ASG tưởng khoẻ, ALB thấy lỗi.</li><li><b>D. ✗</b> ALB không hỗ trợ kiểu 'EC2-based health check' nên không thể cả hai cùng dùng kiểu này.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các phương án 'cả hai cùng dùng 1 loại' nghe hợp lý nhưng không giải thích được hiện tượng ALB gỡ instance còn ASG không thay thế.</p>","tip":"<p>Muốn ASG tự thay thế instance khi app lỗi (không chỉ instance chết) → cấu hình ASG dùng ELB health check type, không chỉ EC2 health check mặc định.</p>"},{"id":45,"topic":"Design High-Performing Architectures – AWS DMS Serverless","supplement":false,"stem":"An enterprise runs a critical Oracle database workload in its on-premises environment. The company now plans to replicate both existing records and continuous transactional changes to a managed Oracle environment in AWS. The target database will run on Amazon RDS for Oracle. Data transfer volume is expected to fluctuate throughout the day, and the team wants the solution to provision compute resources automatically based on actual workload requirements.<br>Which solution will meet these requirements?","options":[{"html":"Configure an AWS DMS Serverless replication task to synchronize historical and ongoing changes between the on-premises Oracle database and Amazon RDS for Oracle","correct":true},{"html":"Use AWS Glue to extract data from the on-premises Oracle database and write the output to Amazon RDS for Oracle. Configure Glue to run on demand when changes are detected","correct":false},{"html":"Use AWS Lambda to capture change data from the on-premises Oracle database. Trigger Lambda functions to write the updates to Amazon RDS for Oracle in real time.","correct":false},{"html":"Deploy the AWS DMS replication instance on Amazon EC2. Configure the instance with custom scripts that monitor CPU usage and resize the instance using EC2 Auto Scaling policies.","correct":false}],"multi":1,"analysis":"<p>Replicate + CDC liên tục với compute tự scale theo tải, ít vận hành nhất</p>","answer":"<p>DMS Serverless được thiết kế đúng cho bài toán 'tải thay đổi liên tục + cần tự scale + CDC liên tục' mà không cần đoán capacity trước.</p>","explain":"<ul><li><b>A. ✓</b> AWS Glue là ETL dạng batch, không thiết kế cho CDC liên tục từ database giao dịch.</li><li><b>B. ✗</b> Lambda không phù hợp xử lý CDC khối lượng lớn, có trạng thái, liên tục từ Oracle.</li><li><b>C. ✗</b> DMS Serverless tự động scale compute theo tải thực tế, hỗ trợ CDC liên tục, fully managed.</li><li><b>D. ✗</b> Tự dựng Auto Scaling cho DMS trên EC2 bằng script theo dõi CPU: phức tạp, không tích hợp sẵn, rủi ro vận hành.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Tự dựng Auto Scaling cho EC2 chạy DMS nghe như 'đã serverless hoá' nhưng thực chất là tự chế, không có tích hợp native.</p>","tip":"<p>Replicate DB liên tục (CDC), tải không ổn định, muốn auto-scale compute, ít vận hành → AWS DMS Serverless.</p>"},{"id":46,"topic":"Design Secure Architectures – S3 Glacier Vault Lock","supplement":false,"stem":"A silicon valley based healthcare startup uses AWS Cloud for its IT infrastructure. The startup stores patient health records on Amazon Simple Storage Service (Amazon S3). The engineering team needs to implement an archival solution based on Amazon S3 Glacier to enforce regulatory and compliance controls on data access.<br>As a solutions architect, which of the following solutions would you recommend?","options":[{"html":"Use Amazon S3 Glacier to store the sensitive archived data and then use an Amazon S3 lifecycle policy to enforce compliance controls","correct":false},{"html":"Use Amazon S3 Glacier vault to store the sensitive archived data and then use an Amazon S3 Access Control List to enforce compliance controls","correct":false},{"html":"Use Amazon S3 Glacier to store the sensitive archived data and then use an Amazon S3 Access Control List to enforce compliance controls","correct":false},{"html":"Use Amazon S3 Glacier vault to store the sensitive archived data and then use a vault lock policy to enforce compliance controls","correct":true}],"multi":1,"analysis":"<p>Enforce compliance WORM cho dữ liệu lưu trữ dài hạn</p>","answer":"<p>Vault Lock Policy là cơ chế duy nhất trong S3 Glacier cho phép khoá cứng chính sách retention, không ai sửa được sau khi lock.</p>","explain":"<ul><li><b>A. ✗</b> Lifecycle policy chỉ điều khiển chuyển storage class/xoá, không enforce compliance control.</li><li><b>B. ✗</b> Glacier vault + ACL: ACL chỉ quản lý quyền truy cập cơ bản, không phải cơ chế compliance (WORM).</li><li><b>C. ✗</b> Glacier (không vault) + ACL cũng không đủ sức enforce compliance — tương tự vẫn sai mục đích.</li><li><b>D. ✓</b> Vault Lock Policy cho phép khoá chính sách WORM, không thể sửa đổi sau khi lock — đúng chuẩn compliance.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> ACL/Lifecycle Policy nghe như công cụ kiểm soát truy cập/dữ liệu nhưng không có khả năng 'khoá' compliance như Vault Lock.</p>","tip":"<p>S3 Glacier Vault Lock = WORM enforcement, khoá chính sách vĩnh viễn — khác với S3 Object Lock (dùng cho bucket S3 thông thường, không phải Glacier vault).</p>"},{"id":47,"topic":"Design High-Performing Architectures – Transcribe + Athena","supplement":false,"stem":"A company hires experienced specialists to analyze the customer service calls attended by its call center representatives. Now, the company wants to move to AWS Cloud and is looking at an automated solution to analyze customer service calls for sentiment analysis via ad-hoc SQL queries.<br>As a Solutions Architect, which of the following solutions would you recommend?","options":[{"html":"Use Amazon Kinesis Data Streams to read the audio files and Amazon Alexa to convert them into text. Amazon Kinesis Data Analytics can be used to analyze these files and Amazon Quicksight can be used to visualize and display the output","correct":false},{"html":"Use Amazon Transcribe to convert audio files to text and Amazon Athena to perform SQL based analysis to understand the underlying customer sentiments","correct":true},{"html":"Use Amazon Kinesis Data Streams to read the audio files and machine learning (ML) algorithms to convert the audio files into text and run customer sentiment analysis","correct":false},{"html":"Use Amazon Transcribe to convert audio files to text and Amazon Quicksight to perform SQL based analysis on these text files to understand the underlying patterns. Visualize and display them onto user Dashboards for reporting purposes","correct":false}],"multi":1,"analysis":"<p>Chuyển audio→text rồi phân tích bằng SQL ad-hoc, không cần hạ tầng riêng</p>","answer":"<p>Transcribe là ASR chuyên dụng; Athena cho phép chạy SQL trực tiếp trên dữ liệu trong S3 mà không cần hạ tầng/ETL riêng.</p>","explain":"<ul><li><b>A. ✗</b> Kinesis Data Streams không đọc được audio file trực tiếp; Alexa không phải dịch vụ ASR dùng được trực tiếp.</li><li><b>B. ✓</b> Transcribe chuyển audio→text; Athena cho phép truy vấn SQL ad-hoc trực tiếp trên dữ liệu text đó.</li><li><b>C. ✗</b> Kinesis không tự chuyển audio sang text bằng 'thuật toán ML' chung chung — cần dịch vụ ASR chuyên biệt (Transcribe).</li><li><b>D. ✗</b> QuickSight là công cụ visualize, không phải công cụ truy vấn SQL như Athena.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> QuickSight dễ bị nhầm với Athena vì cả hai đều 'phân tích dữ liệu' nhưng QuickSight dùng để visualize, không chạy SQL ad-hoc như Athena.</p>","tip":"<p>Audio → text: Transcribe. Truy vấn SQL ad-hoc trên S3: Athena. Trực quan hoá/dashboard: QuickSight.</p>"},{"id":48,"topic":"Design Resilient Architectures – Auto Scaling + Spot + ALB","supplement":false,"stem":"A healthcare startup runs a lightweight reporting application on a single Amazon EC2 On-Demand instance. The application is designed to be stateless, fault-tolerant, and optimized for fast rendering of analytics dashboards. During major health events or news cycles, the team observes latency issues and occasional 5xx errors due to traffic spikes. To meet growing demand without over-provisioning resources during off-peak hours, the company wants to implement a cost-effective, scalable solution that ensures consistent performance even under unpredictable load.<br>Which approach best meets the requirements while minimizing costs?","options":[{"html":"Build an Amazon Machine Image (AMI) from the existing EC2 instance and configure a launch template. Create an Auto Scaling group using the launch template with Spot Instance pricing enabled. Attach an Application Load Balancer to distribute traffic across dynamically launched instances","correct":true},{"html":"Clone the EC2 instance using an AMI and launch a second On-Demand instance. Register both instances with an Application Load Balancer to distribute incoming traffic evenly","correct":false},{"html":"Configure an Amazon EventBridge rule to monitor system-level metrics from the EC2 instance. Trigger a Lambda function to re-deploy the application in a different Availability Zone when CPU utilization exceeds 70%","correct":false},{"html":"Containerize the application using Amazon ECS with Fargate launch type. Deploy the container to a single Fargate task and set a CloudWatch alarm to increase memory and CPU allocation dynamically based on load","correct":false}],"multi":1,"analysis":"<p>Scale tự động + chi phí thấp nhất cho ứng dụng stateless, fault-tolerant</p>","answer":"<p>Kết hợp ASG (tự scale theo tải) với Spot Instances (giá rẻ) và ALB (phân phối traffic) tối ưu cả chi phí lẫn khả năng co giãn.</p>","explain":"<ul><li><b>A. ✓</b> AMI + launch template + ASG dùng Spot + ALB: scale tự động, chi phí rẻ nhờ Spot, phù hợp app stateless.</li><li><b>B. ✗</b> Thêm 1 On-Demand instance cố định chạy liên tục dù ít tải — không co giãn, tốn chi phí không cần thiết.</li><li><b>C. ✗</b> Redeploy sang AZ khác khi CPU cao không giải quyết được vấn đề quá tải/scale, vẫn kiến trúc 1 instance.</li><li><b>D. ✗</b> 1 Fargate task duy nhất vẫn là điểm nghẽn (bottleneck); ECS nên scale theo số task, không phải tăng CPU/memory của 1 task.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Container hoá (ECS/Fargate) nghe hiện đại hơn nhưng nếu chỉ chạy 1 task duy nhất thì vẫn không giải quyết được vấn đề scale.</p>","tip":"<p>App stateless, chịu gián đoạn, cần rẻ + co giãn → ASG + Spot + ALB. ECS/Fargate chỉ tốt khi thực sự scale theo SỐ LƯỢNG task.</p>"},{"id":49,"topic":"Design Cost-Optimized Architectures – EC2 Instance Store","supplement":false,"stem":"Computer vision researchers at a university are trying to optimize the I/O bound processes for a proprietary algorithm running on Amazon EC2 instances. The ideal storage would facilitate high-performance IOPS when doing file processing in a temporary storage space before uploading the results back into Amazon S3.<br>As a solutions architect, which of the following AWS storage options would you recommend as the MOST performant as well as cost-optimal?","options":[{"html":"Use Amazon EC2 instances with Amazon EBS General Purpose SSD (gp2) as the storage option","correct":false},{"html":"Use Amazon EC2 instances with Amazon EBS Throughput Optimized HDD (st1) as the storage option","correct":false},{"html":"Use Amazon EC2 instances with Instance Store as the storage option","correct":true},{"html":"Use Amazon EC2 instances with Amazon EBS Provisioned IOPS SSD (io1) as the storage option","correct":false}],"multi":1,"analysis":"<p>Lưu trữ tạm thời, cần hiệu năng IOPS cao nhất, tối ưu chi phí</p>","answer":"<p>Instance Store nằm vật lý trên host, cho IOPS rất cao và đã bao gồm trong giá EC2 — không phát sinh phí lưu trữ riêng.</p>","explain":"<ul><li><b>A. ✗</b> gp2 là EBS (persistent), có chi phí thêm ngoài instance, không phải lựa chọn rẻ nhất cho dữ liệu tạm.</li><li><b>B. ✗</b> st1 tối ưu throughput tuần tự, không phải cho IOPS ngẫu nhiên cao, vẫn tốn thêm phí EBS.</li><li><b>C. ✓</b> Instance Store: hiệu năng IOPS cao (NVMe/SSD vật lý), đã tính trong giá instance, không tốn thêm.</li><li><b>D. ✗</b> io1 cho IOPS cao nhưng là EBS — tốn thêm chi phí ngoài instance, không phải rẻ nhất.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Mọi loại EBS (gp2/io1/st1) đều là lựa chọn 'hợp lý' về hiệu năng nhưng luôn tốn thêm phí ngoài instance — vi phạm yêu cầu 'cost-optimal nhất'.</p>","tip":"<p>Cần IOPS rất cao, dữ liệu CHỈ tạm thời (mất khi stop/terminate không sao) → Instance Store, rẻ hơn mọi loại EBS vì đã gộp vào giá instance.</p>"},{"id":50,"topic":"Design Cost-Optimized Architectures – S3 Intelligent-Tiering (refactor from EFS)","supplement":false,"stem":"A digital design company has migrated its project archiving platform to AWS. The application runs on Amazon EC2 Linux instances in an Auto Scaling group that spans multiple Availability Zones. Designers upload and retrieve high-resolution image files from a shared file system, which is currently configured to use Amazon EFS Standard-IA. Metadata for these files is stored and indexed in an Amazon RDS for PostgreSQL database. The company's cloud engineering team has been asked to optimize storage costs for the image archive without compromising reliability. They are open to refactoring the application to use managed AWS services when necessary.<br>Which solution offers the most cost-effective architecture?","options":[{"html":"Replace the EFS file system with Amazon FSx for NetApp ONTAP. Use volume tiering to move cold data to lower-cost capacity pool storage. Update the application to use the ONTAP mount path","correct":false},{"html":"Create an Amazon S3 bucket with Intelligent-Tiering enabled. Update the application to store and retrieve project files using the Amazon S3 API","correct":true},{"html":"Replace the EFS file system with Amazon FSx for Lustre. Mount the file system to EC2 instances and store project files there to reduce access latency and cost","correct":false},{"html":"Use AWS Backup to export all EFS files daily to an Amazon S3 bucket. Retain the EFS file system in Standard-IA class for occasional real-time access and route all archival queries to the S3 export","correct":false}],"multi":1,"analysis":"<p>Tối ưu chi phí lưu trữ cho dữ liệu truy cập không dự đoán được, chấp nhận refactor sang dịch vụ khác</p>","answer":"<p>S3 Intelligent-Tiering tự động hoá việc chuyển tầng chi phí mà không cần theo dõi thủ công, phù hợp hơn EFS Standard-IA cho dữ liệu dạng archive-like.</p>","explain":"<ul><li><b>A. ✗</b> FSx for NetApp ONTAP vẫn tốn kém, thêm phức tạp vận hành (snapshot, quota) không cần thiết cho use case này.</li><li><b>B. ✓</b> S3 Intelligent-Tiering tự động chuyển tầng truy cập theo pattern thực tế, không cần giám sát thủ công, rẻ hơn EFS-IA.</li><li><b>C. ✗</b> FSx for Lustre dành cho HPC, không tối ưu chi phí cho lưu trữ ảnh/metadata thông thường.</li><li><b>D. ✗</b> Vừa trả phí EFS vừa trả thêm phí S3 + backup — tăng chi phí tổng thay vì giảm.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Giữ nguyên EFS rồi 'xuất thêm' ra S3 nghe như giải pháp an toàn nhưng lại làm tăng chi phí do lưu trùng 2 nơi.</p>","tip":"<p>Dữ liệu pattern truy cập không đoán trước, có thể refactor ứng dụng dùng API khác → S3 Intelligent-Tiering thường rẻ hơn EFS cho cùng mục đích lưu trữ archive-like.</p>"},{"id":51,"topic":"Design Resilient Architectures – SQS Dead-Letter Queue","supplement":false,"stem":"An e-commerce company uses Amazon Simple Queue Service (Amazon SQS) queues to decouple their application architecture. The engineering team has observed message processing failures for some customer orders.<br>As a solutions architect, which of the following solutions would you recommend for handling such message failures?","options":[{"html":"Use long polling to handle message processing failures","correct":false},{"html":"Use short polling to handle message processing failures","correct":false},{"html":"Use a temporary queue to handle message processing failures","correct":false},{"html":"Use a dead-letter queue to handle message processing failures","correct":true}],"multi":1,"analysis":"<p>Cô lập và debug các message xử lý thất bại lặp lại</p>","answer":"<p>DLQ là đích đến cho message vượt quá maxReceiveCount, giúp tách biệt và phân tích nguyên nhân lỗi mà không chặn queue chính.</p>","explain":"<ul><li><b>A. ✗</b> Long polling giảm số lần gọi API rỗng, không liên quan tới xử lý message lỗi.</li><li><b>B. ✗</b> Short polling là chế độ mặc định, không giải quyết message xử lý thất bại.</li><li><b>C. ✗</b> Temporary queue dùng cho pattern request-response, không phải để cô lập message lỗi.</li><li><b>D. ✓</b> Dead-letter queue cô lập các message xử lý thất bại nhiều lần để debug riêng.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Long/short polling nghe liên quan đến 'xử lý message' nhưng thực chất chỉ ảnh hưởng tới cách gọi API nhận message, không liên quan tới lỗi xử lý.</p>","tip":"<p>Message xử lý thất bại lặp lại nhiều lần → Dead-letter queue (DLQ), cấu hình qua maxReceiveCount của source queue.</p>"},{"id":52,"topic":"Design Resilient Architectures – Aurora Replicas (read scaling + HA)","supplement":false,"stem":"The engineering team at an e-commerce company uses an AWS Lambda function to write the order data into a single DB instance Amazon Aurora cluster. The team has noticed that many order-writes to its Aurora cluster are getting missed during peak load times. The diagnostics data has revealed that the database is experiencing high CPU and memory consumption during traffic spikes. The team also wants to enhance the availability of the Aurora DB.<br>Which of the following steps would you combine to address the given scenario? (Select two)","options":[{"html":"Use Amazon EC2 instances behind an Application Load Balancer to write the order data into Amazon Aurora cluster","correct":false},{"html":"Create a standby Aurora instance in another Availability Zone to improve the availability as the standby can serve as a failover target","correct":false},{"html":"Handle all read operations for your application by connecting to the reader endpoint of the Amazon Aurora cluster so that Aurora can spread the load for read-only connections across the Aurora replica","correct":true},{"html":"Increase the concurrency of the AWS Lambda function so that the order-writes do not get missed during traffic spikes","correct":false},{"html":"Create a replica Aurora instance in another Availability Zone to improve the availability as the replica can serve as a failover target","correct":true}],"multi":2,"analysis":"<p>Giảm tải writer bị nghẽn (CPU/memory cao) + tăng khả dụng cho Aurora</p>","answer":"<p>Chuyển toàn bộ đọc sang reader endpoint giảm tải cho writer, đồng thời replica khác AZ đóng vai trò failover target tăng HA.</p>","explain":"<ul><li><b>A. ✗</b> Dùng thêm EC2+ALB để ghi dữ liệu không giải quyết bottleneck ở tầng database.</li><li><b>B. ✗</b> Aurora không có khái niệm 'standby instance' — chỉ có Replica được promote khi cần.</li><li><b>C. ✓</b> Reader endpoint phân tán tải đọc qua các Aurora Replica, giảm tải cho writer instance.</li><li><b>D. ✗</b> Tăng concurrency Lambda không giải quyết được bottleneck ở phía database (CPU/memory cao).</li><li><b>E. ✓</b> Replica ở AZ khác vừa giúp scale đọc vừa là candidate để tự động promote khi writer lỗi, tăng khả dụng.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 'Standby instance' là cách gọi sai thuật ngữ của Aurora — Aurora chỉ có Replica, không có standby riêng biệt như RDS Multi-AZ instance.</p>","tip":"<p>Aurora: không có 'standby' riêng — Replica vừa phục vụ đọc (qua reader endpoint) vừa là failover target khi cần.</p>"},{"id":53,"topic":"Design Resilient Architectures – RDS Multi-AZ Failover","supplement":false,"stem":"A company wants to ensure high availability for its Amazon RDS database. The development team wants to opt for Multi-AZ deployment and they would like to understand what happens when the primary instance of the Multi-AZ configuration goes down.<br>As a Solutions Architect, which of the following will you identify as the outcome of the scenario?","options":[{"html":"The application will be down until the primary database has recovered itself","correct":false},{"html":"An email will be sent to the System Administrator asking for manual intervention","correct":false},{"html":"The URL to access the database will change to the standby database","correct":false},{"html":"The CNAME record will be updated to point to the standby database","correct":true}],"multi":1,"analysis":"<p>Hiểu cơ chế failover 'vô hình' với ứng dụng của RDS Multi-AZ</p>","answer":"<p>RDS chỉ cập nhật DNS CNAME trỏ sang standby đã được promote, giữ nguyên endpoint URL cho ứng dụng.</p>","explain":"<ul><li><b>A. ✗</b> RDS Multi-AZ failover tự động, ứng dụng chỉ gián đoạn ngắn, không phải downtime kéo dài chờ hồi phục thủ công.</li><li><b>B. ✗</b> Failover hoàn toàn tự động, không cần admin can thiệp qua email.</li><li><b>C. ✗</b> URL (CNAME) giữ nguyên, chỉ bản ghi DNS trỏ nội bộ thay đổi.</li><li><b>D. ✓</b> RDS cập nhật CNAME để trỏ sang standby, ứng dụng không cần đổi endpoint.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Dễ nhầm 'URL thay đổi' với 'CNAME trỏ sang nơi khác' — URL (hostname) giữ nguyên, chỉ bản ghi DNS phía sau đổi.</p>","tip":"<p>RDS Multi-AZ failover: tự động, vài chục giây tới vài phút gián đoạn, endpoint/URL không đổi — chỉ CNAME trỏ lại standby.</p>"},{"id":54,"topic":"Design Cost-Optimized Architectures – AWS Global Accelerator for API latency","supplement":false,"stem":"A multinational logistics company operates its shipment tracking platform from Amazon EC2 instances deployed in the AWS us-west-2 Region. The platform exposes a set of APIs over HTTPS, which are used by logistics partners and customers around the world to retrieve real-time tracking data. The company has observed that users from Europe and Asia experience latency issues and inconsistent API response times when accessing the service. As a cloud architect, you have been tasked to propose the most cost-effective solution to improve performance for these international users without migrating the application.<br>Which solution should you recommend?","options":[{"html":"Use Amazon Route 53 latency-based routing to direct user requests to a copy of the EC2 API deployed in each major geographic Region","correct":false},{"html":"Deploy Amazon API Gateway in multiple AWS Regions and synchronize the API definitions. Use AWS Lambda as a proxy to forward requests to the EC2-hosted API in us-west-2","correct":false},{"html":"Configure AWS Global Accelerator in front of the existing HTTPS API, create one endpoint group in us-west-2 for the current application endpoint, and use the accelerator’s global edge network to improve performance for users connecting from Europe and Asia","correct":true},{"html":"Deploy an Amazon CloudFront distribution in front of the API endpoint and apply the CachingOptimized managed policy to enhance caching behavior and improve content delivery efficiency","correct":false}],"multi":1,"analysis":"<p>Cải thiện độ trễ toàn cầu cho API động mà KHÔNG nhân bản hạ tầng, chi phí thấp nhất</p>","answer":"<p>Global Accelerator đưa traffic vào mạng AWS sớm nhất tại edge gần người dùng mà không cần sao chép API sang Region khác; endpoint group là tài nguyên theo Region nên chỉ cần 1 cái trỏ về us-west-2.</p>","explain":"<ul><li><b>A. ✗</b> Nhân bản API ở nhiều Region tăng chi phí compute/data transfer/vận hành — không phải cost-effective nhất.</li><li><b>B. ✗</b> Dùng Lambda proxy nhiều Region về lại us-west-2 vẫn phải qua 1 chặng nữa, tăng độ trễ và chi phí mà không tối ưu như Global Accelerator.</li><li><b>C. ✓</b> Global Accelerator đặt trước endpoint hiện có (1 endpoint group ở us-west-2), tận dụng mạng backbone AWS để giảm biến động độ trễ.</li><li><b>D. ✗</b> CloudFront tối ưu cho nội dung cache được; API tracking real-time trả dữ liệu động, phần lớn sẽ cache miss, không cải thiện (có khi tệ hơn).</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> CloudFront nghe như giải pháp 'chuẩn' cho vấn đề toàn cầu nhưng chỉ hợp với nội dung cache được, không hợp API động/real-time.</p>","tip":"<p>API động, thời gian thực, không cache được, không muốn nhân bản hạ tầng đa Region → AWS Global Accelerator. Nội dung tĩnh/cache được → CloudFront.</p>"},{"id":55,"topic":"Design Resilient Architectures – EBS Snapshot Recycle Bin","supplement":false,"stem":"A company hosts a Microsoft SQL Server database on Amazon EC2 instances with attached Amazon EBS volumes. The operations team takes daily snapshots of these EBS volumes as backups. However, a recent incident occurred in which an automated script designed to clean up expired snapshots accidentally deleted all available snapshots, leading to potential data loss. The company wants to improve the backup strategy to avoid permanent data loss while still ensuring that old snapshots are eventually removed to optimize cost. A solutions architect needs to implement a mechanism that prevents immediate and irreversible deletion of snapshots.<br>Which solution will best meet these requirements with the least development effort?","options":[{"html":"Set up a 7-day EBS snapshot retention rule in Recycle Bin and apply the rule for all snapshots","correct":true},{"html":"Set up the IAM policy of the user to deny EBS snapshot deletion","correct":false},{"html":"Enable AWS Backup Vault Lock on the backup vault and store EBS snapshots in that vault to enforce deletion protection","correct":false},{"html":"Implement a Lambda-based backup automation workflow that archives snapshot metadata in DynamoDB and stores backups in Amazon S3 Glacier Deep Archive for long-term recovery","correct":false}],"multi":1,"analysis":"<p>Chống xoá nhầm (tạm thời) mà vẫn giữ khả năng dọn dẹp tự động, ít công sức nhất</p>","answer":"<p>Recycle Bin đóng vai trò như 'thùng rác' tạm giữ snapshot bị xoá trong khoảng thời gian cấu hình trước khi xoá vĩnh viễn, không cần code thêm.</p>","explain":"<ul><li><b>A. ✓</b> Recycle Bin với rule retention 7 ngày: snapshot bị xoá nhầm vẫn khôi phục được trong 7 ngày, vẫn tự dọn sau đó.</li><li><b>B. ✗</b> IAM policy deny hoàn toàn việc xoá sẽ khiến snapshot cũ không bao giờ dọn được, gây phình chi phí.</li><li><b>C. ✗</b> Vault Lock chỉ áp dụng cho snapshot được tạo QUA AWS Backup, không áp dụng cho snapshot tạo thủ công/script như hiện tại.</li><li><b>D. ✗</b> Xây pipeline Lambda + DynamoDB + Glacier Deep Archive: tốn nhiều công sức phát triển, không trực tiếp ngăn xoá nhầm.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> AWS Backup Vault Lock nghe rất chắc chắn về compliance nhưng chỉ hoạt động với snapshot được AWS Backup quản lý, không áp dụng cho quy trình thủ công hiện tại.</p>","tip":"<p>Chống xoá nhầm tạm thời, ít công sức nhất cho EBS snapshot → Recycle Bin với retention rule. Cần enforce WORM nghiêm ngặt, không ai sửa được → AWS Backup Vault Lock (nhưng phải quản lý qua AWS Backup).</p>"},{"id":56,"topic":"Design Cost-Optimized Architectures – S3 File Gateway","supplement":false,"stem":"A digital content production company has transitioned all of its media assets to Amazon S3 in an effort to reduce storage costs. However, the rendering engine used in production continues to run in an on-premises data center and requires frequent and low-latency access to large media files. The company wants to implement a storage solution that maintains application performance while keeping costs low.<br>Which approach should the company choose to meet these requirements in the most cost-effective way?","options":[{"html":"Set up a dedicated on-premises storage array that periodically fetches data from Amazon S3 using a custom-built application. Mount this storage volume on the rendering servers as their primary working directory","correct":false},{"html":"Use Mountpoint for Amazon S3 on the on-premises rendering servers to facilitate low-latency access to the S3 bucket","correct":false},{"html":"Deploy an Amazon FSx for Lustre file system and sync media data from Amazon S3 into it using DataSync. Mount the FSx file system on the on-premises render servers using a VPN tunnel","correct":false},{"html":"Set up an Amazon S3 File Gateway to provide storage for the on-premises application","correct":true}],"multi":1,"analysis":"<p>Truy cập độ trễ thấp từ on-prem vào dữ liệu đã ở S3, chi phí thấp nhất</p>","answer":"<p>File Gateway cache dữ liệu truy cập thường xuyên cục bộ ở on-prem trong khi dữ liệu gốc vẫn nằm (rẻ) trên S3.</p>","explain":"<ul><li><b>A. ✗</b> Tự xây ứng dụng đồng bộ định kỳ: tốn công phát triển, độ trễ và tính nhất quán kém, không còn lợi ích chi phí của S3.</li><li><b>B. ✗</b> Mountpoint for S3 không phải POSIX đầy đủ, không tối ưu cho truy cập độ trễ thấp/cache cục bộ.</li><li><b>C. ✗</b> FSx for Lustre + DataSync + VPN: chi phí cao hơn, phức tạp hơn cho nhu cầu chỉ cần truy cập file tần suất cao từ on-prem.</li><li><b>D. ✓</b> S3 File Gateway: expose S3 qua NFS/SMB, cache cục bộ cho truy cập độ trễ thấp, phần lớn dữ liệu vẫn ở S3 nên rẻ.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> FSx for Lustre nghe 'performance cao' nhưng đắt và dư thừa so với nhu cầu chỉ cần cache truy cập on-prem, không phải HPC.</p>","tip":"<p>Ứng dụng on-prem cần truy cập độ trễ thấp vào dữ liệu đã ở S3, chi phí thấp → Storage Gateway File Gateway (cache local, expose NFS/SMB).</p>"},{"id":57,"topic":"Design Cost-Optimized Architectures – CloudWatch Alarm Actions (reboot)","supplement":false,"stem":"A medium-sized business has a taxi dispatch application deployed on an Amazon EC2 instance. Because of an unknown bug, the application causes the instance to freeze regularly. Then, the instance has to be manually restarted via the AWS management console.<br>Which of the following is the MOST cost-optimal and resource-efficient way to implement an automated solution until a permanent fix is delivered by the development team?","options":[{"html":"Use Amazon EventBridge events to trigger an AWS Lambda function to reboot the instance status every 5 minutes","correct":false},{"html":"Use Amazon EventBridge events to trigger an AWS Lambda function to check the instance status every 5 minutes. In the case of Instance Health Check failure, the AWS lambda function can use Amazon EC2 API to reboot the instance","correct":false},{"html":"Setup an Amazon CloudWatch alarm to monitor the health status of the instance. In case of an Instance Health Check failure, an EC2 Reboot CloudWatch Alarm Action can be used to reboot the instance","correct":true},{"html":"Setup an Amazon CloudWatch alarm to monitor the health status of the instance. In case of an Instance Health Check failure, Amazon CloudWatch Alarm can publish to an Amazon Simple Notification Service (Amazon SNS) event which can then trigger an AWS lambda function. The AWS lambda function can use Amazon EC2 API to reboot the instance","correct":false}],"multi":1,"analysis":"<p>Tự động khắc phục sự cố instance bằng tính năng có sẵn, ít tài nguyên nhất</p>","answer":"<p>Alarm Action 'Reboot' là tính năng dựng sẵn của CloudWatch dành riêng cho Instance Status Check Failed, không cần viết thêm Lambda.</p>","explain":"<ul><li><b>A. ✗</b> Reboot vô điều kiện mỗi 5 phút gây gián đoạn không cần thiết kể cả khi instance đang khoẻ.</li><li><b>B. ✗</b> Dùng EventBridge + Lambda để kiểm tra rồi gọi API reboot là lãng phí tài nguyên so với có sẵn tính năng alarm action.</li><li><b>C. ✓</b> CloudWatch Alarm Action 'Reboot' tích hợp sẵn, kích hoạt trực tiếp khi Instance Health Check thất bại — không cần Lambda.</li><li><b>D. ✗</b> Dùng SNS + Lambda để reboot qua API là vòng vèo không cần thiết khi có sẵn alarm action trực tiếp.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các phương án tự chế bằng Lambda/EventBridge/SNS nghe 'chủ động hơn' nhưng chỉ lặp lại việc CloudWatch Alarm Action đã làm sẵn, tốn tài nguyên hơn.</p>","tip":"<p>EC2 health check fail → Reboot alarm action. System/hardware check fail → Recover alarm action. Cả hai đều built-in, không cần Lambda trung gian.</p>"},{"id":58,"topic":"Design Secure Architectures – AWS WAF Geo Match + IP Set","supplement":false,"stem":"An online gaming company wants to block access to its application from specific countries; however, the company wants to allow its remote development team (from one of the blocked countries) to have access to the application. The application is deployed on Amazon EC2 instances running under an Application Load Balancer with AWS Web Application Firewall (AWS WAF).<br>As a solutions architect, which of the following solutions can be combined to address the given use-case? (Select two)","options":[{"html":"Use Application Load Balancer geo match statement listing the countries that you want to block","correct":false},{"html":"Use Application Load Balancer IP set statement that specifies the IP addresses that you want to allow through","correct":false},{"html":"Create a deny rule for the blocked countries in the network access control list (network ACL) associated with each of the Amazon EC2 instances","correct":false},{"html":"Use AWS WAF IP set statement that specifies the IP addresses that you want to allow through","correct":true},{"html":"Use AWS WAF geo match statement listing the countries that you want to block","correct":true}],"multi":2,"analysis":"<p>Kết hợp 2 rule WAF: chặn theo địa lý nhưng mở ngoại lệ theo IP</p>","answer":"<p>WAF cho phép kết hợp geo match (block) với IP set (allow) trong cùng Web ACL để vừa chặn quốc gia vừa mở ngoại lệ cho IP cụ thể.</p>","explain":"<ul><li><b>A. ✗</b> Application Load Balancer không có khả năng chặn theo địa lý (geo match).</li><li><b>B. ✗</b> Application Load Balancer không có khả năng lọc theo IP set kiểu WAF.</li><li><b>C. ✗</b> NACL không hỗ trợ điều kiện theo vị trí địa lý (geo).</li><li><b>D. ✓</b> WAF IP set statement cho phép liệt kê IP được allow, dùng để 'mở lại' cho team dev trong vùng bị chặn.</li><li><b>E. ✓</b> WAF geo match statement chặn traffic theo quốc gia được liệt kê.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> ALB/NACL nghe như cũng 'chặn được traffic' nhưng cả hai đều KHÔNG hỗ trợ điều kiện theo địa lý.</p>","tip":"<p>Chặn/permit theo quốc gia hoặc theo IP cụ thể ở layer 7 → luôn là tính năng của AWS WAF (geo match + IP set), không phải ALB hay NACL.</p>"},{"id":59,"topic":"Design Secure Architectures – IAM Access Analyzer","supplement":false,"stem":"A fintech company recently conducted a security audit and discovered that some IAM roles and Amazon S3 buckets might be unintentionally shared with external accounts or publicly accessible. The security team wants to identify these overly permissive resources and ensure that only intended principals (within their AWS Organization or specific AWS accounts) have access. They need a solution that can analyze IAM policies and resource policies to detect unintended access paths to AWS resources such as S3 buckets, IAM roles, KMS keys, and SNS topics.<br>Which solution should the team use to meet this requirement?","options":[{"html":"Use IAM Access Advisor to get detailed access analysis of S3 bucket policies and determine which principals outside the organization have access","correct":false},{"html":"Use AWS Identity and Access Management (IAM) Access Analyzer to evaluate resource-based and identity-based policies and identify resources shared outside the account or organization","correct":true},{"html":"Use AWS Config to track configuration changes and infer resource-sharing behavior by analyzing compliance rules","correct":false},{"html":"Use Amazon Inspector to detect over-permissive IAM policies and access paths across the environment","correct":false}],"multi":1,"analysis":"<p>Phát hiện quyền truy cập ngoài ý muốn (resource chia sẻ ra ngoài) dựa trên phân tích policy</p>","answer":"<p>Access Analyzer dùng automated reasoning để đánh giá resource-based và identity-based policy, xác định đường truy cập tới bên ngoài account/organization.</p>","explain":"<ul><li><b>A. ✗</b> Access Advisor chỉ cho biết dịch vụ/quyền nào ĐÃ dùng gần đây, không phân tích resource policy có bị chia sẻ ra ngoài hay không.</li><li><b>B. ✓</b> IAM Access Analyzer dùng automated reasoning để phát hiện resource được chia sẻ ra ngoài account/organization.</li><li><b>C. ✗</b> AWS Config theo dõi thay đổi cấu hình, không tự suy luận ngữ nghĩa policy để phát hiện chia sẻ ngoài ý muốn.</li><li><b>D. ✗</b> Amazon Inspector tập trung quét lỗ hổng phần mềm (CVE), không phân tích IAM policy.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Access Advisor và Access Analyzer tên rất giống nhau nhưng chức năng hoàn toàn khác — Advisor xem lịch sử dùng, Analyzer phân tích policy.</p>","tip":"<p>Phát hiện resource bị share ra ngoài ý muốn (S3, IAM role, KMS key, SNS...) → IAM Access Analyzer. Xem quyền nào lâu rồi không dùng để thu hẹp least privilege → IAM Access Advisor.</p>"},{"id":60,"topic":"Design High-Performing Architectures – S3 Event Notifications + Lambda","supplement":false,"stem":"A digital media startup allows users to submit images through its web portal. These images are uploaded directly into an Amazon S3 bucket. On average, around 200 images are uploaded daily. The company wants to automatically generate a smaller preview version (thumbnail) of each new image and store the resulting thumbnails in a separate Amazon S3 bucket. The team prefers a design that is low-cost, requires minimal infrastructure management, and automatically reacts to new uploads.<br>Which solution will meet these requirements MOST cost-effectively?","options":[{"html":"Set up a step-based processing workflow using AWS Glue jobs triggered on a regular interval. Use the jobs to scan the primary S3 bucket for new files and generate thumbnails for any that lack them. Write the thumbnails to a second S3 bucket","correct":false},{"html":"Enable Amazon S3 Access Analyzer and configure it to call an AWS Lambda function whenever a new image is added. Use the Lambda function to generate and store the thumbnail","correct":false},{"html":"Configure the S3 bucket to send an event notification to an AWS Lambda function each time a new image is uploaded. Use the Lambda function to process the image, create a thumbnail, and store the thumbnail in the second S3 bucket","correct":true},{"html":"Deploy a containerized application on AWS Fargate that polls the S3 bucket every minute to detect new uploads. Configure the container to generate thumbnails and save them in the second bucket","correct":false}],"multi":1,"analysis":"<p>Xử lý sự kiện (mỗi lần có file mới) theo mô hình event-driven, serverless, chi phí thấp nhất</p>","answer":"<p>S3 event notification + Lambda là mô hình event-driven chuẩn: chỉ chạy khi có upload thật, tự scale, không tốn phí lúc rảnh.</p>","explain":"<ul><li><b>A. ✗</b> AWS Glue dùng cho ETL dữ liệu có cấu trúc, không phù hợp xử lý ảnh theo thời gian thực; chạy theo lịch gây độ trễ và tốn kém không cần thiết.</li><li><b>B. ✗</b> 'S3 Access Analyzer' không tồn tại cho mục đích này — đây là dịch vụ audit bảo mật, không trigger được Lambda khi có object mới.</li><li><b>C. ✓</b> S3 event notification gọi Lambda ngay khi có upload mới, xử lý và lưu thumbnail — hoàn toàn serverless, trả tiền theo lượt dùng.</li><li><b>D. ✗</b> Polling S3 mỗi phút bằng Fargate tốn chi phí chạy liên tục dù không có ảnh mới, kém hiệu quả hơn event-driven.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 'S3 Access Analyzer' là cái tên đánh lừa nghe như có thể trigger Lambda nhưng thực chất không liên quan tới event xử lý ảnh.</p>","tip":"<p>Phản ứng ngay khi có object mới trong S3, chi phí thấp nhất, serverless → S3 Event Notification → Lambda, không cần job theo lịch hay polling.</p>"},{"id":61,"topic":"Design Secure Architectures – Site-to-Site VPN + SG/NACL","supplement":false,"stem":"A retail enterprise is expanding its hybrid IT infrastructure and plans to securely connect its on-premises corporate network to its AWS environment. The company wants to ensure that all data exchanged between on-premises systems and AWS is encrypted at both the network and session layers. Additionally, the solution must incorporate granular security controls that restrict unnecessary or unauthorized access between the cloud and on-premises environments. A solutions architect must recommend a scalable and secure approach that supports these goals.<br>Which solution best meets these requirements?","options":[{"html":"Establish a dedicated AWS Direct Connect connection between the corporate network and AWS. Configure VPC route tables to control traffic flow and use security groups and network ACLs to restrict access as needed","correct":false},{"html":"Use AWS Client VPN to allow corporate users to connect to the VPC individually. Manage access controls with security groups and IAM policies","correct":false},{"html":"Set up a bastion host in a public subnet of the VPC to provide SSH-based access to AWS resources from the corporate network. Use security groups to control access","correct":false},{"html":"Set up AWS Site-to-Site VPN to connect the on-premises network to the AWS VPC. Use route tables to manage traffic flow and configure security groups and network ACLs to allow only authorized communication between systems","correct":true}],"multi":1,"analysis":"<p>Kết n
