e queue. The company is experiencing rapid growth and its on-prem infrastructure cannot scale fast enough. The company wants to migrate the application to AWS with minimal code changes and reduce infrastructure management overhead. The messaging component must continue using AMQP, and the solution should offer high scalability and low operational effort.<br>Which combination of options will together meet these requirements? (Select two)","options":[{"html":"Deploy the application to Amazon ECS on EC2, and integrate the messaging workflow using Amazon SNS for asynchronous pub/sub delivery","correct":false},{"html":"Deploy the containerized application to Amazon Elastic Kubernetes Service (Amazon EKS) using AWS Fargate to avoid managing EC2 nodes","correct":true},{"html":"Use Amazon Simple Queue Service (Amazon SQS) as the replacement for the AMQP message broker. Refactor the application to use SQS SDKs and polling logic","correct":false},{"html":"Run the application on Amazon EC2 Auto Scaling groups and use a self-hosted RabbitMQ instance on EC2 to preserve AMQP compatibility","correct":false},{"html":"Replace the current messaging system with Amazon MQ, a fully managed broker that supports AMQP natively. Integrate the application with the Amazon MQ endpoint without modifying the existing message format","correct":true}],"multi":2,"analysis":"<p>Giữ nguyên giao thức/kiến trúc hiện có (Kubernetes, AMQP) nhưng chuyển phần hạ tầng sang managed service tương ứng</p>","answer":"<p>EKS kèm Fargate giữ nguyên Kubernetes workload mà không cần quản lý EC2 node; Amazon MQ là broker managed duy nhất hỗ trợ AMQP sẵn, không cần đổi code messaging.</p>","explain":"<ul><li><b>A. ✗</b> ECS launch type EC2 vẫn phải tự quản lý node; SNS là pub/sub, không hỗ trợ giao thức AMQP.</li><li><b>B. ✓</b> EKS + Fargate giữ nguyên Kubernetes manifest hiện có, không cần quản lý EC2 worker node — giảm đúng overhead hạ tầng yêu cầu.</li><li><b>C. ✗</b> SQS không hỗ trợ AMQP — phải viết lại toàn bộ logic message bằng SDK/polling của SQS, vi phạm yêu cầu 'minimal code changes'.</li><li><b>D. ✗</b> Tự host RabbitMQ trên EC2 giữ được AMQP nhưng vẫn phải tự patch/scale/failover broker — không giảm được vận hành.</li><li><b>E. ✓</b> Amazon MQ là managed broker hỗ trợ AMQP SẴN, giữ nguyên code/format message hiện có, AWS lo toàn bộ vận hành broker.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> SQS là phản xạ 'messaging trên AWS' quen thuộc nhưng không hỗ trợ AMQP — chọn nó buộc phải viết lại toàn bộ tầng message, ngược yêu cầu đề.</p>","tip":"<p>Giữ nguyên giao thức gốc khi migrate: AMQP cần broker hỗ trợ AMQP thật (Amazon MQ), không phải SQS/SNS (giao thức khác hẳn). Kubernetes hiện có → EKS (không phải ECS) để tái dùng manifest.</p>"},{"id":62,"topic":"Design High-Performing Architectures – Amazon FSx for Windows File Server (SMB)","supplement":false,"stem":"A media production studio is building a content rendering and editing platform on AWS. The editing workstations and rendering tools require access to shared files over the SMB (Server Message Block) protocol. The studio wants a managed storage solution that is simple to set up, integrates easily with SMB clients, and minimizes ongoing operational tasks.<br>Which solution will best meet the requirements with the LEAST administrative overhead?","options":[{"html":"Use Amazon S3 with Transfer Acceleration enabled. Configure the application to upload and download files over HTTPS using signed URLs","correct":false},{"html":"Launch an Amazon EC2 Windows instance and manually configure a Windows file share. Use this instance to serve SMB access to application clients","correct":false},{"html":"Provision an Amazon FSx for Windows File Server file system. Mount the file system using the SMB protocol on the media servers","correct":true},{"html":"Set up an AWS Storage Gateway Volume Gateway in cached volume mode. Attach the volume as an iSCSI device to the application server and configure a file system with SMB sharing enabled","correct":false}],"multi":1,"analysis":"<p>Cần SMB managed, ít vận hành nhất → FSx for Windows, không phải tự dựng (EC2) hay dùng sai loại storage (S3/iSCSI block)</p>","answer":"<p>FSx for Windows File Server là dịch vụ managed duy nhất hỗ trợ SMB ngay từ đầu, không cần tự cấu hình OS-level file sharing.</p>","explain":"<ul><li><b>A. ✗</b> S3 không hỗ trợ giao thức SMB và không phải file system truyền thống cho nhiều client truy cập đồng thời.</li><li><b>B. ✗</b> Tự dựng Windows file server trên EC2 đòi hỏi tự patch, backup, failover — nhiều vận hành hơn FSx managed.</li><li><b>C. ✓</b> FSx for Windows hỗ trợ SMB sẵn, tích hợp AD, tự động backup/patch — đúng 'ít vận hành nhất' cho nhu cầu SMB.</li><li><b>D. ✗</b> Storage Gateway Volume Gateway cung cấp block storage qua iSCSI, KHÔNG hỗ trợ SMB sẵn — vẫn phải tự cấu hình file share ở tầng OS.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Storage Gateway nghe như giải pháp hybrid storage hợp lý nhưng Volume Gateway chỉ cấp BLOCK storage (iSCSI) — vẫn phải tự dựng SMB phía trên, không giảm vận hành.</p>","tip":"<p>Cần chia sẻ file qua SMB cho nhiều client, ít vận hành nhất → Amazon FSx for Windows File Server (không phải EFS, chỉ NFS, hay Storage Gateway Volume Gateway, chỉ block).</p>"},{"id":63,"topic":"Design High-Performing Architectures – EC2 Instance Hibernate","supplement":false,"stem":"A Machine Learning research group uses a proprietary computer vision application hosted on an Amazon EC2 instance. Every time the instance needs to be stopped and started again, the application takes about 3 minutes to start as some auxiliary software programs need to be executed so that the application can function. The research group would like to minimize the application boostrap time whenever the system needs to be stopped and then started at a later point in time.<br>As a solutions architect, which of the following solutions would you recommend for this use-case?","options":[{"html":"Create an Amazon Machine Image (AMI) and launch your Amazon EC2 instances from that","correct":false},{"html":"Use Amazon EC2 Meta-Data","correct":false},{"html":"Use Amazon EC2 Instance Hibernate","correct":true},{"html":"Use Amazon EC2 User-Data","correct":false}],"multi":1,"analysis":"<p>Giữ nguyên trạng thái RUNNING (RAM + tiến trình) qua các lần stop/start thay vì khởi động lại từ đầu</p>","answer":"<p>Hibernate lưu và khôi phục nguyên trạng RAM, nên ứng dụng và các tiến trình phụ trợ đã chạy sẵn khi start lại — không mất lại thời gian khởi tạo ban đầu.</p>","explain":"<ul><li><b>A. ✗</b> AMI giúp khởi tạo instance MỚI nhanh hơn nhưng không giữ lại trạng thái RAM/tiến trình đang chạy của 1 instance cụ thể.</li><li><b>B. ✗</b> Metadata chỉ cung cấp thông tin VỀ instance, không ảnh hưởng tới thời gian khởi động ứng dụng.</li><li><b>C. ✓</b> Hibernate lưu toàn bộ RAM xuống EBS khi dừng, khôi phục lại đúng trạng thái (tiến trình đang chạy) khi start lại — bỏ qua hẳn thời gian khởi tạo phụ trợ.</li><li><b>D. ✗</b> User-Data chỉ chạy script lúc boot lần đầu (hoặc mỗi lần nếu cấu hình thêm), không giúp RÚT NGẮN thời gian các bước khởi tạo đó.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> AMI và User-Data đều liên quan đến 'khởi động instance' nhưng chỉ tối ưu việc TẠO MỚI instance, không giữ được trạng thái runtime như Hibernate.</p>","tip":"<p>Muốn bỏ qua thời gian khởi tạo lại ứng dụng mỗi lần stop/start EC2 → Hibernate (lưu RAM xuống EBS), không phải AMI hay User-Data (chỉ ảnh hưởng lúc tạo mới/boot từ đầu).</p>"},{"id":64,"topic":"Design High-Performing Architectures – EC2 User Data Behavior","supplement":false,"stem":"An engineering team wants to examine the feasibility of the user data feature of Amazon EC2 for an upcoming project.<br>Which of the following are true about the Amazon EC2 user data configuration? (Select two)","options":[{"html":"By default, scripts entered as user data are executed with root user privileges","correct":true},{"html":"By default, user data is executed every time an Amazon EC2 instance is re-started","correct":false},{"html":"When an instance is running, you can update user data by using root user credentials","correct":false},{"html":"By default, user data runs only during the boot cycle when you first launch an instance","correct":true},{"html":"By default, scripts entered as user data do not have root user privileges for executing","correct":false}],"multi":2,"analysis":"<p>Nhớ đúng 2 hành vi mặc định của EC2 User Data: quyền thực thi (root) và tần suất chạy (chỉ 1 lần lúc launch)</p>","answer":"<p>Hai phát biểu đúng mô tả chính xác hành vi mặc định: chạy với quyền root, và chỉ chạy đúng 1 lần ở boot cycle đầu tiên.</p>","explain":"<ul><li><b>A. ✓</b> Đúng — script user data luôn chạy với quyền root, không cần sudo.</li><li><b>B. ✗</b> Sai — mặc định user data CHỈ chạy 1 lần lúc instance khởi tạo lần đầu, trừ khi tự cấu hình lại để chạy mỗi lần restart.</li><li><b>C. ✗</b> Sai — không thể sửa user data khi instance đang chạy (kể cả bằng quyền root), chỉ xem được, phải dừng instance mới sửa.</li><li><b>D. ✓</b> Đúng — mặc định user data chỉ chạy đúng 1 lần, ở boot cycle đầu tiên khi launch.</li><li><b>E. ✗</b> Sai — phủ định ngược với sự thật (script LUÔN có quyền root theo mặc định).</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các phát biểu sai đều là PHỦ ĐỊNH của sự thật (không có quyền root, chạy mỗi lần restart, sửa được khi đang chạy) — cố tình đảo ngược để kiểm tra trí nhớ chính xác.</p>","tip":"<p>EC2 User Data mặc định: chạy với quyền root, CHỈ chạy 1 lần lúc đầu (phải tự cấu hình lại nếu muốn chạy mỗi lần restart), và KHÔNG sửa được khi instance đang chạy.</p>"},{"id":65,"topic":"Design Secure Architectures – S3 SSE-C (Customer-Provided Keys)","supplement":false,"stem":"A financial services company has developed its flagship application on AWS Cloud with data security requirements such that the encryption key must be stored in a custom application running on-premises. The company wants to offload the data storage as well as the encryption process to Amazon S3 but continue to use the existing encryption key.<br>Which of the following Amazon S3 encryption options allows the company to leverage Amazon S3 for storing data with given constraints?","options":[{"html":"Server-Side Encryption with Customer-Provided Keys (SSE-C)","correct":true},{"html":"Client-Side Encryption with data encryption is done on the client-side before sending it to Amazon S3","correct":false},{"html":"Server-Side Encryption with AWS Key Management Service (AWS KMS) keys (SSE-KMS)","correct":false},{"html":"Server-Side Encryption with Amazon S3 managed keys (SSE-S3)","correct":false}],"multi":1,"analysis":"<p>Muốn S3 làm việc mã hoá/giải mã NHƯNG khoá vẫn do khách hàng tự quản lý và cung cấp → SSE-C</p>","answer":"<p>SSE-C là lựa chọn duy nhất cho phép offload việc MÃ HOÁ cho S3 trong khi khoá vẫn hoàn toàn do khách hàng tự quản lý và gửi kèm mỗi request.</p>","explain":"<ul><li><b>A. ✓</b> SSE-C cho phép khách hàng tự quản lý và cung cấp khoá mã hoá (từ ứng dụng on-premises) trong mỗi request, còn S3 vẫn lo việc mã hoá/giải mã.</li><li><b>B. ✗</b> Client-side encryption yêu cầu KHÁCH HÀNG tự làm cả việc mã hoá, trái với mong muốn 'offload encryption process' cho S3.</li><li><b>C. ✗</b> SSE-KMS dùng khoá do AWS KMS quản lý, không phải khoá tự quản lý hoàn toàn bởi ứng dụng on-premises của khách hàng.</li><li><b>D. ✗</b> SSE-S3 dùng khoá hoàn toàn do S3 tự quản lý, khách hàng không kiểm soát được khoá.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Client-Side Encryption nghe như 'khách hàng giữ khoá' đúng yêu cầu nhưng lại bắt khách hàng tự làm luôn việc MÃ HOÁ — ngược với mong muốn offload cho S3.</p>","tip":"<p>Khoá do AWS quản lý → SSE-S3/SSE-KMS. Khoá do khách hàng tự quản lý nhưng S3 vẫn lo việc mã hoá → SSE-C. Khoá VÀ việc mã hoá đều do khách hàng tự làm → Client-Side Encryption.</p>"}];
const LETTERS = "ABCDEFGH";
const state = {
  order: Q.map((_, i) => i),
  pos: 0,
  sel: {},        // qid -> Set of original option idx
  done: {},       // qid -> true/false (correct?)
  flags: new Set(),
  perm: {},       // qid -> displayed order of original option indices
  hint: {},
  view: "quiz"
};
const $ = s => document.querySelector(s);

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function perm(q){
  if(!state.perm[q.id]) state.perm[q.id] = $("#optShuffleA").checked ? shuffle(q.options.map((_,i)=>i)) : q.options.map((_,i)=>i);
  return state.perm[q.id];
}
function visible(){
  const f = $("#fFilter").value, t = $("#fTopic").value;
  return state.order.filter(i => {
    const q = Q[i];
    if(t && topicGroup(q.topic) !== t) return false;
    if(f === "todo") return !(q.id in state.done);
    if(f === "bad") return state.done[q.id] === false;
    if(f === "flag") return state.flags.has(q.id);
    if(f === "sup") return q.supplement;
    return true;
  });
}
function topicGroup(t){ return t.split("–")[0].trim(); }

function renderStats(){
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length, bad = vals.length - ok;
  $("#sDone").textContent = `${vals.length}/${Q.length}`;
  $("#sOk").textContent = ok; $("#sBad").textContent = bad;
  $("#sPct").textContent = vals.length ? Math.round(ok*100/vals.length) + "%" : "–";
  $("#prog").style.width = (vals.length*100/Q.length) + "%";
}
function renderGrid(){
  const vis = new Set(visible());
  const cur = state.order[state.pos];
  const g = $("#grid"); g.innerHTML = "";
  Q.forEach((q, i) => {
    const b = document.createElement("button");
    b.className = "cell";
    if(q.id in state.done) b.classList.add(state.done[q.id] ? "ok" : "bad");
    if(state.flags.has(q.id)) b.classList.add("flag");
    if(q.supplement) b.classList.add("sup");
    if(i === cur && state.view === "quiz") b.classList.add("cur");
    if(!vis.has(i)) b.classList.add("dim");
    b.textContent = q.id;
    b.title = q.topic + (q.supplement ? " (câu bổ sung)" : "");
    b.onclick = () => { state.view = "quiz"; state.pos = state.order.indexOf(i); render(); window.scrollTo({top:0,behavior:"smooth"}); };
    g.appendChild(b);
  });
}

function section(cls, title, html, open){
  return `<details class="sec ${cls}" ${open?"open":""}><summary>${title}</summary><div class="body">${html}</div></details>`;
}

function renderQuiz(){
  const main = $("#main");
  const vis = visible();
  if(!vis.length){ main.innerHTML = `<div class="card empty">Không có câu nào khớp bộ lọc hiện tại.</div>`; return; }
  let idx = state.order[state.pos];
  if(!vis.includes(idx)){ idx = vis[0]; state.pos = state.order.indexOf(idx); }
  const q = Q[idx];
  const answered = q.id in state.done;
  const sel = state.sel[q.id] || new Set();
  const p = perm(q);
  const vpos = vis.indexOf(idx);

  let opts = p.map((oi, k) => {
    const o = q.options[oi];
    let cls = "opt" + (q.multi > 1 ? " multi" : "");
    let tag = "";
    if(answered){
      if(o.correct && sel.has(oi)){ cls += " right"; tag = "✓ Đúng"; }
      else if(!o.correct && sel.has(oi)){ cls += " wrong"; tag = "✗ Bạn chọn"; }
      else if(o.correct){ cls += " right missed"; tag = "✓ Đáp án đúng"; }
    } else if(sel.has(oi)) cls += " sel";
    return `<div class="${cls}" data-oi="${oi}" role="${q.multi>1?"checkbox":"radio"}" aria-checked="${sel.has(oi)}" tabindex="0">
      <span class="key">${LETTERS[k]}</span><span class="txt">${o.html}${tag?`<span class="tag">${tag}</span>`:""}</span></div>`;
  }).join("");

  const showExplain = answered && $("#optAuto").checked;
  let after = "";
  if(answered){
    const ok = state.done[q.id];
    after += `<div class="verdict ${ok?"ok":"bad"}">${ok ? "Chính xác!" :"Chưa đúng. Xem đáp án được đánh dấu xanh và phần giải thích bên dưới."}</div>`;
    after += section("s-analysis", "Phân tích đề", q.analysis, showExplain);
    after += section("s-answer", "Đáp án đúng", q.answer, showExplain);
    after += section("s-explain", "Giải thích", q.explain, showExplain);
    after += section("s-wrong", "Vì sao các đáp án khác sai", q.wrong, showExplain);
    after += section("s-tip", "Mẹo thi", q.tip, showExplain);
  } else if(state.hint[q.id]){
    after += `<div class="hint"><h3>Gợi ý · Phân tích đề</h3><div class="body">${q.analysis}</div></div>`;
  }

  const need = q.multi > 1 ? `Chọn ${q.multi} đáp án` : "Chọn 1 đáp án";
  main.innerHTML = `<div class="card ${answered?"locked":""}">
    <div class="qhead">
      <span class="qnum">Câu ${q.id}</span>
      <span class="chip">${q.topic}</span>
      ${q.supplement ? `<span class="chip sup">Câu bổ sung</span>` : ""}
      <span class="chip multi">${need}</span>
      <button class="flagbtn ${state.flags.has(q.id)?"on":""}" id="btnFlag">${state.flags.has(q.id)?"★ Đã đánh dấu":"☆ Đánh dấu"}</button>
    </div>
    <div class="stem">${q.stem}</div>
    <div class="opts">${opts}</div>
    <div class="actions">
      <button class="btn" id="btnPrev" ${vpos<=0?"disabled":""}>← Câu trước</button>
      ${!answered ? `<button class="btn ghost" id="btnHint">${state.hint[q.id]?"Ẩn gợi ý":"Gợi ý: phân tích đề"}</button>` : `<button class="btn ghost" id="btnRetry">Làm lại câu này</button>`}
      <span class="spacer"></span>
      ${!answered ? `<button class="btn primary" id="btnCheck" ${sel.size!==q.multi?"disabled":""}>Kiểm tra</button>` : ""}
      <button class="btn ${answered?"primary":""}" id="btnNext" ${vpos>=vis.length-1?"disabled":""}>Câu sau →</button>
    </div>
    ${after}
    <div class="kbd"><kbd>A</kbd>–<kbd>E</kbd> hoặc <kbd>1</kbd>–<kbd>5</kbd> chọn đáp án · <kbd>Enter</kbd> kiểm tra / sang câu sau · <kbd>←</kbd> <kbd>→</kbd> chuyển câu · <kbd>H</kbd> gợi ý</div>
  </div>`;

  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => toggle(q, +el.dataset.oi);
    el.onkeydown = e => { if(e.key===" "){ e.preventDefault(); toggle(q, +el.dataset.oi); } };
  });
  $("#btnFlag").onclick = () => { state.flags.has(q.id) ? state.flags.delete(q.id) : state.flags.add(q.id); render(); };
  $("#btnPrev").onclick = () => go(-1);
  $("#btnNext").onclick = () => go(1);
  if($("#btnCheck")) $("#btnCheck").onclick = () => check(q);
  if($("#btnHint")) $("#btnHint").onclick = () => { state.hint[q.id] = !state.hint[q.id]; render(); };
  if($("#btnRetry")) $("#btnRetry").onclick = () => { delete state.done[q.id]; state.sel[q.id] = new Set(); delete state.perm[q.id]; render(); };
}

function toggle(q, oi){
  if(q.id in state.done) return;
  const s = state.sel[q.id] || (state.sel[q.id] = new Set());
  if(q.multi === 1){ s.clear(); s.add(oi); }
  else if(s.has(oi)) s.delete(oi);
  else { if(s.size >= q.multi) return; s.add(oi); }
  render();
}
function check(q){
  const s = state.sel[q.id] || new Set();
  if(s.size !== q.multi) return;
  const correct = q.options.every((o, i) => o.correct === s.has(i));
  state.done[q.id] = correct;
  render();
}
function go(d){
  const vis = visible();
  const cur = state.order[state.pos];
  let vp = vis.indexOf(cur);
  vp = Math.max(0, Math.min(vis.length-1, vp + d));
  state.pos = state.order.indexOf(vis[vp]);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderSummary(){
  const groups = {};
  Q.forEach(q => {
    const g = topicGroup(q.topic);
    groups[g] = groups[g] || {n:0, done:0, ok:0, bad:[]};
    groups[g].n++;
    if(q.id in state.done){ groups[g].done++; if(state.done[q.id]) groups[g].ok++; else groups[g].bad.push(q.id); }
  });
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length;
  const wrongIds = Q.filter(q => state.done[q.id] === false).map(q => q.id);
  const rows = Object.entries(groups).sort((a,b)=>b[1].n-a[1].n).map(([g, v]) => {
    const pct = v.done ? Math.round(v.ok*100/v.done) : null;
    return `<tr><td>${g}</td><td class="n">${v.done}/${v.n}</td><td class="n">${pct===null?"–":pct+"%"}</td>
      <td><div class="bar"><i style="width:${pct||0}%"></i></div></td><td>${v.bad.map(id=>`<a href="#" data-q="${id}">${id}</a>`).join(", ")}</td></tr>`;
  }).join("");
  $("#main").innerHTML = `<div class="card summary">
    <h2>Kết quả</h2>
    <p>Đã làm <b>${vals.length}/${Q.length}</b> câu · Đúng <b>${ok}</b> · Sai <b>${vals.length-ok}</b>${vals.length?` · Tỷ lệ đúng <b>${Math.round(ok*100/vals.length)}%</b>`:""}.
    ${vals.length===Q.length ? (ok/Q.length>=0.72 ? " Mức này tương đương ngưỡng đậu (~720/1000)." : " Chưa đạt ngưỡng ~72%, nên ôn lại các câu sai.") : ""}</p>
    ${wrongIds.length ? `<p><button class="btn primary" id="btnReviewBad">Ôn lại ${wrongIds.length} câu sai</button></p>` : ""}
    <table><thead><tr><th>Chủ đề</th><th class="n">Đã làm</th><th class="n">Đúng</th><th></th><th>Câu sai</th></tr></thead><tbody>${rows}</tbody></table>
    <p style="margin-top:14px"><button class="btn" id="btnBack">← Quay lại làm bài</button></p>
  </div>`;
  $("#btnBack").onclick = () => { state.view = "quiz"; render(); };
  if($("#btnReviewBad")) $("#btnReviewBad").onclick = () => {
    $("#fFilter").value = "bad"; $("#fTopic").value = "";
    wrongIds.forEach(id => { delete state.done[id]; state.sel[id] = new Set(); delete state.perm[id]; });
    // keep them findable after reset: mark as flagged review set
    wrongIds.forEach(id => state.flags.add(id));
    $("#fFilter").value = "flag";
    state.view = "quiz"; state.pos = state.order.indexOf(Q.findIndex(q => q.id === wrongIds[0])); render();
  };
  $("#main").querySelectorAll("a[data-q]").forEach(a => a.onclick = e => {
    e.preventDefault(); state.view = "quiz"; $("#fFilter").value = "all"; $("#fTopic").value = "";
    state.pos = state.order.indexOf(Q.findIndex(q => q.id === +a.dataset.q)); render();
  });
}

function render(){
  renderStats(); renderGrid();
  state.view === "summary" ? renderSummary() : renderQuiz();
}

// init
(function(){
  const groups = [...new Set(Q.map(q => topicGroup(q.topic)))].sort();
  groups.forEach(g => { const o = document.createElement("option"); o.value = g; o.textContent = g; $("#fTopic").appendChild(o); });
  $("#fFilter").onchange = $("#fTopic").onchange = () => { state.view = "quiz"; render(); };
  $("#optShuffleQ").onchange = e => {
    const cur = state.order[state.pos];
    state.order = e.target.checked ? shuffle(Q.map((_, i) => i)) : Q.map((_, i) => i);
    state.pos = e.target.checked ? 0 : state.order.indexOf(cur);
    render();
  };
  $("#optShuffleA").onchange = () => { Q.forEach(q => { if(!(q.id in state.done)) delete state.perm[q.id]; }); render(); };
  $("#optAuto").onchange = render;
  $("#btnSummary").onclick = () => { state.view = "summary"; render(); };
  $("#btnReset").onclick = () => {
    if(!Object.keys(state.done).length) return;
    state.sel = {}; state.done = {}; state.hint = {}; state.perm = {}; state.pos = 0; state.view = "quiz";
    $("#fFilter").value = "all"; render();
  };
  $("#btnTheme").onclick = () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  };
  document.addEventListener("keydown", e => {
    if(state.view !== "quiz" || e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    const q = Q[state.order[state.pos]]; if(!q) return;
    const k = e.key.toUpperCase();
    let n = "12345678".indexOf(k); if(n < 0) n = LETTERS.indexOf(k);
    if(k.length === 1 && n >= 0 && n < q.options.length && k !== "H"){ toggle(q, perm(q)[n]); return; }
    if(e.key === "Enter"){ e.preventDefault(); (q.id in state.done) ? go(1) : check(q); }
    else if(e.key === "ArrowRight") go(1);
    else if(e.key === "ArrowLeft") go(-1);
    else if(k === "H" && !(q.id in state.done)){ state.hint[q.id] = !state.hint[q.id]; render(); }
  });
  render();
})();
</script>
</body>
</html>
