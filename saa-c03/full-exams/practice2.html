i><li><b>C. ✓</b> Glue Crawler tự tạo catalog, Athena truy vấn trực tiếp trên S3 — không cần hạ tầng compute, đúng 'ít vận hành nhất'.</li><li><b>D. ✗</b> Glue ETL job dùng cho pipeline biến đổi dữ liệu, không phải công cụ truy vấn tức thời/ad-hoc.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Redshift và EMR đều 'truy vấn được' nhưng đòi hỏi di chuyển dữ liệu hoặc vận hành cụm compute — vi phạm tiêu chí ít vận hành nhất.</p>","tip":"<p>Truy vấn SQL ad-hoc, tức thời, trực tiếp trên S3, ít vận hành nhất → Glue Crawler (catalog) + Athena (query), không cần ETL hay data warehouse trước.</p>"},{"id":29,"topic":"Design Secure Architectures – AWS Config Managed Rule for ACM Certificates","supplement":false,"stem":"A financial services company has deployed its flagship application on Amazon EC2 instances. Since the application handles sensitive customer data, the security team at the company wants to ensure that any third-party Secure Sockets Layer certificate (SSL certificate) SSL/Transport Layer Security (TLS) certificates configured on Amazon EC2 instances via the AWS Certificate Manager (ACM) are renewed before their expiry date. The company has hired you as an AWS Certified Solutions Architect Associate to build a solution that notifies the security team 30 days before the certificate expiration. The solution should require the least amount of scripting and maintenance effort.<br>What will you recommend?","options":[{"html":"Monitor the days to expiry Amazon CloudWatch metric for certificates created via ACM. Create a CloudWatch alarm to monitor such certificates based on the days to expiry metric and then trigger a custom action of notifying the security team","correct":false},{"html":"Leverage AWS Config managed rule to check if any third-party SSL/TLS certificates imported into ACM are marked for expiration within 30 days. Configure the rule to trigger an Amazon SNS notification to the security team if any certificate expires within 30 days","correct":true},{"html":"Leverage AWS Config managed rule to check if any SSL/TLS certificates created via ACM are marked for expiration within 30 days. Configure the rule to trigger an Amazon SNS notification to the security team if any certificate expires within 30 days","correct":false},{"html":"Monitor the days to expiry Amazon CloudWatch metric for certificates imported into ACM. Create a CloudWatch alarm to monitor such certificates based on the days to expiry metric and then trigger a custom action of notifying the security team","correct":false}],"multi":1,"analysis":"<p>Phân biệt chứng chỉ ACM tự tạo (auto-renew) vs chứng chỉ import (cần tự theo dõi hết hạn)</p>","answer":"<p>AWS Config managed rule có sẵn, không cần viết custom alarm, đúng loại chứng chỉ (imported, không tự renew) — ít công sức nhất.</p>","explain":"<ul><li><b>A. ✗</b> Chứng chỉ do ACM tự tạo thì ACM tự động renew, không cần theo dõi expiry.</li><li><b>B. ✓</b> Chứng chỉ bên thứ ba IMPORT vào ACM không được tự renew — đúng đối tượng cần cảnh báo, dùng AWS Config managed rule có sẵn và SNS là cách ít cấu hình nhất.</li><li><b>C. ✗</b> Lại áp managed rule cho chứng chỉ do ACM TẠO (vốn tự renew) — sai đối tượng cần theo dõi.</li><li><b>D. ✗</b> Dùng CloudWatch alarm thủ công cho chứng chỉ imported vẫn khả thi nhưng cần cấu hình nhiều hơn so với dùng sẵn AWS Config managed rule.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Theo dõi 'days to expiry' cho chứng chỉ do CHÍNH ACM tạo ra là vô nghĩa vì loại này luôn tự động renew.</p>","tip":"<p>Chứng chỉ ACM tự phát hành → tự renew, không cần theo dõi. Chứng chỉ import (bên thứ ba) → không tự renew, cần AWS Config managed rule hoặc CloudWatch alarm để cảnh báo.</p>"},{"id":30,"topic":"Design Secure Architectures – Route 53 Private Hosted Zone DNS Settings","supplement":false,"stem":"A systems administrator has created a private hosted zone and associated it with a Virtual Private Cloud (VPC). However, the Domain Name System (DNS) queries for the private hosted zone remain unresolved.<br>As a Solutions Architect, can you identify the Amazon Virtual Private Cloud (Amazon VPC) options to be configured in order to get the private hosted zone to work?","options":[{"html":"Fix conflicts between your private hosted zone and any Resolver rule that routes traffic to your network for the same domain name, as it results in ambiguity over the route to be taken","correct":false},{"html":"Remove any overlapping namespaces for the private and public hosted zones","correct":false},{"html":"Fix the Name server (NS) record and Start Of Authority (SOA) records that may have been created with wrong configurations","correct":false},{"html":"Enable DNS hostnames and DNS resolution for private hosted zones","correct":true}],"multi":1,"analysis":"<p>Kiểm tra đúng 2 thuộc tính cấu hình VPC bắt buộc cho private hosted zone, thay vì nghi ngờ cấu hình Route 53</p>","answer":"<p>Private hosted zone chỉ hoạt động khi VPC bật cả DNS hostnames và DNS resolution — thiếu cái nào cũng khiến query không resolve được.</p>","explain":"<ul><li><b>A. ✗</b> Khi có xung đột, Resolver rule được ưu tiên hơn — không gây ra tình trạng 'unresolved', chỉ đổi đường định tuyến.</li><li><b>B. ✗</b> Namespace trùng vẫn được Route 53 Resolver chọn theo match cụ thể nhất — không gây unresolved.</li><li><b>C. ✗</b> Private hosted zone không tự tạo NS/SOA record công khai như public hosted zone — vấn đề không nằm ở đây.</li><li><b>D. ✓</b> Hai tuỳ chọn VPC 'enableDnsHostnames' và 'enableDnsSupport' là điều kiện bắt buộc để private hosted zone hoạt động — thiếu một trong hai sẽ khiến DNS không resolve được.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các lựa chọn về NS/SOA record hay namespace trùng nghe như lỗi DNS kinh điển nhưng không áp dụng cho private hosted zone.</p>","tip":"<p>Private hosted zone 'không hoạt động' → luôn kiểm tra trước 2 thuộc tính VPC: enableDnsSupport và enableDnsHostnames.</p>"},{"id":31,"topic":"Design Secure Architectures – Amazon Security Lake","supplement":false,"stem":"&quot;An enterprise organization is expanding its cloud footprint and needs to centralize its security event data from various AWS accounts and services. The goal is to evaluate security posture across all environments and improve threat detection and response — without requiring significant custom code or manual integration.<br>Which solution will fulfill these needs with the least development effort?","options":[{"html":"Deploy a custom Lambda function to aggregate security logs from multiple AWS accounts. Format the data into CSV files and upload them to a central S3 bucket for analysis","correct":false},{"html":"Use Amazon Security Lake to create a centralized data lake that automatically collects security-related logs and events from AWS services and third-party sources. Store the data in an Amazon S3 bucket managed by Security Lake","correct":true},{"html":"Use Amazon Athena with predefined SQL queries to scan security logs stored in multiple S3 buckets. Visualize the findings by exporting results to an Amazon QuickSight dashboard","correct":false},{"html":"Set up a data lake using AWS Lake Formation to collect and organize security event logs. Use AWS Glue to perform ETL operations and standardize the log formats for centralized analysis","correct":false}],"multi":1,"analysis":"<p>Chọn dịch vụ CHUYÊN BIỆT cho đúng loại dữ liệu (security log) thay vì công cụ data lake tổng quát</p>","answer":"<p>Security Lake được xây riêng cho việc thu thập/chuẩn hoá log bảo mật từ nhiều nguồn AWS và bên thứ ba, không cần viết pipeline riêng.</p>","explain":"<ul><li><b>A. ✗</b> Tự viết Lambda để gom log, tự định dạng CSV — tốn nhiều công phát triển và bảo trì.</li><li><b>B. ✓</b> Security Lake tự động thu thập, chuẩn hoá (OCSF) log bảo mật từ nhiều account/dịch vụ — không cần code tuỳ chỉnh.</li><li><b>C. ✗</b> Athena + QuickSight chỉ truy vấn/trực quan hoá, không giải quyết việc thu thập và chuẩn hoá log tập trung.</li><li><b>D. ✗</b> Lake Formation + Glue ETL là công cụ cho dữ liệu nghiệp vụ nói chung, phải tự xây pipeline chuẩn hoá log bảo mật — nhiều công sức hơn Security Lake.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Lake Formation nghe như giải pháp data lake 'chính thống' hơn nhưng là công cụ tổng quát, vẫn cần tự xây ETL chuẩn hoá — tốn công hơn Security Lake chuyên biệt.</p>","tip":"<p>Thu thập/chuẩn hoá log bảo mật tập trung đa account, ít code nhất → Amazon Security Lake (tự động dùng chuẩn OCSF).</p>"},{"id":32,"topic":"Design Secure Architectures – S3 Access Points","supplement":false,"stem":"An enterprise uses a centralized Amazon S3 bucket to store logs and reports generated by multiple analytics services. Each service writes to and reads from a dedicated prefix (folder path) in the bucket. The company wants to enforce fine-grained access control so that each service can access only its own prefix, without being able to see or modify other services' data. The solution must support scalable and maintainable permissions management with minimal operational overhead.<br>Which approach will best meet these requirements?","options":[{"html":"Create separate IAM users for each service. Manually assign inline IAM policies to grant read/write permissions to the S3 bucket. Reference specific object names in the policy for each user","correct":false},{"html":"Configure individual S3 access points for each analytics service. Attach access point policies that restrict access to only the relevant prefix in the S3 bucket","correct":true},{"html":"Create a single S3 bucket policy that lists all object ARNs under each prefix and grants permissions accordingly. Use resource-level permissions to restrict access to individual services","correct":false},{"html":"Deploy Amazon Macie to classify the objects in the bucket by prefix and apply automated object-level access policies to each object based on service tags","correct":false}],"multi":1,"analysis":"<p>Cô lập quyền truy cập theo prefix cho nhiều service dùng chung 1 bucket, cần dễ bảo trì khi mở rộng</p>","answer":"<p>S3 Access Points cho phép mỗi service có 1 policy riêng, giới hạn đúng prefix của mình, độc lập và dễ maintain hơn khi số service tăng.</p>","explain":"<ul><li><b>A. ✗</b> IAM policy inline hardcode tên object, cực kỳ khó bảo trì khi dữ liệu thay đổi — không scale.</li><li><b>B. ✓</b> Mỗi S3 Access Point có policy riêng giới hạn đúng 1 prefix cho 1 service — tách biệt rõ ràng, dễ bảo trì, đúng thiết kế dành cho multi-tenant bucket.</li><li><b>C. ✗</b> Một bucket policy khổng lồ liệt kê mọi ARN theo prefix trở nên cồng kềnh và khó sửa khi service/thư mục tăng lên.</li><li><b>D. ✗</b> Macie dùng để phát hiện/phân loại dữ liệu nhạy cảm (PII), không phải công cụ quản lý quyền truy cập.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Macie nghe như công cụ 'bảo mật S3' toàn diện nhưng chỉ làm nhiệm vụ phát hiện/phân loại dữ liệu, không cấp quyền truy cập.</p>","tip":"<p>Nhiều service/team dùng chung 1 bucket, mỗi bên chỉ truy cập đúng prefix của mình, cần dễ mở rộng → S3 Access Points, không phải bucket policy khổng lồ hay IAM user riêng lẻ.</p>"},{"id":33,"topic":"Design High-Performing Architectures – S3 Static Website + CloudFront","supplement":false,"stem":"A Hollywood studio is planning a series of promotional events leading up to the launch of the trailer of its next sci-fi thriller. The executives at the studio want to create a static website with lots of animations in line with the theme of the movie. The studio has hired you as a solutions architect to build a scalable serverless solution.<br>Which of the following represents the MOST cost-optimal and high-performance solution?","options":[{"html":"Host the website on an Amazon EC2 instance. Create a Amazon CloudFront distribution with the Amazon EC2 instance as the custom origin","correct":false},{"html":"Host the website on AWS Lambda. Create an Amazon CloudFront distribution with Lambda as the origin","correct":false},{"html":"Build the website as a static website hosted on Amazon S3. Create an Amazon CloudFront distribution with Amazon S3 as the origin. Use Amazon Route 53 to create an alias record that points to your Amazon CloudFront distribution","correct":true},{"html":"Host the website on an instance in the studio's on-premises data center. Create an Amazon CloudFront distribution with this instance as the custom origin","correct":false}],"multi":1,"analysis":"<p>Nhận diện kiến trúc 'serverless' chuẩn cho website tĩnh: S3 + CloudFront + Route 53</p>","answer":"<p>S3 static hosting loại bỏ hoàn toàn server cần quản lý, CloudFront phân phối nhanh toàn cầu, Route 53 gắn domain riêng — đúng mọi tiêu chí serverless, chi phí thấp, hiệu năng cao.</p>","explain":"<ul><li><b>A. ✗</b> EC2 vẫn là server phải quản lý — không phải 'serverless' theo đúng yêu cầu.</li><li><b>B. ✗</b> Lambda không dùng để host website tĩnh, và CloudFront cũng không đặt Lambda trực tiếp làm origin theo cách này.</li><li><b>C. ✓</b> S3 static website + CloudFront + Route 53 alias — đúng kiến trúc serverless chuẩn cho nội dung tĩnh, rẻ và nhanh.</li><li><b>D. ✗</b> Vẫn là hạ tầng server (on-premises) phải tự quản lý, không phải serverless.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Lambda nghe 'serverless' nhất nhưng không phải công cụ để host nội dung website tĩnh (HTML/CSS/JS/animation).</p>","tip":"<p>Website hoàn toàn tĩnh, cần serverless, rẻ, nhanh toàn cầu → S3 (lưu trữ) + CloudFront (CDN) + Route 53 (domain), không cần EC2 hay Lambda.</p>"},{"id":34,"topic":"Design Secure Architectures – AWS Transfer Family SFTP","supplement":false,"stem":"A multinational logistics company is migrating its core systems to AWS. As part of this migration, the company has built an Amazon S3–based data lake to ingest and analyze supply chain data from external carriers and vendors. While some vendors have adopted the company’s modern REST-based APIs for S3 uploads, others operate legacy systems that rely exclusively on SFTP for file transfers. These vendors are unable or unwilling to modify their workflows to support S3 APIs. The company wants to provide these vendors with an SFTP-compatible solution that allows direct uploads to Amazon S3, and must use fully managed AWS services to avoid managing any infrastructure. It must also support identity federation so that internal teams can map vendor access securely to specific S3 buckets or prefixes.<br>Which combination of options will provide a scalable and low-maintenance solution for this use case? (Select two)","options":[{"html":"Set up an Amazon EC2 instance with a custom SFTP server using OpenSSH. Configure cron jobs to upload received files to S3. Use Amazon CloudWatch to monitor EC2 health and disk usage","correct":false},{"html":"Use Amazon AppFlow to extract data from the legacy vendor systems and transform it into S3-compliant uploads. Schedule batch sync jobs to trigger every hour and send logs to CloudWatch for audit purposes","correct":false},{"html":"Use AWS Transfer Family with SFTP for file uploads. Integrate the SFTP access control with Amazon Route 53 private hosted zones to create vendor-specific upload subdomains pointing to the SFTP endpoint","correct":false},{"html":"Deploy a fully managed AWS Transfer Family endpoint with SFTP enabled. Configure it to store uploaded files directly in an Amazon S3 bucket. Set up IAM roles mapped to each vendor for secure bucket or prefix access","correct":true},{"html":"Configure Amazon S3 bucket policies to use IAM role-based access control for each vendor. Combine this with Transfer Family identity provider integration using Amazon Cognito or a custom identity provider for fine-grained permissions","correct":true}],"multi":2,"analysis":"<p>Cung cấp SFTP managed cho vendor legacy, ánh xạ mỗi vendor sang đúng IAM role/prefix, có thể mở rộng bằng identity federation</p>","answer":"<p>AWS Transfer Family là dịch vụ managed duy nhất hỗ trợ SFTP gắn thẳng vào S3, kết hợp IAM role (và identity provider khi cần) để phân quyền từng vendor mà không cần quản lý server.</p>","explain":"<ul><li><b>A. ✗</b> Tự dựng SFTP server trên EC2 bằng OpenSSH kèm cron job gây nhiều vận hành (patch, scale, backup) — trái yêu cầu fully managed.</li><li><b>B. ✗</b> AppFlow là dịch vụ tích hợp SaaS theo API (Salesforce, Zendesk...), không hỗ trợ giao thức SFTP.</li><li><b>C. ✗</b> Route 53 private hosted zone chỉ phục vụ DNS nội bộ, không liên quan tới việc cấp subdomain công khai cho SFTP endpoint.</li><li><b>D. ✓</b> AWS Transfer Family với SFTP, lưu trực tiếp vào S3, IAM role riêng cho từng vendor — đúng managed, đúng phân quyền theo prefix/bucket.</li><li><b>E. ✓</b> Kết hợp S3 bucket policy theo IAM role với identity provider (Cognito/custom) trên Transfer Family — mở rộng federation linh hoạt, vẫn managed hoàn toàn.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> AppFlow và Route 53 private hosted zone đều là dịch vụ AWS hợp lý trong ngữ cảnh khác nhưng SAI hoàn toàn mục đích (không hỗ trợ SFTP / không phục vụ subdomain công khai).</p>","tip":"<p>Đối tác ngoài chỉ dùng được SFTP, cần lưu thẳng vào S3, không muốn quản lý hạ tầng → AWS Transfer Family (SFTP) + IAM role theo vendor, mở rộng bằng Cognito/custom identity provider nếu cần federation.</p>"},{"id":35,"topic":"Design Secure Architectures – IAM Role for EC2 Instance Profile","supplement":false,"stem":"A social photo-sharing web application is hosted on Amazon Elastic Compute Cloud (Amazon EC2) instances behind an Elastic Load Balancer. The app gives the users the ability to upload their photos and also shows a leaderboard on the homepage of the app. The uploaded photos are stored in Amazon Simple Storage Service (Amazon S3) and the leaderboard data is maintained in Amazon DynamoDB. The Amazon EC2 instances need to access both Amazon S3 and Amazon DynamoDB for these features.<br>As a solutions architect, which of the following solutions would you recommend as the MOST secure option?","options":[{"html":"Save the AWS credentials (access key Id and secret access token) in a configuration file within the application code on the Amazon EC2 instances. Amazon EC2 instances can use these credentials to access Amazon S3 and Amazon DynamoDB","correct":false},{"html":"Configure AWS CLI on the Amazon EC2 instances using a valid IAM user's credentials. The application code can then invoke shell scripts to access Amazon S3 and Amazon DynamoDB via AWS CLI","correct":false},{"html":"Attach the appropriate IAM role to the Amazon EC2 instance profile so that the instance can access Amazon S3 and Amazon DynamoDB","correct":true},{"html":"Encrypt the AWS credentials via a custom encryption library and save it in a secret directory on the Amazon EC2 instances. The application code can then safely decrypt the AWS credentials to make the API calls to Amazon S3 and Amazon DynamoDB","correct":false}],"multi":1,"analysis":"<p>Không bao giờ lưu static credential trên EC2 khi có thể dùng IAM role</p>","answer":"<p>IAM role gắn vào instance profile cấp AWS temporary credentials tự động xoay vòng, loại bỏ hoàn toàn nhu cầu lưu trữ/phân phối access key.</p>","explain":"<ul><li><b>A. ✗</b> Lưu credential dạng plaintext trên instance là rủi ro bảo mật nghiêm trọng, dễ bị rò rỉ.</li><li><b>B. ✗</b> Vẫn phải nhúng credential của 1 IAM user cố định vào instance — cùng rủi ro như lưu trực tiếp.</li><li><b>C. ✓</b> IAM role cấp credential tạm thời, tự động xoay vòng, không cần lưu trữ hay phân phối key tĩnh.</li><li><b>D. ✗</b> Dù đã mã hoá, key vẫn phải giải mã và tồn tại trên instance tại một thời điểm nào đó — vẫn rủi ro hơn dùng role.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 'Mã hoá' credential nghe như giải pháp an toàn hơn nhưng vẫn giữ nguyên rủi ro cơ bản: vẫn là static credential tồn tại trên máy.</p>","tip":"<p>EC2 cần gọi AWS service → luôn ưu tiên IAM role (instance profile) thay vì access key/secret key dưới mọi hình thức, kể cả đã mã hoá.</p>"},{"id":36,"topic":"Design High-Performing Architectures – Amazon FSx for Windows File Server","supplement":false,"stem":"Your company has an on-premises Distributed File System Replication (DFSR) service to keep files synchronized on multiple Windows servers, and would like to migrate to AWS cloud.<br>What do you recommend as a replacement for the DFSR?","options":[{"html":"Amazon FSx for Lustre","correct":false},{"html":"Amazon Simple Storage Service (Amazon S3)","correct":false},{"html":"Amazon FSx for Windows File Server","correct":true},{"html":"Amazon Elastic File System (Amazon EFS)","correct":false}],"multi":1,"analysis":"<p>Chọn dịch vụ file storage đúng hệ điều hành (Windows/SMB) và đúng tính năng DFS thay thế</p>","answer":"<p>FSx for Windows File Server là dịch vụ file duy nhất hỗ trợ SMB kèm tích hợp DFS, đúng thay thế cho DFSR trên Windows.</p>","explain":"<ul><li><b>A. ✗</b> FSx for Lustre chỉ dùng cho Linux và khối lượng công việc HPC, không hỗ trợ SMB/Windows.</li><li><b>B. ✗</b> S3 là object storage, không thể mount như file system Windows.</li><li><b>C. ✓</b> FSx for Windows hỗ trợ SMB, NTFS, tích hợp AD, và hỗ trợ DFS Namespaces — thay thế đúng chức năng DFSR.</li><li><b>D. ✗</b> EFS dùng giao thức NFS, chỉ cho Linux, không hỗ trợ SMB/Windows.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> EFS nghe như 'file system managed' tương tự nhưng chỉ phục vụ Linux/NFS, không đáp ứng nhu cầu SMB của Windows Server.</p>","tip":"<p>Cần file share kiểu Windows (SMB, AD, DFS) → FSx for Windows File Server. Cần file share Linux (NFS) → EFS/FSx for Lustre.</p>"},{"id":37,"topic":"Design Cost-Optimized Architectures – RDS Read Replica Data Transfer Charges","supplement":false,"stem":"The engineering manager for a content management application wants to set up Amazon RDS read replicas to provide enhanced performance and read scalability. The manager wants to understand the data transfer charges while setting up Amazon RDS read replicas.<br>Which of the following would you identify as correct regarding the data transfer charges for Amazon RDS read replicas?","options":[{"html":"There are data transfer charges for replicating data across AWS Regions","correct":true},{"html":"There are no data transfer charges for replicating data across AWS Regions","correct":false},{"html":"There are data transfer charges for replicating data within the same AWS Region","correct":false},{"html":"There are data transfer charges for replicating data within the same Availability Zone (AZ)","correct":false}],"multi":1,"analysis":"<p>Nhớ đúng chiều quy tắc tính phí data transfer cho RDS Read Replica (cùng Region vs khác Region)</p>","answer":"<p>AWS chỉ tính phí data transfer khi dữ liệu replicate VƯỢT Region; trong cùng 1 Region thì miễn phí.</p>","explain":"<ul><li><b>A. ✓</b> Đúng — replicate dữ liệu SANG Region khác bị tính phí data transfer.</li><li><b>B. ✗</b> Sai — ngược lại, replicate cross-Region có tính phí.</li><li><b>C. ✗</b> Sai — replicate trong CÙNG Region thì KHÔNG bị tính phí.</li><li><b>D. ✗</b> Sai — cùng AZ càng không bị tính phí.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 4 lựa chọn chỉ khác nhau ở phạm vi (cùng AZ / cùng Region / khác Region) và chiều phủ định — rất dễ chọn nhầm nếu không nhớ chính xác quy tắc.</p>","tip":"<p>RDS Read Replica: replicate trong CÙNG Region → miễn phí. Replicate SANG Region khác → có tính phí data transfer.</p>"},{"id":38,"topic":"Design Secure Architectures – Security Groups for 3-Tier App","supplement":false,"stem":"A silicon valley based startup has a two-tier architecture using Amazon EC2 instances for its flagship application. The web servers (listening on port 443), which have been assigned security group A, are in public subnets across two Availability Zones (AZs) and the MSSQL based database instances (listening on port 1433), which have been assigned security group B, are in two private subnets across two Availability Zones (AZs). The DevOps team wants to review the security configurations of the application architecture.<br>As a solutions architect, which of the following options would you select as the MOST secure configuration? (Select two)","options":[{"html":"For security group B: Add an inbound rule that allows traffic only from all sources on port 1433","correct":false},{"html":"For security group B: Add an inbound rule that allows traffic only from security group A on port 443","correct":false},{"html":"For security group A: Add an inbound rule that allows traffic from all sources on port 443. Add an outbound rule with the destination as security group B on port 1433","correct":true},{"html":"For security group A: Add an inbound rule that allows traffic from all sources on port 443. Add an outbound rule with the destination as security group B on port 443","correct":false},{"html":"For security group B: Add an inbound rule that allows traffic only from security group A on port 1433","correct":true}],"multi":2,"analysis":"<p>Đúng cổng (443 vs 1433) kèm đúng nguồn (giới hạn theo SG, không phải 'tất cả') cho từng tầng</p>","answer":"<p>Chỉ 2 lựa chọn vừa đúng cổng (1433 cho MSSQL) vừa đúng phạm vi nguồn (giới hạn theo SG A, không mở cho mọi nguồn).</p>","explain":"<ul><li><b>A. ✗</b> Cho phép 'tất cả nguồn' vào port DB là không an toàn, phải giới hạn chỉ từ SG A.</li><li><b>B. ✗</b> Sai cổng — MSSQL lắng nghe ở 1433, không phải 443.</li><li><b>C. ✓</b> Đúng — web server nhận HTTPS (443) từ internet, chỉ gửi outbound tới DB đúng cổng 1433.</li><li><b>D. ✗</b> Sai cổng outbound — phải là 1433 (cổng MSSQL), không phải 443.</li><li><b>E. ✓</b> Đúng — DB chỉ nhận traffic từ đúng SG của web server, đúng cổng 1433.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các lựa chọn sai chỉ lệch đúng một chi tiết nhỏ — sai cổng (443 thay vì 1433) hoặc mở quá rộng (từ mọi nguồn) — rất dễ bị đánh lừa nếu đọc lướt.</p>","tip":"<p>Luôn khớp đúng cổng dịch vụ (HTTPS 443, MSSQL 1433) và giới hạn nguồn truy cập theo chính SG của tầng gọi tới, không bao giờ 'allow from anywhere' cho tầng database.</p>"},{"id":39,"topic":"Design Secure Architectures – Cross-Account Lambda to S3","supplement":false,"stem":"A developer needs to implement an AWS Lambda function in AWS account A that accesses an Amazon Simple Storage Service (Amazon S3) bucket in AWS account B.<br>As a Solutions Architect, which of the following will you recommend to meet this requirement?","options":[{"html":"Create an IAM role for the AWS Lambda function that grants access to the Amazon S3 bucket. Set the IAM role as the Lambda function's execution role and that would give the AWS Lambda function cross-account access to the Amazon S3 bucket","correct":false},{"html":"Create an IAM role for the AWS Lambda function that grants access to the Amazon S3 bucket. Set the IAM role as the AWS Lambda function's execution role. Make sure that the bucket policy also grants access to the AWS Lambda function's execution role","correct":true},{"html":"The Amazon S3 bucket owner should make the bucket public so that it can be accessed by the AWS Lambda function in the other AWS account","correct":false},{"html":"AWS Lambda cannot access resources across AWS accounts. Use Identity federation to work around this limitation of Lambda","correct":false}],"multi":1,"analysis":"<p>Truy cập resource cross-account luôn cần CẢ HAI phía: identity policy (role) VÀ resource policy (bucket policy)</p>","answer":"<p>Khi 2 account khác nhau, chỉ cấp quyền 1 phía (role) là không đủ — S3 bucket policy cũng phải tường minh cho phép role đó.</p>","explain":"<ul><li><b>A. ✗</b> Khi role và bucket khác account, chỉ cấp quyền trên role là chưa đủ — thiếu bucket policy.</li><li><b>B. ✓</b> Đúng — khi role Lambda và bucket S3 khác account, cần cả hai: quyền trên role VÀ bucket policy cho phép role đó.</li><li><b>C. ✗</b> Mở bucket public là rủi ro bảo mật nghiêm trọng, không cần thiết.</li><li><b>D. ✗</b> Sai — Lambda hoàn toàn có thể truy cập resource cross-account nếu cấu hình đúng IAM và resource policy.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Dễ lầm tưởng chỉ cần IAM role có đủ quyền là xong, bỏ qua yêu cầu bucket policy khi tài nguyên thuộc account khác.</p>","tip":"<p>Truy cập cross-account vào S3/KMS/SNS...: luôn cần identity-based policy (role) kèm resource-based policy (bucket/key policy) cùng cho phép.</p>"},{"id":40,"topic":"Design Cost-Optimized Architectures – EFS Standard-IA Storage Class","supplement":false,"stem":"A company is looking at storing their less frequently accessed files on AWS that can be concurrently accessed by hundreds of Amazon EC2 instances. The company needs the most cost-effective file storage service that provides immediate access to data whenever needed.<br>Which of the following options represents the best solution for the given requirements?","options":[{"html":"Amazon S3 Standard-Infrequent Access (S3 Standard-IA) storage class","correct":false},{"html":"Amazon Elastic Block Store (EBS)","correct":false},{"html":"Amazon Elastic File System (EFS) Standard–IA storage class","correct":true},{"html":"Amazon Elastic File System (EFS) Standard storage class","correct":false}],"multi":1,"analysis":"<p>Cần file storage dùng chung bởi nhiều EC2 và tối ưu chi phí cho dữ liệu ít truy cập</p>","answer":"<p>EFS Standard-IA vừa là file system chia sẻ được cho hàng trăm EC2, vừa tối ưu chi phí cho dữ liệu ít truy cập — đúng cả 2 tiêu chí.</p>","explain":"<ul><li><b>A. ✗</b> S3 là object storage, không phải file storage có thể mount và truy cập đồng thời bởi hàng trăm EC2.</li><li><b>B. ✗</b> EBS chỉ gắn được với 1 EC2 tại 1 thời điểm (trừ Multi-Attach io1/io2 hạn chế), không phục vụ hàng trăm instance.</li><li><b>C. ✓</b> EFS Standard-IA giảm chi phí cho dữ liệu ít truy cập, vẫn giữ truy cập đồng thời, độ bền cao của EFS.</li><li><b>D. ✗</b> EFS Standard phục vụ dữ liệu truy cập THƯỜNG XUYÊN, không tối ưu chi phí cho dữ liệu 'ít truy cập' như yêu cầu.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> S3 Standard-IA nghe đúng 'ít truy cập' nhưng sai LOẠI lưu trữ (object, không phải file system để mount).</p>","tip":"<p>Cần file storage share nhiều EC2, ít truy cập, tiết kiệm chi phí → EFS Standard-IA (không phải S3, EBS, hay EFS Standard).</p>"},{"id":41,"topic":"Design Secure Architectures – SCP to Restrict Root User","supplement":false,"stem":"A security consultant is designing a solution for a company that wants to provide developers with individual AWS accounts through AWS Organizations, while also maintaining standard security controls. Since the individual developers will have AWS account root user-level access to their own accounts, the consultant wants to ensure that the mandatory AWS CloudTrail configuration that is applied to new developer accounts is not modified.<br>Which of the following actions meets the given requirements?","options":[{"html":"Set up a service control policy (SCP) that prohibits changes to AWS CloudTrail, and attach it to the developer accounts","correct":true},{"html":"Set up a service-linked role for AWS CloudTrail with a policy condition that allows changes only from an Amazon Resource Name (ARN) in the master account","correct":false},{"html":"Configure a new trail in AWS CloudTrail from within the developer accounts with the organization trails option enabled","correct":false},{"html":"Set up an IAM policy that prohibits changes to AWS CloudTrail and attach it to the root user","correct":false}],"multi":1,"analysis":"<p>Giới hạn quyền của CHÍNH root user chỉ có thể làm bằng SCP (áp từ cấp Organization), không phải IAM policy nội bộ account</p>","answer":"<p>SCP là rào chắn áp đặt từ ngoài account (qua Organizations), root user trong account con không thể tự gỡ bỏ nó.</p>","explain":"<ul><li><b>A. ✓</b> SCP áp dụng cho MỌI identity trong account thành viên, kể cả root user, không thể bị root tự gỡ bỏ.</li><li><b>B. ✗</b> Service-linked role không dùng để hạn chế hành vi của root user theo cách này.</li><li><b>C. ✗</b> Tự cấu hình trail trong từng account vẫn có thể bị chính root user ở account đó thay đổi lại.</li><li><b>D. ✗</b> Root user có toàn quyền, có thể tự sửa/xoá chính IAM policy gắn cho mình.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Gắn IAM policy trực tiếp cho root user nghe hợp lý nhưng root luôn có thể tự sửa/xoá chính sách đó — không phải rào chắn thực sự.</p>","tip":"<p>Muốn chặn vĩnh viễn một hành động kể cả với root user của account con → dùng SCP ở cấp Organizations, không phải IAM policy trong chính account đó.</p>"},{"id":42,"topic":"Design High-Performing Architectures – AWS Global Accelerator with NLB","supplement":false,"stem":"A video conferencing platform serves users worldwide through a globally distributed deployment of Amazon EC2 instances behind Network Load Balancers (NLBs) in several AWS Regions. The platform's architecture currently allows clients to connect to any Region via public endpoints, depending on how DNS resolves. However, users in regions far from the load balancers frequently experience high latency and slow connection times, especially during session initiation. The company wants to optimize the experience for global users by reducing end-to-end latency and load time while keeping the existing NLBs and EC2-based application infrastructure in place.<br>Which solution will best meet these requirements?","options":[{"html":"Configure Amazon Route 53 with latency-based routing policies to direct users to the Region with the lowest response time. Use health checks to fail over to another Region if a specific NLB becomes unhealthy","correct":false},{"html":"Deploy Amazon CloudFront with HTTP caching enabled in front of the NLBs. Use CloudFront edge locations to serve user requests faster and reduce the load on the backend EC2 instances","correct":false},{"html":"Replace all Network Load Balancers (NLBs) with Application Load Balancers (ALBs) in each Region. Register the EC2 instances as targets behind the ALBs and use cross-zone load balancing for latency distribution","correct":false},{"html":"Deploy a standard accelerator in AWS Global Accelerator and register the existing regional NLBs as endpoints. Use the accelerator to route user requests through AWS’s global edge network to the closest healthy Regional NLB","correct":true}],"multi":1,"analysis":"<p>Giữ nguyên hạ tầng NLB hiện có, chỉ thêm lớp tăng tốc mạng toàn cầu phía trước</p>","answer":"<p>Global Accelerator route traffic qua mạng backbone AWS tới NLB gần nhất, giảm latency mà không cần sửa đổi NLB/EC2 hiện tại.</p>","explain":"<ul><li><b>A. ✗</b> Route 53 latency routing chỉ định tuyến DNS, không tối ưu đường truyền mạng thực tế và không có failover nhanh ở tầng network.</li><li><b>B. ✗</b> CloudFront hoạt động ở tầng HTTP (lớp 7), không hỗ trợ giao thức TCP/UDP của NLB.</li><li><b>C. ✗</b> Đổi NLB sang ALB làm mất khả năng xử lý giao thức non-HTTP, không giải quyết vấn đề latency toàn cầu.</li><li><b>D. ✓</b> Global Accelerator dùng mạng edge AWS để định tuyến tới NLB gần nhất, IP tĩnh, không cần đổi hạ tầng hiện có.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> CloudFront là phản xạ đầu tiên cho 'giảm latency toàn cầu' nhưng không tương thích với NLB ở tầng TCP/UDP.</p>","tip":"<p>Giảm latency toàn cầu cho ứng dụng TCP/UDP phía sau NLB, giữ nguyên hạ tầng → Global Accelerator. HTTP/HTTPS tĩnh → CloudFront.</p>"},{"id":43,"topic":"Design Resilient Architectures – Aurora Serverless v2 Migration","supplement":false,"stem":"A media publishing company is migrating its legacy content management application to AWS. Currently, the application and its MySQL database run on a single on-premises virtual machine, which creates a single point of failure and limits scalability. As traffic has increased due to growing reader engagement and video uploads, the company needs to redesign the solution to ensure automatic scaling, high availability, and separation of application and database layers. The company wants to continue using a MySQL-compatible engine and needs a cost-effective, managed solution that minimizes operational overhead.<br>Which AWS architecture will best fulfill these requirements?","options":[{"html":"Containerize the application and deploy it to Amazon ECS with EC2 launch type behind an Application Load Balancer. Use Amazon Neptune to store structured relational data with SQL-like queries","correct":false},{"html":"Host the application on EC2 instances that are part of a target group for an Application Load Balancer. Create an Amazon RDS for MySQL Multi-AZ DB instance to provide high availability and automatic failover for the database","correct":false},{"html":"Deploy the application to EC2 instances registered in a Network Load Balancer target group. Use Amazon ElastiCache for Redis as the database and configure it with Redis Streams for persistent storage","correct":false},{"html":"Migrate the application to Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. Use Amazon Aurora Serverless v2 for MySQL to manage the database layer with auto-scaling and built-in high availability","correct":true}],"multi":1,"analysis":"<p>Kết hợp đúng cặp 'auto-scaling ứng dụng + auto-scaling database' cùng giữ nguyên engine quan hệ</p>","answer":"<p>Aurora Serverless v2 vừa tương thích MySQL vừa tự động co giãn theo tải và có HA sẵn, khác với RDS thường vốn cần resize thủ công.</p>","explain":"<ul><li><b>A. ✗</b> Neptune là graph database, không tương thích SQL/MySQL, phải viết lại toàn bộ data model.</li><li><b>B. ✗</b> RDS MySQL Multi-AZ có HA nhưng không tự động co giãn dung lượng tính toán theo tải — vẫn cần can thiệp thủ công khi tải tăng.</li><li><b>C. ✗</b> Redis không phải database quan hệ, thiếu transaction/ACID như MySQL cần cho hệ thống nghiệp vụ.</li><li><b>D. ✓</b> ASG co giãn tầng ứng dụng, Aurora Serverless v2 tự động co giãn DB theo tải, tương thích MySQL, có Multi-AZ HA — đúng mọi tiêu chí.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> RDS Multi-AZ 'nghe' đã đủ high-availability nhưng thiếu khả năng auto-scaling compute mà đề yêu cầu.</p>","tip":"<p>Cần auto-scaling cho cả web tier VÀ database tier, vẫn giữ MySQL-compatible → EC2 Auto Scaling + Aurora Serverless v2 (không phải RDS Provisioned thường).</p>"},{"id":44,"topic":"Design Secure Architectures – ASG + ALB + AWS WAF","supplement":false,"stem":"A SaaS company is modernizing one of its legacy web applications by migrating it to AWS. The company aims to improve the availability of the application during both normal and peak traffic periods. Additionally, the company wants to implement protection against common web exploits and malicious traffic. The architecture must be scalable and integrate AWS WAF to secure incoming traffic.<br>Which solution will best meet these requirements with high availability and minimal configuration complexity?","options":[{"html":"Launch two EC2 instances in separate Availability Zones and register them as targets of an Application Load Balancer. Associate the ALB with AWS WAF to filter incoming traffic","correct":false},{"html":"Launch EC2 instances in a single Availability Zone and configure AWS Global Accelerator to route traffic to the instances. Attach AWS WAF to Global Accelerator for application protection","correct":false},{"html":"Deploy the application on multiple Amazon EC2 instances in an Auto Scaling group that spans two Availability Zones. Place an Application Load Balancer (ALB) in front of the group. Associate AWS WAF with the ALB","correct":true},{"html":"Create an Auto Scaling group with EC2 instances in multiple Availability Zones. Attach a Network Load Balancer (NLB) to distribute incoming traffic. Integrate AWS WAF directly with the Auto Scaling group for traffic filtering","correct":false}],"multi":1,"analysis":"<p>WAF chỉ tích hợp được với một số dịch vụ cụ thể (ALB, không phải NLB/ASG)</p>","answer":"<p>ASG đa AZ cho scale và availability, ALB là nơi WAF có thể gắn trực tiếp để lọc traffic lớp 7 — đúng combo đầy đủ nhất.</p>","explain":"<ul><li><b>A. ✗</b> Không có Auto Scaling nên không co giãn được theo tải, phải quản lý thủ công số lượng instance.</li><li><b>B. ✗</b> Chỉ 1 AZ là single point of failure, không đạt yêu cầu high availability.</li><li><b>C. ✓</b> ASG đa AZ co giãn tự động, ALB hỗ trợ routing lớp 7, WAF gắn trực tiếp vào ALB — đáp ứng đủ cả scale, HA và bảo mật.</li><li><b>D. ✗</b> AWS WAF KHÔNG hỗ trợ gắn trực tiếp vào NLB hay Auto Scaling group — chỉ hỗ trợ ALB, API Gateway, CloudFront, App Runner, Global Accelerator.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Gắn WAF 'trực tiếp vào ASG' hay NLB nghe hợp lý về mặt ý tưởng nhưng đơn giản là không được AWS hỗ trợ kỹ thuật.</p>","tip":"<p>AWS WAF chỉ tích hợp với ALB, API Gateway, CloudFront, AppSync, App Runner, Cognito, Verified Access, Global Accelerator — KHÔNG BAO GIỜ với NLB hay trực tiếp Auto Scaling Group.</p>"},{"id":45,"topic":"Design Secure Architectures – IAM Permission Boundary","supplement":false,"stem":"You have a team of developers in your company, and you would like to ensure they can quickly experiment with AWS Managed Policies by attaching them to their accounts, but you would like to prevent them from doing an escalation of privileges, by granting themselves the AdministratorAccess managed policy. How should you proceed?","options":[{"html":"Put the developers into an IAM group, and then define an IAM permission boundary on the group that will restrict the managed policies they can attach to themselves","correct":false},{"html":"For each developer, define an IAM permission boundary that will restrict the managed policies they can attach to themselves","correct":true},{"html":"Create a Service Control Policy (SCP) on your AWS account that restricts developers from attaching themselves the AdministratorAccess policy","correct":false},{"html":"Attach an IAM policy to your developers, that prevents them from attaching the AdministratorAccess policy","correct":false}],"multi":1,"analysis":"<p>Phân biệt permission boundary (áp cho User/Role) với SCP (áp cho Organization) và với policy thường (có thể tự gỡ)</p>","answer":"<p>Permission boundary là cơ chế duy nhất giới hạn trần quyền tối đa của user mà chính user đó không thể tự vượt qua bằng cách gắn thêm policy.</p>","explain":"<ul><li><b>A. ✗</b> Permission boundary KHÔNG áp dụng được cho IAM Group, chỉ áp dụng cho User hoặc Role.</li><li><b>B. ✓</b> Đặt permission boundary cho từng IAM user giới hạn permission tối đa mà chính sách gắn thêm có thể cấp, kể cả AdministratorAccess.</li><li><b>C. ✗</b> SCP chỉ dùng được khi có AWS Organizations — đề bài không đề cập Organizations nên không áp dụng được.</li><li><b>D. ✗</b> IAM policy thông thường gắn cho user có thể bị chính user đó tự gỡ bỏ để leo thang quyền.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> SCP nghe như công cụ 'rào chắn' mạnh nhất nhưng chỉ hoạt động trong AWS Organizations — không áp dụng được khi không có Organizations.</p>","tip":"<p>Giới hạn trần quyền tối đa cho 1 user/role cụ thể, không cho tự leo thang → Permission Boundary (chỉ gắn được cho User/Role, KHÔNG gắn được cho Group).</p>"},{"id":46,"topic":"Design Cost-Optimized Architectures – EC2 Spot Fleet","supplement":false,"stem":"Your company has a monthly big data workload, running for about 2 hours, which can be efficiently distributed across multiple servers of various sizes, with a variable number of CPUs. The solution for the workload should be able to withstand server failures.<br>Which is the MOST cost-optimal solution for this workload?","options":[{"html":"Run the workload on Spot Instances","correct":false},{"html":"Run the workload on a Spot Fleet","correct":true},{"html":"Run the workload on Reserved Instances (RI)","correct":false},{"html":"Run the workload on Dedicated Hosts","correct":false}],"multi":1,"analysis":"<p>Batch job ngắn hạn, linh hoạt về loại instance, chịu được gián đoạn, cần tự thay thế khi mất capacity</p>","answer":"<p>Spot Fleet tự động chọn pool rẻ nhất và duy trì target capacity bằng cách thay thế instance bị thu hồi — đúng đặc tính workload hàng tháng, đa dạng kích cỡ server.</p>","explain":"<ul><li><b>A. ✗</b> Spot Instance đơn lẻ phải tự chọn trước 1 loại instance, không tự thay thế khi bị thu hồi.</li><li><b>B. ✓</b> Spot Fleet tự chọn pool rẻ nhất trong nhiều loại instance và tự launch thay thế khi Spot bị chấm dứt — đúng cho tải biến động, chịu gián đoạn, chạy ngắn hạn mỗi tháng.</li><li><b>C. ✗</b> RI tối ưu cho tải chạy liên tục, không hợp với workload chỉ chạy 2 giờ/tháng.</li><li><b>D. ✗</b> Dedicated Host đắt, dùng cho mục đích compliance/license, không liên quan tới tối ưu chi phí batch job ngắn hạn.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Spot Instance (số ít) nghe rẻ tương đương nhưng thiếu khả năng TỰ DUY TRÌ capacity khi bị thu hồi như Spot Fleet.</p>","tip":"<p>Workload chạy ngắn hạn, linh hoạt instance type, cần tự thay thế khi Spot bị thu hồi → Spot Fleet, không phải mua lẻ Spot Instance.</p>"},{"id":47,"topic":"Design Cost-Optimized Architectures – S3 Event + SQS + Lambda Processing","supplement":false,"stem":"A mobile app allows users to submit photos, which are stored in an Amazon S3 bucket. Currently, a batch of Amazon EC2 Spot Instances is launched nightly to process all the day’s uploads. Each photo requires approximately 3 minutes and 512 MB of memory to process. To improve responsiveness and minimize costs, the company wants to shift to near real-time image processing that begins as soon as an image is uploaded.<br>Which solution will provide the MOST cost-effective and scalable architecture to meet these new requirements?","options":[{"html":"Enable S3 event notifications to invoke an Amazon EventBridge rule. Configure an AWS Step Functions workflow to initiate an Fargate task in Amazon ECS to process the image","correct":false},{"html":"Configure S3 to trigger an AWS App Runner service directly. Deploy a containerized image-processing application to App Runner to automatically process each upload","correct":false},{"html":"Set up Amazon S3 to push events to an Amazon SQS queue. Launch a single EC2 Reserved Instance that continuously polls the queue and processes each image upon receipt","correct":false},{"html":"Configure Amazon S3 to send event notifications to an Amazon SQS queue each time a photo is uploaded. Set up an AWS Lambda function to poll the queue and process images asynchronously","correct":true}],"multi":1,"analysis":"<p>Xử lý sự kiện theo yêu cầu (pay-per-use), tránh tài nguyên 'luôn bật' khi tải không liên tục</p>","answer":"<p>SQS và Lambda chỉ tính phí khi có message thực sự, phù hợp tải thưa và tác vụ ngắn (vài phút, dưới giới hạn Lambda).</p>","explain":"<ul><li><b>A. ✗</b> Step Functions + Fargate task thêm nhiều thành phần quản lý không cần thiết cho tác vụ xử lý ảnh đơn giản, ngắn (khoảng 3 phút).</li><li><b>B. ✗</b> App Runner không nhận event trực tiếp từ S3, cần thêm trung gian (SQS/EventBridge); lại giữ container 'ấm' liên tục gây tốn chi phí không cần thiết cho tải thưa.</li><li><b>C. ✗</b> EC2 Reserved Instance chạy liên tục dù có tải hay không — tốn chi phí nền ngay cả lúc nhàn rỗi.</li><li><b>D. ✓</b> S3 event → SQS đệm → Lambda xử lý theo yêu cầu, trả tiền theo lượt gọi, không tốn chi phí khi không có upload.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Dùng EC2 Reserved Instance 'đứng chờ' nghe hợp lý để xử lý real-time nhưng gây chi phí cố định ngay cả khi không có ảnh nào tới.</p>","tip":"<p>Xử lý sự kiện ngắn, tải không đều, cần rẻ nhất → S3 Event → SQS (đệm) → Lambda (pay-per-use); tránh compute 'luôn bật' (EC2/App Runner warm container) khi không cần.</p>"},{"id":48,"topic":"Design Resilient Architectures – Aurora Automated Backup Restore (Dev DB)","supplement":false,"stem":"A media company is migrating its flagship application from its on-premises data center to AWS for improving the application's read-scaling capability as well as its availability. The existing architecture leverages a Microsoft SQL Server database that sees a heavy read load. The engineering team does a full copy of the production database at the start of the business day to populate a dev database. During this period, application users face high latency leading to a bad user experience.<br>The company is looking at alternate database options and migrating database engines if required. What would you suggest?","options":[{"html":"Leverage Amazon RDS for MySQL with a Multi-AZ deployment and use the standby instance as the dev database","correct":false},{"html":"Leverage Amazon RDS for SQL server with a Multi-AZ deployment and read replicas. Use the read replica as the dev database","correct":false},{"html":"Leverage Amazon Aurora MySQL with Multi-AZ Aurora Replicas and create the dev database by restoring from the automated backups of Amazon Aurora","correct":true},{"html":"Leverage Amazon Aurora MySQL with Multi-AZ Aurora Replicas and restore the dev database via mysqldump","correct":false}],"multi":1,"analysis":"<p>Tạo bản sao dev database MÀ KHÔNG tạo thêm tải lên production đang phục vụ người dùng</p>","answer":"<p>Restore từ automated backup của Aurora tạo DB mới hoàn toàn độc lập, không đọc trực tiếp từ production, loại bỏ hẳn tải gây latency.</p>","explain":"<ul><li><b>A. ✗</b> Standby instance trong Multi-AZ không thể truy cập trực tiếp để dùng làm database dev.</li><li><b>B. ✗</b> Read replica chỉ phục vụ đọc, không hỗ trợ ghi — không thể dùng làm database dev (cần ghi để test).</li><li><b>C. ✓</b> Restore từ automated backup của Aurora tạo 1 database dev độc lập mà KHÔNG gây tải lên database production trong lúc tạo.</li><li><b>D. ✗</b> mysqldump phải đọc toàn bộ dữ liệu từ database production đang chạy, vẫn gây tải I/O lớn như vấn đề ban đầu.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> mysqldump nghe như cách 'copy dữ liệu' thông thường nhưng vẫn phải quét toàn bộ production DB, tái tạo đúng vấn đề ban đầu.</p>","tip":"<p>Cần bản sao độc lập (ghi được) của database mà không ảnh hưởng production đang chạy → restore từ automated backup/snapshot, không dùng read replica/standby (chỉ đọc) hay mysqldump (vẫn tải production).</p>"},{"id":49,"topic":"Design High-Performing Architectures – Amazon EFS Performance Modes","supplement":false,"stem":"An analytics company wants to improve the performance of its big data processing workflows running on Amazon Elastic File System (Amazon EFS). Which of the following performance modes should be used for Amazon EFS to address this requirement?","options":[{"html":"Max I/O","correct":true},{"html":"Provisioned Throughput","correct":false},{"html":"General Purpose","correct":false},{"html":"Bursting Throughput","correct":false}],"multi":1,"analysis":"<p>Phân biệt 'Performance Mode' (General Purpose/Max I/O) với 'Throughput Mode' (Bursting/Provisioned) của EFS</p>","answer":"<p>Max I/O là performance mode duy nhất tối ưu cho khối lượng công việc xử lý song song cực lớn như big data, đánh đổi lấy độ trễ metadata hơi cao hơn.</p>","explain":"<ul><li><b>A. ✓</b> Max I/O tối ưu cho throughput/operations-per-second tổng hợp cực cao, phù hợp workload song song mạnh như big data.</li><li><b>B. ✗</b> Provisioned Throughput là THROUGHPUT MODE, không phải performance mode — nhầm khái niệm.</li><li><b>C. ✗</b> General Purpose tối ưu độ trễ thấp cho tải thông thường, không phải cho scale song song cực lớn.</li><li><b>D. ✗</b> Bursting Throughput cũng là THROUGHPUT MODE, không phải performance mode.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Provisioned/Bursting Throughput nghe như 'hiệu năng cao' nhưng thuộc một trục cấu hình KHÁC (throughput mode) với câu hỏi (performance mode).</p>","tip":"<p>EFS có 2 trục cấu hình độc lập: Performance mode (General Purpose/Max I/O) và Throughput mode (Bursting/Provisioned) — đừng nhầm lẫn giữa 2 trục này.</p>"},{"id":50,"topic":"Design Secure Architectures – IAM Policy S3 Bucket/Object ARN","supplement":false,"stem":"Which of the following IAM policies provides read-only access to the Amazon S3 bucket mybucket and its content?","options":[{"html":"<pre class=\"code\">{\n   &quot;Version&quot;:&quot;2012-10-17&quot;,\n   &quot;Statement&quot;:[\n      {\n         &quot;Effect&quot;:&quot;Allow&quot;,\n         &quot;Action&quot;:[\n            &quot;s3:ListBucket&quot;\n         ],\n         &quot;Resource&quot;:&quot;arn:aws:s3:::mybucket/*&quot;\n      },\n      {\n         &quot;Effect&quot;:&quot;Allow&quot;,\n         &quot;Action&quot;:[\n            &quot;s3:GetObject&quot;\n         ],\n         &quot;Resource&quot;:&quot;arn:aws:s3:::mybucket&quot;\n      }\n   ]\n}</pre>","correct":false},{"html":"<pre class=\"code\">{\n   &quot;Version&quot;:&quot;2012-10-17&quot;,\n   &quot;Statement&quot;:[\n      {\n         &quot;Effect&quot;:&quot;Allow&quot;,\n         &quot;Action&quot;:[\n            &quot;s3:ListBucket&quot;\n         ],\n         &quot;Resource&quot;:&quot;arn:aws:s3:::mybucket&quot;\n      },\n      {\n         &quot;Effect&quot;:&quot;Allow&quot;,\n         &quot;Action&quot;:[\n            &quot;s3:GetObject&quot;\n         ],\n         &quot;Resource&quot;:&quot;arn:aws:s3:::mybucket/*&quot;\n      }\n   ]\n}</pre>","correct":true},{"html":"<pre class=\"code\">{\n   &quot;Version&quot;:&quot;2012-10-17&quot;,\n   &quot;Statement&quot;:[\n      {\n         &quot;Effect&quot;:&quot;Allow&quot;,\n         &quot;Action&quot;:[\n            &quot;s3:ListBucket&quot;,\n            &quot;s3:GetObject&quot;\n         ],\n         &quot;Resource&quot;:&quot;arn:aws:s3:::mybucket&quot;\n      }\n   ]\n}</pre>","correct":false},{"html":"<pre class=\"code\">{\n   &quot;Version&quot;:&quot;2012-10-17&quot;,\n   &quot;Statement&quot;:[\n      {\n         &quot;Effect&quot;:&quot;Allow&quot;,\n         &quot;Action&quot;:[\n            &quot;s3:ListBucket&quot;,\n            &quot;s3:GetObject&quot;\n         ],\n         &quot;Resource&quot;:&quot;arn:aws:s3:::mybucket/*&quot;\n      }\n   ]\n}</pre>","correct":false}],"multi":1,"analysis":"<p>Phân biệt đúng ARN resource cho hành động cấp BUCKET (không /*) và cấp OBJECT (có /*)</p>","answer":"<p>s3:ListBucket là hành động ở cấp bucket nên ARN không có hậu tố /*, còn s3:GetObject là hành động ở cấp object nên ARN bắt buộc có /*.</p>","explain":"<ul><li><b>A. ✗</b> Resource bị đảo ngược — ListBucket phải trỏ vào chính bucket (không có /*), GetObject phải trỏ vào object (có /*).</li><li><b>B. ✓</b> Đúng chuẩn — ListBucket áp cho ARN bucket (không /*), GetObject áp cho ARN object (có /*).</li><li><b>C. ✗</b> Chỉ cấp quyền trên bucket, không có quyền đọc NỘI DUNG từng object bên trong.</li><li><b>D. ✗</b> Chỉ cấp quyền trên object, thiếu quyền liệt kê (ListBucket) chính bucket.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Lựa chọn đầu tiên nhìn gần giống đáp án đúng nhưng ĐẢO NGƯỢC resource cho 2 action — bẫy kinh điển của câu hỏi IAM ARN.</p>","tip":"<p>Quy tắc bất biến: s3:ListBucket → Resource luôn là bucket ARN (không /*). s3:GetObject/PutObject → Resource luôn là bucket ARN kèm /* (có /*).</p>"},{"id":51,"topic":"Design Cost-Optimized Architectures – AWS Snowball + S3 Lifecycle to Glacier Deep Archive","supplement":false,"stem":"You would like to use AWS Snowball to move on-premises backups into a long term archival tier on AWS. Which solution provides the MOST cost savings?","options":[{"html":"Create an AWS Snowball job and target a Amazon S3 Glacier Vault","correct":false},{"html":"Create an AWS Snowball job and target an Amazon S3 bucket. Create a lifecycle policy to transition this data to Amazon S3 Glacier on the same day","correct":false},{"html":"Create an AWS Snowball job and target an Amazon S3 bucket. Create a lifecycle policy to transition this data to Amazon S3 Glacier Deep Archive on the same day","correct":true},{"html":"Create a AWS Snowball job and target an Amazon S3 Glacier Deep Archive Vault","correct":false}],"multi":1,"analysis":"<p>Snowball luôn đổ dữ liệu vào S3 trước — không có đường tắt thẳng tới Glacier Vault</p>","answer":"<p>Lifecycle policy 0-day chuyển ngay data từ S3 sang Glacier Deep Archive (rẻ nhất), tránh bị tính phí S3 Standard dù chỉ trong thời gian ngắn.</p>","explain":"<ul><li><b>A. ✗</b> Snowball không thể target trực tiếp 1 Glacier Vault — luôn phải đi qua S3 trước.</li><li><b>B. ✗</b> Glacier (thường) đắt hơn Glacier Deep Archive cho mục đích lưu trữ dài hạn — chưa tối ưu nhất.</li><li><b>C. ✓</b> Snowball nạp vào S3, lifecycle rule 0-day chuyển ngay sang Glacier Deep Archive — tránh phí S3 Standard và đạt mức giá rẻ nhất.</li><li><b>D. ✗</b> Tương tự lựa chọn đầu tiên — không thể target trực tiếp vào vault Glacier Deep Archive bằng Snowball.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Hai lựa chọn 'Snowball target thẳng vào Glacier Vault' nghe như đường tắt hợp lý nhưng đây không phải cách Snowball hoạt động.</p>","tip":"<p>AWS Snowball luôn nạp dữ liệu vào Amazon S3; muốn archive dài hạn rẻ nhất, dùng lifecycle policy 0-day chuyển ngay sang S3 Glacier Deep Archive.</p>"},{"id":52,"topic":"Design Resilient Architectures – AWS Global Accelerator Blue/Green Deployment","supplement":false,"stem":"A retail company wants to rollout and test a blue-green deployment for its global application in the next 48 hours. Most of the customers use mobile phones which are prone to Domain Name System (DNS) caching. The company has only two days left for the annual Thanksgiving sale to commence.<br>As a Solutions Architect, which of the following options would you recommend to test the deployment on as many users as possible in the given time frame?","options":[{"html":"Use Elastic Load Balancing (ELB) to distribute traffic across deployments","correct":false},{"html":"Use AWS CodeDeploy deployment options to choose the right deployment","correct":false},{"html":"Use Amazon Route 53 weighted routing to spread traffic across different deployments","correct":false},{"html":"Use AWS Global Accelerator to distribute a portion of traffic to a particular deployment","correct":true}],"multi":1,"analysis":"<p>Chuyển traffic nhanh, kiểm soát được, không phụ thuộc DNS caching của client (đặc biệt là mobile)</p>","answer":"<p>Global Accelerator điều hướng ở tầng network (IP tĩnh), thay đổi endpoint weight có hiệu lực ngay, không bị trì hoãn bởi TTL/DNS cache như Route 53.</p>","explain":"<ul><li><b>A. ✗</b> ELB không hoạt động xuyên Region nên không phù hợp cho ứng dụng toàn cầu.</li><li><b>B. ✗</b> CodeDeploy quản lý quy trình deploy, không phải cơ chế phân phối traffic theo tỉ lệ.</li><li><b>C. ✗</b> Route 53 dựa vào DNS, bị ảnh hưởng nặng bởi DNS caching trên thiết bị di động — không kiểm soát được tốc độ chuyển traffic.</li><li><b>D. ✓</b> Global Accelerator dùng IP tĩnh anycast, thay đổi tỉ lệ traffic có hiệu lực trong vài giây, không bị DNS cache cản trở.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Route 53 weighted routing là phản xạ quen thuộc cho blue/green nhưng bị chính đặc điểm DNS caching (nêu rõ trong đề) làm chậm việc chuyển traffic trên thiết bị di động.</p>","tip":"<p>Khi đề nhấn mạnh 'DNS caching là vấn đề' cho blue/green deployment toàn cầu → chọn Global Accelerator (network layer) thay vì Route 53 (DNS layer).</p>"},{"id":53,"topic":"Design Resilient Architectures – RDS Storage Auto Scaling","supplement":false,"stem":"A company has recently launched a new mobile gaming application that the users are adopting rapidly. The company uses Amazon RDS MySQL as the database. The engineering team wants an urgent solution to this issue where the rapidly increasing workload might exceed the available database storage.<br>As a solutions architect, which of the following solutions would you recommend so that it requires minimum development and systems administration effort to address this requirement?","options":[{"html":"Migrate Amazon RDS MySQL database to Amazon DynamoDB which automatically allocates storage space when required","correct":false},{"html":"Enable storage auto-scaling for Amazon RDS MySQL","correct":true},{"html":"Migrate RDS MySQL database to Amazon Aurora which offers storage auto-scaling","correct":false},{"html":"Create read replica for Amazon RDS MySQL","correct":false}],"multi":1,"analysis":"<p>Ưu tiên bật tính năng có sẵn trên hạ tầng hiện tại thay vì di chuyển sang engine/dịch vụ khác</p>","answer":"<p>Bật storage auto-scaling ngay trên RDS MySQL hiện có giải quyết đúng vấn đề (sắp hết dung lượng) mà không cần migrate gì cả.</p>","explain":"<ul><li><b>A. ✗</b> Đổi sang DynamoDB (NoSQL) đòi hỏi viết lại toàn bộ logic ứng dụng — không phải giải pháp 'ít công sức nhất'.</li><li><b>B. ✓</b> Chỉ cần bật 1 tính năng có sẵn của RDS, tự động tăng dung lượng khi gần đầy — ít thao tác nhất.</li><li><b>C. ✗</b> Aurora có auto-scaling storage nhưng việc MIGRATE engine tốn nhiều công sức vận hành hơn hẳn so với bật 1 tính năng trên RDS hiện tại.</li><li><b>D. ✗</b> Read replica giải quyết vấn đề đọc, không liên quan đến việc hết dung lượng lưu trữ.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Aurora 'cũng có auto-scaling storage' đúng nhưng đòi hỏi di chuyển engine — tốn công hơn nhiều so với bật 1 toggle có sẵn.</p>","tip":"<p>Khi RDS sắp hết dung lượng lưu trữ và cần giải pháp ít công sức nhất → bật Storage Auto Scaling ngay trên instance hiện tại, không cần đổi engine.</p>"},{"id":54,"topic":"Design Secure Architectures – S3 Cross-Region Replication with KMS Multi-Region Key","supplement":false,"stem":"A company has historically operated only in the us-east-1 region and stores encrypted data in Amazon S3 using SSE-KMS. As part of enhancing its security posture as well as improving the backup and recovery architecture, the company wants to store the encrypted data in Amazon S3 that is replicated into the us-west-1 AWS region. The security policies mandate that the data must be encrypted and decrypted using the same key in both AWS regions.<br>Which of the following represents the best solution to address these requirements?","options":[{"html":"Change the AWS KMS single region key used for the current Amazon S3 bucket into an AWS KMS multi-region key. Enable Amazon S3 batch replication for the existing data in the current bucket in us-east-1 region into another bucket in us-west-1 region","correct":false},{"html":"Create an Amazon CloudWatch scheduled rule to invoke an AWS Lambda function to copy the daily data from the source bucket in us-east-1 region to the destination bucket in us-west-1 region. Provide AWS KMS key access to the AWS Lambda function for encryption and decryption operations on the data in the source and destination Amazon S3 buckets","correct":false},{"html":"Create a new Amazon S3 bucket in the us-east-1 region with replication enabled from this new bucket into another bucket in us-west-1 region. Enable SSE-KMS encryption on the new bucket in us-east-1 region by using an AWS KMS multi-region key. Copy the existing data from the current Amazon S3 bucket in us-east-1 region into this new Amazon S3 bucket in us-east-1 region","correct":true},{"html":"Enable replication for the current bucket in us-east-1 region into another bucket in us-west-1 region. Share the existing AWS KMS key from us-east-1 region to us-west-1 region","correct":false}],"multi":1,"analysis":"<p>Nhận biết 2 giới hạn kỹ thuật thật của KMS: không convert single-region thành multi-region key, không share key xuyên Region</p>","answer":"<p>Chỉ có cách tạo bucket mới với multi-region KMS key NGAY TỪ ĐẦU mới đáp ứng được yêu cầu dùng chung đúng 1 key vật lý ở cả 2 Region.</p>","explain":"<ul><li><b>A. ✗</b> KHÔNG THỂ chuyển đổi 1 single-region KMS key đã tồn tại thành multi-region key — đây là giới hạn kỹ thuật thật của KMS.</li><li><b>B. ✗</b> Lambda copy dữ liệu THEO NGÀY gây mất dữ liệu đáng kể nếu có sự cố, lại tốn công phát triển pipeline riêng.</li><li><b>C. ✓</b> Tạo bucket mới dùng multi-region KMS key ngay từ đầu, replicate sang us-west-1, rồi copy lại dữ liệu cũ vào bucket mới — đáp ứng đúng yêu cầu dùng chung 1 key ở cả 2 Region.</li><li><b>D. ✗</b> KHÔNG THỂ 'share' (chia sẻ) một KMS key sang Region khác — key vật lý bị giới hạn trong 1 Region trừ khi là multi-region key được tạo đúng cách.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Hai lựa chọn còn lại dựa trên giả định SAI về khả năng của KMS (convert key hiện có, hoặc share key sang Region khác) — đều là giới hạn kỹ thuật không thể vượt qua.</p>","tip":"<p>KMS: không thể convert single-region key thành multi-region key sau khi tạo; không thể 'share' 1 key vật lý sang Region khác — chỉ multi-region key (tạo đúng từ đầu) mới dùng chung được giữa các Region.</p>"},{"id":55,"topic":"Design Cost-Optimized Architectures – Auto Scaling Group Default Termination Policy","supplement":false,"stem":"Amazon EC2 Auto Scaling needs to terminate an instance from Availability Zone (AZ) us-east-1a as it has the most number of instances amongst the Availability Zone (AZs) being used currently. There are 4 instances in the Availability Zone (AZ) us-east-1a like so: Instance A has the oldest launch template, Instance B has the oldest launch configuration, Instance C has the newest launch configuration and Instance D is closest to the next billing hour.<br>Which of the following instances would be terminated per the default termination policy?","options":[{"html":"Instance B","correct":true},{"html":"Instance D","correct":false},{"html":"Instance A","correct":false},{"html":"Instance C","correct":false}],"multi":1,"analysis":"<p>Áp đúng THỨ TỰ ưu tiên của default termination policy: allocation strategy → oldest launch template (nếu không có launch config) → oldest launch config → closest to billing hour</p>","answer":"<p>Trong 4 instance, chỉ Instance B có 'oldest launch configuration' — đúng tiêu chí ưu tiên thứ hai khi có instance dùng launch configuration.</p>","explain":"<ul><li><b>A. ✓</b> Đúng — ưu tiên thứ hai trong default termination policy là 'oldest launch configuration' (sau khi loại trừ launch template).</li><li><b>B. ✗</b> 'Closest to next billing hour' là tiêu chí ưu tiên CUỐI CÙNG, chỉ dùng để phá vỡ hoà (tie-break), không áp dụng ở đây.</li><li><b>C. ✗</b> Instance A có launch template cũ nhất, nhưng tiêu chí 'oldest launch template' chỉ áp dụng khi KHÔNG CÓ instance dùng launch configuration — nên A bị loại khỏi vòng xét này.</li><li><b>D. ✗</b> Instance C có launch configuration MỚI NHẤT — ngược hẳn với tiêu chí 'oldest' nên không bị chọn.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Instance A (launch template cũ nhất) dễ bị chọn nhầm nếu không nhớ rằng tiêu chí 'oldest launch template' chỉ áp dụng khi KHÔNG tồn tại instance dùng launch configuration.</p>","tip":"<p>Default termination policy của ASG có thứ tự cố định: (1) allocation strategy, (2) oldest launch template hoặc oldest launch configuration — ưu tiên launch configuration nếu tồn tại, (3) gần đến giờ tính tiền nhất (tie-break cuối cùng).</p>"},{"id":56,"topic":"Design Cost-Optimized Architectures – EC2 RI + On-Demand + Spot Mix (Steady State)","supplement":false,"stem":"An application runs big data workloads on Amazon Elastic Compute Cloud (Amazon EC2) instances. The application runs 24x7 all round the year and needs at least 20 instances to maintain a minimum acceptable performance threshold and the application needs 300 instances to handle spikes in the workload. Based on historical workloads processed by the application, it needs 80 instances 80% of the time.<br>As a solutions architect, which of the following would you recommend as the MOST cost-optimal solution so that it can meet the workload demand in a steady state?","options":[{"html":"Purchase 80 reserved instances (RIs). Provision additional on-demand and spot instances per the workload demand (Use Auto Scaling Group with launch template to provision the mix of on-demand and spot instances)","correct":true},{"html":"Purchase 80 spot instances. Use Auto Scaling Group to provision the remaining instances as on-demand instances per the workload demand","correct":false},{"html":"Purchase 80 on-demand instances. Provision additional on-demand and spot instances per the workload demand (Use Auto Scaling Group with launch template to provision the mix of on-demand and spot instances)","correct":false},{"html":"Purchase 20 on-demand instances. Use Auto Scaling Group to provision the remaining instances as spot instances per the workload demand","correct":false}],"multi":1,"analysis":"<p>Mua RI đúng theo mức SỬ DỤNG ỔN ĐỊNH THỰC TẾ (80, dùng 80% thời gian), không phải mức tối thiểu tuyệt đối (20) hay mức đỉnh (300)</p>","answer":"<p>RI tối ưu nhất khi mua đúng bằng mức baseline thực sự được dùng thường xuyên (80 instance, 80% thời gian), phần biến động còn lại linh hoạt dùng Spot/On-Demand.</p>","explain":"<ul><li><b>A. ✓</b> 80 instance là mức sử dụng ổn định 80% thời gian nên mua RI cho phần này; phần biến động dùng kết hợp On-Demand/Spot qua ASG.</li><li><b>B. ✗</b> Spot cho baseline 80 instance luôn-cần là rủi ro — Spot có thể bị thu hồi bất cứ lúc nào, không đảm bảo mức tối thiểu 20 instance luôn cần.</li><li><b>C. ✗</b> Dùng On-Demand cho baseline 80 instance đắt hơn nhiều so với RI cho cùng mức sử dụng ổn định.</li><li><b>D. ✗</b> Chỉ mua RI cho 20 instance (mức tối thiểu tuyệt đối) trong khi mức sử dụng thực tế ổn định là 80 — bỏ lỡ phần lớn cơ hội tiết kiệm từ RI.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Dễ nhầm giữa 'mức tối thiểu luôn cần' (20) và 'mức dùng ổn định phần lớn thời gian' (80) — đề cho 2 con số khác nhau để kiểm tra đúng cách đọc dữ kiện.</p>","tip":"<p>Mua Reserved Instance/Savings Plans theo mức SỬ DỤNG ỔN ĐỊNH THỰC TẾ qua phân tích lịch sử (ví dụ '80% thời gian cần 80 instance'), không phải theo mức tối thiểu kỹ thuật hay mức đỉnh tải.</p>"},{"id":57,"topic":"Design Secure Architectures – Cognito User Pools + ALB Authentication","supplement":false,"stem":"A social media application is hosted on an Amazon EC2 fleet running behind an Application Load Balancer. The application traffic is fronted by an Amazon CloudFront distribution. The engineering team wants to decouple the user authentication process for the application, so that the application servers can just focus on the business logic.<br>As a Solutions Architect, which of the following solutions would you recommend to the development team so that it requires minimal development effort?","options":[{"html":"Use Amazon Cognito Authentication via Cognito Identity Pools for your Amazon CloudFront distribution","correct":false},{"html":"Use Amazon Cognito Authentication via Cognito User Pools for your Amazon CloudFront distribution","correct":false},{"html":"Use Amazon Cognito Authentication via Cognito User Pools for your Application Load Balancer","correct":true},{"html":"Use Amazon Cognito Authentication via Cognito Identity Pools for your Application Load Balancer","correct":false}],"multi":1,"analysis":"<p>ALB có authentication action tích hợp sẵn với Cognito User Pools; CloudFront thì không (phải tự code Lambda@Edge)</p>","answer":"<p>ALB hỗ trợ native integration với Cognito User Pools qua authenticate action trên listener rule — không cần viết thêm code.</p>","explain":"<ul><li><b>A. ✗</b> Identity Pools dùng để cấp AWS credential tạm thời, không phải để xác thực người dùng ứng dụng.</li><li><b>B. ✗</b> CloudFront không tích hợp trực tiếp với Cognito User Pools — phải tự viết Lambda@Edge, tốn công phát triển.</li><li><b>C. ✓</b> ALB có tính năng authenticate action tích hợp sẵn với Cognito User Pools — không cần code thêm.</li><li><b>D. ✗</b> Identity Pools không dùng để xác thực người dùng ứng dụng theo cách này.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Nhầm lẫn Identity Pools (cấp credential AWS) với User Pools (xác thực người dùng ứng dụng) là lỗi khái niệm phổ biến nhất của Cognito.</p>","tip":"<p>Xác thực NGƯỜI DÙNG ứng dụng (login) → User Pools. Cấp CREDENTIAL AWS tạm thời (ví dụ truy cập S3 trực tiếp từ app) → Identity Pools. ALB tích hợp User Pools sẵn có; CloudFront thì không.</p>"},{"id":58,"topic":"Design Secure Architectures – AWS WAF IP Match Condition","supplement":false,"stem":"To improve the performance and security of the application, the engineering team at a company has created an Amazon CloudFront distribution with an Application Load Balancer as the custom origin. The team has also set up an AWS Web Application Firewall (AWS WAF) with Amazon CloudFront distribution. The security team at the company has noticed a surge in malicious attacks from a specific IP address to steal sensitive data stored on the Amazon EC2 instances.<br>As a solutions architect, which of the following actions would you recommend to stop the attacks?","options":[{"html":"Create a deny rule for the malicious IP in the network access control list (network ACL) associated with each of the instances","correct":false},{"html":"Create a ticket with AWS support to take action against the malicious IP","correct":false},{"html":"Create a deny rule for the malicious IP in the Security Groups associated with each of the instances","correct":false},{"html":"Create an IP match condition in the AWS WAF to block the malicious IP address","correct":true}],"multi":1,"analysis":"<p>Chặn 1 IP cụ thể gây hại — đúng nơi (WAF ở biên) và đúng cơ chế (rule chỉ ALLOW của Security Group không làm được)</p>","answer":"<p>WAF có IP match condition để block trực tiếp theo địa chỉ IP, phù hợp hoàn toàn với yêu cầu chặn 1 IP cụ thể.</p>","explain":"<ul><li><b>A. ✗</b> NACL gắn vào SUBNET, không gắn trực tiếp vào từng instance như câu mô tả.</li><li><b>B. ✗</b> Bảo mật ứng dụng là trách nhiệm của khách hàng (shared responsibility), AWS không 'xử lý hộ' IP độc hại qua ticket.</li><li><b>C. ✗</b> Security Group KHÔNG hỗ trợ rule DENY — chỉ có ALLOW.</li><li><b>D. ✓</b> WAF cho phép tạo IP match condition để chặn trực tiếp địa chỉ IP cụ thể ngay tại biên (CloudFront/ALB).</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Security Group nghe như công cụ 'chặn IP' hợp lý nhất nhưng về bản chất chỉ hỗ trợ ALLOW rule, không có DENY rule.</p>","tip":"<p>Chặn traffic xấu theo IP/pattern ở biên ứng dụng → AWS WAF IP match condition. Đừng tìm 'deny rule' trong Security Group — nó không tồn tại (chỉ NACL mới có deny).</p>"},{"id":59,"topic":"Design Resilient Architectures – SQS Buffer for IoT Data Ingestion","supplement":false,"stem":"A wildlife research organization uses IoT-based motion sensors attached to thousands of migrating animals to monitor their movement across regions. Every few minutes, a sensor checks for significant movement and sends updated location data to a backend application running on Amazon EC2 instances spread across multiple Availability Zones in a single AWS Region. Recently, an unexpected surge in motion data overwhelmed the application, leading to lost location records with no mechanism to replay missed data. A solutions architect must redesign the ingestion mechanism to prevent future data loss and to minimize operational overhead.<br>What should the solutions architect do to meet these requirements?","options":[{"html":"Implement an AWS IoT Core rule to route location updates directly from each sensor to Amazon SNS. Configure the application to poll the SNS topic for new messages","correct":false},{"html":"Deploy an Amazon Data Firehose delivery stream to collect the motion data. Configure it to deliver data to an S3 bucket where the application scans and processes the files periodically","correct":false},{"html":"Set up a containerized service using Amazon ECS with an internal queue built into the application layer. Configure the motion sensors to send location updates directly to the container endpoints","correct":false},{"html":"Create an Amazon Simple Queue Service (Amazon SQS) queue to buffer the incoming location data. Configure the backend application to poll the queue and process messages","correct":true}],"multi":1,"analysis":"<p>Thêm lớp đệm (buffer) để decouple nguồn phát dữ liệu (nhiều sensor) khỏi tốc độ xử lý của backend</p>","answer":"<p>SQS hấp thụ traffic đột biến từ hàng nghìn sensor, backend xử lý theo nhịp của mình mà không làm rớt dữ liệu, có sẵn retry/DLQ.</p>","explain":"<ul><li><b>A. ✗</b> SNS là push-based, ỨNG DỤNG KHÔNG THỂ 'poll' 1 SNS topic — sai hoàn toàn về cơ chế hoạt động.</li><li><b>B. ✗</b> Firehose kèm quét file định kỳ trên S3 gây độ trễ và thiếu cơ chế retry cho từng message lẻ.</li><li><b>C. ✗</b> Tự xây queue trong ứng dụng ECS phải tự lo logic durability/retry — làm lại những gì SQS đã có sẵn, tăng overhead không cần thiết.</li><li><b>D. ✓</b> SQS đệm traffic đột biến, backend poll theo tốc độ xử lý của mình, built-in retry/DLQ — giải quyết đúng gốc rễ mất dữ liệu khi quá tải.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> SNS nghe như dịch vụ 'messaging' phù hợp nhưng là mô hình push/fan-out, ứng dụng không thể chủ động poll lấy message như với SQS.</p>","tip":"<p>Nguồn phát dữ liệu lớn, backend xử lý chậm hơn, cần tránh mất dữ liệu khi quá tải → thêm SQS làm bộ đệm (buffer), không dùng SNS (push, không buffer được theo kiểu poll).</p>"},{"id":60,"topic":"Design High-Performing Architectures – Route 53 Latency Routing + Aurora Read Replica","supplement":false,"stem":"A silicon valley based startup has a content management application with the web-tier running on Amazon EC2 instances and the database tier running on Amazon Aurora. Currently, the entire infrastructure is located in us-east-1 region. The startup has 90% of its customers in the US and Europe. The engineering team is getting reports of deteriorated application performance from customers in Europe with high application load time.<br>As a solutions architect, which of the following would you recommend addressing these performance issues? (Select two)","options":[{"html":"Setup another fleet of Amazon EC2 instances for the web tier in the eu-west-1 region. Enable failover routing policy in Amazon Route 53","correct":false},{"html":"Setup another fleet of Amazon EC2 instances for the web tier in the eu-west-1 region. Enable geolocation routing policy in Amazon Route 53","correct":false},{"html":"Create Amazon Aurora Multi-AZ standby instance in the eu-west-1 region","correct":false},{"html":"Create Amazon Aurora read replicas in the eu-west-1 region","correct":true},{"html":"Setup another fleet of Amazon EC2 instances for the web tier in the eu-west-1 region. Enable latency routing policy in Amazon Route 53","correct":true}],"multi":2,"analysis":"<p>Giảm latency cho người dùng ở xa bằng latency routing (đúng mục tiêu latency) kết hợp read replica tại chỗ (đưa dữ liệu gần người dùng)</p>","answer":"<p>Latency routing đưa traffic tới Region gần nhất về độ trễ, và read replica tại Region đó giúp truy vấn đọc không phải đi xuyên Đại Tây Dương.</p>","explain":"<ul><li><b>A. ✗</b> Failover routing dùng cho DR (chuyển sang bản dự phòng khi lỗi), không tối ưu latency.</li><li><b>B. ✗</b> Geolocation routing định tuyến theo VỊ TRÍ ĐỊA LÝ CỐ ĐỊNH, không đo/tối ưu độ trễ thực tế.</li><li><b>C. ✗</b> Aurora Multi-AZ chỉ tăng độ sẵn sàng (failover), KHÔNG giúp mở rộng khả năng đọc hay giảm latency đọc.</li><li><b>D. ✓</b> Aurora read replica ở eu-west-1 cho phép người dùng châu Âu đọc dữ liệu TẠI CHỖ, giảm độ trễ đáng kể.</li><li><b>E. ✓</b> Latency-based routing định tuyến người dùng tới Region có độ trễ THẤP NHẤT thực đo — đúng mục tiêu giảm load time.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Geolocation routing và Multi-AZ standby đều nghe liên quan đến 'đa Region'/'khác vùng' nhưng SAI mục tiêu — một cái định tuyến theo vị trí cố định (không phải latency), một cái chỉ phục vụ failover (không phục vụ đọc).</p>","tip":"<p>Giảm độ trễ cho user ở xa: Route 53 Latency-based routing (không phải Geolocation hay Failover) kết hợp đưa bản sao dữ liệu gần họ qua Read Replica (không phải Multi-AZ standby, vốn không phục vụ đọc).</p>"},{"id":61,"topic":"Design Resilient Architectures – Amazon EKS Fargate + Amazon MQ","supplement":false,"stem":"A financial services company runs a Kubernetes-based microservices application in its on-premises data center. The application uses the Advanced Message Queuing Protocol (AMQP) to interact with a messag
