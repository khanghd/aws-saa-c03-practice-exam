<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Test 2 · SAA-C03</title>
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#eef0f5; --text:#1a1d23; --muted:#646c78;
  --border:#dfe3ea; --accent:#3a5bf0; --accent-hover:#2d49d6; --accent-soft:#e8edfe;
  --ok:#1a8f55; --ok-soft:#e4f6ec; --bad:#d13b3b; --bad-soft:#fcebeb; --warn:#b4790a; --warn-soft:#fff3db;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
    --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
    --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
    --shadow:none; --shadow-sm:none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
  --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
  --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
  --shadow:none; --shadow-sm:none;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.65 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .2s ease,color .2s ease;
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);padding:.1em .4em;border-radius:5px}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 56px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
header.top h1{
  font-size:21px;margin:0;letter-spacing:-.015em;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent-hover));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
header.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:7px 14px;min-width:76px;text-align:center;box-shadow:var(--shadow-sm);transition:border-color .15s ease,transform .15s ease}
.stat:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hover));width:0;transition:width .3s ease}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:16px}
.toolbar select,.btn{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 13px;cursor:pointer;transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent}
.toolbar label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.layout{display:grid;grid-template-columns:264px 1fr;gap:18px;align-items:start}
.side{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;position:sticky;top:14px;box-shadow:var(--shadow)}
.side h2{font-size:12.5px;margin:0 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.cell{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;height:32px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums;position:relative;padding:0;transition:border-color .12s ease,transform .12s ease,background .12s ease}
.cell:hover{border-color:var(--accent);transform:translateY(-1px)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell.dim{opacity:.32}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cell.sup{font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--border);background:var(--surface-2)}
.legend .l-ok::before{background:var(--ok-soft);border-color:var(--ok)}
.legend .l-bad::before{background:var(--bad-soft);border-color:var(--bad)}
.legend .l-flag::before{background:var(--warn);border-radius:50%;border:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.qnum{font-weight:700;font-size:17px;letter-spacing:-.01em}
.chip{font-size:12px;padding:3px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;transition:transform .12s ease}
.chip.sup{background:var(--warn-soft);color:var(--warn)}
.chip.multi{background:var(--surface-2);color:var(--muted);font-weight:500}
.flagbtn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:13px;transition:border-color .15s ease,background .15s ease,transform .15s ease}
.flagbtn:hover{border-color:var(--warn);color:var(--warn);transform:translateY(-1px)}
.flagbtn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.stem{line-height:1.7}
.stem p{margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;padding:11px 13px;cursor:pointer;background:var(--surface);transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.opt:hover{border-color:var(--accent);transform:translateX(2px);box-shadow:var(--shadow-sm)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--surface-2);transition:background .15s ease,border-color .15s ease,color .15s ease}
.opt.multi .key{border-radius:7px}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--border);transform:none;box-shadow:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.tag{font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)} .opt.missed .tag{color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .spacer{flex:1}
.verdict{margin:18px 0 6px;padding:11px 15px;border-radius:11px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.hint{margin-top:16px;border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:9px;padding:11px 15px;background:var(--surface-2)}
.hint h3{margin:0 0 6px;font-size:14px;color:var(--warn)}
details.sec{border:1px solid var(--border);border-radius:11px;margin-top:11px;background:var(--surface);transition:border-color .15s ease}
details.sec>summary{cursor:pointer;padding:11px 15px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"›";display:inline-block;transition:transform .15s ease;color:var(--muted);font-size:18px;line-height:1}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec .body{padding:0 16px 14px}
.body p{margin:7px 0}
.body ul,.body ol{margin:7px 0;padding-left:22px}
.body li{margin:4px 0}
.body table{border-collapse:collapse;width:100%;margin:9px 0;font-size:14px;display:block;overflow-x:auto}
.body th,.body td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
.body th{background:var(--surface-2)}
.sec.s-answer{border-left:3px solid var(--ok)}
.sec.s-tip{border-left:3px solid var(--accent)}
.empty{color:var(--muted);text-align:center;padding:44px 10px}
.kbd{font-size:12px;color:var(--muted);margin-top:14px}
.kbd kbd{font-family:inherit;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface-2)}
.summary h2{margin-top:0}
.summary table{border-collapse:collapse;width:100%;font-size:14px}
.summary th,.summary td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left}
.summary td.n{font-variant-numeric:tabular-nums;text-align:right}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s ease}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .grid{grid-template-columns:repeat(10,1fr)}
}
@media (max-width:480px){
  .wrap{padding:14px 16px 40px}
  .card{padding:16px}
  .grid{grid-template-columns:repeat(8,1fr)}
  .stat{min-width:64px;padding:5px 10px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>AWS SAA-C03 · Practice Test 2 (65 câu)</h1>
      <div class="sub">Đề tiếng Anh · Giải thích tiếng Việt · Tiến độ chỉ lưu trong phiên đang mở</div>
    <p style="margin:4px 0 0"><a href="../index.html" style="color:var(--accent)">&larr; Về trang luyện đề chính</a></p>
    </div>
    <div class="stats">
      <div class="stat"><b id="sDone">0</b><span>Đã làm</span></div>
      <div class="stat ok"><b id="sOk">0</b><span>Đúng</span></div>
      <div class="stat bad"><b id="sBad">0</b><span>Sai</span></div>
      <div class="stat"><b id="sPct">–</b><span>Tỷ lệ đúng</span></div>
    </div>
  </header>
  <div class="progress"><i id="prog"></i></div>

  <div class="toolbar">
    <select id="fFilter" aria-label="Lọc câu hỏi">
      <option value="all">Tất cả câu</option>
      <option value="todo">Chưa làm</option>
      <option value="bad">Làm sai</option>
      <option value="flag">Đã đánh dấu</option>
    </select>
    <select id="fTopic" aria-label="Lọc theo chủ đề"><option value="">Mọi chủ đề</option></select>
    <label><input type="checkbox" id="optShuffleQ"> Xáo câu hỏi</label>
    <label><input type="checkbox" id="optShuffleA"> Xáo đáp án</label>
    <label><input type="checkbox" id="optAuto" checked> Hiện giải thích sau khi kiểm tra</label>
    <span style="flex:1"></span>
    <button class="btn" id="btnSummary">Xem kết quả</button>
    <button class="btn ghost" id="btnReset">Làm lại</button>
    <button class="btn ghost" id="btnTheme" title="Đổi giao diện sáng/tối">◐</button>
  </div>

  <div class="layout">
    <aside class="side">
      <h2>Danh sách câu</h2>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span class="l-ok">Đúng</span><span class="l-bad">Sai</span><span>Chưa làm</span><span class="l-flag">Đánh dấu</span>
      </div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<script>
const Q = [{"id":1,"topic":"Design High-Performing Architectures – Aurora Global Database (RPO/RTO)","supplement":false,"stem":"A company is developing a global healthcare application that requires the least possible latency for database read/write operations from users in several geographies across the world. The company has hired you as an AWS Certified Solutions Architect Associate to build a solution using Amazon Aurora that offers an effective recovery point objective (RPO) of seconds and a recovery time objective (RTO) of a minute.<br>Which of the following options would you recommend?","options":[{"html":"Set up an Amazon Aurora Global Database cluster","correct":true},{"html":"Set up an Amazon Aurora multi-master Database cluster","correct":false},{"html":"Set up an Amazon Aurora serverless Database cluster","correct":false},{"html":"Set up an Amazon Aurora provisioned Database cluster","correct":false}],"multi":1,"analysis":"<p>Chọn kiến trúc Aurora đáp ứng RPO/RTO cực thấp trên quy mô toàn cầu</p>","answer":"<p>Aurora Global Database là lựa chọn duy nhất cho phép phục hồi toàn Region với RPO khoảng 1 giây và RTO dưới 1 phút.</p>","explain":"<ul><li><b>A. ✓</b> Aurora Global Database cho phép 1 database trải nhiều Region, RPO khoảng 1 giây, RTO dưới 1 phút khi mất cả Region.</li><li><b>B. ✗</b> AWS không cung cấp tính năng multi-master cho Aurora — đây là tên dịch vụ bẫy, không tồn tại.</li><li><b>C. ✗</b> Aurora Serverless chỉ chạy trong 1 Region, không đáp ứng yêu cầu đa Region.</li><li><b>D. ✗</b> Aurora provisioned (thông thường) cũng chỉ hoạt động trong 1 Region.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 'Multi-master' nghe như tính năng cao cấp hơn nhưng Aurora không hề có tính năng này — chỉ là tên bẫy.</p>","tip":"<p>RPO giây, RTO phút ở quy mô đa Region cho dữ liệu quan hệ → Aurora Global Database; đa Region cho NoSQL multi-writer → DynamoDB Global Tables.</p>"},{"id":2,"topic":"Design Secure Architectures – EC2 Dedicated Instances vs Dedicated Hosts","supplement":false,"stem":"A health-care solutions company wants to run their applications on single-tenant hardware to meet regulatory guidelines.<br>Which of the following is the MOST cost-effective way of isolating their Amazon Elastic Compute Cloud (Amazon EC2)instances to a single tenant?","options":[{"html":"Dedicated Instances","correct":true},{"html":"Dedicated Hosts","correct":false},{"html":"Spot Instances","correct":false},{"html":"On-Demand Instances","correct":false}],"multi":1,"analysis":"<p>Phân biệt Dedicated Instance vs Dedicated Host theo tiêu chí chi phí</p>","answer":"<p>Dedicated Instances đáp ứng yêu cầu single-tenant với chi phí thấp hơn Dedicated Host.</p>","explain":"<ul><li><b>A. ✓</b> Dedicated Instances chạy trên phần cứng dành riêng cho 1 khách hàng, chi phí thấp hơn Dedicated Hosts.</li><li><b>B. ✗</b> Dedicated Host cũng cô lập phần cứng nhưng đắt hơn Dedicated Instance.</li><li><b>C. ✗</b> Spot rẻ nhưng không đảm bảo cô lập phần cứng đơn thuê bao.</li><li><b>D. ✗</b> On-Demand không cô lập phần cứng và đắt hơn Dedicated Instance.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Dedicated Host nghe 'cô lập hơn' nhưng đắt hơn và không cần thiết khi chỉ cần single-tenant đơn giản.</p>","tip":"<p>Cả hai đều cô lập phần cứng; Dedicated Host cho kiểm soát vị trí + BYOL, Dedicated Instance rẻ hơn khi chỉ cần single-tenant.</p>"},{"id":3,"topic":"Design Cost-Optimized Architectures – VPC Sharing via AWS RAM","supplement":false,"stem":"You have multiple AWS accounts within a single AWS Region managed by AWS Organizations and you would like to ensure all Amazon EC2 instances in all these accounts can communicate privately. Which of the following solutions provides the capability at the CHEAPEST cost?","options":[{"html":"Create a Private Link between all the Amazon EC2 instances","correct":false},{"html":"Create an AWS Transit Gateway and link all the virtual private cloud (VPCs) in all the accounts together","correct":false},{"html":"Create a virtual private cloud (VPC) in an account and share one or more of its subnets with the other accounts using Resource Access Manager","correct":true},{"html":"Create a VPC peering connection between all virtual private cloud (VPCs)","correct":false}],"multi":1,"analysis":"<p>Chọn giải pháp kết nối nhiều account RẺ NHẤT khi có thể gộp chung VPC</p>","answer":"<p>Chia sẻ subnet bằng AWS RAM cho phép nhiều account dùng chung 1 VPC, giao tiếp private miễn phí, không cần Transit Gateway hay Peering.</p>","explain":"<ul><li><b>A. ✗</b> PrivateLink dùng để expose 1 service qua NLB, không phải cách nối nhiều EC2 với nhau.</li><li><b>B. ✗</b> Transit Gateway giải quyết được nhưng tốn phí theo giờ + theo GB, đắt hơn yêu cầu 'cheapest'.</li><li><b>C. ✓</b> Chia sẻ subnet qua AWS RAM miễn phí, các EC2 từ nhiều account coi như cùng 1 VPC, giao tiếp trực tiếp.</li><li><b>D. ✗</b> VPC Peering giữa nhiều VPC không scale tốt và vẫn tốn công quản lý route khi nhiều account.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Transit Gateway là lựa chọn 'đúng chức năng' quen thuộc nhưng không phải rẻ nhất khi có thể dùng VPC Sharing.</p>","tip":"<p>Dùng chung 1 VPC qua nhiều account → VPC Sharing (RAM, miễn phí). Cần nhiều VPC riêng biệt kết nối → Transit Gateway (có phí) hoặc Peering (giới hạn transitive).</p>"},{"id":4,"topic":"Design High-Performing Architectures – SQS FIFO Message Group ID","supplement":false,"stem":"You are establishing a monitoring solution for desktop systems, that will be sending telemetry data into AWS every 1 minute. Data for each system must be processed in order, independently, and you would like to scale the number of consumers to be possibly equal to the number of desktop systems that are being monitored.<br>What do you recommend?","options":[{"html":"Use an Amazon Simple Queue Service (Amazon SQS) FIFO (First-In-First-Out) queue, and make sure the telemetry data is sent with a Group ID attribute representing the value of the Desktop ID","correct":true},{"html":"Use an Amazon Simple Queue Service (Amazon SQS) standard queue, and send the telemetry data as is","correct":false},{"html":"Use an Amazon Simple Queue Service (Amazon SQS) FIFO (First-In-First-Out) queue, and send the telemetry data as is","correct":false},{"html":"Use an Amazon Kinesis Data Stream, and send the telemetry data with a Partition ID that uses the value of the Desktop ID","correct":false}],"multi":1,"analysis":"<p>Giữ thứ tự theo từng nhóm (per-key) nhưng vẫn scale được nhiều consumer song song</p>","answer":"<p>SQS FIFO với Group ID tạo nhiều 'luồng thứ tự' độc lập theo Desktop ID, cho phép scale consumer gần bằng số desktop.</p>","explain":"<ul><li><b>A. ✓</b> FIFO + Group ID theo Desktop ID cho phép nhiều consumer xử lý song song, mỗi Desktop vẫn giữ đúng thứ tự riêng.</li><li><b>B. ✗</b> Standard queue không đảm bảo thứ tự, không đạt yêu cầu 'processed in order'.</li><li><b>C. ✗</b> Không dùng Group ID thì toàn bộ queue chỉ xử lý theo 1 thứ tự tuyệt đối, chỉ 1 consumer hiệu quả — không scale theo số desktop.</li><li><b>D. ✗</b> Kinesis giới hạn số consumer theo số shard, ít hơn nhiều so với số desktop cần scale tới.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Dùng FIFO queue nhưng quên Group ID khiến mất khả năng scale vì toàn bộ message bị xử lý tuần tự như 1 luồng duy nhất.</p>","tip":"<p>Cần thứ tự + scale nhiều consumer độc lập theo từng khóa → SQS FIFO với Message Group ID (không phải Kinesis, vốn giới hạn consumer theo shard).</p>"},{"id":5,"topic":"Design Secure Architectures – IAM Condition aws:RequestedRegion","supplement":false,"stem":"What does this IAM policy do?<pre class=\"code\">{\n  &quot;Version&quot;: &quot;2012-10-17&quot;,\n  &quot;Statement&quot;: [\n    {\n      &quot;Sid&quot;: &quot;Mystery Policy&quot;,\n      &quot;Action&quot;: [\n        &quot;ec2:RunInstances&quot;\n      ],\n      &quot;Effect&quot;: &quot;Allow&quot;,\n      &quot;Resource&quot;: &quot;*&quot;,\n      &quot;Condition&quot;: {\n        &quot;StringEquals&quot;: {\n          &quot;aws:RequestedRegion&quot;: &quot;eu-west-1&quot;\n        }\n      }\n    }\n  ]\n}</pre>","options":[{"html":"It allows running Amazon EC2 instances in any region when the API call is originating from the eu-west-1 region","correct":false},{"html":"It allows running Amazon EC2 instances anywhere but in the eu-west-1 region","correct":false},{"html":"It allows running Amazon EC2 instances in the eu-west-1 region, when the API call is made from the eu-west-1 region","correct":false},{"html":"It allows running Amazon EC2 instances only in the eu-west-1 region, and the API call can be made from anywhere in the world","correct":true}],"multi":1,"analysis":"<p>Đọc đúng ý nghĩa global condition key aws:RequestedRegion trong chính sách IAM</p>","answer":"<p>aws:RequestedRegion ràng buộc Region mà API nhắm tới (nơi EC2 được khởi chạy), không ràng buộc nơi phát sinh lời gọi.</p>","explain":"<ul><li><b>A. ✗</b> Sai chiều — aws:RequestedRegion là Region ĐÍCH của API call, không phải nơi gọi.</li><li><b>B. ✗</b> Phủ định sai hoàn toàn ý nghĩa của điều kiện StringEquals (chỉ cho phép, không phải loại trừ).</li><li><b>C. ✗</b> Giới hạn nhầm luôn cả nơi gọi API phải ở eu-west-1, trong khi điều kiện chỉ ràng buộc Region đích.</li><li><b>D. ✓</b> aws:RequestedRegion là Region mục tiêu của request; lệnh RunInstances chỉ được phép khi target là eu-west-1, gọi từ đâu cũng được.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 3 lựa chọn còn lại đều ngầm hiểu RequestedRegion là 'nơi gọi API', đánh tráo khái niệm Region đích và Region nguồn.</p>","tip":"<p>aws:RequestedRegion = Region của resource/API đích; aws:SourceIp = IP nơi phát sinh lời gọi — đừng nhầm hai khái niệm 'đích' và 'nguồn'.</p>"},{"id":6,"topic":"Design Secure Architectures – API Gateway Resource Policy (IP restriction)","supplement":false,"stem":"An enterprise is building a secure business intelligence API using Amazon API Gateway to serve internal users with confidential analytics data. The API must be accessible only from a set of trusted IP addresses that are part of the organization's internal network ranges. No external IP traffic should be able to invoke the API. A solutions architect must design this access control mechanism with the least operational complexity.<br>What should the architect do to meet these requirements?","options":[{"html":"Deploy the API Gateway as a regional API in a public subnet and associate the subnet with a security group that permits inbound traffic only from trusted IP ranges","correct":false},{"html":"Create a resource policy for the API Gateway API that explicitly denies access to all IP addresses except those listed in an allow list","correct":true},{"html":"Deploy the API Gateway resource to an on-premises server using AWS Outposts. Apply host-based firewall rules to filter allowed IPs","correct":false},{"html":"Modify the security group that is attached to API Gateway to allow only traffic from specific IP addresses","correct":false}],"multi":1,"analysis":"<p>Chặn IP ở tầng API Gateway bằng đúng cơ chế của dịch vụ managed (không dùng network construct không áp dụng được)</p>","answer":"<p>Resource policy là cơ chế gốc của API Gateway để allow/deny theo IP, không cần hạ tầng mạng bổ sung.</p>","explain":"<ul><li><b>A. ✗</b> API Gateway là dịch vụ managed, không chạy trong subnet của bạn nên không thể gắn security group theo cách này.</li><li><b>B. ✓</b> Resource policy dùng điều kiện IpAddress/NotIpAddress để chặn theo IP ngay tại API Gateway — đúng cơ chế.</li><li><b>C. ✗</b> Outposts không cần thiết, tốn kém và sai bản chất của 1 dịch vụ serverless như API Gateway.</li><li><b>D. ✗</b> API Gateway không có security group để chỉnh sửa — lựa chọn dựa trên khái niệm sai.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Security Group và subnet nghe quen thuộc với EC2 nhưng API Gateway không chạy trong VPC theo cách đó nên các lựa chọn này không áp dụng được.</p>","tip":"<p>Giới hạn IP gọi API Gateway → Resource Policy (IpAddress/NotIpAddress condition), không phải Security Group/NACL (chỉ áp dụng cho resource trong VPC).</p>"},{"id":7,"topic":"Design High-Performing Architectures – Textract + Comprehend Pipeline","supplement":false,"stem":"A global media agency is developing a cultural analysis project to explore how major sports stories have evolved over the last five years. The team has collected thousands of archived news bulletins and magazine spreads stored in PDF format. These documents are rich in unstructured text and come from various sources with differing layouts and font styles. The agency wants to better understand how public tone and narrative have shifted over time. The team has chosen to use Amazon Textract for its ability to accurately extract printed and scanned text from complex PDF layouts. They need a solution that can then analyze the emotional tone and subject matter of the extracted text with the least possible operational burden, using fully managed AWS services where possible.<br>Which solution will best meet these requirements?","options":[{"html":"Ingest the extracted data into Amazon Redshift using AWS Glue, and use Amazon Rekognition to analyze the tone of the document layouts for sentiment classification.","correct":false},{"html":"Process the extracted output with AWS Lambda to convert the text into CSV format. Query the data using Amazon Athena and visualize it using Amazon QuickSight.","correct":false},{"html":"Use Amazon SageMaker to train a custom sentiment analysis model. Store the model outputs in Amazon DynamoDB for structured querying by analysts","correct":false},{"html":"Send the extracted text to Amazon Comprehend for entity detection and sentiment analysis. Store the results in Amazon S3 for further access or visualization.","correct":true}],"multi":1,"analysis":"<p>Chọn dịch vụ AI được huấn luyện sẵn (pre-trained) đúng loại dữ liệu để giảm vận hành</p>","answer":"<p>Comprehend cung cấp sẵn sentiment analysis và entity detection cho văn bản, không cần xây hay huấn luyện model.</p>","explain":"<ul><li><b>A. ✗</b> Rekognition là dịch vụ thị giác máy tính (ảnh/video), không phân tích cảm xúc văn bản.</li><li><b>B. ✗</b> Athena chỉ là query engine, không có khả năng phân tích cảm xúc; thêm nhiều bước chuyển đổi không cần thiết.</li><li><b>C. ✗</b> Tự huấn luyện model SageMaker tốn nhiều công sức huấn luyện/vận hành, không phải 'ít vận hành nhất'.</li><li><b>D. ✓</b> Comprehend là dịch vụ NLP có sẵn, phân tích sentiment và entity ngay, không cần huấn luyện.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Rekognition dễ bị nhầm vì nghe 'AI/ML' nhưng chỉ xử lý hình ảnh, không xử lý văn bản.</p>","tip":"<p>Văn bản → phân tích cảm xúc/thực thể: Comprehend (có sẵn, không cần train). Hình ảnh/video → Rekognition. Cần model tùy biến sâu: SageMaker.</p>"},{"id":8,"topic":"Design Secure Architectures – Security Groups for ALB + EC2 + RDS","supplement":false,"stem":"An HTTP application is deployed on an Auto Scaling Group, is accessible from an Application Load Balancer (ALB) that provides HTTPS termination, and accesses a PostgreSQL database managed by Amazon RDS.<br>How should you configure the security groups? (Select three)","options":[{"html":"The security group of the Amazon EC2 instances should have an inbound rule from the security group of the Application Load Balancer on port 80","correct":true},{"html":"The security group of the Application Load Balancer should have an inbound rule from anywhere on port 443","correct":true},{"html":"The security group of the Application Load Balancer should have an inbound rule from anywhere on port 80","correct":false},{"html":"The security group of Amazon RDS should have an inbound rule from the security group of the Amazon EC2 instances in the Auto Scaling group on port 80","correct":false},{"html":"The security group of Amazon RDS should have an inbound rule from the security group of the Amazon EC2 instances in the Auto Scaling group on port 5432","correct":true},{"html":"The security group of the Amazon EC2 instances should have an inbound rule from the security group of the Amazon RDS database on port 5432","correct":false}],"multi":3,"analysis":"<p>Lần theo đúng chuỗi traffic (client→ALB→EC2→RDS) và đúng cổng từng chặng</p>","answer":"<p>3 rule đúng khớp chính xác với luồng traffic thực tế: 443 vào ALB, 80 từ ALB vào EC2, 5432 từ EC2 vào RDS.</p>","explain":"<ul><li><b>A. ✓</b> Đúng — ALB forward HTTPS thành HTTP tới EC2 trên port 80.</li><li><b>B. ✓</b> Đúng — client gửi HTTPS tới ALB trên port 443.</li><li><b>C. ✗</b> Sai cổng — client gọi HTTPS (443), không phải port 80.</li><li><b>D. ✗</b> Sai cổng — PostgreSQL lắng nghe ở 5432, không phải 80.</li><li><b>E. ✓</b> Đúng — EC2 truy cập PostgreSQL trên đúng cổng 5432.</li><li><b>F. ✗</b> Sai chiều — RDS không cần mở inbound tới EC2, luồng kết nối chỉ đi 1 chiều EC2 đến RDS.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các lựa chọn sai chỉ lệch đúng một chi tiết (sai cổng hoặc sai chiều) khiến dễ chọn nhầm nếu không vẽ lại luồng traffic.</p>","tip":"<p>Luôn vẽ sơ đồ luồng traffic theo thứ tự và áp đúng cổng dịch vụ (HTTPS 443, HTTP 80, PostgreSQL 5432) cho từng chặng security group.</p>"},{"id":9,"topic":"Design Resilient Architectures – Aurora Replica (Read/Write Separation)","supplement":false,"stem":"An e-commerce application uses an Amazon Aurora Multi-AZ deployment for its database. While analyzing the performance metrics, the engineering team has found that the database reads are causing high input/output (I/O) and adding latency to the write requests against the database.<br>As an AWS Certified Solutions Architect Associate, what would you recommend to separate the read requests from the write requests?","options":[{"html":"Set up a read replica and modify the application to use the appropriate endpoint","correct":true},{"html":"Configure the application to read from the Multi-AZ standby instance","correct":false},{"html":"Provision another Amazon Aurora database and link it to the primary database as a read replica","correct":false},{"html":"Activate read-through caching on the Amazon Aurora database","correct":false}],"multi":1,"analysis":"<p>Tách read/write trong Aurora bằng đúng khái niệm Aurora Replica và reader endpoint</p>","answer":"<p>Aurora Replica dùng chung storage với primary, phục vụ riêng traffic đọc qua reader endpoint, giảm tải I/O cho writer.</p>","explain":"<ul><li><b>A. ✓</b> Tạo Aurora Replica và dùng reader endpoint để tách hẳn traffic đọc khỏi ghi.</li><li><b>B. ✗</b> Aurora không có 'standby instance' kiểu RDS thường — đây là tên gọi sai, chỉ là bẫy.</li><li><b>C. ✗</b> Không thể lấy 1 database Aurora độc lập rồi gắn làm read replica cho database khác.</li><li><b>D. ✗</b> Aurora không có tính năng read-through cache dựng sẵn; phải tự tích hợp ElastiCache.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 'Multi-AZ standby instance' là thuật ngữ của RDS thường bị gán nhầm sang Aurora — Aurora gọi là Replica, không có standby riêng.</p>","tip":"<p>Aurora: đọc nhiều instance qua reader endpoint (Aurora Replica). RDS thường: Multi-AZ standby chỉ dùng cho failover, Read Replica mới dùng để scale đọc.</p>"},{"id":10,"topic":"Design Secure Architectures – IAM Policy Evaluation (Deny + Allow, SourceIp)","supplement":false,"stem":"Consider the following policy associated with an IAM group containing several users:<pre class=\"code\">{\n    &quot;Version&quot;:&quot;2012-10-17&quot;,\n    &quot;Id&quot;:&quot;EC2TerminationPolicy&quot;,\n    &quot;Statement&quot;:[\n        {\n            &quot;Effect&quot;:&quot;Deny&quot;,\n            &quot;Action&quot;:&quot;ec2:*&quot;,\n            &quot;Resource&quot;:&quot;*&quot;,\n            &quot;Condition&quot;:{\n                &quot;StringNotEquals&quot;:{\n                    &quot;ec2:Region&quot;:&quot;us-west-1&quot;\n                }\n            }\n        },\n        {\n            &quot;Effect&quot;:&quot;Allow&quot;,\n            &quot;Action&quot;:&quot;ec2:TerminateInstances&quot;,\n            &quot;Resource&quot;:&quot;*&quot;,\n            &quot;Condition&quot;:{\n                &quot;IpAddress&quot;:{\n                    &quot;aws:SourceIp&quot;:&quot;10.200.200.0/24&quot;\n                }\n            }\n        }\n    ]\n}</pre>Which of the following options is correct?","options":[{"html":"Users belonging to the IAM user group can terminate an Amazon EC2 instance in the us-west-1 region when the user's source IP is 10.200.200.200","correct":true},{"html":"Users belonging to the IAM user group can terminate an Amazon EC2 instance belonging to any region except the us-west-1 region when the user's source IP is 10.200.200.200","correct":false},{"html":"Users belonging to the IAM user group can terminate an Amazon EC2 instance in the us-west-1 region when the EC2 instance's IP address is 10.200.200.200","correct":false},{"html":"Users belonging to the IAM user group cannot terminate an Amazon EC2 instance in the us-west-1 region when the user's source IP is 10.200.200.200","correct":false}],"multi":1,"analysis":"<p>Đánh giá kết hợp Deny + Allow theo Region và theo điều kiện SourceIp</p>","answer":"<p>Deny loại trừ mọi Region khác us-west-1, Allow mở quyền Terminate đúng khi nguồn IP khớp dải cho phép — kết quả là được phép ở us-west-1 với đúng IP.</p>","explain":"<ul><li><b>A. ✓</b> Đúng — statement 1 deny mọi Region khác us-west-1, statement 2 allow TerminateInstances khi IP nguồn khớp dải cho phép.</li><li><b>B. ✗</b> Sai — statement 1 chặn mọi Region KHÁC us-west-1, nên không thể terminate ở vùng khác.</li><li><b>C. ✗</b> Sai — điều kiện aws:SourceIp là IP của người gọi API, không phải IP của EC2 instance.</li><li><b>D. ✗</b> Sai — phủ định ngược hoàn toàn kết quả đánh giá chính sách (statement 2 cho phép khi IP khớp).</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Nhầm aws:SourceIp (IP người gọi) với IP của chính EC2 instance là lỗi đọc chính sách phổ biến.</p>","tip":"<p>Luôn đọc Deny trước để xác định phạm vi bị loại trừ, sau đó áp Allow trong phần còn lại; aws:SourceIp luôn là IP của principal gọi API.</p>"},{"id":11,"topic":"Design Secure Architectures – RDS Snapshot Sharing with KMS","supplement":false,"stem":"A retail company wants to share sensitive accounting data that is stored in an Amazon RDS database instance with an external auditor. The auditor has its own AWS account and needs its own copy of the database.<br>Which of the following would you recommend to securely share the database with the auditor?","options":[{"html":"Create a snapshot of the database in Amazon S3 and assign an IAM role to the auditor to grant access to the object in that bucket","correct":false},{"html":"Export the database contents to text files, store the files in Amazon S3, and create a new IAM user for the auditor with access to that bucket","correct":false},{"html":"Create an encrypted snapshot of the database, share the snapshot, and allow access to the AWS Key Management Service (AWS KMS) encryption key","correct":true},{"html":"Set up a read replica of the database and configure IAM standard database authentication to grant the auditor access","correct":false}],"multi":1,"analysis":"<p>Chia sẻ dữ liệu RDS cho account khác mà vẫn giữ mã hoá — chia sẻ snapshot kèm KMS key</p>","answer":"<p>Share encrypted snapshot kèm quyền trên KMS key là cách chuẩn để account khác tự restore thành database riêng của họ.</p>","explain":"<ul><li><b>A. ✗</b> RDS snapshot không nằm trong bucket S3 mà bạn có thể cấp quyền trực tiếp — bạn không truy cập được object đó.</li><li><b>B. ✗</b> Export sang text file rồi quản lý thủ công tốn công, khó audit, không tối ưu.</li><li><b>C. ✓</b> Chia sẻ snapshot đã mã hoá và chia sẻ quyền dùng KMS key cho account khác — đúng cơ chế share chuẩn của RDS.</li><li><b>D. ✗</b> Read replica chỉ đọc, không phải 'bản sao riêng' độc lập mà auditor sở hữu được.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> RDS snapshot tưởng như object S3 thông thường nên dễ nhầm có thể cấp quyền IAM trực tiếp lên nó.</p>","tip":"<p>Chia sẻ RDS snapshot cross-account: share snapshot (đã mã hoá) + share quyền trên KMS key được dùng để mã hoá nó.</p>"},{"id":12,"topic":"Design Resilient Architectures – DR Architecture with Least Downtime","supplement":false,"stem":"A manufacturing company receives unreliable service from its data center provider because the company is located in an area prone to natural disasters. The company is not ready to fully migrate to the AWS Cloud, but it wants a failover environment on AWS in case the on-premises data center fails. The company runs web servers that connect to external vendors. The data available on AWS and on-premises must be uniform.<br>Which of the following solutions would have the LEAST amount of downtime?","options":[{"html":"Set up a Amazon Route 53 failover record. Run application servers on Amazon EC2 instances behind an Application Load Balancer in an Auto Scaling group. Set up AWS Storage Gateway with stored volumes to back up data to Amazon S3","correct":true},{"html":"Set up a Amazon Route 53 failover record. Run an AWS Lambda function to execute an AWS CloudFormation template to launch two Amazon EC2 instances. Set up AWS Storage Gateway with stored volumes to back up data to Amazon S3. Set up an AWS Direct Connect connection between a VPC and the data center","correct":false},{"html":"Set up a Amazon Route 53 failover record. Execute an AWS CloudFormation template from a script to provision Amazon EC2 instances behind an Application Load Balancer. Set up AWS Storage Gateway with stored volumes to back up data to Amazon S3","correct":false},{"html":"Set up a Amazon Route 53 failover record. Set up an AWS Direct Connect connection between a VPC and the data center. Run application servers on Amazon EC2 in an Auto Scaling group. Run an AWS Lambda function to execute an AWS CloudFormation template to create an Application Load Balancer","correct":false}],"multi":1,"analysis":"<p>So sánh các chiến lược DR theo tốc độ phục hồi — tài nguyên có sẵn luôn nhanh hơn tài nguyên 'provision khi cần'</p>","answer":"<p>Chỉ phương án có EC2/ALB/ASG đã chạy sẵn (kiểu warm standby) mới đạt RTO thấp nhất; các phương án còn lại đều cần provision tài nguyên lúc xảy ra sự cố.</p>","explain":"<ul><li><b>A. ✓</b> EC2 + ALB + ASG đã chạy sẵn (warm), Route 53 failover chuyển traffic ngay — downtime thấp nhất.</li><li><b>B. ✗</b> Phải chạy CloudFormation để TẠO MỚI EC2 lúc failover → tốn thời gian hơn so với đã có sẵn ASG đang chạy.</li><li><b>C. ✗</b> Tương tự — phải provision EC2 bằng CloudFormation tại thời điểm failover, chậm hơn phương án có sẵn ASG.</li><li><b>D. ✗</b> Vừa phải tạo ALB mới qua CloudFormation, vừa cần Direct Connect không cần thiết cho yêu cầu failover — chậm nhất.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các lựa chọn dùng CloudFormation để 'tạo khi cần' nghe hợp lý nhưng luôn chậm hơn một kiến trúc đã chạy sẵn song song.</p>","tip":"<p>Muốn downtime thấp nhất trong DR: ưu tiên kiến trúc đã chạy sẵn (warm standby) hơn là 'provision on-demand' bằng script/CloudFormation lúc failover.</p>"},{"id":13,"topic":"Design High-Performing Architectures – EventBridge Scheduler + ECS Fargate","supplement":false,"stem":"A manufacturing analytics company has a large collection of automated scripts that perform data cleanup, validation, and system integration tasks. These scripts are currently run by a local Linux cron scheduler and have an execution time of up to 30 minutes. The company wants to migrate these scripts to AWS without significant changes, and would prefer a containerized, serverless architecture that automatically scales and can respond to event-based triggers in the future. The solution must minimize infrastructure management.<br>Which solution will best meet these requirements with minimal refactoring and operational overhead?","options":[{"html":"Convert each script into a Lambda function and package it in a zip archive. Use Amazon EventBridge Scheduler to run the functions on a fixed schedule. Use Amazon S3 to store function outputs and logs","correct":false},{"html":"Package the scripts into a container image. Deploy the image to AWS Batch with a managed compute environment on Amazon EC2. Define scheduling policies in AWS Batch to trigger jobs according to cron expressions","correct":false},{"html":"Package the scripts into a container image. Use Amazon EventBridge Scheduler to define cron-based recurring schedules. Configure EventBridge Scheduler to invoke AWS Fargate tasks using Amazon ECS","correct":true},{"html":"Create a container image for each script. Use AWS Step Functions to define a workflow for all scheduled tasks. Use a Wait state to delay execution and run tasks using Step Functions’ RunTask integration with ECS Fargate","correct":false}],"multi":1,"analysis":"<p>Chọn đúng cặp scheduler + compute serverless cho job chạy lâu (trên 15 phút) dạng cron</p>","answer":"<p>EventBridge Scheduler lo lịch chạy cron, Fargate (qua ECS) chạy container không giới hạn 15 phút như Lambda — khớp chính xác yêu cầu.</p>","explain":"<ul><li><b>A. ✗</b> Lambda timeout tối đa 15 phút, không đủ cho job chạy tới 30 phút; viết lại thành Lambda cũng trái yêu cầu 'minimal refactoring'.</li><li><b>B. ✗</b> AWS Batch dùng compute environment trên EC2, cần cấu hình nhiều hơn, không 'serverless' đúng nghĩa và chậm khởi tạo hơn Fargate.</li><li><b>C. ✓</b> EventBridge Scheduler (cron) + ECS Fargate: container hoá nguyên script, serverless, không quản lý server, hỗ trợ cả trigger sự kiện sau này.</li><li><b>D. ✗</b> Step Functions + Wait state là over-engineering cho các job cron đơn giản, phù hợp hơn cho workflow nhiều bước.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Lambda là phản xạ đầu tiên cho 'serverless' nhưng giới hạn 15 phút khiến nó không phù hợp với job 30 phút.</p>","tip":"<p>Job ngắn, event-driven (dưới 15 phút) → Lambda. Job dài, cần container, lịch cố định → EventBridge Scheduler + ECS Fargate. Nhiều bước phức tạp → Step Functions.</p>"},{"id":14,"topic":"Design Resilient Architectures – Multi-AZ EC2 + RDS for High Availability","supplement":false,"stem":"An IT company is working on a client project to build a Supply Chain Management application. The web-tier of the application runs on an Amazon EC2 instance and the database tier is on Amazon RDS MySQL. For beta testing, all the resources are currently deployed in a single Availability Zone (AZ). The development team wants to improve application availability before the go-live.<br>Given that all end users of the web application would be located in the US, which of the following would be the MOST resource-efficient solution?","options":[{"html":"Deploy the web-tier Amazon EC2 instances in two Availability Zones (AZs), behind an Elastic Load Balancer. Deploy the Amazon RDS MySQL database in Multi-AZ configuration","correct":true},{"html":"Deploy the web-tier Amazon EC2 instances in two regions, behind an Elastic Load Balancer. Deploy the Amazon RDS MySQL database in Multi-AZ configuration","correct":false},{"html":"Deploy the web-tier Amazon EC2 instances in two Availability Zones (AZs), behind an Elastic Load Balancer. Deploy the Amazon RDS MySQL database in read replica configuration","correct":false},{"html":"Deploy the web-tier Amazon EC2 instances in two regions, behind an Elastic Load Balancer. Deploy the Amazon RDS MySQL database in read replica configuration","correct":false}],"multi":1,"analysis":"<p>Chọn đúng phạm vi địa lý (AZ vs Region) và đúng tính năng RDS (Multi-AZ vs Read Replica) theo đúng mục tiêu (availability)</p>","answer":"<p>Người dùng chỉ ở US nên 2 AZ trong 1 Region là đủ và tiết kiệm tài nguyên hơn 2 Region; Multi-AZ đúng mục tiêu tăng availability.</p>","explain":"<ul><li><b>A. ✓</b> 2 AZ + ELB cho web-tier, Multi-AZ cho RDS — đủ cải thiện availability, đúng phạm vi US nên không cần đa Region.</li><li><b>B. ✗</b> ELB không hoạt động xuyên Region — kiến trúc này không khả thi.</li><li><b>C. ✗</b> Read Replica dùng để scale đọc, không cải thiện availability (không tự động failover như Multi-AZ).</li><li><b>D. ✗</b> Vừa sai do ELB không xuyên Region, vừa sai do dùng Read Replica thay vì Multi-AZ cho mục tiêu availability.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đề không yêu cầu đa Region nhưng 2 lựa chọn vẫn đưa ra kiến trúc 2 Region — thừa tài nguyên so với yêu cầu 'resource-efficient'.</p>","tip":"<p>Tăng AVAILABILITY cho RDS → Multi-AZ (failover tự động). Tăng khả năng ĐỌC → Read Replica. ELB chỉ hoạt động trong 1 Region, không bắc cầu đa Region.</p>"},{"id":15,"topic":"Design Cost-Optimized Architectures – EC2 RI + Spot Mix","supplement":false,"stem":"An IT company wants to optimize the costs incurred on its fleet of 100 Amazon EC2 instances for the next year. Based on historical analyses, the engineering team observed that 70 of these instances handle the compute services of its flagship application and need to be always available. The other 30 instances are used to handle batch jobs that can afford a delay in processing.<br>As a solutions architect, which of the following would you recommend as the MOST cost-optimal solution?","options":[{"html":"Purchase 70 reserved instances (RIs) and 30 spot instances","correct":true},{"html":"Purchase 70 on-demand instances and 30 reserved instances","correct":false},{"html":"Purchase 70 on-demand instances and 30 spot instances","correct":false},{"html":"Purchase 70 reserved instances and 30 on-demand instances","correct":false}],"multi":1,"analysis":"<p>Áp đúng loại hình mua EC2 cho từng nhóm tải theo tính liên tục/chịu gián đoạn</p>","answer":"<p>RI tối ưu cho tải ổn định 100% thời gian (70 instance); Spot tối ưu cho tải chịu gián đoạn, không cần SLA cao (30 instance batch).</p>","explain":"<ul><li><b>A. ✓</b> 70 instance cần chạy liên tục suốt năm nên RI tối ưu nhất; 30 instance batch chịu được gián đoạn nên Spot rẻ nhất.</li><li><b>B. ✗</b> On-Demand cho phần luôn cần chạy đắt hơn nhiều so với RI 1 năm.</li><li><b>C. ✗</b> On-Demand cho 70 instance ổn định là lãng phí so với RI.</li><li><b>D. ✗</b> Batch job chịu gián đoạn được nên dùng On-Demand cho 30 instance này là không tối ưu bằng Spot.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Ghép RI/On-Demand sai nhóm (RI cho phần biến động, On-Demand cho phần ổn định) đều làm tăng chi phí không cần thiết.</p>","tip":"<p>Tải ổn định, luôn cần chạy → Reserved Instances/Savings Plans. Tải chịu được gián đoạn (batch) → Spot Instances, rẻ nhất trong 3 loại hình mua EC2.</p>"},{"id":16,"topic":"Design Secure Architectures – IAM Condition aws:SourceIp","supplement":false,"stem":"What does this IAM policy do?<pre class=\"code\">{\n  &quot;Version&quot;: &quot;2012-10-17&quot;,\n  &quot;Statement&quot;: [\n    {\n      &quot;Sid&quot;: &quot;Mystery Policy&quot;,\n      &quot;Action&quot;: [\n        &quot;ec2:RunInstances&quot;\n      ],\n      &quot;Effect&quot;: &quot;Allow&quot;,\n      &quot;Resource&quot;: &quot;*&quot;,\n      &quot;Condition&quot;: {\n        &quot;IpAddress&quot;: {\n          &quot;aws:SourceIp&quot;: &quot;34.50.31.0/24&quot;\n        }\n      }\n    }\n  ]\n}</pre>","options":[{"html":"It allows starting an Amazon EC2 instance only when the IP where the call originates is within the 34.50.31.0/24 CIDR block","correct":true},{"html":"It allows starting an Amazon EC2 instance only when they have a Private IP within the 34.50.31.0/24 CIDR block","correct":false},{"html":"It allows starting an Amazon EC2 instance only when they have an Elastic IP within the 34.50.31.0/24 CIDR block","correct":false},{"html":"It allows starting an Amazon EC2 instance only when they have a Public IP within the 34.50.31.0/24 CIDR block","correct":false}],"multi":1,"analysis":"<p>Không nhầm IP của resource (EC2) với IP của principal gọi API trong điều kiện IAM</p>","answer":"<p>aws:SourceIp trong ngữ cảnh gọi API luôn đại diện cho IP nơi phát sinh request, không liên quan tới địa chỉ IP của EC2 instance được tạo ra.</p>","explain":"<ul><li><b>A. ✓</b> Đúng — aws:SourceIp luôn là IP của người/nơi gọi API, không phải IP của EC2 instance.</li><li><b>B. ✗</b> Sai khái niệm — gán điều kiện cho 'Private IP của instance' trong khi điều kiện thực chất kiểm tra IP người gọi.</li><li><b>C. ✗</b> Sai khái niệm tương tự, gán nhầm cho Elastic IP của instance.</li><li><b>D. ✗</b> Sai khái niệm tương tự, gán nhầm cho Public IP của instance.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Ba lựa chọn sai đều gán nhầm điều kiện SourceIp cho chính EC2 instance (Private/Public/Elastic IP) thay vì cho người gọi.</p>","tip":"<p>aws:SourceIp = IP của caller (người/hệ thống gọi API), áp dụng tốt để giới hạn truy cập theo dải IP on-premises hoặc văn phòng.</p>"},{"id":17,"topic":"Design Resilient Architectures – RDS Multi-AZ Engine Upgrade Downtime","supplement":false,"stem":"The DevOps team at a major financial services company uses Multi-Availability Zone (Multi-AZ) deployment for its MySQL Amazon RDS database in order to automate its database replication and augment data durability. The DevOps team has scheduled a maintenance window for a database engine level upgrade for the coming weekend.<br>Which of the following is the correct outcome during the maintenance window?","options":[{"html":"Any database engine level upgrade for an Amazon RDS database instance with Multi-AZ deployment triggers both the primary and standby database instances to be upgraded at the same time. This causes downtime until the upgrade is complete","correct":true},{"html":"Any database engine level upgrade for an Amazon RDS database instance with Multi-AZ deployment triggers the primary database instance to be upgraded which is then followed by the upgrade of the standby database instance. This does not cause any downtime for the duration of the upgrade","correct":false},{"html":"Any database engine level upgrade for an Amazon RDS database instance with Multi-AZ deployment triggers both the primary and standby database instances to be upgraded at the same time. However, this does not cause any downtime until the upgrade is complete","correct":false},{"html":"Any database engine level upgrade for an Amazon RDS database instance with Multi-AZ deployment triggers the standby database instance to be upgraded which is then followed by the upgrade of the primary database instance. This does not cause any downtime for the duration of the upgrade","correct":false}],"multi":1,"analysis":"<p>Multi-AZ chỉ bảo vệ khỏi sự cố phần cứng/AZ, KHÔNG né được downtime do nâng cấp engine</p>","answer":"<p>Nâng cấp engine đụng tới cả 2 node (primary + standby) cùng lúc nên luôn có downtime, bất kể Multi-AZ.</p>","explain":"<ul><li><b>A. ✓</b> Đúng — primary và standby được nâng cấp đồng thời, gây downtime cho tới khi hoàn tất.</li><li><b>B. ✗</b> Sai — không phải nâng cấp tuần tự primary rồi standby, và vẫn có downtime.</li><li><b>C. ✗</b> Sai — nửa đầu đúng (nâng cấp đồng thời) nhưng nửa sau sai (vẫn CÓ downtime).</li><li><b>D. ✗</b> Sai — không phải nâng cấp standby trước rồi đến primary, và vẫn có downtime.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Dễ lầm tưởng Multi-AZ luôn đảm bảo zero-downtime cho MỌI thao tác bảo trì, nhưng điều đó chỉ đúng với failover sự cố, không đúng với engine upgrade.</p>","tip":"<p>Multi-AZ giúp failover nhanh khi SỰ CỐ hạ tầng, nhưng nâng cấp phiên bản engine vẫn gây downtime vì cả 2 node được vá cùng lúc.</p>"},{"id":18,"topic":"Design Resilient Architectures – Auto Scaling Group Health Check Troubleshooting","supplement":false,"stem":"The engineering team at a logistics company has noticed that the Auto Scaling group (ASG) is not terminating an unhealthy Amazon EC2 instance.<br>As a Solutions Architect, which of the following options would you suggest to troubleshoot the issue? (Select three)","options":[{"html":"The health check grace period for the instance has not expired","correct":true},{"html":"The Amazon EC2 instance could be a spot instance type, which cannot be terminated by the Auto Scaling group (ASG)","correct":false},{"html":"A custom health check might have failed. The Auto Scaling group (ASG) does not terminate instances that are set unhealthy by custom checks","correct":false},{"html":"The instance has failed the Elastic Load Balancing (ELB) health check status","correct":true},{"html":"A user might have updated the configuration of the Auto Scaling group (ASG) and increased the minimum number of instances forcing ASG to keep all instances alive","correct":false},{"html":"The instance maybe in Impaired status","correct":true}],"multi":3,"analysis":"<p>Liệt kê đúng các nguyên nhân hợp lệ khiến ASG CHƯA terminate instance lỗi</p>","answer":"<p>Grace period, health check type bị đặt sai (EC2 thay vì ELB), và trạng thái Impaired đều là nguyên nhân THẬT khiến ASG trì hoãn terminate.</p>","explain":"<ul><li><b>A. ✓</b> Đúng — trong grace period, ASG chưa đánh giá/terminate theo health check.</li><li><b>B. ✗</b> Sai — ASG vẫn terminate được Spot Instance khi mất capacity hoặc hết giá.</li><li><b>C. ✗</b> Sai — custom health check thất bại vẫn khiến ASG terminate instance (qua SetInstanceHealth).</li><li><b>D. ✓</b> Đúng — nếu health check type đang đặt là EC2 (không phải ELB) thì ASG bỏ qua việc instance fail ELB health check.</li><li><b>E. ✗</b> Sai — tăng min capacity sẽ khiến ASG launch thêm instance khoẻ mạnh, không 'giữ sống' instance lỗi.</li><li><b>F. ✓</b> Đúng — ASG chờ vài phút cho instance ở trạng thái Impaired có cơ hội hồi phục trước khi terminate.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các phát biểu phủ định về hành vi ASG (không terminate Spot, giữ sống khi tăng min, bỏ qua custom check) nghe hợp lý nhưng đều sai với hành vi thực tế của ASG.</p>","tip":"<p>Khi ASG 'không terminate' instance lỗi: kiểm tra health check type (EC2 vs ELB), grace period, và trạng thái Impaired trước — đừng nghi ngờ các cơ chế ASG vốn vẫn hoạt động bình thường (Spot termination, custom health check).</p>"},{"id":19,"topic":"Design Secure Architectures – S3 SSE-KMS Automatic Key Rotation","supplement":false,"stem":"A financial services company wants to store confidential data in Amazon S3 and it needs to meet the following data security and compliance norms:<br>Encryption key usage must be logged for auditing purposes<br>Encryption Keys must be rotated every year<br>The data must be encrypted at rest<br>Which is the MOST operationally efficient solution?","options":[{"html":"Server-side encryption with AWS Key Management Service (AWS KMS) keys (SSE-KMS) with automatic key rotation","correct":true},{"html":"Server-side encryption with customer-provided keys (SSE-C) with automatic key rotation","correct":false},{"html":"Server-side encryption (SSE-S3) with automatic key rotation","correct":false},{"html":"Server-side encryption with AWS Key Management Service (AWS KMS) keys (SSE-KMS) with manual key rotation","correct":false}],"multi":1,"analysis":"<p>Ghép đúng loại mã hoá S3 đáp ứng ĐỦ cả 3 tiêu chí (audit + rotate + at-rest) với ít thao tác nhất</p>","answer":"<p>SSE-KMS với automatic key rotation là lựa chọn duy nhất thoả cả 3 yêu cầu mà không cần tự xây thêm cơ chế nào.</p>","explain":"<ul><li><b>A. ✓</b> SSE-KMS có audit trail qua CloudTrail/KMS API và hỗ trợ auto-rotate hàng năm — đáp ứng cả 3 yêu cầu, ít thao tác nhất.</li><li><b>B. ✗</b> SSE-C phải tự xây cơ chế rotate khoá, không 'tự động' theo đúng nghĩa vận hành.</li><li><b>C. ✗</b> SSE-S3 không hỗ trợ audit việc sử dụng khoá — không đạt yêu cầu 'logged for auditing'.</li><li><b>D. ✗</b> Manual rotation tốn công vận hành hơn automatic — không phải lựa chọn hiệu quả nhất.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> SSE-S3 và SSE-C đều mã hoá dữ liệu nhưng thiếu khả năng audit (SSE-S3) hoặc tự động hoá rotate (SSE-C) — chỉ đáp ứng một phần yêu cầu.</p>","tip":"<p>Cần audit việc dùng khoá qua CloudTrail + rotate khoá tự động → SSE-KMS với automatic key rotation.</p>"},{"id":20,"topic":"Design Secure Architectures – Shared Services VPC","supplement":false,"stem":"An e-commerce company operates multiple AWS accounts and has interconnected these accounts in a hub-and-spoke style using the AWS Transit Gateway. Amazon Virtual Private Cloud (Amazon VPCs) have been provisioned across these AWS accounts to facilitate network isolation.<br>Which of the following solutions would reduce both the administrative overhead and the costs while providing shared access to services required by workloads in each of the VPCs?","options":[{"html":"Build a shared services Amazon Virtual Private Cloud (Amazon VPC)","correct":true},{"html":"Use Fully meshed VPC Peering connection","correct":false},{"html":"Use VPCs connected with AWS Direct Connect","correct":false},{"html":"Use Transit VPC to reduce cost and share the resources across Amazon Virtual Private Cloud (Amazon VPCs)","correct":false}],"multi":1,"analysis":"<p>Tận dụng hạ tầng hub (Transit Gateway) sẵn có để chia sẻ dịch vụ chung, thay vì xây thêm kiến trúc kết nối mới</p>","answer":"<p>Shared services VPC gắn vào Transit Gateway hiện có là cách rẻ và ít overhead nhất để mọi VPC cùng dùng chung tài nguyên như VPC endpoint.</p>","explain":"<ul><li><b>A. ✓</b> Shared services VPC tập trung các dịch vụ dùng chung (VPC endpoint, directory...) qua Transit Gateway có sẵn, giảm overhead và chi phí.</li><li><b>B. ✗</b> Fully meshed Peering phức tạp hoá quản lý route khi số VPC tăng, không tận dụng Transit Gateway đã có.</li><li><b>C. ✗</b> Direct Connect dùng cho kết nối on-premises, không phải cách chia sẻ dịch vụ giữa các VPC nội bộ.</li><li><b>D. ✗</b> Transit VPC là kiến trúc cũ dùng EC2 chạy VPN tự quản lý, tốn kém hơn, lại trùng chức năng với Transit Gateway đã có sẵn.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Transit VPC nghe giống Transit Gateway nhưng là kiến trúc cũ, tự quản lý EC2 VPN, tốn kém và dư thừa khi đã có Transit Gateway.</p>","tip":"<p>Có Transit Gateway hub-and-spoke rồi và cần chia sẻ dịch vụ chung giữa các VPC → thêm một shared services VPC vào mạng lưới đó, không cần kiến trúc kết nối mới.</p>"},{"id":21,"topic":"Design High-Performing Architectures – DataSync + Direct Connect to EFS","supplement":false,"stem":"A media company has created an AWS Direct Connect connection for migrating its flagship application to the AWS Cloud. The on-premises application writes hundreds of video files into a mounted NFS file system daily. Post-migration, the company will host the application on an Amazon EC2 instance with a mounted Amazon Elastic File System (Amazon EFS) file system. Before the migration cutover, the company must build a process that will replicate the newly created on-premises video files to the Amazon EFS file system.<br>Which of the following represents the MOST operationally efficient way to meet this requirement?","options":[{"html":"Configure an AWS DataSync agent on the on-premises server that has access to the NFS file system. Transfer data over the AWS Direct Connect connection to an Amazon S3 bucket by using public VIF. Set up an AWS Lambda function to process event notifications from Amazon S3 and copy the video files from Amazon S3 to the Amazon EFS file system","correct":false},{"html":"Configure an AWS DataSync agent on the on-premises server that has access to the NFS file system. Transfer data over the AWS Direct Connect connection to an AWS PrivateLink interface VPC endpoint for Amazon EFS by using a private VIF. Set up an AWS DataSync scheduled task to send the video files to the Amazon EFS file system every 24 hours","correct":true},{"html":"Configure an AWS DataSync agent on the on-premises server that has access to the NFS file system. Transfer data over the AWS Direct Connect connection to an AWS VPC peering endpoint for Amazon EFS by using a private VIF. Set up an AWS DataSync scheduled task to send the video files to the Amazon EFS file system every 24 hours","correct":false},{"html":"Configure an AWS DataSync agent on the on-premises server that has access to the NFS file system. Transfer data over the AWS Direct Connect connection to an Amazon S3 bucket by using a VPC gateway endpoint for Amazon S3. Set up an AWS Lambda function to process event notifications from Amazon S3 and copy the video files from Amazon S3 to the Amazon EFS file system","correct":false}],"multi":1,"analysis":"<p>Chọn đường truyền NGẮN NHẤT và đúng loại VIF cho đúng dịch vụ đích (EFS, không phải S3 trung gian)</p>","answer":"<p>DataSync có thể gửi trực tiếp tới EFS qua private VIF và interface endpoint, không cần trung chuyển qua S3 và Lambda như các phương án khác.</p>","explain":"<ul><li><b>A. ✗</b> Vòng qua S3 + Lambda rồi mới tới EFS là thừa bước, kém hiệu quả hơn DataSync gửi thẳng tới EFS.</li><li><b>B. ✓</b> DataSync qua private VIF tới interface endpoint của EFS, gửi thẳng tới đích, lên lịch định kỳ — ít bước nhất, đúng dịch vụ đích.</li><li><b>C. ✗</b> 'VPC peering endpoint for Amazon EFS' là khái niệm không tồn tại — VPC Peering không dùng để truyền dữ liệu qua Direct Connect kiểu này.</li><li><b>D. ✗</b> Vẫn đi vòng qua S3 rồi Lambda copy sang EFS — thêm thành phần không cần thiết so với gửi thẳng bằng DataSync.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 'VPC peering endpoint for EFS' là cụm từ bịa, không phải khái niệm AWS thật — dễ bị bỏ qua nếu không soi kỹ tên dịch vụ.</p>","tip":"<p>DataSync hỗ trợ đích trực tiếp là S3, EFS, hay FSx — không cần bày thêm bước trung chuyển qua S3 nếu đích thật sự là EFS.</p>"},{"id":22,"topic":"Design High-Performing Architectures – S3 Data Lake Lifecycle Cost Optimization","supplement":false,"stem":"A big data consulting firm needs to set up a data lake on Amazon S3 for a Health-Care client. The data lake is split in raw and refined zones. For compliance reasons, the source data needs to be kept for a minimum of 5 years. The source data arrives in the raw zone and is then processed via an AWS Glue based extract, transform, and load (ETL) job into the refined zone. The business analysts run ad-hoc queries only on the data in the refined zone using Amazon Athena. The team is concerned about the cost of data storage in both the raw and refined zones as the data is increasing at a rate of 1 terabyte daily in each zone.<br>As a solutions architect, which of the following would you recommend as the MOST cost-optimal solution? (Select two)","options":[{"html":"Use AWS Glue ETL job to write the transformed data in the refined zone using CSV format","correct":false},{"html":"Create an AWS Lambda function based job to delete the raw zone data after 1 day","correct":false},{"html":"Use AWS Glue ETL job to write the transformed data in the refined zone using a compressed file format","correct":true},{"html":"Setup a lifecycle policy to transition the raw zone data into Amazon S3 Glacier Deep Archive after 1 day of object creation","correct":true},{"html":"Setup a lifecycle policy to transition the refined zone data into Amazon S3 Glacier Deep Archive after 1 day of object creation","correct":false}],"multi":2,"analysis":"<p>Tối ưu chi phí lưu trữ khác nhau cho 2 zone có mục đích sử dụng khác nhau (archive vs truy vấn thường xuyên)</p>","answer":"<p>Raw zone chỉ cần lưu trữ tuân thủ (phù hợp Glacier Deep Archive), còn refined zone cần truy vấn ngay nên chỉ tối ưu bằng nén dữ liệu, không đổi storage class.</p>","explain":"<ul><li><b>A. ✗</b> CSV không nén, tốn chi phí lưu trữ hơn định dạng nén.</li><li><b>B. ✗</b> Dữ liệu raw zone phải giữ tối thiểu 5 năm vì lý do tuân thủ — không được xoá sau 1 ngày.</li><li><b>C. ✓</b> Ghi dữ liệu refined dưới định dạng nén giảm đáng kể chi phí lưu trữ.</li><li><b>D. ✓</b> Raw zone không còn được truy vấn thường xuyên, chuyển sang Glacier Deep Archive sau 1 ngày vẫn giữ đủ 5 năm với chi phí thấp nhất.</li><li><b>E. ✗</b> Refined zone đang được Athena truy vấn ad-hoc liên tục — không thể chuyển sang Glacier Deep Archive.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Xoá raw zone sau 1 ngày nghe tiết kiệm nhất nhưng vi phạm thẳng yêu cầu tuân thủ giữ dữ liệu 5 năm.</p>","tip":"<p>Dữ liệu cần giữ lâu nhưng ít truy cập → chuyển storage class (Glacier Deep Archive). Dữ liệu cần truy vấn thường xuyên → tối ưu bằng định dạng nén, không đổi storage class.</p>"},{"id":23,"topic":"Design High-Performing Architectures – Aurora Global Database (Relational Scale)","supplement":false,"stem":"An IT company has an Access Control Management (ACM) application that uses Amazon RDS for MySQL but is running into performance issues despite using Read Replicas. The company has hired you as a solutions architect to address these performance-related challenges without moving away from the underlying relational database schema. The company has branch offices across the world, and it needs the solution to work on a global scale.<br>Which of the following will you recommend as the MOST cost-effective and high-performance solution?","options":[{"html":"Spin up Amazon EC2 instances in each AWS region, install MySQL databases and migrate the existing data into these new databases","correct":false},{"html":"Use Amazon Aurora Global Database to enable fast local reads with low latency in each region","correct":true},{"html":"Spin up a Amazon Redshift cluster in each AWS region. Migrate the existing data into Redshift clusters","correct":false},{"html":"Use Amazon DynamoDB Global Tables to provide fast, local, read and write performance in each region","correct":false}],"multi":1,"analysis":"<p>Mở rộng ra toàn cầu NHƯNG vẫn giữ nguyên schema quan hệ hiện có</p>","answer":"<p>Aurora Global Database là lựa chọn duy nhất vừa tương thích MySQL (giữ schema), vừa đọc nhanh ở từng Region.</p>","explain":"<ul><li><b>A. ✗</b> Tự cài MySQL trên EC2 ở nhiều Region là cơn ác mộng vận hành, không phải giải pháp managed.</li><li><b>B. ✓</b> Aurora Global Database giữ nguyên engine quan hệ (MySQL-compatible) và cho phép đọc local, độ trễ thấp ở mỗi Region.</li><li><b>C. ✗</b> Redshift là data warehouse phân tích, không phù hợp làm database giao dịch (transactional).</li><li><b>D. ✗</b> DynamoDB là NoSQL, vi phạm yêu cầu giữ nguyên schema quan hệ hiện có.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> DynamoDB Global Tables nghe rất 'global' và nhanh nhưng là NoSQL, vi phạm ràng buộc không đổi schema quan hệ.</p>","tip":"<p>Yêu cầu giữ nguyên relational schema và mở rộng đa Region → Aurora Global Database. Nếu được đổi sang NoSQL → DynamoDB Global Tables.</p>"},{"id":24,"topic":"Design Resilient Architectures – EBS vs S3/EFS for Shared Storage","supplement":false,"stem":"A startup has just developed a video backup service hosted on a fleet of Amazon EC2 instances. The Amazon EC2 instances are behind an Application Load Balancer and the instances are using Amazon Elastic Block Store (Amazon EBS) Volumes for storage. The service provides authenticated users the ability to upload videos that are then saved on the EBS volume attached to a given instance. On the first day of the beta launch, users start complaining that they can see only some of the videos in their uploaded videos backup. Every time the users log into the website, they claim to see a different subset of their uploaded videos.<br>Which of the following is the MOST optimal solution to make sure that users can view all the uploaded videos? (Select two)","options":[{"html":"Write a one time job to copy the videos from all Amazon EBS volumes to Amazon S3 and then modify the application to use Amazon S3 standard for storing the videos","correct":true},{"html":"Mount Amazon Elastic File System (Amazon EFS) on all Amazon EC2 instances. Write a one time job to copy the videos from all Amazon EBS volumes to Amazon EFS. Modify the application to use Amazon EFS for storing the videos","correct":true},{"html":"Write a one time job to copy the videos from all Amazon EBS volumes to Amazon S3 Glacier Deep Archive and then modify the application to use Amazon S3 Glacier Deep Archive for storing the videos","correct":false},{"html":"Write a one time job to copy the videos from all Amazon EBS volumes to Amazon DynamoDB and then modify the application to use Amazon DynamoDB for storing the videos","correct":false},{"html":"Write a one time job to copy the videos from all Amazon EBS volumes to Amazon RDS and then modify the application to use Amazon RDS for storing the videos","correct":false}],"multi":2,"analysis":"<p>Nhận diện gốc rễ: dữ liệu bị 'phân mảnh' vì gắn với local storage của từng instance — cần storage DÙNG CHUNG</p>","answer":"<p>Chuyển sang S3 hoặc EFS — cả hai đều là storage chia sẻ được giữa nhiều EC2 — giải quyết đúng nguyên nhân video bị phân tán theo từng EBS riêng.</p>","explain":"<ul><li><b>A. ✓</b> S3 là kho lưu trữ dùng chung, mọi instance/load balancer đều truy cập cùng 1 nguồn dữ liệu — đúng gốc rễ vấn đề.</li><li><b>B. ✓</b> EFS cũng là storage dùng chung qua nhiều EC2, giải quyết đúng việc dữ liệu bị phân tán theo từng EBS riêng biệt.</li><li><b>C. ✗</b> Glacier Deep Archive chỉ dùng lưu trữ dài hạn, không phục vụ trực tiếp nội dung cho ứng dụng web.</li><li><b>D. ✗</b> DynamoDB là NoSQL key-value, không phù hợp lưu file video.</li><li><b>E. ✗</b> RDS là database quan hệ, không phải nơi lưu trữ file video.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các lựa chọn dùng database (DynamoDB, RDS) hay storage archival (Glacier Deep Archive) đều sai MỤC ĐÍCH sử dụng dù nghe như giải pháp lưu trữ hợp lệ.</p>","tip":"<p>EBS gắn cục bộ theo từng instance — khi cần dữ liệu dùng chung giữa nhiều EC2 (đặc biệt sau ALB phân tải ngẫu nhiên), phải chuyển sang S3 hoặc EFS.</p>"},{"id":25,"topic":"Design Secure Architectures – RDS Encryption via Snapshot","supplement":false,"stem":"Upon a security review of your AWS account, an AWS consultant has found that a few Amazon RDS databases are unencrypted. As a Solutions Architect, what steps must be taken to encrypt the Amazon RDS databases?","options":[{"html":"Enable Multi-AZ for the database, and make sure the standby instance is encrypted. Stop the main database to that the standby database kicks in, then disable Multi-AZ","correct":false},{"html":"Enable encryption on the Amazon RDS database using the AWS Console","correct":false},{"html":"Create a Read Replica of the database, and encrypt the read replica. Promote the read replica as a standalone database, and terminate the previous database","correct":false},{"html":"Take a snapshot of the database, copy it as an encrypted snapshot, and restore a database from the encrypted snapshot. Terminate the previous database","correct":true}],"multi":1,"analysis":"<p>RDS không hỗ trợ bật mã hoá tại chỗ — luôn phải đi qua đường snapshot → copy mã hoá → restore</p>","answer":"<p>Chỉ có đường vòng qua snapshot mới tạo ra được 1 bản sao mã hoá hợp lệ của database đã tồn tại; mã hoá chỉ chọn được lúc TẠO MỚI instance.</p>","explain":"<ul><li><b>A. ✗</b> Không thể 'chỉ mã hoá standby' riêng lẻ — standby luôn cùng trạng thái mã hoá với primary; đây là quy trình không tồn tại.</li><li><b>B. ✗</b> Không có nút bật mã hoá trực tiếp cho 1 RDS instance đã tồn tại trên Console.</li><li><b>C. ✗</b> Read replica của database chưa mã hoá cũng không thể tự mã hoá — bị giới hạn kế thừa trạng thái mã hoá từ nguồn.</li><li><b>D. ✓</b> Snapshot → copy sang snapshot có mã hoá → restore DB mới từ snapshot mã hoá — đúng quy trình chuẩn duy nhất để mã hoá RDS đã tồn tại.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Replica/standby nghe như lối tắt để 'thừa hưởng' mã hoá nhưng thực ra chúng kế thừa cùng trạng thái KHÔNG mã hoá từ nguồn.</p>","tip":"<p>Muốn mã hoá RDS instance đã có sẵn: snapshot → copy snapshot với encryption bật → restore DB mới từ snapshot mã hoá đó.</p>"},{"id":26,"topic":"Design Secure Architectures – RDS for SQL Server Multi-AZ","supplement":false,"stem":"A financial institution is transitioning its critical back-office systems to AWS. These systems currently rely on Microsoft SQL Server databases hosted on on-premises infrastructure. The data is highly sensitive and subject to regulatory compliance. The organization wants to enhance security and minimize database management tasks as part of the migration.<br>Which solution will best meet these goals with the least operational burden?","options":[{"html":"Migrate the SQL Server databases to a Multi-AZ Amazon RDS for SQL Server deployment. Enable encryption at rest by using an AWS Key Management Service (AWS KMS) managed key","correct":true},{"html":"Export the SQL Server databases to CSV format and store them in Amazon S3 with S3 bucket policies for access control. Use AWS Backup for data protection","correct":false},{"html":"Move the SQL Server data into Amazon Timestream to gain time series insights. Use AWS CloudTrail to monitor access to the data","correct":false},{"html":"Migrate the SQL Server databases to Amazon EC2 instances with encrypted EBS volumes. Use an AWS KMS customer managed key to enable encryption","correct":false}],"multi":1,"analysis":"<p>Giảm vận hành bằng managed database thay vì tự quản lý (self-managed) trên EC2</p>","answer":"<p>RDS for SQL Server Multi-AZ tự động hoá backup/patch/failover, chỉ cần thêm cấu hình KMS — ít thao tác vận hành nhất trong 4 lựa chọn.</p>","explain":"<ul><li><b>A. ✓</b> RDS for SQL Server Multi-AZ managed hoàn toàn backup/patch/failover, chỉ cần bật KMS cho encryption — đúng 'least operational burden'.</li><li><b>B. ✗</b> Xuất sang CSV mất hoàn toàn tính năng quan hệ (transaction, index, query) của SQL Server — không khả thi cho hệ thống nghiệp vụ sống.</li><li><b>C. ✗</b> Timestream là database chuỗi thời gian, không thay thế được SQL Server cho nghiệp vụ back-office tổng quát.</li><li><b>D. ✗</b> Tự quản lý SQL Server trên EC2 vẫn phải lo patch OS, backup, failover — nhiều vận hành hơn RDS managed.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> EC2 + EBS mã hoá nghe 'an toàn tương đương' nhưng vẫn đòi hỏi tự quản lý toàn bộ vòng đời OS/database — ngược với yêu cầu giảm vận hành.</p>","tip":"<p>Khi yêu cầu nhấn mạnh 'ít vận hành nhất' cho một engine thương mại như SQL Server/Oracle → ưu tiên Amazon RDS (managed) hơn tự cài trên EC2.</p>"},{"id":27,"topic":"Design Cost-Optimized Architectures – EC2 Multi-AZ High Availability Sizing","supplement":false,"stem":"An application is currently hosted on four Amazon EC2 instances (behind Application Load Balancer) deployed in a single Availability Zone (AZ). To maintain an acceptable level of end-user experience, the application needs at least 4 instances to be always available.<br>As a solutions architect, which of the following would you recommend so that the application achieves high availability with MINIMUM cost?","options":[{"html":"Deploy the instances in one Availability Zones. Launch two instances in the Availability Zone (AZ)","correct":false},{"html":"Deploy the instances in three Availability Zones (AZs). Launch two instances in each Availability Zone (AZ)","correct":true},{"html":"Deploy the instances in two Availability Zones (AZs). Launch four instances in each Availability Zone (AZ)","correct":false},{"html":"Deploy the instances in two Availability Zones (AZs). Launch two instances in each Availability Zone (AZ)","correct":false}],"multi":1,"analysis":"<p>Tính toán số instance tối thiểu để chịu được mất 1 AZ mà vẫn đạt ngưỡng yêu cầu, với chi phí thấp nhất</p>","answer":"<p>Phân bổ 2 instance mỗi AZ trên 3 AZ chỉ cần tổng 6 instance mà vẫn đảm bảo 4 instance sống sót nếu mất 1 AZ — ít instance thừa nhất trong các phương án đạt yêu cầu.</p>","explain":"<ul><li><b>A. ✗</b> Chỉ 2 instance trong 1 AZ đã dưới ngưỡng tối thiểu 4 instance luôn cần có.</li><li><b>B. ✓</b> 3 AZ nhân 2 instance bằng 6 instance; mất 1 AZ vẫn còn đủ 4 instance — vừa đủ, chi phí thấp nhất đạt yêu cầu.</li><li><b>C. ✗</b> 2 AZ nhân 4 instance bằng 8 instance — thừa tài nguyên, tốn kém hơn mức cần thiết.</li><li><b>D. ✗</b> 2 AZ nhân 2 instance bằng 4 instance; nếu mất 1 AZ chỉ còn 2 instance, dưới ngưỡng yêu cầu.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Phương án 2 AZ × 2 instance nghe tiết kiệm nhất nhưng thực ra KHÔNG đạt yêu cầu available tối thiểu khi mất 1 AZ.</p>","tip":"<p>Công thức chịu lỗi N AZ: luôn tính 'nếu mất 1 AZ, phần còn lại có đủ ngưỡng tối thiểu không' trước khi chọn phương án rẻ nhất.</p>"},{"id":28,"topic":"Design High-Performing Architectures – Glue Crawler + Athena","supplement":false,"stem":"A digital media company stores several terabytes of newly generated advertising interaction logs in an Amazon S3 bucket each day. The development team needs to inspect the new dataset quickly by running ad hoc queries before deciding whether the records should enter a downstream transformation workflow. The company wants to minimize infrastructure management and operational effort.<br>Which solution will meet these requirements with the LEAST operational overhead?","options":[{"html":"Load the S3 objects into Amazon Redshift by using COPY commands, and run SQL queries against the loaded data before initiating additional processing","correct":false},{"html":"Create external tables in an Apache Hive metastore, and run Apache Spark jobs on an Amazon EMR cluster to analyze the data in Amazon S3","correct":false},{"html":"Configure an AWS Glue crawler to catalog the S3 dataset, and use Amazon Athena to run ad hoc SQL queries directly against the data","correct":true},{"html":"Create external tables in a Spark catalog, and configure AWS Glue ETL jobs to read and analyze the newly generated data in Amazon S3","correct":false}],"multi":1,"analysis":"<p>Truy vấn nhanh dữ liệu TRÊN S3 mà không di dời/nạp vào hệ thống khác</p>","answer":"<p>Athena truy vấn trực tiếp trên S3 (qua Glue Data Catalog) mà không cần provision bất kỳ cụm compute nào — đúng nghĩa serverless, ít vận hành nhất.</p>","explain":"<ul><li><b>A. ✗</b> Phải load dữ liệu sang Redshift trước khi truy vấn — thêm bước di chuyển dữ liệu không cần thiết cho việc 'xem nhanh'.</li><li><b>B. ✗</b> Phải tự vận hành cụm EMR (Spark/Hive) — nhiều hạ tầng hơn hẳn so với Athena serverless.</l
