<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAA-C03 Luyện Đề</title>
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#eef0f5; --text:#1a1d23; --muted:#646c78;
  --border:#dfe3ea; --accent:#3a5bf0; --accent-hover:#2d49d6; --accent-soft:#e8edfe;
  --ok:#1a8f55; --ok-soft:#e4f6ec; --bad:#d13b3b; --bad-soft:#fcebeb; --warn:#b4790a; --warn-soft:#fff3db;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
    --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
    --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
    --shadow:none; --shadow-sm:none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
  --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
  --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
  --shadow:none; --shadow-sm:none;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.65 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .2s ease,color .2s ease;
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);padding:.1em .4em;border-radius:5px}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 56px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
header.top h1{
  font-size:21px;margin:0;letter-spacing:-.015em;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent-hover));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
header.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:7px 14px;min-width:76px;text-align:center;box-shadow:var(--shadow-sm);transition:border-color .15s ease,transform .15s ease}
.stat:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hover));width:0;transition:width .3s ease}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:16px}
.toolbar select,.btn{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 13px;cursor:pointer;transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent}
.toolbar label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.layout{display:grid;grid-template-columns:264px 1fr;gap:18px;align-items:start}
.side{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;position:sticky;top:14px;box-shadow:var(--shadow)}
.side h2{font-size:12.5px;margin:0 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.cell{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;height:32px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums;position:relative;padding:0;transition:border-color .12s ease,transform .12s ease,background .12s ease}
.cell:hover{border-color:var(--accent);transform:translateY(-1px)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell.dim{opacity:.32}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cell.sup{font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--border);background:var(--surface-2)}
.legend .l-ok::before{background:var(--ok-soft);border-color:var(--ok)}
.legend .l-bad::before{background:var(--bad-soft);border-color:var(--bad)}
.legend .l-flag::before{background:var(--warn);border-radius:50%;border:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.qnum{font-weight:700;font-size:17px;letter-spacing:-.01em}
.chip{font-size:12px;padding:3px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;transition:transform .12s ease}
.chip.sup{background:var(--warn-soft);color:var(--warn)}
.chip.multi{background:var(--surface-2);color:var(--muted);font-weight:500}
.flagbtn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:13px;transition:border-color .15s ease,background .15s ease,transform .15s ease}
.flagbtn:hover{border-color:var(--warn);color:var(--warn);transform:translateY(-1px)}
.flagbtn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.stem{line-height:1.7}
.stem p{margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;padding:11px 13px;cursor:pointer;background:var(--surface);transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.opt:hover{border-color:var(--accent);transform:translateX(2px);box-shadow:var(--shadow-sm)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--surface-2);transition:background .15s ease,border-color .15s ease,color .15s ease}
.opt.multi .key{border-radius:7px}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--border);transform:none;box-shadow:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.tag{font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)} .opt.missed .tag{color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .spacer{flex:1}
.verdict{margin:18px 0 6px;padding:11px 15px;border-radius:11px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.hint{margin-top:16px;border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:9px;padding:11px 15px;background:var(--surface-2)}
.hint h3{margin:0 0 6px;font-size:14px;color:var(--warn)}
details.sec{border:1px solid var(--border);border-radius:11px;margin-top:11px;background:var(--surface);transition:border-color .15s ease}
details.sec>summary{cursor:pointer;padding:11px 15px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"›";display:inline-block;transition:transform .15s ease;color:var(--muted);font-size:18px;line-height:1}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec .body{padding:0 16px 14px}
.body p{margin:7px 0}
.body ul,.body ol{margin:7px 0;padding-left:22px}
.body li{margin:4px 0}
.body table{border-collapse:collapse;width:100%;margin:9px 0;font-size:14px;display:block;overflow-x:auto}
.body th,.body td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
.body th{background:var(--surface-2)}
.sec.s-answer{border-left:3px solid var(--ok)}
.sec.s-tip{border-left:3px solid var(--accent)}
.empty{color:var(--muted);text-align:center;padding:44px 10px}
.kbd{font-size:12px;color:var(--muted);margin-top:14px}
.kbd kbd{font-family:inherit;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface-2)}
.summary h2{margin-top:0}
.summary table{border-collapse:collapse;width:100%;font-size:14px}
.summary th,.summary td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left}
.summary td.n{font-variant-numeric:tabular-nums;text-align:right}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s ease}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .grid{grid-template-columns:repeat(10,1fr)}
}
@media (max-width:480px){
  .wrap{padding:14px 16px 40px}
  .card{padding:16px}
  .grid{grid-template-columns:repeat(8,1fr)}
  .stat{min-width:64px;padding:5px 10px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>AWS SAA-C03 · Timed Mode Set 2</h1>
      <div class="sub">Đề tiếng Anh · Giải thích tiếng Việt · Tiến độ chỉ lưu trong phiên đang mở</div>
    <p style="margin:4px 0 0"><a href="../index.html" style="color:var(--accent)">&larr; Về trang luyện đề chính</a></p>
    </div>
    <div class="stats">
      <div class="stat"><b id="sDone">0</b><span>Đã làm</span></div>
      <div class="stat ok"><b id="sOk">0</b><span>Đúng</span></div>
      <div class="stat bad"><b id="sBad">0</b><span>Sai</span></div>
      <div class="stat"><b id="sPct">–</b><span>Tỷ lệ đúng</span></div>
    </div>
  </header>
  <div class="progress"><i id="prog"></i></div>

  <div class="toolbar">
    <select id="fFilter" aria-label="Lọc câu hỏi">
      <option value="all">Tất cả câu</option>
      <option value="todo">Chưa làm</option>
      <option value="bad">Làm sai</option>
      <option value="flag">Đã đánh dấu</option>
    </select>
    <select id="fTopic" aria-label="Lọc theo chủ đề"><option value="">Mọi chủ đề</option></select>
    <label><input type="checkbox" id="optShuffleQ"> Xáo câu hỏi</label>
    <label><input type="checkbox" id="optShuffleA"> Xáo đáp án</label>
    <label><input type="checkbox" id="optAuto" checked> Hiện giải thích sau khi kiểm tra</label>
    <span style="flex:1"></span>
    <button class="btn" id="btnSummary">Xem kết quả</button>
    <button class="btn ghost" id="btnReset">Làm lại</button>
    <button class="btn ghost" id="btnTheme" title="Đổi giao diện sáng/tối">◐</button>
  </div>

  <div class="layout">
    <aside class="side">
      <h2>Danh sách câu</h2>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span class="l-ok">Đúng</span><span class="l-bad">Sai</span><span>Chưa làm</span><span class="l-flag">Đánh dấu</span>
      </div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<script>
const Q = [{"id":1,"topic":"Design Resilient Architectures – ECS task role + SQS","supplement":false,"stem":"<p>A media company is setting up an Amazon ECS batch architecture for its image processing application. It will be hosted in an ECS Cluster with two ECS tasks that will handle image uploads from users and image processing. The first ECS task will process the user requests, store the image in an Amazon S3 input bucket, and push a message to a queue. The second task reads from the queue, parses the message containing the object name, and then downloads the object. Once the image is processed and transformed, it will upload the object to the S3 output bucket. To complete the architecture, the Solutions Architect must create a queue and the necessary IAM permissions for the ECS tasks.</p>\n<p>Which of the following should the Architect do next?</p>","options":[{"html":"Launch a new Amazon SQS queue and configure the second ECS task to read from it. Create an IAM role that the ECS tasks can assume in order to get access to the S3 buckets and SQS queue. Declare the IAM Role (<code>taskRoleArn</code>) in the task definition.","correct":true},{"html":"Launch a new Amazon Data Firehose and configure the second ECS task to read from it. Create an IAM role that the ECS tasks can assume in order to get access to the S3 buckets and Data Firehose. Specify the ARN of the IAM Role in the (<code>taskDefinitionArn</code>) field of the task definition.","correct":false},{"html":"Launch a new Amazon MQ queue and configure the second ECS task to read from it. Create an IAM role that the ECS tasks can assume in order to get access to the S3 buckets and MQ queue. Set the (<code>EnableTaskIAMRole</code>) option to true in the task definition.","correct":false},{"html":"Launch a new Amazon WorkSpaces applications queue and configure the second ECS task to read from it. Create an IAM role that the ECS tasks can assume in order to get access to the S3 buckets and WorkSpaces applications queue. Declare the IAM Role (<code>taskRoleArn</code>) in the task definition..","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Hai ECS task: task 1 lưu ảnh vào S3 và đẩy message; task 2 đọc queue, xử lý, ghi S3 output.</li>\n<li><strong>Yêu cầu chính:</strong> Tạo <strong>queue</strong> và <strong>IAM permission</strong> cho task.</li>\n<li><strong>Thông tin cần chú ý:</strong> Queue đơn giản → <strong>SQS</strong>; quyền cho container → <strong><code>taskRoleArn</code></strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Launch a new Amazon SQS queue and configure the second ECS task to read from it. Create an IAM role that the ECS tasks can assume in order to get access to the S3 buckets and SQS queue. Declare the IAM Role (<code>taskRoleArn</code>) in the task definition.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>SQS</strong> decouple hai task; task 2 poll, xử lý xong thì xóa message.</li>\n<li><strong>Task Role:</strong> trust <code>ecs-tasks.amazonaws.com</code>, cấp quyền S3 (Get/Put) và SQS (Send/Receive/Delete); khai báo ở <strong><code>taskRoleArn</code></strong>.</li>\n<li>Phân biệt: <strong><code>taskRoleArn</code></strong> cho ứng dụng; <strong><code>executionRoleArn</code></strong> cho ECS agent (pull ECR, ghi log, lấy secret).</li>\n</ul>","wrong":"<ul>\n<li><strong>Firehose + <code>taskDefinitionArn</code>:</strong> Firehose không phải queue; <code>taskDefinitionArn</code> là ARN của task definition.</li>\n<li><strong>Amazon MQ + <code>EnableTaskIAMRole</code>:</strong> MQ cho JMS/AMQP/MQTT khi migrate; tham số này <strong>không tồn tại</strong>.</li>\n<li><strong>WorkSpaces applications queue:</strong> WorkSpaces Applications (AppStream 2.0) là stream app desktop.</li>\n</ul>","tip":"<ul>\n<li>Quyền cho app trong ECS task → <strong><code>taskRoleArn</code></strong>. Quyền cho agent → <strong><code>executionRoleArn</code></strong>.</li>\n</ul>"},{"id":2,"topic":"Design Resilient Architectures – SNS message filtering","supplement":false,"stem":"<p>An insurance company plans to implement a message filtering feature in its web application. To implement this solution, it needs to create separate Amazon SQS queues for each type of quote request. The entire message processing should not exceed 24 hours.</p>\n<p>As the Solutions Architect for the company, which of the following solutions should be implemented to meet the above requirement?</p>","options":[{"html":"Create a data stream in Amazon Kinesis Data Streams. Use the Kinesis Client Library to deliver all the records to the designated SQS queues based on the quote request type.","correct":false},{"html":"Create one Amazon SNS topic and configure the SQS queues to subscribe to the SNS topic. Set the filter policies in the SNS subscriptions to publish the message to the designated SQS queue based on its quote request type.","correct":true},{"html":"Create one Amazon SNS topic and configure the SQS queues to subscribe to the SNS topic. Publish the same messages to all SQS queues. Filter the messages in each queue based on the quote request type.","correct":false},{"html":"Create multiple Amazon SNS topics and configure the SQS queues to subscribe to the SNS topics. Publish the message to the designated SQS queue based on the quote request type.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần <strong>message filtering</strong>, mỗi loại quote có một SQS queue riêng.</li>\n<li><strong>Yêu cầu chính:</strong> Message đúng loại phải vào đúng queue, xử lý trong 24 giờ.</li>\n<li><strong>Thông tin cần chú ý:</strong> \"Message filtering\" + SNS/SQS → <strong>SNS subscription filter policy</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Create one Amazon SNS topic and configure the SQS queues to subscribe to the SNS topic. Set the filter policies in the SNS subscriptions to publish the message to the designated SQS queue based on its quote request type.</strong></li>\n</ul>","explain":"<ul>\n<li>Ứng dụng publish vào <strong>một SNS topic</strong>. Mỗi queue subscribe vào topic.</li>\n<li>Mỗi subscription có <strong>filter policy</strong> theo message attribute (ví dụ <code>quote_type = \"auto\"</code>), SNS chỉ gửi message khớp tới queue đó.</li>\n<li>Không cần code phân loại, dễ mở rộng khi có loại quote mới.</li>\n<li>SQS giữ message mặc định 4 ngày (tối đa 14 ngày), nên 24 giờ không thành vấn đề.</li>\n</ul>","wrong":"<ul>\n<li><strong>Kinesis + KCL:</strong> Phải tự viết consumer để phân loại, phức tạp. Kinesis dành cho streaming lớn.</li>\n<li><strong>Gửi mọi message đến mọi queue rồi lọc ở queue:</strong> <strong>SQS không có tính năng lọc message</strong>.</li>\n<li><strong>Nhiều SNS topic:</strong> Ứng dụng phải tự chọn topic → logic lọc nằm trong code, khó quản lý hơn.</li>\n</ul>","tip":"<ul>\n<li>\"Message filtering\" + SNS/SQS → <strong>SNS subscription filter policy</strong>.</li>\n<li>Fan-out một message tới nhiều consumer → <strong>SNS + nhiều SQS</strong>.</li>\n<li>Tính năng filter nằm ở <strong>SNS subscription</strong>, không ở SQS.</li>\n</ul>"},{"id":3,"topic":"Design Resilient Architectures – Migrate DB nhúng sang DynamoDB bằng DMS","supplement":false,"stem":"<p>A company hosts its web application on a set of Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer (ALB). The application has an embedded NoSQL database. As the application receives more traffic, the application becomes overloaded mainly due to database requests. The management wants to ensure that the database is eventually consistent and highly available.</p>\n<p>Which of the following options can meet the company requirements with the least operational overhead?</p>","options":[{"html":"Configure the Auto Scaling group to spread the EC2 instances across three Availability Zones. Use the AWS Database Migration Service (AWS DMS) with a replication server and an ongoing replication task to migrate the embedded NoSQL database to Amazon DynamoDB.","correct":true},{"html":"Configure the Auto Scaling group to spread the EC2 instances across three Availability Zones. Configure replication of the NoSQL database on the set of EC2 instances to spread the database load.","correct":false},{"html":"Change the ALB with a Network Load Balancer (NLB) to handle more traffic and integrate AWS Global Accelerator to ensure high availability. Configure replication of the NoSQL database on the set of EC2 instances to spread the database load.","correct":false},{"html":"Change the ALB with a Network Load Balancer (NLB) to handle more traffic. Use the AWS Glue DynamoDB export connector to export data from Amazon DynamoDB to Amazon S3 for analytics periodically, and continue running the application's NoSQL database on the EC2 instances.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> NoSQL <strong>nhúng</strong> trên EC2 gây quá tải.</li>\n<li><strong>Yêu cầu chính:</strong> DB <strong>eventually consistent</strong>, <strong>highly available</strong>, <strong>least overhead</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Tách DB ra dịch vụ managed → <strong>DynamoDB</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Configure the Auto Scaling group to spread the EC2 instances across three Availability Zones. Use the AWS Database Migration Service (AWS DMS) with a replication server and an ongoing replication task to migrate the embedded NoSQL database to Amazon DynamoDB.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>DynamoDB:</strong> serverless, tự scale, replicate trên <strong>3 AZ</strong>, đọc mặc định <strong>eventually consistent</strong>.</li>\n<li><strong>DMS full load + ongoing replication (CDC):</strong> migrate mà vẫn đồng bộ thay đổi, gần như không downtime.</li>\n<li><strong>ASG trên 3 AZ:</strong> tầng ứng dụng HA.</li>\n</ul>","wrong":"<ul>\n<li><strong>Replicate NoSQL trên EC2:</strong> DB vẫn tranh tài nguyên; tự quản lý replication trong ASG rất tốn công.</li>\n<li><strong>NLB + Global Accelerator:</strong> Vấn đề ở DB, không ở load balancer.</li>\n<li><strong>NLB + Glue export:</strong> Mâu thuẫn và không giảm tải DB.</li>\n</ul>","tip":"<ul>\n<li>DB tự quản lý trên EC2 quá tải + least overhead → <strong>DynamoDB</strong> (NoSQL) hoặc <strong>RDS/Aurora</strong> (relational).</li>\n<li>Migrate có đồng bộ thay đổi → <strong>DMS (full load + CDC)</strong>.</li>\n<li>Chỉ đổi ALB sang NLB khi vấn đề ở DB → <strong>bẫy</strong>.</li>\n</ul>"},{"id":4,"topic":"Design High-Performing Architectures – Route 53 geoproximity routing","supplement":false,"stem":"<p>A company runs a messaging application in the <code>ap-northeast-1</code> and <code>ap-southeast-2</code> region. A Solutions Architect needs to create a routing policy wherein a larger portion of traffic from the Philippines and North India will be routed to the resource in the <code>ap-northeast-1</code> region.</p>\n<p>Which Route 53 routing policy should the Solutions Architect use?</p>","options":[{"html":"Geoproximity Routing","correct":true},{"html":"Geolocation Routing","correct":false},{"html":"Latency Routing","correct":false},{"html":"Weighted Routing","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Ứng dụng chạy ở Tokyo (<code>ap-northeast-1</code>) và Sydney (<code>ap-southeast-2</code>).</li>\n<li><strong>Yêu cầu chính:</strong> Đưa <strong>phần lớn hơn</strong> traffic từ <strong>Philippines và Bắc Ấn Độ</strong> về Tokyo.</li>\n<li><strong>Thông tin cần chú ý:</strong> Dựa trên <strong>vị trí địa lý</strong> + \"larger portion\" → <strong>mở rộng vùng phục vụ</strong> của một region.</li>\n</ul>","answer":"<ul>\n<li><strong>Geoproximity Routing</strong></li>\n</ul>","explain":"<ul>\n<li>Geoproximity định tuyến theo <strong>khoảng cách địa lý</strong> giữa người dùng và resource.</li>\n<li>Tham số <strong>bias</strong> (-99 đến +99): bias dương <strong>mở rộng</strong> vùng phục vụ → nhận nhiều traffic hơn; bias âm thu hẹp.</li>\n<li>Đặt bias dương cho Tokyo để \"kéo\" traffic từ Philippines, Bắc Ấn Độ. Cấu hình qua <strong>Route 53 Traffic Flow</strong>.</li>\n</ul>","wrong":"<ul>\n<li><strong>Geolocation:</strong> Quy tắc cố định theo quốc gia/châu lục; không có khái niệm \"phần lớn hơn\", không chia được \"Bắc Ấn Độ\".</li>\n<li><strong>Latency:</strong> AWS tự chọn theo latency, không điều chỉnh được.</li>\n<li><strong>Weighted:</strong> Chia % cho <strong>mọi</strong> người dùng, không dựa vào vị trí.</li>\n</ul>","tip":"<ul>\n<li>\"Shift/larger portion of traffic\" theo vị trí → <strong>Geoproximity (bias)</strong>.</li>\n<li>Nội dung theo quốc gia, bản quyền, ngôn ngữ → <strong>Geolocation</strong>.</li>\n</ul>"},{"id":5,"topic":"Design High-Performing Architectures – 250 TB qua đường 100 Mbps","supplement":false,"stem":"<p>A media company stores approximately 250 TB of archived video and audio assets on portable storage systems in an on-premises facility. The company needs to import the archive into Amazon S3 for long-term storage, durability, and redundancy. The company currently has a 100 Mbps dedicated line connecting its head office to the Internet. The team considered using AWS Storage Gateway Volume Gateway, but determined that the 100 Mbps connection would take weeks to transfer the full dataset.</p>\n<p>Which of the following is the FASTEST and MOST COST-EFFECTIVE way to import all this data to S3?</p>","options":[{"html":"Import the archived dataset to S3 through AWS Data Transfer Terminal.","correct":true},{"html":"Establish a direct connection using AWS Direct Connect, then transfer the data over to S3.","correct":false},{"html":"Upload it directly to S3","correct":false},{"html":"Use S3 Transfer Acceleration to speed up the upload.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> <strong>250 TB</strong> trên <strong>thiết bị lưu trữ di động</strong>, đường truyền <strong>100 Mbps</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Nhanh nhất</strong> và <strong>rẻ nhất</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> 250 TB / 100 Mbps ≈ <strong>230 ngày</strong>; dữ liệu nằm sẵn trên thiết bị mang đi được.</li>\n</ul>","answer":"<ul>\n<li><strong>Import the archived dataset to S3 through AWS Data Transfer Terminal.</strong></li>\n</ul>","explain":"<ul>\n<li>Mang thiết bị đến <strong>Data Transfer Terminal</strong>, upload thẳng lên S3 qua kết nối tốc độ rất cao → vài giờ đến vài ngày.</li>\n<li>Chỉ trả phí sử dụng terminal; khớp với chi tiết \"portable storage systems\".</li>\n</ul>","wrong":"<ul>\n<li><strong>Direct Connect:</strong> Thiết lập lâu, đắt cho một lần chuyển.</li>\n<li><strong>Upload trực tiếp:</strong> ~230 ngày.</li>\n<li><strong>Transfer Acceleration:</strong> Không vượt được giới hạn 100 Mbps; tốn thêm phí.</li>\n</ul>","tip":"<ul>\n<li><strong>1 TB qua 100 Mbps ≈ 1 ngày</strong>.</li>\n<li>Hàng trăm TB + mạng chậm → <strong>chuyển vật lý</strong> (Data Transfer Terminal; đề cũ là Snowball).</li>\n</ul>"},{"id":6,"topic":"Design High-Performing Architectures – Lambda@Edge","supplement":false,"stem":"<p>A media company wants to ensure that the images it delivers through Amazon CloudFront are compatible across various user devices. The company plans to serve images in WebP format to user agents that support it and return to JPEG format for those that don't. Additionally, the company wants to add a custom header to the response for tracking purposes.</p>\n<p>As a solution architect, what approach would one recommend to meet these requirements while minimizing operational overhead?</p>","options":[{"html":"Configure CloudFront behaviors to handle different image formats based on the User-Agent header. Use Lambda@Edge functions to modify the response headers and serve the appropriate format.","correct":true},{"html":"Create multiple CloudFront distributions, each serving a specific image format (WebP or JPEG). Route incoming requests based on the User-Agent header to the respective distribution using Amazon Route 53.","correct":false},{"html":"Implement an image conversion service on Amazon EC2 instances and integrate it with CloudFront. Use AWS Lambda functions to modify the response headers and serve the appropriate format based on the User-Agent header.","correct":false},{"html":"Generate a CloudFront response headers policy. Utilize the policy to deliver the suitable image format according to the User-Agent HTTP header in the incoming request.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Phân phối ảnh qua CloudFront cho nhiều loại thiết bị.</li>\n<li><strong>Yêu cầu chính:</strong> Trả <strong>WebP</strong> hoặc <strong>JPEG</strong> theo <strong>User-Agent</strong>; <strong>thêm custom header</strong>; ít công vận hành.</li>\n<li><strong>Thông tin cần chú ý:</strong> Cần <strong>logic tùy chỉnh tại edge</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Configure CloudFront behaviors to handle different image formats based on the User-Agent header. Use Lambda@Edge functions to modify the response headers and serve the appropriate format.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Lambda@Edge</strong> chạy code ở 4 thời điểm: viewer request, origin request, origin response, viewer response.</li>\n<li>Ở request: đọc User-Agent (hoặc <code>Accept</code>), <strong>sửa URI</strong> sang <code>.webp</code> hoặc <code>.jpg</code>.</li>\n<li>Ở response: <strong>thêm custom header</strong>.</li>\n<li>Nhớ đưa header liên quan vào <strong>cache key</strong> để không trả nhầm phiên bản đã cache.</li>\n</ul>","wrong":"<ul>\n<li><strong>Nhiều distribution + Route 53:</strong> Route 53 ở tầng DNS, <strong>không đọc được HTTP header</strong>.</li>\n<li><strong>EC2 + Lambda thường:</strong> Phải quản lý EC2; Lambda thường không chen vào luồng request của CloudFront.</li>\n<li><strong>Response headers policy:</strong> Thêm header được, nhưng <strong>không có logic</strong> chọn định dạng ảnh.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Nhu cầu tại CloudFront</th>\n<th>Giải pháp</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Thêm header cố định</td>\n<td><strong>Response headers policy</strong></td>\n</tr>\n<tr>\n<td>Logic nhẹ ở viewer (rewrite URL, redirect)</td>\n<td><strong>CloudFront Functions</strong></td>\n</tr>\n<tr>\n<td>Logic phức tạp, theo thiết bị, sửa origin request</td>\n<td><strong>Lambda@Edge</strong></td>\n</tr>\n</tbody>\n</table>"},{"id":7,"topic":"Design High-Performing Architectures – DynamoDB","supplement":false,"stem":"<p>A music publishing company is building a multitier web application that requires a key-value store with provisioned capacity mode that will save the document models. Each model is composed of band ID, album ID, song ID, composer ID, lyrics, and other data. The web tier will be hosted in an Amazon ECS cluster with AWS Fargate launch type.</p>\n<p>Which of the following is the MOST suitable setup for the database tier?</p>","options":[{"html":"Launch an Amazon DynamoDB table.","correct":true},{"html":"Launch an Amazon Aurora Serverless database.","correct":false},{"html":"Launch an Amazon RDS database with Read Replicas.","correct":false},{"html":"Use Amazon WorkDocs to store the document models.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Ứng dụng web nhiều tầng lưu các \"document model\".</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Key-value store</strong>, <strong>provisioned capacity mode</strong>, dữ liệu dạng <strong>document</strong>.</li>\n<li><strong>Thông tin gây nhiễu:</strong> ECS Fargate (tầng web).</li>\n</ul>","answer":"<ul>\n<li><strong>Launch an Amazon DynamoDB table.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>DynamoDB</strong> là NoSQL hỗ trợ cả <strong>key-value</strong> và <strong>document</strong>.</li>\n<li>Có hai chế độ: <strong>Provisioned</strong> (RCU/WCU) và <strong>On-demand</strong> → \"provisioned capacity mode\" là thuật ngữ đặc trưng của DynamoDB.</li>\n<li>Fully managed, độ trễ mili giây.</li>\n</ul>","wrong":"<ul>\n<li><strong>Aurora Serverless:</strong> Database <strong>quan hệ</strong>; \"serverless\" ngược với \"provisioned\".</li>\n<li><strong>RDS + Read Replicas:</strong> Cũng là database quan hệ.</li>\n<li><strong>WorkDocs:</strong> Dịch vụ <strong>chia sẻ tài liệu văn phòng</strong>, không phải database → bẫy chữ \"document\".</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Từ khóa</th>\n<th>Dịch vụ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>key-value, document, NoSQL, RCU/WCU</td>\n<td><strong>DynamoDB</strong></td>\n</tr>\n<tr>\n<td>relational, SQL, joins</td>\n<td><strong>RDS / Aurora</strong></td>\n</tr>\n<tr>\n<td>MongoDB-compatible</td>\n<td><strong>DocumentDB</strong></td>\n</tr>\n</tbody>\n</table>"},{"id":8,"topic":"Design Resilient Architectures – Route 53 failover routing, DR","supplement":false,"stem":"<p>A company has an enterprise web application hosted on Amazon ECS Docker containers that use an Amazon FSx for Lustre filesystem for its high-performance computing workloads. The application uses AWS X-Ray to trace requests across its containerized services. A warm standby environment is running in another AWS Region for disaster recovery.</p>\n<p>A solutions architect was assigned to design a system that will automatically route the live traffic to the disaster recovery (DR) environment only in the event that the primary application stack experiences an outage.</p>\n<p>What should the Architect do to satisfy this requirement?</p>","options":[{"html":"Set up an Amazon EventBridge rule to monitor the primary Amazon Route 53 DNS endpoint and create a custom AWS Lambda function. Execute the <code>ChangeResourceRecordSets</code> API call using the function to initiate the failover to the secondary DNS record.","correct":false},{"html":"Set up an Amazon CloudWatch Alarm to monitor the primary Amazon Route 53 DNS endpoint and create a custom AWS Lambda function. Execute the <code>ChangeResourceRecordSets</code> API call using the function to initiate the failover to the secondary DNS record.","correct":false},{"html":"Set up a Weighted routing policy configuration in Amazon Route 53 by adding health checks on both the primary stack and the DR environment. Configure the network access control list and the route table to allow Route 53 to send requests to the endpoints specified in the health checks. Enable the <code>Evaluate Target Health</code> option by setting it to <code>Yes</code>.","correct":false},{"html":"Set up a failover routing policy configuration in Amazon Route 53 by adding a health check on the primary service endpoint. Configure Route 53 to direct the DNS queries to the secondary record when the primary resource is unhealthy. Configure the network access control list and the route table to allow Route 53 to send requests to the endpoints specified in the health checks. Enable the <code>Evaluate Target Health</code> option by setting it to <code>Yes</code>.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Ứng dụng chạy trên ECS, có môi trường <strong>warm standby</strong> ở region khác để DR.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Tự động</strong> chuyển traffic sang DR <strong>chỉ khi</strong> primary gặp sự cố → mô hình <strong>active-passive</strong>.</li>\n<li><strong>Thông tin gây nhiễu:</strong> ECS, FSx for Lustre, X-Ray không ảnh hưởng đáp án.</li>\n</ul>","answer":"<ul>\n<li><strong>Set up a failover routing policy configuration in Amazon Route 53 by adding a health check on the primary service endpoint. Configure Route 53 to direct the DNS queries to the secondary record when the primary resource is unhealthy. Configure the network access control list and the route table to allow Route 53 to send requests to the endpoints specified in the health checks. Enable the <code>Evaluate Target Health</code> option by setting it to <code>Yes</code>.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Failover routing policy:</strong> một record <strong>Primary</strong>, một record <strong>Secondary</strong> (trỏ tới DR).</li>\n<li><strong>Health check</strong> liên tục kiểm tra primary. Khi primary unhealthy, Route 53 <strong>tự động</strong> trả về secondary, không cần code.</li>\n<li><strong>Evaluate Target Health = Yes:</strong> với alias record (ví dụ trỏ tới ALB), Route 53 dựa vào tình trạng health của chính resource đó.</li>\n<li><strong>NACL/route table</strong> phải cho phép health checker của Route 53 gửi request, nếu không health check luôn fail và failover nhầm.</li>\n</ul>","wrong":"<ul>\n<li><strong>EventBridge + Lambda:</strong> Tự chế, phức tạp, trong khi Route 53 đã có failover tự động. EventBridge cũng không giám sát trực tiếp DNS endpoint.</li>\n<li><strong>CloudWatch Alarm + Lambda:</strong> Tương tự, tốn công vận hành và độ trễ cao.</li>\n<li><strong>Weighted routing:</strong> Chia traffic theo tỷ lệ, DR vẫn nhận traffic khi primary bình thường → trái yêu cầu \"chỉ khi có sự cố\".</li>\n</ul>","tip":"<ul>\n<li>\"Route traffic to DR <strong>only when</strong> primary fails\" → <strong>Route 53 Failover routing + Health check</strong>.</li>\n<li>Đáp án dùng Lambda tự gọi API để failover thường sai khi đã có tính năng managed.</li>\n</ul>"},{"id":9,"topic":"Design High-Performing Architectures – S3 static website + CloudFront","supplement":false,"stem":"<p>A solutions architect is instructed to host a website that consists of HTML, CSS, and some Javascript files. The web pages will display several high-resolution images. The website should have optimal loading times and be able to respond to high request rates.</p>\n<p>Which of the following architectures can provide the most cost-effective and fastest loading experience?</p>","options":[{"html":"Host the website using an Nginx server in an EC2 instance. Upload the images in an S3 bucket. Use CloudFront as a CDN to deliver the images closer to end-users.","correct":false},{"html":"Upload the HTML, CSS, Javascript, and the images in a single bucket. Then enable website hosting. Create a CloudFront distribution and point the domain on the S3 website endpoint.","correct":true},{"html":"Host the website in an AWS Elastic Beanstalk environment. Upload the images in an S3 bucket. Use CloudFront as a CDN to deliver the images closer to your end-users.","correct":false},{"html":"Launch an Auto Scaling Group using an AMI that has a pre-configured Apache web server, then configure the scaling policy accordingly. Store the images in an Elastic Block Store. Then, point your instance's endpoint to AWS Global Accelerator.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Website gồm HTML, CSS, JS và ảnh độ phân giải cao.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Tải nhanh</strong>, chịu <strong>request lớn</strong>, <strong>rẻ nhất</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Toàn bộ là nội dung <strong>tĩnh</strong> → không cần EC2.</li>\n</ul>","answer":"<ul>\n<li><strong>Upload the HTML, CSS, Javascript, and the images in a single bucket. Then enable website hosting. Create a CloudFront distribution and point the domain on the S3 website endpoint.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>S3 static website hosting:</strong> không cần server, rẻ, tự scale.</li>\n<li><strong>CloudFront:</strong> cache tại edge → tải nhanh; giảm request về S3; hỗ trợ HTTPS, custom domain.</li>\n</ul>","wrong":"<ul>\n<li><strong>EC2 Nginx:</strong> Tốn tiền, phải quản lý, single point of failure; chỉ phần ảnh được cache.</li>\n<li><strong>Elastic Beanstalk:</strong> Bên dưới vẫn là EC2, phức tạp không cần thiết.</li>\n<li><strong>ASG + Apache + EBS + Global Accelerator:</strong> Đắt nhất; EBS không chia sẻ giữa instance; Global Accelerator <strong>không cache</strong>.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th></th>\n<th>CloudFront</th>\n<th>Global Accelerator</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Cache nội dung</td>\n<td>Có</td>\n<td>Không</td>\n</tr>\n<tr>\n<td>Phù hợp</td>\n<td>Web, HTTP/HTTPS, file tĩnh, video</td>\n<td>TCP/UDP, IP tĩnh anycast, failover nhanh</td>\n</tr>\n</tbody>\n</table>"},{"id":10,"topic":"Design Secure Architectures – AWS STS AssumeRole","supplement":false,"stem":"<p>An Intelligence Agency developed a missile tracking application that is hosted on both development and production AWS accounts. The Intelligence agency's junior developer only has access to the development account. The developer has received security clearance to access the agency's production account, but the access is only temporary, and only write access to Amazon EC2 and Amazon S3 is allowed.</p>\n<p>Which of the following allows the developer to issue short-lived access tokens that act as temporary security credentials, leveraging AWS Identity and Access Management (IAM) roles, to allow access to AWS resources?</p>","options":[{"html":"Use Amazon Cognito to issue JSON Web Tokens (JWT)","correct":false},{"html":"Use AWS Security Token Service (STS)","correct":true},{"html":"Use AWS IAM Identity Center","correct":false},{"html":"All of the given options are correct.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Hai account dev và prod; developer chỉ có quyền ở dev.</li>\n<li><strong>Yêu cầu chính:</strong> Truy cập prod <strong>tạm thời</strong>, chỉ <strong>ghi EC2 và S3</strong>, bằng <strong>short-lived token</strong> qua <strong>IAM role</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> \"Temporary credentials\" + \"IAM roles\" → <strong>STS AssumeRole</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Use AWS Security Token Service (STS)</strong></li>\n</ul>","explain":"<ul>\n<li>STS cấp <strong>temporary credentials</strong> (access key, secret key, session token), từ 15 phút đến tối đa 12 giờ.</li>\n<li>Trong account prod: tạo role có <strong>trust policy</strong> cho account dev và <strong>permission policy</strong> chỉ ghi EC2/S3.</li>\n<li>Developer gọi <strong><code>sts:AssumeRole</code></strong> (hoặc \"Switch Role\"); hết hạn thì credential vô hiệu.</li>\n</ul>","wrong":"<ul>\n<li><strong>Cognito JWT:</strong> Dành cho <strong>người dùng cuối của app</strong>; JWT của User Pool không phải AWS credential.</li>\n<li><strong>IAM Identity Center:</strong> SSO cho workforce, bên dưới vẫn dùng STS; câu hỏi nhắm thẳng vào dịch vụ cấp token.</li>\n<li><strong>All correct:</strong> Sai vì Cognito không phù hợp.</li>\n</ul>","tip":"<ul>\n<li><code>AssumeRole</code> (cross-account), <code>AssumeRoleWithWebIdentity</code> (OIDC), <code>AssumeRoleWithSAML</code> (AD/SAML), <code>GetSessionToken</code> (MFA).</li>\n</ul>"},{"id":11,"topic":"Design Resilient Architectures – Scale out với ELB / Route 53","supplement":false,"stem":"<p>A start-up company has an EC2 instance that is hosting a web application. The volume of users is expected to grow in the coming months and hence, you need to add more elasticity and scalability in your AWS architecture to cope with the demand.</p>\n<p>Which of the following options can satisfy the above requirement for the given scenario? (Select TWO.)</p>","options":[{"html":"Set up an S3 Cache in front of the EC2 instance.","correct":false},{"html":"Set up an AWS WAF behind your EC2 Instance.","correct":false},{"html":"Set up two EC2 instances and use Route 53 to route traffic based on a Weighted Routing Policy.","correct":true},{"html":"Set up two EC2 instances deployed using Launch Templates and integrated with AWS Glue.","correct":false},{"html":"Set up two EC2 instances and then put them behind an Elastic Load balancer (ELB).","correct":true}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Web app chạy trên <strong>một EC2 duy nhất</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Tăng <strong>elasticity</strong> và <strong>scalability</strong>. <strong>Select TWO</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Hướng giải quyết: <strong>thêm instance và chia traffic</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Set up two EC2 instances and use Route 53 to route traffic based on a Weighted Routing Policy.</strong></li>\n<li><strong>Set up two EC2 instances and then put them behind an Elastic Load balancer (ELB).</strong></li>\n</ul>","explain":"<ul>\n<li>Cả hai đều <strong>scale out</strong> và <strong>chia traffic</strong> cho nhiều instance.</li>\n<li><strong>ELB:</strong> phân phối đều, bỏ qua instance unhealthy; kết hợp <strong>Auto Scaling</strong> để co giãn tự động.</li>\n<li><strong>Route 53 weighted:</strong> chia traffic theo tỷ lệ ở tầng DNS, kết hợp health check.</li>\n</ul>","wrong":"<ul>\n<li><strong>S3 Cache:</strong> <strong>Không tồn tại</strong> dịch vụ này (cache dùng CloudFront/ElastiCache).</li>\n<li><strong>WAF phía sau EC2:</strong> WAF là firewall, không giúp scale.</li>\n<li><strong>Launch Template + Glue:</strong> Glue là ETL; không có cơ chế chia traffic.</li>\n</ul>","tip":"<ul>\n<li>Scalability/elasticity/HA cho EC2 → <strong>ELB + Auto Scaling (multi-AZ)</strong>.</li>\n<li>Cẩn thận các tên dịch vụ <strong>không tồn tại</strong>.</li>\n</ul>"},{"id":12,"topic":"Design Resilient Architectures – EBS snapshot automation (DLM)","supplement":false,"stem":"<p>A company is implementing its Business Continuity Plan. As part of this initiative, the IT Director instructed the IT team to set up an automated backup of all the Amazon EBS volumes attached to the company's Amazon EC2 instances. The solution must be implemented as soon as possible and should be both cost-effective and simple to maintain.</p>\n<p>What is the fastest and most cost-effective solution to automatically back up all of the EBS volumes?</p>","options":[{"html":"Use Amazon Data Lifecycle Manager (Amazon DLM) to automate the creation of EBS snapshots.","correct":true},{"html":"Set your Amazon Storage Gateway with EBS volumes as the data source and store the backups in your on-premises servers through the storage gateway.","correct":false},{"html":"For an automated solution, create a scheduled job that calls the \"create-snapshot\" command via the AWS CLI to take a snapshot of production EBS volumes periodically.","correct":false},{"html":"Use an EBS snapshot retention rule in AWS Backup to automatically manage snapshot retention and expiration.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Business Continuity Plan, cần backup tự động toàn bộ EBS.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Tự động</strong>, <strong>nhanh triển khai</strong>, <strong>rẻ</strong>, <strong>dễ bảo trì</strong>.</li>\n<li><strong>Thông tin gây nhiễu:</strong> \"Business Continuity Plan\", \"IT Director\".</li>\n</ul>","answer":"<ul>\n<li><strong>Use Amazon Data Lifecycle Manager (Amazon DLM) to automate the creation of EBS snapshots.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>DLM</strong> tự động <strong>tạo, giữ và xóa</strong> EBS snapshot theo <strong>lifecycle policy</strong>, chọn volume theo <strong>tag</strong>.</li>\n<li><strong>Không tốn phí</strong> cho DLM, chỉ trả tiền snapshot.</li>\n<li>Cấu hình vài phút trên console, không code.</li>\n</ul>","wrong":"<ul>\n<li><strong>Storage Gateway backup về on-premises:</strong> Sai mục đích, phức tạp, tốn kém.</li>\n<li><strong>Cron gọi AWS CLI:</strong> Tự viết script, tự quản lý máy chạy cron và việc xóa snapshot cũ → không \"simple to maintain\".</li>\n<li><strong>Retention rule trong AWS Backup:</strong> Chỉ nói về <strong>giữ/xóa</strong> snapshot, không mô tả việc <strong>tạo</strong> snapshot tự động.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Từ khóa</th>\n<th>Dịch vụ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Tự động snapshot <strong>EBS</strong>, đơn giản, rẻ</td>\n<td><strong>DLM</strong></td>\n</tr>\n<tr>\n<td>Backup tập trung nhiều dịch vụ, cross-account/region</td>\n<td><strong>AWS Backup</strong></td>\n</tr>\n<tr>\n<td>Tự viết script/cron</td>\n<td>Thường sai khi đề cần \"least overhead\"</td>\n</tr>\n</tbody>\n</table>"},{"id":13,"topic":"Design Resilient Architectures – Kinesis Data Streams + Lambda","supplement":false,"stem":"<p>A company is building an internal application that allows users to upload images. Each upload request must be sent to Amazon Kinesis Data Streams for processing before the pictures are stored in an Amazon S3 bucket.</p>\n<p>The application should immediately return a success message to the user after the upload, while the downstream processing is handled asynchronously. The processing typically takes about 5 minutes to complete.</p>\n<p>Which solution will enable asynchronous processing from Kinesis to S3 in the most cost-effective way?</p>","options":[{"html":"Send data from Kinesis Data Streams to Amazon Data Firehose and configure it to deliver directly to S3.","correct":false},{"html":"Use a combination of Amazon SQS to queue the requests and then asynchronously process them using On-Demand Amazon EC2 Instances.","correct":false},{"html":"Use Kinesis Data Streams with AWS Lambda consumers to asynchronously process records and write them to S3.","correct":true},{"html":"Use a combination of AWS Lambda and Step Functions to orchestrate service components and asynchronously process the requests.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Upload ảnh phải đi qua <strong>Kinesis Data Streams</strong> rồi mới lưu S3.</li>\n<li><strong>Yêu cầu chính:</strong> Trả success ngay, xử lý <strong>bất đồng bộ</strong>, mỗi lần khoảng <strong>5 phút</strong>, <strong>chi phí thấp nhất</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> 5 phút &lt; giới hạn <strong>15 phút</strong> của Lambda.</li>\n</ul>","answer":"<ul>\n<li><strong>Use Kinesis Data Streams with AWS Lambda consumers to asynchronously process records and write them to S3.</strong></li>\n</ul>","explain":"<ul>\n<li>Lambda dùng Kinesis Data Streams làm <strong>event source</strong>, tự đọc batch record, xử lý và ghi S3.</li>\n<li><strong>Serverless, trả tiền theo thời gian chạy</strong> → rẻ nhất khi tải không đều.</li>\n<li>Ứng dụng ghi vào Kinesis xong là trả success, Lambda xử lý phía sau.</li>\n</ul>","wrong":"<ul>\n<li><strong>Firehose → S3:</strong> Firehose chủ yếu <strong>deliver</strong> dữ liệu, không chạy logic xử lý tùy chỉnh dài ~5 phút.</li>\n<li><strong>SQS + EC2 On-Demand:</strong> Thừa SQS vì đề đã bắt buộc Kinesis; EC2 chạy liên tục, đắt hơn.</li>\n<li><strong>Lambda + Step Functions:</strong> Chỉ có một bước xử lý, thêm Step Functions là phức tạp và tốn phí state transition.</li>\n</ul>","tip":"<ul>\n<li>Kinesis Data Streams + xử lý tùy chỉnh + cost-effective → <strong>Lambda consumer</strong> (≤ 15 phút).</li>\n<li>Chỉ cần đẩy stream vào S3/Redshift/OpenSearch, không code → <strong>Data Firehose</strong>.</li>\n</ul>"},{"id":14,"topic":"Design Secure Architectures – VPC endpoint policy","supplement":false,"stem":"<p>An organization needs to control access to several Amazon S3 buckets. The organization plans to use a gateway endpoint to allow access to trusted buckets. The organization shall not use overly broad policies like <code>AmazonS3FullAccess</code>.</p>\n<p>Which of the following could help achieve this requirement?</p>","options":[{"html":"Generate an endpoint policy for trusted VPCs.","correct":false},{"html":"Generate an endpoint policy for trusted S3 buckets.","correct":true},{"html":"Generate a bucket policy for trusted VPCs.","correct":false},{"html":"Generate a bucket policy for trusted S3 buckets.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Dùng <strong>gateway endpoint</strong> để truy cập S3.</li>\n<li><strong>Yêu cầu chính:</strong> Traffic qua endpoint <strong>chỉ tới bucket tin cậy</strong>, không dùng policy quá rộng.</li>\n<li><strong>Thông tin cần chú ý:</strong> Kiểm soát ở <strong>tầng endpoint</strong> = giới hạn <strong>bucket nào</strong> được truy cập từ VPC.</li>\n</ul>","answer":"<ul>\n<li><strong>Generate an endpoint policy for trusted S3 buckets.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Endpoint policy</strong> quyết định những gì được đi qua endpoint; mặc định là <strong>full access</strong>.</li>\n<li>Sửa <code>Resource</code> chỉ gồm ARN các bucket tin cậy (ví dụ <code>arn:aws:s3:::trusted-bucket-1</code> và <code>arn:aws:s3:::trusted-bucket-1/*</code>).</li>\n<li>Ngăn rò rỉ dữ liệu (data exfiltration) sang bucket lạ.</li>\n</ul>","wrong":"<ul>\n<li><strong>Endpoint policy cho trusted VPCs:</strong> Endpoint đã thuộc một VPC; đối tượng cần giới hạn là <strong>bucket</strong>.</li>\n<li><strong>Bucket policy cho trusted VPCs:</strong> Bảo vệ <strong>bucket</strong> khỏi truy cập ngoài (<code>aws:SourceVpce</code>), nhưng <strong>không ngăn VPC truy cập bucket khác</strong>.</li>\n<li><strong>Bucket policy cho trusted buckets:</strong> Về lý thuyết làm được, nhưng phải viết và duy trì bucket policy <strong>cho từng bucket một</strong>, tốn công hơn nhiều so với <strong>một</strong> endpoint policy liệt kê các bucket tin cậy. Đề yêu cầu kiểm soát qua gateway endpoint nên endpoint policy là lựa chọn đúng.</li>\n</ul>","tip":"<ul>\n<li><strong>Endpoint policy</strong> = kiểm soát <strong>đi ra</strong> (VPC được tới bucket nào).</li>\n<li><strong>Bucket policy</strong> = kiểm soát <strong>đi vào</strong> (ai được vào bucket).</li>\n</ul>"},{"id":15,"topic":"Design Secure Architectures – Site-to-Site VPN","supplement":false,"stem":"<p>An insurance company utilizes SAP HANA for its day-to-day ERP operations. Since it can't migrate this database due to customer preferences, it needs to integrate it with the current AWS workload in the VPC, in which it is required to establish a site-to-site VPN connection.</p>\n<p>What needs to be configured outside of the VPC for an AWS Virtual Private Network connection to succeed?</p>","options":[{"html":"The main route table in your VPC to route traffic through a NAT instance","correct":false},{"html":"A dedicated NAT instance in a public subnet","correct":false},{"html":"An Internet-routable IP address (static) of the customer gateway's external interface for the on-premises network","correct":true},{"html":"An EIP to the Virtual Private Gateway","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> SAP HANA ở on-premises cần kết nối VPC qua <strong>site-to-site VPN</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Cấu hình gì <strong>bên ngoài VPC</strong> (phía on-premises)?</li>\n<li><strong>Thông tin gây nhiễu:</strong> SAP HANA, ERP.</li>\n</ul>","answer":"<ul>\n<li><strong>An Internet-routable IP address (static) of the customer gateway's external interface for the on-premises network</strong></li>\n</ul>","explain":"<ul>\n<li>Phía AWS: <strong>Virtual Private Gateway</strong> (hoặc Transit Gateway). Phía on-premises: <strong>Customer Gateway device</strong>.</li>\n<li>Khi tạo Customer Gateway resource, phải khai báo <strong>IP public tĩnh</strong> của thiết bị để AWS dựng <strong>IPsec tunnel</strong>.</li>\n</ul>","wrong":"<ul>\n<li><strong>Route table qua NAT instance:</strong> Nằm <strong>trong VPC</strong>; traffic VPN route tới <strong>VGW</strong>.</li>\n<li><strong>NAT instance:</strong> Nằm trong VPC, không liên quan VPN.</li>\n<li><strong>EIP cho VGW:</strong> VGW không gắn EIP; AWS tự cấp 2 IP public cho 2 tunnel.</li>\n</ul>","tip":"<ul>\n<li>Site-to-Site VPN: <strong>VGW/TGW</strong> (AWS) + <strong>Customer Gateway có IP public tĩnh</strong> (on-premises), <strong>2 tunnel</strong>.</li>\n<li>Băng thông lớn, ổn định → <strong>Direct Connect</strong>.</li>\n</ul>"},{"id":16,"topic":"Design Resilient Architectures – Gateway endpoint, AWS Backup","supplement":false,"stem":"<p>A GraphQL API hosted is hosted in an Amazon EKS cluster with AWS Fargate launch type and deployed using AWS SAM. The API is connected to an Amazon DynamoDB table with DynamoDB Accelerator (DAX) as its data store. Both resources are hosted in the us-east-1 region.</p>\n<p>The AWS IAM authenticator for Kubernetes is integrated into the EKS cluster for role-based access control (RBAC) and cluster authentication. A solutions architect must improve network security by preventing database calls from traversing the public internet. An automated cross-account backup for the DynamoDB table is also required for long-term retention.</p>\n<p>Which of the following should the solutions architect implement to meet the requirement?</p>","options":[{"html":"Create a DynamoDB gateway endpoint. Set up a Network Access Control List (NACL) rule that allows outbound traffic to the <code>dynamodb.us-east-1.amazonaws.com</code> gateway endpoint. Use the built-in on-demand DynamoDB backups for cross-account backup and recovery.","correct":false},{"html":"Create a DynamoDB interface endpoint. Associate the endpoint to the appropriate route table. Enable Point-in-Time Recovery (PITR) to restore the DynamoDB table to a particular point in time on the same or a different AWS account.","correct":false},{"html":"Create a DynamoDB gateway endpoint. Associate the endpoint to the appropriate route table. Use AWS Backup to automatically copy the on-demand DynamoDB backups to another AWS account for disaster recovery.","correct":true},{"html":"Create a DynamoDB interface endpoint. Set up a stateless rule using AWS Network Firewall to control all outbound traffic to only use the <code>dynamodb.us-east-1.amazonaws.com</code> endpoint. Integrate the DynamoDB table with Amazon Timestream to allow point-in-time recovery from a different AWS account.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> API trên EKS Fargate, dùng DynamoDB + DAX.</li>\n<li><strong>Yêu cầu chính:</strong>\n  1. Call tới DB <strong>không đi qua Internet</strong>.\n  2. <strong>Backup tự động, cross-account</strong>, lưu trữ lâu dài.</li>\n<li><strong>Thông tin gây nhiễu:</strong> EKS, Fargate, SAM, GraphQL, DAX, IAM authenticator.</li>\n</ul>","answer":"<ul>\n<li><strong>Create a DynamoDB gateway endpoint. Associate the endpoint to the appropriate route table. Use AWS Backup to automatically copy the on-demand DynamoDB backups to another AWS account for disaster recovery.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Gateway VPC Endpoint:</strong> chỉ có cho <strong>S3 và DynamoDB</strong>, miễn phí. Hoạt động bằng cách thêm route (prefix list của DynamoDB) vào <strong>route table</strong> → traffic đi trong mạng AWS.</li>\n<li><strong>AWS Backup:</strong> backup plan theo lịch, retention dài hạn, <strong>tự động copy sang account khác</strong>.</li>\n</ul>","wrong":"<ul>\n<li><strong>Gateway endpoint + NACL + on-demand backup có sẵn:</strong> Gateway endpoint cần route table, NACL không định tuyến được. On-demand backup có sẵn không tự copy cross-account.</li>\n<li><strong>Interface endpoint + route table + PITR:</strong> Interface endpoint dùng ENI, <strong>không gắn route table</strong>. <strong>PITR chỉ restore trong cùng account</strong>.</li>\n<li><strong>Interface endpoint + Network Firewall + Timestream:</strong> Phức tạp. Timestream là DB time-series, không làm backup cho DynamoDB.</li>\n</ul>","tip":"<ul>\n<li>S3/DynamoDB + \"không đi qua Internet\" → <strong>Gateway endpoint + route table</strong>.</li>\n<li>\"Cross-account backup\", \"automated backup, long-term retention\" → <strong>AWS Backup</strong>.</li>\n</ul>"},{"id":17,"topic":"Design Secure Architectures – VPC, Security Group, NACL","supplement":false,"stem":"<p>A company has two On-Demand EC2 instances inside the Virtual Private Cloud in the same Availability Zone but are deployed to different subnets. One EC2 instance is running a database and the other EC2 instance a web application that connects with the database. You need to ensure that these two instances can communicate with each other for the system to work properly.</p>\n<p>What are the things you have to check so that these EC2 instances can communicate inside the VPC? (Select TWO.)</p>","options":[{"html":"Check if the default route is set to a NAT instance or Internet Gateway (IGW) for them to communicate.","correct":false},{"html":"Check if all security groups are set to allow the application host to communicate to the database on the right port and protocol.","correct":true},{"html":"Check if both instances are the same instance class.","correct":false},{"html":"Check the Network ACL if it allows communication between the two subnets.","correct":true},{"html":"Ensure that the EC2 instances are in the same Placement Group.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Hai EC2 cùng VPC, cùng AZ nhưng <strong>khác subnet</strong>: một chạy database, một chạy web app.</li>\n<li><strong>Yêu cầu chính:</strong> Kiểm tra những gì để hai instance <strong>giao tiếp được trong VPC</strong>. Đề yêu cầu <strong>Select TWO</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> \"Khác subnet\" nghĩa là traffic đi qua <strong>NACL</strong> của cả hai subnet, ngoài <strong>Security Group</strong> của từng instance.</li>\n</ul>","answer":"<ul>\n<li><strong>Check if all security groups are set to allow the application host to communicate to the database on the right port and protocol.</strong></li>\n<li><strong>Check the Network ACL if it allows communication between the two subnets.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Security Group</strong> là firewall gắn vào từng instance, có tính <strong>stateful</strong> (cho chiều đi thì chiều về tự động được cho phép).</li>\n<li>SG của database cần inbound rule mở đúng port DB (ví dụ 3306 cho MySQL, 5432 cho PostgreSQL).</li>\n<li>Nguồn của rule nên là SG của web app hoặc CIDR của subnet web.</li>\n<li><strong>Network ACL</strong> là firewall ở cấp subnet, có tính <strong>stateless</strong> (chiều về không tự động được cho phép).</li>\n<li>Hai instance ở hai subnet khác nhau, nên NACL của <strong>cả hai subnet</strong> phải cho phép traffic.</li>\n<li>Phải mở cả inbound lẫn outbound, kể cả dải <strong>ephemeral port 1024–65535</strong> cho traffic trả về.</li>\n</ul>","wrong":"<ul>\n<li><strong>NAT instance / Internet Gateway:</strong> Route table của mọi VPC luôn có sẵn route <code>local</code>, giúp các subnet trong VPC tự liên lạc với nhau. NAT và IGW chỉ dùng khi cần ra Internet.</li>\n<li><strong>Cùng instance class:</strong> Loại instance không ảnh hưởng đến kết nối mạng.</li>\n<li><strong>Cùng Placement Group:</strong> Placement group chỉ quyết định cách đặt instance trên phần cứng (giảm latency hoặc tăng khả năng chịu lỗi). Nó không phải điều kiện để giao tiếp.</li>\n</ul>","tip":"<ul>\n<li>\"Hai EC2 trong cùng VPC không giao tiếp được\" → gần như luôn là <strong>Security Group + NACL</strong>.</li>\n<li>SG: <strong>stateful</strong>, chỉ có rule <strong>allow</strong>. NACL: <strong>stateless</strong>, có cả <strong>allow và deny</strong>, xét rule theo số thứ tự.</li>\n</ul>"},{"id":18,"topic":"Design Secure Architectures – S3 encryption headers","supplement":false,"stem":"<p>All objects uploaded to an Amazon S3 bucket must be encrypted for security compliance. The bucket will use server-side encryption with Amazon S3-Managed encryption keys (SSE-S3) to encrypt data using 256-bit Advanced Encryption Standard (AES-256) block cipher.</p>\n<p>Which of the following request headers must be used?</p>","options":[{"html":"<code>x-amz-server-side-encryption-customer-key</code>","correct":false},{"html":"<code>x-amz-server-side-encryption-customer-algorithm</code>","correct":false},{"html":"<code>x-amz-server-side-encryption-customer-key-MD5</code>","correct":false},{"html":"<code>x-amz-server-side-encryption</code>","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Mọi object upload lên S3 phải được mã hóa.</li>\n<li><strong>Yêu cầu chính:</strong> Dùng <strong>SSE-S3</strong> (AES-256, S3 tự quản lý key) → cần header nào?</li>\n<li><strong>Thông tin cần chú ý:</strong> Header có chữ <strong>\"customer\"</strong> thuộc về <strong>SSE-C</strong>, không phải SSE-S3.</li>\n</ul>","answer":"<ul>\n<li><strong><code>x-amz-server-side-encryption</code></strong></li>\n</ul>","explain":"<ul>\n<li>Request yêu cầu SSE-S3 dùng header <code>x-amz-server-side-encryption: AES256</code>.</li>\n<li>Cùng header này với giá trị <code>aws:kms</code> là <strong>SSE-KMS</strong> (có thể kèm <code>x-amz-server-side-encryption-aws-kms-key-id</code>).</li>\n<li>Từ tháng 1/2023, S3 <strong>mặc định mã hóa mọi object mới bằng SSE-S3</strong>, nhưng đề thi vẫn hỏi header này.</li>\n</ul>","wrong":"<ul>\n<li>Ba header có chữ <strong><code>customer</code></strong> đều thuộc <strong>SSE-C</strong>, nơi khách hàng tự gửi key trong mỗi request:</li>\n<li><code>...-customer-algorithm</code>: thuật toán (AES256).</li>\n<li><code>...-customer-key</code>: key dạng base64.</li>\n<li><code>...-customer-key-MD5</code>: MD5 của key để kiểm tra toàn vẹn.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Kiểu mã hóa</th>\n<th>Header</th>\n<th>Giá trị</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>SSE-S3</td>\n<td><code>x-amz-server-side-encryption</code></td>\n<td><code>AES256</code></td>\n</tr>\n<tr>\n<td>SSE-KMS</td>\n<td><code>x-amz-server-side-encryption</code></td>\n<td><code>aws:kms</code></td>\n</tr>\n<tr>\n<td>SSE-C</td>\n<td><code>x-amz-server-side-encryption-customer-*</code></td>\n<td>key của khách hàng</td>\n</tr>\n</tbody>\n</table>"},{"id":19,"topic":"Design Cost-Optimized Architectures – Cost allocation tags","supplement":false,"stem":"<p>A company wants to organize the way it tracks its spending on AWS resources. A report that summarizes the total billing accrued by each department must be generated at the end of the month. The company already uses a Savings Plan for pricing, but that does not break down costs by department.</p>\n<p>Which solution will meet the requirements?</p>","options":[{"html":"Use AWS Cost Explorer to view spending and filter usage data by <code>Resource</code>.","correct":false},{"html":"Tag resources with the department name and enable cost allocation tags.","correct":true},{"html":"Tag resources with the department name and configure a budget action in AWS Budget.","correct":false},{"html":"Create a Cost and Usage report for AWS services that each department is using.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Theo dõi chi tiêu AWS.</li>\n<li><strong>Yêu cầu chính:</strong> Báo cáo <strong>chi phí theo phòng ban</strong> cuối tháng.</li>\n<li><strong>Thông tin gây nhiễu:</strong> Savings Plan.</li>\n</ul>","answer":"<ul>\n<li><strong>Tag resources with the department name and enable cost allocation tags.</strong></li>\n</ul>","explain":"<ul>\n<li>Gắn <strong>tag</strong> <code>Department = ...</code> lên resource.</li>\n<li>Tag mặc định <strong>không hiện</strong> trong billing; phải <strong>activate</strong> ở <strong>Cost allocation tags</strong>.</li>\n<li>Sau đó xem trong <strong>Cost Explorer</strong> (group by tag) hoặc <strong>CUR</strong>. Tag chỉ áp dụng từ lúc kích hoạt.</li>\n</ul>","wrong":"<ul>\n<li><strong>Lọc theo <code>Resource</code>:</strong> Không biết resource thuộc phòng ban nào.</li>\n<li><strong>Budget action:</strong> Tự hành động khi vượt ngân sách, không phải báo cáo; thiếu bước kích hoạt tag.</li>\n<li><strong>CUR theo dịch vụ:</strong> Nhiều phòng ban dùng chung dịch vụ, không phân biệt được.</li>\n</ul>","tip":"<ul>\n<li>Chi phí theo department/project/team → <strong>Tag + Cost allocation tags</strong>.</li>\n<li>Theo account → <strong>Organizations consolidated billing</strong>.</li>\n</ul>"},{"id":20,"topic":"Design High-Performing Architectures – EKS vs ECS","supplement":false,"stem":"<p>A company plans to migrate its suite of containerized applications running on-premises to a container service in AWS. The solution must be cloud-agnostic and use an open-source platform that can automatically manage containerized workloads and services. It should also use the same configuration and tools across various production environments.</p>\n<p>What should the Solution Architect do to properly migrate and satisfy the given requirement?</p>","options":[{"html":"Migrate the application to Amazon Elastic Container Service with Amazon ECS tasks that use the Amazon EC2 launch type.","correct":false},{"html":"Migrate the application to AWS App Runner to run containers using an open‑source orchestration platform.","correct":false},{"html":"Migrate the application to Amazon Elastic Kubernetes Service with Amazon EKS worker nodes.","correct":true},{"html":"Migrate the application to Amazon Elastic Container Service with Amazon ECS tasks that use the AWS Fargate launch type.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Migrate các ứng dụng container từ on-premises lên AWS.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Cloud-agnostic</strong>, <strong>open-source</strong>, tự động quản lý container, <strong>cùng cấu hình và công cụ</strong> trên mọi môi trường.</li>\n<li><strong>Thông tin cần chú ý:</strong> Tất cả từ khóa chỉ đến <strong>Kubernetes</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Migrate the application to Amazon Elastic Kubernetes Service with Amazon EKS worker nodes.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>EKS</strong> là Kubernetes managed trên AWS.</li>\n<li>Kubernetes là nền tảng <strong>mã nguồn mở</strong>, tự động scheduling, scaling, self-healing.</li>\n<li>Chạy được ở on-premises, AWS, Azure (AKS), GCP (GKE) → <strong>không bị khóa nhà cung cấp</strong>.</li>\n<li>Dùng <strong>cùng manifest/Helm chart và kubectl</strong> cho mọi môi trường.</li>\n</ul>","wrong":"<ul>\n<li><strong>ECS (EC2 hoặc Fargate):</strong> ECS là orchestration <strong>độc quyền AWS</strong>, không open-source, không cloud-agnostic.</li>\n<li><strong>App Runner:</strong> Dịch vụ managed của AWS để chạy web app/API đơn giản, không phải orchestration open-source.</li>\n</ul>","tip":"<ul>\n<li><strong>Open-source, cloud-agnostic, hybrid/multi-cloud, Kubernetes</strong> → <strong>EKS</strong>.</li>\n<li><strong>AWS-native, đơn giản</strong> → <strong>ECS</strong>. <strong>Serverless container</strong> → <strong>Fargate</strong> (dùng cho cả ECS và EKS).</li>\n</ul>"},{"id":21,"topic":"Design Cost-Optimized Architectures – Amazon API Gateway","supplement":false,"stem":"<p>A Solutions Architect of a multinational gaming company develops video games for PS4, Xbox One, and Nintendo Switch consoles, plus a number of mobile games for Android and iOS. Due to the wide range of their products and services, the architect proposed that they use API Gateway.</p>\n<p>What are the key features of API Gateway that the architect can tell to the client? (Select TWO.)</p>","options":[{"html":"Enables you to run applications requiring high levels of inter-node communications at scale on AWS through its custom-built operating system (OS) bypass hardware interface.","correct":false},{"html":"You pay only for the API calls you receive and the amount of data transferred out.","correct":true},{"html":"It automatically provides a query language for your APIs similar to GraphQL.","correct":false},{"html":"Provides you with static anycast IP addresses that serve as a fixed entry point to your applications hosted in one or more AWS Regions.","correct":false},{"html":"Enables you to build RESTful APIs and WebSocket APIs that are optimized for serverless workloads.","correct":true}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Công ty game có nhiều sản phẩm trên console và mobile, muốn dùng <strong>API Gateway</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn <strong>hai tính năng đúng</strong> của API Gateway. <strong>Select TWO</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Ba đáp án sai là tính năng của <strong>dịch vụ khác</strong> (EFA, AppSync, Global Accelerator) được \"gán nhầm\" cho API Gateway.</li>\n</ul>","answer":"<ul>\n<li><strong>You pay only for the API calls you receive and the amount of data transferred out.</strong></li>\n<li><strong>Enables you to build RESTful APIs and WebSocket APIs that are optimized for serverless workloads.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Amazon API Gateway</strong> là dịch vụ managed để tạo, publish, giám sát và bảo mật API ở mọi quy mô, đóng vai trò \"cửa trước\" (front door) cho backend như Lambda, EC2 hay bất kỳ HTTP endpoint nào.</li>\n<li>Hỗ trợ <strong>REST API</strong>, <strong>HTTP API</strong> và <strong>WebSocket API</strong>; tích hợp chặt với <strong>Lambda</strong> nên rất hợp với kiến trúc serverless.</li>\n<li>Tự xử lý traffic management, throttling, authorization (IAM, Cognito, Lambda authorizer), caching, versioning/stage.</li>\n<li><strong>Không có phí tối thiểu</strong>: chỉ trả tiền theo <strong>số API call</strong> và <strong>dữ liệu truyền ra</strong>.</li>\n</ul>","wrong":"<ul>\n<li><strong>Giao tiếp inter-node tốc độ cao qua OS-bypass hardware interface:</strong> Đây là <strong>Elastic Fabric Adapter (EFA)</strong> cho HPC/ML.</li>\n<li><strong>Ngôn ngữ truy vấn giống GraphQL:</strong> API Gateway không cung cấp. GraphQL managed là <strong>AWS AppSync</strong>.</li>\n<li><strong>Static anycast IP làm điểm vào cố định:</strong> Đây là <strong>AWS Global Accelerator</strong>.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Mô tả</th>\n<th>Dịch vụ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>REST/HTTP/WebSocket API, throttling, trả theo số call</td>\n<td><strong>API Gateway</strong></td>\n</tr>\n<tr>\n<td>GraphQL managed</td>\n<td><strong>AppSync</strong></td>\n</tr>\n<tr>\n<td>Static anycast IP, failover nhanh giữa region</td>\n<td><strong>Global Accelerator</strong></td>\n</tr>\n<tr>\n<td>OS-bypass, HPC, MPI</td>\n<td><strong>Elastic Fabric Adapter (EFA)</strong></td>\n</tr>\n</tbody>\n</table>"},{"id":22,"topic":"Design Resilient Architectures – CloudWatch agent","supplement":false,"stem":"<p>A company is running a custom application in an Auto Scaling group of Amazon EC2 instances. Several instances are failing due to insufficient swap space. The Solutions Architect has been instructed to troubleshoot the issue and effectively monitor the available swap space of each EC2 instance.</p>\n<p>Which of the following options fulfills this requirement?</p>","options":[{"html":"Create a new trail in AWS CloudTrail and configure Amazon CloudWatch Logs to monitor your trail logs.","correct":false},{"html":"Enable detailed monitoring on each instance and monitor the <code>SwapUtilization</code> metric.","correct":false},{"html":"Install the CloudWatch agent on each instance and monitor the <code>SwapUtilization</code> metric.","correct":true},{"html":"Create a CloudWatch dashboard and monitor the <code>SwapUsed</code> metric.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Instance lỗi do <strong>thiếu swap</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Giám sát swap</strong> trên từng instance.</li>\n<li><strong>Thông tin cần chú ý:</strong> Swap là metric <strong>trong OS</strong>, CloudWatch mặc định không thấy.</li>\n</ul>","answer":"<ul>\n<li><strong>Install the CloudWatch agent on each instance and monitor the <code>SwapUtilization</code> metric.</strong></li>\n</ul>","explain":"<ul>\n<li>Mặc định CloudWatch chỉ có metric cấp <strong>hypervisor</strong>: CPU, Network, Disk I/O, Status Check.</li>\n<li><strong>Memory, swap, disk space đã dùng</strong> cần <strong>CloudWatch agent</strong> (tên metric trong agent hiện tại: <code>swap_used_percent</code>).</li>\n<li>Với ASG, cài agent qua <strong>launch template (user data)</strong> hoặc <strong>Systems Manager</strong>.</li>\n</ul>","wrong":"<ul>\n<li><strong>CloudTrail:</strong> Ghi API call, không thấy swap.</li>\n<li><strong>Detailed monitoring:</strong> Chỉ tăng tần suất (5 phút → 1 phút), <strong>không thêm metric mới</strong>.</li>\n<li><strong>Dashboard:</strong> Chỉ hiển thị metric đã có.</li>\n</ul>","tip":"<ul>\n<li>Memory/swap/disk usage của EC2 → <strong>CloudWatch agent</strong>.</li>\n<li>Detailed monitoring <strong>không</strong> thêm loại metric.</li>\n</ul>"},{"id":23,"topic":"Design Cost-Optimized Architectures – S3 + CloudFront cho nội dung tĩnh","supplement":false,"stem":"<p>A digital media company shares static content to its premium users around the world and also to their partners who syndicate their media files. The company is looking for ways to reduce its server costs and securely deliver their data to their customers globally with low latency.</p>\n<p>Which combination of services should be used to provide the MOST suitable and cost-effective architecture? (Select TWO.)</p>","options":[{"html":"AWS Fargate","correct":false},{"html":"Amazon CloudFront","correct":true},{"html":"Amazon S3","correct":true},{"html":"AWS Lambda","correct":false},{"html":"AWS Global Accelerator","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Chia sẻ <strong>nội dung tĩnh</strong> cho user premium và đối tác toàn cầu.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Giảm chi phí server</strong>, <strong>an toàn</strong>, <strong>toàn cầu</strong>, <strong>latency thấp</strong>. <strong>Select TWO</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Amazon CloudFront</strong></li>\n<li><strong>Amazon S3</strong></li>\n</ul>","explain":"<ul>\n<li><strong>S3:</strong> lưu nội dung tĩnh, không cần server, rẻ.</li>\n<li><strong>CloudFront:</strong> cache tại edge; bảo mật bằng <strong>Signed URL/Cookie</strong>, <strong>OAC</strong>, HTTPS, WAF/Shield.</li>\n</ul>","wrong":"<ul>\n<li><strong>Fargate:</strong> Chạy container, tăng chi phí compute.</li>\n<li><strong>Lambda:</strong> Chạy code, nội dung tĩnh không cần.</li>\n<li><strong>Global Accelerator:</strong> Không cache nội dung.</li>\n</ul>","tip":"<ul>\n<li>Static + global + low latency + cost-effective → <strong>S3 + CloudFront</strong>.</li>\n<li><strong>Signed URL</strong> cho một file, <strong>Signed Cookie</strong> ch
