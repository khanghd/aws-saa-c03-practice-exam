8 instance trong cùng 1 AZ: nếu AZ đó down, toàn bộ ứng dụng sẽ ngừng hoạt động — không đạt high availability.</li>\n<li><strong>C. ✗</strong> Tương tự A, ELB không hỗ trợ trải nhiều Region.</li>\n<li><strong>D. ✓</strong> Trải đều 4+4 instance qua 2 AZ trong cùng region: nếu 1 AZ down, AZ còn lại vẫn phục vụ (ban đầu 4 instance, T3 có burstable performance để gánh tạm, Auto Scaling sẽ bù thêm instance).</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nghĩ \"trải nhiều Region\" sẽ an toàn hơn \"trải nhiều AZ\", nhưng Elastic Load Balancer (ALB/NLB/CLB) chỉ hoạt động trong phạm vi 1 Region — phải dùng Route 53 nếu muốn multi-region.</p>","tip":"<p>High availability trong 1 Region → trải Auto Scaling group qua <strong>nhiều Availability Zone</strong>. Muốn multi-region thì cần Route 53, không phải 1 ELB duy nhất.</p>"},
{"id":24,"topic":"Design High-Performing Architectures – RDS Read Replica vs Multi-AZ","supplement":false,"stem":"<p>Due to the large volume of query requests, the database performance of an online reporting application significantly slowed down. The Solutions Architect is trying to convince her client to use Amazon RDS Read Replica for their application instead of setting up a Multi-AZ Deployments configuration.</p><p>What are two benefits of using Read Replicas over Multi-AZ that the Architect should point out? (Select TWO.)</p>","options":[{"html":"It elastically scales out beyond the capacity constraints of a single DB instance for read-heavy database workloads.","correct":true},{"html":"Provides synchronous replication and automatic failover in the case of Availability Zone service failures.","correct":false},{"html":"Provides asynchronous replication and improves the performance of the primary database by taking read-heavy database workloads from it.","correct":true},{"html":"Allows both read and write operations on the read replica to complement the primary database.","correct":false},{"html":"It enhances the read performance of your primary database by increasing its IOPS and accelerates its query processing via AWS Global Accelerator.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> So sánh lợi ích của <strong>Read Replica</strong> so với <strong>Multi-AZ</strong> khi database bị quá tải vì nhiều query đọc.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn 2 lợi ích đúng của Read Replica (không phải của Multi-AZ).</li>\n<li><strong>Từ khóa cần chú ý:</strong> Read Replica = <strong>asynchronous</strong>, scale read, read-only; Multi-AZ = <strong>synchronous</strong>, chỉ để failover/HA, không scale read.</li>\n</ul>","answer":"<ul>\n<li><strong>It elastically scales out beyond the capacity constraints of a single DB instance for read-heavy database workloads.</strong></li>\n<li><strong>Provides asynchronous replication and improves the performance of the primary database by taking read-heavy database workloads from it.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Read Replica cho phép tạo nhiều bản sao chỉ đọc để san sẻ tải truy vấn, scale-out vượt giới hạn 1 instance đơn.</li>\n<li><strong>B. ✗</strong> Synchronous replication + automatic failover là đặc trưng của <strong>Multi-AZ</strong>, không phải Read Replica (Read Replica dùng async).</li>\n<li><strong>C. ✓</strong> Read Replica dùng replication bất đồng bộ (async), giúp giảm tải cho primary bằng cách chuyển bớt query đọc sang replica.</li>\n<li><strong>D. ✗</strong> Mặc định Read Replica chỉ cho phép đọc (read-only); muốn ghi phải cấu hình đặc biệt, không phải bản chất mặc định của Read Replica.</li>\n<li><strong>E. ✗</strong> Read Replica không tăng IOPS của primary DB, và không liên quan gì đến AWS Global Accelerator (dịch vụ networking riêng biệt).</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm đặc điểm của Multi-AZ (synchronous, auto failover) sang cho Read Replica — hãy nhớ Read Replica luôn <strong>asynchronous</strong> và mục đích chính là <strong>scale đọc</strong>, không phải HA/failover.</p>","tip":"<p>Read Replica: async, scale read-heavy workload. Multi-AZ: sync, chỉ để HA/failover, không scale read.</p>"},
{"id":25,"topic":"Design Cost-Optimized Architectures – Direct Connect Gateway + Transit Gateway","supplement":false,"stem":"<p>A company has established a dedicated network connection from its on-premises data center to AWS Cloud using AWS Direct Connect (DX). The core network services, such as the Domain Name System (DNS) service and Active Directory services, are all hosted on-premises. The company has new AWS accounts that will also require consistent and dedicated access to these network services.</p><p>Which of the following can satisfy this requirement with the LEAST amount of operational overhead and in a cost-effective manner?</p>","options":[{"html":"Create a new AWS VPN CloudHub. Set up a Virtual Private Network (VPN) connection for additional AWS accounts.","correct":false},{"html":"Set up another Direct Connect connection for each and every new AWS account that will be added.","correct":false},{"html":"Create a new Direct Connect gateway and integrate it with the existing Direct Connect connection. Set up a Transit Gateway between AWS accounts and associate it with the Direct Connect gateway.","correct":true},{"html":"Set up a new Direct Connect gateway and integrate it with the existing Direct Connect connection. Configure a VPC peering connection between AWS accounts and associate it with Direct Connect gateway.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Đã có 1 Direct Connect kết nối on-premises; nhiều AWS account mới cũng cần truy cập <strong>dedicated, liên tục</strong> đến network service on-premises đó.</li>\n<li><strong>Yêu cầu chính:</strong> Mở rộng truy cập DX cho nhiều account mới, chi phí thấp, ít overhead.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Nhiều account cùng cần dùng 1 kết nối DX → mô hình hub-and-spoke bằng <strong>Transit Gateway + Direct Connect Gateway</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Create a new Direct Connect gateway and integrate it with the existing Direct Connect connection. Set up a Transit Gateway between AWS accounts and associate it with the Direct Connect gateway.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> VPN đi qua Internet công cộng, không phải kết nối dedicated như DX — không đáp ứng yêu cầu \"dedicated access\".</li>\n<li><strong>B. ✗</strong> Thiết lập 1 DX connection riêng cho mỗi account mới cực kỳ tốn kém và mất nhiều thời gian/overhead quản lý — trái với yêu cầu \"LEAST operational overhead\".</li>\n<li><strong>C. ✓</strong> Direct Connect Gateway + Transit Gateway cho phép nhiều VPC/account dùng chung 1 kết nối DX hiện có theo mô hình hub-and-spoke, dễ quản lý và tiết kiệm chi phí.</li>\n<li><strong>D. ✗</strong> VPC peering <strong>không hỗ trợ</strong> gắn với Direct Connect Gateway và cũng không hỗ trợ bắc cầu (transitive) qua nhiều VPC.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> VPC peering nghe có vẻ hợp lý để nối nhiều account, nhưng nó không tương thích với Direct Connect Gateway và không hỗ trợ transitive routing — chỉ Transit Gateway mới làm được.</p>","tip":"<p>Nhiều VPC/account cùng chia sẻ 1 kết nối Direct Connect → <strong>Direct Connect Gateway + Transit Gateway</strong> (mô hình hub-and-spoke).</p>"},
{"id":26,"topic":"Design Resilient Architectures – DeleteOnTermination cho EBS root volume","supplement":false,"stem":"<p>A Solutions Architect is designing a highly available environment for an application. She plans to host the application on EC2 instances within an Auto Scaling Group. One of the conditions requires data stored on root EBS volumes to be preserved if an instance terminates.</p><p>What should be done to satisfy the requirement?</p>","options":[{"html":"Enable the Termination Protection option for all EC2 instances.","correct":false},{"html":"Set the value of DeleteOnTermination attribute of the EBS volumes to False.","correct":true},{"html":"Use AWS DataSync to replicate root volume data to Amazon S3.","correct":false},{"html":"Configure ASG to suspend the health check process for each EC2 instance.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Muốn dữ liệu trên <strong>root EBS volume</strong> được giữ lại sau khi instance bị terminate (không phải chỉ stop).</li>\n<li><strong>Yêu cầu chính:</strong> Cấu hình nào giúp root volume không tự xóa khi terminate.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Mặc định root volume có <code>DeleteOnTermination=true</code> → cần đổi thành <code>false</code> để giữ lại.</li>\n</ul>","answer":"<ul>\n<li><strong>Set the value of DeleteOnTermination attribute of the EBS volumes to False.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Termination Protection chỉ ngăn việc terminate instance do thao tác nhầm trên Console, không liên quan đến việc giữ lại dữ liệu root volume khi instance thực sự bị terminate.</li>\n<li><strong>B. ✓</strong> Đổi <code>DeleteOnTermination</code> của root volume thành <code>False</code> sẽ giữ lại volume (và dữ liệu) ngay cả khi instance bị terminate.</li>\n<li><strong>C. ✗</strong> AWS DataSync không hỗ trợ làm việc trực tiếp với EBS volume.</li>\n<li><strong>D. ✗</strong> Suspend health check chỉ ảnh hưởng đến việc ASG có thay thế instance không khỏe hay không, không liên quan đến việc giữ dữ liệu root volume.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Nhầm \"Termination Protection\" (chỉ chặn terminate nhầm) với việc giữ lại dữ liệu sau khi terminate — hai khái niệm hoàn toàn khác nhau.</p>","tip":"<p>Root EBS volume mặc định <code>DeleteOnTermination=true</code> (tự xóa khi terminate). Muốn giữ lại → đổi thành <code>false</code>.</p>"},
{"id":27,"topic":"Design Secure Architectures – Client-Side Encryption cho S3","supplement":false,"stem":"<p>A company is generating confidential data that is saved on its on-premises data center. As a backup solution, the company wants to upload its data to an Amazon S3 bucket. In compliance with its internal security mandate, the encryption of the data must be done before sending it to S3. The company must spend time managing and rotating the encryption keys as well as controlling who can access those keys.</p><p>Which of the following methods can achieve this requirement? (Select TWO.)</p>","options":[{"html":"Set up Client-Side Encryption with S3 managed encryption keys.","correct":false},{"html":"Set up Server-Side Encryption (SSE) with Amazon EC2 key pair.","correct":false},{"html":"Set up Server-Side Encryption with keys stored in a separate S3 bucket.","correct":false},{"html":"Set up Client-Side Encryption with AWS KMS key.","correct":true},{"html":"Set up Client-Side Encryption using a client-side master key.","correct":true}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Dữ liệu phải được <strong>mã hóa trước khi gửi lên S3</strong> (client-side), và công ty tự quản lý/xoay vòng/kiểm soát quyền truy cập key.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn 2 phương pháp client-side encryption hợp lệ mà công ty tự quản lý key.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"encryption done before sending to S3\" → bắt buộc là <strong>Client-Side Encryption</strong> (không phải Server-Side); \"manage và rotate key\" → KMS key hoặc client-side master key do khách hàng tự quản lý.</li>\n</ul>","answer":"<ul>\n<li><strong>Set up Client-Side Encryption with AWS KMS key.</strong></li>\n<li><strong>Set up Client-Side Encryption using a client-side master key.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Không tồn tại khái niệm \"client-side encryption với S3-managed key\"; S3-managed key (SSE-S3) chỉ dùng cho server-side và được AWS tự động xoay vòng, không phải thứ khách hàng tự quản lý.</li>\n<li><strong>B. ✗</strong> Không thể dùng EC2 key pair để làm key mã hóa cho S3 server-side encryption; đây không phải cách dùng hợp lệ.</li>\n<li><strong>C. ✗</strong> Lưu encryption key trong 1 S3 bucket khác là rủi ro bảo mật và không phải cách SSE hoạt động (SSE dùng KMS hoặc key do khách hàng cung cấp qua SSE-C, không lưu trong bucket khác).</li>\n<li><strong>D. ✓</strong> Client-Side Encryption với KMS key: khách hàng mã hóa dữ liệu phía client bằng key quản lý qua KMS trước khi upload — tự kiểm soát, xoay vòng, audit được quyền truy cập.</li>\n<li><strong>E. ✓</strong> Client-Side Encryption dùng client-side master key: khách hàng tự quản lý toàn bộ vòng đời key, không phụ thuộc AWS.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm SSE-S3 (server-side, AWS tự quản lý và xoay key) với yêu cầu đề bài là khách hàng <strong>tự quản lý và xoay vòng key</strong> — đây là đặc trưng của KMS key hoặc client-side master key.</p>","tip":"<p>Mã hóa <strong>trước khi</strong> gửi lên S3 → luôn là Client-Side Encryption. Muốn tự quản lý/xoay key → dùng KMS key hoặc client-side master key, không phải SSE-S3.</p>"},
{"id":28,"topic":"Design Secure Architectures – IAM Group cho quản lý permission hàng loạt","supplement":false,"stem":"<p>A Solutions Architect is managing a company's AWS account of approximately 300 IAM users. The company has a new policy that requires changing the associated permissions of all 100 IAM users who control access to Amazon S3 buckets.</p><p>What will the Solutions Architect do to avoid the time-consuming task of applying the policy to each user?</p>","options":[{"html":"Create a new S3 bucket access policy with unlimited access for each IAM user.","correct":false},{"html":"Create a scheduled rule with Amazon EventBridge Scheduler to automatically apply the policy to all 100 IAM users at once.","correct":false},{"html":"Create a new IAM group and then add the users that require access to the S3 bucket. Afterwards, apply the policy to IAM group.","correct":true},{"html":"Create a new IAM role and add each user to the IAM role.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần thay đổi permission cho 100/300 IAM user cùng lúc mà không muốn áp dụng thủ công từng user.</li>\n<li><strong>Yêu cầu chính:</strong> Cách quản lý permission hàng loạt hiệu quả nhất.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Nhiều user cùng cần 1 bộ quyền → dùng <strong>IAM Group</strong> làm lớp quản lý trung tâm.</li>\n</ul>","answer":"<ul>\n<li><strong>Create a new IAM group and then add the users that require access to the S3 bucket. Afterwards, apply the policy to IAM group.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Tạo policy riêng cho từng user vẫn là thao tác thủ công, tốn thời gian y hệt vấn đề ban đầu, lại còn cấp quyền không giới hạn là rủi ro bảo mật.</li>\n<li><strong>B. ✗</strong> Lập lịch EventBridge để tự động gán policy cho từng user vẫn không giải quyết gốc rễ — sau này các user vẫn không nằm trong 1 nhóm thống nhất để quản lý.</li>\n<li><strong>C. ✓</strong> Gom 100 user vào 1 IAM Group, áp policy một lần duy nhất lên group — mọi user trong group tự động thừa hưởng quyền, dễ thêm/bớt/thay đổi sau này.</li>\n<li><strong>D. ✗</strong> Không thể gán trực tiếp user vào 1 IAM Role theo cách quản lý permission hàng loạt như IAM Group; đây không phải cách dùng đúng của IAM Role.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Các phương án dùng script/EventBridge nghe có vẻ \"tự động hóa\" hợp lý, nhưng về bản chất vẫn phải áp dụng riêng lẻ cho từng user — không giải quyết được vấn đề quản lý tập trung như IAM Group.</p>","tip":"<p>Nhiều user cùng cần chung 1 bộ quyền, cần quản lý dễ dàng về sau → luôn dùng <strong>IAM Group</strong>, không áp policy riêng lẻ từng user.</p>"},
{"id":29,"topic":"Design Resilient Architectures – S3 Glacier Expedited Retrieval + Provisioned Capacity","supplement":false,"stem":"<p>An online stock trading application stores financial data in an Amazon S3 bucket, with a lifecycle policy that moves older data to Glacier every month. A strict compliance requirement mandates that a surprise audit can occur at any time, and the required data must be retrievable in under 15 minutes under all circumstances. The manager has instructed that retrieval capacity be available when needed and should support up to 150 MB/s of retrieval throughput.</p><p>Which of the following will meet the given requirement? (Select TWO.)</p>","options":[{"html":"Use Expedited Retrieval to access the financial data.","correct":true},{"html":"Use Standard Retrieval for accessing the financial data.","correct":false},{"html":"Specify a range, or portion, of the financial data archive to retrieve.","correct":false},{"html":"Use Bulk Retrieval to access the financial data.","correct":false},{"html":"Purchase provisioned retrieval capacity.","correct":true}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Dữ liệu tài chính lưu Glacier, cần lấy lại dưới <strong>15 phút</strong>, <strong>trong mọi trường hợp</strong> (kể cả lúc cao điểm), với throughput tối thiểu 150MB/s.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn 2 giải pháp đảm bảo luôn đáp ứng được retrieval nhanh dưới 15 phút.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"under all circumstances\" + \"retrieval capacity available when needed\" → <strong>Expedited Retrieval</strong> (1-5 phút) + <strong>Provisioned Capacity</strong> (đảm bảo luôn có sẵn, kể cả cao điểm).</li>\n</ul>","answer":"<ul>\n<li><strong>Use Expedited Retrieval to access the financial data.</strong></li>\n<li><strong>Purchase provisioned retrieval capacity.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Expedited Retrieval trả dữ liệu trong 1-5 phút cho hầu hết archive, thỏa mãn điều kiện dưới 15 phút.</li>\n<li><strong>B. ✗</strong> Standard Retrieval mất 3-5 giờ, không đáp ứng được yêu cầu 15 phút.</li>\n<li><strong>C. ✗</strong> Chỉ retrieve 1 phần archive không đảm bảo lấy đủ dữ liệu cần cho audit, và cũng không cung cấp thêm capacity đảm bảo như provisioned capacity.</li>\n<li><strong>D. ✗</strong> Bulk Retrieval mất 5-12 giờ và không tương thích với Provisioned Capacity — quá chậm so với yêu cầu.</li>\n<li><strong>E. ✓</strong> Provisioned Capacity đảm bảo luôn có sẵn ít nhất 3 lượt Expedited retrieval mỗi 5 phút và tối thiểu 150MB/s throughput, ngay cả lúc nhu cầu cao — đúng yêu cầu \"under all circumstances\".</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Chỉ chọn Expedited Retrieval là chưa đủ — nếu không mua Provisioned Capacity thì vẫn có rủi ro bị từ chối request vào lúc nhu cầu cao điểm bất thường, không đảm bảo \"under all circumstances\".</p>","tip":"<p>Glacier retrieval: Expedited (1-5 phút) &lt; Standard (3-5 giờ) &lt; Bulk (5-12 giờ). Muốn đảm bảo Expedited luôn khả dụng kể cả cao điểm → mua thêm <strong>Provisioned Capacity</strong>.</p>"},
{"id":30,"topic":"Design Secure Architectures – IAM Group + MFA policy theo phòng ban","supplement":false,"stem":"<p>A company that is rapidly growing in recent months has been in the process of setting up IAM users on its single AWS Account. A solutions architect has been tasked to handle the user management, which includes granting read-only access to users and denying permissions whenever an IAM user has no MFA setup. New users will be added frequently based on their respective departments.</p><p>Which of the following action is the MOST secure way to grant permissions to the new users?</p>","options":[{"html":"Set up IAM roles for each IAM user and associate a permissions boundary that defines the maximum permissions.","correct":false},{"html":"Create a Service Control Policy (SCP) that enforces MFA authentication for each department. Add a trust relationship to every SCP and attach it to each IAM User.","correct":false},{"html":"Launch an IAM Group for each department. Create an IAM Policy that enforces MFA authentication with the least privilege permission. Attach the IAM Policy to each IAM Group.","correct":true},{"html":"Create an IAM Role that enforces MFA authentication with the least privilege permission. Set up a corresponding IAM Group for each department. Attach the IAM Role to the IAM Groups.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Công ty có <strong>1 AWS account duy nhất</strong> (không phải AWS Organizations với nhiều account), user mới thêm liên tục theo từng phòng ban, cần enforce MFA + least privilege.</li>\n<li><strong>Yêu cầu chính:</strong> Cách cấp quyền an toàn và dễ mở rộng nhất khi có user mới.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"single AWS Account\" → SCP không áp dụng được (SCP chỉ dùng trong AWS Organizations); mỗi phòng ban → <strong>IAM Group</strong> riêng kèm IAM Policy.</li>\n</ul>","answer":"<ul>\n<li><strong>Launch an IAM Group for each department. Create an IAM Policy that enforces MFA authentication with the least privilege permission. Attach the IAM Policy to each IAM Group.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Không thể gán trực tiếp 1 IAM Role cho IAM User theo cách quản lý quyền thường trực như vậy; permission boundary dùng để giới hạn quyền tối đa, không phải cách cấp quyền least-privilege chính.</li>\n<li><strong>B. ✗</strong> SCP chỉ hoạt động trong AWS Organizations (gắn vào root/OU/account), không thể gắn trực tiếp vào IAM User; đề bài chỉ có 1 account duy nhất nên SCP không áp dụng được ở đây.</li>\n<li><strong>C. ✓</strong> Mỗi phòng ban có 1 IAM Group riêng, IAM Policy (enforce MFA + least privilege) được gắn vào group — user mới chỉ cần thêm vào group tương ứng là tự động có đúng quyền.</li>\n<li><strong>D. ✗</strong> Không có cách gắn trực tiếp 1 IAM Role vào IAM Group trong AWS Console; IAM Group chỉ nhận IAM Policy, không nhận IAM Role.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> SCP nghe rất \"chuẩn bảo mật\" nhưng chỉ dùng được trong AWS Organizations (multi-account) — với 1 account đơn lẻ thì phải dùng IAM Policy + IAM Group.</p>","tip":"<p>1 AWS account duy nhất → không dùng SCP (chỉ dùng trong Organizations). Nhiều user theo nhóm/phòng ban, quyền giống nhau → <strong>IAM Group + IAM Policy</strong>.</p>"}
,
{"id":31,"topic":"Design High-Performing Architectures – Storage Gateway File Gateway cho SMB share","supplement":false,"stem":"<p>An on-premises server uses an SMB network file share to store application data. The application produces around 50 MB of data per day, but it only needs to access some of it for daily processes. To save on storage costs, the company plans to copy all the application data to AWS. However, the goal is to retain the ability to retrieve data with the same low-latency access as the local file share. The company does not have the capacity to develop the needed tools for this operation.</p><p>Which of the following should the company use?</p>","options":[{"html":"AWS Virtual Private Network (VPN)","correct":false},{"html":"AWS Storage Gateway","correct":true},{"html":"Amazon FSx for Windows File Server","correct":false},{"html":"AWS DataSync","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Dữ liệu SMB on-premises cần chuyển lên AWS để tiết kiệm chi phí, nhưng vẫn cần truy cập <strong>low-latency</strong> như file share nội bộ, không muốn tự phát triển công cụ.</li>\n<li><strong>Yêu cầu chính:</strong> Giải pháp managed, hỗ trợ cache local để truy cập nhanh, không cần code thêm.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"same low-latency access as local file share\" + \"no development capacity\" → <strong>Storage Gateway (File Gateway)</strong> với local caching có sẵn.</li>\n</ul>","answer":"<ul>\n<li><strong>AWS Storage Gateway.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> VPN chỉ thiết lập kết nối mã hóa on-premises–AWS, không cung cấp cơ chế cache dữ liệu hay giao thức file share.</li>\n<li><strong>B. ✓</strong> Storage Gateway (File Gateway) hỗ trợ SMB file share, có local caching tích hợp sẵn để truy cập dữ liệu hay dùng với độ trễ thấp mà không cần code thêm.</li>\n<li><strong>C. ✗</strong> FSx for Windows File Server lưu toàn bộ file trên AWS, truy cập qua Internet/VPN nên không đảm bảo độ trễ thấp như file share local.</li>\n<li><strong>D. ✗</strong> DataSync chỉ dùng để di chuyển dữ liệu (một lần/định kỳ), không duy trì truy cập low-latency liên tục qua local cache như Storage Gateway.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> FSx for Windows File Server nghe hợp lý vì cũng hỗ trợ SMB, nhưng dữ liệu nằm hoàn toàn trên AWS nên không đáp ứng yêu cầu latency thấp như truy cập local — phải có cơ chế cache tại chỗ như Storage Gateway.</p>","tip":"<p>Cần giữ dữ liệu trên AWS nhưng vẫn truy cập <strong>low-latency như local</strong>, không muốn tự code → <strong>AWS Storage Gateway</strong> (có local caching).</p>"},
{"id":32,"topic":"Design Resilient Architectures – Launch Template không sửa được","supplement":false,"stem":"<p>A tech company is currently using Auto Scaling for their web application. A new AMI now needs to be used for launching a fleet of EC2 instances.</p><p>Which of the following changes needs to be done?</p>","options":[{"html":"Create a new target group.","correct":false},{"html":"Create a new launch template.","correct":true},{"html":"Do nothing. You can start directly launching EC2 instances in the Auto Scaling group with the same launch template.","correct":false},{"html":"Create a new target group and launch template.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Auto Scaling group đang dùng 1 launch template, cần đổi sang AMI mới.</li>\n<li><strong>Yêu cầu chính:</strong> Cách đúng để cập nhật AMI mà Auto Scaling group sử dụng.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Launch template <strong>không thể sửa (immutable)</strong> sau khi tạo → phải tạo launch template mới (hoặc version mới) rồi cập nhật ASG dùng nó.</li>\n</ul>","answer":"<ul>\n<li><strong>Create a new launch template.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Target group chỉ dùng cho ELB để định tuyến traffic đến instance, không liên quan đến việc chọn AMI cho Auto Scaling.</li>\n<li><strong>B. ✓</strong> Vì launch template không thể chỉnh sửa sau khi tạo, phải tạo launch template mới (hoặc version mới) với AMI mới, rồi cập nhật Auto Scaling group dùng template đó.</li>\n<li><strong>C. ✗</strong> Launch template cũ vẫn trỏ đến AMI cũ; không làm gì thì instance mới vẫn dùng AMI cũ, không đạt yêu cầu đổi AMI.</li>\n<li><strong>D. ✗</strong> Không cần tạo target group mới vì đề bài không đề cập đến load balancer hay thay đổi cấu trúc network, chỉ cần đổi AMI.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Đề không nhắc đến load balancer nhưng phương án D vẫn thêm \"target group\" gây nhiễu — cần đọc kỹ đề bài chỉ yêu cầu đổi AMI, không liên quan ELB.</p>","tip":"<p>Launch template là <strong>immutable</strong> (không sửa được sau khi tạo). Muốn đổi cấu hình (AMI, instance type...) → tạo launch template mới hoặc version mới.</p>"},
{"id":33,"topic":"Design High-Performing Architectures – Kinesis Data Streams + Lambda batch","supplement":false,"stem":"<p>A media company recently launched their newly created web application. Many users tried to visit the website, but they are receiving a 503 Service Unavailable Error. The system administrator tracked the EC2 instance status and saw the capacity is reaching its maximum limit and unable to process all the requests. To gain insights from the application's data, they need to launch a real-time analytics service.</p><p>Which of the following allows you to read records in batches?</p>","options":[{"html":"Create a Kinesis Data Stream and use AWS Lambda to read records from the data stream.","correct":true},{"html":"Create an Amazon S3 bucket to store the captured data and use Amazon Athena to analyze the data.","correct":false},{"html":"Create a Data Firehose and use AWS Lambda to read records from the data stream.","correct":false},{"html":"Create an Amazon S3 bucket to store the captured data and use Amazon Redshift Spectrum to analyze the data.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần dịch vụ <strong>real-time analytics</strong>, và Lambda phải đọc được record theo từng <strong>batch</strong> từ nguồn stream.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng dịch vụ streaming hỗ trợ Lambda đọc theo batch.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"read records in batches\" + \"real-time\" → <strong>Kinesis Data Streams</strong> (Lambda poll theo batch từ shard); Lambda <strong>không thể</strong> là consumer/destination của Data Firehose theo cách này.</li>\n</ul>","answer":"<ul>\n<li><strong>Create a Kinesis Data Stream and use AWS Lambda to read records from the data stream.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Lambda tích hợp sẵn với Kinesis Data Streams, tự động đọc record theo từng batch trên mỗi shard, xử lý real-time.</li>\n<li><strong>B. ✗</strong> S3 + Athena phù hợp cho phân tích dữ liệu đã lưu trữ (batch/offline), không đáp ứng yêu cầu real-time analytics.</li>\n<li><strong>C. ✗</strong> Data Firehose không thể đặt Lambda làm đích để \"đọc record từ stream\" theo kiểu polling như Kinesis Data Streams; Lambda chỉ được dùng để transform dữ liệu bên trong luồng Firehose.</li>\n<li><strong>D. ✗</strong> S3 + Redshift Spectrum cũng là giải pháp phân tích dữ liệu đã lưu, không phải real-time streaming.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Firehose và Kinesis Data Streams đều liên quan đến streaming nên dễ nhầm lẫn; Firehose dùng để <strong>load</strong> dữ liệu vào đích (S3, Redshift...), còn Kinesis Data Streams mới là nơi Lambda <strong>đọc và xử lý</strong> record trực tiếp theo batch.</p>","tip":"<p>Cần real-time analytics + Lambda đọc record theo batch → <strong>Kinesis Data Streams</strong>. Cần nạp dữ liệu streaming vào S3/Redshift/OpenSearch → <strong>Kinesis Data Firehose</strong>.</p>"},
{"id":34,"topic":"Design Secure Architectures – SSM Parameter Store SecureString","supplement":false,"stem":"<p>A company runs a multi-tier web application in the AWS Cloud. The application tier is hosted on Amazon EC2 instances and the backend database is hosted on an Amazon Aurora for MySQL DB cluster. For security compliance, all of the application variables such as DB hostnames, environment settings, product keys, and database passwords must be stored securely with encryption.</p><p>Which of the following options is the most cost-effective solution to meet the requirements?</p>","options":[{"html":"Store the values by creating SecureString type parameters in AWS Systems Manager Parameter Store. Use AWS Key Management Service (AWS KMS) for the encryption. Update the application to retrieve the parameter values.","correct":true},{"html":"Store the values as key-value pairs in AWS Systems Manager OpsCenter. By default, the key-value pairs will be encrypted at rest. Configure the application to retrieve the variables when it starts.","correct":false},{"html":"Store the values by creating secrets in AWS Secrets Manager. Use AWS Key Management Service (AWS KMS) for the encryption. Use the BatchGetSecretValue API to retrieve multiple secrets efficiently. Update the application to retrieve the values of the secrets.","correct":false},{"html":"Store the values in a file saved in an Amazon S3 bucket. Enable encryption on the S3 bucket. Configure the application to download the file contents when it starts.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần lưu nhiều loại biến cấu hình (hostname, password...) được mã hóa, với chi phí thấp nhất.</li>\n<li><strong>Yêu cầu chính:</strong> Giải pháp lưu trữ config được mã hóa, cost-effective nhất (không cần tính năng rotation tự động phức tạp).</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"most cost-effective\" → <strong>SSM Parameter Store (SecureString)</strong> miễn phí cho standard parameter, trong khi Secrets Manager tính phí theo secret/tháng.</li>\n</ul>","answer":"<ul>\n<li><strong>Store the values by creating SecureString type parameters in AWS Systems Manager Parameter Store. Use AWS Key Management Service (AWS KMS) for the encryption. Update the application to retrieve the parameter values.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> SSM Parameter Store hỗ trợ SecureString (mã hóa bằng KMS) miễn phí cho standard parameter — phù hợp lưu config ít thay đổi, không cần rotation phức tạp.</li>\n<li><strong>B. ✗</strong> OpsCenter chỉ là công cụ theo dõi/vận hành sự cố (operational issue), không phải nơi lưu trữ key-value parameter.</li>\n<li><strong>C. ✗</strong> Secrets Manager tính phí khoảng $0.40/secret/tháng, tốn kém hơn nhiều so với Parameter Store khi lưu nhiều giá trị tĩnh, ít thay đổi.</li>\n<li><strong>D. ✗</strong> Lưu file trên S3 đòi hỏi phải tự upload lại file mỗi khi thay đổi giá trị — không thực tiễn, dễ sai sót.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Secrets Manager có vẻ \"chuyên nghiệp\" hơn vì hỗ trợ rotation tự động, nhưng đề chỉ cần lưu config được mã hóa với chi phí thấp — không yêu cầu rotation nên Parameter Store SecureString mới là lựa chọn tối ưu chi phí.</p>","tip":"<p>Lưu config/secret tĩnh, ít thay đổi, cần mã hóa, tiết kiệm chi phí → <strong>SSM Parameter Store (SecureString)</strong>. Cần auto-rotation, fine-grained access, audit chuyên sâu → <strong>Secrets Manager</strong> (tốn phí hơn).</p>"},
{"id":35,"topic":"Design Cost-Optimized Architectures – EC2 Hibernation giảm thời gian khởi động","supplement":false,"stem":"<p>A solutions architect is managing an application that runs on a Windows EC2 instance with an attached Amazon FSx for Windows File Server. To save cost, management has decided to stop the instance during off-hours and restart it only when needed. It has been observed that the application takes several minutes to become fully operational which impacts productivity.</p><p>How can the solutions architect speed up the instance's loading time without driving the cost up?</p>","options":[{"html":"Disable the Instance Metadata Service to reduce the things that need to be loaded at startup.","correct":false},{"html":"Enable the hibernation mode on the EC2 instance.","correct":false},{"html":"Migrate the application to an EC2 instance with hibernation enabled.","correct":true},{"html":"Migrate the application to a Linux-based EC2 instance.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Instance bị stop/start theo lịch để tiết kiệm chi phí, nhưng mỗi lần start lại mất nhiều phút để sẵn sàng.</li>\n<li><strong>Yêu cầu chính:</strong> Giảm thời gian khởi động mà không tăng chi phí.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Hibernation chỉ bật được <strong>lúc launch instance lần đầu</strong>, không thể bật sau khi instance đã chạy.</li>\n</ul>","answer":"<ul>\n<li><strong>Migrate the application to an EC2 instance with hibernation enabled.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Instance Metadata Service không ảnh hưởng đáng kể đến thời gian khởi động ứng dụng.</li>\n<li><strong>B. ✗</strong> Hibernation <strong>không thể bật/tắt sau khi instance đã được launch</strong> — phải cấu hình ngay từ lúc tạo instance mới.</li>\n<li><strong>C. ✓</strong> Phải launch một instance mới với hibernation được bật ngay từ đầu; hibernation lưu lại trạng thái RAM nên khi start lại, ứng dụng tiếp tục ngay từ chỗ dừng, không cần load lại từ đầu, chi phí cũng chỉ bằng instance đang stop (chỉ trả tiền EBS + EIP).</li>\n<li><strong>D. ✗</strong> Đổi sang Linux không đảm bảo giảm thời gian khởi động và còn tiềm ẩn rủi ro ứng dụng phụ thuộc Windows không chạy được.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nghĩ chỉ cần \"bật hibernation\" trên instance hiện tại (đáp án B), nhưng thực tế hibernation là thuộc tính chỉ cấu hình được <strong>lúc launch</strong>, không thể bật thêm sau đó.</p>","tip":"<p>Muốn giảm thời gian khởi động khi stop/start thường xuyên mà không tăng chi phí → <strong>Hibernation</strong> (phải cấu hình từ lúc launch instance).</p>"},
{"id":36,"topic":"Design High-Performing Architectures – Kinesis Data Streams enhanced fan-out","supplement":false,"stem":"<p>A company needs to collect gigabytes of data per second from websites and social media feeds to gain insights into its product offerings and continuously improve the user experience. To meet this design requirement, an application is deployed on an Auto Scaling group of Spot instances in Amazon EC2, which processes the data and stores the results to Amazon DynamoDB and Amazon Redshift. The solution should have a built-in enhanced fan-out feature.</p><p>Which AWS solution can be used to collect and process large streams of data records in real-time with the LEAST amount of administrative overhead?</p>","options":[{"html":"AWS Batch","correct":false},{"html":"Amazon Managed Streaming for Apache Kafka (Amazon MSK)","correct":false},{"html":"Amazon Kinesis Data Streams","correct":true},{"html":"AWS Data Exchange","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần ingest hàng GB/giây dữ liệu real-time, yêu cầu có sẵn tính năng <strong>enhanced fan-out</strong>, ít overhead quản trị nhất.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn dịch vụ streaming đúng tính năng, managed, ít vận hành.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"enhanced fan-out\" là tính năng đặc trưng chỉ có ở <strong>Kinesis Data Streams</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Amazon Kinesis Data Streams.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> AWS Batch dùng cho batch computing workload, không phải streaming ingestion real-time.</li>\n<li><strong>B. ✗</strong> MSK cũng xử lý được streaming real-time nhưng đòi hỏi quản trị cluster Kafka phức tạp hơn nhiều, và không có tính năng enhanced fan-out tích hợp sẵn như Kinesis.</li>\n<li><strong>C. ✓</strong> Kinesis Data Streams là managed service cho streaming real-time, hỗ trợ sẵn tính năng <strong>enhanced fan-out</strong> (mỗi consumer có throughput riêng 2MB/s/shard), ít overhead quản trị.</li>\n<li><strong>D. ✗</strong> AWS Data Exchange là marketplace dữ liệu, không liên quan đến thu thập/xử lý streaming.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> MSK cũng xử lý streaming thật nhưng đòi hỏi tự quản lý cluster Kafka nhiều hơn — khi đề nhấn mạnh \"LEAST administrative overhead\" và \"enhanced fan-out\", đáp án đúng luôn là Kinesis Data Streams.</p>","tip":"<p>Thấy từ khóa \"<strong>enhanced fan-out</strong>\" → luôn nghĩ ngay đến <strong>Kinesis Data Streams</strong> (tính năng độc quyền của dịch vụ này).</p>"},
{"id":37,"topic":"Design Resilient Architectures – Aurora Reader Endpoint load balancing","supplement":false,"stem":"<p>A tech startup is launching an on-demand food delivery platform using an Amazon ECS cluster with an AWS Fargate serverless compute engine and Amazon Aurora. It is expected that the database read queries will significantly increase in the coming weeks. A Solutions Architect recently launched two Read Replicas to the database cluster to improve the platform's scalability. The team considered using lazy loading to cache results, but that does not balance read traffic across replicas.</p><p>Which of the following is the MOST suitable configuration that the Architect should implement to load balance all of the incoming read requests equally to the two Read Replicas?</p>","options":[{"html":"Create a new Network Load Balancer to evenly distribute the read queries to the Read Replicas of the Aurora database.","correct":false},{"html":"Use the built-in Cluster endpoint of the Aurora database.","correct":false},{"html":"Enable Aurora Parallel Query.","correct":false},{"html":"Use the built-in Reader endpoint of the Aurora database.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Aurora cluster có 2 Read Replica, muốn load balance đều các read query đến 2 replica này.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn cơ chế built-in của Aurora để tự động cân bằng tải đọc giữa các replica.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"load balance... to the two Read Replicas\" → đúng chức năng của <strong>Reader Endpoint</strong> (built-in, không cần thêm ELB).</li>\n</ul>","answer":"<ul>\n<li><strong>Use the built-in Reader endpoint of the Aurora database.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> NLB không phải thành phần phù hợp để phân phối tải đến Read Replica của Aurora; Aurora đã có sẵn cơ chế endpoint riêng cho việc này.</li>\n<li><strong>B. ✗</strong> Cluster (writer) endpoint luôn trỏ đến instance primary, dùng cho ghi dữ liệu (DDL/DML), không cân bằng tải đọc qua các replica.</li>\n<li><strong>C. ✗</strong> Parallel Query giúp tăng tốc 1 query đơn lẻ bằng cách đẩy tính toán xuống storage layer, không phải cơ chế cân bằng tải giữa nhiều Replica.</li>\n<li><strong>D. ✓</strong> Reader Endpoint tự động load-balance kết nối đọc đến tất cả Aurora Replica trong cluster — đúng chuẩn, built-in, không cần thêm thành phần nào khác.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm Cluster Endpoint (dùng để ghi, trỏ writer) với Reader Endpoint (dùng để đọc, tự load-balance qua các replica) — đây là 2 endpoint có vai trò hoàn toàn khác nhau.</p>","tip":"<p>Aurora: <strong>Cluster/Writer Endpoint</strong> → trỏ writer (ghi). <strong>Reader Endpoint</strong> → tự load-balance đọc qua các Replica. Muốn cân bằng tải đọc → luôn dùng Reader Endpoint.</p>"},
{"id":38,"topic":"Design High-Performing Architectures – DynamoDB + AppSync real-time ranking","supplement":false,"stem":"<p>A Solutions Architect needs to deploy a mobile application that collects votes for a singing competition. Millions of users from around the world will submit votes using mobile phones. These votes must be collected and stored in a highly scalable and highly available database, which will be queried for real-time ranking. The database is expected to undergo frequent schema changes throughout the voting period.</p><p>Which of the following combinations of services should the architect use to meet this requirement, with read capacity units (RCU) that scale for live rankings?</p>","options":[{"html":"Amazon DynamoDB and AWS AppSync","correct":true},{"html":"Amazon Relational Database Service (Amazon RDS) and Amazon MQ","correct":false},{"html":"Amazon DocumentDB (with MongoDB compatibility) and Amazon AppFlow","correct":false},{"html":"Amazon Aurora and Amazon Cognito","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Ứng dụng vote toàn cầu, hàng triệu user, cần database scale cao, available cao, <strong>schema thay đổi thường xuyên</strong>, hỗ trợ real-time ranking.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng cặp dịch vụ database + tầng real-time phù hợp.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"frequent schema changes\" → NoSQL schemaless (<strong>DynamoDB</strong>); \"real-time ranking\" cập nhật liên tục cho app → <strong>AppSync</strong> (GraphQL real-time subscription).</li>\n</ul>","answer":"<ul>\n<li><strong>Amazon DynamoDB and AWS AppSync.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> DynamoDB là NoSQL schemaless, phù hợp với schema thay đổi liên tục, scale RCU theo nhu cầu đọc; AppSync giúp đồng bộ dữ liệu real-time (qua GraphQL subscriptions) cho ứng dụng hiển thị ranking.</li>\n<li><strong>B. ✗</strong> RDS là relational, thay đổi schema (migration) phức tạp hơn nhiều so với NoSQL; Amazon MQ chỉ là message broker, không liên quan đến real-time ranking.</li>\n<li><strong>C. ✗</strong> DocumentDB là lựa chọn database khả thi nhưng AppFlow chỉ dùng để tích hợp dữ liệu giữa các SaaS, không có khả năng truy vấn/đồng bộ real-time cho ứng dụng.</li>\n<li><strong>D. ✗</strong> Aurora (relational) không phù hợp với schema thay đổi liên tục; Cognito chỉ là dịch vụ xác thực người dùng, không liên quan đến ranking.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Các đáp án sai đều ghép đúng 1 vế (database hoặc dịch vụ phụ) nhưng sai vế còn lại — cần kiểm tra cả 2 thành phần trong combo đều đúng vai trò.</p>","tip":"<p>Schema thay đổi liên tục, cần scale cao → NoSQL (<strong>DynamoDB</strong>). Cần đồng bộ dữ liệu real-time cho app (ranking, chat...) → <strong>AWS AppSync</strong>.</p>"},
{"id":39,"topic":"Design High-Performing Architectures – CloudFormation CreationPolicy + cfn-signal","supplement":false,"stem":"<p>A company is deploying a Microsoft SharePoint Server environment on AWS using CloudFormation. The Solutions Architect needs to install and configure the architecture that is composed of Microsoft Active Directory (AD) domain controllers, Microsoft SQL Server 2012, multiple Amazon EC2 instances to host the Microsoft SharePoint Server and many other dependencies. The Architect needs to ensure that the required components are properly running before the stack creation proceeds.</p><p>Which of the following should the Architect do to meet this requirement?</p>","options":[{"html":"Configure the DependsOn attribute in the CloudFormation template. Send a success signal after the applications are installed and configured using the cfn-init helper script.","correct":false},{"html":"Configure a CreationPolicy attribute to the instance in the CloudFormation template. Send a success signal after the applications are installed and configured using the cfn-signal helper script.","correct":true},{"html":"Configure a UpdatePolicy attribute to the instance in the CloudFormation template. Send a success signal after the applications are installed and configured using the cfn-signal helper script.","correct":false},{"html":"Configure the UpdateReplacePolicy attribute in the CloudFormation template. Send a success signal after the applications are installed and configured using the cfn-signal helper script.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần đảm bảo ứng dụng (SharePoint, SQL Server...) đã cài đặt và chạy thành công <strong>trước khi</strong> CloudFormation coi resource đó là \"create complete\".</li>\n<li><strong>Yêu cầu chính:</strong> Attribute nào + helper script nào dùng để chờ tín hiệu xác nhận trong lúc <strong>tạo mới</strong> resource.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"before stack creation proceeds\" → <strong>CreationPolicy</strong> + <strong>cfn-signal</strong> (không phải cfn-init, không phải UpdatePolicy).</li>\n</ul>","answer":"<ul>\n<li><strong>Configure a CreationPolicy attribute to the instance in the CloudFormation template. Send a success signal after the applications are installed and configured using the cfn-signal helper script.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> <code>cfn-init</code> dùng để thực thi cấu hình (cài đặt package, chạy command) chứ không phải để gửi tín hiệu; phải dùng <code>cfn-signal</code> để báo hiệu thành công.</li>\n<li><strong>B. ✓</strong> <code>CreationPolicy</code> khiến CloudFormation chờ đủ số tín hiệu thành công (qua <code>cfn-signal</code>) trước khi đánh dấu resource là CREATE_COMPLETE — đúng với yêu cầu \"trước khi stack creation proceeds\".</li>\n<li><strong>C. ✗</strong> <code>UpdatePolicy</code> chỉ áp dụng khi <strong>update</strong> stack, không áp dụng cho lúc <strong>tạo mới (create)</strong>.</li>\n<li><strong>D. ✗</strong> <code>UpdateReplacePolicy</code> dùng để giữ lại/backup resource vật lý khi nó bị thay thế lúc update, không liên quan đến việc chờ xác nhận cấu hình lúc tạo mới.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm <code>cfn-init</code> (chạy cấu hình) với <code>cfn-signal</code> (gửi tín hiệu hoàn tất) — hai script có vai trò khác nhau hoàn toàn trong quy trình CloudFormation.</p>","tip":"<p>Chờ app cấu hình xong trước khi đánh dấu resource tạo xong → <strong>CreationPolicy</strong> + <strong>cfn-signal</strong>. Update stack → <strong>UpdatePolicy</strong>. Giữ resource cũ khi bị thay thế lúc update → <strong>UpdateReplacePolicy</strong>.</p>"},
{"id":40,"topic":"Design Cost-Optimized Architectures – S3 Lifecycle Policy","supplement":false,"stem":"<p>A Solutions Architect is working for a financial company. The manager wants to automatically transfer obsolete data from the Amazon S3 bucket to a low-cost storage system in AWS after a certain period.</p><p>What is the best solution the Architect can provide?</p>","options":[{"html":"Use Amazon Timestream.","correct":false},{"html":"Use an Amazon EC2 instance and a scheduled job to transfer the obsolete data from their S3 location to S3 Glacier storage class.","correct":false},{"html":"Use Lifecycle Policies in S3 to move obsolete data to the S3 Glacier storage class.","correct":true},{"html":"Use Amazon SQS.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần <strong>tự động</strong> chuyển dữ liệu cũ trong S3 sang storage rẻ hơn sau một khoảng thời gian.</li>\n<li><strong>Yêu cầu chính:</strong> Giải pháp tự động, không cần script/hệ thống bổ sung.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"automatically transfer... after a certain period\" → đúng tính năng <strong>S3 Lifecycle Policy</strong> (transition action).</li>\n</ul>","answer":"<ul>\n<li><strong>Use Lifecycle Policies in S3 to move obsolete data to the S3 Glacier storage class.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Amazon Timestream là database cho time-series data, không có chức năng chuyển storage class của S3 theo thời gian.</li>\n<li><strong>B. ✗</strong> Dùng EC2 + scheduled job là giải pháp thủ công, phức tạp và tốn kém hơn không cần thiết so với tính năng có sẵn của S3.</li>\n<li><strong>C. ✓</strong> S3 Lifecycle configuration cho phép định nghĩa rule tự động chuyển object sang storage class rẻ hơn (vd: Glacier) sau X ngày, hoàn toàn tự động, không cần hạ tầng bổ sung.</li>\n<li><strong>D. ✗</strong> SQS là dịch vụ hàng đợi tin nhắn, không phải storage service, không liên quan đến việc chuyển đổi storage class.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nghĩ cần viết thêm 1 cơ chế tùy chỉnh (EC2 + script) để \"tự động hóa\", nhưng S3 đã có sẵn tính năng Lifecycle Policy làm chính xác việc này mà không cần hạ tầng bổ sung.</p>","tip":"<p>Tự động chuyển đổi storage class hoặc xóa object trong S3 theo thời gian → luôn dùng <strong>S3 Lifecycle Policy</strong>, không cần giải pháp tùy chỉnh.</p>"}
,
{"id":41,"topic":"Design Secure Architectures – SSH OK nhưng HTTP không vào được","supplement":false,"stem":"<p>A company has an On-Demand EC2 instance located in a subnet in AWS that hosts a web application. The security group attached to this EC2 instance has the following Inbound Rules:</p><table><tr><th>Type</th><th>Protocol</th><th>Port Range</th><th>Source</th></tr><tr><td>SSH</td><td>TCP</td><td>22</td><td>0.0.0.0/0</td></tr></table><p>The Route table attached to the VPC is shown below:</p><table><tr><th>Destination</th><th>Target</th></tr><tr><td>10.0.0.0/16</td><td>local</td></tr><tr><td>0.0.0.0/0</td><td>igw-b51618cc</td></tr></table><p>You can establish an SSH connection into the EC2 instance from the Internet. However, you are not able to connect to the web server using your Chrome browser.</p><p>Which of the below steps would resolve the issue?</p>","options":[{"html":"In the Security Group, add an Inbound HTTP rule.","correct":true},{"html":"In the Route table, add this new route entry: 10.0.0.0/27 -> local","correct":false},{"html":"In the Security Group, remove the SSH rule.","correct":false},{"html":"In the Route table, add this new route entry: 0.0.0.0 -> igw-b51618cc","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> SSH (port 22) kết nối được bình thường, nhưng HTTP (port 80) từ trình duyệt thì không. Route table đã có route ra Internet Gateway hợp lệ.</li>\n<li><strong>Yêu cầu chính:</strong> SSH hoạt động chứng tỏ route table và network đều ổn → vấn đề chỉ còn ở <strong>Security Group thiếu rule cho port 80</strong>.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Security Group chỉ có đúng 1 rule cho port 22, không có rule nào cho port 80 (HTTP).</li>\n</ul>","answer":"<ul>\n<li><strong>In the Security Group, add an Inbound HTTP rule.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Security group hiện chỉ cho phép inbound port 22 (SSH); cần thêm rule cho phép inbound port 80 (HTTP) thì trình duyệt mới truy cập được web server.</li>\n<li><strong>B. ✗</strong> Route table đã đúng (có route tới local và IGW); SSH hoạt động chứng minh route table không phải vấn đề.</li>\n<li><strong>C. ✗</strong> Xóa rule SSH chỉ làm mất khả năng SSH, không giúp mở được HTTP.</li>\n<li><strong>D. ✗</strong> Route <code>0.0.0.0/0 -&gt; igw-b51618cc</code> đã tồn tại sẵn trong route table; thêm lại là thừa và không giải quyết vấn đề.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Thấy lỗi kết nối dễ nghĩ ngay đến route table, nhưng vì SSH (cùng instance, cùng network path) đã hoạt động tốt, chứng tỏ route table không phải nguyên nhân — phải tập trung vào Security Group thiếu rule cho port tương ứng.</p>","tip":"<p>Nếu 1 loại traffic (SSH) đã vào được nhưng loại khác (HTTP) thì không, trên cùng 1 instance → kiểm tra <strong>Security Group</strong> có thiếu rule cho port/protocol đó không, đừng nghi ngờ route table.</p>"},
{"id":42,"topic":"Design Resilient Architectures – VPC Peering không transitive","supplement":false,"stem":"<p>A large insurance company has an AWS account that contains three VPCs (DEV, UAT and PROD) in the same region. UAT is peered to both PROD and DEV using a VPC peering connection. All VPCs have non-overlapping CIDR blocks. The company wants to push minor code releases from Dev to Prod to speed up time to market.</p><p>Which of the following options helps the company accomplish this?</p>","options":[{"html":"Create a new entry to PROD in the DEV route table using the VPC peering connection as the target.","correct":false},{"html":"Do nothing. Since these two VPCs are already connected via UAT, they already have a connection to each other.","correct":false},{"html":"Change the DEV and PROD VPCs to have overlapping CIDR blocks to be able to connect them.","correct":false},{"html":"Create a new VPC peering connection between PROD and DEV with the appropriate routes.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> DEV–UAT và UAT–PROD đã peer với nhau, nhưng DEV cần kết nối trực tiếp với PROD.</li>\n<li><strong>Yêu cầu chính:</strong> Thiết lập kết nối DEV ↔ PROD.</li>\n<li><strong>Từ khóa cần chú ý:</strong> VPC Peering <strong>không hỗ trợ transitive</strong> (bắc cầu) — DEV và PROD dù cùng peer với UAT vẫn <strong>không</strong> tự động thông nhau.</li>\n</ul>","answer":"<ul>\n<li><strong>Create a new VPC peering connection between PROD and DEV with the appropriate routes.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Dù thêm route trong DEV trỏ đến 1 peering connection, nếu chưa có peering connection thực sự giữa DEV-PROD thì route đó vô nghĩa (không có target hợp lệ).</li>\n<li><strong>B. ✗</strong> VPC Peering không transitive — DEV-UAT và UAT-PROD peer không đồng nghĩa DEV-PROD có kết nối trực tiếp.</li>\n<li><strong>C. ✗</strong> Không thể peer 2 VPC có CIDR block trùng nhau (overlapping) — đây là giới hạn kỹ thuật của VPC Peering.</li>\n<li><strong>D. ✓</strong> Phải tạo 1 VPC Peering connection <strong>mới, trực tiếp</strong> giữa DEV và PROD, kèm cấu hình route table tương ứng ở cả 2 bên.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nghĩ \"đã peer qua UAT rồi nên tự thông nhau\" — đây là hiểu lầm phổ biến nhất về VPC Peering, cần nhớ kỹ nó <strong>không transitive</strong>.</p>","tip":"<p>VPC Peering <strong>không bắc cầu (non-transitive)</strong>. Muốn 2 VPC bất kỳ thông nhau trực tiếp → phải tạo peering connection riêng giữa chính 2 VPC đó (hoặc dùng Transit Gateway nếu cần mô hình hub-and-spoke).</p>"},
{"id":43,"topic":"Design High-Performing Architectures – S3 + Athena phân tích log ALB","supplement":false,"stem":"<p>A large telecommunications company needs to run analytics against all combined log files from the Application Load Balancer as part of the regulatory requirements.</p><p>Which AWS services can be used together to collect logs and then easily perform log analysis?</p>","options":[{"html":"Amazon S3 for storing ELB log files and Amazon Athena for analyzing the log files.","correct":true},{"html":"Amazon DynamoDB for storing and EC2 for analyzing the logs.","correct":false},{"html":"Amazon EC2 with EBS volumes for storing and analyzing the log files.","correct":false},{"html":"Amazon S3 for storing the ELB log files and an EC2 instance for analyzing the log files using a custom-built application.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> ALB access log mặc định lưu ở S3; cần chạy phân tích (analytics) trên log này.</li>\n<li><strong>Yêu cầu chính:</strong> Cặp dịch vụ lưu trữ + phân tích log <strong>dễ dùng nhất</strong>, ít phải tự xây dựng.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"easily perform log analysis\" → <strong>Athena</strong> (query trực tiếp trên S3 bằng SQL, serverless) thay vì tự viết app custom trên EC2.</li>\n</ul>","answer":"<ul>\n<li><strong>Amazon S3 for storing ELB log files and Amazon Athena for analyzing the log files.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> ALB log được lưu ở S3 (đây là cách mặc định), Athena có thể query trực tiếp dữ liệu trong S3 bằng SQL mà không cần ETL hay hạ tầng riêng — đơn giản và tiết kiệm nhất.</li>\n<li><strong>B. ✗</strong> ALB log không lưu trực tiếp vào DynamoDB; lưu log dạng text/log file vào NoSQL table rồi phân tích bằng EC2 là cách làm không hiệu quả.</li>\n<li><strong>C. ✗</strong> EC2 + EBS tốn kém hơn và EBS không bền vững (durable) bằng S3 cho việc lưu trữ log dài hạn.</li>\n<li><strong>D. ✗</strong> Tuy khả thi về mặt kỹ thuật (S3 lưu đúng), nhưng phải tự viết ứng dụng phân tích trên EC2 tốn kém và phức tạp hơn nhiều so với dùng Athena có sẵn.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Đáp án D cũng dùng đúng S3 để lưu log (không sai hoàn toàn), nhưng phần phân tích bằng EC2 tự viết lại kém hiệu quả hơn Athena — đề hỏi \"EASILY perform log analysis\" nên ưu tiên giải pháp serverless, có sẵn.</p>","tip":"<p>Log ELB/ALB lưu trên S3 → phân tích trực tiếp bằng <strong>Amazon Athena</strong> (SQL serverless trên S3), không cần tự xây dựng ứng dụng phân tích riêng.</p>"},
{"id":44,"topic":"Design Resilient Architectures – Kiến thức cơ bản về VPC subnet","supplement":false,"stem":"<p>An aerospace engineering company recently adopted a hybrid cloud infrastructure with AWS. One of the responsibilities of the Solutions Architect is to launch an Amazon VPC with both public and private subnets for Amazon EC2 instances and database instances. The architecture must ensure each subnet is properly defined within the assigned VPC CIDR block.</p><p>Which of the following statements are true regarding VPC subnets? (Select TWO.)</p>","options":[{"html":"EC2 instances in a private subnet can communicate with the Internet only if they have an Elastic IP.","correct":false},{"html":"Each subnet maps to a single Availability Zone.","correct":true},{"html":"Each newly created subnet is, by default, linked to the main route table of the VPC.","correct":true},{"html":"Each subnet spans 2 Availability Zones.","correct":false},{"html":"The allowed block size in VPC is between a /16 netmask (65,536 IP addresses) and /27 netmask (32 IP addresses).","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Kiểm tra kiến thức nền tảng về cấu trúc subnet trong VPC.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn 2 phát biểu đúng về VPC subnet.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Mỗi subnet chỉ nằm trong <strong>1 AZ duy nhất</strong>; subnet mới tạo mặc định gắn vào <strong>main route table</strong>; kích thước VPC cho phép từ <code>/16</code> đến <code>/28</code> (không phải <code>/27</code>).</li>\n</ul>","answer":"<ul>\n<li><strong>Each subnet maps to a single Availability Zone.</strong></li>\n<li><strong>Each newly created subnet is, by default, linked to the main route table of the VPC.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> EC2 private subnet vẫn có thể ra Internet qua NAT Gateway/NAT Instance (dùng public IP của NAT) mà không cần có Elastic IP riêng.</li>\n<li><strong>B. ✓</strong> Mỗi subnet bắt buộc nằm trọn trong 1 Availability Zone, không thể trải nhiều AZ.</li>\n<li><strong>C. ✓</strong> Khi tạo subnet mới mà không chỉ định route table riêng, nó sẽ tự động được gắn vào main route table của VPC.</li>\n<li><strong>D. ✗</strong> Sai, vì mỗi subnet chỉ thuộc đúng 1 AZ (ngược với B).</li>\n<li><strong>E. ✗</strong> Kích thước block hợp lệ của VPC là từ <code>/16</code> (65.536 IP) đến <code>/28</code> (16 IP), không phải <code>/27</code> (32 IP).</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm giới hạn nhỏ nhất của VPC CIDR là <code>/27</code> thay vì <code>/28</code> — cần nhớ chính xác con số này vì đây là kiến thức hay bị hỏi.</p>","tip":"<p>VPC subnet: 1 subnet = 1 AZ duy nhất. VPC CIDR hợp lệ: <code>/16</code> đến <code>/28</code>. Subnet mới mặc định gắn vào <strong>main route table</strong>.</p>"},
{"id":45,"topic":"Design Secure Architectures – Security Group cho SSH","supplement":false,"stem":"<p>A Solutions Architect is unable to connect to the newly deployed EC2 instance via SSH using a home computer. However, the Architect was able to successfully access other existing instances in the VPC without any issues.</p><p>Which of the following should the Architect check and possibly correct to restore connectivity?</p>","options":[{"html":"Configure the Security Group of the EC2 instance to permit ingress traffic over port 22 from your IP.","correct":true},{"html":"Configure the Security Group of the EC2 instance to permit ingress traffic over port 3389 from your IP.","correct":false},{"html":"Configure the Network Access Control List of your VPC to permit ingress traffic over port 22 from your IP.","correct":false},{"html":"Use Amazon Data Lifecycle Manager.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Chỉ riêng instance <strong>mới deploy</strong> không SSH được, các instance khác trong cùng VPC vẫn SSH bình thường.</li>\n<li><strong>Yêu cầu chính:</strong> Xác định thành phần cần kiểm tra — vì các instance khác vẫn OK nên vấn đề không phải NACL (áp dụng chung cả subnet).</li>\n<li><strong>Từ khóa cần chú ý:</strong> Vấn đề chỉ xảy ra ở 1 instance cụ thể → kiểm tra <strong>Security Group riêng</strong> của instance đó, cổng SSH là 22.</li>\n</ul>","answer":"<ul>\n<li><strong>Configure the Security Group of the EC2 instance to permit ingress traffic over port 22 from your IP.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Security Group hoạt động ở mức instance; instance mới có thể chưa được gán rule cho phép SSH (port 22) từ IP của kiến trúc sư.</li>\n<li><strong>B. ✗</strong> Port 3389 là RDP (dùng cho Windows), không phải SSH (dùng port 22 cho Linux).</li>\n<li><strong>C. ✗</strong> Nếu là lỗi NACL (áp dụng cho cả subnet) thì các instance khác trong cùng subnet cũng sẽ bị ảnh hưởng — nhưng đề nói chỉ riêng instance mới bị lỗi.</li>\n<li><strong>D. ✗</strong> Data Lifecycle Manager dùng để tự động hóa snapshot/AMI, không liên quan gì đến kết nối SSH.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm port RDP (3389) với SSH (22) — luôn nhớ SSH = TCP 22, RDP = TCP 3389.</p>","tip":"<p>Chỉ 1 instance bị lỗi kết nối trong khi các instance khác cùng subnet vẫn OK → vấn đề nằm ở <strong>Security Group riêng của instance đó</strong>, không phải NACL (áp dụng chung cả subnet).</p>"},
{"id":46,"topic":"Design Secure Architectures – AWS Config rule kiểm tra tag","supplement":false,"stem":"<p>A company requires that all AWS resources be tagged with a standard naming convention for better access control. The company's solutions architect must implement a solution that checks for untagged AWS resources.</p><p>Which solution requires the least amount of effort to implement?</p>","options":[{"html":"Use an AWS Config rule to detect non-compliant tags.","correct":true},{"html":"Use service control policies (SCP) to detect resources that are not tagged properly.","correct":false},{"html":"Create a Lambda function that runs compliance checks on tagged resources. Schedule the function using Amazon EventBridge (Amazon CloudWatch Events).","correct":false},{"html":"Use tag policies in AWS Organizations to standardize the naming of tags. Store all the tags in an Amazon S3 bucket with the S3 Object Lock feature enabled.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần kiểm tra resource nào thiếu tag theo chuẩn đặt tên, với ít công sức triển khai nhất.</li>\n<li><strong>Yêu cầu chính:</strong> Giải pháp có sẵn (managed), không cần tự viết code.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"checks for untagged resources\" + \"LEAST effort\" → managed rule <code>require-tags</code> của <strong>AWS Config</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Use an AWS Config rule to detect non-compliant tags.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> AWS Config có sẵn managed rule <code>require-tags</code> để kiểm tra resource có đủ tag yêu cầu hay không — không cần code, triển khai nhanh.</li>\n<li><strong>B. ✗</strong> SCP chỉ là guardrail giới hạn quyền tối đa, không có khả năng kiểm tra/báo cáo tag không hợp lệ.</li>\n<li><strong>C. ✗</strong> Viết Lambda function tự check tag tốn công sức lập trình hơn nhiều so với dùng sẵn managed rule của AWS Config.</li>\n<li><strong>D. ✗</strong> Tag Policy chỉ giúp chuẩn hóa tên tag khi tạo mới, không báo cáo được resource hiện có đang thiếu tag; dùng S3 Object Lock ở đây cũng không cần thiết.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Tag Policies trong Organizations nghe có vẻ đúng hướng vì liên quan đến \"tag\", nhưng nó chỉ chuẩn hóa định dạng, không có chức năng phát hiện/báo cáo resource thiếu tag như AWS Config.</p>","tip":"<p>Kiểm tra compliance của resource (tag, encryption, config...) với ít công sức nhất → luôn nghĩ đến <strong>AWS Config managed rules</strong> trước khi tự viết Lambda.</p>"},
{"id":47,"topic":"Design Secure Architectures – KMS key policy cho Lambda execution role","supplement":false,"stem":"<p>A solutions architect is writing an AWS Lambda function that will process encrypted documents from an Amazon FSx for NetApp ONTAP file system. The documents are protected by an AWS KMS customer key. After processing the documents, the Lambda function will store the results in an S3 bucket with an Amazon S3 Glacier Flexible Retrieval storage class. The solutions architect must ensure that the files can be decrypted by the Lambda function.</p><p>Which action accomplishes the requirement?</p>","options":[{"html":"Attach the kms:decrypt permission to the Lambda function's execution role. Add a statement to the AWS KMS key's policy that grants the function's execution role the kms:decrypt permission.","correct":true},{"html":"Attach the kms:decrypt permission to the Lambda function's execution role. Add a statement to the AWS KMS key's policy that grants the function's ARN the kms:decrypt permission.","correct":false},{"html":"Attach the kms:decrypt permission to the Lambda function's resource policy. Add a statement to the AWS KMS key's policy that grants the function's resource policy ARN the kms:decrypt permission.","correct":false},{"html":"Attach the kms:decrypt permission to the Lambda function's resource policy. Add a statement to the AWS KMS key's policy that grants the function's execution role the kms:decrypt permission.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Lambda cần giải mã document bằng KMS customer key.</li>\n<li><strong>Yêu cầu chính:</strong> Cấp đúng quyền <code>kms:decrypt</code> ở đúng 2 nơi: IAM execution role của Lambda, và key policy của KMS key.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Lambda thao tác với service khác (S3, KMS...) luôn thông qua <strong>execution role</strong>, không phải \"resource policy\" (resource policy của Lambda chỉ kiểm soát <em>ai được gọi hàm</em>, không phải hàm được gọi gì).</li>\n</ul>","answer":"<ul>\n<li><strong>Attach the kms:decrypt permission to the Lambda function's execution role. Add a statement to the AWS KMS key's policy that grants the function's execution role the kms:decrypt permission.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Đúng chuẩn: cấp <code>kms:decrypt</code> cho execution role của Lambda (IAM policy), đồng thời key policy của KMS key cũng phải cho phép chính execution role đó sử dụng key.</li>\n<li><strong>B. ✗</strong> Key policy phải cấp quyền cho <strong>execution role</strong> (principal thực sự gọi KMS), không phải cấp cho ARN của function — Lambda gọi AWS service bằng quyền của execution role, không phải bằng ARN riêng của nó.</li>\n<li><strong>C. ✗</strong> Resource policy của Lambda chỉ kiểm soát <em>ai có thể invoke</em> function, không liên quan đến quyền function được gọi dịch vụ khác (như KMS); gán <code>kms:decrypt</code> ở đây là sai chỗ.</li>\n<li><strong>D. ✗</strong> Tương tự C, <code>kms:decrypt</code> phải gắn vào <strong>execution role</strong>, không phải resource policy của function.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm lẫn giữa \"resource policy\" (ai được gọi Lambda) và \"execution role\" (Lambda được phép làm gì với service khác) — đây là 2 khái niệm hoàn toàn khác nhau trong Lambda.</p>","tip":"<p>Lambda muốn gọi service khác (S3, KMS, DynamoDB...) → luôn cấp quyền qua <strong>execution role</strong> (cả ở IAM policy lẫn resource policy/key policy của service đích), không phải qua resource policy của chính function.</p>"},
{"id":48,"topic":"Design Cost-Optimized Architectures – Cost Explorer API cho forecast chi phí","supplement":false,"stem":"<p>A company is building an automation tool for generating custom reports on its AWS usage. The company must be able to programmatically access and forecast usage costs on specific services.</p><p>Which of the following would meet the requirements with the LEAST amount of operational overhead?</p>","options":[{"html":"Generate AWS Budgets reports for usage cost data and deliver them via Amazon Simple Queue Service (SQS).","correct":false},{"html":"Use the AWS Cost Explorer API with pagination to programmatically retrieve the usage cost-related data.","correct":true},{"html":"Utilize the downloadable AWS Cost Explorer report .csv files to access the cost-related data. Predict usage costs using AWS Budgets.","correct":false},{"html":"Configure AWS Budgets to send usage cost data to the company via Amazon SNS.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần truy cập <strong>chương trình hóa (programmatically)</strong> dữ liệu chi phí và dự báo usage cost cho từng service cụ thể.</li>\n<li><strong>Yêu cầu chính:</strong> Giải pháp API-driven, ít overhead, hỗ trợ cả truy vấn và forecast.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"programmatically access and forecast\" → <strong>Cost Explorer API</strong> hỗ trợ cả truy vấn dữ liệu lẫn forecast, có pagination cho dataset lớn.</li>\n</ul>","answer":"<ul>\n<li><strong>Use the AWS Cost Explorer API with pagination to programmatically retrieve the usage cost-related data.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> AWS Budgets chỉ cảnh báo khi vượt ngưỡng ngân sách, không cung cấp dữ liệu chi tiết usage cost để phân tích/report tùy chỉnh.</li>\n<li><strong>B. ✓</strong> Cost Explorer API cho phép truy vấn dữ liệu chi phí (tổng hợp hoặc chi tiết) bằng chương trình, hỗ trợ pagination để lấy dataset lớn hiệu quả, và cũng hỗ trợ forecast.</li>\n<li><strong>C. ✗</strong> Tải file .csv thủ công rồi xử lý là thao tác thủ công, không phải \"programmatically\", tốn nhiều effort hơn gọi API trực tiếp.</li>\n<li><strong>D. ✗</strong> AWS Budgets qua SNS chỉ gửi cảnh báo ngưỡng, không cung cấp dữ liệu usage cost chi tiết cần cho report tùy chỉnh.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> AWS Budgets chuyên về cảnh báo ngân sách (threshold alert), không phải công cụ để lấy dữ liệu usage cost chi tiết — cần phân biệt rõ với Cost Explorer (phân tích, truy vấn, forecast).</p>","tip":"<p>Cần truy vấn/forecast chi phí usage bằng code → <strong>AWS Cost Explorer API</strong>. Cần cảnh báo khi vượt ngưỡng chi tiêu → <strong>AWS Budgets</strong>.</p>"},
{"id":49,"topic":"Design High-Performing Architectures – S3 Transfer Acceleration","supplement":false,"stem":"<p>A company has a global online trading platform in which users from all over the world regularly upload terabytes of transactional data to a centralized Amazon S3 bucket.</p><p>Which of the following should be used in the present system to improve throughput and ensure consistently fast data transfer to the S3 bucket, regardless of the user's location?</p>","options":[{"html":"S3 Transfer Acceleration","correct":true},{"html":"Use Amazon CloudFront Origin Access Control (OAC)","correct":false},{"html":"FTP","correct":false},{"html":"AWS Direct Connect","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> User toàn cầu upload lượng lớn dữ liệu lên 1 S3 bucket tập trung, muốn tốc độ nhanh và ổn định bất kể vị trí địa lý.</li>\n<li><strong>Yêu cầu chính:</strong> Tăng throughput upload lên S3 cho user khắp nơi trên thế giới.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"users all over the world\" + \"upload... to S3 bucket\" → <strong>S3 Transfer Acceleration</strong> (tận dụng CloudFront Edge Location để route upload qua đường tối ưu).</li>\n</ul>","answer":"<ul>\n<li><strong>S3 Transfer Acceleration.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> S3 Transfer Acceleration dùng mạng lưới Edge Location toàn cầu của CloudFront để tăng tốc độ upload/download đến S3, bất kể user ở đâu.</li>\n<li><strong>B. ✗</strong> CloudFront OAC chỉ đảm bảo CloudFront là đường truy cập duy nhất vào S3, không liên quan đến việc tăng tốc upload từ user đến S3.</li>\n<li><strong>C. ✗</strong> FTP không đảm bảo throughput nhanh và ổn định, cũng không phải dịch vụ AWS được tối ưu cho việc này.</li>\n<li><strong>D. ✗</strong> Direct Connect chỉ phù hợp cho kết nối cố định từ 1 datacenter on-premises, không khả thi/kinh tế cho user cá nhân rải khắp toàn cầu.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Direct Connect nghe \"nhanh và ổn định\" nhưng chỉ phù hợp cho kết nối cố định 1-1 (datacenter–AWS), không dùng được cho user cá nhân khắp thế giới.</p>","tip":"<p>User toàn cầu cần upload/download nhanh, ổn định đến 1 S3 bucket → <strong>S3 Transfer Acceleration</strong> (dùng CloudFront Edge Location).</p>"},
{"id":50,"topic":"Design Resilient Architectures – Stop/Start EC2 với Instance Store","supplement":false,"stem":"<p>A FinTech startup deployed an application on an Amazon EC2 instance with attached Instance Store volumes and an Elastic IP address. The server is only accessed from 8 AM to 6 PM and can be stopped from 6 PM to 8 AM for cost efficiency using AWS Lambda with a script that automates this based on tags.</p><p>Which of the following will occur when the EC2 instance is stopped and started? (Select TWO.)</p>","options":[{"html":"The Elastic IP address is disassociated with the instance.","correct":false},{"html":"The underlying host for the instance is possibly changed.","correct":true},{"html":"There will be no changes.","correct":false},{"html":"The ENI (Elastic Network Interface) is detached.","correct":false},{"html":"All data on the attached instance-store devices will be lost.","correct":true}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> EC2 instance (EBS-backed, vì có thể stop/start) có gắn thêm Instance Store volume, bị stop/start theo lịch mỗi ngày.</li>\n<li><strong>Yêu cầu chính:</strong> Xác định 2 điều chắc chắn xảy ra khi stop rồi start lại instance.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Instance Store volume <strong>luôn mất dữ liệu</strong> khi instance stop; AWS có thể <strong>đổi host vật lý</strong> khi start lại.</li>\n</ul>","answer":"<ul>\n<li><strong>The underlying host for the instance is possibly changed.</strong></li>\n<li><strong>All data on the attached instance-store devices will be lost.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Elastic IP vẫn giữ nguyên liên kết với instance ngay cả sau khi stop/start (khác với public IP thường, sẽ đổi).</li>\n<li><strong>B. ✓</strong> Khi stop rồi start lại, AWS thường di chuyển instance sang 1 host vật lý khác (không đảm bảo giữ nguyên host cũ).</li>\n<li><strong>C. ✗</strong> Sai, vì có nhiều thay đổi xảy ra: dữ liệu instance store bị mất, host vật lý có thể đổi, v.v.</li>\n<li><strong>D. ✗</strong> ENI vẫn được giữ gắn liền với instance khi stop/start, chỉ bị gỡ khi người dùng chủ động detach.</li>\n<li><strong>E. ✓</strong> Instance Store là bộ nhớ tạm gắn liền với phần cứng vật lý của host; khi instance dừng, dữ liệu trên đó chắc chắn bị xóa sạch.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ tưởng Elastic IP cũng bị disassociate giống public IP thường — thực tế Elastic IP là địa chỉ cố định, gắn liền với instance xuyên suốt vòng đời stop/start.</p>","tip":"<p>Stop/Start EC2 (EBS-backed): Elastic IP và ENI vẫn giữ nguyên; host vật lý <strong>có thể đổi</strong>; dữ liệu trên <strong>Instance Store luôn mất</strong>.</p>"}
,
{"id":51,"topic":"Design Secure Architectures – EBS Encryption + S3 Encryption","supplement":false,"stem":"<p>An investment bank is working with an IT team to handle the launch of the new digital wallet system. The applications will run on multiple EBS-backed EC2 instances which will store the logs, transactions, and billing statements of the user in an S3 bucket. Due to tight security and compliance requirements, the IT team is exploring options on how to safely store sensitive data on the EBS volumes and S3.</p><p>Which of the below options should be carried out when storing sensitive data on AWS? (Select TWO.)</p>","options":[{"html":"Enable Amazon S3 Server-Side or use Client-Side Encryption","correct":true},{"html":"Create an EBS Snapshot","correct":false},{"html":"Enable EBS Encryption","correct":true},{"html":"Use AWS Shield and WAF","correct":false},{"html":"Migrate the EC2 instances from the public to private subnet.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Dữ liệu nhạy cảm nằm ở 2 nơi: <strong>EBS volume</strong> (của EC2) và <strong>S3 bucket</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn 2 cách bảo vệ dữ liệu đúng cho đúng 2 loại storage này.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Cần encryption cho <strong>cả EBS lẫn S3</strong>, không phải backup hay network security.</li>\n</ul>","answer":"<ul>\n<li><strong>Enable Amazon S3 Server-Side or use Client-Side Encryption.</strong></li>\n<li><strong>Enable EBS Encryption.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Mã hóa S3 (server-side hoặc client-side) bảo vệ dữ liệu log/transaction/billing lưu trên S3.</li>\n<li><strong>B. ✗</strong> EBS Snapshot là giải pháp backup, không phải cơ chế mã hóa/bảo mật dữ liệu.</li>\n<li><strong>C. ✓</strong> EBS Encryption mã hóa dữ liệu trên volume mà không cần tự xây dựng hạ tầng quản lý key.</li>\n<li><strong>D. ✗</strong> AWS Shield/WAF chống tấn công DDoS/web exploit, không liên quan đến mã hóa
