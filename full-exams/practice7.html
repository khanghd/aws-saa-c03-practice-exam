zon.com/AmazonRDS/latest/AuroraUserGuide/AuroraMySQL.Integrating.Lambda.html</a></li><li><a href=\"https://aws.amazon.com/blogs/database/capturing-data-changes-in-amazon-aurora-using-aws-lambda/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/blogs/database/capturing-data-changes-in-amazon-aurora-using-aws-lambda/</a></li></ul>"},{"id":59,"topic":"Design Secure Architectures – dạng bài chọn đúng cơ chế identity federation để người dùng truy cập AWS bằng chính cre...","supplement":false,"stem":"A pharmaceutical company has resources hosted on both its on-premises network and in the AWS cloud. The company requires all Software Architects to access resources in both environments using on-premises credentials, which are stored in Active Directory, rather than through an Amazon Cognito identity pool.<br><br>In this scenario, which of the following can be used to fulfill this requirement?","options":[{"html":"Use Amazon VPC","correct":false},{"html":"Set up SAML 2.0-Based Federation by using a Microsoft Active Directory Federation Service.","correct":true},{"html":"Use IAM users","correct":false},{"html":"Set up SAML 2.0-Based Federation by using a Web Identity Federation.","correct":false}],"multi":1,"analysis":"<p>Đây là dạng bài chọn đúng cơ chế identity federation để người dùng truy cập AWS bằng chính credentials on-premises đang lưu trong Active Directory, phân biệt với các phương án federation hoặc truy cập khác không phù hợp.</p>","answer":"<p>Vì công ty đang dùng Microsoft Active Directory, vốn đã hỗ trợ sẵn Security Assertion Markup Language (SAML), ta có thể thiết lập SAML-Based Federation cho API Access vào AWS cloud. Nhờ đó, người dùng có thể kết nối vào AWS bằng chính thông tin đăng nhập (login credentials) của mạng on-premises. AWS hỗ trợ identity federation với SAML 2.0, một chuẩn mở được nhiều identity provider (IdP) sử dụng. Tính năng này cho phép federated single sign-on (SSO), giúp người dùng đăng nhập vào AWS Management Console hoặc gọi AWS API mà không cần tạo IAM user cho từng người trong tổ chức. Để thiết lập SAML 2.0-based federation, tổ chức cần cấu hình IdP của mình và AWS account để tin cậy lẫn nhau; bên trong tổ chức cần có một IdP hỗ trợ SAML 2.0 như Microsoft Active Directory Federation Service (AD FS, một phần của Windows Server), Shibboleth, hoặc một SAML 2.0 provider tương thích khác.</p>","explain":"<p>- Thiết lập SAML 2.0-Based Federation bằng Web Identity Federation: phương án này chủ yếu dùng để người dùng đăng nhập thông qua một external identity provider (IdP) phổ biến như Login with Amazon, Facebook, hoặc Google; nó không sử dụng Active Directory.</p><p>- Dùng IAM users: tình huống đề bài yêu cầu sử dụng credentials hiện có trong Active Directory, không phải user account mới được tạo bởi IAM.</p><p>- Dùng Amazon VPC: VPC chỉ cho phép cấp phát một phần cô lập logic (logically isolated section) của AWS Cloud để chạy tài nguyên AWS trong một virtual network tự định nghĩa; điều này không liên quan gì đến việc xác thực người dùng hay Active Directory.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"http://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_saml.html\" target=\"_blank\" rel=\"noopener noreferrer\">http://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_saml.html</a></li><li><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers.html</a></li></ul>"},{"id":60,"topic":"Design High-Performing Architectures – dạng bài phân biệt giữa CloudWatch metrics thông thường (lấy từ hypervisor) và RDS Enha...","supplement":false,"stem":"An online cryptocurrency exchange platform is hosted in AWS, utilizing an Amazon ECS Cluster and Amazon RDS in a Multi-AZ Deployments configuration. The application heavily uses the RDS instance to process complex read and write database operations. To maintain reliability, availability, and performance, it is necessary to closely monitor how the different processes or threads on a DB instance use the CPU, including the percentage of CPU bandwidth and total memory consumed by each process.<br><br>Which of the following is the most suitable solution to monitor the database properly?","options":[{"html":"Use Amazon CloudWatch to monitor the CPU Utilization of your database.","correct":false},{"html":"Enable Enhanced Monitoring in RDS.","correct":true},{"html":"Create a script that collects and publishes custom metrics to Amazon CloudWatch, which tracks the real-time CPU Utilization of the RDS instance, and then set up a custom CloudWatch dashboard to view the metrics.","correct":false},{"html":"Check the CPU% and MEM% metrics which are readily available in the RDS console that shows the percentage of the CPU bandwidth and total memory consumed by each database process of your RDS instance.","correct":false}],"multi":1,"analysis":"<p>Đây là dạng bài phân biệt giữa CloudWatch metrics thông thường (lấy từ hypervisor) và RDS Enhanced Monitoring (lấy từ agent trên instance), để chọn giải pháp giám sát đủ chi tiết ở cấp từng process/thread trên DB instance.</p>","answer":"<p>Amazon RDS cung cấp tính năng Enhanced Monitoring, cho phép xem các metric chi tiết, real-time về hệ điều hành (OS) bên dưới DB instance. Tính năng này cho phép giám sát hiệu năng ở mức chi tiết (granular) thông qua AWS Management Console hoặc bằng cách truy cập Enhanced Monitoring JSON output qua CloudWatch Logs; mặc định các metric này được lưu trong CloudWatch Logs 30 ngày, có thể điều chỉnh bằng cách sửa retention setting của log group RDSOSMetrics. Enhanced Monitoring khác với CloudWatch metrics thông thường ở chỗ nó thu thập dữ liệu trực tiếp từ một agent cài trên instance, thay vì từ hypervisor như CloudWatch, nên có thể có sự chênh lệch nhỏ giữa hai bộ số liệu; Enhanced Monitoring cho cái nhìn chi tiết và chính xác hơn về mức sử dụng tài nguyên ở cấp OS. Tính năng này đặc biệt hữu ích khi cần biết chi tiết cách từng process/thread trên DB instance sử dụng CPU.</p>","explain":"<p>- Dùng Amazon CloudWatch để giám sát CPU Utilization của database: dù có thể dùng để giám sát CPU Utilization của DB instance, CloudWatch không cung cấp % CPU bandwidth và tổng memory tiêu thụ bởi từng database process; CloudWatch lấy metric CPU utilization từ góc nhìn hypervisor, trong khi RDS Enhanced Monitoring lấy metric từ agent cài trên instance.</p><p>- Viết script tự thu thập và publish custom metrics lên CloudWatch để theo dõi CPU Utilization real-time, rồi tạo custom CloudWatch dashboard để xem: dù có thể dùng CloudWatch Logs và dashboard để giám sát CPU Utilization, chỉ dùng CloudWatch là không đủ để lấy % CPU bandwidth và tổng memory tiêu thụ của từng database process; dữ liệu CloudWatch cung cấp không chi tiết bằng Enhanced Monitoring, và ta cũng không có quyền truy cập trực tiếp vào server/instance của RDS DB instance như với EC2 instance để cài CloudWatch agent hay custom script.</p><p>- Kiểm tra các metric CPU% và MEM% có sẵn trong RDS console, thể hiện % CPU bandwidth và tổng memory tiêu thụ của từng database process: trên thực tế các metric CPU% và MEM% không có sẵn trực tiếp trong RDS console, trái ngược với nội dung được nêu trong phương án này.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Monitoring.OS.html#USER_Monitoring.OS.CloudWatchLogs\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_Monitoring.OS.html#USER_Monitoring.OS.CloudWatchLogs</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/MonitoringOverview.html#monitoring-cloudwatch\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/MonitoringOverview.html#monitoring-cloudwatch</a></li></ul>"},{"id":61,"topic":"Design Resilient Architectures – dạng bài chọn giải pháp high-availability đơn giản, \"embedded\" trong một Region (không ...","supplement":false,"stem":"A company is experiencing repeated outages in the Availability Zone where its Amazon RDS database instance is deployed, resulting in a complete loss of access to the database during each incident. The team evaluated a multi-site active/active deployment but found that it requires cross-Region synchronization, whereas a simpler embedded solution would suffice.<br><br>Which solution should be implemented to prevent losing database access if this occurs again?","options":[{"html":"Create a read replica","correct":false},{"html":"Create a snapshot of the database","correct":false},{"html":"Enable Multi-AZ failover","correct":true},{"html":"Increase the database instance size","correct":false}],"multi":1,"analysis":"<p>Đây là dạng bài chọn giải pháp high-availability đơn giản, &quot;embedded&quot; trong một Region (không cần cross-Region synchronization) để tránh mất quyền truy cập database khi một Availability Zone gặp sự cố — một dạng câu hỏi quen thuộc về resilience của Amazon RDS.</p>","answer":"<p>Amazon RDS Multi-AZ deployment được thiết kế để tăng cường availability và durability cho DB instance, phù hợp với các workload production. Khi bật Multi-AZ failover, Amazon RDS tự động tạo một standby replica ở một Availability Zone (AZ) khác và đồng bộ (synchronously) replicate dữ liệu từ primary instance sang standby. Điều này đảm bảo tính nhất quán dữ liệu cao và bảo vệ trước các gián đoạn liên quan đến hạ tầng; mỗi AZ chạy trên hạ tầng vật lý độc lập, giúp tăng khả năng cô lập lỗi (fault isolation) và độ bền vững. Khi xảy ra bảo trì theo kế hoạch hoặc sự cố bất ngờ (ví dụ AZ bị outage hay lỗi phần cứng), Amazon RDS tự động thực hiện failover sang standby instance; quá trình này được RDS quản lý hoàn toàn, không cần can thiệp thủ công, giúp giảm thiểu downtime và duy trì tính liên tục của hoạt động kinh doanh. Với Amazon Aurora, failover là việc promote một replica thành writer instance mới.</p>","explain":"<p>- Tạo snapshot của database: snapshot thường dùng cho mục đích backup và disaster recovery, không phải để duy trì high availability; snapshot cho phép khôi phục database về một thời điểm cụ thể, nhưng không ngăn được downtime hay cung cấp quyền truy cập liên tục khi AZ bị outage.</p><p>- Tăng kích thước database instance: hành động này chỉ cải thiện năng lực tính toán và bộ nhớ của instance, có thể giúp ích cho hiệu năng, nhưng không giải quyết được lỗi ở cấp Availability Zone; database vẫn là single point of failure trong cùng một zone, vẫn dễ bị ảnh hưởng bởi cùng loại sự cố outage như mô tả trong đề bài.</p><p>- Tạo read replica: read replica chủ yếu dùng để xử lý các workload đọc nhiều (read-heavy), không tự động thay thế (take over) khi xảy ra sự cố; việc promote read replica thành một instance độc lập cần can thiệp thủ công, do đó không đáp ứng được mục tiêu ngăn mất quyền truy cập trong các sự cố ngoài kế hoạch.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/rds/features/multi-az/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/rds/features/multi-az/</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html</a></li></ul>"},{"id":62,"topic":"Design Secure Architectures – dạng bài chọn kiến trúc data lake multi-account vừa tiết kiệm chi phí và quản lý overhe...","supplement":false,"stem":"A company wishes to query data that resides in multiple AWS accounts from a central data lake. Each account has its own Amazon S3 bucket that stores data unique to its business function. Access to the data lake must be granted based on user roles.<br><br>Which solution will minimize overhead and costs while meeting the required access patterns?","options":[{"html":"Create a scheduled AWS Lambda function using Amazon EventBridge for transferring data from multiple accounts to the S3 buckets of the central account.","correct":false},{"html":"Use AWS Control Tower to centrally manage each account's S3 buckets.","correct":false},{"html":"Use Amazon Data Firehose to consolidate data from multiple accounts into a single account.","correct":false},{"html":"Use AWS Lake Formation to consolidate data from multiple accounts into a single account.","correct":true}],"multi":1,"analysis":"<p>Đây là dạng bài chọn kiến trúc data lake multi-account vừa tiết kiệm chi phí và quản lý overhead, vừa đáp ứng yêu cầu phân quyền truy cập theo user roles — một dạng câu hỏi về quản lý dữ liệu tập trung (centralized data governance) trong SAA-C03.</p>","answer":"<p>AWS Lake Formation là dịch vụ giúp thiết lập một data lake an toàn chỉ trong vài ngày. Data lake là một kho lưu trữ tập trung, được tuyển chọn (curated) và bảo mật, lưu trữ toàn bộ dữ liệu ở cả dạng gốc lẫn dạng đã chuẩn bị sẵn để phân tích, giúp phá vỡ các silo dữ liệu và kết hợp nhiều loại phân tích khác nhau để đưa ra quyết định kinh doanh tốt hơn. Amazon S3 đóng vai trò là lớp lưu trữ (storage layer) cho Lake Formation; nếu đã dùng S3, ta có thể bắt đầu bằng cách đăng ký các S3 bucket hiện có chứa dữ liệu, Lake Formation sẽ tạo các bucket mới cho data lake và import dữ liệu vào đó — dữ liệu luôn được AWS lưu trong chính account của người dùng, chỉ người dùng mới có quyền truy cập trực tiếp. AWS Lake Formation tích hợp với AWS Glue để tạo data catalog mô tả các bộ dữ liệu sẵn có và ứng dụng nghiệp vụ phù hợp. Lake Formation cho phép định nghĩa policy và kiểm soát quyền truy cập dữ liệu bằng cách cấp/thu hồi quyền (grant/revoke permissions) ở mức chi tiết, có thể gán quyền cho IAM users, roles, groups, và cả Active Directory users thông qua federation; quyền được chỉ định trên các đối tượng catalog (như table, column) thay vì trên bucket và object.</p>","explain":"<p>- Dùng Amazon Data Firehose để hợp nhất dữ liệu từ nhiều account vào một account: thiết lập Data Firehose ở từng account để di chuyển dữ liệu về một nơi là tốn kém và không thực tế; cách tiếp cận tốt hơn là thiết lập cross-account sharing, vốn miễn phí với AWS Lake Formation.</p><p>- Tạo một AWS Lambda function chạy theo lịch bằng Amazon EventBridge để chuyển dữ liệu từ nhiều account sang các S3 bucket của account trung tâm: có thể thực hiện bằng AWS SDK, nhưng việc triển khai sẽ khó khăn và khó quản lý; đề bài yêu cầu rõ ràng là giải pháp phải giảm thiểu overhead quản lý.</p><p>- Dùng AWS Control Tower để quản lý tập trung các S3 bucket của từng account: dịch vụ AWS Control Tower chủ yếu dùng để quản lý và giám sát (govern) nhiều AWS account, không chỉ riêng các S3 bucket; dùng AWS Lake Formation là lựa chọn phù hợp hơn.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/blogs/big-data/building-securing-and-managing-data-lakes-with-aws-lake-formation/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/blogs/big-data/building-securing-and-managing-data-lakes-with-aws-lake-formation/</a></li><li><a href=\"https://docs.aws.amazon.com/lake-formation/latest/dg/how-it-works.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/lake-formation/latest/dg/how-it-works.html</a></li></ul>"},{"id":63,"topic":"Design Resilient Architectures – dạng bài kết hợp giữa chọn công cụ migration phù hợp (homogeneous vs heterogeneous migr...","supplement":false,"stem":"A Forex trading platform, which frequently processes and stores global financial data every minute, is hosted in an on-premises data center and uses an Oracle database. Due to a recent cooling problem in its data center, the company urgently needs to migrate its infrastructure to AWS to improve the performance of its applications. As the Solutions Architect, the responsibility is to ensure that the database is properly migrated and remains available in case of database server failure in the future, following AWS Prescriptive Guidance for database migration and high availability.<br><br>Which combination of actions would meet the requirement? (Select TWO.)","options":[{"html":"Migrate the Oracle database to a non-cluster Amazon Aurora with a single instance.","correct":false},{"html":"Launch an Oracle database instance in Amazon RDS with Recovery Manager (RMAN) enabled.","correct":false},{"html":"Create an Oracle database in Amazon RDS with Multi-AZ deployments.","correct":true},{"html":"Migrate the Oracle database to AWS using the AWS Database Migration Service","correct":true},{"html":"Convert the database schema using the AWS Schema Conversion Tool.","correct":false}],"multi":2,"analysis":"<p>Đây là dạng bài kết hợp giữa chọn công cụ migration phù hợp (homogeneous vs heterogeneous migration) và chọn kiến trúc high-availability (Multi-AZ) khi di chuyển một database quan hệ (Oracle) từ on-premises lên AWS.</p>","answer":"<p>Amazon RDS Multi-AZ deployment cung cấp khả năng tăng cường availability và durability cho DB Instance, rất phù hợp cho các workload database production. Khi tạo một Multi-AZ DB Instance, Amazon RDS tự động tạo một primary DB Instance và đồng bộ (synchronously) replicate dữ liệu sang một standby instance ở một Availability Zone (AZ) khác; mỗi AZ chạy trên hạ tầng vật lý độc lập và được thiết kế có độ tin cậy cao. Khi xảy ra sự cố hạ tầng, Amazon RDS tự động thực hiện failover sang standby (hoặc sang read replica trong trường hợp Amazon Aurora), giúp tiếp tục hoạt động database ngay sau khi failover hoàn tất; vì endpoint của DB Instance không đổi sau khi failover, ứng dụng có thể tiếp tục hoạt động mà không cần can thiệp quản trị thủ công. Trong tình huống này, cấu hình RDS tốt nhất là dùng Oracle database trên RDS với Multi-AZ deployment để đảm bảo high availability ngay cả khi primary database instance gặp sự cố; đồng thời dùng AWS Database Migration Service (AWS DMS) để di chuyển database on-premises lên AWS với downtime tối thiểu và không mất dữ liệu — AWS DMS hỗ trợ hơn 20 engine, bao gồm Oracle sang Aurora MySQL, MySQL sang RDS for MySQL, SQL Server sang Aurora PostgreSQL, MongoDB sang DocumentDB, Oracle sang Redshift và S3.</p>","explain":"<p>- Khởi chạy một Oracle database instance trong Amazon RDS với Recovery Manager (RMAN) được bật: Oracle RMAN không được hỗ trợ trên RDS.</p><p>- Chuyển đổi schema database bằng AWS Schema Conversion Tool: AWS Schema Conversion Tool thường dùng cho các cuộc migration dị chủng (heterogeneous migration), tức là chuyển từ loại database này sang loại khác (ví dụ Oracle sang PostgreSQL); trong tình huống này, việc di chuyển là đồng chủng (homogeneous), tức Oracle sang Oracle, nên không cần chuyển đổi schema vì vẫn ở cùng loại database.</p><p>- Di chuyển Oracle database sang một Amazon Aurora non-cluster với một instance đơn: dù Aurora single-instance có thể là giải pháp khả thi cho các ứng dụng không quan trọng hoặc môi trường như dev/test, nó thường không phù hợp cho các ứng dụng đòi hỏi high availability.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/rds/details/multi-az/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/rds/details/multi-az/</a></li><li><a href=\"https://aws.amazon.com/dms/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/dms/</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html</a></li></ul>"},{"id":64,"topic":"Design Secure Architectures – dạng bài chọn giải pháp chống SQL injection cho Application Load Balancer, đồng thời ph...","supplement":false,"stem":"A company uses an Application Load Balancer (ALB) for its public-facing multi-tier web applications. The security team has recently reported that there has been a surge of SQL injection attacks lately, which causes critical data discrepancy issues. The same issue is also encountered by its other web applications in other AWS accounts that are behind an ALB. An immediate solution is required to prevent the remote injection of unauthorized SQL queries and protect their applications hosted across multiple accounts.<br><br>As a Solutions Architect, what solution would you recommend?","options":[{"html":"Use AWS WAF and set up a managed rule to block request patterns associated with the exploitation of SQL databases, like SQL injection attacks. Associate it with the Application Load Balancer. Integrate AWS WAF with AWS Firewall Manager to reuse the rules across all the AWS accounts.","correct":true},{"html":"Use Amazon GuardDuty and set up a managed rule to block request patterns associated with the exploitation of SQL databases, like SQL injection attacks. Associate it with the Application Load Balancer and utilize the AWS Security Hub service to reuse the managed rules across all the AWS accounts","correct":false},{"html":"Use AWS Network Firewall to filter web vulnerabilities and brute force attacks using stateful rule groups across all Application Load Balancers on all AWS accounts. Refactor the web application to be less susceptible to SQL injection attacks based on the security assessment.","correct":false},{"html":"Use Amazon Macie to scan for vulnerabilities and unintended network exposure. Refactor the web application to be less susceptible to SQL injection attacks based on the security assessment. Utilize the AWS Audit Manager to reuse the security assessment across all AWS accounts.","correct":false}],"multi":1,"analysis":"<p>Đây là dạng bài chọn giải pháp chống SQL injection cho Application Load Balancer, đồng thời phải có khả năng tái sử dụng (reuse) rule bảo mật trên nhiều AWS account — một dạng câu hỏi kết hợp giữa AWS WAF và quản trị bảo mật đa account.</p>","answer":"<p>AWS WAF là một web application firewall cho phép giám sát các yêu cầu HTTP(S) được chuyển đến Amazon CloudFront distribution, Amazon API Gateway REST API, Application Load Balancer, hoặc AWS AppSync GraphQL API. AWS WAF dùng Web ACL (web access control list) để bảo vệ một tập hợp tài nguyên AWS, bên trong Web ACL là các Rules (định nghĩa tiêu chí kiểm tra request và hành động xử lý khi khớp tiêu chí) và Rule groups (rule có thể tái sử dụng — gồm AWS Managed Rules, rule từ AWS Marketplace, hoặc rule tự định nghĩa). Trong đó, AWSManagedRulesSQLiRuleSet là rule group chứa các rule để chặn các mẫu request liên quan đến khai thác SQL database như tấn công SQL injection, giúp ngăn chặn việc chèn (inject) các truy vấn trái phép từ xa. AWS WAF dễ triển khai và bảo vệ ứng dụng chạy trên CloudFront, Application Load Balancer, API Gateway hay AppSync mà không cần triển khai thêm phần mềm, cấu hình DNS, chứng chỉ SSL/TLS, hay thiết lập reverse proxy. Khi tích hợp với AWS Firewall Manager, ta có thể định nghĩa và quản lý rule tập trung, rồi tái sử dụng các rule đó trên tất cả các ứng dụng web cần bảo vệ ở nhiều AWS account.</p>","explain":"<p>- Dùng Amazon GuardDuty thiết lập managed rule chặn các mẫu khai thác SQL, gắn với Application Load Balancer và dùng AWS Security Hub để tái sử dụng rule trên các account: Amazon GuardDuty chỉ là dịch vụ phát hiện mối đe dọa (threat detection), không thể tích hợp trực tiếp với Application Load Balancer.</p><p>- Dùng AWS Network Firewall để lọc các lỗ hổng web và tấn công brute force bằng stateful rule group trên tất cả ALB ở mọi account, kết hợp refactor ứng dụng web dựa trên đánh giá bảo mật: AWS Network Firewall là dịch vụ managed chủ yếu dùng để triển khai các bảo vệ mạng thiết yếu cho toàn bộ Amazon VPC, không phải dành riêng cho Application Load Balancer; mặc định Network Firewall chỉ hoạt động trong phạm vi một account và cần tích hợp với AWS Firewall Manager để chia sẻ dễ dàng sang các account khác; ngoài ra việc refactor ứng dụng web sẽ tốn rất nhiều thời gian.</p><p>- Dùng Amazon Macie để quét lỗ hổng và phơi nhiễm mạng ngoài ý muốn, refactor ứng dụng web dựa trên đánh giá bảo mật, và dùng AWS Audit Manager để tái sử dụng đánh giá bảo mật trên các account: Amazon Macie chỉ là dịch vụ bảo mật và quyền riêng tư dữ liệu dùng machine learning và pattern matching để phát hiện và bảo vệ dữ liệu nhạy cảm, không liên quan đến SQL injection; việc refactor ứng dụng cũng tốn nhiều thời gian; việc dùng AWS Audit Manager cũng không liên quan, vì dịch vụ này chỉ giúp liên tục audit việc sử dụng AWS để đơn giản hóa quản lý rủi ro và tuân thủ quy định.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/how-aws-waf-works.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/waf/latest/developerguide/how-aws-waf-works.html</a></li><li><a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/fms-chapter.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/waf/latest/developerguide/fms-chapter.html</a></li><li><a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/aws-managed-rule-groups-use-case.html#aws-managed-rule-groups-use-case-sql-db\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/waf/latest/developerguide/aws-managed-rule-groups-use-case.html#aws-managed-rule-groups-use-case-sql-db</a></li></ul>"},{"id":65,"topic":"Design Cost-Optimized Architectures – dạng bài kết hợp 3 yêu cầu lưu trữ khác nhau trong cùng một kiến trúc: persistent block...","supplement":false,"stem":"An organization requires a persistent block storage volume to support its mission-critical workloads. The backup data will be stored in an object storage service and, after 30 days, transitioned to an archival storage service for long-term retention. The team has already configured an Amazon EBS snapshot retention rule for point-in-time recovery.<br><br>What should be done to meet the above requirement?","options":[{"html":"Attach an EBS volume to your Amazon EC2 instance. Use Amazon S3 to store your backup data and configure a lifecycle policy to transition your objects to S3 One Zone-IA.","correct":false},{"html":"Attach an EBS volume to your Amazon EC2 instance. Use Amazon S3 to store your backup data and configure a lifecycle policy to transition your objects to S3 Glacier Flexible Retrieval.","correct":true},{"html":"Attach an instance store volume in your Amazon EC2 instance. Use Amazon S3 to store your backup data and configure a lifecycle policy to transition your objects to S3 One Zone-IA.","correct":false},{"html":"Attach an instance store volume in your existing Amazon EC2 instance. Use Amazon S3 to store your backup data and configure a lifecycle policy to transition your objects to S3 Glacier Flexible Retrieval.","correct":false}],"multi":1,"analysis":"<p>Đây là dạng bài kết hợp 3 yêu cầu lưu trữ khác nhau trong cùng một kiến trúc: persistent block storage cho mission-critical workload, object storage cho backup data, và archival storage cho lưu trữ dài hạn — cần chọn đúng dịch vụ và đúng storage class cho từng tầng.</p>","answer":"<p>Amazon Elastic Block Store (EBS) là dịch vụ block storage hiệu năng cao, dễ sử dụng, thiết kế để dùng cùng Amazon EC2 cho cả workload nặng về throughput lẫn giao dịch (transaction-intensive); nhiều loại workload như database quan hệ và phi quan hệ, ứng dụng doanh nghiệp, ứng dụng container, big data analytics, hệ thống file và media workflow đều được triển khai rộng rãi trên Amazon EBS. Amazon Simple Storage Service (Amazon S3) là dịch vụ object storage có khả năng mở rộng, tính sẵn sàng dữ liệu, bảo mật và hiệu năng hàng đầu ngành, phù hợp để lưu trữ và bảo vệ mọi loại dữ liệu cho nhiều trường hợp sử dụng như backup và restore, archive. Trong S3 Lifecycle configuration, ta có thể định nghĩa rule để chuyển object từ storage class này sang storage class khác nhằm tiết kiệm chi phí lưu trữ, theo mô hình waterfall giữa các storage class. Trong tình huống này, cần ba thành phần: vì là mission-critical workload nên cần persistent block storage volume, dịch vụ phù hợp chính là Amazon EBS volume; workload thứ hai cần một dịch vụ object storage như Amazon S3 để lưu backup data, và S3 cho phép cấu hình lifecycle policy để chuyển từ S3 Standard sang các storage class khác; cuối cùng cần một dịch vụ lưu trữ archival như S3 Glacier Flexible Retrieval cho mục đích lưu trữ lâu dài. Việc đề cập đến EBS snapshot retention rule trong đề bài chỉ là một yếu tố gây nhiễu (distractor): dù EBS snapshot thực chất được lưu trong S3 ở bên trong, chúng được quản lý riêng biệt và không thể dùng S3 lifecycle policy để chuyển sang các storage class lưu trữ archival như S3 Glacier Flexible Retrieval.</p>","explain":"<p>- Gắn EBS volume vào EC2 instance, dùng S3 lưu backup data và cấu hình lifecycle policy chuyển object sang S3 One Zone-IA: lifecycle policy này chỉ chuyển object sang một storage class infrequently accessed (truy cập không thường xuyên), chứ không phải một storage class dành cho lưu trữ archival như yêu cầu.</p><p>- Gắn instance store volume vào EC2 instance hiện có, dùng S3 lưu backup data và cấu hình lifecycle policy chuyển object sang S3 Glacier Flexible Retrieval: instance store volume chỉ là block-level storage tạm thời cho EC2 instance; ngoài ra, không thể gắn thêm instance store volume vào một instance sau khi đã khởi chạy — instance store volume chỉ có thể được chỉ định khi launch instance.</p><p>- Gắn instance store volume vào EC2 instance, dùng S3 lưu backup data và cấu hình lifecycle policy chuyển object sang S3 One Zone-IA: tương tự phương án trên, instance store volume không phù hợp cho mission-critical workload vì dữ liệu có thể mất nếu ổ đĩa vật lý bên dưới gặp lỗi, instance dừng (stop), hoặc instance bị terminate; ngoài ra, S3 Glacier Flexible Retrieval là lựa chọn phù hợp hơn cho việc lưu trữ archival so với S3 One Zone-IA.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AmazonEBS.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AmazonEBS.html</a></li><li><a href=\"https://aws.amazon.com/s3/storage-classes/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/s3/storage-classes/</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html</a></li></ul>"}];
const LETTERS = "ABCDEFGH";
const state = {
  order: Q.map((_, i) => i),
  pos: 0,
  sel: {},        // qid -> Set of original option idx
  done: {},       // qid -> true/false (correct?)
  flags: new Set(),
  perm: {},       // qid -> displayed order of original option indices
  hint: {},
  view: "quiz"
};
const $ = s => document.querySelector(s);

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function perm(q){
  if(!state.perm[q.id]) state.perm[q.id] = $("#optShuffleA").checked ? shuffle(q.options.map((_,i)=>i)) : q.options.map((_,i)=>i);
  return state.perm[q.id];
}
function visible(){
  const f = $("#fFilter").value, t = $("#fTopic").value;
  return state.order.filter(i => {
    const q = Q[i];
    if(t && topicGroup(q.topic) !== t) return false;
    if(f === "todo") return !(q.id in state.done);
    if(f === "bad") return state.done[q.id] === false;
    if(f === "flag") return state.flags.has(q.id);
    if(f === "sup") return q.supplement;
    return true;
  });
}
function topicGroup(t){ return t.split("–")[0].trim(); }

function renderStats(){
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length, bad = vals.length - ok;
  $("#sDone").textContent = `${vals.length}/${Q.length}`;
  $("#sOk").textContent = ok; $("#sBad").textContent = bad;
  $("#sPct").textContent = vals.length ? Math.round(ok*100/vals.length) + "%" : "–";
  $("#prog").style.width = (vals.length*100/Q.length) + "%";
}
function renderGrid(){
  const vis = new Set(visible());
  const cur = state.order[state.pos];
  const g = $("#grid"); g.innerHTML = "";
  Q.forEach((q, i) => {
    const b = document.createElement("button");
    b.className = "cell";
    if(q.id in state.done) b.classList.add(state.done[q.id] ? "ok" : "bad");
    if(state.flags.has(q.id)) b.classList.add("flag");
    if(q.supplement) b.classList.add("sup");
    if(i === cur && state.view === "quiz") b.classList.add("cur");
    if(!vis.has(i)) b.classList.add("dim");
    b.textContent = q.id;
    b.title = q.topic + (q.supplement ? " (câu bổ sung)" : "");
    b.onclick = () => { state.view = "quiz"; state.pos = state.order.indexOf(i); render(); window.scrollTo({top:0,behavior:"smooth"}); };
    g.appendChild(b);
  });
}

function section(cls, title, html, open){
  return `<details class="sec ${cls}" ${open?"open":""}><summary>${title}</summary><div class="body">${html}</div></details>`;
}

function renderQuiz(){
  const main = $("#main");
  const vis = visible();
  if(!vis.length){ main.innerHTML = `<div class="card empty">Không có câu nào khớp bộ lọc hiện tại.</div>`; return; }
  let idx = state.order[state.pos];
  if(!vis.includes(idx)){ idx = vis[0]; state.pos = state.order.indexOf(idx); }
  const q = Q[idx];
  const answered = q.id in state.done;
  const sel = state.sel[q.id] || new Set();
  const p = perm(q);
  const vpos = vis.indexOf(idx);

  let opts = p.map((oi, k) => {
    const o = q.options[oi];
    let cls = "opt" + (q.multi > 1 ? " multi" : "");
    let tag = "";
    if(answered){
      if(o.correct && sel.has(oi)){ cls += " right"; tag = "✓ Đúng"; }
      else if(!o.correct && sel.has(oi)){ cls += " wrong"; tag = "✗ Bạn chọn"; }
      else if(o.correct){ cls += " right missed"; tag = "✓ Đáp án đúng"; }
    } else if(sel.has(oi)) cls += " sel";
    return `<div class="${cls}" data-oi="${oi}" role="${q.multi>1?"checkbox":"radio"}" aria-checked="${sel.has(oi)}" tabindex="0">
      <span class="key">${LETTERS[k]}</span><span class="txt">${o.html}${tag?`<span class="tag">${tag}</span>`:""}</span></div>`;
  }).join("");

  const showExplain = answered && $("#optAuto").checked;
  let after = "";
  if(answered){
    const ok = state.done[q.id];
    after += `<div class="verdict ${ok?"ok":"bad"}">${ok ? "Chính xác!" :"Chưa đúng. Xem đáp án được đánh dấu xanh và phần giải thích bên dưới."}</div>`;
    after += section("s-analysis", "Phân tích đề", q.analysis, showExplain);
    after += section("s-answer", "Đáp án đúng", q.answer, showExplain);
    after += section("s-explain", "Giải thích", q.explain, showExplain);
    after += section("s-wrong", "Vì sao các đáp án khác sai", q.wrong, showExplain);
    after += section("s-tip", "Mẹo thi", q.tip, showExplain);
  } else if(state.hint[q.id]){
    after += `<div class="hint"><h3>Gợi ý · Phân tích đề</h3><div class="body">${q.analysis}</div></div>`;
  }

  const need = q.multi > 1 ? `Chọn ${q.multi} đáp án` : "Chọn 1 đáp án";
  main.innerHTML = `<div class="card ${answered?"locked":""}">
    <div class="qhead">
      <span class="qnum">Câu ${q.id}</span>
      <span class="chip">${q.topic}</span>
      ${q.supplement ? `<span class="chip sup">Câu bổ sung</span>` : ""}
      <span class="chip multi">${need}</span>
      <button class="flagbtn ${state.flags.has(q.id)?"on":""}" id="btnFlag">${state.flags.has(q.id)?"★ Đã đánh dấu":"☆ Đánh dấu"}</button>
    </div>
    <div class="stem">${q.stem}</div>
    <div class="opts">${opts}</div>
    <div class="actions">
      <button class="btn" id="btnPrev" ${vpos<=0?"disabled":""}>← Câu trước</button>
      ${!answered ? `<button class="btn ghost" id="btnHint">${state.hint[q.id]?"Ẩn gợi ý":"Gợi ý: phân tích đề"}</button>` : `<button class="btn ghost" id="btnRetry">Làm lại câu này</button>`}
      <span class="spacer"></span>
      ${!answered ? `<button class="btn primary" id="btnCheck" ${sel.size!==q.multi?"disabled":""}>Kiểm tra</button>` : ""}
      <button class="btn ${answered?"primary":""}" id="btnNext" ${vpos>=vis.length-1?"disabled":""}>Câu sau →</button>
    </div>
    ${after}
    <div class="kbd"><kbd>A</kbd>–<kbd>E</kbd> hoặc <kbd>1</kbd>–<kbd>5</kbd> chọn đáp án · <kbd>Enter</kbd> kiểm tra / sang câu sau · <kbd>←</kbd> <kbd>→</kbd> chuyển câu · <kbd>H</kbd> gợi ý</div>
  </div>`;

  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => toggle(q, +el.dataset.oi);
    el.onkeydown = e => { if(e.key===" "){ e.preventDefault(); toggle(q, +el.dataset.oi); } };
  });
  $("#btnFlag").onclick = () => { state.flags.has(q.id) ? state.flags.delete(q.id) : state.flags.add(q.id); render(); };
  $("#btnPrev").onclick = () => go(-1);
  $("#btnNext").onclick = () => go(1);
  if($("#btnCheck")) $("#btnCheck").onclick = () => check(q);
  if($("#btnHint")) $("#btnHint").onclick = () => { state.hint[q.id] = !state.hint[q.id]; render(); };
  if($("#btnRetry")) $("#btnRetry").onclick = () => { delete state.done[q.id]; state.sel[q.id] = new Set(); delete state.perm[q.id]; render(); };
}

function toggle(q, oi){
  if(q.id in state.done) return;
  const s = state.sel[q.id] || (state.sel[q.id] = new Set());
  if(q.multi === 1){ s.clear(); s.add(oi); }
  else if(s.has(oi)) s.delete(oi);
  else { if(s.size >= q.multi) return; s.add(oi); }
  render();
}
function check(q){
  const s = state.sel[q.id] || new Set();
  if(s.size !== q.multi) return;
  const correct = q.options.every((o, i) => o.correct === s.has(i));
  state.done[q.id] = correct;
  render();
}
function go(d){
  const vis = visible();
  const cur = state.order[state.pos];
  let vp = vis.indexOf(cur);
  vp = Math.max(0, Math.min(vis.length-1, vp + d));
  state.pos = state.order.indexOf(vis[vp]);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderSummary(){
  const groups = {};
  Q.forEach(q => {
    const g = topicGroup(q.topic);
    groups[g] = groups[g] || {n:0, done:0, ok:0, bad:[]};
    groups[g].n++;
    if(q.id in state.done){ groups[g].done++; if(state.done[q.id]) groups[g].ok++; else groups[g].bad.push(q.id); }
  });
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length;
  const wrongIds = Q.filter(q => state.done[q.id] === false).map(q => q.id);
  const rows = Object.entries(groups).sort((a,b)=>b[1].n-a[1].n).map(([g, v]) => {
    const pct = v.done ? Math.round(v.ok*100/v.done) : null;
    return `<tr><td>${g}</td><td class="n">${v.done}/${v.n}</td><td class="n">${pct===null?"–":pct+"%"}</td>
      <td><div class="bar"><i style="width:${pct||0}%"></i></div></td><td>${v.bad.map(id=>`<a href="#" data-q="${id}">${id}</a>`).join(", ")}</td></tr>`;
  }).join("");
  $("#main").innerHTML = `<div class="card summary">
    <h2>Kết quả</h2>
    <p>Đã làm <b>${vals.length}/${Q.length}</b> câu · Đúng <b>${ok}</b> · Sai <b>${vals.length-ok}</b>${vals.length?` · Tỷ lệ đúng <b>${Math.round(ok*100/vals.length)}%</b>`:""}.
    ${vals.length===Q.length ? (ok/Q.length>=0.72 ? " Mức này tương đương ngưỡng đậu (~720/1000)." : " Chưa đạt ngưỡng ~72%, nên ôn lại các câu sai.") : ""}</p>
    ${wrongIds.length ? `<p><button class="btn primary" id="btnReviewBad">Ôn lại ${wrongIds.length} câu sai</button></p>` : ""}
    <table><thead><tr><th>Chủ đề</th><th class="n">Đã làm</th><th class="n">Đúng</th><th></th><th>Câu sai</th></tr></thead><tbody>${rows}</tbody></table>
    <p style="margin-top:14px"><button class="btn" id="btnBack">← Quay lại làm bài</button></p>
  </div>`;
  $("#btnBack").onclick = () => { state.view = "quiz"; render(); };
  if($("#btnReviewBad")) $("#btnReviewBad").onclick = () => {
    $("#fFilter").value = "bad"; $("#fTopic").value = "";
    wrongIds.forEach(id => { delete state.done[id]; state.sel[id] = new Set(); delete state.perm[id]; });
    // keep them findable after reset: mark as flagged review set
    wrongIds.forEach(id => state.flags.add(id));
    $("#fFilter").value = "flag";
    state.view = "quiz"; state.pos = state.order.indexOf(Q.findIndex(q => q.id === wrongIds[0])); render();
  };
  $("#main").querySelectorAll("a[data-q]").forEach(a => a.onclick = e => {
    e.preventDefault(); state.view = "quiz"; $("#fFilter").value = "all"; $("#fTopic").value = "";
    state.pos = state.order.indexOf(Q.findIndex(q => q.id === +a.dataset.q)); render();
  });
}

function render(){
  renderStats(); renderGrid();
  state.view === "summary" ? renderSummary() : renderQuiz();
}

// init
(function(){
  const groups = [...new Set(Q.map(q => topicGroup(q.topic)))].sort();
  groups.forEach(g => { const o = document.createElement("option"); o.value = g; o.textContent = g; $("#fTopic").appendChild(o); });
  $("#fFilter").onchange = $("#fTopic").onchange = () => { state.view = "quiz"; render(); };
  $("#optShuffleQ").onchange = e => {
    const cur = state.order[state.pos];
    state.order = e.target.checked ? shuffle(Q.map((_, i) => i)) : Q.map((_, i) => i);
    state.pos = e.target.checked ? 0 : state.order.indexOf(cur);
    render();
  };
  $("#optShuffleA").onchange = () => { Q.forEach(q => { if(!(q.id in state.done)) delete state.perm[q.id]; }); render(); };
  $("#optAuto").onchange = render;
  $("#btnSummary").onclick = () => { state.view = "summary"; render(); };
  $("#btnReset").onclick = () => {
    if(!Object.keys(state.done).length) return;
    state.sel = {}; state.done = {}; state.hint = {}; state.perm = {}; state.pos = 0; state.view = "quiz";
    $("#fFilter").value = "all"; render();
  };
  $("#btnTheme").onclick = () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  };
  document.addEventListener("keydown", e => {
    if(state.view !== "quiz" || e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    const q = Q[state.order[state.pos]]; if(!q) return;
    const k = e.key.toUpperCase();
    let n = "12345678".indexOf(k); if(n < 0) n = LETTERS.indexOf(k);
    if(k.length === 1 && n >= 0 && n < q.options.length && k !== "H"){ toggle(q, perm(q)[n]); return; }
    if(e.key === "Enter"){ e.preventDefault(); (q.id in state.done) ? go(1) : check(q); }
    else if(e.key === "ArrowRight") go(1);
    else if(e.key === "ArrowLeft") go(-1);
    else if(k === "H" && !(q.id in state.done)){ state.hint[q.id] = !state.hint[q.id]; render(); }
  });
  render();
})();
</script>
</body>
