B là database NoSQL hoàn toàn serverless, đạt độ trễ mili-giây đơn vị và scale ngang tự động — đúng mọi tiêu chí đề bài.</p>","explain":"<ul><li><b>A. ✗</b> RDS là relational database, không phải NoSQL, và không đạt độ trễ mili-giây đơn vị như yêu cầu.</li><li><b>B. ✗</b> ElastiCache là cache, không nên dùng làm database chính lưu trữ dữ liệu lâu dài.</li><li><b>C. ✓</b> Đúng: DynamoDB là NoSQL serverless, scale ngang, độ trễ mili-giây đơn vị — khớp hoàn toàn yêu cầu.</li><li><b>D. ✗</b> Neptune là graph database, chuyên cho dữ liệu có quan hệ phức tạp, không phải cho lookup đơn giản theo khoá.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> ElastiCache nghe 'nhanh nhất' về độ trễ nhưng về bản chất là cache tạm thời, không phải nơi lưu trữ chính (primary database) đáng tin cậy.</p>","tip":"<p>NoSQL + serverless + millisecond latency + scale ngang → DynamoDB là đáp án mặc định; ElastiCache chỉ là tầng cache, không thay thế database chính.</p>"},{"id":31,"topic":"Design Resilient Architectures – ASG default termination policy","supplement":false,"stem":"As a solutions architect, you have created a solution that utilizes an Application Load Balancer with stickiness and an Auto Scaling Group (ASG). The Auto Scaling Group spans across 2 Availability Zones (AZs). AZ-A has 3 Amazon EC2 instances and AZ-B has 4 Amazon EC2 instances. The Auto Scaling Group is about to go into a scale-in event due to the triggering of a Amazon CloudWatch alarm.<br>What will happen under the default Auto Scaling Group configuration?","options":[{"html":"A random instance will be terminated in AZ-B","correct":false},{"html":"A random instance in the AZ-A will be terminated","correct":false},{"html":"The instance with the oldest launch template or launch configuration will be terminated in AZ-B","correct":true},{"html":"An instance in the AZ-A will be created","correct":false}],"multi":1,"analysis":"<p>Hiểu đúng thứ tự ưu tiên của default termination policy khi scale-in</p>","answer":"<p>Default policy ưu tiên cân bằng AZ trước (chọn AZ có nhiều instance hơn), sau đó mới xét tới instance dùng launch template/config cũ nhất trong AZ đó.</p>","explain":"<ul><li><b>A. ✗</b> Default policy không chọn ngẫu nhiên — có quy tắc rõ ràng ưu tiên cân bằng AZ trước.</li><li><b>B. ✗</b> AZ-A đang có ÍT instance hơn (3&lt;4) nên không phải AZ bị chọn để terminate.</li><li><b>C. ✓</b> Đúng: AZ-B nhiều instance hơn nên được cân bằng trước; trong AZ-B, instance có launch template/config CŨ NHẤT bị chọn terminate.</li><li><b>D. ✗</b> Scale-in nghĩa là GIẢM instance, không phải tạo thêm — phương án này ngược hướng hoàn toàn với scale-in.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các phương án 'ngẫu nhiên' nghe như cách AWS vận hành đơn giản, nhưng default termination policy thực chất có thứ tự ưu tiên rõ ràng, không hề random.</p>","tip":"<p>Default termination policy: (1) cân bằng AZ trước, (2) trong AZ đó chọn instance dùng launch template/config CŨ NHẤT, (3) cuối cùng mới xét tới instance gần billing hour nhất.</p>"},{"id":32,"topic":"Design Resilient Architectures – S3 cross-Region one-time copy (sync + batch replication)","supplement":false,"stem":"An e-commerce company has copied 1 petabyte of data from its on-premises data center to an Amazon S3 bucket in the us-west-1 Region using an AWS Direct Connect link. The company now wants to set up a one-time copy of the data to another Amazon S3 bucket in the us-east-1 Region. The on-premises data center does not allow the use of AWS Snowball.<br>As a Solutions Architect, which of the following options can be used to accomplish this goal? (Select two)","options":[{"html":"Use AWS Snowball Edge device to copy the data from one Region to another Region","correct":false},{"html":"Set up Amazon S3 batch replication to copy objects across Amazon S3 buckets in another Region using S3 console and then delete the replication configuration","correct":true},{"html":"Copy data from the source bucket to the destination bucket using the aws S3 sync command","correct":true},{"html":"Set up Amazon S3 Transfer Acceleration (Amazon S3TA) to copy objects across Amazon S3 buckets in different Regions using S3 console","correct":false},{"html":"Copy data from the source Amazon S3 bucket to a target Amazon S3 bucket using the S3 console","correct":false}],"multi":2,"analysis":"<p>Copy dữ liệu khổng lồ (PB) một lần giữa 2 Region mà không dùng thiết bị vật lý</p>","answer":"<p>S3 Batch Replication (cho object cũ đã tồn tại) và aws s3 sync (copy một lần qua API) đều giải quyết đúng use-case 'copy một lần' quy mô lớn mà không cần Snowball.</p>","explain":"<ul><li><b>A. ✗</b> Snowball Edge dùng để chuyển dữ liệu on-prem↔AWS, không dùng để copy giữa 2 Region (và đề cũng cấm dùng Snowball).</li><li><b>B. ✓</b> Đúng: S3 Batch Replication xử lý được việc copy object ĐÃ TỒN TẠI từ trước sang Region khác, sau đó có thể xoá cấu hình vì chỉ cần 1 lần.</li><li><b>C. ✓</b> Đúng: lệnh aws s3 sync dùng CopyObject API để đồng bộ 1 lần giữa 2 bucket, phù hợp cho nhu cầu copy một lần.</li><li><b>D. ✗</b> S3 Transfer Acceleration không dùng để copy object GIỮA 2 bucket qua console — nó chỉ tăng tốc transfer từ client vào 1 bucket.</li><li><b>E. ✗</b> Copy/paste thủ công qua S3 console không khả thi với khối lượng 1 petabyte dữ liệu.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> S3 Transfer Acceleration hay bị nhầm là công cụ 'copy nhanh giữa 2 bucket' nhưng thực chất nó chỉ tăng tốc đường truyền từ client TỚI 1 bucket, không phải cơ chế bucket-to-bucket.</p>","tip":"<p>Copy object CŨ đã tồn tại sang bucket khác Region, một lần → S3 Batch Replication hoặc aws s3 sync; Transfer Acceleration chỉ tăng tốc upload từ client vào S3.</p>"},{"id":33,"topic":"Design Resilient Architectures – Amazon EventBridge for SaaS decoupling","supplement":false,"stem":"A CRM company has a software as a service (SaaS) application that feeds updates to other in-house and third-party applications. The SaaS application and the in-house applications are being migrated to use AWS services for this inter-application communication.<br>As a Solutions Architect, which of the following would you suggest to asynchronously decouple the architecture?","options":[{"html":"Use Amazon Simple Queue Service (Amazon SQS) to decouple the architecture","correct":false},{"html":"Use Amazon EventBridge to decouple the system architecture","correct":true},{"html":"Use Elastic Load Balancing (ELB) for effective decoupling of system architecture","correct":false},{"html":"Use Amazon Simple Notification Service (Amazon SNS) to communicate between systems and decouple the architecture","correct":false}],"multi":1,"analysis":"<p>Decouple hệ thống có liên quan tới SaaS bên thứ ba (không chỉ nội bộ AWS)</p>","answer":"<p>EventBridge là dịch vụ duy nhất có khả năng tích hợp sẵn (native) với các nhà cung cấp SaaS bên thứ ba, đúng yêu cầu đề bài.</p>","explain":"<ul><li><b>A. ✗</b> SQS là hàng đợi tốt để decouple nhưng không tích hợp trực tiếp với ứng dụng SaaS bên thứ ba.</li><li><b>B. ✓</b> Đúng: EventBridge là dịch vụ event-driven DUY NHẤT tích hợp sẵn trực tiếp với SaaS partner bên thứ ba.</li><li><b>C. ✗</b> ELB cân bằng tải đồng bộ (synchronous), hoàn toàn không phải cơ chế decouple bất đồng bộ.</li><li><b>D. ✗</b> SNS hỗ trợ pub/sub tốt nhưng KHÔNG hỗ trợ tích hợp trực tiếp với ứng dụng SaaS bên thứ ba như EventBridge.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> SNS rất dễ bị chọn nhầm vì cũng là dịch vụ pub/sub decouple, nhưng thiếu đúng 1 khả năng quan trọng: tích hợp trực tiếp với SaaS bên thứ ba.</p>","tip":"<p>Decouple với dịch vụ AWS/nội bộ thuần tuý → SNS/SQS. Decouple có liên quan SaaS bên thứ ba → luôn chọn Amazon EventBridge.</p>"},{"id":34,"topic":"Design Cost-Optimized Architectures – AWS Cost Optimization Hub + Compute Optimizer","supplement":false,"stem":"A startup's cloud infrastructure consists of a few Amazon EC2 instances, Amazon RDS instances and Amazon S3 storage. A year into their business operations, the startup is incurring costs that seem too high for their business requirements.<br>Which of the following options represents a valid cost-optimization solution?","options":[{"html":"Use AWS Compute Optimizer recommendations to help you choose the optimal Amazon EC2 purchasing options and help reserve your instance capacities at reduced costs","correct":false},{"html":"Use AWS Cost Optimization Hub to get a report of Amazon EC2 instances that are either idle or have low utilization and use AWS Compute Optimizer to look at instance type recommendations","correct":true},{"html":"Use AWS Trusted Advisor checks on Amazon EC2 Reserved Instances to automatically renew reserved instances (RI). AWS Trusted advisor also suggests Amazon RDS idle database instances","correct":false},{"html":"Use Amazon S3 Storage class analysis to get recommendations for transitions of objects to Amazon S3 Glacier storage classes to reduce storage costs. You can also automate moving these objects into lower-cost storage tier using Lifecycle Policies","correct":false}],"multi":1,"analysis":"<p>Dùng đúng công cụ phân tích/khuyến nghị chi phí AWS, tránh gán nhầm tính năng không có</p>","answer":"<p>Cost Optimization Hub tổng hợp resource nhàn rỗi trên nhiều account/Region, kết hợp Compute Optimizer cho khuyến nghị instance type — đúng và đủ phạm vi công cụ hỗ trợ.</p>","explain":"<ul><li><b>A. ✗</b> Compute Optimizer không đưa ra khuyến nghị về PURCHASING OPTIONS (RI/Savings Plans) — nó chỉ gợi ý instance TYPE phù hợp.</li><li><b>B. ✓</b> Đúng: Cost Optimization Hub tổng hợp resource nhàn rỗi/kém hiệu quả trên nhiều tài khoản, kết hợp Compute Optimizer để xem gợi ý loại instance.</li><li><b>C. ✗</b> Trusted Advisor KHÔNG tự động renew Reserved Instances — đây là tính năng không tồn tại; RI hết hạn vẫn chạy nhưng tính giá On-Demand.</li><li><b>D. ✗</b> S3 Storage Class Analysis chỉ khuyến nghị chuyển sang STANDARD_IA, KHÔNG đưa khuyến nghị cho Glacier/One Zone-IA.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Hai phương án sai đều GÁN THÊM khả năng không có thật cho dịch vụ quen thuộc (Compute Optimizer gợi ý purchasing option, Trusted Advisor tự renew RI, Storage Class Analysis gợi ý Glacier).</p>","tip":"<p>Compute Optimizer = gợi ý RIGHT-SIZE instance type (không phải purchasing option). Storage Class Analysis = chỉ gợi ý STANDARD_IA (không phải Glacier). Trusted Advisor không tự renew RI.</p>"},{"id":35,"topic":"Design Secure Architectures – Security Group reference ALB to EC2","supplement":false,"stem":"A developer in your company has set up a classic 2 tier architecture consisting of an Application Load Balancer and an Auto Scaling group (ASG) managing a fleet of Amazon EC2 instances. The Application Load Balancer is deployed in a subnet of size 10.0.1.0/24 and the Auto Scaling group is deployed in a subnet of size 10.0.4.0/22.<br>As a solutions architect, you would like to adhere to the security pillar of the well-architected framework. How do you configure the security group of the Amazon EC2 instances to only allow traffic coming from the Application Load Balancer?","options":[{"html":"Add a rule to authorize the security group of the Auto Scaling group","correct":false},{"html":"Add a rule to authorize the CIDR 10.0.4.0/22","correct":false},{"html":"Add a rule to authorize the CIDR 10.0.1.0/24","correct":false},{"html":"Add a rule to authorize the security group of the Application Load Balancer","correct":true}],"multi":1,"analysis":"<p>Dùng Security Group tham chiếu (SG-to-SG reference) thay vì CIDR cố định</p>","answer":"<p>Theo best-practice Well-Architected, nên cho phép traffic dựa trên SG của nguồn (ALB) thay vì CIDR tĩnh — tự động áp dụng cho mọi IP của ALB kể cả khi scale.</p>","explain":"<ul><li><b>A. ✗</b> Sai chiều tham chiếu: tự cho phép SG của chính ASG (nguồn traffic phải là ALB, không phải chính các EC2 trong ASG).</li><li><b>B. ✗</b> CIDR của chính subnet ASG không giới hạn được nguồn traffic chỉ từ ALB — EC2 nào trong subnet đó cũng được phép, kể cả không qua ALB.</li><li><b>C. ✗</b> CIDR của subnet ALB vẫn rộng hơn mức cần thiết — chỉ nên giới hạn bằng SG cụ thể, không phải cả dải subnet.</li><li><b>D. ✓</b> Đúng: dùng Security Group tham chiếu lẫn nhau (SG của ALB) làm nguồn cho phép trên SG của EC2 — chính xác và linh hoạt theo best-practice.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Chọn nhầm SG của chính Auto Scaling Group (đối tượng cần được bảo vệ) thay vì SG của ALB (nguồn traffic hợp lệ) — đảo ngược vai trò nguồn/đích.</p>","tip":"<p>Muốn EC2 chỉ nhận traffic từ ALB → luôn referense SG của ALB trong rule inbound của SG gắn với EC2, không dùng CIDR subnet (quá rộng, không linh hoạt khi scale).</p>"},{"id":36,"topic":"Design Cost-Optimized Architectures – S3 Lifecycle Policy with prefix","supplement":false,"stem":"You have an Amazon S3 bucket that contains files in two different folders - s3://my-bucket/images and s3://my-bucket/thumbnails. When an image is first uploaded and new, it is viewed several times. But after 45 days, analytics prove that image files are on average rarely requested, but the thumbnails still are. After 180 days, you would like to archive the image files and the thumbnails. Overall you would like the solution to remain highly available to prevent disasters happening against a whole Availability Zone (AZ).<br>How can you implement an efficient cost strategy for your Amazon S3 bucket? (Select two)","options":[{"html":"Create a Lifecycle Policy to transition objects to Amazon S3 Standard IA using a prefix after 45 days","correct":true},{"html":"Create a Lifecycle Policy to transition objects to Amazon S3 One Zone IA using a prefix after 45 days","correct":false},{"html":"Create a Lifecycle Policy to transition all objects to Amazon S3 Standard IA after 45 days","correct":false},{"html":"Create a Lifecycle Policy to transition objects to Amazon S3 Glacier using a prefix after 180 days","correct":false},{"html":"Create a Lifecycle Policy to transition all objects to Amazon S3 Glacier after 180 days","correct":true}],"multi":2,"analysis":"<p>Áp Lifecycle Policy có chọn lọc theo prefix khi 2 loại dữ liệu có hành vi truy cập khác nhau</p>","answer":"<p>Ảnh và thumbnail có tốc độ 'nguội' khác nhau ở mốc 45 ngày nên cần prefix để chỉ áp dụng cho ảnh; tới mốc 180 ngày cả 2 đều nguội như nhau nên không cần phân biệt prefix nữa.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: dùng prefix (s3://my-bucket/images) để CHỈ chuyển ảnh (không phải thumbnail vẫn còn được truy cập) sang Standard-IA sau 45 ngày.</li><li><b>B. ✗</b> One Zone-IA chỉ lưu ở 1 AZ — vi phạm yêu cầu 'highly available, chịu được mất cả 1 AZ'.</li><li><b>C. ✗</b> Chuyển TẤT CẢ object (gồm cả thumbnail vẫn đang được truy cập thường xuyên) sang IA là sai — vi phạm dữ liệu đề bài.</li><li><b>D. ✗</b> Glacier không cần prefix ở bước 180 ngày vì CẢ 2 loại file (ảnh và thumbnail) đều đã đến lúc archive như nhau.</li><li><b>E. ✓</b> Đúng: sau 180 ngày, mọi object (ảnh và thumbnail) đều cần archive, nên áp dụng cho TOÀN BỘ bucket không cần prefix.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> One Zone-IA là bẫy cổ điển: rẻ hơn Standard-IA nhưng chỉ lưu 1 AZ, vi phạm thẳng yêu cầu 'chịu được mất 1 AZ' mà đề đã nêu rõ.</p>","tip":"<p>Khi 2 nhóm dữ liệu trong cùng bucket có pattern truy cập khác nhau → dùng PREFIX trong Lifecycle Policy để áp rule riêng cho từng nhóm, không áp dụng chung cho cả bucket.</p>"},{"id":37,"topic":"Design High-Performing Architectures – Route 53 Geoproximity routing with bias","supplement":false,"stem":"A social media company wants the capability to dynamically alter the size of a geographic area from which traffic is routed to a specific server resource.<br>Which feature of Amazon Route 53 can help achieve this functionality?","options":[{"html":"Latency-based routing","correct":false},{"html":"Geoproximity routing","correct":true},{"html":"Weighted routing","correct":false},{"html":"Geolocation routing","correct":false}],"multi":1,"analysis":"<p>Phân biệt Geolocation (cố định theo vị trí) với Geoproximity (có bias điều chỉnh vùng)</p>","answer":"<p>Chỉ Geoproximity routing có tham số bias, cho phép mở rộng hoặc thu hẹp vùng địa lý route traffic tới một resource cụ thể.</p>","explain":"<ul><li><b>A. ✗</b> Latency-based routing chọn theo độ trễ thấp nhất, không có khái niệm điều chỉnh 'kích thước vùng'.</li><li><b>B. ✓</b> Đúng: Geoproximity routing có tham số bias cho phép mở rộng/thu hẹp vùng địa lý route tới 1 resource.</li><li><b>C. ✗</b> Weighted routing định tuyến theo tỉ lệ phần trăm cố định, không liên quan tới vùng địa lý.</li><li><b>D. ✗</b> Geolocation routing định tuyến theo vị trí CỐ ĐỊNH của user, không có cơ chế 'bias' để thay đổi kích thước vùng.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Geolocation routing rất dễ nhầm với Geoproximity vì tên gần giống nhau, nhưng Geolocation không có cơ chế 'thay đổi kích thước vùng' linh hoạt như Geoproximity.</p>","tip":"<p>Geolocation = định tuyến CỨNG theo quốc gia/vùng user. Geoproximity = định tuyến theo khoảng cách + có thể 'nắn' vùng bằng bias — từ khoá 'dynamically alter size of geographic area' luôn trỏ tới Geoproximity.</p>"},{"id":38,"topic":"Design High-Performing Architectures – DynamoDB DAX for hot partition","supplement":false,"stem":"A niche social media application allows users to connect with sports athletes. As a solutions architect, you've designed the architecture of the application to be fully serverless using Amazon API Gateway and AWS Lambda. The backend uses an Amazon DynamoDB table. Some of the star athletes using the application are highly popular, and therefore Amazon DynamoDB has increased the read capacity units (RCUs). Still, the application is experiencing a hot partition problem.<br>What can you do to improve the performance of Amazon DynamoDB and eliminate the hot partition problem without a lot of application refactoring?","options":[{"html":"Use Amazon DynamoDB Global Tables","correct":false},{"html":"Use Amazon DynamoDB Streams","correct":false},{"html":"Use Amazon DynamoDB DAX","correct":true},{"html":"Use Amazon ElastiCache","correct":false}],"multi":1,"analysis":"<p>Giải quyết hot partition/hot key mà không sửa logic ứng dụng</p>","answer":"<p>DAX hoạt động trong suốt với API tương thích DynamoDB, nên tự động cache các khoá truy cập nhiều (hot key) mà không cần đổi code gọi DynamoDB.</p>","explain":"<ul><li><b>A. ✗</b> Global Tables chỉ giải quyết replicate đa Region, không giải quyết hot partition (truy cập tập trung vào 1 khoá).</li><li><b>B. ✗</b> DynamoDB Streams chỉ ghi lại thay đổi dữ liệu, không liên quan tới việc giảm tải đọc trên 1 khoá nóng.</li><li><b>C. ✓</b> Đúng: DAX cache trong suốt (transparent) ngay trước DynamoDB, tự động cache các 'hot key' mà KHÔNG cần sửa code ứng dụng.</li><li><b>D. ✗</b> ElastiCache có thể giải quyết được nhưng đòi hỏi sửa logic ứng dụng để tự quản lý cache — vi phạm yêu cầu 'ít refactor nhất'.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> ElastiCache cũng 'giải quyết được' bài toán cache nhưng cần thêm logic tự quản lý cache ở tầng ứng dụng — không đáp ứng tiêu chí 'không refactor nhiều'.</p>","tip":"<p>Hot partition/hot key của DynamoDB, cần fix nhanh, không sửa code nhiều → DAX (trong suốt với API); cần cache tổng quát, chấp nhận sửa code → ElastiCache.</p>"},{"id":39,"topic":"Design High-Performing Architectures – Auto Scaling Group for dynamic content scaling","supplement":false,"stem":"The engineering team at a leading e-commerce company is anticipating a surge in the traffic because of a flash sale planned for the weekend. You have estimated the web traffic to be 10x. The content of your website is highly dynamic and changes very often.<br>As a Solutions Architect, which of the following options would you recommend to make sure your infrastructure scales for that day?","options":[{"html":"Deploy the website on Amazon S3","correct":false},{"html":"Use an Auto Scaling Group","correct":true},{"html":"Use an Amazon CloudFront distribution in front of your website","correct":false},{"html":"Use an Amazon Route 53 Multi Value record","correct":false}],"multi":1,"analysis":"<p>Scale hạ tầng cho traffic tăng đột biến khi nội dung là DYNAMIC (không thể cache)</p>","answer":"<p>ASG trực tiếp tăng/giảm số lượng instance phục vụ theo tải thực tế — đúng công cụ để xử lý traffic tăng 10x cho nội dung động.</p>","explain":"<ul><li><b>A. ✗</b> S3 chỉ host được nội dung TĨNH — đề nói rõ nội dung 'highly dynamic', không phù hợp.</li><li><b>B. ✓</b> Đúng: ASG tự scale số lượng EC2 instance theo traffic thực tế, đúng với nhu cầu tăng 10x lưu lượng.</li><li><b>C. ✗</b> CloudFront sẽ cache dữ liệu, không phù hợp khi nội dung thay đổi liên tục (highly dynamic).</li><li><b>D. ✗</b> Route 53 Multi Value chỉ trả về nhiều record khi query DNS, bản thân nó không giúp tăng năng lực xử lý/scale hạ tầng.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> CloudFront nghe như giải pháp 'tăng khả năng chịu tải' kinh điển, nhưng với nội dung THAY ĐỔI LIÊN TỤC, cache sẽ không hiệu quả hoặc phải invalidate liên tục.</p>","tip":"<p>Nội dung tĩnh, ít đổi → CloudFront/S3 giúp giảm tải hiệu quả. Nội dung động, đổi liên tục → phải scale CHÍNH compute layer bằng Auto Scaling Group.</p>"},{"id":40,"topic":"Design Secure Architectures – S3 bucket policy for cross-account access","supplement":false,"stem":"A company wants to grant access to an Amazon S3 bucket to users in its own AWS account as well as to users in another AWS account. Which of the following options can be used to meet this requirement?","options":[{"html":"Use a bucket policy to grant permission to users in its account as well as to users in another account","correct":true},{"html":"Use a user policy to grant permission to users in its account as well as to users in another account","correct":false},{"html":"Use permissions boundary to grant permission to users in its account as well as to users in another account","correct":false},{"html":"Use either a bucket policy or a user policy to grant permission to users in its account as well as to users in another account","correct":false}],"multi":1,"analysis":"<p>Chọn đúng loại policy cho truy cập CROSS-ACCOUNT vào tài nguyên</p>","answer":"<p>Chỉ bucket policy (resource-based) mới có thể chỉ định principal thuộc account khác; user policy (identity-based) chỉ áp dụng trong phạm vi account sở hữu nó.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: bucket policy là resource-based policy, có thể chỉ định principal ở BẤT KỲ account nào, kể cả account khác.</li><li><b>B. ✗</b> User policy chỉ gắn vào user trong CHÍNH account sở hữu nó — không cấp quyền được cho user ở account khác.</li><li><b>C. ✗</b> Permissions boundary chỉ giới hạn quyền tối đa, bản thân nó KHÔNG cấp quyền truy cập.</li><li><b>D. ✗</b> Sai vì user policy không đáp ứng được phần 'user ở account khác' — không thể dùng 'một trong hai' tuỳ ý như phát biểu này.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Phương án 'dùng bucket policy HOẶC user policy' nghe như một lựa chọn an toàn/linh hoạt nhưng sai vì user policy không thể cấp quyền cross-account.</p>","tip":"<p>Cấp quyền truy cập tài nguyên cho user ở TÀI KHOẢN KHÁC → luôn cần resource-based policy (bucket policy); user/identity-based policy chỉ có hiệu lực trong chính account của nó.</p>"},{"id":41,"topic":"Design High-Performing Architectures – Transit Gateway ECMP for VPN throughput","supplement":false,"stem":"A retail company is using AWS Site-to-Site VPN connections for secure connectivity to its AWS cloud resources from its on-premises data center. Due to a surge in traffic across the VPN connections to the AWS cloud, users are experiencing slower VPN connectivity.<br>Which of the following options will maximize the VPN throughput?","options":[{"html":"Create a virtual private gateway with equal cost multipath routing and multiple channels","correct":false},{"html":"Create an AWS Transit Gateway with equal cost multipath routing and add additional VPN tunnels","correct":true},{"html":"Use AWS Global Accelerator for the VPN connection to maximize the throughput","correct":false},{"html":"Use Transfer Acceleration for the VPN connection to maximize the throughput","correct":false}],"multi":1,"analysis":"<p>Vượt giới hạn throughput cố định của 1 VPN tunnel (1.25 Gbps)</p>","answer":"<p>Transit Gateway hỗ trợ ECMP, cho phép gộp nhiều VPN tunnel chạy song song để tổng throughput vượt mức giới hạn của một tunnel đơn lẻ.</p>","explain":"<ul><li><b>A. ✗</b> Virtual Private Gateway KHÔNG hỗ trợ ECMP — đây là khả năng chỉ Transit Gateway mới có.</li><li><b>B. ✓</b> Đúng: Transit Gateway hỗ trợ ECMP, cho phép dùng nhiều VPN tunnel song song để vượt quá giới hạn 1.25 Gbps/tunnel.</li><li><b>C. ✗</b> Global Accelerator tối ưu đường đi mạng/giảm độ trễ, không tăng được throughput tối đa của 1 kết nối VPN.</li><li><b>D. ✗</b> Transfer Acceleration chỉ dành cho tăng tốc truyền file vào S3, không liên quan gì tới VPN.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Virtual Private Gateway nghe như lựa chọn 'truyền thống hợp lý' hơn nhưng lại THIẾU đúng khả năng kỹ thuật (ECMP) mà đề yêu cầu — chỉ Transit Gateway mới hỗ trợ.</p>","tip":"<p>Một VPN tunnel luôn giới hạn ~1.25 Gbps; muốn vượt giới hạn này phải dùng nhiều tunnel + ECMP, và ECMP chỉ khả dụng trên Transit Gateway, không phải Virtual Private Gateway.</p>"},{"id":42,"topic":"Design Cost-Optimized Architectures – EBS io1 to gp2 cost optimization","supplement":false,"stem":"A company has noticed that its Amazon EBS Elastic Volume (io1) accounts for 90% of the cost and the remaining 10% cost can be attributed to the Amazon EC2 instance. The Amazon CloudWatch metrics report that both the Amazon EC2 instance and the Amazon EBS volume are under-utilized. The Amazon CloudWatch metrics also show that the Amazon EBS volume has occasional I/O bursts. The entire infrastructure is managed by AWS CloudFormation.<br>As a Solutions Architect, what do you propose to reduce the costs?","options":[{"html":"Convert the Amazon EC2 instance EBS volume to gp2","correct":true},{"html":"Keep the Amazon EBS volume to io1 and reduce the IOPS","correct":false},{"html":"Don't use a AWS CloudFormation template to create the database as the AWS CloudFormation service incurs greater service charges","correct":false},{"html":"Change the Amazon EC2 instance type to something much smaller","correct":false}],"multi":1,"analysis":"<p>Chọn đúng LEVER tối ưu chi phí (đổi loại volume, không phải chỉnh thông số)</p>","answer":"<p>Workload 'under-utilized, chỉ burst thỉnh thoảng' là use-case kinh điển của gp2 (có burst credit, rẻ hơn io1 nhiều lần).</p>","explain":"<ul><li><b>A. ✓</b> Đúng: chuyển sang gp2 rẻ hơn io1 nhiều, vẫn hỗ trợ burst IOPS tạm thời — khớp với pattern 'occasional I/O burst, under-utilized'.</li><li><b>B. ✗</b> Giảm IOPS trên io1 vẫn giữ nguyên MÔ HÌNH chi phí đắt (trả theo IOPS provisioned) và có thể ảnh hưởng tới lúc cần burst.</li><li><b>C. ✗</b> CloudFormation là dịch vụ MIỄN PHÍ, không hề phát sinh phí dịch vụ riêng — phát biểu này sai hoàn toàn.</li><li><b>D. ✗</b> EC2 chỉ chiếm 10% chi phí, đổi instance nhỏ hơn không giải quyết được phần 90% chi phí từ EBS io1.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Giảm IOPS trên io1 nghe như cách tiết kiệm hợp lý nhưng vẫn giữ MÔ HÌNH tính phí đắt của io1, không giải quyết gốc vấn đề như đổi hẳn sang gp2.</p>","tip":"<p>Workload không ổn định, hiếm khi cần IOPS cao, phần lớn thời gian under-utilized → gp2 (có burst) rẻ hơn io1 (trả cố định theo IOPS provisioned) nhiều lần.</p>"},{"id":43,"topic":"Design Cost-Optimized Architectures – EC2 Spot + SQS for async image processing","supplement":false,"stem":"You are working as a Solutions Architect for a photo processing company that has a proprietary algorithm to compress an image without any loss in quality. Because of the efficiency of the algorithm, your clients are willing to wait for a response that carries their compressed images back. You also want to process these jobs asynchronously and scale quickly, to cater to the high demand. Additionally, you also want the job to be retried in case of failures.<br>Which combination of choices do you recommend to minimize cost and comply with the requirements? (Select two)","options":[{"html":"Amazon Simple Notification Service (Amazon SNS)","correct":false},{"html":"Amazon EC2 Reserved Instances (RIs)","correct":false},{"html":"Amazon EC2 On-Demand Instances","correct":false},{"html":"Amazon EC2 Spot Instances","correct":true},{"html":"Amazon Simple Queue Service (Amazon SQS)","correct":true}],"multi":2,"analysis":"<p>Xử lý job bất đồng bộ, chịu gián đoạn được, cần rẻ nhất + có retry tự nhiên</p>","answer":"<p>SQS đệm job với cơ chế retry/visibility timeout có sẵn; Spot Instance tận dụng được việc khách hàng chấp nhận chờ (tolerant to interruption) để tối ưu chi phí tối đa.</p>","explain":"<ul><li><b>A. ✗</b> SNS là dịch vụ pub/sub, không phải hàng đợi xử lý job có cơ chế retry như yêu cầu.</li><li><b>B. ✗</b> RI đòi hỏi cam kết 1-3 năm cho khối lượng tải không ổn định — không phải lựa chọn tiết kiệm nhất ở đây.</li><li><b>C. ✗</b> On-Demand không tận dụng được mức giá rẻ hơn khi job có thể chấp nhận chờ đợi/gián đoạn.</li><li><b>D. ✓</b> Đúng: Spot Instance rẻ hơn On-Demand/RI nhiều, phù hợp vì khách hàng sẵn sàng chờ (chấp nhận gián đoạn).</li><li><b>E. ✓</b> Đúng: SQS đệm job bất đồng bộ, có cơ chế retry/dead-letter tự nhiên, scale theo số message trong queue.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> On-Demand/Reserved Instances đều là lựa chọn 'an toàn' quen thuộc, nhưng khi workload CHẤP NHẬN GIÁN ĐOẠN và cần rẻ nhất, Spot Instance luôn là lựa chọn tối ưu hơn.</p>","tip":"<p>Job bất đồng bộ, khách sẵn sàng chờ, cần rẻ nhất → Spot Instances (không phải RI/On-Demand) + SQS (đệm, retry, scale theo queue depth).</p>"},{"id":44,"topic":"Design Secure Architectures – IAM Identity Center + AD trust relationship","supplement":false,"stem":"A global insurance company is modernizing its infrastructure by migrating multiple line-of-business applications from its on-premises data centers to AWS. These applications will be deployed across several AWS accounts, all governed under a centralized AWS Organizations structure. The company manages all user identities, groups, and access policies within its on-premises Microsoft Active Directory and wants to continue doing so. The goal is to enable seamless single sign-in across all AWS accounts without duplicating user identity stores or manually provisioning accounts.<br>Which solution best meets these requirements in the most operationally efficient manner?","options":[{"html":"Deploy AWS IAM Identity Center and configure it to use AWS Directory Service for Microsoft Active Directory (Enterprise Edition). Establish a two-way trust relationship between the managed directory and the on-premises Active Directory to enable federated authentication across all AWS accounts","correct":true},{"html":"Enable AWS IAM Identity Center and manually create user accounts and groups within it. Assign these users permission sets in each AWS account. Manage synchronization with on-premises Active Directory using custom PowerShell scripts","correct":false},{"html":"Deploy an OpenLDAP server on Amazon EC2, sync it with the on-premises Active Directory, and integrate it with each AWS account by creating IAM roles that trust the EC2-hosted LDAP server as a SAML provider","correct":false},{"html":"Use Amazon Cognito as the primary identity store and create a custom OpenID Connect (OIDC) federation with the on-premises Active Directory. Assign IAM roles using Cognito identity pools and propagate access to multiple AWS accounts using resource policies","correct":false}],"multi":1,"analysis":"<p>SSO tập trung nhiều account, giữ nguyên nguồn danh tính on-prem, ít vận hành nhất</p>","answer":"<p>Two-way trust giữa AWS Managed AD và AD tại chỗ cho phép IAM Identity Center xác thực trực tiếp với người dùng AD hiện có, không cần tạo lại identity hay script đồng bộ thủ công.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: AWS Managed AD (Enterprise Edition) hỗ trợ two-way trust với AD tại chỗ, kết hợp IAM Identity Center để SSO toàn bộ account mà không cần nhân bản danh tính.</li><li><b>B. ✗</b> Tạo user thủ công trong Identity Center và tự viết script PowerShell để đồng bộ là cách làm thủ công, không scale, đi ngược yêu cầu 'ít vận hành nhất'.</li><li><b>C. ✗</b> Tự host OpenLDAP trên EC2 làm tăng gánh nặng vận hành (patch, HA, bảo mật) và không tích hợp sẵn với IAM Identity Center.</li><li><b>D. ✗</b> Cognito được tối ưu cho ứng dụng web/mobile, không phải giải pháp SSO cấp tổ chức cho nhiều AWS account qua Organizations.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các giải pháp 'tự dựng' (OpenLDAP trên EC2, script PowerShell đồng bộ) nghe khả thi về mặt kỹ thuật nhưng đều tăng vận hành/bảo trì — ngược hẳn yêu cầu 'operationally efficient'.</p>","tip":"<p>SSO cho nhiều AWS account + vẫn giữ Active Directory tại chỗ làm nguồn danh tính → IAM Identity Center + AWS Managed AD (two-way trust), không cần tự dựng LDAP hay dùng Cognito.</p>"},{"id":45,"topic":"Design High-Performing Architectures – EFS mount targets per AZ for lowest latency","supplement":false,"stem":"A research organization is running a high-performance computing (HPC) workload using Amazon EC2 instances that are distributed across multiple Availability Zones (AZs) within a single AWS Region. The workload requires access to a shared file system with the lowest possible latency for frequent reads and writes.The team decides to use Amazon Elastic File System (Amazon EFS) for its scalability and simplicity. To ensure optimal performance and reduce network latency, the solution architect must design the architecture so that each EC2 instance can access the file system with the least possible delay.<br>Which of the following is the most appropriate solution to meet these requirements?","options":[{"html":"Create mount targets for Amazon EFS on an EC2 instance in each AZ and use them to serve as access points for other instances","correct":false},{"html":"Create EFS mount targets in each AZ and mount the EFS file system to EC2 instances in the same AZ as the mount target","correct":true},{"html":"Use Mountpoint for Amazon S3 to mount an S3 bucket on each EC2 instance and use it as a shared storage layer across Availability Zones","correct":false},{"html":"Create a single EFS mount target in one AZ and allow all EC2 instances in other AZs to access it using the default mount target","correct":false}],"multi":1,"analysis":"<p>Giảm độ trễ truy cập EFS bằng cách mount ĐÚNG mount target cùng AZ</p>","answer":"<p>Mount target trong mỗi AZ giữ traffic nằm trong cùng AZ, tránh độ trễ liên AZ và tăng khả năng chịu lỗi (1 AZ sập vẫn còn AZ khác hoạt động).</p>","explain":"<ul><li><b>A. ✗</b> Hiểu sai khái niệm: mount target là ENI do EFS quản lý ở cấp VPC, KHÔNG được tạo trên một EC2 instance.</li><li><b>B. ✓</b> Đúng: tạo mount target riêng ở mỗi AZ, mỗi EC2 mount vào mount target CÙNG AZ để traffic không phải đi liên AZ.</li><li><b>C. ✗</b> Mountpoint for S3 biến S3 (object storage) thành file system giả lập — không đạt độ trễ thấp và tính nhất quán cần cho workload HPC chia sẻ.</li><li><b>D. ✗</b> Chỉ có 1 mount target khiến các EC2 ở AZ khác phải đi traffic LIÊN AZ, tăng độ trễ và phát sinh chi phí truyền dữ liệu.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Nhầm lẫn giữa 'mount point' (nơi gắn ổ đĩa trên EC2) và 'mount target' (ENI do EFS quản lý ở cấp VPC) khiến phương án tạo mount target 'trên EC2' nghe hợp lý nhưng sai bản chất.</p>","tip":"<p>Luôn tạo EFS mount target ở MỖI AZ nơi có EC2 cần truy cập, và mount từ EC2 vào mount target CÙNG AZ để có độ trễ thấp nhất, tránh chi phí truyền liên AZ.</p>"},{"id":46,"topic":"Design Cost-Optimized Architectures – API Gateway Caching to reduce Aurora load","supplement":false,"stem":"You have developed a new REST API leveraging the Amazon API Gateway, AWS Lambda and Amazon Aurora database services. Most of the workload on the website is read-heavy. The data rarely changes and it is acceptable to serve users outdated data for about 24 hours. Recently, the website has been experiencing high load and the costs incurred on the Aurora database have been very high.<br>How can you easily reduce the costs while improving performance, with minimal changes?","options":[{"html":"Add Amazon Aurora Read Replicas","correct":false},{"html":"Enable Amazon API Gateway Caching","correct":true},{"html":"Enable AWS Lambda In Memory Caching","correct":false},{"html":"Switch to using an Application Load Balancer","correct":false}],"multi":1,"analysis":"<p>Giảm tải/giảm chi phí DB khi dữ liệu CHẤP NHẬN CŨ trong thời gian dài</p>","answer":"<p>API Gateway Caching lưu lại response ở tầng API, giảm trực tiếp số request chạm Lambda/Aurora — chi phí thấp, triển khai đơn giản, đúng mức độ 'chấp nhận dữ liệu cũ 24h'.</p>","explain":"<ul><li><b>A. ✗</b> Thêm Read Replica làm TĂNG chi phí (thêm instance DB), ngược với mục tiêu giảm chi phí.</li><li><b>B. ✓</b> Đúng: dữ liệu chấp nhận cũ tới 24 giờ → bật cache ở tầng API Gateway (TTL tối đa 3600s, có thể lặp lại) giảm hẳn số lần gọi xuống Lambda/Aurora.</li><li><b>C. ✗</b> Lambda không có tính năng in-memory caching có sẵn — đây là tên tính năng không tồn tại.</li><li><b>D. ✗</b> Đổi sang ALB không giải quyết được vấn đề cache dữ liệu — ALB chỉ là bộ cân bằng tải, không lưu trữ phản hồi.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Thêm Read Replica nghe như cách giải quyết tải đọc kinh điển, nhưng ở đây mục tiêu là GIẢM chi phí — thêm instance mới đi ngược hoàn toàn mục tiêu đó.</p>","tip":"<p>Dữ liệu ít đổi, chấp nhận stale trong khoảng thời gian dài → bật cache càng gần client càng tốt (API Gateway Caching/CloudFront) thay vì scale thêm DB.</p>"},{"id":47,"topic":"Design High-Performing Architectures – Kinesis Data Analytics real-time pipeline","supplement":false,"stem":"An e-commerce company tracks user clicks on its flagship website and performs analytics to provide near-real-time product recommendations. An Amazon EC2 instance receives data from the website and sends the data to an Amazon Aurora Database instance. Another Amazon EC2 instance continuously checks the changes in the database and executes SQL queries to provide recommendations. Now, the company wants a redesign to decouple and scale the infrastructure. The solution must ensure that data can be analyzed in real-time without any data loss even when the company sees huge traffic spikes.<br>What would you recommend as an AWS Certified Solutions Architect - Associate?","options":[{"html":"Leverage Amazon Kinesis Data Streams to capture the data from the website and feed it into Amazon QuickSight which can query the data in real time. Lastly, the analyzed feed is output into Kinesis Data Firehose to persist the data on Amazon S3","correct":false},{"html":"Leverage Amazon SQS to capture the data from the website. Configure a fleet of Amazon EC2 instances under an Auto scaling group to process messages from the Amazon SQS queue and trigger the scaling policy based on the number of pending messages in the queue. Perform real-time analytics using a third-party library on the Amazon EC2 instances","correct":false},{"html":"Leverage Amazon Kinesis Data Streams to capture the data from the website and feed it into Amazon Kinesis Data Firehose to persist the data on Amazon S3. Lastly, use Amazon Athena to analyze the data in real time","correct":false},{"html":"Leverage Amazon Kinesis Data Streams to capture the data from the website and feed it into Amazon Kinesis Data Analytics which can query the data in real time. Lastly, the analyzed feed is output into Amazon Kinesis Data Firehose to persist the data on Amazon S3","correct":true}],"multi":1,"analysis":"<p>Ghép đúng pipeline streaming cho real-time analytics không mất dữ liệu</p>","answer":"<p>Chuỗi Kinesis Data Streams → Kinesis Data Analytics → Kinesis Data Firehose là bộ 3 dịch vụ managed được thiết kế sẵn cho đúng use-case phân tích thời gian thực + lưu trữ an toàn.</p>","explain":"<ul><li><b>A. ✗</b> QuickSight không nhận trực tiếp Kinesis Data Streams làm nguồn và không phân tích theo thời gian thực — sai cả 2 điểm.</li><li><b>B. ✗</b> Tự quản lý fleet EC2 với thư viện bên thứ ba để phân tích real-time là tốn vận hành hơn nhiều so với dùng Kinesis Data Analytics managed.</li><li><b>C. ✗</b> Athena truy vấn dữ liệu đã nằm trên S3, có độ trễ, KHÔNG phải công cụ phân tích thời gian thực.</li><li><b>D. ✓</b> Đúng: Kinesis Data Streams ingest → Kinesis Data Analytics phân tích SQL thời gian thực → Kinesis Data Firehose lưu kết quả vào S3 không mất dữ liệu.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> QuickSight và Athena đều là công cụ 'phân tích dữ liệu' quen thuộc, nhưng cả 2 đều KHÔNG phải công cụ xử lý luồng thời gian thực (streaming) như đề yêu cầu.</p>","tip":"<p>Streaming ingest: Kinesis Data Streams. Phân tích SQL trên luồng real-time: Kinesis Data Analytics. Đẩy kết quả vào kho lưu trữ (S3/Redshift...): Kinesis Data Firehose.</p>"},{"id":48,"topic":"Design Resilient Architectures – Cross-Region AMI copy for DR","supplement":false,"stem":"The engineering team at a global e-commerce company is currently reviewing their disaster recovery strategy. The team has outlined that they need to be able to quickly recover their application stack with a Recovery Time Objective (RTO) of 5 minutes, in all of the AWS Regions that the application runs. The application stack currently takes over 45 minutes to install on a Linux system.<br>As a Solutions architect, which of the following options would you recommend as the disaster recovery strategy?","options":[{"html":"Use Amazon EC2 user data to speed up the installation process","correct":false},{"html":"Store the installation files in Amazon S3 for quicker retrieval","correct":false},{"html":"Create an Amazon Machine Image (AMI) after installing the software and copy the AMI across all Regions. Use this Region-specific AMI to run the recovery process in the respective Regions","correct":true},{"html":"Create an Amazon Machine Image (AMI) after installing the software and use this AMI to run the recovery process in other Regions","correct":false}],"multi":1,"analysis":"<p>Đạt RTO cực ngắn cho ứng dụng cài đặt lâu, đa Region</p>","answer":"<p>AMI dựng sẵn loại bỏ hoàn toàn bước cài đặt 45 phút; vì AMI là tài nguyên theo Region nên phải copy sang từng Region để sẵn sàng recovery ở đó.</p>","explain":"<ul><li><b>A. ✗</b> User data chỉ chạy script khi boot, không rút ngắn được thời gian cài đặt phần mềm 45 phút.</li><li><b>B. ✗</b> Lưu file cài đặt lên S3 giúp tải nhanh hơn, nhưng vẫn phải CHẠY cài đặt mất ~45 phút — không đạt RTO 5 phút.</li><li><b>C. ✓</b> Đúng: AMI đã cài sẵn phần mềm giúp instance mới khởi động gần như tức thì; vì AMI gắn với 1 Region nên phải COPY sang các Region khác để dùng.</li><li><b>D. ✗</b> AMI gắn với Region tạo ra nó — nếu không copy sang Region khác thì không thể dùng để khôi phục ở Region đó.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Phương án tạo AMI nhưng QUÊN copy sang các Region khác là bẫy thiếu 1 bước bắt buộc — AMI không tự động có mặt ở Region khác.</p>","tip":"<p>AMI luôn gắn với 1 Region cụ thể; khi cần DR đa Region, phải chủ động COPY AMI sang từng Region liên quan trước khi xảy ra sự cố.</p>"},{"id":49,"topic":"Design High-Performing Architectures – EC2 Cluster Placement Group for distributed processing","supplement":false,"stem":"A Big Data processing company has created a distributed data processing framework that performs best if the network performance between the processing machines is high. The application has to be deployed on AWS, and the company is only looking at performance as the key measure.<br>As a Solutions Architect, which deployment do you recommend?","options":[{"html":"Use a Spread placement group","correct":false},{"html":"Optimize the Amazon EC2 kernel using EC2 User Data","correct":false},{"html":"Use Spot Instances","correct":false},{"html":"Use a Cluster placement group","correct":true}],"multi":1,"analysis":"<p>Tối ưu THUẦN hiệu năng mạng cho hệ phân tán, bỏ qua các tiêu chí khác</p>","answer":"<p>Khi tiêu chí DUY NHẤT là hiệu năng mạng giữa các node, Cluster Placement Group là lựa chọn kỹ thuật trực tiếp và hiệu quả nhất.</p>","explain":"<ul><li><b>A. ✗</b> Spread placement group đặt instance tách biệt phần cứng để CHỐNG correlated failure, không tối ưu network throughput như Cluster.</li><li><b>B. ✗</b> Không thể 'tối ưu kernel' qua User Data để cải thiện hiệu năng mạng — hiệu năng mạng phụ thuộc vào instance type/placement, không phải kernel tuning qua script.</li><li><b>C. ✗</b> Spot Instance tối ưu CHI PHÍ, không liên quan tới hiệu năng mạng — sai tiêu chí đề bài (chỉ xét performance).</li><li><b>D. ✓</b> Đúng: Cluster placement group đặt instance gần nhau trong 1 AZ, đạt throughput cao nhất, tối ưu cho network performance giữa các node.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Spot Instance là bẫy đánh lạc hướng sang tiêu chí CHI PHÍ, trong khi đề đã nói rõ ràng công ty 'chỉ quan tâm duy nhất tới hiệu năng' (performance as the key measure).</p>","tip":"<p>Khi đề nói rõ chỉ quan tâm 1 tiêu chí (ví dụ performance), loại ngay các đáp án tối ưu tiêu chí KHÁC (chi phí, HA...) dù chúng nghe hợp lý.</p>"},{"id":50,"topic":"Design High-Performing Architectures – Amazon MQ for MQTT message broker migration","supplement":false,"stem":"A company's business logic is built on several microservices that are running in the on-premises data center. They currently communicate using a message broker that supports the MQTT protocol. The company is looking at migrating these applications and the message broker to AWS Cloud without changing the application logic.<br>Which technology allows you to get a managed message broker that supports the MQTT protocol?","options":[{"html":"Amazon MQ","correct":true},{"html":"Amazon Kinesis Data Streams","correct":false},{"html":"Amazon Simple Notification Service (Amazon SNS)","correct":false},{"html":"Amazon Simple Queue Service (Amazon SQS)","correct":false}],"multi":1,"analysis":"<p>Di chuyển lên cloud mà GIỮ NGUYÊN giao thức/logic ứng dụng hiện có (lift-and-shift message broker)</p>","answer":"<p>Amazon MQ được thiết kế riêng để thay thế message broker truyền thống (ActiveMQ/RabbitMQ) mà không cần đổi giao thức ứng dụng đang dùng (MQTT, AMQP, JMS...).</p>","explain":"<ul><li><b>A. ✓</b> Đúng: Amazon MQ là message broker managed, hỗ trợ sẵn các giao thức chuẩn công nghiệp gồm MQTT, AMQP, STOMP, JMS.</li><li><b>B. ✗</b> Kinesis Data Streams là dịch vụ streaming độc quyền của AWS, không tương thích giao thức MQTT.</li><li><b>C. ✗</b> SNS là dịch vụ pub/sub độc quyền của AWS, không hỗ trợ giao thức MQTT chuẩn công nghiệp.</li><li><b>D. ✗</b> SQS là hàng đợi độc quyền của AWS, cũng không hỗ trợ giao thức MQTT.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> SNS, SQS, Kinesis đều là dịch vụ messaging phổ biến của AWS nhưng đều là giao thức ĐỘC QUYỀN của AWS, không tương thích MQTT như broker truyền thống.</p>","tip":"<p>Khi đề yêu cầu 'giữ nguyên giao thức broker hiện có (MQTT/AMQP/JMS/STOMP)' khi di chuyển lên cloud → luôn chọn Amazon MQ, không phải SNS/SQS/Kinesis.</p>"},{"id":51,"topic":"Design Cost-Optimized Architectures – EFS Burst Throughput Mode","supplement":false,"stem":"A genomics research firm is processing sporadic bursts of data-intensive workloads using Amazon EC2 instances. The shared storage must support unpredictable spikes in file operations, but the average daily throughput demand remains relatively low. The team has selected Amazon Elastic File System (EFS) for its scalability and wants to ensure optimal cost and performance during bursts without provisioning throughput manually.<br>Which approach should the team take to best meet these requirements?","options":[{"html":"Enable EFS Infrequent Access (IA) storage class to reduce storage cost while continuing to benefit from burst throughput mode","correct":false},{"html":"Enable EFS burst throughput mode on the file system using the General Purpose performance mode and EFS Standard storage class","correct":true},{"html":"Change the throughput mode to provisioned and configure the desired throughput value to support burst workloads","correct":false},{"html":"Switch the EFS storage class to EFS One Zone to reduce cost, which will automatically enable burst throughput mode","correct":false}],"multi":1,"analysis":"<p>Phân biệt STORAGE CLASS (chi phí lưu trữ/số AZ) với THROUGHPUT MODE (băng thông I/O) của EFS — đây là 2 trục cấu hình độc lập</p>","answer":"<p>Burst throughput mode tự động tích luỹ/tiêu thụ credit để đáp ứng các đợt burst mà không cần cấu hình gì thêm — đúng khớp pattern tải thấp, thỉnh thoảng đột biến.</p>","explain":"<ul><li><b>A. ✗</b> EFS IA chỉ ảnh hưởng tới CHI PHÍ LƯU TRỮ cho file ít dùng, hoàn toàn không liên quan tới throughput mode.</li><li><b>B. ✓</b> Đúng: burst throughput mode (mặc định, dùng throughput credit) kết hợp General Purpose + Standard storage class đáp ứng đúng nhu cầu 'burst thỉnh thoảng, không cần cấu hình tay'.</li><li><b>C. ✗</b> Provisioned throughput yêu cầu TỰ cấu hình mức throughput cố định — đi ngược yêu cầu 'không cần provisioning thủ công'.</li><li><b>D. ✗</b> Đổi sang One Zone CHỈ ảnh hưởng số AZ lưu trữ, KHÔNG tự động bật burst throughput mode như phát biểu.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Cả 2 đáp án sai đều GÁN NHẦM hiệu ứng của storage class (IA, One Zone) sang throughput mode — đây là 2 trục cấu hình HOÀN TOÀN ĐỘC LẬP của EFS.</p>","tip":"<p>EFS có 2 trục cấu hình riêng biệt: Storage Class (Standard/IA/One Zone — ảnh hưởng chi phí &amp; số AZ) và Throughput Mode (Burst/Provisioned/Elastic — ảnh hưởng băng thông I/O). Đổi cái này KHÔNG tự động đổi cái kia.</p>"},{"id":52,"topic":"Design High-Performing Architectures – DynamoDB On-Demand capacity mode","supplement":false,"stem":"A ride-sharing company wants to use an Amazon DynamoDB table for data storage. The table will not be used during the night hours whereas the read and write traffic will often be unpredictable during day hours. When traffic spikes occur they will happen very quickly.<br>Which of the following will you recommend as the best-fit solution?","options":[{"html":"Set up Amazon DynamoDB global table in the provisioned capacity mode","correct":false},{"html":"Set up Amazon DynamoDB table in the provisioned capacity mode with auto-scaling enabled","correct":false},{"html":"Set up Amazon DynamoDB table in the on-demand capacity mode","correct":true},{"html":"Set up Amazon DynamoDB table with a global secondary index","correct":false}],"multi":1,"analysis":"<p>Phân biệt 'traffic không ổn định nhưng tăng DẦN' (Provisioned+AutoScaling) với 'traffic tăng ĐỘT NGỘT trong giây/phút' (On-demand)</p>","answer":"<p>On-demand cấp phát capacity ngay lập tức theo từng request, không có độ trễ phản ứng như Auto Scaling (vốn cần thời gian để alarm kích hoạt và scale).</p>","explain":"<ul><li><b>A. ✗</b> Global Table giải quyết bài toán ĐA REGION, không liên quan tới việc traffic đột biến nhanh trong 1 Region.</li><li><b>B. ✗</b> Provisioned + Auto Scaling vẫn có ĐỘ TRỄ phản ứng (dựa trên CloudWatch alarm), không theo kịp traffic 'tăng rất nhanh trong vài giây'.</li><li><b>C. ✓</b> Đúng: On-demand tự động cấp phát ngay lập tức, không có khái niệm 'chờ scale', phù hợp nhất cho traffic đột biến nhanh và khó đoán.</li><li><b>D. ✗</b> GSI chỉ là một kiểu index phụ, không liên quan gì tới việc xử lý traffic đột biến.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Provisioned + Auto Scaling nghe như đã 'tự động' đủ để xử lý biến động, nhưng auto-scaling vẫn có ĐỘ TRỄ phản ứng — không phù hợp khi đề nhấn mạnh traffic tăng 'rất nhanh'.</p>","tip":"<p>Traffic thay đổi DẦN DẦN, có thể dự đoán xu hướng → Provisioned + Auto Scaling. Traffic đột biến RẤT NHANH, khó đoán trước → On-demand capacity mode.</p>"},{"id":53,"topic":"Design Resilient Architectures – CloudFront features - field-level encryption, origin failover, multi-origin","supplement":false,"stem":"The engineering team at a social media company has recently migrated to AWS Cloud from its on-premises data center. The team is evaluating Amazon CloudFront to be used as a CDN for its flagship application. The team has hired you as an AWS Certified Solutions Architect – Associate to advise on Amazon CloudFront capabilities on routing, security, and high availability.<br>Which of the following would you identify as correct regarding Amazon CloudFront? (Select three)","options":[{"html":"Use geo restriction to configure Amazon CloudFront for high-availability and failover","correct":false},{"html":"Use field level encryption in Amazon CloudFront to protect sensitive data for specific content","correct":true},{"html":"Use AWS Key Management Service (AWS KMS) encryption in Amazon CloudFront to protect sensitive data for specific content","correct":false},{"html":"Amazon CloudFront can route to multiple origins based on the price class","correct":false},{"html":"Amazon CloudFront can route to multiple origins based on the content type","correct":true},{"html":"Use an origin group with primary and secondary origins to configure Amazon CloudFront for high-availability and failover","correct":true}],"multi":3,"analysis":"<p>Nhận biết đúng-sai các khả năng cụ thể của CloudFront (routing, bảo mật, HA)</p>","answer":"<p>3 khả năng có thật của CloudFront: field-level encryption (bảo mật dữ liệu nhạy cảm), route đa origin theo content type, và origin failover bằng origin group.</p>","explain":"<ul><li><b>A. ✗</b> Geo restriction dùng để CHẶN truy cập theo vị trí địa lý, không phải cơ chế failover/high-availability.</li><li><b>B. ✓</b> Đúng: field-level encryption mã hoá riêng từng trường dữ liệu nhạy cảm (vd số thẻ) ngay tại edge location.</li><li><b>C. ✗</b> KMS không phải cơ chế mã hoá field-level của CloudFront — đây là tên dịch vụ bị gán sai tính năng.</li><li><b>D. ✗</b> CloudFront route theo PRICE CLASS là sai — price class chỉ ảnh hưởng tới việc dùng edge location nào, không dùng để route origin.</li><li><b>E. ✓</b> Đúng: CloudFront hỗ trợ route tới nhiều origin khác nhau dựa trên loại nội dung (cache behavior theo path pattern/content type).</li><li><b>F. ✓</b> Đúng: origin group với primary/secondary + health check tự động failover sang origin phụ khi origin chính lỗi.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> KMS và 'route theo price class' đều là khái niệm AWS có thật nhưng bị GÁN SAI vào ngữ cảnh CloudFront — một dạng bẫy ghép nhầm tính năng giữa các dịch vụ/khái niệm.</p>","tip":"<p>CloudFront HA/failover → Origin Group (primary/secondary + health check). CloudFront bảo mật dữ liệu nhạy cảm theo field → Field-Level Encryption (không phải KMS). CloudFront route đa origin → theo path/content type, không phải theo price class.</p>"},{"id":54,"topic":"Design Resilient Architectures – DynamoDB Deletion Protection","supplement":false,"stem":"A fintech startup hosts its real-time transaction metadata in Amazon DynamoDB tables. During a recent system maintenance event, a junior engineer accidentally deleted a production table, resulting in major service downtime and irreversible data loss. Leadership has mandated an immediate solution that prevents future data loss from human error, while requiring minimal ongoing maintenance or manual effort from the engineering team.<br>Which approach best addresses these requirements with the least operational overhead?","options":[{"html":"Manually export each table as a full backup to Amazon S3 on a weekly basis. Use the DynamoDB export to S3 feature and rely on manual recovery if tables are deleted","correct":false},{"html":"Enable point-in-time recovery (PITR) on each DynamoDB table","correct":false},{"html":"Configure AWS CloudTrail to monitor DynamoDB API calls. Set up an Amazon EventBridge rule to detect DeleteTable events and trigger a Lambda function that recreates the deleted table using backup data stored in Amazon S3","correct":false},{"html":"Enable deletion protection on DynamoDB tables","correct":true}],"multi":1,"analysis":"<p>Phân biệt giải pháp PREVENTIVE (ngăn chặn trước) với REACTIVE (khôi phục sau khi đã xảy ra)</p>","answer":"<p>Deletion protection là cơ chế preventive duy nhất trong các lựa chọn — chặn hành động xoá bảng NGAY TỪ ĐẦU, đúng yêu cầu 'ngăn mất dữ liệu do lỗi con người'.</p>","explain":"<ul><li><b>A. ✗</b> Backup thủ công hàng tuần vừa tốn công, vừa có thể mất dữ liệu của cả tuần nếu sự cố xảy ra ngay trước lần backup kế tiếp.</li><li><b>B. ✗</b> PITR giúp KHÔI PHỤC dữ liệu sau khi mất (reactive), nhưng không hề NGĂN việc bảng bị xoá ngay từ đầu.</li><li><b>C. ✗</b> CloudTrail + EventBridge + Lambda là giải pháp phản ứng SAU KHI đã xoá — bảng và dữ liệu đã mất trước khi quy trình này kịp chạy.</li><li><b>D. ✓</b> Đúng: deletion protection chặn NGAY hành động xoá bảng ngay từ đầu (preventive), chỉ cần bật 1 lần, gần như không cần vận hành thêm.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> PITR và pipeline CloudTrail+EventBridge+Lambda đều 'nghe' như giải pháp bảo vệ dữ liệu tốt, nhưng cả hai chỉ hoạt động SAU KHI bảng đã bị xoá — không ngăn được sự cố xảy ra.</p>","tip":"<p>Ngăn lỗi con người xoá nhầm resource NGAY TỪ ĐẦU → bật deletion protection/termination protection (preventive). PITR/backup chỉ giúp khôi phục dữ liệu (reactive), không ngăn được hành động xoá.</p>"},{"id":55,"topic":"Design High-Performing Architectures – Storage Gateway Tape Gateway for tape backup migration","supplement":false,"stem":"An enterprise has decided to move its secondary workloads such as backups and archives to AWS cloud. The CTO wishes to move the data stored on physical tapes to Cloud, without changing their current tape backup workflows. The company holds petabytes of data on tapes and needs a cost-optimized solution to move this data to cloud.<br>What is an optimal solution that meets these requirements while keeping the costs to a minimum?","options":[{"html":"Use AWS Direct Connect, a cloud service solution that makes it easy to establish a dedicated network connection from on-premises to AWS to transfer data. Once this is done, Amazon S3 can be used to store data at lesser costs","correct":false},{"html":"Use AWS VPN connection between the on-premises datacenter and your Amazon VPC. Once this is established, you can use Amazon Elastic File System (Amazon EFS) to get a scalable, fully managed elastic NFS file system for use with AWS Cloud services and on-premises resources","correct":false},{"html":"Use Tape Gateway, which can be used to move on-premises tape data onto AWS Cloud. Then, Amazon S3 archiving storage classes can be used to store data cost-effectively for years","correct":true},{"html":"Use AWS DataSync, which makes it simple and fast to move large amounts of data online between on-premises storage and AWS Cloud. Data moved to Cloud can then be stored cost-effectively in Amazon S3 archiving storage classes","correct":false}],"multi":1,"analysis":"<p>Di chuyển đúng LOẠI workload (tape backup) lên cloud mà giữ nguyên quy trình hiện có</p>","answer":"<p>Tape Gateway là dịch vụ DUY NHẤT giả lập virtual tape tương thích với phần mềm backup tape hiện tại, cho phép giữ nguyên workflow trong khi dữ liệu thực tế nằm trên S3/Glacier giá rẻ.</p>","explain":"<ul><li><b>A. ✗</b> Direct Connect tốn kém, lâu thiết lập, không hề giải quyết việc GIỮ NGUYÊN workflow backup bằng tape hiện có.</li><li><b>B. ✗</b> VPN + EFS là file storage, hoàn toàn không liên quan tới việc 'ảo hoá' tape backup đang dùng.</li><li><b>C. ✓</b> Đúng: Tape Gateway giả lập 'virtual tape' tương thích phần mềm backup hiện tại, không cần đổi workflow, rồi tự chuyển dữ liệu xuống Glacier/Deep Archive giá rẻ.</li><li><b>D. ✗</b> DataSync CHỈ hỗ trợ giao thức file (NFS/SMB), KHÔNG hỗ trợ giao diện tape — sai hoàn toàn loại hình dữ liệu nguồn.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> AWS DataSync nghe như công cụ 'chuyển dữ liệu lớn' tổng quát phù hợp, nhưng nó CHỈ hỗ trợ giao thức file (NFS/SMB), không hỗ trợ giao diện tape như yêu cầu đề bài.</p>","tip":"<p>Khi đề nói đến backup dùng TAPE vật lý và cần giữ nguyên workflow → luôn nghĩ tới Storage Gateway Tape Gateway, không phải DataSync (chỉ cho file) hay Direct Connect/VPN (chỉ là kết nối mạng).</p>"},{"id":56,"topic":"Design Resilient Architectures – NLB fixed IP for firewall whitelisting","supplement":false,"stem":"You are working for a software as a service (SaaS) company as a solutions architect and help design solutions for the company's customers. One of the customers is a bank and has a requirement to whitelist a public IP when the bank is accessing external services across the internet.<br>Which architectural choice do you recommend to maintain high availability, support scaling-up to 10 instances and comply with the bank's requirements?","options":[{"html":"Use a Classic Load Balancer with an Auto Scaling Group","correct":false},{"html":"Use a Network Load Balancer with an Auto Scaling Group","correct":true},{"html":"Use an Application Load Balancer with an Auto Scaling Group","correct":false},{"html":"Use an Auto Scaling Group with Dynamic Elastic IPs attachment","correct":false}],"multi":1,"analysis":"<p>Cần IP TĨNH để đối tác whitelist firewall, vẫn phải HA + scale được</p>","answer":"<p>NLB là loại load balancer duy nhất trong các lựa chọn cung cấp địa chỉ IP cố định (hỗ trợ gắn Elastic IP) trong khi vẫn scale và HA phía sau nhờ ASG.</p>","explain":"<ul><li><b>A. ✗</b> Classic LB expose DNS động, không có IP tĩnh để khách hàng (ngân hàng) whitelist.</li><li><b>B. ✓</b> Đúng: NLB cung cấp 1 IP tĩnh cố định (có thể gắn EIP) cho mỗi AZ, đúng yêu cầu whitelist IP của khách hàng.</li><li><b>C. ✗</b> ALB cũng chỉ expose DNS, không có IP cố định — không đáp ứng yêu cầu whitelist IP tĩnh.</li><li><b>D. ✗</b> 'Dynamic Elastic IP attachment' cho ASG là tính năng KHÔNG TỒN TẠI.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> ALB/Classic LB đều là load balancer hợp lệ và phổ biến hơn NLB trong nhiều tình huống, nhưng cả hai chỉ expose DNS (không có IP cố định) — không đáp ứng đúng yêu cầu whitelist IP.</p>","tip":"<p>Khi đối tác/khách hàng cần WHITELIST một IP cố định cho dịch vụ của bạn → luôn chọn Network Load Balancer (hỗ trợ Elastic IP), không phải ALB/Classic LB (chỉ có DNS).</p>"},{"id":57,"topic":"Design Cost-Optimized Architectures – ASG Predictive Scaling + target tracking","supplement":false,"stem":"A streaming media company operates a high-traffic content delivery platform on AWS. The application backend is deployed on Amazon EC2 instances within an Auto Scaling group across multiple Availability Zones in a VPC. The team has observed that workloads follow predictable usage patterns, such as higher viewership on weekends and in the evenings, along with occasional real-time spikes due to viral content. To reduce cost and improve responsiveness, the team wants an automated scaling approach that can forecast future demand using historical usage patterns, scale in advance based on those predictions, and react quickly to unplanned usage surges in real time.<br>Which scaling strategy should a solutions architect recommend to meet these requirements?","options":[{"html":"Implement scheduled scaling actions based on pre-defined time windows from historical traffic data. Adjust instance count manually for known high-traffic hours","correct":false},{"html":"Use predictive scaling for the Auto Scaling group to analyze daily and weekly patterns, and configure dynamic scaling with target tracking policies to respond to real-time traffic changes","correct":true},{"html":"Configure step scaling policies based on EC2 CPU utilization. Use CloudWatch alarms to trigger scaling actions when utilization crosses defined thresholds with incremental adjustments","correct":false},{"html":"Set up simple scaling policies with longer cooldown periods to avoid rapid scaling. Trigger scale-out events based on average network throughput","correct":false}],"multi":1,"analysis":"<p>Kết hợp 2 CƠ CHẾ scaling bổ trợ: dự báo trước (predictive) + phản ứng tức thời (dynamic)</p>","answer":"<p>Predictive scaling xử lý phần pattern LẶP LẠI có thể dự đoán (cuối tuần, buổi tối); target tracking xử lý phần ĐỘT BIẾN không dự đoán được (viral) — kết hợp đáp ứng cả 2 yêu cầu đề bài.</p>","explain":"<ul><li><b>A. ✗</b> Scheduled scaling kèm điều chỉnh THỦ CÔNG không tự động hoá, không thích ứng với biến động ngoài dự kiến (viral content).</li><li><b>B. ✓</b> Đúng: predictive scaling dùng ML dự báo pattern lặp lại (ngày/tuần) để scale TRƯỚC, kết hợp target tracking để phản ứng realtime với spike bất ngờ.</li><li><b>C. ✗</b> Step scaling chỉ phản ứng SAU KHI ngưỡng CPU đã vượt — không có khả năng dự báo/scale trước.</li><li><b>D. ✗</b> Simple scaling với cooldown dài làm CHẬM phản ứng, không có khả năng dự báo trước như yêu cầu đề bài.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Step scaling và Simple scaling đều là cơ chế scaling hợp lệ của ASG, nhưng CẢ HAI chỉ phản ứng SAU KHI ngưỡng đã vượt — không có khả năng 'scale trước khi traffic tăng' như đề yêu cầu.</p>","tip":"<p>Traffic có pattern LẶP LẠI theo ngày/tuần + có spike bất ngờ → Predictive Scaling (dự báo trước) kết hợp Dynamic/Target Tracking Scaling (phản ứng tức thời), không chỉ dùng 1 cơ chế đơn lẻ.</p>"},{"id":58,"topic":"Design Resilient Architectures – RDS SQL Server Multi-AZ for maximum availability","supplement":false,"stem":"An e-commerce company wants to migrate its on-premises application to AWS. The application consists of application servers and a Microsoft SQL Server database. The solution should result in the maximum possible availability for the database layer while minimizing operational and management overhead.<br>As a solutions architect, which of the following would you recommend to meet the given requirements?","options":[{"html":"Migrate the data to Amazon RDS for SQL Server database in a cross-region Multi-AZ deployment","correct":false},{"html":"Migrate the data to Amazon RDS for SQL Server database in a Multi-AZ deployment","correct":true},{"html":"Migrate the data to Amazon RDS for SQL Server database in a cross-region read-replica configuration","correct":false},{"html":"Migrate the data to Amazon EC2 instance hosted SQL Server database. Deploy the Amazon EC2 instances in a Multi-AZ configuration","correct":false}],"multi":1,"analysis":"<p>HA tối đa cho DB + ít vận hành nhất → luôn ưu tiên managed service (RDS) hơn tự host (EC2)</p>","answer":"<p>RDS Multi-AZ tự động hoá hoàn toàn việc failover và không yêu cầu quản lý hạ tầng bên dưới — đạt cả tiêu chí availability tối đa lẫn overhead thấp nhất.</p>","explain":"<ul><li><b>A. ✗</b> 'Cross-region Multi-AZ deployment' là khái niệm KHÔNG TỒN TẠI — Multi-AZ luôn nằm trong PHẠM VI 1 Region.</li><li><b>B. ✓</b> Đúng: RDS Multi-AZ cho SQL Server dùng Database Mirroring/Always On, tự động failover, managed hoàn toàn bởi AWS — đúng cả 2 tiêu chí HA và ít vận hành.</li><li><b>C. ✗</b> Read Replica tối ưu khả năng ĐỌC, không cải thiện được AVAILABILITY khi instance chính gặp sự cố.</li><li><b>D. ✗</b> Tự host SQL Server trên EC2 đòi hỏi tự quản lý OS/DB patching — vi phạm thẳng yêu cầu 'ít vận hành nhất'.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 'Cross-region Multi-AZ' là cụm từ nghe rất thuyết phục (kết hợp 2 khái niệm quen thuộc) nhưng là một khái niệm BỊA — Multi-AZ về bản chất luôn giới hạn trong 1 Region.</p>","tip":"<p>Cảnh giác với các cụm từ ghép 2 khái niệm quen thuộc nghe hợp lý nhưng không tồn tại trong thực tế (vd 'cross-region Multi-AZ'); Multi-AZ = HA trong 1 Region, multi-Region = Read Replica/Global Database/Global Tables.</p>"},{"id":59,"topic":"Design Secure Architectures – CloudFormation Security Group YAML snippet","supplement":false,"stem":"What does this AWS CloudFormation snippet do? (Select three)<pre class=\"code\">SecurityGroupIngress:\n     - IpProtocol: tcp\n       FromPort: 80\n       ToPort: 80\n       CidrIp: 0.0.0.0/0\n     - IpProtocol: tcp\n       FromPort: 22\n       ToPort: 22\n       CidrIp: 192.168.1.1/32</pre>","options":[{"html":"It configures the inbound rules of a network access control list (network ACL)","correct":false},{"html":"It only allows the IP 0.0.0.0 to reach HTTP","correct":false},{"html":"It configures a security group's inbound rules","correct":true},{"html":"It configures a security group's outbound rules","correct":false},{"html":"It allows any IP to pass through on the HTTP port","correct":true},{"html":"It prevents traffic from reaching on HTTP unless from the IP 192.168.1.1","correct":false},{"html":"It lets traffic flow from one IP on port 22","correct":true}],"multi":3,"analysis":"<p>Đọc đúng cú pháp YAML/CIDR của CloudFormation Security Group</p>","answer":"<p>Snippet định nghĩa 2 rule Ingress của Security Group: (1) cho mọi IP vào port 80, (2) chỉ cho 192.168.1.1 vào port 22 — mỗi dấu '-' là 1 rule độc lập.</p>","explain":"<ul><li><b>A. ✗</b> 'SecurityGroupIngress' là thuộc tính của resource Security Group, không phải của Network ACL.</li><li><b>B. ✗</b> 0.0.0.0/0 nghĩa là MỌI địa chỉ IP, không phải địa chỉ cụ thể '0.0.0.0'.</li><li><b>C. ✓</b> Đúng: 'SecurityGroupIngress' định nghĩa các rule INBOUND của 1 Security Group.</li><li><b>D. ✗</b> Đây là Ingress (inbound), không phải Egress (outbound) — phát biểu sai chiều.</li><li><b>E. ✓</b> Đúng: rule đầu (0.0.0.0/0, port 80) cho phép BẤT KỲ IP nào truy cập port HTTP.</li><li><b>F. ✗</b> Sai: rule không hề 'chặn' theo điều kiện phủ định như phát biểu này mô tả — đây là 2 rule ALLOW độc lập.</li><li><b>G. ✓</b> Đúng: rule thứ hai (192.168.1.1/32, port 22) chỉ cho phép đúng 1 địa chỉ IP đó qua port 22.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 0.0.0.0/0 hay bị đọc nhầm thành 'chỉ IP 0.0.0.0' thay vì đúng nghĩa 'mọi địa chỉ IP'; và SecurityGroupIngress hay bị nhầm với NACL dù tên thuộc tính đã ghi rõ 'SecurityGroup'.</p>","tip":"<p>0.0.0.0/0 luôn có nghĩa là 'mọi IP', không phải một địa chỉ cụ thể. Tên thuộc tính CloudFormation (SecurityGroupIngress/Egress, NetworkAclEntry...) luôn chỉ rõ loại tài nguyên đang cấu hình.</p>"},{"id":60,"topic":"Design Secure Architectures – ALB health check vs Security Group misconfiguration","supplement":false,"stem":"An Elastic Load Balancer has marked all the Amazon EC2 instances in the target group as unhealthy. Surprisingly, when a developer enters the IP address of the Amazon EC2 instances in the web browser, he can access the website.<br>What could be the reason the instances are being marked as unhealthy? (Select two)","options":[{"html":"The route for the health check is misconfigured","correct":true},{"html":"The security group of the Amazon EC2 instance does not allow for traffic from the security group of the Application Load Balancer","correct":true},{"html":"The Amazon Elastic Block Store (Amazon EBS) volumes have been improperly mounted","correct":false},{"html":"You need to attach elastic IP address (EIP) to the Amazon EC2 instances","correct":false},{"html":"Your web-app has a runtime that is not supported by the Application Load Balancer","correct":false}],"multi":2,"analysis":"<p>Chẩn đoán 'unhealthy' khi app vẫn chạy tốt (truy cập IP trực tiếp OK) → luôn là vấn đề giữa ALB và EC2, không phải app</p>","answer":"<p>Vì truy cập trực tiếp qua IP vẫn OK, nguyên nhân chỉ có thể nằm ở ĐƯỜNG health check của ALB: cấu hình sai route/port, hoặc Security Group chặn traffic từ ALB.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: nếu health check trỏ sai path/port, ALB sẽ luôn nhận response lỗi/không phản hồi dù ứng dụng vẫn chạy bình thường.</li><li><b>B. ✓</b> Đúng: SG của EC2 phải cho phép traffic TỪ SG của ALB trên đúng health check port — thiếu rule này khiến request health check bị chặn.</li><li><b>C. ✗</b> Truy cập được qua IP trực tiếp nghĩa là ứng dụng/ổ đĩa hoạt động bình thường — EBS không phải nguyên nhân.</li><li><b>D. ✗</b> EIP không bắt buộc khi dùng Load Balancer — đây là phương án đánh lạc hướng.</li><li><b>E. ✗</b> Không có khái niệm 'ALB không hỗ trợ runtime của web-app' — ALB chỉ hoạt động ở tầng HTTP, không quan tâm runtime phía sau.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> EBS và runtime app là các phương án đánh lạc hướng sang nguyên nhân ỨNG DỤNG, trong khi dữ kiện 'truy cập IP trực tiếp vẫn được' đã loại trừ hoàn toàn khả năng lỗi từ phía ứng dụng.</p>","tip":"<p>Khi app truy cập trực tiếp OK nhưng ALB báo unhealthy → luôn kiểm tra 2 thứ trước tiên: (1) cấu hình đường dẫn/port health check, (2) Security Group của target có cho phép traffic từ SG của Load Balancer hay chưa.</p>"},{"id":61,"topic":"Design Secure Architectures – VPC Gateway Endpoints (S3, DynamoDB)","supplement":false,"stem":"For security purposes, a development team has decided to deploy the Amazon EC2 instances in a private subnet. The team plans to use VPC endpoints so that the instances can access some AWS services securely. The members of the team would like to know about the two AWS services that support Gateway Endpoints.<br>As a solutions architect, which of the following services would you suggest for this requirement? (Select two)","options":[{"html":"Amazon Simple Notification Service (Amazon SNS)","correct":false},{"html":"Amazon S3","correct":true},{"html":"Amazon Simple Queue Service (Amazon SQS)","correct":false},{"html":"Amazon DynamoDB","correct":true},{"html":"Amazon Kinesis","correct":false}],"multi":2,"analysis":"<p>Ghi nhớ đúng 2 dịch vụ DUY NHẤT hỗ trợ Gateway Endpoint (phần còn lại đều là Interface Endpoint)</p>","answer":"<p>Chỉ S3 và DynamoDB hỗ trợ Gateway Endpoint (miễn phí, thêm route vào route table); mọi dịch vụ AWS khác dùng Interface Endpoint (ENI, có phí theo giờ).</p>","explain":"<ul><li><b>A. ✗</b> SNS chỉ hỗ trợ Interface Endpoint, không hỗ trợ Gateway Endpoint.</li><li><b>B. ✓</b> Đúng: Amazon S3 là 1 trong 2 dịch vụ DUY NHẤT hỗ trợ Gateway Endpoint.</li><li><b>C. ✗</b> SQS chỉ hỗ trợ Interface Endpoint, không hỗ trợ Gateway Endpoint.</li><li><b>D. ✓</b> Đúng: Amazon DynamoDB là dịch vụ còn lại hỗ trợ Gateway Endpoint.</li><li><b>E. ✗</b> Kinesis chỉ hỗ trợ Interface Endpoint, không hỗ trợ Gateway Endpoint.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> SNS/SQS/Kinesis đều là dịch vụ 'nền tảng' tương tự S3/DynamoDB về độ phổ biến, dễ khiến người học đoán nhầm rằng chúng cũng hỗ trợ Gateway Endpoint.</p>","tip":"<p>Chỉ cần nhớ ĐÚNG 2 cái tên: S3 và DynamoDB dùng Gateway Endpoint (miễn phí). Tất cả dịch vụ AWS khác (SNS, SQS, Kinesis, v.v.) đều dùng Interface Endpoint (PrivateLink, có phí).</p>"},{"id":62,"topic":"Design Cost-Optimized Architectures – ASG minimum capacity + Reserved Instances","supplement":false,"stem":"As an e-sport tournament hosting company, you have servers that need to scale and be highly available. Therefore you have deployed an Elastic Load Balancing (ELB) with an Auto Scaling group (ASG) across 3 Availability Zones (AZs). When e-sport tournaments are running, the servers need to scale quickly. And when tournaments are done, the servers can be idle. As a general rule, you would like to be highly available, have the capacity to scale and optimize your costs.<br>What do you recommend? (Select two)","options":[{"html":"Set the minimum capacity to 2","correct":true},{"html":"Set the minimum capacity to 1","correct":false},{"html":"Set the minimum capacity to 3","correct":false},{"html":"Use Dedicated hosts for the minimum capacity","correct":false},{"html":"Use Reserved Instances (RIs) for the minimum capacity","correct":true}],"multi":2,"analysis":"<p>Tối ưu chi phí cho phần BASELINE (luôn chạy) + vẫn đủ khả năng chịu lỗi 1 AZ</p>","answer":"<p>Minimum = 2 vừa đủ chịu lỗi 1 AZ mà không lãng phí; vì capacity này luôn duy trì liên tục nên RI là lựa chọn giá tốt hơn On-Demand cho đúng phần baseline đó.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: min=2 đủ để chịu được mất 1 AZ (ASG tự rải đều 2 instance ở 2 AZ khác nhau) mà không tốn thêm chi phí không cần thiết.</li><li><b>B. ✗</b> Min=1 không chịu được sự cố — nếu AZ chứa instance đó lỗi, hệ thống mất khả dụng hoàn toàn.</li><li><b>C. ✗</b> Min=3 tốn thêm chi phí không cần thiết so với mức tối thiểu đã đủ an toàn (2 instance đã đủ chịu mất 1 AZ).</li><li><b>D. ✗</b> Dedicated Host dùng cho compliance/license theo socket, không liên quan tới bài toán baseline capacity + chi phí.</li><li><b>E. ✓</b> Đúng: vì baseline (minimum) LUÔN được duy trì liên tục, dùng Reserved Instances cho phần này tiết kiệm hơn On-Demand.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Min=3 nghe 'an toàn hơn' vì khớp với số AZ (3 AZ) nhưng thực chất lãng phí — chỉ cần 2 instance (rải đều 2 AZ) là đã đủ chịu được mất 1 AZ.</p>","tip":"<p>Baseline capacity luôn duy trì liên tục (minimum của ASG) → dùng Reserved Instances/Savings Plans để tối ưu chi phí; phần scale thêm lúc traffic cao mới cần On-Demand/Spot.</p>"},{"id":63,"topic":"Design Resilient Architectures – EKS Kubernetes Cluster Autoscaler","supplement":false,"stem":"A media company operates a video rendering pipeline on Amazon EKS, where containerized jobs are scheduled using Kubernetes deployments. The application experiences bursty traffic patterns, particularly during peak streaming hours. The platform uses the Kubernetes Horizontal Pod Autoscaler (HPA) to scale pods based on CPU utilization. A solutions architect observes that the total number of EC2 worker nodes remains constant during traffic spikes, even when all nodes are at maximum resource utilization. The company needs a solution that enables automatic scaling of the underlying compute infrastructure when pod demand exceeds cluster capacity.<br>Which solution should the architect implement to resolve this issue with the least operational overhead?","options":[{"html":"Use AWS Fargate to replace the EKS worker nodes with serverless compute profiles, allowing Fargate to scale pods automatically without managing EC2 infrastructure","correct":false},{"html":"Enable Amazon EC2 Auto Scaling with custom CloudWatch alarms based on cluster-wide CPU and memory usage to dynamically adjust node count in the EKS worker node group","correct":false},{"html":"Implement an AWS Lambda function that runs every 10 minutes and checks EKS pod scheduling status. Trigger node scaling manually using the eksctl CLI or AWS SDK if unschedulable pods are detected","correct":false},{"html":"Deploy the Kubernetes Cluster Autoscaler to the EKS cluster. Configure it to integrate with the existing EC2 Auto Scaling group to automatically launch or terminate nodes based on pending pod demands","correct":true}],"multi":1,"analysis":"<p>HPA scale POD nhưng không tự scale NODE — cần thêm tầng Cluster Autoscaler để scale hạ tầng bên dưới</p>","answer":"<p>Cluster Autoscaler giám sát trực tiếp tín hiệu 'pod không schedule được do thiếu tài nguyên' từ Kubernetes scheduler, rồi tự điều chỉnh ASG — đúng và chuẩn nhất theo AWS khuyến nghị.</p>","explain":"<ul><li><b>A. ✗</b> Chuyển hẳn sang Fargate đòi hỏi redesign ứng dụng vì không phải mọi workload (DaemonSet, GPU rendering...) đều tương thích Fargate.</li><li><b>B. ✗</b> CloudWatch alarm theo CPU/memory CẤP EC2 không phản ánh đúng việc pod có bị 'pending/unschedulable' hay không — dễ scale sai thời điểm.</li><li><b>C. ✗</b> Lambda polling mỗi 10 phút + gọi eksctl thủ công là giải pháp TỰ CHẾ, tốn công bảo trì, phản ứng chậm hơn nhiều so với cơ chế có sẵn.</li><li><b>D. ✓</b> Đúng: Cluster Autoscaler theo dõi TRỰC TIẾP pod bị pending do thiếu tài nguyên, rồi tự tăng/giảm ASG tương ứng — đúng cơ chế chuẩn, ít vận hành nhất.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Theo dõi CPU/memory cấp EC2 bằng CloudWatch alarm nghe hợp lý nhưng KHÔNG phản ánh đúng tín hiệu thực sự cần scale (pod pending), dễ dẫn tới scale sai hoặc trễ.</p>","tip":"<p>HPA chỉ scale SỐ LƯỢNG POD trong node hiện có; muốn tự scale SỐ LƯỢNG NODE bên dưới khi pod không đủ chỗ chạy → luôn cần thêm Kubernetes/Karpenter Cluster Autoscaler tích hợp với ASG.</p>"},{"id
