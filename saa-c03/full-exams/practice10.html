{"id":47,"topic":"Design Cost-Optimized Architectures – Snapshot + terminate RDS test instance","supplement":false,"stem":"<p>A company conducts performance testing on a large instance MySQL RDS DB instance twice a week. They use Performance Insights to analyze and fine-tune expensive queries. The company needs to reduce its operational expenses in running the tests without compromising the tests' integrity.</p><p>Which of the following is the most cost-effective solution?</p>","options":[{"html":"Once the testing is completed, take a snapshot of the database and terminate it. Restore the database from the snapshot when necessary.","correct":true},{"html":"Perform a mysqldump to get a copy of the database on a local machine. Use MySQL Workbench to analyze the queries.","correct":false},{"html":"Downgrade the database to a smaller instance.","correct":false},{"html":"Stop the database once the test is done and restart it only when necessary.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Test performance 2 lần/tuần trên instance RDS lớn; phần lớn thời gian còn lại DB không cần chạy — cần giảm chi phí mà vẫn giữ nguyên tính chính xác của test (cùng cấu hình instance thật).</li>\n<li><strong>Yêu cầu chính:</strong> Loại bỏ hoàn toàn chi phí trong thời gian idle, nhưng vẫn khôi phục đúng trạng thái/kích thước instance khi cần test lại.</li>\n<li><strong>Từ khóa cần chú ý:</strong> RDS <strong>stopped vẫn tính phí storage</strong>; chỉ <strong>terminate (sau khi snapshot)</strong> mới ngừng tính phí hoàn toàn.</li>\n</ul>","answer":"<ul>\n<li><strong>Once the testing is completed, take a snapshot of the database and terminate it. Restore the database from the snapshot when necessary.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Snapshot lưu lại toàn bộ trạng thái DB; terminate instance loại bỏ hoàn toàn chi phí (cả compute lẫn storage provisioned) trong lúc idle; restore khi cần test lại — tiết kiệm nhất mà vẫn giữ nguyên tính xác thực của bài test.</li>\n<li><strong>B. ✗</strong> Test trên máy local không mô phỏng đúng tài nguyên/môi trường của RDS instance lớn, có thể cho kết quả không đáng tin cậy — ảnh hưởng \"integrity\" của test.</li>\n<li><strong>C. ✗</strong> Downsize instance có thể khiến kết quả test không phản ánh đúng tải thực tế — vi phạm yêu cầu không ảnh hưởng tính toàn vẹn của test.</li>\n<li><strong>D. ✗</strong> Instance <strong>stop</strong> vẫn tiếp tục bị tính phí storage đã provisioned — không tiết kiệm bằng việc terminate hẳn sau khi đã snapshot.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> \"Stop database\" nghe giống như tiết kiệm chi phí tối đa, nhưng RDS instance ở trạng thái stopped vẫn tính phí storage — chỉ có snapshot + terminate mới loại bỏ hoàn toàn chi phí trong lúc không dùng.</p>","tip":"<p>RDS instance <strong>stopped</strong> vẫn tính phí storage. Muốn ngừng tính phí hoàn toàn trong thời gian dài không dùng → <strong>snapshot rồi terminate</strong>, restore lại khi cần.</p>"},
{"id":48,"topic":"Design Secure Architectures – Custom identity broker cho LDAP không hỗ trợ SAML","supplement":false,"stem":"<p>A company must integrate the Lightweight Directory Access Protocol (LDAP) directory service from the on-premises data center to the AWS VPC using IAM. The identity store which is currently being used is not compatible with SAML.</p><p>Which of the following provides the most valid approach to implement the integration?</p>","options":[{"html":"Develop an on-premises custom identity broker application and use STS to issue short-lived AWS credentials.","correct":true},{"html":"Use IAM roles to rotate the IAM credentials whenever LDAP credentials are updated.","correct":false},{"html":"Use an IAM policy that references the LDAP identifiers and AWS credentials.","correct":false},{"html":"Use AWS IAM Identity Center to manage access between AWS and your LDAP.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Identity store LDAP <strong>không hỗ trợ SAML 2.0</strong> — loại bỏ ngay các giải pháp dựa trên SAML (bao gồm IAM Identity Center).</li>\n<li><strong>Yêu cầu chính:</strong> Chọn cách liên kết LDAP với AWS khi không dùng được SAML.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"not compatible with SAML\" → giải pháp thay thế là <strong>custom identity broker</strong> + AWS STS (AssumeRole/GetFederationToken).</li>\n</ul>","answer":"<ul>\n<li><strong>Develop an on-premises custom identity broker application and use STS to issue short-lived AWS credentials.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Khi identity store không hỗ trợ SAML, AWS khuyến nghị tự xây dựng identity broker: xác thực user qua LDAP, rồi gọi STS (AssumeRole/GetFederationToken) để lấy credential tạm thời cho user truy cập AWS.</li>\n<li><strong>B. ✗</strong> Tự xoay IAM credential thủ công mỗi khi LDAP credential đổi không phải giải pháp liên kết (federation) chuẩn, tốn công sức và không scale.</li>\n<li><strong>C. ✗</strong> IAM policy không có khả năng &quot;tham chiếu&quot; trực tiếp đến LDAP identifier; cần cơ chế federation (SAML hoặc custom broker + STS) thực sự.</li>\n<li><strong>D. ✗</strong> IAM Identity Center chủ yếu hỗ trợ identity provider chuẩn SAML 2.0 — không phù hợp vì đề đã nói rõ identity store không tương thích SAML.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> IAM Identity Center nghe như giải pháp SSO hiện đại nhất nên dễ bị chọn nhầm, nhưng nó chủ yếu dựa trên chuẩn SAML 2.0 — không áp dụng được khi identity store không tương thích SAML như đề đã nêu rõ.</p>","tip":"<p>Identity store không hỗ trợ SAML 2.0, cần liên kết với AWS → xây dựng <strong>custom identity broker application</strong> + <strong>AWS STS</strong> để cấp credential tạm thời.</p>"},
{"id":49,"topic":"Design High-Performing Architectures – RDS Read Replica tăng read throughput","supplement":false,"stem":"<p>A company launched a global news website that is deployed to AWS and is using MySQL RDS. The website has millions of viewers from all over the world, which means that the website has a read-heavy database workload. All database transactions must be ACID compliant to ensure data integrity.</p><p>In this scenario, which of the following is the best option to use to increase the read-throughput on the MySQL database?</p>","options":[{"html":"Use SQS to queue up the requests","correct":false},{"html":"Enable Amazon RDS Read Replicas","correct":true},{"html":"Enable Multi-AZ deployments","correct":false},{"html":"Enable Amazon RDS Standby Replicas","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Workload đọc nhiều (read-heavy), dữ liệu vẫn phải ACID compliant (giữ nguyên relational database MySQL, không chuyển NoSQL).</li>\n<li><strong>Yêu cầu chính:</strong> Tăng read throughput cho MySQL RDS mà vẫn giữ ACID.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Tăng read throughput → <strong>Read Replica</strong> (không phải Multi-AZ, vốn chỉ để HA/failover, không scale read).</li>\n</ul>","answer":"<ul>\n<li><strong>Enable Amazon RDS Read Replicas.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> SQS giúp quản lý hàng đợi request, nhưng bản thân không làm tăng read throughput của database.</li>\n<li><strong>B. ✓</strong> Read Replica tạo thêm bản sao chỉ đọc, san sẻ tải read query khỏi primary, tăng aggregate read throughput — đúng mục tiêu, vẫn giữ ACID vì vẫn là RDS MySQL.</li>\n<li><strong>C. ✗</strong> Multi-AZ chỉ tạo standby để failover (HA), không dùng để phục vụ read traffic trực tiếp.</li>\n<li><strong>D. ✗</strong> \"Standby Replica\" chính là standby instance trong Multi-AZ, không phải cơ chế tăng read throughput.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Multi-AZ và Read Replica đều liên quan đến \"replica\" của database nên dễ nhầm, nhưng Multi-AZ standby <strong>không phục vụ read traffic</strong> (chỉ chờ failover), còn Read Replica mới thực sự giúp tăng read throughput.</p>","tip":"<p>Tăng read throughput cho RDS (vẫn giữ ACID relational) → <strong>Read Replica</strong>. Cần high availability/automatic failover → <strong>Multi-AZ</strong> (khác mục đích hoàn toàn).</p>"},
{"id":50,"topic":"Design Resilient Architectures – EventBridge + AWS Health Dashboard + SNS","supplement":false,"stem":"<p>A company has a fixed set of Amazon EC2 instances inside a VPC in the AWS cloud. The instances run a mission-critical application. In a recent incident, one of the EC2 instances suddenly powered down which affected the availability of the application. To avoid this incident in the future, the management wants to get notified of any upcoming AWS events that may affect these EC2 instances.</p><p>Which of the following options is the recommended action to meet the above requirements?</p>","options":[{"html":"Create an Amazon EventBridge rule that is scheduled to run every 24 hours. Set the target to an AWS Lambda function that will check AWS Health Dashboard and send notifications for any events that may affect EC2 instances.","correct":false},{"html":"Create an Amazon EventBridge rule to check for AWS Health Dashboard events that are related to EC2 instances. To send notifications, set an Amazon SNS topic as a target for the rule.","correct":true},{"html":"Configure an Amazon CloudWatch alarm to monitor the status check metrics of the EC2 instances. Set an Amazon SNS topic as the alarm action to notify the operations team when an instance fails a status check.","correct":false},{"html":"Set up an Amazon EventBridge rule to check for any status change for EC2 instances. Set the target to an AWS Lambda function that will send a notification and restart the affected EC2 instances.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần biết trước (proactive) các <strong>sự kiện AWS sắp xảy ra</strong> (bảo trì, retirement...) có thể ảnh hưởng EC2 instance, không phải chỉ phát hiện <strong>sau khi</strong> sự cố đã xảy ra.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng nguồn sự kiện (AWS Health, không phải status check metric) + đúng cách nhận thông báo (EventBridge trực tiếp trigger SNS).</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"notified of any upcoming AWS events\" → <strong>AWS Health events</strong> qua EventBridge, khác với status check (chỉ phát hiện sự cố đã/đang xảy ra).</li>\n</ul>","answer":"<ul>\n<li><strong>Create an Amazon EventBridge rule to check for AWS Health Dashboard events that are related to EC2 instances. To send notifications, set an Amazon SNS topic as a target for the rule.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> AWS Health Dashboard không hiển thị sự kiện cho <strong>từng instance riêng lẻ</strong> theo cách Lambda có thể tự kiểm tra theo lịch; EventBridge đã có khả năng bắt trực tiếp AWS Health event mà không cần polling 24h/lần.</li>\n<li><strong>B. ✓</strong> EventBridge có native integration với AWS Health — tạo rule bắt sự kiện AWS Health liên quan EC2, target là SNS để gửi thông báo ngay khi có sự kiện <strong>sắp xảy ra</strong> (scheduled maintenance, retirement...).</li>\n<li><strong>C. ✗</strong> CloudWatch status check chỉ phát hiện sự cố <strong>đã xảy ra</strong> (instance/system impairment hiện tại), không phải cảnh báo sự kiện AWS <strong>sắp</strong> diễn ra.</li>\n<li><strong>D. ✗</strong> Theo dõi \"status change\" chỉ biết được sau khi instance đã dừng, không phải cảnh báo trước (upcoming event) như yêu cầu.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> CloudWatch status check nghe hợp lý vì cũng giám sát EC2, nhưng nó chỉ phát hiện sự cố <strong>hiện tại/đã xảy ra</strong>, khác hoàn toàn với AWS Health event vốn báo trước các sự kiện <strong>sắp</strong> ảnh hưởng đến resource.</p>","tip":"<p>Cần cảnh báo <strong>trước</strong> (proactive) về sự kiện AWS sắp ảnh hưởng đến resource (bảo trì, retirement...) → <strong>AWS Health</strong> qua <strong>EventBridge</strong> + SNS, không phải CloudWatch status check (chỉ phát hiện sự cố đã xảy ra).</p>"}
,
{"id":51,"topic":"Design High-Performing Architectures – Unified CloudWatch Agent + Logs Insights","supplement":false,"stem":"<p>There is a new compliance rule in your company that audits every Windows and Linux EC2 instances each month to view any performance issues. They have more than a hundred EC2 instances running in production, and each must have a logging function that collects various system details regarding that instance. The SysOps team will periodically review these logs and analyze their contents using AWS Analytics tools, and the result will need to be retained in an S3 bucket.</p><p>In this scenario, what is the most efficient way to collect and analyze logs from the instances with minimal effort?</p>","options":[{"html":"Install AWS SDK in each instance and create a custom daemon script that would collect and push data to CloudWatch Logs periodically. Enable CloudWatch detailed monitoring and use CloudWatch Logs Insights to analyze the log data of all instances.","correct":false},{"html":"Install the unified CloudWatch Logs agent in each instance which will automatically collect and push data to CloudWatch Logs. Analyze the log data with CloudWatch Logs Insights.","correct":true},{"html":"Install the AWS Systems Manager Agent (SSM Agent) in each instance which will automatically collect and push data to CloudWatch Logs. Analyze the log data with CloudWatch Logs Insights.","correct":false},{"html":"Install AWS Inspector Agent in each instance which will collect and push data to CloudWatch Logs periodically. Set up a CloudWatch dashboard to properly analyze the log data of all instances.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Hàng trăm instance Windows + Linux, cần thu thập log hệ thống <strong>ít công sức nhất</strong>, rồi phân tích bằng AWS Analytics tool.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng agent (hỗ trợ cả 2 OS, ít cấu hình) + đúng công cụ phân tích log có sẵn.</li>\n<li><strong>Từ khóa cần chú ý:</strong> <strong>Unified CloudWatch agent</strong> là lựa chọn khuyến nghị hiện nay (hỗ trợ cả Windows/Linux, thu cả log + metric); <strong>CloudWatch Logs Insights</strong> dùng để query/phân tích log ngay trong CloudWatch.</li>\n</ul>","answer":"<ul>\n<li><strong>Install the unified CloudWatch Logs agent in each instance which will automatically collect and push data to CloudWatch Logs. Analyze the log data with CloudWatch Logs Insights.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Tự viết daemon script + cài AWS SDK tốn nhiều công sức phát triển/bảo trì hơn nhiều so với agent có sẵn; detailed monitoring cũng không cần thiết cho yêu cầu này.</li>\n<li><strong>B. ✓</strong> Unified CloudWatch agent tự động thu thập log + metric từ cả Windows lẫn Linux, cấu hình đơn giản; CloudWatch Logs Insights cho phép query, phân tích log ngay lập tức mà không cần ETL thêm.</li>\n<li><strong>C. ✗</strong> SSM Agent chủ yếu dùng để quản lý/kết nối từ xa instance, không tối ưu cho việc gửi log liên tục như CloudWatch agent — kém hiệu quả hơn cho mục đích này.</li>\n<li><strong>D. ✗</strong> AWS Inspector chỉ là dịch vụ đánh giá bảo mật (lỗ hổng, network exposure), không phải công cụ thu thập log hệ thống.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> SSM Agent nghe quen thuộc và cũng liên quan đến quản lý EC2 nên dễ bị chọn nhầm, nhưng nó không phải giải pháp log collection chuyên dụng — CloudWatch unified agent mới đúng mục đích và hiệu quả hơn.</p>","tip":"<p>Thu thập log + metric hệ thống từ nhiều EC2 (Windows/Linux) hiệu quả nhất → <strong>Unified CloudWatch Agent</strong>. Phân tích log ngay trong CloudWatch bằng SQL-like query → <strong>CloudWatch Logs Insights</strong>.</p>"},
{"id":52,"topic":"Design Resilient Architectures – Redshift Cross-Region Snapshot Copy","supplement":false,"stem":"<p>A data analytics company, which uses machine learning to collect and analyze consumer data, is using Redshift cluster as their data warehouse. You are instructed to implement a disaster recovery plan for their systems to ensure business continuity even in the event of an AWS region outage.</p><p>Which of the following is the best approach to meet this requirement?</p>","options":[{"html":"Create a scheduled job that will automatically take the snapshot of your Redshift Cluster and store it to an S3 bucket. Restore the snapshot in case of an AWS region outage.","correct":false},{"html":"Enable Cross-Region Snapshots Copy in your Amazon Redshift Cluster.","correct":true},{"html":"Do nothing because Amazon Redshift is a highly available, fully-managed data warehouse which can withstand an outage of an entire AWS region.","correct":false},{"html":"Use Automated snapshots of your Redshift Cluster.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần DR cho Redshift cluster, chịu được <strong>mất toàn bộ region</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Dùng tính năng native của Redshift để sao chép snapshot sang region khác tự động.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"region outage\" → cần snapshot ở <strong>region khác</strong>, Redshift có sẵn tính năng <strong>Cross-Region Snapshot Copy</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Enable Cross-Region Snapshots Copy in your Amazon Redshift Cluster.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Tự viết job snapshot thủ công tốn công sức hơn nhiều so với dùng tính năng Cross-Region Snapshot Copy có sẵn của Redshift.</li>\n<li><strong>B. ✓</strong> Cross-Region Snapshot Copy tự động sao chép mọi snapshot (manual lẫn automatic) sang region chỉ định — đúng giải pháp DR cho regional outage, ít công sức nhất.</li>\n<li><strong>C. ✗</strong> Redshift tuy managed và HA trong 1 region, nhưng không tự động chịu được <strong>toàn bộ region outage</strong> nếu không cấu hình Cross-Region Copy.</li>\n<li><strong>D. ✗</strong> Automated snapshot mặc định chỉ lưu trong <strong>cùng region</strong> với cluster, không giúp ích gì khi cả region đó bị down.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Automated Snapshot nghe có vẻ đã đủ \"tự động\" để yên tâm, nhưng nếu không cấu hình thêm Cross-Region Copy thì snapshot vẫn chỉ nằm trong <strong>cùng region</strong> — không giúp được gì khi toàn region đó gặp sự cố.</p>","tip":"<p>DR cho Redshift chịu được region outage → bật <strong>Cross-Region Snapshot Copy</strong> (snapshot mặc định chỉ lưu cùng region, không đủ cho DR đa vùng).</p>"},
{"id":53,"topic":"Design Resilient Architectures – Storage Gateway mở rộng storage on-premises","supplement":false,"stem":"<p>A tech company currently has an on-premises infrastructure. They are currently running low on storage and want to have the ability to extend their storage using the AWS cloud.</p><p>Which AWS service can help them achieve this requirement?</p>","options":[{"html":"Amazon EC2","correct":false},{"html":"AWS Storage Gateway","correct":true},{"html":"Amazon Elastic Block Storage","correct":false},{"html":"Amazon SQS","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Hạ tầng on-premises thiếu dung lượng lưu trữ, muốn <strong>mở rộng (extend)</strong> ra AWS mà vẫn giữ nguyên quy trình làm việc hiện tại.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn dịch vụ hybrid storage phù hợp.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"extend their storage\" từ on-premises sang cloud → <strong>AWS Storage Gateway</strong> (hybrid cloud storage).</li>\n</ul>","answer":"<ul>\n<li><strong>AWS Storage Gateway.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> EC2 là dịch vụ compute, không phải storage.</li>\n<li><strong>B. ✓</strong> Storage Gateway kết nối on-premises với storage trên AWS Cloud (qua NFS/SMB/iSCSI tùy loại gateway), mở rộng dung lượng lưu trữ một cách liền mạch.</li>\n<li><strong>C. ✗</strong> EBS chỉ dùng làm storage gắn cho EC2 instance, không dùng để mở rộng storage on-premises.</li>\n<li><strong>D. ✗</strong> SQS là dịch vụ hàng đợi tin nhắn, hoàn toàn không liên quan đến lưu trữ dữ liệu.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> EBS dễ bị nhầm là \"dịch vụ lưu trữ\" tổng quát, nhưng EBS chỉ là volume gắn cho EC2 instance, không có cơ chế kết nối với hạ tầng on-premises như Storage Gateway.</p>","tip":"<p>Mở rộng dung lượng lưu trữ on-premises bằng AWS Cloud (hybrid storage) → <strong>AWS Storage Gateway</strong>.</p>"},
{"id":54,"topic":"Design Resilient Architectures – RDS Multi-AZ cho automatic failover","supplement":false,"stem":"<p>A Solutions Architect is designing a setup for a database that will run on Amazon RDS for MySQL. He needs to ensure that the database can automatically failover to an RDS instance to continue operating in the event of failure. The architecture should also be as highly available as possible.</p><p>Which among the following actions should the Solutions Architect do?</p>","options":[{"html":"Create five cross-region read replicas in each region. In the event of an Availability Zone outage, promote any replica to become the primary instance.","correct":false},{"html":"Create a standby replica in another availability zone by enabling Multi-AZ deployment.","correct":true},{"html":"Create a read replica in the same region where the DB instance resides. In addition, create a read replica in a different region to survive a region's failure. In the event of an Availability Zone outage, promote any replica to become the primary instance.","correct":false},{"html":"Create five read replicas across different availability zones. In the event of an Availability Zone outage, promote any replica to become the primary instance.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần <strong>automatic failover</strong> (không phải thao tác thủ công promote replica) + tính sẵn sàng cao.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn giải pháp có failover <strong>tự động</strong> tích hợp sẵn trong RDS.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"automatically fail over\" → chỉ <strong>Multi-AZ deployment</strong> có cơ chế failover tự động; Read Replica cần thao tác thủ công promote.</li>\n</ul>","answer":"<ul>\n<li><strong>Create a standby replica in another availability zone by enabling Multi-AZ deployment.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Cross-region read replica tăng khả năng chịu lỗi theo region, nhưng việc promote vẫn phải làm <strong>thủ công</strong> — không đáp ứng yêu cầu \"automatic failover\".</li>\n<li><strong>B. ✓</strong> Multi-AZ tạo standby instance đồng bộ (synchronous) ở AZ khác; khi primary gặp sự cố, RDS <strong>tự động</strong> failover sang standby — đáp ứng đúng cả 2 yêu cầu.</li>\n<li><strong>C. ✗</strong> Dù có read replica đa region, việc chuyển đổi khi có sự cố vẫn là thao tác thủ công (promote), không tự động.</li>\n<li><strong>D. ✗</strong> Tương tự A và C, promote read replica luôn là hành động thủ công, không phải automatic failover.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Các phương án dùng Read Replica nghe có vẻ \"sẵn sàng cao\" vì có nhiều bản sao, nhưng Read Replica <strong>luôn cần thao tác thủ công để promote</strong> — chỉ Multi-AZ mới có cơ chế failover hoàn toàn tự động.</p>","tip":"<p>Cần <strong>automatic failover</strong> cho RDS → luôn chọn <strong>Multi-AZ deployment</strong> (Read Replica chỉ hỗ trợ promote thủ công, không tự động).</p>"},
{"id":55,"topic":"Design Secure Architectures – Security Group cho FTP (TCP 20-21)","supplement":false,"stem":"<p>A startup launched a new FTP server using an On-Demand EC2 instance in a newly created VPC with default settings. The server should not be accessible publicly but only through the IP address 175.45.116.100 and nowhere else.</p><p>Which of the following is the most suitable way to implement this requirement?</p>","options":[{"html":"Create a new inbound rule in the security group of the EC2 instance with the following details:<br>Protocol: TCP<br>Port Range: 20 – 21<br>Source: 175.45.116.100/32","correct":true},{"html":"Create a new inbound rule in the security group of the EC2 instance with the following details:<br>Protocol: UDP<br>Port Range: 20 – 21<br>Source: 175.45.116.100/32","correct":false},{"html":"Create a new Network ACL inbound rule in the subnet of the EC2 instance with the following details:<br>Protocol: UDP<br>Port Range: 20 – 21<br>Source: 175.45.116.100/0<br>Allow/Deny: ALLOW","correct":false},{"html":"Create a new Network ACL inbound rule in the subnet of the EC2 instance with the following details:<br>Protocol: TCP<br>Port Range: 20 – 21<br>Source: 175.45.116.100/0<br>Allow/Deny: ALLOW","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> VPC mới tạo với default settings → NACL mặc định đã <strong>cho phép toàn bộ traffic</strong> (không cần chỉnh sửa NACL); chỉ cần cấu hình Security Group.</li>\n<li><strong>Yêu cầu chính:</strong> Giới hạn FTP (TCP port 20-21) chỉ từ đúng 1 IP cụ thể.</li>\n<li><strong>Từ khóa cần chú ý:</strong> FTP dùng <strong>TCP</strong> (không phải UDP); chỉ 1 IP → <code>/32</code> (không phải <code>/0</code>, nghĩa là toàn bộ mạng).</li>\n</ul>","answer":"<ul>\n<li><strong>Create a new inbound rule in the security group of the EC2 instance with the following details: Protocol: TCP, Port Range: 20 – 21, Source: 175.45.116.100/32.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Đúng protocol (TCP cho FTP), đúng port (20-21), đúng CIDR (<code>/32</code> = chỉ 1 IP), đúng loại firewall (Security Group ở mức instance). VPC mặc định NACL đã cho phép mọi traffic nên không cần chỉnh thêm.</li>\n<li><strong>B. ✗</strong> FTP dùng TCP, không phải UDP — sai protocol.</li>\n<li><strong>C. ✗</strong> Sai cả protocol (UDP thay vì TCP) lẫn CIDR (<code>/0</code> = toàn bộ mạng, không phải 1 IP cụ thể); NACL cũng là lớp dư thừa không cần chỉnh khi VPC dùng default settings.</li>\n<li><strong>D. ✗</strong> Protocol đúng (TCP) nhưng CIDR sai (<code>/0</code> thay vì <code>/32</code>); NACL mặc định của VPC mới đã cho phép toàn bộ traffic nên không cần sửa thêm ở đây.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm <code>/0</code> (toàn bộ dải mạng, 0.0.0.0/0 nếu viết đủ) với <code>/32</code> (đúng 1 địa chỉ IP) — đây là lỗi CIDR rất phổ biến khi đọc nhanh đề thi.</p>","tip":"<p>VPC mới với default settings → NACL mặc định đã cho phép mọi traffic, không cần chỉnh. FTP = TCP port 20-21. Giới hạn đúng 1 IP → dùng <code>/32</code>.</p>"},
{"id":56,"topic":"Design Resilient Architectures – Athena/Redshift Spectrum/Glue phân tích trực tiếp trên S3","supplement":false,"stem":"<p>A real-time data analytics application is using AWS Lambda to process data and store results in JSON format to an S3 bucket. To speed up the existing workflow, you have to use a service where you can run sophisticated Big Data analytics on your data without moving them into a separate analytics system.</p><p>Which of the following group of services can you use to meet this requirement?</p>","options":[{"html":"Amazon Neptune, DynamoDB DAX, Amazon Redshift Spectrum","correct":false},{"html":"Amazon Glue, Amazon Redshift, Amazon S3","correct":false},{"html":"Amazon X-Ray, Amazon Neptune, DynamoDB","correct":false},{"html":"Amazon Athena, Amazon Redshift Spectrum, AWS Glue","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Dữ liệu JSON đã nằm sẵn trong S3; cần phân tích Big Data <strong>trực tiếp trên S3</strong>, không di chuyển (move) dữ liệu sang hệ thống riêng.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng nhóm dịch vụ cho phép query/transform dữ liệu ngay tại chỗ trên S3.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"without moving them into a separate analytics system\" → <strong>Athena</strong> (query trực tiếp S3), <strong>Redshift Spectrum</strong> (query S3 từ Redshift mà không cần load), <strong>Glue</strong> (ETL/catalog cho S3).</li>\n</ul>","answer":"<ul>\n<li><strong>Amazon Athena, Amazon Redshift Spectrum, AWS Glue.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Neptune (graph database) và DynamoDB DAX (cache) không hỗ trợ query/phân tích dữ liệu trong S3.</li>\n<li><strong>B. ✗</strong> Redshift (không phải Spectrum) yêu cầu <strong>load dữ liệu vào cluster</strong> trước khi query — vi phạm đúng điều kiện \"without moving data\" của đề.</li>\n<li><strong>C. ✗</strong> X-Ray chỉ là dịch vụ tracing/debugging ứng dụng, không liên quan đến phân tích dữ liệu S3.</li>\n<li><strong>D. ✓</strong> Athena query trực tiếp S3 bằng SQL; Redshift Spectrum mở rộng khả năng Redshift để query thẳng dữ liệu trong S3 (không cần load trước); Glue hỗ trợ catalog/transform dữ liệu ngay trong S3 — cả 3 đều đúng \"phân tích tại chỗ, không di chuyển dữ liệu\".</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Đáp án B dễ gây nhầm vì cũng có Glue và S3 đúng, nhưng <strong>Redshift</strong> (không phải Redshift Spectrum) yêu cầu load dữ liệu vào cluster trước khi phân tích — trái với yêu cầu \"không di chuyển dữ liệu\".</p>","tip":"<p>Phân tích Big Data trực tiếp trên dữ liệu nằm sẵn trong S3, không cần di chuyển → <strong>Amazon Athena</strong>, <strong>Redshift Spectrum</strong>, <strong>AWS Glue</strong> (phân biệt với Redshift thường, vốn cần load data vào cluster).</p>"},
{"id":57,"topic":"Design High-Performing Architectures – Phân loại đúng EBS volume type","supplement":false,"stem":"<p>A technical lead of the Cloud Infrastructure team was consulted by a software developer regarding the required AWS resources of the web application that he is building. The developer knows that an Instance Store only provides ephemeral storage where the data is automatically deleted when the instance is terminated. To ensure that the data of the web application persists, the app should be launched in an EC2 instance that has a durable, block-level storage volume attached. The developer knows that they need to use an EBS volume, but they are not sure what type they need to use.</p><p>In this scenario, which of the following is true about Amazon EBS volume types and their respective usage? (Select TWO.)</p>","options":[{"html":"Spot volumes provide the lowest cost per gigabyte of all EBS volume types and are ideal for workloads where data is accessed infrequently, and applications where the lowest storage cost is important.","correct":false},{"html":"General Purpose SSD (gp3) volumes with multi-attach enabled offer consistent and low-latency performance, and are designed for applications requiring multi-az resiliency.","correct":false},{"html":"Provisioned IOPS volumes offer storage with consistent and low-latency performance, and are designed for I/O intensive applications such as large relational or NoSQL databases.","correct":true},{"html":"Magnetic volumes provide the lowest cost per gigabyte of all EBS volume types and are ideal for workloads where data is accessed infrequently, and applications where the lowest storage cost is important.","correct":true},{"html":"Single root I/O virtualization (SR-IOV) volumes are suitable for a broad range of workloads, including small to medium-sized databases, development and test environments, and boot volumes.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Kiểm tra kiến thức đúng/sai về các loại EBS volume type và use case tương ứng.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn 2 phát biểu đúng về EBS volume type.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Không có loại EBS nào tên \"Spot volume\"; multi-attach chỉ hỗ trợ trên io1/io2 (không phải gp3) và chỉ trong <strong>cùng 1 AZ</strong> (không phải multi-AZ); SR-IOV là tính năng Enhanced Networking, không phải loại EBS.</li>\n</ul>","answer":"<ul>\n<li><strong>Provisioned IOPS volumes offer storage with consistent and low-latency performance, and are designed for I/O intensive applications such as large relational or NoSQL databases.</strong></li>\n<li><strong>Magnetic volumes provide the lowest cost per gigabyte of all EBS volume types and are ideal for workloads where data is accessed infrequently, and applications where the lowest storage cost is important.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Không hề tồn tại loại EBS nào tên \"Spot volume\" — Spot chỉ là purchasing option của EC2 instance, không áp dụng cho EBS.</li>\n<li><strong>B. ✗</strong> Multi-attach chỉ khả dụng trên <strong>io1/io2 block express</strong> (không phải gp3), và chỉ cho phép attach nhiều instance <strong>trong cùng 1 AZ</strong>, không phải multi-AZ resiliency.</li>\n<li><strong>C. ✓</strong> Provisioned IOPS (io1/io2) đúng là loại thiết kế cho ứng dụng I/O-intensive như database quan hệ/NoSQL lớn, hiệu năng ổn định, độ trễ thấp.</li>\n<li><strong>D. ✓</strong> Magnetic (Previous Generation) đúng là loại EBS rẻ nhất mỗi GB, phù hợp dữ liệu ít truy cập.</li>\n<li><strong>E. ✗</strong> SR-IOV là công nghệ Enhanced Networking của EC2 (tăng tốc network), hoàn toàn không liên quan đến EBS.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Các phương án sai đều chèn 1 thuật ngữ AWS có thật nhưng gán sai ngữ cảnh (\"Spot\" cho EBS, SR-IOV cho EBS, multi-attach gp3) — cần nhớ chính xác thuật ngữ nào gắn với dịch vụ/tính năng nào.</p>","tip":"<p>EBS có 2 nhóm chính: SSD (gp2/gp3 — cân bằng; io1/io2 — IOPS cao, multi-attach chỉ trong 1 AZ) và HDD (st1, sc1, Magnetic — rẻ nhất, cho dữ liệu ít truy cập).</p>"},
{"id":58,"topic":"Design Secure Architectures – S3 Requester Pays giảm chi phí data transfer","supplement":false,"stem":"<p>An online survey startup is collecting real estate data in the United States for several years. The startup already has a total of 5 TB of data stored in an Amazon S3 bucket located in the us-east-1 Region. All real estate data must be shared with a European AWS Managed Service Provider (MSP) Partner which also uses Amazon S3 for storage. Due to budget constraints, the startup must keep its data transfer costs in S3 as low as possible and disable anonymous access.</p><p>Which solution meets this requirement MOST cost-effectively?</p>","options":[{"html":"Enable S3 Object Lock in governance mode to lower data transfer costs and set a Legal Hold for each object to disable anonymous access","correct":false},{"html":"Enable the Requester Pays feature on the Amazon S3 bucket to lower data transfer costs and disable anonymous access","correct":true},{"html":"Enable Cross-Region Replication(CRR) on the startup's S3 bucket to automatically copy the S3 content to the partner's S3 bucket in Europe.","correct":false},{"html":"Enable cross-account access of the startup's S3 bucket to allow the data downloads and exclusive access from the partner's AWS account","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Đối tác (European MSP) tải dữ liệu từ bucket của startup; startup muốn <strong>không phải trả phí data transfer</strong> cho việc đó, đồng thời tắt anonymous access.</li>\n<li><strong>Yêu cầu chính:</strong> Chuyển chi phí data transfer sang người tải (requester), không phải người sở hữu bucket.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"keep data transfer costs... as low as possible\" cho bucket owner + disable anonymous access → đúng tính năng <strong>Requester Pays</strong> (requester trả phí, bắt buộc phải authenticated request, không còn anonymous access).</li>\n</ul>","answer":"<ul>\n<li><strong>Enable the Requester Pays feature on the Amazon S3 bucket to lower data transfer costs and disable anonymous access.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Object Lock chỉ ngăn xóa/ghi đè object, không có tác dụng gì đến chi phí data transfer.</li>\n<li><strong>B. ✓</strong> Requester Pays chuyển chi phí data transfer/request sang bên tải dữ liệu (ở đây là đối tác); đồng thời bật tính năng này tự động <strong>vô hiệu hóa anonymous access</strong> (yêu cầu phải authenticate).</li>\n<li><strong>C. ✗</strong> CRR làm <strong>tăng thêm</strong> chi phí data transfer (DTO liên vùng) cho chính startup, đi ngược lại mục tiêu giảm chi phí.</li>\n<li><strong>D. ✗</strong> Dù cấp cross-account access, bucket owner (startup) vẫn là bên chịu phí data transfer theo mặc định — không giải quyết được vấn đề chi phí.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Cross-Region Replication nghe hợp lý để \"chia sẻ dữ liệu\" với đối tác ở châu Âu, nhưng CRR lại <strong>tăng thêm</strong> chi phí data transfer cho chính startup, trái ngược hoàn toàn với mục tiêu đề bài.</p>","tip":"<p>Muốn người <strong>tải dữ liệu</strong> (không phải bucket owner) trả phí data transfer + tự động tắt anonymous access → bật <strong>S3 Requester Pays</strong>.</p>"}
,
{"id":59,"topic":"Design High-Performing Architectures – CloudFront + ElastiCache giảm latency website","supplement":false,"stem":"<p>A company has a global news website hosted in a fleet of EC2 Instances. Lately, the load on the website has increased which resulted in slower response time for the site visitors. This issue impacts the revenue of the company as some readers tend to leave the site if it does not load after 10 seconds. The goal is to address the issue in a cost-effective manner.</p><p>Which of the below services in AWS can be used to solve this problem? (Select TWO.)</p>","options":[{"html":"Use Amazon CloudFront with website as the custom origin.","correct":true},{"html":"For better read throughput, use AWS Storage Gateway to distribute the content across multiple regions.","correct":false},{"html":"Deploy the website to all regions in different VPCs for faster processing.","correct":false},{"html":"Use Amazon ElastiCache for the website's in-memory data store or cache.","correct":true},{"html":"Use Amazon RDS Multi-AZ deployments for database read scalability.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Website đọc nhiều (news site), user toàn cầu, đang chậm vì tải cao, cần giải pháp <strong>cost-effective</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn 2 dịch vụ cải thiện tốc độ phản hồi hiệu quả về chi phí.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Nội dung chủ yếu read-only, phân phối toàn cầu → <strong>CloudFront</strong> (CDN); giảm tải truy vấn lặp lại → <strong>ElastiCache</strong> (in-memory cache).</li>\n</ul>","answer":"<ul>\n<li><strong>Use Amazon CloudFront with website as the custom origin.</strong></li>\n<li><strong>Use Amazon ElastiCache for the website's in-memory data store or cache.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> CloudFront cache nội dung tại Edge Location gần user toàn cầu, giảm đáng kể latency khi truy cập.</li>\n<li><strong>B. ✗</strong> Storage Gateway chỉ là dịch vụ hybrid storage, không có chức năng phân phối nội dung đa vùng để giảm latency.</li>\n<li><strong>C. ✗</strong> Deploy toàn bộ website ra nhiều region cực kỳ tốn kém và phức tạp — không cần thiết khi CloudFront + ElastiCache đã giải quyết được vấn đề với chi phí thấp hơn nhiều.</li>\n<li><strong>D. ✓</strong> ElastiCache cache kết quả truy vấn thường xuyên (read-heavy), giảm tải cho backend/database, tăng tốc độ phản hồi.</li>\n<li><strong>E. ✗</strong> Multi-AZ RDS chủ yếu phục vụ high availability/failover, không trực tiếp cải thiện tốc độ phản hồi của website.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Multi-AZ RDS nghe có vẻ liên quan đến \"database scalability\" nên dễ bị chọn nhầm, nhưng Multi-AZ chỉ phục vụ HA/failover, không cải thiện được tốc độ đọc hay giảm latency cho user.</p>","tip":"<p>Website toàn cầu, nội dung read-heavy, cần giảm latency chi phí thấp → kết hợp <strong>CloudFront</strong> (CDN cho static/dynamic content) + <strong>ElastiCache</strong> (cache dữ liệu truy vấn).</p>"},
{"id":60,"topic":"Design High-Performing Architectures – DynamoDB Auto Scaling chống throttle","supplement":false,"stem":"<p>A popular augmented reality (AR) mobile game is heavily using a RESTful API which is hosted in AWS. The API uses Amazon API Gateway and a DynamoDB table with a preconfigured read and write capacity. Based on your systems monitoring, the DynamoDB table begins to throttle requests during high peak loads which causes the slow performance of the game.</p><p>Which of the following can you do to improve the performance of your app?</p>","options":[{"html":"Integrate an Application Load Balancer with your DynamoDB table.","correct":false},{"html":"Add the DynamoDB table to an Auto Scaling Group.","correct":false},{"html":"Use DynamoDB Auto Scaling","correct":true},{"html":"Create an SQS queue in front of the DynamoDB table.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> DynamoDB table dùng provisioned capacity cố định, bị throttle khi tải tăng đột biến.</li>\n<li><strong>Yêu cầu chính:</strong> Giải pháp để capacity tự co giãn theo traffic thực tế, tránh throttle.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"throttle during high peak loads\" + provisioned capacity cố định → <strong>DynamoDB Auto Scaling</strong> (tự điều chỉnh RCU/WCU theo traffic pattern).</li>\n</ul>","answer":"<ul>\n<li><strong>Use DynamoDB Auto Scaling.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> ALB dùng để phân phối traffic HTTP đến target như EC2/Lambda, không tương thích và không tăng throughput cho DynamoDB table.</li>\n<li><strong>B. ✗</strong> Auto Scaling Group chỉ áp dụng cho EC2 instance, không áp dụng được cho DynamoDB table.</li>\n<li><strong>C. ✓</strong> DynamoDB Auto Scaling dùng Application Auto Scaling để tự động tăng/giảm RCU/WCU theo traffic thực tế, tránh throttle khi tải tăng đột biến mà vẫn tiết kiệm chi phí lúc tải thấp.</li>\n<li><strong>D. ✗</strong> SQS chỉ giúp queue/polling request, không trực tiếp làm tăng throughput thực tế của DynamoDB table.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nghĩ đến việc thêm 1 lớp trung gian (ALB, SQS) để \"giảm tải\" cho DynamoDB, nhưng những giải pháp này không trực tiếp tăng provisioned throughput — chỉ Auto Scaling mới điều chỉnh đúng capacity thực sự của bảng.</p>","tip":"<p>DynamoDB table bị throttle vì provisioned capacity cố định không theo kịp traffic thực tế → bật <strong>DynamoDB Auto Scaling</strong>.</p>"},
{"id":61,"topic":"Design Secure Architectures – Amazon Athena query CSV trên S3","supplement":false,"stem":"<p>A company decided to change its third-party data analytics tool to a cheaper solution. They sent a full data export on a CSV file which contains all of their analytics information. You then save the CSV file to an S3 bucket for storage. Your manager asked you to do some validation on the provided data export.</p><p>In this scenario, what is the most cost-effective and easiest way to analyze export data using standard SQL?</p>","options":[{"html":"Use mysqldump client utility to load the CSV export file from S3 to a MySQL RDS instance. Run some SQL queries once the data has been loaded to complete your validation.","correct":false},{"html":"Use a migration tool to load the CSV export file from S3 to a database that is designed for online analytic processing (OLAP) such as AWS RedShift. Run some queries once the data has been loaded to complete your validation.","correct":false},{"html":"Create a migration tool to load the CSV export file from S3 to a DynamoDB instance. Once the data has been loaded, run queries using DynamoDB.","correct":false},{"html":"To be able to run SQL queries, use Amazon Athena to analyze the export data file in S3.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> File CSV đã có sẵn trên S3, chỉ cần validate 1 lần bằng SQL — không cần thiết lập database lâu dài.</li>\n<li><strong>Yêu cầu chính:</strong> Chạy SQL trên dữ liệu S3 với chi phí thấp nhất, đơn giản nhất (không cần load vào database riêng).</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"analyze export data using standard SQL\" + dữ liệu đã nằm sẵn trong S3 → <strong>Amazon Athena</strong> (serverless, trả phí theo query).</li>\n</ul>","answer":"<ul>\n<li><strong>To be able to run SQL queries, use Amazon Athena to analyze the export data file in S3.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Phải load dữ liệu vào RDS trước khi query — tốn thêm chi phí/thời gian thiết lập instance không cần thiết cho việc chỉ validate 1 lần.</li>\n<li><strong>B. ✗</strong> Redshift cũng cần load dữ liệu vào cluster trước, tốn kém và không cần thiết hơn so với Athena (query trực tiếp tại chỗ).</li>\n<li><strong>C. ✗</strong> DynamoDB không hỗ trợ SQL truyền thống (dùng API riêng); phải xây migration tool để load dữ liệu, không đơn giản.</li>\n<li><strong>D. ✓</strong> Athena query trực tiếp file CSV trong S3 bằng SQL chuẩn, serverless, trả phí theo từng query chạy — không cần thiết lập hay duy trì hạ tầng database nào.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Các đáp án đều yêu cầu \"load dữ liệu vào 1 database\" trước khi query, nghe có vẻ hợp lý theo quy trình truyền thống, nhưng với nhu cầu chỉ validate 1 lần, Athena cho phép query ngay lập tức mà không cần bước load dữ liệu nào.</p>","tip":"<p>Cần chạy SQL nhanh, rẻ, không cần setup database, trên dữ liệu đã có sẵn trong S3 (CSV/JSON/Parquet...) → <strong>Amazon Athena</strong>.</p>"},
{"id":62,"topic":"Design High-Performing Architectures – RDS Read Replica cho OLTP + báo cáo","supplement":false,"stem":"<p>A company has an OLTP (Online Transactional Processing) application that is hosted in an Amazon ECS cluster using the Fargate launch type. It has an Amazon RDS database that stores data of its production website. The Data Analytics team needs to run queries against the database to track and audit all user transactions. These query operations against the production database must not impact application performance in any way.</p><p>Which of the following is the MOST suitable and cost-effective solution that you should implement?</p>","options":[{"html":"Set up a new Amazon RDS Read Replica of the production database. Direct the Data Analytics team to query the production data from the replica.","correct":true},{"html":"Upgrade the instance type of the RDS database to a large instance.","correct":false},{"html":"Set up a Multi-AZ deployments configuration of your production database in RDS. Direct the Data Analytics team to query the production data from the standby instance.","correct":false},{"html":"Set up a new Amazon Redshift database cluster. Migrate the product database into Redshift and allow the Data Analytics team to fetch data from it.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Team Analytics cần query dữ liệu production nhưng <strong>không được ảnh hưởng</strong> hiệu năng ứng dụng OLTP chính.</li>\n<li><strong>Yêu cầu chính:</strong> Tách truy vấn phân tích ra khỏi database chính mà vẫn giữ đúng tính chất OLTP (không cần chuyển sang OLAP), chi phí hợp lý.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"must not impact application performance\" + vẫn là dữ liệu <strong>giao dịch (OLTP)</strong> → <strong>Read Replica</strong> (không phải Redshift, vốn cho OLAP; không phải Multi-AZ standby, vốn không query trực tiếp được).</li>\n</ul>","answer":"<ul>\n<li><strong>Set up a new Amazon RDS Read Replica of the production database. Direct the Data Analytics team to query the production data from the replica.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Read Replica là bản sao chỉ đọc riêng biệt; team Analytics query trên replica này hoàn toàn không ảnh hưởng đến instance production — đúng mục đích, chi phí hợp lý hơn các lựa chọn khác.</li>\n<li><strong>B. ✗</strong> Upgrade instance lớn hơn tốn kém hơn nhiều, và vẫn không tách biệt được query phân tích khỏi production — vẫn có rủi ro ảnh hưởng hiệu năng chung.</li>\n<li><strong>C. ✗</strong> Standby instance trong Multi-AZ không thể query trực tiếp trong điều kiện bình thường — chỉ dùng khi failover xảy ra.</li>\n<li><strong>D. ✗</strong> Redshift dành cho OLAP, trong khi dữ liệu ở đây vẫn cần tính chất OLTP; di chuyển toàn bộ sang Redshift là thừa, tốn kém và sai mục đích sử dụng.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm Multi-AZ standby instance với Read Replica — standby chỉ dùng cho failover (không query trực tiếp được), còn Read Replica mới cho phép chạy query độc lập mà không ảnh hưởng production.</p>","tip":"<p>Cần tách query phân tích/audit khỏi production OLTP mà không ảnh hưởng hiệu năng, chi phí hợp lý → <strong>RDS Read Replica</strong> (không phải Multi-AZ standby hay chuyển hẳn sang Redshift).</p>"},
{"id":63,"topic":"Design High-Performing Architectures – Lợi ích CloudFormation (IaC)","supplement":false,"stem":"<p>A technology company is building a new cryptocurrency trading platform that allows the buying and selling of Bitcoin, Ethereum, Ripple, Tether, and many others. A Cloud Engineer was hired to build the infrastructure required for this platform. During the first week, the engineer began creating CloudFormation YAML scripts to define all of the AWS resources needed for the application. The manager was shocked that the engineer hadn't set up the EC2 instances, S3 buckets, and other AWS resources immediately. He doesn't understand the purpose of the text-based scripts the engineer has written and has asked for clarification.</p><p>In this scenario, what are the benefits of using Amazon CloudFormation that the manager should know to address his concerns? (Select TWO.)</p>","options":[{"html":"Provides highly durable and scalable data storage","correct":false},{"html":"A storage location for the code of your application","correct":false},{"html":"Enables modeling, provisioning, and version-controlling of your entire AWS infrastructure","correct":true},{"html":"Allows you to model your entire infrastructure in a text file","correct":true},{"html":"Using CloudFormation itself is free, including the AWS resources that have been created.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Quản lý (manager) không hiểu vì sao kỹ sư viết YAML trước khi tạo resource thủ công — cần giải thích lợi ích của Infrastructure as Code (IaC).</li>\n<li><strong>Yêu cầu chính:</strong> Chọn 2 lợi ích đúng của CloudFormation.</li>\n<li><strong>Từ khóa cần chú ý:</strong> CloudFormation bản thân <strong>miễn phí</strong>, nhưng resource được tạo ra vẫn tính phí bình thường; CloudFormation không phải storage hay nơi lưu code ứng dụng.</li>\n</ul>","answer":"<ul>\n<li><strong>Enables modeling, provisioning, and version-controlling of your entire AWS infrastructure.</strong></li>\n<li><strong>Allows you to model your entire infrastructure in a text file.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> CloudFormation không phải là dịch vụ lưu trữ dữ liệu (data storage).</li>\n<li><strong>B. ✗</strong> CloudFormation không dùng để lưu code ứng dụng (application code) — nó chỉ định nghĩa hạ tầng.</li>\n<li><strong>C. ✓</strong> CloudFormation cho phép mô hình hóa, provision, và version-control toàn bộ hạ tầng như một \"nguồn sự thật duy nhất\" (single source of truth), có thể lưu trong hệ thống version control như Git.</li>\n<li><strong>D. ✓</strong> Toàn bộ hạ tầng được định nghĩa trong file text (YAML/JSON), dễ review, tái sử dụng, và tự động hóa triển khai nhiều lần nhất quán.</li>\n<li><strong>E. ✗</strong> Dịch vụ CloudFormation miễn phí, nhưng <strong>các resource AWS được tạo ra</strong> (EC2, S3...) vẫn tính phí như bình thường — phát biểu này sai vì ngụ ý cả resource cũng miễn phí.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Phát biểu E đúng một nửa (CloudFormation service miễn phí) nhưng sai phần còn lại (ngụ ý resource tạo ra cũng miễn phí) — cần đọc kỹ toàn bộ câu, không chỉ phần đầu nghe có vẻ đúng.</p>","tip":"<p>CloudFormation (IaC) giúp: mô hình hóa hạ tầng bằng text file, version-control, triển khai nhất quán, tái sử dụng. Bản thân dịch vụ miễn phí nhưng resource tạo ra vẫn tính phí riêng.</p>"},
{"id":64,"topic":"Design High-Performing Architectures – Elastic Fabric Adapter (EFA) cho HPC","supplement":false,"stem":"<p>An automotive company is working on an autonomous vehicle development and deployment project using AWS. The solution requires High Performance Computing (HPC) in order to collect, store and manage massive amounts of data as well as to support deep learning frameworks. The Linux EC2 instances that will be used should have a lower latency and higher throughput than the TCP transport traditionally used in cloud-based HPC systems. It should also enhance the performance of inter-instance communication and must include an OS-bypass functionality to allow the HPC to communicate directly with the network interface hardware to provide low-latency, reliable transport functionality.</p><p>Which of the following is the MOST suitable solution that you should implement to achieve the above requirements?</p>","options":[{"html":"Attach an Elastic Network Adapter (ENA) on each Amazon EC2 instance to accelerate High Performance Computing (HPC).","correct":false},{"html":"Attach an Elastic Network Interface (ENI) on each Amazon EC2 instance to accelerate High Performance Computing (HPC).","correct":false},{"html":"Attach a Private Virtual Interface (VIF) on each Amazon EC2 instance to accelerate High Performance Computing (HPC).","correct":false},{"html":"Attach an Elastic Fabric Adapter (EFA) on each Amazon EC2 instance to accelerate High Performance Computing (HPC).","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần network device cho HPC Linux instance với <strong>OS-bypass</strong> — ứng dụng giao tiếp trực tiếp với network hardware, bỏ qua kernel.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng network device hỗ trợ OS-bypass, latency thấp hơn TCP truyền thống.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"OS-bypass functionality\" là đặc trưng <strong>chỉ EFA</strong> có, ENA/ENI không có khả năng này.</li>\n</ul>","answer":"<ul>\n<li><strong>Attach an Elastic Fabric Adapter (EFA) on each Amazon EC2 instance to accelerate High Performance Computing (HPC).</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> ENA chỉ cung cấp tính năng networking IP truyền thống, không có OS-bypass như EFA.</li>\n<li><strong>B. ✗</strong> ENI chỉ là network interface logic (virtual network card) cơ bản trong VPC, không có khả năng OS-bypass hay tối ưu cho HPC.</li>\n<li><strong>C. ✗</strong> Private VIF dùng để kết nối riêng tư tới tài nguyên VPC qua Direct Connect, không liên quan đến tăng tốc giao tiếp inter-instance của HPC.</li>\n<li><strong>D. ✓</strong> EFA cung cấp mọi tính năng IP networking của ENA, cộng thêm OS-bypass — cho phép ứng dụng HPC/ML giao tiếp trực tiếp với network hardware, đạt latency thấp và throughput cao hơn TCP truyền thống.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> ENA và EFA dễ bị nhầm vì tên gọi gần giống và đều liên quan networking — nhưng chỉ EFA mới có tính năng OS-bypass đặc trưng cho khối lượng HPC/machine learning.</p>","tip":"<p>Cần OS-bypass, latency thấp, throughput cao cho khối lượng HPC/ML trên EC2 Linux → <strong>Elastic Fabric Adapter (EFA)</strong> (khác với ENA, chỉ có tính năng network IP thông thường).</p>"},
{"id":65,"topic":"Design Secure Architectures – Security Group least privilege dùng SG-to-SG reference","supplement":false,"stem":"<p>A newly hired Solutions Architect is checking all of the security groups and network access control list rules of the company's AWS resources. For security purposes, the MS SQL connection via port 1433 of the database tier should be secured. Below is the security group configuration of their Microsoft SQL Server database:</p><table><tr><th>Type</th><th>Protocol</th><th>Port Range</th><th>Source</th></tr><tr><td>MS SQL</td><td>TCP</td><td>1433</td><td>0.0.0.0/0</td></tr></table><p>The application tier hosted in an Auto Scaling group of EC2 instances is the only identified resource that needs to connect to the database. The Architect should ensure that the architecture complies with the best practice of granting least privilege.</p><p>Which of the following changes should be made to the security group configuration?</p>","options":[{"html":"For the MS SQL rule, change the Source to the Network ACL ID attached to the application tier.","correct":false},{"html":"For the MS SQL rule, change the Source to the EC2 instance IDs of the underlying instances of the Auto Scaling group.","correct":false},{"html":"For the MS SQL rule, change the Source to the security group ID attached to the application tier.","correct":true},{"html":"For the MS SQL rule, change the Source to the static AnyCast IP address attached to the application tier.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> MS SQL rule hiện cho phép <code>0.0.0.0/0</code> (toàn bộ Internet) truy cập port 1433 — vi phạm nghiêm trọng least privilege; chỉ application tier (Auto Scaling group) mới thực sự cần kết nối.</li>\n<li><strong>Yêu cầu chính:</strong> Giới hạn Source chỉ còn đúng application tier, đồng thời tự động cập nhật khi ASG scale (instance mới/cũ thay đổi liên tục).</li>\n<li><strong>Từ khóa cần chú ý:</strong> Nguồn (Source) của 1 Security Group rule có thể là <strong>Security Group ID khác</strong> — tự động áp dụng cho mọi instance hiện tại/tương lai thuộc SG đó, không cần cập nhật thủ công.</li>\n</ul>","answer":"<ul>\n<li><strong>For the MS SQL rule, change the Source to the security group ID attached to the application tier.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> NACL áp dụng cho toàn bộ subnet, không giới hạn chính xác tới riêng application tier — các ứng dụng khác dùng chung subnet cũng bị ảnh hưởng.</li>\n<li><strong>B. ✗</strong> EC2 instance ID thay đổi liên tục khi ASG scale in/out — phải cập nhật thủ công security group mỗi lần, không bền vững.</li>\n<li><strong>C. ✓</strong> Dùng Security Group ID của application tier làm Source: mọi instance hiện tại và tương lai thuộc SG đó tự động được phép kết nối, không cần cập nhật thủ công khi ASG scale — đúng least privilege và tự động hóa.</li>\n<li><strong>D. ✗</strong> Static AnyCast IP là khái niệm của AWS Global Accelerator, không áp dụng được cho cấu hình Source trong security group.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dùng EC2 instance ID nghe có vẻ \"chính xác\" vì chỉ định đúng instance, nhưng Auto Scaling liên tục thêm/bớt instance khiến cách này không khả thi để duy trì lâu dài — dùng Security Group ID mới là giải pháp đúng, tự động mở rộng theo ASG.</p>","tip":"<p>Giới hạn truy cập least-privilege cho tầng đứng sau Auto Scaling Group (số lượng instance thay đổi liên tục) → dùng <strong>Security Group ID</strong> làm Source (không dùng instance ID hay NACL).</p>"}

];
const LETTERS = "ABCDEFGH";
const state = {
  order: Q.map((_, i) => i),
  pos: 0,
  sel: {},        // qid -> Set of original option idx
  done: {},       // qid -> true/false (correct?)
  flags: new Set(),
  perm: {},       // qid -> displayed order of original option indices
  hint: {},
  view: "quiz"
};
const $ = s => document.querySelector(s);

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function perm(q){
  if(!state.perm[q.id]) state.perm[q.id] = $("#optShuffleA").checked ? shuffle(q.options.map((_,i)=>i)) : q.options.map((_,i)=>i);
  return state.perm[q.id];
}
function visible(){
  const f = $("#fFilter").value, t = $("#fTopic").value;
  return state.order.filter(i => {
    const q = Q[i];
    if(t && topicGroup(q.topic) !== t) return false;
    if(f === "todo") return !(q.id in state.done);
    if(f === "bad") return state.done[q.id] === false;
    if(f === "flag") return state.flags.has(q.id);
    if(f === "sup") return q.supplement;
    return true;
  });
}
function topicGroup(t){ return t.split("–")[0].trim(); }

function renderStats(){
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length, bad = vals.length - ok;
  $("#sDone").textContent = `${vals.length}/${Q.length}`;
  $("#sOk").textContent = ok; $("#sBad").textContent = bad;
  $("#sPct").textContent = vals.length ? Math.round(ok*100/vals.length) + "%" : "–";
  $("#prog").style.width = (vals.length*100/Q.length) + "%";
}
function renderGrid(){
  const vis = new Set(visible());
  const cur = state.order[state.pos];
  const g = $("#grid"); g.innerHTML = "";
  Q.forEach((q, i) => {
    const b = document.createElement("button");
    b.className = "cell";
    if(q.id in state.done) b.classList.add(state.done[q.id] ? "ok" : "bad");
    if(state.flags.has(q.id)) b.classList.add("flag");
    if(q.supplement) b.classList.add("sup");
    if(i === cur && state.view === "quiz") b.classList.add("cur");
    if(!vis.has(i)) b.classList.add("dim");
    b.textContent = q.id;
    b.title = q.topic + (q.supplement ? " (câu bổ sung)" : "");
    b.onclick = () => { state.view = "quiz"; state.pos = state.order.indexOf(i); render(); window.scrollTo({top:0,behavior:"smooth"}); };
    g.appendChild(b);
  });
}

function section(cls, title, html, open){
  return `<details class="sec ${cls}" ${open?"open":""}><summary>${title}</summary><div class="body">${html}</div></details>`;
}

function renderQuiz(){
  const main = $("#main");
  const vis = visible();
  if(!vis.length){ main.innerHTML = `<div class="card empty">Không có câu nào khớp bộ lọc hiện tại.</div>`; return; }
  let idx = state.order[state.pos];
  if(!vis.includes(idx)){ idx = vis[0]; state.pos = state.order.indexOf(idx); }
  const q = Q[idx];
  const answered = q.id in state.done;
  const sel = state.sel[q.id] || new Set();
  const p = perm(q);
  const vpos = vis.indexOf(idx);

  let opts = p.map((oi, k) => {
    const o = q.options[oi];
    let cls = "opt" + (q.multi > 1 ? " multi" : "");
    let tag = "";
    if(answered){
      if(o.correct && sel.has(oi)){ cls += " right"; tag = "✓ Đúng"; }
      else if(!o.correct && sel.has(oi)){ cls += " wrong"; tag = "✗ Bạn chọn"; }
      else if(o.correct){ cls += " right missed"; tag = "✓ Đáp án đúng"; }
    } else if(sel.has(oi)) cls += " sel";
    return `<div class="${cls}" data-oi="${oi}" role="${q.multi>1?"checkbox":"radio"}" aria-checked="${sel.has(oi)}" tabindex="0">
      <span class="key">${LETTERS[k]}</span><span class="txt">${o.html}${tag?`<span class="tag">${tag}</span>`:""}</span></div>`;
  }).join("");

  const showExplain = answered && $("#optAuto").checked;
  let after = "";
  if(answered){
    const ok = state.done[q.id];
    after += `<div class="verdict ${ok?"ok":"bad"}">${ok ? "Chính xác!" :"Chưa đúng. Xem đáp án được đánh dấu xanh và phần giải thích bên dưới."}</div>`;
    after += section("s-analysis", "Phân tích đề", q.analysis, showExplain);
    after += section("s-answer", "Đáp án đúng", q.answer, showExplain);
    after += section("s-explain", "Giải thích", q.explain, showExplain);
    after += section("s-wrong", "Vì sao các đáp án khác sai", q.wrong, showExplain);
    after += section("s-tip", "Mẹo thi", q.tip, showExplain);
  } else if(state.hint[q.id]){
    after += `<div class="hint"><h3>Gợi ý · Phân tích đề</h3><div class="body">${q.analysis}</div></div>`;
  }

  const need = q.multi > 1 ? `Chọn ${q.multi} đáp án` : "Chọn 1 đáp án";
  main.innerHTML = `<div class="card ${answered?"locked":""}">
    <div class="qhead">
      <span class="qnum">Câu ${q.id}</span>
      <span class="chip">${q.topic}</span>
      ${q.supplement ? `<span class="chip sup">Câu bổ sung</span>` : ""}
      <span class="chip multi">${need}</span>
      <button class="flagbtn ${state.flags.has(q.id)?"on":""}" id="btnFlag">${state.flags.has(q.id)?"★ Đã đánh dấu":"☆ Đánh dấu"}</button>
    </div>
    <div class="stem">${q.stem}</div>
    <div class="opts">${opts}</div>
    <div class="actions">
      <button class="btn" id="btnPrev" ${vpos<=0?"disabled":""}>← Câu trước</button>
      ${!answered ? `<button class="btn ghost" id="btnHint">${state.hint[q.id]?"Ẩn gợi ý":"Gợi ý: phân tích đề"}</button>` : `<button class="btn ghost" id="btnRetry">Làm lại câu này</button>`}
      <span class="spacer"></span>
      ${!answered ? `<button class="btn primary" id="btnCheck" ${sel.size!==q.multi?"disabled":""}>Kiểm tra</button>` : ""}
      <button class="btn ${answered?"primary":""}" id="btnNext" ${vpos>=vis.length-1?"disabled":""}>Câu sau →</button>
    </div>
    ${after}
    <div class="kbd"><kbd>A</kbd>–<kbd>E</kbd> hoặc <kbd>1</kbd>–<kbd>5</kbd> chọn đáp án · <kbd>Enter</kbd> kiểm tra / sang câu sau · <kbd>←</kbd> <kbd>→</kbd> chuyển câu · <kbd>H</kbd> gợi ý</div>
  </div>`;

  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => toggle(q, +el.dataset.oi);
    el.onkeydown = e => { if(e.key===" "){ e.preventDefault(); toggle(q, +el.dataset.oi); } };
  });
  $("#btnFlag").onclick = () => { state.flags.has(q.id) ? state.flags.delete(q.id) : state.flags.add(q.id); render(); };
  $("#btnPrev").onclick = () => go(-1);
  $("#btnNext").onclick = () => go(1);
  if($("#btnCheck")) $("#btnCheck").onclick = () => check(q);
  if($("#btnHint")) $("#btnHint").onclick = () => { state.hint[q.id] = !state.hint[q.id]; render(); };
  if($("#btnRetry")) $("#btnRetry").onclick = () => { delete state.done[q.id]; state.sel[q.id] = new Set(); delete state.perm[q.id]; render(); };
}

function toggle(q, oi){
  if(q.id in state.done) return;
  const s = state.sel[q.id] || (state.sel[q.id] = new Set());
  if(q.multi === 1){ s.clear(); s.add(oi); }
  else if(s.has(oi)) s.delete(oi);
  else { if(s.size >= q.multi) return; s.add(oi); }
  render();
}
function check(q){
  const s = state.sel[q.id] || new Set();
  if(s.size !== q.multi) return;
  const correct = q.options.every((o, i) => o.correct === s.has(i));
  state.done[q.id] = correct;
  render();
}
function go(d){
  const vis = visible();
  const cur = state.order[state.pos];
  let vp = vis.indexOf(cur);
  vp = Math.max(0, Math.min(vis.length-1, vp + d));
  state.pos = state.order.indexOf(vis[vp]);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderSummary(){
  const groups = {};
  Q.forEach(q => {
    const g = topicGroup(q.topic);
    groups[g] = groups[g] || {n:0, done:0, ok:0, bad:[]};
    groups[g].n++;
    if(q.id in state.done){ groups[g].done++; if(state.done[q.id]) groups[g].ok++; else groups[g].bad.push(q.id); }
  });
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length;
  const wrongIds = Q.filter(q => state.done[q.id] === false).map(q => q.id);
  const rows = Object.entries(groups).sort((a,b)=>b[1].n-a[1].n).map(([g, v]) => {
    const pct = v.done ? Math.round(v.ok*100/v.done) : null;
    return `<tr><td>${g}</td><td class="n">${v.done}/${v.n}</td><td class="n">${pct===null?"–":pct+"%"}</td>
      <td><div class="bar"><i style="width:${pct||0}%"></i></div></td><td>${v.bad.map(id=>`<a href="#" data-q="${id}">${id}</a>`).join(", ")}</td></tr>`;
  }).join("");
  $("#main").innerHTML = `<div class="card summary">
    <h2>Kết quả</h2>
    <p>Đã làm <b>${vals.length}/${Q.length}</b> câu · Đúng <b>${ok}</b> · Sai <b>${vals.length-ok}</b>${vals.length?` · Tỷ lệ đúng <b>${Math.round(ok*100/vals.length)}%</b>`:""}.
    ${vals.length===Q.length ? (ok/Q.length>=0.72 ? " Mức này tương đương ngưỡng đậu (~720/1000)." : " Chưa đạt ngưỡng ~72%, nên ôn lại các câu sai.") : ""}</p>
    ${wrongIds.length ? `<p><button class="btn primary" id="btnReviewBad">Ôn lại ${wrongIds.length} câu sai</button></p>` : ""}
    <table><thead><tr><th>Chủ đề</th><th class="n">Đã làm</th><th class="n">Đúng</th><th></th><th>Câu sai</th></tr></thead><tbody>${rows}</tbody></table>
    <p style="margin-top:14px"><button class="btn" id="btnBack">← Quay lại làm bài</button></p>
  </div>`;
  $("#btnBack").onclick = () => { state.view = "quiz"; render(); };
  if($("#btnReviewBad")) $("#btnReviewBad").onclick = () => {
    $("#fFilter").value = "bad"; $("#fTopic").value = "";
    wrongIds.forEach(id => { delete state.done[id]; state.sel[id] = new Set(); delete state.perm[id]; });
    // keep them findable after reset: mark as flagged review set
    wrongIds.forEach(id => state.flags.add(id));
    $("#fFilter").value = "flag";
    state.view = "quiz"; state.pos = state.order.indexOf(Q.findIndex(q => q.id === wrongIds[0])); render();
  };
  $("#main").querySelectorAll("a[data-q]").forEach(a => a.onclick = e => {
    e.preventDefault(); state.view = "quiz"; $("#fFilter").value = "all"; $("#fTopic").value = "";
    state.pos = state.order.indexOf(Q.findIndex(q => q.id === +a.dataset.q)); render();
  });
}

function render(){
  renderStats(); renderGrid();
  state.view === "summary" ? renderSummary() : renderQuiz();
}

// init
(function(){
  const groups = [...new Set(Q.map(q => topicGroup(q.topic)))].sort();
  groups.forEach(g => { const o = document.createElement("option"); o.value = g; o.textContent = g; $("#fTopic").appendChild(o); });
  $("#fFilter").onchange = $("#fTopic").onchange = () => { state.view = "quiz"; render(); };
  $("#optShuffleQ").onchange = e => {
    const cur = state.order[state.pos];
    state.order = e.target.checked ? shuffle(Q.map((_, i) => i)) : Q.map((_, i) => i);
    state.pos = e.target.checked ? 0 : state.order.indexOf(cur);
    render();
  };
  $("#optShuffleA").onchange = () => { Q.forEach(q => { if(!(q.id in state.done)) delete state.perm[q.id]; }); render(); };
  $("#optAuto").onchange = render;
  $("#btnSummary").onclick = () => { state.view = "summary"; render(); };
  $("#btnReset").onclick = () => {
    if(!Object.keys(state.done).length) return;
    state.sel = {}; state.done = {}; state.hint = {}; state.perm = {}; state.pos = 0; state.view = "quiz";
    $("#fFilter").value = "all"; render();
  };
  $("#btnTheme").onclick = () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  };
  document.addEventListener("keydown", e => {
    if(state.view !== "quiz" || e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    const q = Q[state.order[state.pos]]; if(!q) return;
    const k = e.key.toUpperCase();
    let n = "12345678".indexOf(k); if(n < 0) n = LETTERS.indexOf(k);
    if(k.length === 1 && n >= 0 && n < q.options.length && k !== "H"){ toggle(q, perm(q)[n]); return; }
    if(e.key === "Enter"){ e.preventDefault(); (q.id in state.done) ? go(1) : check(q); }
    else if(e.key === "ArrowRight") go(1);
    else if(e.key === "ArrowLeft") go(-1);
    else if(k === "H" && !(q.id in state.done)){ state.hint[q.id] = !state.hint[q.id]; render(); }
  });
  render();
})();
</script>
</body>
</html>
