nsparent) ngay trước DynamoDB, tự động cache các 'hot key' mà KHÔNG cần sửa code ứng dụng.","ElastiCache có thể giải quyết được nhưng đòi hỏi sửa logic ứng dụng để tự quản lý cache — vi phạm yêu cầu 'ít refactor nhất'."],"pattern":"Giải quyết hot partition/hot key mà không sửa logic ứng dụng","why":"DAX hoạt động trong suốt với API tương thích DynamoDB, nên tự động cache các khoá truy cập nhiều (hot key) mà không cần đổi code gọi DynamoDB.","trap":"ElastiCache cũng 'giải quyết được' bài toán cache nhưng cần thêm logic tự quản lý cache ở tầng ứng dụng — không đáp ứng tiêu chí 'không refactor nhiều'.","tip":"Hot partition/hot key của DynamoDB, cần fix nhanh, không sửa code nhiều → DAX (trong suốt với API); cần cache tổng quát, chấp nhận sửa code → ElastiCache."},{"id":39,"domain":"perf","topic":"Auto Scaling Group for dynamic content scaling","q":"The engineering team at a leading e-commerce company is anticipating a surge in the traffic because of a flash sale planned for the weekend. You have estimated the web traffic to be 10x. The content of your website is highly dynamic and changes very often.\nAs a Solutions Architect, which of the following options would you recommend to make sure your infrastructure scales for that day?","opts":["Deploy the website on Amazon S3","Use an Auto Scaling Group","Use an Amazon CloudFront distribution in front of your website","Use an Amazon Route 53 Multi Value record"],"ans":[1],"you1":[1],"notes":["S3 chỉ host được nội dung TĨNH — đề nói rõ nội dung 'highly dynamic', không phù hợp.","Đúng: ASG tự scale số lượng EC2 instance theo traffic thực tế, đúng với nhu cầu tăng 10x lưu lượng.","CloudFront sẽ cache dữ liệu, không phù hợp khi nội dung thay đổi liên tục (highly dynamic).","Route 53 Multi Value chỉ trả về nhiều record khi query DNS, bản thân nó không giúp tăng năng lực xử lý/scale hạ tầng."],"pattern":"Scale hạ tầng cho traffic tăng đột biến khi nội dung là DYNAMIC (không thể cache)","why":"ASG trực tiếp tăng/giảm số lượng instance phục vụ theo tải thực tế — đúng công cụ để xử lý traffic tăng 10x cho nội dung động.","trap":"CloudFront nghe như giải pháp 'tăng khả năng chịu tải' kinh điển, nhưng với nội dung THAY ĐỔI LIÊN TỤC, cache sẽ không hiệu quả hoặc phải invalidate liên tục.","tip":"Nội dung tĩnh, ít đổi → CloudFront/S3 giúp giảm tải hiệu quả. Nội dung động, đổi liên tục → phải scale CHÍNH compute layer bằng Auto Scaling Group."},{"id":40,"domain":"sec","topic":"S3 bucket policy for cross-account access","q":"A company wants to grant access to an Amazon S3 bucket to users in its own AWS account as well as to users in another AWS account. Which of the following options can be used to meet this requirement?","opts":["Use a bucket policy to grant permission to users in its account as well as to users in another account","Use a user policy to grant permission to users in its account as well as to users in another account","Use permissions boundary to grant permission to users in its account as well as to users in another account","Use either a bucket policy or a user policy to grant permission to users in its account as well as to users in another account"],"ans":[0],"you1":[0],"notes":["Đúng: bucket policy là resource-based policy, có thể chỉ định principal ở BẤT KỲ account nào, kể cả account khác.","User policy chỉ gắn vào user trong CHÍNH account sở hữu nó — không cấp quyền được cho user ở account khác.","Permissions boundary chỉ giới hạn quyền tối đa, bản thân nó KHÔNG cấp quyền truy cập.","Sai vì user policy không đáp ứng được phần 'user ở account khác' — không thể dùng 'một trong hai' tuỳ ý như phát biểu này."],"pattern":"Chọn đúng loại policy cho truy cập CROSS-ACCOUNT vào tài nguyên","why":"Chỉ bucket policy (resource-based) mới có thể chỉ định principal thuộc account khác; user policy (identity-based) chỉ áp dụng trong phạm vi account sở hữu nó.","trap":"Phương án 'dùng bucket policy HOẶC user policy' nghe như một lựa chọn an toàn/linh hoạt nhưng sai vì user policy không thể cấp quyền cross-account.","tip":"Cấp quyền truy cập tài nguyên cho user ở TÀI KHOẢN KHÁC → luôn cần resource-based policy (bucket policy); user/identity-based policy chỉ có hiệu lực trong chính account của nó."},{"id":41,"domain":"perf","topic":"Transit Gateway ECMP for VPN throughput","q":"A retail company is using AWS Site-to-Site VPN connections for secure connectivity to its AWS cloud resources from its on-premises data center. Due to a surge in traffic across the VPN connections to the AWS cloud, users are experiencing slower VPN connectivity.\nWhich of the following options will maximize the VPN throughput?","opts":["Create a virtual private gateway with equal cost multipath routing and multiple channels","Create an AWS Transit Gateway with equal cost multipath routing and add additional VPN tunnels","Use AWS Global Accelerator for the VPN connection to maximize the throughput","Use Transfer Acceleration for the VPN connection to maximize the throughput"],"ans":[1],"you1":[0],"notes":["Virtual Private Gateway KHÔNG hỗ trợ ECMP — đây là khả năng chỉ Transit Gateway mới có.","Đúng: Transit Gateway hỗ trợ ECMP, cho phép dùng nhiều VPN tunnel song song để vượt quá giới hạn 1.25 Gbps/tunnel.","Global Accelerator tối ưu đường đi mạng/giảm độ trễ, không tăng được throughput tối đa của 1 kết nối VPN.","Transfer Acceleration chỉ dành cho tăng tốc truyền file vào S3, không liên quan gì tới VPN."],"pattern":"Vượt giới hạn throughput cố định của 1 VPN tunnel (1.25 Gbps)","why":"Transit Gateway hỗ trợ ECMP, cho phép gộp nhiều VPN tunnel chạy song song để tổng throughput vượt mức giới hạn của một tunnel đơn lẻ.","trap":"Virtual Private Gateway nghe như lựa chọn 'truyền thống hợp lý' hơn nhưng lại THIẾU đúng khả năng kỹ thuật (ECMP) mà đề yêu cầu — chỉ Transit Gateway mới hỗ trợ.","tip":"Một VPN tunnel luôn giới hạn ~1.25 Gbps; muốn vượt giới hạn này phải dùng nhiều tunnel + ECMP, và ECMP chỉ khả dụng trên Transit Gateway, không phải Virtual Private Gateway."},{"id":42,"domain":"cost","topic":"EBS io1 to gp2 cost optimization","q":"A company has noticed that its Amazon EBS Elastic Volume (io1) accounts for 90% of the cost and the remaining 10% cost can be attributed to the Amazon EC2 instance. The Amazon CloudWatch metrics report that both the Amazon EC2 instance and the Amazon EBS volume are under-utilized. The Amazon CloudWatch metrics also show that the Amazon EBS volume has occasional I/O bursts. The entire infrastructure is managed by AWS CloudFormation.\nAs a Solutions Architect, what do you propose to reduce the costs?","opts":["Convert the Amazon EC2 instance EBS volume to gp2","Keep the Amazon EBS volume to io1 and reduce the IOPS","Don't use a AWS CloudFormation template to create the database as the AWS CloudFormation service incurs greater service charges","Change the Amazon EC2 instance type to something much smaller"],"ans":[0],"you1":[1],"notes":["Đúng: chuyển sang gp2 rẻ hơn io1 nhiều, vẫn hỗ trợ burst IOPS tạm thời — khớp với pattern 'occasional I/O burst, under-utilized'.","Giảm IOPS trên io1 vẫn giữ nguyên MÔ HÌNH chi phí đắt (trả theo IOPS provisioned) và có thể ảnh hưởng tới lúc cần burst.","CloudFormation là dịch vụ MIỄN PHÍ, không hề phát sinh phí dịch vụ riêng — phát biểu này sai hoàn toàn.","EC2 chỉ chiếm 10% chi phí, đổi instance nhỏ hơn không giải quyết được phần 90% chi phí từ EBS io1."],"pattern":"Chọn đúng LEVER tối ưu chi phí (đổi loại volume, không phải chỉnh thông số)","why":"Workload 'under-utilized, chỉ burst thỉnh thoảng' là use-case kinh điển của gp2 (có burst credit, rẻ hơn io1 nhiều lần).","trap":"Giảm IOPS trên io1 nghe như cách tiết kiệm hợp lý nhưng vẫn giữ MÔ HÌNH tính phí đắt của io1, không giải quyết gốc vấn đề như đổi hẳn sang gp2.","tip":"Workload không ổn định, hiếm khi cần IOPS cao, phần lớn thời gian under-utilized → gp2 (có burst) rẻ hơn io1 (trả cố định theo IOPS provisioned) nhiều lần."},{"id":43,"domain":"cost","topic":"EC2 Spot + SQS for async image processing","multi":true,"q":"You are working as a Solutions Architect for a photo processing company that has a proprietary algorithm to compress an image without any loss in quality. Because of the efficiency of the algorithm, your clients are willing to wait for a response that carries their compressed images back. You also want to process these jobs asynchronously and scale quickly, to cater to the high demand. Additionally, you also want the job to be retried in case of failures.\nWhich combination of choices do you recommend to minimize cost and comply with the requirements? (Select two)","opts":["Amazon Simple Notification Service (Amazon SNS)","Amazon EC2 Reserved Instances (RIs)","Amazon EC2 On-Demand Instances","Amazon EC2 Spot Instances","Amazon Simple Queue Service (Amazon SQS)"],"ans":[3,4],"you1":[2,4],"notes":["SNS là dịch vụ pub/sub, không phải hàng đợi xử lý job có cơ chế retry như yêu cầu.","RI đòi hỏi cam kết 1-3 năm cho khối lượng tải không ổn định — không phải lựa chọn tiết kiệm nhất ở đây.","On-Demand không tận dụng được mức giá rẻ hơn khi job có thể chấp nhận chờ đợi/gián đoạn.","Đúng: Spot Instance rẻ hơn On-Demand/RI nhiều, phù hợp vì khách hàng sẵn sàng chờ (chấp nhận gián đoạn).","Đúng: SQS đệm job bất đồng bộ, có cơ chế retry/dead-letter tự nhiên, scale theo số message trong queue."],"pattern":"Xử lý job bất đồng bộ, chịu gián đoạn được, cần rẻ nhất + có retry tự nhiên","why":"SQS đệm job với cơ chế retry/visibility timeout có sẵn; Spot Instance tận dụng được việc khách hàng chấp nhận chờ (tolerant to interruption) để tối ưu chi phí tối đa.","trap":"On-Demand/Reserved Instances đều là lựa chọn 'an toàn' quen thuộc, nhưng khi workload CHẤP NHẬN GIÁN ĐOẠN và cần rẻ nhất, Spot Instance luôn là lựa chọn tối ưu hơn.","tip":"Job bất đồng bộ, khách sẵn sàng chờ, cần rẻ nhất → Spot Instances (không phải RI/On-Demand) + SQS (đệm, retry, scale theo queue depth)."},{"id":44,"domain":"sec","topic":"IAM Identity Center + AD trust relationship","q":"A global insurance company is modernizing its infrastructure by migrating multiple line-of-business applications from its on-premises data centers to AWS. These applications will be deployed across several AWS accounts, all governed under a centralized AWS Organizations structure. The company manages all user identities, groups, and access policies within its on-premises Microsoft Active Directory and wants to continue doing so. The goal is to enable seamless single sign-in across all AWS accounts without duplicating user identity stores or manually provisioning accounts.\nWhich solution best meets these requirements in the most operationally efficient manner?","opts":["Deploy AWS IAM Identity Center and configure it to use AWS Directory Service for Microsoft Active Directory (Enterprise Edition). Establish a two-way trust relationship between the managed directory and the on-premises Active Directory to enable federated authentication across all AWS accounts","Enable AWS IAM Identity Center and manually create user accounts and groups within it. Assign these users permission sets in each AWS account. Manage synchronization with on-premises Active Directory using custom PowerShell scripts","Deploy an OpenLDAP server on Amazon EC2, sync it with the on-premises Active Directory, and integrate it with each AWS account by creating IAM roles that trust the EC2-hosted LDAP server as a SAML provider","Use Amazon Cognito as the primary identity store and create a custom OpenID Connect (OIDC) federation with the on-premises Active Directory. Assign IAM roles using Cognito identity pools and propagate access to multiple AWS accounts using resource policies"],"ans":[0],"you1":[0],"notes":["Đúng: AWS Managed AD (Enterprise Edition) hỗ trợ two-way trust với AD tại chỗ, kết hợp IAM Identity Center để SSO toàn bộ account mà không cần nhân bản danh tính.","Tạo user thủ công trong Identity Center và tự viết script PowerShell để đồng bộ là cách làm thủ công, không scale, đi ngược yêu cầu 'ít vận hành nhất'.","Tự host OpenLDAP trên EC2 làm tăng gánh nặng vận hành (patch, HA, bảo mật) và không tích hợp sẵn với IAM Identity Center.","Cognito được tối ưu cho ứng dụng web/mobile, không phải giải pháp SSO cấp tổ chức cho nhiều AWS account qua Organizations."],"pattern":"SSO tập trung nhiều account, giữ nguyên nguồn danh tính on-prem, ít vận hành nhất","why":"Two-way trust giữa AWS Managed AD và AD tại chỗ cho phép IAM Identity Center xác thực trực tiếp với người dùng AD hiện có, không cần tạo lại identity hay script đồng bộ thủ công.","trap":"Các giải pháp 'tự dựng' (OpenLDAP trên EC2, script PowerShell đồng bộ) nghe khả thi về mặt kỹ thuật nhưng đều tăng vận hành/bảo trì — ngược hẳn yêu cầu 'operationally efficient'.","tip":"SSO cho nhiều AWS account + vẫn giữ Active Directory tại chỗ làm nguồn danh tính → IAM Identity Center + AWS Managed AD (two-way trust), không cần tự dựng LDAP hay dùng Cognito."},{"id":45,"domain":"perf","topic":"EFS mount targets per AZ for lowest latency","q":"A research organization is running a high-performance computing (HPC) workload using Amazon EC2 instances that are distributed across multiple Availability Zones (AZs) within a single AWS Region. The workload requires access to a shared file system with the lowest possible latency for frequent reads and writes.The team decides to use Amazon Elastic File System (Amazon EFS) for its scalability and simplicity. To ensure optimal performance and reduce network latency, the solution architect must design the architecture so that each EC2 instance can access the file system with the least possible delay.\nWhich of the following is the most appropriate solution to meet these requirements?","opts":["Create mount targets for Amazon EFS on an EC2 instance in each AZ and use them to serve as access points for other instances","Create EFS mount targets in each AZ and mount the EFS file system to EC2 instances in the same AZ as the mount target","Use Mountpoint for Amazon S3 to mount an S3 bucket on each EC2 instance and use it as a shared storage layer across Availability Zones","Create a single EFS mount target in one AZ and allow all EC2 instances in other AZs to access it using the default mount target"],"ans":[1],"you1":[2],"notes":["Hiểu sai khái niệm: mount target là ENI do EFS quản lý ở cấp VPC, KHÔNG được tạo trên một EC2 instance.","Đúng: tạo mount target riêng ở mỗi AZ, mỗi EC2 mount vào mount target CÙNG AZ để traffic không phải đi liên AZ.","Mountpoint for S3 biến S3 (object storage) thành file system giả lập — không đạt độ trễ thấp và tính nhất quán cần cho workload HPC chia sẻ.","Chỉ có 1 mount target khiến các EC2 ở AZ khác phải đi traffic LIÊN AZ, tăng độ trễ và phát sinh chi phí truyền dữ liệu."],"pattern":"Giảm độ trễ truy cập EFS bằng cách mount ĐÚNG mount target cùng AZ","why":"Mount target trong mỗi AZ giữ traffic nằm trong cùng AZ, tránh độ trễ liên AZ và tăng khả năng chịu lỗi (1 AZ sập vẫn còn AZ khác hoạt động).","trap":"Nhầm lẫn giữa 'mount point' (nơi gắn ổ đĩa trên EC2) và 'mount target' (ENI do EFS quản lý ở cấp VPC) khiến phương án tạo mount target 'trên EC2' nghe hợp lý nhưng sai bản chất.","tip":"Luôn tạo EFS mount target ở MỖI AZ nơi có EC2 cần truy cập, và mount từ EC2 vào mount target CÙNG AZ để có độ trễ thấp nhất, tránh chi phí truyền liên AZ."},{"id":46,"domain":"cost","topic":"API Gateway Caching to reduce Aurora load","q":"You have developed a new REST API leveraging the Amazon API Gateway, AWS Lambda and Amazon Aurora database services. Most of the workload on the website is read-heavy. The data rarely changes and it is acceptable to serve users outdated data for about 24 hours. Recently, the website has been experiencing high load and the costs incurred on the Aurora database have been very high.\nHow can you easily reduce the costs while improving performance, with minimal changes?","opts":["Add Amazon Aurora Read Replicas","Enable Amazon API Gateway Caching","Enable AWS Lambda In Memory Caching","Switch to using an Application Load Balancer"],"ans":[1],"you1":[0],"notes":["Thêm Read Replica làm TĂNG chi phí (thêm instance DB), ngược với mục tiêu giảm chi phí.","Đúng: dữ liệu chấp nhận cũ tới 24 giờ → bật cache ở tầng API Gateway (TTL tối đa 3600s, có thể lặp lại) giảm hẳn số lần gọi xuống Lambda/Aurora.","Lambda không có tính năng in-memory caching có sẵn — đây là tên tính năng không tồn tại.","Đổi sang ALB không giải quyết được vấn đề cache dữ liệu — ALB chỉ là bộ cân bằng tải, không lưu trữ phản hồi."],"pattern":"Giảm tải/giảm chi phí DB khi dữ liệu CHẤP NHẬN CŨ trong thời gian dài","why":"API Gateway Caching lưu lại response ở tầng API, giảm trực tiếp số request chạm Lambda/Aurora — chi phí thấp, triển khai đơn giản, đúng mức độ 'chấp nhận dữ liệu cũ 24h'.","trap":"Thêm Read Replica nghe như cách giải quyết tải đọc kinh điển, nhưng ở đây mục tiêu là GIẢM chi phí — thêm instance mới đi ngược hoàn toàn mục tiêu đó.","tip":"Dữ liệu ít đổi, chấp nhận stale trong khoảng thời gian dài → bật cache càng gần client càng tốt (API Gateway Caching/CloudFront) thay vì scale thêm DB."},{"id":47,"domain":"perf","topic":"Kinesis Data Analytics real-time pipeline","q":"An e-commerce company tracks user clicks on its flagship website and performs analytics to provide near-real-time product recommendations. An Amazon EC2 instance receives data from the website and sends the data to an Amazon Aurora Database instance. Another Amazon EC2 instance continuously checks the changes in the database and executes SQL queries to provide recommendations. Now, the company wants a redesign to decouple and scale the infrastructure. The solution must ensure that data can be analyzed in real-time without any data loss even when the company sees huge traffic spikes.\nWhat would you recommend as an AWS Certified Solutions Architect - Associate?","opts":["Leverage Amazon Kinesis Data Streams to capture the data from the website and feed it into Amazon QuickSight which can query the data in real time. Lastly, the analyzed feed is output into Kinesis Data Firehose to persist the data on Amazon S3","Leverage Amazon SQS to capture the data from the website. Configure a fleet of Amazon EC2 instances under an Auto scaling group to process messages from the Amazon SQS queue and trigger the scaling policy based on the number of pending messages in the queue. Perform real-time analytics using a third-party library on the Amazon EC2 instances","Leverage Amazon Kinesis Data Streams to capture the data from the website and feed it into Amazon Kinesis Data Firehose to persist the data on Amazon S3. Lastly, use Amazon Athena to analyze the data in real time","Leverage Amazon Kinesis Data Streams to capture the data from the website and feed it into Amazon Kinesis Data Analytics which can query the data in real time. Lastly, the analyzed feed is output into Amazon Kinesis Data Firehose to persist the data on Amazon S3"],"ans":[3],"you1":[0],"notes":["QuickSight không nhận trực tiếp Kinesis Data Streams làm nguồn và không phân tích theo thời gian thực — sai cả 2 điểm.","Tự quản lý fleet EC2 với thư viện bên thứ ba để phân tích real-time là tốn vận hành hơn nhiều so với dùng Kinesis Data Analytics managed.","Athena truy vấn dữ liệu đã nằm trên S3, có độ trễ, KHÔNG phải công cụ phân tích thời gian thực.","Đúng: Kinesis Data Streams ingest → Kinesis Data Analytics phân tích SQL thời gian thực → Kinesis Data Firehose lưu kết quả vào S3 không mất dữ liệu."],"pattern":"Ghép đúng pipeline streaming cho real-time analytics không mất dữ liệu","why":"Chuỗi Kinesis Data Streams → Kinesis Data Analytics → Kinesis Data Firehose là bộ 3 dịch vụ managed được thiết kế sẵn cho đúng use-case phân tích thời gian thực + lưu trữ an toàn.","trap":"QuickSight và Athena đều là công cụ 'phân tích dữ liệu' quen thuộc, nhưng cả 2 đều KHÔNG phải công cụ xử lý luồng thời gian thực (streaming) như đề yêu cầu.","tip":"Streaming ingest: Kinesis Data Streams. Phân tích SQL trên luồng real-time: Kinesis Data Analytics. Đẩy kết quả vào kho lưu trữ (S3/Redshift...): Kinesis Data Firehose."},{"id":48,"domain":"res","topic":"Cross-Region AMI copy for DR","q":"The engineering team at a global e-commerce company is currently reviewing their disaster recovery strategy. The team has outlined that they need to be able to quickly recover their application stack with a Recovery Time Objective (RTO) of 5 minutes, in all of the AWS Regions that the application runs. The application stack currently takes over 45 minutes to install on a Linux system.\nAs a Solutions architect, which of the following options would you recommend as the disaster recovery strategy?","opts":["Use Amazon EC2 user data to speed up the installation process","Store the installation files in Amazon S3 for quicker retrieval","Create an Amazon Machine Image (AMI) after installing the software and copy the AMI across all Regions. Use this Region-specific AMI to run the recovery process in the respective Regions","Create an Amazon Machine Image (AMI) after installing the software and use this AMI to run the recovery process in other Regions"],"ans":[2],"you1":[2],"notes":["User data chỉ chạy script khi boot, không rút ngắn được thời gian cài đặt phần mềm 45 phút.","Lưu file cài đặt lên S3 giúp tải nhanh hơn, nhưng vẫn phải CHẠY cài đặt mất ~45 phút — không đạt RTO 5 phút.","Đúng: AMI đã cài sẵn phần mềm giúp instance mới khởi động gần như tức thì; vì AMI gắn với 1 Region nên phải COPY sang các Region khác để dùng.","AMI gắn với Region tạo ra nó — nếu không copy sang Region khác thì không thể dùng để khôi phục ở Region đó."],"pattern":"Đạt RTO cực ngắn cho ứng dụng cài đặt lâu, đa Region","why":"AMI dựng sẵn loại bỏ hoàn toàn bước cài đặt 45 phút; vì AMI là tài nguyên theo Region nên phải copy sang từng Region để sẵn sàng recovery ở đó.","trap":"Phương án tạo AMI nhưng QUÊN copy sang các Region khác là bẫy thiếu 1 bước bắt buộc — AMI không tự động có mặt ở Region khác.","tip":"AMI luôn gắn với 1 Region cụ thể; khi cần DR đa Region, phải chủ động COPY AMI sang từng Region liên quan trước khi xảy ra sự cố."},{"id":49,"domain":"perf","topic":"EC2 Cluster Placement Group for distributed processing","q":"A Big Data processing company has created a distributed data processing framework that performs best if the network performance between the processing machines is high. The application has to be deployed on AWS, and the company is only looking at performance as the key measure.\nAs a Solutions Architect, which deployment do you recommend?","opts":["Use a Spread placement group","Optimize the Amazon EC2 kernel using EC2 User Data","Use Spot Instances","Use a Cluster placement group"],"ans":[3],"you1":[3],"notes":["Spread placement group đặt instance tách biệt phần cứng để CHỐNG correlated failure, không tối ưu network throughput như Cluster.","Không thể 'tối ưu kernel' qua User Data để cải thiện hiệu năng mạng — hiệu năng mạng phụ thuộc vào instance type/placement, không phải kernel tuning qua script.","Spot Instance tối ưu CHI PHÍ, không liên quan tới hiệu năng mạng — sai tiêu chí đề bài (chỉ xét performance).","Đúng: Cluster placement group đặt instance gần nhau trong 1 AZ, đạt throughput cao nhất, tối ưu cho network performance giữa các node."],"pattern":"Tối ưu THUẦN hiệu năng mạng cho hệ phân tán, bỏ qua các tiêu chí khác","why":"Khi tiêu chí DUY NHẤT là hiệu năng mạng giữa các node, Cluster Placement Group là lựa chọn kỹ thuật trực tiếp và hiệu quả nhất.","trap":"Spot Instance là bẫy đánh lạc hướng sang tiêu chí CHI PHÍ, trong khi đề đã nói rõ ràng công ty 'chỉ quan tâm duy nhất tới hiệu năng' (performance as the key measure).","tip":"Khi đề nói rõ chỉ quan tâm 1 tiêu chí (ví dụ performance), loại ngay các đáp án tối ưu tiêu chí KHÁC (chi phí, HA...) dù chúng nghe hợp lý."},{"id":50,"domain":"perf","topic":"Amazon MQ for MQTT message broker migration","q":"A company's business logic is built on several microservices that are running in the on-premises data center. They currently communicate using a message broker that supports the MQTT protocol. The company is looking at migrating these applications and the message broker to AWS Cloud without changing the application logic.\nWhich technology allows you to get a managed message broker that supports the MQTT protocol?","opts":["Amazon MQ","Amazon Kinesis Data Streams","Amazon Simple Notification Service (Amazon SNS)","Amazon Simple Queue Service (Amazon SQS)"],"ans":[0],"you1":[0],"notes":["Đúng: Amazon MQ là message broker managed, hỗ trợ sẵn các giao thức chuẩn công nghiệp gồm MQTT, AMQP, STOMP, JMS.","Kinesis Data Streams là dịch vụ streaming độc quyền của AWS, không tương thích giao thức MQTT.","SNS là dịch vụ pub/sub độc quyền của AWS, không hỗ trợ giao thức MQTT chuẩn công nghiệp.","SQS là hàng đợi độc quyền của AWS, cũng không hỗ trợ giao thức MQTT."],"pattern":"Di chuyển lên cloud mà GIỮ NGUYÊN giao thức/logic ứng dụng hiện có (lift-and-shift message broker)","why":"Amazon MQ được thiết kế riêng để thay thế message broker truyền thống (ActiveMQ/RabbitMQ) mà không cần đổi giao thức ứng dụng đang dùng (MQTT, AMQP, JMS...).","trap":"SNS, SQS, Kinesis đều là dịch vụ messaging phổ biến của AWS nhưng đều là giao thức ĐỘC QUYỀN của AWS, không tương thích MQTT như broker truyền thống.","tip":"Khi đề yêu cầu 'giữ nguyên giao thức broker hiện có (MQTT/AMQP/JMS/STOMP)' khi di chuyển lên cloud → luôn chọn Amazon MQ, không phải SNS/SQS/Kinesis."},{"id":51,"domain":"cost","topic":"EFS Burst Throughput Mode","q":"A genomics research firm is processing sporadic bursts of data-intensive workloads using Amazon EC2 instances. The shared storage must support unpredictable spikes in file operations, but the average daily throughput demand remains relatively low. The team has selected Amazon Elastic File System (EFS) for its scalability and wants to ensure optimal cost and performance during bursts without provisioning throughput manually.\nWhich approach should the team take to best meet these requirements?","opts":["Enable EFS Infrequent Access (IA) storage class to reduce storage cost while continuing to benefit from burst throughput mode","Enable EFS burst throughput mode on the file system using the General Purpose performance mode and EFS Standard storage class","Change the throughput mode to provisioned and configure the desired throughput value to support burst workloads","Switch the EFS storage class to EFS One Zone to reduce cost, which will automatically enable burst throughput mode"],"ans":[1],"you1":[0],"notes":["EFS IA chỉ ảnh hưởng tới CHI PHÍ LƯU TRỮ cho file ít dùng, hoàn toàn không liên quan tới throughput mode.","Đúng: burst throughput mode (mặc định, dùng throughput credit) kết hợp General Purpose + Standard storage class đáp ứng đúng nhu cầu 'burst thỉnh thoảng, không cần cấu hình tay'.","Provisioned throughput yêu cầu TỰ cấu hình mức throughput cố định — đi ngược yêu cầu 'không cần provisioning thủ công'.","Đổi sang One Zone CHỈ ảnh hưởng số AZ lưu trữ, KHÔNG tự động bật burst throughput mode như phát biểu."],"pattern":"Phân biệt STORAGE CLASS (chi phí lưu trữ/số AZ) với THROUGHPUT MODE (băng thông I/O) của EFS — đây là 2 trục cấu hình độc lập","why":"Burst throughput mode tự động tích luỹ/tiêu thụ credit để đáp ứng các đợt burst mà không cần cấu hình gì thêm — đúng khớp pattern tải thấp, thỉnh thoảng đột biến.","trap":"Cả 2 đáp án sai đều GÁN NHẦM hiệu ứng của storage class (IA, One Zone) sang throughput mode — đây là 2 trục cấu hình HOÀN TOÀN ĐỘC LẬP của EFS.","tip":"EFS có 2 trục cấu hình riêng biệt: Storage Class (Standard/IA/One Zone — ảnh hưởng chi phí & số AZ) và Throughput Mode (Burst/Provisioned/Elastic — ảnh hưởng băng thông I/O). Đổi cái này KHÔNG tự động đổi cái kia."},{"id":52,"domain":"perf","topic":"DynamoDB On-Demand capacity mode","q":"A ride-sharing company wants to use an Amazon DynamoDB table for data storage. The table will not be used during the night hours whereas the read and write traffic will often be unpredictable during day hours. When traffic spikes occur they will happen very quickly.\nWhich of the following will you recommend as the best-fit solution?","opts":["Set up Amazon DynamoDB global table in the provisioned capacity mode","Set up Amazon DynamoDB table in the provisioned capacity mode with auto-scaling enabled","Set up Amazon DynamoDB table in the on-demand capacity mode","Set up Amazon DynamoDB table with a global secondary index"],"ans":[2],"you1":[1],"notes":["Global Table giải quyết bài toán ĐA REGION, không liên quan tới việc traffic đột biến nhanh trong 1 Region.","Provisioned + Auto Scaling vẫn có ĐỘ TRỄ phản ứng (dựa trên CloudWatch alarm), không theo kịp traffic 'tăng rất nhanh trong vài giây'.","Đúng: On-demand tự động cấp phát ngay lập tức, không có khái niệm 'chờ scale', phù hợp nhất cho traffic đột biến nhanh và khó đoán.","GSI chỉ là một kiểu index phụ, không liên quan gì tới việc xử lý traffic đột biến."],"pattern":"Phân biệt 'traffic không ổn định nhưng tăng DẦN' (Provisioned+AutoScaling) với 'traffic tăng ĐỘT NGỘT trong giây/phút' (On-demand)","why":"On-demand cấp phát capacity ngay lập tức theo từng request, không có độ trễ phản ứng như Auto Scaling (vốn cần thời gian để alarm kích hoạt và scale).","trap":"Provisioned + Auto Scaling nghe như đã 'tự động' đủ để xử lý biến động, nhưng auto-scaling vẫn có ĐỘ TRỄ phản ứng — không phù hợp khi đề nhấn mạnh traffic tăng 'rất nhanh'.","tip":"Traffic thay đổi DẦN DẦN, có thể dự đoán xu hướng → Provisioned + Auto Scaling. Traffic đột biến RẤT NHANH, khó đoán trước → On-demand capacity mode."},{"id":53,"domain":"res","topic":"CloudFront features - field-level encryption, origin failover, multi-origin","multi":true,"q":"The engineering team at a social media company has recently migrated to AWS Cloud from its on-premises data center. The team is evaluating Amazon CloudFront to be used as a CDN for its flagship application. The team has hired you as an AWS Certified Solutions Architect – Associate to advise on Amazon CloudFront capabilities on routing, security, and high availability.\nWhich of the following would you identify as correct regarding Amazon CloudFront? (Select three)","opts":["Use geo restriction to configure Amazon CloudFront for high-availability and failover","Use field level encryption in Amazon CloudFront to protect sensitive data for specific content","Use AWS Key Management Service (AWS KMS) encryption in Amazon CloudFront to protect sensitive data for specific content","Amazon CloudFront can route to multiple origins based on the price class","Amazon CloudFront can route to multiple origins based on the content type","Use an origin group with primary and secondary origins to configure Amazon CloudFront for high-availability and failover"],"ans":[1,4,5],"you1":[1,4,5],"notes":["Geo restriction dùng để CHẶN truy cập theo vị trí địa lý, không phải cơ chế failover/high-availability.","Đúng: field-level encryption mã hoá riêng từng trường dữ liệu nhạy cảm (vd số thẻ) ngay tại edge location.","KMS không phải cơ chế mã hoá field-level của CloudFront — đây là tên dịch vụ bị gán sai tính năng.","CloudFront route theo PRICE CLASS là sai — price class chỉ ảnh hưởng tới việc dùng edge location nào, không dùng để route origin.","Đúng: CloudFront hỗ trợ route tới nhiều origin khác nhau dựa trên loại nội dung (cache behavior theo path pattern/content type).","Đúng: origin group với primary/secondary + health check tự động failover sang origin phụ khi origin chính lỗi."],"pattern":"Nhận biết đúng-sai các khả năng cụ thể của CloudFront (routing, bảo mật, HA)","why":"3 khả năng có thật của CloudFront: field-level encryption (bảo mật dữ liệu nhạy cảm), route đa origin theo content type, và origin failover bằng origin group.","trap":"KMS và 'route theo price class' đều là khái niệm AWS có thật nhưng bị GÁN SAI vào ngữ cảnh CloudFront — một dạng bẫy ghép nhầm tính năng giữa các dịch vụ/khái niệm.","tip":"CloudFront HA/failover → Origin Group (primary/secondary + health check). CloudFront bảo mật dữ liệu nhạy cảm theo field → Field-Level Encryption (không phải KMS). CloudFront route đa origin → theo path/content type, không phải theo price class."},{"id":54,"domain":"res","topic":"DynamoDB Deletion Protection","q":"A fintech startup hosts its real-time transaction metadata in Amazon DynamoDB tables. During a recent system maintenance event, a junior engineer accidentally deleted a production table, resulting in major service downtime and irreversible data loss. Leadership has mandated an immediate solution that prevents future data loss from human error, while requiring minimal ongoing maintenance or manual effort from the engineering team.\nWhich approach best addresses these requirements with the least operational overhead?","opts":["Manually export each table as a full backup to Amazon S3 on a weekly basis. Use the DynamoDB export to S3 feature and rely on manual recovery if tables are deleted","Enable point-in-time recovery (PITR) on each DynamoDB table","Configure AWS CloudTrail to monitor DynamoDB API calls. Set up an Amazon EventBridge rule to detect DeleteTable events and trigger a Lambda function that recreates the deleted table using backup data stored in Amazon S3","Enable deletion protection on DynamoDB tables"],"ans":[3],"you1":[3],"notes":["Backup thủ công hàng tuần vừa tốn công, vừa có thể mất dữ liệu của cả tuần nếu sự cố xảy ra ngay trước lần backup kế tiếp.","PITR giúp KHÔI PHỤC dữ liệu sau khi mất (reactive), nhưng không hề NGĂN việc bảng bị xoá ngay từ đầu.","CloudTrail + EventBridge + Lambda là giải pháp phản ứng SAU KHI đã xoá — bảng và dữ liệu đã mất trước khi quy trình này kịp chạy.","Đúng: deletion protection chặn NGAY hành động xoá bảng ngay từ đầu (preventive), chỉ cần bật 1 lần, gần như không cần vận hành thêm."],"pattern":"Phân biệt giải pháp PREVENTIVE (ngăn chặn trước) với REACTIVE (khôi phục sau khi đã xảy ra)","why":"Deletion protection là cơ chế preventive duy nhất trong các lựa chọn — chặn hành động xoá bảng NGAY TỪ ĐẦU, đúng yêu cầu 'ngăn mất dữ liệu do lỗi con người'.","trap":"PITR và pipeline CloudTrail+EventBridge+Lambda đều 'nghe' như giải pháp bảo vệ dữ liệu tốt, nhưng cả hai chỉ hoạt động SAU KHI bảng đã bị xoá — không ngăn được sự cố xảy ra.","tip":"Ngăn lỗi con người xoá nhầm resource NGAY TỪ ĐẦU → bật deletion protection/termination protection (preventive). PITR/backup chỉ giúp khôi phục dữ liệu (reactive), không ngăn được hành động xoá."},{"id":55,"domain":"perf","topic":"Storage Gateway Tape Gateway for tape backup migration","q":"An enterprise has decided to move its secondary workloads such as backups and archives to AWS cloud. The CTO wishes to move the data stored on physical tapes to Cloud, without changing their current tape backup workflows. The company holds petabytes of data on tapes and needs a cost-optimized solution to move this data to cloud.\nWhat is an optimal solution that meets these requirements while keeping the costs to a minimum?","opts":["Use AWS Direct Connect, a cloud service solution that makes it easy to establish a dedicated network connection from on-premises to AWS to transfer data. Once this is done, Amazon S3 can be used to store data at lesser costs","Use AWS VPN connection between the on-premises datacenter and your Amazon VPC. Once this is established, you can use Amazon Elastic File System (Amazon EFS) to get a scalable, fully managed elastic NFS file system for use with AWS Cloud services and on-premises resources","Use Tape Gateway, which can be used to move on-premises tape data onto AWS Cloud. Then, Amazon S3 archiving storage classes can be used to store data cost-effectively for years","Use AWS DataSync, which makes it simple and fast to move large amounts of data online between on-premises storage and AWS Cloud. Data moved to Cloud can then be stored cost-effectively in Amazon S3 archiving storage classes"],"ans":[2],"you1":[3],"notes":["Direct Connect tốn kém, lâu thiết lập, không hề giải quyết việc GIỮ NGUYÊN workflow backup bằng tape hiện có.","VPN + EFS là file storage, hoàn toàn không liên quan tới việc 'ảo hoá' tape backup đang dùng.","Đúng: Tape Gateway giả lập 'virtual tape' tương thích phần mềm backup hiện tại, không cần đổi workflow, rồi tự chuyển dữ liệu xuống Glacier/Deep Archive giá rẻ.","DataSync CHỈ hỗ trợ giao thức file (NFS/SMB), KHÔNG hỗ trợ giao diện tape — sai hoàn toàn loại hình dữ liệu nguồn."],"pattern":"Di chuyển đúng LOẠI workload (tape backup) lên cloud mà giữ nguyên quy trình hiện có","why":"Tape Gateway là dịch vụ DUY NHẤT giả lập virtual tape tương thích với phần mềm backup tape hiện tại, cho phép giữ nguyên workflow trong khi dữ liệu thực tế nằm trên S3/Glacier giá rẻ.","trap":"AWS DataSync nghe như công cụ 'chuyển dữ liệu lớn' tổng quát phù hợp, nhưng nó CHỈ hỗ trợ giao thức file (NFS/SMB), không hỗ trợ giao diện tape như yêu cầu đề bài.","tip":"Khi đề nói đến backup dùng TAPE vật lý và cần giữ nguyên workflow → luôn nghĩ tới Storage Gateway Tape Gateway, không phải DataSync (chỉ cho file) hay Direct Connect/VPN (chỉ là kết nối mạng)."},{"id":56,"domain":"res","topic":"NLB fixed IP for firewall whitelisting","q":"You are working for a software as a service (SaaS) company as a solutions architect and help design solutions for the company's customers. One of the customers is a bank and has a requirement to whitelist a public IP when the bank is accessing external services across the internet.\nWhich architectural choice do you recommend to maintain high availability, support scaling-up to 10 instances and comply with the bank's requirements?","opts":["Use a Classic Load Balancer with an Auto Scaling Group","Use a Network Load Balancer with an Auto Scaling Group","Use an Application Load Balancer with an Auto Scaling Group","Use an Auto Scaling Group with Dynamic Elastic IPs attachment"],"ans":[1],"you1":[1],"notes":["Classic LB expose DNS động, không có IP tĩnh để khách hàng (ngân hàng) whitelist.","Đúng: NLB cung cấp 1 IP tĩnh cố định (có thể gắn EIP) cho mỗi AZ, đúng yêu cầu whitelist IP của khách hàng.","ALB cũng chỉ expose DNS, không có IP cố định — không đáp ứng yêu cầu whitelist IP tĩnh.","'Dynamic Elastic IP attachment' cho ASG là tính năng KHÔNG TỒN TẠI."],"pattern":"Cần IP TĨNH để đối tác whitelist firewall, vẫn phải HA + scale được","why":"NLB là loại load balancer duy nhất trong các lựa chọn cung cấp địa chỉ IP cố định (hỗ trợ gắn Elastic IP) trong khi vẫn scale và HA phía sau nhờ ASG.","trap":"ALB/Classic LB đều là load balancer hợp lệ và phổ biến hơn NLB trong nhiều tình huống, nhưng cả hai chỉ expose DNS (không có IP cố định) — không đáp ứng đúng yêu cầu whitelist IP.","tip":"Khi đối tác/khách hàng cần WHITELIST một IP cố định cho dịch vụ của bạn → luôn chọn Network Load Balancer (hỗ trợ Elastic IP), không phải ALB/Classic LB (chỉ có DNS)."},{"id":57,"domain":"cost","topic":"ASG Predictive Scaling + target tracking","q":"A streaming media company operates a high-traffic content delivery platform on AWS. The application backend is deployed on Amazon EC2 instances within an Auto Scaling group across multiple Availability Zones in a VPC. The team has observed that workloads follow predictable usage patterns, such as higher viewership on weekends and in the evenings, along with occasional real-time spikes due to viral content. To reduce cost and improve responsiveness, the team wants an automated scaling approach that can forecast future demand using historical usage patterns, scale in advance based on those predictions, and react quickly to unplanned usage surges in real time.\nWhich scaling strategy should a solutions architect recommend to meet these requirements?","opts":["Implement scheduled scaling actions based on pre-defined time windows from historical traffic data. Adjust instance count manually for known high-traffic hours","Use predictive scaling for the Auto Scaling group to analyze daily and weekly patterns, and configure dynamic scaling with target tracking policies to respond to real-time traffic changes","Configure step scaling policies based on EC2 CPU utilization. Use CloudWatch alarms to trigger scaling actions when utilization crosses defined thresholds with incremental adjustments","Set up simple scaling policies with longer cooldown periods to avoid rapid scaling. Trigger scale-out events based on average network throughput"],"ans":[1],"you1":[1],"notes":["Scheduled scaling kèm điều chỉnh THỦ CÔNG không tự động hoá, không thích ứng với biến động ngoài dự kiến (viral content).","Đúng: predictive scaling dùng ML dự báo pattern lặp lại (ngày/tuần) để scale TRƯỚC, kết hợp target tracking để phản ứng realtime với spike bất ngờ.","Step scaling chỉ phản ứng SAU KHI ngưỡng CPU đã vượt — không có khả năng dự báo/scale trước.","Simple scaling với cooldown dài làm CHẬM phản ứng, không có khả năng dự báo trước như yêu cầu đề bài."],"pattern":"Kết hợp 2 CƠ CHẾ scaling bổ trợ: dự báo trước (predictive) + phản ứng tức thời (dynamic)","why":"Predictive scaling xử lý phần pattern LẶP LẠI có thể dự đoán (cuối tuần, buổi tối); target tracking xử lý phần ĐỘT BIẾN không dự đoán được (viral) — kết hợp đáp ứng cả 2 yêu cầu đề bài.","trap":"Step scaling và Simple scaling đều là cơ chế scaling hợp lệ của ASG, nhưng CẢ HAI chỉ phản ứng SAU KHI ngưỡng đã vượt — không có khả năng 'scale trước khi traffic tăng' như đề yêu cầu.","tip":"Traffic có pattern LẶP LẠI theo ngày/tuần + có spike bất ngờ → Predictive Scaling (dự báo trước) kết hợp Dynamic/Target Tracking Scaling (phản ứng tức thời), không chỉ dùng 1 cơ chế đơn lẻ."},{"id":58,"domain":"res","topic":"RDS SQL Server Multi-AZ for maximum availability","q":"An e-commerce company wants to migrate its on-premises application to AWS. The application consists of application servers and a Microsoft SQL Server database. The solution should result in the maximum possible availability for the database layer while minimizing operational and management overhead.\nAs a solutions architect, which of the following would you recommend to meet the given requirements?","opts":["Migrate the data to Amazon RDS for SQL Server database in a cross-region Multi-AZ deployment","Migrate the data to Amazon RDS for SQL Server database in a Multi-AZ deployment","Migrate the data to Amazon RDS for SQL Server database in a cross-region read-replica configuration","Migrate the data to Amazon EC2 instance hosted SQL Server database. Deploy the Amazon EC2 instances in a Multi-AZ configuration"],"ans":[1],"you1":null,"notes":["'Cross-region Multi-AZ deployment' là khái niệm KHÔNG TỒN TẠI — Multi-AZ luôn nằm trong PHẠM VI 1 Region.","Đúng: RDS Multi-AZ cho SQL Server dùng Database Mirroring/Always On, tự động failover, managed hoàn toàn bởi AWS — đúng cả 2 tiêu chí HA và ít vận hành.","Read Replica tối ưu khả năng ĐỌC, không cải thiện được AVAILABILITY khi instance chính gặp sự cố.","Tự host SQL Server trên EC2 đòi hỏi tự quản lý OS/DB patching — vi phạm thẳng yêu cầu 'ít vận hành nhất'."],"pattern":"HA tối đa cho DB + ít vận hành nhất → luôn ưu tiên managed service (RDS) hơn tự host (EC2)","why":"RDS Multi-AZ tự động hoá hoàn toàn việc failover và không yêu cầu quản lý hạ tầng bên dưới — đạt cả tiêu chí availability tối đa lẫn overhead thấp nhất.","trap":"'Cross-region Multi-AZ' là cụm từ nghe rất thuyết phục (kết hợp 2 khái niệm quen thuộc) nhưng là một khái niệm BỊA — Multi-AZ về bản chất luôn giới hạn trong 1 Region.","tip":"Cảnh giác với các cụm từ ghép 2 khái niệm quen thuộc nghe hợp lý nhưng không tồn tại trong thực tế (vd 'cross-region Multi-AZ'); Multi-AZ = HA trong 1 Region, multi-Region = Read Replica/Global Database/Global Tables."},{"id":59,"domain":"sec","topic":"CloudFormation Security Group YAML snippet","multi":true,"q":"What does this AWS CloudFormation snippet do? (Select three)\nSecurityGroupIngress:\n     - IpProtocol: tcp\n       FromPort: 80\n       ToPort: 80\n       CidrIp: 0.0.0.0/0\n     - IpProtocol: tcp\n       FromPort: 22\n       ToPort: 22\n       CidrIp: 192.168.1.1/32","opts":["It configures the inbound rules of a network access control list (network ACL)","It only allows the IP 0.0.0.0 to reach HTTP","It configures a security group's inbound rules","It configures a security group's outbound rules","It allows any IP to pass through on the HTTP port","It prevents traffic from reaching on HTTP unless from the IP 192.168.1.1","It lets traffic flow from one IP on port 22"],"ans":[2,4,6],"you1":null,"notes":["'SecurityGroupIngress' là thuộc tính của resource Security Group, không phải của Network ACL.","0.0.0.0/0 nghĩa là MỌI địa chỉ IP, không phải địa chỉ cụ thể '0.0.0.0'.","Đúng: 'SecurityGroupIngress' định nghĩa các rule INBOUND của 1 Security Group.","Đây là Ingress (inbound), không phải Egress (outbound) — phát biểu sai chiều.","Đúng: rule đầu (0.0.0.0/0, port 80) cho phép BẤT KỲ IP nào truy cập port HTTP.","Sai: rule không hề 'chặn' theo điều kiện phủ định như phát biểu này mô tả — đây là 2 rule ALLOW độc lập.","Đúng: rule thứ hai (192.168.1.1/32, port 22) chỉ cho phép đúng 1 địa chỉ IP đó qua port 22."],"pattern":"Đọc đúng cú pháp YAML/CIDR của CloudFormation Security Group","why":"Snippet định nghĩa 2 rule Ingress của Security Group: (1) cho mọi IP vào port 80, (2) chỉ cho 192.168.1.1 vào port 22 — mỗi dấu '-' là 1 rule độc lập.","trap":"0.0.0.0/0 hay bị đọc nhầm thành 'chỉ IP 0.0.0.0' thay vì đúng nghĩa 'mọi địa chỉ IP'; và SecurityGroupIngress hay bị nhầm với NACL dù tên thuộc tính đã ghi rõ 'SecurityGroup'.","tip":"0.0.0.0/0 luôn có nghĩa là 'mọi IP', không phải một địa chỉ cụ thể. Tên thuộc tính CloudFormation (SecurityGroupIngress/Egress, NetworkAclEntry...) luôn chỉ rõ loại tài nguyên đang cấu hình."},{"id":60,"domain":"sec","topic":"ALB health check vs Security Group misconfiguration","multi":true,"q":"An Elastic Load Balancer has marked all the Amazon EC2 instances in the target group as unhealthy. Surprisingly, when a developer enters the IP address of the Amazon EC2 instances in the web browser, he can access the website.\nWhat could be the reason the instances are being marked as unhealthy? (Select two)","opts":["The route for the health check is misconfigured","The security group of the Amazon EC2 instance does not allow for traffic from the security group of the Application Load Balancer","The Amazon Elastic Block Store (Amazon EBS) volumes have been improperly mounted","You need to attach elastic IP address (EIP) to the Amazon EC2 instances","Your web-app has a runtime that is not supported by the Application Load Balancer"],"ans":[0,1],"you1":null,"notes":["Đúng: nếu health check trỏ sai path/port, ALB sẽ luôn nhận response lỗi/không phản hồi dù ứng dụng vẫn chạy bình thường.","Đúng: SG của EC2 phải cho phép traffic TỪ SG của ALB trên đúng health check port — thiếu rule này khiến request health check bị chặn.","Truy cập được qua IP trực tiếp nghĩa là ứng dụng/ổ đĩa hoạt động bình thường — EBS không phải nguyên nhân.","EIP không bắt buộc khi dùng Load Balancer — đây là phương án đánh lạc hướng.","Không có khái niệm 'ALB không hỗ trợ runtime của web-app' — ALB chỉ hoạt động ở tầng HTTP, không quan tâm runtime phía sau."],"pattern":"Chẩn đoán 'unhealthy' khi app vẫn chạy tốt (truy cập IP trực tiếp OK) → luôn là vấn đề giữa ALB và EC2, không phải app","why":"Vì truy cập trực tiếp qua IP vẫn OK, nguyên nhân chỉ có thể nằm ở ĐƯỜNG health check của ALB: cấu hình sai route/port, hoặc Security Group chặn traffic từ ALB.","trap":"EBS và runtime app là các phương án đánh lạc hướng sang nguyên nhân ỨNG DỤNG, trong khi dữ kiện 'truy cập IP trực tiếp vẫn được' đã loại trừ hoàn toàn khả năng lỗi từ phía ứng dụng.","tip":"Khi app truy cập trực tiếp OK nhưng ALB báo unhealthy → luôn kiểm tra 2 thứ trước tiên: (1) cấu hình đường dẫn/port health check, (2) Security Group của target có cho phép traffic từ SG của Load Balancer hay chưa."},{"id":61,"domain":"sec","topic":"VPC Gateway Endpoints (S3, DynamoDB)","multi":true,"q":"For security purposes, a development team has decided to deploy the Amazon EC2 instances in a private subnet. The team plans to use VPC endpoints so that the instances can access some AWS services securely. The members of the team would like to know about the two AWS services that support Gateway Endpoints.\nAs a solutions architect, which of the following services would you suggest for this requirement? (Select two)","opts":["Amazon Simple Notification Service (Amazon SNS)","Amazon S3","Amazon Simple Queue Service (Amazon SQS)","Amazon DynamoDB","Amazon Kinesis"],"ans":[1,3],"you1":null,"notes":["SNS chỉ hỗ trợ Interface Endpoint, không hỗ trợ Gateway Endpoint.","Đúng: Amazon S3 là 1 trong 2 dịch vụ DUY NHẤT hỗ trợ Gateway Endpoint.","SQS chỉ hỗ trợ Interface Endpoint, không hỗ trợ Gateway Endpoint.","Đúng: Amazon DynamoDB là dịch vụ còn lại hỗ trợ Gateway Endpoint.","Kinesis chỉ hỗ trợ Interface Endpoint, không hỗ trợ Gateway Endpoint."],"pattern":"Ghi nhớ đúng 2 dịch vụ DUY NHẤT hỗ trợ Gateway Endpoint (phần còn lại đều là Interface Endpoint)","why":"Chỉ S3 và DynamoDB hỗ trợ Gateway Endpoint (miễn phí, thêm route vào route table); mọi dịch vụ AWS khác dùng Interface Endpoint (ENI, có phí theo giờ).","trap":"SNS/SQS/Kinesis đều là dịch vụ 'nền tảng' tương tự S3/DynamoDB về độ phổ biến, dễ khiến người học đoán nhầm rằng chúng cũng hỗ trợ Gateway Endpoint.","tip":"Chỉ cần nhớ ĐÚNG 2 cái tên: S3 và DynamoDB dùng Gateway Endpoint (miễn phí). Tất cả dịch vụ AWS khác (SNS, SQS, Kinesis, v.v.) đều dùng Interface Endpoint (PrivateLink, có phí)."},{"id":62,"domain":"cost","topic":"ASG minimum capacity + Reserved Instances","multi":true,"q":"As an e-sport tournament hosting company, you have servers that need to scale and be highly available. Therefore you have deployed an Elastic Load Balancing (ELB) with an Auto Scaling group (ASG) across 3 Availability Zones (AZs). When e-sport tournaments are running, the servers need to scale quickly. And when tournaments are done, the servers can be idle. As a general rule, you would like to be highly available, have the capacity to scale and optimize your costs.\nWhat do you recommend? (Select two)","opts":["Set the minimum capacity to 2","Set the minimum capacity to 1","Set the minimum capacity to 3","Use Dedicated hosts for the minimum capacity","Use Reserved Instances (RIs) for the minimum capacity"],"ans":[0,4],"you1":null,"notes":["Đúng: min=2 đủ để chịu được mất 1 AZ (ASG tự rải đều 2 instance ở 2 AZ khác nhau) mà không tốn thêm chi phí không cần thiết.","Min=1 không chịu được sự cố — nếu AZ chứa instance đó lỗi, hệ thống mất khả dụng hoàn toàn.","Min=3 tốn thêm chi phí không cần thiết so với mức tối thiểu đã đủ an toàn (2 instance đã đủ chịu mất 1 AZ).","Dedicated Host dùng cho compliance/license theo socket, không liên quan tới bài toán baseline capacity + chi phí.","Đúng: vì baseline (minimum) LUÔN được duy trì liên tục, dùng Reserved Instances cho phần này tiết kiệm hơn On-Demand."],"pattern":"Tối ưu chi phí cho phần BASELINE (luôn chạy) + vẫn đủ khả năng chịu lỗi 1 AZ","why":"Minimum = 2 vừa đủ chịu lỗi 1 AZ mà không lãng phí; vì capacity này luôn duy trì liên tục nên RI là lựa chọn giá tốt hơn On-Demand cho đúng phần baseline đó.","trap":"Min=3 nghe 'an toàn hơn' vì khớp với số AZ (3 AZ) nhưng thực chất lãng phí — chỉ cần 2 instance (rải đều 2 AZ) là đã đủ chịu được mất 1 AZ.","tip":"Baseline capacity luôn duy trì liên tục (minimum của ASG) → dùng Reserved Instances/Savings Plans để tối ưu chi phí; phần scale thêm lúc traffic cao mới cần On-Demand/Spot."},{"id":63,"domain":"res","topic":"EKS Kubernetes Cluster Autoscaler","q":"A media company operates a video rendering pipeline on Amazon EKS, where containerized jobs are scheduled using Kubernetes deployments. The application experiences bursty traffic patterns, particularly during peak streaming hours. The platform uses the Kubernetes Horizontal Pod Autoscaler (HPA) to scale pods based on CPU utilization. A solutions architect observes that the total number of EC2 worker nodes remains constant during traffic spikes, even when all nodes are at maximum resource utilization. The company needs a solution that enables automatic scaling of the underlying compute infrastructure when pod demand exceeds cluster capacity.\nWhich solution should the architect implement to resolve this issue with the least operational overhead?","opts":["Use AWS Fargate to replace the EKS worker nodes with serverless compute profiles, allowing Fargate to scale pods automatically without managing EC2 infrastructure","Enable Amazon EC2 Auto Scaling with custom CloudWatch alarms based on cluster-wide CPU and memory usage to dynamically adjust node count in the EKS worker node group","Implement an AWS Lambda function that runs every 10 minutes and checks EKS pod scheduling status. Trigger node scaling manually using the eksctl CLI or AWS SDK if unschedulable pods are detected","Deploy the Kubernetes Cluster Autoscaler to the EKS cluster. Configure it to integrate with the existing EC2 Auto Scaling group to automatically launch or terminate nodes based on pending pod demands"],"ans":[3],"you1":null,"notes":["Chuyển hẳn sang Fargate đòi hỏi redesign ứng dụng vì không phải mọi workload (DaemonSet, GPU rendering...) đều tương thích Fargate.","CloudWatch alarm theo CPU/memory CẤP EC2 không phản ánh đúng việc pod có bị 'pending/unschedulable' hay không — dễ scale sai thời điểm.","Lambda polling mỗi 10 phút + gọi eksctl thủ công là giải pháp TỰ CHẾ, tốn công bảo trì, phản ứng chậm hơn nhiều so với cơ chế có sẵn.","Đúng: Cluster Autoscaler theo dõi TRỰC TIẾP pod bị pending do thiếu tài nguyên, rồi tự tăng/giảm ASG tương ứng — đúng cơ chế chuẩn, ít vận hành nhất."],"pattern":"HPA scale POD nhưng không tự scale NODE — cần thêm tầng Cluster Autoscaler để scale hạ tầng bên dưới","why":"Cluster Autoscaler giám sát trực tiếp tín hiệu 'pod không schedule được do thiếu tài nguyên' từ Kubernetes scheduler, rồi tự điều chỉnh ASG — đúng và chuẩn nhất theo AWS khuyến nghị.","trap":"Theo dõi CPU/memory cấp EC2 bằng CloudWatch alarm nghe hợp lý nhưng KHÔNG phản ánh đúng tín hiệu thực sự cần scale (pod pending), dễ dẫn tới scale sai hoặc trễ.","tip":"HPA chỉ scale SỐ LƯỢNG POD trong node hiện có; muốn tự scale SỐ LƯỢNG NODE bên dưới khi pod không đủ chỗ chạy → luôn cần thêm Kubernetes/Karpenter Cluster Autoscaler tích hợp với ASG."},{"id":64,"domain":"perf","topic":"Aurora I/O-Optimized storage","q":"A digital media platform is preparing to launch a new interactive content service that is expected to receive sudden spikes in user engagement, especially during live events and media releases. The backend uses an Amazon Aurora PostgreSQL Serverless v2 cluster to handle dynamic workloads. The architecture must be capable of scaling both compute and storage performance to maintain low latency and avoid bottlenecks under load. The engineering team is evaluating storage configuration options and wants a solution that will scale automatically with traffic, optimize I/O performance, and remain cost-effective without manual provisioning or tuning.\nWhich configuration will best meet these requirements?","opts":["Configure the Aurora cluster to use Aurora I/O-Optimized storage. This configuration delivers high throughput and low-latency I/O performance with predictable pricing and no I/O-based charges","Configure the Aurora cluster to use General Purpose SSD (gp2) storage. Increase performance by scaling database compute capacity to reduce IOPS bottlenecks","Configure the cluster with Magnetic (Standard) storage to minimize baseline storage costs and rely on Aurora’s autoscaling to handle demand spikes","Select Provisioned IOPS (io1) as the storage type for the Aurora cluster. Manually adjust IOPS based on expected traffic during peak usage"],"ans":[0],"you1":null,"notes":["Đúng: Aurora I/O-Optimized tính phí cố định theo storage, KHÔNG tính phí theo từng I/O — giá dễ dự đoán khi workload I/O cao và đột biến.","gp2 không phải storage type hợp lệ cho Aurora (Aurora có mô hình storage riêng); tăng compute cũng không trực tiếp giải quyết nghẽn I/O.","Magnetic/Standard là loại lưu trữ cũ, hiệu năng thấp, không còn được hỗ trợ cho cấu hình Aurora hiện đại.","io1 không phải tuỳ chọn storage type có thể chọn trực tiếp cho Aurora — Aurora tự trừu tượng hoá lớp IOPS, không cho tự provision như EBS."],"pattern":"Chọn mô hình tính phí storage Aurora phù hợp với workload I/O cao, đột biến, muốn chi phí dễ dự đoán","why":"I/O-Optimized loại bỏ hoàn toàn phí tính theo số lượng I/O, chỉ còn phí storage cố định — tối ưu nhất cho workload có nhiều đọc/ghi đột biến mà không cần tự tay cấu hình IOPS.","trap":"gp2/io1 là các khái niệm EBS quen thuộc bị gài vào ngữ cảnh Aurora, nhưng Aurora KHÔNG cho chọn trực tiếp loại volume EBS như EC2 — storage của Aurora chỉ có 2 cấu hình: Standard và I/O-Optimized.","tip":"Aurora chỉ có 2 cấu hình storage: Standard (trả phí theo I/O, rẻ khi ít I/O) và I/O-Optimized (phí cố định, lợi khi I/O cao/đột biến) — không liên quan tới các loại EBS (gp2/io1/magnetic) của EC2."},{"id":65,"domain":"sec","topic":"S3 bucket policy IP CIDR allow/deny condition","q":"A junior developer has downloaded a sample Amazon S3 bucket policy to make changes to it based on new company-wide access policies. He has requested your help in understanding this bucket policy.\nAs a Solutions Architect, which of the following would you identify as the correct description for the given policy?\n{\n \"Version\": \"2012-10-17\",\n \"Id\": \"S3PolicyId1\",\n \"Statement\": [\n   {\n     \"Sid\": \"IPAllow\",\n     \"Effect\": \"Allow\",\n     \"Principal\": \"*\",\n     \"Action\": \"s3:*\",\n     \"Resource\": \"arn:aws:s3:::examplebucket/*\",\n     \"Condition\": {\n        \"IpAddress\": {\"aws:SourceIp\": \"54.240.143.0/24\"},\n        \"NotIpAddress\": {\"aws:SourceIp\": \"54.240.143.188/32\"}\n     }\n   }\n ]\n}","opts":["It ensures Amazon EC2 instances that have inherited a security group can access the bucket","It ensures the Amazon S3 bucket is exposing an external IP within the Classless Inter-Domain Routing (CIDR) range specified, except one IP","It authorizes an entire Classless Inter-Domain Routing (CIDR) except one IP address to access the Amazon S3 bucket","It authorizes an IP address and a Classless Inter-Domain Routing (CIDR) to access the S3 bucket"],"ans":[2],"you1":null,"notes":["Bucket policy không liên quan gì tới Security Group của EC2 — đây là 2 cơ chế hoàn toàn khác nhau.","Chính sách này KIỂM SOÁT AI được TRUY CẬP bucket, không phải việc bucket 'expose' IP ra ngoài — diễn giải sai chiều.","Đúng: điều kiện IpAddress cho phép cả dải CIDR 54.240.143.0/24, nhưng NotIpAddress loại trừ đúng 1 IP (54.240.143.188) khỏi dải đó.","Chính sách chỉ có 1 điều kiện CIDR (cho phép) và 1 điều kiện loại trừ (1 IP) — không phải 'ủy quyền' riêng biệt cho 1 IP và 1 CIDR như phát biểu mô tả."],"pattern":"Đọc đúng tổ hợp điều kiện IpAddress + NotIpAddress trong IAM policy","why":"IpAddress cho phép cả dải /24, còn NotIpAddress loại trừ đúng 1 địa chỉ /32 nằm trong dải đó — kết quả là 'cho phép cả dải TRỪ 1 IP'.","trap":"Phát biểu về Security Group hoàn toàn đánh lạc hướng sang khái niệm networking khác (EC2 SG), trong khi đây thuần tuý là IAM policy condition áp cho S3 bucket.","tip":"Khi thấy cặp điều kiện IpAddress + NotIpAddress cùng lúc trong 1 statement Allow → đọc là 'cho phép cả dải NotIpAddress liệt kê, TRỪ đi các IP cụ thể trong NotIpAddress'."}],"tables":[{"title":"Truy cập EC2 từ xa (SSH/console)","head":["Tình huống","Giải pháp"],"rows":[["Instance có public IP, cần SSH tạm thời, audit được","EC2 Instance Connect (tiêm public key tạm thời, qua internet)"],["Instance KHÔNG có public IP (private subnet)","EC2 Instance Connect Endpoint, hoặc SSM Session Manager (cần SSM Agent)"],["Không muốn mở port 22 ra ngoài, không quản lý key pair","SSM Session Manager (không cần public IP, không cần security group mở inbound)"],["Cần log mọi lệnh gõ trong phiên làm việc","SSM Session Manager + CloudWatch Logs/S3 logging"]]},{"title":"RDS Multi-AZ vs Read Replica","head":["","Multi-AZ (DB instance)","Read Replica"],"rows":[["Mục đích","HA / failover","Scale đọc"],["Replication","Synchronous","Asynchronous"],["Đọc từ bản sao","Không","Có"],["Phạm vi","1 Region, khác AZ (không có 'cross-region Multi-AZ')","Cùng AZ, khác AZ, khác Region"],["Failover","Tự động, CNAME giữ nguyên","Promote thủ công"],["Backup","Lấy từ standby","—"],["Ghi chú","Multi-AZ DB cluster (1 writer + 2 reader) có reader đọc được","Aurora: gọi là Replica, không có 'standby' riêng"]]},{"title":"S3 storage classes","head":["Class","Truy xuất","Số AZ","Lưu tối thiểu","Dùng khi"],"rows":[["Standard","ms","≥3","—","Truy cập thường xuyên"],["Intelligent-Tiering","ms","≥3","—","Không biết trước pattern"],["Standard-IA","ms","≥3","30 ngày","~1 lần/tháng, cần truy xuất tức thời"],["One Zone-IA","ms","1","30 ngày","Dữ liệu tạo lại được (không dùng khi cần chịu mất cả 1 AZ)"],["Glacier Instant Retrieval","ms","≥3","90 ngày","~1 lần/quý"],["Glacier Flexible Retrieval","phút → giờ","≥3","90 ngày","1–2 lần/năm, chấp nhận chờ"],["Glacier Deep Archive","12–48 giờ","≥3","180 ngày","Lưu trữ dài hạn, rẻ nhất"]]},{"title":"S3 encryption","head":["Kiểu","Ai mã hóa","Ai quản lý khóa","Dùng khi"],"rows":[["SSE-S3","S3 (AES-256)","S3","Mặc định, không yêu cầu đặc biệt"],["SSE-KMS","S3 (AES-256)","KMS","Audit (CloudTrail), rotate tự động hàng năm, phân quyền khóa — dùng Bucket Keys để giảm chi phí gọi KMS"],["DSSE-KMS","S3 (2 lớp)","KMS","Compliance yêu cầu mã hóa 2 lớp"],["SSE-C","S3 (AES-256)","Bạn (gửi mỗi request, bắt buộc HTTPS)","Không muốn AWS lưu khóa"],["Client-side","Bạn","Bạn / KMS","Thuật toán riêng, AWS không thấy plaintext"]]},{"title":"Storage: EBS / Instance Store / EFS / S3","head":["","EBS","Instance Store","EFS","S3"],"rows":[["Loại","Block","Block (vật lý)","File (NFS, POSIX)","Object"],["Phạm vi","1 AZ","1 host","Regional (đa AZ, cần mount target MỖI AZ để latency thấp)","Regional (đa AZ)"],["Dùng chung nhiều EC2","Không (trừ io1/io2 Multi-Attach cùng AZ)","Không","Có","Có (qua API)"],["Bền vững","Có","Mất khi stop/hibernate/terminate","Có","Có"],["Hiệu năng IOPS cao nhất, tạm thời, rẻ nhất","Không (tốn thêm phí ngoài instance)","Có — đã gộp vào giá instance","Không","Không"]]},{"title":"EFS — throughput mode (khác với storage class)","head":["Tình huống","Throughput mode"],"rows":[["Tải thấp trung bình, thỉnh thoảng burst, không muốn cấu hình tay","Burst (mặc định — dùng throughput credit tích luỹ)"],["Cần throughput cao ổn định, không phụ thuộc kích thước file system","Provisioned (trả thêm phí cố định, phải tự chọn mức)"],["Muốn tự scale throughput theo nhu cầu tức thời, không cần tính toán","Elastic"],["Giảm chi phí LƯU TRỮ cho file ít truy cập","EFS IA storage class — KHÔNG liên quan/không tự đổi throughput mode"]]},{"title":"Amazon SQS — tính năng và con số","head":["Tính năng","Dùng khi","Con số"],"rows":[["Delay queue / message timer","Trì hoãn message mới","0 giây – 15 phút"],["Visibility timeout","Chống xử lý trùng khi đang xử lý","Mặc định 30 giây, tối đa 12 giờ"],["Retention","Giữ message khi consumer ngừng","Mặc định 4 ngày, tối đa 14 ngày"],["Long polling","Giảm gọi API rỗng, giảm chi phí","Chờ tối đa 20 giây"],["FIFO","Thứ tự + exactly-once trong 1 queue","Throughput giới hạn"],["Dead-letter queue","Cô lập message lỗi nhiều lần","Sau maxReceiveCount"],["Temporary queue","Request-response","Virtual queue, tạo/xóa miễn phí"],["Scale ASG theo queue","Dùng CloudWatch metric ApproximateNumberOfMessages","SQS KHÔNG có cơ chế 'notification' đẩy sang ASG"],["Nhiều queue + consumer logic","Ưu tiên (priority), hoặc tách 2 giai đoạn khác tốc độ","SQS không có priority sẵn"],["Job bất đồng bộ, chấp nhận gián đoạn, cần retry tự nhiên","SQS (buffer + retry) + EC2 Spot (rẻ nhất khi chịu gián đoạn)"]]},{"title":"Kinesis Data Streams vs Amazon Data Firehose vs Kinesis Data Analytics","head":["","Data Streams","Data Firehose","Data Analytics"],"rows":[["Vai trò","Ingest để tự xử lý bằng nhiều consumer","Deliver v SSE-KMS nhưng chọn SSE-S3), hoặc dùng Lifecycle Policy (chỉ chuyển tầng lưu trữ) khi đề cần tính bất biến WORM thật sự (Object Lock/Vault Lock).","Q7, Q20"],["Đảo vai trò Primary/Backup hoặc đảo chiều tham chiếu Security Group","Nhầm vai trò chính/phụ giữa 2 dịch vụ tương tự (Direct Connect phải là primary, VPN là backup — không phải ngược lại), hoặc đảo chiều rule Security Group (phải mở SG của ALB trên SG của EC2, không phải mở SG của chính ASG).","Q8, Q35"],["Tên dịch vụ/tính năng gần giống nhau nhưng bản chất khác hẳn","Geolocation routing (cố định theo vị trí) bị nhầm với Geoproximity routing (có bias điều chỉnh vùng động); Stored Volumes (giữ toàn bộ data tại chỗ) bị nhầm với Cached Volumes (chỉ giữ phần hay dùng, data chính ở S3); Warm Standby bị nhầm với Multi-Site (mạnh/tốn hơn hẳn yêu cầu).","Q37, Q13, Q5"],["Thêm hạ tầng/chi phí mới thay vì bật tính năng có sẵn rẻ hơn","Mua thêm Read Replica, Snowball vật lý, hay EC2 On-Demand trong khi một tính năng có sẵn gần như miễn phí (API Gateway Caching, multi-part upload, Spot Instances) đã giải quyết đúng yêu cầu với chi phí thấp hơn nhiều.","Q46, Q14, Q43"],["Chọn đúng họ dịch vụ nhưng sai thành viên vì thiếu đúng khả năng kỹ thuật","Virtual Private Gateway không hỗ trợ ECMP (phải dùng Transit Gateway); Amazon SNS không tích hợp trực tiếp SaaS bên thứ ba (phải dùng EventBridge); ElastiCache đòi refactor ứng dụng trong khi DAX thì không cần.","Q41, Q33, Q38"],["Tin vào tính năng/dịch vụ không tồn tại, hoặc hiểu sai khả năng transitive","'Elastic Beanstalk deployment caching feature' và 'cross-region Multi-AZ deployment' là các cụm từ nghe hợp lý nhưng hoàn toàn bịa đặt; VPC Peering bị hiểu nhầm là transitive hoặc nối được đa Region/đa VPC hiệu quả như Direct Connect Gateway.","Q18, Q58, Q22"],["Chọn nhầm công cụ phân tích vì tưởng hỗ trợ real-time trong khi không phải","Amazon QuickSight và Athena không nhận trực tiếp từ Kinesis Data Streams và không phải engine phân tích thời gian thực — vai trò đó thuộc về Kinesis Data Analytics.","Q47"],["Chỉnh sai tham số/lever tối ưu thay vì đổi đúng cấu hình gốc","Giảm IOPS trên io1 thay vì đổi hẳn sang gp2 để tiết kiệm; dùng storage class (IA/One Zone) thay vì đổi throughput mode của EFS; chọn Provisioned + Auto Scaling (vẫn có độ trễ phản ứng) cho tải đột biến khó đoán thay vì On-demand.","Q42, Q51, Q52"]]};
const L = "ABCDEFGH";
const DOM = DATA.domains;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const same = (a,b) => a.length===b.length && [...a].sort().join()===[...b].sort().join();

$("#sub").textContent = `Practice Test #4 \u00b7 ${DATA.questions.length} c\u00e2u \u00b7 gi\u1ea3i th\u00edch ti\u1ebfng Vi\u1ec7t, \u0111\u00e1nh d\u1ea5u c\u00e2u b\u1ea1n t\u1eebng l\u00e0m sai`;
const st = (q,k) => q[k] ? same(q[k], q.ans) : null;
const FILTERS = {
  all: q => true,
  wrong: q => st(q,"you1") === false,
};

// ---- Tabs
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav.tabs button").forEach(x => x.classList.toggle("on", x===b));
  ["quiz","cheat","method"].forEach(t => $("#tab-"+t).classList.toggle("hidden", t!==b.dataset.tab));
});

// ---- Quiz state
let S = {list:[], i:0, sel:[], done:{}, order:{}};

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function start(){
  const f = $("#f-set").value;
  let qs = DATA.questions.filter(FILTERS[f] || (q => q.domain===f));
  if ($("#f-shq").checked) qs = shuffle(qs);
  S = {list:qs, i:0, sel:[], done:{}, order:{}};
  qs.forEach(q => S.order[q.id] = $("#f-sho").checked ? shuffle(q.opts.map((_,k)=>k)) : q.opts.map((_,k)=>k));
  render();
}

function render(){
  const box = $("#quiz");
  if (!S.list.length){ box.innerHTML = "<p>Không có câu nào trong bộ này.</p>"; return; }
  if (S.i >= S.list.length){ return renderSummary(); }
  const q = S.list[S.i], d = S.done[q.id], order = S.order[q.id];
  const answered = !!d, need = q.ans.length;
  const nDone = Object.keys(S.done).length, nOk = Object.values(S.done).filter(x=>x.ok).length;
  const chip = (k,name) => st(q,k)===null ? "" : (st(q,k) ? `<span class="chip ok">${name}: đúng</span>` : `<span class="chip bad">${name}: sai</span>`);
  const prev = chip("you1","Đã làm");
  let h = `<div class="meta"><span>Câu ${S.i+1}/${S.list.length} · Q${q.id}</span><span>Đã làm ${nDone} · Đúng ${nOk}</span></div>
  <div class="progress"><div style="width:${nDone/S.list.length*100}%"></div></div>
  <div><span class="chip">${esc(DOM[q.domain])}</span>${prev}</div>
  <p class="qtext">${esc(q.q)}</p>
  ${need>1 ? `<div class="hint">Chọn ${need} đáp án</div>` : ""}
  <div id="opts">`;
  order.forEach((k,pos) => {
    let cls = "opt";
    if (answered){ if (q.ans.includes(k)) cls += " right"; else if (d.sel.includes(k)) cls += " wrong"; }
    else if (S.sel.includes(k)) cls += " sel";
    h += `<button class="${cls}" data-k="${k}" ${answered?"disabled":""}><span class="k">${L[pos]}</span><span>${esc(q.opts[k])}${answered?`<span class="note">${esc(q.notes[k])}</span>`:""}</span></button>`;
  });
  h += `</div>`;
  if (answered){
    const fmt = a => a ? a.map(k=>L[order.indexOf(k)]).sort().join(", ") : "chưa có";
    const youTxt = `Lần làm trước: ${fmt(q.you1)}`;
    h += `<div class="verdict ${d.ok?"ok":"bad"}">${d.ok?"Chính xác!":"Chưa đúng."} Đáp án: ${q.ans.map(k=>L[order.indexOf(k)]).sort().join(", ")}</div>
    <div class="explain">
      <p><b>Chủ đề:</b> ${esc(q.topic)} · <b>Dạng:</b> ${esc(q.pattern)}</p>
      <p><b>Vì sao:</b> ${esc(q.why)}</p>
      <p><b>Bẫy:</b> ${esc(q.trap)}</p>
      <p><b>Nhớ:</b> ${esc(q.tip)}</p>
      <p style="color:var(--muted);font-size:.85rem">${youTxt}</p>
    </div>`;
  }
  h += `<div class="navrow">
    <button class="btn" id="b-prev" ${S.i===0?"disabled":""}>← Câu trước</button>
    ${answered ? `<button class="btn primary" id="b-next">${S.i===S.list.length-1?"Xem kết quả":"Câu tiếp →"}</button>`
               : `<button class="btn primary" id="b-check" ${S.sel.length!==need?"disabled":""}>Kiểm tra</button>`}
  </div>
  <div class="grid">${S.list.map((x,j)=>{const r=S.done[x.id];return `<button data-j="${j}" class="${j===S.i?"cur":""} ${r?(r.ok?"ok":"bad"):""}">${x.id}</button>`}).join("")}</div>`;
  box.innerHTML = h;

  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (need===1) S.sel = [k];
    else S.sel = S.sel.includes(k) ? S.sel.filter(x=>x!==k) : (S.sel.length<need ? [...S.sel,k] : S.sel);
    render();
  });
  const c = $("#b-check"); if (c) c.onclick = () => { S.done[q.id] = {sel:[...S.sel], ok:same(S.sel,q.ans)}; S.sel=[]; render(); };
  const n = $("#b-next"); if (n) n.onclick = () => { S.i++; S.sel=[]; render(); window.scrollTo({top:0}); };
  $("#b-prev").onclick = () => { S.i--; S.sel=[]; render(); };
  box.querySelectorAll(".grid button").forEach(b => b.onclick = () => { S.i = +b.dataset.j; S.sel=[]; render(); });
}

function renderSummary(){
  const ok = S.list.filter(q => S.done[q.id]?.ok), bad = S.list.filter(q => S.done[q.id] && !S.done[q.id].ok), skip = S.list.filter(q => !S.done[q.id]);
  const pct = S.list.length ? Math.round(ok.length/S.list.length*100) : 0;
  let h = `<h2 style="margin-top:0">Kết quả</h2>
  <div class="score"><div><b>${pct}%</b><span>Tỉ lệ đúng</span></div><div><b>${ok.length}</b><span>Đúng</span></div><div><b>${bad.length+skip.length}</b><span>Sai / bỏ qua</span></div></div>
  <p style="color:var(--muted);font-size:.9rem">Đề thật cần khoảng 72% (720/1000) để đậu.</p>`;
  const DOM_ORDER = ["sec","res","perf","cost"];
  const byDom = {};
  S.list.forEach(q => {
    const d = byDom[q.domain] || (byDom[q.domain] = {total:0, ok:0});
    d.total++;
    if (S.done[q.id]?.ok) d.ok++;
  });
  const domRows = DOM_ORDER.filter(k => byDom[k]).map(k => {
    const d = byDom[k], p = d.total ? Math.round(d.ok/d.total*100) : 0;
    return `<tr><td>${esc(DOM[k])}</td><td>${d.ok}/${d.total}</td><td>${p}%</td></tr>`;
  }).join("");
  if (domRows) h += `<h3>Theo domain</h3><div class="tblwrap"><table><thead><tr><th>Domain</th><th>Đúng/Tổng</th><th>Tỉ lệ</th></tr></thead><tbody>${domRows}</tbody></table></div>`;
  if (bad.length || skip.length){
    h += `<h3>Câu cần xem lại</h3><ul class="result-list">` + [...bad,...skip].map(q => `<li><a data-id="${q.id}">Q${q.id}</a> — ${esc(q.topic)}${S.done[q.id]?"":" (bỏ qua)"}</li>`).join("") + `</ul>
    <div class="navrow"><button class="btn primary" id="b-retry">Làm lại các câu này</button><button class="btn" id="b-again">Làm lại toàn bộ</button></div>`;
  } else h += `<div class="navrow"><button class="btn primary" id="b-again">Làm lại</button></div>`;
  $("#quiz").innerHTML = h;
  $("#quiz").querySelectorAll(".result-list a").forEach(a => a.onclick = () => { S.i = S.list.findIndex(q=>q.id===+a.dataset.id); render(); });
  const r = $("#b-retry"); if (r) r.onclick = () => { const ids = new Set([...bad,...skip].map(q=>q.id)); S.list = S.list.filter(q=>ids.has(q.id)); S.i=0; S.done={}; S.sel=[]; render(); };
  $("#b-again").onclick = start;
}

$("#b-start").onclick = start;
["#f-set","#f-shq","#f-sho"].forEach(s => $(s).onchange = start);

// ---- Cheat sheet
function renderCheat(filter=""){
  const f = filter.trim().toLowerCase();
  let h = "";
  DATA.tables.forEach(t => {
    const rows = t.rows.filter(r => !f || t.title.toLowerCase().includes(f) || r.join(" ").toLowerCase().includes(f));
    if (!rows.length) return;
    h += `<h3>${esc(t.title)}</h3><div class="tblwrap"><table><thead><tr>${t.head.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  });
  $("#cheat").innerHTML = h || "<p>Không tìm thấy.</p>";
}
$("#cs").oninput = e => renderCheat(e.target.value);

// ---- Method & traps
$("#method").innerHTML = `<h2 style="margin-top:0">Phương pháp làm bài</h2><ol class="method">${DATA.method.map(([t,d])=>`<li><b>${esc(t)}.</b> ${esc(d)}</li>`).join("")}</ol>
<h2>Các bẫy bạn hay mắc</h2><div class="tblwrap"><table><thead><tr><th>Bẫy</th><th>Mô tả</th><th>Câu</th></tr></thead><tbody>${DATA.traps.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

renderCheat();
start();
</script>
</body>
</html>
