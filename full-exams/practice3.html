c tiếp."],"pattern":"Giảm số lượng IP cần quản lý trên firewall cho kiến trúc đa Region → Global Accelerator (2 IP tĩnh duy nhất)","why":"Global Accelerator cung cấp đúng 2 IP tĩnh anycast làm điểm vào duy nhất cho tất cả ALB ở mọi Region, giảm đáng kể số IP firewall phải quản lý.","trap":"Gán Elastic IP cho ASG nghe hợp lý về mặt ý tưởng nhưng là điều không thể thực hiện được — ASG không phải là resource có thể gán EIP trực tiếp.","tip":"Nhiều ALB/Region, muốn giảm số IP quản lý trên firewall → Global Accelerator (2 IP tĩnh duy nhất cho toàn bộ hệ thống)."},{"id":36,"domain":"sec","topic":"Security group inbound rule valid custom sources","q":"The DevOps team at an IT company has recently migrated to AWS and they are configuring security groups for their two-tier application with public web servers and private database servers. The team wants to understand the allowed configuration options for an inbound rule for a security group.\nAs a solutions architect, which of the following would you identify as an INVALID option for setting up such a configuration?","opts":["You can use an IP address as the custom source for the inbound rule","You can use an Internet Gateway ID as the custom source for the inbound rule","You can use a security group as the custom source for the inbound rule","You can use a range of IP addresses in CIDR block notation as the custom source for the inbound rule"],"ans":[1],"you1":[3],"notes":["Hợp lệ: IP address đơn lẻ là nguồn hợp lệ cho inbound rule.","KHÔNG hợp lệ: Internet Gateway ID không nằm trong danh sách nguồn hợp lệ cho security group rule.","Hợp lệ: security group khác có thể dùng làm nguồn (phổ biến để cho phép traffic giữa các tầng ứng dụng).","Hợp lệ: dải IP theo CIDR notation là nguồn hợp lệ tiêu chuẩn."],"pattern":"Nhận diện tùy chọn KHÔNG tồn tại trong danh sách nguồn hợp lệ của security group rule","why":"Security group chỉ chấp nhận IP đơn, CIDR block, hoặc security group khác làm nguồn — không có tùy chọn dùng Internet Gateway ID.","trap":"Internet Gateway ID nghe như một định danh tài nguyên VPC hợp lý khác (giống security group ID), nhưng AWS không hỗ trợ nó làm nguồn cho security group rule.","tip":"Nguồn hợp lệ cho security group rule: IP đơn, CIDR block, hoặc security group ID — không bao gồm Internet Gateway ID hay các resource ID khác."},{"id":37,"domain":"cost","topic":"SQS long polling to reduce cost","q":"A financial services company is migrating their messaging queues from self-managed message-oriented middleware systems to Amazon Simple Queue Service (Amazon SQS). The development team at the company wants to minimize the costs of using Amazon SQS.\nAs a solutions architect, which of the following options would you recommend for the given use-case?","opts":["Use SQS visibility timeout to retrieve messages from your Amazon SQS queues","Use SQS message timer to retrieve messages from your Amazon SQS queues","Use SQS short polling to retrieve messages from your Amazon SQS queues","Use SQS long polling to retrieve messages from your Amazon SQS queues"],"ans":[3],"you1":[0],"notes":["Sai: visibility timeout không dùng để retrieve message, mà để ẩn message khỏi consumer khác trong lúc xử lý.","Sai: message timer dùng để trì hoãn message mới, không dùng để retrieve message.","Sai: short polling trả lời ngay cả khi không có message, gây nhiều lần gọi API rỗng, tốn chi phí hơn.","Đúng: long polling chờ tới khi có message (hoặc hết thời gian chờ), giảm số lần gọi API rỗng, tiết kiệm chi phí."],"pattern":"Giảm chi phí SQS bằng cách giảm số lần gọi API rỗng (empty receives)","why":"Long polling chỉ trả response khi có message hoặc hết thời gian chờ, giảm đáng kể số lần gọi API không có kết quả so với short polling.","trap":"Visibility timeout và message timer là 2 khái niệm SQS quen thuộc nhưng hoàn toàn không liên quan tới việc 'retrieve message' — chỉ là distractor dùng thuật ngữ đúng nhưng sai ngữ cảnh.","tip":"Muốn giảm chi phí SQS do gọi API nhiều lần mà không có message → luôn dùng long polling thay vì short polling (mặc định)."},{"id":38,"domain":"sec","topic":"SCP effects: scope, service-linked roles","q":"An AWS Organization is using Service Control Policies (SCPs) for central control over the maximum available permissions for all accounts in their organization. This allows the organization to ensure that all accounts stay within the organization's access control guidelines.\nWhich of the given scenarios are correct regarding the permissions described below? (Select three)","opts":["If a user or role has an IAM permission policy that grants access to an action that is either not allowed or explicitly denied by the applicable service control policy (SCP), the user or role can still perform that action","Service control policy (SCP) affects all users and roles in the member accounts, excluding root user of the member accounts","Service control policy (SCP) does not affect service-linked role","If a user or role has an IAM permission policy that grants access to an action that is either not allowed or explicitly denied by the applicable service control policy (SCP), the user or role can't perform that action","Service control policy (SCP) affects service-linked roles","Service control policy (SCP) affects all users and roles in the member accounts, including root user of the member accounts"],"ans":[2,3,5],"you1":[3,4,5],"notes":["Sai — phủ định của sự thật: nếu SCP không cho phép/deny một action, user/role KHÔNG THỂ thực hiện action đó, kể cả IAM policy có cho phép.","Sai — phủ định của sự thật: SCP ảnh hưởng tới CẢ root user của member account, không loại trừ.","Đúng: SCP không áp dụng cho service-linked role.","Đúng: SCP là giới hạn tối đa — IAM policy cho phép nhưng SCP deny thì user/role vẫn không thực hiện được.","Sai — phủ định của sự thật: SCP KHÔNG ảnh hưởng tới service-linked role.","Đúng: SCP ảnh hưởng tới mọi user/role trong member account, bao gồm cả root user."],"pattern":"SCP là boundary tối đa — luôn đọc kỹ phủ định/khẳng định về phạm vi áp dụng (root user, service-linked role)","why":"SCP hoạt động như giới hạn quyền tối đa (guardrail), áp dụng cho mọi user/role kể cả root, nhưng có ngoại lệ duy nhất là không áp dụng cho service-linked role.","trap":"Đề đưa ra nhiều cặp phát biểu đối lập nhau về cùng một sự thật (ảnh hưởng/không ảnh hưởng root user, service-linked role) để kiểm tra việc nhớ đúng chiều.","tip":"SCP: áp dụng cho MỌI user/role kể cả root, KHÔNG áp dụng cho service-linked role; SCP chỉ giới hạn (deny), không tự cấp quyền."},{"id":39,"domain":"res","topic":"SMB-compatible AWS storage services","q":"A financial services company wants to move the Windows file server clusters out of their datacenters. They are looking for cloud file storage offerings that provide full Windows compatibility. Can you identify the AWS storage services that provide highly reliable file storage that is accessible over the industry-standard Server Message Block (SMB) protocol compatible with Windows systems? (Select two)","opts":["Amazon Elastic File System (Amazon EFS)","File Gateway Configuration of AWS Storage Gateway","Amazon Simple Storage Service (Amazon S3)","Amazon FSx for Windows File Server","Amazon Elastic Block Store (Amazon EBS)"],"ans":[1,3],"you1":[3,4],"notes":["Sai: EFS chỉ hỗ trợ NFS, không hỗ trợ SMB.","Đúng: File Gateway hỗ trợ cả NFS và SMB để truy cập dữ liệu lưu trên S3.","Sai: S3 không hỗ trợ giao thức file SMB, chỉ có REST API.","Đúng: FSx for Windows File Server được xây trên Windows Server, hỗ trợ SMB native.","Sai: EBS là block storage, không hỗ trợ giao thức file SMB."],"pattern":"Nhận diện đúng 2 dịch vụ AWS hỗ trợ giao thức SMB cho Windows","why":"Chỉ FSx for Windows File Server và File Gateway (của Storage Gateway) hỗ trợ giao thức SMB tương thích Windows; EFS/S3/EBS đều không hỗ trợ SMB.","trap":"EFS là 'shared file system' quen thuộc nhưng chỉ hỗ trợ NFS (Linux), dễ bị chọn nhầm nếu không nhớ rõ EFS không hỗ trợ SMB.","tip":"Cần SMB cho Windows: FSx for Windows File Server (full managed, AD-integrated) hoặc File Gateway (hybrid, cache local + S3 backend)."},{"id":40,"domain":"res","topic":"RDS Multi-AZ synchronous replication","q":"A company recently experienced a database outage in its on-premises data center. The company now wants to migrate to a reliable database solution on AWS that minimizes data loss and stores every transaction on at least two nodes.\nWhich of the following solutions meets these requirements?","opts":["Set up an Amazon RDS MySQL DB instance and then create a read replica in another Availability Zone that synchronously replicates the data","Set up an Amazon RDS MySQL DB instance and then create a read replica in a separate AWS Region that synchronously replicates the data","Set up an Amazon EC2 instance with a MySQL DB engine installed that triggers an AWS Lambda function to synchronously replicate the data to an Amazon RDS MySQL DB instance","Set up an Amazon RDS MySQL DB instance with Multi-AZ functionality enabled to synchronously replicate the data"],"ans":[3],"you1":[3],"notes":["Sai: read replica của RDS MySQL luôn replicate BẤT ĐỒNG BỘ (asynchronous), không phải synchronous như phương án nêu.","Sai: tương tự, read replica cross-Region cũng là bất đồng bộ, không đồng bộ (synchronous) như phương án mô tả.","Sai: tự xây bằng EC2 + Lambda vừa phức tạp, vừa không đáng tin cậy bằng Multi-AZ managed sẵn có.","Đúng: RDS Multi-AZ tự động đồng bộ (synchronous) dữ liệu sang standby ở AZ khác, đúng yêu cầu lưu mọi transaction trên ít nhất 2 node."],"pattern":"Phân biệt Multi-AZ (đồng bộ, HA) với Read Replica (bất đồng bộ, scale đọc)","why":"Chỉ Multi-AZ mới đảm bảo đồng bộ (synchronous) dữ liệu sang node thứ hai ngay lập tức, đáp ứng yêu cầu giảm thiểu mất dữ liệu.","trap":"Hai phương án về read replica đều mô tả sai bản chất là 'synchronously replicates' trong khi read replica bản chất luôn là bất đồng bộ — đánh vào việc nhớ nhầm đặc tính 2 cơ chế.","tip":"Cần đồng bộ, lưu trên ≥2 node ngay lập tức để giảm mất dữ liệu → Multi-AZ. Read Replica luôn là bất đồng bộ, dùng để scale đọc, không phải để giảm mất dữ liệu."},{"id":41,"domain":"sec","topic":"NAT Gateway per AZ for private subnet internet access","q":"An engineering lead is designing a VPC with public and private subnets. The VPC and subnets use IPv4 CIDR blocks. There is one public subnet and one private subnet in each of three Availability Zones (AZs) for high availability. An internet gateway is used to provide internet access for the public subnets. The private subnets require access to the internet to allow Amazon EC2 instances to download software updates.\nWhich of the following options represents the correct solution to set up internet access for the private subnets?","opts":["Set up three NAT gateways, one in each public subnet in each AZ. Create a custom route table for each AZ that forwards non-local traffic to the NAT gateway in its AZ","Set up three NAT gateways, one in each private subnet in each AZ. Create a custom route table for each AZ that forwards non-local traffic to the NAT gateway in its AZ","Set up three Internet gateways, one in each private subnet in each AZ. Create a custom route table for each AZ that forwards non-local traffic to the Internet gateway in its AZ","Set up three egress-only internet gateways, one in each public subnet in each AZ. Create a custom route table for each AZ that forwards non-local traffic to the egress-only internet gateway in its AZ"],"ans":[0],"you1":[3],"notes":["Đúng: NAT Gateway phải đặt trong PUBLIC subnet, mỗi AZ một NAT Gateway riêng để đạt AZ-independent architecture.","Sai: NAT Gateway phải đặt ở public subnet, không phải private subnet.","Sai: không thể đặt Internet Gateway trong private subnet — IGW là tài nguyên cấp VPC, không gắn trực tiếp vào subnet riêng lẻ theo cách này.","Sai: Egress-only Internet Gateway chỉ hỗ trợ IPv6, trong khi đề bài dùng IPv4 CIDR block."],"pattern":"NAT Gateway luôn đặt ở public subnet, 1 cái/AZ để tránh single point of failure","why":"Mỗi NAT Gateway chỉ hoạt động trong 1 AZ cụ thể; để kiến trúc không phụ thuộc vào 1 AZ, cần 1 NAT Gateway/AZ đặt tại public subnet của AZ đó.","trap":"Egress-only Internet Gateway nghe giống 'phiên bản an toàn hơn' của NAT Gateway nhưng chỉ dùng cho IPv6 — không áp dụng được cho IPv4 như đề bài yêu cầu.","tip":"NAT Gateway luôn nằm ở PUBLIC subnet (không phải private); muốn AZ-independent, cần 1 NAT Gateway cho mỗi AZ."},{"id":42,"domain":"perf","topic":"AWS Managed Microsoft AD for trust + directory-aware workloads","q":"An e-commerce company uses Microsoft Active Directory to provide users and groups with access to resources on the on-premises infrastructure. The company has extended its IT infrastructure to AWS in the form of a hybrid cloud. The engineering team at the company wants to run directory-aware workloads on AWS for a SQL Server-based application. The team also wants to configure a trust relationship to enable single sign-on (SSO) for its users to access resources in either domain.\nAs a solutions architect, which of the following AWS services would you recommend for this use-case?","opts":["Amazon Cloud Directory","AWS Directory Service for Microsoft Active Directory (AWS Managed Microsoft AD)","Active Directory Connector","Simple Active Directory (Simple AD)"],"ans":[1],"you1":[1],"notes":["Sai: Cloud Directory dùng cho dữ liệu phân cấp của ứng dụng, không thiết lập được trust relationship với AD on-premises.","Đúng: AWS Managed Microsoft AD hỗ trợ chạy directory-aware workload và thiết lập trust relationship với AD on-premises cho SSO.","Sai: AD Connector chỉ cho phép đăng nhập vào AWS bằng AD credentials, không chạy được directory-aware workload trên AWS.","Sai: Simple AD không hỗ trợ trust relationship với domain khác."],"pattern":"Chọn dịch vụ AWS Directory Service theo nhu cầu (chạy workload + trust relationship) thay vì chỉ login AD","why":"Chỉ AWS Managed Microsoft AD hỗ trợ đồng thời chạy directory-aware workload (SQL Server) và thiết lập trust relationship với AD on-premises.","trap":"AD Connector và Simple AD đều liên quan tới Active Directory nên dễ nhầm, nhưng cả hai đều KHÔNG hỗ trợ trust relationship hoặc chạy workload trực tiếp như AWS Managed Microsoft AD.","tip":"Chỉ login AD credentials vào AWS → AD Connector. Chạy workload + cần trust relationship/SSO 2 chiều → AWS Managed Microsoft AD."},{"id":43,"domain":"cost","topic":"CloudFront to reduce S3 egress costs","q":"An IT training company hosted its website on Amazon S3 a couple of years ago. Due to COVID-19 related travel restrictions, the training website has suddenly gained traction. With an almost 300% increase in the requests served per day, the company's AWS costs have sky-rocketed for just the Amazon S3 outbound data costs.\nAs a Solutions Architect, can you suggest an alternate method to reduce costs while keeping the latency low?","opts":["Configure Amazon CloudFront to distribute the data hosted on Amazon S3 cost-effectively","Configure Amazon S3 Batch Operations to read data in bulk at one go, to reduce the number of calls made to Amazon S3 buckets","To reduce Amazon S3 cost, the data can be saved on an Amazon EBS volume connected to an Amazon EC2 instance that can host the application","Use Amazon EFS service, as it provides a shared, scalable, fully managed elastic NFS file system for storing AWS Cloud or on-premises data"],"ans":[0],"you1":[0],"notes":["Đúng: CloudFront giảm chi phí data transfer ra ngoài so với phục vụ trực tiếp từ S3, đồng thời giảm latency nhờ cache tại edge.","Sai: S3 Batch Operations dùng cho xử lý hàng loạt object, không liên quan tới phân phối nội dung/giảm chi phí outbound.","Sai: EBS gắn liền với EC2, chi phí vận hành cao hơn và không giải quyết vấn đề data transfer cost ra internet.","Sai: EFS đắt hơn EBS/S3, không phải giải pháp giảm chi phí."],"pattern":"Giảm chi phí data transfer ra internet từ S3 → đặt CloudFront phía trước","why":"CloudFront giúp giảm chi phí data transfer out (không tính phí S3→CloudFront) và giảm tải trực tiếp lên S3 nhờ cache tại edge location.","trap":"EBS/EFS nghe như phương án 'tự quản lý để tiết kiệm' nhưng thực chất đắt hơn và không giải quyết đúng vấn đề chi phí data transfer ra ngoài.","tip":"Chi phí outbound data transfer từ S3 tăng cao do traffic lớn → luôn đặt CloudFront phía trước S3 để giảm chi phí và tăng tốc độ."},{"id":44,"domain":"sec","topic":"FSx for ONTAP supports SMB+NFS cross-platform","q":"A company is transferring a significant volume of data from on-site storage to AWS, where it will be accessed by Windows, Mac, and Linux-based Amazon EC2 instances within the same AWS region using both SMB and NFS protocols. Part of this data will be accessed regularly, while the rest will be accessed less frequently. The company requires a hosting solution for this data that minimizes operational overhead.\nWhat solution would best meet these requirements?","opts":["Set up an Amazon Elastic File System (Amazon EFS) volume that uses EFS Infrequent Access. Use AWS DataSync to migrate the data to the EFS volume","Set up an Amazon FSx for ONTAP instance. Configure an FSx for ONTAP file system on the root volume and migrate the data to the FSx for ONTAP volume","Set up an Amazon Elastic File System (Amazon EFS) volume that uses EFS Intelligent-Tiering. Use AWS DataSync to migrate the data to the EFS volume","Set up an Amazon FSx for OpenZFS instance. Configure an FSx for OpenZFS file ystem on the root volume and migrate the data to the FSx for OpenZFS volume"],"ans":[1],"you1":[0],"notes":["Sai: EFS không hỗ trợ Windows instance (không hỗ trợ SMB), không đáp ứng yêu cầu truy cập từ Windows.","Đúng: FSx for ONTAP là lựa chọn duy nhất trong họ FSx hỗ trợ đồng thời cả SMB và NFS cho Windows, Mac, Linux.","Sai: tương tự, EFS Intelligent-Tiering vẫn không hỗ trợ SMB/Windows dù có tối ưu chi phí truy cập.","Sai: FSx for OpenZFS hỗ trợ NFS và tương thích Windows/Linux/macOS NHƯNG không hỗ trợ giao thức SMB."],"pattern":"Cần hỗ trợ ĐỒNG THỜI cả SMB và NFS cho đa hệ điều hành → chỉ FSx for ONTAP đáp ứng","why":"Trong họ dịch vụ FSx, chỉ FSx for NetApp ONTAP hỗ trợ đồng thời cả 2 giao thức SMB và NFS, phù hợp truy cập từ Windows, Mac và Linux.","trap":"FSx for OpenZFS nghe như đáp ứng đủ các hệ điều hành (Windows, Linux, macOS) nhưng thực tế KHÔNG hỗ trợ giao thức SMB, chỉ hỗ trợ NFS.","tip":"Cần cả SMB và NFS cùng lúc, đa hệ điều hành → FSx for ONTAP. Chỉ cần NFS, đa hệ điều hành → FSx for OpenZFS. Chỉ Windows/SMB → FSx for Windows."},{"id":45,"domain":"sec","topic":"Security Group stateful vs NACL stateless","q":"A developer has configured inbound traffic for the relevant ports in both the Security Group of the Amazon EC2 instance as well as the Network Access Control List (Network ACL) of the subnet for the Amazon EC2 instance. The developer is, however, unable to connect to the service running on the Amazon EC2 instance.\nAs a solutions architect, how will you fix this issue?","opts":["Security Groups are stateful, so allowing inbound traffic to the necessary ports enables the connection. Network ACLs are stateless, so you must allow both inbound and outbound traffic","Network ACLs are stateful, so allowing inbound traffic to the necessary ports enables the connection. Security Groups are stateless, so you must allow both inbound and outbound traffic","IAM Role defined in the Security Group is different from the IAM Role that is given access in the Network ACLs","Rules associated with Network ACLs should never be modified from command line. An attempt to modify rules from command line blocks the rule and results in an erratic behavior"],"ans":[0],"you1":[2],"notes":["Đúng: Security Group stateful (chỉ cần allow inbound là đủ), NACL stateless (phải allow cả inbound và outbound, kể cả ephemeral port).","Sai — đảo ngược hoàn toàn bản chất: thực tế Security Group mới stateful, NACL mới stateless.","Sai: khái niệm 'IAM Role trong Security Group/NACL' không tồn tại — security group/NACL không liên quan tới IAM Role.","Sai: đây là phát biểu bịa đặt, không có cơ sở kỹ thuật thực tế."],"pattern":"Chỉ mở inbound chưa đủ nếu NACL (stateless) chưa mở cả outbound cho ephemeral port","why":"NACL là stateless nên response traffic (qua ephemeral port) phải được allow riêng ở chiều outbound, khác với Security Group tự động allow return traffic.","trap":"Phương án B đảo ngược hoàn toàn vai trò 2 khái niệm quen thuộc (statful/stateless) — rất dễ chọn nhầm nếu không nhớ chắc chắn định nghĩa.","tip":"Security Group = stateful (allow inbound đủ để response tự động qua được). NACL = stateless (phải allow cả inbound VÀ outbound, bao gồm ephemeral port range)."},{"id":46,"domain":"perf","topic":"Lambda + API Gateway + provisioned concurrency for Python microservice","q":"A healthcare startup is modernizing its monolithic Python-based analytics application by transitioning to a microservices architecture on AWS. As a pilot, the team wants to refactor one module into a standalone microservice that can handle hundreds of requests per second. They are seeking an AWS-native solution that supports Python, scales automatically with traffic, and requires minimal infrastructure management and operational overhead to build, test, and deploy the service efficiently.\nWhich AWS solution best meets these requirements?","opts":["Deploy the microservice in an AWS Fargate task using Amazon ECS. Package the code in a Docker container image with a Python runtime and configure ECS Service Auto Scaling to respond to CPU utilization metrics","Use AWS App Runner to build and deploy the Python application directly from a GitHub repository. Allow App Runner to manage traffic scaling and deployments","Use Amazon EC2 Spot Instances in an Auto Scaling group. Launch the Python application as a background service and install all required dependencies at instance startup","Use AWS Lambda to run the Python-based microservice. Integrate it with Amazon API Gateway for HTTP access and enable provisioned concurrency for performance during peak loads"],"ans":[3],"you1":[0],"notes":["Sai: Fargate đòi hỏi đóng gói Docker image, quản lý Dockerfile — nhiều overhead hơn so với Lambda cho một pilot nhỏ.","Sai: App Runner phù hợp ứng dụng web chạy liên tục hơn là function sự kiện, tốn chi phí kể cả lúc rảnh, cần setup build/deploy phức tạp hơn.","Sai: Spot Instance không đáng tin cậy cho production (có thể bị thu hồi), và vẫn phải tự quản lý Auto Scaling group/instance.","Đúng: Lambda hỗ trợ Python native, tự scale theo traffic, không cần quản lý server, tích hợp sẵn API Gateway, và provisioned concurrency giải quyết cold start khi traffic cao."],"pattern":"Pilot module nhỏ, cần scale tự động, operational overhead thấp nhất → Lambda + API Gateway","why":"Lambda là serverless, hỗ trợ Python native, tự động scale theo traffic mà không cần quản lý hạ tầng — đúng yêu cầu overhead thấp nhất cho một pilot.","trap":"Fargate/App Runner đều là lựa chọn 'ít quản lý hơn EC2' hợp lý nhưng vẫn yêu cầu containerization hoặc cấu hình build/deploy phức tạp hơn Lambda cho use case pilot nhỏ này.","tip":"Module nhỏ, event-driven, cần scale nhanh, overhead thấp nhất → Lambda + API Gateway (+ provisioned concurrency nếu cần giảm cold start)."},{"id":47,"domain":"sec","topic":"Route 53 Resolver inbound/outbound endpoints","q":"A retail company has connected its on-premises data center to the AWS Cloud via AWS Direct Connect. The company wants to be able to resolve Domain Name System (DNS) queries for any resources in the on-premises network from the AWS VPC and also resolve any DNS queries for resources in the AWS VPC from the on-premises network.\nAs a solutions architect, which of the following solutions can be combined to address the given use case? (Select two)","opts":["Create an outbound endpoint on Amazon Route 53 Resolver and then DNS resolvers on the on-premises network can forward DNS queries to Amazon Route 53 Resolver via this endpoint","Create an inbound endpoint on Amazon Route 53 Resolver and then Amazon Route 53 Resolver can conditionally forward queries to resolvers on the on-premises network via this endpoint","Create an inbound endpoint on Amazon Route 53 Resolver and then DNS resolvers on the on-premises network can forward DNS queries to Amazon Route 53 Resolver via this endpoint","Create an outbound endpoint on Amazon Route 53 Resolver and then Amazon Route 53 Resolver can conditionally forward queries to resolvers on the on-premises network via this endpoint","Create a universal endpoint on Amazon Route 53 Resolver and then Amazon Route 53 Resolver can receive and forward queries to resolvers on the on-premises network via this endpoint"],"ans":[2,3],"you1":[3,4],"notes":["Sai: đảo ngược vai trò — on-premises forward DNS vào AWS phải đi qua INBOUND endpoint, không phải outbound.","Sai: đảo ngược vai trò — Route 53 Resolver conditionally forward queries ra on-premises phải qua OUTBOUND endpoint, không phải inbound.","Đúng: inbound endpoint nhận DNS query từ on-premises gửi vào Route 53 Resolver — giải quyết chiều 'resolve VPC resource từ on-prem'.","Đúng: outbound endpoint cho phép Route 53 Resolver forward query ra on-premises resolver — giải quyết chiều 'resolve on-prem resource từ VPC'.","Sai: không tồn tại khái niệm 'universal endpoint' trong Route 53 Resolver — đây là tên bịa đặt."],"pattern":"Phân biệt đúng chiều inbound (vào AWS) và outbound (ra on-premises) endpoint của Route 53 Resolver","why":"Inbound endpoint phục vụ chiều on-premises → AWS (query vào VPC resource); outbound endpoint phục vụ chiều AWS → on-premises (query ra resource on-prem). Cần cả hai cho yêu cầu 2 chiều.","trap":"Hai phương án đầu hoán đổi vai trò inbound/outbound ngược hoàn toàn — rất dễ nhầm nếu không nhớ chính xác chiều hoạt động của từng loại endpoint.","tip":"Inbound endpoint = cổng VÀO cho DNS query từ bên ngoài (on-prem) muốn hỏi AWS. Outbound endpoint = cổng RA để AWS hỏi DNS on-prem."},{"id":48,"domain":"sec","topic":"VPC Sharing (RAM) for centrally-managed VPC","q":"A retail company uses AWS Cloud to manage its IT infrastructure. The company has set up AWS Organizations to manage several departments running their AWS accounts and using resources such as Amazon EC2 instances and Amazon RDS databases. The company wants to provide shared and centrally-managed VPCs to all departments using applications that need a high degree of interconnectivity.\nAs a solutions architect, which of the following options would you choose to facilitate this use-case?","opts":["Use VPC peering to share a VPC with other AWS accounts belonging to the same parent organization from AWS Organizations","Use VPC sharing to share a VPC with other AWS accounts belonging to the same parent organization from AWS Organizations","Use VPC peering to share one or more subnets with other AWS accounts belonging to the same parent organization from AWS Organizations","Use VPC sharing to share one or more subnets with other AWS accounts belonging to the same parent organization from AWS Organizations"],"ans":[3],"you1":[3],"notes":["Sai: VPC peering không hỗ trợ 'share một VPC' theo nghĩa centrally-managed — đây cũng không phải cách VPC peering hoạt động.","Sai: VPC sharing chia sẻ SUBNET, không chia sẻ cả VPC — owner account không thể 'share toàn bộ VPC'.","Sai: VPC peering không có khái niệm chia sẻ subnet, và không tạo ra kiến trúc centrally-managed.","Đúng: VPC sharing (qua AWS RAM) cho phép owner chia sẻ một hoặc nhiều subnet cho các account khác trong cùng Organization."],"pattern":"VPC sharing chia sẻ SUBNET (không phải cả VPC); VPC peering không tạo kiến trúc centrally-managed","why":"VPC Sharing qua AWS RAM đúng cơ chế cho phép owner account chia sẻ subnet cho participant account, tạo kiến trúc VPC dùng chung, quản lý tập trung.","trap":"Cả 2 phương án nói 'share a VPC' đều sai vì VPC sharing về bản chất chia sẻ SUBNET chứ không phải chia sẻ nguyên cả VPC — chi tiết dễ bị bỏ qua.","tip":"VPC Sharing (AWS RAM) = owner chia sẻ SUBNET cho participant account cùng Organization, không chia sẻ nguyên VPC. VPC Peering không liên quan tới centrally-managed VPC."},{"id":49,"domain":"res","topic":"Cross-zone load balancing traffic distribution math","q":"An e-commerce company is using Elastic Load Balancing (ELB) for its fleet of Amazon EC2 instances spread across two Availability Zones (AZs), with one instance as a target in Availability Zone A and four instances as targets in Availability Zone B. The company is doing benchmarking for server performance when cross-zone load balancing is enabled compared to the case when cross-zone load balancing is disabled.\nAs a solutions architect, which of the following traffic distribution outcomes would you identify as correct?","opts":["With cross-zone load balancing enabled, one instance in Availability Zone A receives no traffic and four instances in Availability Zone B receive 25% traffic each. With cross-zone load balancing disabled, one instance in Availability Zone A receives 50% traffic and four instances in Availability Zone B receive 12.5% traffic each","With cross-zone load balancing enabled, one instance in Availability Zone A receives 50% traffic and four instances in Availability Zone B receive 12.5% traffic each. With cross-zone load balancing disabled, one instance in Availability Zone A receives 20% traffic and four instances in Availability Zone B receive 20% traffic each","With cross-zone load balancing enabled, one instance in Availability Zone A receives 20% traffic and four instances in Availability Zone B receive 20% traffic each. With cross-zone load balancing disabled, one instance in Availability Zone A receives no traffic and four instances in Availability Zone B receive 25% traffic each","With cross-zone load balancing enabled, one instance in Availability Zone A receives 20% traffic and four instances in Availability Zone B receive 20% traffic each. With cross-zone load balancing disabled, one instance in Availability Zone A receives 50% traffic and four instances in Availability Zone B receive 12.5% traffic each"],"ans":[3],"you1":[3],"notes":["Sai: nhầm lẫn kết quả — khi enabled traffic chia đều theo TỔNG số instance (20% mỗi instance), không phải 0%/25%.","Sai: hoán đổi ngược 2 trường hợp enabled/disabled với nhau.","Sai: hoán đổi ngược 2 trường hợp enabled/disabled với nhau (kết quả của enabled gán cho disabled và ngược lại).","Đúng: enabled → mỗi node LB chia đều traffic cho TẤT CẢ 5 instance (20%/instance); disabled → mỗi node LB chỉ chia cho instance trong AZ của nó (50% cho 1 instance ở AZ A, 12.5% mỗi instance trong 4 instance ở AZ B)."],"pattern":"Tính toán phân phối traffic cross-zone load balancing: chia đều theo tổng instance (enabled) vs chia theo AZ riêng (disabled)","why":"Khi enabled, mỗi load balancer node phân phối đều cho TẤT CẢ target ở mọi AZ (20% x 5 = 100%); khi disabled, mỗi node chỉ phân phối trong AZ của nó, dẫn tới 1 instance ở AZ A nhận 50%, còn 4 instance ở AZ B chia nhau 50% còn lại (12.5% mỗi instance).","trap":"Các phương án hoán đổi kết quả của 2 trường hợp (enabled ↔ disabled) cho nhau — cần tính toán cẩn thận thay vì đoán theo cảm giác.","tip":"Cross-zone enabled: traffic chia đều cho TỔNG SỐ target toàn bộ các AZ. Disabled: mỗi node LB (mỗi AZ giữ 50% traffic gốc) chỉ chia cho target trong AZ của chính nó."},{"id":50,"domain":"sec","topic":"AMI cross-Region copy, sharing, encrypted snapshot copy rules","q":"The DevOps team at a multi-national company is helping its subsidiaries standardize Amazon EC2 instances by using the same Amazon Machine Image (AMI). Some of these subsidiaries are in the same AWS region but use different AWS accounts whereas others are in different AWS regions but use the same AWS account as the parent company. The DevOps team has hired you as a solutions architect for this project.\nWhich of the following would you identify as CORRECT regarding the capabilities of an Amazon Machine Image (AMI)? (Select three)","opts":["You cannot copy an Amazon Machine Image (AMI) across AWS Regions","You can copy an Amazon Machine Image (AMI) across AWS Regions","You cannot share an Amazon Machine Image (AMI) with another AWS account","Copying an Amazon Machine Image (AMI) backed by an encrypted snapshot cannot result in an unencrypted target snapshot","You can share an Amazon Machine Image (AMI) with another AWS account","Copying an Amazon Machine Image (AMI) backed by an encrypted snapshot results in an unencrypted target snapshot"],"ans":[1,3,4],"you1":[1,4,5],"notes":["Sai — phủ định của sự thật: AMI VẪN có thể copy qua các Region khác bằng CopyImage action.","Đúng: AMI có thể copy giữa các Region qua Console/CLI/SDK/API, hỗ trợ cả EBS-backed và instance-store-backed.","Sai — phủ định của sự thật: AMI VẪN có thể share với account khác (cấp launch permission).","Đúng: copy AMI từ snapshot đã mã hóa KHÔNG BAO GIỜ cho ra snapshot đích không mã hóa — chỉ có chiều ngược lại (unencrypted → encrypted) là khả thi.","Đúng: AMI có thể share với account khác, miễn chủ sở hữu cấp quyền đọc cho snapshot/S3 bucket backing nó.","Sai — phủ định của sự thật: copy snapshot đã mã hóa KHÔNG BAO GIỜ ra kết quả không mã hóa."],"pattern":"Nhớ đúng 3 khả năng thật của AMI: copy cross-Region, share cross-account, và chiều một chiều của mã hóa khi copy","why":"AMI hỗ trợ copy cross-Region và share cross-account; riêng việc mã hóa chỉ có thể đi một chiều: từ unencrypted sang encrypted khi copy, không bao giờ ngược lại.","trap":"Đề đưa ra nhiều cặp phát biểu phủ định đối lập nhau (có thể/không thể copy, có thể/không thể share, encrypted→unencrypted có/không) để kiểm tra nhớ đúng chiều sự thật.","tip":"AMI: luôn copy được cross-Region, luôn share được cross-account; mã hóa chỉ đi 1 chiều khi copy — không bao giờ biến snapshot đã mã hóa thành không mã hóa."},{"id":51,"domain":"perf","topic":"AWS DataSync for automated accelerated online transfer","q":"A global pharmaceutical company wants to move most of the on-premises data into Amazon S3, Amazon Elastic File System (Amazon EFS), and Amazon FSx for Windows File Server easily, quickly, and cost-effectively.\nAs a solutions architect, which of the following solutions would you recommend as the BEST fit to automate and accelerate online data transfers to these AWS storage services?","opts":["Use AWS Transfer Family to automate and accelerate online data transfers to the given AWS storage services","Use File Gateway to automate and accelerate online data transfers to the given AWS storage services","Use AWS Snowball Edge Storage Optimized device to automate and accelerate online data transfers to the given AWS storage services","Use AWS DataSync to automate and accelerate online data transfers to the given AWS storage services"],"ans":[3],"you1":[0],"notes":["Sai: Transfer Family chỉ hỗ trợ S3 và EFS làm backend, không hỗ trợ FSx for Windows File Server như yêu cầu.","Sai: File Gateway chỉ tích hợp với S3, không hỗ trợ trực tiếp EFS hay FSx for Windows File Server.","Sai: Snowball Edge dùng cho chuyển dữ liệu OFFLINE (vật lý), không phải online data transfer như yêu cầu.","Đúng: DataSync tích hợp sẵn với cả S3, EFS, và FSx for Windows File Server, tự động hoá và tăng tốc chuyển dữ liệu online."],"pattern":"Chọn công cụ chuyển dữ liệu online hỗ trợ ĐỒNG THỜI cả 3 đích lưu trữ (S3, EFS, FSx for Windows)","why":"DataSync là dịch vụ duy nhất tích hợp native với cả S3, EFS, và FSx for Windows File Server để tự động hoá và tăng tốc truyền dữ liệu online.","trap":"Transfer Family và File Gateway đều là công cụ truyền dữ liệu hợp lệ nhưng mỗi cái chỉ hỗ trợ một tập con các đích lưu trữ, không đủ cho cả 3 dịch vụ yêu cầu.","tip":"Chuyển dữ liệu online, tự động, tăng tốc, hỗ trợ đa dạng đích (S3/EFS/FSx) → AWS DataSync. Chuyển offline khối lượng lớn → Snowball."},{"id":52,"domain":"sec","topic":"Shield Advanced + DRT for DDoS with minimal architecture change","q":"A regional transportation authority operates a high-traffic public information portal hosted on AWS. The backend consists of Amazon EC2 instances behind an Application Load Balancer (ALB). In recent weeks, the operations team has observed intermittent slowdowns and performance issues. After investigation, the team suspect the application is being targeted by distributed denial-of-service (DDoS) attacks coming from a wide range of IP addresses. The team needs a solution that provides DDoS mitigation, detailed logs for audit purposes, and requires minimal changes to the existing architecture.\nWhich solution best addresses these needs?","opts":["Subscribe to AWS Shield Advanced to gain proactive DDoS protection. Engage the AWS DDoS Response Team (DRT) to analyze traffic patterns and apply mitigations. Use the built-in logging and reporting to maintain an audit trail of detected events","Deploy Amazon GuardDuty and integrate with the EC2 environment. Use GuardDuty findings to manually block suspected IP addresses at the ALB level or within EC2 security groups","Enable Amazon Inspector for the EC2 instances. Use its vulnerability findings to detect potential DDoS attack vectors and patch the EC2 environments accordingly","Create an Amazon CloudFront distribution in front of the ALB. Enable AWS WAF on the distribution and configure custom rules to filter traffic from known malicious IP ranges and geographies. Use CloudFront access logs for analysis"],"ans":[0],"you1":[1],"notes":["Đúng: Shield Advanced cung cấp DDoS protection chuyên biệt, có DRT hỗ trợ, logging/reporting built-in — không cần thay đổi kiến trúc hiện có.","Sai: GuardDuty không chuyên phát hiện/ngăn chặn DDoS theo thời gian thực, và việc chặn IP thủ công không tự động, tăng operational overhead.","Sai: Inspector chỉ quét lỗ hổng bảo mật (CVE), hoàn toàn không liên quan tới phát hiện/ngăn chặn tấn công DDoS.","Sai: thêm CloudFront + WAF giúp giảm thiểu DDoS lớp 7 phần nào nhưng đòi hỏi thay đổi kiến trúc đáng kể (DNS, caching), vi phạm yêu cầu 'minimal changes', và không có DRT hỗ trợ."],"pattern":"DDoS mitigation chuyên biệt + audit log + không đổi kiến trúc → Shield Advanced (không phải GuardDuty/Inspector/tự thêm CloudFront+WAF)","why":"Shield Advanced là dịch vụ chuyên biệt cho DDoS, có đội DRT hỗ trợ trực tiếp, tích hợp logging/reporting sẵn mà không cần tái kiến trúc hệ thống.","trap":"GuardDuty và Inspector đều là dịch vụ bảo mật quen thuộc, nghe hợp lý cho 'phát hiện mối đe dọa' nhưng cả hai đều KHÔNG chuyên biệt cho DDoS mitigation.","tip":"Tấn công DDoS, cần đội phản ứng chuyên trách + ít thay đổi kiến trúc nhất → Shield Advanced (+ DRT). GuardDuty/Inspector không phải công cụ DDoS."},{"id":53,"domain":"perf","topic":"RDS Read Replica for reporting workload offload","q":"The application maintenance team at a company has noticed that the production application is very slow when the business reports are run on the Amazon RDS database. These reports fetch a large amount of data and have complex queries with multiple joins, spanning across multiple business-critical core tables. CPU, memory, and storage metrics are around 50% of the total capacity.\nCan you recommend an improved and cost-effective way of generating the business reports while keeping the production application unaffected?","opts":["Migrate from General Purpose SSD to magnetic storage to enhance IOPS","Configure the Amazon RDS instance to be Multi-AZ DB instance, and connect the report generation tool to the DB instance in a different AZ","Increase the size of Amazon RDS instance","Create a read replica and connect the report generation tool/application to it"],"ans":[3],"you1":[3],"notes":["Sai: magnetic storage chỉ hỗ trợ tương thích ngược, hiệu năng kém hơn SSD, không giúp tăng IOPS.","Sai: không thể đọc trực tiếp từ standby instance của Multi-AZ — standby chỉ dùng cho failover, không phục vụ đọc.","Sai: tăng size instance không giải quyết vấn đề vì CPU/memory/storage đang chỉ ở mức 50%, không phải bottleneck.","Đúng: tạo read replica và route report query sang đó giúp tách tải khỏi production DB mà không ảnh hưởng ứng dụng chính."],"pattern":"Tách tải truy vấn report nặng khỏi production DB mà không tăng cấu hình (vì tài nguyên hiện tại chưa bão hòa)","why":"Read Replica cho phép route các truy vấn report nặng sang một bản sao riêng, giữ production DB không bị ảnh hưởng, đúng và tiết kiệm chi phí hơn tăng instance size.","trap":"Tăng kích thước instance nghe như giải pháp hiển nhiên khi 'chậm', nhưng dữ liệu rõ ràng cho thấy tài nguyên (CPU/memory/storage) mới chỉ dùng 50% — bottleneck không nằm ở năng lực phần cứng.","tip":"Khi tài nguyên DB còn dư (<100%) mà vẫn chậm do truy vấn report nặng → tách sang Read Replica, không phải tăng size instance."},{"id":54,"domain":"sec","topic":"Site-to-Site VPN: VGW on AWS side, Customer Gateway on-prem","q":"A retail organization is moving some of its on-premises data to AWS Cloud. The DevOps team at the organization has set up an AWS Managed IPSec VPN Connection between their remote on-premises network and their Amazon VPC over the internet.\nWhich of the following represents the correct configuration for the IPSec VPN Connection?","opts":["Create a Customer Gateway on both the AWS side of the VPN as well as the on-premises side of the VPN","Create a virtual private gateway (VGW) on the AWS side of the VPN and a Customer Gateway on the on-premises side of the VPN","Create a virtual private gateway (VGW) on both the AWS side of the VPN as well as the on-premises side of the VPN","Create a virtual private gateway (VGW) on the on-premises side of the VPN and a Customer Gateway on the AWS side of the VPN"],"ans":[1],"you1":[3],"notes":["Sai: Customer Gateway luôn đại diện cho phía on-premises, không thể đặt ở cả 2 phía.","Đúng: VGW là endpoint phía AWS, Customer Gateway là tài nguyên AWS đại diện cho thiết bị phía on-premises — đúng cấu hình chuẩn.","Sai: VGW là khái niệm chỉ tồn tại ở phía AWS, không thể đặt VGW ở phía on-premises.","Sai: hoán đổi ngược vai trò — VGW phải ở phía AWS, Customer Gateway phải ở phía on-premises."],"pattern":"Nhớ đúng vai trò cố định: VGW luôn ở phía AWS, Customer Gateway luôn đại diện phía on-premises","why":"Virtual Private Gateway là endpoint VPN phía AWS VPC; Customer Gateway là tài nguyên AWS lưu thông tin về thiết bị VPN phía on-premises — hai khái niệm không thể hoán đổi.","trap":"Phương án D hoán đổi hoàn toàn vị trí 2 khái niệm — nghe vẫn có cấu trúc đúng ngữ pháp nên dễ bị chọn nhầm nếu không nhớ chính xác chiều.","tip":"Site-to-Site VPN: VGW (Virtual Private GATEWAY) luôn ở phía AWS. Customer Gateway luôn đại diện thiết bị/mạng phía on-premises."},{"id":55,"domain":"perf","topic":"NLB routes via primary private IP","q":"A leading online gaming company is migrating its flagship application to AWS Cloud for delivering its online games to users across the world. The company would like to use a Network Load Balancer to handle millions of requests per second. The engineering team has provisioned multiple instances in a public subnet and specified these instance IDs as the targets for the NLB.\nAs a solutions architect, can you help the engineering team understand the correct routing mechanism for these target instances?","opts":["Traffic is routed to instances using the primary elastic IP address specified in the primary network interface for the instance","Traffic is routed to instances using the primary public IP address specified in the primary network interface for the instance","Traffic is routed to instances using the instance ID specified in the primary network interface for the instance","Traffic is routed to instances using the primary private IP address specified in the primary network interface for the instance"],"ans":[3],"you1":[1],"notes":["Sai: NLB không dùng Elastic IP để route traffic tới target khi target được chỉ định bằng instance ID.","Sai: NLB không dùng public IP để route traffic nội bộ tới target — đây là chi tiết dễ hiểu lầm vì instance nằm ở public subnet.","Sai: instance ID chỉ dùng để XÁC ĐỊNH target, không phải cơ chế routing traffic thực tế.","Đúng: khi target được chỉ định bằng instance ID, NLB luôn route traffic qua PRIVATE IP chính của network interface, bất kể instance ở subnet nào."],"pattern":"NLB luôn dùng private IP để route tới target khi target type là instance ID, bất kể instance có public IP hay không","why":"Theo cơ chế routing của NLB, khi target được đăng ký bằng instance ID, traffic luôn được route qua primary private IP của network interface chính, NLB tự rewrite destination IP.","trap":"Việc instance nằm ở PUBLIC subnet dễ khiến người đọc nghĩ NLB dùng public/elastic IP để route — nhưng cơ chế thực tế luôn dùng private IP bất kể vị trí subnet.","tip":"NLB với target type = instance ID → luôn route qua PRIVATE IP của network interface chính, không phải public/elastic IP, dù instance ở public subnet."},{"id":56,"domain":"cost","topic":"CNAME record to map to third-party domain","q":"Your application is hosted by a provider on yourapp.provider.com. You would like to have your users access your application using www.your-domain.com, which you own and manage under Amazon Route 53.\nWhich Amazon Route 53 record should you create?","opts":["Create a PTR record","Create an Alias Record","Create an A record","Create a CNAME record"],"ans":[3],"you1":[3],"notes":["Sai: PTR record dùng để resolve ngược từ IP sang domain (reverse DNS), không dùng để map domain sang domain.","Sai: Alias record chỉ trỏ tới resource AWS (CloudFront, S3, record khác trong cùng hosted zone), không trỏ được tới domain bên thứ ba như provider.com.","Sai: A record trỏ domain tới địa chỉ IP, không dùng để map sang domain khác.","Đúng: CNAME record map một domain/subdomain sang domain khác (không phải zone apex), đúng với www.your-domain.com trỏ tới yourapp.provider.com."],"pattern":"Map một subdomain (không phải zone apex) sang domain của bên thứ ba → CNAME record","why":"CNAME record cho phép map bất kỳ subdomain nào (như www.your-domain.com) sang một domain/subdomain khác, kể cả domain ngoài AWS.","trap":"Alias Record nghe như lựa chọn 'nâng cao, miễn phí hơn' của Route 53, nhưng chỉ hoạt động với tài nguyên AWS hoặc record trong cùng hosted zone, không trỏ được tới domain của bên thứ ba như provider.com.","tip":"www.domain (không phải zone apex) trỏ sang domain bên thứ ba → CNAME. Zone apex hoặc trỏ tới resource AWS → Alias Record."},{"id":57,"domain":"perf","topic":"Storage Gateway Cached Volume for hybrid log archival","q":"A company has a hybrid cloud structure for its on-premises data center and AWS Cloud infrastructure. The company wants to build a web log archival solution such that only the most frequently accessed logs are available as cached data locally while backing up all logs on Amazon S3.\nAs a solutions architect, which of the following solutions would you recommend for this use-case?","opts":["Use AWS Volume Gateway - Stored Volume - to store the most frequently accessed logs locally for low-latency access while storing the full volume with all logs in its Amazon S3 service bucket","Use AWS Direct Connect to store the most frequently accessed logs locally for low-latency access while storing the full backup of logs in an Amazon S3 bucket","Use AWS Snowball Edge Storage Optimized device to store the most frequently accessed logs locally for low-latency access while storing the full backup of logs in an Amazon S3 bucket","Use AWS Volume Gateway - Cached Volume - to store the most frequently accessed logs locally for low-latency access while storing the full volume with all logs in its Amazon S3 service bucket"],"ans":[3],"you1":[3],"notes":["Sai: Stored Volume lưu TOÀN BỘ dữ liệu ở local, chỉ backup bất đồng bộ lên S3 — ngược với yêu cầu 'chỉ log hay dùng mới cache local'.","Sai: Direct Connect chỉ là kết nối mạng, không phải giải pháp lưu trữ/cache cục bộ.","Sai: Snowball Edge dùng để chuyển dữ liệu vật lý, không phải giải pháp cache cục bộ liên tục.","Đúng: Cached Volume lưu toàn bộ dữ liệu trên S3, chỉ cache phần truy cập thường xuyên ở local — đúng khớp yêu cầu đề bài."],"pattern":"Phân biệt Stored Volume (toàn bộ ở local, backup lên S3) với Cached Volume (toàn bộ ở S3, cache phần hay dùng ở local)","why":"Cached Volume đúng với mô hình 'log hay truy cập nhất nằm local để tốc độ thấp, còn lại lưu đầy đủ trên S3' mà đề bài mô tả.","trap":"Stored Volume và Cached Volume đều thuộc Volume Gateway nên dễ nhầm lẫn — phải đọc kỹ chiều lưu trữ chính (local hay S3) để phân biệt.","tip":"Toàn bộ dữ liệu chính ở LOCAL, backup async lên S3 → Stored Volume. Toàn bộ dữ liệu chính ở S3, chỉ cache phần hay dùng ở local → Cached Volume."},{"id":58,"domain":"perf","topic":"Serverless static+dynamic: S3 + Lambda + DynamoDB + CloudFront","q":"A small business has been running its IT systems on the on-premises infrastructure but the business now plans to migrate to AWS Cloud for operational efficiencies.\nAs a Solutions Architect, can you suggest a cost-effective serverless solution for its flagship application that has both static and dynamic content?","opts":["Host both the static and dynamic content of the web application on Amazon EC2 with Amazon RDS as database. Amazon CloudFront should be configured to distribute the content across geographically disperse regions","Host both the static and dynamic content of the web application on Amazon S3 and use Amazon CloudFront for distribution across diverse regions/countries","Host the static content on Amazon S3 and use Amazon EC2 with Amazon RDS for generating the dynamic content. Amazon CloudFront can be configured in front of Amazon EC2 instance, to make global distribution easy","Host the static content on Amazon S3 and use AWS Lambda with Amazon DynamoDB for the serverless web application that handles dynamic content. Amazon CloudFront will sit in front of AWS Lambda for distribution across diverse regions"],"ans":[3],"you1":[3],"notes":["Sai: EC2 + RDS đều không phải serverless, vi phạm yêu cầu đề bài.","Sai: S3 không thể host nội dung động (dynamic content) — S3 chỉ phục vụ static content.","Sai: dùng EC2 + RDS để sinh nội dung động vi phạm yêu cầu serverless.","Đúng: S3 (static) + Lambda + DynamoDB (dynamic, serverless) + CloudFront (phân phối toàn cầu) — đúng kiến trúc serverless hoàn chỉnh."],"pattern":"Kiến trúc serverless chuẩn cho web app có cả static và dynamic content","why":"S3 phục vụ static content, Lambda + DynamoDB xử lý dynamic content hoàn toàn serverless, CloudFront phân phối toàn cầu — không có thành phần nào cần quản lý server.","trap":"Các phương án dùng EC2 + RDS nghe vẫn hợp lý về mặt chức năng nhưng vi phạm trực tiếp yêu cầu rõ ràng 'serverless' của đề bài.","tip":"Serverless web app với cả static + dynamic content: S3 (static) + Lambda/API Gateway + DynamoDB (dynamic) + CloudFront (phân phối)."},{"id":59,"domain":"perf","topic":"NAT instance vs NAT gateway capabilities","q":"The DevOps team at an IT company is provisioning a two-tier application in a VPC with a public subnet and a private subnet. The team wants to use either a Network Address Translation (NAT) instance or a Network Address Translation (NAT) gateway in the public subnet to enable instances in the private subnet to initiate outbound IPv4 traffic to the internet but needs some technical assistance in terms of the configuration options available for the Network Address Translation (NAT) instance and the Network Address Translation (NAT) gateway.\nAs a solutions architect, which of the following options would you identify as CORRECT? (Select three)","opts":["Security Groups can be associated with a NAT instance","NAT gateway can be used as a bastion server","Security Groups can be associated with a NAT gateway","NAT instance can be used as a bastion server","NAT gateway supports port forwarding","NAT instance supports port forwarding"],"ans":[0,3,5],"you1":[0,3,4],"notes":["Đúng: NAT instance là một EC2 instance thực sự nên có thể gắn Security Group.","Sai: NAT gateway KHÔNG thể dùng làm bastion server.","Sai: NAT gateway KHÔNG thể gắn Security Group (khác với NAT instance).","Đúng: NAT instance (là EC2) có thể dùng làm bastion server.","Sai — phủ định của sự thật: NAT gateway KHÔNG hỗ trợ port forwarding.","Đúng: NAT instance hỗ trợ port forwarding (vì về bản chất là EC2 instance có thể cấu hình tùy ý)."],"pattern":"NAT instance (là EC2) có đầy đủ tính linh hoạt của EC2 (SG, bastion, port forwarding); NAT gateway (managed) thì không có các tính năng đó","why":"NAT instance thực chất là một EC2 instance nên thừa hưởng mọi khả năng của EC2 (gắn SG, làm bastion, port forwarding), còn NAT gateway là managed service bị giới hạn các tính năng này.","trap":"Người làm dễ nhầm NAT gateway (do mạnh hơn về hiệu năng/HA) cũng có các tính năng linh hoạt như NAT instance, nhưng thực chất managed service luôn đánh đổi tính linh hoạt để lấy sự đơn giản vận hành.","tip":"NAT instance = EC2 instance thật → gắn được SG, làm bastion, hỗ trợ port forwarding. NAT gateway = managed, hiệu năng/HA cao hơn nhưng KHÔNG có các khả năng tùy biến trên."},{"id":60,"domain":"res","topic":"EC2 CloudWatch alarm auto-recovery behavior","q":"The engineering team at a social media company wants to use Amazon CloudWatch alarms to automatically recover Amazon EC2 instances if they become impaired. The team has hired you as a solutions architect to provide subject matter expertise.\nAs a solutions architect, which of the following statements would you identify as CORRECT regarding this automatic recovery process? (Select two)","opts":["During instance recovery, the instance is migrated during an instance reboot, and any data that is in-memory is retained","If your instance has a public IPv4 address, it does not retain the public IPv4 address after recovery","If your instance has a public IPv4 address, it retains the public IPv4 address after recovery","Terminated Amazon EC2 instances can be recovered if they are configured at the launch of instance","A recovered instance is identical to the original instance, including the instance ID, private IP addresses, Elastic IP addresses, and all instance metadata"],"ans":[2,4],"you1":[0,2],"notes":["Sai — phủ định của sự thật: dữ liệu in-memory bị MẤT (lost) trong quá trình recovery, không được giữ lại.","Sai — phủ định của sự thật: instance VẪN giữ nguyên public IPv4 address sau khi recovery.","Đúng: instance giữ nguyên public IPv4 address sau khi được recovery.","Sai: terminated instance KHÔNG THỂ recovery trong bất kỳ trường hợp nào, kể cả có cấu hình trước.","Đúng: instance sau recovery giữ nguyên instance ID, private IP, Elastic IP, và toàn bộ metadata."],"pattern":"Nhớ đúng cái gì được giữ nguyên (ID, IP, metadata, public IP) và cái gì bị mất (dữ liệu in-memory) khi EC2 tự động recovery","why":"Recovery giữ nguyên toàn bộ danh tính instance (ID, các loại IP, metadata) nhưng dữ liệu trong bộ nhớ RAM bị mất do quá trình migrate kèm reboot.","trap":"Terminated instance 'có thể recovery nếu cấu hình trước' nghe như một tùy chọn nâng cao hợp lý, nhưng thực tế terminated instance không bao giờ recovery được trong bất kỳ trường hợp nào.","tip":"EC2 recovery: giữ nguyên ID/IP/metadata, MẤT dữ liệu in-memory. Terminated instance không bao giờ recovery được."},{"id":61,"domain":"sec","topic":"Target tracking scaling policy with custom SQS metric","q":"An e-commerce company runs its web application on Amazon EC2 instances in an Auto Scaling group and it's configured to handle consumer orders in an Amazon Simple Queue Service (Amazon SQS) queue for downstream processing. The DevOps team has observed that the performance of the application goes down in case of a sudden spike in orders received.\nAs a solutions architect, which of the following solutions would you recommend to address this use-case?","opts":["Use a simple scaling policy based on a custom Amazon SQS queue metric","Use a target tracking scaling policy based on a custom Amazon SQS queue metric","Use a scheduled scaling policy based on a custom Amazon SQS queue metric","Use a step scaling policy based on a custom Amazon SQS queue metric"],"ans":[1],"you1":[1],"notes":["Sai: simple scaling phải chờ hết cooldown period trước khi phản ứng alarm tiếp theo, không đủ nhanh cho spike đột ngột.","Đúng: target tracking tự tính số instance cần thiết dựa theo backlog-per-instance, phản ứng chính xác và nhanh với traffic spike.","Sai: scheduled scaling chỉ áp dụng cho traffic có quy luật thời gian biết trước, không xử lý được spike đột ngột không lường trước.","Sai: step scaling chỉ ước lượng gần đúng số instance cần thêm theo bậc thang, kém chính xác hơn target tracking."],"pattern":"Chọn loại scaling policy phản ứng nhanh và chính xác nhất với traffic spike đột ngột dựa trên custom metric","why":"Target tracking tính chính xác số instance cần thiết dựa trên backlog-per-instance so với target value, phản ứng tỉ lệ thuận và tức thời với mức tăng traffic.","trap":"Step scaling nghe như giải pháp 'theo cấp độ' hợp lý cho spike, nhưng chỉ ước lượng gần đúng theo bậc thang alarm, không chính xác bằng việc tính toán trực tiếp của target tracking.","tip":"Traffic spike đột ngột cần scale chính xác và nhanh theo custom metric (như SQS backlog) → target tracking scaling policy."},{"id":62,"domain":"perf","topic":"AZ ID to coordinate AZs across accounts","q":"An IT consultant is helping a small business revamp their technology infrastructure on the AWS Cloud. The business has two AWS accounts and all resources are provisioned in the us-west-2 region. The IT consultant is trying to launch an Amazon EC2 instance in each of the two AWS accounts such that the instances are in the same Availability Zone (AZ) of the us-west-2 region. Even after selecting the same default subnet (us-west-2a) while launching the instances in each of the AWS accounts, the IT consultant notices that the Availability Zones (AZs) are still different.\nAs a solutions architect, which of the following would you suggest resolving this issue?","opts":["Use the default subnet to uniquely identify the Availability Zones across the two AWS Accounts","Use the default VPC to uniquely identify the Availability Zones across the two AWS Accounts","Reach out to AWS Support for creating the Amazon EC2 instances in the same Availability Zone (AZ) across the two AWS accounts","Use Availability Zone (AZ) ID to uniquely identify the Availability Zones across the two AWS Accounts"],"ans":[3],"you1":[3],"notes":["Sai: tên subnet mặc định (us-west-2a) không đồng nhất vị trí vật lý giữa các account khác nhau.","Sai: VPC là tài nguyên theo Region, không giúp xác định AZ cụ thể giữa các account.","Sai: không cần liên hệ AWS Support — vấn đề giải quyết được bằng AZ ID, một tính năng công khai sẵn có.","Đúng: AZ ID là định danh nhất quán cho cùng 1 vị trí vật lý AZ trên mọi account, khác với tên AZ (như us-west-2a) vốn được map ngẫu nhiên theo từng account."],"pattern":"Tên AZ (vd us-west-2a) không nhất quán giữa các account — phải dùng AZ ID để xác định đúng vị trí vật lý","why":"AWS cố ý map tên AZ (như us-west-2a) ngẫu nhiên khác nhau cho mỗi account để cân bằng tải giữa các AZ; AZ ID mới là định danh vật lý nhất quán xuyên account.","trap":"Việc chọn 'cùng tên subnet mặc định' (us-west-2a) ở cả 2 account nghe như đã đủ đồng bộ AZ, nhưng tên AZ không phải định danh vật lý nhất quán giữa các account.","tip":"Muốn xác định cùng 1 vị trí AZ vật lý giữa nhiều AWS account → luôn dùng AZ ID, không dùng tên AZ (vd us-west-2a) vì tên này map khác nhau theo từng account."},{"id":63,"domain":"perf","topic":"CloudFormation StackSets for multi-account/region deployment","q":"A company has set up AWS Organizations to manage several departments running their own AWS accounts. The departments operate from different countries and are spread across various AWS Regions. The company wants to set up a consistent resource provisioning process across departments so that each resource follows pre-defined configurations such as using a specific type of Amazon EC2 instances, specific IAM roles for AWS Lambda functions, etc.\nAs a solutions architect, which of the following options would you recommend for this use-case?","opts":["Use AWS CloudFormation stacks to deploy the same template across AWS accounts and regions","Use AWS CloudFormation StackSets to deploy the same template across AWS accounts and regions","Use AWS Resource Access Manager (AWS RAM) to deploy the same template across AWS accounts and regions","Use AWS CloudFormation templates to deploy the same template across AWS accounts and regions"],"ans":[1],"you1":[1],"notes":["Sai: một CloudFormation stack chỉ triển khai trong 1 account/region tại một thời điểm, không tự động nhân rộng đa account/region.","Đúng: StackSets mở rộng khả năng của stack để tạo/cập nhật/xóa stack trên nhiều account và region chỉ với 1 thao tác.","Sai: AWS RAM dùng để chia sẻ resource giữa các account, không dùng để deploy template.","Sai: bản thân template chỉ là file mô tả blueprint, không tự triển khai đa account/region nếu không qua StackSets."],"pattern":"Triển khai đồng nhất cấu hình resource trên nhiều account/region cùng lúc → CloudFormation StackSets","why":"StackSets được thiết kế riêng để quản lý vòng đời stack (tạo/cập nhật/xóa) trên nhiều account và region tổ chức chỉ bằng một thao tác duy nhất từ admin account.","trap":"CloudFormation stack/template đơn thuần nghe như đã đủ để 'deploy across accounts and regions' nhưng thực chất chỉ StackSets mới có khả năng nhân rộng đa account/region.","tip":"Cần cùng 1 template deploy đồng loạt nhiều account/region trong AWS Organization → CloudFormation StackSets, không phải stack/template đơn lẻ."},{"id":64,"domain":"cost","topic":"Alias record at zone apex (cost-effective, CNAME not allowed)","q":"A startup has created a new web application for users to complete a risk assessment survey for COVID-19 symptoms via a self-administered questionnaire. The startup has purchased the domain covid19survey.com using Amazon Route 53. The web development team would like to create Amazon Route 53 record so that all traffic for covid19survey.com is routed to www.covid19survey.com.\nAs a solutions architect, which of the following is the MOST cost-effective solution that you would recommend to the web development team?","opts":["Create an NS record for covid19survey.com that routes traffic to www.covid19survey.com","Create an alias record for covid19survey.com that routes traffic to www.covid19survey.com","Create an MX record for covid19survey.com that routes traffic to www.covid19survey.com","Create a CNAME record for covid19survey.com that routes traffic to www.covid19survey.com"],"ans":[1],"you1":[3],"notes":["Sai: NS record định danh name server cho hosted zone, không dùng để route traffic sang domain khác.","Đúng: Alias record là lựa chọn duy nhất có thể tạo tại zone apex (covid19survey.com) để trỏ sang record khác trong cùng hosted zone, và miễn phí truy vấn.","Sai: MX record dùng cho mail server, không dùng để route web traffic.","Sai: KHÔNG THỂ tạo CNAME record tại zone apex (covid19survey.com) theo quy tắc DNS."],"pattern":"Route traffic tại ZONE APEX (domain gốc, không phải subdomain) — chỉ Alias record làm được, không phải CNAME","why":"DNS không cho phép CNAME tại zone apex; Alias record là giải pháp Route 53 độc quyền thay thế, đồng thời miễn phí truy vấn (không tính phí như CNAME).","trap":"CNAME record là lựa chọn 'tự nhiên' để map domain sang domain, nhưng quy tắc DNS cấm tạo CNAME tại zone apex — đây là bẫy kỹ thuật kinh điển.","tip":"Route traffic tại zone apex (domain gốc, không có www) → bắt buộc dùng Alias record (không được dùng CNAME); Alias cũng miễn phí truy vấn, tiết kiệm chi phí hơn CNAME."},{"id":65,"domain":"cost","topic":"VPC Gateway Endpoint for S3 cost optimization","q":"An e-commerce company has deployed its application on several Amazon EC2 instances that are configured in a private subnet using IPv4. These Amazon EC2 instances read and write a huge volume of data to and from Amazon S3 in the same AWS region. The company has set up subnet routing to direct all the internet-bound traffic through a Network Address Translation gateway (NAT gateway). The company wants to build the most cost-optimal solution without impacting the application's ability to communicate with Amazon S3 or the internet.\nAs an AWS Certified Solutions Architect Associate, which of the following would you recommend?","opts":["Provision an internet gateway. Update the route table in the private subnet to route traffic to the internet gateway. Update the network ACL (NACL) to allow the S3-bound traffic","Set up an egress-only internet gateway in the public subnet. Update the route table in the private subnet to route traffic to the internet gateway. Update the network ACL to allow the S3-bound traffic","Set up a VPC gateway endpoint for Amazon S3. Attach an endpoint policy to the endpoint. Update the route table to direct the S3-bound traffic to the VPC endpoint","Set up a Gateway Load Balancer (GWLB) endpoint for Amazon S3. Update the route table in the private subnet to direct the S3-bound traffic via the Gateway Load Balancer (GWLB) endpoint"],"ans":[2],"you1":[3],"notes":["Sai: thêm route tới Internet Gateway cho private subnet sẽ biến nó thành public subnet, làm NAT gateway hiện tại trở nên dư thừa — không tối ưu kiến trúc/chi phí.","Sai: Egress-only Internet Gateway chỉ hỗ trợ IPv6, trong khi đề bài dùng IPv4.","Đúng: Gateway Endpoint cho S3 miễn phí, giữ traffic trong mạng AWS, loại bỏ chi phí NAT Gateway cho phần traffic đi tới S3.","Sai: không thể dùng Gateway Load Balancer endpoint để truy cập S3 — GWLB endpoint dùng cho tích hợp virtual appliance, không áp dụng cho S3."],"pattern":"Loại bỏ chi phí NAT Gateway cho traffic S3 cùng Region bằng Gateway Endpoint (miễn phí)","why":"Gateway Endpoint cho S3 hoàn toàn miễn phí, loại bỏ việc traffic S3 phải đi qua NAT Gateway (vốn tính phí theo GB xử lý), đúng yêu cầu tối ưu chi phí nhất.","trap":"Thêm Internet Gateway cho private subnet nghe như giải pháp 'đơn giản hóa' nhưng thực chất biến nó thành public subnet và làm dư thừa NAT Gateway hiện có — không phải tối ưu.","tip":"EC2 private subnet, traffic lớn tới S3/DynamoDB cùng Region, muốn giảm chi phí NAT Gateway → luôn thêm Gateway Endpoint (miễn phí) thay vì định tuyến qua NAT/Internet Gateway."}],"tables":[{"title":"Truy cập EC2 từ xa (SSH/console)","head":["Tình huống","Giải pháp"],"rows":[["Instance có public IP, cần SSH tạm thời, audit được","EC2 Instance Connect (tiêm public key tạm thời, qua internet)"],["Instance KHÔNG có public IP (private subnet)","EC2 Instance Connect Endpoint, hoặc SSM Session Manager (cần SSM Agent)"],["Không muốn mở port 22 ra ngoài, không quản lý key pair","SSM Session Manager (không cần public IP, không cần security group mở inbound)"],["Cần log mọi lệnh gõ trong phiên làm việc","SSM Session Manager + CloudWatch Logs/S3 logging"]]},{"title":"RDS Multi-AZ vs Read Replica","head":["","Multi-AZ (DB instance)","Read Replica"],"rows":[["Mục đích","HA / failover","Scale đọc"],["Replication","Synchronous","Asynchronous"],["Đọc từ bản sao","Không","Có"],["Phạm vi","1 Region, khác AZ","Cùng AZ, khác AZ, khác Region"],["Failover","Tự động, CNAME giữ nguyên","Promote thủ công"],["Backup","Lấy từ standby","—"],["Ghi chú","Multi-AZ DB cluster (1 writer + 2 reader) có reader đọc được","Aurora: gọi là Replica, không có 'standby' riêng"]]},{"title":"S3 storage classes","head":["Class","Truy xuất","Số AZ","Lưu tối thiểu","Dùng khi"],"rows":[["Standard","ms","≥3","—","Truy cập thường xuyên"],["Intelligent-Tiering","ms","≥3","—","Không biết trước pattern"],["Standard-IA","ms","≥3","30 ngày","~1 lần/tháng, cần truy xuất tức thời"],["One Zone-IA","ms","1","30 ngày","Dữ liệu tạo lại được (không dùng cho dữ liệu khó tái tạo)"],["Glacier Instant Retrieval","ms","≥3","90 ngày","~1 lần/quý"],["Glacier Flexible Retrieval","phút → giờ","≥3","90 ngày","1–2 lần/năm, chấp nhận chờ"],["Glacier Deep Archive","12–48 giờ","≥3","180 ngày","Lưu trữ dài hạn, rẻ nhất"]]},{"title":"S3 encryption","head":["Kiểu","Ai mã hóa","Ai quản lý khóa","Dùng khi"],"rows":[["SSE-S3","S3 (AES-256)","S3","Mặc định, không yêu cầu đặc biệt"],["SSE-KMS","S3 (AES-256)","KMS","Audit (CloudTrail), rotate, phân quyền khóa — dùng Bucket Keys để giảm chi phí gọi KMS"],["DSSE-KMS","S3 (2 lớp)","KMS","Compliance yêu cầu mã hóa 2 lớp"],["SSE-C","S3 (AES-256)","Bạn (gửi mỗi request, bắt buộc HTTPS)","Không muốn AWS lưu khóa"],["Client-side","Bạn","Bạn / KMS","Thuật toán riêng, AWS không thấy plaintext"]]},{"title":"Storage: EBS / Instance Store / EFS / S3","head":["","EBS","Instance Store","EFS","S3"],"rows":[["Loại","Block","Block (vật lý)","File (NFS, POSIX)","Object"],["Phạm vi","1 AZ","1 host","Regional (đa AZ)","Regional (đa AZ)"],["Dùng chung nhiều EC2","Không (trừ io1/io2 Multi-Attach cùng AZ)","Không","Có","Có (qua API)"],["Bền vững","Có","Mất khi stop/hibernate/terminate","Có","Có"],["Hiệu năng IOPS cao nhất, tạm thời, rẻ nhất","Không (tốn thêm phí ngoài instance)","Có — đã gộp vào giá instance","Không","Không"]]},{"title":"Amazon SQS — tính năng và con số","head":["Tính năng","Dùng khi","Con số"],"rows":[["Delay queue / message timer","Trì hoãn message mới","0 giây – 15 phút"],["Visibility timeout","Chống xử lý trùng khi đang xử lý","Mặc định 30 giây, tối đa 12 giờ"],["Retention","Giữ message khi consumer ngừng","Mặc định 4 ngày, tối đa 14 ngày"],["Long polling","Giảm gọi API rỗng, giảm chi phí","Chờ tối đa 20 giây"],["FIFO","Thứ tự + exactly-once trong 1 queue","Throughput giới hạn"],["Dead-letter queue","Cô lập message lỗi nhiều lần","Sau maxReceiveCount"],["Temporary queue","Request-response","Virtual queue, tạo/xóa miễn phí"],["Scale ASG theo queue","Dùng CloudWatch metric ApproximateNumberOfMessages","SQS KHÔNG có cơ chế 'notification' đẩy sang ASG"],["Nhiều queue + consumer logic","Ưu tiên (priority), hoặc tách 2 giai đoạn khác tốc độ","SQS không có priority sẵn"]]},{"title":"Kinesis Data Streams vs Amazon Data Firehose","head":["","Kinesis Data Streams","Data Firehose"],"rows":[["Độ trễ","Real-time (ms)","Near real-time (buffer)"],["Mục đích","Ingest để tự xử lý bằng nhiều consumer","Deliver vào 1 đích (S3/Redshift/OpenSearch/Splunk)"],["Số consumer","Nhiều, độc lập (Enhanced Fan-Out: 2MB/s/shard/consumer riêng)","Chỉ 1 đích, không phải multi-consumer"],["Lưu / replay","24 giờ – 365 ngày, replay được","Không"],["Capacity","Provisioned (shard) hoặc On-demand; throughput mặc định chia sẻ giữa consumer → cần Enhanced Fan-Out nếu nhiều consumer","Tự động"]]},{"title":"Kết nối mạng","head":["Tình huống","Giải pháp"],"rows":[["2 VPC","VPC Peering (không transitive)"],["Nhiều VPC + on-prem, hub-and-spoke","Transit Gateway"],["Chia sẻ một service / CIDR trùng / kết nối 1 chiều tới SaaS cụ thể","PrivateLink (chỉ TCP, không hỗ trợ UDP)"],["Nhiều account dùng chung subnet","VPC Sharing (AWS RAM)"],["EC2 private → S3/DynamoDB","Gateway Endpoint (miễn phí, qua route table, không qua internet/NAT)"],["On-prem → dịch vụ AWS bằng IP private","Interface Endpoint (ENI, có phí)"],["On-prem ↔ AWS nhanh, rẻ, cần mã hóa sẵn (IPSec)","Site-to-Site VPN"],["On-prem ↔ AWS ổn định, băng thông lớn — KHÔNG tự mã hóa","Direct Connect (vài tuần để cấp phát, cần thêm VPN/MACsec nếu cần mã hóa)"],["DX → dịch vụ public (S3, DynamoDB)","Public VIF"],["DX → 1 VPC / nhiều VPC","Private VIF (+ DX Gateway)"],["EC2 private ra Internet qua NAT","Traffic vẫn ra endpoint PUBLIC của dịch vụ đích (không phải riêng tư)"],["Chặn truy cập S3 trực tiếp, chỉ qua CloudFront; cho CloudFront UPLOAD vào S3","OAC (mới, hỗ trợ cả ghi) thay cho OAI (chỉ đọc)"],["Upload xa tới S3 / tăng tốc cả upload & download","S3 Transfer Acceleration hoặc CloudFront (dùng chung mạng edge)"],["Chứng chỉ HTTPS domain riêng cho CloudFront","ACM LUÔN phải tạo ở us-east-1, bất kể Region của origin"],["TCP đa Region, cần failover nhanh + IP tĩnh","Global Accelerator (không phải HTTP-only như CloudFront)"],["Cả TCP và UDP, hiệu năng cao, IP tĩnh","Network Load Balancer (ALB KHÔNG hỗ trợ UDP)"]]},{"t
