ối hybrid network-to-network, có mã hoá mạng + kiểm soát truy cập chi tiết</p>","answer":"<p>Site-to-Site VPN mã hoá bằng IPSec ngay ở tầng mạng; kết hợp SG/NACL cho phép kiểm soát traffic được phép ở mức chi tiết.</p>","explain":"<ul><li><b>A. ✗</b> Direct Connect không tự mã hoá mạng — cần thêm lớp mã hoá riêng (VPN/MACsec) mới đạt yêu cầu.</li><li><b>B. ✗</b> Client VPN phục vụ kết nối CÁ NHÂN từng user, không phải kết nối toàn bộ network-to-network.</li><li><b>C. ✗</b> Bastion host chỉ cho truy cập ở mức server riêng lẻ (SSH), không mã hoá toàn bộ traffic network-to-network.</li><li><b>D. ✓</b> Site-to-Site VPN dùng IPSec mã hoá network layer + route table/SG/NACL kiểm soát truy cập chi tiết.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Direct Connect nghe 'cao cấp' hơn VPN nhưng lại không tự mã hoá — cần thêm cấu hình bổ sung mới đáp ứng yêu cầu bảo mật của đề.</p>","tip":"<p>Cần network-to-network, có mã hoá SẴN, chi phí hợp lý → Site-to-Site VPN. Direct Connect nhanh/ổn định nhưng không tự mã hoá.</p>"},{"id":62,"topic":"Design Cost-Optimized Architectures – Amazon Athena","supplement":false,"stem":"The data engineering team at an e-commerce company has set up a workflow to ingest the clickstream data into the raw zone of the Amazon S3 data lake. The team wants to run some SQL based data sanity checks on the raw zone of the data lake.<br>What AWS services would you recommend for this use-case such that the solution is cost-effective and easy to maintain?","options":[{"html":"Use Amazon Athena to run SQL based analytics against Amazon S3 data","correct":true},{"html":"Load the incremental raw zone data into an Amazon EMR based Spark Cluster on an hourly basis and use SparkSQL to run the SQL based sanity checks","correct":false},{"html":"Load the incremental raw zone data into Amazon Redshift on an hourly basis and run the SQL based sanity checks","correct":false},{"html":"Load the incremental raw zone data into Amazon RDS on an hourly basis and run the SQL based sanity checks","correct":false}],"multi":1,"analysis":"<p>Truy vấn SQL ad-hoc trên dữ liệu S3, ít vận hành và chi phí thấp nhất</p>","answer":"<p>Athena không cần hạ tầng, không cần nạp dữ liệu vào hệ thống khác — truy vấn trực tiếp trên raw zone của data lake.</p>","explain":"<ul><li><b>A. ✓</b> Redshift cần quản lý/scale cluster, tốn công sức vận hành hơn mức cần thiết cho sanity check đơn giản.</li><li><b>B. ✗</b> EMR Spark cluster chạy hàng giờ đòi hỏi quản lý hạ tầng, không phải lựa chọn ít vận hành nhất.</li><li><b>C. ✗</b> Athena truy vấn SQL trực tiếp trên S3, serverless, trả tiền theo truy vấn — đúng nhu cầu sanity check đơn giản.</li><li><b>D. ✗</b> Load vào RDS theo giờ đòi hỏi job ETL riêng (Lambda/EC2), tăng công sức phát triển và vận hành.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các phương án dùng Redshift/EMR/RDS đều yêu cầu bước 'load dữ liệu vào' trước, phát sinh thêm pipeline không cần thiết cho yêu cầu đơn giản.</p>","tip":"<p>Truy vấn SQL ad-hoc, ít/không vận hành, trực tiếp trên dữ liệu S3 → Amazon Athena, không cần nạp (load) vào kho dữ liệu khác.</p>"},{"id":63,"topic":"Design High-Performing Architectures – Storage tiering: Instance Store / S3 / Glacier","supplement":false,"stem":"A media company is evaluating the possibility of moving its IT infrastructure to the AWS Cloud. The company needs at least 10 terabytes of storage with the maximum possible I/O performance for processing certain files which are mostly large videos. The company also needs close to 450 terabytes of very durable storage for storing media content and almost double of it, i.e. 900 terabytes for archival of legacy data.<br>As a Solutions Architect, which set of services will you recommend to meet these requirements?","options":[{"html":"Amazon EBS for maximum performance, Amazon S3 for durable data storage, and Amazon S3 Glacier for archival storage","correct":false},{"html":"Amazon EC2 instance store for maximum performance, Amazon S3 for durable data storage, and Amazon S3 Glacier for archival storage","correct":true},{"html":"Amazon S3 standard storage for maximum performance, Amazon S3 Intelligent-Tiering for intelligent, durable storage, and Amazon S3 Glacier Deep Archive for archival storage","correct":false},{"html":"Amazon EC2 instance store for maximum performance, AWS Storage Gateway for on-premises durable data access and Amazon S3 Glacier Deep Archive for archival storage","correct":false}],"multi":1,"analysis":"<p>Chọn đúng 3 tầng lưu trữ cho 3 mục đích khác nhau: hiệu năng cao / bền vững / archival</p>","answer":"<p>Mỗi loại storage được chọn đúng vào đặc tính sở trường: Instance Store cho IOPS cực cao, S3 cho độ bền cao phổ thông, Glacier cho archival chi phí thấp.</p>","explain":"<ul><li><b>A. ✗</b> EBS phục vụ tốt cho block storage thông thường nhưng không đạt mức hiệu năng IOPS cao nhất như Instance Store.</li><li><b>B. ✓</b> Instance Store (IOPS cao nhất) + S3 (bền vững, phổ thông) + Glacier (archival rẻ): đúng 3 tầng theo đúng mục đích.</li><li><b>C. ✗</b> S3 Standard không phải là lựa chọn 'hiệu năng cao nhất' theo nghĩa IOPS cấp block như yêu cầu xử lý file video lớn.</li><li><b>D. ✗</b> Storage Gateway dùng khi cần giữ truy cập on-premises, không phải yêu cầu ở đây (đã chuyển hẳn lên cloud).</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> EBS dễ bị chọn nhầm vì 'nghe' là storage hiệu năng cao, nhưng Instance Store (SSD vật lý) mới là lựa chọn IOPS cao nhất.</p>","tip":"<p>Hiệu năng IOPS cực cao (tạm thời) → Instance Store. Lưu trữ bền vững phổ thông → S3 Standard. Lưu trữ dài hạn, rẻ nhất → S3 Glacier.</p>"},{"id":64,"topic":"Design Cost-Optimized Architectures – S3 Lifecycle Policy","supplement":false,"stem":"The content division at a digital media agency has an application that generates a large number of files on Amazon S3, each approximately 10 megabytes in size. The agency mandates that the files be stored for 5 years before they can be deleted. The files are frequently accessed in the first 30 days of the object creation but are rarely accessed after the first 30 days. The files contain critical business data that is not easy to reproduce, therefore, immediate accessibility is always required.<br>Which solution is the MOST cost-effective for the given use case?","options":[{"html":"Set up an Amazon S3 bucket lifecycle policy to move files from Amazon S3 Standard to Amazon S3 Standard-IA 30 days after object creation. Archive the files to Amazon S3 Glacier Deep Archive 5 years after object creation","correct":false},{"html":"Set up an Amazon S3 bucket lifecycle policy to move files from Amazon S3 Standard to Amazon S3 One Zone-IA 30 days after object creation. Delete the files 5 years after object creation","correct":false},{"html":"Set up an Amazon S3 bucket lifecycle policy to move files from Amazon S3 Standard to Amazon S3 Glacier Flexible Retrieval 30 days after object creation. Delete the files 5 years after object creation","correct":false},{"html":"Set up an Amazon S3 bucket lifecycle policy to move files from Amazon S3 Standard to Amazon S3 Standard-IA 30 days after object creation. Delete the files 5 years after object creation","correct":true}],"multi":1,"analysis":"<p>Thiết kế lifecycle S3 tối ưu chi phí mà vẫn giữ truy cập tức thời (ms)</p>","answer":"<p>Standard-IA giữ độ trễ truy xuất ms như Standard nhưng rẻ hơn cho dữ liệu ít truy cập sau 30 ngày; xoá thẳng sau 5 năm vì không có nhu cầu giữ tiếp.</p>","explain":"<ul><li><b>A. ✗</b> Archival vào Glacier Deep Archive sau 5 năm là thừa — dữ liệu đã hết hạn giữ nên xoá luôn, tốn thêm phí archival không cần thiết.</li><li><b>B. ✗</b> One Zone-IA chỉ phù hợp dữ liệu dễ tái tạo; đề nói rõ dữ liệu 'không dễ tái tạo' nên không phù hợp (rủi ro mất dữ liệu khi mất 1 AZ).</li><li><b>C. ✗</b> Glacier Flexible Retrieval có độ trễ truy xuất tính bằng phút→giờ, vi phạm yêu cầu 'luôn cần truy cập ngay lập tức'.</li><li><b>D. ✓</b> Standard → Standard-IA sau 30 ngày → xoá sau 5 năm: đúng storage class cho pattern truy cập, truy xuất tức thời, và không tốn thêm chi phí archival không cần thiết.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 'Archival trước khi xoá' nghe như cẩn thận hơn nhưng lại phát sinh chi phí không cần thiết khi yêu cầu rõ ràng chỉ cần XOÁ sau 5 năm.</p>","tip":"<p>Cần truy cập tức thời (ms) dù ít khi dùng → các class '-IA' (Standard-IA/One Zone-IA), không phải Glacier (độ trễ phút–giờ). Dữ liệu không dễ tái tạo → tránh One Zone (chỉ 1 AZ).</p>"},{"id":65,"topic":"Design Cost-Optimized Architectures – S3 Intelligent-Tiering","supplement":false,"stem":"A medical devices company uses Amazon S3 buckets to store critical data. Hundreds of buckets are used to keep the data segregated and well organized. Recently, the development team noticed that the lifecycle policies on the Amazon S3 buckets have not been applied optimally, resulting in higher costs.<br>As a Solutions Architect, can you recommend a solution to reduce storage costs on Amazon S3 while keeping the IT team's involvement to a minimum?","options":[{"html":"Use Amazon S3 One Zone-Infrequent Access, to reduce the costs on Amazon S3 storage","correct":false},{"html":"Configure Amazon EFS to provide a fast, cost-effective and sharable storage service","correct":false},{"html":"Use Amazon S3 Outposts storage class to reduce the costs on Amazon S3 storage by storing the data on-premises","correct":false},{"html":"Use Amazon S3 Intelligent-Tiering storage class to optimize the Amazon S3 storage costs","correct":true}],"multi":1,"analysis":"<p>Tối ưu chi phí hàng trăm bucket mà không cần đội ngũ IT can thiệp thủ công</p>","answer":"<p>Intelligent-Tiering tự giám sát pattern truy cập của từng object và tự chuyển tầng mà không cần ai cấu hình lifecycle policy thủ công.</p>","explain":"<ul><li><b>A. ✗</b> S3 One Zone-IA chỉ lưu ở 1 AZ, rủi ro hơn và cần biết trước pattern truy cập để áp dụng đúng — không tự động như Intelligent-Tiering.</li><li><b>B. ✗</b> EFS là file storage, đắt hơn S3 cho mục đích lưu trữ dữ liệu dạng object, lại cần EC2/Direct Connect để dùng.</li><li><b>C. ✗</b> S3 Outposts phục vụ lưu trữ on-premises, không liên quan tới việc tối ưu chi phí trên S3 thông thường.</li><li><b>D. ✓</b> S3 Intelligent-Tiering tự động chuyển tầng truy cập, không cần đội IT theo dõi/áp lifecycle policy cho hàng trăm bucket.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> One Zone-IA/Standard-IA đòi hỏi phải BIẾT TRƯỚC pattern truy cập để áp đúng — không phù hợp khi lifecycle policy đang bị áp dụng sai/không tối ưu trên diện rộng.</p>","tip":"<p>Không biết trước pattern truy cập, muốn tự động tối ưu chi phí, ít người can thiệp nhất → S3 Intelligent-Tiering.</p>"}];
const LETTERS = "ABCDEFGH";
const state = {
  order: Q.map((_, i) => i),
  pos: 0,
  sel: {},        // qid -> Set of original option idx
  done: {},       // qid -> true/false (correct?)
  flags: new Set(),
  perm: {},       // qid -> displayed order of original option indices
  hint: {},
  view: "quiz"
};
const $ = s => document.querySelector(s);

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function perm(q){
  if(!state.perm[q.id]) state.perm[q.id] = $("#optShuffleA").checked ? shuffle(q.options.map((_,i)=>i)) : q.options.map((_,i)=>i);
  return state.perm[q.id];
}
function visible(){
  const f = $("#fFilter").value, t = $("#fTopic").value;
  return state.order.filter(i => {
    const q = Q[i];
    if(t && topicGroup(q.topic) !== t) return false;
    if(f === "todo") return !(q.id in state.done);
    if(f === "bad") return state.done[q.id] === false;
    if(f === "flag") return state.flags.has(q.id);
    if(f === "sup") return q.supplement;
    return true;
  });
}
function topicGroup(t){ return t.split("–")[0].trim(); }

function renderStats(){
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length, bad = vals.length - ok;
  $("#sDone").textContent = `${vals.length}/${Q.length}`;
  $("#sOk").textContent = ok; $("#sBad").textContent = bad;
  $("#sPct").textContent = vals.length ? Math.round(ok*100/vals.length) + "%" : "–";
  $("#prog").style.width = (vals.length*100/Q.length) + "%";
}
function renderGrid(){
  const vis = new Set(visible());
  const cur = state.order[state.pos];
  const g = $("#grid"); g.innerHTML = "";
  Q.forEach((q, i) => {
    const b = document.createElement("button");
    b.className = "cell";
    if(q.id in state.done) b.classList.add(state.done[q.id] ? "ok" : "bad");
    if(state.flags.has(q.id)) b.classList.add("flag");
    if(q.supplement) b.classList.add("sup");
    if(i === cur && state.view === "quiz") b.classList.add("cur");
    if(!vis.has(i)) b.classList.add("dim");
    b.textContent = q.id;
    b.title = q.topic + (q.supplement ? " (câu bổ sung)" : "");
    b.onclick = () => { state.view = "quiz"; state.pos = state.order.indexOf(i); render(); window.scrollTo({top:0,behavior:"smooth"}); };
    g.appendChild(b);
  });
}

function section(cls, title, html, open){
  return `<details class="sec ${cls}" ${open?"open":""}><summary>${title}</summary><div class="body">${html}</div></details>`;
}

function renderQuiz(){
  const main = $("#main");
  const vis = visible();
  if(!vis.length){ main.innerHTML = `<div class="card empty">Không có câu nào khớp bộ lọc hiện tại.</div>`; return; }
  let idx = state.order[state.pos];
  if(!vis.includes(idx)){ idx = vis[0]; state.pos = state.order.indexOf(idx); }
  const q = Q[idx];
  const answered = q.id in state.done;
  const sel = state.sel[q.id] || new Set();
  const p = perm(q);
  const vpos = vis.indexOf(idx);

  let opts = p.map((oi, k) => {
    const o = q.options[oi];
    let cls = "opt" + (q.multi > 1 ? " multi" : "");
    let tag = "";
    if(answered){
      if(o.correct && sel.has(oi)){ cls += " right"; tag = "✓ Đúng"; }
      else if(!o.correct && sel.has(oi)){ cls += " wrong"; tag = "✗ Bạn chọn"; }
      else if(o.correct){ cls += " right missed"; tag = "✓ Đáp án đúng"; }
    } else if(sel.has(oi)) cls += " sel";
    return `<div class="${cls}" data-oi="${oi}" role="${q.multi>1?"checkbox":"radio"}" aria-checked="${sel.has(oi)}" tabindex="0">
      <span class="key">${LETTERS[k]}</span><span class="txt">${o.html}${tag?`<span class="tag">${tag}</span>`:""}</span></div>`;
  }).join("");

  const showExplain = answered && $("#optAuto").checked;
  let after = "";
  if(answered){
    const ok = state.done[q.id];
    after += `<div class="verdict ${ok?"ok":"bad"}">${ok ? "Chính xác!" :"Chưa đúng. Xem đáp án được đánh dấu xanh và phần giải thích bên dưới."}</div>`;
    after += section("s-analysis", "Phân tích đề", q.analysis, showExplain);
    after += section("s-answer", "Đáp án đúng", q.answer, showExplain);
    after += section("s-explain", "Giải thích", q.explain, showExplain);
    after += section("s-wrong", "Vì sao các đáp án khác sai", q.wrong, showExplain);
    after += section("s-tip", "Mẹo thi", q.tip, showExplain);
  } else if(state.hint[q.id]){
    after += `<div class="hint"><h3>Gợi ý · Phân tích đề</h3><div class="body">${q.analysis}</div></div>`;
  }

  const need = q.multi > 1 ? `Chọn ${q.multi} đáp án` : "Chọn 1 đáp án";
  main.innerHTML = `<div class="card ${answered?"locked":""}">
    <div class="qhead">
      <span class="qnum">Câu ${q.id}</span>
      <span class="chip">${q.topic}</span>
      ${q.supplement ? `<span class="chip sup">Câu bổ sung</span>` : ""}
      <span class="chip multi">${need}</span>
      <button class="flagbtn ${state.flags.has(q.id)?"on":""}" id="btnFlag">${state.flags.has(q.id)?"★ Đã đánh dấu":"☆ Đánh dấu"}</button>
    </div>
    <div class="stem">${q.stem}</div>
    <div class="opts">${opts}</div>
    <div class="actions">
      <button class="btn" id="btnPrev" ${vpos<=0?"disabled":""}>← Câu trước</button>
      ${!answered ? `<button class="btn ghost" id="btnHint">${state.hint[q.id]?"Ẩn gợi ý":"Gợi ý: phân tích đề"}</button>` : `<button class="btn ghost" id="btnRetry">Làm lại câu này</button>`}
      <span class="spacer"></span>
      ${!answered ? `<button class="btn primary" id="btnCheck" ${sel.size!==q.multi?"disabled":""}>Kiểm tra</button>` : ""}
      <button class="btn ${answered?"primary":""}" id="btnNext" ${vpos>=vis.length-1?"disabled":""}>Câu sau →</button>
    </div>
    ${after}
    <div class="kbd"><kbd>A</kbd>–<kbd>E</kbd> hoặc <kbd>1</kbd>–<kbd>5</kbd> chọn đáp án · <kbd>Enter</kbd> kiểm tra / sang câu sau · <kbd>←</kbd> <kbd>→</kbd> chuyển câu · <kbd>H</kbd> gợi ý</div>
  </div>`;

  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => toggle(q, +el.dataset.oi);
    el.onkeydown = e => { if(e.key===" "){ e.preventDefault(); toggle(q, +el.dataset.oi); } };
  });
  $("#btnFlag").onclick = () => { state.flags.has(q.id) ? state.flags.delete(q.id) : state.flags.add(q.id); render(); };
  $("#btnPrev").onclick = () => go(-1);
  $("#btnNext").onclick = () => go(1);
  if($("#btnCheck")) $("#btnCheck").onclick = () => check(q);
  if($("#btnHint")) $("#btnHint").onclick = () => { state.hint[q.id] = !state.hint[q.id]; render(); };
  if($("#btnRetry")) $("#btnRetry").onclick = () => { delete state.done[q.id]; state.sel[q.id] = new Set(); delete state.perm[q.id]; render(); };
}

function toggle(q, oi){
  if(q.id in state.done) return;
  const s = state.sel[q.id] || (state.sel[q.id] = new Set());
  if(q.multi === 1){ s.clear(); s.add(oi); }
  else if(s.has(oi)) s.delete(oi);
  else { if(s.size >= q.multi) return; s.add(oi); }
  render();
}
function check(q){
  const s = state.sel[q.id] || new Set();
  if(s.size !== q.multi) return;
  const correct = q.options.every((o, i) => o.correct === s.has(i));
  state.done[q.id] = correct;
  render();
}
function go(d){
  const vis = visible();
  const cur = state.order[state.pos];
  let vp = vis.indexOf(cur);
  vp = Math.max(0, Math.min(vis.length-1, vp + d));
  state.pos = state.order.indexOf(vis[vp]);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderSummary(){
  const groups = {};
  Q.forEach(q => {
    const g = topicGroup(q.topic);
    groups[g] = groups[g] || {n:0, done:0, ok:0, bad:[]};
    groups[g].n++;
    if(q.id in state.done){ groups[g].done++; if(state.done[q.id]) groups[g].ok++; else groups[g].bad.push(q.id); }
  });
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length;
  const wrongIds = Q.filter(q => state.done[q.id] === false).map(q => q.id);
  const rows = Object.entries(groups).sort((a,b)=>b[1].n-a[1].n).map(([g, v]) => {
    const pct = v.done ? Math.round(v.ok*100/v.done) : null;
    return `<tr><td>${g}</td><td class="n">${v.done}/${v.n}</td><td class="n">${pct===null?"–":pct+"%"}</td>
      <td><div class="bar"><i style="width:${pct||0}%"></i></div></td><td>${v.bad.map(id=>`<a href="#" data-q="${id}">${id}</a>`).join(", ")}</td></tr>`;
  }).join("");
  $("#main").innerHTML = `<div class="card summary">
    <h2>Kết quả</h2>
    <p>Đã làm <b>${vals.length}/${Q.length}</b> câu · Đúng <b>${ok}</b> · Sai <b>${vals.length-ok}</b>${vals.length?` · Tỷ lệ đúng <b>${Math.round(ok*100/vals.length)}%</b>`:""}.
    ${vals.length===Q.length ? (ok/Q.length>=0.72 ? " Mức này tương đương ngưỡng đậu (~720/1000)." : " Chưa đạt ngưỡng ~72%, nên ôn lại các câu sai.") : ""}</p>
    ${wrongIds.length ? `<p><button class="btn primary" id="btnReviewBad">Ôn lại ${wrongIds.length} câu sai</button></p>` : ""}
    <table><thead><tr><th>Chủ đề</th><th class="n">Đã làm</th><th class="n">Đúng</th><th></th><th>Câu sai</th></tr></thead><tbody>${rows}</tbody></table>
    <p style="margin-top:14px"><button class="btn" id="btnBack">← Quay lại làm bài</button></p>
  </div>`;
  $("#btnBack").onclick = () => { state.view = "quiz"; render(); };
  if($("#btnReviewBad")) $("#btnReviewBad").onclick = () => {
    $("#fFilter").value = "bad"; $("#fTopic").value = "";
    wrongIds.forEach(id => { delete state.done[id]; state.sel[id] = new Set(); delete state.perm[id]; });
    // keep them findable after reset: mark as flagged review set
    wrongIds.forEach(id => state.flags.add(id));
    $("#fFilter").value = "flag";
    state.view = "quiz"; state.pos = state.order.indexOf(Q.findIndex(q => q.id === wrongIds[0])); render();
  };
  $("#main").querySelectorAll("a[data-q]").forEach(a => a.onclick = e => {
    e.preventDefault(); state.view = "quiz"; $("#fFilter").value = "all"; $("#fTopic").value = "";
    state.pos = state.order.indexOf(Q.findIndex(q => q.id === +a.dataset.q)); render();
  });
}

function render(){
  renderStats(); renderGrid();
  state.view === "summary" ? renderSummary() : renderQuiz();
}

// init
(function(){
  const groups = [...new Set(Q.map(q => topicGroup(q.topic)))].sort();
  groups.forEach(g => { const o = document.createElement("option"); o.value = g; o.textContent = g; $("#fTopic").appendChild(o); });
  $("#fFilter").onchange = $("#fTopic").onchange = () => { state.view = "quiz"; render(); };
  $("#optShuffleQ").onchange = e => {
    const cur = state.order[state.pos];
    state.order = e.target.checked ? shuffle(Q.map((_, i) => i)) : Q.map((_, i) => i);
    state.pos = e.target.checked ? 0 : state.order.indexOf(cur);
    render();
  };
  $("#optShuffleA").onchange = () => { Q.forEach(q => { if(!(q.id in state.done)) delete state.perm[q.id]; }); render(); };
  $("#optAuto").onchange = render;
  $("#btnSummary").onclick = () => { state.view = "summary"; render(); };
  $("#btnReset").onclick = () => {
    if(!Object.keys(state.done).length) return;
    state.sel = {}; state.done = {}; state.hint = {}; state.perm = {}; state.pos = 0; state.view = "quiz";
    $("#fFilter").value = "all"; render();
  };
  $("#btnTheme").onclick = () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  };
  document.addEventListener("keydown", e => {
    if(state.view !== "quiz" || e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    const q = Q[state.order[state.pos]]; if(!q) return;
    const k = e.key.toUpperCase();
    let n = "12345678".indexOf(k); if(n < 0) n = LETTERS.indexOf(k);
    if(k.length === 1 && n >= 0 && n < q.options.length && k !== "H"){ toggle(q, perm(q)[n]); return; }
    if(e.key === "Enter"){ e.preventDefault(); (q.id in state.done) ? go(1) : check(q); }
    else if(e.key === "ArrowRight") go(1);
    else if(e.key === "ArrowLeft") go(-1);
    else if(k === "H" && !(q.id in state.done)){ state.hint[q.id] = !state.hint[q.id]; render(); }
  });
  render();
})();
</script>
</body>
