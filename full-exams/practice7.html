 Ví dụ, nếu traffic tăng vào thứ Tư, duy trì cao vào thứ Năm, và giảm vào thứ Sáu hàng tuần, bạn có thể lên kế hoạch scaling activity dựa trên pattern traffic dự đoán được này. Để cấu hình Auto Scaling group scale theo lịch, bạn tạo một scheduled action, chỉ định thời điểm bắt đầu hiệu lực và giá trị minimum/maximum/desired size mới. Tại thời điểm chỉ định, Amazon EC2 Auto Scaling sẽ cập nhật group theo các giá trị đó. Có thể tạo scheduled action chạy một lần hoặc theo lịch lặp lại.\n\nDo đó, đáp án đúng là: Configure a Scheduled scaling policy for the Auto Scaling group to launch new instances before the start of the day — đảm bảo instance đã được scale lên và sẵn sàng trước khi ngày làm việc bắt đầu, vì đây là lúc ứng dụng được sử dụng nhiều nhất.</p>","explain":"<p>- Configure a Dynamic scaling policy dựa trên CPU utilization: dù là giải pháp hợp lệ, nhưng kém hiệu quả vận hành hơn Scheduled scaling vì bạn đã biết chính xác giờ cao điểm — đến khi CPU đạt ngưỡng cao thì ứng dụng đã bị ảnh hưởng hiệu năng, nên cần scale trước bằng Scheduled scaling.</p><p>- Configure a Dynamic scaling policy dựa trên Memory utilization: tương tự, kém hiệu quả hơn vì chỉ phản ứng sau khi metric đã tăng cao, trong khi cần scale trước giờ cao điểm đã biết trước bằng Scheduled scaling.</p><p>- Configure a Predictive scaling policy để tự động điều chỉnh số lượng EC2 instance: tuy loại scaling này có thể dùng được trong tình huống này, nhưng không phải phương án hiệu quả vận hành nhất. Đề bài nêu rõ Auto Scaling group gồm các EC2 instance có loại và kích thước khác nhau. Predictive scaling giả định Auto Scaling group đồng nhất (instance có capacity ngang nhau); nếu dùng nhiều loại/kích thước instance khác nhau, capacity dự báo có thể không chính xác.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/schedule_time.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/schedule_time.html</a></li><li><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-scheduled-scaling.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-scheduled-scaling.html</a></li><li><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-predictive-scaling.html#predictive-scaling-limitations\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-predictive-scaling.html#predictive-scaling-limitations</a></li></ul>"},{"id":39,"topic":"Design High-Performing Architectures – Bài kiểm tra kiến thức bảo vệ hệ thống backend (API Gateway + Lambda) khỏi traffic spik...","supplement":false,"stem":"A company is using a combination of Amazon API Gateway and AWS Lambda for the web services of an online web portal that is accessed by hundreds of thousands of clients each day. The company will be announcing a new revolutionary product, and it is expected that the web portal will receive a massive number of visitors from all around the globe.<br><br>How can the back-end systems and applications, beyond the subnet-level filtering of network ACLs, be protected from traffic spikes?","options":[{"html":"API Gateway will automatically scale and handle massive traffic spikes so you do not have to do anything.","correct":false},{"html":"Manually upgrade the Amazon EC2 instances being used by API Gateway","correct":false},{"html":"Configure API Gateway for Multi-AZ deployment and provision a read replica","correct":false},{"html":"Use throttling limits in API Gateway","correct":true}],"multi":1,"analysis":"<p>Bài kiểm tra kiến thức bảo vệ hệ thống backend (API Gateway + Lambda) khỏi traffic spike lớn — phân biệt throttling của API Gateway với các khái niệm không áp dụng như Multi-AZ/read replica (vốn thuộc RDS).</p>","answer":"<p>Amazon API Gateway cung cấp throttling ở nhiều cấp độ, bao gồm cấp toàn cục (global) và theo từng service call. Có thể thiết lập throttling limit cho cả rate tiêu chuẩn và burst. Ví dụ, chủ API có thể đặt rate limit 1.000 request/giây cho một method cụ thể trong REST API, đồng thời cấu hình API Gateway xử lý burst 2.000 request/giây trong vài giây. API Gateway theo dõi số lượng request mỗi giây; mọi request vượt quá giới hạn sẽ nhận phản hồi HTTP 429. Client SDK do API Gateway tạo ra sẽ tự động retry khi gặp phản hồi này.\n\nDo đó, đáp án đúng là: Use throttling limits in API Gateway.</p>","explain":"<p>- API Gateway will automatically scale and handle massive traffic spikes so you do not have to do anything: mặc dù API Gateway có thể scale nhờ AWS Edge location, bạn vẫn cần cấu hình throttling, đặc biệt để quản lý các đợt burst của API.</p><p>- Manually upgrade the Amazon EC2 instances being used by API Gateway: API Gateway là dịch vụ được quản lý toàn phần (fully managed service), do đó bạn không có quyền truy cập vào hạ tầng bên dưới của nó (không có EC2 instance nào để bạn nâng cấp).</p><p>- Configure API Gateway for Multi-AZ deployment and provision a read replica: chỉ Amazon RDS mới có khả năng Multi-AZ và Read Replica, API Gateway không có các khái niệm này.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/api-gateway/faqs/#Throttling_and_Caching\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/api-gateway/faqs/#Throttling_and_Caching</a></li><li><a href=\"https://docs.aws.amazon.com/apigateway/\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/apigateway/</a></li></ul>"},{"id":40,"topic":"Design Cost-Optimized Architectures – dạng bài so sánh các dịch vụ lưu trữ (Amazon S3, Amazon EFS, Amazon EC2 + EFS) kết hợp ...","supplement":false,"stem":"A logistics company plans to automate its order management application. The company wants to use SFTP file transfer for uploading business-critical documents. Since the files are confidential, encryption at rest is required, and high availability must be ensured. Additionally, each file must be automatically deleted one month after creation.<br><br>Which of the following options should be implemented to meet the company’s requirements with the least operational overhead?","options":[{"html":"Create an Amazon Elastic File System (Amazon EFS) and enable encryption. Configure AWS Transfer for SFTP to securely upload files to the EFS file system. Apply an EFS lifecycle policy to delete files after 30 days.","correct":false},{"html":"Create an Amazon S3 bucket with encryption enabled. Configure AWS Transfer for SFTP to securely upload files to the S3 bucket. Configure the retention policy on the SFTP server to delete files after a month.","correct":false},{"html":"Provision an Amazon EC2 instance and install the SFTP service. Mount an encrypted Amazon EFS file system on the EC2 instance to store the uploaded files. Add a cron job to delete the files older than a month.","correct":false},{"html":"Create an Amazon S3 bucket with encryption enabled. Launch an AWS Transfer for SFTP endpoint to securely upload files to the S3 bucket. Configure an S3 lifecycle rule to delete files after a month.","correct":true}],"multi":1,"analysis":"<p>Đây là dạng bài so sánh các dịch vụ lưu trữ (Amazon S3, Amazon EFS, Amazon EC2 + EFS) kết hợp với AWS Transfer Family để triển khai SFTP, đồng thời đánh giá khả năng tự động hết hạn/xóa dữ liệu (lifecycle) sao cho có chi phí vận hành thấp nhất (least operational overhead).</p>","answer":"<p>AWS Transfer for SFTP (thuộc AWS Transfer Family) giúp di chuyển các khối công việc truyền file dùng giao thức SFTP lên AWS mà không cần chỉnh sửa ứng dụng hay tự quản lý SFTP server. Khi thiết lập, bạn tạo một SFTP server, ánh xạ domain vào endpoint của server, chọn phương thức xác thực cho SFTP client, và chọn Amazon S3 bucket để lưu trữ dữ liệu được truyền tải — dữ liệu upload/download qua SFTP sẽ có sẵn trong S3 bucket để xử lý hoặc lưu trữ tiếp trên AWS. Về việc tự động xóa file, Amazon S3 Lifecycle configuration cho phép định nghĩa các rule áp dụng cho một nhóm object, bao gồm expiration actions để S3 tự động xóa object đã hết hạn thay bạn. Do đó, đáp án đúng là: tạo một S3 bucket có bật encryption, dùng AWS Transfer for SFTP endpoint để upload file vào S3 bucket, và cấu hình một S3 lifecycle rule để xóa file sau một tháng — đây là giải pháp tận dụng tối đa dịch vụ managed, không cần tự quản lý server, với chi phí vận hành thấp nhất.</p>","explain":"<p>- Tạo Amazon EFS, bật encryption, dùng AWS Transfer for SFTP để upload vào EFS, áp dụng EFS lifecycle policy để xóa file sau 30 ngày: EFS lifecycle management không xóa object, nó chỉ chuyển file giữa các storage tier (ra vào tier &quot;Infrequent Access&quot;), nên không thể dùng để tự động xóa file sau 30 ngày như yêu cầu.</p><p>- Tạo S3 bucket có encryption, dùng AWS Transfer for SFTP để upload vào S3, cấu hình retention policy trên SFTP server để xóa file sau một tháng: retention policy để xóa file sau một tháng phải được cấu hình chủ yếu trên chính Amazon S3 bucket (qua lifecycle rule); AWS Transfer for SFTP không có tùy chọn retention policy nào.</p><p>- Tạo EC2 instance cài SFTP service, mount một EFS file system đã mã hóa, thêm cron job để xóa file cũ hơn một tháng: về mặt kỹ thuật có thể thực hiện được, nhưng phương án này đòi hỏi chi phí vận hành lớn hơn hẳn vì phải tự quản lý EC2 instance và dịch vụ SFTP, không đáp ứng tiêu chí &quot;ít chi phí vận hành nhất&quot;.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/aws-transfer-family/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/aws-transfer-family/</a></li><li><a href=\"https://docs.aws.amazon.com/transfer/latest/userguide/create-server-sftp.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/transfer/latest/userguide/create-server-sftp.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html</a></li></ul>"},{"id":41,"topic":"Design High-Performing Architectures – chọn giải pháp lưu trữ file dùng chung (shared file storage) có khả năng mở rộng và tru...","supplement":false,"stem":"A content management system (CMS) is hosted on a fleet of auto-scaled, On-Demand Amazon EC2 instances that use Amazon Aurora as its database. Currently, the system stores the file documents that users upload in one of the attached Amazon EBS volumes. The system’s performance has been observed to be slow, and the manager has instructed the team to improve the architecture.<br><br>In this scenario, which solution should be implemented to achieve a scalable, highly available, POSIX-compliant shared file system?","options":[{"html":"Upgrade your existing EBS volumes to Provisioned IOPS SSD volumes","correct":false},{"html":"Use Amazon EFS to provide a shared file system for concurrent access to data","correct":true},{"html":"Leverage Amazon ElastiCache to cache frequently accessed data and reduce latency","correct":false},{"html":"Create an Amazon S3 bucket and use this as the storage for the CMS","correct":false}],"multi":1,"analysis":"<p>Dạng bài chọn giải pháp lưu trữ file dùng chung (shared file storage) có khả năng mở rộng và truy cập đồng thời (concurrent access) theo chuẩn POSIX cho một ứng dụng chạy trên nhiều EC2 instance — yêu cầu phân biệt rõ Amazon EBS, Amazon EFS và Amazon S3.</p>","answer":"<p>Amazon EFS cung cấp hệ thống file đơn giản, có khả năng mở rộng và co giãn linh hoạt (elastic), dùng được cho cả dịch vụ AWS Cloud và tài nguyên on-premises. Khi được mount vào các EC2 instance, EFS cung cấp một giao diện file system chuẩn (POSIX) và các ngữ nghĩa truy cập file quen thuộc, giúp tích hợp liền mạch với ứng dụng và công cụ hiện có. Đặc biệt, nhiều EC2 instance có thể cùng truy cập một EFS file system tại cùng một thời điểm, nhờ đó EFS trở thành nguồn dữ liệu chung cho các workload chạy trên nhiều instance. Trong kịch bản này, hiệu năng hệ thống chậm vì kiến trúc hiện tại (EBS volume) không cho phép các EC2 instance truy cập song song, dùng chung file documents. Mặc dù một EBS volume có thể được gắn vào nhiều EC2 instance, nhưng chỉ trong cùng một Availability Zone, trong khi yêu cầu ở đây là storage có tính sẵn sàng cao, trải rộng trên nhiều AZ. Vì loại lưu trữ cần ở đây là file storage (không phải object storage), Amazon S3 cũng không phù hợp. Do đó, đáp án đúng là dùng Amazon EFS để cung cấp một shared file system cho phép truy cập đồng thời vào dữ liệu.</p>","explain":"<p>- Tạo một Amazon S3 bucket và dùng nó làm storage cho CMS: Amazon S3 chỉ là dịch vụ object storage, không cung cấp giao diện file system và cơ chế file locking mà một CMS cần.</p><p>- Nâng cấp các EBS volume hiện có lên Provisioned IOPS SSD volume: chỉ nâng cấp loại EBS volume không giải quyết được yêu cầu về một shared, POSIX-compliant file system; EBS volume là block storage chỉ gắn được vào một instance nên không phù hợp cho lưu trữ dùng chung.</p><p>- Tận dụng Amazon ElastiCache để cache dữ liệu truy cập thường xuyên và giảm độ trễ: đây là in-memory data store giúp tăng tốc hiệu năng ứng dụng, không phải là dịch vụ lưu trữ file nên không đáp ứng được yêu cầu.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/efs/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/efs/</a></li><li><a href=\"https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html</a></li><li><a href=\"https://docs.aws.amazon.com/efs/latest/ug/mount-multiple-ec2-instances.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/efs/latest/ug/mount-multiple-ec2-instances.html</a></li></ul>"},{"id":42,"topic":"Design Secure Architectures – yêu cầu chọn phương thức kết nối riêng tư (private connectivity) từ EC2 instance trong ...","supplement":false,"stem":"A company plans to launch an Amazon EC2 instance in a private subnet for its internal corporate web portal. For security purposes, the EC2 instance must send data to Amazon DynamoDB and Amazon S3 via private endpoints that don’t pass through the public Internet, which does not involve NAT Instances.<br><br>Which of the following can meet the above requirements?","options":[{"html":"Enable DynamoDB Encryption at Rest with the default AWS-managed key and S3 Server-Side Encryption with the default AWS KMS key to route all traffic to DynamoDB and S3 via private endpoints.","correct":false},{"html":"Use AWS VPN CloudHub to route all access to S3 and DynamoDB via private endpoints.","correct":false},{"html":"Use AWS Direct Connect to route all access to S3 and DynamoDB via private endpoints.","correct":false},{"html":"Use a DynamoDB VPC endpoint and an S3 VPC endpoint to route all access to these services via private endpoints.","correct":true}],"multi":1,"analysis":"<p>Dạng bài yêu cầu chọn phương thức kết nối riêng tư (private connectivity) từ EC2 instance trong private subnet đến các dịch vụ AWS (ở đây là DynamoDB và S3) mà không đi qua Internet công cộng và không dùng NAT.</p>","answer":"<p>VPC endpoint cho phép kết nối riêng tư (private) từ VPC của bạn đến các dịch vụ AWS và VPC endpoint service được hỗ trợ, thông qua AWS PrivateLink, mà không cần Internet gateway, thiết bị NAT, kết nối VPN, hay kết nối AWS Direct Connect. Các instance trong VPC không cần địa chỉ IP public để giao tiếp với tài nguyên của dịch vụ, và traffic giữa VPC với dịch vụ đó không rời khỏi mạng của Amazon. Trong kịch bản này, yêu cầu là cấu hình private endpoint để gửi dữ liệu đến DynamoDB và S3 mà không truy cập Internet công cộng. Trong các lựa chọn, VPC endpoint là dịch vụ phù hợp nhất, cho phép dùng địa chỉ IP riêng để truy cập cả DynamoDB và S3 mà không có bất kỳ sự tiếp xúc nào với Internet công cộng. Do đó, đáp án đúng là: dùng một DynamoDB VPC endpoint và một S3 VPC endpoint để định tuyến toàn bộ truy cập đến các dịch vụ này qua private endpoint.</p>","explain":"<p>- Bật DynamoDB Encryption at Rest với default AWS-managed key và S3 Server-Side Encryption với default AWS KMS key để định tuyến traffic đến DynamoDB và S3 qua private endpoint: mã hóa dữ liệu khi lưu trữ (encryption at rest) không ảnh hưởng đến việc định tuyến traffic; encryption chỉ quản lý tính bảo mật của dữ liệu chứ không kiểm soát cách traffic được định tuyến giữa các dịch vụ.</p><p>- Dùng AWS Direct Connect để định tuyến toàn bộ truy cập đến S3 và DynamoDB qua private endpoint: AWS Direct Connect chủ yếu dùng để thiết lập kết nối mạng chuyên dụng (dedicated) từ hạ tầng on-premises đến AWS; đề bài không đề cập công ty có server on-premises hay kiến trúc hybrid cloud nào.</p><p>- Dùng AWS VPN CloudHub để định tuyến toàn bộ truy cập đến S3 và DynamoDB qua private endpoint: AWS VPN CloudHub thường dùng để cung cấp kết nối an toàn giữa các địa điểm từ xa (remote sites) với nhau, chứ không phải để tạo private endpoint truy cập Amazon S3 và DynamoDB trong phạm vi mạng của Amazon.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/vpc-endpoints-dynamodb.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/vpc-endpoints-dynamodb.html</a></li><li><a href=\"https://docs.aws.amazon.com/glue/latest/dg/vpc-endpoints-s3.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/glue/latest/dg/vpc-endpoints-s3.html</a></li></ul>"},{"id":43,"topic":"Design Secure Architectures – về quản lý khóa mã hóa (AWS KMS) — phân biệt giữa KMS key trong custom key store, AWS o...","supplement":false,"stem":"A company requires all the data stored in the cloud to be encrypted at rest. To easily integrate this with other AWS services, they must have full control over the encryption of the created keys and also the ability to immediately remove the key material from AWS KMS. The solution should also be able to audit the key usage independently of AWS CloudTrail.<br><br>Which of the following options will meet this requirement?","options":[{"html":"Use AWS Key Management Service to create a KMS key in a custom key store and store the non-extractable key material in AWS CloudHSM.","correct":true},{"html":"Use AWS Key Management Service to create a KMS key in a custom key store and store the non-extractable key material in Amazon S3.","correct":false},{"html":"Use AWS Key Management Service to create AWS owned Keys and store the non-extractable key material in AWS CloudHSM.","correct":false},{"html":"Use AWS Key Management Service to create AWS managed keys and store the non-extractable key material in AWS CloudHSM.","correct":false}],"multi":1,"analysis":"<p>Dạng bài về quản lý khóa mã hóa (AWS KMS) — phân biệt giữa KMS key trong custom key store, AWS owned keys và AWS managed keys, dựa trên yêu cầu toàn quyền kiểm soát key material, khả năng gỡ bỏ key ngay lập tức, và khả năng audit độc lập với AWS CloudTrail.</p>","answer":"<p>Tính năng custom key store của AWS KMS kết hợp khả năng kiểm soát của AWS CloudHSM với sự tiện lợi, dễ tích hợp của AWS KMS. Bạn có thể tự cấu hình một CloudHSM cluster riêng và cho phép AWS KMS dùng nó làm key store chuyên biệt cho các key của mình, thay vì dùng key store mặc định của AWS KMS. Khi tạo key trong AWS KMS, bạn có thể chọn sinh key material ngay trong CloudHSM cluster của mình; các KMS key được tạo trong custom key store sẽ không bao giờ rời khỏi các HSM của CloudHSM cluster ở dạng plaintext, và mọi thao tác KMS dùng các key đó chỉ được thực hiện trên HSM của bạn. Nhờ đó, bạn có thể gỡ bỏ key material khỏi AWS KMS ngay lập tức bằng custom key store, vì mỗi custom key store được gắn với một AWS CloudHSM cluster riêng do chính bạn sở hữu và quản lý. Đây cũng là giải pháp phù hợp nếu bạn muốn audit việc sử dụng tất cả các key một cách độc lập với AWS KMS hoặc AWS CloudTrail, và cho phép bạn tự quản lý vòng đời (lifecycle) của các KMS key độc lập với AWS KMS vì bạn kiểm soát CloudHSM cluster của chính mình. Do đó, đáp án đúng là: dùng AWS KMS để tạo một KMS key trong custom key store và lưu trữ key material non-extractable trong AWS CloudHSM.</p>","explain":"<p>- Dùng AWS KMS để tạo một KMS key trong custom key store và lưu trữ key material non-extractable trong Amazon S3: Amazon S3 chủ yếu phục vụ mục đích lưu trữ thông thường, không cung cấp mức độ bảo mật và kiểm soát cần thiết cho việc quản lý khóa mã hóa; key material phải được lưu trong AWS CloudHSM.</p><p>- Dùng AWS KMS để tạo AWS owned Keys và lưu trữ key material non-extractable trong AWS CloudHSM: yêu cầu đề bài là phải có toàn quyền kiểm soát việc mã hóa của key được tạo ra, trong khi AWS owned Keys do chính AWS quản lý, và phương án này cũng không cho phép audit việc dùng key độc lập với AWS CloudTrail.</p><p>- Dùng AWS KMS để tạo AWS managed keys và lưu trữ key material non-extractable trong AWS CloudHSM: tương tự, AWS managed Keys cũng do AWS quản lý chứ không phải khách hàng toàn quyền kiểm soát, và cũng không đáp ứng được yêu cầu audit độc lập với AWS CloudTrail.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/kms/latest/developerguide/custom-key-store-overview.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/kms/latest/developerguide/custom-key-store-overview.html</a></li><li><a href=\"https://docs.aws.amazon.com/kms/latest/developerguide/keystore-cloudhsm.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/kms/latest/developerguide/keystore-cloudhsm.html</a></li><li><a href=\"https://aws.amazon.com/blogs/security/are-kms-custom-key-stores-right-for-you/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/blogs/security/are-kms-custom-key-stores-right-for-you/</a></li></ul>"},{"id":44,"topic":"Design Secure Architectures – cấu hình Security Group cơ bản — xác định đúng chiều traffic (inbound/outbound), đúng g...","supplement":false,"stem":"A Solutions Architect needs to make sure that the On-Demand Amazon EC2 instance can only be accessed from this IP address (110.238.98.71) via an SSH connection.<br><br>Which configuration below will satisfy this requirement?","options":[{"html":"Security Group Inbound Rule: Protocol – TCP, Port Range – 22, Source 110.238.98.71/32","correct":true},{"html":"Security Group Inbound Rule: Protocol – UDP, Port Range – 22, Source 110.238.98.71/32","correct":false},{"html":"Security Group Outbound Rule: Protocol – UDP, Port Range – 22, Destination 0.0.0.0/0","correct":false},{"html":"Security Group Outbound Rule: Protocol – TCP, Port Range – 22, Destination 110.238.98.71/32","correct":false}],"multi":1,"analysis":"<p>Dạng bài cấu hình Security Group cơ bản — xác định đúng chiều traffic (inbound/outbound), đúng giao thức (TCP/UDP) và đúng CIDR để giới hạn truy cập SSH chỉ từ một địa chỉ IP cụ thể.</p>","answer":"<p>Security group hoạt động như một firewall ảo cho instance, kiểm soát traffic inbound và outbound; security group hoạt động ở cấp instance chứ không phải cấp subnet. Yêu cầu ở đây là chỉ cho phép đúng một IP của client (không phải cả dải mạng) truy cập; ký hiệu CIDR /32 biểu thị chính xác một địa chỉ IP. Giao thức SSH sử dụng TCP (không phải UDP) và chạy trên port 22 (mặc định). Vì vậy, có thể tạo một security group với inbound rule cho phép traffic đến từ địa chỉ IP được chỉ định trên port 22. Ngoài ra, security group có tính stateful, nghĩa là chúng tự động cho phép traffic trả về (return traffic) liên quan đến client đã khởi tạo kết nối đến instance, nên traffic trả về từ địa chỉ IP đó trên port 22 sẽ luôn được phép đi qua security group dù không có outbound rule tường minh. Do đó, đáp án đúng là: Security Group Inbound Rule – Protocol TCP, Port Range 22, Source 110.238.98.71/32.</p>","explain":"<p>- Security Group Inbound Rule: Protocol UDP, Port Range 22, Source 110.238.98.71/32: SSH chạy trên giao thức TCP chứ không phải UDP, nên chỉ định UDP sẽ không cho phép truy cập như mong muốn.</p><p>- Security Group Outbound Rule: Protocol TCP, Port Range 22, Destination 110.238.98.71/32: đây là outbound rule chứ không phải inbound rule; outbound rule kiểm soát traffic rời khỏi instance, trong khi yêu cầu ở đây là giới hạn traffic inbound đến từ một địa chỉ cụ thể.</p><p>- Security Group Outbound Rule: Protocol UDP, Port Range 22, Destination 0.0.0.0/0: đây cũng là outbound rule thay vì inbound rule, hơn nữa kết nối SSH chỉ cần giao thức TCP chứ không phải UDP.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-network-security.html#security-group-rules\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-network-security.html#security-group-rules</a></li><li><a href=\"https://docs.aws.amazon.com/vpc/\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/vpc/</a></li></ul>"},{"id":45,"topic":"Design Secure Architectures – bảo mật thông tin nhạy cảm trong AWS Lambda — phân biệt giữa mã hóa mặc định (default K...","supplement":false,"stem":"A software development company is using serverless computing with AWS Lambda to build and run applications without having to set up or manage servers. The company has a Lambda function that connects to a MongoDB Atlas, which is a popular Database as a Service (DBaaS) platform, and also uses a third-party API to fetch certain data for its application. One of the developers was instructed to create the environment variables for the MongoDB database hostname, username, and password, as well as the API credentials that will be used by the Lambda function for DEV, SIT, UAT, and PROD environments.<br><br>Considering that the Lambda function is storing sensitive database and API credentials, how can this information be secured to prevent other developers on the team, or anyone, from seeing these credentials in plain text? Select the best option that provides maximum security.","options":[{"html":"Enable SSL encryption that leverages on AWS CloudHSM to store and encrypt the sensitive information.","correct":false},{"html":"Create a new AWS KMS key and use it to enable encryption helpers that leverage on AWS Key Management Service to store and encrypt the sensitive information.","correct":true},{"html":"Lambda does not provide encryption for the environment variables. Deploy your code to an Amazon EC2 instance instead.","correct":false},{"html":"There is no need to do anything because, by default, Lambda already encrypts the environment variables using the AWS Key Management Service.","correct":false}],"multi":1,"analysis":"<p>Dạng bài bảo mật thông tin nhạy cảm trong AWS Lambda — phân biệt giữa mã hóa mặc định (default KMS key) và việc tự tạo KMS key riêng (encryption helpers) để bảo vệ environment variables ở mức cao nhất.</p>","answer":"<p>Khi tạo hoặc cập nhật các Lambda function sử dụng environment variables, AWS Lambda mã hóa chúng bằng AWS Key Management Service; khi function được invoke, các giá trị này được giải mã và cung cấp cho code của Lambda. Lần đầu tiên bạn tạo/cập nhật Lambda function dùng environment variables trong một region, một service key mặc định sẽ tự động được tạo ra trong AWS KMS để mã hóa các biến này. Tuy nhiên, nếu muốn dùng encryption helpers và dùng KMS để mã hóa environment variables sau khi function đã được tạo, bạn phải tạo một AWS KMS key của riêng mình và chọn nó thay cho key mặc định (dùng key mặc định sẽ báo lỗi). Việc tự tạo key cho phép linh hoạt hơn, bao gồm khả năng tạo, xoay vòng (rotate), vô hiệu hóa, định nghĩa access control, và audit các key mã hóa dùng để bảo vệ dữ liệu. Do đó, đáp án đúng là: tạo một AWS KMS key mới và dùng nó để bật encryption helpers, tận dụng AWS Key Management Service để lưu trữ và mã hóa các thông tin nhạy cảm.</p>","explain":"<p>- Không cần làm gì cả vì mặc định Lambda đã mã hóa environment variables bằng AWS Key Management Service: mặc dù Lambda mặc định có mã hóa environment variables, thông tin nhạy cảm vẫn có thể bị các user khác có quyền truy cập Lambda console nhìn thấy, vì Lambda dùng một KMS key mặc định mà thường những user khác cũng truy cập được; giải pháp tốt nhất là dùng encryption helpers để bảo vệ biến môi trường.</p><p>- Bật SSL encryption dựa trên AWS CloudHSM để lưu trữ và mã hóa thông tin nhạy cảm: bật SSL chỉ mã hóa dữ liệu khi đang truyền (in-transit); các nhóm khác vẫn có thể xem được dữ liệu ở dạng plaintext khi lưu trữ (at-rest). AWS KMS mới là lựa chọn được khuyến nghị để mã hóa dữ liệu nhạy cảm ở trạng thái lưu trữ.</p><p>- Lambda không cung cấp mã hóa cho environment variables, hãy deploy code lên một EC2 instance thay thế: sai vì như đã nêu, Lambda vốn đã cung cấp chức năng mã hóa cho environment variables.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/env_variables.html#env_encrypt\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/lambda/latest/dg/env_variables.html#env_encrypt</a></li><li><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/tutorial-env_console.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/lambda/latest/dg/tutorial-env_console.html</a></li></ul>"},{"id":46,"topic":"Design Secure Architectures – về xác thực và bảo mật cho Amazon ElastiCache for Redis — phân biệt giữa Redis AUTH, mã...","supplement":false,"stem":"A company is designing a banking portal that uses Amazon ElastiCache for Redis as its distributed session management component. To secure session data and ensure that Cloud Engineers must authenticate before executing Redis commands, specifically MULTI EXEC commands, the system should enforce strong authentication by requiring users to enter a password. Additionally, access should be managed with long-lived credentials while supporting robust security practices.<br><br>Which of the following actions should be taken to meet the above requirement?","options":[{"html":"Enable the in-transit encryption for Redis replication groups.","correct":false},{"html":"Authenticate the users using Redis AUTH by creating a new Redis Cluster with both the --transit-encryption-enabled and --auth-token parameters enabled.","correct":true},{"html":"Set up a Redis replication group and enable the AtRestEncryptionEnabled parameter.","correct":false},{"html":"Generate an IAM authentication token using AWS credentials and provide this token as a password.","correct":false}],"multi":1,"analysis":"<p>Dạng bài về xác thực và bảo mật cho Amazon ElastiCache for Redis — phân biệt giữa Redis AUTH, mã hóa in-transit, mã hóa at-rest, và IAM authentication token, theo yêu cầu xác thực bằng mật khẩu với credential dài hạn (long-lived).</p>","answer":"<p>Lệnh Redis AUTH giúp tăng cường bảo mật dữ liệu bằng cách yêu cầu người dùng nhập mật khẩu trước khi được cấp quyền thực thi các lệnh Redis trên một Redis server đã được bảo vệ bằng mật khẩu. Để yêu cầu người dùng nhập mật khẩu trên một Redis server được bảo vệ bằng mật khẩu, bạn cần thêm tham số --auth-token với mật khẩu chính xác khi tạo replication group hoặc cluster, và dùng tham số này cho mọi lệnh gửi đến replication group/cluster sau đó. Do đó, đáp án đúng là: xác thực người dùng bằng Redis AUTH, bằng cách tạo một Redis Cluster mới với cả hai tham số --transit-encryption-enabled và --auth-token được bật.</p>","explain":"<p>- Tạo một IAM authentication token bằng AWS credentials và dùng token này làm mật khẩu: IAM authentication không được hỗ trợ để thực thi các lệnh Redis như MULTI EXEC, và IAM token hết hạn sau mỗi 12 giờ, không phù hợp với yêu cầu cần credential dài hạn (long-lived).</p><p>- Thiết lập một Redis replication group và bật tham số AtRestEncryptionEnabled: tính năng Redis At-Rest Encryption chỉ bảo vệ dữ liệu bên trong in-memory data store (dữ liệu khi lưu trữ), không thay thế được yêu cầu xác thực bằng mật khẩu; cần dùng tùy chọn Redis AUTH.</p><p>- Bật in-transit encryption cho các Redis replication group: mã hóa in-transit chỉ là một phần của giải pháp, nhưng còn thiếu phần quan trọng nhất là tùy chọn Redis AUTH.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/auth.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/auth.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/encryption.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/encryption.html</a></li></ul>"},{"id":47,"topic":"Design Resilient Architectures – thiết kế kiến trúc NAT Gateway có tính sẵn sàng cao (highly available), loại bỏ single ...","supplement":false,"stem":"An application consists of multiple Amazon EC2 instances in private subnets in different availability zones. The application uses a single NAT Gateway for downloading software patches from the Internet to the instances. There is a requirement to protect the application from a single point of failure when the NAT Gateway encounters a failure or if its availability zone goes down.<br><br>How should the Solutions Architect redesign the architecture to be more highly available and cost-effective?","options":[{"html":"Create three NAT Gateways in each availability zone. Configure the route table in each private subnet to ensure that instances use the NAT Gateway in the same availability zone.","correct":false},{"html":"Create a NAT Gateway in each availability zone. Configure the route table in each private subnet to ensure that instances use the NAT Gateway in the same availability zone","correct":true},{"html":"Create a NAT Gateway in each availability zone. Configure the route table in each public subnet to ensure that instances use the NAT Gateway in the same availability zone.","correct":false},{"html":"Create two NAT Gateways in each availability zone. Configure the route table in each public subnet to ensure that instances use the NAT Gateway in the same availability zone.","correct":false}],"multi":1,"analysis":"<p>Dạng bài thiết kế kiến trúc NAT Gateway có tính sẵn sàng cao (highly available), loại bỏ single point of failure theo từng Availability Zone, đồng thời vẫn tối ưu chi phí.</p>","answer":"<p>NAT Gateway là dịch vụ NAT (Network Address Translation) được quản lý, có tính sẵn sàng cao, cho tài nguyên trong private subnet truy cập Internet. NAT Gateway được tạo trong một Availability Zone cụ thể và có cơ chế dự phòng (redundancy) ngay trong AZ đó. Bạn phải tạo NAT Gateway trong public subnet để các instance trong private subnet có thể kết nối ra Internet hoặc dịch vụ AWS khác, trong khi vẫn ngăn Internet chủ động khởi tạo kết nối đến các instance đó. Nếu tài nguyên của bạn nằm trên nhiều AZ nhưng lại dùng chung một NAT Gateway, khi AZ chứa NAT Gateway đó gặp sự cố, tài nguyên ở các AZ khác sẽ mất khả năng truy cập Internet. Để có kiến trúc độc lập theo từng AZ (Availability Zone-independent), cần tạo một NAT Gateway ở mỗi AZ và cấu hình định tuyến sao cho tài nguyên dùng NAT Gateway nằm trong cùng AZ với nó. Do đó, đáp án đúng là: tạo một NAT Gateway ở mỗi Availability Zone, và cấu hình route table trong mỗi private subnet để các instance dùng NAT Gateway nằm trong cùng AZ.</p>","explain":"<p>- Tạo một NAT Gateway ở mỗi AZ, cấu hình route table trong mỗi public subnet để instance dùng NAT Gateway cùng AZ: route table cần được cấu hình trên private subnet (nơi chứa các instance cần ra Internet), chứ không phải trên public subnet, để liên kết đúng các instance trong private subnet.</p><p>- Tạo hai NAT Gateway ở mỗi AZ, cấu hình route table trong mỗi public subnet để instance dùng NAT Gateway cùng AZ: yêu cầu chính ở đây là thiết lập NAT Gateway để các instance trong private subnet có outbound Internet access; route table phải nằm ở private subnet, không phải public subnet, và việc tạo 2 NAT Gateway mỗi AZ là dư thừa.</p><p>- Tạo ba NAT Gateway ở mỗi AZ, cấu hình route table trong mỗi private subnet để instance dùng NAT Gateway cùng AZ: yêu cầu duy nhất ở đây là đảm bảo outbound traffic cho các instance private, việc thêm nhiều NAT Gateway (3 cái mỗi AZ) không phù hợp với mục tiêu tối ưu chi phí, trừ khi có yêu cầu rõ ràng khác về high availability.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html</a></li><li><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-comparison.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-comparison.html</a></li></ul>"},{"id":48,"topic":"Design Resilient Architectures – kiến trúc event-driven — chọn cách kích hoạt ECS task trên AWS Fargate khi có sự kiện S...","supplement":false,"stem":"A company is using AWS Fargate to run a batch job whenever an object is uploaded to an Amazon S3 bucket. The minimum ECS task count is initially set to 1 to save on costs and should only be increased based on new objects uploaded to the S3 bucket.<br><br>Which is the most suitable option to implement with the LEAST amount of effort?","options":[{"html":"Set up an Amazon EventBridge (Amazon CloudWatch Events) rule to detect S3 object PUT operations and set the target to a Lambda function that will run the StartTask API command.","correct":false},{"html":"Set up an alarm in CloudWatch to monitor S3 object-level operations recorded on CloudTrail. Set two alarm actions to update the ECS task count to scale-out/scale-in depending on the S3 event.","correct":false},{"html":"Set up an Amazon EventBridge (Amazon CloudWatch Events) rule to detect S3 object PUT operations and set the target to the ECS cluster to run a new ECS task.","correct":true},{"html":"Set up an alarm in Amazon CloudWatch to monitor S3 object-level operations that are recorded on CloudTrail. Create an Amazon EventBridge (Amazon CloudWatch Events) rule that triggers the ECS cluster when new CloudTrail events are detected.","correct":false}],"multi":1,"analysis":"<p>Dạng bài kiến trúc event-driven — chọn cách kích hoạt ECS task trên AWS Fargate khi có sự kiện S3 object PUT, với tiêu chí ít công sức triển khai nhất (least amount of effort).</p>","answer":"<p>Amazon EventBridge (trước đây gọi là Amazon CloudWatch Events) là một serverless event bus giúp kết nối các ứng dụng với nhau dễ dàng, sử dụng dữ liệu từ ứng dụng của bạn, các ứng dụng SaaS tích hợp, và các dịch vụ AWS, nhờ đó đơn giản hóa việc xây dựng kiến trúc event-driven bằng cách tách rời (decouple) bên sinh sự kiện (producer) khỏi bên xử lý sự kiện (consumer). Bạn có thể dùng Amazon EventBridge để chạy các ECS task khi có sự kiện AWS nhất định xảy ra — cụ thể, có thể thiết lập một EventBridge rule chạy một ECS task mỗi khi có file được upload lên một S3 bucket cụ thể thông qua thao tác Amazon S3 PUT. Do đó, đáp án đúng là: thiết lập một rule Amazon EventBridge (Amazon CloudWatch Events) để phát hiện thao tác S3 object PUT, và đặt target là ECS cluster để chạy một ECS task mới.</p>","explain":"<p>- Thiết lập rule Amazon EventBridge để phát hiện thao tác S3 object PUT và đặt target là một Lambda function chạy lệnh API StartTask: dù giải pháp này cũng đáp ứng được yêu cầu, việc tự viết một Lambda function cho kịch bản này là không thực sự cần thiết; sẽ đơn giản hơn nhiều nếu dùng trực tiếp ECS task làm target cho EventBridge rule, trong khi đề bài yêu cầu giải pháp dễ triển khai nhất.</p><p>- Thiết lập alarm trong CloudWatch để giám sát S3 object-level operations được ghi lại trên CloudTrail, sau đó tạo rule Amazon EventBridge kích hoạt ECS cluster khi phát hiện CloudTrail event mới: dùng CloudTrail kết hợp CloudWatch Alarm tạo ra sự phức tạp không cần thiết so với mục tiêu đề ra, vì Amazon EventBridge có thể trực tiếp nhắm (target) đến một ECS task ngay trong phần Targets khi tạo rule mới.</p><p>- Thiết lập alarm trong CloudWatch để giám sát S3 object-level operations trên CloudTrail, đặt hai alarm action để cập nhật số lượng ECS task scale-out/scale-in theo sự kiện S3: không thể dùng CloudWatch Alarm để trực tiếp cập nhật số lượng ECS task theo cách này.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/events/CloudWatch-Events-tutorial-ECS.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonCloudWatch/latest/events/CloudWatch-Events-tutorial-ECS.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/events/Create-CloudWatch-Events-Rule.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonCloudWatch/latest/events/Create-CloudWatch-Events-Rule.html</a></li></ul>"},{"id":49,"topic":"Design Resilient Architectures – phân biệt các metric CloudWatch có sẵn mặc định (default) cho EC2 với các metric cần cấ...","supplement":false,"stem":"A company has a highly available architecture consisting of an Elastic Load Balancer and multiple Amazon EC2 instances configured with Auto Scaling across three Availability Zones. The company needs to monitor EC2 instances based on a specific metric that is not readily available in Amazon CloudWatch.<br><br>Which of the following is a custom metric in CloudWatch that requires manual setup?","options":[{"html":"Network packets out of an EC2 instance","correct":false},{"html":"Memory Utilization of an EC2 instance","correct":true},{"html":"CPU Utilization of an EC2 instance","correct":false},{"html":"Disk Read activity of an EC2 instance","correct":false}],"multi":1,"analysis":"<p>Dạng bài phân biệt các metric CloudWatch có sẵn mặc định (default) cho EC2 với các metric cần cấu hình thủ công (custom metric).</p>","answer":"<p>Amazon CloudWatch cung cấp sẵn các Amazon EC2 Metrics để giám sát, ví dụ CPU Utilization (xác định công suất xử lý cần thiết để chạy ứng dụng trên instance), Network Utilization (xác định lưu lượng mạng vào/ra của một instance), và Disk Read (xác định dung lượng dữ liệu mà ứng dụng đọc từ ổ cứng của instance, dùng để đánh giá tốc độ ứng dụng). Tuy nhiên, có một số metric không có sẵn mặc định trong CloudWatch và phải thu thập bằng cách thiết lập custom metric — cụ thể là chuẩn bị custom metric bằng CloudWatch Monitoring Scripts (viết bằng Perl), hoặc cài đặt CloudWatch Agent để thu thập thêm các metric ở mức hệ thống (system-level) từ EC2 instance, bao gồm: memory utilization, disk swap utilization, disk space utilization, page file utilization, log collection. Do đó, đáp án đúng là: Memory Utilization của một EC2 instance.</p>","explain":"<p>- CPU Utilization of an EC2 instance: metric này thường có sẵn mặc định trong CloudWatch và không cần thiết lập custom metric.</p><p>- Disk Read activity of an EC2 instance: chỉ một số metric liên quan đến storage như disk space utilization mới cần custom monitoring, còn disk read activity đã được CloudWatch cung cấp sẵn.</p><p>- Network packets out of an EC2 instance: metric này thường đã nằm trong nhóm giám sát network utilization mặc định của CloudWatch, nên không cần cấu hình custom metric.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/monitoring_ec2.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/monitoring_ec2.html</a></li><li><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/mon-scripts.html#using_put_script\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/mon-scripts.html#using_put_script</a></li></ul>"},{"id":50,"topic":"Design Secure Architectures – bảo mật kết nối đến Amazon RDS — phân biệt giữa IAM DB Authentication, cấu hình SSL, IA...","supplement":false,"stem":"A financial application consists of an Auto Scaling group of Amazon EC2 instances, an Application Load Balancer, and a MySQL RDS instance set up in a Multi-AZ Deployment configuration. To protect customers’ confidential data, it must be ensured that the Amazon RDS database is only accessible using an authentication token specific to the profile credentials of EC2 instances.<br><br>Which of the following actions should be taken to meet this requirement?","options":[{"html":"Enable the IAM DB Authentication.","correct":true},{"html":"Configure SSL in your application to encrypt the database connection to RDS.","correct":false},{"html":"Use a combination of IAM and STS to enforce restricted access to your RDS instance using a temporary authentication token.","correct":false},{"html":"Create an IAM Role and assign it to your EC2 instances which will grant exclusive access to your RDS instance.","correct":false}],"multi":1,"analysis":"<p>Dạng bài bảo mật kết nối đến Amazon RDS — phân biệt giữa IAM DB Authentication, cấu hình SSL, IAM Role gán cho EC2, và kết hợp IAM+STS, theo yêu cầu dùng authentication token gắn với profile credentials của EC2 instance.</p>","answer":"<p>Bạn có thể xác thực tới DB instance bằng AWS Identity and Access Management (IAM) database authentication; phương thức này hoạt động với MySQL và PostgreSQL. Với cách xác thực này, bạn không cần dùng mật khẩu khi kết nối đến DB instance mà thay vào đó dùng một authentication token — một chuỗi ký tự duy nhất do Amazon RDS tạo ra theo yêu cầu, được sinh bằng AWS Signature Version 4, mỗi token có thời hạn sử dụng 15 phút. Bạn không cần lưu trữ thông tin đăng nhập của user trong database vì việc xác thực được quản lý bên ngoài thông qua IAM (vẫn có thể dùng xác thực database chuẩn song song). IAM database authentication mang lại các lợi ích: traffic mạng đến/đi từ database được mã hóa bằng SSL; có thể dùng IAM để quản lý tập trung quyền truy cập tài nguyên database thay vì quản lý riêng lẻ trên từng DB instance; và với ứng dụng chạy trên Amazon EC2, có thể dùng profile credentials gắn với chính EC2 instance đó để truy cập database thay cho mật khẩu, giúp tăng tính bảo mật. Do đó, đáp án đúng là: bật (Enable) IAM DB Authentication.</p>","explain":"<p>- Cấu hình SSL trong ứng dụng để mã hóa kết nối database đến RDS: kết nối SSL không đồng nghĩa với việc dùng authentication token từ IAM; mặc dù cấu hình SSL có thể tăng tính bảo mật cho dữ liệu khi truyền, nó vẫn không phải giải pháp phù hợp cho yêu cầu của kịch bản này.</p><p>- Tạo một IAM Role và gán cho các EC2 instance để cấp quyền truy cập độc quyền vào RDS instance: dù có thể tạo và gán IAM Role cho EC2 instance, bạn vẫn cần cấu hình RDS để dùng IAM DB Authentication thì mới đáp ứng được yêu cầu.</p><p>- Dùng kết hợp IAM và STS để giới hạn quyền truy cập RDS instance bằng một temporary authentication token: cần dùng IAM DB Authentication cho kịch bản này, chứ không đơn thuần là kết hợp IAM và STS; dù STS dùng để gửi token xác thực tạm thời, đây không phải cách dùng phù hợp cho RDS trong trường hợp này.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.html</a></li><li><a href=\"https://aws.amazon.com/rds/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/rds/</a></li></ul>"},{"id":51,"topic":"Design Resilient Architectures – thiết kế Auto Scaling group high-availability/fault-tolerant trên nhiều Availability Zo...","supplement":false,"stem":"A company needs to deploy at least two Amazon EC2 instances to support the normal workloads of its application and automatically scale up to six EC2 instances to handle the peak load. The architecture must be highly available and fault-tolerant as it is processing mission-critical workloads.<br><br>As a Solutions Architect, what should be done to meet this requirement?","options":[{"html":"Create an Auto Scaling group of EC2 instances and set the minimum capacity to 2 and the maximum capacity to 6. Deploy 4 instances in Availability Zone A.","correct":false},{"html":"Create an Auto Scaling group of EC2 instances and set the minimum capacity to 2 and the maximum capacity to 6. Use 2 Availability Zones and deploy 1 instance for each AZ.","correct":false},{"html":"Create an Auto Scaling group of EC2 instances and set the minimum capacity to 4 and the maximum capacity to 6. Deploy 2 instances in Availability Zone A and another 2 instances in Availability Zone B.","correct":true},{"html":"Create an Auto Scaling group of EC2 instances and set the minimum capacity to 2 and the maximum capacity to 4. Deploy 2 instances in Availability Zone A and 2 instances in Availability Zone B.","correct":false}],"multi":1,"analysis":"<p>Dạng bài thiết kế Auto Scaling group high-availability/fault-tolerant trên nhiều Availability Zone — tính toán đúng giá trị minimum/maximum capacity và cách phân bổ instance theo AZ để vẫn đáp ứng tải tối thiểu khi một AZ gặp sự cố.</p>","answer":"<p>Amazon EC2 Auto Scaling giúp đảm bảo luôn có đúng số lượng EC2 instance cần thiết để xử lý tải cho ứng dụng; bạn tạo các Auto Scaling group, chỉ định số lượng instance tối thiểu (Auto Scaling group sẽ không bao giờ xuống dưới mức này) và tối đa (sẽ không bao giờ vượt quá mức này). Để đạt kiến trúc high availability và fault-tolerant, cần triển khai toàn bộ instance ở các Availability Zone khác nhau, giúp cô lập tài nguyên nếu xảy ra sự cố; để đạt fault tolerance cần có tài nguyên dự phòng (redundant) nhằm tránh suy giảm hệ thống khi có lỗi server hoặc AZ gặp sự cố — điều này đồng nghĩa với việc phải chấp nhận chi phí phát sinh thêm so với mức bình thường để đảm bảo xử lý được các workload mission-critical. Vì đề bài yêu cầu tối thiểu 2 instance để xử lý tải thông thường, hệ thống cần duy trì 2 instance chạy mọi lúc kể cả khi xảy ra sự cố ở một AZ. Có thể dùng Auto Scaling group để tự động mở rộng tài nguyên compute trên từ hai AZ trở lên, với minimum capacity là 4 instance và maximum capacity là 6 instance: nếu mỗi AZ chạy 2 instance, thì ngay cả khi một AZ gặp sự cố, hệ thống vẫn còn tối thiểu 2 instance đang chạy. Do đó, đáp án đúng là: tạo Auto Scaling group với minimum capacity 4 và maximum capacity 6, triển khai 2 instance ở Availability Zone A và 2 instance ở Availability Zone B.</p>","explain":"<p>- Tạo Auto Scaling group với minimum capacity 2, maximum capacity 6, triển khai 4 instance trong Availability Zone A: các instance chỉ được triển khai trong một Availability Zone duy nhất, nên không thể bảo vệ ứng dụng và dữ liệu khỏi sự cố ở cấp datacenter hoặc AZ.</p><p>- Tạo Auto Scaling group với minimum capacity 2, maximum capacity 6, dùng 2 Availability Zone và triển khai 1 instance mỗi AZ: yêu cầu là phải luôn có 2 instance chạy mọi lúc; nếu một AZ gặp sự cố, Auto Scaling group sẽ khởi chạy instance mới ở AZ còn lại, nhưng việc provisioning này không diễn ra ngay lập tức, nên trong một khoảng thời gian sẽ chỉ còn 1 instance đang chạy.</p><p>- Tạo Auto Scaling group với minimum capacity 2, maximum capacity 4, triển khai 2 instance ở Availability Zone A và 2 instance ở Availability Zone B: dù đáp ứng yêu cầu tối thiểu 2 EC2 instance và tính sẵn sàng cao, giá trị maximum capacity ở đây bị sai — phải là 6 để xử lý đúng tải cao điểm (peak load); nếu xảy ra sự cố AZ đúng lúc hệ thống đang ở tải cao điểm, số instance đang chạy trong thiết lập này chỉ còn 4 thay vì 6, ảnh hưởng đến hiệu năng ứng dụng.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html</a></li><li><a href=\"https://docs.aws.amazon.com/documentdb/latest/developerguide/regions-and-azs.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/documentdb/latest/developerguide/regions-and-azs.html</a></li></ul>"},{"id":52,"topic":"Design High-Performing Architectures – về các loại endpoint của Amazon Aurora (cluster/writer endpoint, reader endpoint, insta...","supplement":false,"stem":"An online shopping platform is hosted on an Auto Scaling group of Amazon EC2 Spot instances and utilizes Amazon Aurora PostgreSQL as its database. It is required to optimize database workloads in the cluster by directing the production traffic to high-capacity instances and routing the reporting queries from the internal staff to the low-capacity instances.<br><br>Which is the most suitable configuration for the application as well as the Aurora database cluster to achieve this requirement?","options":[{"html":"In your application, use the instance endpoint of your Aurora database to handle the incoming production traffic and use the cluster endpoint to handle reporting queries.","correct":false},{"html":"Create a custom endpoint in Aurora based on the specified criteria for the production traffic and another custom endpoint to handle the reporting queries.","correct":true},{"html":"Configure your application to use the reader endpoint for both production traffic and reporting queries, which will enable your Aurora database to automatically perform load-balancing among all the Aurora Replicas.","correct":false},{"html":"Do nothing since by default, Aurora will automatically direct the production traffic to your high-capacity instances and the reporting queries to your low-capacity instances.","correct":false}],"multi":1,"analysis":"<p>Dạng bài về các loại endpoint của Amazon Aurora (cluster/writer endpoint, reader endpoint, instance endpoint, custom endpoint) — chọn cách định tuyến traffic phù hợp để tách production traffic (dùng instance dung lượng cao) khỏi reporting query (dùng instance dung lượng thấp).</p>","answer":"<p>Amazon Aurora thường bao gồm một cluster gồm nhiều DB instance thay vì chỉ một instance đơn lẻ; mỗi kết nối được xử lý bởi một DB instance cụ thể. Khi kết nối tới một Aurora cluster, hostname và port bạn chỉ định sẽ trỏ đến một cơ chế trung gian gọi là endpoint — Aurora dùng cơ chế endpoint này để trừu tượng hóa các kết nối, nhờ đó bạn không cần hardcode hostname hay tự viết logic load-balancing/tái định tuyến kết nối khi một số DB instance không khả dụng. Với các tác vụ khác nhau trong Aurora, các instance hoặc nhóm instance khác nhau đảm nhận vai trò khác nhau — ví dụ primary instance xử lý mọi câu lệnh DDL và DML, còn tối đa 15 Aurora Replica xử lý traffic chỉ đọc (read-only). Nhờ các endpoint, bạn có thể ánh xạ mỗi kết nối đến đúng instance hoặc nhóm instance theo nhu cầu sử dụng: dùng cluster endpoint (writer endpoint) để kết nối tới primary instance, dùng reader endpoint để Aurora tự động load-balance giữa các Aurora Replica, hoặc dùng custom endpoint — endpoint gắn với một tập con DB instance cụ thể — cho các cluster có DB instance với dung lượng/cấu hình khác nhau. Custom endpoint cung cấp kết nối database được load-balance dựa trên tiêu chí khác ngoài khả năng read-only hay read-write, ví dụ instance class cụ thể hay DB parameter group cụ thể — nhờ đó bạn có thể hướng một nhóm người dùng (ví dụ nhân viên nội bộ chạy báo cáo, truy vấn ad hoc) đến các instance dung lượng thấp, trong khi production traffic được hướng đến các instance dung lượng cao. Do đó, đáp án đúng là: tạo một custom endpoint trong Aurora theo tiêu chí dành cho production traffic, và một custom endpoint khác để xử lý reporting query.</p>","explain":"<p>- Cấu hình ứng dụng dùng reader endpoint cho cả production traffic lẫn reporting query, giúp Aurora tự động load-balance giữa các Aurora Replica: reader endpoint đúng là giúp Aurora tự động load-balance giữa các Aurora Replica, nhưng chỉ giới hạn ở các thao tác đọc (read-only); vẫn cần dùng custom endpoint để load-balance kết nối theo đúng tiêu chí được chỉ định.</p><p>- Trong ứng dụng, dùng instance endpoint của Aurora để xử lý production traffic và dùng cluster endpoint để xử lý reporting query: cluster endpoint (writer endpoint) của một Aurora DB cluster chỉ kết nối tới primary DB instance hiện tại; endpoint này thực hiện được các thao tác ghi như DDL, phù hợp cho production traffic nhưng không phù hợp cho reporting query vì không có thao tác ghi nào được gửi tới. Hơn nữa, endpoint này không trỏ đến instance dung lượng thấp hay cao theo yêu cầu — giải pháp phù hợp hơn là dùng custom endpoint.</p><p>- Không cần làm gì cả vì mặc định Aurora sẽ tự động hướng production traffic đến instance dung lượng cao và reporting query đến instance dung lượng thấp: Aurora không tự động làm điều này theo mặc định; bạn phải tự tạo custom endpoint để đạt được yêu cầu này.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Endpoints.Custom.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Endpoints.Custom.html</a></li></ul>"},{"id":53,"topic":"Design Secure Architectures – dạng bài kiểm tra khả năng kết hợp đúng dịch vụ identity federation (AWS Directory Serv...","supplement":false,"stem":"A telecommunications company is planning to grant AWS Console access to its developers. Company policy requires the use of identity federation and role-based access control. Currently, the roles are already assigned via groups in the corporate Active Directory.<br><br>In this scenario, what combination of the following services can provide developers access to the AWS console? (Select TWO.)","options":[{"html":"AWS Lambda","correct":false},{"html":"AWS Directory Service AD Connector","correct":true},{"html":"IAM Groups","correct":false},{"html":"AWS Directory Service Simple AD","correct":false},{"html":"IAM Roles","correct":true}],"multi":2,"analysis":"<p>Đây là dạng bài kiểm tra khả năng kết hợp đúng dịch vụ identity federation (AWS Directory Service) với cơ chế phân quyền (IAM) để cấp quyền truy cập AWS Console dựa trên Active Directory on-premises sẵn có của doanh nghiệp.</p>","answer":"<p>Vì công ty đang sử dụng Active Directory doanh nghiệp (corporate AD), giải pháp phù hợp nhất để tích hợp dễ dàng là AWS Directory Service AD Connector — đây là một directory gateway giúp chuyển hướng (redirect) các yêu cầu directory đến Microsoft Active Directory on-premises hiện có. Ngoài ra, vì các roles đã được gán sẵn theo groups trong Active Directory, nên nên sử dụng thêm IAM Roles. Sau khi AD Connector tích hợp Active Directory với VPC, ta có thể gán một IAM Role cho các users hoặc groups đến từ Active Directory.</p>","explain":"<p>- AWS Directory Service Simple AD: chỉ cung cấp một tập hợp con các tính năng so với AWS Managed Microsoft AD (quản lý user accounts, group memberships, tạo và áp dụng group policies, kết nối an toàn đến EC2, cung cấp Kerberos-based SSO); trong tình huống này, AD Connector phù hợp hơn vì đây là gateway để chuyển hướng yêu cầu đến Active Directory on-premises hiện có.</p><p>- IAM Groups: chỉ là một tập hợp các IAM users, giúp gán quyền cho nhiều users cùng lúc dễ dàng hơn; trong tình huống này, IAM Roles phù hợp hơn để cấp quyền tạo các tài nguyên AWS Directory Service.</p><p>- AWS Lambda: chủ yếu được dùng cho serverless computing, không liên quan đến việc cấp quyền truy cập AWS Console dựa trên Active Directory.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/blogs/security/how-to-connect-your-on-premises-active-directory-to-aws-using-ad-connector/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/blogs/security/how-to-connect-your-on-premises-active-directory-to-aws-using-ad-connector/</a></li><li><a href=\"https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ad_connector_getting_started.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ad_connector_getting_started.html</a></li><li><a href=\"https://youtu.be/4XeqotTYBtY\" target=\"_blank\" rel=\"noopener noreferrer\">https://youtu.be/4XeqotTYBtY</a></li></ul>"},{"id":54,"topic":"Design Secure Architectures – dạng bài chọn giải pháp bảo mật phù hợp nhất để phát hiện và giảm thiểu tấn công DDoS n...","supplement":false,"stem":"A Solutions Architect identified a series of DDoS attacks while monitoring the Amazon VPC, where applications are fronted by Elastic Load Balancing. The Architect needs to fortify the current cloud infrastructure to protect the data of the clients.<br><br>Which of the following is the most suitable solution to mitigate these kinds of attacks?","options":[{"html":"Use AWS Shield Advanced to detect and mitigate DDoS attacks.","correct":true},{"html":"Use both Security Groups and Network Access Control Lists to restrict VPC traffic to authorized sources only.","correct":false},{"html":"Using the AWS Firewall Manager, set up a security layer that will prevent SYN floods, UDP reflection attacks, and other DDoS attacks.","correct":false},{"html":"Set up a web application firewall using AWS WAF to filter, monitor, and block HTTP traffic.","correct":false}],"multi":1,"analysis":"<p>Đây là dạng bài chọn giải pháp bảo mật phù hợp nhất để phát hiện và giảm thiểu tấn công DDoS nhắm vào các tài nguyên đứng sau Elastic Load Balancing trong VPC — một dạng câu hỏi quen thuộc về network/infrastructure security trong SAA-C03.</p>","answer":"<p>Để có mức độ bảo vệ cao hơn trước các cuộc tấn công nhắm vào ứng dụng chạy trên Amazon EC2, Elastic Load Balancing, Amazon CloudFront và Amazon Route 53, ta nên đăng ký sử dụng AWS Shield Advanced. Ngoài các bảo vệ ở tầng network và transport có sẵn trong Shield Standard, Shield Advanced còn cung cấp khả năng phát hiện và giảm thiểu các cuộc tấn công DDoS lớn và phức tạp, cung cấp khả năng quan sát (visibility) gần thời gian thực về các cuộc tấn công, và tích hợp với AWS WAF. Shield Advanced còn cho phép truy cập 24/7 vào đội DDoS Response Team (DRT) của AWS và bảo vệ chi phí phát sinh liên quan đến DDoS trên EC2, ELB, CloudFront và Route 53.</p>","explain":"<p>- Dùng AWS Firewall Manager để thiết lập lớp bảo mật chặn SYN flood, UDP reflection attack và các tấn công DDoS khác: AWS Firewall Manager chủ yếu dùng để đơn giản hóa việc quản trị và bảo trì AWS WAF trên nhiều account và resource, không bảo vệ VPC khỏi tấn công DDoS.</p><p>- Thiết lập web application firewall bằng AWS WAF để lọc, giám sát và chặn HTTP traffic: dù AWS WAF có thể giúp chặn các mẫu tấn công phổ biến như SQL injection hay cross-site scripting, nhưng vẫn không đủ để chống chịu các cuộc tấn công DDoS; nên dùng AWS Shield trong tình huống này.</p><p>- Dùng cả Security Groups và Network ACLs để giới hạn traffic VPC chỉ cho các nguồn được ủy quyền: kết hợp Security Groups và NACLs là hợp lệ để bảo vệ VPC, nhưng không đủ để giảm thiểu tấn công DDoS; nên dùng AWS Shield để có mức bảo vệ tốt hơn.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/shield/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/shield/</a></li></ul>"},{"id":55,"topic":"Design Cost-Optimized Architectures – dạng bài so sánh các dịch vụ lưu trữ (Amazon S3, Amazon EFS, Amazon EBS) để chọn giải p...","supplement":false,"stem":"A company plans to host a web application in an Auto Scaling group of Amazon EC2 instances. The application will be used globally by users to upload and store several types of files. Based on user trends, files that are older than 2 years must be stored in a different storage class. The Solutions Architect of the company needs to create a cost-effective and scalable solution to store the old files yet still provide durability and high availability.<br><br>Which of the following approach can be used to fulfill this requirement? (Select TWO.)","options":[{"html":"Use Amazon EBS volumes to store the files. Configure the Amazon Data Lifecycle Manager (DLM) to schedule snapshots of the volumes after 2 years.","correct":false},{"html":"Use Amazon S3 and create a lifecycle policy that will move the objects to S3 Standard-IA after 2 years.","correct":true},{"html":"Use Amazon S3 and create a lifecycle policy that will move the objects to S3 Glacier after 2 years.","correct":true},{"html":"Use a RAID 0 storage configuration that stripes multiple Amazon EBS volumes together to store the files. Configure the Amazon Data Lifecycle Manager (DLM) to schedule snapshots of the volumes after 2 years.","correct":false},{"html":"Use Amazon EFS and create a lifecycle policy that will move the objects to EFS-IA after 2 years.","correct":false}],"multi":2,"analysis":"<p>Đây là dạng bài so sánh các dịch vụ lưu trữ (Amazon S3, Amazon EFS, Amazon EBS) để chọn giải pháp lifecycle transition cho dữ liệu cũ, vừa cost-effective, scalable, vừa đảm bảo durability và high availability — một dạng câu hỏi phổ biến về storage tier trong SAA-C03.</p>","answer":"<p>Amazon S3 lưu dữ liệu dưới dạng object trong bucket; ta có thể kiểm soát quyền truy cập, chọn vùng địa lý lưu trữ, và xem log truy cập của bucket. Cả Amazon S3 và Amazon EFS đều hỗ trợ lifecycle configuration để chuyển file sang storage class khác, tuy nhiên Amazon EFS lifecycle policy chỉ hỗ trợ khoảng thời gian chuyển tối thiểu 1 ngày và tối đa 365 ngày. Vì yêu cầu là di chuyển các file cũ hơn 2 năm (730 ngày), nên EFS không thể đáp ứng được yêu cầu này ngay cả ở cấu hình tối đa. Do đó, để có giải pháp cost-effective và scalable, nên dùng Amazon S3 lifecycle configuration: với S3 lifecycle rules, ta có thể chuyển file sang S3 Standard-IA hoặc S3 Glacier; dùng S3 Glacier expedited retrieval, ta vẫn có thể truy xuất file nhanh chỉ trong 1-5 phút.</p>","explain":"<p>- Dùng Amazon EFS và tạo lifecycle policy chuyển object sang EFS-IA sau 2 năm: số ngày tối đa của EFS lifecycle policy chỉ lên đến 365 ngày, do đó không đáp ứng yêu cầu di chuyển file cũ hơn 2 năm (730 ngày).</p><p>- Dùng Amazon EBS volumes để lưu file, cấu hình Amazon Data Lifecycle Manager (DLM) để lên lịch snapshot sau 2 năm: Amazon EBS đơn giản là tốn chi phí hơn và kém scalable hơn Amazon S3; EBS còn có một số hạn chế khi được truy cập bởi nhiều EC2 instance cùng lúc, và chi phí rất lớn nếu dùng tính năng multi-attach trên Provisioned IOPS EBS volume để nhiều EC2 instance cùng truy cập volume.</p><p>- Dùng cấu hình RAID 0 kết hợp (stripe) nhiều Amazon EBS volumes để lưu file, cấu hình DLM để lên lịch snapshot sau 2 năm: RAID (Redundant Array of Independent Disks) chỉ là công nghệ ảo hóa lưu trữ dữ liệu kết hợp nhiều thiết bị lưu trữ để đạt hiệu năng hoặc độ bền (durability) cao hơn; RAID 0 chỉ giúp stripe nhiều volume lại để tăng hiệu năng I/O so với một volume đơn lẻ, còn RAID 1 mới mirror hai volume để đạt redundancy trên cùng instance — đây không phải là giải pháp lifecycle cho dữ liệu cũ.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/object-lifecycle-mgmt.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/dev/object-lifecycle-mgmt.html</a></li><li><a href=\"https://docs.aws.amazon.com/efs/latest/ug/lifecycle-management-efs.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/efs/latest/ug/lifecycle-management-efs.html</a></li><li><a href=\"https://docs.aws.amazon.com/efs/latest/ug/API_LifecyclePolicy.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/efs/latest/ug/API_LifecyclePolicy.html</a></li><li><a href=\"https://aws.amazon.com/s3/faqs/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/s3/faqs/</a></li></ul>"},{"id":56,"topic":"Design Secure Architectures – dạng bài kiến trúc streaming xử lý dữ liệu real-time có yêu cầu bảo mật/tuân thủ (anony...","supplement":false,"stem":"A healthcare organization wants to build a system that can predict drug prescription abuse. The organization will gather real-time data from multiple sources, which include Personally Identifiable Information (PII). It’s crucial that this sensitive information is anonymized prior to landing in a NoSQL database for further processing.<br><br>Which solution would meet the requirements?","options":[{"html":"Create a data lake in Amazon S3 and use it as the primary storage for patient health data. Use an S3 trigger to run an AWS Lambda function that performs anonymization. Send the anonymized data to Amazon DynamoDB.","correct":false},{"html":"Deploy an Amazon Data Firehose stream to capture and transform the streaming data. Deliver the anonymized data to Amazon Redshift for analysis.","correct":false},{"html":"Ingest real-time data using Amazon Kinesis Data Stream. Use an AWS Lambda function to anonymize the PII, then store it in Amazon DynamoDB.","correct":true},{"html":"Stream the data in an Amazon DynamoDB table. Enable DynamoDB Streams, and configure an AWS Lambda function with AmazonDynamoDBFullAccess permissions to perform anonymization on newly written items.","correct":false}],"multi":1,"analysis":"<p>Đây là dạng bài kiến trúc streaming xử lý dữ liệu real-time có yêu cầu bảo mật/tuân thủ (anonymize PII) trước khi dữ liệu được lưu trữ bền vững (persist), kết hợp với chọn đúng loại database đích (NoSQL).</p>","answer":"<p>Amazon Kinesis Data Streams (KDS) là dịch vụ streaming dữ liệu real-time có khả năng mở rộng và bền vững, có thể liên tục capture hàng gigabyte dữ liệu mỗi giây từ hàng trăm nghìn nguồn. KDS tích hợp liền mạch với AWS Lambda, cho phép transform và anonymize dữ liệu Personally Identifiable Information (PII) ngay khi dữ liệu đang di chuyển (in transit), trước khi được lưu trữ vào bất kỳ hệ thống nào. Điều này đảm bảo dữ liệu nhạy cảm được anonymize ngay lập tức, không để PII chưa được anonymize bị lưu trữ, đúng theo yêu cầu đề bài. Dữ liệu sau khi anonymize được lưu vào Amazon DynamoDB, một NoSQL database phù hợp để xử lý dữ liệu đã qua xử lý cho các phân tích tiếp theo, ví dụ như dự đoán lạm dụng thuốc kê toa.</p>","explain":"<p>- Tạo data lake trong Amazon S3 làm storage chính cho dữ liệu sức khỏe bệnh nhân, dùng S3 trigger chạy Lambda function để anonymize, rồi gửi dữ liệu đã anonymize sang DynamoDB: cách này lưu PII chưa được anonymize vào Amazon S3 trước khi Lambda function xử lý, vi phạm trực tiếp yêu cầu PII phải được anonymize trước khi lưu vào bất kỳ hệ thống lưu trữ nào; việc lưu dữ liệu nhạy cảm vào S3 dù chỉ tạm thời cũng làm tăng rủi ro lộ dữ liệu và không tuân thủ yêu cầu về quyền riêng tư.</p><p>- Stream dữ liệu vào bảng Amazon DynamoDB, bật DynamoDB Streams và cấu hình Lambda function với quyền AmazonDynamoDBFullAccess để anonymize các item mới được ghi: DynamoDB Streams chỉ xử lý các thay đổi trên dữ liệu đã được ghi, nghĩa là PII chưa anonymize sẽ bị lưu vào DynamoDB trước khi được xử lý, vi phạm yêu cầu đề bài; ngoài ra, việc dùng quyền AmazonDynamoDBFullAccess vi phạm nguyên tắc least privilege vì cấp quyền nhiều hơn mức cần thiết.</p><p>- Triển khai Amazon Data Firehose để capture và transform dữ liệu streaming, gửi dữ liệu đã anonymize đến Amazon Redshift để phân tích: yêu cầu đề bài là phải lưu trữ vào một NoSQL database, trong khi Amazon Redshift là giải pháp data warehousing dạng quan hệ (relational), không phải NoSQL, nên không phù hợp.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/kinesis/data-streams/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/kinesis/data-streams/</a></li><li><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html</a></li></ul>"},{"id":57,"topic":"Design Resilient Architectures – dạng bài chọn dịch vụ storage phù hợp cho workload Windows Server cần vừa high availabi...","supplement":false,"stem":"A financial services company plans to migrate its trading application from on-premises Microsoft Windows Server to Amazon Web Services (AWS).<br>The solution must ensure high availability across multiple Availability Zones and offer low-latency access to block storage.<br><br>Which of the following solutions will fulfill these requirements?","options":[{"html":"Deploy the trading application on Amazon EC2 Windows Server instances across two Availability Zones. Use Amazon Elastic File System (Amazon EFS) to provide shared storage between the instances. Configure Amazon EFS with cross-region replication to sync data across Availability Zones.","correct":false},{"html":"Configure the trading application on Amazon EC2 Windows instances across two Availability Zones. Use Amazon Simple Storage Service (Amazon S3) for storage and configure cross-region replication to sync data between S3 buckets in each Availability Zone.","correct":false},{"html":"Deploy the trading application on Amazon EC2 Windows Server instances across two Availability Zones. Use Amazon FSx for Windows File Server for shared storage.","correct":false},{"html":"Configure the trading application on Amazon EC2 Windows Server instances across two Availability Zones. Use Amazon FSx for NetApp ONTAP to create a Multi-AZ file system and access the data via iSCSI protocol.","correct":true}],"multi":1,"analysis":"<p>Đây là dạng bài chọn dịch vụ storage phù hợp cho workload Windows Server cần vừa high availability đa AZ, vừa low-latency access đến block storage — một dạng câu hỏi phân biệt giữa file storage và block storage trong hệ sinh thái FSx của AWS.</p>","answer":"<p>Amazon FSx for NetApp ONTAP là dịch vụ managed storage dựa trên hệ thống tệp ONTAP của NetApp, cung cấp cả giao thức file (NFS, SMB) lẫn block (iSCSI), tương thích với môi trường Windows, Linux và macOS. FSx for NetApp ONTAP hỗ trợ Multi-AZ file system được thiết kế để đảm bảo continuous availability xuyên suốt các Availability Zone của AWS, mang lại high availability cho workload Windows Server. Nó cung cấp độ trễ thao tác file ở mức sub-millisecond với SSD storage, cần thiết cho các workload block storage trong môi trường Windows, và hỗ trợ đầy đủ giao thức block storage iSCSI thường dùng trong Windows Server, đồng thời tương thích với giao thức SMB. FSx for NetApp ONTAP cũng giúp đơn giản hóa việc di chuyển từ hệ thống NetApp on-premises lên AWS, và có thể mở rộng đến quy mô petabyte.</p>","explain":"<p>- Dùng Amazon FSx for Windows File Server để chia sẻ storage: FSx for Windows File Server chỉ cung cấp shared, low-latency FILE storage cho môi trường Windows, không hỗ trợ truy cập block storage với độ trễ thấp.</p><p>- Dùng Amazon EFS để chia sẻ storage giữa các instance, cấu hình cross-region replication để đồng bộ dữ liệu giữa các Availability Zone: dù cách này cung cấp high availability xuyên các AZ, Amazon EFS không được tối ưu cho workload Windows và không cung cấp block storage độ trễ thấp.</p><p>- Dùng Amazon S3 để lưu trữ và cấu hình cross-region replication để đồng bộ dữ liệu giữa các S3 bucket ở từng Availability Zone: dù cách này cung cấp high availability xuyên các AZ, Amazon S3 chủ yếu là object storage, không phải block storage, nên không đáp ứng yêu cầu truy cập độ trễ thấp cần thiết cho ứng dụng giao dịch (trading application).</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/what-is-fsx-ontap.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/what-is-fsx-ontap.html</a></li><li><a href=\"https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/high-availability-AZ.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/high-availability-AZ.html</a></li></ul>"},{"id":58,"topic":"Design Resilient Architectures – dạng bài phân biệt giữa việc capture các thay đổi dữ liệu (data change events) trong da...","supplement":false,"stem":"A car dealership website hosted in Amazon EC2 stores car listings in an Amazon Aurora database managed by Amazon RDS. Once a vehicle has been sold, its data must be removed from the current listings and forwarded to a distributed processing system.<br><br>Which of the following options can satisfy the given requirement?","options":[{"html":"Use an Aurora MySQL native function to invoke an AWS Lambda function whenever a vehicle listing is deleted. Configure the Lambda function to send the data to an Amazon SQS queue for the distributed processing system to consume.","correct":true},{"html":"Create an RDS event subscription and send the notifications to Amazon SQS. Configure the SQS queues to fan out the event notifications to multiple Amazon SNS topics. Process the data using AWS Lambda functions.","correct":false},{"html":"Create an RDS event subscription and send the notifications to AWS Lambda. Configure the Lambda function to fanout the event notifications to multiple Amazon SQS queues to update the target groups.","correct":false},{"html":"Create an RDS event subscription and send the notifications to Amazon SNS. Configure the SNS topic to fan out the event notifications to multiple Amazon SQS queues. Process the data using AWS Lambda functions.","correct":false}],"multi":1,"analysis":"<p>Đây là dạng bài phân biệt giữa việc capture các thay đổi dữ liệu (data change events) trong database và việc theo dõi các sự kiện vận hành hạ tầng (operational events) của RDS, từ đó chọn đúng cơ chế trigger để chuyển dữ liệu đến một hệ thống xử lý phân tán (distributed processing system).</p>","answer":"<p>Ta có thể gọi (invoke) một AWS Lambda function từ một Amazon Aurora MySQL-Compatible Edition DB cluster bằng cách dùng native function (lambda_sync hoặc lambda_async). Cách này hữu ích khi muốn tích hợp database chạy trên Aurora MySQL với các dịch vụ AWS khác, ví dụ như capture các thay đổi dữ liệu mỗi khi một row trong bảng bị chỉnh sửa. Trong tình huống này, ta có thể trigger một Lambda function bằng native function mỗi khi một listing bị xóa khỏi database, sau đó viết logic trong function để gửi dữ liệu listing đến một SQS queue để các tiến trình khác nhau tiêu thụ (consume).</p>","explain":"<p>- Tạo RDS event subscription gửi thông báo đến Amazon SQS, cấu hình SQS queue fan-out thông báo sự kiện sang nhiều SNS topic, rồi xử lý dữ liệu bằng Lambda: RDS event subscription thường chỉ thông báo về các thay đổi vận hành (operational changes) chứ không phải thay đổi dữ liệu; phương pháp này không capture được các thao tác chỉnh sửa dữ liệu như INSERT, DELETE hay UPDATE.</p><p>- Tạo RDS event subscription gửi thông báo đến AWS Lambda, cấu hình Lambda fan-out thông báo sự kiện sang nhiều SQS queue để cập nhật target groups: tương tự, RDS event subscription chủ yếu tập trung vào các thay đổi ở cấp vận hành (operational-level), không trực tiếp capture các thay đổi dữ liệu.</p><p>- Tạo RDS event subscription gửi thông báo đến Amazon SNS, cấu hình SNS topic fan-out thông báo sự kiện sang nhiều SQS queue, rồi xử lý dữ liệu bằng Lambda: RDS event subscription chỉ theo dõi các sự kiện liên quan đến hạ tầng (infrastructure-related events), không phải các thay đổi dữ liệu thực tế trong database.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraMySQL.Integrating.Lambda.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.ama
