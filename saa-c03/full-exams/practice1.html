 đúng 2 cơ chế THỰC SỰ dựa trên VỊ TRÍ ĐỊA LÝ người dùng để giới hạn truy cập (không phải latency/failover/weighted)</p>","answer":"<p>Geolocation routing (Route 53) và Georestriction (CloudFront) đều dựa trực tiếp vào vị trí địa lý của người dùng để quyết định cho phép hay chặn truy cập nội dung — đúng bản chất yêu cầu về quyền phân phối địa lý.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: Route 53 geolocation routing policy định tuyến theo vị trí địa lý người dùng, có thể dùng để giới hạn phân phối nội dung theo quyền phân phối.</li><li><b>B. ✓</b> Đúng: CloudFront georestriction (geo-blocking) chặn/cho phép truy cập nội dung theo danh sách quốc gia whitelist/blacklist.</li><li><b>C. ✗</b> Route 53 latency-based routing: chọn vùng có độ trễ thấp nhất, không liên quan tới việc hạn chế truy cập theo quyền phân phối địa lý.</li><li><b>D. ✗</b> Route 53 failover routing: chỉ chuyển traffic khi tài nguyên chính gặp sự cố, không phải cơ chế hạn chế theo vị trí địa lý.</li><li><b>E. ✗</b> Route 53 weighted routing: chia tỉ lệ traffic giữa các tài nguyên, không liên quan tới hạn chế truy cập theo địa lý.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Latency-based, weighted, và failover routing đều là các routing policy có thật của Route 53, dễ gây nhầm lẫn, nhưng không cái nào liên quan tới việc kiểm soát theo VỊ TRÍ ĐỊA LÝ của người xem.</p>","tip":"<p>Hạn chế nội dung theo quốc gia/vị trí người dùng: Route 53 Geolocation routing (ở tầng DNS) + CloudFront Georestriction (ở tầng CDN) — không nhầm với latency/weighted/failover (các mục tiêu khác).</p>"},{"id":55,"topic":"Design Cost-Optimized Architectures – S3 lifecycle transitions không hợp lệ (Select two)","supplement":false,"stem":"The IT department at a consulting firm is conducting a training workshop for new developers. As part of an evaluation exercise on Amazon S3, the new developers were asked to identify the invalid storage class lifecycle transitions for objects stored on Amazon S3.<br>Can you spot the INVALID lifecycle transitions from the options below? (Select two)","options":[{"html":"Amazon S3 Standard =&gt; Amazon S3 Intelligent-Tiering","correct":false},{"html":"Amazon S3 Intelligent-Tiering =&gt; Amazon S3 Standard","correct":true},{"html":"Amazon S3 One Zone-IA =&gt; Amazon S3 Standard-IA","correct":true},{"html":"Amazon S3 Standard-IA =&gt; Amazon S3 Intelligent-Tiering","correct":false},{"html":"Amazon S3 Standard-IA =&gt; Amazon S3 One Zone-IA","correct":false}],"multi":2,"analysis":"<p>Ghi nhớ mô hình &quot;thác nước&quot; (waterfall) một chiều của S3 lifecycle — không bao giờ quay ngược về Standard</p>","answer":"<p>S3 lifecycle transition chỉ cho phép đi một chiều xuống các tầng rẻ hơn (hoặc tới Glacier); không storage class nào (kể cả One Zone-IA) được phép chuyển ngược lại Standard hoặc Standard-IA từ Intelligent-Tiering.</p>","explain":"<ul><li><b>A. ✗</b> Standard → Intelligent-Tiering: hợp lệ — Standard có thể chuyển sang bất kỳ storage class nào khác.</li><li><b>B. ✓</b> Đúng (không hợp lệ): Intelligent-Tiering → Standard — không có transition nào được phép quay NGƯỢC VỀ Standard từ storage class khác.</li><li><b>C. ✓</b> Đúng (không hợp lệ): One Zone-IA → Standard-IA — One Zone-IA chỉ được phép chuyển sang Glacier/Glacier Deep Archive, không chuyển ngược lên Standard-IA.</li><li><b>D. ✗</b> Standard-IA → Intelligent-Tiering: hợp lệ — đây là một trong các transition được phép.</li><li><b>E. ✗</b> Standard-IA → One Zone-IA: hợp lệ — đây cũng là transition được phép.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> One Zone-IA → Standard-IA nghe hợp lý (đều là &quot;IA&quot;, có vẻ như nâng cấp độ bền) nhưng đây chính xác là một trong các transition bị cấm theo tài liệu AWS.</p>","tip":"<p>Quy tắc lifecycle S3: KHÔNG storage class nào được chuyển NGƯỢC về Standard. Intelligent-Tiering không chuyển về Standard-IA. One Zone-IA không chuyển lên Standard-IA/Intelligent-Tiering.</p>"},{"id":56,"topic":"Design High-Performing Architectures – Amazon Comprehend custom entity recognition — serverless, không cần chuyên gia ML","supplement":false,"stem":"An e-commerce company manages a digital catalog of consumer products submitted by third-party sellers. Each product submission includes a description stored as a text file in an Amazon S3 bucket. These descriptions may include ingredient information for consumable products like snacks, supplements, or beverages. The company wants to build a fully automated solution that extracts ingredient names from the uploaded product descriptions and uses those names to query an Amazon DynamoDB table, which returns precomputed health and safety scores for each ingredient. Non-food items and invalid submissions can be ignored without affecting application logic. The company has no in-house machine learning (ML) experts and is looking for the most cost-effective solution with minimal operational overhead.<br>Which solution meets these requirements MOST cost-effectively?","options":[{"html":"Create a workflow where Amazon Transcribe is used to convert synthetic audio versions (created from text of the product descriptions) back into text. Analyze the transcripts manually or using simple keyword matching within a Lambda function. Use Amazon SNS to notify the content moderation team for each processed file","correct":false},{"html":"Configure S3 Event Notifications to trigger an AWS Lambda function whenever a new product description is uploaded. Inside the function, use Amazon Comprehend's custom entity recognition feature to extract ingredient names. Store these names in the DynamoDB table and let the front-end application query for health scores","correct":true},{"html":"Use Amazon Lookout for Vision to scan the uploaded text files in the S3 bucket and extract entities. Invoke this workflow using an S3-triggered Lambda function. Parse the output and use Amazon API Gateway to push updates to the frontend in real time","correct":false},{"html":"Use Amazon SageMaker with a custom-trained NLP model to identify ingredients from the uploaded descriptions. Use Amazon EventBridge to invoke a Lambda function that forwards the document content to a SageMaker endpoint and stores the results in DynamoDB. Fine-tune the model using labeled ingredient datasets from open-source repositories and retrain it monthly","correct":false}],"multi":1,"analysis":"<p>Chọn dịch vụ AI fully-managed, không cần ML expertise, tích hợp serverless dễ dàng (S3 event → Lambda → AI service)</p>","answer":"<p>Amazon Comprehend với custom entity recognition được quản lý hoàn toàn bởi AWS, không đòi hỏi kỹ năng ML, dễ dàng tích hợp vào pipeline serverless (S3 Event → Lambda → Comprehend → DynamoDB).</p>","explain":"<ul><li><b>A. ✗</b> Transcribe tạo audio rồi transcribe ngược lại + phân tích thủ công/keyword trong Lambda: quy trình vòng vo, không tự động hoàn toàn, vẫn cần con người can thiệp (content moderation team).</li><li><b>B. ✓</b> S3 Event Notification + Lambda dùng Comprehend custom entity recognition để trích xuất thành phần, lưu vào DynamoDB: Comprehend fully managed, không cần chuyên gia ML, tích hợp serverless dễ dàng — đúng mọi ràng buộc.</li><li><b>C. ✗</b> Amazon Lookout for Vision để quét file text: Lookout for Vision dùng cho ảnh (phát hiện bất thường hình ảnh), hoàn toàn không xử lý được văn bản.</li><li><b>D. ✗</b> SageMaker với NLP model tự huấn luyện, fine-tune hàng tháng: đòi hỏi chuyên gia ML để huấn luyện/duy trì model — vi phạm trực tiếp ràng buộc &quot;không có chuyên gia ML trong nhà&quot;.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> SageMaker nghe như lựa chọn &quot;mạnh mẽ, tùy biến cao&quot; cho bài toán NLP nhưng đòi hỏi đúng thứ công ty không có — chuyên gia ML để huấn luyện và duy trì model.</p>","tip":"<p>Cần trích xuất entity từ văn bản, không có chuyên gia ML, muốn fully managed → Amazon Comprehend (custom entity recognition). Cần tùy biến sâu, có đội ML → SageMaker.</p>"},{"id":57,"topic":"Design High-Performing Architectures – AWS Global Accelerator — UDP, custom DNS, fast regional failover","supplement":false,"stem":"A gaming company is looking at improving the availability and performance of its global flagship application which utilizes User Datagram Protocol and needs to support fast regional failover in case an AWS Region goes down. The company wants to continue using its own custom Domain Name System (DNS) service.<br>Which of the following AWS services represents the best solution for this use-case?","options":[{"html":"Amazon CloudFront","correct":false},{"html":"AWS Global Accelerator","correct":true},{"html":"Amazon Route 53","correct":false},{"html":"AWS Elastic Load Balancing (ELB)","correct":false}],"multi":1,"analysis":"<p>Chọn dịch vụ cải thiện hiệu năng mạng toàn cầu hỗ trợ UDP + GIỮ NGUYÊN DNS hiện có của khách hàng</p>","answer":"<p>Global Accelerator hỗ trợ UDP (cần cho gaming), cải thiện hiệu năng qua mạng AWS toàn cầu, hỗ trợ failover vùng nhanh, và không đòi hỏi công ty phải chuyển sang dùng Route 53 làm DNS.</p>","explain":"<ul><li><b>A. ✗</b> Amazon CloudFront: là CDN cho nội dung HTTP(S)/cacheable, không hỗ trợ UDP, không phù hợp ứng dụng gaming dùng UDP.</li><li><b>B. ✓</b> AWS Global Accelerator: hỗ trợ cả TCP và UDP, cải thiện hiệu năng qua mạng AWS toàn cầu, cung cấp failover vùng nhanh, không yêu cầu đổi DNS service — đúng mọi tiêu chí đề.</li><li><b>C. ✗</b> Amazon Route 53: là dịch vụ DNS, nhưng đề nói công ty muốn TIẾP TỤC dùng DNS riêng của mình — dùng Route 53 đi ngược yêu cầu này.</li><li><b>D. ✗</b> AWS Elastic Load Balancing (ELB): chỉ cân bằng tải trong 1 Region, không cung cấp failover nhanh xuyên Region như Global Accelerator.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Route 53 nghe như lựa chọn hiển nhiên cho &quot;regional failover&quot; (có failover routing policy), nhưng đề yêu cầu rõ công ty muốn GIỮ DNS riêng — dùng Route 53 vi phạm trực tiếp ràng buộc này.</p>","tip":"<p>Ứng dụng dùng UDP, cần failover vùng nhanh, IP tĩnh, KHÔNG muốn đổi DNS → AWS Global Accelerator (TCP/UDP, không phải HTTP-only như CloudFront).</p>"},{"id":58,"topic":"Design Secure Architectures – EFS access control: Security Group (mạng) + IAM policy (client) (Select two)","supplement":false,"stem":"A company has moved its business critical data to Amazon Elastic File System (Amazon EFS) which will be accessed by multiple Amazon EC2 instances.<br>As an AWS Certified Solutions Architect - Associate, which of the following would you recommend to exercise access control such that only the permitted Amazon EC2 instances can read from the Amazon EFS file system? (Select two)","options":[{"html":"Use Amazon GuardDuty to curb unwanted access to Amazon EFS file system","correct":false},{"html":"Use VPC security groups to control the network traffic to and from your file system","correct":true},{"html":"Use network access control list (network ACL) to control the network traffic to and from your Amazon EC2 instance","correct":false},{"html":"Use an IAM policy to control access for clients who can mount your file system with the required permissions","correct":true},{"html":"Set up the IAM policy root credentials to control and configure the clients accessing the Amazon EFS file system","correct":false}],"multi":2,"analysis":"<p>Kiểm soát EFS bằng 2 lớp bổ sung nhau: Security Group (tầng mạng) + IAM policy (tầng client/API)</p>","answer":"<p>Security Group kiểm soát traffic mạng tới/từ file system ở mức instance, còn IAM policy kiểm soát chính xác client nào được mount và với quyền gì — kết hợp cả hai mới đạt kiểm soát truy cập đầy đủ.</p>","explain":"<ul><li><b>A. ✗</b> GuardDuty: là dịch vụ phát hiện mối đe dọa, không dùng để kiểm soát quyền truy cập EFS.</li><li><b>B. ✓</b> Đúng: VPC Security Group kiểm soát traffic mạng ra/vào file system — chỉ instance nằm trong security group được phép mới kết nối được.</li><li><b>C. ✗</b> Network ACL: hoạt động ở mức SUBNET, không phải mức instance, nên không đủ chi tiết để kiểm soát từng instance riêng lẻ truy cập EFS.</li><li><b>D. ✓</b> Đúng: IAM policy gắn vào file system kiểm soát client nào được phép mount và với quyền gì (kết hợp EFS Access Points để quản lý chi tiết hơn).</li><li><b>E. ✗</b> &quot;IAM policy root credentials&quot;: khái niệm không tồn tại — chỉ là distractor bịa đặt.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Network ACL nghe như công cụ kiểm soát mạng hợp lý tương tự Security Group, nhưng NACL hoạt động ở mức SUBNET chứ không phải mức instance, nên không đủ chi tiết cho yêu cầu &quot;chỉ instance được phép&quot;.</p>","tip":"<p>Kiểm soát truy cập EFS: Security Group (ai được kết nối mạng tới file system) + IAM Policy (ai được mount, quyền gì) — Network ACL quá thô (theo subnet) để dùng cho mục đích này.</p>"},{"id":59,"topic":"Design Secure Architectures – SSE-KMS — mã hóa S3 có audit trail","supplement":false,"stem":"A US-based healthcare startup is building an interactive diagnostic tool for COVID-19 related assessments. The users would be required to capture their personal health records via this tool. As this is sensitive health information, the backup of the user data must be kept encrypted in Amazon Simple Storage Service (Amazon S3). The startup does not want to provide its own encryption keys but still wants to maintain an audit trail of when an encryption key was used and by whom.<br>Which of the following is the BEST solution for this use-case?","options":[{"html":"Use server-side encryption with customer-provided keys (SSE-C) to encrypt the user data on Amazon S3","correct":false},{"html":"Use client-side encryption with client provided keys and then upload the encrypted user data to Amazon S3","correct":false},{"html":"Use server-side encryption with Amazon S3 managed keys (SSE-S3) to encrypt the user data on Amazon S3","correct":false},{"html":"Use server-side encryption with AWS Key Management Service keys (SSE-KMS) to encrypt the user data on Amazon S3","correct":true}],"multi":1,"analysis":"<p>Chọn loại mã hóa S3 vừa KHÔNG cần tự quản lý khóa, vừa CÓ audit trail sử dụng khóa</p>","answer":"<p>SSE-KMS cho phép AWS quản lý khóa (không cần công ty tự cung cấp) trong khi vẫn ghi lại đầy đủ nhật ký sử dụng khóa qua CloudTrail — thỏa cả hai yêu cầu đối lập nhau của đề.</p>","explain":"<ul><li><b>A. ✗</b> SSE-C (customer-provided keys): công ty phải tự cung cấp và quản lý khóa mỗi request — không phải yêu cầu đề (không muốn tự cung cấp khóa), và không có audit trail riêng cho việc dùng khóa.</li><li><b>B. ✗</b> Client-side encryption với khóa tự cung cấp: công ty phải tự cung cấp khóa — trái với yêu cầu không muốn tự quản lý khóa mã hóa.</li><li><b>C. ✗</b> SSE-S3 (khóa do S3 quản lý): không cung cấp audit trail chi tiết về việc khóa được dùng khi nào, bởi ai.</li><li><b>D. ✓</b> SSE-KMS: AWS quản lý khóa (không cần công ty tự cung cấp) VÀ cung cấp audit trail đầy đủ qua CloudTrail về việc khóa được dùng khi nào, bởi ai — đáp ứng cả 2 yêu cầu.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> SSE-S3 và SSE-C đều là các phương thức mã hóa S3 hợp lệ nhưng đều thiếu MỘT trong hai yêu cầu đề đưa ra: SSE-S3 thiếu audit trail chi tiết, SSE-C đòi công ty tự cung cấp khóa.</p>","tip":"<p>Cần mã hóa S3 KHÔNG tự quản lý khóa NHƯNG có audit trail (ai dùng khóa, khi nào) → SSE-KMS. SSE-S3 không có audit trail riêng; SSE-C/client-side đòi tự cung cấp khóa.</p>"},{"id":60,"topic":"Design Resilient Architectures – RDS Custom for Oracle — truy cập OS/DB host, giảm vận hành","supplement":false,"stem":"A healthcare company uses its on-premises infrastructure to run legacy applications that require specialized customizations to the underlying Oracle database as well as its host operating system (OS). The company also wants to improve the availability of the Oracle database layer. The company has hired you as an AWS Certified Solutions Architect – Associate to build a solution on AWS that meets these requirements while minimizing the underlying infrastructure maintenance effort.<br>Which of the following options represents the best solution for this use case?","options":[{"html":"Leverage multi-AZ configuration of Amazon RDS for Oracle that allows the Database Administrator (DBA) to access and customize the database environment and the underlying operating system","correct":false},{"html":"Leverage cross AZ read-replica configuration of Amazon RDS for Oracle that allows the Database Administrator (DBA) to access and customize the database environment and the underlying operating system","correct":false},{"html":"Leverage multi-AZ configuration of Amazon RDS Custom for Oracle that allows the Database Administrator (DBA) to access and customize the database environment and the underlying operating system","correct":true},{"html":"Deploy the Oracle database layer on multiple Amazon EC2 instances spread across two Availability Zones (AZs). This deployment configuration guarantees high availability and also allows the Database Administrator (DBA) to access and customize the database environment and the underlying operating system","correct":false}],"multi":1,"analysis":"<p>Chọn RDS Custom khi cần vừa TRUY CẬP SÂU vào OS/DB engine, vừa GIẢM vận hành hạ tầng (so với tự host trên EC2)</p>","answer":"<p>RDS Custom for Oracle là lựa chọn DUY NHẤT vừa cho phép DBA truy cập/tùy biến host OS và database engine, vừa cung cấp HA qua multi-AZ với mức vận hành thấp hơn nhiều so với tự quản lý EC2.</p>","explain":"<ul><li><b>A. ✗</b> RDS for Oracle multi-AZ thường: không cho phép DBA truy cập/tùy biến host OS hay database engine ở mức sâu như yêu cầu.</li><li><b>B. ✗</b> Cross-AZ read replica của RDS for Oracle: cũng không cho phép truy cập/tùy biến OS, và read replica không phải giải pháp HA chính cho ghi dữ liệu.</li><li><b>C. ✓</b> RDS Custom for Oracle, cấu hình multi-AZ: cho phép DBA truy cập và tùy biến host OS/database engine (patch đặc thù, cấu hình riêng) trong khi vẫn có HA qua multi-AZ, với overhead vận hành thấp hơn tự quản lý EC2.</li><li><b>D. ✗</b> Tự host Oracle trên EC2, trải nhiều AZ: cho phép tùy biến hoàn toàn nhưng đòi hỏi tự quản lý toàn bộ vòng đời server/database — vi phạm yêu cầu MINIMIZE infrastructure maintenance.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> RDS for Oracle thường (không Custom) nghe như đã đủ &quot;managed và HA&quot; nhưng KHÔNG cho phép truy cập OS — chính điều này là yêu cầu cốt lõi của đề mà dễ bị bỏ qua.</p>","tip":"<p>Cần truy cập/tùy biến OS và database engine bên dưới (ứng dụng legacy đặc thù) nhưng vẫn muốn managed service → RDS Custom (khác RDS thường — không cho truy cập OS).</p>"},{"id":61,"topic":"Design High-Performing Architectures – RDS Proxy (connection pooling) + SQS decoupling cho peak traffic (Select two)","supplement":false,"stem":"A digital event-ticketing platform hosts its core transaction-processing service on AWS. The service runs on Amazon EC2 instances and stores finalized transactions in an Amazon Aurora PostgreSQL database. During periods of high user activity - such as flash ticket sales or holiday promotions - the application begins timing out, causing failed or delayed purchases. A solutions architect has been asked to redesign the backend for scalability and cost-efficiency, without reengineering the database layer.<br>Which combination of actions will meet these goals in the most cost-effective and scalable manner? (Select two)","options":[{"html":"Implement Amazon RDS Proxy between the application and the Aurora PostgreSQL cluster. Deploy EC2 instances in an Auto Scaling group to retry transactions as needed","correct":true},{"html":"Deploy read replicas for the Aurora database in another Region and configure EC2 instances to read and write from the nearest replica based on latency","correct":false},{"html":"Deploy an Amazon API Gateway with throttling and usage plans to slow down incoming purchase requests during peak times and maintain application stability","correct":false},{"html":"Use an Amazon ElastiCache cluster to cache database queries. Configure the application to store purchase transactions in the cache before writing to the database","correct":false},{"html":"Modify the application to publish purchase events to an Amazon SQS queue. Launch an Auto Scaling group of EC2 workers that poll the queue and process purchases asynchronously","correct":true}],"multi":2,"analysis":"<p>Kết hợp connection pooling (RDS Proxy) VÀ decoupling bất đồng bộ (SQS) để xử lý peak traffic mà không cần đổi database engine</p>","answer":"<p>RDS Proxy giảm áp lực kết nối trực tiếp lên Aurora, còn SQS decouple tầng web khỏi tầng xử lý giao dịch để đệm traffic đột biến — cả hai đều scale theo nhu cầu thực tế mà không cần tái kiến trúc database.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: RDS Proxy quản lý connection pooling/reuse giữa ứng dụng và Aurora, giảm áp lực kết nối khi traffic tăng đột biến; kết hợp Auto Scaling group cho tầng ứng dụng.</li><li><b>B. ✗</b> Read replica ở Region khác, đọc/ghi từ bản gần nhất: read replica chỉ phục vụ ĐỌC, không giải quyết được vấn đề timeout khi GHI dữ liệu giao dịch.</li><li><b>C. ✗</b> API Gateway throttling để làm chậm/giảm request: chỉ trì hoãn/từ chối traffic, không tăng khả năng xử lý thực sự, có thể làm trải nghiệm khách hàng tệ hơn trong giờ cao điểm.</li><li><b>D. ✗</b> ElastiCache cache truy vấn + lưu giao dịch vào cache trước khi ghi DB: cache không đảm bảo bền vững cho dữ liệu giao dịch (transactional), rủi ro mất dữ liệu nếu cache node lỗi.</li><li><b>E. ✓</b> Đúng: đẩy sự kiện mua hàng vào SQS queue, dùng EC2 worker trong Auto Scaling group xử lý bất đồng bộ — decouple tầng web khỏi tầng xử lý, đệm được traffic tăng đột biến mà không làm quá tải database.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Read replica nghe như giải pháp scale hợp lý cho database nhưng chỉ xử lý được tải ĐỌC — vấn đề ở đây là timeout khi GHI giao dịch lúc cao điểm, nên read replica không giải quyết đúng gốc rễ.</p>","tip":"<p>Timeout do quá tải kết nối/ghi database lúc cao điểm, không muốn đổi database engine → RDS Proxy (pooling) + SQS (decouple + buffer, xử lý bất đồng bộ).</p>"},{"id":62,"topic":"Design Secure Architectures – AD Connector + IAM Identity Center — SSO xuyên nhiều account","supplement":false,"stem":"A software company has a globally distributed team of developers, that requires secure and compliant access to AWS environments. The company manages multiple AWS accounts under AWS Organizations and uses an on-premises Microsoft Active Directory for user authentication. To simplify access control and identity governance across projects and accounts, the company wants a centrally managed solution that integrates with their existing infrastructure. The solution should require the least amount of ongoing operational management.<br>Which approach best meets the company’s requirements?","options":[{"html":"Deploy AWS Directory Service for Microsoft Active Directory in AWS. Establish a trust relationship with the on-premises Active Directory. Use IAM roles linked to AD groups to control access to AWS resources","correct":false},{"html":"Deploy an open-source identity provider (IdP) on Amazon EC2. Synchronize it with the on-premises Active Directory and use SAML to federate access to AWS accounts. Assign IAM roles to federated users based on SAML assertions","correct":false},{"html":"Use AWS Directory Service AD Connector to connect AWS to the on-premises Active Directory. Integrate AD Connector with AWS IAM Identity Center. Use permission sets to assign access to AWS accounts and resources based on Active Directory group membership","correct":true},{"html":"Use AWS Control Tower to enable account access for developers. Create AWS IAM roles in each member account and manually assign permissions. Instruct developers to assume roles across accounts using the AWS CLI","correct":false}],"multi":1,"analysis":"<p>Dùng AD Connector (proxy, không triển khai AD riêng) + IAM Identity Center (SSO tập trung đa account) để tối thiểu hóa vận hành</p>","answer":"<p>AD Connector đóng vai trò proxy kết nối trực tiếp tới AD on-premises (không cần triển khai/đồng bộ AD riêng trong AWS), kết hợp IAM Identity Center để gán permission set theo AD group — vận hành tập trung, tối thiểu.</p>","explain":"<ul><li><b>A. ✗</b> AWS Managed Microsoft AD + trust relationship với AD on-prem: vẫn phải tự vận hành/giám sát một AD service riêng trong AWS, tăng overhead so với dùng AD Connector làm proxy.</li><li><b>B. ✗</b> Tự deploy IdP mã nguồn mở trên EC2, đồng bộ AD, federate qua SAML: đòi hỏi tự vận hành toàn bộ hạ tầng IdP (patch, scale, HA) — vi phạm yêu cầu &quot;ít vận hành nhất&quot;.</li><li><b>C. ✓</b> AD Connector kết nối AD on-prem + tích hợp IAM Identity Center, dùng permission set theo AD group: AD Connector chỉ là proxy (không cần triển khai AD riêng trong cloud), kết hợp Identity Center cho SSO đa account dựa trên AD group — đúng yêu cầu tập trung, ít vận hành nhất.</li><li><b>D. ✗</b> Control Tower + tạo role thủ công từng account, assume role qua CLI: không có quản lý tập trung, phải cấu hình thủ công từng account — không scale, nhiều vận hành.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> AWS Managed Microsoft AD + trust relationship nghe như giải pháp &quot;đầy đủ tính năng AD&quot; nhưng đòi hỏi vận hành thêm một AD service riêng trong cloud — nhiều overhead hơn mức cần thiết so với AD Connector.</p>","tip":"<p>Chỉ cần AD on-prem làm nguồn xác thực cho SSO đa account, muốn ít vận hành nhất → AD Connector (proxy) + IAM Identity Center. Cần AD thực sự chạy trong AWS (ví dụ cho ứng dụng cần AD) → AWS Managed Microsoft AD.</p>"},{"id":63,"topic":"Design Resilient Architectures – Scheduled Action của Auto Scaling — đặt Desired Capacity (không phải min/max)","supplement":false,"stem":"The payroll department at a company initiates several computationally intensive workloads on Amazon EC2 instances at a designated hour on the last day of every month. The payroll department has noticed a trend of severe performance lag during this hour. The engineering team has figured out a solution by using Auto Scaling Group for these Amazon EC2 instances and making sure that 10 Amazon EC2 instances are available during this peak usage hour. For normal operations only 2 Amazon EC2 instances are enough to cater to the workload.<br>As a solutions architect, which of the following steps would you recommend to implement the solution?","options":[{"html":"Configure your Auto Scaling group by creating a simple tracking policy and setting the instance count to 10 at the designated hour. This causes the scale-out to happen before peak traffic kicks in at the designated hour","correct":false},{"html":"Configure your Auto Scaling group by creating a scheduled action that kicks-off at the designated hour on the last day of the month. Set the min count as well as the max count of instances to 10. This causes the scale-out to happen before peak traffic kicks in at the designated hour","correct":false},{"html":"Configure your Auto Scaling group by creating a target tracking policy and setting the instance count to 10 at the designated hour. This causes the scale-out to happen before peak traffic kicks in at the designated hour","correct":false},{"html":"Configure your Auto Scaling group by creating a scheduled action that kicks-off at the designated hour on the last day of the month. Set the desired capacity of instances to 10. This causes the scale-out to happen before peak traffic kicks in at the designated hour","correct":true}],"multi":1,"analysis":"<p>Dùng Scheduled Action với DESIRED CAPACITY khi biết chính xác số instance cần tại một thời điểm định trước</p>","answer":"<p>Scheduled action cho phép đặt lịch chính xác (ngày/giờ) để thay đổi min/max/desired capacity; khi chỉ cần một con số cụ thể (10 instance), chỉ cần set desired capacity, không cần ràng buộc thêm min/max.</p>","explain":"<ul><li><b>A. ✗</b> Simple tracking policy đặt instance count = 10 tại giờ cố định: không có khái niệm &quot;simple tracking policy&quot; theo kiểu đặt số lượng tại một giờ cụ thể — sai cơ chế.</li><li><b>B. ✗</b> Scheduled action, đặt CẢ min VÀ max = 10: chỉ cần set một số lượng cố định (desired capacity) là đủ; đặt min=max=10 không sai về mặt chức năng nhưng không phải cách làm chuẩn khi chỉ cần một con số cụ thể — đáp án đúng dùng desired capacity trực tiếp.</li><li><b>C. ✗</b> Target tracking policy đặt instance count = 10 tại giờ cố định: target tracking không hoạt động theo kiểu &quot;đặt số lượng tại một thời điểm&quot; — nó theo dõi metric liên tục, không theo lịch.</li><li><b>D. ✓</b> Scheduled action, đặt DESIRED CAPACITY = 10 tại giờ cố định: đúng cơ chế chuẩn — scheduled action set min/max/desired theo lịch, và chỉ cần set desired capacity khi muốn đúng 1 con số cụ thể tại thời điểm đó.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đặt cả min VÀ max = 10 nghe như cách làm &quot;chắc chắn&quot; hơn nhưng không cần thiết — chỉ nên dùng min/max khi muốn một DẢI số lượng linh hoạt, còn ở đây cần đúng 1 con số cố định (desired capacity).</p>","tip":"<p>Biết trước thời điểm VÀ số lượng instance cụ thể cần có → Scheduled Action + đặt Desired Capacity. Chỉ dùng min/max khi muốn một khoảng linh hoạt, không phải một con số cố định.</p>"},{"id":64,"topic":"Design Resilient Architectures – ALB + Auto Scaling group — content-based routing + HA","supplement":false,"stem":"An e-commerce company is looking for a solution with high availability, as it plans to migrate its flagship application to a fleet of Amazon Elastic Compute Cloud (Amazon EC2) instances. The solution should allow for content-based routing as part of the architecture.<br>As a Solutions Architect, which of the following will you suggest for the company?","options":[{"html":"Use an Auto Scaling group for distributing traffic to the Amazon EC2 instances spread across different Availability Zones (AZs). Configure a Public IP address to mask any failure of an instance","correct":false},{"html":"Use a Network Load Balancer for distributing traffic to the Amazon EC2 instances spread across different Availability Zones (AZs). Configure a Private IP address to mask any failure of an instance","correct":false},{"html":"Use an Application Load Balancer for distributing traffic to the Amazon EC2 instances spread across different Availability Zones (AZs). Configure Auto Scaling group to mask any failure of an instance","correct":true},{"html":"Use an Auto Scaling group for distributing traffic to the Amazon EC2 instances spread across different Availability Zones (AZs). Configure an elastic IP address (EIP) to mask any failure of an instance","correct":false}],"multi":1,"analysis":"<p>Phân vai đúng: Load Balancer (routing theo nội dung) xử lý traffic, Auto Scaling Group xử lý khả dụng/thay thế instance lỗi</p>","answer":"<p>Yêu cầu content-based routing chỉ Application Load Balancer (Layer 7) đáp ứng được, trong khi Auto Scaling Group đảm nhiệm việc tự động thay thế instance lỗi để duy trì khả dụng — đúng vai trò của từng dịch vụ.</p>","explain":"<ul><li><b>A. ✗</b> ASG phân phối traffic + Public IP để che giấu lỗi instance: ASG không có chức năng phân phối traffic (đó là việc của load balancer); Public IP không giúp che giấu lỗi instance.</li><li><b>B. ✗</b> NLB phân phối traffic + Private IP che giấu lỗi instance: NLB hoạt động ở Layer 4, không hỗ trợ content-based routing (định tuyến theo nội dung request) như yêu cầu đề.</li><li><b>C. ✓</b> ALB phân phối traffic (hỗ trợ content-based routing ở Layer 7) + ASG che giấu lỗi instance (tự thay thế instance hỏng): đúng vai trò từng thành phần — ALB định tuyến theo nội dung, ASG đảm bảo khả dụng.</li><li><b>D. ✗</b> ASG phân phối traffic + Elastic IP che giấu lỗi instance: cùng lỗi ASG không phân phối traffic; EIP dùng để remap sang instance khác chứ không phải cơ chế ASG dùng để che giấu lỗi theo cách chuẩn.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các đáp án gán nhầm vai trò &quot;phân phối traffic&quot; cho Auto Scaling Group (ASG không làm việc này) — ASG chỉ quản lý số lượng/thay thế instance, không định tuyến traffic.</p>","tip":"<p>Phân phối traffic (bao gồm content-based routing) luôn là việc của Load Balancer (ALB cho Layer 7, NLB cho Layer 4) — Auto Scaling Group chỉ quản lý vòng đời/khả dụng của instance, không bao giờ tự phân phối traffic.</p>"},{"id":65,"topic":"Design Cost-Optimized Architectures – S3 Standard-IA — truy cập hiếm, cần latency ms, có failover/retry","supplement":false,"stem":"An audit department generates and accesses the audit reports only twice in a financial year. The department uses AWS Step Functions to orchestrate the report creating process that has failover and retry scenarios built into the solution. The underlying data to create these audit reports is stored on Amazon S3, runs into hundreds of Terabytes and should be available with millisecond latency.<br>As an AWS Certified Solutions Architect – Associate, which is the MOST cost-effective storage class that you would recommend to be used for this use-case?","options":[{"html":"Amazon S3 Intelligent-Tiering (S3 Intelligent-Tiering)","correct":false},{"html":"Amazon S3 Standard-Infrequent Access (S3 Standard-IA)","correct":true},{"html":"Amazon S3 Glacier Deep Archive","correct":false},{"html":"Amazon S3 Standard","correct":false}],"multi":1,"analysis":"<p>Khi đã có cơ chế retry/failover sẵn trong workflow, chấp nhận độ khả dụng 99.9% của IA để tối ưu chi phí lưu trữ lớn (hàng trăm TB)</p>","answer":"<p>S3 Standard-IA đáp ứng đúng yêu cầu latency ms với chi phí lưu trữ thấp hơn Standard, và vì Step Functions đã có failover/retry sẵn, độ khả dụng 99.9% (thấp hơn Standard một chút) không phải vấn đề.</p>","explain":"<ul><li><b>A. ✗</b> S3 Intelligent-Tiering: cùng độ bền/throughput/latency như Standard-IA nhưng tốn thêm phí giám sát hàng tháng — không cần thiết khi đã biết trước tần suất truy cập thấp (2 lần/năm).</li><li><b>B. ✓</b> S3 Standard-IA: đúng — truy cập ms, chi phí lưu trữ thấp, phù hợp dữ liệu hiếm khi truy cập (2 lần/năm); độ khả dụng 99.9% chấp nhận được nhờ có failover/retry sẵn trong Step Functions.</li><li><b>C. ✗</b> S3 Glacier Deep Archive: không hỗ trợ truy cập millisecond (mất 12-48 giờ để retrieve) — không đáp ứng yêu cầu latency.</li><li><b>D. ✗</b> S3 Standard: có cùng latency/độ bền nhưng chi phí lưu trữ cao hơn Standard-IA không cần thiết, khi dữ liệu hiếm khi truy cập.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Intelligent-Tiering nghe như lựa chọn &quot;an toàn, tự động tối ưu&quot; nhưng khi đã BIẾT TRƯỚC tần suất truy cập cực thấp (2 lần/năm), trả thêm phí giám sát hàng tháng của Intelligent-Tiering là không cần thiết.</p>","tip":"<p>Biết trước dữ liệu truy cập RẤT HIẾM (vài lần/năm) + cần latency ms + có sẵn cơ chế retry cho lỗi availability → S3 Standard-IA, rẻ hơn Intelligent-Tiering/Standard mà vẫn đủ đáp ứng.</p>"}];
const LETTERS = "ABCDEFGH";
const state = {
  order: Q.map((_, i) => i),
  pos: 0,
  sel: {},        // qid -> Set of original option idx
  done: {},       // qid -> true/false (correct?)
  flags: new Set(),
  perm: {},       // qid -> displayed order of original option indices
  hint: {},
  view: "quiz"
};
const $ = s => document.querySelector(s);

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function perm(q){
  if(!state.perm[q.id]) state.perm[q.id] = $("#optShuffleA").checked ? shuffle(q.options.map((_,i)=>i)) : q.options.map((_,i)=>i);
  return state.perm[q.id];
}
function visible(){
  const f = $("#fFilter").value, t = $("#fTopic").value;
  return state.order.filter(i => {
    const q = Q[i];
    if(t && topicGroup(q.topic) !== t) return false;
    if(f === "todo") return !(q.id in state.done);
    if(f === "bad") return state.done[q.id] === false;
    if(f === "flag") return state.flags.has(q.id);
    if(f === "sup") return q.supplement;
    return true;
  });
}
function topicGroup(t){ return t.split("–")[0].trim(); }

function renderStats(){
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length, bad = vals.length - ok;
  $("#sDone").textContent = `${vals.length}/${Q.length}`;
  $("#sOk").textContent = ok; $("#sBad").textContent = bad;
  $("#sPct").textContent = vals.length ? Math.round(ok*100/vals.length) + "%" : "–";
  $("#prog").style.width = (vals.length*100/Q.length) + "%";
}
function renderGrid(){
  const vis = new Set(visible());
  const cur = state.order[state.pos];
  const g = $("#grid"); g.innerHTML = "";
  Q.forEach((q, i) => {
    const b = document.createElement("button");
    b.className = "cell";
    if(q.id in state.done) b.classList.add(state.done[q.id] ? "ok" : "bad");
    if(state.flags.has(q.id)) b.classList.add("flag");
    if(q.supplement) b.classList.add("sup");
    if(i === cur && state.view === "quiz") b.classList.add("cur");
    if(!vis.has(i)) b.classList.add("dim");
    b.textContent = q.id;
    b.title = q.topic + (q.supplement ? " (câu bổ sung)" : "");
    b.onclick = () => { state.view = "quiz"; state.pos = state.order.indexOf(i); render(); window.scrollTo({top:0,behavior:"smooth"}); };
    g.appendChild(b);
  });
}

function section(cls, title, html, open){
  return `<details class="sec ${cls}" ${open?"open":""}><summary>${title}</summary><div class="body">${html}</div></details>`;
}

function renderQuiz(){
  const main = $("#main");
  const vis = visible();
  if(!vis.length){ main.innerHTML = `<div class="card empty">Không có câu nào khớp bộ lọc hiện tại.</div>`; return; }
  let idx = state.order[state.pos];
  if(!vis.includes(idx)){ idx = vis[0]; state.pos = state.order.indexOf(idx); }
  const q = Q[idx];
  const answered = q.id in state.done;
  const sel = state.sel[q.id] || new Set();
  const p = perm(q);
  const vpos = vis.indexOf(idx);

  let opts = p.map((oi, k) => {
    const o = q.options[oi];
    let cls = "opt" + (q.multi > 1 ? " multi" : "");
    let tag = "";
    if(answered){
      if(o.correct && sel.has(oi)){ cls += " right"; tag = "✓ Đúng"; }
      else if(!o.correct && sel.has(oi)){ cls += " wrong"; tag = "✗ Bạn chọn"; }
      else if(o.correct){ cls += " right missed"; tag = "✓ Đáp án đúng"; }
    } else if(sel.has(oi)) cls += " sel";
    return `<div class="${cls}" data-oi="${oi}" role="${q.multi>1?"checkbox":"radio"}" aria-checked="${sel.has(oi)}" tabindex="0">
      <span class="key">${LETTERS[k]}</span><span class="txt">${o.html}${tag?`<span class="tag">${tag}</span>`:""}</span></div>`;
  }).join("");

  const showExplain = answered && $("#optAuto").checked;
  let after = "";
  if(answered){
    const ok = state.done[q.id];
    after += `<div class="verdict ${ok?"ok":"bad"}">${ok ? "Chính xác!" :"Chưa đúng. Xem đáp án được đánh dấu xanh và phần giải thích bên dưới."}</div>`;
    after += section("s-analysis", "Phân tích đề", q.analysis, showExplain);
    after += section("s-answer", "Đáp án đúng", q.answer, showExplain);
    after += section("s-explain", "Giải thích", q.explain, showExplain);
    after += section("s-wrong", "Vì sao các đáp án khác sai", q.wrong, showExplain);
    after += section("s-tip", "Mẹo thi", q.tip, showExplain);
  } else if(state.hint[q.id]){
    after += `<div class="hint"><h3>Gợi ý · Phân tích đề</h3><div class="body">${q.analysis}</div></div>`;
  }

  const need = q.multi > 1 ? `Chọn ${q.multi} đáp án` : "Chọn 1 đáp án";
  main.innerHTML = `<div class="card ${answered?"locked":""}">
    <div class="qhead">
      <span class="qnum">Câu ${q.id}</span>
      <span class="chip">${q.topic}</span>
      ${q.supplement ? `<span class="chip sup">Câu bổ sung</span>` : ""}
      <span class="chip multi">${need}</span>
      <button class="flagbtn ${state.flags.has(q.id)?"on":""}" id="btnFlag">${state.flags.has(q.id)?"★ Đã đánh dấu":"☆ Đánh dấu"}</button>
    </div>
    <div class="stem">${q.stem}</div>
    <div class="opts">${opts}</div>
    <div class="actions">
      <button class="btn" id="btnPrev" ${vpos<=0?"disabled":""}>← Câu trước</button>
      ${!answered ? `<button class="btn ghost" id="btnHint">${state.hint[q.id]?"Ẩn gợi ý":"Gợi ý: phân tích đề"}</button>` : `<button class="btn ghost" id="btnRetry">Làm lại câu này</button>`}
      <span class="spacer"></span>
      ${!answered ? `<button class="btn primary" id="btnCheck" ${sel.size!==q.multi?"disabled":""}>Kiểm tra</button>` : ""}
      <button class="btn ${answered?"primary":""}" id="btnNext" ${vpos>=vis.length-1?"disabled":""}>Câu sau →</button>
    </div>
    ${after}
    <div class="kbd"><kbd>A</kbd>–<kbd>E</kbd> hoặc <kbd>1</kbd>–<kbd>5</kbd> chọn đáp án · <kbd>Enter</kbd> kiểm tra / sang câu sau · <kbd>←</kbd> <kbd>→</kbd> chuyển câu · <kbd>H</kbd> gợi ý</div>
  </div>`;

  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => toggle(q, +el.dataset.oi);
    el.onkeydown = e => { if(e.key===" "){ e.preventDefault(); toggle(q, +el.dataset.oi); } };
  });
  $("#btnFlag").onclick = () => { state.flags.has(q.id) ? state.flags.delete(q.id) : state.flags.add(q.id); render(); };
  $("#btnPrev").onclick = () => go(-1);
  $("#btnNext").onclick = () => go(1);
  if($("#btnCheck")) $("#btnCheck").onclick = () => check(q);
  if($("#btnHint")) $("#btnHint").onclick = () => { state.hint[q.id] = !state.hint[q.id]; render(); };
  if($("#btnRetry")) $("#btnRetry").onclick = () => { delete state.done[q.id]; state.sel[q.id] = new Set(); delete state.perm[q.id]; render(); };
}

function toggle(q, oi){
  if(q.id in state.done) return;
  const s = state.sel[q.id] || (state.sel[q.id] = new Set());
  if(q.multi === 1){ s.clear(); s.add(oi); }
  else if(s.has(oi)) s.delete(oi);
  else { if(s.size >= q.multi) return; s.add(oi); }
  render();
}
function check(q){
  const s = state.sel[q.id] || new Set();
  if(s.size !== q.multi) return;
  const correct = q.options.every((o, i) => o.correct === s.has(i));
  state.done[q.id] = correct;
  render();
}
function go(d){
  const vis = visible();
  const cur = state.order[state.pos];
  let vp = vis.indexOf(cur);
  vp = Math.max(0, Math.min(vis.length-1, vp + d));
  state.pos = state.order.indexOf(vis[vp]);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderSummary(){
  const groups = {};
  Q.forEach(q => {
    const g = topicGroup(q.topic);
    groups[g] = groups[g] || {n:0, done:0, ok:0, bad:[]};
    groups[g].n++;
    if(q.id in state.done){ groups[g].done++; if(state.done[q.id]) groups[g].ok++; else groups[g].bad.push(q.id); }
  });
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length;
  const wrongIds = Q.filter(q => state.done[q.id] === false).map(q => q.id);
  const rows = Object.entries(groups).sort((a,b)=>b[1].n-a[1].n).map(([g, v]) => {
    const pct = v.done ? Math.round(v.ok*100/v.done) : null;
    return `<tr><td>${g}</td><td class="n">${v.done}/${v.n}</td><td class="n">${pct===null?"–":pct+"%"}</td>
      <td><div class="bar"><i style="width:${pct||0}%"></i></div></td><td>${v.bad.map(id=>`<a href="#" data-q="${id}">${id}</a>`).join(", ")}</td></tr>`;
  }).join("");
  $("#main").innerHTML = `<div class="card summary">
    <h2>Kết quả</h2>
    <p>Đã làm <b>${vals.length}/${Q.length}</b> câu · Đúng <b>${ok}</b> · Sai <b>${vals.length-ok}</b>${vals.length?` · Tỷ lệ đúng <b>${Math.round(ok*100/vals.length)}%</b>`:""}.
    ${vals.length===Q.length ? (ok/Q.length>=0.72 ? " Mức này tương đương ngưỡng đậu (~720/1000)." : " Chưa đạt ngưỡng ~72%, nên ôn lại các câu sai.") : ""}</p>
    ${wrongIds.length ? `<p><button class="btn primary" id="btnReviewBad">Ôn lại ${wrongIds.length} câu sai</button></p>` : ""}
    <table><thead><tr><th>Chủ đề</th><th class="n">Đã làm</th><th class="n">Đúng</th><th></th><th>Câu sai</th></tr></thead><tbody>${rows}</tbody></table>
    <p style="margin-top:14px"><button class="btn" id="btnBack">← Quay lại làm bài</button></p>
  </div>`;
  $("#btnBack").onclick = () => { state.view = "quiz"; render(); };
  if($("#btnReviewBad")) $("#btnReviewBad").onclick = () => {
    $("#fFilter").value = "bad"; $("#fTopic").value = "";
    wrongIds.forEach(id => { delete state.done[id]; state.sel[id] = new Set(); delete state.perm[id]; });
    // keep them findable after reset: mark as flagged review set
    wrongIds.forEach(id => state.flags.add(id));
    $("#fFilter").value = "flag";
    state.view = "quiz"; state.pos = state.order.indexOf(Q.findIndex(q => q.id === wrongIds[0])); render();
  };
  $("#main").querySelectorAll("a[data-q]").forEach(a => a.onclick = e => {
    e.preventDefault(); state.view = "quiz"; $("#fFilter").value = "all"; $("#fTopic").value = "";
    state.pos = state.order.indexOf(Q.findIndex(q => q.id === +a.dataset.q)); render();
  });
}

function render(){
  renderStats(); renderGrid();
  state.view === "summary" ? renderSummary() : renderQuiz();
}

// init
(function(){
  const groups = [...new Set(Q.map(q => topicGroup(q.topic)))].sort();
  groups.forEach(g => { const o = document.createElement("option"); o.value = g; o.textContent = g; $("#fTopic").appendChild(o); });
  $("#fFilter").onchange = $("#fTopic").onchange = () => { state.view = "quiz"; render(); };
  $("#optShuffleQ").onchange = e => {
    const cur = state.order[state.pos];
    state.order = e.target.checked ? shuffle(Q.map((_, i) => i)) : Q.map((_, i) => i);
    state.pos = e.target.checked ? 0 : state.order.indexOf(cur);
    render();
  };
  $("#optShuffleA").onchange = () => { Q.forEach(q => { if(!(q.id in state.done)) delete state.perm[q.id]; }); render(); };
  $("#optAuto").onchange = render;
  $("#btnSummary").onclick = () => { state.view = "summary"; render(); };
  $("#btnReset").onclick = () => {
    if(!Object.keys(state.done).length) return;
    state.sel = {}; state.done = {}; state.hint = {}; state.perm = {}; state.pos = 0; state.view = "quiz";
    $("#fFilter").value = "all"; render();
  };
  $("#btnTheme").onclick = () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  };
  document.addEventListener("keydown", e => {
    if(state.view !== "quiz" || e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    const q = Q[state.order[state.pos]]; if(!q) return;
    const k = e.key.toUpperCase();
    let n = "12345678".indexOf(k); if(n < 0) n = LETTERS.indexOf(k);
    if(k.length === 1 && n >= 0 && n < q.options.length && k !== "H"){ toggle(q, perm(q)[n]); return; }
    if(e.key === "Enter"){ e.preventDefault(); (q.id in state.done) ? go(1) : check(q); }
    else if(e.key === "ArrowRight") go(1);
    else if(e.key === "ArrowLeft") go(-1);
    else if(k === "H" && !(q.id in state.done)){ state.hint[q.id] = !state.hint[q.id]; render(); }
  });
  render();
})();
</script>
</body>
