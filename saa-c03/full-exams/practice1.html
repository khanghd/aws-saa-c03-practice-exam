iên: vi phạm nguyên tắc không chia sẻ credential cá nhân.</li><li><b>E. ✗</b> Cấp quyền tối đa để khỏi phải cấp lại: ngược hoàn toàn với nguyên tắc least privilege.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> &quot;Cấp quyền tối đa để đỡ phải cấp lại&quot; nghe như một cách tối ưu vận hành nhưng vi phạm trực tiếp nguyên tắc least privilege — luôn là đáp án sai trong các câu IAM.</p>","tip":"<p>IAM best practice cốt lõi: MFA cho privileged user, CloudTrail log mọi hành động, dùng role (không dùng user credentials) cho EC2/service, không chia sẻ credential, luôn least privilege.</p>"},{"id":26,"topic":"Design Cost-Optimized Architectures – Tăng tốc upload S3 từ xa — chi phí tối ưu (Select two)","supplement":false,"stem":"A news network uses Amazon Simple Storage Service (Amazon S3) to aggregate the raw video footage from its reporting teams across the US. The news network has recently expanded into new geographies in Europe and Asia. The technical teams at the overseas branch offices have reported huge delays in uploading large video files to the destination Amazon S3 bucket.<br>Which of the following are the MOST cost-effective options to improve the file upload speed into Amazon S3 (Select two)","options":[{"html":"Create multiple AWS Site-to-Site VPN connections between the AWS Cloud and branch offices in Europe and Asia. Use these VPN connections for faster file uploads into Amazon S3","correct":false},{"html":"Create multiple AWS Direct Connect connections between the AWS Cloud and branch offices in Europe and Asia. Use the direct connect connections for faster file uploads into Amazon S3","correct":false},{"html":"Use AWS Global Accelerator for faster file uploads into the destination Amazon S3 bucket","correct":false},{"html":"Use multipart uploads for faster file uploads into the destination Amazon S3 bucket","correct":true},{"html":"Use Amazon S3 Transfer Acceleration (Amazon S3TA) to enable faster file uploads into the destination S3 bucket","correct":true}],"multi":2,"analysis":"<p>Phân biệt dịch vụ tăng tốc TRUYỀN DỮ LIỆU vào S3 với dịch vụ tăng tốc MẠNG/ỨNG DỤNG nói chung</p>","answer":"<p>Multipart upload và S3 Transfer Acceleration là hai cơ chế được thiết kế riêng để tăng tốc độ truyền file vào S3 qua khoảng cách xa, với chi phí thấp hơn nhiều so với VPN/Direct Connect.</p>","explain":"<ul><li><b>A. ✗</b> Site-to-Site VPN: dùng IPSec qua internet, không tăng tốc upload, chỉ phù hợp kết nối bảo mật băng thông thấp-trung bình.</li><li><b>B. ✗</b> Direct Connect: mất nhiều tháng để thiết lập, chi phí cao, quá mức cần thiết chỉ để tăng tốc upload file.</li><li><b>C. ✗</b> AWS Global Accelerator: cải thiện hiệu năng cho endpoint dạng ALB/NLB/EC2, không giúp tăng tốc upload trực tiếp vào S3.</li><li><b>D. ✓</b> Đúng: Multipart upload giúp upload song song, tăng throughput — đặc biệt hiệu quả với object &gt;100MB.</li><li><b>E. ✓</b> Đúng: S3 Transfer Acceleration tận dụng mạng edge CloudFront để tối ưu đường truyền dài, giúp upload nhanh hơn với chi phí hợp lý.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Global Accelerator và Direct Connect nghe như giải pháp &quot;tăng tốc mạng&quot; hợp lý nhưng không nhắm đúng vào việc tăng tốc upload file vào S3, lại tốn kém và mất thời gian triển khai hơn.</p>","tip":"<p>Tăng tốc truyền file vào S3 cụ thể → Multipart upload (file lớn) + S3 Transfer Acceleration (khoảng cách xa). Không phải VPN/Direct Connect/Global Accelerator.</p>"},{"id":27,"topic":"Design Secure Architectures – S3 Object Lock retention period rules (Select two)","supplement":false,"stem":"A company uses Amazon S3 buckets for storing sensitive customer data. The company has defined different retention periods for different objects present in the Amazon S3 buckets, based on the compliance requirements. But, the retention rules do not seem to work as expected.<br>Which of the following options represent a valid configuration for setting up retention periods for objects in Amazon S3 buckets? (Select two)","options":[{"html":"Different versions of a single object can have different retention modes and periods","correct":true},{"html":"The bucket default settings will override any explicit retention mode or period you request on an object version","correct":false},{"html":"When you apply a retention period to an object version explicitly, you specify a Retain Until Date for the object version","correct":true},{"html":"You cannot place a retention period on an object version through a bucket default setting","correct":false},{"html":"When you use bucket default settings, you specify a Retain Until Date for the object version","correct":false}],"multi":2,"analysis":"<p>Phân biệt cấu hình Object Lock tường minh (per-version, Retain Until Date) với cấu hình mặc định (duration áp cho cả bucket)</p>","answer":"<p>Retention áp dụng theo từng version độc lập, và khi đặt tường minh bạn chỉ định ngày cụ thể (Retain Until Date) — khác với bucket default chỉ định khoảng thời gian (duration).</p>","explain":"<ul><li><b>A. ✓</b> Đúng: mỗi phiên bản (version) của một object có thể có retention mode/period riêng biệt, độc lập với các version khác.</li><li><b>B. ✗</b> Sai: cấu hình mặc định của bucket KHÔNG ghi đè retention tường minh đã đặt cho object version — ngược lại, retention tường minh mới ghi đè mặc định.</li><li><b>C. ✓</b> Đúng: khi đặt retention tường minh (explicit) cho 1 object version, bạn chỉ định một Retain Until Date cụ thể cho version đó.</li><li><b>D. ✗</b> Sai: bạn HOÀN TOÀN có thể đặt retention qua bucket default setting, không chỉ qua cách tường minh.</li><li><b>E. ✗</b> Sai: bucket default setting chỉ định một DURATION (số ngày/năm), không chỉ định Retain Until Date trực tiếp.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các đáp án sai đều đảo ngược logic ưu tiên (default ghi đè explicit) hoặc đảo ngược cách chỉ định giá trị (ngày cụ thể vs khoảng thời gian) — rất dễ nhầm nếu không nhớ chi tiết.</p>","tip":"<p>Explicit retention trên 1 version → chỉ định NGÀY cụ thể (Retain Until Date) và LUÔN thắng cấu hình mặc định. Bucket default → chỉ định KHOẢNG THỜI GIAN áp dụng cho mọi version mới.</p>"},{"id":28,"topic":"Design Resilient Architectures – Bảo trì EC2 trong ASG mà không bị thay thế (Select two)","supplement":false,"stem":"The DevOps team at an e-commerce company wants to perform some maintenance work on a specific Amazon EC2 instance that is part of an Auto Scaling group using a step scaling policy. The team is facing a maintenance challenge - every time the team deploys a maintenance patch, the instance health check status shows as out of service for a few minutes. This causes the Auto Scaling group to provision another replacement instance immediately.<br>As a solutions architect, which are the MOST time/resource efficient steps that you would recommend so that the maintenance work can be completed at the earliest? (Select two)","options":[{"html":"Suspend the ScheduledActions process type for the Auto Scaling group and apply the maintenance patch to the instance. Once the instance is ready, you can you can manually set the instance's health status back to healthy and activate the ScheduledActions process type again","correct":false},{"html":"Put the instance into the Standby state and then update the instance by applying the maintenance patch. Once the instance is ready, you can exit the Standby state and then return the instance to service","correct":true},{"html":"Take a snapshot of the instance, create a new Amazon Machine Image (AMI) and then launch a new instance using this AMI. Apply the maintenance patch to this new instance and then add it back to the Auto Scaling Group by using the manual scaling policy. Terminate the earlier instance that had the maintenance issue","correct":false},{"html":"Delete the Auto Scaling group and apply the maintenance fix to the given instance. Create a new Auto Scaling group and add all the instances again using the manual scaling policy","correct":false},{"html":"Suspend the ReplaceUnhealthy process type for the Auto Scaling group and apply the maintenance patch to the instance. Once the instance is ready, you can manually set the instance's health status back to healthy and activate the ReplaceUnhealthy process type again","correct":true}],"multi":2,"analysis":"<p>Chọn đúng cơ chế TẠM NGỪNG hành vi tự động của ASG phù hợp với tình huống (Standby cho từng instance, suspend ReplaceUnhealthy cho cả nhóm)</p>","answer":"<p>Standby state và suspend ReplaceUnhealthy đều cho phép giữ instance trong ASG mà không bị terminate/replace trong lúc health check tạm thời báo lỗi khi bảo trì.</p>","explain":"<ul><li><b>A. ✗</b> Suspend ScheduledActions: chỉ ảnh hưởng tới các scaling action được lên lịch theo thời gian, không liên quan tới việc instance bị đánh unhealthy khi bảo trì.</li><li><b>B. ✓</b> Đúng: đưa instance vào trạng thái Standby, bảo trì xong rồi đưa trở lại InService — instance vẫn thuộc ASG nhưng không nhận traffic trong lúc bảo trì.</li><li><b>C. ✗</b> Tạo AMI mới, launch instance mới, apply patch, thêm lại vào ASG bằng manual scaling, terminate instance cũ: tốn nhiều thời gian/tài nguyên hơn mức cần thiết cho một bản vá đơn giản.</li><li><b>D. ✗</b> Xóa cả ASG rồi tạo lại: quá mức cần thiết và rủi ro cao chỉ để bảo trì 1 instance.</li><li><b>E. ✓</b> Đúng: suspend ReplaceUnhealthy, bảo trì xong set lại health status rồi resume process — ASG tạm ngừng tự động thay thế instance trong lúc health check báo unhealthy.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Suspend ScheduledActions nghe như một cách &quot;tạm dừng ASG&quot; hợp lý nhưng thực chất chỉ ảnh hưởng tới lịch scaling theo thời gian, không liên quan tới health check unhealthy.</p>","tip":"<p>Bảo trì 1 instance tạm thời mà không bị ASG thay thế: đưa vào Standby, hoặc suspend process ReplaceUnhealthy — không cần xóa AMI/ASG mới.</p>"},{"id":29,"topic":"Design Resilient Architectures – AWS Glue DataBrew — no-code data prep","supplement":false,"stem":"A healthcare analytics company centralizes clinical and operational datasets in an Amazon S3–based data lake. Incoming data is ingested in Apache Parquet format from multiple hospitals and wearable health devices. To ensure quality and standardization, the company applies several transformation steps: anomaly filtering, datetime normalization, and aggregation by patient cohort. The company needs a solution to support a code-free interface that enables data engineers and business analysts to collaborate on data preparation workflows. The company also requires data lineage tracking, data profiling capabilities, and an easy way to share transformation logic across teams without writing or managing code.<br>Which AWS solution best meets these requirements?","options":[{"html":"Use Amazon AppFlow to move and transform Parquet files in S3. Configure AppFlow transformations and mappings within the visual interface. Share flows with collaborators through AWS IAM policies and scheduled executions","correct":false},{"html":"Use AWS Glue Studio’s visual canvas to design data transformation workflows on top of the Parquet files in Amazon S3. Configure Glue Studio jobs to run these transformations without writing code. Share the job definitions with team members for reuse. Use the visual job editor to track transformation progress and inspect profiling statistics for each dataset column","correct":false},{"html":"Use AWS Glue DataBrew to visually build transformation workflows on top of the raw Parquet files in S3. Use DataBrew recipes to track, audit, and share the transformation steps with others. Enable data profiling to inspect column statistics, null values, and data types across datasets","correct":true},{"html":"Create Amazon Athena SQL queries to perform transformation steps directly on S3. Store queries in AWS Glue Data Catalog and share saved queries with other users through Amazon Athena's query editor","correct":false}],"multi":1,"analysis":"<p>Chọn đúng công cụ code-free CÓ data profiling + lineage + chia sẻ recipe tái sử dụng</p>","answer":"<p>DataBrew là công cụ duy nhất vừa code-free, vừa có recipe tái sử dụng/chia sẻ (đáp ứng lineage/audit), vừa có data profiling tích hợp sẵn.</p>","explain":"<ul><li><b>A. ✗</b> Amazon AppFlow: dùng để di chuyển/transform dữ liệu giữa SaaS và AWS, không phù hợp transform dữ liệu lớn đã có sẵn trong S3, thiếu data profiling/lineage.</li><li><b>B. ✗</b> AWS Glue Studio: vẫn sinh ra Spark script, hướng tới developer/data engineer, không có data profiling tích hợp sẵn như DataBrew, kém phù hợp cho người dùng không chuyên code.</li><li><b>C. ✓</b> AWS Glue DataBrew: giao diện kéo-thả thuần code-free, có &quot;recipe&quot; tái sử dụng/chia sẻ được (đáp ứng lineage/audit), có data profiling tích hợp (null, outlier, cardinality) — đúng mọi yêu cầu đề.</li><li><b>D. ✗</b> Athena SQL + Glue Data Catalog: đòi hỏi kỹ năng SQL, không có giao diện visual, không có data profiling/lineage tích hợp.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> AWS Glue Studio nghe tương tự (cũng &quot;visual&quot;, &quot;low-code&quot;) nhưng vẫn ngầm sinh Spark script và thiếu tính năng profiling — không đáp ứng đủ các ràng buộc đề đưa ra.</p>","tip":"<p>Cần giao diện kéo-thả, không code, có data profiling + chia sẻ recipe → AWS Glue DataBrew. Cần pipeline ETL phức tạp hơn, chấp nhận chạm code → AWS Glue Studio/Jobs.</p>"},{"id":30,"topic":"Design Cost-Optimized Architectures – So sánh chi phí lưu trữ: S3 Standard < EFS < EBS","supplement":false,"stem":"A technology blogger wants to write a review on the comparative pricing for various storage types available on AWS Cloud. The blogger has created a test file of size 1 gigabytes with some random data. Next he copies this test file into AWS S3 Standard storage class, provisions an Amazon EBS volume (General Purpose SSD (gp2)) with 100 gigabytes of provisioned storage and copies the test file into the Amazon EBS volume, and lastly copies the test file into an Amazon EFS Standard Storage filesystem. At the end of the month, he analyses the bill for costs incurred on the respective storage types for the test file.<br>What is the correct order of the storage charges incurred for the test file on these three storage types?","options":[{"html":"Cost of test file storage on Amazon EFS &lt; Cost of test file storage on Amazon S3 Standard &lt; Cost of test file storage on Amazon EBS","correct":false},{"html":"Cost of test file storage on Amazon S3 Standard &lt; Cost of test file storage on Amazon EBS &lt; Cost of test file storage on Amazon EFS","correct":false},{"html":"Cost of test file storage on Amazon S3 Standard &lt; Cost of test file storage on Amazon EFS &lt; Cost of test file storage on Amazon EBS","correct":true},{"html":"Cost of test file storage on Amazon EBS &lt; Cost of test file storage on Amazon S3 Standard &lt; Cost of test file storage on Amazon EFS","correct":false}],"multi":1,"analysis":"<p>So sánh chi phí lưu trữ theo đúng đơn giá VÀ cách tính dung lượng (thực dùng vs provisioned)</p>","answer":"<p>S3 tính theo GB thực dùng với đơn giá thấp nhất; EFS cũng theo GB thực dùng nhưng đơn giá cao hơn; EBS tính theo dung lượng PROVISION (100GB) bất kể dùng bao nhiêu, nên tổng chi phí cao nhất dù đơn giá/GB thấp hơn EFS.</p>","explain":"<ul><li><b>A. ✗</b> EFS &lt; S3 &lt; EBS: sai thứ tự — S3 Standard luôn rẻ nhất trong 3 loại cho cùng dung lượng thực tế dùng.</li><li><b>B. ✗</b> S3 &lt; EBS &lt; EFS: sai vì EBS tính phí theo dung lượng PROVISION (100GB dù chỉ chứa 1GB) nên đắt hơn hẳn EFS chỉ tính theo dung lượng thực dùng.</li><li><b>C. ✓</b> S3 Standard &lt; EFS &lt; EBS: đúng theo bảng giá — S3 ~$0.023/GB, EFS ~$0.30/GB (theo dung lượng thực dùng), EBS gp2 ~$0.10/GB NHƯNG tính trên 100GB provisioned nên tổng chi phí cao nhất ($10).</li><li><b>D. ✗</b> EBS &lt; S3 &lt; EFS: sai hoàn toàn thứ tự, EBS (provisioned 100GB) luôn đắt nhất trong kịch bản này.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Dễ so sánh nhầm chỉ dựa vào đơn giá mỗi GB mà quên rằng EBS tính phí theo dung lượng ĐÃ PROVISION (100GB) chứ không phải dung lượng thực tế file chiếm dụng (1GB).</p>","tip":"<p>Khi so chi phí lưu trữ, luôn phân biệt &quot;tính theo dung lượng thực dùng&quot; (S3, EFS) với &quot;tính theo dung lượng đã provision&quot; (EBS) — provisioned luôn có thể đắt hơn nhiều nếu under-utilized.</p>"},{"id":31,"topic":"Design Cost-Optimized Architectures – S3 Standard cho dữ liệu tạm 24 giờ, truy cập nhiều","supplement":false,"stem":"A leading video streaming service delivers billions of hours of content from Amazon Simple Storage Service (Amazon S3) to customers around the world. Amazon S3 also serves as the data lake for its big data analytics solution. The data lake has a staging zone where intermediary query results are kept only for 24 hours. These results are also heavily referenced by other parts of the analytics pipeline.<br>Which of the following is the MOST cost-effective strategy for storing this intermediary query data?","options":[{"html":"Store the intermediary query results in Amazon S3 Standard-Infrequent Access storage class","correct":false},{"html":"Store the intermediary query results in Amazon S3 Standard storage class","correct":true},{"html":"Store the intermediary query results in Amazon S3 One Zone-Infrequent Access storage class","correct":false},{"html":"Store the intermediary query results in Amazon S3 Glacier Instant Retrieval storage class","correct":false}],"multi":1,"analysis":"<p>Chọn storage class KHÔNG có minimum duration charge khi dữ liệu có vòng đời cực ngắn</p>","answer":"<p>S3 Standard không có phí lưu trữ tối thiểu và không tính phí retrieval, nên với dữ liệu chỉ tồn tại 24 giờ và được truy cập liên tục, đây là lựa chọn rẻ nhất.</p>","explain":"<ul><li><b>A. ✗</b> S3 Standard-IA: có minimum storage duration 30 ngày + phí retrieval, trong khi dữ liệu chỉ cần giữ 24 giờ và được truy cập nhiều lần — tốn kém hơn Standard.</li><li><b>B. ✓</b> S3 Standard: không có minimum storage duration, không phí retrieval — phù hợp nhất cho dữ liệu tạm thời, truy cập nhiều, vòng đời ngắn (24 giờ).</li><li><b>C. ✗</b> S3 One Zone-IA: cũng có minimum storage duration 30 ngày + phí retrieval, cùng vấn đề như Standard-IA.</li><li><b>D. ✗</b> S3 Glacier Instant Retrieval: minimum storage duration lên tới 90 ngày, hoàn toàn không phù hợp với dữ liệu chỉ tồn tại 24 giờ.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các class &quot;IA/Glacier&quot; nghe luôn rẻ hơn Standard về mặt đơn giá GB, nhưng minimum storage duration (30-90 ngày) khiến chúng đắt hơn nhiều khi dữ liệu chỉ tồn tại vài giờ.</p>","tip":"<p>Dữ liệu sống NGẮN HƠN minimum storage duration của storage class IA/Glacier (30/90/180 ngày) → luôn dùng S3 Standard, bất kể class khác rẻ hơn /GB.</p>"},{"id":32,"topic":"Design Secure Architectures – AWS Outposts + EKS Anywhere (Kubernetes modernization, data residency)","supplement":false,"stem":"A financial services company operates a containerized microservices architecture using Kubernetes in its on-premises data center. Due to strict industry regulations and internal security policies, all application data and workloads must remain physically within the on-premises environment. The company’s infrastructure team wants to modernize its Kubernetes stack and take advantage of AWS-managed services and APIs, including automated Kubernetes upgrades, Amazon CloudWatch integration, and access to AWS IAM features — but without migrating any data or compute resources to the cloud.<br>Which AWS solution will best meet the company’s requirements for modernization while ensuring that all data remains on premises?","options":[{"html":"Install an AWS Outposts rack in the company’s data center. Use Amazon EKS Anywhere on Outposts to run containerized workloads locally while integrating with AWS APIs","correct":true},{"html":"Set up a dedicated AWS Direct Connect connection between the on-premises environment and an AWS Region. Deploy Amazon EKS in the cloud and connect it to the local Kubernetes cluster. Use IAM roles and API Gateway to integrate authentication and traffic flow for hybrid workloads","correct":false},{"html":"Deploy Amazon ECS with Fargate in a nearby AWS Local Zone. Use CloudWatch Logs to forward events to the primary region. Connect the Local Zone to the company’s data center over a VPN. Configure containers to pull data from on-premises storage through a mounted file share","correct":false},{"html":"Use an AWS Snowball Edge Compute Optimized device to run EKS-compatible Docker containers on-site. Periodically export application logs and container snapshots to Amazon S3 using Snowball’s offline data transfer features. Use the Snowball console to orchestrate workloads in batches","correct":false}],"multi":1,"analysis":"<p>Chọn hạ tầng AWS mang được NGAY VÀO data center khách hàng (Outposts) khi yêu cầu data residency tuyệt đối</p>","answer":"<p>AWS Outposts Rack là lựa chọn duy nhất chạy EKS-compatible Kubernetes hoàn toàn trong data center khách hàng mà vẫn dùng được API/tooling AWS quen thuộc, không gửi dữ liệu ra ngoài.</p>","explain":"<ul><li><b>A. ✓</b> AWS Outposts rack + EKS Anywhere on Outposts: mang API/dịch vụ AWS (EKS, EC2, S3, CloudWatch) vào ngay data center khách hàng, dữ liệu không rời khỏi on-premises — đáp ứng đúng yêu cầu data residency + modernize.</li><li><b>B. ✗</b> Direct Connect + EKS trên cloud kết nối về cluster local: workload/dữ liệu vẫn chạy trên cloud, vi phạm yêu cầu toàn bộ dữ liệu phải ở on-premises.</li><li><b>C. ✗</b> ECS Fargate ở AWS Local Zone: Local Zone vẫn là hạ tầng AWS quản lý, nằm ngoài data center công ty — vi phạm yêu cầu dữ liệu ở on-premises; ECS cũng không phải Kubernetes.</li><li><b>D. ✗</b> Snowball Edge chạy container EKS-compatible: chỉ phù hợp thu thập dữ liệu offline/edge tạm thời, không phải giải pháp hạ tầng sản xuất lâu dài, thiếu khả năng quản lý vòng đời Kubernetes.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Local Zone và Direct Connect+EKS cloud nghe như giải pháp &quot;hybrid&quot; hợp lý nhưng cả hai đều có workload/dữ liệu chạy TRÊN hạ tầng AWS (dù gần hơn) — vi phạm yêu cầu dữ liệu ở on-premises.</p>","tip":"<p>Dữ liệu/workload PHẢI nằm vật lý trong data center khách hàng → AWS Outposts. Chỉ cần gần người dùng cuối nhưng vẫn do AWS quản lý hạ tầng → Local Zone.</p>"},{"id":33,"topic":"Design Secure Architectures – IAM Roles for Service Accounts (IRSA) trên EKS","supplement":false,"stem":"An enterprise runs a microservices-based application on Amazon EKS, deployed on EC2 worker nodes. The application includes a frontend UI service that interacts with Amazon DynamoDB and a data-processing service that stores and retrieves files from Amazon S3. The organization needs to strictly enforce least privilege access: the UI Pods must access only DynamoDB, and the data-processing Pods must access only S3.<br>Which solution will best enforce these access controls within the EKS cluster?","options":[{"html":"Create one Kubernetes service account shared across all Pods. Attach a single IAM role to this account with both AmazonS3FullAccess and AmazonDynamoDBFullAccess policies","correct":false},{"html":"Attach an IAM policy directly to each Pod using Kubernetes annotations. Assign the S3 policy to data-service Pods and the DynamoDB policy to UI Pods","correct":false},{"html":"Create IAM policies for DynamoDB and S3 access, and attach both to the EC2 instance profile used by the EKS nodes. Use Kubernetes role-based access control (RBAC) to control service-level permissions within the cluster","correct":false},{"html":"Create separate Kubernetes service accounts for the UI and data services. Use IAM Roles for Service Accounts (IRSA) to map each service account to an IAM role with only the required permissions. Assign DynamoDB access to the UI Pods and S3 access to the data Pods","correct":true}],"multi":1,"analysis":"<p>Dùng IRSA để cấp quyền AWS IAM ở MỨC POD, không phải mức node hay mức cluster</p>","answer":"<p>IRSA cho phép mỗi service account (gắn với từng nhóm Pod) assume một IAM role riêng biệt, đảm bảo UI Pods chỉ có quyền DynamoDB và data Pods chỉ có quyền S3.</p>","explain":"<ul><li><b>A. ✗</b> Một service account dùng chung cho mọi Pod, gắn 1 role với cả 2 policy FullAccess: cấp dư quyền cho cả 2 nhóm Pod, vi phạm least privilege dù dùng IRSA.</li><li><b>B. ✗</b> Gắn IAM policy trực tiếp vào Pod qua annotation: không khả thi kỹ thuật — IAM không hỗ trợ gắn policy trực tiếp vào Pod ngoài cơ chế IRSA.</li><li><b>C. ✗</b> Gắn cả 2 policy vào EC2 instance profile của node + dùng Kubernetes RBAC: mọi Pod trên cùng node sẽ thừa hưởng toàn bộ quyền; RBAC chỉ kiểm soát API Kubernetes, không kiểm soát quyền AWS IAM.</li><li><b>D. ✓</b> Tạo service account riêng cho từng service, dùng IRSA map mỗi service account với 1 IAM role scoped đúng quyền cần thiết: đúng cơ chế AWS khuyến nghị để đạt Pod-level least privilege trên EKS.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Gắn policy vào EC2 instance profile của node nghe như cách quen thuộc (giống EC2 thường) nhưng trên EKS điều này khiến MỌI Pod trên node đó thừa hưởng toàn bộ quyền — không đạt isolation.</p>","tip":"<p>Muốn Pod-level least privilege trên EKS, không dùng node-level instance profile hay Kubernetes RBAC (chỉ kiểm soát API K8s) — phải dùng IAM Roles for Service Accounts (IRSA).</p>"},{"id":34,"topic":"Design Resilient Architectures – ALB — Path-based Routing","supplement":false,"stem":"The development team at an e-commerce startup has set up multiple microservices running on Amazon EC2 instances under an Application Load Balancer. The team wants to route traffic to multiple back-end services based on the URL path of the HTTP header. So it wants requests for https://www.example.com/orders to go to a specific microservice and requests for https://www.example.com/products to go to another microservice.<br>Which of the following features of Application Load Balancers can be used for this use-case?","options":[{"html":"Path-based Routing","correct":true},{"html":"Host-based Routing","correct":false},{"html":"HTTP header-based routing","correct":false},{"html":"Query string parameter-based routing","correct":false}],"multi":1,"analysis":"<p>Phân biệt các kiểu routing của ALB theo đúng thành phần request (path vs host vs header vs query string)</p>","answer":"<p>Yêu cầu định tuyến dựa trên URL path (/orders vs /products) khớp chính xác với định nghĩa của Path-based Routing trên ALB.</p>","explain":"<ul><li><b>A. ✓</b> Path-based Routing: định tuyến theo đường dẫn URL (/orders, /products) — đúng chính xác yêu cầu đề.</li><li><b>B. ✗</b> Host-based Routing: định tuyến theo field Host trong header (theo domain/subdomain khác nhau), không phải theo URL path.</li><li><b>C. ✗</b> HTTP header-based routing: định tuyến theo giá trị một header bất kỳ, không phải theo path URL.</li><li><b>D. ✗</b> Query string parameter-based routing: định tuyến theo tham số query string, không phải theo path URL.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Cả 4 lựa chọn đều là tính năng routing có thật của ALB — rất dễ nhầm lẫn nếu không nhớ chính xác thành phần request mà mỗi loại routing dựa vào.</p>","tip":"<p>ALB routing theo: domain/subdomain → Host-based; đường dẫn URL → Path-based; giá trị header tùy chỉnh → Header-based; tham số query → Query string-based.</p>"},{"id":35,"topic":"Design High-Performing Architectures – Amazon FSx for Lustre — hot + cold data cho HPC","supplement":false,"stem":"An Electronic Design Automation (EDA) application produces massive volumes of data that can be divided into two categories. The 'hot data' needs to be both processed and stored quickly in a parallel and distributed fashion. The 'cold data' needs to be kept for reference with quick access for reads and updates at a low cost.<br>Which of the following AWS services is BEST suited to accelerate the aforementioned chip design process?","options":[{"html":"Amazon FSx for Windows File Server","correct":false},{"html":"Amazon FSx for Lustre","correct":true},{"html":"AWS Glue","correct":false},{"html":"Amazon EMR","correct":false}],"multi":1,"analysis":"<p>Chọn file system HPC có khả năng tích hợp SONG SONG với S3 cho dữ liệu nóng VÀ lạnh</p>","answer":"<p>FSx for Lustre vừa xử lý dữ liệu tốc độ cao theo kiểu phân tán/song song (hot data), vừa tự động trình bày/đồng bộ với S3 cho lưu trữ chi phí thấp (cold data) — đúng yêu cầu kép của đề.</p>","explain":"<ul><li><b>A. ✗</b> FSx for Windows File Server: không tích hợp với S3 để trình bày object dưới dạng file, không phù hợp lưu 'cold data' qua S3.</li><li><b>B. ✓</b> FSx for Lustre: xử lý 'hot data' song song/phân tán tốc độ cao, đồng thời liên kết trực tiếp với S3 để lưu 'cold data' chi phí thấp — đáp ứng cả 2 yêu cầu cùng lúc.</li><li><b>C. ✗</b> AWS Glue: là dịch vụ ETL theo batch, không có tốc độ xử lý/lưu trữ tương đương file system hiệu năng cao như Lustre.</li><li><b>D. ✗</b> Amazon EMR: nền tảng big data xử lý qua Hadoop/Spark, không có cùng tốc độ lưu trữ/xử lý như FSx for Lustre cho workload HPC chip-design.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> EMR và Glue đều là các dịch vụ &quot;big data&quot; quen thuộc khiến dễ nhầm là đáp án đúng, nhưng chúng không có tốc độ file system tương đương Lustre cho workload HPC thời gian thực.</p>","tip":"<p>HPC cần tốc độ file-system cực cao + tích hợp sẵn với S3 để tối ưu chi phí lưu trữ → FSx for Lustre, không phải Glue/EMR (công cụ xử lý dữ liệu, không phải file system).</p>"},{"id":36,"topic":"Design Cost-Optimized Architectures – Storage Gateway File Gateway — NFS to S3 migration","supplement":false,"stem":"A video analytics company runs data-intensive batch processing workloads that generate large log files and metadata daily. These files are currently stored in an on-premises NFS-based storage system located in the company's primary data center. However, the storage system is becoming increasingly difficult to scale and is unable to meet the company's growing storage demands. The IT team wants to migrate to a cloud-based storage solution that minimizes costs, retains NFS compatibility, and supports automated tiering of rarely accessed data to lower-cost storage. The team prefers to continue using existing NFS-based tools and protocols for compatibility with their current application stack.<br>Which solution will meet these requirements MOST cost-effectively?","options":[{"html":"Deploy an AWS Storage Gateway File Gateway on premises. Configure it to present an NFS-compatible file share to the workloads. Store the uploaded files in Amazon S3, and use S3 Lifecycle policies to automatically transition infrequently accessed objects to lower-cost storage classes","correct":true},{"html":"Use Amazon FSx for Windows File Server to replace the NFS workload. Enable data deduplication and automatic backups. Use Amazon S3 Glacier to move snapshots to a cost-efficient storage tier. Reconfigure the analytics application to access files using SMB protocol","correct":false},{"html":"Provision an Amazon Elastic File System (Amazon EFS) file system with the One Zone–IA storage class. Use AWS DataSync to migrate the NFS data to EFS. Configure the application to mount the file system over NFS and activate lifecycle management to tier infrequently accessed files","correct":false},{"html":"Deploy an AWS Storage Gateway Volume Gateway in cached mode. Attach it as a block device to an on-premises file server and mount NFS on top. Store snapshots in Amazon S3 Glacier Deep Archive, and use AWS Backup to manage recovery operations and tiering","correct":false}],"multi":1,"analysis":"<p>Giữ nguyên giao thức NFS hiện có khi di chuyển lên cloud, dùng S3 lifecycle để tối ưu chi phí tự động</p>","answer":"<p>File Gateway cung cấp giao diện NFS quen thuộc cho ứng dụng hiện tại trong khi lưu trữ thực sự nằm trên S3, tận dụng S3 Lifecycle để tự động chuyển tầng chi phí thấp — không cần sửa đổi ứng dụng.</p>","explain":"<ul><li><b>A. ✓</b> Storage Gateway File Gateway tại chỗ, expose NFS share, lưu vào S3 + lifecycle policy tự động tiering: giữ nguyên giao thức NFS cho ứng dụng hiện tại, chi phí tối ưu nhờ S3 lifecycle — đúng mọi ràng buộc đề.</li><li><b>B. ✗</b> FSx for Windows File Server: dùng giao thức SMB (không phải NFS), phải viết lại ứng dụng, Glacier chỉ áp dụng cho snapshot chứ không phải từng file.</li><li><b>C. ✗</b> EFS One Zone-IA + DataSync migrate: phải di chuyển toàn bộ dữ liệu và cấu hình lại ứng dụng, One Zone-IA kém bền vững hơn, tăng độ phức tạp vận hành so với yêu cầu.</li><li><b>D. ✗</b> Storage Gateway Volume Gateway (cached) + mount NFS trên block device: Volume Gateway cung cấp iSCSI block storage chứ không phải file-based, phải mount NFS chồng lên block volume — không tối ưu tương thích/scalability.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Volume Gateway nghe tương tự &quot;Storage Gateway&quot; nên dễ nhầm, nhưng nó cung cấp block storage (iSCSI) chứ không phải file-based NFS — sai loại gateway cho yêu cầu này.</p>","tip":"<p>Cần giữ nguyên giao thức NFS/SMB khi lên cloud, lưu trữ thực ở S3 → File Gateway (NFS/SMB tùy loại). Cần block storage kiểu iSCSI → Volume Gateway.</p>"},{"id":37,"topic":"Design Resilient Architectures – SNS → Lambda vượt concurrency quota","supplement":false,"stem":"The engineering team at a Spanish professional football club has built a notification system for its website using Amazon Simple Notification Service (Amazon SNS) notifications which are then handled by an AWS Lambda function for end-user delivery. During the off-season, the notification systems need to handle about 100 requests per second. During the peak football season, the rate touches about 5000 requests per second and it is noticed that a significant number of the notifications are not being delivered to the end-users on the website.<br>As a solutions architect, which of the following would you suggest as the BEST possible solution to this issue?","options":[{"html":"Amazon SNS has hit a scalability limit, so the team needs to contact AWS support to raise the account limit","correct":false},{"html":"The engineering team needs to provision more servers running the Amazon SNS service","correct":false},{"html":"Amazon SNS message deliveries to AWS Lambda have crossed the account concurrency quota for AWS Lambda, so the team needs to contact AWS support to raise the account limit","correct":true},{"html":"The engineering team needs to provision more servers running the AWS Lambda service","correct":false}],"multi":1,"analysis":"<p>Nhận diện đúng NGUYÊN NHÂN khi dịch vụ serverless (SNS→Lambda) bị throttle ở quy mô lớn</p>","answer":"<p>Lambda có giới hạn concurrent executions theo account/region; khi traffic đột biến (gấp 50 lần off-season), lượng invoke đồng thời từ SNS vượt ngưỡng mặc định, gây throttle và mất thông báo.</p>","explain":"<ul><li><b>A. ✗</b> SNS chạm giới hạn scalability: SNS là dịch vụ fully managed, tự scale theo nhu cầu, không có giới hạn kiểu này cần liên hệ support.</li><li><b>B. ✗</b> Cấp thêm server chạy SNS: SNS là serverless, không có khái niệm &quot;server&quot; để cấp thêm.</li><li><b>C. ✓</b> SNS gửi tới Lambda vượt quá concurrency quota của Lambda trong account: đúng nguyên nhân — khi traffic tăng đột biến, lượng lời gọi Lambda đồng thời vượt giới hạn mặc định (1000), cần liên hệ AWS support để tăng hạn mức.</li><li><b>D. ✗</b> Cấp thêm server chạy Lambda: Lambda cũng serverless, không có khái niệm server để cấp thêm.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Hai lựa chọn &quot;cấp thêm server&quot; nghe như phản xạ tự nhiên khi gặp vấn đề về hiệu năng, nhưng cả SNS và Lambda đều serverless — không có server nào để cấp thêm.</p>","tip":"<p>Khi dịch vụ serverless (Lambda, SNS, DynamoDB...) bị throttle ở quy mô lớn, nghĩ ngay tới SERVICE QUOTA/giới hạn concurrency của account, không phải thiếu &quot;server&quot;.</p>"},{"id":38,"topic":"Design High-Performing Architectures – EBS volume types không dùng được làm boot volume (Select two)","supplement":false,"stem":"A software engineering intern at an e-commerce company is documenting the process flow to provision Amazon EC2 instances via the Amazon EC2 API. These instances are to be used for an internal application that processes Human Resources payroll data. He wants to highlight those volume types that cannot be used as a boot volume.<br>Can you help the intern by identifying those storage volume types that CANNOT be used as boot volumes while creating the instances? (Select two)","options":[{"html":"Provisioned IOPS Solid state drive (io1)","correct":false},{"html":"Throughput Optimized Hard disk drive (st1)","correct":true},{"html":"Instance Store","correct":false},{"html":"Cold Hard disk drive (sc1)","correct":true},{"html":"General Purpose Solid State Drive (gp2)","correct":false}],"multi":2,"analysis":"<p>Ghi nhớ: chỉ 2 loại HDD throughput-optimized (st1) và cold (sc1) KHÔNG dùng được làm boot volume</p>","answer":"<p>st1 và sc1 được thiết kế cho workload streaming lớn với throughput là chỉ số chính, không tối ưu cho random I/O nhỏ cần thiết khi boot hệ điều hành, nên AWS không cho phép dùng làm boot volume.</p>","explain":"<ul><li><b>A. ✗</b> io1 (Provisioned IOPS SSD): có thể dùng làm boot volume.</li><li><b>B. ✓</b> Đúng: st1 (Throughput Optimized HDD) KHÔNG thể dùng làm boot volume.</li><li><b>C. ✗</b> Instance Store: có thể dùng làm boot volume (instance-store-backed AMI).</li><li><b>D. ✓</b> Đúng: sc1 (Cold HDD) KHÔNG thể dùng làm boot volume.</li><li><b>E. ✗</b> gp2 (General Purpose SSD): có thể dùng làm boot volume, là loại phổ biến nhất cho boot volume.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Dễ nhầm lẫn giữa các loại EBS SSD/HDD vì tên gọi gần giống nhau (io1, gp2, st1, sc1) — chỉ cần nhớ đúng 2 loại HDD &quot;cold/throughput&quot; bị loại.</p>","tip":"<p>Boot volume được: SSD (gp2/gp3, io1/io2) và Instance Store. Boot volume KHÔNG được: HDD st1 (throughput) và sc1 (cold).</p>"},{"id":39,"topic":"Design High-Performing Architectures – API Gateway REST (stateless) vs WebSocket (stateful)","supplement":false,"stem":"The product team at a startup has figured out a market need to support both stateful and stateless client-server communications via the application programming interface (APIs) developed using its platform. You have been hired by the startup as a solutions architect to build a solution to fulfill this market need using Amazon API Gateway.<br>Which of the following would you identify as correct?","options":[{"html":"Amazon API Gateway creates RESTful APIs that enable stateless client-server communication and Amazon API Gateway also creates WebSocket APIs that adhere to the WebSocket protocol, which enables stateless, full-duplex communication between client and server","correct":false},{"html":"Amazon API Gateway creates RESTful APIs that enable stateless client-server communication and Amazon API Gateway also creates WebSocket APIs that adhere to the WebSocket protocol, which enables stateful, full-duplex communication between client and server","correct":true},{"html":"Amazon API Gateway creates RESTful APIs that enable stateful client-server communication and Amazon API Gateway also creates WebSocket APIs that adhere to the WebSocket protocol, which enables stateful, full-duplex communication between client and server","correct":false},{"html":"Amazon API Gateway creates RESTful APIs that enable stateful client-server communication and Amazon API Gateway also creates WebSocket APIs that adhere to the WebSocket protocol, which enables stateless, full-duplex communication between client and server","correct":false}],"multi":1,"analysis":"<p>Ghi nhớ đúng bản chất: REST API = stateless, WebSocket API = stateful</p>","answer":"<p>RESTful API theo chuẩn HTTP vốn stateless (mỗi request độc lập); WebSocket API duy trì kết nối liên tục hai chiều nên về bản chất là stateful.</p>","explain":"<ul><li><b>A. ✗</b> REST = stateless, WebSocket = stateless: sai nửa sau — WebSocket là giao thức full-duplex, có trạng thái kết nối (stateful), không phải stateless.</li><li><b>B. ✓</b> REST = stateless, WebSocket = stateful: đúng — API Gateway tạo RESTful API (stateless, theo chuẩn HTTP) và WebSocket API (stateful, full-duplex, duy trì kết nối 2 chiều).</li><li><b>C. ✗</b> REST = stateful, WebSocket = stateful: sai nửa đầu — REST theo định nghĩa chuẩn HTTP là stateless.</li><li><b>D. ✗</b> REST = stateful, WebSocket = stateless: sai cả 2 vế, ngược hoàn toàn với bản chất của từng loại API.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 4 đáp án chỉ khác nhau ở việc hoán đổi stateless/stateful giữa 2 loại API — phải nhớ chính xác định nghĩa gốc của từng giao thức, không được đoán theo cảm tính.</p>","tip":"<p>REST API (HTTP request/response độc lập) = stateless. WebSocket API (kết nối 2 chiều liên tục) = stateful.</p>"},{"id":40,"topic":"Design Secure Architectures – IAM Role cho cross-account access","supplement":false,"stem":"An organization wants to delegate access to a set of users from the development environment so that they can access some resources in the production environment which is managed under another AWS account.<br>As a solutions architect, which of the following steps would you recommend?","options":[{"html":"Create new IAM user credentials for the production environment and share these credentials with the set of users from the development environment","correct":false},{"html":"It is not possible to access cross-account resources","correct":false},{"html":"Both IAM roles and IAM users can be used interchangeably for cross-account access","correct":false},{"html":"Create a new IAM role with the required permissions to access the resources in the production environment. The users can then assume this IAM role while accessing the resources from the production environment","correct":true}],"multi":1,"analysis":"<p>Dùng IAM Role (assume role) làm cơ chế chuẩn cho truy cập tài nguyên cross-account</p>","answer":"<p>IAM role cho phép user ở account khác assume để lấy credential tạm thời, không cần chia sẻ hay tạo thêm credential cố định xuyên account.</p>","explain":"<ul><li><b>A. ✗</b> Tạo IAM user credentials mới cho production rồi chia sẻ: không cần thiết, tạo thêm rủi ro quản lý credential cố định xuyên account.</li><li><b>B. ✗</b> &quot;Không thể truy cập tài nguyên cross-account&quot;: sai hoàn toàn — IAM role được thiết kế chính xác cho mục đích này.</li><li><b>C. ✗</b> IAM role và IAM user dùng thay thế cho nhau trong cross-account access: sai — chỉ IAM role hỗ trợ assume xuyên account, IAM user thì không.</li><li><b>D. ✓</b> Tạo IAM role với quyền cần thiết, để user ở account khác assume role đó: đúng cơ chế chuẩn của AWS cho truy cập tài nguyên cross-account, dùng credential tạm thời.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đáp án &quot;tạo IAM user mới&quot; nghe như cách đơn giản, trực quan nhất nhưng đi ngược lại best practice — không nên tạo/chia sẻ credential cố định để truy cập cross-account.</p>","tip":"<p>Truy cập tài nguyên ở account khác luôn dùng IAM Role (assume role, credential tạm thời), không dùng IAM user/credential cố định.</p>"},{"id":41,"topic":"Design High-Performing Architectures – Direct Connect + VPN (mã hóa, độ trễ thấp, băng thông cao)","supplement":false,"stem":"The engineering team at an e-commerce company wants to establish a dedicated, encrypted, low latency, and high throughput connection between its data center and AWS Cloud. The engineering team has set aside sufficient time to account for the operational overhead of establishing this connection.<br>As a solutions architect, which of the following solutions would you recommend to the company?","options":[{"html":"Use AWS Direct Connect to establish a connection between the data center and AWS Cloud","correct":false},{"html":"Use AWS Transit Gateway to establish a connection between the data center and AWS Cloud","correct":false},{"html":"Use AWS site-to-site VPN to establish a connection between the data center and AWS Cloud","correct":false},{"html":"Use AWS Direct Connect plus virtual private network (VPN) to establish a connection between the data center and AWS Cloud","correct":true}],"multi":1,"analysis":"<p>Kết hợp 2 dịch vụ bổ sung cho nhau khi một yêu cầu đơn lẻ (Direct Connect hoặc VPN) không đủ tất cả tiêu chí</p>","answer":"<p>Direct Connect cho băng thông cao/độ trễ thấp nhưng không mã hóa; VPN cho mã hóa nhưng không đảm bảo hiệu năng — kết hợp cả hai đáp ứng toàn bộ 4 tiêu chí đề đưa ra.</p>","explain":"<ul><li><b>A. ✗</b> Direct Connect đơn thuần: cho độ trễ thấp, băng thông cao nhưng KHÔNG mã hóa sẵn — không đáp ứng yêu cầu &quot;encrypted&quot;.</li><li><b>B. ✗</b> Transit Gateway: chỉ là hub kết nối VPC/on-prem, bản thân nó không tạo ra kết nối vật lý độ trễ thấp/băng thông cao giữa data center và AWS.</li><li><b>C. ✗</b> Site-to-Site VPN đơn thuần: có mã hóa (IPSec) nhưng không đảm bảo độ trễ thấp/băng thông cao ổn định như yêu cầu.</li><li><b>D. ✓</b> Direct Connect + VPN: kết hợp băng thông cao/độ trễ thấp của Direct Connect với lớp mã hóa IPSec của VPN — đáp ứng đầy đủ dedicated + encrypted + low latency + high throughput.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Direct Connect đơn thuần nghe như đáp án &quot;cao cấp nhất&quot; nhưng đề yêu cầu rõ &quot;encrypted&quot; mà Direct Connect không tự mã hóa — phải đọc kỹ từng ràng buộc để không bỏ sót.</p>","tip":"<p>Khi đề liệt kê NHIỀU tiêu chí (dedicated + encrypted + low latency + high throughput), kiểm tra xem một dịch vụ đơn lẻ có đủ hết không — Direct Connect thiếu encryption, VPN thiếu hiệu năng, nên đáp án đúng thường là kết hợp Direct Connect + VPN.</p>"},{"id":42,"topic":"Design High-Performing Architectures – Redshift Serverless + Redshift ML (SQL-based ML, MPP serverless)","supplement":false,"stem":"A retail analytics company operates a large-scale data lake on Amazon S3, where they store daily logs of customer transactions, product views, and inventory updates. Each morning, they need to transform and load the data into a data warehouse to support fast analytical queries. The company also wants to enable data analysts to build and train machine learning (ML) models using familiar SQL syntax without writing custom Python code. The architecture must support massively parallel processing (MPP) for fast data aggregation and scoring, and must use serverless AWS services wherever possible to reduce infrastructure management and operational overhead.<br>Which solution best meets these requirements?","options":[{"html":"Use an AWS Glue job to transform and load data into Amazon RDS for PostgreSQL. Allow analysts to run machine learning models using Amazon Aurora ML integrated with PostgreSQL, leveraging Amazon SageMaker endpoints behind the scenes","correct":false},{"html":"Run a daily AWS Glue job to process and transform the raw files in S3 and register the outputs as Amazon Athena tables in AWS Glue Data Catalog. Allow analysts to build ML models using Amazon Athena ML, with SQL-based predictions on top of S3 data without moving it to a warehouse","correct":false},{"html":"Provision and run a daily Amazon EMR cluster with Apache Spark to process and transform the S3 data. Load the results into Amazon Redshift (provisioned). Enable ML model development by integrating Redshift with Amazon SageMaker notebooks for advanced modeling tasks","correct":false},{"html":"Use a daily AWS Glue job to transform and clean the data stored in Amazon S3. Load the transformed dataset into Amazon Redshift Serverless, which offers MPP capabilities in a serverless model. Enable analysts to use Amazon Redshift ML to build and train ML models","correct":true}],"multi":1,"analysis":"<p>Chọn tổ hợp dịch vụ serverless end-to-end CÓ khả năng ML qua SQL thuần (không Python)</p>","answer":"<p>Redshift Serverless cung cấp MPP mà không cần quản lý cluster, còn Redshift ML cho phép xây và huấn luyện model trực tiếp bằng SQL — đáp ứng mọi ràng buộc: serverless, MPP, không cần code.</p>","explain":"<ul><li><b>A. ✗</b> Glue job + RDS PostgreSQL + Aurora ML qua SageMaker: RDS không phải MPP warehouse, không scale tốt cho truy vấn phân tích khối lượng lớn.</li><li><b>B. ✗</b> Glue job + Athena tables + Athena ML: Athena ML không phải tính năng chính thức mạnh mẽ như Redshift ML; RDS/Athena không cung cấp MPP thực sự như Redshift.</li><li><b>C. ✗</b> EMR Spark cluster + Redshift provisioned + SageMaker notebook: phải tự quản lý cả EMR lẫn Redshift cluster, SageMaker notebook đòi hỏi code Python — không đạt yêu cầu serverless/SQL-only.</li><li><b>D. ✓</b> Glue job (serverless ETL) + Redshift Serverless (MPP serverless) + Redshift ML (SQL-based ML): đáp ứng đầy đủ yêu cầu serverless, MPP, và ML qua SQL mà không cần code Python.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> EMR + Redshift provisioned nghe như giải pháp &quot;mạnh mẽ, chuyên nghiệp&quot; cho big data nhưng đòi hỏi quản lý cluster thủ công và ML qua SageMaker notebook cần code Python, phá vỡ yêu cầu serverless/SQL-only.</p>","tip":"<p>Cần MPP serverless + ML bằng SQL (không code) → Redshift Serverless + Redshift ML. RDS/Athena không phải MPP warehouse thực sự.</p>"},{"id":43,"topic":"Design Resilient Architectures – CloudWatch metric filter trên CloudTrail logs → cảnh báo API bất thường","supplement":false,"stem":"While consolidating logs for the weekly reporting, a development team at an e-commerce company noticed that an unusually large number of illegal AWS application programming interface (API) queries were made sometime during the week. Due to the off-season, there was no visible impact on the systems. However, this event led the management team to seek an automated solution that can trigger near-real-time warnings in case such an event recurs.<br>Which of the following represents the best solution for the given scenario?","options":[{"html":"Create an Amazon CloudWatch metric filter that processes AWS CloudTrail logs having API call details and looks at any errors by factoring in all the error codes that need to be tracked. Create an alarm based on this metric's rate to send an Amazon SNS notification to the required team","correct":true},{"html":"Configure AWS CloudTrail to stream event data to Amazon Kinesis. Use Amazon Kinesis stream-level metrics in the Amazon CloudWatch to trigger an AWS Lambda function that will trigger an error workflow","correct":false},{"html":"AWS Trusted Advisor publishes metrics about check results to Amazon CloudWatch. Create an alarm to track status changes for checks in the Service Limits category for the APIs. The alarm will then notify when the service quota is reached or exceeded","correct":false},{"html":"Run Amazon Athena SQL queries against AWS CloudTrail log files stored in Amazon S3 buckets. Use Amazon QuickSight to generate reports for managerial dashboards","correct":false}],"multi":1,"analysis":"<p>Chọn giải pháp giám sát CÓ cảnh báo tự động gần real-time, không chỉ phân tích thủ công hay cảnh báo theo ngưỡng cố định</p>","answer":"<p>CloudWatch metric filter trên CloudTrail logs cho phép biến log thành metric số và đặt alarm theo tốc độ phát sinh lỗi, gửi SNS ngay khi phát hiện — đúng yêu cầu cảnh báo tự động, gần thời gian thực.</p>","explain":"<ul><li><b>A. ✓</b> CloudWatch metric filter xử lý CloudTrail logs, tạo alarm theo rate lỗi, gửi SNS: đúng cơ chế near-real-time, tận dụng CloudTrail tích hợp sẵn với CloudWatch Logs.</li><li><b>B. ✗</b> CloudTrail stream tới Kinesis: CloudTrail KHÔNG hỗ trợ gửi trực tiếp tới Kinesis — chỉ hỗ trợ S3 và CloudWatch Logs làm đích.</li><li><b>C. ✗</b> Trusted Advisor + CloudWatch alarm cho Service Limits: chỉ cảnh báo khi CHẠM/VƯỢT service quota, không phát hiện được số lượng API call bất thường dù chưa chạm giới hạn.</li><li><b>D. ✗</b> Athena query CloudTrail logs trên S3 + QuickSight dashboard: chỉ phục vụ phân tích/báo cáo thủ công, không phải giải pháp cảnh báo tự động gần thời gian thực.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> CloudTrail → Kinesis nghe như một pipeline streaming hợp lý nhưng đây là tính năng KHÔNG tồn tại (CloudTrail chỉ gửi tới S3/CloudWatch Logs) — tên dịch vụ có thật nhưng ghép sai khả năng.</p>","tip":"<p>CloudTrail log data chỉ có 2 đích hỗ trợ: Amazon S3 và CloudWatch Logs — không có tích hợp trực tiếp với Kinesis.</p>"},{"id":44,"topic":"Design High-Performing Architectures – API Gateway + Kinesis Data Analytics cho real-time location tracking","supplement":false,"stem":"A logistics company is building a multi-tier application to track the location of its trucks during peak operating hours. The company wants these data points to be accessible in real-time in its analytics platform via a REST API. The company has hired you as an AWS Certified Solutions Architect Associate to build a multi-tier solution to store and retrieve this location data for analysis.<br>Which of the following options addresses the given use case?","options":[{"html":"Leverage Amazon API Gateway with AWS Lambda","correct":false},{"html":"Leverage Amazon Athena with Amazon S3","correct":false},{"html":"Leverage Amazon API Gateway with Amazon Kinesis Data Analytics","correct":true},{"html":"Leverage Amazon QuickSight with Amazon Redshift","correct":false}],"multi":1,"analysis":"<p>Chọn đúng cặp dịch vụ cho kiến trúc multi-tier: REST API nhận dữ liệu + engine xử lý streaming thời gian thực</p>","answer":"<p>API Gateway đóng vai trò REST API nhận dữ liệu vị trí từ xe tải, chuyển cho Kinesis Data Analytics xử lý/phân tích streaming thời gian thực.</p>","explain":"<ul><li><b>A. ✗</b> API Gateway + Lambda: Lambda không phải dịch vụ lưu trữ/phân tích dữ liệu streaming, không đáp ứng yêu cầu lưu và truy xuất để phân tích.</li><li><b>B. ✗</b> Athena + S3: Athena là dịch vụ truy vấn, không thể dùng để xây REST API nhận dữ liệu từ nguồn.</li><li><b>C. ✓</b> API Gateway + Kinesis Data Analytics: API Gateway nhận request REST chứa dữ liệu vị trí, đẩy vào Kinesis Data Analytics để xử lý/phân tích streaming thời gian thực — đúng kiến trúc multi-tier cho real-time analytics.</li><li><b>D. ✗</b> QuickSight + Redshift: QuickSight là BI tool, Redshift là data warehouse — không dùng để xây REST API nhận dữ liệu đầu vào.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> API Gateway + Lambda nghe như tổ hợp serverless quen thuộc nhưng Lambda không phải dịch vụ lưu trữ/phân tích streaming dữ liệu như yêu cầu đề.</p>","tip":"<p>Cần REST API nhận dữ liệu + phân tích streaming thời gian thực → API Gateway + Kinesis Data Analytics, không phải Lambda (chỉ xử lý logic, không lưu trữ/phân tích stream).</p>"},{"id":45,"topic":"Design High-Performing Architectures – EC2 Instance Store — random I/O cao, dữ liệu replicate ở tầng ứng dụng","supplement":false,"stem":"A research group runs its flagship application on a fleet of Amazon EC2 instances for a specialized task that must deliver high random I/O performance. Each instance in the fleet would have access to a dataset that is replicated across the instances by the application itself. Because of the resilient application architecture, the specialized task would continue to be processed even if any instance goes down, as the underlying application would ensure the replacement instance has access to the required dataset.<br>Which of the following options is the MOST cost-optimal and resource-efficient solution to build this fleet of Amazon EC2 instances?","options":[{"html":"Use Instance Store based Amazon EC2 instances","correct":true},{"html":"Use Amazon EC2 instances with access to Amazon S3 based storage","correct":false},{"html":"Use Amazon Elastic Block Store (Amazon EBS) based EC2 instances","correct":false},{"html":"Use Amazon EC2 instances with Amazon EFS mount points","correct":false}],"multi":1,"analysis":"<p>Chọn storage rẻ nhất, hiệu năng cao nhất khi kiến trúc ứng dụng TỰ chịu trách nhiệm chống mất dữ liệu (đã replicate ở tầng app)</p>","answer":"<p>Vì ứng dụng đã tự đảm bảo khả năng phục hồi (replicate dữ liệu, instance thay thế sẽ có lại dữ liệu), Instance Store cho phép đạt random I/O cao với chi phí thấp nhất (đã gộp vào giá instance).</p>","explain":"<ul><li><b>A. ✓</b> Instance Store: hiệu năng random I/O cao, chi phí đã gộp vào giá instance, phù hợp khi ứng dụng tự lo việc replicate dữ liệu và chịu được mất dữ liệu khi instance die.</li><li><b>B. ✗</b> EC2 + S3: S3 không cung cấp hiệu năng random I/O cao cần cho workload này, chỉ là distractor.</li><li><b>C. ✗</b> EBS: cần dùng loại Provisioned IOPS (io1/io2) để đạt random I/O cao, kéo theo chi phí thêm — không tối ưu chi phí bằng Instance Store.</li><li><b>D. ✗</b> EC2 + EFS mount points: EFS cần thêm tài nguyên mạng/provisioning, không hiệu quả tài nguyên bằng storage vật lý gắn liền instance (Instance Store).</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> EBS (đặc biệt Provisioned IOPS) nghe như lựa chọn &quot;an toàn hơn&quot; cho I/O cao nhưng tốn thêm chi phí không cần thiết khi ứng dụng đã tự chịu trách nhiệm resilience ở tầng trên.</p>","tip":"<p>Khi đề nói rõ &quot;ứng dụng tự chịu trách nhiệm phục hồi dữ liệu khi mất instance&quot; + cần random I/O cao + tối ưu chi phí → Instance Store, không cần EBS/EFS.</p>"},{"id":46,"topic":"Design High-Performing Architectures – EFS truy cập xuyên Region qua inter-region VPC Peering","supplement":false,"stem":"The sourcing team at the US headquarters of a global e-commerce company is preparing a spreadsheet of the new product catalog. The spreadsheet is saved on an Amazon Elastic File System (Amazon EFS) created in us-east-1 region. The sourcing team counterparts from other AWS regions such as Asia Pacific and Europe also want to collaborate on this spreadsheet.<br>As a solutions architect, what is your recommendation to enable this collaboration with the LEAST amount of operational overhead?","options":[{"html":"The spreadsheet data will have to be moved into an Amazon RDS for MySQL database which can then be accessed from any AWS region","correct":false},{"html":"The spreadsheet will have to be copied into Amazon EFS file systems of other AWS regions as Amazon EFS is a regional service and it does not allow access from other AWS regions","correct":false},{"html":"The spreadsheet will have to be copied in Amazon S3 which can then be accessed from any AWS region","correct":false},{"html":"The spreadsheet on the Amazon Elastic File System (Amazon EFS) can be accessed in other AWS regions by using an inter-region VPC peering connection","correct":true}],"multi":1,"analysis":"<p>Chọn cách truy cập XUYÊN REGION vào MỘT tài nguyên duy nhất thay vì nhân bản dữ liệu ra nhiều nơi</p>","answer":"<p>EFS cho phép EC2 ở Region khác truy cập trực tiếp qua inter-region VPC peering, giữ nguyên một bản file duy nhất để tất cả các nhóm cùng cộng tác chỉnh sửa — không cần sao chép hay đổi công nghệ lưu trữ.</p>","explain":"<ul><li><b>A. ✗</b> Chuyển dữ liệu sang RDS MySQL: cần viết lại logic ứng dụng để giả lập chức năng spreadsheet trên database — phức tạp, không cần thiết.</li><li><b>B. ✗</b> Copy EFS sang EFS ở mỗi Region: mỗi team sẽ làm việc trên bản sao RIÊNG của mình, mất khả năng cộng tác thực sự trên cùng 1 file.</li><li><b>C. ✗</b> Copy sang S3: S3 không hỗ trợ in-place edit và không tuân thủ POSIX, cần ứng dụng tùy chỉnh để giả lập chỉnh sửa tại chỗ.</li><li><b>D. ✓</b> Dùng inter-region VPC peering để truy cập EFS từ EC2 ở Region khác: EFS vẫn là MỘT file system duy nhất, truy cập được từ nhiều Region qua VPC peering — không cần sao chép, cộng tác thật sự trên cùng 1 file, overhead thấp nhất.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các phương án &quot;sao chép dữ liệu&quot; (sang EFS khác, sang S3, sang RDS) nghe đơn giản nhưng đều phá vỡ yêu cầu cộng tác thực sự trên CÙNG MỘT file, lại tốn công sức tái cấu trúc ứng dụng.</p>","tip":"<p>Cần cộng tác thời gian thực trên cùng 1 file từ nhiều Region với overhead thấp nhất → giữ nguyên EFS, kết nối qua inter-region VPC Peering, không sao chép dữ liệu ra dịch vụ khác.</p>"},{"id":47,"topic":"Design Cost-Optimized Architectures – AWS Cost Anomaly Detection — phát hiện chi phí bất thường tự động","supplement":false,"stem":"A software company operates a customer analytics platform on a fleet of Amazon EC2 instances. During a quarterly cloud cost review, the finance team discovers an unexpected increase in AWS charges that had gone unnoticed for several days. The company wants to continuously identify abnormal spending patterns and automatically notify designated stakeholders when AWS detects unexpected cost increases.<br>Which solution will meet these requirements?","options":[{"html":"Create an AWS Cost Anomaly Detection monitor and configure an alert subscription to notify designated stakeholders when the monitor detects anomalous spending","correct":true},{"html":"Use AWS Pricing Calculator to model the expected cost of the existing EC2 workload and periodically compare the estimate with actual AWS charges","correct":false},{"html":"Create a zero spend budget from an AWS Budgets template and configure the budget to notify stakeholders when spending exceeds the configured threshold","correct":false},{"html":"Enable Amazon CloudWatch billing metrics, create alarms for predetermined estimated charge thresholds, and configure Amazon SNS notifications for the finance team","correct":false}],"multi":1,"analysis":"<p>Chọn dịch vụ dùng machine learning để phát hiện BẤT THƯỜNG (so với ngưỡng cố định/ước tính tĩnh)</p>","answer":"<p>Cost Anomaly Detection học hành vi chi tiêu lịch sử bằng ML để phát hiện độ lệch bất thường tự động, khác hẳn với ngưỡng tĩnh (billing alarm) hay ước tính trước (Pricing Calculator).</p>","explain":"<ul><li><b>A. ✓</b> AWS Pricing Calculator: chỉ ước tính chi phí trước khi triển khai, không giám sát chi tiêu thực tế liên tục hay tự động phát hiện bất thường.</li><li><b>B. ✗</b> AWS Cost Anomaly Detection: dùng machine learning để học hành vi chi tiêu lịch sử và tự động phát hiện chi phí bất thường, gửi cảnh báo qua SNS/email — đúng chính xác yêu cầu đề.</li><li><b>C. ✗</b> Zero spend budget từ AWS Budgets: chỉ phù hợp cho account KHÔNG kỳ vọng phát sinh chi phí, trong khi công ty đã có workload production nên luôn có chi phí — không phân biệt được chi tiêu bình thường và bất thường.</li><li><b>D. ✗</b> CloudWatch billing alarm với ngưỡng cố định: dùng ngưỡng tĩnh, không dựa trên pattern lịch sử — có thể báo sai khi tăng trưởng bình thường vượt ngưỡng, hoặc bỏ sót bất thường chưa vượt ngưỡng.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> CloudWatch billing alarm nghe như giải pháp cảnh báo chi phí hợp lý, nhưng dùng ngưỡng CỐ ĐỊNH nên không phân biệt được tăng trưởng bình thường với bất thường thực sự — khác bản chất với anomaly detection dùng ML.</p>","tip":"<p>Cần phát hiện chi tiêu LỆCH khỏi pattern bình thường (không biết trước ngưỡng) → Cost Anomaly Detection (ML). Cần cảnh báo khi vượt một con số cụ thể đã biết trước → AWS Budgets/CloudWatch billing alarm.</p>"},{"id":48,"topic":"Design High-Performing Architectures – S3 Transfer Acceleration — chỉ tính phí khi tăng tốc thành công","supplement":false,"stem":"A junior scientist working with the Deep Space Research Laboratory at NASA is trying to upload a high-resolution image of a nebula into Amazon S3. The image size is approximately 3 gigabytes. The junior scientist is using Amazon S3 Transfer Acceleration (Amazon S3TA) for faster image upload. It turns out that Amazon S3TA did not result in an accelerated transfer.<br>Given this scenario, which of the following is correct regarding the charges for this image transfer?","options":[{"html":"The junior scientist needs to pay both S3 transfer charges and S3TA transfer charges for the image upload","correct":false},{"html":"The junior scientist only needs to pay S3TA transfer charges for the image upload","correct":false},{"html":"The junior scientist only needs to pay Amazon S3 transfer charges for the image upload","correct":false},{"html":"The junior scientist does not need to pay any transfer charges for the image upload","correct":true}],"multi":1,"analysis":"<p>Ghi nhớ 2 quy tắc tính phí: (1) không phí data transfer-in vào S3, (2) S3TA chỉ tính phí khi tăng tốc thành công</p>","answer":"<p>AWS không tính phí data transfer khi dữ liệu đi TỪ internet VÀO S3, và với S3TA, bạn chỉ trả tiền cho phần truyền THỰC SỰ được tăng tốc — ở đây không có tăng tốc nên không phí nào phát sinh.</p>","explain":"<ul><li><b>A. ✗</b> Trả cả phí S3 lẫn phí S3TA: sai — không có phí transfer từ internet vào S3 và S3TA không tính phí nếu không tăng tốc.</li><li><b>B. ✗</b> Chỉ trả phí S3TA: sai — vì S3TA không hoạt động/không tăng tốc, không có phí S3TA phát sinh.</li><li><b>C. ✗</b> Chỉ trả phí S3: sai — không có phí data transfer khi truyền dữ liệu TỪ internet VÀO S3.</li><li><b>D. ✓</b> Không phải trả bất kỳ phí transfer nào: đúng — không có phí transfer-in từ internet, và S3TA chỉ tính phí khi THỰC SỰ tăng tốc, mà ở đây không tăng tốc.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Dễ nghĩ rằng &quot;đã dùng dịch vụ thì phải trả phí dịch vụ đó&quot; nhưng S3TA có cơ chế đặc biệt: chỉ tính phí cho phần traffic THỰC SỰ được tăng tốc.</p>","tip":"<p>Luôn nhớ 2 quy tắc: S3 không tính phí transfer-IN từ internet; S3 Transfer Acceleration chỉ tính phí khi việc tăng tốc thực sự xảy ra.</p>"},{"id":49,"topic":"Design Secure Architectures – IAM Permissions Boundary — giới hạn quyền tối đa","supplement":false,"stem":"An IT company wants to review its security best-practices after an incident was reported where a new developer on the team was assigned full access to Amazon DynamoDB. The developer accidentally deleted a couple of tables from the production environment while building out a new feature.<br>Which is the MOST effective way to address this issue so that such incidents do not recur?","options":[{"html":"The CTO should review the permissions for each new developer's IAM user so that such incidents don't recur","correct":false},{"html":"Only root user should have full database access in the organization","correct":false},{"html":"Remove full database access for all IAM users in the organization","correct":false},{"html":"Use permissions boundary to control the maximum permissions employees can grant to the IAM principals","correct":true}],"multi":1,"analysis":"<p>Dùng cơ chế GIỚI HẠN Ở TẦNG TỔ CHỨC (permissions boundary) thay vì quy trình thủ công để ngăn lặp lại sự cố cấp quyền dư thừa</p>","answer":"<p>Permissions boundary đặt giới hạn tối đa mà bất kỳ ai (kể cả admin) có thể gán cho một IAM principal, nên quyền hiệu lực luôn là giao của permissions boundary và permissions policy — ngăn tận gốc việc cấp dư quyền trong tương lai.</p>","explain":"<ul><li><b>A. ✗</b> CTO tự review quyền từng developer mới: không phải giải pháp tự động, không scale được khi tổ chức lớn dần.</li><li><b>B. ✗</b> Chỉ root user có full database access: trái best practice (root không nên dùng cho tác vụ hàng ngày), không ngăn được việc admin gán nhầm full access cho người khác.</li><li><b>C. ✗</b> Gỡ full database access của mọi IAM user: không thực tế vì một số người thực sự cần quyền quản trị database.</li><li><b>D. ✓</b> Dùng permissions boundary để giới hạn quyền tối đa mà nhân viên có thể gán cho IAM principal khác: đảm bảo dù ai cấp quyền, principal mới tạo cũng không bao giờ vượt quá giới hạn đã định — ngăn chặn tận gốc việc gán nhầm full access.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> &quot;CTO tự review&quot; nghe như giải pháp quản trị hợp lý nhưng là quy trình THỦ CÔNG, không scale và không ngăn được sự cố tái diễn — khác với permissions boundary là cơ chế kỹ thuật tự động.</p>","tip":"<p>Muốn ngăn CHẶN TRƯỚC việc ai đó (kể cả admin) cấp dư quyền cho người khác → Permissions Boundary, không phải quy trình review thủ công.</p>"},{"id":50,"topic":"Design Resilient Architectures – SQS FIFO batch mode — tính throughput cần thiết","supplement":false,"stem":"A major bank is using Amazon Simple Queue Service (Amazon SQS) to migrate several core banking applications to the cloud to ensure high availability and cost efficiency while simplifying administrative complexity and overhead. The development team at the bank expects a peak rate of about 1000 messages per second to be processed via SQS. It is important that the messages are processed in order.<br>Which of the following options can be used to implement this system?","options":[{"html":"Use Amazon SQS standard queue to process the messages","correct":false},{"html":"Use Amazon SQS FIFO (First-In-First-Out) queue in batch mode of 2 messages per operation to process the messages at the peak rate","correct":false},{"html":"Use Amazon SQS FIFO (First-In-First-Out) queue to process the messages","correct":false},{"html":"Use Amazon SQS FIFO (First-In-First-Out) queue in batch mode of 4 messages per operation to process the messages at the peak rate","correct":true}],"multi":1,"analysis":"<p>Tính throughput FIFO queue theo công thức: 300 ops/giây × số message/batch</p>","answer":"<p>FIFO queue mặc định hỗ trợ 300 operations/giây; với batch 4 messages/operation, throughput đạt 1200 messages/giây — vừa đủ vượt mức peak 1000 messages/giây yêu cầu.</p>","explain":"<ul><li><b>A. ✗</b> SQS standard queue: không đảm bảo thứ tự xử lý, trong khi đề yêu cầu xử lý message theo đúng thứ tự — loại ngay.</li><li><b>B. ✗</b> FIFO batch 2 messages/operation: 300 ops/s x 2 = 600 messages/s, KHÔNG đủ đáp ứng peak rate 1000 messages/s.</li><li><b>C. ✗</b> FIFO queue không batch: mặc định chỉ 300 messages/s, không đủ đáp ứng peak rate 1000 messages/s.</li><li><b>D. ✓</b> FIFO batch 4 messages/operation: 300 ops/s x 4 = 1200 messages/s, đủ đáp ứng peak rate 1000 messages/s với biên an toàn hợp lý.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Batch 2 messages/operation nghe như một lựa chọn &quot;vừa đủ, an toàn&quot; nhưng tính ra chỉ đạt 600 messages/giây — không đủ đáp ứng peak rate thực tế của đề.</p>","tip":"<p>Công thức throughput FIFO: 300 ops/giây (mặc định) × số message mỗi batch (tối đa 10) = throughput tối đa đạt được, lên tới 3000 messages/giây khi batch đủ 10.</p>"},{"id":51,"topic":"Design High-Performing Architectures – Babelfish + SCT/DMS — migrate SQL Server sang Aurora PostgreSQL (Select two)","supplement":false,"stem":"A retail company runs a customer management system backed by a Microsoft SQL Server database. The system is tightly integrated with applications that rely on T-SQL queries. The company wants to modernize its infrastructure by migrating to Amazon Aurora PostgreSQL, but it needs to avoid major modifications to the existing application logic.<br>Which combination of actions should the company take to achieve this goal with minimal application refactoring? (Select two)","options":[{"html":"Use AWS Glue to convert T-SQL queries to PostgreSQL-compatible SQL during the migration","correct":false},{"html":"Configure Amazon Aurora PostgreSQL with a custom endpoint that emulates Microsoft SQL Server behavior","correct":false},{"html":"Use Amazon Aurora Global Database to replicate data across regions for compatibility","correct":false},{"html":"Deploy Babelfish for Aurora PostgreSQL to enable support for T-SQL commands","correct":true},{"html":"Use AWS Schema Conversion Tool (AWS SCT) along with AWS Database Migration Service (AWS DMS) to migrate the schema and data","correct":true}],"multi":2,"analysis":"<p>Kết hợp đúng bộ công cụ MIGRATION (SCT+DMS cho schema/data) với lớp TƯƠNG THÍCH CÚ PHÁP (Babelfish) khi cần hạn chế refactor</p>","answer":"<p>Babelfish giúp Aurora hiểu trực tiếp T-SQL (giảm sửa code ứng dụng), còn SCT+DMS là bộ công cụ chuẩn để chuyển đổi schema và di chuyển dữ liệu — hai mảng việc tách biệt nhưng cùng cần thiết.</p>","explain":"<ul><li><b>A. ✗</b> Dùng AWS Glue để convert T-SQL sang PostgreSQL SQL: Glue là công cụ ETL dữ liệu, không chuyển đổi được cú pháp truy vấn ứng dụng.</li><li><b>B. ✗</b> Custom endpoint Aurora giả lập hành vi SQL Server: không có tính năng này — Aurora chỉ hiểu T-SQL khi bật Babelfish, không có &quot;custom endpoint emulate&quot; nào khác.</li><li><b>C. ✗</b> Aurora Global Database để replicate xuyên Region cho tương thích: Global Database phục vụ DR/đọc đa Region, không liên quan gì tới tương thích cú pháp SQL Server.</li><li><b>D. ✓</b> Đúng: Babelfish cho Aurora PostgreSQL giúp Aurora hiểu được T-SQL và giao thức wire của SQL Server, giảm tối đa việc sửa code ứng dụng.</li><li><b>E. ✓</b> Đúng: AWS SCT chuyển đổi schema SQL Server sang PostgreSQL-compatible, kết hợp AWS DMS để di chuyển dữ liệu thực tế với downtime tối thiểu.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> &quot;Custom endpoint emulate SQL Server&quot; và &quot;dùng Glue để convert T-SQL&quot; nghe như giải pháp kỹ thuật khả thi nhưng đều là tính năng/khả năng KHÔNG tồn tại cho đúng mục đích này.</p>","tip":"<p>Giữ nguyên code ứng dụng dùng T-SQL khi chuyển sang Aurora PostgreSQL → Babelfish. Di chuyển schema + dữ liệu → SCT (schema) + DMS (data), hai bước luôn đi cùng nhau.</p>"},{"id":52,"topic":"Design Cost-Optimized Architectures – ECS EC2 launch type vs Fargate launch type — mô hình tính phí","supplement":false,"stem":"A leading social media analytics company is contemplating moving its dockerized application stack into AWS Cloud. The company is not sure about the pricing for using Amazon Elastic Container Service (Amazon ECS) with the EC2 launch type compared to the Amazon Elastic Container Service (Amazon ECS) with the Fargate launch type.<br>Which of the following is correct regarding the pricing for these two services?","options":[{"html":"Both Amazon ECS with EC2 launch type and Amazon ECS with Fargate launch type are just charged based on Elastic Container Service used per hour","correct":false},{"html":"Both Amazon ECS with EC2 launch type and Amazon ECS with Fargate launch type are charged based on Amazon EC2 instances and Amazon EBS Elastic Volumes used","correct":false},{"html":"Both Amazon ECS with EC2 launch type and Amazon ECS with Fargate launch type are charged based on vCPU and memory resources that the containerized application requests","correct":false},{"html":"Amazon ECS with EC2 launch type is charged based on EC2 instances and EBS volumes used. Amazon ECS with Fargate launch type is charged based on vCPU and memory resources that the containerized application requests","correct":true}],"multi":1,"analysis":"<p>Phân biệt rạch ròi 2 mô hình tính phí ECS: theo hạ tầng bên dưới (EC2) vs theo tài nguyên logic task (Fargate)</p>","answer":"<p>EC2 launch type buộc bạn trả tiền cho EC2 instance/EBS volume bất kể mức sử dụng; Fargate serverless nên tính phí trực tiếp theo vCPU/memory mà task thực sự yêu cầu.</p>","explain":"<ul><li><b>A. ✗</b> Cả 2 chỉ tính phí theo giờ dùng ECS: bịa đặt — ECS bản thân không tính phí riêng, chi phí đến từ tài nguyên bên dưới (EC2/EBS hoặc vCPU/memory).</li><li><b>B. ✗</b> Cả 2 tính phí theo EC2 instance + EBS volume: sai với Fargate — Fargate không tính theo EC2/EBS mà theo vCPU/memory task yêu cầu.</li><li><b>C. ✗</b> Cả 2 tính phí theo vCPU/memory container yêu cầu: sai với EC2 launch type — EC2 launch type tính phí theo EC2 instance/EBS, không phải theo vCPU/memory task.</li><li><b>D. ✓</b> EC2 launch type tính theo EC2 instance + EBS volume; Fargate tính theo vCPU/memory mà task yêu cầu: đúng — mỗi launch type có mô hình tính phí khác nhau phản ánh đúng mô hình quản lý hạ tầng (tự quản lý server vs serverless).</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các đáp án &quot;cả hai đều tính phí giống nhau&quot; nghe gọn và dễ nhớ nhưng thực chất mỗi launch type có bản chất hạ tầng khác nhau hoàn toàn, nên mô hình tính phí cũng khác nhau.</p>","tip":"<p>ECS EC2 launch type: trả tiền cho EC2/EBS (bạn quản lý server). ECS Fargate: trả tiền theo vCPU/memory task (serverless, không quản lý server).</p>"},{"id":53,"topic":"Design High-Performing Architectures – CloudFront custom origin cho on-premises dynamic website","supplement":false,"stem":"A retail company's dynamic website is hosted using on-premises servers in its data center in the United States. The company is launching its website in Asia, and it wants to optimize the website loading times for new users in Asia. The website's backend must remain in the United States. The website is being launched in a few days, and an immediate solution is needed.<br>What would you recommend?","options":[{"html":"Use Amazon CloudFront with a custom origin pointing to the on-premises servers","correct":true},{"html":"Leverage a Amazon Route 53 geo-proximity routing policy pointing to on-premises servers","correct":false},{"html":"Use Amazon CloudFront with a custom origin pointing to the DNS record of the website on Amazon Route 53","correct":false},{"html":"Migrate the website to Amazon S3. Use S3 cross-region replication (S3 CRR) between AWS Regions in the US and Asia","correct":false}],"multi":1,"analysis":"<p>Dùng CloudFront custom origin để tăng tốc nội dung DYNAMIC mà KHÔNG cần di chuyển backend</p>","answer":"<p>CloudFront với custom origin cho phép cache/tăng tốc truy cập gần người dùng ở các edge location toàn cầu trong khi backend vẫn giữ nguyên tại data center on-premises ở Mỹ — triển khai nhanh, không cần di dời hạ tầng.</p>","explain":"<ul><li><b>A. ✓</b> CloudFront với custom origin trỏ thẳng vào server on-premises: đúng — CloudFront cache/tăng tốc nội dung từ origin tùy chỉnh (kể cả server on-prem) qua mạng edge toàn cầu, triển khai nhanh, backend vẫn ở Mỹ.</li><li><b>B. ✗</b> Route 53 geo-proximity trỏ về server on-premises: server vẫn ở Mỹ nên định tuyến theo vị trí không giúp giảm latency cho user ở châu Á.</li><li><b>C. ✗</b> CloudFront với custom origin trỏ vào DNS record trên Route 53: không hợp lệ — CloudFront custom origin phải là HTTP server/endpoint thực, không trỏ gián tiếp qua bản ghi DNS kiểu này.</li><li><b>D. ✗</b> Di chuyển website sang S3 + S3 CRR: website là DYNAMIC (cần xử lý phía server), trong khi S3 chỉ hỗ trợ static website hosting — không phù hợp.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Route 53 geo-proximity nghe như giải pháp &quot;định tuyến thông minh&quot; nhưng vì origin chỉ có 1 nơi (Mỹ) nên không giúp gì cho độ trễ của user ở châu Á — bẫy đánh lạc hướng bằng tên dịch vụ liên quan tới &quot;routing&quot;.</p>","tip":"<p>Website DYNAMIC, backend cố định 1 nơi, cần giảm độ trễ toàn cầu ngay lập tức, không di dời backend → CloudFront + custom origin. S3 chỉ phù hợp cho website STATIC.</p>"},{"id":54,"topic":"Design Secure Architectures – Geo-restriction: Route 53 Geolocation + CloudFront Georestriction (Select two)","supplement":false,"stem":"One of the biggest football leagues in Europe has granted the distribution rights for live streaming its matches in the USA to a silicon valley based streaming services company. As per the terms of distribution, the company must make sure that only users from the USA are able to live stream the matches on their platform. Users from other countries in the world must be denied access to these live-streamed matches.<br>Which of the following options would allow the company to enforce these streaming restrictions? (Select two)","options":[{"html":"Use Amazon Route 53 based geolocation routing policy to restrict distribution of content to only the locations in which you have distribution rights","correct":true},{"html":"Use georestriction to prevent users in specific geographic locations from accessing content that you're distributing through a Amazon CloudFront web distribution","correct":true},{"html":"Use Amazon Route 53 based latency-based routing policy to restrict distribution of content to only the locations in which you have distribution rights","correct":false},{"html":"Use Amazon Route 53 based failover routing policy to restrict distribution of content to only the locations in which you have distribution rights","correct":false},{"html":"Use Amazon Route 53 based weighted routing policy to restrict distribution of content to only the locations in which you have distribution rights","correct":false}],"multi":2,"analysis":"<p>Chọn
