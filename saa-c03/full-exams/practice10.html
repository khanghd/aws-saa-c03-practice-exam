<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Test 10 · SAA-C03</title>
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#eef0f5; --text:#1a1d23; --muted:#646c78;
  --border:#dfe3ea; --accent:#3a5bf0; --accent-hover:#2d49d6; --accent-soft:#e8edfe;
  --ok:#1a8f55; --ok-soft:#e4f6ec; --bad:#d13b3b; --bad-soft:#fcebeb; --warn:#b4790a; --warn-soft:#fff3db;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
    --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
    --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
    --shadow:none; --shadow-sm:none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
  --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
  --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
  --shadow:none; --shadow-sm:none;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.65 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .2s ease,color .2s ease;
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);padding:.1em .4em;border-radius:5px}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 56px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
header.top h1{
  font-size:21px;margin:0;letter-spacing:-.015em;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent-hover));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
header.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:7px 14px;min-width:76px;text-align:center;box-shadow:var(--shadow-sm);transition:border-color .15s ease,transform .15s ease}
.stat:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hover));width:0;transition:width .3s ease}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:16px}
.toolbar select,.btn{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 13px;cursor:pointer;transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent}
.toolbar label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.layout{display:grid;grid-template-columns:264px 1fr;gap:18px;align-items:start}
.side{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;position:sticky;top:14px;box-shadow:var(--shadow)}
.side h2{font-size:12.5px;margin:0 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.cell{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;height:32px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums;position:relative;padding:0;transition:border-color .12s ease,transform .12s ease,background .12s ease}
.cell:hover{border-color:var(--accent);transform:translateY(-1px)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell.dim{opacity:.32}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cell.sup{font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--border);background:var(--surface-2)}
.legend .l-ok::before{background:var(--ok-soft);border-color:var(--ok)}
.legend .l-bad::before{background:var(--bad-soft);border-color:var(--bad)}
.legend .l-flag::before{background:var(--warn);border-radius:50%;border:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.qnum{font-weight:700;font-size:17px;letter-spacing:-.01em}
.chip{font-size:12px;padding:3px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;transition:transform .12s ease}
.chip.sup{background:var(--warn-soft);color:var(--warn)}
.chip.multi{background:var(--surface-2);color:var(--muted);font-weight:500}
.flagbtn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:13px;transition:border-color .15s ease,background .15s ease,transform .15s ease}
.flagbtn:hover{border-color:var(--warn);color:var(--warn);transform:translateY(-1px)}
.flagbtn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.stem{line-height:1.7}
.stem p{margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;padding:11px 13px;cursor:pointer;background:var(--surface);transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.opt:hover{border-color:var(--accent);transform:translateX(2px);box-shadow:var(--shadow-sm)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--surface-2);transition:background .15s ease,border-color .15s ease,color .15s ease}
.opt.multi .key{border-radius:7px}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--border);transform:none;box-shadow:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.tag{font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)} .opt.missed .tag{color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .spacer{flex:1}
.verdict{margin:18px 0 6px;padding:11px 15px;border-radius:11px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.hint{margin-top:16px;border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:9px;padding:11px 15px;background:var(--surface-2)}
.hint h3{margin:0 0 6px;font-size:14px;color:var(--warn)}
details.sec{border:1px solid var(--border);border-radius:11px;margin-top:11px;background:var(--surface);transition:border-color .15s ease}
details.sec>summary{cursor:pointer;padding:11px 15px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"›";display:inline-block;transition:transform .15s ease;color:var(--muted);font-size:18px;line-height:1}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec .body{padding:0 16px 14px}
.body p{margin:7px 0}
.body ul,.body ol{margin:7px 0;padding-left:22px}
.body li{margin:4px 0}
.body table,.stem table{border-collapse:collapse;width:100%;margin:9px 0;font-size:14px;display:block;overflow-x:auto}
.body th,.body td,.stem th,.stem td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
.body th,.stem th{background:var(--surface-2)}
.sec.s-answer{border-left:3px solid var(--ok)}
.sec.s-tip{border-left:3px solid var(--accent)}
.empty{color:var(--muted);text-align:center;padding:44px 10px}
.kbd{font-size:12px;color:var(--muted);margin-top:14px}
.kbd kbd{font-family:inherit;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface-2)}
.summary h2{margin-top:0}
.summary table{border-collapse:collapse;width:100%;font-size:14px}
.summary th,.summary td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left}
.summary td.n{font-variant-numeric:tabular-nums;text-align:right}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s ease}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .grid{grid-template-columns:repeat(10,1fr)}
}
@media (max-width:480px){
  .wrap{padding:14px 16px 40px}
  .card{padding:16px}
  .grid{grid-template-columns:repeat(8,1fr)}
  .stat{min-width:64px;padding:5px 10px}
}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div>
      <h1>AWS SAA-C03 · Practice Test 10 (65 câu)</h1>
      <div class="sub">Đề tiếng Anh · Giải thích tiếng Việt · Tiến độ chỉ lưu trong phiên đang mở</div>
    <p style="margin:4px 0 0"><a href="../index.html" style="color:var(--accent)">&larr; Về trang luyện đề chính</a></p>
    </div>
    <div class="stats">
      <div class="stat"><b id="sDone">0</b><span>Đã làm</span></div>

      <div class="stat"><b id="sPct">–</b><span>Tỷ lệ đúng</span></div>
    </div>
  </header>
  <div class="progress"><i id="prog"></i></div>

  <div class="toolbar">
    <select id="fFilter" aria-label="Lọc câu hỏi">
      <option value="all">Tất cả câu</option>

    <select id="fTopic" aria-label="Lọc theo chủ đề"><option value="">Mọi chủ đề</option></select>

    <label><input type="checkbox" id="optShuffleA"> Xáo đáp án</label>

    <span style="flex:1"></span>
    <button class="btn" id="btnSummary">Xem kết quả</button>
    <button class="btn ghost" id="btnReset">Làm lại</button>
    <button class="btn ghost" id="btnTheme" title="Đổi giao diện sáng/tối">◐</button>
  </div>

  <div class="layout">

      <h2>Danh sách câu</h2>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span class="l-ok">Đúng</span><span class="l-bad">Sai</span><span>Chưa làm</span><span class="l-flag">Đánh dấu</span>
      </div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<script>
const Q = [
{"id":1,"topic":"Design Secure Architectures – Đọc hiểu IAM resource policy (Directory ID)","supplement":false,"stem":"<p>A company is using the AWS Directory Service to integrate its on-premises Microsoft Active Directory (AD) domain with its Amazon EC2 instances via an AD connector. The IAM identities, which are members of an AD group, have the following identity‑based policy attached to allow Directory Service access:</p><pre><code>{\n  \"Version\":\"2012-10-17\",\n  \"Statement\":[\n    {\n      \"Sid\":\"DirectoryAccessSid1234\",\n      \"Effect\":\"Allow\",\n      \"Action\":[\"ds:*\"],\n      \"Resource\":\"arn:aws:ds:us-east-1:987654321012:directory/d-1234567890\"\n    }\n  ]\n}</code></pre><p>Which of the following BEST describes what the above resource policy does?</p>","options":[{"html":"Allows all Directory Service (ds) calls as long as the resource contains the directory ID: DirectoryAccessSid1234","correct":false},{"html":"Allows all Directory Service (ds) calls as long as the resource contains the directory ID: 987654321012","correct":false},{"html":"Allows all Directory Service (ds) calls as long as the resource contains the directory ID: d-1234567890","correct":true},{"html":"Allows all Directory Service (ds) calls as long as the resource contains the directory name of: DirectoryAccessSid1234","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Đọc hiểu một policy JSON với <code>Resource</code> là ARN dạng <code>arn:aws:ds:region:account-id:directory/d-xxxxxxxxxx</code>.</li>\n<li><strong>Yêu cầu chính:</strong> Xác định đúng phần nào trong ARN là <strong>Directory ID</strong>.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Cấu trúc ARN AWS: <code>arn:partition:service:region:account-id:resource-type/resource-id</code> — phần sau <code>directory/</code> mới là Directory ID.</li>\n</ul>","answer":"<ul>\n<li><strong>Allows all Directory Service (ds) calls as long as the resource contains the directory ID: d-1234567890.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> <code>DirectoryAccessSid1234</code> là giá trị của <code>Sid</code> (Statement ID, chỉ là tên định danh cho statement), không phải Directory ID.</li>\n<li><strong>B. ✗</strong> <code>987654321012</code> là <strong>Account ID</strong> (phần thứ 5 trong ARN), không phải Directory ID.</li>\n<li><strong>C. ✓</strong> Theo cấu trúc ARN <code>arn:aws:ds:us-east-1:987654321012:directory/d-1234567890</code>, phần sau <code>directory/</code> chính là Directory ID: <code>d-1234567890</code>.</li>\n<li><strong>D. ✗</strong> Tương tự A, <code>DirectoryAccessSid1234</code> chỉ là Sid, không phải tên của directory.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Rất dễ nhầm <code>Sid</code> (chỉ là nhãn mô tả cho statement, không có ý nghĩa về quyền) với ID thật sự của resource — luôn nhìn vào trường <code>Resource</code> (ARN) để xác định resource ID thực tế.</p>","tip":"<p>Cấu trúc ARN: <code>arn:partition:service:region:account-id:resource-type/resource-id</code>. <code>Sid</code> chỉ là nhãn, không ảnh hưởng đến logic phân quyền.</p>"},
{"id":2,"topic":"Design Resilient Architectures – RDS Enhanced Monitoring metrics","supplement":false,"stem":"<p>A company deployed an online enrollment system database on a prestigious university, which is hosted in RDS. The Solutions Architect is required to monitor the database metrics in Amazon CloudWatch to ensure the availability of the enrollment system.</p><p>What are the enhanced monitoring metrics that Amazon CloudWatch gathers from Amazon RDS DB instances which provide more accurate information? (Select TWO.)</p>","options":[{"html":"Database Connections","correct":false},{"html":"CPU Utilization","correct":false},{"html":"Freeable Memory","correct":false},{"html":"OS processes","correct":true},{"html":"RDS child processes","correct":true}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Phân biệt giữa metric RDS <strong>thông thường</strong> (từ hypervisor) và metric <strong>Enhanced Monitoring</strong> (từ agent cài trực tiếp trên instance).</li>\n<li><strong>Yêu cầu chính:</strong> Chọn 2 metric thuộc nhóm <strong>Enhanced Monitoring</strong>.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Database Connections, CPU Utilization, Freeable Memory là metric RDS <strong>cơ bản</strong> (regular); OS processes và RDS (child) processes là nhóm <strong>Process List</strong> của Enhanced Monitoring.</li>\n</ul>","answer":"<ul>\n<li><strong>OS processes.</strong></li>\n<li><strong>RDS child processes.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A, B, C. ✗</strong> Database Connections, CPU Utilization, Freeable Memory là các metric RDS <strong>cơ bản</strong>, được CloudWatch thu thập mặc định từ hypervisor, không phải từ Enhanced Monitoring.</li>\n<li><strong>D. ✓</strong> OS processes hiển thị tóm tắt các tiến trình kernel/hệ thống — một phần của Process List view trong Enhanced Monitoring.</li>\n<li><strong>E. ✓</strong> RDS child processes hiển thị tóm tắt các tiến trình hỗ trợ DB instance (vd: <code>mysqld</code>, <code>aurora</code>) — cũng thuộc Process List view của Enhanced Monitoring.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> CPU Utilization, Database Connections, Freeable Memory nghe rất \"kỹ thuật\" và hay bị nhầm là Enhanced Monitoring, nhưng đây thực chất là nhóm metric cơ bản đã có sẵn trong RDS/CloudWatch mà không cần bật Enhanced Monitoring.</p>","tip":"<p>RDS Enhanced Monitoring lấy dữ liệu từ <strong>agent cài trên instance</strong> (chi tiết hơn hypervisor), hiển thị theo Process List: RDS processes, RDS child processes, OS processes.</p>"},
{"id":3,"topic":"Design High-Performing Architectures – EC2 Storage Optimized cho NoSQL","supplement":false,"stem":"<p>A company plans to migrate a NoSQL database to an EC2 instance. The database is configured to replicate the data automatically to keep multiple copies of data for redundancy. The Solutions Architect needs to launch an instance that has a high IOPS and sequential read/write access.</p><p>Which of the following options fulfills the requirement if I/O throughput is the highest priority?</p>","options":[{"html":"Use Compute optimized instance with instance store volume.","correct":false},{"html":"Use Memory optimized instances with EBS volume.","correct":false},{"html":"Use Storage optimized instances with instance store volume.","correct":true},{"html":"Use General purpose instances with EBS volume.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> NoSQL database đã tự replicate dữ liệu (nên instance store không rủi ro mất dữ liệu); cần IOPS cao, sequential I/O.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn loại instance + loại storage ưu tiên I/O throughput cao nhất.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"high IOPS, sequential read/write\" → <strong>Storage Optimized</strong> instance (vd: I3/I3en) với <strong>instance store NVMe SSD</strong>, không cần EBS vì data đã tự replicate.</li>\n</ul>","answer":"<ul>\n<li><strong>Use Storage optimized instances with instance store volume.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Compute Optimized tối ưu cho xử lý CPU-bound, không chuyên cho I/O throughput cao như yêu cầu.</li>\n<li><strong>B. ✗</strong> Memory Optimized phù hợp cho NoSQL về mặt RAM, nhưng EBS không đạt throughput tối đa bằng instance store NVMe của dòng Storage Optimized.</li>\n<li><strong>C. ✓</strong> Storage Optimized (I3/I3en) có instance store NVMe SSD cho hàng chục nghìn IOPS, throughput cực cao; vì dữ liệu đã được replicate tự động nên dùng instance store (ephemeral) không rủi ro.</li>\n<li><strong>D. ✗</strong> General Purpose chỉ cân bằng tài nguyên, không chuyên biệt cho I/O throughput cao.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Thấy \"NoSQL\" dễ nghĩ ngay Memory Optimized (vì NoSQL hay cần RAM lớn để cache), nhưng đề nhấn mạnh <strong>I/O throughput là ưu tiên cao nhất</strong> và dữ liệu đã tự replicate — đây là tín hiệu rõ ràng chỉ đến Storage Optimized + instance store.</p>","tip":"<p>I/O throughput cực cao, sequential read/write, dữ liệu tự replicate (chịu được mất dữ liệu tạm thời) → <strong>Storage Optimized + instance store (NVMe SSD)</strong>.</p>"},
{"id":4,"topic":"Design Secure Architectures – S3 bucket policy bắt buộc SSE-S3 AES256","supplement":false,"stem":"<p>A multinational bank is storing its confidential files in an S3 bucket. The security team recently performed an audit, and the report shows that multiple files have been uploaded without 256-bit Advanced Encryption Standard (AES) server-side encryption. For added protection, the encryption key must be automatically rotated every year. The solutions architect must ensure that there would be no other unencrypted files uploaded in the S3 bucket in the future.</p><p>Which of the following will meet these requirements with the LEAST operational overhead?</p>","options":[{"html":"Create a Service Control Policy (SCP) for the S3 bucket that rejects any object uploads unless the request includes the s3:x-amz-server-side-encryption\": \"AES256\" header. Enable server-side encryption with Amazon S3-managed encryption keys (SSE-S3) and modify the built-in key rotation feature of the SSE-S3 encryption keys to rotate the key yearly.","correct":false},{"html":"Create an S3 bucket policy that denies permissions to upload an object unless the request includes the s3:x-amz-server-side-encryption\": \"AES256\" header. Enable server-side encryption with Amazon S3-managed encryption keys (SSE-S3) and rely on the built-in key rotation feature of the SSE-S3 encryption keys.","correct":true},{"html":"Create an S3 bucket policy for the S3 bucket that rejects any object uploads unless the request includes the s3:x-amz-server-side-encryption\":\"aws:kms\" header. Enable the S3 Object Lock in compliance mode for all objects to automatically rotate the built-in AES256 customer-managed key of the bucket.","correct":false},{"html":"Create a new customer-managed key from the AWS Key Management Service (AWS KMS). Configure the default encryption behavior of the bucket to use the customer-managed key. Manually rotate the KMS key and every year.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần bắt buộc AES-256 (SSE-S3) cho mọi object upload, key xoay vòng mỗi năm, <strong>ít operational overhead nhất</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Dùng đúng loại policy (bucket policy, không phải SCP) và đúng loại SSE (SSE-S3 có rotation tự động sẵn).</li>\n<li><strong>Từ khóa cần chú ý:</strong> SCP dùng cho multi-account trong Organizations, không áp dụng cho S3 bucket; SSE-S3 đã <strong>tự động xoay key hàng năm</strong>, không cần (và không thể) chỉnh tay.</li>\n</ul>","answer":"<ul>\n<li><strong>Create an S3 bucket policy that denies permissions to upload an object unless the request includes the s3:x-amz-server-side-encryption\": \"AES256\" header. Enable server-side encryption with Amazon S3-managed encryption keys (SSE-S3) and rely on the built-in key rotation feature of the SSE-S3 encryption keys.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> SCP dùng để giới hạn quyền giữa các AWS account trong Organizations, không áp dụng để kiểm soát upload vào S3 bucket; ngoài ra SSE-S3 key rotation là cơ chế AWS tự quản lý, không thể chỉnh sửa thủ công.</li>\n<li><strong>B. ✓</strong> Bucket policy đúng loại để chặn upload không mã hóa; SSE-S3 tự động rotate key hàng năm sẵn, không cần làm gì thêm — đúng \"LEAST operational overhead\".</li>\n<li><strong>C. ✗</strong> Header <code>aws:kms</code> tương ứng với SSE-KMS, không phải AES-256/SSE-S3 như đề yêu cầu; S3 Object Lock dùng để chống xóa/ghi đè, không liên quan đến encryption key rotation.</li>\n<li><strong>D. ✗</strong> Thiếu bucket policy để chặn upload không mã hóa (vẫn còn lỗ hổng ban đầu); rotate KMS key thủ công mỗi năm lại tạo thêm overhead không cần thiết.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm SCP với bucket policy — SCP kiểm soát quyền account/OU trong Organizations, còn bucket policy mới là công cụ đúng để kiểm soát hành vi upload vào 1 S3 bucket cụ thể.</p>","tip":"<p>Bắt buộc mã hóa khi upload S3 → dùng <strong>bucket policy</strong> deny nếu thiếu header <code>x-amz-server-side-encryption</code>. Cần AES-256 + rotation tự động, ít overhead nhất → <strong>SSE-S3</strong> (tự rotate hàng năm).</p>"},
{"id":5,"topic":"Design High-Performing Architectures – SQS FIFO tránh xử lý trùng","supplement":false,"stem":"<p>A company has a web-based order processing system that is currently using a standard queue in Amazon SQS. The IT Manager noticed that there are a lot of cases where an order was processed twice. This issue has caused a lot of trouble in processing and made the customers very unhappy. The goal is to ensure that this issue will not recur.</p><p>What solution should be implemented to prevent this from happening again in the future?</p>","options":[{"html":"Alter the retention period in SQS.","correct":false},{"html":"Change the message size in SQS.","correct":false},{"html":"Alter the visibility timeout of SQS.","correct":false},{"html":"Use an Amazon SQS FIFO Queue instead.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> SQS Standard Queue gây xử lý trùng order (at-least-once delivery).</li>\n<li><strong>Yêu cầu chính:</strong> Loại bỏ triệt để khả năng xử lý trùng message.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"processed twice\" + \"ensure this will not recur\" → chỉ có <strong>FIFO Queue</strong> đảm bảo exactly-once processing.</li>\n</ul>","answer":"<ul>\n<li><strong>Use an Amazon SQS FIFO Queue instead.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Retention period chỉ quy định thời gian giữ message trong queue trước khi bị xóa, không liên quan đến việc trùng lặp.</li>\n<li><strong>B. ✗</strong> Kích thước message không liên quan gì đến việc message bị xử lý trùng.</li>\n<li><strong>C. ✗</strong> Visibility timeout không đảm bảo tuyệt đối việc tránh nhận message trùng ở Standard Queue; cách đúng là thiết kế ứng dụng idempotent hoặc chuyển sang FIFO.</li>\n<li><strong>D. ✓</strong> SQS FIFO Queue đảm bảo exactly-once processing (loại bỏ trùng lặp qua deduplication) và giữ đúng thứ tự message — giải quyết triệt để vấn đề.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Visibility timeout nghe liên quan đến việc \"nhận message 2 lần\" nên dễ bị chọn nhầm, nhưng với Standard Queue, visibility timeout chỉ giảm thiểu chứ không đảm bảo tuyệt đối tránh trùng lặp — chỉ FIFO Queue mới đảm bảo exactly-once.</p>","tip":"<p>SQS Standard = at-least-once (có thể trùng, không đảm bảo thứ tự). SQS FIFO = exactly-once + đúng thứ tự. Cần triệt để chống trùng → luôn chọn <strong>FIFO</strong>.</p>"},
{"id":6,"topic":"Design Secure Architectures – IAM Identity Center cho nhiều team","supplement":false,"stem":"<p>A financial services organization is developing a cloud-native application on AWS to process and analyze customer transaction data. The application utilizes Amazon Aurora for the database, Amazon EFS for file storage, and Amazon EventBridge to trigger AWS Step Functions for workflow orchestration. The operations team also uses AWS Systems Manager OpsCenter to centrally track and investigate operational issues.</p><p>The organization requires centralized authentication and access management for its data science, engineering, and compliance teams. These teams need secure access to Aurora and Amazon EFS while maintaining strict data privacy standards. The solution must adhere to the principle of least privilege and minimize administrative overhead.</p><p>Which approach best satisfies these requirements?</p>","options":[{"html":"Enable the AWS IAM Identity Center with an Identity Center directory and create permission sets for granular access for Aurora and EFS. Assign teams to groups linked to specific permission sets based on their roles.","correct":true},{"html":"Use Amazon Cognito User Pools for authentication and use Cognito Identity Pools to provide temporary AWS credentials. Create fine-grained IAM roles for Aurora and EFS access in each team.","correct":false},{"html":"Set up AWS Control Tower to manage multi-account access. Use Service Control Policies (SCPs) to restrict access to Aurora and EFS at the organizational level. Create IAM roles in each account with specific permissions.","correct":false},{"html":"Create separate AWS accounts for each team using AWS Organizations. Set up cross-account IAM roles with least privilege and assign specific Aurora and EFS permissions based on team roles.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Nhiều team (data science, engineering, compliance) cần truy cập Aurora + EFS, cần quản lý tập trung, least privilege, ít overhead.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn giải pháp quản lý truy cập tập trung, phân quyền chi tiết theo vai trò, dễ mở rộng.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"centralized authentication and access management\" + nhiều team → <strong>IAM Identity Center</strong> với permission set theo nhóm.</li>\n</ul>","answer":"<ul>\n<li><strong>Enable the AWS IAM Identity Center with an Identity Center directory and create permission sets for granular access for Aurora and EFS. Assign teams to groups linked to specific permission sets based on their roles.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> IAM Identity Center cung cấp SSO tập trung, permission set cho phép cấp quyền chi tiết theo nhóm/vai trò — đúng yêu cầu centralized + least privilege + ít overhead.</li>\n<li><strong>B. ✗</strong> Cognito chủ yếu dùng cho xác thực user cuối (end-user) của ứng dụng, không tích hợp sẵn với hệ thống SSO nội bộ đang dùng (IAM Identity Center); tạo IAM role riêng cho từng team làm tăng độ phức tạp.</li>\n<li><strong>C. ✗</strong> Control Tower + SCP chỉ kiểm soát ở mức account/OU (thô), không đủ chi tiết (granular) cho từng resource như Aurora/EFS.</li>\n<li><strong>D. ✗</strong> Tạo account riêng cho từng team + cross-account role gây overhead quản lý rất lớn, không cần thiết cho yêu cầu này.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Control Tower/SCP nghe \"bảo mật cấp cao\" nên dễ bị chọn nhầm, nhưng chúng chỉ kiểm soát ở mức account/OU — không đủ chi tiết (fine-grained) để phân quyền riêng cho Aurora và EFS theo từng team.</p>","tip":"<p>Quản lý truy cập tập trung, chi tiết theo nhóm/vai trò cho nhiều resource, ít overhead → <strong>AWS IAM Identity Center + permission sets</strong>.</p>"},
{"id":7,"topic":"Design Secure Architectures – Amazon Comprehend Medical cho PHI","supplement":false,"stem":"<p>A hospital has a mission-critical application that uses a RESTful API powered by Amazon API Gateway and AWS Lambda. The medical officers upload PDF reports to the system which are then stored as static media content in an Amazon S3 bucket.</p><p>The security team wants to improve its visibility when it comes to cyber-attacks and ensure HIPAA (Health Insurance Portability and Accountability Act) compliance. The company is searching for a solution that continuously monitors object-level S3 API operations and identifies protected health information (PHI) in the reports, with minimal changes in the existing Lambda function.</p><p>Which of the following solutions will meet these requirements with the LEAST operational overhead?</p>","options":[{"html":"Use Amazon Textract Medical with PII redaction turned on to extract and filter sensitive text from the PDF reports. Create a new Lambda function that calls the regular Amazon Comprehend API to identify the PHI from the extracted text.","correct":false},{"html":"Use Amazon Textract with the StartDocumentTextDetection API operation to extract text from PDF reports. Analyze the extracted data with a custom-built PHI detection algorithm within the Lambda function.","correct":false},{"html":"Use Amazon Textract to extract the text from the PDF reports. Integrate Amazon Comprehend Medical with the existing Lambda function to identify the PHI from the extracted text.","correct":true},{"html":"Use Amazon Transcribe to read and analyze the PDF reports using the StartTranscriptionJob API operation. Use Amazon CloudWatch Logs to detect protected health information (PHI) content by tracking access logs and security events.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần trích text từ PDF rồi nhận diện PHI, <strong>thay đổi tối thiểu</strong> với Lambda hiện có, HIPAA-compliant.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng dịch vụ trích text (PDF) + đúng dịch vụ nhận diện PHI chuyên biệt, tích hợp vào Lambda sẵn có.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Trích text từ PDF → <strong>Textract</strong>; nhận diện PHI (y tế) → <strong>Comprehend Medical</strong> (khác Comprehend thường và khác PII của Textract).</li>\n</ul>","answer":"<ul>\n<li><strong>Use Amazon Textract to extract the text from the PDF reports. Integrate Amazon Comprehend Medical with the existing Lambda function to identify the PHI from the extracted text.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Textract Medical PII redaction chỉ lọc PII cơ bản, không đủ để nhận diện toàn bộ PHI; đề bài cũng yêu cầu thay đổi tối thiểu Lambda hiện có, nhưng option này lại tạo <strong>Lambda mới</strong>.</li>\n<li><strong>B. ✗</strong> Tự xây dựng thuật toán PHI detection riêng tốn nhiều công sức phát triển/bảo trì hơn nhiều so với dùng dịch vụ managed sẵn có (Comprehend Medical).</li>\n<li><strong>C. ✓</strong> Textract trích text từ PDF, sau đó tích hợp Comprehend Medical (dịch vụ HIPAA-eligible, chuyên nhận diện PHI) ngay trong Lambda hiện có — đúng yêu cầu, ít thay đổi nhất.</li>\n<li><strong>D. ✗</strong> Amazon Transcribe dùng cho speech-to-text, không trích xuất được text từ PDF; CloudWatch Logs cũng không có khả năng trực tiếp phát hiện PHI.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm Comprehend (NLP thông thường) với Comprehend <strong>Medical</strong> (chuyên biệt cho dữ liệu y tế, HIPAA-eligible) — chỉ Comprehend Medical mới nhận diện đúng PHI.</p>","tip":"<p>Trích text từ PDF/ảnh → <strong>Amazon Textract</strong>. Nhận diện thông tin y tế nhạy cảm (PHI) → <strong>Amazon Comprehend Medical</strong> (không phải Comprehend thường).</p>"},
{"id":8,"topic":"Design Resilient Architectures – Predictive Scaling cho Auto Scaling","supplement":false,"stem":"<p>Every week, an e-commerce company announces a sales promotion, causing its application hosted on an Auto Scaling group to experience intermittent downtime. Because of long initialization times, the application only becomes operational minutes before a new EC2 instance turns into RUNNING state. A solutions architect must devise a solution that launches capacity in advance based on a forecasted load in order to scale faster.</p><p>Which solution meets the requirements with the least amount of effort?</p>","options":[{"html":"Configure the Auto Scaling group to use predictive scaling.","correct":true},{"html":"Use Amazon SageMaker Clarify to analyze and predict the workload pattern of the application. Create a scheduled scaling policy based on the prediction results.","correct":false},{"html":"Create a Scheduled Amazon EventBridge (Amazon CloudWatch Events) Rule that runs a scaling job on a Lambda function every midnight.","correct":false},{"html":"Create a dynamic scaling policy based on the historical average CPU load of the application.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Tải tăng đột biến theo lịch (sale hàng tuần), instance khởi tạo chậm, cần scale <strong>trước</strong> khi tải đến (proactive, không phải reactive).</li>\n<li><strong>Yêu cầu chính:</strong> Giải pháp ít công sức nhất để scale trước dựa trên dự báo tải.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"launches capacity in advance based on a forecasted load\" → tính năng có sẵn <strong>Predictive Scaling</strong> của Auto Scaling.</li>\n</ul>","answer":"<ul>\n<li><strong>Configure the Auto Scaling group to use predictive scaling.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Predictive Scaling dùng ML để dự báo capacity cần thiết dựa trên dữ liệu lịch sử CloudWatch, tự động launch capacity trước khi tải đến — đúng yêu cầu, không cần tự xây dựng gì thêm.</li>\n<li><strong>B. ✗</strong> SageMaker Clarify dùng để giải thích/phát hiện bias trong model ML, không phải công cụ dự báo workload cho Auto Scaling — phức tạp và sai mục đích.</li>\n<li><strong>C. ✗</strong> Lập lịch cố định (midnight) không linh hoạt, dễ sai lệch khi lịch sale thay đổi, tốn công sức thiết lập và bảo trì hơn predictive scaling.</li>\n<li><strong>D. ✗</strong> Dynamic scaling theo CPU chỉ phản ứng (reactive) sau khi tải đã tăng, không giải quyết được vấn đề \"cần capacity sẵn trước khi tải đến\".</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dynamic scaling nghe có vẻ hợp lý vì cũng là 1 dạng auto scaling, nhưng nó luôn là <strong>reactive</strong> (phản ứng sau khi metric vượt ngưỡng) — không giải quyết được bài toán cần capacity sẵn <strong>trước</strong> khi tải đến như predictive scaling.</p>","tip":"<p>Tải tăng theo quy luật, có thể dự báo trước, cần scale <strong>chủ động</strong> trước khi tải đến → <strong>Predictive Scaling</strong>. Tải không dự báo được → Dynamic Scaling (reactive).</p>"},
{"id":9,"topic":"Design Cost-Optimized Architectures – S3 Lifecycle Policy chuyển sang Glacier","supplement":false,"stem":"<p>A media company is using Amazon EC2, ELB, and S3 for its video-sharing portal for filmmakers. They are using a standard S3 storage class to store all high-quality videos that are frequently accessed only during the first three months of posting.</p><p>As a Solutions Architect, what should you do if the company needs to automatically transfer or archive media data from an S3 bucket to Glacier?</p>","options":[{"html":"Use Lifecycle Policies","correct":true},{"html":"Use Amazon SQS","correct":false},{"html":"Use a custom shell script that transfers data from the S3 bucket to Glacier","correct":false},{"html":"Use Amazon SWF","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần tự động chuyển dữ liệu cũ (sau 3 tháng) từ S3 sang Glacier.</li>\n<li><strong>Yêu cầu chính:</strong> Giải pháp tự động, có sẵn, không cần tự viết script.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"automatically transfer or archive... to Glacier\" → <strong>S3 Lifecycle Policy</strong> (transition action).</li>\n</ul>","answer":"<ul>\n<li><strong>Use Lifecycle Policies.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Lifecycle Policy hỗ trợ transition action, tự động chuyển object sang Glacier sau khoảng thời gian chỉ định — không cần script hay dịch vụ bổ sung.</li>\n<li><strong>B. ✗</strong> SQS là dịch vụ hàng đợi tin nhắn, không có chức năng chuyển đổi storage class của S3.</li>\n<li><strong>C. ✗</strong> Viết script thủ công tốn công sức duy trì, không cần thiết khi S3 đã có tính năng Lifecycle Policy sẵn.</li>\n<li><strong>D. ✗</strong> Amazon SWF (Simple Workflow Service) dùng để điều phối workflow ứng dụng, không liên quan đến quản lý vòng đời object S3.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Các dịch vụ liên quan đến \"workflow/automation\" như SWF hay viết script dễ bị nhầm là giải pháp đúng, nhưng với riêng việc tự động archive dữ liệu S3 theo thời gian thì Lifecycle Policy luôn là câu trả lời chuẩn.</p>","tip":"<p>Tự động archive/transition dữ liệu S3 sang storage class rẻ hơn theo thời gian → luôn dùng <strong>S3 Lifecycle Policy</strong>.</p>"},
{"id":10,"topic":"Design Resilient Architectures – EC2 Instance Metadata lấy IP","supplement":false,"stem":"<p>A company has a web application hosted in an On-Demand EC2 instance. You are creating a shell script that needs the instance's public and private IP addresses.</p><p>What is the best way to get the instance's associated IP addresses which your shell script can use?</p>","options":[{"html":"By using IAM.","correct":false},{"html":"By using a CloudWatch metric.","correct":false},{"html":"By using a Curl or Get Command to get the latest user data information from http://169.254.169.254/latest/user-data/","correct":false},{"html":"By using a Curl or Get Command to get the latest metadata information from http://169.254.169.254/latest/meta-data/","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Script chạy trên chính EC2 instance, cần lấy IP (public/private) của chính nó.</li>\n<li><strong>Yêu cầu chính:</strong> Cách lấy thông tin instance từ bên trong instance, không cần gọi API/console bên ngoài.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Phân biệt <strong>instance metadata</strong> (<code>/latest/meta-data/</code>, thông tin về instance như IP) với <strong>user data</strong> (<code>/latest/user-data/</code>, script khởi tạo do người dùng cung cấp lúc launch).</li>\n</ul>","answer":"<ul>\n<li><strong>By using a Curl or Get Command to get the latest metadata information from http://169.254.169.254/latest/meta-data/.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> IAM quản lý quyền truy cập, không cung cấp thông tin về địa chỉ IP của instance.</li>\n<li><strong>B. ✗</strong> CloudWatch metric theo dõi hiệu năng (CPU, network...), không trả về trực tiếp địa chỉ IP qua endpoint đơn giản cho script dùng.</li>\n<li><strong>C. ✗</strong> <code>/latest/user-data/</code> chỉ trả về dữ liệu khởi tạo (user data script) mà người dùng cung cấp lúc launch instance, không phải thông tin IP.</li>\n<li><strong>D. ✓</strong> <code>/latest/meta-data/</code> là endpoint instance metadata, cung cấp đầy đủ thông tin về instance đang chạy bao gồm cả public và private IPv4 address, truy cập được ngay từ trong instance mà không cần gọi API/Console.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm lẫn giữa 2 endpoint rất giống tên nhau: <code>meta-data</code> (thông tin VỀ instance, như IP) và <code>user-data</code> (dữ liệu DO người dùng cung cấp lúc khởi tạo, như script cài đặt).</p>","tip":"<p>Lấy thông tin về chính EC2 instance (IP, instance ID, AZ...) từ bên trong instance → <code>http://169.254.169.254/latest/meta-data/</code> (Instance Metadata Service).</p>"}
,
{"id":11,"topic":"Design Resilient Architectures – S3 + EMR xử lý log","supplement":false,"stem":"<p>A company has a set of Linux servers running on multiple On-Demand Amazon EC2 instances powered by the EC2 Nitro System. The Audit team wants to collect and process the application log files generated from these servers for the report.</p><p>Which of the following is the most suitable solution to meet this requirement?</p>","options":[{"html":"Amazon S3 Glacier for storing the application log files and Spot EC2 Instances for processing them.","correct":false},{"html":"Amazon S3 Glacier Deep Archive for storing the application log files and AWS ParallelCluster for processing the log files.","correct":false},{"html":"Amazon S3 for storing the application log files and Amazon Elastic MapReduce for processing the log files.","correct":true},{"html":"A single On-Demand EC2 instance for both storing and processing the log files","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần thu thập và xử lý (process, không chỉ lưu trữ) log file từ nhiều server.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng cặp dịch vụ lưu trữ (truy cập được ngay) + dịch vụ xử lý big data phù hợp.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"collect and process\" (không phải archive lâu dài) → <strong>S3</strong> (lưu, truy cập nhanh) + <strong>EMR</strong> (xử lý dữ liệu lớn theo framework Hadoop/Spark).</li>\n</ul>","answer":"<ul>\n<li><strong>Amazon S3 for storing the application log files and Amazon Elastic MapReduce for processing the log files.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> S3 Glacier chỉ dùng cho lưu trữ archive, không phù hợp khi cần truy cập để xử lý thường xuyên.</li>\n<li><strong>B. ✗</strong> Glacier Deep Archive có thời gian retrieval rất lâu, không phù hợp; ParallelCluster là công cụ cho HPC cluster, không chuyên cho xử lý/phân tích log dạng big data.</li>\n<li><strong>C. ✓</strong> S3 lưu log với khả năng truy cập nhanh; EMR (Hadoop/Spark) là dịch vụ chuyên xử lý/phân tích khối lượng lớn dữ liệu log hiệu quả.</li>\n<li><strong>D. ✗</strong> Một EC2 instance đơn không phải dịch vụ lưu trữ được khuyến nghị, và EC2 không có sẵn engine xử lý big data tích hợp như EMR.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Glacier/Glacier Deep Archive nghe \"lưu trữ dài hạn, rẻ\" nên dễ bị chọn nhầm cho bài toán lưu log, nhưng đề yêu cầu phải <strong>xử lý (process)</strong> log thường xuyên — Glacier có thời gian retrieval quá lâu để phù hợp.</p>","tip":"<p>Lưu trữ + xử lý big data (log, dữ liệu lớn) → kết hợp <strong>Amazon S3</strong> (lưu trữ) + <strong>Amazon EMR</strong> (xử lý bằng Hadoop/Spark).</p>"},
{"id":12,"topic":"Design High-Performing Architectures – NAT Gateway cho private subnet","supplement":false,"stem":"<p>A Solutions Architect is designing the cloud architecture for the enterprise application suite of the company. Both the web and application tiers need to access the Internet to fetch data from public APIs. However, these servers should be inaccessible from the Internet.</p><p>Which of the following steps should the Architect implement to meet the above requirements?</p>","options":[{"html":"Deploy a NAT gateway in the public subnet and add a route to it from the private subnet where the web and application tiers are hosted.","correct":true},{"html":"Deploy a NAT gateway in the private subnet and add a route to it from the public subnet where the web and application tiers are hosted.","correct":false},{"html":"Deploy the web and application tier instances to a public subnet and then allocate an Elastic IP address to each EC2 instance.","correct":false},{"html":"Deploy the web and application tier instances to a private subnet and then allocate an Elastic IP address to each EC2 instance.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Server cần ra Internet (outbound) nhưng không được truy cập từ Internet vào (inbound) — mô hình kinh điển của private subnet.</li>\n<li><strong>Yêu cầu chính:</strong> Đặt đúng vị trí NAT Gateway và cấu hình route đúng chiều.</li>\n<li><strong>Từ khóa cần chú ý:</strong> NAT Gateway luôn đặt ở <strong>public subnet</strong>; private subnet route traffic ra Internet <strong>qua</strong> NAT Gateway đó.</li>\n</ul>","answer":"<ul>\n<li><strong>Deploy a NAT gateway in the public subnet and add a route to it from the private subnet where the web and application tiers are hosted.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> NAT Gateway phải nằm ở public subnet (có route đến IGW); private subnet route traffic Internet-bound đến NAT Gateway này — server vẫn ra ngoài được nhưng không ai từ ngoài gọi vào được.</li>\n<li><strong>B. ✗</strong> Đặt NAT Gateway ở private subnet là sai hoàn toàn — NAT Gateway cần có địa chỉ Elastic IP công khai và phải nằm trong subnet có route tới IGW (tức public subnet).</li>\n<li><strong>C. ✗</strong> Đặt server ở public subnet + Elastic IP khiến server có thể bị truy cập trực tiếp từ Internet — vi phạm yêu cầu \"inaccessible from the Internet\".</li>\n<li><strong>D. ✗</strong> Elastic IP chỉ là 1 địa chỉ IP tĩnh; gắn EIP cho instance trong private subnet không có ý nghĩa gì (private subnet không có route tới IGW) và cũng không giúp server ra Internet.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Nhầm lẫn vị trí đặt NAT Gateway — NAT Gateway luôn phải ở <strong>public subnet</strong> (nơi có route đến Internet Gateway), còn server cần bảo vệ thì ở <strong>private subnet</strong> và route traffic qua NAT Gateway đó.</p>","tip":"<p>Server cần ra Internet nhưng không bị truy cập từ Internet → đặt server ở <strong>private subnet</strong>, đặt <strong>NAT Gateway ở public subnet</strong>, route traffic từ private subnet đến NAT Gateway.</p>"},
{"id":13,"topic":"Design High-Performing Architectures – CloudWatch Agent custom metric memory","supplement":false,"stem":"<p>An Auto Scaling group (ASG) of Amazon EC2 Linux instances has an Amazon FSx for OpenZFS file system with basic monitoring enabled in Amazon CloudWatch. The Solutions Architect noticed that the legacy web application hosted in the ASG takes a long time to load. After checking the instances, the Architect noticed that the ASG is not launching more instances as it should be, even though the servers already have high memory usage.</p><p>Which of the following options should the Architect implement to solve this issue?</p>","options":[{"html":"Enable detailed monitoring on the EC2 instances of the Auto Scaling group. Use Auto Scaling with custom metrics to scale out the Auto Scaling group based on the aggregated memory usage of EC2 instances.","correct":false},{"html":"Set up Amazon Rekognition to automatically identify and recognize the cause of the high memory usage. Use the AWS Well-Architected Tool to automatically trigger the scale-out event in the ASG based on the overall memory usage.","correct":false},{"html":"Implement an AI solution that leverages Amazon Comprehend to track the near-real-time memory usage of each and every EC2 instance. Use Amazon SageMaker AI to automatically trigger the Auto Scaling event if there is high memory usage.","correct":false},{"html":"Install the CloudWatch unified agent to the EC2 instances. Set up a custom parameter in AWS Systems Manager Parameter Store with the CloudWatch agent configuration to create an aggregated metric on memory usage percentage. Scale the Auto Scaling group based on the aggregated metric.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> ASG không scale dù memory usage cao, vì <strong>CloudWatch mặc định không theo dõi memory usage</strong> (chỉ có CPU, Network, Disk).</li>\n<li><strong>Yêu cầu chính:</strong> Thu thập custom metric memory usage rồi dùng nó để scale ASG.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Cần cài <strong>CloudWatch unified agent</strong> để lấy metric memory (không có sẵn mặc định), rồi cấu hình ASG scale theo custom metric đó.</li>\n</ul>","answer":"<ul>\n<li><strong>Install the CloudWatch unified agent to the EC2 instances. Set up a custom parameter in AWS Systems Manager Parameter Store with the CloudWatch agent configuration to create an aggregated metric on memory usage percentage. Scale the Auto Scaling group based on the aggregated metric.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Detailed monitoring chỉ tăng tần suất thu thập các metric <strong>chuẩn</strong> (như CPU), không tạo ra metric memory usage vốn không có sẵn mặc định.</li>\n<li><strong>B. ✗</strong> Rekognition dùng cho nhận diện hình ảnh, không liên quan đến theo dõi memory; Well-Architected Tool chỉ đưa ra khuyến nghị kiến trúc, không có khả năng trigger scaling.</li>\n<li><strong>C. ✗</strong> Comprehend là NLP service, không theo dõi được memory usage; dùng SageMaker để trigger scaling cũng không cần thiết, quá phức tạp cho bài toán này.</li>\n<li><strong>D. ✓</strong> CloudWatch unified agent là cách chuẩn để thu thập metric memory usage; Parameter Store lưu cấu hình agent tập trung; sau khi có custom metric, cấu hình ASG scale dựa trên đó.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Các đáp án nhắc đến dịch vụ AI (Rekognition, Comprehend, SageMaker) nghe rất \"hiện đại\" nhưng hoàn toàn sai mục đích — vấn đề cốt lõi chỉ là CloudWatch <strong>không theo dõi memory mặc định</strong>, cần agent để bổ sung metric này.</p>","tip":"<p>CloudWatch mặc định KHÔNG theo dõi memory usage (chỉ CPU/Network/Disk) → cần cài <strong>CloudWatch unified agent</strong> để thu thập memory làm custom metric cho Auto Scaling.</p>"},
{"id":14,"topic":"Design High-Performing Architectures – Lambda@Edge xử lý dữ liệu gần user","supplement":false,"stem":"<p>A company needs to implement a solution that will process real-time streaming data of its users across the globe. This will enable them to track and analyze globally-distributed user activity on their website and mobile applications, including clickstream analysis. The solution should process the data in close geographical proximity to their users and respond to user requests at low latencies.</p><p>Which of the following is the most suitable solution for this scenario?</p>","options":[{"html":"Integrate CloudFront with Lambda@Edge in order to process the data in close geographical proximity to users and respond to user requests at low latencies. Process real-time streaming data using Kinesis and durably store the results to an Amazon S3 bucket.","correct":true},{"html":"Use a CloudFront web distribution and Route 53 with a Geoproximity routing policy in order to process the data in close geographical proximity to users and respond to user requests at low latencies. Process real-time streaming data using Kinesis and durably store the results to an Amazon S3 bucket.","correct":false},{"html":"Use a CloudFront web distribution and Route 53 with a latency-based routing policy, in order to process the data in close geographical proximity to users and respond to user requests at low latencies. Process real-time streaming data using Kinesis and durably store the results to an Amazon S3 bucket.","correct":false},{"html":"Integrate CloudFront with Lambda@Edge in order to process the data in close geographical proximity to users and respond to user requests at low latencies. Process real-time streaming data using Amazon Athena and durably store the results to an Amazon S3 bucket.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần xử lý dữ liệu <strong>ngay tại edge</strong> (gần user) rồi stream vào hệ thống xử lý real-time, lưu kết quả bền vững.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng cơ chế xử lý tại edge (có khả năng chạy code) + đúng dịch vụ streaming real-time.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Route 53 chỉ định tuyến DNS, <strong>không có khả năng tính toán/xử lý</strong> dữ liệu; chỉ <strong>Lambda@Edge</strong> mới chạy code tại CloudFront edge location.</li>\n</ul>","answer":"<ul>\n<li><strong>Integrate CloudFront with Lambda@Edge in order to process the data in close geographical proximity to users and respond to user requests at low latencies. Process real-time streaming data using Kinesis and durably store the results to an Amazon S3 bucket.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Lambda@Edge chạy code tại CloudFront edge location gần user nhất, xử lý dữ liệu rồi gửi vào Kinesis để xử lý streaming real-time, lưu kết quả bền vững ở S3.</li>\n<li><strong>B. ✗</strong> Route 53 (dù dùng Geoproximity routing) chỉ định tuyến DNS đến điểm đến, hoàn toàn không có khả năng tính toán/xử lý dữ liệu tại chỗ như Lambda@Edge.</li>\n<li><strong>C. ✗</strong> Tương tự B, latency-based routing của Route 53 cũng chỉ định tuyến, không xử lý được dữ liệu gần user.</li>\n<li><strong>D. ✗</strong> Lambda@Edge đúng, nhưng Amazon Athena chỉ là dịch vụ query SQL trên S3 (phân tích sau khi dữ liệu đã lưu), không phải dịch vụ xử lý streaming real-time như Kinesis.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Route 53 với các routing policy đặc biệt (Geoproximity, latency-based) nghe có vẻ liên quan đến \"gần user\", nhưng Route 53 chỉ là DNS — hoàn toàn không xử lý được dữ liệu, phải dùng Lambda@Edge mới có khả năng chạy code.</p>","tip":"<p>Xử lý dữ liệu/code ngay tại vị trí gần user nhất (edge) → <strong>Lambda@Edge</strong> (tích hợp CloudFront). Xử lý streaming dữ liệu real-time → <strong>Kinesis</strong> (không phải Athena, vốn chỉ query dữ liệu đã lưu).</p>"},
{"id":15,"topic":"Design Resilient Architectures – DynamoDB Global Table + Route 53 Failover + Well-Architected Tool","supplement":false,"stem":"<p>A company is running a web application on AWS. The application is made up of an Auto-Scaling group that sits behind an Application Load Balancer and an Amazon DynamoDB table where user data is stored. The solutions architect must design the application to remain available in the event of a regional failure. A solution to automatically monitor the status of your workloads across your AWS account, conduct architectural reviews and check for AWS best practices.</p><p>Which configuration meets the requirement with the least amount of downtime possible?</p>","options":[{"html":"In a secondary region, create a global table of the DynamoDB table and replicate the auto-scaling group and application load balancer. Use Route 53 DNS failover to automatically route traffic to the resources in the secondary region. Set up the AWS Well-Architected Tool to easily get recommendations for improving your workloads based on the AWS best practices","correct":true},{"html":"Write a CloudFormation template that includes the auto-scaling group, application load balancer, and DynamoDB table. In the event of a failure, deploy the template in a secondary region. Configure Amazon EventBridge (Amazon CloudWatch Events) to trigger a Lambda function that updates the application's Route 53 DNS record. Launch an Amazon Managed Grafana workspace to automatically receive tips and action items for improving your workloads based on the AWS best practices","correct":false},{"html":"Write a CloudFormation template that includes the auto-scaling group, application load balancer, and DynamoDB table. In the event of a failure, deploy the template in a secondary region. Use Route 53 DNS failover to automatically route traffic to the resources in the secondary region. Set up and configure the Amazon Managed Service for Prometheus service to receive insights for improving your workloads based on the AWS best practices.","correct":false},{"html":"In a secondary region, create a global secondary index of the DynamoDB table and replicate the auto-scaling group and application load balancer. Use Route 53 DNS failover to automatically route traffic to the resources in the secondary region. Set up the AWS Compute Optimizer to automatically get recommendations for improving your workloads based on the AWS best practices","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần kiến trúc chịu được <strong>mất toàn bộ 1 region</strong>, downtime tối thiểu, và có công cụ review kiến trúc theo best practices.</li>\n<li><strong>Yêu cầu chính:</strong> Hạ tầng phải <strong>đã sẵn sàng (pre-provisioned)</strong> ở region phụ, không phải deploy khi sự cố mới xảy ra; dùng đúng công cụ review (Well-Architected Tool).</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"least amount of downtime\" → hạ tầng phải chạy sẵn ở region phụ (không phải CloudFormation deploy lúc xảy ra sự cố); DynamoDB multi-region → <strong>Global Table</strong> (không phải GSI, vốn chỉ trong cùng 1 region).</li>\n</ul>","answer":"<ul>\n<li><strong>In a secondary region, create a global table of the DynamoDB table and replicate the auto-scaling group and application load balancer. Use Route 53 DNS failover to automatically route traffic to the resources in the secondary region. Set up the AWS Well-Architected Tool to easily get recommendations for improving your workloads based on the AWS best practices.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Global Table đồng bộ dữ liệu DynamoDB giữa 2 region; hạ tầng compute (ASG, ALB) đã có sẵn ở region phụ; Route 53 failover chuyển traffic ngay khi phát hiện sự cố → downtime tối thiểu. Well-Architected Tool đúng công cụ để review best practices.</li>\n<li><strong>B. ✗</strong> Chỉ deploy CloudFormation <strong>sau khi</strong> sự cố xảy ra sẽ mất thời gian provisioning (nhiều phút), không đạt \"least downtime\"; Managed Grafana chỉ là công cụ visualize, không đưa ra khuyến nghị best practices.</li>\n<li><strong>C. ✗</strong> Tương tự B, hạ tầng chỉ được tạo sau sự cố nên downtime lớn; Amazon Managed Service for Prometheus chỉ là dịch vụ giám sát container metrics, không liên quan đến best practices review.</li>\n<li><strong>D. ✗</strong> Global Secondary Index (GSI) của DynamoDB chỉ tồn tại trong <strong>cùng region</strong> với bảng gốc, không thể dùng để replicate dữ liệu sang region khác — về mặt kỹ thuật không khả thi; Compute Optimizer chỉ gợi ý cấu hình resource, không phải best-practice review toàn diện.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm <strong>Global Secondary Index</strong> (index phụ trong cùng 1 bảng/region) với <strong>Global Table</strong> (replicate dữ liệu đa region) — chỉ Global Table mới đúng cho disaster recovery đa vùng.</p>","tip":"<p>DR đa region với downtime tối thiểu → hạ tầng phải <strong>chạy sẵn</strong> ở region phụ (không deploy lúc có sự cố) + DynamoDB dùng <strong>Global Table</strong> (không phải GSI) + Route 53 failover. Review kiến trúc theo best practices → <strong>AWS Well-Architected Tool</strong>.</p>"},
{"id":16,"topic":"Design Resilient Architectures – Fault tolerance qua nhiều AZ","supplement":false,"stem":"<p>A large multinational investment bank has a web application that requires a minimum of 4 EC2 instances to run to ensure that it can cater to its users across the globe. You are instructed to ensure fault tolerance of this system.</p><p>Which of the following is the best option?</p>","options":[{"html":"Deploy an Auto Scaling group with 1 instance in each of 4 Availability Zones behind an Application Load Balancer.","correct":false},{"html":"Deploy an Auto Scaling group with 2 instances in each of 3 Availability Zones behind an Application Load Balancer.","correct":true},{"html":"Deploy an Auto Scaling group with 4 instances in one Availability Zone behind an Application Load Balancer.","correct":false},{"html":"Deploy an Auto Scaling group with 2 instances in each of 2 Availability Zones behind an Application Load Balancer.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Ứng dụng cần <strong>tối thiểu 4 instance chạy luôn luôn</strong> (fault tolerance), kể cả khi 1 AZ gặp sự cố.</li>\n<li><strong>Yêu cầu chính:</strong> Tìm cách phân bổ instance qua các AZ sao cho khi mất 1 AZ vẫn còn ≥4 instance chạy.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Giả lập mất 1 AZ cho từng phương án, kiểm tra số instance còn lại có ≥4 không.</li>\n</ul>","answer":"<ul>\n<li><strong>Deploy an Auto Scaling group with 2 instances in each of 3 Availability Zones behind an Application Load Balancer.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> 1 instance/AZ × 4 AZ: mất 1 AZ → chỉ còn 3 instance, dưới mức tối thiểu 4.</li>\n<li><strong>B. ✓</strong> 2 instance/AZ × 3 AZ = 6 instance; mất 1 AZ → còn 4 instance, vừa đủ mức tối thiểu yêu cầu.</li>\n<li><strong>C. ✗</strong> Toàn bộ 4 instance trong 1 AZ: mất AZ đó → 0 instance còn lại, mất hoàn toàn khả năng phục vụ.</li>\n<li><strong>D. ✗</strong> 2 instance/AZ × 2 AZ = 4 instance; mất 1 AZ → chỉ còn 2 instance, dưới mức tối thiểu.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm \"High Availability\" (chỉ cần còn ít nhất 1 instance chạy) với \"Fault Tolerance\" (phải giữ đúng số lượng instance tối thiểu yêu cầu) — đây là 2 khái niệm khác nhau trong AWS.</p>","tip":"<p>Fault Tolerance = luôn duy trì <strong>đủ số instance tối thiểu</strong> kể cả khi mất 1 AZ. Luôn tính: (số AZ - 1) × instance/AZ ≥ mức tối thiểu yêu cầu.</p>"},
{"id":17,"topic":"Design High-Performing Architectures – DynamoDB Streams trigger Lambda","supplement":false,"stem":"<p>A leading IT consulting company has an application which processes a large stream of financial data by an Amazon ECS Cluster then stores the result to a DynamoDB table. You have to design a solution to detect new entries in the DynamoDB table then automatically trigger a Lambda function to run some tests to verify the processed data.</p><p>What solution can be easily implemented to alert the Lambda function of new entries while requiring minimal configuration change to your architecture?</p>","options":[{"html":"Use Systems Manager Automation to detect new entries in the DynamoDB table then automatically invoke the Lambda function for processing.","correct":false},{"html":"Invoke the Lambda functions using SNS each time that the ECS Cluster successfully processed financial data.","correct":false},{"html":"Use CloudWatch Alarms to trigger the Lambda function whenever a new entry is created in the DynamoDB table.","correct":false},{"html":"Enable DynamoDB Streams to capture table activity and automatically trigger the Lambda function.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần phát hiện entry mới trong DynamoDB table rồi tự động trigger Lambda, với <strong>thay đổi kiến trúc tối thiểu</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn tính năng native của DynamoDB để trigger Lambda khi có thay đổi dữ liệu.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"detect new entries in the DynamoDB table\" + \"minimal configuration change\" → <strong>DynamoDB Streams</strong> tích hợp sẵn với Lambda.</li>\n</ul>","answer":"<ul>\n<li><strong>Enable DynamoDB Streams to capture table activity and automatically trigger the Lambda function.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Systems Manager Automation dùng cho các tác vụ bảo trì/triển khai trên EC2 và resource khác, không có khả năng phát hiện entry mới trong DynamoDB table.</li>\n<li><strong>B. ✗</strong> Phải tạo thêm SNS topic và sửa code ECS để publish message — nhiều thay đổi hơn so với chỉ bật DynamoDB Streams có sẵn.</li>\n<li><strong>C. ✗</strong> CloudWatch Alarms chỉ theo dõi metric của dịch vụ, không theo dõi được sự thay đổi dữ liệu (data changes) bên trong DynamoDB table.</li>\n<li><strong>D. ✓</strong> DynamoDB Streams ghi lại mọi thay đổi (insert/update/delete) của table; chỉ cần bật tính năng này và gắn trigger Lambda — thay đổi cấu hình tối thiểu, không cần sửa code ứng dụng ECS.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> SNS/CloudWatch Alarms nghe hợp lý vì đều có khả năng \"trigger\" cái gì đó, nhưng cả hai đều không theo dõi trực tiếp sự thay đổi <strong>dữ liệu</strong> bên trong DynamoDB table như DynamoDB Streams.</p>","tip":"<p>Cần trigger Lambda ngay khi có thay đổi dữ liệu (insert/update/delete) trong DynamoDB table, ít thay đổi kiến trúc nhất → bật <strong>DynamoDB Streams</strong>.</p>"},
{"id":18,"topic":"Design Secure Architectures – Instance Store-Backed AMI khi terminate","supplement":false,"stem":"<p>A company is using an On-Demand EC2 instance to host a legacy web application that uses an Amazon Instance Store-Backed AMI. The web application should be decommissioned as soon as possible and hence, you need to terminate the EC2 instance.</p><p>When the instance is terminated, what happens to the data on the root volume?</p>","options":[{"html":"Data is automatically saved as an EBS volume.","correct":false},{"html":"Data is automatically saved as an EBS snapshot.","correct":false},{"html":"Data is automatically deleted.","correct":true},{"html":"Data is unavailable until the instance is restarted.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Instance dùng <strong>Instance Store-Backed AMI</strong> (root volume là instance store, không phải EBS), bị terminate.</li>\n<li><strong>Yêu cầu chính:</strong> Xác định số phận dữ liệu trên root volume khi terminate.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Instance store = <strong>ephemeral storage</strong>, dữ liệu gắn liền với vòng đời instance, luôn mất khi instance dừng/terminate.</li>\n</ul>","answer":"<ul>\n<li><strong>Data is automatically deleted.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A, B. ✗</strong> Instance store-backed root volume không tự động chuyển thành EBS volume hay EBS snapshot khi terminate — đây là 2 cơ chế lưu trữ hoàn toàn khác nhau.</li>\n<li><strong>C. ✓</strong> Instance store chỉ tồn tại trong vòng đời instance; khi instance bị terminate (hoặc stop, nếu có thể), toàn bộ dữ liệu trên đó bị xóa vĩnh viễn.</li>\n<li><strong>D. ✗</strong> \"Unavailable until restarted\" ngụ ý dữ liệu vẫn còn nhưng tạm ẩn — sai, vì instance store-backed instance đã terminate thì không thể restart, và dữ liệu đã mất hoàn toàn.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm instance store với EBS — EBS volume (ngay cả loại không phải root) vẫn tồn tại sau khi instance terminate (tùy <code>DeleteOnTermination</code>), nhưng instance store thì luôn mất dữ liệu ngay khi instance dừng hoạt động.</p>","tip":"<p>Instance Store (ephemeral storage) → dữ liệu <strong>luôn bị xóa</strong> khi instance stop/terminate. EBS → dữ liệu có thể giữ lại tùy cấu hình.</p>"},
{"id":19,"topic":"Design Secure Architectures – AWS License Manager quản lý license","supplement":false,"stem":"<p>A food company bought 50 licenses of Windows Server to be used by developers when launching Amazon EC2 instances to deploy and test applications. The company recently adopted AWS Systems Manager Application Manager to group and monitor EC2-based workloads by team.</p><p>The developers are free to provision EC2 instances as long as a license is available. The licenses are tied to the total CPU count of each virtual machine. The company wants to ensure that developers won't be able to launch new instances once the licenses are exhausted, and wants to receive notifications when all licenses are in use.</p><p>Which of the following options is the recommended solution to meet the company's requirements?</p>","options":[{"html":"Upload the licenses on AWS Systems Manager Fleet Manager to be encrypted and distributed to EC2 instances. Attach an IAM role on the EC2 instances to request a license from the Fleet Manager. Set up an Amazon SNS to send notifications and alerts once all licenses are used.","correct":false},{"html":"Configure AWS Resource Access Manager (AWS RAM) to track and control the licenses used by AWS resources. Configure AWS RAM to provide available licenses for EC2 instances. Set up an Amazon SNS to send notifications and alerts once all licenses are used.","correct":false},{"html":"Define license configuration rules on AWS Certificate Manager to track and control license usage. Enable the option to “Enforce certificate limit” to prevent going over the number of allocated licenses. Add an Amazon SQS queue with ChangeVisibility Timeout configured to send notifications and alerts.","correct":false},{"html":"Define licensing rules on AWS License Manager to track and control license usage. Enable the option to “Enforce license limit” to prevent going over the number of allocated licenses. Add an Amazon SNS topic to send notifications and alerts.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần track/enforce giới hạn số lượng license theo CPU count, chặn launch instance khi hết license, và gửi cảnh báo.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng dịch vụ quản lý license (không phải RAM hay Certificate Manager — các dịch vụ khác mục đích hoàn toàn).</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"track and control software/license usage\" → <strong>AWS License Manager</strong>, kèm option \"Enforce license limit\".</li>\n</ul>","answer":"<ul>\n<li><strong>Define licensing rules on AWS License Manager to track and control license usage. Enable the option to “Enforce license limit” to prevent going over the number of allocated licenses. Add an Amazon SNS topic to send notifications and alerts.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Fleet Manager chỉ là một capability của Systems Manager để quản lý node từ xa, không có chức năng quản lý/giới hạn software license.</li>\n<li><strong>B. ✗</strong> AWS RAM dùng để chia sẻ resource giữa các AWS account, hoàn toàn không liên quan đến quản lý license phần mềm.</li>\n<li><strong>C. ✗</strong> AWS Certificate Manager dùng để quản lý SSL/TLS certificate, không phải software license; SQS cũng không phải dịch vụ gửi notification phù hợp (nên dùng SNS).</li>\n<li><strong>D. ✓</strong> License Manager cho phép định nghĩa rule theo dõi usage, bật \"Enforce license limit\" để chặn launch khi hết license, và tích hợp SNS để gửi cảnh báo khi license đầy.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Tên dịch vụ \"Certificate Manager\" và \"Resource Access Manager\" dễ gây nhầm lẫn với \"License Manager\" vì nghe tương tự, nhưng mỗi dịch vụ phục vụ mục đích hoàn toàn khác (SSL certificate, chia sẻ resource, và quản lý license).</p>","tip":"<p>Theo dõi và giới hạn software license (BYOL) khi launch EC2 → <strong>AWS License Manager</strong> với tùy chọn \"Enforce license limit\".</p>"},
{"id":20,"topic":"Design Resilient Architectures – Fault tolerance qua nhiều AZ (Select TWO)","supplement":false,"stem":"<p>A company recently launched an e-commerce application that is running in eu-east-2 region, which strictly requires six EC2 instances running at all times. In that region, there are 3 Availability Zones (AZ) that you can use – eu-east-2a, eu-east-2b, and eu-east-2c.</p><p>Which of the following deployments provide 100% fault tolerance if any single AZ in the region becomes unavailable? (Select TWO.)</p>","options":[{"html":"eu-east-2a with two EC2 instances, eu-east-2b with four EC2 instances, and eu-east-2c with two EC2 instances","correct":false},{"html":"eu-east-2a with three EC2 instances, eu-east-2b with three EC2 instances, and eu-east-2c with three EC2 instances","correct":true},{"html":"eu-east-2a with six EC2 instances, eu-east-2b with six EC2 instances, and eu-east-2c with no EC2 instances","correct":true},{"html":"eu-east-2a with two EC2 instances, eu-east-2b with two EC2 instances, and eu-east-2c with two EC2 instances","correct":false},{"html":"eu-east-2a with four EC2 instances, eu-east-2b with two EC2 instances, and eu-east-2c with two EC2 instances","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần <strong>tối thiểu 6 instance chạy luôn luôn</strong>, kể cả khi mất bất kỳ 1 trong 3 AZ.</li>\n<li><strong>Yêu cầu chính:</strong> Tìm 2 cách phân bổ sao cho mất 1 AZ bất kỳ vẫn còn ≥6 instance.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Giả lập mất từng AZ một, lấy trường hợp xấu nhất (AZ có nhiều instance nhất bị mất) để kiểm tra.</li>\n</ul>","answer":"<ul>\n<li><strong>eu-east-2a with three EC2 instances, eu-east-2b with three EC2 instances, and eu-east-2c with three EC2 instances.</strong></li>\n<li><strong>eu-east-2a with six EC2 instances, eu-east-2b with six EC2 instances, and eu-east-2c with no EC2 instances.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> 2+4+2=8; nếu mất AZ có 4 instance → còn 2+2=4, dưới mức tối thiểu 6.</li>\n<li><strong>B. ✓</strong> 3+3+3=9; mất bất kỳ AZ nào (3 instance) → còn lại 3+3=6, đủ mức tối thiểu.</li>\n<li><strong>C. ✓</strong> 6+6+0=12; mất 1 trong 2 AZ có 6 instance → còn lại đúng 6 instance ở AZ còn lại, đủ mức tối thiểu (AZ thứ 3 vốn đã 0 instance nên không ảnh hưởng thêm).</li>\n<li><strong>D. ✗</strong> 2+2+2=6; mất bất kỳ AZ nào → chỉ còn 2+2=4, dưới mức tối thiểu.</li>\n<li><strong>E. ✗</strong> 4+2+2=8; nếu mất AZ có 4 instance → còn 2+2=4, dưới mức tối thiểu.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Phải luôn kiểm tra <strong>trường hợp xấu nhất</strong> (mất AZ có nhiều instance nhất), không phải chỉ kiểm tra tổng số instance ban đầu — tổng 8 hay 9 instance không có ý nghĩa nếu phân bổ không đều khiến 1 AZ gánh quá nhiều.</p>","tip":"<p>Kiểm tra fault tolerance qua nhiều AZ: luôn giả định AZ <strong>chứa nhiều instance nhất</strong> bị mất, rồi kiểm tra tổng còn lại có ≥ mức tối thiểu yêu cầu không.</p>"}
,
{"id":21,"topic":"Design Cost-Optimized Architectures – Chi phí nào phát sinh trên AWS","supplement":false,"stem":"<p>To save costs, your manager instructed you to analyze and review the setup of your AWS cloud infrastructure. You should also provide an estimate of how much your company will pay for all of the AWS resources that they are using.</p><p>In this scenario, which of the following will incur costs? (Select TWO.)</p>","options":[{"html":"A running EC2 Instance","correct":true},{"html":"EBS Volumes attached to stopped EC2 Instances","correct":true},{"html":"Public Data Set","correct":false},{"html":"A stopped On-Demand EC2 Instance","correct":false},{"html":"Using an Amazon VPC","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Xác định đúng khoản nào thực sự phát sinh phí trên AWS.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn 2 khoản chắc chắn bị tính phí.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Instance <strong>stopped</strong> không tính phí compute, nhưng <strong>EBS volume vẫn tính phí storage</strong> dù instance đang stop; VPC bản thân không tính phí.</li>\n</ul>","answer":"<ul>\n<li><strong>A running EC2 Instance.</strong></li>\n<li><strong>EBS Volumes attached to stopped EC2 Instances.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Instance đang chạy (running) luôn bị tính phí compute theo giờ/giây sử dụng.</li>\n<li><strong>B. ✓</strong> Dù instance đã stop, EBS volume gắn kèm vẫn tồn tại và vẫn bị tính phí lưu trữ (storage).</li>\n<li><strong>C. ✗</strong> Public Data Set do AWS lưu trữ miễn phí cho cộng đồng; bạn chỉ trả phí cho compute/storage riêng khi xử lý dữ liệu đó.</li>\n<li><strong>D. ✗</strong> Instance đã stop không bị tính phí compute/giờ chạy (chỉ EBS gắn kèm mới tính phí, như mục B).</li>\n<li><strong>E. ✗</strong> Bản thân việc tạo và dùng VPC hoàn toàn miễn phí; chỉ các resource chạy bên trong VPC (EC2, NAT Gateway...) mới tính phí riêng.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nghĩ \"stopped instance\" không tính phí gì cả, nhưng cần phân biệt rõ: bản thân <strong>instance ngừng tính phí compute</strong>, còn <strong>EBS volume gắn kèm vẫn tiếp tục tính phí storage</strong> bất kể trạng thái instance.</p>","tip":"<p>EC2 stopped → không tính phí compute, nhưng EBS volume đính kèm vẫn tính phí. VPC, Public Data Set → bản thân không tính phí.</p>"},
