lement to address these requirements in the most secure manner?","opts":["Set up a Network Load Balancer in the private subnet. Create an Auto Scaling group in the public subnet and associate it with the Network Load Balancer","Set up a Network Load Balancer in the private subnet. Create an Auto Scaling group in the private subnet and associate it with the Network Load Balancer","Set up a Network Load Balancer in the public subnet. Create an Auto Scaling group in the public subnet and associate it with the Network Load Balancer","Set up a Network Load Balancer in the public subnet. Create an Auto Scaling group in the private subnet and associate it with the Network Load Balancer"],"ans":[3],"notes":["LB private thì người dùng Internet không truy cập được.","LB private, không public được.","Chạy được nhưng EC2 bị lộ ra Internet.","LB là cửa ngõ duy nhất; EC2 ẩn trong private subnet."],"pattern":"Ma trận 2×2 đặt thành phần vào subnet","why":"Chỉ thứ phải nhận traffic Internet trực tiếp (LB) mới ở public; còn lại ở private.","trap":"Đáp án chạy được nhưng không 'most secure'.","tip":"SG của EC2 chỉ cho phép từ SG của LB. ALB/NLB/CLB đều TLS offload được; NLB giữ source IP.","old":47,"you1":[2],"you2":[3],"q_short":"A public web app runs on EC2 in an Auto Scaling group; the VPC has public and private subnets; TLS must be offloaded from instances. What is MOST secure?"},{"id":44,"domain":"res","topic":"EBS Multi-Attach","q":"An application is hosted on multiple Amazon EC2 instances in the same Availability Zone (AZ). The engineering team wants to set up shared data access for these Amazon EC2 instances using Amazon EBS Multi-Attach volumes.\nWhich Amazon EBS volume type is the correct choice for these Amazon EC2 instances?","opts":["Cold HDD Amazon EBS volumes","Provisioned IOPS SSD Amazon EBS volumes","Throughput Optimized HDD Amazon EBS volumes","General-purpose SSD-based Amazon EBS volumes"],"ans":[1],"you2":[1],"notes":["Không hỗ trợ.","Chỉ io1/io2 hỗ trợ Multi-Attach, trong cùng AZ.","Không hỗ trợ.","Không hỗ trợ."],"pattern":"Recall giới hạn tính năng","why":"Multi-Attach chỉ có ở Provisioned IOPS SSD.","trap":"—","tip":"Ứng dụng phải tự xử lý ghi đồng thời (cluster-aware file system). Cần chia sẻ đa AZ → EFS.","old":null,"you1":null,"q_short":"Multiple EC2 instances in the same AZ need shared access to one EBS volume via Multi-Attach. Which volume type?"},{"id":45,"domain":"perf","topic":"SQS Temporary Queue","q":"A development team is looking for a solution that saves development time and deployment costs for an application that uses a high-throughput request-response message pattern.\nWhich of the following Amazon SQS queue types is the best fit to meet this requirement?","opts":["Amazon Simple Queue Service (Amazon SQS) dead-letter queues","Amazon Simple Queue Service (Amazon SQS) FIFO queues","Amazon Simple Queue Service (Amazon SQS) delay queues","Amazon Simple Queue Service (Amazon SQS) temporary queues"],"ans":[3],"notes":["Chứa message xử lý lỗi nhiều lần.","Thứ tự + exactly-once; throughput bị giới hạn, đi ngược 'high-throughput'.","Trì hoãn message mới.","Virtual queue ghép lên một queue thật; tạo/xóa miễn phí; hợp với request-response."],"pattern":"Từ khóa → tính năng","why":"'Request-response' là từ khóa của Temporary Queue Client (virtual queues).","trap":"Chọn FIFO vì nổi tiếng dù đề không nhắc thứ tự hay trùng lặp.","tip":"request-response → Temporary. order/exactly-once → FIFO. postpone → Delay. lỗi nhiều lần → DLQ. giảm gọi rỗng → Long polling.","old":33,"you1":[1],"you2":[3],"q_short":"A team wants to save development time and deployment cost for an app using a high-throughput request-response message pattern. Which SQS queue type fits best?"},{"id":46,"domain":"cost","topic":"Budgets — Savings Plans coverage","q":"A tech enterprise operates several workloads using Amazon EC2, AWS Fargate, and AWS Lambda across various teams. To optimize compute costs, the company has purchased Compute Savings Plans. The cloud operations team needs to implement a solution that not only monitors utilization but also sends automated alerts when coverage levels of the Compute Savings Plans fall below a defined threshold.\nWhat is the MOST operationally efficient way to achieve this?","opts":["Create a standalone dashboard in Amazon CloudWatch to track EC2 and Fargate usage. Use metric math to estimate coverage and trigger alarms","Use AWS Budgets to create a daily coverage budget specifically for Compute Savings Plans. Define a coverage threshold and configure notifications to alert relevant stakeholders","Configure a custom script that queries the Savings Plans utilization API and pushes results to an Amazon S3 bucket. Use Amazon QuickSight to visualize coverage and email reports weekly","Enable Compute Optimizer recommendations for EC2 and Fargate. Configure automatic notifications for cost optimization opportunities and Savings Plans coverage drops"],"ans":[1],"notes":["CloudWatch không có metric coverage của Savings Plans.","Loại budget có sẵn, chỉ cần đặt ngưỡng và thông báo.","Tự viết code, báo cáo hàng tuần, không phải alert.","Compute Optimizer dùng để right-size, không theo dõi coverage."],"pattern":"Chọn công cụ Cost Management","why":"AWS Budgets có sẵn loại 'Savings Plans coverage'.","trap":"Compute Optimizer nghe liên quan đến tối ưu chi phí compute nhưng sai chức năng.","tip":"Utilization thấp = mua thừa. Coverage thấp = mua thiếu. Budgets có 6 loại: cost, usage, RI utilization/coverage, SP utilization/coverage.","old":38,"you1":[1],"you2":[1],"q_short":"A company bought Compute Savings Plans and needs automated alerts when Savings Plans coverage drops below a threshold. What is MOST operationally efficient?"},{"id":47,"domain":"res","topic":"RDS Multi-AZ","multi":true,"q":"The engineering team at a retail company is planning to migrate to AWS Cloud from the on-premises data center. The team is evaluating Amazon Relational Database Service (Amazon RDS) as the database tier for its flagship application. The team has hired you as an AWS Certified Solutions Architect Associate to advise on Amazon RDS Multi-AZ capabilities.\nWhich of the following would you identify as correct for Amazon RDS Multi-AZ? (Select two)","opts":["Amazon RDS applies operating system updates by performing maintenance on the standby, then promoting the standby to primary and finally performing maintenance on the old primary, which becomes the new standby","Updates to your database Instance are asynchronously replicated across the Availability Zone to the standby in order to keep both in sync","For automated backups, I/O activity is suspended on your primary database since backups are not taken from standby database","To enhance read scalability, a Multi-AZ standby instance can be used to serve read requests","Amazon RDS automatically initiates a failover to the standby, in case primary database fails for any reason"],"ans":[0,4],"notes":["Đúng (rolling cho OS patch; nâng engine version thì cả 2 cùng lúc, có downtime).","Sai một từ: phải là synchronously.","Tráo ngược: backup lấy từ standby nên I/O primary không bị dừng.","Standby (DB instance truyền thống) không đọc được.","Đúng; DNS endpoint giữ nguyên."],"pattern":"Đặc điểm + bẫy tráo từ khóa","why":"Multi-AZ: sync replication, auto failover, rolling OS patch, backup từ standby.","trap":"Tráo sync ↔ async, tráo lợi ích thành nhược điểm.","tip":"Multi-AZ = sync, HA. Read Replica = async, scale đọc. Multi-AZ DB cluster (mới) có reader đọc được.","old":49,"you1":[0,1],"you2":[0,4],"q_short":"Which TWO statements about Amazon RDS Multi-AZ are correct?"},{"id":48,"domain":"cost","topic":"S3 Storage Class Analysis","q":"The data engineering team at a company wants to analyze Amazon S3 storage access patterns to decide when to transition the right data to the right storage class.\nWhich of the following represents a correct option regarding the capabilities of Amazon S3 Analytics storage class analysis?","opts":["Storage class analysis only provides recommendations for Standard to Standard One-Zone IA classes","Storage class analysis only provides recommendations for Standard to Glacier Flexible Retrieval classes","Storage class analysis only provides recommendations for Standard to Standard IA classes","Storage class analysis only provides recommendations for Standard to Glacier Deep Archive classes"],"ans":[2],"notes":["Sai.","Sai.","Đúng: chỉ Standard → Standard-IA.","Sai."],"pattern":"Recall giới hạn tính năng","why":"Storage Class Analysis quan sát tần suất truy cập để gợi ý khi nào chuyển Standard → Standard-IA.","trap":"Nghĩ nó gợi ý cả Glacier.","tip":"Không biết pattern → Intelligent-Tiering. Biết rõ số ngày → Lifecycle. Toàn tổ chức → Storage Lens.","old":40,"you1":[1],"you2":[2],"q_short":"Which statement about Amazon S3 Analytics storage class analysis is correct?"},{"id":49,"domain":"sec","topic":"AWS Firewall Manager","multi":true,"q":"The engineering team at a multi-national company uses AWS Firewall Manager to centrally configure and manage firewall rules across its accounts and applications using AWS Organizations.\nWhich of the following AWS resources can the AWS Firewall Manager configure rules on? (Select three)","opts":["AWS Shield Advanced","VPC Security Group","Amazon Inspector","VPC Route Table","AWS Web Application Firewall (AWS WAF)","Amazon GuardDuty"],"ans":[0,1,4],"notes":["Có, bảo vệ DDoS.","Có.","Quét lỗ hổng, không phải firewall.","Định tuyến, không chặn traffic.","Có.","Phát hiện mối đe dọa, không phải firewall."],"pattern":"Recall: dịch vụ X quản lý được gì","why":"Firewall Manager chỉ quản lý thứ có 'luật chặn/cho phép traffic'.","trap":"Lẫn nhóm 'phát hiện' (GuardDuty, Inspector) với nhóm 'chặn'.","tip":"FMS hỗ trợ: WAF, Shield Advanced, Security Group, Network Firewall, Route 53 Resolver DNS Firewall, firewall bên thứ 3, và (bản mới) Network ACL. Cần Organizations + AWS Config.","old":31,"you1":[0,1,4],"you2":[0,1,4],"q_short":"Which THREE resources can AWS Firewall Manager configure rules on?"},{"id":50,"domain":"perf","topic":"Kinesis + Fargate","multi":true,"q":"A company's real-time streaming application is running on AWS. As the data is ingested, a job runs on the data and takes 30 minutes to complete. The workload frequently experiences high latency due to large amounts of incoming data. A solutions architect needs to design a scalable and serverless solution to enhance performance.\nWhich combination of steps should the solutions architect take? (Select two)","opts":["Set up AWS Database Migration Service (AWS DMS) to ingest the data","Provision Amazon EC2 instances in an Auto Scaling group to process the data","Set up Amazon Kinesis Data Streams to ingest the data","Set up AWS Lambda with AWS Step Functions to process the data","Set up AWS Fargate with Amazon ECS to process the data"],"ans":[2,4],"notes":["DMS dùng để migrate DB, không phải streaming ingest.","Không serverless.","Streaming real-time, scale tốt.","Lambda tối đa 15 phút, job 30 phút không chạy được.","Container serverless, không giới hạn thời gian chạy."],"pattern":"Pipeline 2 tầng: ingest + process, có con số thời gian ẩn","why":"Ingest bằng KDS, xử lý job dài bằng Fargate; cả hai serverless và scale được.","trap":"Step Functions không kéo dài timeout của từng Lambda.","tip":"Lambda 15 phút (function thường); API Gateway 29 giây (mặc định); SQS lưu tối đa 14 ngày; KDS lưu tối đa 365 ngày; Step Functions Standard tối đa 1 năm.","old":32,"you1":[2,4],"you2":[2,4],"q_short":"A real-time streaming app runs a 30-minute job on ingested data and suffers high latency under large data volumes. The architect needs a scalable, serverless solution. Which TWO steps?"},{"id":51,"domain":"sec","topic":"Security Group vs NACL","q":"A developer has configured inbound traffic for the relevant ports in both the Security Group of the Amazon EC2 instance as well as the network access control list (network ACL) of the subnet for the Amazon EC2 instance. The developer is, however, unable to connect to the service running on the Amazon EC2 instance.\nAs a solutions architect, how will you fix this issue?","opts":["IAM Role defined in the Security Group is different from the IAM Role that is given access in the network access control list (network ACL)","Network access control list (network ACL) are stateful, so allowing inbound traffic to the necessary ports enables the connection. Security Groups are stateless, so you must allow both inbound and outbound traffic","Rules associated with network access control list (network ACL) should never be modified from command line. An attempt to modify rules from command line blocks the rule and results in an erratic behavior","Security Groups are stateful, so allowing inbound traffic to the necessary ports enables the connection. Network access control list (network ACL) are stateless, so you must allow both inbound and outbound traffic"],"ans":[3],"you2":[3],"notes":["Bịa: SG và NACL không có IAM role.","Đảo ngược.","Bịa: NACL sửa bằng CLI bình thường (phần giải thích của đề nói sai chỗ này).","Đúng: NACL phải mở outbound cho cổng ephemeral (1024–65535)."],"pattern":"Phân biệt khái niệm gần nhau","why":"NACL stateless → phải cho phép chiều trả về (outbound, cổng ephemeral).","trap":"Tráo stateful ↔ stateless.","tip":"SG: stateful, chỉ allow, gắn ENI. NACL: stateless, allow + deny, gắn subnet, xét rule theo số thứ tự.","old":null,"you1":null,"q_short":"Inbound rules allow the service port in both the instance's security group and the subnet's network ACL, yet connections fail. How do you fix it?"},{"id":52,"domain":"sec","topic":"Gateway VPC Endpoints","q":"A company has multiple Amazon EC2 instances operating in a private subnet which is part of a custom VPC. These instances are running an image processing application that needs to access images stored on Amazon S3. Once each image is processed, the status of the corresponding record needs to be marked as completed in a Amazon DynamoDB table.\nHow would you go about providing private access to these AWS resources which are not part of this custom VPC?","opts":["Create a separate interface endpoint for Amazon S3 and Amazon DynamoDB each. Then connect to these services by adding these as targets in the route table of the custom VPC","Create a gateway endpoint for Amazon DynamoDB and add it as a target in the route table of the custom VPC. Create an Origin Access Identity for Amazon S3 and then connect to the S3 service using the private IP address","Create a gateway endpoint for Amazon S3 and add it as a target in the route table of the custom VPC. Create an interface endpoint for Amazon DynamoDB and then add it as a target in the route table of the custom VPC","Create a separate gateway endpoint for Amazon S3 and Amazon DynamoDB each. Add two new target entries for these two gateway endpoints in the route table of the custom VPC"],"ans":[3],"notes":["Sai cơ chế: interface endpoint là ENI + DNS/IP private, không phải target route table.","OAI là tính năng của CloudFront, không liên quan EC2 → S3.","Mảnh DynamoDB sai cơ chế.","Đúng loại, đúng cơ chế, miễn phí."],"pattern":"Ghép 2 mảnh + kiểm tra cơ chế","why":"Gateway Endpoint (chỉ S3 và DynamoDB) hoạt động qua route table, miễn phí.","trap":"OAI/OAC chỉ dùng trong ngữ cảnh CloudFront + S3.","tip":"Gateway = route table, miễn phí, không dùng được từ on-prem. Interface = ENI, có phí, dùng được từ on-prem, có SG.","old":64,"you1":[1],"you2":[3],"q_short":"EC2 instances in a private subnet read images from S3 and update records in DynamoDB. How do you provide private access to these services?"},{"id":53,"domain":"res","topic":"Read Replica sizing","q":"An e-commerce company uses Amazon RDS MySQL DB to store the data. The analytics department at the company runs its reports on the same database. The engineering team has noticed sluggish performance on the database when the analytics reporting process is in progress.\nAs an AWS Certified Solutions Architect - Associate, which of the following would you suggest as the MOST cost-optimal solution to improve the performance?","opts":["Create a read-replica with the same compute capacity and the same storage capacity as the primary. Point the reporting queries to run against the read replica","Create a standby instance in a multi-AZ configuration with the same compute capacity and the same storage capacity as the primary. Point the reporting queries to run against the standby instance","Create a standby instance in a multi-AZ configuration with half compute capacity and half storage capacity as the primary. Point the reporting queries to run against the standby instance","Create a read-replica with half compute capacity and half storage capacity as the primary. Point the reporting queries to run against the read replica"],"ans":[0],"notes":["Khuyến nghị của AWS: cùng cấu hình để theo kịp replication.","Standby không đọc được.","Standby không đọc được.","Replica yếu hơn → lag cao; storage nhỏ hơn có thể không đủ chứa dữ liệu."],"pattern":"Ma trận 2×2","why":"Trục 1: Read Replica (đọc được). Trục 2: cùng cấu hình (theo kịp replication).","trap":"'Half capacity' trông rẻ nhưng không hoạt động tin cậy.","tip":"Lọc 'hoạt động đúng' trước, rồi mới tối ưu chi phí. RDS MySQL/MariaDB/PostgreSQL hỗ trợ tối đa 15 read replica.","old":62,"you1":[0],"you2":[0],"q_short":"Analytics reports on the same RDS MySQL database slow it down. What is the MOST cost-optimal fix?"},{"id":54,"domain":"sec","topic":"CloudFront OAI/OAC","q":"As a Solutions Architect, you would like to completely secure the communications between your Amazon CloudFront distribution and your Amazon S3 bucket which contains the static files for your website. Users should only be able to access the Amazon S3 bucket through Amazon CloudFront and not directly.\nWhat do you recommend?","opts":["Create an origin access identity (OAI) and update the Amazon S3 Bucket Policy","Create a bucket policy to only authorize the IAM role attached to the Amazon CloudFront distribution","Update the Amazon S3 bucket security groups to only allow traffic from the Amazon CloudFront security group","Make the Amazon S3 bucket public"],"ans":[0],"you2":[0],"notes":["Chỉ CloudFront (qua OAI) được đọc bucket.","CloudFront distribution không gắn IAM role.","S3 bucket không có security group.","Ai cũng truy cập trực tiếp được."],"pattern":"Chặn truy cập trực tiếp origin","why":"OAI (hoặc OAC, bản mới khuyến nghị) + bucket policy chỉ cho phép CloudFront.","trap":"S3 'security group' và 'IAM role của CloudFront' đều không tồn tại.","tip":"OAC thay thế OAI, hỗ trợ SSE-KMS và mọi Region. Đây là chỗ OAI xuất hiện ĐÚNG ngữ cảnh (so với Q52).","old":null,"you1":null,"q_short":"Users must access an S3 bucket's static website files only through CloudFront, not directly. What do you recommend?"},{"id":55,"domain":"perf","topic":"Kinesis Data Streams on-demand","q":"A digital media company wants to track user engagement across its streaming platform by capturing events such as video starts, pauses, and search queries. These events must be ingested and analyzed in real time to improve user experience and optimize recommendations. The platform experiences unpredictable spikes in traffic during popular content releases. The company needs a highly scalable and serverless solution that can seamlessly adjust to changing workloads without manual provisioning.\nWhich solution will meet these requirements in the MOST efficient and scalable way?","opts":["Deploy a fleet of Amazon EC2 instances running Apache Kafka to ingest clickstream data. Set up custom scripts to manually scale the Kafka cluster based on CPU usage. Use Amazon Athena to run periodic queries on stored clickstream logs","Use Amazon Kinesis Data Firehose to ingest user events. Set the destination as Amazon S3. Use Amazon Athena with scheduled queries to analyze the data periodically","Use an Amazon Kinesis Data Streams stream in on-demand capacity mode to ingest user engagement data. Configure an AWS Lambda function as a consumer to process the events in real time","Use Amazon Simple Notification Service (Amazon SNS) to publish clickstream events. Subscribe an Amazon SQS standard queue to receive the events. Process the events in batches with AWS Glue jobs scheduled at fixed intervals"],"ans":[2],"notes":["Tự quản lý, scale thủ công.","Firehose buffer (near real-time) + Athena định kỳ = batch, không phải real-time analysis.","Real-time, on-demand tự scale, Lambda serverless.","Glue là ETL batch, chạy định kỳ."],"pattern":"Kiểm tra toàn bộ chuỗi pipeline","why":"Phải real-time ở cả ingest lẫn xử lý; KDS on-demand + Lambda đáp ứng.","trap":"Nửa đầu (Firehose) nghe hợp lý nhưng mắt xích 'scheduled/periodic' là batch.","tip":"Real-time + tự xử lý → KDS. Deliver vào S3/Redshift/OpenSearch không code → Firehose. Unpredictable traffic → on-demand mode.","old":36,"you1":[1],"you2":[2],"q_short":"A streaming platform must ingest and analyze user events (play, pause, search) in real time, with unpredictable spikes, using a highly scalable serverless solution without manual provisioning. Which solution is MOST efficient?"},{"id":56,"domain":"sec","topic":"Dedicated Instances","q":"A healthcare company wants to run its applications on single-tenant hardware to meet compliance guidelines.\nWhich of the following is the MOST cost-effective way of isolating the Amazon EC2 instances to a single tenant?","opts":["Dedicated Instances","Dedicated Hosts","Spot Instances","On-Demand Instances"],"ans":[0],"notes":["Phần cứng riêng, tính tiền theo instance, rẻ hơn Dedicated Host.","Cũng single-tenant nhưng trả cho cả host; dành cho BYOL / kiểm soát socket-core.","Shared tenancy.","Shared tenancy."],"pattern":"Lọc ràng buộc cứng → tối ưu chi phí","why":"Single-tenant + rẻ nhất → Dedicated Instances.","trap":"Nhầm trục thanh toán (Spot/On-Demand) với trục tenancy.","tip":"BYOL, per-socket/per-core license, kiểm soát placement → Dedicated Host.","old":57,"you1":[0],"you2":[0],"q_short":"A healthcare company must run EC2 on single-tenant hardware for compliance. What is MOST cost-effective?"},{"id":57,"domain":"cost","topic":"RDS Read Replica","q":"Your e-commerce application is using an Amazon RDS PostgreSQL database and an analytics workload also runs on the same database. When the analytics workload is run, your e-commerce application slows down which further affects your sales.\nWhich of the following is the MOST cost-optimal solution to fix this issue?","opts":["Create a Read Replica in another Region as the Master database and point the analytics workload there","Migrate the analytics application to AWS Lambda","Enable Multi-AZ for the Amazon RDS database and run the analytics workload on the standby database","Create a Read Replica in the same Region as the Master database and point the analytics workload there"],"ans":[3],"notes":["Giải quyết được hiệu năng nhưng phải trả phí truyền dữ liệu inter-Region.","Lambda vẫn query vào cùng DB chính, DB vẫn quá tải.","Standby của Multi-AZ (DB instance) không đọc được, chỉ dùng để failover.","Tách tải đọc sang replica; replicate trong cùng Region không mất phí data transfer."],"pattern":"Tách tải đọc + tối ưu chi phí","why":"Analytics chỉ đọc nên tách sang Read Replica. Cùng Region thì không tốn phí replicate, nên rẻ nhất.","trap":"Cả hai đáp án Read Replica đều sửa được hiệu năng; chỉ khác nhau ở chi phí. Đề hỏi cost-optimal thì chọn cùng Region.","tip":"Multi-AZ = HA (sync, không đọc được). Read Replica = scale đọc (async, đọc được). Cross-Region replica dùng cho DR hoặc người dùng ở xa.","old":21,"you1":[0],"you2":[3],"q_short":"An e-commerce app and an analytics workload share one Amazon RDS PostgreSQL database. When analytics runs, the app slows down. What is the MOST cost-optimal fix?"},{"id":58,"domain":"sec","topic":"Site-to-Site VPN","q":"A retail company needs a secure connection between its on-premises data center and AWS Cloud. This connection does not need high bandwidth and will handle a small amount of traffic. The company wants a quick turnaround time to set up the connection.\nWhat is the MOST cost-effective way to establish such a connection?","opts":["Set up an AWS Site-to-Site VPN connection","Set up AWS Direct Connect","Set up an Internet Gateway between the on-premises data center and AWS cloud","Set up a bastion host on Amazon EC2"],"ans":[0],"notes":["Nhanh, rẻ, mã hóa IPsec.","Mất vài tuần đến hơn 1 tháng, đắt.","IGW chỉ cho VPC ra Internet.","Bastion để SSH vào instance private."],"pattern":"VPN hay Direct Connect","why":"Quick + cheap + low traffic + secure → VPN.","trap":"—","tip":"DX + cần mã hóa → VPN over DX hoặc MACsec. VPN làm backup cho DX. Client VPN cho laptop cá nhân.","old":43,"you1":[0],"you2":[0],"q_short":"A company needs a secure on-premises ↔ AWS connection with low bandwidth, small traffic and a quick setup. What is MOST cost-effective?"},{"id":59,"domain":"sec","topic":"Root email + Alternate Contacts","q":"A global enterprise has onboarded multiple departments into isolated AWS accounts that are part of a unified AWS Organizations structure. Recently, a critical operational alert was missed because it was delivered to the root user’s email address of an account, which is only monitored intermittently. The enterprise wants to redesign its notification handling process to ensure that future communications - categorized by billing, security, and operational relevance - are received promptly by the appropriate teams. The solution should align with AWS security best practices and offer centralized oversight without depending on individual users.\nWhich solution meets these requirements in the most secure and scalable way?","opts":["Set up a centralized email forwarding service with rules that inspect notification content and forward emails to the appropriate team based on keywords such as “billing,” “security,” or “operations.” Keep the current root email addresses as they are, and rely on this service to triage alerts","Assign each AWS account’s root user email to a single designated member of the respective department (e.g., security lead or billing analyst). Encourage these individuals to monitor the email accounts regularly. Also configure alternate contacts with the same individual email addresses","Change each AWS account’s root email to a unique departmental email list and configure IAM notification settings to send alerts based on service type. Do not use AWS alternate contacts since notifications are already routed by service in the IAM console","Configure each AWS account’s root user to use an alias that redirects messages to a centralized mailbox monitored by platform administrators. Then assign alternate contacts for each account using company-managed distribution lists for billing, security, and operations to handle service-specific notifications"],"ans":[3],"notes":["Tự chế, lọc keyword dễ sai.","Phụ thuộc cá nhân, single point of failure.","'IAM notification settings' không tồn tại.","Native, tập trung, không phụ thuộc cá nhân."],"pattern":"Best practice vận hành / governance","why":"Root email dạng alias tập trung + Alternate Contacts theo 3 loại.","trap":"Tính năng bịa ('IAM notification settings').","tip":"Root: MFA, không access key, không dùng hàng ngày. Organizations quản lý alternate contacts tập trung được.","old":46,"you1":[3],"you2":[3],"q_short":"A critical alert was missed because it went to a rarely-monitored root email. Notifications (billing, security, operations) must reach the right teams, securely, centrally, without depending on individuals. What should be done?"},{"id":60,"domain":"cost","topic":"S3 Intelligent-Tiering","q":"The engineering team at a social media company has noticed that while some of the images stored in Amazon S3 are frequently accessed, others sit idle for a considerable span of time.\nAs a solutions architect, what is your recommendation to build the MOST cost-effective solution?","opts":["Store the images using the Amazon S3 Standard-IA storage class","Create a data monitoring application on an Amazon EC2 instance in the same region as the bucket storing the images. The application is triggered daily via Amazon CloudWatch and it changes the storage class of infrequently accessed objects to Amazon S3 Standard-IA and the frequently accessed objects are migrated to Amazon S3 Standard class","Store the images using the Amazon S3 Intelligent-Tiering storage class","Create a data monitoring application on an Amazon EC2 instance in the same region as the bucket storing the images. The application is triggered daily via Amazon CloudWatch and it changes the storage class of infrequently accessed objects to Amazon S3 One Zone-IA and the frequently accessed objects are migrated to Amazon S3 Standard class"],"ans":[2],"you2":[0],"notes":["Ảnh truy cập thường xuyên sẽ tốn phí retrieval cao.","Tự xây ứng dụng, tốn công và tiền EC2.","Tự chuyển tier theo truy cập thực tế, không phí retrieval.","Tự xây + One Zone-IA kém bền."],"pattern":"Chọn storage class theo pattern truy cập","why":"Pattern truy cập hỗn hợp / không đoán trước → Intelligent-Tiering.","trap":"Chọn Standard-IA vì 'nhiều ảnh ít truy cập', quên phí retrieval của ảnh hay truy cập.","tip":"Intelligent-Tiering: không có phí retrieval, có phí monitoring nhỏ mỗi object; object < 128 KB không được chuyển tier.","old":null,"you1":null,"q_short":"Some images in S3 are accessed frequently while others sit idle for long periods. What is MOST cost-effective?"},{"id":61,"domain":"res","topic":"Aurora Global Database","q":"A financial services firm operates a mission-critical transaction processing platform hosted in the AWS us-east-2 Region. The backend is powered by a MySQL-compatible Amazon Aurora cluster, with high transaction volumes throughout the day. As part of its business continuity planning, the firm has selected us-west-2 as its designated disaster recovery (DR) Region.\nThe firm has defined strict DR objectives:\nRecovery Point Objective (RPO): ≤ 5 minutes\nRecovery Time Objective (RTO): ≤ 15 minutes\nLeadership has asked for a DR solution that ensures fast cross-regional failover with minimal operational overhead and configuration effort. What do you recommend?","opts":["Create an Aurora read replica in us-west-2 with equivalent capacity to the primary cluster's writer node in us-east-2. Monitor replication health and configure a manual promotion process for failover","Deploy a separate Aurora cluster in us-west-2, and use scheduled AWS Lambda functions with custom scripts to export and import snapshots from us-east-2 every 5 minutes","Convert the Aurora cluster to an Aurora global database, with the secondary cluster deployed in us-west-2. Rely on Aurora global database managed failover to meet RTO and RPO objectives","Provision a separate Aurora MySQL-compatible cluster in us-west-2, and configure AWS Database Migration Service (AWS DMS) to replicate data from the primary database to the DR cluster continuously. Perform manual failover during DR events"],"ans":[2],"notes":["Promote thủ công, tăng overhead và rủi ro.","Snapshot quá chậm cho RPO 5 phút; tự viết script.","Lag thường < 1 giây; managed failover thường khoảng 1 phút (không cam kết cứng).","DMS không phải công cụ DR; failover thủ công."],"pattern":"DR với con số RPO/RTO","why":"Aurora Global Database đáp ứng dư RPO/RTO và native.","trap":"Mọi đáp án có 'manual' / 'custom scripts' đều vi phạm 'minimal overhead'.","tip":"Backup & Restore < Pilot Light < Warm Standby < Multi-Site (chi phí tăng, RPO/RTO giảm). Aurora → Global DB. DynamoDB → Global Tables. EC2 → Elastic Disaster Recovery.","old":37,"you1":[2],"you2":[2],"q_short":"A financial firm runs Aurora MySQL in us-east-2 with DR in us-west-2. RPO ≤ 5 min, RTO ≤ 15 min, fast cross-Region failover with minimal operational overhead. What do you recommend?"},{"id":62,"domain":"cost","topic":"Replication over private IP","q":"You have deployed a database technology that has a synchronous replication mode to survive disasters in data centers. The database is therefore deployed on two Amazon EC2 instances in two Availability Zones (AZs). The database must be publicly available so you have deployed the Amazon EC2 instances in public subnets. The replication protocol currently uses the Amazon EC2 public IP addresses.\nWhat can you do to decrease the replication cost?","opts":["Assign elastic IP address (EIP) to the Amazon EC2 instances and use them for the replication","Create a Private Link between the two Amazon EC2 instances","Use the Amazon EC2 instances private IP for the replication","Use an Elastic Fabric Adapter (EFA)"],"ans":[2],"you2":[0],"notes":["EIP vẫn là IP public, traffic vẫn tính theo đường public.","PrivateLink để expose service qua NLB, không dùng cho 2 instance cùng VPC.","Traffic ở trong VPC, rẻ nhất.","EFA dành cho HPC, không giảm chi phí."],"pattern":"Tối ưu chi phí data transfer","why":"Cùng VPC thì dùng IP private để không bị tính như traffic public.","trap":"EIP chỉ là IP public tĩnh, không đổi đường đi của traffic.","tip":"Traffic cross-AZ qua IP private vẫn có phí (~$0.01/GB mỗi chiều) nhưng rẻ hơn IP public. Cùng AZ qua IP private: miễn phí.","old":null,"you1":null,"q_short":"A database replicates synchronously between two EC2 instances in two AZs (public subnets) using their public IPs. How do you reduce replication cost?"},{"id":63,"domain":"sec","topic":"WAF rate-based rule","q":"Your application is deployed on Amazon EC2 instances fronted by an Application Load Balancer. Recently, your infrastructure has come under attack. Attackers perform over 100 requests per second, while your normal users only make about 5 requests per second.\nHow can you efficiently prevent attackers from overwhelming your application?","opts":["Define a network access control list (network ACL) on your Application Load Balancer","Use AWS Shield Advanced and setup a rate-based rule","Use an AWS Web Application Firewall (AWS WAF) and setup a rate-based rule","Configure Sticky Sessions on the Application Load Balancer"],"ans":[2],"notes":["NACL gắn subnet, không đếm tốc độ request.","Rate-based rule là tính năng của WAF, không phải Shield.","Tự chặn IP vượt ngưỡng request.","Chỉ giữ session, không chặn gì."],"pattern":"Chọn dịch vụ theo loại tấn công","why":"Phân biệt theo tốc độ request per IP → WAF rate-based rule.","trap":"Ghép tính năng của WAF vào Shield.","tip":"SQLi/XSS → WAF managed rules. DDoS L3/L4 → Shield Standard. DDoS lớn + DRT → Shield Advanced. SG không có rule deny.","old":60,"you1":[2],"you2":[2],"q_short":"An app behind an ALB is attacked: attackers send >100 requests/second while normal users send ~5. How do you efficiently stop them?"},{"id":64,"domain":"perf","topic":"ASG scaling on SQS backlog","q":"A retail startup runs a high-traffic order processing system on AWS. The architecture includes a frontend web tier using EC2 instances behind an Application Load Balancer, a processing tier powered by EC2 instances, and a data layer using Amazon DynamoDB. The frontend and processing tiers are decoupled using Amazon SQS. Recently, the engineering team observed that during unpredictable traffic surges, order processing slows down significantly, SQS queue depth increases rapidly, and the processing-tier EC2 instances hit 100% CPU usage.\nWhich solution will help improve the application’s responsiveness and scalability during peak load periods?","opts":["Add Amazon Kinesis Data Streams to buffer order events from the web tier. Configure the processing tier to consume records from the stream and use enhanced fan-out for high throughput","Use scheduled Auto Scaling for the processing tier based on past peak periods. Use average CPU utilization to define scaling thresholds","Use an EC2 Auto Scaling group with a target tracking policy to automatically scale the processing tier. Configure the policy to monitor the ApproximateNumberOfMessages in the SQS queue","Use Amazon EventBridge to schedule batch processing jobs for the queue. Configure the event rule to invoke EC2-based workers every 10 minutes to process messages in the SQS queue"],"ans":[2],"notes":["Sửa tầng ingest (đang chạy tốt); worker vẫn 100% CPU.","Traffic không đoán trước được, scheduled không phù hợp.","Scale worker theo lượng việc đang chờ, đúng root cause.","Biến thành batch, tăng độ trễ."],"pattern":"Tìm nút thắt cổ chai rồi sửa đúng chỗ","why":"Queue vẫn nhận tốt, worker thiếu capacity → scale worker theo backlog.","trap":"Đáp án dùng dịch vụ 'mạnh hơn' nhưng sửa sai tầng.","tip":"AWS khuyến nghị metric 'backlog per instance'. Target tracking thường là đáp án đơn giản nhất. Predictable → scheduled/predictive.","old":41,"you1":[0],"you2":[2],"q_short":"Web tier → SQS → EC2 processing tier → DynamoDB. During unpredictable surges, queue depth rises fast and processing instances hit 100% CPU. What improves responsiveness and scalability?"},{"id":65,"domain":"perf","topic":"S3 Byte-Range Fetch","q":"You are looking to build an index of your files in Amazon S3, using Amazon RDS PostgreSQL. To build this index, it is necessary to read the first 250 bytes of each object in Amazon S3, which contains some metadata about the content of the file itself. There are over 100,000 files in your S3 bucket, amounting to 50 terabytes of data.\nHow can you build this index efficiently?","opts":["Use the Amazon RDS Import feature to load the data from Amazon S3 to PostgreSQL, and run a SQL query to build the index","Create an application that will traverse the Amazon S3 bucket, then use S3 Select Byte Range Fetch parameter to get the first 250 bytes, and store that information in Amazon RDS","Create an application that will traverse the S3 bucket, issue a Byte Range Fetch for the first 250 bytes, and store that information in Amazon RDS","Create an application that will traverse the Amazon S3 bucket, read all the files one by one, extract the first 250 bytes, and store that information in Amazon RDS"],"ans":[2],"notes":["Import dành cho dữ liệu dạng bảng; nạp 50 TB vào DB là vô lý.","Ghép sai tên: S3 Select dùng tham số ScanRange, không có 'Byte Range Fetch'.","GET Object với header Range: bytes=0-249; chỉ tải ~25 MB tổng.","Tải 50 TB, chậm và đắt."],"pattern":"Gắn sai tên tính năng","why":"Byte-Range Fetch là tính năng của GET Object, đọc được một đoạn byte của mọi loại file.","trap":"Hai đáp án gần giống nhau, chỉ khác cụm 'S3 Select'.","tip":"Upload lớn → Multipart. Upload xa → Transfer Acceleration. Lọc dòng CSV/JSON → Athena (S3 Select đã ngừng cho khách mới).","old":54,"you1":[1],"you2":[2],"q_short":"To build an index in RDS PostgreSQL, you must read the first 250 bytes of each of 100,000+ S3 objects (50 TB total). How do you do this efficiently?"}],"domains":{"cost":"Design Cost-Optimized Architectures","res":"Design Resilient Architectures","sec":"Design Secure Architectures","perf":"Design High-Performing Architectures"},"tables":[{"title":"RDS Multi-AZ vs Read Replica","head":["","Multi-AZ (DB instance)","Read Replica"],"rows":[["Mục đích","HA / failover","Scale đọc"],["Replication","Synchronous","Asynchronous"],["Đọc từ bản sao","Không","Có"],["Phạm vi","1 Region, khác AZ","Cùng AZ, khác AZ, khác Region"],["Failover","Tự động, DNS giữ nguyên","Promote thủ công"],["Backup","Lấy từ standby","—"],["Ghi chú","Multi-AZ DB cluster (1 writer + 2 reader) có reader đọc được","Nên cùng cấu hình với primary; cùng Region để không tốn phí replicate"]]},{"title":"S3 storage classes","head":["Class","Truy xuất","Số AZ","Lưu tối thiểu","Dùng khi"],"rows":[["Standard","ms","≥3","—","Truy cập thường xuyên"],["Intelligent-Tiering","ms","≥3","—","Không biết trước pattern"],["Standard-IA","ms","≥3","30 ngày","~1 lần/tháng"],["One Zone-IA","ms","1","30 ngày","Dữ liệu tạo lại được"],["Glacier Instant Retrieval","ms","≥3","90 ngày","~1 lần/quý"],["Glacier Flexible Retrieval","phút → giờ","≥3","90 ngày","1–2 lần/năm"],["Glacier Deep Arc const DOM = DATA.domains;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CODE_LINE = l => /^\s*[{}\[\]]/.test(l) || /^\s*"[^"]+"\s*:/.test(l) || /^\s*"[^"]*"\s*,?\s*$/.test(l) || /^\s*-\s/.test(l) || /^\s*[A-Za-z_][\w-]*:\s*(\S.*)?$/.test(l);
function fmtBlock(s){
  const lines = String(s).split("\n");
  let out = "", i = 0;
  while (i < lines.length){
    if (CODE_LINE(lines[i])){
      let j = i;
      while (j < lines.length && (CODE_LINE(lines[j]) || lines[j].trim()==="")) j++;
      while (j > i && lines[j-1].trim()==="") j--;
      out += `<pre class="code">${esc(lines.slice(i,j).join("\n"))}</pre>`;
      i = j;
    } else {
      let j = i;
      while (j < lines.length && !CODE_LINE(lines[j])) j++;
      out += lines.slice(i,j).map(esc).join("<br>");
      i = j;
    }
  }
  return out;
}
const same = (a,b) => a.length===b.length && [...a].sort().join()===[...b].sort().join();

$("#sub").textContent = `Practice Test #6 · ${DATA.questions.length} câu (đánh số theo Attempt 44) · câu hỏi viết lại đầy đủ, thứ tự đáp án như đề gốc, giải thích tiếng Việt`;
const st = (q,k) => q[k] ? same(q[k], q.ans) : null;
const FILTERS = {
  all: q => true,
  wrong2: q => st(q,"you2") === false,
  ever: q => st(q,"you1") === false || st(q,"you2") === false,
  both: q => st(q,"you1") === false && st(q,"you2") === false,
  new: q => q.old === null,
};

// ---- Tabs
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav.tabs button").forEach(x => x.classList.toggle("on", x===b));
  ["quiz","cheat","method"].forEach(t => $("#tab-"+t).classList.toggle("hidden", t!==b.dataset.tab));
});

// ---- Quiz state
let S = {list:[], i:0, sel:[], done:{}, order:{}};
let timerHandle = null;
function clearTimer(){ if (timerHandle){ clearInterval(timerHandle); timerHandle = null; } }
function startTimer(n){
  clearTimer();
  const on = $("#f-timer") && $("#f-timer").checked;
  if (!on || !n){ S.endAt = null; return; }
  S.endAt = Date.now() + n*120000;
  timerHandle = setInterval(tickTimer, 1000);
  tickTimer();
}
function tickTimer(){
  const el = $("#timer");
  if (!el) return;
  if (S.endAt == null){ el.style.display = "none"; return; }
  el.style.display = "";
  const remain = S.endAt - Date.now();
  if (remain <= 0){
    el.textContent = "Hết giờ!"; el.className = "chip bad";
    clearTimer();
    S.i = S.list.length;
    render();
    return;
  }
  const m = Math.floor(remain/60000), sec = Math.floor((remain%60000)/1000);
  el.textContent = `⏱ ${m}:${String(sec).padStart(2,"0")}`;
  el.className = "chip" + (remain<120000 ? " bad" : remain<600000 ? " warn" : "");
}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function start(){
  const f = $("#f-set").value;
  let qs = DATA.questions.filter(FILTERS[f] || (q => q.domain===f));
  if ($("#f-shq").checked) qs = shuffle(qs);
  S = {list:qs, i:0, sel:[], done:{}, order:{}};
  qs.forEach(q => S.order[q.id] = $("#f-sho").checked ? shuffle(q.opts.map((_,k)=>k)) : q.opts.map((_,k)=>k));
  startTimer(qs.length);
  render();
}

function render(){
  const box = $("#quiz");
  if (!S.list.length){ box.innerHTML = "<p>Không có câu nào trong bộ này.</p>"; return; }
  if (S.i >= S.list.length){ return renderSummary(); }
  const q = S.list[S.i], d = S.done[q.id], order = S.order[q.id];
  const answered = !!d, need = q.ans.length;
  const nDone = Object.keys(S.done).length, nOk = Object.values(S.done).filter(x=>x.ok).length;
  const pctLive = nDone ? Math.round(nOk/nDone*100) : null;
  const liveCls = pctLive===null ? "" : pctLive>=72 ? "ok" : pctLive>=50 ? "warn" : "bad";
  const chip = (k,name) => st(q,k)===null ? "" : (st(q,k) ? `<span class="chip ok">${name}: đúng</span>` : `<span class="chip bad">${name}: sai</span>`);
  const prev = chip("you1","Lần trước") + chip("you2","Attempt 44") + (q.old===null ? '<span class="chip">Câu mới</span>' : "");
  let h = `<div class="meta"><span>Câu ${S.i+1}/${S.list.length} · Q${q.id}</span><span>Đã làm ${nDone} · Đúng ${nOk}${pctLive===null?"":` <span class="chip ${liveCls}">${pctLive}%</span>`}</span></div>
  <div class="progress"><div style="width:${nDone/S.list.length*100}%"></div></div>
  <div><span class="chip">${esc(DOM[q.domain])}</span>${prev}<span class="chip" id="timer"></span></div>
  <div class="qtext">${fmtBlock(q.q)}</div>
  ${need>1 ? `<div class="hint">Chọn ${need} đáp án</div>` : ""}
  <div id="opts">`;
  order.forEach((k,pos) => {
    let cls = "opt";
    if (answered){ if (q.ans.includes(k)) cls += " right"; else if (d.sel.includes(k)) cls += " wrong"; }
    else if (S.sel.includes(k)) cls += " sel";
    h += `<button class="${cls}" data-k="${k}" ${answered?"disabled":""}><span class="k">${L[pos]}</span><div>${fmtBlock(q.opts[k])}${answered?`<span class="note">${esc(q.notes[k])}</span>`:""}</div></button>`;
  });
  h += `</div>`;
  if (answered){
    const fmt = a => a ? a.map(k=>L[order.indexOf(k)]).sort().join(", ") : "chưa có";
    const youTxt = `Lần trước: ${fmt(q.you1)} · Attempt 44: ${fmt(q.you2)}`;
    h += `<div class="verdict ${d.ok?"ok":"bad"}">${d.ok?"Chính xác!":"Chưa đúng."} Đáp án: ${q.ans.map(k=>L[order.indexOf(k)]).sort().join(", ")}</div>
    <div class="explain">
      <p><b>Chủ đề:</b> ${esc(q.topic)} · <b>Dạng:</b> ${esc(q.pattern)}</p>
      <p><b>Vì sao:</b> ${esc(q.why)}</p>
      <p><b>Bẫy:</b> ${esc(q.trap)}</p>
      <p><b>Nhớ:</b> ${esc(q.tip)}</p>
      <p style="color:var(--muted);font-size:.85rem">Bạn đã chọn — ${youTxt}</p>
    </div>`;
  }
  h += `<div class="navrow">
    <button class="btn" id="b-prev" ${S.i===0?"disabled":""}>← Câu trước</button>
    ${answered ? `<button class="btn primary" id="b-next">${S.i===S.list.length-1?"Xem kết quả":"Câu tiếp →"}</button>`
               : `<button class="btn primary" id="b-check" ${S.sel.length!==need?"disabled":""}>Kiểm tra</button>`}
  </div>
  <div class="grid">${S.list.map((x,j)=>{const r=S.done[x.id];return `<button data-j="${j}" class="${j===S.i?"cur":""} ${r?(r.ok?"ok":"bad"):""}">${x.id}</button>`}).join("")}</div>`;
  box.innerHTML = h;
  tickTimer();

  box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const k = +b.dataset.k;
    if (need===1) S.sel = [k];
    else S.sel = S.sel.includes(k) ? S.sel.filter(x=>x!==k) : (S.sel.length<need ? [...S.sel,k] : S.sel);
    render();
  });
  const c = $("#b-check"); if (c) c.onclick = () => { S.done[q.id] = {sel:[...S.sel], ok:same(S.sel,q.ans)}; S.sel=[]; render(); };
  const n = $("#b-next"); if (n) n.onclick = () => { S.i++; S.sel=[]; render(); window.scrollTo({top:0}); };
  $("#b-prev").onclick = () => { S.i--; S.sel=[]; render(); };
  box.querySelectorAll(".grid button").forEach(b => b.onclick = () => { S.i = +b.dataset.j; S.sel=[]; render(); });
}

function renderSummary(){
  clearTimer();
  const ok = S.list.filter(q => S.done[q.id]?.ok), bad = S.list.filter(q => S.done[q.id] && !S.done[q.id].ok), skip = S.list.filter(q => !S.done[q.id]);
  const pct = S.list.length ? Math.round(ok.length/S.list.length*100) : 0;
  let h = `<h2 style="margin-top:0">Kết quả</h2>
  <div class="score"><div><b>${pct}%</b><span>Tỉ lệ đúng</span></div><div><b>${ok.length}</b><span>Đúng</span></div><div><b>${bad.length+skip.length}</b><span>Sai / bỏ qua</span></div></div>
  <p style="color:var(--muted);font-size:.9rem">Đề thật cần khoảng 72% (720/1000) để đậu.</p>`;
  const DOM_ORDER = ["sec","res","perf","cost"];
  const byDom = {};
  S.list.forEach(q => {
    const d = byDom[q.domain] || (byDom[q.domain] = {total:0, ok:0});
    d.total++;
    if (S.done[q.id]?.ok) d.ok++;
  });
  const domRows = DOM_ORDER.filter(k => byDom[k]).map(k => {
    const d = byDom[k], p = d.total ? Math.round(d.ok/d.total*100) : 0;
    return `<tr><td>${esc(DOM[k])}</td><td>${d.ok}/${d.total}</td><td>${p}%</td></tr>`;
  }).join("");
  if (domRows) h += `<h3>Theo domain</h3><div class="tblwrap"><table><thead><tr><th>Domain</th><th>Đúng/Tổng</th><th>Tỉ lệ</th></tr></thead><tbody>${domRows}</tbody></table></div>`;
  if (bad.length || skip.length){
    h += `<h3>Câu cần xem lại</h3><ul class="result-list">` + [...bad,...skip].map(q => `<li><a data-id="${q.id}">Q${q.id}</a> — ${esc(q.topic)}${S.done[q.id]?"":" (bỏ qua)"}</li>`).join("") + `</ul>
    <div class="navrow"><button class="btn primary" id="b-retry">Làm lại các câu này</button><button class="btn" id="b-again">Làm lại toàn bộ</button></div>`;
  } else h += `<div class="navrow"><button class="btn primary" id="b-again">Làm lại</button></div>`;
  $("#quiz").innerHTML = h;
  $("#quiz").querySelectorAll(".result-list a").forEach(a => a.onclick = () => { S.i = S.list.findIndex(q=>q.id===+a.dataset.id); render(); });
  const r = $("#b-retry"); if (r) r.onclick = () => { const ids = new Set([...bad,...skip].map(q=>q.id)); S.list = S.list.filter(q=>ids.has(q.id)); S.i=0; S.done={}; S.sel=[]; startTimer(S.list.length); render(); };
  $("#b-again").onclick = start;
}

$("#b-start").onclick = start;
["#f-set","#f-shq","#f-sho","#f-timer"].forEach(s => $(s).onchange = start);

// ---- Cheat sheet
function renderCheat(filter=""){
  const f = filter.trim().toLowerCase();
  let h = "";
  DATA.tables.forEach(t => {
    const rows = t.rows.filter(r => !f || t.title.toLowerCase().includes(f) || r.join(" ").toLowerCase().includes(f));
    if (!rows.length) return;
    h += `<h3>${esc(t.title)}</h3><div class="tblwrap"><table><thead><tr>${t.head.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  });
  $("#cheat").innerHTML = h || "<p>Không tìm thấy.</p>";
}
$("#cs").oninput = e => renderCheat(e.target.value);

// ---- Method & traps
$("#method").innerHTML = `<h2 style="margin-top:0">Phương pháp làm bài</h2><ol class="method">${DATA.method.map(([t,d])=>`<li><b>${esc(t)}.</b> ${esc(d)}</li>`).join("")}</ol>
<h2>Các bẫy bạn hay mắc</h2><div class="tblwrap"><table><thead><tr><th>Bẫy</th><th>Mô tả</th><th>Câu</th></tr></thead><tbody>${DATA.traps.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

renderCheat();
start();
</script>
