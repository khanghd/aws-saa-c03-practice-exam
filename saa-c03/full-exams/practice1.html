<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Test 1 · SAA-C03</title>
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#eef0f5; --text:#1a1d23; --muted:#646c78;
  --border:#dfe3ea; --accent:#3a5bf0; --accent-hover:#2d49d6; --accent-soft:#e8edfe;
  --ok:#1a8f55; --ok-soft:#e4f6ec; --bad:#d13b3b; --bad-soft:#fcebeb; --warn:#b4790a; --warn-soft:#fff3db;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
    --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
    --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
    --shadow:none; --shadow-sm:none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
  --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
  --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
  --shadow:none; --shadow-sm:none;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.65 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .2s ease,color .2s ease;
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);padding:.1em .4em;border-radius:5px}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 56px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
header.top h1{
  font-size:21px;margin:0;letter-spacing:-.015em;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent-hover));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
header.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:7px 14px;min-width:76px;text-align:center;box-shadow:var(--shadow-sm);transition:border-color .15s ease,transform .15s ease}
.stat:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hover));width:0;transition:width .3s ease}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:16px}
.toolbar select,.btn{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 13px;cursor:pointer;transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent}
.toolbar label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.layout{display:grid;grid-template-columns:264px 1fr;gap:18px;align-items:start}
.side{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;position:sticky;top:14px;box-shadow:var(--shadow)}
.side h2{font-size:12.5px;margin:0 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.cell{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;height:32px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums;position:relative;padding:0;transition:border-color .12s ease,transform .12s ease,background .12s ease}
.cell:hover{border-color:var(--accent);transform:translateY(-1px)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell.dim{opacity:.32}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cell.sup{font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--border);background:var(--surface-2)}
.legend .l-ok::before{background:var(--ok-soft);border-color:var(--ok)}
.legend .l-bad::before{background:var(--bad-soft);border-color:var(--bad)}
.legend .l-flag::before{background:var(--warn);border-radius:50%;border:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.qnum{font-weight:700;font-size:17px;letter-spacing:-.01em}
.chip{font-size:12px;padding:3px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;transition:transform .12s ease}
.chip.sup{background:var(--warn-soft);color:var(--warn)}
.chip.multi{background:var(--surface-2);color:var(--muted);font-weight:500}
.flagbtn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:13px;transition:border-color .15s ease,background .15s ease,transform .15s ease}
.flagbtn:hover{border-color:var(--warn);color:var(--warn);transform:translateY(-1px)}
.flagbtn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.stem{line-height:1.7}
.stem p{margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;padding:11px 13px;cursor:pointer;background:var(--surface);transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.opt:hover{border-color:var(--accent);transform:translateX(2px);box-shadow:var(--shadow-sm)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--surface-2);transition:background .15s ease,border-color .15s ease,color .15s ease}
.opt.multi .key{border-radius:7px}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--border);transform:none;box-shadow:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.tag{font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)} .opt.missed .tag{color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .spacer{flex:1}
.verdict{margin:18px 0 6px;padding:11px 15px;border-radius:11px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.hint{margin-top:16px;border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:9px;padding:11px 15px;background:var(--surface-2)}
.hint h3{margin:0 0 6px;font-size:14px;color:var(--warn)}
details.sec{border:1px solid var(--border);border-radius:11px;margin-top:11px;background:var(--surface);transition:border-color .15s ease}
details.sec>summary{cursor:pointer;padding:11px 15px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"›";display:inline-block;transition:transform .15s ease;color:var(--muted);font-size:18px;line-height:1}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec .body{padding:0 16px 14px}
.body p{margin:7px 0}
.body ul,.body ol{margin:7px 0;padding-left:22px}
.body li{margin:4px 0}
.body table{border-collapse:collapse;width:100%;margin:9px 0;font-size:14px;display:block;overflow-x:auto}
.body th,.body td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
.body th{background:var(--surface-2)}
.sec.s-answer{border-left:3px solid var(--ok)}
.sec.s-tip{border-left:3px solid var(--accent)}
.empty{color:var(--muted);text-align:center;padding:44px 10px}
.kbd{font-size:12px;color:var(--muted);margin-top:14px}
.kbd kbd{font-family:inherit;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface-2)}
.summary h2{margin-top:0}
.summary table{border-collapse:collapse;width:100%;font-size:14px}
.summary th,.summary td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left}
.summary td.n{font-variant-numeric:tabular-nums;text-align:right}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s ease}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .grid{grid-template-columns:repeat(10,1fr)}
}
@media (max-width:480px){
  .wrap{padding:14px 16px 40px}
  .card{padding:16px}
  .grid{grid-template-columns:repeat(8,1fr)}
  .stat{min-width:64px;padding:5px 10px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>AWS SAA-C03 · Practice Test 1 (65 câu)</h1>
      <div class="sub">Đề tiếng Anh · Giải thích tiếng Việt · Tiến độ chỉ lưu trong phiên đang mở</div>
    <p style="margin:4px 0 0"><a href="../index.html" style="color:var(--accent)">&larr; Về trang luyện đề chính</a></p>
    </div>
    <div class="stats">
      <div class="stat"><b id="sDone">0</b><span>Đã làm</span></div>
      <div class="stat ok"><b id="sOk">0</b><span>Đúng</span></div>

      <div class="stat"><b id="sPct">–</b><span>Tỷ lệ đúng</span></div>
    </div>
  </header>
  <div class="progress"><i id="prog"></i></div>

  <div class="toolbar">
    <select id="fFilter" aria-label="Lọc câu hỏi">
      <option value="all">Tất cả câu</option>
      <option value="todo">Chưa làm</option>

    <select id="fTopic" aria-label="Lọc theo chủ đề"><option value="">Mọi chủ đề</option></select>
    <label><input type="checkbox" id="optShuffleQ"> Xáo câu hỏi</label>
    <label><input type="checkbox" id="optShuffleA"> Xáo đáp án</label>
    <label><input type="checkbox" id="optAuto" checked> Hiện giải thích sau khi kiểm tra</label>
    <span style="flex:1"></span>
    <button class="btn" id="btnSummary">Xem kết quả</button>
    <button class="btn ghost" id="btnReset">Làm lại</button>
    <button class="btn ghost" id="btnTheme" title="Đổi giao diện sáng/tối">◐</button>
  </div>

  <div class="layout">
    <aside class="side">
      <h2>Danh sách câu</h2>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span class="l-ok">Đúng</span><span class="l-bad">Sai</span><span>Chưa làm</span><span class="l-flag">Đánh dấu</span>
      </div>
    </aside>
    <main id="main"></main>
  </div>

<script>
const Q = [{"id":1,"topic":"Design Cost-Optimized Architectures – EC2 Purchasing Options (RI + Spot)","supplement":false,"stem":"A company runs a data processing workflow that takes about 60 minutes to complete. The workflow can withstand disruptions and it can be started and stopped multiple times.<br>Which is the most cost-effective solution to build a solution for the workflow?","options":[{"html":"Use Amazon EC2 on-demand instances to run the workflow processes","correct":false},{"html":"Use AWS Lambda function to run the workflow processes","correct":false},{"html":"Use Amazon EC2 spot instances to run the workflow processes","correct":true},{"html":"Use Amazon EC2 reserved instances to run the workflow processes","correct":false}],"multi":1,"analysis":"<p>Chọn chiến lược mua EC2 theo đặc tính tải (ổn định + biến động)</p>","answer":"<p>RI phủ phần baseline ổn định, Spot xử lý phần biến động với giá rẻ hơn On-Demand nhiều — đúng cả cost lẫn elasticity.</p>","explain":"<ul><li><b>A. ✗</b> Spot 100% cho tải cần xử lý liên tục, không gián đoạn là rủi ro — Spot có thể bị thu hồi bất cứ lúc nào.</li><li><b>B. ✗</b> On-Demand cho toàn bộ spike đắt hơn Spot nhiều, không tối ưu chi phí dù vẫn chạy được.</li><li><b>C. ✓</b> RI phủ baseline ổn định + Spot xử lý phần biến động: đúng bản chất tải (nền ổn định, đỉnh biến động, chịu được gián đoạn).</li><li><b>D. ✗</b> RI mua theo peak capacity khiến lãng phí lớn trong phần lớn thời gian tải thấp, không co giãn theo nhu cầu thực.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> RI theo peak capacity nghe như giải pháp &quot;an toàn tuyệt đối&quot; nhưng cực kỳ lãng phí vì tải không phải lúc nào cũng ở đỉnh.</p>","tip":"<p>Baseline ổn định → RI/Savings Plans. Biến động, chịu gián đoạn → Spot. Biến động, không chịu gián đoạn → On-Demand.</p>"},{"id":2,"topic":"Design Secure Architectures – GuardDuty vs Inspector","supplement":false,"stem":"An IT security consultancy is working on a solution to protect data stored in Amazon S3 from any malicious activity as well as check for any vulnerabilities on Amazon EC2 instances.<br>As a solutions architect, which of the following solutions would you suggest to help address the given requirement?","options":[{"html":"Use Amazon Inspector to monitor any malicious activity on data stored in Amazon S3. Use security assessments provided by Amazon GuardDuty to check for vulnerabilities on Amazon EC2 instances","correct":false},{"html":"Use Amazon GuardDuty to monitor any malicious activity on data stored in Amazon S3. Use security assessments provided by Amazon Inspector to check for vulnerabilities on Amazon EC2 instances","correct":true},{"html":"Use Amazon Inspector to monitor any malicious activity on data stored in Amazon S3. Use security assessments provided by Amazon Inspector to check for vulnerabilities on Amazon EC2 instances","correct":false},{"html":"Use Amazon GuardDuty to monitor any malicious activity on data stored in Amazon S3. Use security assessments provided by Amazon GuardDuty to check for vulnerabilities on Amazon EC2 instances","correct":false}],"multi":1,"analysis":"<p>Phân biệt vai trò GuardDuty (phát hiện mối đe dọa) và Inspector (quét lỗ hổng)</p>","answer":"<p>GuardDuty chuyên phát hiện hoạt động bất thường/độc hại (bao gồm dữ liệu S3), Inspector chuyên quét lỗ hổng trên EC2 — mỗi dịch vụ một vai trò riêng biệt, không thể hoán đổi.</p>","explain":"<ul><li><b>A. ✗</b> Gán nhầm: dùng Inspector để giám sát hoạt động độc hại trên S3 — đây là việc của GuardDuty, không phải Inspector.</li><li><b>B. ✓</b> GuardDuty giám sát hoạt động bất thường/độc hại (kể cả liên quan S3) qua CloudTrail/VPC Flow Logs; Inspector quét lỗ hổng EC2 — đúng vai trò từng dịch vụ.</li><li><b>C. ✗</b> Gán nhầm cả hai vế: dùng Inspector cho cả S3 lẫn EC2, trong khi Inspector không giám sát hoạt động độc hại trên S3.</li><li><b>D. ✗</b> Gán nhầm cả hai vế theo chiều ngược: dùng GuardDuty để quét lỗ hổng EC2, trong khi đó là việc của Inspector.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Cả 2 dịch vụ đều liên quan &quot;bảo mật&quot; nên rất dễ gán nhầm vai trò cho nhau, đặc biệt khi đáp án ghép 2 vế dịch vụ.</p>","tip":"<p>Giám sát hành vi bất thường/đe dọa (S3, VPC, DNS) → GuardDuty. Quét lỗ hổng/CVE trên EC2, ECR, Lambda → Inspector.</p>"},{"id":3,"topic":"Design Resilient Architectures – Serverless ingestion (SQS + Lambda)","supplement":false,"stem":"A leading carmaker would like to build a new car-as-a-sensor service by leveraging fully serverless components that are provisioned and managed automatically by AWS. The development team at the carmaker does not want an option that requires the capacity to be manually provisioned, as it does not want to respond manually to changing volumes of sensor data.<br>Given these constraints, which of the following solutions is the BEST fit to develop this car-as-a-sensor service?","options":[{"html":"Ingest the sensor data in Amazon Kinesis Data Streams, which is polled by an application running on an Amazon EC2 instance and the data is written into an auto-scaled Amazon DynamoDB table for downstream processing","correct":false},{"html":"Ingest the sensor data in an Amazon Simple Queue Service (Amazon SQS) standard queue, which is polled by an application running on an Amazon EC2 instance and the data is written into an auto-scaled Amazon DynamoDB table for downstream processing","correct":false},{"html":"Ingest the sensor data in an Amazon Simple Queue Service (Amazon SQS) standard queue, which is polled by an AWS Lambda function in batches and the data is written into an auto-scaled Amazon DynamoDB table for downstream processing","correct":true},{"html":"Ingest the sensor data in Amazon Kinesis Data Firehose, which directly writes the data into an auto-scaled Amazon DynamoDB table for downstream processing","correct":false}],"multi":1,"analysis":"<p>Chọn kiến trúc ingest thực sự &quot;fully serverless&quot;, không có EC2 ẩn bên trong</p>","answer":"<p>SQS + Lambda polling theo batch loại bỏ hoàn toàn việc quản lý server, đúng với yêu cầu không ai can thiệp provisioning/capacity.</p>","explain":"<ul><li><b>A. ✗</b> Kinesis Data Streams + EC2 instance polling: vẫn cần quản lý EC2, vi phạm yêu cầu &quot;fully serverless&quot;, lại không tối ưu bằng SQS+Lambda cho ingest đơn giản.</li><li><b>B. ✗</b> SQS standard + EC2 instance polling: vẫn dùng EC2 để poll, không fully serverless như yêu cầu, dù SQS bản thân serverless.</li><li><b>C. ✓</b> SQS standard + Lambda polling theo batch: Lambda tích hợp sẵn với SQS (long polling, checkpoint tự động), không cần quản lý server nào — đúng yêu cầu fully serverless, không cần capacity thủ công.</li><li><b>D. ✗</b> Kinesis Data Firehose không thể ghi trực tiếp vào DynamoDB — sai về mặt kỹ thuật, không khả thi.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 2 đáp án nghe hợp lý (dùng đúng dịch vụ ingest) nhưng vẫn giấu &quot;ứng dụng chạy trên EC2&quot; ở bước xử lý — vi phạm ràng buộc serverless ngay từ đầu đề.</p>","tip":"<p>Thấy từ khóa &quot;fully serverless&quot;/&quot;không muốn tự provision capacity&quot; → loại ngay mọi đáp án có EC2 ở bất kỳ bước nào, kể cả khi dịch vụ ingest đúng.</p>"},{"id":4,"topic":"Design Cost-Optimized Architectures – EFS cross-account access từ Lambda","supplement":false,"stem":"A biotechnology firm runs genomics data analysis workloads using AWS Lambda functions deployed inside a VPC in their central AWS account. The input data for these workloads consists of large files stored in an Amazon Elastic File System (Amazon EFS) that resides in a separate AWS account managed by a research partner. The firm wants the Lambda function in their account to access the shared EFS storage directly. The access pattern and file volume are expected to grow as additional research datasets are added over time, so the solution must be scalable and cost-efficient, and should require minimal operational overhead.<br>Which solution best meets these requirements in the MOST cost-effective way?","options":[{"html":"Create a second Lambda function in the research partner's account that mounts the EFS file system locally. Have the main Lambda function in the central account invoke this secondary Lambda via Amazon API Gateway for data access and computation. Use IAM cross-account permissions to allow invocation","correct":false},{"html":"Use Amazon EFS resource policies to allow cross-account access to the file system from the central account. Attach the EFS mount target to a shared VPC or peered VPC, and mount the file system in the Lambda function configuration using an EFS access point","correct":true},{"html":"Package the genomic input data as a Lambda layer and publish it in the research partner's account. Share the layer across accounts by modifying its resource policy and attach the layer to the Lambda function in the central account to access the data during execution","correct":false},{"html":"Set up an Amazon S3 bucket in the research partner’s account and periodically copy EFS contents into the bucket using scheduled AWS DataSync jobs. Use Amazon S3 Access Points to expose the data to the Lambda function in the central account, allowing access via S3 API calls instead of file system mounts","correct":false}],"multi":1,"analysis":"<p>Chọn tính năng cross-account gốc của dịch vụ thay vì tự dựng proxy/trung gian</p>","answer":"<p>EFS resource policy + access point + VPC peering/shared VPC là cơ chế AWS hỗ trợ sẵn cho truy cập EFS liên account, không cần sao chép dữ liệu hay Lambda trung gian.</p>","explain":"<ul><li><b>A. ✗</b> Dựng thêm Lambda proxy ở account đối tác + gọi qua API Gateway: thêm độ trễ, thêm tầng kiến trúc, thêm chi phí vận hành không cần thiết khi EFS đã hỗ trợ cross-account trực tiếp.</li><li><b>B. ✓</b> Dùng EFS resource policy cho phép cross-account + mount target trong VPC chia sẻ/peering + EFS access point: đúng cơ chế gốc AWS hỗ trợ sẵn, không cần proxy, tự động scale, chi phí thấp nhất.</li><li><b>C. ✗</b> Lambda layer không dùng để chia sẻ dataset lớn/động — có giới hạn 250MB và bất biến sau khi publish, không phù hợp dữ liệu gen nghiên cứu ngày càng lớn.</li><li><b>D. ✗</b> Sao chép dữ liệu EFS sang S3 bằng DataSync định kỳ rồi dùng S3 Access Point: tốn chi phí lưu trùng lặp, độ trễ do phải đồng bộ định kỳ, không phải real-time.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đáp án dùng Lambda proxy nghe như giải pháp &quot;kỹ thuật, khả thi&quot; nhưng thực chất phức tạp và tốn kém hơn tính năng có sẵn — bẫy chọn giải pháp vòng vo.</p>","tip":"<p>Khi 2 tài nguyên khác account cần truy cập trực tiếp nhau, luôn ưu tiên tìm tính năng resource policy/access point gốc của dịch vụ trước khi nghĩ tới proxy tự xây.</p>"},{"id":5,"topic":"Design Secure Architectures – Cross-account RDS access (PrivateLink)","supplement":false,"stem":"A biotech research company needs to perform data analytics on real-time lab results provided by a partner organization. The partner stores these lab results in an Amazon RDS for MySQL instance within the partner’s own AWS account. The research company has a private VPC that does not have internet access, Direct Connect, or a VPN connection. However, the company must establish secure and private connectivity to the RDS database in the partner’s VPC. The solution must allow the research company to connect from its VPC while minimizing complexity and complying with data security requirements.<br>Which solution will meet these requirements?","options":[{"html":"Configure a client VPN endpoint in the company’s account. Have researchers connect to the VPN from their local machines. Establish a Direct Connect gateway to the partner’s VPC and route RDS traffic via this connection","correct":false},{"html":"Instruct the partner to enable public access on the Amazon RDS instance and add a security group rule to allow inbound access from the company’s IP range. The company accesses the database over the public internet through a NAT Gateway configured in a private subnet","correct":false},{"html":"Set up VPC peering between the company’s VPC and the partner’s VPC. Use AWS Transit Gateway in the partner's account to route traffic from the company’s VPC to the database. Modify the RDS subnet route tables to allow access from the company’s CIDR block","correct":false},{"html":"Instruct the partner to create a Network Load Balancer (NLB) in front of the Amazon RDS for MySQL instance. Use AWS PrivateLink to expose the NLB as an interface VPC endpoint in the research company’s VPC","correct":true}],"multi":1,"analysis":"<p>Chia sẻ dịch vụ xuyên account/VPC an toàn, không cần VPN/Direct Connect</p>","answer":"<p>PrivateLink qua NLB cho phép bên nhận kết nối riêng tư tới dịch vụ bên kia mà không lộ toàn bộ VPC, không cần internet, VPN hay Direct Connect.</p>","explain":"<ul><li><b>A. ✗</b> Client VPN + Direct Connect gateway: đề đã nói không có Direct Connect; Client VPN dùng cho user cá nhân, không phải kết nối VPC-to-VPC.</li><li><b>B. ✗</b> Public access RDS + NAT Gateway: vi phạm yêu cầu không có internet access, lộ RDS ra public, lại NAT Gateway không thể đặt trong subnet không có Internet Gateway.</li><li><b>C. ✗</b> VPC Peering kết hợp Transit Gateway cho cùng một cặp VPC: mâu thuẫn kiến trúc — chỉ dùng MỘT trong hai cho một cặp VPC, không dùng chung.</li><li><b>D. ✓</b> NLB đặt trước RDS + AWS PrivateLink expose NLB thành interface VPC endpoint: đúng cơ chế share dịch vụ 1 chiều, riêng tư, không cần internet/VPN/DX.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> VPC Peering + Transit Gateway nghe như kết hợp &quot;đầy đủ, chắc chắn hoạt động&quot; nhưng đây là mâu thuẫn kiến trúc — không dùng đồng thời cho cùng cặp VPC.</p>","tip":"<p>Chia sẻ 1 dịch vụ cụ thể, không chia sẻ toàn bộ mạng, có thể trùng CIDR → PrivateLink. Kết nối toàn bộ 2 VPC thông thường → Peering (không transitive) hoặc Transit Gateway (hub-and-spoke, không dùng chung với peering cho cùng cặp).</p>"},{"id":6,"topic":"Design High-Performing Architectures – S3 request rate scaling (prefixes)","supplement":false,"stem":"A file-hosting service uses Amazon Simple Storage Service (Amazon S3) under the hood to power its storage offerings. Currently all the customer files are uploaded directly under a single Amazon S3 bucket. The engineering team has started seeing scalability issues where customer file uploads have started failing during the peak access hours with more than 5000 requests per second.<br>Which of the following is the MOST resource efficient and cost-optimal way of addressing this issue?","options":[{"html":"Change the application architecture to create a new Amazon S3 bucket for each day's data and then upload the daily files directly under that day's bucket","correct":false},{"html":"Change the application architecture to use Amazon Elastic File System (Amazon EFS) instead of Amazon S3 for storing the customers' uploaded files","correct":false},{"html":"Change the application architecture to create a new Amazon S3 bucket for each customer and then upload each customer's files directly under the respective buckets","correct":false},{"html":"Change the application architecture to create customer-specific custom prefixes within the single Amazon S3 bucket and then upload the daily files into those prefixed locations","correct":true}],"multi":1,"analysis":"<p>Tăng throughput S3 bằng prefix thay vì tách bucket</p>","answer":"<p>S3 scale theo prefix (mỗi prefix đạt hàng nghìn request/giây), nên tạo nhiều prefix trong 1 bucket là cách rẻ và hiệu quả nhất để tăng throughput mà không cần đổi kiến trúc lưu trữ.</p>","explain":"<ul><li><b>A. ✗</b> Tạo bucket mới mỗi ngày: tên bucket phải global-unique, lãng phí/khó quản lý, trong khi vấn đề chỉ là request rate — không cần bucket riêng.</li><li><b>B. ✗</b> Chuyển sang EFS: EFS đắt hơn S3 đáng kể cho lưu trữ dạng object, không giải quyết đúng vấn đề chi phí.</li><li><b>C. ✗</b> Tạo bucket riêng cho mỗi khách hàng: cùng vấn đề global-unique name, tốn kém, không cần thiết khi S3 prefix đã đủ để scale throughput.</li><li><b>D. ✓</b> Tạo prefix riêng cho từng khách hàng trong CÙNG một bucket: S3 tự động scale request rate theo số lượng prefix (không giới hạn số prefix/bucket), đơn giản và rẻ nhất.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Tạo bucket riêng theo ngày/khách hàng nghe như cách &quot;phân tán tải&quot; hợp lý nhưng vướng giới hạn tên global-unique và không cần thiết khi chỉ cần đổi cấu trúc prefix.</p>","tip":"<p>Vấn đề là request rate per prefix trong S3 → tăng số prefix trong cùng bucket, không phải tăng số bucket.</p>"},{"id":7,"topic":"Design High-Performing Architectures – AMI copy giữa Region (snapshot ẩn)","supplement":false,"stem":"The solo founder at a tech startup has just created a brand new AWS account. The founder has provisioned an Amazon EC2 instance 1A which is running in AWS Region A. Later, he takes a snapshot of the instance 1A and then creates a new Amazon Machine Image (AMI) in Region A from this snapshot. This AMI is then copied into another Region B. The founder provisions an instance 1B in Region B using this new AMI in Region B.<br>At this point in time, what entities exist in Region B?","options":[{"html":"1 Amazon EC2 instance and 2 AMIs exist in Region B","correct":false},{"html":"1 Amazon EC2 instance and 1 snapshot exist in Region B","correct":false},{"html":"1 Amazon EC2 instance, 1 AMI and 1 snapshot exist in Region B","correct":true},{"html":"1 Amazon EC2 instance and 1 AMI exist in Region B","correct":false}],"multi":1,"analysis":"<p>Đếm đúng số entity khi copy AMI xuyên Region</p>","answer":"<p>AMI luôn được xây trên nền snapshot; khi copy AMI sang Region khác, AWS tự tạo thêm 1 snapshot mới ở Region đích để làm nền cho AMI đó.</p>","explain":"<ul><li><b>A. ✗</b> 1 instance + 2 AMI: sai vì chỉ có 1 AMI mới ở Region B (AMI gốc vẫn ở Region A), và quên rằng copy AMI tạo thêm 1 snapshot ở Region B.</li><li><b>B. ✗</b> 1 instance + 1 snapshot: sai vì thiếu AMI — instance được tạo từ AMI đã copy sang, nên AMI vẫn tồn tại ở Region B.</li><li><b>C. ✓</b> 1 instance + 1 AMI + 1 snapshot: copy AMI sang Region B tự động tạo ra 1 snapshot nền tảng ở Region B, cộng với chính AMI đó và instance được launch từ AMI.</li><li><b>D. ✗</b> 1 instance + 1 AMI: thiếu snapshot — quên rằng AMI luôn dựa trên snapshot, và copy AMI sang Region mới kéo theo việc tạo snapshot mới ở Region đó.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Rất dễ quên hiệu ứng phụ ẩn: copy AMI tưởng chỉ tạo ra AMI, nhưng thực chất kéo theo 1 snapshot mới mà đề không nói rõ.</p>","tip":"<p>AMI = metadata + snapshot(s) nền. Copy AMI sang Region khác luôn kéo theo tạo snapshot mới ở Region đích, dù bạn không yêu cầu snapshot riêng.</p>"},{"id":8,"topic":"Design Cost-Optimized Architectures – DAX + CloudFront cho read-heavy workload","supplement":false,"stem":"A retail company has developed a REST API which is deployed in an Auto Scaling group behind an Application Load Balancer. The REST API stores the user data in Amazon DynamoDB and any static content, such as images, are served via Amazon Simple Storage Service (Amazon S3). On analyzing the usage trends, it is found that 90% of the read requests are for commonly accessed data across all users.<br>As a Solutions Architect, which of the following would you suggest as the MOST efficient solution to improve the application performance?","options":[{"html":"Enable Amazon DynamoDB Accelerator (DAX) for Amazon DynamoDB and ElastiCache Memcached for Amazon S3","correct":false},{"html":"Enable ElastiCache Redis for DynamoDB and Amazon CloudFront for Amazon S3","correct":false},{"html":"Enable ElastiCache Redis for DynamoDB and ElastiCache Memcached for Amazon S3","correct":false},{"html":"Enable Amazon DynamoDB Accelerator (DAX) for Amazon DynamoDB and Amazon CloudFront for Amazon S3","correct":true}],"multi":1,"analysis":"<p>Chọn dịch vụ cache CHUYÊN DỤNG theo đúng nguồn dữ liệu (DynamoDB vs S3)</p>","answer":"<p>DAX được tích hợp sẵn, tương thích API với DynamoDB không cần sửa code; CloudFront là CDN chuyên phục vụ nội dung tĩnh từ S3 ở edge — mỗi lựa chọn đúng đúng loại tải.</p>","explain":"<ul><li><b>A. ✗</b> DAX cho DynamoDB + Memcached cho S3: Memcached không dùng để cache nội dung tĩnh phục vụ qua S3, không phù hợp use case.</li><li><b>B. ✗</b> Redis cho DynamoDB + CloudFront cho S3: tích hợp Redis với DynamoDB phức tạp hơn nhiều so với dùng DAX — DAX được thiết kế chuyên biệt, tương thích API sẵn.</li><li><b>C. ✗</b> Redis cho DynamoDB + Memcached cho S3: cả hai đều không phải lựa chọn tối ưu — Redis/DynamoDB phức tạp, Memcached không cache được nội dung S3.</li><li><b>D. ✓</b> DAX cho DynamoDB (tăng tốc tới 10 lần, tương thích API, không cần sửa code) + CloudFront cho S3 (cache tại edge, giảm tải và chi phí phục vụ): đúng dịch vụ chuyên biệt cho từng loại truy cập.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> ElastiCache (Redis/Memcached) nghe như giải pháp cache &quot;tổng quát, mạnh mẽ&quot; nhưng không chuyên biệt bằng DAX cho DynamoDB hay CloudFront cho nội dung tĩnh S3.</p>","tip":"<p>Cache đọc cho DynamoDB → DAX (không dùng được cho RDS). Cache/CDN cho nội dung tĩnh từ S3 → CloudFront.</p>"},{"id":9,"topic":"Design High-Performing Architectures – In-memory data store cho leaderboard (Select two)","supplement":false,"stem":"The engineering team at an in-home fitness company is evaluating multiple in-memory data stores with the ability to power its on-demand, live leaderboard. The company's leaderboard requires high availability, low latency, and real-time processing to deliver customizable user data for the community of users working out together virtually from the comfort of their home.<br>As a solutions architect, which of the following solutions would you recommend? (Select two)","options":[{"html":"Power the on-demand, live leaderboard using Amazon Neptune as it meets the in-memory, high availability, low latency requirements","correct":false},{"html":"Power the on-demand, live leaderboard using Amazon RDS for Aurora as it meets the in-memory, high availability, low latency requirements","correct":false},{"html":"Power the on-demand, live leaderboard using Amazon DynamoDB with DynamoDB Accelerator (DAX) as it meets the in-memory, high availability, low latency requirements","correct":true},{"html":"Power the on-demand, live leaderboard using Amazon ElastiCache for Redis as it meets the in-memory, high availability, low latency requirements","correct":true},{"html":"Power the on-demand, live leaderboard using Amazon DynamoDB as it meets the in-memory, high availability, low latency requirements","correct":false}],"multi":2,"analysis":"<p>Phân biệt dịch vụ THỰC SỰ in-memory với dịch vụ chỉ &quot;nhanh/managed&quot;</p>","answer":"<p>Chỉ ElastiCache Redis và DynamoDB+DAX là in-memory thực sự; Aurora và DynamoDB (không DAX) không phải in-memory dù hiệu năng tốt.</p>","explain":"<ul><li><b>A. ✗</b> Neptune là graph database, không phải in-memory — không đáp ứng yêu cầu latency cực thấp/in-memory.</li><li><b>B. ✗</b> RDS for Aurora là relational database, không phải in-memory dù hiệu năng cao — không thỏa yêu cầu đề.</li><li><b>C. ✓</b> DynamoDB kết hợp DAX: DAX là lớp cache in-memory cho DynamoDB, đạt latency micro giây — đáp ứng đúng yêu cầu in-memory, HA, low-latency.</li><li><b>D. ✓</b> ElastiCache for Redis: in-memory thực sự, hỗ trợ real-time leaderboard (sorted set), HA qua Multi-AZ — đáp ứng đúng yêu cầu.</li><li><b>E. ✗</b> DynamoDB (không kèm DAX) bản thân không phải in-memory database — single-digit ms chứ không phải in-memory, không đáp ứng yêu cầu.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Dễ nhầm Aurora (RDS) là lựa chọn hợp lệ vì nghe &quot;hiệu năng cao, HA&quot; — nhưng Aurora là relational database truyền thống, không in-memory.</p>","tip":"<p>In-memory thực sự trong SAA-C03: chỉ ElastiCache (Redis/Memcached) và DAX (lớp cache cho DynamoDB). RDS/Aurora/DynamoDB thuần không phải in-memory.</p>"},{"id":10,"topic":"Design High-Performing Architectures – ASG rebalancing vs unhealthy replacement (Select two)","supplement":false,"stem":"The DevOps team at an e-commerce company has deployed a fleet of Amazon EC2 instances under an Auto Scaling group (ASG). The instances under the ASG span two Availability Zones (AZ) within the us-east-1 region. All the incoming requests are handled by an Application Load Balancer (ALB) that routes the requests to the Amazon EC2 instances under the Auto Scaling Group. As part of a test run, two instances (instance 1 and 2, belonging to AZ A) were manually terminated by the DevOps team causing the Availability Zones (AZ) to have unbalanced resources. Later that day, another instance (belonging to AZ B) was detected as unhealthy by the Application Load Balancer's health check.<br>Can you identify the correct outcomes for these events? (Select two)","options":[{"html":"As the resources are unbalanced in the Availability Zones, Amazon EC2 Auto Scaling will compensate by rebalancing the Availability Zones. When rebalancing, Amazon EC2 Auto Scaling launches new instances before terminating the old ones, so that rebalancing does not compromise the performance or availability of your application","correct":true},{"html":"Amazon EC2 Auto Scaling creates a new scaling activity for terminating the unhealthy instance and then terminates it. Later, another scaling activity launches a new instance to replace the terminated instance","correct":true},{"html":"Amazon EC2 Auto Scaling creates a new scaling activity for launching a new instance to replace the unhealthy instance. Later, Amazon EC2 Auto Scaling creates a new scaling activity for terminating the unhealthy instance and then terminates it","correct":false},{"html":"As the resources are unbalanced in the Availability Zones, Amazon EC2 Auto Scaling will compensate by rebalancing the Availability Zones. When rebalancing, Amazon EC2 Auto Scaling terminates old instances before launching new instances, so that rebalancing does not cause extra instances to be launched","correct":false},{"html":"Amazon EC2 Auto Scaling creates a new scaling activity to terminate the unhealthy instance and launch the new instance simultaneously","correct":false}],"multi":2,"analysis":"<p>Phân biệt đúng THỨ TỰ hành động: rebalancing AZ (launch trước) vs thay thế unhealthy (terminate trước)</p>","answer":"<p>Hai luồng xử lý của ASG có thứ tự ngược nhau: rebalancing ưu tiên launch-trước-terminate-sau (bảo toàn capacity), còn thay thế unhealthy thì terminate-trước-launch-sau.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: khi mất cân bằng AZ, ASG rebalance bằng cách LAUNCH instance mới trước rồi mới terminate instance cũ, để không ảnh hưởng hiệu năng/khả dụng.</li><li><b>B. ✓</b> Đúng: với instance unhealthy, ASG tạo scaling activity TERMINATE trước rồi mới LAUNCH instance thay thế — thứ tự ngược với rebalancing.</li><li><b>C. ✗</b> Sai thứ tự: ASG xử lý instance unhealthy bằng cách terminate trước rồi mới launch, không phải launch trước.</li><li><b>D. ✗</b> Sai thứ tự: khi rebalancing, ASG launch trước rồi mới terminate, không phải terminate trước.</li><li><b>E. ✗</b> Bịa đặt: terminate và launch không xảy ra đồng thời trong một scaling activity — đây là distractor không có thật.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đề cố ý đảo ngược thứ tự launch/terminate trong 2 cặp đáp án gần giống nhau để kiểm tra bạn nhớ đúng chiều cho từng tình huống.</p>","tip":"<p>AZ mất cân bằng → ASG launch mới trước, terminate cũ sau. Instance unhealthy → ASG terminate trước, launch thay thế sau.</p>"},{"id":11,"topic":"Design Secure Architectures – IAM policy — least privilege (JSON statement)","supplement":false,"stem":"A development team requires permissions to list an Amazon S3 bucket and delete objects from that bucket. A systems administrator has created the following IAM policy to provide access to the bucket and applied that policy to the group. The group is not able to delete objects in the bucket. The company follows the principle of least privilege.<pre class=\"code\">&quot;Version&quot;: &quot;2021-10-17&quot;,\n&quot;Statement&quot;: [\n{\n&quot;Action&quot;: [\n&quot;s3:ListBucket&quot;,\n&quot;s3:DeleteObject&quot;\n],\n&quot;Resource&quot;: [\n&quot;arn:aws:s3:::example-bucket&quot;\n],\n&quot;Effect&quot;: &quot;Allow&quot;\n}\n]</pre>Which statement should a solutions architect add to the policy to address this issue?","options":[{"html":"<pre class=\"code\">{\n    &quot;Action&quot;: [\n        &quot;s3:*Object&quot;\n    ],\n    &quot;Resource&quot;: [\n        &quot;arn:aws:s3:::example-bucket/*&quot;\n    ],\n    &quot;Effect&quot;: &quot;Allow&quot;\n}</pre>","correct":false},{"html":"<pre class=\"code\">{\n    &quot;Action&quot;: [\n        &quot;s3:*&quot;\n    ],\n    &quot;Resource&quot;: [\n        &quot;arn:aws:s3:::example-bucket/*&quot;\n    ],\n    &quot;Effect&quot;: &quot;Allow&quot;\n}</pre>","correct":false},{"html":"<pre class=\"code\">{\n    &quot;Action&quot;: [\n        &quot;s3:DeleteObject&quot;\n    ],\n    &quot;Resource&quot;: [\n        &quot;arn:aws:s3:::example-bucket/*&quot;\n    ],\n    &quot;Effect&quot;: &quot;Allow&quot;\n}</pre>","correct":true},{"html":"<pre class=\"code\">{\n    &quot;Action&quot;: [\n        &quot;s3:DeleteObject&quot;\n    ],\n    &quot;Resource&quot;: [\n        &quot;arn:aws:s3:::example-bucket*&quot;\n    ],\n    &quot;Effect&quot;: &quot;Allow&quot;\n}</pre>","correct":false}],"multi":1,"analysis":"<p>Soát lỗi cú pháp IAM policy: đúng Action + đúng định dạng Resource ARN</p>","answer":"<p>s3:DeleteObject là action hợp lệ và resource phải có &quot;/*&quot; sau tên bucket để trỏ đến object bên trong, vừa đủ quyền theo nguyên tắc least privilege.</p>","explain":"<ul><li><b>A. ✗</b> &quot;s3:*Object&quot; không phải action hợp lệ (sai cú pháp action, không phải wildcard đúng) — policy vô hiệu.</li><li><b>B. ✗</b> &quot;s3:*&quot; cấp toàn quyền trên bucket, vi phạm nguyên tắc least privilege dù giải quyết được vấn đề.</li><li><b>C. ✓</b> &quot;s3:DeleteObject&quot; trên resource &quot;arn:...:example-bucket/*&quot;: đúng action, đúng định dạng resource (có /* để trỏ vào object bên trong bucket) — least privilege.</li><li><b>D. ✗</b> Resource thiếu &quot;/*&quot; sau tên bucket (&quot;example-bucket*&quot;) — sai định dạng ARN cho object, không hoạt động đúng.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các đáp án sai chỉ khác biệt rất nhỏ (thiếu dấu /, action không hợp lệ, hoặc dùng wildcard quá rộng) — phải đọc kỹ từng ký tự trong ARN.</p>","tip":"<p>ARN cho object bên trong bucket luôn cần hậu tố &quot;/*&quot;: arn:aws:s3:::bucket-name/* — thiếu nó, policy áp vào bucket chứ không áp vào object.</p>"},{"id":12,"topic":"Design High-Performing Architectures – S3 upload tốc độ nhanh nhất (multipart + S3TA)","supplement":false,"stem":"A data analytics company measures what the consumers watch and what advertising they’re exposed to. This real-time data is ingested into its on-premises data center and subsequently, the daily data feed is compressed into a single file and uploaded on Amazon S3 for backup. The typical compressed file size is around 2 gigabytes.<br>Which of the following is the fastest way to upload the daily compressed file into Amazon S3?","options":[{"html":"Upload the compressed file using multipart upload with Amazon S3 Transfer Acceleration (Amazon S3TA)","correct":true},{"html":"Upload the compressed file using multipart upload","correct":false},{"html":"FTP the compressed file into an Amazon EC2 instance that runs in the same region as the Amazon S3 bucket. Then transfer the file from the Amazon EC2 instance into the Amazon S3 bucket","correct":false},{"html":"Upload the compressed file in a single operation","correct":false}],"multi":1,"analysis":"<p>Kết hợp 2 kỹ thuật tăng tốc upload S3 cùng lúc (multipart + S3TA)</p>","answer":"<p>Multipart upload chia nhỏ để truyền song song, S3TA dùng mạng edge CloudFront để tối ưu đường truyền — kết hợp cả hai cho tốc độ nhanh nhất.</p>","explain":"<ul><li><b>A. ✓</b> Multipart upload + S3 Transfer Acceleration: kết hợp cả song song hóa (multipart) và định tuyến tối ưu qua edge CloudFront (S3TA) — nhanh nhất trong các lựa chọn.</li><li><b>B. ✗</b> Chỉ multipart upload: tăng tốc nhưng chưa tận dụng được lợi thế định tuyến mạng tối ưu của S3TA.</li><li><b>C. ✗</b> FTP qua EC2 trung gian rồi mới chuyển vào S3: vòng vo, thêm độ trễ và công sức scripting, không phải cách nhanh nhất.</li><li><b>D. ✗</b> Upload trong một lần duy nhất (single operation): không tận dụng song song hóa, chậm hơn multipart, đặc biệt với file lớn (&gt;100MB).</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đáp án chỉ dùng multipart đơn lẻ nghe đã khá nhanh, dễ khiến bỏ qua việc kết hợp thêm S3TA để tối ưu hơn nữa.</p>","tip":"<p>File lớn, cần nhanh nhất có thể qua khoảng cách xa → multipart upload + S3 Transfer Acceleration cùng lúc, không chọn một trong hai.</p>"},{"id":13,"topic":"Design High-Performing Architectures – Amazon FSx for Windows File Server (DFS)","supplement":false,"stem":"A large financial institution operates an on-premises data center with hundreds of petabytes of data managed on Microsoft’s Distributed File System (DFS). The CTO wants the organization to transition into a hybrid cloud environment and run data-intensive analytics workloads that support DFS.<br>Which of the following AWS services can facilitate the migration of these workloads?","options":[{"html":"Amazon FSx for Windows File Server","correct":true},{"html":"Microsoft SQL Server on AWS","correct":false},{"html":"Amazon FSx for Lustre","correct":false},{"html":"AWS Directory Service for Microsoft Active Directory (AWS Managed Microsoft AD)","correct":false}],"multi":1,"analysis":"<p>Chọn dịch vụ FSx đúng loại hỗ trợ giao thức/tính năng DFS</p>","answer":"<p>Chỉ FSx for Windows File Server hỗ trợ tổ chức share theo Microsoft DFS Namespaces ở quy mô hàng trăm PB.</p>","explain":"<ul><li><b>A. ✓</b> FSx for Windows File Server hỗ trợ Microsoft DFS để gộp share thành một cấu trúc thư mục duy nhất lên tới hàng trăm PB — đúng yêu cầu di chuyển workload DFS.</li><li><b>B. ✗</b> SQL Server on AWS chỉ là dịch vụ chạy database SQL Server, không liên quan tới DFS.</li><li><b>C. ✗</b> FSx for Lustre không hỗ trợ Microsoft DFS, được thiết kế cho HPC/machine learning, không phù hợp.</li><li><b>D. ✗</b> AWS Managed Microsoft AD không hỗ trợ DFS, chỉ là dịch vụ Active Directory được quản lý.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Dễ nhầm cần một dịch vụ &quot;HPC/big data&quot; (FSx Lustre, EMR) khi nghe &quot;data-intensive&quot;, nhưng yêu cầu cốt lõi ở đây là tương thích DFS — chỉ FSx Windows có.</p>","tip":"<p>Cần tương thích SMB + Windows + DFS → FSx for Windows File Server. Cần hiệu năng cực cao cho HPC/ML → FSx for Lustre.</p>"},{"id":14,"topic":"Design High-Performing Architectures – Kinesis Data Streams + Lambda cho leaderboard game","supplement":false,"stem":"A gaming company is developing a mobile game that streams score updates to a backend processor and then publishes results on a leaderboard. The company has hired you as an AWS Certified Solutions Architect Associate to design a solution that can handle major traffic spikes, process the mobile game updates in the order of receipt, and store the processed updates in a highly available database. The company wants to minimize the management overhead required to maintain the solution.<br>Which of the following will you recommend to meet these requirements?","options":[{"html":"Push score updates to Amazon Kinesis Data Streams which uses an AWS Lambda function to process these updates and then store these processed updates in Amazon DynamoDB","correct":true},{"html":"Push score updates to an Amazon Simple Queue Service (Amazon SQS) queue which uses a fleet of Amazon EC2 instances (with Auto Scaling) to process these updates in the Amazon SQS queue and then store these processed updates in an Amazon RDS MySQL database","correct":false},{"html":"Push score updates to Amazon Kinesis Data Streams which uses a fleet of Amazon EC2 instances (with Auto Scaling) to process the updates in Amazon Kinesis Data Streams and then store these processed updates in Amazon DynamoDB","correct":false},{"html":"Push score updates to an Amazon Simple Notification Service (Amazon SNS) topic, subscribe an AWS Lambda function to this Amazon SNS topic to process the updates and then store these processed updates in a SQL database running on Amazon EC2 instance","correct":false}],"multi":1,"analysis":"<p>Chọn kiến trúc xử lý real-time, có thứ tự, không quản lý server nào (serverless end-to-end)</p>","answer":"<p>Lambda tích hợp native với Kinesis Data Streams (tự động polling, checkpoint, error handling) và ghi vào DynamoDB auto-scale — không có server nào phải quản lý.</p>","explain":"<ul><li><b>A. ✓</b> Kinesis Data Streams + Lambda xử lý (tích hợp native, tự động polling/checkpoint) + lưu DynamoDB: không cần quản lý server nào — đúng yêu cầu LEAST operational overhead.</li><li><b>B. ✗</b> SQS + EC2 Auto Scaling xử lý + RDS MySQL: dùng EC2 nghĩa là vẫn phải patch OS, quản lý server — không đạt yêu cầu overhead thấp nhất.</li><li><b>C. ✗</b> Kinesis Data Streams + EC2 Auto Scaling xử lý: cùng vấn đề dùng EC2 để xử lý, tăng operational overhead so với Lambda.</li><li><b>D. ✗</b> SNS + Lambda xử lý nhưng lưu vào SQL database chạy trên EC2: vẫn phải quản lý EC2 cho tầng lưu trữ, không đạt yêu cầu minimal overhead.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 3/4 đáp án đều có một bước dùng EC2 Auto Scaling để xử lý — nghe hợp lý về mặt chức năng nhưng vi phạm yêu cầu &quot;minimize management overhead&quot;.</p>","tip":"<p>Khi đề nhấn mạnh &quot;minimal operational overhead&quot; + cần giữ thứ tự dữ liệu → Kinesis Data Streams + Lambda (native integration), tránh các đáp án có EC2 xử lý.</p>"},{"id":15,"topic":"Design Resilient Architectures – S3 Object protection: Versioning + MFA Delete (Select two)","supplement":false,"stem":"A healthcare startup needs to enforce compliance and regulatory guidelines for objects stored in Amazon S3. One of the key requirements is to provide adequate protection against accidental deletion of objects.<br>As a solutions architect, what are your recommendations to address these guidelines? (Select two) ?","options":[{"html":"Enable versioning on the Amazon S3 bucket","correct":true},{"html":"Change the configuration on Amazon S3 console so that the user needs to provide additional confirmation while deleting any Amazon S3 object","correct":false},{"html":"Enable multi-factor authentication (MFA) delete on the Amazon S3 bucket","correct":true},{"html":"Create an event trigger on deleting any Amazon S3 object. The event invokes an Amazon Simple Notification Service (Amazon SNS) notification via email to the IT manager","correct":false},{"html":"Establish a process to get managerial approval for deleting Amazon S3 objects","correct":false}],"multi":2,"analysis":"<p>Chọn đúng 2 cơ chế kỹ thuật NGĂN NGỪA xóa nhầm (không phải cơ chế cảnh báo sau khi đã xóa)</p>","answer":"<p>Versioning giữ lại các phiên bản cũ (xóa chỉ tạo delete marker) và MFA Delete yêu cầu xác thực bổ sung trước khi xóa vĩnh viễn — cả hai đều ngăn ngừa trước khi mất dữ liệu thật sự.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: Versioning cho phép khôi phục phiên bản trước khi object bị ghi đè/xóa (xóa chỉ thêm delete marker, không mất dữ liệu thật).</li><li><b>B. ✗</b> Không có tính năng &quot;yêu cầu xác nhận thêm khi xóa&quot; trên console S3 — đây là tùy chọn không tồn tại, chỉ là distractor.</li><li><b>C. ✓</b> Đúng: MFA Delete yêu cầu xác thực 2 lớp trước khi xóa vĩnh viễn object — bảo vệ thêm chống xóa nhầm/ác ý.</li><li><b>D. ✗</b> Trigger sự kiện xóa rồi gửi SNS: chỉ thông báo SAU khi đã xóa, không ngăn được việc xóa — không đạt mục tiêu phòng ngừa.</li><li><b>E. ✗</b> Quy trình phê duyệt thủ công của quản lý: chỉ là biện pháp quy trình con người, không phải giải pháp kỹ thuật AWS, chỉ là distractor.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Trigger sự kiện + SNS nghe như giải pháp &quot;tự động, real-time&quot; nhưng chỉ cảnh báo SAU khi object đã bị xóa — không phòng ngừa được gì.</p>","tip":"<p>Phân biệt rõ: cơ chế phòng ngừa (prevent) phải chặn/khôi phục được trước hoặc sau khi xóa (Versioning, MFA Delete, Object Lock) khác với cơ chế chỉ cảnh báo (SNS/CloudWatch) diễn ra sau sự việc.</p>"},{"id":16,"topic":"Design High-Performing Architectures – Auto Scaling — Target Tracking Policy","supplement":false,"stem":"The engineering team at a data analytics company has observed that its flagship application functions at its peak performance when the underlying Amazon Elastic Compute Cloud (Amazon EC2) instances have a CPU utilization of about 50%. The application is built on a fleet of Amazon EC2 instances managed under an Auto Scaling group. The workflow requests are handled by an internal Application Load Balancer that routes the requests to the instances.<br>As a solutions architect, what would you recommend so that the application runs near its peak performance state?","options":[{"html":"Configure the Auto Scaling group to use simple scaling policy and set the CPU utilization as the target metric with a target value of 50%","correct":false},{"html":"Configure the Auto Scaling group to use a Amazon Cloudwatch alarm triggered on a CPU utilization threshold of 50%","correct":false},{"html":"Configure the Auto Scaling group to use step scaling policy and set the CPU utilization as the target metric with a target value of 50%","correct":false},{"html":"Configure the Auto Scaling group to use target tracking policy and set the CPU utilization as the target metric with a target value of 50%","correct":true}],"multi":1,"analysis":"<p>Chọn đúng loại scaling policy hỗ trợ &quot;giữ metric ở một giá trị mục tiêu&quot;</p>","answer":"<p>Chỉ Target Tracking Policy cho phép đặt một target value cụ thể (vd CPU 50%) và để ASG tự tính toán điều chỉnh capacity liên tục để bám theo mục tiêu đó.</p>","explain":"<ul><li><b>A. ✗</b> Simple scaling policy không hỗ trợ đặt target metric với giá trị mục tiêu cụ thể — chỉ dùng threshold + CloudWatch alarm.</li><li><b>B. ✗</b> ASG không thể trực tiếp dùng một CloudWatch alarm làm nguồn kích hoạt scale-in/scale-out theo kiểu này.</li><li><b>C. ✗</b> Step scaling cũng không hỗ trợ đặt target metric với giá trị mục tiêu — chỉ dùng các bước (step) theo ngưỡng.</li><li><b>D. ✓</b> Target tracking policy: chọn metric (CPU) và đặt target value (50%) — ASG tự tạo và quản lý CloudWatch alarm, tự điều chỉnh capacity để giữ metric gần giá trị mục tiêu.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Step scaling và simple scaling đều nghe như &quot;policy điều chỉnh theo CPU&quot; nhưng cả hai đều dùng ngưỡng/bước chứ không có khái niệm target value.</p>","tip":"<p>Có một con số mục tiêu cụ thể cần duy trì (vd CPU 50%) → Target Tracking. Có nhiều mức ngưỡng với các bước scale khác nhau → Step Scaling.</p>"},{"id":17,"topic":"Design Secure Architectures – AWS Root user security best practices (Select two)","supplement":false,"stem":"An IT consultant is helping the owner of a medium-sized business set up an AWS account. What are the security recommendations he must follow while creating the AWS account root user? (Select two)","options":[{"html":"Create a strong password for the AWS account root user","correct":true},{"html":"Send an email to the business owner with details of the login username and password for the AWS root user. This will help the business owner to troubleshoot any login issues in future","correct":false},{"html":"Create AWS account root user access keys and share those keys only with the business owner","correct":false},{"html":"Encrypt the access keys and save them on Amazon S3","correct":false},{"html":"Enable Multi Factor Authentication (MFA) for the AWS account root user account","correct":true}],"multi":2,"analysis":"<p>Ghi nhớ danh sách best practice bảo vệ root user (không chia sẻ, không tạo access key, bật MFA)</p>","answer":"<p>Mật khẩu mạnh + MFA là hai biện pháp kỹ thuật trực tiếp bảo vệ root user mà AWS khuyến nghị áp dụng ngay từ đầu.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: tạo mật khẩu mạnh cho root user là khuyến nghị cơ bản của AWS.</li><li><b>B. ✗</b> Gửi email chứa username/password root cho chủ doanh nghiệp: chia sẻ thông tin đăng nhập root qua email tạo rủi ro bảo mật nghiêm trọng — vi phạm best practice.</li><li><b>C. ✗</b> Tạo access key cho root rồi chia sẻ dù chỉ với 1 người: AWS khuyến nghị KHÔNG tạo access key cho root user trừ khi thực sự cần thiết.</li><li><b>D. ✗</b> Mã hóa access key rồi lưu trên S3: vẫn là việc KHÔNG nên tạo access key cho root ngay từ đầu, mã hóa không giải quyết được rủi ro gốc.</li><li><b>E. ✓</b> Đúng: bật MFA cho root user là khuyến nghị bảo mật cốt lõi, giảm rủi ro nếu mật khẩu bị lộ.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các phương án về access key (tạo, chia sẻ, mã hóa rồi lưu) đều nghe như giải pháp &quot;thận trọng&quot; nhưng sai từ gốc — AWS khuyến nghị không tạo access key cho root trừ khi bắt buộc.</p>","tip":"<p>Root user: mật khẩu mạnh + MFA bắt buộc, không chia sẻ credential, không tạo access key nếu không thật sự cần.</p>"},{"id":18,"topic":"Design Resilient Architectures – SQS FIFO cho xử lý exactly-once","supplement":false,"stem":"A government agency is developing a online application to assist users in submitting permit requests through a web-based interface. The system architecture consists of a front-end web application tier and a background processing tier that handles the validation and submission of the forms. The application is expected to see high traffic and it must ensure that every submitted request is processed exactly once, with no loss of data.<br>Which design choice best satisfies these requirements?","options":[{"html":"Leverage Amazon EventBridge to send events from the web application to the processing tier for asynchronous form handling","correct":false},{"html":"Leverage Amazon API Gateway to pass the form submissions to AWS Lambda for processing in real time","correct":false},{"html":"Implement an Amazon SQS FIFO queue to reliably buffer and deliver form submissions from the web application layer to the processing tier","correct":true},{"html":"Implement an Amazon SQS standard queue to reliably buffer and deliver form submissions from the web application layer to the processing tier","correct":false}],"multi":1,"analysis":"<p>Chọn đúng loại SQS queue theo yêu cầu &quot;exactly-once + đúng thứ tự&quot;</p>","answer":"<p>SQS FIFO là lựa chọn duy nhất đảm bảo cả exactly-once processing và thứ tự xử lý đúng như yêu cầu đề.</p>","explain":"<ul><li><b>A. ✗</b> EventBridge: chỉ cung cấp at-least-once delivery, không đảm bảo thứ tự, không đạt yêu cầu exactly-once.</li><li><b>B. ✗</b> API Gateway + Lambda xử lý real-time: không có cơ chế decoupling/queue bền vững, không tự đảm bảo exactly-once khi lỗi xảy ra.</li><li><b>C. ✓</b> SQS FIFO queue: đảm bảo xử lý đúng 1 lần, đúng thứ tự (First-In-First-Out) — đúng yêu cầu không mất dữ liệu, không trùng lặp.</li><li><b>D. ✗</b> SQS standard queue: chỉ đảm bảo at-least-once và best-effort ordering — có thể trùng lặp hoặc sai thứ tự, không đạt yêu cầu.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> EventBridge và API Gateway+Lambda đều là các dịch vụ event-driven phổ biến nhưng không có cơ chế đảm bảo exactly-once như FIFO queue.</p>","tip":"<p>Thấy &quot;exactly-once&quot; + &quot;đúng thứ tự&quot; trong đề → SQS FIFO. Standard chỉ có at-least-once + best-effort ordering.</p>"},{"id":19,"topic":"Design Resilient Architectures – RDS Multi-AZ vs Read Replica — replication type","supplement":false,"stem":"A new DevOps engineer has just joined a development team and wants to understand the replication capabilities for Amazon RDS Multi-AZ deployment as well as Amazon RDS Read-replicas.<br>Which of the following correctly summarizes these capabilities for the given database?","options":[{"html":"Multi-AZ follows asynchronous replication and spans one Availability Zone (AZ) within a single region. Read replicas follow synchronous replication and can be within an Availability Zone (AZ), Cross-AZ, or Cross-Region","correct":false},{"html":"Multi-AZ follows asynchronous replication and spans at least two Availability Zones (AZs) within a single region. Read replicas follow asynchronous replication and can be within an Availability Zone (AZ), Cross-AZ, or Cross-Region","correct":false},{"html":"Multi-AZ follows asynchronous replication and spans at least two Availability Zones (AZs) within a single region. Read replicas follow synchronous replication and can be within an Availability Zone (AZ), Cross-AZ, or Cross-Region","correct":false},{"html":"Multi-AZ follows synchronous replication and spans at least two Availability Zones (AZs) within a single region. Read replicas follow asynchronous replication and can be within an Availability Zone (AZ), Cross-AZ, or Cross-Region","correct":true}],"multi":1,"analysis":"<p>Ghi nhớ chính xác kiểu replication: Multi-AZ = synchronous, Read Replica = asynchronous</p>","answer":"<p>Multi-AZ cần đồng bộ tức thời (synchronous) để đảm bảo failover không mất dữ liệu; Read Replica dùng asynchronous vì ưu tiên hiệu năng đọc hơn là đồng bộ tuyệt đối.</p>","explain":"<ul><li><b>A. ✗</b> Sai: Multi-AZ là synchronous (không phải asynchronous) và chỉ 1 AZ (không phải tối thiểu 2 AZ).</li><li><b>B. ✗</b> Sai: Read Replica dùng asynchronous (không phải synchronous) để nhân bản.</li><li><b>C. ✗</b> Sai một nửa: Multi-AZ đúng là tối thiểu 2 AZ nhưng lại ghi nhầm là asynchronous (phải là synchronous), Read Replica cũng ghi nhầm là synchronous.</li><li><b>D. ✓</b> Đúng: Multi-AZ dùng synchronous replication, trải ít nhất 2 AZ trong 1 Region; Read Replica dùng asynchronous replication, có thể trong AZ, cross-AZ hoặc cross-Region.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đề đưa ra đủ các tổ hợp hoán đổi sync/async giữa 2 khái niệm để kiểm tra bạn nhớ đúng chiều — chỉ cần sai 1 từ là chọn nhầm.</p>","tip":"<p>Multi-AZ = đồng bộ (synchronous), mục đích HA/failover. Read Replica = bất đồng bộ (asynchronous), mục đích scale đọc.</p>"},{"id":20,"topic":"Design Secure Architectures – Aurora Global Database vs DynamoDB Global Table","supplement":false,"stem":"The flagship application for a gaming company connects to an Amazon Aurora database and the entire technology stack is currently deployed in the United States. Now, the company has plans to expand to Europe and Asia for its operations. It needs the games table to be accessible globally but needs the users and games_played tables to be regional only.<br>How would you implement this with minimal application refactoring?","options":[{"html":"Use a Amazon DynamoDB global table for the games table and use Amazon DynamoDB tables for the users and games_played tables","correct":false},{"html":"Use an Amazon Aurora Global Database for the games table and use Amazon DynamoDB tables for the users and games_played tables","correct":false},{"html":"Use an Amazon Aurora Global Database for the games table and use Amazon Aurora for the users and games_played tables","correct":true},{"html":"Use a Amazon DynamoDB global table for the games table and use Amazon Aurora for the users and games_played tables","correct":false}],"multi":1,"analysis":"<p>Giữ nguyên engine database (SQL) khi yêu cầu minimal refactoring, chỉ đổi topology (global vs regional)</p>","answer":"<p>Dùng Aurora cho cả 2 loại bảng (Global Database cho bảng cần toàn cầu, cluster Aurora thường cho bảng chỉ cần regional) giữ nguyên toàn bộ API SQL, tránh phải viết lại ứng dụng.</p>","explain":"<ul><li><b>A. ✗</b> DynamoDB Global Table cho bảng games + DynamoDB cho users/games_played: dùng toàn bộ DynamoDB nghĩa là phải viết lại ứng dụng từ SQL sang NoSQL — không đạt yêu cầu &quot;minimal refactoring&quot;.</li><li><b>B. ✗</b> Aurora Global Database cho games + DynamoDB cho users/games_played: vẫn phải refactor một phần ứng dụng sang NoSQL cho 2 bảng còn lại.</li><li><b>C. ✓</b> Aurora Global Database cho bảng games (cần global) + Aurora thường cho users/games_played (cần regional): giữ nguyên API SQL cho toàn bộ ứng dụng, không cần refactor.</li><li><b>D. ✗</b> DynamoDB Global Table cho games + Aurora cho users/games_played: vẫn phải viết thêm code tích hợp NoSQL cho bảng games, không tối thiểu hóa refactor.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> DynamoDB Global Table nghe rất hợp với yêu cầu &quot;truy cập toàn cầu&quot; nhưng đổi sang NoSQL kéo theo refactor lớn — vi phạm ràng buộc &quot;minimal application refactoring&quot;.</p>","tip":"<p>Ưu tiên tiêu chí &quot;minimal refactoring&quot; hơn tiêu chí &quot;nghe đúng chức năng&quot; — đổi engine database (SQL ↔ NoSQL) luôn kéo theo refactor lớn.</p>"},{"id":21,"topic":"Design Secure Architectures – Route 53 Resolver Outbound Endpoint (hybrid DNS)","supplement":false,"stem":"A healthcare company is developing a secure internal web portal hosted on AWS. The application must communicate with legacy systems that reside in the company's on-premises data centers. These data centers are connected to AWS via a site-to-site VPN. The company uses Amazon Route 53 as its DNS solution and requires the application to resolve private DNS records for the on-premises services from within its Amazon VPC.<br>What is the MOST secure and appropriate way to meet these DNS resolution requirements?","options":[{"html":"Create a Route 53 private hosted zone for the on-premises domain. Associate the hosted zone with the VPC to allow the application to resolve DNS names of the on-premises services","correct":false},{"html":"Create a Route 53 Resolver outbound endpoint. Define a forwarding rule that routes DNS queries for on-premises domains to the on-premises DNS server. Associate the rule with the VPC","correct":true},{"html":"Create a hybrid connectivity gateway and attach the on-premises DNS servers to Route 53 as authoritative zones for internal domains","correct":false},{"html":"Configure a Route 53 Resolver inbound endpoint and create a DNS forwarding rule. Enable recursive DNS resolution in the VPC to access on-premises services","correct":false}],"multi":1,"analysis":"<p>Phân biệt Resolver Outbound Endpoint (AWS → on-prem) với Inbound Endpoint (on-prem → AWS)</p>","answer":"<p>Outbound endpoint + forwarding rule là cơ chế chính thức để VPC gửi truy vấn DNS cho domain on-premises sang DNS server on-prem qua kết nối hybrid.</p>","explain":"<ul><li><b>A. ✗</b> Private hosted zone cho domain on-premises: chỉ phục vụ phân giải tên trong AWS, không phân giải được bản ghi DNS thật trên server on-prem trừ khi sao chép thủ công.</li><li><b>B. ✓</b> Route 53 Resolver outbound endpoint + forwarding rule trỏ DNS queries on-premises domain về DNS server on-prem, gắn rule với VPC: đúng cơ chế AWS cho hybrid DNS resolution từ AWS ra on-prem.</li><li><b>C. ✗</b> &quot;Hybrid connectivity gateway&quot; không phải dịch vụ/tính năng có thật của AWS — tên bịa.</li><li><b>D. ✗</b> Inbound endpoint dùng cho chiều ngược lại (on-prem phân giải domain trong AWS), không phải cho VPC phân giải domain on-prem; &quot;recursive DNS resolution&quot; cũng không phải cấu hình VPC có thật trong ngữ cảnh này.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Inbound endpoint nghe tương tự nhưng lại phục vụ chiều ngược — rất dễ chọn nhầm nếu không nhớ rõ &quot;inbound&quot; nghĩa là traffic đi VÀO VPC.</p>","tip":"<p>VPC cần phân giải domain on-prem → Resolver Outbound Endpoint. On-prem cần phân giải domain trong VPC → Resolver Inbound Endpoint.</p>"},{"id":22,"topic":"Design Secure Architectures – AWS WAF geo-blocking trên ALB","supplement":false,"stem":"A media company runs a photo-sharing web application that is accessed across three different countries. The application is deployed on several Amazon Elastic Compute Cloud (Amazon EC2) instances running behind an Application Load Balancer. With new government regulations, the company has been asked to block access from two countries and allow access only from the home country of the company.<br>Which configuration should be used to meet this changed requirement?","options":[{"html":"Configure the security group for the Amazon EC2 instances","correct":false},{"html":"Configure the security group on the Application Load Balancer","correct":false},{"html":"Use Geo Restriction feature of Amazon CloudFront in a Amazon Virtual Private Cloud (Amazon VPC)","correct":false},{"html":"Configure AWS Web Application Firewall (AWS WAF) on the Application Load Balancer in a Amazon Virtual Private Cloud (Amazon VPC)","correct":true}],"multi":1,"analysis":"<p>Chọn đúng dịch vụ hỗ trợ geo-blocking VÀ đúng vị trí gắn (ALB trong VPC)</p>","answer":"<p>AWS WAF có Geo Match Condition và được gắn trực tiếp vào Application Load Balancer đang chạy trong VPC của công ty — đúng cả chức năng lẫn vị trí triển khai.</p>","explain":"<ul><li><b>A. ✗</b> Security group trên EC2 instance: không hỗ trợ lọc theo vị trí địa lý người dùng.</li><li><b>B. ✗</b> Security group trên ALB: cũng không hỗ trợ chặn theo quốc gia.</li><li><b>C. ✗</b> CloudFront Geo Restriction: đúng tính năng geo-blocking nhưng CloudFront không nằm &quot;trong&quot; VPC như đề mô tả — đáp án bị gắn sai ngữ cảnh.</li><li><b>D. ✓</b> AWS WAF gắn vào ALB trong VPC, dùng Geo Match Condition: đúng dịch vụ và đúng vị trí gắn để chặn/cho phép theo quốc gia.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> CloudFront Geo Restriction cũng là tính năng geo-blocking thật, nhưng đáp án cố tình gắn sai ngữ cảnh &quot;trong VPC&quot; (CloudFront hoạt động ở edge, không nằm trong VPC) khiến nó trở thành bẫy.</p>","tip":"<p>Chặn theo quốc gia (geo-block): CloudFront Geo Restriction (ở edge) hoặc AWS WAF Geo Match (gắn CloudFront/ALB/API Gateway) — Security Group và NACL KHÔNG hỗ trợ chặn theo địa lý.</p>"},{"id":23,"topic":"Design High-Performing Architectures – EC2 Placement Groups — Cluster cho HPC","supplement":false,"stem":"An ivy-league university is assisting NASA to find potential landing sites for exploration vehicles of unmanned missions to our neighboring planets. The university uses High Performance Computing (HPC) driven application architecture to identify these landing sites.<br>Which of the following Amazon EC2 instance topologies should this application be deployed on?","options":[{"html":"The Amazon EC2 instances should be deployed in a partition placement group so that distributed workloads can be handled effectively","correct":false},{"html":"The Amazon EC2 instances should be deployed in a spread placement group so that there are no correlated failures","correct":false},{"html":"The Amazon EC2 instances should be deployed in a cluster placement group so that the underlying workload can benefit from low network latency and high network throughput","correct":true},{"html":"The Amazon EC2 instances should be deployed in an Auto Scaling group so that application meets high availability requirements","correct":false}],"multi":1,"analysis":"<p>Chọn placement group theo đúng mục tiêu: latency thấp (cluster) vs chống correlated failure (spread) vs phân tán lớn (partition)</p>","answer":"<p>HPC cần giao tiếp node-to-node độ trễ cực thấp — chỉ cluster placement group gom instance vật lý gần nhau trong cùng AZ mới đáp ứng được.</p>","explain":"<ul><li><b>A. ✗</b> Partition placement group: dùng cho hệ phân tán lớn (Hadoop, Cassandra, Kafka), có thể trải nhiều AZ nên không đạt độ trễ thấp cần cho HPC.</li><li><b>B. ✗</b> Spread placement group: mục tiêu chống correlated failure (trải phần cứng khác nhau), có thể trải nhiều AZ — ngược hẳn với yêu cầu latency thấp của HPC.</li><li><b>C. ✓</b> Cluster placement group: gom các instance gần nhau trong cùng 1 AZ, tối ưu network latency thấp và throughput cao — đúng nhu cầu HPC tightly-coupled.</li><li><b>D. ✗</b> Auto Scaling group chỉ phục vụ mục tiêu high availability/scale, không liên quan đến việc tối ưu network latency giữa các node HPC.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Partition và Spread đều là placement group hợp lệ nhưng phục vụ mục tiêu ngược lại (phân tán/chống lỗi tương quan) thay vì mục tiêu latency thấp mà HPC cần.</p>","tip":"<p>HPC, tightly-coupled, cần latency thấp nhất → Cluster placement group. Hệ phân tán lớn (Hadoop/Kafka) → Partition. Chống correlated failure → Spread.</p>"},{"id":24,"topic":"Design High-Performing Architectures – Serverless validation + ECS Fargate backend","supplement":false,"stem":"A digital wallet company plans to launch a new cloud-based service for processing user cash transfers and peer-to-peer payments. The application will receive transaction requests from mobile clients via a secure endpoint. Each transaction request must go through a lightweight validation step before being forwarded for backend processing, which includes fraud detection, ledger updates, and notifications. The backend workload is compute- and memory-intensive, requires scaling based on volume, and must run for a longer duration than typical short-lived tasks. The engineering team prefers a fully managed solution that minimizes infrastructure maintenance, including provisioning and patching of virtual machines or containers.<br>Which solution will meet these requirements with the LEAST operational overhead?","options":[{"html":"Create an Amazon API Gateway endpoint to receive transaction requests from mobile devices. Use AWS Lambda to validate the transactions. For backend processing, deploy the application on Amazon EKS Anywhere, running on on-premises servers in the company’s data center. Use a custom provisioning script to scale Kubernetes worker nodes based on transaction volume","correct":false},{"html":"Build a REST API using Amazon API Gateway. Integrate it with an AWS Step Functions state machine for validation. Launch the backend application using Amazon EKS with self-managed nodes, and use Kubernetes Jobs to handle transaction processing workflows. Manually scale the cluster based on demand","correct":false},{"html":"Configure Amazon SQS to receive encrypted payment notifications from mobile devices. Use Amazon EventBridge rules to extract the payload and perform validation. Route the messages to a backend system hosted on Amazon Lightsail instances with dynamic scaling policies based on memory thresholds and instance health checks","correct":false},{"html":"Expose an Amazon API Gateway REST API endpoint to receive transaction requests from mobile clients. Integrate the API with AWS Lambda to perform basic validation. For backend processing, deploy the long-running application to Amazon ECS using the Fargate launch type, allowing ECS to manage compute and memory provisioning automatically, with no server management required","correct":true}],"multi":1,"analysis":"<p>Chọn kiến trúc serverless-end-to-end, tránh mọi hình thức tự quản lý node/cluster</p>","answer":"<p>API Gateway + Lambda xử lý phần validate nhẹ, ECS Fargate xử lý phần backend nặng và dài hơi mà không cần quản lý server hay cluster Kubernetes.</p>","explain":"<ul><li><b>A. ✗</b> API Gateway + Lambda validate + EKS Anywhere on-premises: vẫn phải tự quản lý toàn bộ hạ tầng on-prem, hoàn toàn trái với yêu cầu minimal infrastructure management.</li><li><b>B. ✗</b> API Gateway + Step Functions validate + EKS self-managed nodes, scale thủ công: EKS self-managed đòi hỏi tự quản lý node, patch, scale — không đạt LEAST operational overhead.</li><li><b>C. ✗</b> SQS + EventBridge validate + Lightsail backend: EventBridge không phải engine xử lý logic/validation; Lightsail không đủ khả năng orchestration cho backend doanh nghiệp.</li><li><b>D. ✓</b> API Gateway + Lambda validate nhẹ + ECS Fargate chạy backend dài hạn: Fargate tự động cấp phát compute/memory, không cần quản lý server/cluster — đúng yêu cầu LEAST operational overhead.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các đáp án dùng EKS (self-managed hoặc Anywhere) nghe &quot;mạnh mẽ, kiểm soát tốt&quot; nhưng đều đòi hỏi tự vận hành hạ tầng Kubernetes — ngược lại với yêu cầu ít vận hành nhất.</p>","tip":"<p>Container dài hạn, không muốn quản lý server/cluster, cần scale theo task → ECS Fargate. Cần Kubernetes thật sự quản lý → EKS (luôn kèm nhiều vận hành hơn Fargate).</p>"},{"id":25,"topic":"Design Secure Architectures – IAM best practices checklist (Select two)","supplement":false,"stem":"A new DevOps engineer has joined a large financial services company recently. As part of his onboarding, the IT department is conducting a review of the checklist for tasks related to AWS Identity and Access Management (AWS IAM).<br>As an AWS Certified Solutions Architect – Associate, which best practices would you recommend (Select two)?","options":[{"html":"Use user credentials to provide access specific permissions for Amazon EC2 instances","correct":false},{"html":"Enable AWS Multi-Factor Authentication (AWS MFA) for privileged users","correct":true},{"html":"Configure AWS CloudTrail to log all AWS Identity and Access Management (AWS IAM) actions","correct":true},{"html":"Create a minimum number of accounts and share these account credentials among employees","correct":false},{"html":"Grant maximum privileges to avoid assigning privileges again","correct":false}],"multi":2,"analysis":"<p>Ghi nhớ bộ checklist IAM best practice chuẩn (MFA, CloudTrail, không chia sẻ credential, không over-privilege)</p>","answer":"<p>MFA cho user đặc quyền và bật CloudTrail log IAM actions là hai biện pháp kỹ thuật cốt lõi cho bảo mật và khả năng audit.</p>","explain":"<ul><li><b>A. ✗</b> Dùng user credentials để cấp quyền cho EC2: sai best practice — nên dùng IAM role cho EC2, không dùng credentials cố định.</li><li><b>B. ✓</b> Đúng: bật MFA cho user có đặc quyền (privileged users) là best practice bảo mật cơ bản.</li><li><b>C. ✓</b> Đúng: bật CloudTrail để log mọi hành động IAM phục vụ audit và giám sát.</li><li><b>D. ✗</b> Tạo ít tài khoản rồi chia sẻ credential giữa nhiều nhân v
