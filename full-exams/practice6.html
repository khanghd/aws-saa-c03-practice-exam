nalysis":"<p>Pipeline nhiều mảnh, chấm từng mảnh</p>","answer":"<p>Batch (managed compute) + Step Functions (sequencing/state) + S3 (file lớn).</p>","explain":"<ul><li><b>A. ✗</b> 'Self-managed' trái 'avoid managing servers'; SQS không quản lý trạng thái; EBS.</li><li><b>B. ✗</b> Static fleet không tự scale; EBS không hợp output lớn dùng chung.</li><li><b>C. ✓</b> Đúng cả 3 mảnh: compute managed, orchestration, storage.</li><li><b>D. ✗</b> Không có điều phối; Lambda giới hạn; FSx không cần thiết.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 'Cloud-native' (Kubernetes) không đồng nghĩa với ít vận hành.</p>","tip":"<p>Step Functions = workflow/state. SQS = decouple/buffer.</p>"},{"id":38,"topic":"Design Cost-Optimized Architectures – S3 Gateway Endpoint (compliance + cost)","supplement":false,"stem":"A healthcare analytics firm operates a backend application within a private subnet of its VPC. The application is fronted by an Application Load Balancer (ALB) and accesses Amazon S3 to store medical reports. The VPC includes both a NAT gateway and an internet gateway, but the company's strict compliance policy prohibits any data traffic from traversing the internet. The team must redesign the architecture to comply with the security policy and improve cost-efficiency.<br>Which solution best satisfies these requirements in the most cost-effective manner?","options":[{"html":"Create an S3 interface VPC endpoint and modify the security group to allow access from the application’s private subnet. Route all S3 traffic through the interface endpoint","correct":false},{"html":"Create a gateway VPC endpoint for Amazon S3 and update the route table for the private subnet to direct S3 traffic through the endpoint","correct":true},{"html":"Modify the S3 bucket policy to allow requests only from the Elastic IP address associated with the NAT gateway","correct":false},{"html":"Create a VPC peering connection with another VPC that has direct access to S3. Forward the S3 API requests through the peered VPC using proxy EC2 instances","correct":false}],"multi":1,"analysis":"<p>Gateway hay Interface endpoint</p>","answer":"<p>S3 + private + rẻ nhất → Gateway Endpoint.</p>","explain":"<ul><li><b>A. ✗</b> Đáp ứng bảo mật nhưng có phí theo giờ và theo GB.</li><li><b>B. ✓</b> Miễn phí, đi qua mạng AWS, chỉ cần sửa route table.</li><li><b>C. ✗</b> Traffic vẫn qua NAT ra Internet và tốn phí NAT.</li><li><b>D. ✗</b> Phức tạp, tốn kém, peering không transitive.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Interface endpoint cũng private nhưng có phí.</p>","tip":"<p>Cùng chủ đề với Q52. Gateway Endpoint còn giảm phí NAT khi truy cập S3 nhiều.</p>"},{"id":39,"topic":"Design Resilient Architectures – HA for legacy apps on EC2","supplement":false,"stem":"A media company is relocating its legacy infrastructure to AWS. The on-premises environment consists of multiple virtualized workloads that are tightly coupled to their host operating systems and cannot be containerized or re-architected due to software constraints. Each workload currently runs on a standalone virtual machine. The engineering team plans to run these workloads on Amazon EC2 instances without modifying their core design. The company needs a solution that ensures high availability and fault tolerance in the AWS Cloud.<br>Which solution will meet these requirements?","options":[{"html":"Create Amazon Machine Images (AMIs) for each legacy workload. Use the AMIs to launch Auto Scaling groups with a minimum and maximum capacity of 1 EC2 instance. Place an Application Load Balancer (ALB) in front of the Auto Scaling group to provide routing and health check-based failover.","correct":false},{"html":"Containerize the legacy applications and deploy them to Amazon ECS using the Fargate launch type. Define a task for each workload, and use an Application Load Balancer to route traffic across multiple Fargate tasks running in separate Availability Zones","correct":false},{"html":"Use AWS Backup to schedule hourly backups of each EC2 instance to Amazon S3 in a separate Availability Zone. Create a recovery plan that includes manual restoration of instances from backup in the event of a failure","correct":false},{"html":"Generate an Amazon Machine Image (AMI) for each legacy server. Launch two EC2 instances from this AMI, placing one instance in each of two different Availability Zones. Set up a Network Load Balancer (NLB) to route traffic to the instances and to monitor instance health for automatic traffic redirection in case of failure","correct":true}],"multi":1,"analysis":"<p>Ràng buộc cứng loại đáp án</p>","answer":"<p>Không sửa app, chạy EC2, fault tolerant → ≥ 2 instance song song ở ≥ 2 AZ + LB.</p>","explain":"<ul><li><b>A. ✗</b> Chỉ 1 instance; tự dựng lại nhưng có downtime → chưa fault tolerant.</li><li><b>B. ✗</b> Vi phạm ràng buộc cứng 'cannot be containerized'; Fargate cũng không phải EC2.</li><li><b>C. ✗</b> Backup/DR, không phải HA; restore thủ công.</li><li><b>D. ✓</b> 2 instance chạy song song ở 2 AZ; NLB chuyển traffic ngay.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đáp án 'hiện đại' nhưng trái ràng buộc của đề.</p>","tip":"<p>So với Q33: Q33 bắt buộc 1 instance + cost → ASG 1/1/1. Q39 cần fault tolerance → 2 instance song song.</p>"},{"id":40,"topic":"Design Cost-Optimized Architectures – Dedicated Hosts (BYOL)","supplement":false,"stem":"A financial services company is looking to move its on-premises IT infrastructure to AWS Cloud. The company has multiple long-term server bound licenses across the application stack and the CTO wants to continue to utilize those licenses while moving to AWS.<br>As a solutions architect, which of the following would you recommend as the MOST cost-effective solution?","options":[{"html":"Use Amazon EC2 reserved instances (RI)","correct":false},{"html":"Use Amazon EC2 dedicated instances","correct":false},{"html":"Use Amazon EC2 dedicated hosts","correct":true},{"html":"Use Amazon EC2 on-demand instances","correct":false}],"multi":1,"analysis":"<p>Lọc ràng buộc cứng → chi phí</p>","answer":"<p>License gắn với server vật lý → Dedicated Hosts.</p>","explain":"<ul><li><b>A. ✗</b> Mô hình thanh toán, không cho thấy socket/core vật lý.</li><li><b>B. ✗</b> Phần cứng riêng nhưng không thấy socket/core, không dùng được license gắn server.</li><li><b>C. ✓</b> Thấy socket/core, dùng lại license gắn server (BYOL).</li><li><b>D. ✗</b> Shared tenancy.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Nhầm với Q56 (chỉ cần single-tenant → Dedicated Instances).</p>","tip":"<p>Single-tenant + rẻ → Dedicated Instances. BYOL theo socket/core → Dedicated Hosts.</p>"},{"id":41,"topic":"Design Secure Architectures – Transit Gateway","supplement":false,"stem":"A company has many Amazon Virtual Private Cloud (Amazon VPC) in various accounts, that need to be connected in a star network with one another and connected with on-premises networks through AWS Direct Connect.<br>What do you recommend?","options":[{"html":"Virtual private gateway (VGW)","correct":false},{"html":"VPC Peering Connection","correct":false},{"html":"AWS Transit Gateway","correct":true},{"html":"AWS PrivateLink","correct":false}],"multi":1,"analysis":"<p>Chọn dịch vụ kết nối theo topology</p>","answer":"<p>Many VPCs + star + transitive + on-prem = Transit Gateway.</p>","explain":"<ul><li><b>A. ✗</b> Endpoint VPN/DX cho một VPC, không làm hub.</li><li><b>B. ✗</b> 1-1, không transitive, cần N(N-1)/2 kết nối.</li><li><b>C. ✓</b> Hub trung tâm, định tuyến transitive giữa nhiều VPC và on-prem.</li><li><b>D. ✗</b> Expose một service, không nối mạng giữa các VPC.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> VPC Peering không transitive.</p>","tip":"<p>2 VPC → Peering. Nhiều VPC + on-prem → TGW. Chia sẻ 1 service / CIDR trùng → PrivateLink. 1 DX → nhiều VPC/Region → DX Gateway.</p>"},{"id":42,"topic":"Design Resilient Architectures – Read spikes: CloudFront + Aurora Replica","supplement":false,"stem":"A company manages a multi-tier social media application that runs on Amazon Elastic Compute Cloud (Amazon EC2) instances behind an Application Load Balancer. The instances run in an Amazon EC2 Auto Scaling group across multiple Availability Zones (AZs) and use an Amazon Aurora database. As an AWS Certified Solutions Architect – Associate, you have been tasked to make the application more resilient to periodic spikes in read request rates.<br>Which of the following solutions would you recommend for the given use-case? (Select two)","options":[{"html":"Use Amazon Aurora Replica","correct":true},{"html":"Use AWS Shield","correct":false},{"html":"Use Amazon CloudFront distribution in front of the Application Load Balancer","correct":true},{"html":"Use AWS Direct Connect","correct":false},{"html":"Use AWS Global Accelerator","correct":false}],"multi":2,"analysis":"<p>Giảm tải đọc theo từng tầng</p>","answer":"<p>Edge: CloudFront cache. DB: Aurora Replica.</p>","explain":"<ul><li><b>A. ✓</b> Chia tải đọc ở tầng DB qua reader endpoint.</li><li><b>B. ✗</b> Chống DDoS, không xử lý spike traffic hợp lệ.</li><li><b>C. ✓</b> Cache ở edge, giảm request chạm tới origin.</li><li><b>D. ✗</b> Đường riêng on-prem ↔ AWS, không liên quan.</li><li><b>E. ✗</b> Không có cache; mọi request vẫn tới backend.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Global Accelerator tăng tốc mạng nhưng không cache.</p>","tip":"<p>GA: static IP, TCP/UDP, failover nhanh multi-Region, game/IoT/VoIP. CloudFront: cache HTTP, giảm tải origin.</p>"},{"id":43,"topic":"Design Secure Architectures – Public/private subnet placement","supplement":false,"stem":"A company is deploying a publicly accessible web application. To accomplish this, the engineering team has designed the VPC with a public subnet and a private subnet. The application will be hosted on several Amazon EC2 instances in an Auto Scaling group. The team also wants Transport Layer Security (TLS) termination to be offloaded from the Amazon EC2 instances.<br>Which solution should a solutions architect implement to address these requirements in the most secure manner?","options":[{"html":"Set up a Network Load Balancer in the private subnet. Create an Auto Scaling group in the public subnet and associate it with the Network Load Balancer","correct":false},{"html":"Set up a Network Load Balancer in the private subnet. Create an Auto Scaling group in the private subnet and associate it with the Network Load Balancer","correct":false},{"html":"Set up a Network Load Balancer in the public subnet. Create an Auto Scaling group in the public subnet and associate it with the Network Load Balancer","correct":false},{"html":"Set up a Network Load Balancer in the public subnet. Create an Auto Scaling group in the private subnet and associate it with the Network Load Balancer","correct":true}],"multi":1,"analysis":"<p>Ma trận 2×2 đặt thành phần vào subnet</p>","answer":"<p>Chỉ thứ phải nhận traffic Internet trực tiếp (LB) mới ở public; còn lại ở private.</p>","explain":"<ul><li><b>A. ✗</b> LB private thì người dùng Internet không truy cập được.</li><li><b>B. ✗</b> LB private, không public được.</li><li><b>C. ✗</b> Chạy được nhưng EC2 bị lộ ra Internet.</li><li><b>D. ✓</b> LB là cửa ngõ duy nhất; EC2 ẩn trong private subnet.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đáp án chạy được nhưng không 'most secure'.</p>","tip":"<p>SG của EC2 chỉ cho phép từ SG của LB. ALB/NLB/CLB đều TLS offload được; NLB giữ source IP.</p>"},{"id":44,"topic":"Design Resilient Architectures – EBS Multi-Attach","supplement":false,"stem":"An application is hosted on multiple Amazon EC2 instances in the same Availability Zone (AZ). The engineering team wants to set up shared data access for these Amazon EC2 instances using Amazon EBS Multi-Attach volumes.<br>Which Amazon EBS volume type is the correct choice for these Amazon EC2 instances?","options":[{"html":"Cold HDD Amazon EBS volumes","correct":false},{"html":"Provisioned IOPS SSD Amazon EBS volumes","correct":true},{"html":"Throughput Optimized HDD Amazon EBS volumes","correct":false},{"html":"General-purpose SSD-based Amazon EBS volumes","correct":false}],"multi":1,"analysis":"<p>Recall giới hạn tính năng</p>","answer":"<p>Multi-Attach chỉ có ở Provisioned IOPS SSD.</p>","explain":"<ul><li><b>A. ✗</b> Không hỗ trợ.</li><li><b>B. ✓</b> Chỉ io1/io2 hỗ trợ Multi-Attach, trong cùng AZ.</li><li><b>C. ✗</b> Không hỗ trợ.</li><li><b>D. ✗</b> Không hỗ trợ.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> —</p>","tip":"<p>Ứng dụng phải tự xử lý ghi đồng thời (cluster-aware file system). Cần chia sẻ đa AZ → EFS.</p>"},{"id":45,"topic":"Design High-Performing Architectures – SQS Temporary Queue","supplement":false,"stem":"A development team is looking for a solution that saves development time and deployment costs for an application that uses a high-throughput request-response message pattern.<br>Which of the following Amazon SQS queue types is the best fit to meet this requirement?","options":[{"html":"Amazon Simple Queue Service (Amazon SQS) dead-letter queues","correct":false},{"html":"Amazon Simple Queue Service (Amazon SQS) FIFO queues","correct":false},{"html":"Amazon Simple Queue Service (Amazon SQS) delay queues","correct":false},{"html":"Amazon Simple Queue Service (Amazon SQS) temporary queues","correct":true}],"multi":1,"analysis":"<p>Từ khóa → tính năng</p>","answer":"<p>'Request-response' là từ khóa của Temporary Queue Client (virtual queues).</p>","explain":"<ul><li><b>A. ✗</b> Chứa message xử lý lỗi nhiều lần.</li><li><b>B. ✗</b> Thứ tự + exactly-once; throughput bị giới hạn, đi ngược 'high-throughput'.</li><li><b>C. ✗</b> Trì hoãn message mới.</li><li><b>D. ✓</b> Virtual queue ghép lên một queue thật; tạo/xóa miễn phí; hợp với request-response.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Chọn FIFO vì nổi tiếng dù đề không nhắc thứ tự hay trùng lặp.</p>","tip":"<p>request-response → Temporary. order/exactly-once → FIFO. postpone → Delay. lỗi nhiều lần → DLQ. giảm gọi rỗng → Long polling.</p>"},{"id":46,"topic":"Design Cost-Optimized Architectures – Budgets — Savings Plans coverage","supplement":false,"stem":"A tech enterprise operates several workloads using Amazon EC2, AWS Fargate, and AWS Lambda across various teams. To optimize compute costs, the company has purchased Compute Savings Plans. The cloud operations team needs to implement a solution that not only monitors utilization but also sends automated alerts when coverage levels of the Compute Savings Plans fall below a defined threshold.<br>What is the MOST operationally efficient way to achieve this?","options":[{"html":"Create a standalone dashboard in Amazon CloudWatch to track EC2 and Fargate usage. Use metric math to estimate coverage and trigger alarms","correct":false},{"html":"Use AWS Budgets to create a daily coverage budget specifically for Compute Savings Plans. Define a coverage threshold and configure notifications to alert relevant stakeholders","correct":true},{"html":"Configure a custom script that queries the Savings Plans utilization API and pushes results to an Amazon S3 bucket. Use Amazon QuickSight to visualize coverage and email reports weekly","correct":false},{"html":"Enable Compute Optimizer recommendations for EC2 and Fargate. Configure automatic notifications for cost optimization opportunities and Savings Plans coverage drops","correct":false}],"multi":1,"analysis":"<p>Chọn công cụ Cost Management</p>","answer":"<p>AWS Budgets có sẵn loại 'Savings Plans coverage'.</p>","explain":"<ul><li><b>A. ✗</b> CloudWatch không có metric coverage của Savings Plans.</li><li><b>B. ✓</b> Loại budget có sẵn, chỉ cần đặt ngưỡng và thông báo.</li><li><b>C. ✗</b> Tự viết code, báo cáo hàng tuần, không phải alert.</li><li><b>D. ✗</b> Compute Optimizer dùng để right-size, không theo dõi coverage.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Compute Optimizer nghe liên quan đến tối ưu chi phí compute nhưng sai chức năng.</p>","tip":"<p>Utilization thấp = mua thừa. Coverage thấp = mua thiếu. Budgets có 6 loại: cost, usage, RI utilization/coverage, SP utilization/coverage.</p>"},{"id":47,"topic":"Design Resilient Architectures – RDS Multi-AZ","supplement":false,"stem":"The engineering team at a retail company is planning to migrate to AWS Cloud from the on-premises data center. The team is evaluating Amazon Relational Database Service (Amazon RDS) as the database tier for its flagship application. The team has hired you as an AWS Certified Solutions Architect Associate to advise on Amazon RDS Multi-AZ capabilities.<br>Which of the following would you identify as correct for Amazon RDS Multi-AZ? (Select two)","options":[{"html":"Amazon RDS applies operating system updates by performing maintenance on the standby, then promoting the standby to primary and finally performing maintenance on the old primary, which becomes the new standby","correct":true},{"html":"Updates to your database Instance are asynchronously replicated across the Availability Zone to the standby in order to keep both in sync","correct":false},{"html":"For automated backups, I/O activity is suspended on your primary database since backups are not taken from standby database","correct":false},{"html":"To enhance read scalability, a Multi-AZ standby instance can be used to serve read requests","correct":false},{"html":"Amazon RDS automatically initiates a failover to the standby, in case primary database fails for any reason","correct":true}],"multi":2,"analysis":"<p>Đặc điểm + bẫy tráo từ khóa</p>","answer":"<p>Multi-AZ: sync replication, auto failover, rolling OS patch, backup từ standby.</p>","explain":"<ul><li><b>A. ✓</b> Đúng (rolling cho OS patch; nâng engine version thì cả 2 cùng lúc, có downtime).</li><li><b>B. ✗</b> Sai một từ: phải là synchronously.</li><li><b>C. ✗</b> Tráo ngược: backup lấy từ standby nên I/O primary không bị dừng.</li><li><b>D. ✗</b> Standby (DB instance truyền thống) không đọc được.</li><li><b>E. ✓</b> Đúng; DNS endpoint giữ nguyên.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Tráo sync ↔ async, tráo lợi ích thành nhược điểm.</p>","tip":"<p>Multi-AZ = sync, HA. Read Replica = async, scale đọc. Multi-AZ DB cluster (mới) có reader đọc được.</p>"},{"id":48,"topic":"Design Cost-Optimized Architectures – S3 Storage Class Analysis","supplement":false,"stem":"The data engineering team at a company wants to analyze Amazon S3 storage access patterns to decide when to transition the right data to the right storage class.<br>Which of the following represents a correct option regarding the capabilities of Amazon S3 Analytics storage class analysis?","options":[{"html":"Storage class analysis only provides recommendations for Standard to Standard One-Zone IA classes","correct":false},{"html":"Storage class analysis only provides recommendations for Standard to Glacier Flexible Retrieval classes","correct":false},{"html":"Storage class analysis only provides recommendations for Standard to Standard IA classes","correct":true},{"html":"Storage class analysis only provides recommendations for Standard to Glacier Deep Archive classes","correct":false}],"multi":1,"analysis":"<p>Recall giới hạn tính năng</p>","answer":"<p>Storage Class Analysis quan sát tần suất truy cập để gợi ý khi nào chuyển Standard → Standard-IA.</p>","explain":"<ul><li><b>A. ✗</b> Sai.</li><li><b>B. ✗</b> Sai.</li><li><b>C. ✓</b> Đúng: chỉ Standard → Standard-IA.</li><li><b>D. ✗</b> Sai.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Nghĩ nó gợi ý cả Glacier.</p>","tip":"<p>Không biết pattern → Intelligent-Tiering. Biết rõ số ngày → Lifecycle. Toàn tổ chức → Storage Lens.</p>"},{"id":49,"topic":"Design Secure Architectures – AWS Firewall Manager","supplement":false,"stem":"The engineering team at a multi-national company uses AWS Firewall Manager to centrally configure and manage firewall rules across its accounts and applications using AWS Organizations.<br>Which of the following AWS resources can the AWS Firewall Manager configure rules on? (Select three)","options":[{"html":"AWS Shield Advanced","correct":true},{"html":"VPC Security Group","correct":true},{"html":"Amazon Inspector","correct":false},{"html":"VPC Route Table","correct":false},{"html":"AWS Web Application Firewall (AWS WAF)","correct":true},{"html":"Amazon GuardDuty","correct":false}],"multi":3,"analysis":"<p>Recall: dịch vụ X quản lý được gì</p>","answer":"<p>Firewall Manager chỉ quản lý thứ có 'luật chặn/cho phép traffic'.</p>","explain":"<ul><li><b>A. ✓</b> Có, bảo vệ DDoS.</li><li><b>B. ✓</b> Có.</li><li><b>C. ✗</b> Quét lỗ hổng, không phải firewall.</li><li><b>D. ✗</b> Định tuyến, không chặn traffic.</li><li><b>E. ✓</b> Có.</li><li><b>F. ✗</b> Phát hiện mối đe dọa, không phải firewall.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Lẫn nhóm 'phát hiện' (GuardDuty, Inspector) với nhóm 'chặn'.</p>","tip":"<p>FMS hỗ trợ: WAF, Shield Advanced, Security Group, Network Firewall, Route 53 Resolver DNS Firewall, firewall bên thứ 3, và (bản mới) Network ACL. Cần Organizations + AWS Config.</p>"},{"id":50,"topic":"Design High-Performing Architectures – Kinesis + Fargate","supplement":false,"stem":"A company's real-time streaming application is running on AWS. As the data is ingested, a job runs on the data and takes 30 minutes to complete. The workload frequently experiences high latency due to large amounts of incoming data. A solutions architect needs to design a scalable and serverless solution to enhance performance.<br>Which combination of steps should the solutions architect take? (Select two)","options":[{"html":"Set up AWS Database Migration Service (AWS DMS) to ingest the data","correct":false},{"html":"Provision Amazon EC2 instances in an Auto Scaling group to process the data","correct":false},{"html":"Set up Amazon Kinesis Data Streams to ingest the data","correct":true},{"html":"Set up AWS Lambda with AWS Step Functions to process the data","correct":false},{"html":"Set up AWS Fargate with Amazon ECS to process the data","correct":true}],"multi":2,"analysis":"<p>Pipeline 2 tầng: ingest + process, có con số thời gian ẩn</p>","answer":"<p>Ingest bằng KDS, xử lý job dài bằng Fargate; cả hai serverless và scale được.</p>","explain":"<ul><li><b>A. ✗</b> DMS dùng để migrate DB, không phải streaming ingest.</li><li><b>B. ✗</b> Không serverless.</li><li><b>C. ✓</b> Streaming real-time, scale tốt.</li><li><b>D. ✗</b> Lambda tối đa 15 phút, job 30 phút không chạy được.</li><li><b>E. ✓</b> Container serverless, không giới hạn thời gian chạy.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Step Functions không kéo dài timeout của từng Lambda.</p>","tip":"<p>Lambda 15 phút (function thường); API Gateway 29 giây (mặc định); SQS lưu tối đa 14 ngày; KDS lưu tối đa 365 ngày; Step Functions Standard tối đa 1 năm.</p>"},{"id":51,"topic":"Design Secure Architectures – Security Group vs NACL","supplement":false,"stem":"A developer has configured inbound traffic for the relevant ports in both the Security Group of the Amazon EC2 instance as well as the network access control list (network ACL) of the subnet for the Amazon EC2 instance. The developer is, however, unable to connect to the service running on the Amazon EC2 instance.<br>As a solutions architect, how will you fix this issue?","options":[{"html":"IAM Role defined in the Security Group is different from the IAM Role that is given access in the network access control list (network ACL)","correct":false},{"html":"Network access control list (network ACL) are stateful, so allowing inbound traffic to the necessary ports enables the connection. Security Groups are stateless, so you must allow both inbound and outbound traffic","correct":false},{"html":"Rules associated with network access control list (network ACL) should never be modified from command line. An attempt to modify rules from command line blocks the rule and results in an erratic behavior","correct":false},{"html":"Security Groups are stateful, so allowing inbound traffic to the necessary ports enables the connection. Network access control list (network ACL) are stateless, so you must allow both inbound and outbound traffic","correct":true}],"multi":1,"analysis":"<p>Phân biệt khái niệm gần nhau</p>","answer":"<p>NACL stateless → phải cho phép chiều trả về (outbound, cổng ephemeral).</p>","explain":"<ul><li><b>A. ✗</b> Bịa: SG và NACL không có IAM role.</li><li><b>B. ✗</b> Đảo ngược.</li><li><b>C. ✗</b> Bịa: NACL sửa bằng CLI bình thường (phần giải thích của đề nói sai chỗ này).</li><li><b>D. ✓</b> Đúng: NACL phải mở outbound cho cổng ephemeral (1024–65535).</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Tráo stateful ↔ stateless.</p>","tip":"<p>SG: stateful, chỉ allow, gắn ENI. NACL: stateless, allow + deny, gắn subnet, xét rule theo số thứ tự.</p>"},{"id":52,"topic":"Design Secure Architectures – Gateway VPC Endpoints","supplement":false,"stem":"A company has multiple Amazon EC2 instances operating in a private subnet which is part of a custom VPC. These instances are running an image processing application that needs to access images stored on Amazon S3. Once each image is processed, the status of the corresponding record needs to be marked as completed in a Amazon DynamoDB table.<br>How would you go about providing private access to these AWS resources which are not part of this custom VPC?","options":[{"html":"Create a separate interface endpoint for Amazon S3 and Amazon DynamoDB each. Then connect to these services by adding these as targets in the route table of the custom VPC","correct":false},{"html":"Create a gateway endpoint for Amazon DynamoDB and add it as a target in the route table of the custom VPC. Create an Origin Access Identity for Amazon S3 and then connect to the S3 service using the private IP address","correct":false},{"html":"Create a gateway endpoint for Amazon S3 and add it as a target in the route table of the custom VPC. Create an interface endpoint for Amazon DynamoDB and then add it as a target in the route table of the custom VPC","correct":false},{"html":"Create a separate gateway endpoint for Amazon S3 and Amazon DynamoDB each. Add two new target entries for these two gateway endpoints in the route table of the custom VPC","correct":true}],"multi":1,"analysis":"<p>Ghép 2 mảnh + kiểm tra cơ chế</p>","answer":"<p>Gateway Endpoint (chỉ S3 và DynamoDB) hoạt động qua route table, miễn phí.</p>","explain":"<ul><li><b>A. ✗</b> Sai cơ chế: interface endpoint là ENI + DNS/IP private, không phải target route table.</li><li><b>B. ✗</b> OAI là tính năng của CloudFront, không liên quan EC2 → S3.</li><li><b>C. ✗</b> Mảnh DynamoDB sai cơ chế.</li><li><b>D. ✓</b> Đúng loại, đúng cơ chế, miễn phí.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> OAI/OAC chỉ dùng trong ngữ cảnh CloudFront + S3.</p>","tip":"<p>Gateway = route table, miễn phí, không dùng được từ on-prem. Interface = ENI, có phí, dùng được từ on-prem, có SG.</p>"},{"id":53,"topic":"Design Resilient Architectures – Read Replica sizing","supplement":false,"stem":"An e-commerce company uses Amazon RDS MySQL DB to store the data. The analytics department at the company runs its reports on the same database. The engineering team has noticed sluggish performance on the database when the analytics reporting process is in progress.<br>As an AWS Certified Solutions Architect - Associate, which of the following would you suggest as the MOST cost-optimal solution to improve the performance?","options":[{"html":"Create a read-replica with the same compute capacity and the same storage capacity as the primary. Point the reporting queries to run against the read replica","correct":true},{"html":"Create a standby instance in a multi-AZ configuration with the same compute capacity and the same storage capacity as the primary. Point the reporting queries to run against the standby instance","correct":false},{"html":"Create a standby instance in a multi-AZ configuration with half compute capacity and half storage capacity as the primary. Point the reporting queries to run against the standby instance","correct":false},{"html":"Create a read-replica with half compute capacity and half storage capacity as the primary. Point the reporting queries to run against the read replica","correct":false}],"multi":1,"analysis":"<p>Ma trận 2×2</p>","answer":"<p>Trục 1: Read Replica (đọc được). Trục 2: cùng cấu hình (theo kịp replication).</p>","explain":"<ul><li><b>A. ✓</b> Khuyến nghị của AWS: cùng cấu hình để theo kịp replication.</li><li><b>B. ✗</b> Standby không đọc được.</li><li><b>C. ✗</b> Standby không đọc được.</li><li><b>D. ✗</b> Replica yếu hơn → lag cao; storage nhỏ hơn có thể không đủ chứa dữ liệu.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 'Half capacity' trông rẻ nhưng không hoạt động tin cậy.</p>","tip":"<p>Lọc 'hoạt động đúng' trước, rồi mới tối ưu chi phí. RDS MySQL/MariaDB/PostgreSQL hỗ trợ tối đa 15 read replica.</p>"},{"id":54,"topic":"Design Secure Architectures – CloudFront OAI/OAC","supplement":false,"stem":"As a Solutions Architect, you would like to completely secure the communications between your Amazon CloudFront distribution and your Amazon S3 bucket which contains the static files for your website. Users should only be able to access the Amazon S3 bucket through Amazon CloudFront and not directly.<br>What do you recommend?","options":[{"html":"Create an origin access identity (OAI) and update the Amazon S3 Bucket Policy","correct":true},{"html":"Create a bucket policy to only authorize the IAM role attached to the Amazon CloudFront distribution","correct":false},{"html":"Update the Amazon S3 bucket security groups to only allow traffic from the Amazon CloudFront security group","correct":false},{"html":"Make the Amazon S3 bucket public","correct":false}],"multi":1,"analysis":"<p>Chặn truy cập trực tiếp origin</p>","answer":"<p>OAI (hoặc OAC, bản mới khuyến nghị) + bucket policy chỉ cho phép CloudFront.</p>","explain":"<ul><li><b>A. ✓</b> Chỉ CloudFront (qua OAI) được đọc bucket.</li><li><b>B. ✗</b> CloudFront distribution không gắn IAM role.</li><li><b>C. ✗</b> S3 bucket không có security group.</li><li><b>D. ✗</b> Ai cũng truy cập trực tiếp được.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> S3 'security group' và 'IAM role của CloudFront' đều không tồn tại.</p>","tip":"<p>OAC thay thế OAI, hỗ trợ SSE-KMS và mọi Region. Đây là chỗ OAI xuất hiện ĐÚNG ngữ cảnh (so với Q52).</p>"},{"id":55,"topic":"Design High-Performing Architectures – Kinesis Data Streams on-demand","supplement":false,"stem":"A digital media company wants to track user engagement across its streaming platform by capturing events such as video starts, pauses, and search queries. These events must be ingested and analyzed in real time to improve user experience and optimize recommendations. The platform experiences unpredictable spikes in traffic during popular content releases. The company needs a highly scalable and serverless solution that can seamlessly adjust to changing workloads without manual provisioning.<br>Which solution will meet these requirements in the MOST efficient and scalable way?","options":[{"html":"Deploy a fleet of Amazon EC2 instances running Apache Kafka to ingest clickstream data. Set up custom scripts to manually scale the Kafka cluster based on CPU usage. Use Amazon Athena to run periodic queries on stored clickstream logs","correct":false},{"html":"Use Amazon Kinesis Data Firehose to ingest user events. Set the destination as Amazon S3. Use Amazon Athena with scheduled queries to analyze the data periodically","correct":false},{"html":"Use an Amazon Kinesis Data Streams stream in on-demand capacity mode to ingest user engagement data. Configure an AWS Lambda function as a consumer to process the events in real time","correct":true},{"html":"Use Amazon Simple Notification Service (Amazon SNS) to publish clickstream events. Subscribe an Amazon SQS standard queue to receive the events. Process the events in batches with AWS Glue jobs scheduled at fixed intervals","correct":false}],"multi":1,"analysis":"<p>Kiểm tra toàn bộ chuỗi pipeline</p>","answer":"<p>Phải real-time ở cả ingest lẫn xử lý; KDS on-demand + Lambda đáp ứng.</p>","explain":"<ul><li><b>A. ✗</b> Tự quản lý, scale thủ công.</li><li><b>B. ✗</b> Firehose buffer (near real-time) + Athena định kỳ = batch, không phải real-time analysis.</li><li><b>C. ✓</b> Real-time, on-demand tự scale, Lambda serverless.</li><li><b>D. ✗</b> Glue là ETL batch, chạy định kỳ.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Nửa đầu (Firehose) nghe hợp lý nhưng mắt xích 'scheduled/periodic' là batch.</p>","tip":"<p>Real-time + tự xử lý → KDS. Deliver vào S3/Redshift/OpenSearch không code → Firehose. Unpredictable traffic → on-demand mode.</p>"},{"id":56,"topic":"Design Secure Architectures – Dedicated Instances","supplement":false,"stem":"A healthcare company wants to run its applications on single-tenant hardware to meet compliance guidelines.<br>Which of the following is the MOST cost-effective way of isolating the Amazon EC2 instances to a single tenant?","options":[{"html":"Dedicated Instances","correct":true},{"html":"Dedicated Hosts","correct":false},{"html":"Spot Instances","correct":false},{"html":"On-Demand Instances","correct":false}],"multi":1,"analysis":"<p>Lọc ràng buộc cứng → tối ưu chi phí</p>","answer":"<p>Single-tenant + rẻ nhất → Dedicated Instances.</p>","explain":"<ul><li><b>A. ✓</b> Phần cứng riêng, tính tiền theo instance, rẻ hơn Dedicated Host.</li><li><b>B. ✗</b> Cũng single-tenant nhưng trả cho cả host; dành cho BYOL / kiểm soát socket-core.</li><li><b>C. ✗</b> Shared tenancy.</li><li><b>D. ✗</b> Shared tenancy.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Nhầm trục thanh toán (Spot/On-Demand) với trục tenancy.</p>","tip":"<p>BYOL, per-socket/per-core license, kiểm soát placement → Dedicated Host.</p>"},{"id":57,"topic":"Design Cost-Optimized Architectures – RDS Read Replica","supplement":false,"stem":"Your e-commerce application is using an Amazon RDS PostgreSQL database and an analytics workload also runs on the same database. When the analytics workload is run, your e-commerce application slows down which further affects your sales.<br>Which of the following is the MOST cost-optimal solution to fix this issue?","options":[{"html":"Create a Read Replica in another Region as the Master database and point the analytics workload there","correct":false},{"html":"Migrate the analytics application to AWS Lambda","correct":false},{"html":"Enable Multi-AZ for the Amazon RDS database and run the analytics workload on the standby database","correct":false},{"html":"Create a Read Replica in the same Region as the Master database and point the analytics workload there","correct":true}],"multi":1,"analysis":"<p>Tách tải đọc + tối ưu chi phí</p>","answer":"<p>Analytics chỉ đọc nên tách sang Read Replica. Cùng Region thì không tốn phí replicate, nên rẻ nhất.</p>","explain":"<ul><li><b>A. ✗</b> Giải quyết được hiệu năng nhưng phải trả phí truyền dữ liệu inter-Region.</li><li><b>B. ✗</b> Lambda vẫn query vào cùng DB chính, DB vẫn quá tải.</li><li><b>C. ✗</b> Standby của Multi-AZ (DB instance) không đọc được, chỉ dùng để failover.</li><li><b>D. ✓</b> Tách tải đọc sang replica; replicate trong cùng Region không mất phí data transfer.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Cả hai đáp án Read Replica đều sửa được hiệu năng; chỉ khác nhau ở chi phí. Đề hỏi cost-optimal thì chọn cùng Region.</p>","tip":"<p>Multi-AZ = HA (sync, không đọc được). Read Replica = scale đọc (async, đọc được). Cross-Region replica dùng cho DR hoặc người dùng ở xa.</p>"},{"id":58,"topic":"Design Secure Architectures – Site-to-Site VPN","supplement":false,"stem":"A retail company needs a secure connection between its on-premises data center and AWS Cloud. This connection does not need high bandwidth and will handle a small amount of traffic. The company wants a quick turnaround time to set up the connection.<br>What is the MOST cost-effective way to establish such a connection?","options":[{"html":"Set up an AWS Site-to-Site VPN connection","correct":true},{"html":"Set up AWS Direct Connect","correct":false},{"html":"Set up an Internet Gateway between the on-premises data center and AWS cloud","correct":false},{"html":"Set up a bastion host on Amazon EC2","correct":false}],"multi":1,"analysis":"<p>VPN hay Direct Connect</p>","answer":"<p>Quick + cheap + low traffic + secure → VPN.</p>","explain":"<ul><li><b>A. ✓</b> Nhanh, rẻ, mã hóa IPsec.</li><li><b>B. ✗</b> Mất vài tuần đến hơn 1 tháng, đắt.</li><li><b>C. ✗</b> IGW chỉ cho VPC ra Internet.</li><li><b>D. ✗</b> Bastion để SSH vào instance private.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> —</p>","tip":"<p>DX + cần mã hóa → VPN over DX hoặc MACsec. VPN làm backup cho DX. Client VPN cho laptop cá nhân.</p>"},{"id":59,"topic":"Design Secure Architectures – Root email + Alternate Contacts","supplement":false,"stem":"A global enterprise has onboarded multiple departments into isolated AWS accounts that are part of a unified AWS Organizations structure. Recently, a critical operational alert was missed because it was delivered to the root user’s email address of an account, which is only monitored intermittently. The enterprise wants to redesign its notification handling process to ensure that future communications - categorized by billing, security, and operational relevance - are received promptly by the appropriate teams. The solution should align with AWS security best practices and offer centralized oversight without depending on individual users.<br>Which solution meets these requirements in the most secure and scalable way?","options":[{"html":"Set up a centralized email forwarding service with rules that inspect notification content and forward emails to the appropriate team based on keywords such as “billing,” “security,” or “operations.” Keep the current root email addresses as they are, and rely on this service to triage alerts","correct":false},{"html":"Assign each AWS account’s root user email to a single designated member of the respective department (e.g., security lead or billing analyst). Encourage these individuals to monitor the email accounts regularly. Also configure alternate contacts with the same individual email addresses","correct":false},{"html":"Change each AWS account’s root email to a unique departmental email list and configure IAM notification settings to send alerts based on service type. Do not use AWS alternate contacts since notifications are already routed by service in the IAM console","correct":false},{"html":"Configure each AWS account’s root user to use an alias that redirects messages to a centralized mailbox monitored by platform administrators. Then assign alternate contacts for each account using company-managed distribution lists for billing, security, and operations to handle service-specific notifications","correct":true}],"multi":1,"analysis":"<p>Best practice vận hành / governance</p>","answer":"<p>Root email dạng alias tập trung + Alternate Contacts theo 3 loại.</p>","explain":"<ul><li><b>A. ✗</b> Tự chế, lọc keyword dễ sai.</li><li><b>B. ✗</b> Phụ thuộc cá nhân, single point of failure.</li><li><b>C. ✗</b> 'IAM notification settings' không tồn tại.</li><li><b>D. ✓</b> Native, tập trung, không phụ thuộc cá nhân.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Tính năng bịa ('IAM notification settings').</p>","tip":"<p>Root: MFA, không access key, không dùng hàng ngày. Organizations quản lý alternate contacts tập trung được.</p>"},{"id":60,"topic":"Design Cost-Optimized Architectures – S3 Intelligent-Tiering","supplement":false,"stem":"The engineering team at a social media company has noticed that while some of the images stored in Amazon S3 are frequently accessed, others sit idle for a considerable span of time.<br>As a solutions architect, what is your recommendation to build the MOST cost-effective solution?","options":[{"html":"Store the images using the Amazon S3 Standard-IA storage class","correct":false},{"html":"Create a data monitoring application on an Amazon EC2 instance in the same region as the bucket storing the images. The application is triggered daily via Amazon CloudWatch and it changes the storage class of infrequently accessed objects to Amazon S3 Standard-IA and the frequently accessed objects are migrated to Amazon S3 Standard class","correct":false},{"html":"Store the images using the Amazon S3 Intelligent-Tiering storage class","correct":true},{"html":"Create a data monitoring application on an Amazon EC2 instance in the same region as the bucket storing the images. The application is triggered daily via Amazon CloudWatch and it changes the storage class of infrequently accessed objects to Amazon S3 One Zone-IA and the frequently accessed objects are migrated to Amazon S3 Standard class","correct":false}],"multi":1,"analysis":"<p>Chọn storage class theo pattern truy cập</p>","answer":"<p>Pattern truy cập hỗn hợp / không đoán trước → Intelligent-Tiering.</p>","explain":"<ul><li><b>A. ✗</b> Ảnh truy cập thường xuyên sẽ tốn phí retrieval cao.</li><li><b>B. ✗</b> Tự xây ứng dụng, tốn công và tiền EC2.</li><li><b>C. ✓</b> Tự chuyển tier theo truy cập thực tế, không phí retrieval.</li><li><b>D. ✗</b> Tự xây + One Zone-IA kém bền.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Chọn Standard-IA vì 'nhiều ảnh ít truy cập', quên phí retrieval của ảnh hay truy cập.</p>","tip":"<p>Intelligent-Tiering: không có phí retrieval, có phí monitoring nhỏ mỗi object; object &lt; 128 KB không được chuyển tier.</p>"},{"id":61,"topic":"Design Resilient Architectures – Aurora Global Database","supplement":false,"stem":"A financial services firm operates a mission-critical transaction processing platform hosted in the AWS us-east-2 Region. The backend is powered by a MySQL-compatible Amazon Aurora cluster, with high transaction volumes throughout the day. As part of its business continuity planning, the firm has selected us-west-2 as its designated disaster recovery (DR) Region.<br>The firm has defined strict DR objectives:<br>Recovery Point Objective (RPO): ≤ 5 minutes<br>Recovery Time Objective (RTO): ≤ 15 minutes<br>Leadership has asked for a DR solution that ensures fast cross-regional failover with minimal operational overhead and configuration effort. What do you recommend?","options":[{"html":"Create an Aurora read replica in us-west-2 with equivalent capacity to the primary cluster's writer node in us-east-2. Monitor replication health and configure a manual promotion process for failover","correct":false},{"html":"Deploy a separate Aurora cluster in us-west-2, and use scheduled AWS Lambda functions with custom scripts to export and import snapshots from us-east-2 every 5 minutes","correct":false},{"html":"Convert the Aurora cluster to an Aurora global database, with the secondary cluster deployed in us-west-2. Rely on Aurora global database managed failover to meet RTO and RPO objectives","correct":true},{"html":"Provision a separate Aurora MySQL-compatible cluster in us-west-2, and configure AWS Database Migration Service (AWS DMS) to replicate data from the primary database to the DR cluster continuously. Perform manual failover during DR events","correct":false}],"multi":1,"analysis":"<p>DR với con số RPO/RTO</p>","answer":"<p>Aurora Global Database đáp ứng dư RPO/RTO và native.</p>","explain":"<ul><li><b>A. ✗</b> Promote thủ công, tăng overhead và rủi ro.</li><li><b>B. ✗</b> Snapshot quá chậm cho RPO 5 phút; tự viết script.</li><li><b>C. ✓</b> Lag thường &lt; 1 giây; managed failover thường khoảng 1 phút (không cam kết cứng).</li><li><b>D. ✗</b> DMS không phải công cụ DR; failover thủ công.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Mọi đáp án có 'manual' / 'custom scripts' đều vi phạm 'minimal overhead'.</p>","tip":"<p>Backup &amp; Restore &lt; Pilot Light &lt; Warm Standby &lt; Multi-Site (chi phí tăng, RPO/RTO giảm). Aurora → Global DB. DynamoDB → Global Tables. EC2 → Elastic Disaster Recovery.</p>"},{"id":62,"topic":"Design Cost-Optimized Architectures – Replication over private IP","supplement":false,"stem":"You have deployed a database technology that has a synchronous replication mode to survive disasters in data centers. The database is therefore deployed on two Amazon EC2 instances in two Availability Zones (AZs). The database must be publicly available so you have deployed the Amazon EC2 instances in public subnets. The replication protocol currently uses the Amazon EC2 public IP addresses.<br>What can you do to decrease the replication cost?","options":[{"html":"Assign elastic IP address (EIP) to the Amazon EC2 instances and use them for the replication","correct":false},{"html":"Create a Private Link between the two Amazon EC2 instances","correct":false},{"html":"Use the Amazon EC2 instances private IP for the replication","correct":true},{"html":"Use an Elastic Fabric Adapter (EFA)","correct":false}],"multi":1,"analysis":"<p>Tối ưu chi phí data transfer</p>","answer":"<p>Cùng VPC thì dùng IP private để không bị tính như traffic public.</p>","explain":"<ul><li><b>A. ✗</b> EIP vẫn là IP public, traffic vẫn tính theo đường public.</li><li><b>B. ✗</b> PrivateLink để expose service qua NLB, không dùng cho 2 instance cùng VPC.</li><li><b>C. ✓</b> Traffic ở trong VPC, rẻ nhất.</li><li><b>D. ✗</b> EFA dành cho HPC, không giảm chi phí.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> EIP chỉ là IP public tĩnh, không đổi đường đi của traffic.</p>","tip":"<p>Traffic cross-AZ qua IP private vẫn có phí (~$0.01/GB mỗi chiều) nhưng rẻ hơn IP public. Cùng AZ qua IP private: miễn phí.</p>"},{"id":63,"topic":"Design Secure Architectures – WAF rate-based rule","supplement":false,"stem":"Your application is deployed on Amazon EC2 instances fronted by an Application Load Balancer. Recently, your infrastructure has come under attack. Attackers perform over 100 requests per second, while your normal users only make about 5 requests per second.<br>How can you efficiently prevent attackers from overwhelming your application?","options":[{"html":"Define a network access control list (network ACL) on your Application Load Balancer","correct":false},{"html":"Use AWS Shield Advanced and setup a rate-based rule","correct":false},{"html":"Use an AWS Web Application Firewall (AWS WAF) and setup a rate-based rule","correct":true},{"html":"Configure Sticky Sessions on the Application Load Balancer","correct":false}],"multi":1,"analysis":"<p>Chọn dịch vụ theo loại tấn công</p>","answer":"<p>Phân biệt theo tốc độ request per IP → WAF rate-based rule.</p>","explain":"<ul><li><b>A. ✗</b> NACL gắn subnet, không đếm tốc độ request.</li><li><b>B. ✗</b> Rate-based rule là tính năng của WAF, không phải Shield.</li><li><b>C. ✓</b> Tự chặn IP vượt ngưỡng request.</li><li><b>D. ✗</b> Chỉ giữ session, không chặn gì.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Ghép tính năng của WAF vào Shield.</p>","tip":"<p>SQLi/XSS → WAF managed rules. DDoS L3/L4 → Shield Standard. DDoS lớn + DRT → Shield Advanced. SG không có rule deny.</p>"},{"id":64,"topic":"Design High-Performing Architectures – ASG scaling on SQS backlog","supplement":false,"stem":"A retail startup runs a high-traffic order processing system on AWS. The architecture includes a frontend web tier using EC2 instances behind an Application Load Balancer, a processing tier powered by EC2 instances, and a data layer using Amazon DynamoDB. The frontend and processing tiers are decoupled using Amazon SQS. Recently, the engineering team observed that during unpredictable traffic surges, order processing slows down significantly, SQS queue depth increases rapidly, and the processing-tier EC2 instances hit 100% CPU usage.<br>Which solution will help improve the application’s responsiveness and scalability during peak load periods?","options":[{"html":"Add Amazon Kinesis Data Streams to buffer order events from the web tier. Configure the processing tier to consume records from the stream and use enhanced fan-out for high throughput","correct":false},{"html":"Use scheduled Auto Scaling for the processing tier based on past peak periods. Use average CPU utilization to define scaling thresholds","correct":false},{"html":"Use an EC2 Auto Scaling group with a target tracking policy to automatically scale the processing tier. Configure the policy to monitor the ApproximateNumberOfMessages in the SQS queue","correct":true},{"html":"Use Amazon EventBridge to schedule batch processing jobs for the queue. Configure the event rule to invoke EC2-based workers every 10 minutes to process messages in the SQS queue","correct":false}],"multi":1,"analysis":"<p>Tìm nút thắt cổ chai rồi sửa đúng chỗ</p>","answer":"<p>Queue vẫn nhận tốt, worker thiếu capacity → scale worker theo backlog.</p>","explain":"<ul><li><b>A. ✗</b> Sửa tầng ingest (đang chạy tốt); worker vẫn 100% CPU.</li><li><b>B. ✗</b> Traffic không đoán trước được, scheduled không phù hợp.</li><li><b>C. ✓</b> Scale worker theo lượng việc đang chờ, đúng root cause.</li><li><b>D. ✗</b> Biến thành batch, tăng độ trễ.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đáp án dùng dịch vụ 'mạnh hơn' nhưng sửa sai tầng.</p>","tip":"<p>AWS khuyến nghị metric 'backlog per instance'. Target tracking thường là đáp án đơn giản nhất. Predictable → scheduled/predictive.</p>"},{"id":65,"topic":"Design High-Performing Architectures – S3 Byte-Range Fetch","supplement":false,"stem":"You are looking to build an index of your files in Amazon S3, using Amazon RDS PostgreSQL. To build this index, it is necessary to read the first 250 bytes of each object in Amazon S3, which contains some metadata about the content of the file itself. There are over 100,000 files in your S3 bucket, amounting to 50 terabytes of data.<br>How can you build this index efficiently?","options":[{"html":"Use the Amazon RDS Import feature to load the data from Amazon S3 to PostgreSQL, and run a SQL query to build the index","correct":false},{"html":"Create an application that will traverse the Amazon S3 bucket, then use S3 Select Byte Range Fetch parameter to get the first 250 bytes, and store that information in Amazon RDS","correct":false},{"html":"Create an application that will traverse the S3 bucket, issue a Byte Range Fetch for the first 250 bytes, and store that information in Amazon RDS","correct":true},{"html":"Create an application that will traverse the Amazon S3 bucket, read all the files one by one, extract the first 250 bytes, and store that information in Amazon RDS","correct":false}],"multi":1,"analysis":"<p>Gắn sai tên tính năng</p>","answer":"<p>Byte-Range Fetch là tính năng của GET Object, đọc được một đoạn byte của mọi loại file.</p>","explain":"<ul><li><b>A. ✗</b> Import dành cho dữ liệu dạng bảng; nạp 50 TB vào DB là vô lý.</li><li><b>B. ✗</b> Ghép sai tên: S3 Select dùng tham số ScanRange, không có 'Byte Range Fetch'.</li><li><b>C. ✓</b> GET Object với header Range: bytes=0-249; chỉ tải ~25 MB tổng.</li><li><b>D. ✗</b> Tải 50 TB, chậm và đắt.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Hai đáp án gần giống nhau, chỉ khác cụm 'S3 Select'.</p>","tip":"<p>Upload lớn → Multipart. Upload xa → Transfer Acceleration. Lọc dòng CSV/JSON → Athena (S3 Select đã ngừng cho khách mới).</p>"}];
const LETTERS = "ABCDEFGH";
const state = {
  order: Q.map((_, i) => i),
  pos: 0,
  sel: {},        // qid -> Set of original option idx
  done: {},       // qid -> true/false (correct?)
  flags: new Set(),
  perm: {},       // qid -> displayed order of original option indices
  hint: {},
  view: "quiz"
};
const $ = s => document.querySelector(s);

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function perm(q){
  if(!state.perm[q.id]) state.perm[q.id] = $("#optShuffleA").checked ? shuffle(q.options.map((_,i)=>i)) : q.options.map((_,i)=>i);
  return state.perm[q.id];
}
function visible(){
  const f = $("#fFilter").value, t = $("#fTopic").value;
  return state.order.filter(i => {
    const q = Q[i];
    if(t && topicGroup(q.topic) !== t) return false;
    if(f === "todo") return !(q.id in state.done);
    if(f === "bad") return state.done[q.id] === false;
    if(f === "flag") return state.flags.has(q.id);
    if(f === "sup") return q.supplement;
    return true;
  });
}
function topicGroup(t){ return t.split("–")[0].trim(); }

function renderStats(){
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length, bad = vals.length - ok;
  $("#sDone").textContent = `${vals.length}/${Q.length}`;
  $("#sOk").textContent = ok; $("#sBad").textContent = bad;
  $("#sPct").textContent = vals.length ? Math.round(ok*100/vals.length) + "%" : "–";
  $("#prog").style.width = (vals.length*100/Q.length) + "%";
}
function renderGrid(){
  const vis = new Set(visible());
  const cur = state.order[state.pos];
  const g = $("#grid"); g.innerHTML = "";
  Q.forEach((q, i) => {
    const b = document.createElement("button");
    b.className = "cell";
    if(q.id in state.done) b.classList.add(state.done[q.id] ? "ok" : "bad");
    if(state.flags.has(q.id)) b.classList.add("flag");
    if(q.supplement) b.classList.add("sup");
    if(i === cur && state.view === "quiz") b.classList.add("cur");
    if(!vis.has(i)) b.classList.add("dim");
    b.textContent = q.id;
    b.title = q.topic + (q.supplement ? " (câu bổ sung)" : "");
    b.onclick = () => { state.view = "quiz"; state.pos = state.order.indexOf(i); render(); window.scrollTo({top:0,behavior:"smooth"}); };
    g.appendChild(b);
  });
}

function section(cls, title, html, open){
  return `<details class="sec ${cls}" ${open?"open":""}><summary>${title}</summary><div class="body">${html}</div></details>`;
}

function renderQuiz(){
  const main = $("#main");
  const vis = visible();
  if(!vis.length){ main.innerHTML = `<div class="card empty">Không có câu nào khớp bộ lọc hiện tại.</div>`; return; }
  let idx = state.order[state.pos];
  if(!vis.includes(idx)){ idx = vis[0]; state.pos = state.order.indexOf(idx); }
  const q = Q[idx];
  const answered = q.id in state.done;
  const sel = state.sel[q.id] || new Set();
  const p = perm(q);
  const vpos = vis.indexOf(idx);

  let opts = p.map((oi, k) => {
    const o = q.options[oi];
    let cls = "opt" + (q.multi > 1 ? " multi" : "");
    let tag = "";
    if(answered){
      if(o.correct && sel.has(oi)){ cls += " right"; tag = "✓ Đúng"; }
      else if(!o.correct && sel.has(oi)){ cls += " wrong"; tag = "✗ Bạn chọn"; }
      else if(o.correct){ cls += " right missed"; tag = "✓ Đáp án đúng"; }
    } else if(sel.has(oi)) cls += " sel";
    return `<div class="${cls}" data-oi="${oi}" role="${q.multi>1?"checkbox":"radio"}" aria-checked="${sel.has(oi)}" tabindex="0">
      <span class="key">${LETTERS[k]}</span><span class="txt">${o.html}${tag?`<span class="tag">${tag}</span>`:""}</span></div>`;
  }).join("");

  const showExplain = answered && $("#optAuto").checked;
  let after = "";
  if(answered){
    const ok = state.done[q.id];
    after += `<div class="verdict ${ok?"ok":"bad"}">${ok ? "Chính xác!" :"Chưa đúng. Xem đáp án được đánh dấu xanh và phần giải thích bên dưới."}</div>`;
    after += section("s-analysis", "Phân tích đề", q.analysis, showExplain);
    after += section("s-answer", "Đáp án đúng", q.answer, showExplain);
    after += section("s-explain", "Giải thích", q.explain, showExplain);
    after += section("s-wrong", "Vì sao các đáp án khác sai", q.wrong, showExplain);
    after += section("s-tip", "Mẹo thi", q.tip, showExplain);
  } else if(state.hint[q.id]){
    after += `<div class="hint"><h3>Gợi ý · Phân tích đề</h3><div class="body">${q.analysis}</div></div>`;
  }

  const need = q.multi > 1 ? `Chọn ${q.multi} đáp án` : "Chọn 1 đáp án";
  main.innerHTML = `<div class="card ${answered?"locked":""}">
    <div class="qhead">
      <span class="qnum">Câu ${q.id}</span>
      <span class="chip">${q.topic}</span>
      ${q.supplement ? `<span class="chip sup">Câu bổ sung</span>` : ""}
      <span class="chip multi">${need}</span>
      <button class="flagbtn ${state.flags.has(q.id)?"on":""}" id="btnFlag">${state.flags.has(q.id)?"★ Đã đánh dấu":"☆ Đánh dấu"}</button>
    </div>
    <div class="stem">${q.stem}</div>
    <div class="opts">${opts}</div>
    <div class="actions">
      <button class="btn" id="btnPrev" ${vpos<=0?"disabled":""}>← Câu trước</button>
      ${!answered ? `<button class="btn ghost" id="btnHint">${state.hint[q.id]?"Ẩn gợi ý":"Gợi ý: phân tích đề"}</button>` : `<button class="btn ghost" id="btnRetry">Làm lại câu này</button>`}
      <span class="spacer"></span>
      ${!answered ? `<button class="btn primary" id="btnCheck" ${sel.size!==q.multi?"disabled":""}>Kiểm tra</button>` : ""}
      <button class="btn ${answered?"primary":""}" id="btnNext" ${vpos>=vis.length-1?"disabled":""}>Câu sau →</button>
    </div>
    ${after}
    <div class="kbd"><kbd>A</kbd>–<kbd>E</kbd> hoặc <kbd>1</kbd>–<kbd>5</kbd> chọn đáp án · <kbd>Enter</kbd> kiểm tra / sang câu sau · <kbd>←</kbd> <kbd>→</kbd> chuyển câu · <kbd>H</kbd> gợi ý</div>
  </div>`;

  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => toggle(q, +el.dataset.oi);
    el.onkeydown = e => { if(e.key===" "){ e.preventDefault(); toggle(q, +el.dataset.oi); } };
  });
  $("#btnFlag").onclick = () => { state.flags.has(q.id) ? state.flags.delete(q.id) : state.flags.add(q.id); render(); };
  $("#btnPrev").onclick = () => go(-1);
  $("#btnNext").onclick = () => go(1);
  if($("#btnCheck")) $("#btnCheck").onclick = () => check(q);
  if($("#btnHint")) $("#btnHint").onclick = () => { state.hint[q.id] = !state.hint[q.id]; render(); };
  if($("#btnRetry")) $("#btnRetry").onclick = () => { delete state.done[q.id]; state.sel[q.id] = new Set(); delete state.perm[q.id]; render(); };
}

function toggle(q, oi){
  if(q.id in state.done) return;
  const s = state.sel[q.id] || (state.sel[q.id] = new Set());
  if(q.multi === 1){ s.clear(); s.add(oi); }
  else if(s.has(oi)) s.delete(oi);
  else { if(s.size >= q.multi) return; s.add(oi); }
  render();
}
function check(q){
  const s = state.sel[q.id] || new Set();
  if(s.size !== q.multi) return;
  const correct = q.options.every((o, i) => o.correct === s.has(i));
  state.done[q.id] = correct;
  render();
}
function go(d){
  const vis = visible();
  const cur = state.order[state.pos];
  let vp = vis.indexOf(cur);
  vp = Math.max(0, Math.min(vis.length-1, vp + d));
  state.pos = state.order.indexOf(vis[vp]);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderSummary(){
  const groups = {};
  Q.forEach(q => {
    const g = topicGroup(q.topic);
    groups[g] = groups[g] || {n:0, done:0, ok:0, bad:[]};
    groups[g].n++;
    if(q.id in state.done){ groups[g].done++; if(state.done[q.id]) groups[g].ok++; else groups[g].bad.push(q.id); }
  });
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length;
  const wrongIds = Q.filter(q => state.done[q.id] === false).map(q => q.id);
  const rows = Object.entries(groups).sort((a,b)=>b[1].n-a[1].n).map(([g, v]) => {
    const pct = v.done ? Math.round(v.ok*100/v.done) : null;
    return `<tr><td>${g}</td><td class="n">${v.done}/${v.n}</td><td class="n">${pct===null?"–":pct+"%"}</td>
      <td><div class="bar"><i style="width:${pct||0}%"></i></div></td><td>${v.bad.map(id=>`<a href="#" data-q="${id}">${id}</a>`).join(", ")}</td></tr>`;
  }).join("");
  $("#main").innerHTML = `<div class="card summary">
    <h2>Kết quả</h2>
    <p>Đã làm <b>${vals.length}/${Q.length}</b> câu · Đúng <b>${ok}</b> · Sai <b>${vals.length-ok}</b>${vals.length?` · Tỷ lệ đúng <b>${Math.round(ok*100/vals.length)}%</b>`:""}.
    ${vals.length===Q.length ? (ok/Q.length>=0.72 ? " Mức này tương đương ngưỡng đậu (~720/1000)." : " Chưa đạt ngưỡng ~72%, nên ôn lại các câu sai.") : ""}</p>
    ${wrongIds.length ? `<p><button class="btn primary" id="btnReviewBad">Ôn lại ${wrongIds.length} câu sai</button></p>` : ""}
    <table><thead><tr><th>Chủ đề</th><th class="n">Đã làm</th><th class="n">Đúng</th><th></th><th>Câu sai</th></tr></thead><tbody>${rows}</tbody></table>
    <p style="margin-top:14px"><button class="btn" id="btnBack">← Quay lại làm bài</button></p>
  </div>`;
  $("#btnBack").onclick = () => { state.view = "quiz"; render(); };
  if($("#btnReviewBad")) $("#btnReviewBad").onclick = () => {
    $("#fFilter").value = "bad"; $("#fTopic").value = "";
    wrongIds.forEach(id => { delete state.done[id]; state.sel[id] = new Set(); delete state.perm[id]; });
    // keep them findable after reset: mark as flagged review set
    wrongIds.forEach(id => state.flags.add(id));
    $("#fFilter").value = "flag";
    state.view = "quiz"; state.pos = state.order.indexOf(Q.findIndex(q => q.id === wrongIds[0])); render();
  };
  $("#main").querySelectorAll("a[data-q]").forEach(a => a.onclick = e => {
    e.preventDefault(); state.view = "quiz"; $("#fFilter").value = "all"; $("#fTopic").value = "";
    state.pos = state.order.indexOf(Q.findIndex(q => q.id === +a.dataset.q)); render();
  });
}

function render(){
  renderStats(); renderGrid();
  state.view === "summary" ? renderSummary() : renderQuiz();
}

// init
(function(){
  const groups = [...new Set(Q.map(q => topicGroup(q.topic)))].sort();
  groups.forEach(g => { const o = document.createElement("option"); o.value = g; o.textContent = g; $("#fTopic").appendChild(o); });
  $("#fFilter").onchange = $("#fTopic").onchange = () => { state.view = "quiz"; render(); };
  $("#optShuffleQ").onchange = e => {
    const cur = state.order[state.pos];
    state.order = e.target.checked ? shuffle(Q.map((_, i) => i)) : Q.map((_, i) => i);
    state.pos = e.target.checked ? 0 : state.order.indexOf(cur);
    render();
  };
  $("#optShuffleA").onchange = () => { Q.forEach(q => { if(!(q.id in state.done)) delete state.perm[q.id]; }); render(); };
  $("#optAuto").onchange = render;
  $("#btnSummary").onclick = () => { state.view = "summary"; render(); };
  $("#btnReset").onclick = () => {
    if(!Object.keys(state.done).length) return;
    state.sel = {}; state.done = {}; state.hint = {}; state.perm = {}; state.pos = 0; state.view = "quiz";
    $("#fFilter").value = "all"; render();
  };
  $("#btnTheme").onclick = () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  };
  document.addEventListener("keydown", e => {
    if(state.view !== "quiz" || e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    const q = Q[state.order[state.pos]]; if(!q) return;
    const k = e.key.toUpperCase();
    let n = "12345678".indexOf(k); if(n < 0) n = LETTERS.indexOf(k);
    if(k.length === 1 && n >= 0 && n < q.options.length && k !== "H"){ toggle(q, perm(q)[n]); return; }
    if(e.key === "Enter"){ e.preventDefault(); (q.id in state.done) ? go(1) : check(q); }
    else if(e.key === "ArrowRight") go(1);
    else if(e.key === "ArrowLeft") go(-1);
    else if(k === "H" && !(q.id in state.done)){ state.hint[q.id] = !state.hint[q.id]; render(); }
  });
  render();
})();
</script>
</body>
</html>
