<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện đề SAA-C03</title>
<style>
:root{
  --bg:#f6f5f1;--surface:#ffffff;--surface2:#f0eee8;--text:#1d1c1a;--muted:#6b6862;--border:#dedbd3;
  --accent:#2f5d8a;--accent-soft:#e3ecf5;--ok:#2e7d4f;--ok-soft:#e2f2e8;--bad:#b3412f;--bad-soft:#f8e4df;--warn:#9a6a12;--warn-soft:#f6ecd6;
  --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header h1{font-size:1.45rem;margin:0 0 4px}
header p{margin:0;color:var(--muted);font-size:.92rem}
nav.tabs{display:flex;gap:6px;margin:18px 0 14px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.92rem}
nav.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.controls label{font-size:.88rem;color:var(--muted);display:flex;gap:6px;align-items:center}
select,.btn{font:inherit;font-size:.9rem;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 12px}
.btn{cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.progress>div{height:100%;background:var(--accent);width:0}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.85rem;color:var(--muted)}
.chip{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);margin-right:4px}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.qtext{font-size:1.05rem;margin:12px 0 4px;white-space:pre-line}
.hint{font-size:.85rem;color:var(--warn);margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:11px 12px;margin:8px 0;cursor:pointer;font:inherit}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:0 0 26px;height:26px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt .note{display:block;font-size:.85rem;color:var(--muted);margin-top:4px}
.code{display:block;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82rem;line-height:1.5;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:6px 0 2px}
.opt[disabled]{cursor:default}
.verdict{font-weight:700;margin:14px 0 8px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.explain{border-top:1px dashed var(--border);margin-top:10px;padding-top:10px}
.explain p{margin:6px 0}
.explain b{color:var(--accent)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.score div{background:var(--surface2);border-radius:10px;padding:10px;text-align:center}
.score b{display:block;font-size:1.4rem}
.score span{font-size:.78rem;color:var(--muted)}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.grid button{width:44px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.82rem}
.grid button.cur{outline:2px solid var(--accent)}
.grid button.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.grid button.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
h2{font-size:1.15rem;margin:22px 0 10px}
h3{font-size:1rem;margin:20px 0 8px}
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:var(--surface2);font-weight:600}
tr:last-child td{border-bottom:none}
.search{width:100%;margin-bottom:6px}
ol.method li{margin:8px 0}
.hidden{display:none}
.result-list li{margin:4px 0}
.result-list a{color:var(--accent);cursor:pointer;text-decoration:underline}
@media (max-width:560px){.score{grid-template-columns:1fr 1fr 1fr}.opt{padding:10px}}
</style>
</head>

  <h1>Luyện đề AWS SAA-C03</h1>

  <div id="cheat"></div>

<script>
const DATA = {"domains":{"cost":"Design Cost-Optimized Architectures","res":"Design Resilient Architectures","sec":"Design Secure Architectures","perf":"Design High-Performing Architectures"},"questions":[{"id":1,"domain":"cost","topic":"EC2 Spot Instances behavior","q":"The development team at a retail company wants to optimize the cost of Amazon EC2 instances. The team wants to move certain nightly batch jobs to spot instances. The team has hired you as a solutions architect to provide the initial guidance.\nWhich of the following would you identify as CORRECT regarding the capabilities of spot instances? (Select three)","opts":["When you cancel an active spot request, it terminates the associated instance as well","If a spot request is persistent, then it is opened again after your Spot Instance is interrupted","Spot Fleets can maintain target capacity by launching replacement instances after Spot Instances in the fleet are terminated","When you cancel an active spot request, it does not terminate the associated instance","If a spot request is persistent, then it is opened again after you stop the Spot Instance","Spot Fleets cannot maintain target capacity by launching replacement instances after Spot Instances in the fleet are terminated"],"ans":[1,2,3],"you1":[3,4,5],"notes":["Sai: hủy request đang active không tự terminate instance đang chạy, phải tự terminate thủ công.","Đúng: request persistent tự mở lại khi Spot Instance bị interrupted (thu hồi).","Đúng: Spot Fleet mặc định duy trì target capacity bằng cách launch instance thay thế.","Đúng: hủy request active không terminate instance đang chạy kèm theo nó.","Sai: nếu bạn tự stop Spot Instance (không phải bị interrupt), request chỉ mở lại khi bạn start lại, không phải 'opened again sau khi stop'.","Sai — phủ định của sự thật: Spot Fleet VẪN duy trì target capacity bằng replacement instance."],"pattern":"Phân biệt hành vi persistent/one-time của Spot request và Spot Fleet","why":"Request persistent chỉ tự mở lại khi Spot Instance bị AWS interrupt (thu hồi), không phải khi người dùng chủ động stop; và hủy request không tự terminate instance.","trap":"Hai cặp phát biểu gần giống nhau (interrupted vs stop, cancel có/không terminate) đánh vào việc nhớ nhầm chiều sự thật.","tip":"Spot Instance bị AWS thu hồi (interrupted) khác với việc bạn chủ động stop — chỉ trường hợp đầu khiến request persistent tự mở lại ngay."},{"id":2,"domain":"sec","topic":"GuardDuty vs Macie","q":"A financial services company wants to identify any sensitive data stored on its Amazon S3 buckets. The company also wants to monitor and protect all data stored on Amazon S3 against any malicious activity.\nAs a solutions architect, which of the following solutions would you recommend to help address the given requirements?","opts":["Use Amazon Macie to monitor any malicious activity on data stored in Amazon S3. Use Amazon GuardDuty to identify any sensitive data stored on Amazon S3","Use Amazon Macie to monitor any malicious activity on data stored in Amazon S3 as well as to identify any sensitive data stored on Amazon S3","Use Amazon GuardDuty to monitor any malicious activity on data stored in Amazon S3. Use Amazon Macie to identify any sensitive data stored on Amazon S3","Use Amazon GuardDuty to monitor any malicious activity on data stored in Amazon S3 as well as to identify any sensitive data stored on Amazon S3"],"ans":[2],"you1":[2],"notes":["Sai: đảo ngược vai trò — Macie không chuyên giám sát hoạt động độc hại, GuardDuty mới làm việc đó.","Sai: Macie không có chức năng giám sát hoạt động độc hại/threat detection.","Đúng: GuardDuty giám sát hành vi độc hại (threat detection), Macie phát hiện dữ liệu nhạy cảm (PII) — đúng vai trò từng dịch vụ.","Sai: GuardDuty không chuyên phát hiện dữ liệu nhạy cảm (PII) trong S3."],"pattern":"Ghép đúng dịch vụ bảo mật S3 theo đúng chuyên môn (threat detection vs data discovery)","why":"GuardDuty là dịch vụ threat detection dựa trên CloudTrail/VPC Flow Logs/DNS logs; Macie chuyên quét và phát hiện dữ liệu nhạy cảm bằng ML.","trap":"Các phương án hoán đổi vai trò 2 dịch vụ, hoặc gán cả 2 việc cho 1 dịch vụ duy nhất, nghe vẫn hợp lý nếu không nhớ rõ chuyên môn từng dịch vụ.","tip":"Macie = PII/dữ liệu nhạy cảm trong S3. GuardDuty = hành vi độc hại/threat intelligence toàn tài khoản."},{"id":3,"domain":"perf","topic":"S3 Transfer Acceleration vs CloudFront for large files","q":"A media startup is looking at hosting their web application on AWS Cloud. The application will be accessed by users from different geographic regions of the world to upload and download video files that can reach a maximum size of 10 gigabytes. The startup wants the solution to be cost-effective and scalable with the lowest possible latency for a great user experience.\nAs a Solutions Architect, which of the following will you suggest as an optimal solution to meet the given requirements?","opts":["Use Amazon EC2 with AWS Global Accelerator for faster distribution of content, while using Amazon S3 as storage service","Use Amazon EC2 with Amazon ElastiCache for faster distribution of content, while Amazon S3 can be used as a storage service","Use Amazon S3 for hosting the web application and use Amazon CloudFront for faster distribution of content to geographically dispersed users","Use Amazon S3 for hosting the web application and use Amazon S3 Transfer Acceleration (Amazon S3TA) to reduce the latency that geographically dispersed users might face"],"ans":[3],"you1":[0],"notes":["Sai: Global Accelerator tối ưu traffic mạng nói chung, không chuyên tăng tốc upload/download tới S3; lại thêm EC2 không cần thiết.","Sai: ElastiCache là cache trong bộ nhớ, không giúp tăng tốc truyền file lớn qua khoảng cách xa tới S3.","Sai: CloudFront tối ưu cho object dưới 1GB; với file tới 10GB, S3 Transfer Acceleration phù hợp hơn.","Đúng: S3TA được thiết kế riêng để tăng tốc upload/download file lớn qua khoảng cách địa lý xa, dùng mạng CloudFront nhưng tối ưu cho transfer lớn."],"pattern":"Chọn cơ chế tăng tốc S3 đúng theo kích thước object (dưới 1GB vs lớn hơn)","why":"Với object lớn hơn 1GB, S3 Transfer Acceleration được AWS khuyến nghị thay vì CloudFront để tối ưu tốc độ truyền.","trap":"CloudFront nghe như lựa chọn 'chuẩn' cho phân phối nội dung toàn cầu, nhưng với file rất lớn (10GB) S3TA mới là lựa chọn tối ưu theo khuyến nghị AWS.","tip":"Object nhỏ (<1GB), cần cache: CloudFront. Object lớn, upload/download khoảng cách xa: S3 Transfer Acceleration."},{"id":4,"domain":"sec","topic":"IAM role + instance profile for EC2","q":"An application running on an Amazon EC2 instance needs to access a Amazon DynamoDB table in the same AWS account.\nWhich of the following solutions should a solutions architect configure for the necessary permissions?","opts":["Set up an IAM user with the appropriate permissions to allow access to the Amazon DynamoDB table. Store the access credentials in an Amazon S3 bucket and read them from within the application code directly","Set up an IAM service role with the appropriate permissions to allow access to the Amazon DynamoDB table. Add the Amazon EC2 instance to the trust relationship policy document so that the instance can assume the role","Set up an IAM user with the appropriate permissions to allow access to the Amazon DynamoDB table. Store the access credentials in the local storage and read them from within the application code directly","Set up an IAM service role with the appropriate permissions to allow access to the Amazon DynamoDB table. Configure an instance profile to assign this IAM role to the Amazon EC2 instance"],"ans":[3],"you1":[3],"notes":["Sai: lưu access credentials của IAM user trong S3 là thực hành bảo mật tệ, không nên hard-code credentials.","Sai: thừa bước — khi tạo service role cho EC2, EC2 đã mặc định là trusted entity, không cần tự thêm vào trust policy.","Sai: lưu credentials trong local storage cũng là thực hành bảo mật tệ tương tự.","Đúng: dùng instance profile để gắn IAM role cho EC2 — cách chuẩn, không cần quản lý credentials thủ công."],"pattern":"Cấp quyền cho EC2 truy cập dịch vụ AWS khác — luôn dùng IAM role + instance profile","why":"Instance profile là container chuẩn để gắn IAM role vào EC2, EC2 tự động được coi là trusted entity khi tạo role qua console.","trap":"Phương án B nghe có vẻ đúng kỹ thuật (thêm trust relationship) nhưng là bước thừa không cần thiết khi tạo role cho EC2.","tip":"Không bao giờ lưu access key/secret trong code hay storage — luôn dùng IAM role gắn qua instance profile cho EC2."},{"id":5,"domain":"perf","topic":"EFS Provisioned Throughput vs DynamoDB for ECS task output","q":"An engineering team wants to orchestrate multiple Amazon ECS task types running on Amazon EC2 instances that are part of the Amazon ECS cluster. The output and state data for all tasks need to be stored. The amount of data output by each task is approximately 20 megabytes and there could be hundreds of tasks running at a time. As old outputs are archived, the storage size is not expected to exceed 1 terabyte.\nAs a solutions architect, which of the following would you recommend as an optimized solution for high-frequency reading and writing?","opts":["Use an Amazon EBS volume mounted to the Amazon ECS cluster instances","Use Amazon DynamoDB table that is accessible by all ECS cluster instances","Use Amazon EFS with Provisioned Throughput mode","Use Amazon EFS with Bursting Throughput mode"],"ans":[2],"you1":[1],"notes":["Sai: EBS chỉ gắn 1 AZ, không chia sẻ dễ dàng cho nhiều instance cluster cùng lúc (trừ io1/io2 Multi-Attach).","Sai: DynamoDB giới hạn 400KB/item, trong khi mỗi task output tới 20MB — không phù hợp nếu không tự chia nhỏ dữ liệu.","Đúng: EFS Provisioned Throughput đảm bảo throughput cao, ổn định cho high-frequency read/write không phụ thuộc dung lượng lưu trữ.","Sai: Bursting Throughput scale theo dung lượng lưu trữ, nhưng dữ liệu cũ bị archive nên dung lượng thấp — không đủ throughput bền vững."],"pattern":"Chọn chế độ throughput EFS phù hợp khi dung lượng lưu trữ thấp nhưng cần throughput cao liên tục","why":"Provisioned Throughput tách rời throughput khỏi dung lượng lưu trữ, đáp ứng đúng yêu cầu đọc/ghi tần suất cao dù dữ liệu archive giữ dung lượng nhỏ.","trap":"DynamoDB nghe hợp lý cho dữ liệu state nhưng giới hạn kích thước item 400KB khiến nó không khả thi với output 20MB/task.","tip":"Bursting Throughput scale theo dung lượng lưu trữ; nếu dữ liệu bị archive/xóa thường xuyên nhưng vẫn cần throughput cao → chọn Provisioned Throughput."},{"id":6,"domain":"sec","topic":"AWS Config vs CloudWatch vs CloudTrail","q":"A financial services company has recently migrated from on-premises infrastructure to AWS Cloud. The DevOps team wants to implement a solution that allows all resource configurations to be reviewed and make sure that they meet compliance guidelines. Also, the solution should be able to offer the capability to look into the resource configuration history across the application stack.\nAs a solutions architect, which of the following solutions would you recommend to the team?","opts":["Use Amazon CloudWatch to review resource configurations to meet compliance guidelines and maintain a history of resource configuration changes","Use AWS Config to review resource configurations to meet compliance guidelines and maintain a history of resource configuration changes","Use AWS CloudTrail to review resource configurations to meet compliance guidelines and maintain a history of resource configuration changes","Use AWS Systems Manager to review resource configurations to meet compliance guidelines and maintain a history of resource configuration changes"],"ans":[1],"you1":[1],"notes":["Sai: CloudWatch theo dõi performance/metric/alarm, không lưu lịch sử cấu hình resource.","Đúng: AWS Config chuyên đánh giá, audit cấu hình và lưu lịch sử thay đổi cấu hình resource theo thời gian.","Sai: CloudTrail ghi lại ai gọi API nào (audit hoạt động), không phải lịch sử cấu hình resource.","Sai: Systems Manager quản lý/nhóm resource vận hành, không lưu lịch sử cấu hình compliance."],"pattern":"Phân biệt CloudWatch (performance) / CloudTrail (audit activity) / Config (resource config history)","why":"AWS Config được thiết kế riêng để đánh giá compliance và lưu trữ lịch sử cấu hình resource theo thời gian.","trap":"CloudTrail và CloudWatch đều là dịch vụ giám sát quen thuộc nên dễ bị chọn nhầm khi câu hỏi thực chất hỏi về lịch sử CẤU HÌNH.","tip":"Hiệu năng/alarm → CloudWatch. Ai gọi API gì → CloudTrail. Lịch sử cấu hình/compliance → Config."},{"id":7,"domain":"res","topic":"Kinesis Data Streams for real-time retry-capable ingestion","q":"A health care application processes the real-time health data of the patients into an analytics workflow. With a sharp increase in the number of users, the system has become slow and sometimes even unresponsive as it does not have a retry mechanism. The startup is looking at a scalable solution that has minimal implementation overhead.\nWhich of the following would you recommend as a scalable alternative to the current solution?","opts":["Use Amazon Simple Queue Service (Amazon SQS) for data ingestion and configure AWS Lambda to trigger logic for downstream processing","Use Amazon Simple Notification Service (Amazon SNS) for data ingestion and configure AWS Lambda to trigger logic for downstream processing","Use Amazon Kinesis Data Streams to ingest the data, process it using AWS Lambda or run analytics using Amazon Kinesis Data Analytics","Use Amazon API Gateway with the existing REST-based interface to create a high performing architecture"],"ans":[2],"you1":[0],"notes":["Sai: SQS khả thi để decouple nhưng không chuyên biệt cho streaming dữ liệu thời gian thực với retry built-in như Kinesis.","Sai: SNS là push mechanism, không có retry mechanism mạnh cho dữ liệu stream.","Đúng: Kinesis Data Streams xây dựng riêng cho dữ liệu stream thời gian thực, có retry mechanism, khả năng mở rộng cao.","Sai: API Gateway không phải giải pháp xử lý streaming data."],"pattern":"Chọn đúng dịch vụ streaming chuyên biệt khi cần retry mechanism cho dữ liệu real-time","why":"Kinesis Data Streams được thiết kế riêng cho streaming dữ liệu thời gian thực khối lượng lớn với cơ chế retry sẵn có.","trap":"SQS vẫn 'work' được (như explanation thừa nhận) nên dễ chọn nhầm, nhưng Kinesis mới là lựa chọn chuyên biệt nhất cho real-time streaming.","tip":"Dữ liệu thời gian thực khối lượng lớn, cần nhiều consumer/replay → Kinesis Data Streams, không phải SQS/SNS."},{"id":8,"domain":"res","topic":"FSx for Windows File Server with AD integration","q":"An IT company hosts windows based applications on its on-premises data center. The company is looking at moving the business to the AWS Cloud. The cloud solution should offer shared storage space that multiple applications can access without a need for replication. Also, the solution should integrate with the company's self-managed Active Directory domain.\nWhich of the following solutions addresses these requirements with the minimal integration effort?","opts":["Use Amazon Elastic File System (Amazon EFS) as a shared storage solution","Use Amazon FSx for Lustre as a shared storage solution with millisecond latencies","Use Amazon FSx for Windows File Server as a shared storage solution","Use File Gateway of AWS Storage Gateway to create a hybrid storage solution"],"ans":[2],"you1":[2],"notes":["Sai: EFS chỉ tương thích Linux (NFS), không hỗ trợ Windows AMI.","Sai: FSx for Lustre dùng cho Linux/HPC, không phù hợp ứng dụng Windows.","Đúng: FSx for Windows File Server hỗ trợ SMB và tích hợp Active Directory sẵn có, đúng yêu cầu Windows.","Sai: File Gateway dùng cho hybrid storage với S3, không phải giải pháp shared storage song song cho nhiều ứng dụng như yêu cầu."],"pattern":"Chọn dịch vụ file storage theo hệ điều hành (Windows) và khả năng tích hợp AD","why":"FSx for Windows File Server được xây dựng trên Windows Server, hỗ trợ SMB và tích hợp AD tự nhiên.","trap":"EFS là 'shared storage' quen thuộc nhưng chỉ hoạt động với Linux — dễ bị chọn nhầm nếu không chú ý đề bài nói rõ 'windows based applications'.","tip":"Ứng dụng Windows cần SMB + AD → FSx for Windows File Server. Ứng dụng Linux cần NFS → EFS."},{"id":9,"domain":"res","topic":"SSM Default Host Management Configuration","q":"A software company manages a fleet of Amazon EC2 instances that support internal analytics applications. These instances use an IAM role with custom policies to connect to Amazon RDS and AWS Secrets Manager for secure access to credentials and database endpoints. The IT operations team wants to implement a centralized patch management solution that simplifies compliance and security tasks. Their goal is to automate OS patching across EC2 instances without disrupting the running applications.\nWhich approach will allow the company to meet these goals with the least administrative overhead?","opts":["Manually install the Systems Manager Agent (SSM Agent) on each EC2 instance. Schedule daily patch jobs using cron scripts","Enable Default Host Management Configuration in AWS Systems Manager Quick Setup","Create a second IAM role with the AmazonSSMManagedInstanceCore policy and attach both the new and the existing IAM roles to each EC2 instance using Systems Manager Hybrid Activation","Detach the existing IAM role from all EC2 instances. Replace it with a new role that has both the original permissions and the AmazonSSMManagedInstanceCore policy to enable Systems Manager features"],"ans":[1],"you1":[2],"notes":["Sai: cài SSM Agent thủ công + cron script là cách làm thủ công, overhead cao, không tận dụng tính năng managed của AWS.","Đúng: Default Host Management Configuration tự động cấp quyền SSM cần thiết, không phải sửa IAM role thủ công, overhead thấp nhất.","Sai: Hybrid Activation dành cho resource ngoài EC2/on-prem, không áp dụng cho EC2 chuẩn trong account; EC2 cũng chỉ gắn được 1 role tại một thời điểm.","Sai: tháo gỡ role hiện tại và thay role mới có nguy cơ làm gián đoạn ứng dụng đang phụ thuộc vào role đó (RDS/Secrets Manager access)."],"pattern":"Bật patch management tự động mà không sửa đổi IAM role hiện có, tránh gián đoạn ứng dụng","why":"Default Host Management Configuration tự động hoá việc cấp quyền SSM phía sau hậu trường mà không cần đổi IAM role thủ công.","trap":"Các phương án 'tự chế' bằng cách tạo role thứ hai hoặc thay role dễ bị chọn vì nghe như giải pháp kỹ thuật hợp lý, nhưng vi phạm yêu cầu không gián đoạn/ít overhead.","tip":"Muốn bật SSM cho EC2 có sẵn IAM role mà không đổi role → Default Host Management Configuration (Quick Setup), không cần sửa IAM thủ công."},{"id":10,"domain":"cost","topic":"EventBridge + Lambda scheduled serverless cron","q":"A social media startup uses AWS Cloud to manage its IT infrastructure. The engineering team at the startup wants to perform weekly database rollovers for a MySQL database server using a serverless cron job that typically takes about 5 minutes to execute the database rollover script written in Python. The database rollover will archive the past week's data from the production database to keep the database small while still keeping its data accessible.\nAs a solutions architect, which of the following would you recommend as the MOST cost-efficient and reliable solution?","opts":["Provision an Amazon EC2 scheduled reserved instance to run the database rollover script to be run via an OS-based weekly cron expression","Schedule a weekly Amazon EventBridge event cron expression to invoke an AWS Lambda function that runs the database rollover job","Create a time-based schedule option within an AWS Glue job to invoke itself every week and run the database rollover script","Provision an Amazon EC2 spot instance to run the database rollover script to be run via an OS-based weekly cron expression"],"ans":[1],"you1":[0],"notes":["Sai: Scheduled Reserved Instance vẫn là EC2 phải quản lý, không phải giải pháp serverless như đề yêu cầu.","Đúng: EventBridge cron + Lambda là giải pháp serverless, chi phí thấp nhất cho job định kỳ ngắn (5 phút).","Sai: AWS Glue dùng cho ETL batch, chi phí cao hơn Lambda cho tác vụ đơn giản này.","Sai: Spot Instance không đảm bảo chạy đúng lịch vì có thể bị thu hồi bất cứ lúc nào, và vẫn không phải serverless."],"pattern":"Chọn giải pháp serverless rẻ nhất cho cron job ngắn, định kỳ","why":"EventBridge Scheduled Rule + Lambda là tổ hợp serverless kinh điển cho tác vụ định kỳ ngắn, không cần quản lý server và chi phí theo thời gian chạy thực tế.","trap":"Các phương án dùng EC2 (Reserved hoặc Spot) đều vi phạm yêu cầu 'serverless', dù Reserved nghe tiết kiệm và Spot nghe rẻ.","tip":"Tác vụ ngắn, định kỳ, cần serverless → EventBridge Scheduler + Lambda, không phải EC2 dù là Reserved hay Spot."},{"id":11,"domain":"res","topic":"SQS Standard→FIFO migration checklist","q":"The engineering team at an e-commerce company wants to migrate from Amazon Simple Queue Service (Amazon SQS) Standard queues to FIFO (First-In-First-Out) queues with batching.\nAs a solutions architect, which of the following steps would you have in the migration checklist? (Select three)","opts":["Make sure that the name of the FIFO (First-In-First-Out) queue is the same as the standard queue","Make sure that the throughput for the target FIFO (First-In-First-Out) queue does not exceed 3,000 messages per second","Delete the existing standard queue and recreate it as a FIFO (First-In-First-Out) queue","Convert the existing standard queue into a FIFO (First-In-First-Out) queue","Make sure that the throughput for the target FIFO (First-In-First-Out) queue does not exceed 300 messages per second","Make sure that the name of the FIFO (First-In-First-Out) queue ends with the .fifo suffix"],"ans":[1,2,5],"you1":[3,4,5],"notes":["Sai: tên FIFO queue phải khác standard queue vì bắt buộc có hậu tố .fifo, không thể trùng tên.","Đúng: FIFO queue với batching hỗ trợ tới 3.000 message/giây — đúng giới hạn cần nhớ.","Đúng: không thể convert trực tiếp, phải xóa queue cũ và tạo lại dưới dạng FIFO.","Sai: SQS không hỗ trợ convert trực tiếp standard → FIFO, phải tạo mới.","Sai: 300 msg/s là giới hạn KHÔNG dùng batching, không phải giới hạn với batching.","Đúng: tên FIFO queue bắt buộc có hậu tố .fifo."],"pattern":"Nhớ đúng con số giới hạn và quy trình bắt buộc khi chuyển Standard→FIFO","why":"FIFO queue không hỗ trợ convert trực tiếp (phải xóa & tạo lại), bắt buộc hậu tố .fifo, và throughput với batching lên tới 3.000 msg/s.","trap":"300 vs 3.000 msg/s là cặp số dễ nhầm (không batching vs có batching); việc 'convert' nghe hợp lý nhưng SQS không hỗ trợ.","tip":"FIFO: không batching = 300 msg/s, có batching = 3.000 msg/s. Không thể convert Standard→FIFO, phải tạo mới với hậu tố .fifo."},{"id":12,"domain":"cost","topic":"SCT + DMS heterogeneous migration","q":"A company has a license-based, expensive, legacy commercial database solution deployed at its on-premises data center. The company wants to migrate this database to a more efficient, open-source, and cost-effective option on AWS Cloud. The CTO at the company wants a solution that can handle complex database configurations such as secondary indexes, foreign keys, and stored procedures.\nAs a solutions architect, which of the following AWS services should be combined to handle this use-case? (Select two)","opts":["AWS Schema Conversion Tool (AWS SCT)","Basic Schema Copy","AWS Snowball Edge","AWS Database Migration Service (AWS DMS)","AWS Glue"],"ans":[0,3],"you1":[0],"notes":["Đúng: SCT chuyển đổi schema/code nguồn sang schema đích trước khi migrate dữ liệu — cần thiết cho migration khác engine (heterogeneous).","Sai: Basic Schema Copy chỉ tạo bảng/khóa chính cơ bản, KHÔNG xử lý được secondary index, foreign key, stored procedure như yêu cầu.","Sai: Snowball Edge dùng để chuyển dữ liệu khối lượng lớn vật lý, không dùng cho database migration.","Đúng: DMS thực hiện migrate dữ liệu thực tế từ nguồn sang đích, gần như không downtime.","Sai: AWS Glue là dịch vụ ETL, không dùng cho database migration."],"pattern":"Heterogeneous database migration cần cặp đôi: chuyển schema (SCT) + chuyển dữ liệu (DMS)","why":"Khi nguồn và đích khác engine, cần SCT để chuyển schema/code phức tạp (index, FK, stored procedure) trước, sau đó DMS để di chuyển dữ liệu.","trap":"Basic Schema Copy (tính năng con của DMS) nghe giống SCT nhưng không xử lý được cấu trúc phức tạp — dễ chọn nhầm nếu không đọc kỹ yêu cầu 'complex database configurations'.","tip":"Khác engine (heterogeneous) + cấu trúc phức tạp (index/FK/stored procedure) → luôn cần SCT trước DMS, không chỉ Basic Schema Copy."},{"id":13,"domain":"res","topic":"SQS to decouple fast/slow microservices","q":"A legacy application is built using a tightly-coupled monolithic architecture. Due to a sharp increase in the number of users, the application performance has degraded. The company now wants to decouple the architecture and adopt AWS microservices architecture. Some of these microservices need to handle fast running processes whereas other microservices need to handle slower processes.\nWhich of these options would you identify as the right way of connecting these microservices?","opts":["Configure Amazon Kinesis Data Streams to decouple microservices running faster processes from the microservices running slower ones","Use Amazon Simple Notification Service (Amazon SNS) to decouple microservices running faster processes from the microservices running slower ones","Configure Amazon Simple Queue Service (Amazon SQS) queue to decouple microservices running faster processes from the microservices running slower ones","Add Amazon EventBridge to decouple the complex architecture"],"ans":[2],"you1":[2],"notes":["Sai: Kinesis dùng cho streaming pub-sub nhiều consumer, không phải mô hình decouple nhanh/chậm điển hình bằng polling.","Sai: SNS là push mechanism, giả định consumer luôn sẵn sàng xử lý ngay — không phù hợp khi có microservice chậm.","Đúng: SQS cho phép lưu trữ message tới khi consumer chậm xử lý xong, đúng mô hình decouple nhanh/chậm.","Sai: EventBridge yêu cầu downstream xử lý ngay khi event tới, lại tạo tightly-coupled thay vì decouple."],"pattern":"Decouple microservice tốc độ khác nhau bằng cơ chế lưu trữ-chờ (poll), không phải push","why":"SQS lưu trữ message cho tới khi được xử lý, phù hợp khi downstream chạy chậm hơn upstream — đúng bản chất decouple.","trap":"EventBridge/SNS nghe như công cụ 'decouple' hiện đại nhưng bản chất là push, buộc downstream phải phản hồi ngay — ngược lại với yêu cầu đề bài.","tip":"Cần lưu trữ & chờ xử lý (polling model) → SQS. Cần phát sự kiện ngay lập tức, nhiều subscriber → SNS/EventBridge."},{"id":14,"domain":"sec","topic":"OAI + WAF IP match for CloudFront restricted access","q":"The engineering team at a company is moving the static content from the company's logistics website hosted on Amazon EC2 instances to an Amazon S3 bucket. The team wants to use an Amazon CloudFront distribution to deliver the static content. The security group used by the Amazon EC2 instances allows the website to be accessed by a limited set of IP ranges from the company's suppliers. Post-migration to Amazon CloudFront, access to the static content should only be allowed from the aforementioned IP addresses.\nWhich options would you combine to build a solution to meet these requirements? (Select two)","opts":["Configure an origin access identity (OAI) and associate it with the Amazon CloudFront distribution. Set up the permissions in the Amazon S3 bucket policy so that only the OAI can read the objects","Create an AWS WAF ACL and use an IP match condition to allow traffic only from those IPs that are allowed in the Amazon EC2 security group. Associate this new AWS WAF ACL with the Amazon CloudFront distribution","Create an AWS Web Application Firewall (AWS WAF) ACL and use an IP match condition to allow traffic only from those IPs that are allowed in the Amazon EC2 security group. Associate this new AWS WAF ACL with the Amazon S3 bucket policy","Create a new security group that allows traffic from the same IPs as specified in the current Amazon EC2 security group. Associate this new security group with the Amazon CloudFront distribution","Create a new NACL that allows traffic from the same IPs as specified in the current Amazon EC2 security group. Associate this new NACL with the Amazon CloudFront distribution"],"ans":[0,1],"you1":[1,3],"notes":["Đúng: OAI đảm bảo chỉ CloudFront mới đọc được object trong S3, chặn truy cập trực tiếp vào bucket.","Đúng: WAF ACL với IP match condition gắn vào CloudFront distribution để lọc theo IP nhà cung cấp.","Sai: không thể gắn WAF ACL trực tiếp vào S3 bucket policy — WAF chỉ gắn vào CloudFront/ALB/API Gateway/AppSync/Cognito.","Sai: Security Group không thể gắn vào CloudFront distribution (CloudFront là edge location toàn cầu, không phải VPC resource).","Sai: NACL gắn vào subnet trong VPC, không thể gắn vào CloudFront distribution."],"pattern":"Giới hạn truy cập CloudFront theo IP + chặn truy cập trực tiếp vào S3 origin","why":"Cần 2 lớp: OAI để S3 chỉ nhận request từ CloudFront, và WAF IP match gắn vào CloudFront để lọc theo IP người dùng cuối.","trap":"Security Group và NACL là công cụ quen thuộc để lọc IP trong VPC, nhưng không áp dụng được cho CloudFront vì đây là dịch vụ edge toàn cầu ngoài VPC.","tip":"Giới hạn IP truy cập CloudFront → WAF (không phải SG/NACL). Chặn truy cập S3 trực tiếp, chỉ qua CloudFront → OAI/OAC (không gắn WAF vào S3 bucket policy)."},{"id":15,"domain":"sec","topic":"NAT Gateway fully managed vs NAT instance","q":"A company has its application servers in the public subnet that connect to the database instances in the private subnet. For regular maintenance, the database instances need patch fixes that need to be downloaded from the internet.\nConsidering the company uses only IPv4 addressing and is looking for a fully managed service, which of the following would you suggest as an optimal solution?","opts":["Configure a Network Address Translation instance (NAT instance) in the public subnet of the VPC","Configure a Network Address Translation gateway (NAT gateway) in the public subnet of the VPC","Configure the Internet Gateway of the VPC to be accessible to the private subnet resources by changing the route tables","Configure an Egress-only internet gateway for the resources in the private subnet of the VPC"],"ans":[1],"you1":[1],"notes":["Sai: NAT instance không phải dịch vụ managed, phải tự quản lý và vá lỗi.","Đúng: NAT Gateway là dịch vụ managed hoàn toàn bởi AWS, phù hợp yêu cầu IPv4 + fully managed.","Sai: Internet Gateway không thể gắn trực tiếp cho private subnet mà không qua NAT.","Sai: Egress-only Internet Gateway chỉ hỗ trợ IPv6, trong khi đề bài yêu cầu IPv4."],"pattern":"Chọn dịch vụ NAT managed đúng loại địa chỉ IP (IPv4 vs IPv6)","why":"NAT Gateway là lựa chọn managed service chuẩn cho IPv4 outbound từ private subnet.","trap":"Egress-only Internet Gateway nghe giống NAT Gateway về chức năng nhưng chỉ hỗ trợ IPv6 — không dùng được cho yêu cầu IPv4.","tip":"IPv4 outbound từ private subnet, cần managed → NAT Gateway. IPv6 outbound → Egress-only Internet Gateway."},{"id":16,"domain":"sec","topic":"SSE-S3 per-object unique keys","q":"A company maintains its business-critical customer data on an on-premises system in an encrypted format. Over the years, the company has transitioned from using a single encryption key to multiple encryption keys by dividing the data into logical chunks. With the decision to move all the data to an Amazon S3 bucket, the company is now looking for a technique to encrypt each file with a different encryption key to provide maximum security to the migrated on-premises data.\nHow will you implement this requirement without adding the overhead of splitting the data into logical groups?","opts":["Store the logically divided data into different Amazon S3 buckets. Use server-side encryption with Amazon S3 managed keys (SSE-S3) to encrypt the data","Configure a single Amazon S3 bucket to hold all data. Use server-side encryption with AWS KMS (SSE-KMS) and use encryption context to generate a different key for each file/object that you store in the S3 bucket","Configure a single Amazon S3 bucket to hold all data. Use server-side encryption with Amazon S3 managed keys (SSE-S3) to encrypt the data","Use Multi-Region keys for client-side encryption in the AWS S3 Encryption Client to generate unique keys for each file of data"],"ans":[2],"you1":[2],"notes":["Sai: tạo nhiều bucket vẫn giữ nguyên nhu cầu chia nhóm logic — không loại bỏ overhead như yêu cầu.","Sai: encryption context của SSE-KMS chỉ thêm ngữ cảnh bảo mật, không dùng để tạo unique key cho mỗi object.","Đúng: SSE-S3 tự động mã hóa mỗi object bằng một key riêng, không cần chia nhóm logic thủ công.","Sai: client-side encryption không phải là server-side encryption như yêu cầu đề bài."],"pattern":"SSE-S3 đã tự động cấp 1 key riêng cho mỗi object mà không cần tự chia nhóm dữ liệu","why":"SSE-S3 mặc định mã hóa mỗi object bằng một key độc lập, đáp ứng đúng yêu cầu 'mỗi file một key' mà không cần overhead chia nhóm logic.","trap":"SSE-KMS với encryption context nghe như giải pháp 'nâng cao' tạo unique key, nhưng encryption context không có chức năng đó.","tip":"Mỗi object cần 1 key riêng, không cần tự quản lý key → SSE-S3 đã làm sẵn việc này tự động."},{"id":17,"domain":"perf","topic":"io1 for high IOPS NoSQL on EBS","q":"A big data analytics company is working on a real-time vehicle tracking solution. The data processing workflow involves both I/O intensive and throughput intensive database workloads. The development team needs to store this real-time data in a NoSQL database hosted on an Amazon EC2 instance and needs to support up to 25,000 IOPS per volume.\nAs a solutions architect, which of the following Amazon Elastic Block Store (Amazon EBS) volume types would you recommend for this use-case?","opts":["General Purpose SSD (gp2)","Cold HDD (sc1)","Throughput Optimized HDD (st1)","Provisioned IOPS SSD (io1)"],"ans":[3],"you1":[2],"notes":["Sai: gp2 chỉ hỗ trợ tối đa 16.000 IOPS/volume, không đạt yêu cầu 25.000.","Sai: sc1 chỉ hỗ trợ tối đa 250 IOPS/volume, quá thấp cho yêu cầu.","Sai: st1 tối ưu throughput tuần tự, chỉ hỗ trợ tối đa 500 IOPS/volume.","Đúng: io1 hỗ trợ tới 64.000 IOPS/volume, đáp ứng dư yêu cầu 25.000 IOPS."],"pattern":"Đối chiếu con số IOPS yêu cầu với giới hạn tối đa từng loại EBS","why":"Chỉ io1/io2 mới đạt mức IOPS cao (tới 64.000/volume) cần thiết cho yêu cầu 25.000 IOPS.","trap":"st1 (Throughput Optimized) dễ bị nhầm là 'hiệu năng cao' do tên gọi, nhưng chỉ tối ưu throughput tuần tự chứ không phải IOPS ngẫu nhiên cao.","tip":"Luôn đối chiếu con số IOPS yêu cầu với giới hạn tối đa mỗi loại EBS: gp2 ≤16.000, io1/io2 ≤64.000, st1 ≤500, sc1 ≤250."},{"id":18,"domain":"perf","topic":"API Gateway usage plans & API keys","q":"A media streaming startup is building a set of backend APIs that will be consumed by external mobile applications. To prevent API abuse, protect downstream resources, and ensure fair usage across clients, the architecture must enforce rate limiting and throttling on a per-client basis. The team also wants to define usage quotas and apply different limits to different API consumers.\nWhich solution should the team implement to enforce rate limiting and usage quotas at the API layer?","opts":["Use a Network Load Balancer (NLB) to terminate TLS and apply rate-limiting logic within backend EC2 instances","Use Amazon API Gateway and configure usage plans with API keys to apply rate limits and quotas per client","Use a Gateway Load Balancer to inspect and control incoming HTTP traffic and throttle requests by integrating with third-party firewall appliances","Use an Application Load Balancer (ALB) with path-based routing and configure listener rules to enforce request limits"],"ans":[1],"you1":[1],"notes":["Sai: NLB không có khả năng rate limit built-in, phải tự code logic trong backend — tăng độ phức tạp không cần thiết.","Đúng: usage plans + API keys trong API Gateway cho phép rate limit và quota theo từng client, đúng chuyên môn.","Sai: Gateway Load Balancer dùng tích hợp firewall/appliance bên thứ ba, không có khả năng rate limit theo client.","Sai: ALB không có built-in rate limiting/quota, chỉ hỗ trợ routing."],"pattern":"Rate limit + quota theo client ở tầng API → dùng tính năng built-in của API Gateway","why":"API Gateway usage plans + API keys là tính năng có sẵn, chuyên biệt cho rate limiting và quota theo từng client.","trap":"Các loại load balancer (NLB/ALB/GWLB) đều không có built-in rate limit per-client — dễ chọn nhầm nếu nghĩ 'load balancer nào cũng kiểm soát được traffic'.","tip":"Rate limit/quota theo API key, per-client → API Gateway usage plans. Load balancer không có tính năng này built-in."},{"id":19,"domain":"perf","topic":"Transfer Family internal + managed workflow","q":"A company is migrating a legacy workload from on premises to AWS. The application receives customer order files from an on premises ERP system by using the SFTP protocol. After files arrive, the application must process them immediately rather than relying on periodic polling. The company already has secure network connectivity between AWS and the on premises environment. The new solution must remain highly available, secure, and resilient across infrastructure failures.\nWhich solution should you implement to meet these requirements?","opts":["Deploy an internal AWS Transfer Family SFTP server across two Availability Zones backed by Amazon EFS. Use Amazon EventBridge Scheduler to periodically trigger an AWS Step Functions state machine that scans for new files","Deploy an internet facing AWS Transfer Family SFTP server in a single Availability Zone backed by Amazon EFS. Configure a Transfer Family managed workflow to invoke an AWS Lambda function after file upload completes","Deploy an internet facing AWS Transfer Family SFTP server across two Availability Zones backed by Amazon S3. Configure Amazon S3 Event Notifications to invoke an AWS Lambda function when new objects are created","Deploy an internal AWS Transfer Family SFTP server across two Availability Zones backed by Amazon S3. Configure a Transfer Family managed workflow to invoke an AWS Lambda function immediately after file upload completes"],"ans":[3],"you1":[3],"notes":["Sai: EventBridge Scheduler kích hoạt định kỳ là polling, vi phạm yêu cầu xử lý ngay lập tức.","Sai: chỉ 1 AZ làm giảm khả năng chịu lỗi hạ tầng, vi phạm yêu cầu resilient.","Sai: endpoint internet-facing không cần thiết khi đã có kết nối mạng riêng an toàn sẵn có — vi phạm best practice bảo mật.","Đúng: endpoint internal + đa AZ + S3 + managed workflow gọi Lambda ngay sau upload — đáp ứng đủ bảo mật, resilient, xử lý tức thời."],"pattern":"Kết hợp đúng: endpoint nội bộ (đã có kết nối riêng) + đa AZ (resilient) + managed workflow (event-driven, không polling)","why":"Transfer Family managed workflow cho phép gọi Lambda ngay sau khi upload hoàn tất, không cần polling, đồng thời deploy internal + đa AZ đáp ứng bảo mật và tính sẵn sàng.","trap":"Các phương án có vẻ hợp lý về mặt kỹ thuật (Step Functions, EFS, internet-facing) nhưng mỗi cái vi phạm đúng 1 ràng buộc cụ thể của đề (polling, single-AZ, hoặc lộ endpoint không cần thiết).","tip":"Đã có kết nối mạng riêng sẵn → luôn ưu tiên endpoint internal thay vì internet-facing; xử lý ngay lập tức → managed workflow/event, không phải polling theo lịch."},{"id":20,"domain":"sec","topic":"Transit Gateway + transit VIF for DX","q":"A national logistics company has a dedicated AWS Direct Connect connection from its corporate data center to AWS. Within its AWS account, the company operates 25 Amazon VPCs in the same Region, each supporting different regional distribution services. The VPCs were configured with non-overlapping CIDR blocks and currently use private VIFs for Direct Connect access to on-premises resources. As the architecture scales, the company wants to enable communication across all VPCs and the on-premises environment. The solution must scale efficiently, support full-mesh connectivity, and reduce the complexity of maintaining separate private VIFs for each VPC.\nWhich combination of solutions will best fulfill these requirements with the least amount of operational overhead? (Select two)","opts":["Create an AWS Transit Gateway and attach all 25 VPCs to it. Enable route propagation for each attachment to automatically manage inter-VPC routing","Convert each existing private VIF into a new Direct Connect gateway association by attaching a virtual private gateway (VGW) to each VPC. Manually configure routing between VGWs","Create individual Site-to-Site VPN connections from the data center to each VPC. Set up BGP route propagation for every tunnel to facilitate on-premises-to-VPC routing","Create a transit virtual interface (VIF) from the Direct Connect connection and associate it with the transit gateway","Reconfigure each VPC to connect through AWS PrivateLink endpoints to a central networking service VPC. Share the service with other VPCs using VPC endpoint services"],"ans":[0,3],"you1":[3,1],"notes":["Đúng: Transit Gateway là hub trung tâm, gắn 25 VPC vào 1 điểm, route propagation tự động quản lý routing.","Sai: vẫn phải tạo/quản lý 25 VGW riêng biệt và routing thủ công giữa chúng, không giảm được operational overhead, không hỗ trợ transitive routing.","Sai: tạo 25 VPN connection riêng biệt làm tăng độ phức tạp, hiệu năng kém hơn nhiều so với tận dụng Direct Connect sẵn có.","Đúng: transit VIF kết nối Direct Connect trực tiếp tới Transit Gateway, thay thế nhiều private VIF bằng 1 kết nối tập trung.","Sai: PrivateLink chỉ cho truy cập 1 chiều tới 1 service cụ thể, không hỗ trợ kết nối mạng toàn diện giữa tất cả VPC và on-premises."],"pattern":"Thay thế nhiều private VIF + VPC peering rời rạc bằng mô hình hub-and-spoke tập trung (Transit Gateway + transit VIF)","why":"Transit Gateway + transit VIF tạo thành kiến trúc hub-and-spoke tập trung, giảm số kết nối cần quản lý xuống còn 1 transit VIF và 1 Transit Gateway thay vì 25 private VIF riêng lẻ.","trap":"Phương án VGW + Direct Connect gateway nghe giống giải pháp tập trung nhưng vẫn yêu cầu quản lý 25 VGW riêng và routing thủ công — không giảm được overhead thực sự.","tip":"Nhiều VPC cần full-mesh qua Direct Connect → Transit Gateway + 1 transit VIF duy nhất, không phải nhân bản VGW/private VIF cho từng VPC."},{"id":21,"domain":"perf","topic":"ElastiCache use cases (read-heavy, compute-intensive)","q":"A company wants to improve its gaming application by adding a leaderboard that uses a complex proprietary algorithm based on the participating user's performance metrics to identify the top users on a real-time basis. The technical requirements mandate high elasticity, low latency, and real-time processing to deliver customizable user data for the community of users. The leaderboard would be accessed by millions of users simultaneously.\nWhich of the following options support the case for using Amazon ElastiCache to meet the given requirements? (Select two)","opts":["Use Amazon ElastiCache to improve latency and throughput for write-heavy application workloads","Use Amazon ElastiCache to improve latency and throughput for read-heavy application workloads","Use Amazon ElastiCache to run highly complex JOIN queries","Use Amazon ElastiCache to improve the performance of Extract-Transform-Load (ETL) workloads","Use Amazon ElastiCache to improve the performance of compute-intensive workloads"],"ans":[1,4],"you1":[0,1],"notes":["Sai: cache không phù hợp write-heavy vì dữ liệu cache sẽ nhanh chóng lỗi thời (stale).","Đúng: ElastiCache cải thiện đáng kể latency/throughput cho workload đọc nhiều (leaderboard, gaming, Q&A).","Sai: JOIN phức tạp thuộc về relational database (RDS/Aurora), không phải cache.","Sai: ETL cần đọc/transform khối lượng lớn dữ liệu, không phù hợp với caching.","Đúng: ElastiCache cũng cải thiện hiệu năng cho workload tính toán phức tạp (ví dụ recommendation engine) bằng cách cache kết quả."],"pattern":"Nhận biết đúng 2 nhóm use case chính thức của ElastiCache: read-heavy và compute-intensive","why":"AWS liệt kê rõ 2 nhóm use case được hưởng lợi từ ElastiCache: workload đọc nhiều và workload tính toán nặng cần cache lại kết quả.","trap":"Write-heavy nghe như 'cần tốc độ cao nên dùng cache' nhưng thực chất cache không giúp ích và còn gây rủi ro dữ liệu cũ.","tip":"ElastiCache giúp: read-heavy workload và compute-intensive workload (cache kết quả tính toán). Không giúp: write-heavy, JOIN phức tạp, ETL."},{"id":22,"domain":"res","topic":"DynamoDB PITR vs on-demand backup","q":"A data analytics company manages an application that stores user data in a Amazon DynamoDB table. The development team has observed that once in a while, the application writes corrupted data in the Amazon DynamoDB table. As soon as the issue is detected, the team needs to remove the corrupted data at the earliest.\nWhat do you recommend?","opts":["Configure the Amazon DynamoDB table as a global table and point the application to use the table from another AWS region that has no corrupted data","Use Amazon DynamoDB Streams to restore the table to the state just before corrupted data was written","Use Amazon DynamoDB on-demand backup to restore the table to the state just before corrupted data was written","Use Amazon DynamoDB point in time recovery to restore the table to the state just before corrupted data was written"],"ans":[3],"you1":[2],"notes":["Sai: Global table không có 'bản sao khác region không bị lỗi' — tất cả replica đều có cùng dữ liệu đã bị hỏng.","Sai: DynamoDB Streams chỉ ghi log thay đổi 24 giờ, không có cơ chế restore tự động về 1 thời điểm cụ thể.","Sai: on-demand backup phải được tạo TRƯỚC khi sự cố xảy ra — không thể tạo backup 'hồi tố' sau khi phát hiện lỗi.","Đúng: PITR cho phép restore về bất kỳ giây nào trong 35 ngày qua mà không cần backup được tạo sẵn trước đó."],"pattern":"Khôi phục dữ liệu về đúng thời điểm trước sự cố không lường trước (unpredictable) → PITR","why":"PITR tự động backup liên tục theo từng giây, cho phép restore về bất kỳ thời điểm nào trong 35 ngày mà không cần lên lịch trước.","trap":"On-demand backup nghe như giải pháp hợp lý nhưng chỉ hoạt động nếu backup đã được tạo TRƯỚC sự cố — không áp dụng được cho lỗi phát sinh bất ngờ, không lường trước.","tip":"Sự cố không lường trước, cần restore về đúng giây bất kỳ → PITR. Backup theo lịch định kỳ, biết trước thời điểm cần → on-demand backup."},{"id":23,"domain":"res","topic":"Kinesis Data Streams for custom stream processing","q":"A company has hired you as an AWS Certified Solutions Architect – Associate to help with redesigning a real-time data processor. The company wants to build custom applications that process and analyze the streaming data for its specialized needs.\nWhich solution will you recommend to address this use-case?","opts":["Use Amazon Kinesis Data Streams to process the data streams as well as decouple the producers and consumers for the real-time data processor","Use Amazon Simple Notification Service (Amazon SNS) to process the data streams as well as decouple the producers and consumers for the real-time data processor","Use Amazon Simple Queue Service (Amazon SQS) to process the data streams as well as decouple the producers and consumers for the real-time data processor","Use Amazon Kinesis Data Firehose to process the data streams as well as decouple the producers and consumers for the real-time data processor"],"ans":[0],"you1":[0],"notes":["Đúng: Kinesis Data Streams cho phép xây dựng custom application xử lý/phân tích stream theo nhu cầu đặc thù.","Sai: SNS không thiết kế để xử lý/phân tích streaming data, chỉ là pub/sub messaging đơn giản.","Sai: SQS cũng không chuyên về xử lý/phân tích streaming data thời gian thực.","Sai: Kinesis Data Firehose chỉ delivery dữ liệu vào kho đích có sẵn, không hỗ trợ custom application xử lý."],"pattern":"Custom streaming application với nhu cầu xử lý đặc thù → Kinesis Data Streams","why":"Kinesis Data Streams cho phép custom consumer tự viết logic xử lý/phân tích, phù hợp nhu cầu đặc thù mà Firehose (chỉ delivery) không đáp ứng được.","trap":"Kinesis Data Firehose dễ bị nhầm với Data Streams do cùng họ Kinesis, nhưng Firehose chỉ delivery vào đích có sẵn, không cho custom processing.","tip":"Cần custom app tự xử lý stream → Kinesis Data Streams. Chỉ cần đẩy dữ liệu vào kho đích có sẵn (S3/Redshift/OpenSearch) → Firehose."},{"id":24,"domain":"perf","topic":"API Gateway HTTP API native JWT authorizer","q":"A startup is building a serverless microservices architecture where client applications (web and mobile) authenticate users via a third-party OIDC-compliant identity provider. The backend APIs must validate JSON Web Tokens (JWTs) issued by this provider, enforce scope-based access control, and be cost-effective with minimal latency. The development team wants to use a fully managed service that supports JWT validation natively, without writing custom authentication logic.\nWhich solution should the team implement to meet these requirements?","opts":["Deploy a gRPC backend on Amazon ECS Fargate and expose it through AWS App Runner, handling JWT validation inside the containerized services","Use Amazon API Gateway HTTP API with a native JWT authorizer configured to validate tokens from the OIDC provider","Use Amazon API Gateway REST API with a Lambda function that manually validates JWT tokens","Use Amazon API Gateway WebSocket API with JWT claims validated by a Lambda authorizer"],"ans":[1],"you1":[2],"notes":["Sai: tự xây backend gRPC + tự validate JWT trong container là giải pháp phức tạp, vi phạm yêu cầu 'fully managed, không viết logic auth thủ công'.","Đúng: HTTP API hỗ trợ JWT authorizer built-in, validate token OIDC tự động mà không cần code, chi phí thấp, độ trễ thấp.","Sai: REST API + Lambda tự validate JWT là tự viết logic xác thực thủ công, tăng chi phí/độ trễ và vi phạm yêu cầu 'native, no-code'.","Sai: WebSocket API không hỗ trợ JWT authorizer native, chỉ có Lambda authorizer kiểm tra lúc $connect, không đúng mô hình REST request-response cần thiết."],"pattern":"Validate JWT từ OIDC provider mà không viết code — dùng tính năng JWT authorizer có sẵn của HTTP API","why":"API Gateway HTTP API có JWT authorizer native, tự động validate token từ OIDC provider mà không cần Lambda tự viết logic, tối ưu chi phí và độ trễ.","trap":"REST API + Lambda tự validate JWT nghe như giải pháp 'kiểm soát chặt chẽ hơn' nhưng chính là việc viết custom authentication logic mà đề bài yêu cầu tránh.","tip":"Validate JWT chuẩn OIDC, không viết code → API Gateway HTTP API JWT authorizer (rẻ, nhanh hơn REST API + Lambda authorizer)."},{"id":25,"domain":"perf","topic":"EC2 tenancy: Launch Template vs VPC tenancy interaction","q":"A video conferencing application is hosted on a fleet of EC2 instances which are part of an Auto Scaling group. The Auto Scaling group uses a Launch Template (LT1) with \"dedicated\" instance tenancy but the VPC (V1) used by the Launch Template LT1 has the instance tenancy set to default. Later the DevOps team creates a new Launch Template (LT2) with shared (default) instance tenancy but the VPC (V2) used by the Launch Template LT2 has the instance tenancy set to dedicated.\nWhich of the following is correct regarding the instances launched via Launch Template LT1 and Launch Template LT2?","opts":["The instances launched by both Launch Template LT1 and Launch Template LT2 will have default instance tenancy","The instances launched by Launch Template LT1 will have dedicated instance tenancy while the instances launched by the Launch Template LT2 will have shared (default) instance tenancy","The instances launched by both Launch Template LT1 and Launch Template LT2 will have dedicated instance tenancy","The instances launched by Launch Template LT1 will have default instance tenancy while the instances launched by the Launch Template LT2 will have dedicated instance tenancy"],"ans":[2],"you1":[1],"notes":["Sai: cả 2 đều có ít nhất 1 trong 2 (Launch Template hoặc VPC) đặt dedicated, nên cả 2 phải là dedicated, không phải default.","Sai: LT2 có VPC V2 dedicated nên vẫn ra dedicated dù Launch Template để shared — không phải shared.","Đúng: chỉ cần MỘT trong hai (Launch Template hoặc VPC) đặt dedicated thì instance kết quả luôn là dedicated.","Sai: LT1 có Launch Template dedicated nên instance LT1 vẫn là dedicated, không phải default."],"pattern":"Quy tắc 'OR': dedicated nếu MỘT TRONG HAI (Launch Template hoặc VPC) là dedicated","why":"Nếu Launch Template Tenancy hoặc VPC Tenancy đặt dedicated, instance luôn chạy dedicated — không cần cả hai cùng dedicated.","trap":"Dễ nhầm thành quy tắc 'AND' (phải cả Launch Template VÀ VPC đều dedicated mới ra dedicated), trong khi thực tế chỉ cần MỘT trong hai là đủ.","tip":"Tenancy là dedicated nếu Launch Template HOẶC VPC đặt dedicated (logic OR), không phải cần cả hai."},{"id":26,"domain":"perf","topic":"Aurora Replicas to reduce replication lag","q":"The database backend for a retail company's website is hosted on Amazon RDS for MySQL having a primary instance and three read replicas to support read scalability. The company has mandated that the read replicas should lag no more than 1 second behind the primary instance to provide the best possible user experience. The read replicas are falling further behind during periods of peak traffic spikes, resulting in a bad user experience as the searches produce inconsistent results.\nYou have been hired as an AWS Certified Solutions Architect - Associate to reduce the replication lag as much as possible with minimal changes to the application code or the effort required to manage the underlying resources.\nWhich of the following will you recommend?","opts":["Host the MySQL primary database on a memory-optimized Amazon EC2 instance. Spin up additional compute-optimized Amazon EC2 instances to host the read replicas","Set up an Amazon ElastiCache for Redis cluster in front of the MySQL database. Update the website to check the cache before querying the read replicas","Set up database migration from Amazon RDS MySQL to Amazon Aurora MySQL. Swap out the MySQL read replicas with Aurora Replicas. Configure Aurora Auto Scaling","Set up database migration from Amazon RDS MySQL to Amazon DynamoDB. Provision a large number of read capacity units (RCUs) to support the required throughput and enable Auto-Scaling"],"ans":[2],"you1":[3],"notes":["Sai: tự host trên EC2 làm tăng operational overhead (vá lỗi OS/DB), vi phạm yêu cầu 'minimal effort to manage underlying resources'.","Sai: thêm cache layer đòi hỏi sửa đổi đáng kể code ứng dụng, vi phạm yêu cầu 'minimal changes to application code'.","Đúng: Aurora Replica chia sẻ chung storage với primary nên độ trễ chỉ còn vài chục ms, không cần sửa code nhiều, vẫn là managed service.","Sai: chuyển sang DynamoDB (NoSQL) đòi hỏi viết lại toàn bộ query, vi phạm yêu cầu 'minimal changes to application code'."],"pattern":"Giảm độ trễ read replica mà không tăng effort quản lý hay sửa code nhiều — đổi sang kiến trúc storage chia sẻ của Aurora","why":"Aurora Replica dùng chung storage layer với primary instance nên gần như không có độ trễ đồng bộ, khác hẳn MySQL read replica dùng replication bất đồng bộ qua binlog.","trap":"ElastiCache và DynamoDB đều có thể giải quyết vấn đề hiệu năng đọc về mặt kỹ thuật, nhưng cả hai đều yêu cầu sửa đổi đáng kể code ứng dụng — vi phạm ràng buộc rõ ràng của đề.","tip":"Replication lag cao với RDS MySQL/PostgreSQL read replica, cần ít sửa code nhất → nâng cấp lên Aurora Replica (chia sẻ storage, lag chỉ vài chục ms)."},{"id":27,"domain":"sec","topic":"VPC endpoint (PrivateLink) for SQS","q":"The engineering team at a company wants to use Amazon Simple Queue Service (Amazon SQS) to decouple components of the underlying application architecture. However, the team is concerned about the VPC-bound components accessing Amazon Simple Queue Service (Amazon SQS) over the public internet.\nAs a solutions architect, which of the following solutions would you recommend to address this use-case?","opts":["Use Network Address Translation (NAT) instance to access Amazon SQS","Use Internet Gateway to access Amazon SQS","Use VPN connection to access Amazon SQS","Use VPC endpoint to access Amazon SQS"],"ans":[3],"you1":[1],"notes":["Sai: NAT instance vẫn đưa traffic ra internet công khai để tới SQS, không giải quyết vấn đề 'qua public internet'.","Sai: Internet Gateway chính là con đường ra public internet — ngược hẳn với yêu cầu tránh public internet.","Sai: VPN dùng để kết nối on-premises với VPC, không cần thiết khi hạ tầng đã nằm trong AWS Cloud.","Đúng: VPC Endpoint (PrivateLink) cho phép truy cập SQS hoàn toàn trong mạng AWS, không qua internet."],"pattern":"Truy cập dịch vụ AWS (SQS) riêng tư từ trong VPC mà không qua internet → VPC Endpoint","why":"VPC Endpoint cho SQS dùng PrivateLink, giữ toàn bộ traffic trong mạng AWS, loại bỏ nhu cầu Internet Gateway/NAT/VPN.","trap":"NAT instance/Internet Gateway đều là công cụ quen thuộc cho outbound internet access, dễ bị chọn nhầm dù chúng vẫn đưa traffic ra internet công khai — ngược với yêu cầu đề bài.","tip":"VPC-bound resource cần truy cập dịch vụ AWS mà không qua internet → VPC Endpoint (Gateway cho S3/DynamoDB, Interface/PrivateLink cho các dịch vụ khác như SQS)."},{"id":28,"domain":"perf","topic":"CloudFront + S3 for static assets, no infra provisioning","q":"An online gaming application has a large chunk of its traffic coming from users who download static assets such as historic leaderboard reports and the game tactics for various games. The current infrastructure and design are unable to cope up with the traffic and application freezes on most of the pages.\nWhich of the following is a cost-optimal solution that does not need provisioning of infrastructure?","opts":["Use Amazon CloudFront with Amazon DynamoDB for greater speed and low latency access to static assets","Use Amazon CloudFront with Amazon S3 as the storage solution for the static assets","Configure AWS Lambda with an Amazon RDS database to provide a serverless architecture","Use AWS Lambda with Amazon ElastiCache and Amazon RDS for serving static assets at high speed and low latency"],"ans":[1],"you1":[1],"notes":["Sai: DynamoDB không cần thiết và tốn kém hơn nhiều so với yêu cầu chỉ lưu trữ static asset đơn giản.","Đúng: CloudFront + S3 là kết hợp serverless, không cần provision hạ tầng, tối ưu chi phí cho static asset.","Sai: RDS đòi hỏi quản lý database, không cần thiết cho việc phục vụ nội dung tĩnh.","Sai: thêm ElastiCache + RDS cho static asset là over-engineering, không tối ưu chi phí."],"pattern":"Phục vụ static asset không cần provision hạ tầng, tối ưu chi phí → CloudFront + S3","why":"S3 là serverless storage tự scale, CloudFront cache tại edge, hoàn toàn không cần provision server hay database cho nội dung tĩnh.","trap":"Các phương án thêm DynamoDB/RDS/ElastiCache nghe như 'nâng cấp hiệu năng' nhưng không cần thiết và làm tăng chi phí cho use case chỉ cần phục vụ file tĩnh.","tip":"Static asset, không cần provision hạ tầng, tối ưu chi phí → luôn là CloudFront + S3, không cần thêm database/cache."},{"id":29,"domain":"res","topic":"Internet Gateway performs NAT for public IP instances","q":"The DevOps team at an IT company has created a custom VPC (V1) and attached an Internet Gateway (I1) to the VPC. The team has also created a subnet (S1) in this custom VPC and added a route to this subnet's route table (R1) that directs internet-bound traffic to the Internet Gateway. Now the team launches an Amazon EC2 instance (E1) in the subnet S1 and assigns a public IPv4 address to this instance. Next the team also launches a Network Address Translation (NAT) instance (N1) in the subnet S1.\nUnder the given infrastructure setup, which of the following entities is doing the Network Address Translation for the Amazon EC2 instance E1?","opts":["Internet Gateway (I1)","Subnet (S1)","Route Table (R1)","Network Address Translation (NAT) instance (N1)"],"ans":[0],"you1":[3],"notes":["Đúng: Internet Gateway thực hiện NAT cho các instance có public IPv4 address, đây là 1 trong 2 chức năng chính của IGW.","Sai: subnet chỉ là dải IP, không thực hiện NAT.","Sai: route table chỉ định tuyến traffic, không thực hiện NAT.","Sai: NAT instance N1 chỉ phục vụ instance trong private subnet không có public IP — E1 đã có public IP nên không cần NAT instance."],"pattern":"Phân biệt vai trò NAT của Internet Gateway (cho instance có public IP) và NAT instance/gateway (cho private subnet)","why":"Một trong 2 chức năng chính của Internet Gateway là thực hiện NAT cho các instance đã có public IPv4 address — không liên quan gì tới NAT instance có mặt trong cùng subnet.","trap":"Sự hiện diện 'cố tình' của NAT instance N1 trong cùng subnet với E1 đánh lừa người đọc nghĩ N1 là bên thực hiện NAT, trong khi E1 đã có public IP nên không cần N1.","tip":"Instance có public IP trong public subnet → chính Internet Gateway thực hiện NAT, không cần NAT instance/gateway (chỉ dùng cho private subnet)."},{"id":30,"domain":"res","topic":"CloudWatch alarm EC2 recovery (EBS-only requirement)","q":"A startup has recently moved their monolithic web application to AWS Cloud. The application runs on a single Amazon EC2 instance. Currently, the user base is small and the startup does not want to spend effort on elaborate disaster recovery strategies or Auto Scaling Group. The application can afford a maximum downtime of 10 minutes.\nIn case of a failure, which of these options would you suggest as a cost-effective and automatic recovery procedure for the instance?","opts":["Configure an Amazon CloudWatch alarm that triggers the recovery of the Amazon EC2 instance, in case the instance fails. The instance can be configured with Amazon Elastic Block Store (Amazon EBS) or with instance store volumes","Configure AWS Trusted Advisor to monitor the health check of Amazon EC2 instance and provide a remedial action in case an unhealthy flag is detected","Configure an Amazon CloudWatch alarm that triggers the recovery of the Amazon EC2 instance, in case the instance fails. The instance, however, should only be configured with an Amazon EBS volume","Configure Amazon EventBridge events that can trigger the recovery of the Amazon EC2 instance, in case the instance or the application fails"],"ans":[2],"you1":[3],"notes":["Sai: tính năng recovery chỉ hỗ trợ instance dùng EBS, KHÔNG hỗ trợ instance store volume — phương án này sai vì cho phép cả 2 loại.","Sai: Trusted Advisor không tự thực hiện recovery EC2, và tính năng theo dõi EventBridge của nó chỉ có ở gói Business/Enterprise Support.","Đúng: CloudWatch alarm recovery action chỉ hoạt động với instance cấu hình EBS — đúng điều kiện bắt buộc.","Sai: EventBridge events không thể trực tiếp trigger recovery của EC2 instance."],"pattern":"Nhớ đúng điều kiện ràng buộc của tính năng CloudWatch alarm EC2 recovery (chỉ hỗ trợ EBS)","why":"Recovery action của CloudWatch alarm chỉ hoạt động trên instance dùng EBS volume, không hỗ trợ instance store — nên phương án đúng phải loại trừ instance store.","trap":"Phương án A nghe tương tự phương án đúng (C) nhưng thêm chi tiết sai 'hoặc instance store' khiến nó vi phạm điều kiện kỹ thuật bắt buộc.","tip":"CloudWatch alarm tự động recovery EC2 chỉ áp dụng cho instance dùng EBS, không áp dụng cho instance store (dữ liệu tạm thời, gắn liền phần cứng vật lý)."},{"id":31,"domain":"perf","topic":"Global Accelerator for UDP low latency","q":"A media company wants a low-latency way to distribute live sports results which are delivered via a proprietary application using UDP protocol.\nAs a solutions architect, which of the following solutions would you recommend such that it offers the BEST performance for this use case?","opts":["Use Amazon CloudFront to provide a low latency way to distribute live sports results","Use Elastic Load Balancing (ELB) to provide a low latency way to distribute live sports results","Use AWS Global Accelerator to provide a low latency way to distribute live sports results","Use Auto Scaling group to provide a low latency way to distribute live sports results"],"ans":[2],"you1":[2],"notes":["Sai: CloudFront hỗ trợ HTTP/RTMP, không hỗ trợ giao thức UDP tùy chỉnh.","Sai: ELB cân bằng tải traffic, không giúp giảm latency của đường truyền từ nguồn.","Đúng: Global Accelerator tối ưu cho use case non-HTTP như UDP, dùng mạng AWS toàn cầu để giảm latency.","Sai: Auto Scaling group chỉ quản lý số lượng instance, không liên quan đến việc giảm latency mạng."],"pattern":"Chọn dịch vụ tăng tốc mạng đúng theo giao thức (HTTP vs non-HTTP/UDP)","why":"Global Accelerator được thiết kế cho các use case non-HTTP như gaming (UDP), IoT (MQTT), VoIP — đúng với yêu cầu UDP của đề bài.","trap":"CloudFront là lựa chọn quen thuộc cho 'distribute content với low latency' nhưng chỉ hỗ trợ HTTP/RTMP, không áp dụng được cho giao thức UDP tùy chỉnh.","tip":"Giao thức HTTP/HTTPS, nội dung cache được → CloudFront. Giao thức TCP/UDP non-HTTP (gaming, VoIP, IoT) → Global Accelerator."},{"id":32,"domain":"perf","topic":"FSx for Windows via SMB from Windows+Linux","q":"A financial services company is modernizing its analytics platform on AWS. Their legacy data processing scripts, built for both Windows and Linux environments, require shared access to a file system that supports Windows ACLs and SMB protocol for compatibility with existing Windows workloads. At the same time, their Linux-based applications need to read from and write to the same shared storage to maintain cross-platform consistency. The solutions architect needs to design a storage solution that allows both Windows and Linux EC2 instances to access the shared file system simultaneously, while preserving Windows-specific features like NTFS permissions and Active Directory (AD) integration.\nWhich solution will best meet these requirements?","opts":["Deploy Amazon FSx for Windows File Server and mount it using the SMB protocol from both Windows and Linux EC2 instances","Create an S3 bucket and mount it on EC2 instances using Mountpoint for Amazon S3, managing access through IAM policies to support both Windows and Linux workloads","Deploy Amazon FSx for Lustre and mount the file system using a POSIX-compliant client from both platforms","Use Amazon EFS with the Standard storage class and mount the file system using NFS from both Windows and Linux instances"],"ans":[0],"you1":[0],"notes":["Đúng: FSx for Windows hỗ trợ SMB cho cả Windows và Linux (qua cifs-utils), giữ nguyên NTFS permissions và AD integration.","Sai: Mountpoint for S3 chỉ hỗ trợ Linux, không hỗ trợ Windows, và S3 không phải file system POSIX/SMB thực sự.","Sai: FSx for Lustre tối ưu cho Linux/HPC, không hỗ trợ Windows ACL/SMB/AD integration.","Sai: EFS dùng NFS, Windows không hỗ trợ NFS native, và EFS không có NTFS permissions/AD integration."],"pattern":"Chia sẻ file hỗn hợp Windows+Linux cần giữ tính năng Windows-specific (NTFS, AD) → FSx for Windows qua SMB","why":"FSx for Windows là lựa chọn duy nhất hỗ trợ đồng thời SMB cho cả Windows và Linux trong khi vẫn giữ nguyên NTFS permissions và AD integration.","trap":"EFS là lựa chọn 'shared file system' quen thuộc nhưng chỉ hỗ trợ NFS/Linux, hoàn toàn không có tính năng Windows-specific mà đề bài yêu cầu.","tip":"Cần chia sẻ file giữa Windows và Linux mà vẫn giữ NTFS/AD → FSx for Windows File Server (SMB), không phải EFS (NFS, chỉ Linux)."},{"id":33,"domain":"perf","topic":"ECS Fargate + EFS for persistent container storage","q":"A financial services firm runs a containerized risk analytics tool in its on-premises data center using Docker. The tool depends on persistent data storage for maintaining customer simulation results and operates on a single host machine where the volume is locally mounted. The infrastructure team is looking to replatform the tool to AWS using a fully managed service because they want to avoid managing EC2 instances, volumes, or underlying servers.\nWhich AWS solution best meets these requirements?","opts":["Use AWS Lambda with a container image runtime. Store stateful data in temporary local storage (/tmp) and sync with Amazon S3 periodically","Use Amazon ECS with Fargate launch type. Provision an Amazon Elastic File System (Amazon EFS) file system. Mount the EFS volume inside the container at runtime to provide persistent storage access","Use Amazon EKS with managed node groups. Provision an Amazon EBS volume and mount it inside the container by creating a Kubernetes persistent volume and claim. Manage storage lifecycle manually","Use Amazon ECS with Fargate launch type. Attach an Amazon S3 bucket using a shared access script that mounts the S3 bucket into the container for data storage"],"ans":[1],"you1":[3],"notes":["Sai: /tmp của Lambda giới hạn 512MB, không bền vững qua các lần invocation — không phù hợp dữ liệu cần lưu trữ lâu dài.","Đúng: ECS Fargate tích hợp sẵn với EFS, mount trực tiếp vào task definition — không cần quản lý EC2/volume thủ công, đúng yêu cầu fully managed.","Sai: EKS managed node groups vẫn phải quản lý EC2 instance bên dưới, vi phạm yêu cầu tránh quản lý EC2/volume.","Sai: S3 là object storage, không thể mount như file system thực sự bằng 'shared access script' tự chế."],"pattern":"Container cần persistent storage, fully managed, không quản lý EC2/volume → ECS Fargate + EFS","why":"ECS Fargate có tích hợp native với EFS ngay trong task definition, cho phép mount persistent storage mà không cần quản lý server hay volume.","trap":"Dùng S3 'mount vào container' nghe như giải pháp sáng tạo nhưng S3 là object storage, không có khả năng mount như file system thật — chỉ là ý tưởng không khả thi về mặt kỹ thuật.","tip":"Container cần persistent file storage, fully managed → ECS/EKS Fargate + EFS. S3 không phải file system để mount trực tiếp vào container."},{"id":34,"domain":"perf","topic":"ECS Service Auto Scaling based on service CPU","q":"A healthcare company has deployed its web application on Amazon Elastic Container Service (Amazon ECS) container instances running behind an Application Load Balancer. The website slows down when the traffic spikes and the website availability is also reduced. The development team has configured Amazon CloudWatch alarms to receive notifications whenever there is an availability constraint so the team can scale out resources. The company wants an automated solution to respond to such events.\nWhich of the following addresses the given use case?","opts":["Configure AWS Auto Scaling to scale out the Amazon ECS cluster when the ECS service's CPU utilization rises above a threshold","Configure AWS Auto Scaling to scale out the Amazon ECS cluster when the Application Load Balancer's target group's CPU utilization rises above a threshold","Configure AWS Auto Scaling to scale out the Amazon ECS cluster when the CloudWatch alarm's CPU utilization rises above a threshold","Configure AWS Auto Scaling to scale out the Amazon ECS cluster when the Application Load Balancer's CPU utilization rises above a threshold"],"ans":[0],"you1":[2],"notes":["Đúng: target tracking scaling policy dựa trên CPU utilization của chính ECS service — đúng metric cần theo dõi để scale.","Sai: target group của ALB không có metric 'CPU utilization' — target group chỉ theo dõi health/traffic, không đo CPU.","Sai: 'CloudWatch alarm's CPU utilization' là khái niệm không tồn tại — alarm chỉ giám sát metric, bản thân nó không có CPU.","Sai: ALB là load balancer, không có khái niệm CPU utilization vì nó không chạy workload tính toán như EC2/ECS."],"pattern":"Scale ECS đúng theo CPU utilization của chính ECS SERVICE, không phải của ALB/CloudWatch alarm","why":"ECS Service Auto Scaling theo dõi đúng metric CPUUtilization của service (namespace ECS/ClusterName/ServiceName) trong CloudWatch.","trap":"Các phương án gán 'CPU utilization' cho ALB hoặc CloudWatch alarm là khái niệm không tồn tại/sai ngữ cảnh, nhưng nghe quen thuộc nên dễ bị chọn nhầm.","tip":"Metric để scale ECS service luôn là CPU/Memory utilization của chính SERVICE đó, không phải của load balancer hay alarm."},{"id":35,"domain":"perf","topic":"Global Accelerator to consolidate multi-Region ALB IPs","q":"A gaming company uses Application Load Balancers in front of Amazon EC2 instances for different services and microservices. The architecture has now become complex with too many Application Load Balancers in multiple AWS Regions. Security updates, firewall configurations, and traffic routing logic have become complex with too many IP addresses and configurations.\nThe company is looking at an easy and effective way to bring down the number of IP addresses allowed by the firewall and easily manage the entire network infrastructure. Which of these options represents an appropriate solution for this requirement?","opts":["Set up a Network Load Balancer with elastic IP address. Register the private IPs of all the Application Load Balancers as targets of this Network Load Balancer","Launch AWS Global Accelerator and create endpoints for all the Regions. Register the Application Load Balancers of each Region to the corresponding endpoints","Assign an Elastic IP to an Auto Scaling Group (ASG), and set up multiple Amazon EC2 instances to run behind the Auto Scaling Groups, for each of the Regions","Configure Elastic IPs for each of the Application Load Balancers in each Region"],"ans":[1],"you1":[2],"notes":["Sai: dù khả thi về kỹ thuật, vẫn phải quản lý nhiều NLB/ALB riêng biệt ở từng Region, không giảm được độ phức tạp tổng thể.","Đúng: Global Accelerator cấp 2 IP tĩnh duy nhất cho toàn bộ ứng dụng đa Region, giảm mạnh số IP cần quản lý trên firewall.","Sai: không thể gán Elastic IP trực tiếp cho Auto Scaling Group — ASG chỉ quản lý tập hợp instance, không có địa chỉ IP riêng.","Sai: Application Load Balancer không hỗ trợ gán Elastic IP (static IP) trự
