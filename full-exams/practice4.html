<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện đề SAA-C03</title>
<style>
:root{
  --bg:#f6f5f1;--surface:#ffffff;--surface2:#f0eee8;--text:#1d1c1a;--muted:#6b6862;--border:#dedbd3;
  --accent:#2f5d8a;--accent-soft:#e3ecf5;--ok:#2e7d4f;--ok-soft:#e2f2e8;--bad:#b3412f;--bad-soft:#f8e4df;--warn:#9a6a12;--warn-soft:#f6ecd6;
  --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header h1{font-size:1.45rem;margin:0 0 4px}
header p{margin:0;color:var(--muted);font-size:.92rem}
nav.tabs{display:flex;gap:6px;margin:18px 0 14px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.92rem}
nav.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.controls label{font-size:.88rem;color:var(--muted);display:flex;gap:6px;align-items:center}
select,.btn{font:inherit;font-size:.9rem;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 12px}
.btn{cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.progress>div{height:100%;background:var(--accent);width:0}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.85rem;color:var(--muted)}
.chip{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);margin-right:4px}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.qtext{font-size:1.05rem;margin:12px 0 4px;white-space:pre-line}
.hint{font-size:.85rem;color:var(--warn);margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:11px 12px;margin:8px 0;cursor:pointer;font:inherit}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:0 0 26px;height:26px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt .note{display:block;font-size:.85rem;color:var(--muted);margin-top:4px}
.opt[disabled]{cursor:default}
.verdict{font-weight:700;margin:14px 0 8px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.explain{border-top:1px dashed var(--border);margin-top:10px;padding-top:10px}
.explain p{margin:6px 0}
.explain b{color:var(--accent)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.score div{background:var(--surface2);border-radius:10px;padding:10px;text-align:center}
.score b{display:block;font-size:1.4rem}
.score span{font-size:.78rem;color:var(--muted)}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.grid button{width:44px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.82rem}
.grid button.cur{outline:2px solid var(--accent)}
.grid button.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.grid button.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
h2{font-size:1.15rem;margin:22px 0 10px}
h3{font-size:1rem;margin:20px 0 8px}
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:var(--surface2);font-weight:600}
tr:last-child td{border-bottom:none}
.search{width:100%;margin-bottom:6px}
ol.method li{margin:8px 0}
.hidden{display:none}
.result-list li{margin:4px 0}
.result-list a{color:var(--accent);cursor:pointer;text-decoration:underline}
@media (max-width:560px){.score{grid-template-columns:1fr 1fr 1fr}.opt{padding:10px}}
</style>
</head>

<header>
  <h1>Luyện đề AWS SAA-C03</h1>
  <p id="sub"></p>
  <p><a href="../index.html" style="color:var(--accent)">&larr; Về trang luyện đề chính</a></p>
</header>
<nav class="tabs">
  <button data-tab="quiz" class="on">Luyện đề</button>

    <label>Bộ câu
      <select id="f-set">
        <option value="all">Tất cả (65 câu)</option>
        <option value="wrong">Câu đã làm sai (lần trước)</option>

  <div id="cheat"></div>
</section>

</section>
</div>

<script>
const DATA = {"domains":{"cost":"Design Cost-Optimized Architectures","res":"Design Resilient Architectures","sec":"Design Secure Architectures","perf":"Design High-Performing Architectures"},"questions":[{"id":1,"domain":"sec","topic":"IAM Authentication for Lambda-to-RDS","multi":true,"q":"A company runs a popular dating website on the AWS Cloud. As a Solutions Architect, you've designed the architecture of the website to follow a serverless pattern on the AWS Cloud using Amazon API Gateway and AWS Lambda. The backend uses an Amazon RDS PostgreSQL database. Currently, the application uses a username and password combination to connect the AWS Lambda function to the Amazon RDS database.\nYou would like to improve the security at the authentication level by leveraging short-lived credentials. What will you choose? (Select two)","opts":["Attach an AWS Identity and Access Management (IAM) role to AWS Lambda","Use IAM authentication from AWS Lambda to Amazon RDS PostgreSQL","Restrict the Amazon RDS database security group to the AWS Lambda's security group","Deploy AWS Lambda in a VPC","Embed a credential rotation logic in the AWS Lambda, retrieving them from SSM"],"ans":[0,1],"you1":[0,2],"notes":["Đúng: cần gắn IAM role cho Lambda thì mới có danh tính để IAM database authentication sinh token xác thực.","Đúng: IAM authentication sinh token tạm thời (15 phút) thay cho mật khẩu cố định — đúng yêu cầu 'short-lived credentials'.","Thắt chặt Security Group tăng bảo mật mạng nhưng KHÔNG thay đổi cơ chế xác thực (vẫn dùng user/password).","Deploy Lambda trong VPC chỉ ảnh hưởng tới network path, không liên quan tới authentication.","Tự xây logic rotate credential qua SSM là over-engineering khi RDS đã hỗ trợ sẵn IAM authentication."],"pattern":"Phân biệt 'tăng bảo mật nói chung' với 'đổi cơ chế authentication' cụ thể","why":"IAM database authentication (gắn với IAM role trên Lambda) thay hẳn mật khẩu tĩnh bằng token ngắn hạn do AWS sinh ra.","trap":"Deploy Lambda trong VPC hay thắt chặt Security Group đều 'nghe' tăng bảo mật nhưng không đụng tới lớp authentication mà đề yêu cầu.","tip":"Câu hỏi về 'authentication/short-lived credentials' cho RDS → luôn nghĩ tới IAM database authentication, không phải network control (SG/VPC)."},{"id":2,"domain":"perf","topic":"AWS Lambda best practices","multi":true,"q":"The engineering team at an e-commerce company has been tasked with migrating to a serverless architecture. The team wants to focus on the key points of consideration when using AWS Lambda as a backbone for this architecture.\nAs a Solutions Architect, which of the following options would you identify as correct for the given requirement? (Select three)","opts":["Serverless architecture and containers complement each other but you cannot package and deploy AWS Lambda functions as container images","If you intend to reuse code in more than one AWS Lambda function, you should consider creating an AWS Lambda Layer for the reusable code","By default, AWS Lambda functions always operate from an AWS-owned VPC and hence have access to any public internet address or public AWS APIs. Once an AWS Lambda function is VPC-enabled, it will need a route through a Network Address Translation gateway (NAT gateway) in a public subnet to access public resources","The bigger your deployment package, the slower your AWS Lambda function will cold-start. Hence, AWS suggests packaging dependencies as a separate package from the actual AWS Lambda package","AWS Lambda allocates compute power in proportion to the memory you allocate to your function. AWS, thus recommends to over provision your function time out settings for the proper performance of AWS Lambda functions","Since AWS Lambda functions can scale extremely quickly, it's a good idea to deploy a Amazon CloudWatch Alarm that notifies your team when function metrics such as ConcurrentExecutions or Invocations exceeds the expected threshold"],"ans":[1,2,5],"you1":[1,3,5],"notes":["Sai: Lambda HOÀN TOÀN có thể đóng gói và triển khai dưới dạng container image.","Đúng: nên tách code dùng chung thành Lambda Layer để gọn deployment package.","Đúng: Lambda mặc định chạy từ VPC do AWS quản lý, chỉ cần NAT gateway khi VPC-enable và cần ra tài nguyên public.","Sai: AWS đóng gói TẤT CẢ dependency chung 1 gói duy nhất, không khuyến nghị tách rời như phát biểu.","Sai: AWS khuyến nghị đặt timeout SÁT với thời gian chạy thực tế, không phải 'over-provision' timeout.","Đúng: nên đặt CloudWatch Alarm theo dõi ConcurrentExecutions/Invocations vì Lambda có thể scale rất nhanh."],"pattern":"Chọn đúng phát biểu True/False về best practice của Lambda","why":"3 phát biểu đúng là: dùng Layer cho code dùng chung, VPC-enable cần NAT để ra public, và dùng CloudWatch Alarm theo dõi scale đột biến.","trap":"Phát biểu 'tách dependency riêng để giảm cold-start' nghe hợp lý về mặt tối ưu nhưng SAI về thực tế đóng gói của Lambda — một dạng phủ định tinh vi.","tip":"Với câu 'chọn phát biểu ĐÚNG', luôn kiểm tra xem phát biểu có đảo ngược sự thật kỹ thuật (vd dependency tách riêng, time-out over-provision) hay không trước khi chọn."},{"id":3,"domain":"res","topic":"ElastiCache Redis Multi-AZ for DR","q":"A media company uses Amazon ElastiCache Redis to enhance the performance of its Amazon RDS database layer. The company wants a robust disaster recovery strategy for its caching layer that guarantees minimal downtime as well as minimal data loss while ensuring good application performance.\nWhich of the following solutions will you recommend to address the given use-case?","opts":["Schedule manual backups using Redis append-only file (AOF)","Schedule daily automatic backups at a time when you expect low resource utilization for your cluster","Opt for Multi-AZ configuration with automatic failover functionality to help mitigate failure","Add read-replicas across multiple availability zones (AZs) to reduce the risk of potential data loss because of failure"],"ans":[2],"you1":[2],"notes":["AOF giúp chống mất dữ liệu phần nào nhưng không chống được lỗi phần cứng của node cache.","Backup hàng ngày có thể mất tới gần 1 ngày dữ liệu nếu sự cố xảy ra trước lần backup kế tiếp.","Multi-AZ với automatic failover cho downtime thấp nhất và mất dữ liệu thấp nhất trong các lựa chọn.","Read replica giúp giảm tải đọc, không phải giải pháp fault-tolerance hoàn chỉnh khi node chính lỗi."],"pattern":"Chọn chiến lược DR cho ElastiCache cân bằng downtime + data loss + performance","why":"Multi-AZ tự động failover sang node khoẻ mạnh nên downtime và mất dữ liệu đều ở mức thấp nhất, không cần thao tác thủ công.","trap":"AOF và read-replica đều 'có vẻ' liên quan đến chống mất dữ liệu nhưng không giải quyết được trường hợp lỗi phần cứng của node chính.","tip":"DR cho ElastiCache ưu tiên downtime+data loss thấp nhất → Multi-AZ automatic failover; AOF/backup chỉ hỗ trợ khôi phục thủ công, chậm hơn."},{"id":4,"domain":"perf","topic":"AWS Global Accelerator static IP whitelisting","q":"A company uses Application Load Balancers in multiple AWS Regions. The Application Load Balancers receive inconsistent traffic that varies throughout the year. The engineering team at the company needs to allow the IP addresses of the Application Load Balancers in the on-premises firewall to enable connectivity.\nWhich of the following represents the MOST scalable solution with minimal configuration changes?","opts":["Develop an AWS Lambda script to get the IP addresses of the Application Load Balancers in different Regions. Configure the on-premises firewall's rule to allow the IP addresses of the Application Load Balancers","Set up a Network Load Balancer in one Region. Register the private IP addresses of the Application Load Balancers in different Regions with the Network Load Balancer. Configure the on-premises firewall's rule to allow the Elastic IP address attached to the Network Load Balancer","Set up AWS Global Accelerator. Register the Application Load Balancers in different Regions to the AWS Global Accelerator. Configure the on-premises firewall's rule to allow static IP addresses associated with the AWS Global Accelerator","Migrate all Application Load Balancers in different Regions to the Network Load Balancers. Configure the on-premises firewall's rule to allow the Elastic IP addresses of all the Network Load Balancers"],"ans":[2],"you1":[0],"notes":["Phải liên tục cập nhật firewall mỗi khi IP của ALB đổi — không ổn định, nhiều vận hành.","NLB chỉ hoạt động trong 1 Region, không thể đại diện cho ALB ở nhiều Region khác nhau.","Global Accelerator cấp 2 IP tĩnh anycast — chỉ cần cấu hình firewall 1 lần duy nhất cho mọi Region.","Đổi hết ALB sang NLB vẫn cần cấu hình lại firewall cho nhiều NLB khác nhau, không giảm được số IP cần allow."],"pattern":"Whitelist firewall on-prem cho hạ tầng đa Region, thay đổi càng ít càng tốt","why":"Global Accelerator cung cấp 2 IP tĩnh cố định bất kể số Region/endpoint phía sau, nên chỉ cấu hình firewall một lần.","trap":"Giải pháp tự viết Lambda lấy IP ALB nghe 'tự động hoá' nhưng vẫn phải sửa firewall liên tục mỗi khi IP thay đổi — không scalable.","tip":"Cần IP tĩnh ổn định để whitelist firewall cho hạ tầng đa Region/đổi liên tục → Global Accelerator, không phải tự động lấy IP bằng script."},{"id":5,"domain":"res","topic":"Disaster Recovery - Warm Standby","q":"A financial services firm has traditionally operated with an on-premise data center and would like to create a disaster recovery strategy leveraging the AWS Cloud.\nAs a Solutions Architect, you would like to ensure that a scaled-down version of a fully functional environment is always running in the AWS cloud, and in case of a disaster, the recovery time is kept to a minimum. Which disaster recovery strategy is that?","opts":["Backup and Restore","Multi Site","Warm Standby","Pilot Light"],"ans":[2],"you1":[1],"notes":["Backup and Restore là chiến lược chậm nhất, không có môi trường nào chạy sẵn trên cloud.","Multi Site chạy active-active đầy đủ cả 2 nơi — mạnh hơn mức 'scaled-down' mà đề yêu cầu.","Warm Standby đúng định nghĩa: môi trường thu nhỏ nhưng LUÔN chạy sẵn trên cloud.","Pilot Light chỉ giữ lõi hệ thống (lõi dữ liệu), chưa phải 'bản thu nhỏ đầy đủ chức năng' đang chạy."],"pattern":"Phân biệt 4 mức DR theo mức độ 'đang chạy sẵn' trên cloud","why":"Warm Standby = bản scaled-down NHƯNG đầy đủ chức năng và luôn bật, đúng khớp với mô tả đề bài.","trap":"Multi Site và Pilot Light đều liên quan DR nhưng lệch mức: Multi Site mạnh/tốn hơn hẳn yêu cầu, Pilot Light yếu hơn (chỉ lõi, chưa 'đầy đủ chức năng').","tip":"4 mức DR tăng dần theo RTO/chi phí: Backup & Restore < Pilot Light < Warm Standby < Multi-Site Active/Active. 'Scaled-down nhưng luôn chạy, đủ chức năng' = Warm Standby."},{"id":6,"domain":"res","topic":"VPC Peering - cost-effective VPC interconnect","q":"A small rental company had 5 employees, all working under the same AWS cloud account. These employees deployed their applications built for various functions- including billing, operations, finance, etc. Each of these employees has been operating in their own VPC. Now, there is a need to connect these VPCs so that the applications can communicate with each other.\nWhich of the following is the MOST cost-effective solution for this use-case?","opts":["Use a VPC peering connection","Use a Network Address Translation gateway (NAT gateway)","Use an Internet Gateway","Use an AWS Direct Connect connection"],"ans":[0],"you1":[0],"notes":["VPC Peering kết nối trực tiếp giữa các VPC, không tính phí hạ tầng theo giờ, chỉ tính phí data transfer.","NAT Gateway dùng cho private subnet ra internet, không phải để nối 2 VPC với nhau.","Internet Gateway chỉ cho VPC ra internet, không phục vụ kết nối VPC-VPC.","Direct Connect dùng để nối on-premises với AWS, quá tốn kém và dư thừa cho việc nối vài VPC trong cùng account."],"pattern":"Chọn giải pháp rẻ nhất để nối vài VPC trong cùng 1 account","why":"Với số lượng VPC nhỏ (5 VPC), VPC Peering là cách rẻ và đơn giản nhất, không phát sinh phí giờ chạy.","trap":"Direct Connect nghe 'chuyên nghiệp' nhưng được thiết kế cho kết nối on-prem, hoàn toàn sai mục đích và đắt đỏ không cần thiết ở đây.","tip":"Số VPC ít (<10), cùng tổ chức → VPC Peering là lựa chọn rẻ nhất; nhiều VPC hơn mới cần Transit Gateway."},{"id":7,"domain":"cost","topic":"S3 encryption - KMS customer managed key rotation","q":"An e-commerce analytics company is preparing to archive several years of transaction records and customer analytics reports in Amazon S3 for long-term storage. To meet compliance requirements, the archived data must be encrypted at rest. Additionally, the solution must be cost-effective and ensure that key rotation occurs automatically every 12 months to comply with the company’s internal data governance policy.\nWhich solution will meet these requirements with the least operational overhead?","opts":["Use Amazon S3 server-side encryption with S3-managed keys (SSE-S3). Upload data with default encryption enabled. Rely on the built-in key management and rotation behavior of SSE-S3","Use AWS Key Management Service (KMS) to create a customer managed key with automatic rotation enabled. Configure the S3 bucket’s default encryption to use the customer managed key. Migrate the data to the S3 bucket","Encrypt the data locally using client-side encryption libraries and upload the encrypted files to S3. Create a KMS key with imported key material and configure key rotation settings","Use AWS CloudHSM to generate encryption keys. Configure S3 to use these custom encryption keys via client-side encryption and rotate the keys annually using an on-premises key management workflow"],"ans":[1],"you1":[0],"notes":["SSE-S3 dùng key do AWS quản lý, không thể cấu hình/kiểm chứng chu kỳ rotate theo yêu cầu compliance 12 tháng.","KMS customer managed key bật automatic rotation: AWS tự rotate mỗi năm, không cần thao tác thủ công, vẫn audit được qua CloudTrail.","Key nhập từ ngoài vào (imported key material) KHÔNG hỗ trợ automatic rotation — phải tự rotate và re-import thủ công.","CloudHSM đòi hỏi tự quản lý hạ tầng khoá, backup, rotation thủ công — ngược với yêu cầu 'ít vận hành nhất'."],"pattern":"Mã hoá bắt buộc + rotate key tự động định kỳ, ít thao tác vận hành nhất","why":"Customer managed key trong KMS với automatic rotation đáp ứng đúng cả 2 tiêu chí: mã hoá và rotate hàng năm tự động.","trap":"SSE-S3 'miễn phí, đơn giản' nhưng không kiểm soát/audit được chu kỳ rotate — không đáp ứng yêu cầu compliance cụ thể về rotation.","tip":"Cần rotate key tự động, có thể audit, theo chu kỳ cụ thể → KMS customer managed key + automatic rotation, không phải SSE-S3 hay key tự import."},{"id":8,"domain":"sec","topic":"Direct Connect primary + Site-to-Site VPN backup","multi":true,"q":"A company wants to adopt a hybrid cloud infrastructure where it uses some AWS services such as Amazon S3 alongside its on-premises data center. The company wants a dedicated private connection between the on-premise data center and AWS. In case of failures though, the company needs to guarantee uptime and is willing to use the public internet for an encrypted connection.\nWhat do you recommend? (Select two)","opts":["Use AWS Direct Connect connection as a backup connection","Use AWS Site-to-Site VPN as a backup connection","Use AWS Site-to-Site VPN as a primary connection","Use Egress Only Internet Gateway as a backup connection","Use AWS Direct Connect connection as a primary connection"],"ans":[1,4],"you1":[0,4],"notes":["Sai vai trò: Direct Connect là lựa chọn tốt cho PRIMARY (riêng tư, hiệu năng cao), dùng làm backup thì lãng phí không cần thiết.","Đúng: VPN qua internet công cộng, mã hoá sẵn (IPSec), phù hợp làm phương án dự phòng khi Direct Connect lỗi.","Đề yêu cầu kết nối riêng tư (dedicated) làm chính — VPN qua internet không nên là primary.","Egress-Only IGW chỉ dùng cho IPv6 outbound ra internet, không kết nối được on-prem với AWS.","Đúng: Direct Connect là kết nối riêng tư, dành riêng — đúng vai trò primary theo yêu cầu đề bài."],"pattern":"Ghép đúng vai trò Primary/Backup cho 2 dịch vụ kết nối hybrid","why":"Direct Connect (riêng tư, hiệu năng cao) đóng vai trò primary; Site-to-Site VPN (qua internet, có mã hoá) đóng vai trò backup khi Direct Connect gặp sự cố.","trap":"Đảo ngược vai trò — dùng Direct Connect làm backup (tốn kém, dư thừa) hoặc VPN làm primary (không đúng yêu cầu 'dedicated') đều là bẫy đánh vào việc đọc lướt đề.","tip":"Khi đề có cặp 'kết nối riêng tư + phương án dự phòng qua internet': riêng tư/dedicated luôn là Primary, VPN qua internet luôn là Backup."},{"id":9,"domain":"perf","topic":"Amazon Neptune graph database","q":"The development team at a social media company wants to handle some complicated queries such as \"What are the number of likes on the videos that have been posted by friends of a user A?\".\nAs a solutions architect, which of the following AWS database services would you suggest as the BEST fit to handle such use cases?","opts":["Amazon Aurora","Amazon Neptune","Amazon Redshift","Amazon OpenSearch Service"],"ans":[1],"you1":[1],"notes":["Aurora là relational database, không tối ưu cho truy vấn quan hệ nhiều tầng (bạn của bạn...).","Neptune là graph database chuyên biệt, xử lý truy vấn quan hệ phức tạp với độ trễ mili-giây.","Redshift là data warehouse cho phân tích khối lượng lớn, không phải cho truy vấn quan hệ mạng xã hội thời gian thực.","OpenSearch chuyên cho tìm kiếm/log analytics, không phải mô hình dữ liệu đồ thị (graph)."],"pattern":"Nhận diện use-case 'quan hệ nhiều tầng' (graph) để chọn đúng loại database","why":"Câu hỏi về mối quan hệ giữa các thực thể (user-friend-like) là bài toán graph điển hình, đúng sở trường của Neptune.","trap":"Aurora/Redshift đều là database 'mạnh' nhưng không có mô hình dữ liệu đồ thị để xử lý truy vấn nhiều tầng quan hệ hiệu quả.","tip":"Câu hỏi có từ khoá 'mối quan hệ', 'bạn của bạn', 'mạng liên kết' → nghĩ ngay tới Amazon Neptune (graph database)."},{"id":10,"domain":"sec","topic":"RDS SSL/TLS for data-in-transit","q":"A retail company uses AWS Cloud to manage its technology infrastructure. The company has deployed its consumer-focused web application on Amazon EC2-based web servers and uses Amazon RDS PostgreSQL database as the data store. The PostgreSQL database is set up in a private subnet that allows inbound traffic from selected Amazon EC2 instances. The database also uses AWS Key Management Service (AWS KMS) for encrypting data at rest.\nWhich of the following steps would you recommend to facilitate end-to-end security for the data-in-transit while accessing the database?","opts":["Configure Amazon RDS to use SSL for data in transit","Use IAM authentication to access the database instead of the database user's access credentials","Create a new network access control list (network ACL) that blocks SSH from the entire Amazon EC2 subnet into the database","Create a new security group that blocks SSH from the selected Amazon EC2 instances into the database"],"ans":[0],"you1":[0],"notes":["Bật SSL/TLS mã hoá trực tiếp kết nối application↔RDS — đúng trọng tâm 'data-in-transit'.","IAM authentication chỉ thay cách xác thực (không cần password), không tự động mã hoá đường truyền.","Không thể SSH vào RDS instance — NACL chặn SSH là phương án không liên quan (distractor).","Tương tự, Security Group chặn SSH vào RDS cũng là distractor vì RDS vốn không hỗ trợ SSH."],"pattern":"Chọn đúng cơ chế bảo vệ cho ĐÚNG lớp bảo mật được hỏi (in-transit)","why":"SSL/TLS là cơ chế trực tiếp mã hoá dữ liệu khi di chuyển giữa EC2 và RDS, đúng với yêu cầu 'data-in-transit'.","trap":"Các lựa chọn chặn SSH vào RDS là bẫy hoàn toàn vô nghĩa — RDS không phải là máy chủ SSH được.","tip":"Mã hoá dữ liệu khi di chuyển (in-transit) tới RDS → bật SSL/TLS; mã hoá lúc nghỉ (at-rest) → KMS; đổi cách đăng nhập → IAM authentication (khác mục đích)."},{"id":11,"domain":"sec","topic":"VPC troubleshooting - IGW route + SG ping","multi":true,"q":"A company has recently created a new department to handle their services workload. An IT team has been asked to create a custom VPC to isolate the resources created in this new department. They have set up the public subnet and internet gateway (IGW). However, they are not able to ping the Amazon EC2 instances with elastic IP address (EIP) launched in the newly created VPC.\nAs a Solutions Architect, the team has requested your help. How will you troubleshoot this scenario? (Select two)","opts":["Check if the route table is configured with internet gateway","Contact AWS support to map your VPC with subnet","Create a secondary internet gateway to attach with public subnet and move the current internet gateway to private and write route tables","Check if the security groups allow ping from the source","Disable Source / Destination check on the Amazon EC2 instance"],"ans":[0,3],"you1":[0,4],"notes":["Đúng: route table của subnet phải có route trỏ tới Internet Gateway thì traffic ra/vào internet mới đi được.","Không có khái niệm 'liên hệ AWS support để map VPC với subnet' — subnet vốn thuộc VPC theo cấu hình của bạn.","Không tồn tại 'secondary Internet Gateway' — mỗi VPC chỉ gắn được 1 IGW.","Đúng: Security Group (stateful) phải cho phép traffic ICMP (ping) thì request mới được chấp nhận.","Source/Destination check chỉ liên quan tới NAT/router instance, không ảnh hưởng tới việc ping một EC2 bình thường."],"pattern":"Troubleshoot kết nối internet cơ bản: route table + security group","why":"Hai điều kiện bắt buộc để ping một EC2 có EIP thành công là route trỏ IGW và SG cho phép ICMP — thiếu 1 trong 2 là tắc nghẽn.","trap":"Disable Source/Destination check nghe liên quan tới networking nhưng thực chất chỉ áp dụng cho instance đóng vai trò NAT/router, không áp dụng ở đây.","tip":"Checklist EC2 không ping/kết nối được: route table → IGW, Security Group cho phép traffic, NACL 2 chiều, và instance có public/Elastic IP."},{"id":12,"domain":"sec","topic":"ALB SSL SNI for multiple domains","q":"A CRM web application was written as a monolith in PHP and is facing scaling issues because of performance bottlenecks. The CTO wants to re-engineer towards microservices architecture and expose their application from the same load balancer, linked to different target groups with different URLs: checkout.mycorp.com, www.mycorp.com, yourcorp.com/profile and yourcorp.com/search. The CTO would like to expose all these URLs as HTTPS endpoints for security purposes.\nAs a solutions architect, which of the following would you recommend as a solution that requires MINIMAL configuration effort?","opts":["Change the Elastic Load Balancing (ELB) SSL Security Policy","Use Secure Sockets Layer certificate (SSL certificate) with SNI","Use an HTTP to HTTPS redirect","Use a wildcard Secure Sockets Layer certificate (SSL certificate)"],"ans":[1],"you1":[1],"notes":["Đổi SSL Security Policy chỉ ảnh hưởng cipher/protocol được hỗ trợ, không giải quyết việc phục vụ nhiều domain.","SNI cho phép gắn nhiều chứng chỉ (nhiều domain khác nhau) vào CÙNG một listener của ALB, cấu hình đơn giản nhất.","Redirect HTTP→HTTPS không tạo ra nhiều HTTPS endpoint cho các domain khác nhau.","Wildcard certificate chỉ phủ các subdomain cùng pattern, không phủ được domain khác hẳn (vd yourcorp.com khác mycorp.com)."],"pattern":"Phục vụ nhiều domain khác nhau bằng 1 load balancer, ít cấu hình nhất","why":"SNI cho phép ALB chọn đúng chứng chỉ theo tên miền trong mỗi request, nên có thể gắn nhiều chứng chỉ cho nhiều domain khác nhau trên cùng 1 listener.","trap":"Wildcard certificate nghe như giải quyết được 'nhiều domain' nhưng chỉ bao phủ các subdomain cùng gốc, không bao phủ domain gốc khác (yourcorp.com khác mycorp.com).","tip":"Nhiều domain KHÁC NHAU (không cùng gốc) trên 1 load balancer → SNI (multiple certs/listener). Nhiều subdomain CÙNG gốc → wildcard certificate."},{"id":13,"domain":"cost","topic":"Storage Gateway Cached Volumes","q":"A healthcare provider is experiencing rapid data growth in its on-premises servers due to increased patient imaging and record retention requirements. The organization wants to extend its storage capacity to AWS in a way that preserves quick access to critical records, including from its local file systems. The company must optimize bandwidth usage during migration and avoid any retrieval fees or delays when accessing the data in the cloud. The provider wants a hybrid cloud solution that requires minimal application reconfiguration, allows frequent local access to key datasets, and ensures that cloud storage costs remain predictable without paying extra for data retrieval.\nWhich AWS solution best meets these requirements?","opts":["Deploy AWS Storage Gateway using cached volumes. Store frequently accessed data locally, while writing all primary data asynchronously to Amazon S3","Set up Amazon S3 Standard-Infrequent Access (S3 Standard-IA) as the primary storage tier. Configure the on-premises file server to replicate changes to the S3 bucket using AWS DataSync for asynchronous updates","Deploy AWS Storage Gateway using stored volumes. Retain the full dataset on-premises and asynchronously back up point-in-time snapshots to Amazon S3. Configure applications to read from the local volume and recover data from the cloud if needed","Implement Amazon FSx for Windows File Server and configure on-premises servers to mount the file system using a VPN connection. Store all primary data in FSx and use it as the central NAS replacement"],"ans":[0],"you1":[2],"notes":["Cached Volumes: dữ liệu chính nằm trên S3, chỉ cache phần hay dùng tại chỗ — đúng yêu cầu tối ưu băng thông + truy cập nhanh local.","S3 Standard-IA tính phí retrieval mỗi lần truy cập, vi phạm yêu cầu 'không phát sinh phí retrieval'.","Stored Volumes vẫn giữ TOÀN BỘ dữ liệu tại chỗ, S3 chỉ là nơi backup — không giảm được nhu cầu lưu trữ local như đề cần.","FSx qua VPN gây độ trễ cao và không tối ưu băng thông vì mọi I/O đều phải đi qua mạng."],"pattern":"Phân biệt 2 kiểu Storage Gateway: Cached Volumes vs Stored Volumes","why":"Cached Volumes lưu phần lớn dữ liệu trên S3 và chỉ cache phần hay truy cập cục bộ — tối ưu đúng cả băng thông, chi phí và tốc độ truy cập.","trap":"Stored Volumes rất dễ nhầm với Cached Volumes: Stored giữ TOÀN BỘ dữ liệu ở local (chỉ backup sang S3), ngược hẳn với yêu cầu mở rộng dung lượng lên cloud.","tip":"Muốn local lưu ít, cloud (S3) là nguồn chính → Cached Volumes. Muốn local giữ toàn bộ, cloud chỉ để backup → Stored Volumes."},{"id":14,"domain":"res","topic":"S3 Multipart Upload for large files","q":"A digital media company needs to manage uploads of around 1 terabyte each from an application being used by a partner company.\nAs a Solutions Architect, how will you handle the upload of these files to Amazon S3?","opts":["Use Amazon S3 Versioning","Use AWS Direct Connect to provide extra bandwidth","Use multi-part upload feature of Amazon S3","Use AWS Snowball"],"ans":[2],"you1":[3],"notes":["S3 Versioning quản lý phiên bản object, không liên quan đến cách upload file lớn.","Direct Connect mất hàng tuần để thiết lập, không phải giải pháp cho một nhu cầu upload file (dù lớn) qua ứng dụng.","Multi-part upload là tính năng S3 có sẵn, chia nhỏ file để upload song song/phục hồi khi lỗi — đúng chuẩn cho file 1TB.","Snowball dùng để chuyển dữ liệu VẬT LÝ số lượng lớn (TB-PB) một lần, không phù hợp cho luồng upload liên tục từ ứng dụng của đối tác."],"pattern":"Upload file lớn (>100MB, đặc biệt >5GB) lên S3 hiệu quả","why":"Multi-part upload là tính năng built-in của S3, cho phép chia nhỏ, upload song song và retry từng phần khi file rất lớn (1TB).","trap":"Snowball nghe hợp lý cho 'dữ liệu lớn' nhưng đó là giải pháp vận chuyển vật lý một lần, không phải cho luồng upload liên tục qua ứng dụng.","tip":"File > 100MB nên dùng multi-part upload; file > 5GB thì BẮT BUỘC phải dùng multi-part upload khi tải lên S3."},{"id":15,"domain":"perf","topic":"NLB cross-zone load balancing disabled","q":"Amazon Route 53 is configured to route traffic to two Network Load Balancer nodes belonging to two Availability Zones (AZs): AZ-A and AZ-B. Cross-zone load balancing is disabled. AZ-A has four targets and AZ-B has six targets.\nWhich of the below statements is true about traffic distribution to the target instances from Amazon Route 53?","opts":["Each of the four targets in AZ-A receives 10% of the traffic","Each of the six targets in AZ-B receives 10% of the traffic","Each of the four targets in AZ-A receives 8% of the traffic","Each of the four targets in AZ-A receives 12.5% of the traffic"],"ans":[3],"you1":[3],"notes":["Sai số: mỗi node LB nhận 50% traffic, chia cho 4 target trong AZ-A ra 12.5%, không phải 10%.","Sai số: 50% chia cho 6 target ở AZ-B ra 8.3%, không phải 10%.","Sai số: AZ-A nhận 12.5%/target chứ không phải 8% (8% là số đúng của AZ-B làm tròn).","Đúng: mỗi load balancer node nhận 50% traffic, chia đều cho 4 target trong AZ-A cùng node đó = 12.5%/target."],"pattern":"Tính phần trăm traffic khi cross-zone load balancing bị TẮT","why":"Khi tắt cross-zone, mỗi node LB (50% traffic tổng) chỉ chia cho các target TRONG CÙNG AZ của nó: 50%/4 = 12.5% cho mỗi target AZ-A.","trap":"Các đáp án đều dùng số liệu đúng của AZ khác hoặc làm tròn sai để đánh lừa phép tính (8% thực chất là của AZ-B, không phải AZ-A).","tip":"Cross-zone TẮT: mỗi AZ coi như độc lập 50% traffic/số AZ, rồi chia tiếp cho SỐ TARGET TRONG AZ ĐÓ (không phải tổng số target 2 AZ)."},{"id":16,"domain":"sec","topic":"IAM resource-based policy (role trust policy)","q":"A systems administrator is creating IAM policies and attaching them to IAM identities. After creating the necessary identity-based policies, the administrator is now creating resource-based policies.\nWhich is the only resource-based policy that the IAM service supports?","opts":["Trust policy","Access control list (ACL)","AWS Organizations Service Control Policies (SCP)","Permissions boundary"],"ans":[0],"you1":[0],"notes":["Đúng: trust policy gắn vào IAM role là loại resource-based policy DUY NHẤT mà dịch vụ IAM hỗ trợ.","ACL là resource-based policy nhưng thuộc về S3/WAF/VPC, không phải của dịch vụ IAM.","SCP thuộc AWS Organizations, giới hạn quyền tối đa cho account/OU, không phải resource-based policy của IAM.","Permissions boundary là một dạng managed policy giới hạn quyền tối đa của identity, không phải resource-based policy."],"pattern":"Phân biệt các loại policy: identity-based, resource-based, SCP, permissions boundary","why":"IAM role vừa là identity vừa là resource, nên cần trust policy (resource-based) để xác định ai được assume role đó — đây là loại duy nhất IAM hỗ trợ.","trap":"ACL, SCP, permissions boundary đều là các loại policy hợp lệ trong AWS nhưng KHÔNG thuộc phạm vi 'resource-based policy của dịch vụ IAM'.","tip":"Resource-based policy của riêng IAM = trust policy (trên role). ACL (S3/VPC/WAF), SCP (Organizations), permissions boundary (identity) đều là khái niệm khác."},{"id":17,"domain":"perf","topic":"AWS CloudFormation for reusable IaC templates","q":"You started a new job as a solutions architect at a company that has both AWS experts and people learning AWS. Recently, a developer misconfigured a newly created Amazon RDS database which resulted in a production outage.\nHow can you ensure that Amazon RDS specific best practices are incorporated into a reusable infrastructure template to be used by all your AWS users?","opts":["Store your recommendations in a custom AWS Trusted Advisor rule","Use AWS CloudFormation to manage Amazon RDS databases","Attach an IAM policy to interns preventing them from creating an Amazon RDS database","Create an AWS Lambda function which sends emails when it finds misconfigured Amazon RDS databases"],"ans":[1],"you1":[2],"notes":["Trusted Advisor chỉ đưa ra khuyến nghị, không tạo được template hạ tầng tái sử dụng.","CloudFormation cho phép mô hình hoá best practice thành template IaC, tái sử dụng cho mọi người dùng — đúng yêu cầu.","Chặn 1 nhóm người (interns) không giải quyết gốc rễ: vẫn cần cách để MỌI người dùng đúng cấu hình chuẩn.","Lambda gửi email khi phát hiện lỗi là cách phản ứng SAU khi sự cố đã xảy ra, không phải tạo template chuẩn trước."],"pattern":"Chuẩn hoá best-practice thành hạ tầng tái sử dụng (IaC) thay vì chặn/giám sát từng người","why":"CloudFormation cho phép đóng gói best practice RDS vào 1 template dùng chung, đảm bảo mọi người tạo RDS đều đúng chuẩn ngay từ đầu.","trap":"Giải pháp 'chặn quyền intern' nghe như ngăn được lỗi nhưng chỉ xử lý 1 nhóm nhỏ, không giải quyết bài toán 'template tái sử dụng cho MỌI người dùng'.","tip":"Yêu cầu 'reusable infrastructure template' luôn trỏ tới Infrastructure as Code (CloudFormation/CDK/Terraform), không phải policy chặn quyền hay cảnh báo phản ứng."},{"id":18,"domain":"res","topic":"Elastic Beanstalk Golden AMI + user data","multi":true,"q":"Your company is deploying a website running on AWS Elastic Beanstalk. The website takes over 45 minutes for the installation and contains both static as well as dynamic files that must be generated during the installation process.\nAs a Solutions Architect, you would like to bring the time to create a new instance in your AWS Elastic Beanstalk deployment to be less than 2 minutes. Which of the following options should be combined to build a solution for this requirement? (Select two)","opts":["Use Amazon EC2 user data to customize the dynamic installation parts at boot time","Use AWS Elastic Beanstalk deployment caching feature","Create a Golden Amazon Machine Image (AMI) with the static installation components already setup","Store the installation files in Amazon S3 so they can be quickly retrieved","Use Amazon EC2 user data to install the application at boot time"],"ans":[0,2],"you1":[1,2],"notes":["Đúng: dùng user data chỉ để tuỳ biến phần ĐỘNG lúc boot, không cài đặt lại toàn bộ.","'Elastic Beanstalk deployment caching feature' là tên tính năng BỊA, không tồn tại trong AWS.","Đúng: Golden AMI dựng sẵn các thành phần TĨNH, instance khởi động gần như tức thì từ AMI đó.","Lưu file cài đặt trên S3 giúp tải nhanh hơn nhưng vẫn phải chạy cài đặt tốn ~45 phút, không giải quyết gốc vấn đề.","Dùng user data để cài ĐẶT TOÀN BỘ ứng dụng lúc boot vẫn mất ~45 phút như cũ, không đạt mục tiêu <2 phút."],"pattern":"Rút ngắn thời gian khởi tạo instance: tách phần tĩnh (AMI) và phần động (user data)","why":"Golden AMI dựng sẵn phần tĩnh giúp bỏ qua bước cài đặt nặng; user data chỉ xử lý phần cấu hình động còn lại — tổng thời gian còn vài phút.","trap":"'AWS Elastic Beanstalk deployment caching feature' là cái tên nghe rất hợp lý nhưng hoàn toàn không tồn tại — một dạng bẫy tên dịch vụ bịa đặt.","tip":"Giảm thời gian khởi tạo instance nặng cài đặt: tách phần KHÔNG đổi vào Golden AMI, phần CÓ đổi xử lý bằng user data lúc boot."},{"id":19,"domain":"perf","topic":"AWS DMS - S3 to Kinesis Data Streams bridge","q":"A Big Data analytics company writes data and log files in Amazon S3 buckets. The company now wants to stream the existing data files as well as any ongoing file updates from Amazon S3 to Amazon Kinesis Data Streams.\nAs a Solutions Architect, which of the following would you suggest as the fastest possible way of building a solution for this requirement?","opts":["Amazon S3 bucket actions can be directly configured to write data into Amazon Simple Notification Service (Amazon SNS). Amazon SNS can then be used to send the updates to Amazon Kinesis Data Streams","Leverage AWS Database Migration Service (AWS DMS) as a bridge between Amazon S3 and Amazon Kinesis Data Streams","Configure Amazon EventBridge events for the bucket actions on Amazon S3. An AWS Lambda function can then be triggered from the Amazon EventBridge event that will send the necessary data to Amazon Kinesis Data Streams","Leverage Amazon S3 event notification to trigger an AWS Lambda function for the file create event. The AWS Lambda function will then send the necessary data to Amazon Kinesis Data Streams"],"ans":[1],"you1":[1],"notes":["S3 không thể ghi trực tiếp vào SNS, và SNS cũng không gửi trực tiếp được tới Kinesis Data Streams.","DMS hỗ trợ sẵn S3 làm source và Kinesis làm target, cả dữ liệu cũ (full load) lẫn thay đổi mới (CDC) mà không cần code tự viết.","Cần bật CloudTrail object-level + tự viết Lambda để đẩy dữ liệu — nhiều công sức phát triển hơn hẳn.","Tương tự, dùng S3 event notification + Lambda tự viết tốn nhiều công sức phát triển hơn dùng tính năng có sẵn của DMS."],"pattern":"Bắc cầu dữ liệu giữa 2 dịch vụ AWS mà không cần code tự viết, nhanh nhất","why":"AWS DMS hỗ trợ sẵn S3 là nguồn và Kinesis Data Streams là đích, xử lý cả full load lẫn CDC mà không cần phát triển thêm.","trap":"Các phương án dùng EventBridge/S3 event + Lambda nghe khả thi nhưng đòi hỏi viết code tuỳ biến — chậm hơn nhiều so với dùng tính năng có sẵn của DMS.","tip":"Cần 'bắc cầu' dữ liệu giữa 2 dịch vụ AWS nhanh nhất, ít code nhất → kiểm tra xem AWS DMS có hỗ trợ sẵn cặp nguồn/đích đó không trước khi nghĩ tới Lambda tự viết."},{"id":20,"domain":"sec","topic":"S3 Object Lock Compliance + Glacier Vault Lock","q":"A financial services company is implementing two separate data retention policies to comply with regulatory standards:\nPolicy A: Critical transaction records must be immediately available for audit and must not be deleted or overwritten for 7 years.\nPolicy B: Archived compliance data must be stored in a low-cost, long-term storage solution and locked from deletion or modification for at least 10 years.\nAs a solutions architect, which combination of AWS features should you recommend to enforce these policies effectively?","opts":["Use Amazon S3 Standard storage class with S3 Lifecycle policies for Policy A, and S3 Glacier Flexible Retrieval for Policy B","Use Amazon S3 Glacier Vault Lock for both policies to reduce storage costs while enforcing retention","Use Amazon S3 Object Lock in Compliance mode for Policy A, and S3 Glacier Vault Lock for Policy B","Use Amazon S3 Object Lock in Governance mode for both policies to ensure data cannot be deleted prematurely"],"ans":[2],"you1":[0],"notes":["Lifecycle Policy chỉ chuyển tầng lưu trữ, KHÔNG ngăn được xoá/ghi đè — không đáp ứng yêu cầu bất biến (immutable).","Vault Lock chỉ dành cho Glacier (lưu trữ dài hạn), không phù hợp cho Policy A cần truy cập ngay lập tức để audit.","Đúng: Object Lock Compliance mode cho Policy A (truy cập nhanh + bất biến tuyệt đối), Vault Lock cho Policy B (lưu trữ rẻ, khoá dài hạn).","Governance mode vẫn cho phép user có quyền đặc biệt ghi đè/xoá — không đạt mức 'khoá chặt' mà cả 2 policy yêu cầu."],"pattern":"Ghép đúng cơ chế WORM cho 2 policy có đặc tính truy cập khác nhau (nhanh vs lưu trữ dài hạn)","why":"Object Lock Compliance phù hợp dữ liệu cần truy cập tức thời và bất biến tuyệt đối (Policy A); Vault Lock phù hợp dữ liệu archive giá rẻ, khoá dài hạn (Policy B).","trap":"Lifecycle Policy hay bị nhầm là công cụ 'khoá' dữ liệu nhưng thực chất chỉ quản lý chuyển tầng lưu trữ/tự xoá theo thời gian, không ngăn xoá thủ công.","tip":"Cần WORM + truy cập ngay → S3 Object Lock (Compliance = tuyệt đối, Governance = có thể bypass). Cần WORM cho archive giá rẻ dài hạn → Glacier Vault Lock."},{"id":21,"domain":"res","topic":"Route 53 TTL propagation delay","q":"A company has migrated its application from a monolith architecture to a microservices based architecture. The development team has updated the Amazon Route 53 simple record to point \"myapp.mydomain.com\" from the old Load Balancer to the new one.\nThe users are still not redirected to the new Load Balancer. What has gone wrong in the configuration?","opts":["The health checks are failing","The CNAME Record is misconfigured","The Alias Record is misconfigured","The Time To Live (TTL) is still in effect"],"ans":[3],"you1":[3],"notes":["Simple record không có health check, nên đây không phải nguyên nhân.","Đề không nói dùng CNAME record, đây là phương án đánh lạc hướng.","Đề không nói dùng Alias record, đây cũng là phương án đánh lạc hướng.","Đúng: TTL cũ vẫn còn hiệu lực trong cache của resolver, nên user vẫn nhận địa chỉ cũ cho tới khi TTL hết hạn."],"pattern":"Thay đổi DNS record nhưng chưa có hiệu lực ngay — nghĩ tới TTL cache","why":"DNS resolver cache giá trị cũ theo TTL đã cấu hình; record đã đổi nhưng user vẫn thấy giá trị cũ cho tới khi TTL hết hạn.","trap":"CNAME/Alias/health check đều là khái niệm Route 53 hợp lệ nhưng không liên quan gì tới tình huống 'vừa đổi record, DNS cũ vẫn còn hiệu lực'.","tip":"Đổi DNS record nhưng traffic chưa chuyển ngay → luôn nghĩ tới TTL cache trước; giảm TTL xuống thấp (vd 300s) TRƯỚC khi đổi record quan trọng."},{"id":22,"domain":"sec","topic":"Direct Connect Gateway multi-Region transitive routing","q":"A global pharmaceutical company operates a hybrid cloud network. Its primary AWS workloads run in the us-west-2 Region, connected to its on-premises data center via an AWS Direct Connect connection. After acquiring a biotech firm headquartered in Europe, the company must integrate the biotech’s workloads, which are hosted in several VPCs in the eu-central-1 Region and connected to the biotech's on-premises facility through a separate Direct Connect link. All CIDR blocks are non-overlapping, and the business requires full connectivity between both data centers and all VPCs across the two Regions. The company also wants a scalable solution that minimizes manual network configuration and long-term operational overhead.\nWhich solution will best meet these requirements?","opts":["Establish inter-Region VPC peering between each VPC in the us-west-2 and eu-central-1 Regions. Use static routing tables in each VPC to define peer relationships and enable cross-Region communication","Deploy EC2-based VPN appliances in each VPC. Configure a full mesh VPN topology between all VPCs and data centers using CloudHub-style routing across Regions","Create private VIFs (virtual interfaces) in each Region and associate them directly with foreign-region VPCs using routing table entries and BGP. Use VPC endpoints in each account to forward cross-Region traffic","Connect both Direct Connect links to a shared Direct Connect gateway. Attach each Region's virtual private gateway (VGW) to the Direct Connect gateway, enabling transitive routing between the VPCs and the on-premises networks across Regions"],"ans":[3],"you1":[0],"notes":["VPC Peering không transitive: phải peer từng cặp thủ công, và on-prem không thể 'đi nhờ' qua VPC đã peer để tới VPC khác.","Tự dựng VPN appliance full-mesh trên EC2 cực kỳ phức tạp: tự quản lý key, failover, scale — ngược hẳn yêu cầu ít vận hành.","Private VIF chỉ gắn được với VGW/Transit Gateway CÙNG Region, không thể gắn trực tiếp với VPC ở Region khác.","Đúng: Direct Connect Gateway là tài nguyên global, gắn được VGW của nhiều Region, cho phép routing xuyên Region/on-prem mà không cần tự dựng VPN/peering."],"pattern":"Kết nối transitive đa Region + on-prem với ít vận hành thủ công nhất","why":"Direct Connect Gateway là global resource duy nhất cho phép nối nhiều VGW (nhiều Region) với nhiều kết nối Direct Connect, tạo transitive routing sẵn có.","trap":"VPC Peering 'nghe' giải quyết được việc nối VPC nhưng non-transitive — không nối được on-prem Region này với VPC ở Region kia qua trung gian.","tip":"Cần nối nhiều Direct Connect link + nhiều VGW/VPC xuyên Region, ít thao tác tay nhất → Direct Connect Gateway, không phải VPC Peering hay VIF riêng lẻ."},{"id":23,"domain":"perf","topic":"AWS Transit Gateway hub-and-spoke","q":"A Pharmaceuticals company is looking for a simple solution to connect its VPCs and on-premises networks through a central hub.\nAs a Solutions Architect, which of the following would you suggest as the solution that requires the LEAST operational overhead?","opts":["Use AWS Transit Gateway to connect the Amazon VPCs to the on-premises networks","Use Transit VPC Solution to connect the Amazon VPCs to the on-premises networks","Partially meshed VPC peering can be used to connect the Amazon VPCs to the on-premises networks","Fully meshed VPC peering can be used to connect the Amazon VPCs to the on-premises networks"],"ans":[0],"you1":[0],"notes":["Transit Gateway là hub quản lý hoàn toàn bởi AWS, chỉ cần 1 kết nối mỗi VPC/on-prem tới hub — ít vận hành nhất.","Transit VPC đòi hỏi tự dựng và quản lý EC2 appliance làm hub — nhiều vận hành hơn Transit Gateway managed.","VPC Peering không kết nối được on-premises, và peering từng phần vẫn thiếu kết nối đầy đủ.","VPC Peering không hỗ trợ on-premises; peering đầy đủ (full mesh) còn tốn nhiều kết nối quản lý hơn (C(n,2))."],"pattern":"Chọn mô hình hub-and-spoke ít vận hành nhất cho nhiều VPC + on-prem","why":"Transit Gateway là dịch vụ managed, chỉ cần 1 attachment cho mỗi VPC/on-prem, không cần tự quản lý appliance như Transit VPC.","trap":"Transit VPC nghe giống Transit Gateway về tên gọi nhưng là giải pháp CŨ dựa trên EC2 appliance tự quản lý — tốn vận hành hơn nhiều.","tip":"Transit Gateway (managed, AWS vận hành) luôn ưu tiên hơn Transit VPC (tự quản EC2 appliance) khi tiêu chí là ít vận hành nhất."},{"id":24,"domain":"res","topic":"ECS/EKS with Fargate for serverless container orchestration","multi":true,"q":"An IT company has a large number of clients opting to build their application programming interface (API) using Docker containers. To facilitate the hosting of these containers, the company is looking at various orchestration services available with AWS.\nAs a Solutions Architect, which of the following solutions will you suggest? (Select two)","opts":["Use Amazon Elastic Container Service (Amazon ECS) with Amazon EC2 for serverless orchestration of the containerized services","Use Amazon SageMaker for serverless orchestration of the containerized services","Use Amazon EMR for serverless orchestration of the containerized services","Use Amazon Elastic Container Service (Amazon ECS) with AWS Fargate for serverless orchestration of the containerized services","Use Amazon Elastic Kubernetes Service (Amazon EKS) with AWS Fargate for serverless orchestration of the containerized services"],"ans":[3,4],"you1":[1,3],"notes":["ECS với EC2 vẫn phải tự quản lý instance — không phải serverless.","SageMaker là dịch vụ machine learning, hoàn toàn không phải orchestration cho container API.","EMR là dịch vụ xử lý Big Data (Hadoop/Spark), không phải trình điều phối container.","Đúng: ECS + Fargate là orchestration serverless, không cần quản lý EC2 bên dưới.","Đúng: EKS + Fargate cũng serverless hoá việc chạy Pod mà không cần quản lý node EC2."],"pattern":"Nhận diện đúng DANH MỤC dịch vụ (container orchestration) trước khi chọn tính serverless hay không","why":"Chỉ ECS và EKS là dịch vụ orchestration container; kết hợp với Fargate thì cả hai đều trở thành serverless, không cần quản lý EC2.","trap":"SageMaker và EMR là các dịch vụ AWS phổ biến nhưng hoàn toàn SAI DANH MỤC (ML và Big Data), không phải orchestration container — một dạng bẫy chọn sai nhóm dịch vụ.","tip":"Khi đề hỏi về orchestration container, chỉ xét ECS/EKS; muốn 'serverless' thì luôn đi kèm Fargate (không phải EC2 launch type)."},{"id":25,"domain":"res","topic":"ALB host-based routing wildcard rule","q":"A development team has configured Elastic Load Balancing for host-based routing. The idea is to support multiple subdomains and different top-level domains.\nThe rule *.example.com matches which of the following?","opts":["example.test.com","test.example.com","EXAMPLE.COM","example.com"],"ans":[1],"you1":[1],"notes":["example.test.com không khớp pattern *.example.com (phần cuối khác example.com).","Đúng: test.example.com có dạng <bất kỳ>.example.com, khớp đúng pattern wildcard.","EXAMPLE.COM không có phần subdomain đứng trước, không khớp pattern *.example.com.","example.com (không có subdomain) không khớp pattern *.example.com — dấu * yêu cầu có ít nhất 1 ký tự trước dấu chấm."],"pattern":"Hiểu đúng cú pháp wildcard host-based routing của ALB","why":"Dấu * trong *.example.com khớp với bất kỳ chuỗi ký tự nào đứng trước '.example.com', nên chỉ test.example.com thoả điều kiện.","trap":"example.com (không có subdomain) rất dễ bị nhầm là khớp, nhưng rule *.example.com yêu cầu PHẢI CÓ phần đứng trước dấu chấm.","tip":"Rule *.example.com chỉ khớp SUBDOMAIN (có ký tự trước .example.com), không khớp chính domain gốc example.com."},{"id":26,"domain":"perf","topic":"EC2 Cluster Placement Group for HPC","q":"An IT company runs a high-performance computing (HPC) workload on AWS. The workload requires high network throughput and low-latency network performance along with tightly coupled node-to-node communications. The Amazon EC2 instances are properly sized for compute and storage capacity and are launched using default options.\nWhich of the following solutions can be used to improve the performance of the workload?","opts":["Select a cluster placement group while launching Amazon EC2 instances","Select an Elastic Inference accelerator while launching Amazon EC2 instances","Select the appropriate capacity reservation while launching Amazon EC2 instances","Select dedicated instance tenancy while launching Amazon EC2 instances"],"ans":[0],"you1":[0],"notes":["Đúng: Cluster placement group đặt các instance gần nhau trong cùng AZ, đạt throughput cao và độ trễ thấp cho giao tiếp node-to-node.","Elastic Inference tăng tốc suy luận deep learning bằng GPU, không liên quan tới network throughput của HPC.","Capacity Reservation chỉ đảm bảo CÓ capacity sẵn sàng, không cải thiện hiệu năng mạng.","Dedicated tenancy chỉ cô lập phần cứng cho compliance, không cải thiện network performance."],"pattern":"Cải thiện network performance cho workload HPC tightly-coupled","why":"Cluster placement group gom các instance vào cùng phân đoạn mạng băng thông cao trong 1 AZ — đúng nhu cầu throughput cao, latency thấp của HPC.","trap":"Capacity Reservation và Dedicated Tenancy đều liên quan tới 'cấu hình lúc launch EC2' nhưng hoàn toàn không ảnh hưởng tới hiệu năng mạng.","tip":"Workload cần network throughput cao + latency thấp giữa các node → Cluster Placement Group (khác Spread: chống correlated failure; khác Partition: cho hệ phân tán lớn)."},{"id":27,"domain":"res","topic":"RDS Read Replicas for read scaling","q":"A company has developed a popular photo-sharing website using a serverless pattern on the AWS Cloud using Amazon API Gateway and AWS Lambda. The backend uses an Amazon RDS PostgreSQL database. The website is experiencing high read traffic and the AWS Lambda functions are putting an increased read load on the Amazon RDS database.\nThe architecture team is planning to increase the read throughput of the database, without changing the application's core logic. As a Solutions Architect, what do you recommend?","opts":["Use Amazon DynamoDB","Use Amazon RDS Multi-AZ feature","Use Amazon RDS Read Replicas","Use Amazon ElastiCache"],"ans":[2],"you1":[2],"notes":["Chuyển sang DynamoDB đòi hỏi viết lại toàn bộ tầng dữ liệu — vi phạm yêu cầu 'không đổi logic ứng dụng'.","Multi-AZ phục vụ high availability/failover, standby không phục vụ đọc trực tiếp — không tăng read throughput.","Đúng: Read Replica tăng read throughput ngay, hầu như không cần sửa logic ứng dụng (chỉ trỏ bớt truy vấn đọc sang endpoint replica).","ElastiCache cần thêm logic cache ở tầng ứng dụng — tức là phải sửa 'core logic' mà đề yêu cầu giữ nguyên."],"pattern":"Tăng read throughput mà không đổi logic ứng dụng hiện có","why":"Read Replica là tính năng có sẵn của RDS, chỉ cần trỏ bớt truy vấn đọc sang replica, không đòi hỏi viết lại logic nghiệp vụ.","trap":"ElastiCache và DynamoDB đều giải quyết được vấn đề đọc nhiều, nhưng cả hai đều yêu cầu SỬA LOGIC ứng dụng — vi phạm điều kiện ràng buộc của đề.","tip":"Tăng read throughput mà 'không đổi core logic' → luôn nghĩ Read Replica trước; cache (ElastiCache/DAX) đòi hỏi refactor application logic nhiều hơn."},{"id":28,"domain":"perf","topic":"ElastiCache Redis geospatial caching layer","q":"A ride-hailing startup has launched a mobile app that matches passengers with nearby drivers based on real-time GPS coordinates. The application backend uses an Amazon RDS for PostgreSQL instance with read replicas to store the latitude and longitude of drivers and passengers. As the service scales, the backend experiences performance bottlenecks during peak hours, especially when thousands of updates and reads occur per second to keep location data current. The company expects its user base to double in the next few months and needs a high-performance, scalable solution that can handle frequent write and read operations with minimal latency.\nWhat do you recommend?","opts":["Migrate the location data to Amazon OpenSearch Service and use its geospatial indexing features to retrieve and store coordinates in near real-time. Visualize tracking data using OpenSearch Dashboards","Place an Amazon ElastiCache for Redis cluster in front of the PostgreSQL database. Modify the application to cache recent location reads and updates in Redis, using a TTL-based eviction strategy","Create a read-replica Auto Scaling policy for the PostgreSQL database to dynamically add replicas during peak load. Distribute traffic evenly using an RDS proxy with failover configuration","Enable Multi-AZ deployment for the primary RDS instance to improve write resilience and fault tolerance. Use Multi-AZ standby failover to distribute reads during peak hours"],"ans":[1],"you1":[1],"notes":["OpenSearch có geospatial query nhưng không tối ưu cho ghi/đọc tần suất cực cao theo kiểu transactional, dễ giảm hiệu năng cluster.","Đúng: Redis có sẵn lệnh geospatial (GEOADD, GEORADIUS...), độ trễ dưới mili-giây, TTL tự dọn dữ liệu cũ — khớp hoàn hảo use-case.","Thêm Read Replica tự động/RDS proxy chỉ giúp phần đọc, không giảm được áp lực GHI liên tục — vốn là nút thắt chính.","Multi-AZ cải thiện khả năng chịu lỗi, KHÔNG cải thiện hiệu năng/độ trễ đọc-ghi theo thời gian thực."],"pattern":"Giảm tải read/write tần suất cao cho dữ liệu có tính 'ngắn hạn' (vị trí GPS luôn đổi)","why":"Redis xử lý geospatial native, tốc độ dưới mili-giây, và TTL phù hợp bản chất dữ liệu vị trí liên tục đổi mới, giảm tải trực tiếp lên RDS.","trap":"Read Replica Auto Scaling nghe như giải pháp scale đúng hướng nhưng chỉ xử lý phần ĐỌC, bỏ qua áp lực GHI liên tục mới là nút thắt chính của bài toán.","tip":"Dữ liệu cập nhật cực nhanh, có thể hết hạn (TTL), cần cả đọc lẫn ghi độ trễ thấp → ElastiCache Redis (có geospatial), không phải OpenSearch hay thêm Read Replica."},{"id":29,"domain":"cost","topic":"ElastiCache in front of Aurora for repeated reads","q":"A transportation logistics company runs a shipment tracking application on Amazon EC2 instances with an Amazon Aurora MySQL database cluster. The application is experiencing rapid growth due to increased demand from mobile app users querying package delivery statuses. Although the compute layer (EC2) has remained stable, the Aurora DB cluster is under growing read pressure, especially from frequent repeated queries about package locations and delivery history. The company added an Aurora read replica, which temporarily alleviated the load, but read traffic continues to spike as user queries grow. The company wants to reduce the repeated reads pressure on the DB cluster.\nWhich solution will best meet these requirements in a cost-effective manner?","opts":["Enable Aurora Serverless v2 for the DB cluster to automatically scale read and write capacity in response to usage spikes. Route all traffic through the cluster endpoint","Add another Aurora read replica to distribute the increasing read load across more read nodes. Adjust the application to perform client-side load balancing across the read replicas","Integrate Amazon ElastiCache for Redis between the application and Aurora. Cache frequently accessed query results in Redis to reduce the number of identical read requests hitting the database","Convert the Aurora MySQL DB cluster into a multi-writer setup using Aurora global database. Allow concurrent writes from multiple application nodes across Regions"],"ans":[2],"you1":[2],"notes":["Aurora Serverless v2 tối ưu cho tải biến động thất thường, không phải cho tải đọc lặp lại cao liên tục — không giải quyết đúng gốc rễ.","Thêm Read Replica tốn thêm chi phí liên tục, và các truy vấn GIỐNG HỆT NHAU vẫn lặp lại hit vào DB mỗi lần.","Đúng: cache kết quả truy vấn lặp lại trong Redis giảm trực tiếp số lần hit DB, rẻ hơn nhiều so với mở thêm replica.","Multi-writer/global database giải quyết bài toán GHI đa Region, hoàn toàn sai hướng so với vấn đề ĐỌC lặp lại của đề."],"pattern":"Giảm chi phí cho tải đọc LẶP LẠI (idempotent reads) bằng cache thay vì mở rộng hạ tầng DB","why":"Redis cache kết quả truy vấn hay lặp lại, giảm trực tiếp lượng request chạm tới Aurora, rẻ hơn và hiệu quả hơn thêm Read Replica.","trap":"Thêm Read Replica 'nghe hợp lý' để chia tải đọc nhưng không giải quyết gốc rễ: truy vấn GIỐNG NHAU vẫn lặp đi lặp lại chạm DB, gây lãng phí chi phí.","tip":"Khi bài toán là truy vấn LẶP LẠI giống hệt nhau (không phải lượng truy vấn khác nhau tăng tuyến tính) → ưu tiên cache (ElastiCache) trước khi nghĩ tới thêm Read Replica."},{"id":30,"domain":"res","topic":"DynamoDB for low-latency serverless NoSQL","q":"A ride-sharing company wants to improve the ride-tracking system that stores GPS coordinates for all rides. The engineering team at the company is looking for a NoSQL database that has single-digit millisecond latency, can scale horizontally, and is serverless, so that they can perform high-frequency lookups reliably.\nAs a Solutions Architect, which database do you recommend for their requirements?","opts":["Amazon Relational Database Service (Amazon RDS)","Amazon ElastiCache","Amazon DynamoDB","Amazon Neptune"],"ans":[2],"you1":[2],"notes":["RDS là relational database, không phải NoSQL, và không đạt độ trễ mili-giây đơn vị như yêu cầu.","ElastiCache là cache, không nên dùng làm database chính lưu trữ dữ liệu lâu dài.","Đúng: DynamoDB là NoSQL serverless, scale ngang, độ trễ mili-giây đơn vị — khớp hoàn toàn yêu cầu.","Neptune là graph database, chuyên cho dữ liệu có quan hệ phức tạp, không phải cho lookup đơn giản theo khoá."],"pattern":"Chọn NoSQL serverless, độ trễ thấp, scale ngang cho use-case lookup tần suất cao","why":"DynamoDB là database NoSQL hoàn toàn serverless, đạt độ trễ mili-giây đơn vị và scale ngang tự động — đúng mọi tiêu chí đề bài.","trap":"ElastiCache nghe 'nhanh nhất' về độ trễ nhưng về bản chất là cache tạm thời, không phải nơi lưu trữ chính (primary database) đáng tin cậy.","tip":"NoSQL + serverless + millisecond latency + scale ngang → DynamoDB là đáp án mặc định; ElastiCache chỉ là tầng cache, không thay thế database chính."},{"id":31,"domain":"res","topic":"ASG default termination policy","q":"As a solutions architect, you have created a solution that utilizes an Application Load Balancer with stickiness and an Auto Scaling Group (ASG). The Auto Scaling Group spans across 2 Availability Zones (AZs). AZ-A has 3 Amazon EC2 instances and AZ-B has 4 Amazon EC2 instances. The Auto Scaling Group is about to go into a scale-in event due to the triggering of a Amazon CloudWatch alarm.\nWhat will happen under the default Auto Scaling Group configuration?","opts":["A random instance will be terminated in AZ-B","A random instance in the AZ-A will be terminated","The instance with the oldest launch template or launch configuration will be terminated in AZ-B","An instance in the AZ-A will be created"],"ans":[2],"you1":[2],"notes":["Default policy không chọn ngẫu nhiên — có quy tắc rõ ràng ưu tiên cân bằng AZ trước.","AZ-A đang có ÍT instance hơn (3<4) nên không phải AZ bị chọn để terminate.","Đúng: AZ-B nhiều instance hơn nên được cân bằng trước; trong AZ-B, instance có launch template/config CŨ NHẤT bị chọn terminate.","Scale-in nghĩa là GIẢM instance, không phải tạo thêm — phương án này ngược hướng hoàn toàn với scale-in."],"pattern":"Hiểu đúng thứ tự ưu tiên của default termination policy khi scale-in","why":"Default policy ưu tiên cân bằng AZ trước (chọn AZ có nhiều instance hơn), sau đó mới xét tới instance dùng launch template/config cũ nhất trong AZ đó.","trap":"Các phương án 'ngẫu nhiên' nghe như cách AWS vận hành đơn giản, nhưng default termination policy thực chất có thứ tự ưu tiên rõ ràng, không hề random.","tip":"Default termination policy: (1) cân bằng AZ trước, (2) trong AZ đó chọn instance dùng launch template/config CŨ NHẤT, (3) cuối cùng mới xét tới instance gần billing hour nhất."},{"id":32,"domain":"res","topic":"S3 cross-Region one-time copy (sync + batch replication)","multi":true,"q":"An e-commerce company has copied 1 petabyte of data from its on-premises data center to an Amazon S3 bucket in the us-west-1 Region using an AWS Direct Connect link. The company now wants to set up a one-time copy of the data to another Amazon S3 bucket in the us-east-1 Region. The on-premises data center does not allow the use of AWS Snowball.\nAs a Solutions Architect, which of the following options can be used to accomplish this goal? (Select two)","opts":["Use AWS Snowball Edge device to copy the data from one Region to another Region","Set up Amazon S3 batch replication to copy objects across Amazon S3 buckets in another Region using S3 console and then delete the replication configuration","Copy data from the source bucket to the destination bucket using the aws S3 sync command","Set up Amazon S3 Transfer Acceleration (Amazon S3TA) to copy objects across Amazon S3 buckets in different Regions using S3 console","Copy data from the source Amazon S3 bucket to a target Amazon S3 bucket using the S3 console"],"ans":[1,2],"you1":[1,3],"notes":["Snowball Edge dùng để chuyển dữ liệu on-prem↔AWS, không dùng để copy giữa 2 Region (và đề cũng cấm dùng Snowball).","Đúng: S3 Batch Replication xử lý được việc copy object ĐÃ TỒN TẠI từ trước sang Region khác, sau đó có thể xoá cấu hình vì chỉ cần 1 lần.","Đúng: lệnh aws s3 sync dùng CopyObject API để đồng bộ 1 lần giữa 2 bucket, phù hợp cho nhu cầu copy một lần.","S3 Transfer Acceleration không dùng để copy object GIỮA 2 bucket qua console — nó chỉ tăng tốc transfer từ client vào 1 bucket.","Copy/paste thủ công qua S3 console không khả thi với khối lượng 1 petabyte dữ liệu."],"pattern":"Copy dữ liệu khổng lồ (PB) một lần giữa 2 Region mà không dùng thiết bị vật lý","why":"S3 Batch Replication (cho object cũ đã tồn tại) và aws s3 sync (copy một lần qua API) đều giải quyết đúng use-case 'copy một lần' quy mô lớn mà không cần Snowball.","trap":"S3 Transfer Acceleration hay bị nhầm là công cụ 'copy nhanh giữa 2 bucket' nhưng thực chất nó chỉ tăng tốc đường truyền từ client TỚI 1 bucket, không phải cơ chế bucket-to-bucket.","tip":"Copy object CŨ đã tồn tại sang bucket khác Region, một lần → S3 Batch Replication hoặc aws s3 sync; Transfer Acceleration chỉ tăng tốc upload từ client vào S3."},{"id":33,"domain":"res","topic":"Amazon EventBridge for SaaS decoupling","q":"A CRM company has a software as a service (SaaS) application that feeds updates to other in-house and third-party applications. The SaaS application and the in-house applications are being migrated to use AWS services for this inter-application communication.\nAs a Solutions Architect, which of the following would you suggest to asynchronously decouple the architecture?","opts":["Use Amazon Simple Queue Service (Amazon SQS) to decouple the architecture","Use Amazon EventBridge to decouple the system architecture","Use Elastic Load Balancing (ELB) for effective decoupling of system architecture","Use Amazon Simple Notification Service (Amazon SNS) to communicate between systems and decouple the architecture"],"ans":[1],"you1":[3],"notes":["SQS là hàng đợi tốt để decouple nhưng không tích hợp trực tiếp với ứng dụng SaaS bên thứ ba.","Đúng: EventBridge là dịch vụ event-driven DUY NHẤT tích hợp sẵn trực tiếp với SaaS partner bên thứ ba.","ELB cân bằng tải đồng bộ (synchronous), hoàn toàn không phải cơ chế decouple bất đồng bộ.","SNS hỗ trợ pub/sub tốt nhưng KHÔNG hỗ trợ tích hợp trực tiếp với ứng dụng SaaS bên thứ ba như EventBridge."],"pattern":"Decouple hệ thống có liên quan tới SaaS bên thứ ba (không chỉ nội bộ AWS)","why":"EventBridge là dịch vụ duy nhất có khả năng tích hợp sẵn (native) với các nhà cung cấp SaaS bên thứ ba, đúng yêu cầu đề bài.","trap":"SNS rất dễ bị chọn nhầm vì cũng là dịch vụ pub/sub decouple, nhưng thiếu đúng 1 khả năng quan trọng: tích hợp trực tiếp với SaaS bên thứ ba.","tip":"Decouple với dịch vụ AWS/nội bộ thuần tuý → SNS/SQS. Decouple có liên quan SaaS bên thứ ba → luôn chọn Amazon EventBridge."},{"id":34,"domain":"cost","topic":"AWS Cost Optimization Hub + Compute Optimizer","q":"A startup's cloud infrastructure consists of a few Amazon EC2 instances, Amazon RDS instances and Amazon S3 storage. A year into their business operations, the startup is incurring costs that seem too high for their business requirements.\nWhich of the following options represents a valid cost-optimization solution?","opts":["Use AWS Compute Optimizer recommendations to help you choose the optimal Amazon EC2 purchasing options and help reserve your instance capacities at reduced costs","Use AWS Cost Optimization Hub to get a report of Amazon EC2 instances that are either idle or have low utilization and use AWS Compute Optimizer to look at instance type recommendations","Use AWS Trusted Advisor checks on Amazon EC2 Reserved Instances to automatically renew reserved instances (RI). AWS Trusted advisor also suggests Amazon RDS idle database instances","Use Amazon S3 Storage class analysis to get recommendations for transitions of objects to Amazon S3 Glacier storage classes to reduce storage costs. You can also automate moving these objects into lower-cost storage tier using Lifecycle Policies"],"ans":[1],"you1":[1],"notes":["Compute Optimizer không đưa ra khuyến nghị về PURCHASING OPTIONS (RI/Savings Plans) — nó chỉ gợi ý instance TYPE phù hợp.","Đúng: Cost Optimization Hub tổng hợp resource nhàn rỗi/kém hiệu quả trên nhiều tài khoản, kết hợp Compute Optimizer để xem gợi ý loại instance.","Trusted Advisor KHÔNG tự động renew Reserved Instances — đây là tính năng không tồn tại; RI hết hạn vẫn chạy nhưng tính giá On-Demand.","S3 Storage Class Analysis chỉ khuyến nghị chuyển sang STANDARD_IA, KHÔNG đưa khuyến nghị cho Glacier/One Zone-IA."],"pattern":"Dùng đúng công cụ phân tích/khuyến nghị chi phí AWS, tránh gán nhầm tính năng không có","why":"Cost Optimization Hub tổng hợp resource nhàn rỗi trên nhiều account/Region, kết hợp Compute Optimizer cho khuyến nghị instance type — đúng và đủ phạm vi công cụ hỗ trợ.","trap":"Hai phương án sai đều GÁN THÊM khả năng không có thật cho dịch vụ quen thuộc (Compute Optimizer gợi ý purchasing option, Trusted Advisor tự renew RI, Storage Class Analysis gợi ý Glacier).","tip":"Compute Optimizer = gợi ý RIGHT-SIZE instance type (không phải purchasing option). Storage Class Analysis = chỉ gợi ý STANDARD_IA (không phải Glacier). Trusted Advisor không tự renew RI."},{"id":35,"domain":"sec","topic":"Security Group reference ALB to EC2","q":"A developer in your company has set up a classic 2 tier architecture consisting of an Application Load Balancer and an Auto Scaling group (ASG) managing a fleet of Amazon EC2 instances. The Application Load Balancer is deployed in a subnet of size 10.0.1.0/24 and the Auto Scaling group is deployed in a subnet of size 10.0.4.0/22.\nAs a solutions architect, you would like to adhere to the security pillar of the well-architected framework. How do you configure the security group of the Amazon EC2 instances to only allow traffic coming from the Application Load Balancer?","opts":["Add a rule to authorize the security group of the Auto Scaling group","Add a rule to authorize the CIDR 10.0.4.0/22","Add a rule to authorize the CIDR 10.0.1.0/24","Add a rule to authorize the security group of the Application Load Balancer"],"ans":[3],"you1":[0],"notes":["Sai chiều tham chiếu: tự cho phép SG của chính ASG (nguồn traffic phải là ALB, không phải chính các EC2 trong ASG).","CIDR của chính subnet ASG không giới hạn được nguồn traffic chỉ từ ALB — EC2 nào trong subnet đó cũng được phép, kể cả không qua ALB.","CIDR của subnet ALB vẫn rộng hơn mức cần thiết — chỉ nên giới hạn bằng SG cụ thể, không phải cả dải subnet.","Đúng: dùng Security Group tham chiếu lẫn nhau (SG của ALB) làm nguồn cho phép trên SG của EC2 — chính xác và linh hoạt theo best-practice."],"pattern":"Dùng Security Group tham chiếu (SG-to-SG reference) thay vì CIDR cố định","why":"Theo best-practice Well-Architected, nên cho phép traffic dựa trên SG của nguồn (ALB) thay vì CIDR tĩnh — tự động áp dụng cho mọi IP của ALB kể cả khi scale.","trap":"Chọn nhầm SG của chính Auto Scaling Group (đối tượng cần được bảo vệ) thay vì SG của ALB (nguồn traffic hợp lệ) — đảo ngược vai trò nguồn/đích.","tip":"Muốn EC2 chỉ nhận traffic từ ALB → luôn referense SG của ALB trong rule inbound của SG gắn với EC2, không dùng CIDR subnet (quá rộng, không linh hoạt khi scale)."},{"id":36,"domain":"cost","topic":"S3 Lifecycle Policy with prefix","multi":true,"q":"You have an Amazon S3 bucket that contains files in two different folders - s3://my-bucket/images and s3://my-bucket/thumbnails. When an image is first uploaded and new, it is viewed several times. But after 45 days, analytics prove that image files are on average rarely requested, but the thumbnails still are. After 180 days, you would like to archive the image files and the thumbnails. Overall you would like the solution to remain highly available to prevent disasters happening against a whole Availability Zone (AZ).\nHow can you implement an efficient cost strategy for your Amazon S3 bucket? (Select two)","opts":["Create a Lifecycle Policy to transition objects to Amazon S3 Standard IA using a prefix after 45 days","Create a Lifecycle Policy to transition objects to Amazon S3 One Zone IA using a prefix after 45 days","Create a Lifecycle Policy to transition all objects to Amazon S3 Standard IA after 45 days","Create a Lifecycle Policy to transition objects to Amazon S3 Glacier using a prefix after 180 days","Create a Lifecycle Policy to transition all objects to Amazon S3 Glacier after 180 days"],"ans":[0,4],"you1":[0,4],"notes":["Đúng: dùng prefix (s3://my-bucket/images) để CHỈ chuyển ảnh (không phải thumbnail vẫn còn được truy cập) sang Standard-IA sau 45 ngày.","One Zone-IA chỉ lưu ở 1 AZ — vi phạm yêu cầu 'highly available, chịu được mất cả 1 AZ'.","Chuyển TẤT CẢ object (gồm cả thumbnail vẫn đang được truy cập thường xuyên) sang IA là sai — vi phạm dữ liệu đề bài.","Glacier không cần prefix ở bước 180 ngày vì CẢ 2 loại file (ảnh và thumbnail) đều đã đến lúc archive như nhau.","Đúng: sau 180 ngày, mọi object (ảnh và thumbnail) đều cần archive, nên áp dụng cho TOÀN BỘ bucket không cần prefix."],"pattern":"Áp Lifecycle Policy có chọn lọc theo prefix khi 2 loại dữ liệu có hành vi truy cập khác nhau","why":"Ảnh và thumbnail có tốc độ 'nguội' khác nhau ở mốc 45 ngày nên cần prefix để chỉ áp dụng cho ảnh; tới mốc 180 ngày cả 2 đều nguội như nhau nên không cần phân biệt prefix nữa.","trap":"One Zone-IA là bẫy cổ điển: rẻ hơn Standard-IA nhưng chỉ lưu 1 AZ, vi phạm thẳng yêu cầu 'chịu được mất 1 AZ' mà đề đã nêu rõ.","tip":"Khi 2 nhóm dữ liệu trong cùng bucket có pattern truy cập khác nhau → dùng PREFIX trong Lifecycle Policy để áp rule riêng cho từng nhóm, không áp dụng chung cho cả bucket."},{"id":37,"domain":"perf","topic":"Route 53 Geoproximity routing with bias","q":"A social media company wants the capability to dynamically alter the size of a geographic area from which traffic is routed to a specific server resource.\nWhich feature of Amazon Route 53 can help achieve this functionality?","opts":["Latency-based routing","Geoproximity routing","Weighted routing","Geolocation routing"],"ans":[1],"you1":[3],"notes":["Latency-based routing chọn theo độ trễ thấp nhất, không có khái niệm điều chỉnh 'kích thước vùng'.","Đúng: Geoproximity routing có tham số bias cho phép mở rộng/thu hẹp vùng địa lý route tới 1 resource.","Weighted routing định tuyến theo tỉ lệ phần trăm cố định, không liên quan tới vùng địa lý.","Geolocation routing định tuyến theo vị trí CỐ ĐỊNH của user, không có cơ chế 'bias' để thay đổi kích thước vùng."],"pattern":"Phân biệt Geolocation (cố định theo vị trí) với Geoproximity (có bias điều chỉnh vùng)","why":"Chỉ Geoproximity routing có tham số bias, cho phép mở rộng hoặc thu hẹp vùng địa lý route traffic tới một resource cụ thể.","trap":"Geolocation routing rất dễ nhầm với Geoproximity vì tên gần giống nhau, nhưng Geolocation không có cơ chế 'thay đổi kích thước vùng' linh hoạt như Geoproximity.","tip":"Geolocation = định tuyến CỨNG theo quốc gia/vùng user. Geoproximity = định tuyến theo khoảng cách + có thể 'nắn' vùng bằng bias — từ khoá 'dynamically alter size of geographic area' luôn trỏ tới Geoproximity."},{"id":38,"domain":"perf","topic":"DynamoDB DAX for hot partition","q":"A niche social media application allows users to connect with sports athletes. As a solutions architect, you've designed the architecture of the application to be fully serverless using Amazon API Gateway and AWS Lambda. The backend uses an Amazon DynamoDB table. Some of the star athletes using the application are highly popular, and therefore Amazon DynamoDB has increased the read capacity units (RCUs). Still, the application is experiencing a hot partition problem.\nWhat can you do to improve the performance of Amazon DynamoDB and eliminate the hot partition problem without a lot of application refactoring?","opts":["Use Amazon DynamoDB Global Tables","Use Amazon DynamoDB Streams","Use Amazon DynamoDB DAX","Use Amazon ElastiCache"],"ans":[2],"you1":[3],"notes":["Global Tables chỉ giải quyết replicate đa Region, không giải quyết hot partition (truy cập tập trung vào 1 khoá).","DynamoDB Streams chỉ ghi lại thay đổi dữ liệu, không liên quan tới việc giảm tải đọc trên 1 khoá nóng.","Đúng: DAX cache trong suốt (tra
