<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện đề SAA-C03</title>
<style>
:root{
  --bg:#f6f5f1;--surface:#ffffff;--surface2:#f0eee8;--text:#1d1c1a;--muted:#6b6862;--border:#dedbd3;
  --accent:#2f5d8a;--accent-soft:#e3ecf5;--ok:#2e7d4f;--ok-soft:#e2f2e8;--bad:#b3412f;--bad-soft:#f8e4df;--warn:#9a6a12;--warn-soft:#f6ecd6;
  --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header h1{font-size:1.45rem;margin:0 0 4px}
header p{margin:0;color:var(--muted);font-size:.92rem}
nav.tabs{display:flex;gap:6px;margin:18px 0 14px;flex-wrap:wrap}
nav.tabs button{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.92rem}
nav.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.controls label{font-size:.88rem;color:var(--muted);display:flex;gap:6px;align-items:center}
select,.btn{font:inherit;font-size:.9rem;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:7px 12px}
.btn{cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.progress>div{height:100%;background:var(--accent);width:0}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.85rem;color:var(--muted)}
.chip{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);margin-right:4px}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.qtext{font-size:1.05rem;margin:12px 0 4px;white-space:pre-line}
.hint{font-size:.85rem;color:var(--warn);margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:11px 12px;margin:8px 0;cursor:pointer;font:inherit}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:0 0 26px;height:26px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt .note{display:block;font-size:.85rem;color:var(--muted);margin-top:4px}
.code{display:block;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82rem;line-height:1.5;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:6px 0 2px}
.opt[disabled]{cursor:default}
.verdict{font-weight:700;margin:14px 0 8px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.explain{border-top:1px dashed var(--border);margin-top:10px;padding-top:10px}
.explain p{margin:6px 0}
.explain b{color:var(--accent)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.score div{background:var(--surface2);border-radius:10px;padding:10px;text-align:center}
.score b{display:block;font-size:1.4rem}
.score span{font-size:.78rem;color:var(--muted)}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.grid button{width:44px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:.82rem}
.grid button.cur{outline:2px solid var(--accent)}
.grid button.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.grid button.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
h2{font-size:1.15rem;margin:22px 0 10px}
h3{font-size:1rem;margin:20px 0 8px}
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:var(--surface2);font-weight:600}
tr:last-child td{border-bottom:none}
.search{width:100%;margin-bottom:6px}
ol.method li{margin:8px 0}
.hidden{display:none}
.result-list li{margin:4px 0}
.result-list a{color:var(--accent);cursor:pointer;text-decoration:underline}
@media (max-width:560px){.score{grid-template-columns:1fr 1fr 1fr}.opt{padding:10px}}
</style>
</head>

<script>
const DATA = {"questions":[{"id":1,"domain":"cost","topic":"AWS Budgets Actions","q":"An organization has rolled out a multi-account architecture using AWS Control Tower to isolate development environments. Each developer has their own dedicated AWS account to provision and test workloads. However, the company is concerned about unexpected spikes in resource usage and AWS spending from individual developer accounts. The leadership team wants to implement a cost control mechanism that can proactively enforce budget limits, ensure automatic responses to overspending, and require minimal ongoing administrative effort.\nWhat is the most efficient solution to meet this goal with the least operational overhead?","opts":["Use AWS Service Catalog to restrict developers to predefined resource templates with pricing limits. In each developer account, create a scheduled Lambda function that stops all running resources at the end of the day and and restart these resources at the start of next business day","Deploy an AWS Lambda function to run daily in each developer’s account. Use the function to analyze cost usage reports via the Cost Explorer API. If costs exceed a predefined threshold, the function invokes an AWS Config remediation rule","Use AWS Cost Explorer to enable detailed usage and cost reports for each developer account. Configure daily usage reports to be emailed to developers. Create dashboards for each developer in Cost Explorer, and require them to monitor their resource consumption and take action if they approach spending thresholds","Use AWS Budgets to define spending thresholds for each developer’s account. Configure budget alerts to notify developers when actual or forecasted usage exceeds the set limit. Attach Budgets actions to automatically apply a restrictive DenyAll IAM policy to the developer’s primary IAM role when the budget threshold is crossed"],"ans":[3],"notes":["Không theo dõi số tiền đã tiêu; tắt máy ban đêm không chặn được chi tiêu ban ngày; Lambda ở mỗi account.","Tự xây lại những gì Budgets đã có sẵn, overhead cao.","Giám sát thụ động, không có cơ chế tự chặn.","Ngưỡng + cảnh báo + tự động chặn, hoàn toàn native."],"pattern":"Chọn công cụ quản lý chi phí + least overhead","why":"Budgets đặt ngưỡng (actual/forecast), gửi cảnh báo, và Budgets Actions tự động gắn IAM policy/SCP hoặc dừng EC2/RDS.","trap":"Service Catalog chuẩn hóa 'cái gì được deploy', không kiểm soát 'tốn bao nhiêu tiền'.","tip":"Cost Explorer = xem/phân tích. Budgets = ngưỡng + cảnh báo. Budgets Actions = tự động hành động. Cost Anomaly Detection = phát hiện bất thường bằng ML.","old":25,"you1":[0],"you2":[3],"q_short":"Each developer has a dedicated AWS account under Control Tower. Leadership wants to proactively enforce budget limits with automatic responses to overspending and minimal admin effort. What is the most efficient solution?"},{"id":2,"domain":"perf","topic":"AWS Application Migration Service (MGN)","multi":true,"q":"A global logistics provider operates several legacy applications on virtual machines (VMs) within a private data center. Due to accelerated business growth and limited capacity in its existing infrastructure, the provider decides to migrate select applications to AWS. The company opts for a lift-and-shift strategy for its non-mission-critical systems to meet tight migration deadlines. The solution must support rapid migration without requiring extensive application refactoring.\nWhich combination of actions will best support this migration approach? (Select three)","opts":["Shut down the source virtual machines and immediately provision EC2 replacement instances using manual AMI creation","Use AWS CloudEndure Disaster Recovery to continuously replicate the VMs to AWS and then promote the target instances for production use","Perform the initial replication. Launch test instances in AWS to validate the migrated VMs before final cutover","Use AWS Application Migration Service (MGN). Install the AWS Replication Agent on the source VMs","Use Amazon EC2 Auto Scaling to automatically re-create the VMs in AWS by launching replacement instances with matching configurations","Launch a cutover instance after completing testing and confirming that replication is up-to-date"],"ans":[2,3,5],"notes":["Downtime, thủ công, rủi ro.","Công cụ DR (tên cũ, nay là AWS DRS), không phải migration; trùng chức năng với MGN.","Bước test trong workflow MGN.","Dịch vụ rehost chuẩn.","ASG không migrate VM.","Bước go-live cuối cùng."],"pattern":"Chọn các bước của một quy trình","why":"Workflow MGN: cài agent → replicate → test → cutover → finalize.","trap":"Tên CloudEndure là tên cũ; chọn thêm một công cụ replicate khác là trùng chức năng.","tip":"Rehost → MGN. DR → Elastic Disaster Recovery. DB → DMS (+SCT). File → DataSync. TB–PB, mạng chậm → Snowball.","old":44,"you1":[1,2,3],"you2":[2,3,5],"q_short":"A company lift-and-shifts legacy VMs to AWS quickly, without refactoring. Which THREE actions best support this?"},{"id":3,"domain":"res","topic":"HA multi-tier: ASG + ALB + RDS Multi-AZ","q":"A startup wants to create a highly available architecture for its multi-tier application. Currently, the startup manages a single Amazon EC2 instance along with a single Amazon RDS MySQL DB instance. The startup has hired you as an AWS Certified Solutions Architect - Associate to build a solution that meets these requirements while minimizing the underlying infrastructure maintenance effort.\nWhat will you recommend?","opts":["Create an Auto-Scaling group with a desired capacity of a total of two Amazon EC2 instances across two Availability Zones. Configure an Application Load Balancer having a target group of these Amazon EC2 instances. Set up Amazon RDS MySQL DB in a multi-AZ configuration","Create an Auto-Scaling group with a desired capacity of a total of two Amazon EC2 instances across two Availability Zones. Configure an Application Load Balancer having a target group of these Amazon EC2 instances. Set up a read replica of the Amazon RDS MySQL DB in another Availability Zone","Provision a second Amazon EC2 instance in another Availability Zone. Provision a second Amazon RDS MySQL DB in another Availabililty Zone. Leverage Amazon Route 53 for equal distribution of incoming traffic to the Amazon EC2 instances. Use a custom script to sync data across the two MySQL DBs","Create an Auto-Scaling group with a desired capacity of a total of two Amazon EC2 instances in a single Availability Zone. Configure an Application Load Balancer having a target group of these Amazon EC2 instances. Set up Amazon RDS MySQL DB in a multi-AZ configuration"],"ans":[0],"you2":[0],"notes":["HA cả 2 tầng: EC2 đa AZ + ALB, DB Multi-AZ tự failover.","Read replica dùng để scale đọc, không phải giải pháp HA (failover thủ công).","Tự đồng bộ DB bằng script, rất tốn công và rủi ro.","1 AZ chết thì cả tầng web chết."],"pattern":"Ghép 2 mảnh: tầng web + tầng DB","why":"HA tầng web = ASG đa AZ + ALB. HA tầng DB = RDS Multi-AZ.","trap":"Nhầm Read Replica là giải pháp HA.","tip":"HA = Multi-AZ. Scale đọc = Read Replica. 'Single AZ' trong đáp án → không HA.","old":null,"you1":null,"q_short":"A startup runs one EC2 instance and one RDS MySQL instance. It needs a highly available multi-tier architecture with minimal infrastructure maintenance. What do you recommend?"},{"id":4,"domain":"cost","topic":"Spot persistent request","q":"The development team at a company manages a Python based nightly process with a runtime of 30 minutes. The process can withstand any interruptions in its execution and start over again. The process currently runs on the on-premises infrastructure and it needs to be migrated to AWS.\nWhich of the following options do you recommend as the MOST cost-effective solution?","opts":["Run on a Spot Instance with a persistent request type","Run on an Application Load Balancer","Run on Amazon EMR","Run on AWS Lambda"],"ans":[0],"notes":["Rẻ nhất; persistent tự mở lại request khi bị thu hồi.","Load balancer không chạy code.","Big data cluster, quá nặng và đắt.","Quá 15 phút."],"pattern":"Chọn mô hình compute theo đặc điểm workload","why":"Chịu được gián đoạn + rẻ nhất → Spot; job lặp lại → persistent.","trap":"Quên giới hạn 15 phút của Lambda.","tip":"Spot có cảnh báo 2 phút. Hủy persistent request không tự terminate instance.","old":42,"you1":[0],"you2":[0],"q_short":"A nightly Python process runs for 30 minutes, can withstand interruptions and restart. It is migrating to AWS. What is MOST cost-effective?"},{"id":5,"domain":"sec","topic":"IAM Group","q":"A team has around 200 users, each of these having an IAM user account in AWS. Currently, they all have read access to an Amazon S3 bucket. The team wants 50 among them to have write and read access to the buckets.\nHow can you provide these users access in the least possible time, with minimal changes?","opts":["Create a group, attach the policy to the group and place the users in the group","Create a policy and assign it manually to the 50 users","Update the Amazon S3 bucket policy","Create an AWS Multi-Factor Authentication (AWS MFA) user with read / write access and link 50 IAM with AWS MFA"],"ans":[0],"you2":[0],"notes":["Quản lý quyền theo nhóm, dễ thêm/bớt người.","Chạy được nhưng thủ công, khó quản lý.","Bucket policy bị giới hạn 20 KB, không scale khi liệt kê nhiều user.","MFA là xác thực thêm, không cấp quyền."],"pattern":"Best practice IAM","why":"Nhiều user cùng quyền → IAM Group.","trap":"MFA không liên quan tới phân quyền.","tip":"Group không lồng nhau được và không phải principal trong policy. Quy mô lớn/nhiều account → IAM Identity Center.","old":null,"you1":null,"q_short":"A team has 200 IAM users, all with read access to an S3 bucket. 50 of them now need read and write access. How do you grant this quickly with minimal changes?"},{"id":6,"domain":"perf","topic":"HA bastion host: NLB","q":"The systems administrator at a company wants to set up a highly available architecture for a bastion host solution.\nAs a solutions architect, which of the following options would you recommend as the solution?","opts":["Create a VPC Endpoint for a fleet of Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group","Create a public Application Load Balancer that links to Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group","Create a public Network Load Balancer that links to Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group","Create an elastic IP address (EIP) and assign it to all Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group"],"ans":[2],"you2":[3],"notes":["VPC endpoint để truy cập dịch vụ AWS riêng tư, không đứng trước EC2.","ALB chỉ xử lý HTTP/HTTPS (L7); SSH là TCP cổng 22.","NLB xử lý TCP (L4), phân phối SSH tới nhiều bastion.","Một EIP chỉ gắn được vào MỘT instance tại một thời điểm."],"pattern":"Chọn load balancer theo giao thức","why":"SSH là TCP → cần load balancer L4 → NLB.","trap":"Nghĩ một EIP gắn được cho nhiều instance.","tip":"HTTP/HTTPS → ALB. TCP/UDP/TLS, IP tĩnh → NLB. Appliance bảo mật → GWLB. Thực tế hiện nay nên dùng Session Manager hoặc EC2 Instance Connect Endpoint thay cho bastion.","old":null,"you1":null,"q_short":"A sysadmin wants a highly available bastion host solution. What do you recommend?"},{"id":7,"domain":"res","topic":"Route 53 private hosted zone","multi":true,"q":"The engineering team at an e-commerce company wants to set up a custom domain for internal usage such as internaldomainexample.com. The team wants to use the private hosted zones feature of Amazon Route 53 to accomplish this.\nWhich of the following settings of the VPC need to be enabled? (Select two)","opts":["enableDnsDomain","enableDnsHostnames","enableDnsSupport","enableVpcSupport","enableVpcHostnames"],"ans":[1,2],"you2":[0,1],"notes":["Không tồn tại.","Đúng.","Đúng.","Không tồn tại.","Không tồn tại."],"pattern":"Recall tên thuộc tính","why":"Private hosted zone cần VPC bật enableDnsHostnames và enableDnsSupport.","trap":"Tên bịa nghe rất giống tên thật (enableDnsDomain).","tip":"Hai thuộc tính DNS của VPC đều bắt đầu bằng 'enableDns': Support (dùng Route 53 Resolver) và Hostnames (gán DNS hostname cho instance).","old":null,"you1":null,"q_short":"A team wants an internal custom domain using Route 53 private hosted zones. Which TWO VPC settings must be enabled?"},{"id":8,"domain":"perf","topic":"CloudFront + S3 Transfer Acceleration","q":"A global photography startup hosts a static image-sharing site on an Amazon S3 bucket. The website allows users from different parts of the world to upload, view, and download photos through their mobile devices. As the platform has gained popularity, users have started experiencing latency issues, especially when uploading and downloading images. The team needs a solution to enhance global performance but wants to implement it with minimal development effort and without redesigning the application.\nWhich solution will most effectively address the performance issues with the least operational overhead?","opts":["Create multiple S3 buckets in different Regions and replicate image data based on user location. Configure CloudFront to upload and download from the nearest bucket","Migrate the website from S3 to Amazon EC2 instances in multiple Regions. Use an Application Load Balancer with AWS Global Accelerator to distribute global traffic and reduce latency","Deploy an Amazon CloudFront distribution with the S3 bucket as the origin to improve download speeds. Enable S3 Transfer Acceleration to reduce upload latency for global users","Enable AWS Global Accelerator on the S3 bucket to accelerate both uploads and downloads. Reconfigure the website to route requests through the accelerator"],"ans":[2],"you2":[2],"notes":["Phức tạp: replication, logic chọn bucket.","Thiết kế lại toàn bộ, trái 'minimal effort'.","CloudFront tăng tốc tải xuống, Transfer Acceleration tăng tốc tải lên; đều bật dễ dàng.","Global Accelerator không nhận S3 làm endpoint trực tiếp."],"pattern":"Tách 2 chiều: download và upload","why":"Download → CloudFront. Upload xa → S3 Transfer Acceleration.","trap":"Global Accelerator nghe hợp lý nhưng không hỗ trợ S3.","tip":"GA endpoint: ALB, NLB, EC2, Elastic IP. Upload file lớn → kết hợp Multipart Upload.","old":null,"you1":null,"q_short":"A static photo-sharing site on S3 has global users who see high latency on uploads and downloads. They want better global performance with minimal effort and no redesign. Best solution?"},{"id":9,"domain":"cost","topic":"S3 Lifecycle → Standard-IA","q":"A research firm archives experimental datasets generated by automated laboratory equipment. Each dataset is about 10 MB in size and is initially accessed frequently for analysis within the first month. After this period, the access rate drops significantly, but the data must remain immediately retrievable if needed. Due to compliance policies, each dataset must be retained in AWS storage for exactly 4 years before deletion. The firm currently stores the data in Amazon S3 Standard storage and wants to minimize costs without compromising data availability or retrieval speed.\nWhich solution meets these requirements most cost-effectively?","opts":["Set up an S3 Lifecycle configuration to transfer all datasets to S3 One Zone-Infrequent Access (S3 One Zone-IA) after 30 days, and permanently delete them 4 years after creation","Define an S3 Lifecycle policy that transitions datasets to S3 Glacier Instant Retrieval 30 days after creation and schedules the deletion of each object exactly 4 years after its creation","Configure an S3 Lifecycle policy to migrate datasets to S3 Glacier Flexible Retrieval after 30 days and delete them automatically 4 years after creation","Define an S3 Lifecycle policy that transitions datasets to S3 Standard-Infrequent Access (S3 Standard-IA) 30 days after creation and schedules the deletion of each object exactly 4 years after its creation"],"ans":[3],"notes":["Chỉ 1 AZ, rủi ro với dữ liệu không tạo lại được.","Truy xuất tức thì, lưu rẻ hơn nhưng phí retrieval cao; đề chọn IA vì dữ liệu vẫn được truy cập thỉnh thoảng (đáp án gây tranh cãi).","Truy xuất phút → giờ, vi phạm 'immediately'.","Tức thì, đa AZ, phí retrieval thấp."],"pattern":"Chọn storage class theo vòng đời","why":"Lọc tốc độ (loại Glacier Flexible) → lọc độ bền (loại One Zone-IA) → so chi phí theo tần suất.","trap":"Glacier IR vs Standard-IA phụ thuộc tần suất truy cập; đề không nói rõ.","tip":"~1 lần/tháng → Standard-IA. ~1 lần/quý → Glacier IR. Thời gian tối thiểu: IA 30 ngày, Glacier IR/Flexible 90 ngày, Deep Archive 180 ngày.","old":63,"you1":[3],"you2":[3],"q_short":"10 MB datasets are accessed frequently in the first month, then rarely, but must remain immediately retrievable and be kept exactly 4 years. They are in S3 Standard. What is most cost-effective?"},{"id":10,"domain":"cost","topic":"Redshift cold data → S3 + Athena","multi":true,"q":"Your company has created a data warehouse using Amazon Redshift that is used to analyze data from Amazon S3. From the usage pattern, you have detected that after 30 days, the data is rarely queried in Amazon Redshift and it's not \"hot data\" anymore. You would like to preserve the SQL querying capability on your data and get the queries started immediately. Also, you want to adopt a pricing model that allows you to save the maximum amount of cost on Amazon Redshift.\nWhat do you recommend? (Select two)","opts":["Migrate the Amazon Redshift underlying storage to Amazon S3 IA","Analyze the cold data with Amazon Athena","Move the data to Amazon S3 Glacier Deep Archive after 30 days","Create a smaller Amazon Redshift Cluster with the cold data","Move the data to Amazon S3 Standard IA after 30 days"],"ans":[1,4],"you2":[1,4],"notes":["Storage của Redshift không có storage class kiểu S3.","Query SQL trực tiếp trên S3, serverless, trả theo query.","Deep Archive mất nhiều giờ để lấy dữ liệu, không query ngay được.","Vẫn phải trả tiền cluster, không giảm chi phí đáng kể.","Rẻ, truy xuất tức thì."],"pattern":"Ghép 2 mảnh: lưu ở đâu + query bằng gì","why":"Lưu cold data ở S3 Standard-IA, query bằng Athena.","trap":"Chọn Deep Archive vì rẻ nhất mà quên 'queries started immediately'.","tip":"Thực tế còn có Redshift Spectrum (query S3 từ Redshift). Athena = serverless SQL trên S3.","old":null,"you1":null,"q_short":"Redshift data older than 30 days is rarely queried. You must keep SQL query capability with immediate query start, and save the most cost. Which TWO?"},{"id":11,"domain":"sec","topic":"Cognito Identity Pool + VPC Endpoint","multi":true,"q":"An edtech startup runs its course-management platform inside a private subnet in a VPC on AWS. The application uses Amazon Cognito user pools for authentication. Now, the team wants to extend the application so that authenticated users can upload and access personal course-related documents in Amazon S3. The solution must ensure scalable, fine-grained and secure access control to the S3 bucket and maintain private network architecture for the application.\nWhich combination of steps will enable secure S3 integration for this workload? (Select two)","opts":["Create an Amazon S3 VPC endpoint in the VPC where the application is hosted to enable private connectivity between the application and S3","Create an Amazon Cognito identity pool to allow federated identities. Use it to generate temporary AWS credentials that grant S3 access when users successfully authenticate","Attach an S3 bucket policy that allows access only if requests include a custom HTTP header containing a valid Cognito user ID","Use the existing Amazon Cognito user pool to directly grant users permission to upload and download objects in the S3 bucket","Configure an AWS Lambda function that proxies user uploads to S3. Invoke the Lambda function after each user login to isolate the S3 access"],"ans":[0,1],"notes":["Private subnet gọi S3 không cần Internet/NAT (Gateway Endpoint, miễn phí).","Đổi token lấy credential tạm thời gắn IAM role; dùng biến ${cognito-identity.amazonaws.com:sub} để giới hạn theo prefix.","Header do client tự gửi, giả mạo được; S3 chỉ tin chữ ký IAM (SigV4).","User pool chỉ xác thực, không cấp quyền IAM.","Tăng độ trễ, chi phí, giới hạn payload; không native."],"pattern":"2 yêu cầu tách biệt: quyền truy cập + mạng","why":"Identity Pool giải quyết quyền (credential tạm thời, fine-grained). VPC Endpoint giải quyết mạng private.","trap":"Quên chi tiết 'private subnet' ở đầu đề; tin vào cơ chế dựa trên header do client gửi.","tip":"User Pool = đăng nhập. Identity Pool = lấy credential AWS. Private subnet + S3/DynamoDB → Gateway Endpoint.","old":28,"you1":[1,2],"you2":[1,3],"q_short":"An app in a private subnet uses Cognito user pools for login. Authenticated users must upload/access their own documents in S3 with fine-grained, secure access while keeping the network private. Which TWO steps?"},{"id":12,"domain":"res","topic":"SQS priority queues","q":"A social media application lets users upload photos and perform image editing operations. The application offers two classes of service: pro and lite. The product team wants the photos submitted by pro users to be processed before those submitted by lite users. Photos are uploaded to Amazon S3 and the job information is sent to Amazon SQS.\nAs a solutions architect, which of the following solutions would you recommend?","opts":["Create one Amazon SQS standard queue. Set the visibility timeout of the pro photos to zero. Set up Amazon EC2 instances to prioritize visibility settings so pro photos are processed first","Create two Amazon SQS standard queues: one for pro and one for lite. Set the lite queue to use short polling and the pro queue to use long polling","Create two Amazon SQS standard queues: one for pro and one for lite. Set up Amazon EC2 instances to prioritize polling for the pro queue over the lite queue","Create two Amazon SQS FIFO queues: one for pro and one for lite. Set the lite queue to use short polling and the pro queue to use long polling"],"ans":[2],"notes":["Visibility 0 gây xử lý trùng; không tạo ưu tiên.","Polling chỉ ảnh hưởng cách chờ/chi phí, không tạo ưu tiên.","Pattern priority chuẩn: logic ưu tiên trong consumer.","Như trên; FIFO chỉ giữ thứ tự trong 1 queue."],"pattern":"Pattern priority với SQS","why":"SQS không có priority; tách queue và consumer poll queue ưu tiên trước.","trap":"Nửa đầu (tách 2 queue) đúng nên cả đáp án trông đúng.","tip":"Long polling chờ tối đa 20 giây, giảm gọi rỗng. Message tối đa 1 MiB từ 08/2025 (đề cũ ghi 256 KB); lớn hơn thì dùng Extended Client + S3.","old":65,"you1":[1],"you2":[2],"q_short":"Photos from 'pro' users must be processed before 'lite' users. Photos go to S3 and job info to SQS. What do you recommend?"},{"id":13,"domain":"res","topic":"ElastiCache for Memcached","q":"An e-commerce application uses a relational database that runs several queries that perform joins on multiple tables. The development team has found that these queries are slow and expensive, therefore these are a good candidate for caching. The application needs to use a caching service that supports multi-threading.\nAs a solutions architect, which of the following services would you recommend for the given use case?","opts":["AWS Global Accelerator","Amazon DynamoDB Accelerator (DAX)","Amazon ElastiCache for Memcached","Amazon ElastiCache for Redis"],"ans":[2],"you2":[0],"notes":["Dịch vụ mạng, không phải cache.","DAX chỉ dùng cho DynamoDB.","Đa luồng, đơn giản, scale ngang.","Theo đề: Redis (lõi xử lý lệnh) đơn luồng."],"pattern":"Từ khóa → dịch vụ","why":"'Multi-threading' là từ khóa của Memcached.","trap":"Global Accelerator có chữ 'Accelerator' nhưng không phải cache.","tip":"Redis/Valkey: persistence, replication, Multi-AZ, backup, pub/sub, sorted set (leaderboard). Memcached: đa luồng, đơn giản, không persistence. (Bản Redis/Valkey mới có enhanced I/O threads, nhưng đề vẫn coi Memcached là đáp án.)","old":null,"you1":null,"q_short":"Slow, expensive relational join queries should be cached. The caching service must support multi-threading. What do you recommend?"},{"id":14,"domain":"cost","topic":"EFS Infrequent Access","q":"A big data analytics company is looking to archive the on-premises data into a POSIX compliant file storage system on AWS Cloud. The archived data would be accessed for just about a week in a year.\nAs a solutions architect, which of the following AWS services would you recommend as the MOST cost-optimal solution?","opts":["Amazon S3 Standard","Amazon S3 Standard-IA","Amazon EFS Infrequent Access","Amazon EFS Standard"],"ans":[2],"notes":["S3 là object storage, không phải file system POSIX.","Vẫn là object storage, không đáp ứng POSIX.","File system POSIX, giá lưu trữ thấp cho dữ liệu ít truy cập.","Đúng loại storage nhưng giá lưu trữ cao, dành cho dữ liệu truy cập thường xuyên."],"pattern":"Lọc theo loại storage → so chi phí","why":"Từ khóa POSIX loại S3. Còn lại EFS, dữ liệu ít truy cập nên chọn lớp IA.","trap":"Thấy 'archive' là nghĩ ngay S3, quên mất yêu cầu POSIX.","tip":"POSIX/NFS/Linux shared file system → EFS. Windows SMB → FSx for Windows. HPC → FSx for Lustre. Đáp án của đề có từ trước khi có EFS Archive; hiện nay dữ liệu truy cập ~1 tuần/năm hợp với EFS Archive hơn (nếu đáp án có).","old":22,"you1":[0],"you2":[2],"q_short":"A company wants to archive on-premises data into a POSIX-compliant file storage system on AWS. The data will be accessed only about one week per year. Which service is MOST cost-optimal?"},{"id":15,"domain":"res","topic":"SQS Delay Queue","q":"An IT company is using Amazon Simple Queue Service (Amazon SQS) queues for decoupling the various components of application architecture. As the consuming components need additional time to process Amazon Simple Queue Service (Amazon SQS) messages, the company wants to postpone the delivery of new messages to the queue for a few seconds.\nAs a solutions architect, which of the following solutions would you suggest to the company?","opts":["Use visibility timeout to postpone the delivery of new messages to the queue for a few seconds","Use delay queues to postpone the delivery of new messages to the queue for a few seconds","Use dead-letter queues to postpone the delivery of new messages to the queue for a few seconds","Use Amazon SQS FIFO queues to postpone the delivery of new messages to the queue for a few seconds"],"ans":[1],"notes":["Ẩn message SAU khi đã được nhận, chống xử lý trùng.","Ẩn message mới TRƯỚC lần nhận đầu tiên (0 giây–15 phút).","Cô lập message lỗi nhiều lần.","Thứ tự + exactly-once."],"pattern":"Từ khóa → tính năng","why":"'Postpone delivery of new messages' = Delay queue.","trap":"Visibility timeout cũng 'ẩn message' nhưng ở thời điểm khác.","tip":"Delay tối đa 15 phút; Visibility tối đa 12 giờ (mặc định 30 giây); Retention tối đa 14 ngày (mặc định 4 ngày).","old":58,"you1":[2],"you2":[1],"q_short":"Consumers need extra time, so the company wants to postpone delivery of new messages to the SQS queue for a few seconds. What should be used?"},{"id":16,"domain":"sec","topic":"Amazon GuardDuty","q":"During a review, a security team has flagged concerns over an Amazon EC2 instance querying IP addresses used for cryptocurrency mining. The Amazon EC2 instance does not host any authorized application related to cryptocurrency mining.\nWhich AWS service can be used to protect the Amazon EC2 instances from such unauthorized behavior in the future?","opts":["AWS Shield Advanced","Amazon GuardDuty","AWS Web Application Firewall (AWS WAF)","AWS Firewall Manager"],"ans":[1],"notes":["Chống DDoS.","Có finding CryptoCurrency:EC2/BitcoinTool.B dựa trên threat intel.","Chỉ kiểm tra request HTTP đi VÀO web app.","Chỉ quản lý rule tập trung, không phát hiện."],"pattern":"Chọn dịch vụ bảo mật theo hành vi + chiều traffic","why":"Traffic đi RA từ instance bị chiếm quyền → GuardDuty (VPC Flow Logs, DNS logs, CloudTrail).","trap":"WAF chỉ áp dụng cho traffic HTTP đi vào.","tip":"Inspector = CVE. Macie = PII trong S3. Detective = điều tra. Security Hub = tổng hợp. Chặn outbound: Network Firewall / DNS Firewall.","old":50,"you1":[2],"you2":[1],"q_short":"An EC2 instance is querying IP addresses associated with cryptocurrency mining, with no authorized crypto app. Which service protects against such unauthorized behavior?"},{"id":17,"domain":"res","topic":"S3 vs EBS for shared documents","q":"A company is developing a document management application on AWS. The application runs on Amazon EC2 instances in multiple Availability Zones (AZs). The company requires the document store to be highly available and the documents need to be returned immediately when requested. The engineering team has configured the application to use Amazon Elastic Block Store (Amazon EBS) to store the documents but the team is willing to consider other options to meet the availability requirement.\nAs a solutions architect, which of the following will you recommend?","opts":["Create snapshots for the Amazon EBS volumes regularly and then build new volumes using those snapshots in additional Availability Zones","Set up Amazon EBS as the Amazon EC2 instance root volume and then configure the application to use Amazon S3 Glacier as the document store","Set up Amazon EBS as the Amazon EC2 instance root volume and then configure the application to use Amazon S3 as the document store","Provision at least three Provisioned IOPS Amazon Instance Store volumes for the Amazon EC2 instances and then mount these volumes to multiple Amazon EC2 instances"],"ans":[2],"notes":["Snapshot là backup, không phải HA real-time.","Glacier (Flexible/Deep Archive) truy xuất mất phút → giờ.","S3 lưu trên nhiều AZ, mọi instance đều truy cập được, độ trễ mili-giây.","Instance store tạm thời, không mount chung được; 'Provisioned IOPS instance store' không tồn tại."],"pattern":"Chọn storage theo HA + chia sẻ + tốc độ","why":"EBS chỉ nằm trong 1 AZ. Cần dùng chung đa AZ + truy xuất tức thì → S3.","trap":"EBS snapshot trông giống giải pháp HA nhưng chỉ là backup.","tip":"Nhiều EC2 đa AZ dùng chung: document/object → S3; cần POSIX/mount → EFS.","old":35,"you1":null,"you2":[2],"q_short":"A document app runs on EC2 instances across multiple AZs and stores documents on EBS. Documents must be highly available and returned immediately. What do you recommend?"},{"id":18,"domain":"perf","topic":"Instance Store","multi":true,"q":"The engineering team at a startup is evaluating the most optimal block storage volume type for the Amazon EC2 instances hosting its flagship application. The storage volume should support very low latency but it does not need to persist the data when the instance terminates. As a solutions architect, you have proposed using Instance Store volumes to meet these requirements.\nWhich of the following would you identify as the key characteristics of the Instance Store volumes? (Select two)","opts":["Instance store is reset when you stop or terminate an instance. Instance store data is preserved during hibernation","If you create an Amazon Machine Image (AMI) from an instance, the data on its instance store volumes isn't preserved","You can specify instance store volumes for an instance when you launch or restart it","An instance store is a network storage type","You can't detach an instance store volume from one instance and attach it to a different instance"],"ans":[1,4],"notes":["Nửa sau sai: hibernate = stop nên instance store bị reset.","Đúng.","Nửa sau sai: chỉ chỉ định được lúc launch.","Sai: gắn vật lý, không phải network.","Đúng: ổ gắn vật lý trên host."],"pattern":"Chọn đặc điểm đúng; câu đúng một nửa","why":"Instance store gắn vật lý, tạm thời; chỉ reboot là giữ dữ liệu.","trap":"Câu 'vế đầu đúng, vế sau sai'.","tip":"Reboot giữ. Stop/Hibernate/Terminate/hỏng host/AMI đều mất. Dùng cho cache, buffer, scratch.","old":45,"you1":[0,1],"you2":[1,4],"q_short":"Which TWO statements are key characteristics of EC2 instance store volumes?"},{"id":19,"domain":"perf","topic":"Elastic Fabric Adapter","q":"A biotechnology company has multiple High Performance Computing (HPC) workflows that quickly and accurately process and analyze genomes for hereditary diseases. The company is looking to migrate these workflows from their on-premises infrastructure to AWS Cloud.\nAs a solutions architect, which of the following networking components would you recommend on the Amazon EC2 instances running these HPC workflows?","opts":["Elastic Network Adapter (ENA)","Elastic Fabric Adapter (EFA)","Elastic Network Interface (ENI)","Elastic IP Address (EIP)"],"ans":[1],"notes":["Enhanced networking nhưng không có OS-bypass.","ENA + OS-bypass cho MPI/NCCL, độ trễ cực thấp giữa các node.","Card mạng ảo cơ bản.","IP public tĩnh."],"pattern":"4 cái tên na ná nhau","why":"HPC → EFA.","trap":"ENA đúng hướng 'hiệu năng cao' nhưng chưa tốt nhất cho HPC.","tip":"HPC stack: EFA + Cluster Placement Group + FSx for Lustre + ParallelCluster/Batch.","old":53,"you1":[2],"you2":[1],"q_short":"HPC genome-analysis workflows are moving to EC2. Which networking component should the instances use?"},{"id":20,"domain":"perf","topic":"Caching for DynamoDB","multi":true,"q":"A company uses Amazon DynamoDB as a data store for various kinds of customer data, such as user profiles, user events, clicks, and visited links. Some of these use-cases require a high request rate (millions of requests per second), low predictable latency, and reliability. The company now wants to add a caching layer to support high read volumes.\nAs a solutions architect, which of the following AWS services would you recommend as a caching layer for this use-case? (Select two)","opts":["Amazon ElastiCache","Amazon OpenSearch Service","Amazon DynamoDB Accelerator (DAX)","Amazon Relational Database Service (Amazon RDS)","Amazon Redshift"],"ans":[0,2],"you2":[0,2],"notes":["Cache in-memory, đặt trước RDS hoặc DynamoDB được.","Search/analytics, không phải cache.","Cache chuyên cho DynamoDB, micro-giây, API tương thích.","Database quan hệ, không phải cache.","Data warehouse."],"pattern":"Chọn dịch vụ cache","why":"DAX (chuyên DynamoDB) và ElastiCache (đa dụng).","trap":"—","tip":"DynamoDB + ít sửa code → DAX. RDS → ElastiCache.","old":null,"you1":null,"q_short":"DynamoDB stores customer data with millions of requests per second and needs low, predictable latency. Which TWO services can be a caching layer?"},{"id":21,"domain":"sec","topic":"AWS Managed Microsoft AD","q":"A company needs an Active Directory service to run directory-aware workloads in the AWS Cloud and it should also support configuring a trust relationship with any existing on-premises Microsoft Active Directory.\nWhich AWS Directory Service is the best fit for this requirement?","opts":["AWS Directory Service for Microsoft Active Directory (AWS Managed Microsoft AD)","AWS Transit Gateway","Active Directory Connector","Simple Active Directory (Simple AD)"],"ans":[0],"you2":[0],"notes":["AD thật trên AWS, hỗ trợ trust với AD on-prem.","Dịch vụ mạng, không phải AD.","Chỉ là proxy chuyển request về AD on-prem, không chạy workload AD trên cloud.","AD nhỏ, không hỗ trợ trust, MFA, schema extension."],"pattern":"Chọn loại Directory Service","why":"Cần AD trên cloud + trust → Managed Microsoft AD.","trap":"AD Connector nghe như 'kết nối với on-prem' nhưng không tạo trust.","tip":"Dùng AD on-prem sẵn có, không lưu gì trên cloud → AD Connector. AD nhỏ, rẻ, không trust → Simple AD.","old":null,"you1":null,"q_short":"A company needs Active Directory for directory-aware workloads in AWS and a trust relationship with its on-premises Microsoft AD. Which Directory Service fits?"},{"id":22,"domain":"sec","topic":"S3 Storage Lens","q":"A global financial services provider operates data analytics workloads across multiple AWS Regions. The company stores regulated datasets in Amazon S3 buckets and requires visibility into security and compliance configurations. As part of a new audit initiative, the compliance team must identify all S3 buckets across the environment that do not have versioning enabled. The solution must scale across all Regions and accounts with minimal manual intervention.\nWhich solution will meet these requirements with the LEAST operational overhead?","opts":["Create a centralized Amazon S3 Multi-Region Access Point for all buckets. Use this access point to perform versioning checks programmatically by inspecting objects' metadata from each bucket","Configure an AWS CloudTrail trail across all Regions. Create an Amazon EventBridge rule that filters for PutBucketVersioning and DeleteBucketVersioning API calls. Trigger an AWS Lambda function to analyze the bucket configurations and generate a report of unversioned buckets","Enable Amazon S3 Storage Lens with advanced metrics and recommendations. Use the per-bucket dashboard to filter and view versioning status across Regions and identify all buckets that do not have versioning enabled","Enable IAM Access Analyzer for all Regions. Review the analyzer reports to identify S3 buckets without versioning enabled and configure IAM policies to restrict access to such buckets"],"ans":[2],"notes":["MRAP là endpoint truy cập dữ liệu, không phải công cụ audit.","Chỉ thấy THAY ĐỔI; bucket chưa từng bật versioning không có sự kiện nào nên bị bỏ sót; tự viết code.","Dashboard toàn tổ chức, lọc theo bucket.","Access Analyzer xét quyền truy cập, không xét versioning."],"pattern":"Audit trạng thái hiện tại trên quy mô lớn","why":"Cần 'current state' của mọi bucket → Storage Lens (hoặc AWS Config + Aggregator).","trap":"Event-driven chỉ phát hiện thay đổi, không cho biết trạng thái đang có.","tip":"CloudTrail = ai làm gì, khi nào. Config = tài nguyên đang cấu hình ra sao (rule s3-bucket-versioning-enabled + Aggregator). Metric versioning của Storage Lens có ở bản free.","old":51,"you1":[1],"you2":[2],"q_short":"Compliance must identify all S3 buckets without versioning across all Regions and accounts, with the LEAST operational overhead. What should they use?"},{"id":23,"domain":"res","topic":"Aurora Serverless","q":"The engineering team at an IT company is deploying an Online Transactional Processing (OLTP) application that needs to support relational queries. The application will have unpredictable spikes of usage that the team does not know in advance.\nWhich database would you recommend using?","opts":["Amazon DynamoDB with On-Demand Capacity","Amazon DynamoDB with Provisioned Capacity and Auto Scaling","Amazon ElastiCache","Amazon Aurora Serverless"],"ans":[3],"you2":[3],"notes":["Scale tốt nhưng là NoSQL, không query quan hệ (join).","NoSQL.","Cache, không phải DB quan hệ.","Quan hệ, tự scale theo tải."],"pattern":"Lọc theo loại DB → theo khả năng scale","why":"'Relational' loại DynamoDB và ElastiCache; 'unpredictable' → Serverless.","trap":"DynamoDB on-demand khớp 'unpredictable' nhưng sai 'relational'.","tip":"Aurora Serverless v2 scale theo ACU, hiện có thể scale về 0.","old":null,"you1":null,"q_short":"An OLTP application needs relational queries and has unpredictable usage spikes. Which database?"},{"id":24,"domain":"res","topic":"EC2 User Data","q":"A systems administration team has a requirement to run certain custom scripts only once during the launch of the Amazon Elastic Compute Cloud (Amazon EC2) instances that host their application.\nWhich of the following represents the best way of configuring a solution for this requirement with minimal effort?","opts":["Update Amazon EC2 instance configuration to ensure that the custom scripts, added as user data scripts, are run only during the boot process","Use AWS CLI to run the user data scripts only once while launching the instance","Run the custom scripts as instance metadata scripts on the Amazon EC2 instances","Run the custom scripts as user data scripts on the Amazon EC2 instances"],"ans":[3],"notes":["Thừa, vì mặc định đã chạy một lần. Cấu hình thêm chỉ cần khi muốn chạy ở MỌI lần boot.","Đáp án gây nhiễu.","Metadata chỉ để đọc thông tin instance, không chạy script.","Mặc định user data chỉ chạy một lần ở lần boot đầu tiên."],"pattern":"Phân biệt khái niệm dễ nhầm","why":"User data mặc định chạy đúng một lần khi launch, với quyền root.","trap":"Metadata và user data đều ở 169.254.169.254 nên dễ nhầm.","tip":"User data = việc làm khi khởi tạo. Metadata = thông tin về instance (ID, IP, credential role). Nên dùng IMDSv2.","old":29,"you1":[2],"you2":[3],"q_short":"A team must run custom scripts only once when EC2 instances are launched, with minimal effort. What is the best way?"},{"id":25,"domain":"res","topic":"CloudFront private content","multi":true,"q":"A digital media streaming company wants to use Amazon CloudFront to distribute its content only to its service subscribers. As a solutions architect, which of the following solutions would you suggest to deliver restricted content to the bona fide end users? (Select two)","opts":["Use Amazon CloudFront signed URLs","Forward HTTPS requests to the origin server by using the ECDSA or RSA ciphers","Require HTTPS for communication between Amazon CloudFront and your S3 origin","Use Amazon CloudFront signed cookies","Require HTTPS for communication between Amazon CloudFront and your custom origin"],"ans":[0,3],"notes":["Cấp quyền cho từng file, có thời hạn hết hạn.","Đáp án gây nhiễu: cipher không phải cơ chế phân quyền.","HTTPS chỉ mã hóa đường truyền, không phân biệt ai được xem.","Cấp quyền cho nhiều file cùng lúc / không đổi URL hiện có.","Giống đáp án đầu: mã hóa, không phải phân quyền."],"pattern":"Phân quyền truy cập (authorization) vs mã hóa đường truyền","why":"Bài toán là 'ai được xem'. Chỉ Signed URL / Signed Cookie kiểm soát được người truy cập ở chặng viewer → CloudFront.","trap":"Nhầm HTTPS/TLS (bảo mật đường truyền) với kiểm soát truy cập.","tip":"1 file → Signed URL. Nhiều file / giữ nguyên URL → Signed Cookie. Chặn truy cập thẳng S3 → OAC. Chặn theo quốc gia → Geo Restriction.","old":23,"you1":[0,2],"you2":[0,3],"q_short":"A streaming company wants Amazon CloudFront to deliver content only to its paying subscribers. Which TWO solutions restrict content to legitimate users?"},{"id":26,"domain":"sec","topic":"Control Tower + VPC Sharing (RAM)","q":"A digital media firm is scaling its cloud footprint and wants to isolate development, testing, and production workloads using separate AWS accounts. It also wants a centralized approach to managing networking infrastructure such as subnets and gateways, without repeating configurations in every account. Additionally, the solution must enforce security best practices—like mandatory logging and guardrails—when new accounts are created. The firm prefers a low-maintenance, governance-driven setup.\nWhich solution best meets these goals while minimizing operational overhead?","opts":["Use AWS Control Tower to launch accounts. Deploy separate VPCs in each workload account and centralize security inspection by using Gateway Load Balancers to route traffic through a shared security appliance","Use AWS Control Tower to create and govern accounts. Deploy a centralized VPC in a shared networking account and share its subnets across workload accounts using AWS Resource Access Manager (AWS RAM)","Use AWS Organizations to create new accounts and a shared networking account with a central VPC. Share the VPC subnets via AWS RAM and rely on service control policies (SCPs) to enforce guardrails manually","Use AWS Service Catalog to define pre-approved VPC templates. Launch one VPC per workload account from the catalog, and enforce networking guardrails using AWS Config conformance packs"],"ans":[1],"notes":["Lặp VPC; GWLB giải bài toán inspection, không phải tập trung hạ tầng mạng.","Governance tự động + mạng tập trung.","Mạng đúng, nhưng 'manually' và thiếu logging tự động.","Vẫn N VPC; Service Catalog không tạo account, không tự bật logging."],"pattern":"Ghép 2 mảnh: governance + network","why":"Control Tower (landing zone, controls, log archive) + VPC Sharing qua RAM.","trap":"Đáp án đúng một mảnh, sai một mảnh.","tip":"SCP = giới hạn. Config = phát hiện. Control Tower = Organizations + landing zone + controls tự động.","old":48,"you1":[1],"you2":[1],"q_short":"A firm isolates dev/test/prod in separate accounts, wants centrally managed networking (subnets, gateways) without repeating config per account, and enforced logging/guardrails on new accounts, low maintenance. Best solution?"},{"id":27,"domain":"res","topic":"Amazon MQ","q":"A company is experiencing stability issues with their cluster of self-managed RabbitMQ message brokers and the company now wants to explore an alternate solution on AWS.\nAs a solutions architect, which of the following AWS services would you recommend that can provide support for quick and easy migration from RabbitMQ?","opts":["Amazon Simple Notification Service (Amazon SNS)","Amazon SQS FIFO (First-In-First-Out)","Amazon MQ","Amazon Simple Queue Service (Amazon SQS) Standard"],"ans":[2],"you2":[2],"notes":["Pub/sub, không tương thích giao thức RabbitMQ.","Phải viết lại code.","Broker managed cho ActiveMQ và RabbitMQ, giữ nguyên giao thức (AMQP, MQTT, STOMP…).","Phải viết lại code."],"pattern":"Migration giữ nguyên công nghệ","why":"Đang dùng RabbitMQ/ActiveMQ, muốn chuyển nhanh → Amazon MQ.","trap":"—","tip":"Ứng dụng mới, cloud-native → SQS/SNS. Ứng dụng cũ dùng giao thức chuẩn (JMS, AMQP, MQTT) → Amazon MQ.","old":null,"you1":null,"q_short":"A company has stability issues with self-managed RabbitMQ brokers and wants quick, easy migration to a managed AWS service. Which one?"},{"id":28,"domain":"res","topic":"ELB cannot span Regions","q":"A startup uses a fleet of Amazon EC2 servers to manage its CRM application. These Amazon EC2 servers are behind Elastic Load Balancing (ELB). Which of the following configurations are NOT allowed for Elastic Load Balancing?","opts":["Use the Elastic Load Balancing to distribute traffic for four Amazon EC2 instances. All the four instances are deployed in Availability Zone B of us-west-1 region","Use the Elastic Load Balancing to distribute traffic for four Amazon EC2 instances. All the four instances are deployed across two Availability Zones of us-east-1 region","Use the Elastic Load Balancing to distribute traffic for four Amazon EC2 instances. All the four instances are deployed in Availability Zone A of us-east-1 region","Use the Elastic Load Balancing to distribute traffic for four Amazon EC2 instances. Two of these instances are deployed in Availability Zone A of us-east-1 region and the other two instances are deployed in Availability Zone B of us-west-1 region"],"ans":[3],"you2":[3],"notes":["Hợp lệ (1 AZ).","Hợp lệ (đa AZ).","Hợp lệ (1 AZ).","Không hợp lệ: ELB không phân phối traffic giữa các Region."],"pattern":"Câu hỏi phủ định (NOT allowed)","why":"ELB là dịch vụ trong 1 Region.","trap":"Đọc lướt bỏ qua chữ NOT.","tip":"Phân phối đa Region → Route 53 (latency/geo/failover routing) hoặc Global Accelerator.","old":null,"you1":null,"q_short":"EC2 servers sit behind Elastic Load Balancing. Which configuration is NOT allowed?"},{"id":29,"domain":"cost","topic":"Spot Instances vs Spot Fleet","multi":true,"q":"A software engineering intern at a company is documenting the features offered by Amazon EC2 Spot instances and Spot fleets.\nCan you help the intern by selecting the correct options that identify the key characteristics of these two types of Spot entities? (Select two)","opts":["Spot fleets are spare EC2 capacity that can save you up 90% off of On-Demand prices. Spot fleets are usually interrupted by Amazon EC2 for capacity requirements with a 2-minute notification","Spot fleets allow you to request Amazon EC2 Spot instances for 1 to 6 hours at a time to avoid being interrupted","Spot instances are spare Amazon EC2 capacity that can save you up 90% off of On-Demand prices. Spot instances can be interrupted by Amazon EC2 for capacity requirements with a 2-minute notification","A Spot fleet can consist of a set of Spot Instances and optionally On-Demand Instances that are launched to meet your target capacity","A Spot fleet can only consist of a set of Spot Instances that are launched to meet your target capacity"],"ans":[2,3],"you2":[0,4],"notes":["Gán đặc điểm của Spot Instance cho Spot Fleet; Fleet là tập hợp instance, không phải 'capacity'.","Đó là Spot Blocks, đã ngừng (deprecated).","Đúng.","Đúng: Fleet gồm Spot và có thể thêm On-Demand.","Sai: có thể có On-Demand."],"pattern":"Phân biệt khái niệm gần nhau","why":"Spot Instance = capacity dư, rẻ, bị thu hồi với cảnh báo 2 phút. Spot Fleet = tập Spot (+ On-Demand tùy chọn) để đạt target capacity.","trap":"Tráo chủ ngữ (Instance ↔ Fleet) và chữ 'only'.","tip":"Câu có 'only' thường sai. Spot Blocks đã bị bỏ. Hiện nay AWS khuyên dùng EC2 Fleet hoặc ASG mixed instances.","old":null,"you1":null,"q_short":"Which TWO statements correctly describe Spot Instances and Spot Fleets?"},{"id":30,"domain":"cost","topic":"Savings Plans","multi":true,"q":"A technology startup has stabilized its cloud infrastructure after a successful product launch. The backend services are now running at a predictable rate with minimal scaling events. The application architecture includes workloads running on Amazon EC2, AWS Lambda functions for asynchronous processing, container workloads on AWS Fargate, and machine learning inference models deployed with Amazon SageMaker. The company is now focusing on reducing long-term operational expenses without redesigning its architecture. The company wants to apply long-term pricing discounts with the least administrative overhead and the broadest service coverage possible using the fewest number of savings plans.\nWhich combination of savings plans will satisfy these requirements? (Select two)","opts":["Purchase an EC2 Instance Savings Plan that covers EC2 and containerized tasks on Amazon ECS running with Fargate launch type","Purchase a SageMaker Savings Plan that applies discounted pricing to SageMaker training, inference, and notebook instances","Subscribe to a hybrid deployment discount plan that includes discounts for both AWS and on-premises Kubernetes workloads","Create a Reserved Instance for each EC2 instance and subscribe to AWS Support to monitor Reserved Instance utilization monthly","Purchase a Compute Savings Plan that provides cost savings for usage across EC2, Fargate, and Lambda services"],"ans":[1,4],"notes":["EC2 Instance SP chỉ áp dụng EC2 (gắn family + Region), không áp dụng Fargate.","SageMaker không nằm trong Compute SP, cần plan riêng.","Không tồn tại.","RI chỉ cho EC2, quản lý từng RI; AWS Support không giảm chi phí.","Phủ EC2 + Fargate + Lambda, linh hoạt nhất."],"pattern":"Ghép plan để phủ đủ dịch vụ","why":"Compute SP phủ EC2/Fargate/Lambda; SageMaker SP phủ SageMaker. 2 plan phủ đủ 4 dịch vụ.","trap":"Mô tả EC2 Instance SP 'bao gồm Fargate' là sai.","tip":"Compute SP ~66%, linh hoạt nhất. EC2 Instance SP ~72%, gắn family + Region. SageMaker SP ~64%.","old":27,"you1":[0,4],"you2":[1,4],"q_short":"A startup has steady workloads on EC2, Lambda, Fargate and SageMaker inference. It wants long-term discounts with the broadest coverage, least overhead and the fewest Savings Plans. Which TWO should it buy?"},{"id":31,"domain":"sec","topic":"AWS VPN CloudHub","q":"A media company has its corporate headquarters in Los Angeles with an on-premises data center using an AWS Direct Connect connection to the AWS VPC. The branch offices in San Francisco and Miami use AWS Site-to-Site VPN connections to connect to the AWS VPC. The company is looking for a solution to have the branch offices send and receive data with each other as well as with their corporate headquarters.\nAs a solutions architect, which of the following AWS services would you recommend addressing this use-case?","opts":["AWS VPN CloudHub","Software VPN","VPC Endpoint","VPC Peering connection"],"ans":[0],"you2":[0],"notes":["Hub-and-spoke qua VGW, các site nói chuyện với nhau.","Chỉ nối mạng on-prem với VPC.","Truy cập dịch vụ AWS riêng tư.","Nối 2 VPC, không liên quan chi nhánh."],"pattern":"Chọn dịch vụ kết nối theo topology","why":"Nhiều site on-prem cần nói chuyện với nhau qua AWS → VPN CloudHub.","trap":"—","tip":"Nhiều VPC + on-prem quy mô lớn → Transit Gateway. Nhiều chi nhánh, chi phí thấp → VPN CloudHub.","old":null,"you1":null,"q_short":"HQ connects to a VPC via Direct Connect; two branch offices connect via Site-to-Site VPN. Branches must exchange data with each other and with HQ. What do you recommend?"},{"id":32,"domain":"sec","topic":"Direct Connect Public VIF","q":"A global enterprise maintains a hybrid cloud environment and wants to transfer large volumes of data between its on-premises data center and Amazon S3 for backup and analytics workflows. The company has already established a Direct Connect (DX) connection to AWS and wants to ensure high-bandwidth, low-latency, and secure private connectivity without traversing the public internet. The architecture must be designed to access Amazon S3 directly from on-premises systems using this DX connection.\nWhich configuration should the network engineering team implement to allow direct access to Amazon S3 from the on-premises data center using Direct Connect?","opts":["Configure a VPN connection over the public internet to AWS and route S3 traffic through the tunnel instead of using Direct Connect","Provision a Public Virtual Interface (Public VIF) on the Direct Connect connection to access Amazon S3 public IP addresses from the on-premises data center","Use a Private Virtual Interface (Private VIF) on the Direct Connect connection and create a VPC endpoint to route traffic to S3 over the private network","Use a Transit Gateway with Direct Connect Gateway to route on-premises traffic through a VPC and then to Amazon S3 using private IP addressing"],"ans":[1],"notes":["Đi qua Internet, vi phạm yêu cầu.","Truy cập dịch vụ public của AWS qua đường DX riêng.","Private VIF dành cho tài nguyên VPC; Gateway Endpoint không dùng được từ on-prem.","Đi vòng qua VPC, phức tạp; TGW/DXGW dành cho nhiều VPC."],"pattern":"Chọn loại VIF theo đích đến","why":"S3 là dịch vụ public → Public VIF, đi trực tiếp qua DX.","trap":"TGW/DXGW nghe 'enterprise' nhưng đi vòng, không 'directly'.","tip":"Thực tế: Private/Transit VIF + S3 Interface Endpoint (PrivateLink) cũng truy cập S3 từ on-prem bằng IP private. Đề có 'directly' + Public VIF → chọn Public VIF.","old":59,"you1":[3],"you2":[1],"q_short":"A company with Direct Connect wants on-premises systems to access Amazon S3 directly over DX, with high bandwidth and without traversing the internet. What should be configured?"},{"id":33,"domain":"res","topic":"Single-instance HA","multi":true,"q":"You are deploying a critical monolith application that must be deployed on a single web server, as it hasn't been created to work in distributed mode. Still, you want to make sure your setup can automatically recover from the failure of an Availability Zone (AZ).\nWhich of the following options should be combined to form the MOST cost-efficient solution? (Select three)","opts":["Create an auto-scaling group that spans across 2 Availability Zones, which min=1, max=1, desired=1","Create an elastic IP address (EIP) and use the Amazon EC2 user-data script to attach it","Assign an Amazon EC2 Instance Role to perform the necessary API calls","Create an Application Load Balancer and a target group with the instance(s) of the Auto Scaling Group","Create an auto-scaling group that spans across 2 Availability Zones, which min=1, max=2, desired=2","Create a Spot Fleet request"],"ans":[0,1,2],"notes":["Luôn đúng 1 instance; AZ chết thì tạo lại ở AZ khác.","IP cố định; instance mới tự gắn EIP khi boot.","Script gắn EIP cần quyền ec2:AssociateAddress.","Chạy được nhưng trả tiền ALB chỉ để trỏ vào 1 máy, không cost-efficient.","Desired=2 tạo 2 instance, vi phạm 'single server'.","Spot có thể bị thu hồi, không hợp với ứng dụng critical."],"pattern":"Chọn 3 mảnh tạo thành chuỗi phụ thuộc","why":"ASG 1/1/1 tự dựng lại instance → instance mới cần IP cố định (EIP qua user data) → script cần quyền (IAM role).","trap":"ALB đúng về kỹ thuật nhưng sai tiêu chí cost. Đáp án nhắc 'API calls' là mảnh phụ trợ cho một đáp án khác.","tip":"Single-instance HA rẻ nhất = ASG 1/1/1 multi-AZ + EIP qua user data + instance role.","old":30,"you1":[0,3,5],"you2":[1,2,4],"q_short":"A critical monolith must run on a single web server (not distributed) but must automatically recover from an AZ failure. Which THREE options form the MOST cost-efficient solution?"},{"id":34,"domain":"perf","topic":"IAM Identity Center","q":"A healthcare startup is deploying an AWS-based analytics platform that processes sensitive patient records. The application backend uses Amazon RDS for structured data and Amazon S3 for storing medical files. S3 Event Notifications trigger AWS Lambda for real-time data classification and alerting. The startup uses AWS IAM Identity Center to manage federated access from their enterprise directory. Development, operations, and compliance teams require granular and secure access to RDS and S3 resources, based strictly on their job roles. The company must follow the principle of least privilege while minimizing manual administrative work.\nWhich solution should the company implement to meet these requirements with the least operational overhead?","opts":["Use AWS Organizations to group team accounts under a single organizational unit (OU). Attach Service Control Policies (SCPs) to the OU that define access boundaries for Amazon RDS and Amazon S3 based on each team’s responsibilities. Assign users to accounts and let SCPs enforce the required access","Use AWS IAM Identity Center integrated with the organization’s directory. Define permission sets with least-privilege policies for Amazon RDS and Amazon S3. Assign users to groups based on their team roles and map those groups to the appropriate permission sets","Create an IAM identity provider that integrates with the company's IdP (e.g., Azure AD or Okta). Use SAML federation to grant access to IAM roles that are manually assigned to each user. Create and maintain inline IAM policies for each role to access RDS and S3","Create individual IAM users for each team member. Attach role-based IAM policies granting permissions to RDS and S3 based on team roles. Use AWS IAM Access Analyzer to monitor for unused permissions and rotate access keys periodically"],"ans":[1],"notes":["SCP không cấp quyền, chỉ giới hạn quyền tối đa.","Tập trung, theo group, credential tạm thời, đổi group là đổi quyền.","Làm được nhưng thủ công: tự tạo role, gán tay, duy trì inline policy.","Quản lý user và access key thủ công, overhead cao."],"pattern":"Quản lý quyền cho nhân viên (workforce) đa account","why":"Identity Center + permission sets + group từ directory là cách native, scale tốt, least privilege.","trap":"Nghĩ SCP cấp quyền được. SCP chỉ là guardrail.","tip":"Nhân viên → IAM Identity Center. Người dùng cuối của app → Cognito. IAM user + access key gần như luôn sai khi đề nói 'least overhead'.","old":26,"you1":[1],"you2":[2],"q_short":"A healthcare startup already uses IAM Identity Center with its enterprise directory. Dev, ops and compliance teams need least-privilege, role-based access to RDS and S3 with minimal admin work. What should they do?"},{"id":35,"domain":"sec","topic":"S3 client-side encryption","q":"A company helps its customers legally sign highly confidential contracts. To meet the strong industry requirements, the company must ensure that the signed contracts are encrypted using the company's proprietary algorithm. The company is now migrating to AWS Cloud using Amazon Simple Storage Service (Amazon S3) and would like you, the solution architect, to advise them on the encryption scheme to adopt.\nWhat do you recommend?","opts":["Server-side encryption with AWS KMS keys (SSE-KMS)","Client Side Encryption","Server-side encryption with Amazon S3 managed keys (SSE-S3)","Server-side encryption with customer-provided keys (SSE-C)"],"ans":[1],"notes":["S3 mã hóa AES-256, khóa trong KMS.","Tự mã hóa trước khi upload, dùng thuật toán bất kỳ.","S3 mã hóa AES-256, S3 quản lý khóa.","Bạn cấp khóa nhưng S3 vẫn mã hóa bằng AES-256."],"pattern":"Ai mã hóa? Ai quản lý khóa?","why":"Mọi SSE đều do S3 thực hiện bằng AES-256; thuật toán riêng → Client-side.","trap":"SSE-C 'customer-provided' chỉ là khóa, không phải thuật toán.","tip":"Audit/rotate key → SSE-KMS. Không muốn AWS lưu key → SSE-C. Mã hóa 2 lớp → DSSE-KMS. HSM riêng → CloudHSM.","old":56,"you1":[2],"you2":[1],"q_short":"Signed contracts must be encrypted using the company's proprietary algorithm before storage in S3. Which encryption scheme?"},{"id":36,"domain":"res","topic":"NAT Gateway HA","q":"A healthcare company runs a fleet of Amazon EC2 instances in two private subnets (named PR1 and PR2) across two Availability Zones (AZs) named A1 and A2. The Amazon EC2 instances need access to the internet for operating system patch management and third-party software maintenance. To facilitate this, the engineering team at the company wants to set up two Network Address Translation gateways (NAT gateways) in a highly available configuration.\nWhich of the following options would you suggest?","opts":["Set up a total of two NAT gateways. NAT gateway N1 should be set up in private subnet PR1 in Availability Zone A1. NAT gateway N2 should be set up in private subnet PR2 in Availability Zone A2","Set up a total of two NAT gateways. Both NAT gateways N1 and N2 should be set up in a single public subnet PU1 in any of the Availability Zones A1 or A2","Set up a total of one NAT gateway. NAT gateway N1 should be set up in public subnet PU1 in any of the Availability Zones A1 or A2","Set up a total of two NAT gateways. NAT gateway N1 should be set up in public subnet PU1 in Availability Zone A1. NAT gateway N2 should be set up in public subnet PU2 in Availability Zone A2"],"ans":[3],"notes":["Private subnet không có route ra IGW, NAT không ra Internet được.","Cùng 1 AZ: AZ chết thì cả 2 cùng chết.","Single point of failure.","Public subnet, mỗi AZ một NAT; route của private subnet trỏ tới NAT cùng AZ."],"pattern":"Đặt thành phần mạng đúng chỗ","why":"Với NAT Gateway kiểu zonal (mô hình trong đề): phải ở public subnet + EIP + route tới IGW; HA = 1 NAT mỗi AZ.","trap":"Đáp án đúng 2/3 tiêu chí (số lượng, số AZ) nhưng sai loại subnet.","tip":"Từ 11/2025 có thêm Regional NAT Gateway (1 gateway/VPC, tự trải các AZ, không cần public subnet); đề cũ vẫn theo mô hình zonal. NAT Gateway không gắn SG; NAT instance phải tắt source/dest check. IPv6 → Egress-only IGW.","old":55,"you1":[0],"you2":[3],"q_short":"EC2 instances in private subnets PR1 (AZ A1) and PR2 (AZ A2) need internet access for patching. Two NAT gateways must be highly available. What do you suggest?"},{"id":37,"domain":"perf","topic":"AWS Batch + Step Functions + S3","q":"A media company is modernizing its legacy image processing application by migrating it from an on-premises environment to AWS. The application handles a high volume of image transformation jobs, generating large output files. To support rapid growth, the company wants a cloud-native solution that automatically scales, minimizes manual intervention, and avoids managing servers or infrastructure. The team also wants to improve workflow automation to handle task sequencing and job state transitions.\nWhich solution best meets these requirements while ensuring the least operational overhead?","opts":["Deploy Amazon Elastic Kubernetes Service (Amazon EKS) with self-managed EC2 worker nodes for image processing. Use Amazon SQS to queue jobs and store processed outputs in Amazon EBS volumes","Use Amazon EC2 Auto Scaling groups with a static fleet of instances for image processing. Trigger each job through Step Functions and store results on attached EBS volumes","Use AWS Batch to process image jobs. Orchestrate the workflow using AWS Step Functions and store output files in Amazon S3","Use a combination of AWS Lambda functions and EC2 Spot Instances for processing. Store processed images in Amazon FSx"],"ans":[2],"notes":["'Self-managed' trái 'avoid managing servers'; SQS không quản lý trạng thái; EBS.","Static fleet không tự scale; EBS không hợp output lớn dùng chung.","Đúng cả 3 mảnh: compute managed, orchestration, storage.","Không có điều phối; Lambda giới hạn; FSx không cần thiết."],"pattern":"Pipeline nhiều mảnh, chấm từng mảnh","why":"Batch (managed compute) + Step Functions (sequencing/state) + S3 (file lớn).","trap":"'Cloud-native' (Kubernetes) không đồng nghĩa với ít vận hành.","tip":"Step Functions = workflow/state. SQS = decouple/buffer.","old":61,"you1":[0],"you2":[2],"q_short":"A high-volume image-processing app with large outputs is modernizing: it must scale automatically, avoid managing servers, and automate task sequencing and job state transitions, with the least overhead. Best solution?"},{"id":38,"domain":"cost","topic":"S3 Gateway Endpoint (compliance + cost)","q":"A healthcare analytics firm operates a backend application within a private subnet of its VPC. The application is fronted by an Application Load Balancer (ALB) and accesses Amazon S3 to store medical reports. The VPC includes both a NAT gateway and an internet gateway, but the company's strict compliance policy prohibits any data traffic from traversing the internet. The team must redesign the architecture to comply with the security policy and improve cost-efficiency.\nWhich solution best satisfies these requirements in the most cost-effective manner?","opts":["Create an S3 interface VPC endpoint and modify the security group to allow access from the application’s private subnet. Route all S3 traffic through the interface endpoint","Create a gateway VPC endpoint for Amazon S3 and update the route table for the private subnet to direct S3 traffic through the endpoint","Modify the S3 bucket policy to allow requests only from the Elastic IP address associated with the NAT gateway","Create a VPC peering connection with another VPC that has direct access to S3. Forward the S3 API requests through the peered VPC using proxy EC2 instances"],"ans":[1],"you2":[1],"notes":["Đáp ứng bảo mật nhưng có phí theo giờ và theo GB.","Miễn phí, đi qua mạng AWS, chỉ cần sửa route table.","Traffic vẫn qua NAT ra Internet và tốn phí NAT.","Phức tạp, tốn kém, peering không transitive."],"pattern":"Gateway hay Interface endpoint","why":"S3 + private + rẻ nhất → Gateway Endpoint.","trap":"Interface endpoint cũng private nhưng có phí.","tip":"Cùng chủ đề với Q52. Gateway Endpoint còn giảm phí NAT khi truy cập S3 nhiều.","old":null,"you1":null,"q_short":"A private-subnet app behind an ALB writes reports to S3. The VPC has a NAT gateway and IGW, but policy forbids traffic over the internet. What is the most cost-effective compliant design?"},{"id":39,"domain":"res","topic":"HA for legacy apps on EC2","q":"A media company is relocating its legacy infrastructure to AWS. The on-premises environment consists of multiple virtualized workloads that are tightly coupled to their host operating systems and cannot be containerized or re-architected due to software constraints. Each workload currently runs on a standalone virtual machine. The engineering team plans to run these workloads on Amazon EC2 instances without modifying their core design. The company needs a solution that ensures high availability and fault tolerance in the AWS Cloud.\nWhich solution will meet these requirements?","opts":["Create Amazon Machine Images (AMIs) for each legacy workload. Use the AMIs to launch Auto Scaling groups with a minimum and maximum capacity of 1 EC2 instance. Place an Application Load Balancer (ALB) in front of the Auto Scaling group to provide routing and health check-based failover.","Containerize the legacy applications and deploy them to Amazon ECS using the Fargate launch type. Define a task for each workload, and use an Application Load Balancer to route traffic across multiple Fargate tasks running in separate Availability Zones","Use AWS Backup to schedule hourly backups of each EC2 instance to Amazon S3 in a separate Availability Zone. Create a recovery plan that includes manual restoration of instances from backup in the event of a failure","Generate an Amazon Machine Image (AMI) for each legacy server. Launch two EC2 instances from this AMI, placing one instance in each of two different Availability Zones. Set up a Network Load Balancer (NLB) to route traffic to the instances and to monitor instance health for automatic traffic redirection in case of failure"],"ans":[3],"notes":["Chỉ 1 instance; tự dựng lại nhưng có downtime → chưa fault tolerant.","Vi phạm ràng buộc cứng 'cannot be containerized'; Fargate cũng không phải EC2.","Backup/DR, không phải HA; restore thủ công.","2 instance chạy song song ở 2 AZ; NLB chuyển traffic ngay."],"pattern":"Ràng buộc cứng loại đáp án","why":"Không sửa app, chạy EC2, fault tolerant → ≥ 2 instance song song ở ≥ 2 AZ + LB.","trap":"Đáp án 'hiện đại' nhưng trái ràng buộc của đề.","tip":"So với Q33: Q33 bắt buộc 1 instance + cost → ASG 1/1/1. Q39 cần fault tolerance → 2 instance song song.","old":52,"you1":[1],"you2":[3],"q_short":"Legacy workloads are tightly coupled to their OS and cannot be containerized or re-architected; they will run on EC2 unchanged. The solution must be highly available and fault tolerant. What meets this?"},{"id":40,"domain":"cost","topic":"Dedicated Hosts (BYOL)","q":"A financial services company is looking to move its on-premises IT infrastructure to AWS Cloud. The company has multiple long-term server bound licenses across the application stack and the CTO wants to continue to utilize those licenses while moving to AWS.\nAs a solutions architect, which of the following would you recommend as the MOST cost-effective solution?","opts":["Use Amazon EC2 reserved instances (RI)","Use Amazon EC2 dedicated instances","Use Amazon EC2 dedicated hosts","Use Amazon EC2 on-demand instances"],"ans":[2],"you2":[2],"notes":["Mô hình thanh toán, không cho thấy socket/core vật lý.","Phần cứng riêng nhưng không thấy socket/core, không dùng được license gắn server.","Thấy socket/core, dùng lại license gắn server (BYOL).","Shared tenancy."],"pattern":"Lọc ràng buộc cứng → chi phí","why":"License gắn với server vật lý → Dedicated Hosts.","trap":"Nhầm với Q56 (chỉ cần single-tenant → Dedicated Instances).","tip":"Single-tenant + rẻ → Dedicated Instances. BYOL theo socket/core → Dedicated Hosts.","old":null,"you1":null,"q_short":"A company has long-term server-bound software licenses and wants to keep using them on AWS. What is MOST cost-effective?"},{"id":41,"domain":"sec","topic":"Transit Gateway","q":"A company has many Amazon Virtual Private Cloud (Amazon VPC) in various accounts, that need to be connected in a star network with one another and connected with on-premises networks through AWS Direct Connect.\nWhat do you recommend?","opts":["Virtual private gateway (VGW)","VPC Peering Connection","AWS Transit Gateway","AWS PrivateLink"],"ans":[2],"notes":["Endpoint VPN/DX cho một VPC, không làm hub.","1-1, không transitive, cần N(N-1)/2 kết nối.","Hub trung tâm, định tuyến transitive giữa nhiều VPC và on-prem.","Expose một service, không nối mạng giữa các VPC."],"pattern":"Chọn dịch vụ kết nối theo topology","why":"Many VPCs + star + transitive + on-prem = Transit Gateway.","trap":"VPC Peering không transitive.","tip":"2 VPC → Peering. Nhiều VPC + on-prem → TGW. Chia sẻ 1 service / CIDR trùng → PrivateLink. 1 DX → nhiều VPC/Region → DX Gateway.","old":34,"you1":[2],"you2":[2],"q_short":"A company has many VPCs across accounts that must connect in a star (hub-and-spoke) network with each other and with on-premises via Direct Connect. What do you recommend?"},{"id":42,"domain":"res","topic":"Read spikes: CloudFront + Aurora Replica","multi":true,"q":"A company manages a multi-tier social media application that runs on Amazon Elastic Compute Cloud (Amazon EC2) instances behind an Application Load Balancer. The instances run in an Amazon EC2 Auto Scaling group across multiple Availability Zones (AZs) and use an Amazon Aurora database. As an AWS Certified Solutions Architect – Associate, you have been tasked to make the application more resilient to periodic spikes in read request rates.\nWhich of the following solutions would you recommend for the given use-case? (Select two)","opts":["Use Amazon Aurora Replica","Use AWS Shield","Use Amazon CloudFront distribution in front of the Application Load Balancer","Use AWS Direct Connect","Use AWS Global Accelerator"],"ans":[0,2],"notes":["Chia tải đọc ở tầng DB qua reader endpoint.","Chống DDoS, không xử lý spike traffic hợp lệ.","Cache ở edge, giảm request chạm tới origin.","Đường riêng on-prem ↔ AWS, không liên quan.","Không có cache; mọi request vẫn tới backend."],"pattern":"Giảm tải đọc theo từng tầng","why":"Edge: CloudFront cache. DB: Aurora Replica.","trap":"Global Accelerator tăng tốc mạng nhưng không cache.","tip":"GA: static IP, TCP/UDP, failover nhanh multi-Region, game/IoT/VoIP. CloudFront: cache HTTP, giảm tải origin.","old":39,"you1":[0,4],"you2":[0,2],"q_short":"A multi-tier app (ALB → EC2 ASG multi-AZ → Aurora) must be more resilient to periodic spikes in read requests. Which TWO solutions?"},{"id":43,"domain":"sec","topic":"Public/private subnet placement","q":"A company is deploying a publicly accessible web application. To accomplish this, the engineering team has designed the VPC with a public subnet and a private subnet. The application will be hosted on several Amazon EC2 instances in an Auto Scaling group. The team also wants Transport Layer Security (TLS) termination to be offloaded from the Amazon EC2 instances.\nWhich solution should a solutions architect imp
