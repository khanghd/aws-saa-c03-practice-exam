<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Test 5 · SAA-C03</title>
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#eef0f5; --text:#1a1d23; --muted:#646c78;
  --border:#dfe3ea; --accent:#3a5bf0; --accent-hover:#2d49d6; --accent-soft:#e8edfe;
  --ok:#1a8f55; --ok-soft:#e4f6ec; --bad:#d13b3b; --bad-soft:#fcebeb; --warn:#b4790a; --warn-soft:#fff3db;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
    --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
    --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
    --shadow:none; --shadow-sm:none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
  --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
  --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
  --shadow:none; --shadow-sm:none;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.65 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .2s ease,color .2s ease;
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);padding:.1em .4em;border-radius:5px}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 56px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
header.top h1{
  font-size:21px;margin:0;letter-spacing:-.015em;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent-hover));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
header.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:7px 14px;min-width:76px;text-align:center;box-shadow:var(--shadow-sm);transition:border-color .15s ease,transform .15s ease}
.stat:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hover));width:0;transition:width .3s ease}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:16px}
.toolbar select,.btn{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 13px;cursor:pointer;transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent}
.toolbar label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.layout{display:grid;grid-template-columns:264px 1fr;gap:18px;align-items:start}
.side{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;position:sticky;top:14px;box-shadow:var(--shadow)}
.side h2{font-size:12.5px;margin:0 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.cell{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;height:32px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums;position:relative;padding:0;transition:border-color .12s ease,transform .12s ease,background .12s ease}
.cell:hover{border-color:var(--accent);transform:translateY(-1px)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell.dim{opacity:.32}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cell.sup{font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--border);background:var(--surface-2)}
.legend .l-ok::before{background:var(--ok-soft);border-color:var(--ok)}
.legend .l-bad::before{background:var(--bad-soft);border-color:var(--bad)}
.legend .l-flag::before{background:var(--warn);border-radius:50%;border:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.qnum{font-weight:700;font-size:17px;letter-spacing:-.01em}
.chip{font-size:12px;padding:3px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;transition:transform .12s ease}
.chip.sup{background:var(--warn-soft);color:var(--warn)}
.chip.multi{background:var(--surface-2);color:var(--muted);font-weight:500}
.flagbtn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:13px;transition:border-color .15s ease,background .15s ease,transform .15s ease}
.flagbtn:hover{border-color:var(--warn);color:var(--warn);transform:translateY(-1px)}
.flagbtn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.stem{line-height:1.7}
.stem p{margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;padding:11px 13px;cursor:pointer;background:var(--surface);transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.opt:hover{border-color:var(--accent);transform:translateX(2px);box-shadow:var(--shadow-sm)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--surface-2);transition:background .15s ease,border-color .15s ease,color .15s ease}
.opt.multi .key{border-radius:7px}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--border);transform:none;box-shadow:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.tag{font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)} .opt.missed .tag{color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .spacer{flex:1}
.verdict{margin:18px 0 6px;padding:11px 15px;border-radius:11px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.hint{margin-top:16px;border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:9px;padding:11px 15px;background:var(--surface-2)}
.hint h3{margin:0 0 6px;font-size:14px;color:var(--warn)}
details.sec{border:1px solid var(--border);border-radius:11px;margin-top:11px;background:var(--surface);transition:border-color .15s ease}
details.sec>summary{cursor:pointer;padding:11px 15px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"›";display:inline-block;transition:transform .15s ease;color:var(--muted);font-size:18px;line-height:1}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec .body{padding:0 16px 14px}
.body p{margin:7px 0}
.body ul,.body ol{margin:7px 0;padding-left:22px}
.body li{margin:4px 0}
.body table{border-collapse:collapse;width:100%;margin:9px 0;font-size:14px;display:block;overflow-x:auto}
.body th,.body td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
.body th{background:var(--surface-2)}
.sec.s-answer{border-left:3px solid var(--ok)}
.sec.s-tip{border-left:3px solid var(--accent)}
.empty{color:var(--muted);text-align:center;padding:44px 10px}
.kbd{font-size:12px;color:var(--muted);margin-top:14px}
.kbd kbd{font-family:inherit;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface-2)}
.summary h2{margin-top:0}
.summary table{border-collapse:collapse;width:100%;font-size:14px}
.summary th,.summary td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left}
.summary td.n{font-variant-numeric:tabular-nums;text-align:right}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s ease}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .grid{grid-template-columns:repeat(10,1fr)}
}
@media (max-width:480px){
  .wrap{padding:14px 16px 40px}
  .card{padding:16px}
  .grid{grid-template-columns:repeat(8,1fr)}
  .stat{min-width:64px;padding:5px 10px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>AWS SAA-C03 · Practice Test 5 (65 câu)</h1>
      <div class="sub">Đề tiếng Anh · Giải thích tiếng Việt · Tiến độ chỉ lưu trong phiên đang mở</div>
    <p style="margin:4px 0 0"><a href="../index.html" style="color:var(--accent)">&larr; Về trang luyện đề chính</a></p>
    </div>
    <div class="stats">
      <div class="stat"><b id="sDone">0</b><span>Đã làm</span></div>
      <div class="stat ok"><b id="sOk">0</b><span>Đúng</span></div>
      <div class="stat bad"><b id="sBad">0</b><span>Sai</span></div>
      <div class="stat"><b id="sPct">–</b><span>Tỷ lệ đúng</span></div>
    </div>
  </header>
  <div class="progress"><i id="prog"></i></div>

  <div class="toolbar">
    <select id="fFilter" aria-label="Lọc câu hỏi">
      <option value="all">Tất cả câu</option>
      <option value="todo">Chưa làm</option>
      <option value="bad">Làm sai</option>
      <option value="flag">Đã đánh dấu</option>
    </select>
    <select id="fTopic" aria-label="Lọc theo chủ đề"><option value="">Mọi chủ đề</option></select>
    <label><input type="checkbox" id="optShuffleQ"> Xáo câu hỏi</label>
    <label><input type="checkbox" id="optShuffleA"> Xáo đáp án</label>
    <label><input type="checkbox" id="optAuto" checked> Hiện giải thích sau khi kiểm tra</label>
    <span style="flex:1"></span>
    <button class="btn" id="btnSummary">Xem kết quả</button>
    <button class="btn ghost" id="btnReset">Làm lại</button>
    <button class="btn ghost" id="btnTheme" title="Đổi giao diện sáng/tối">◐</button>
  </div>

  <div class="layout">
    <aside class="side">
      <h2>Danh sách câu</h2>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span class="l-ok">Đúng</span><span class="l-bad">Sai</span><span>Chưa làm</span><span class="l-flag">Đánh dấu</span>
      </div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<script>
const Q = [{"id":1,"topic":"Design High-Performing Architectures – EC2 Purchasing Options (RI + Spot)","supplement":false,"stem":"A financial data processing company runs a workload on Amazon EC2 instances that fetch and process real-time transaction batches from an Amazon SQS queue. The application needs to scale based on unpredictable message volume, which fluctuates significantly throughout the day. The system must process messages with minimal delay and no downtime, even during peak spikes. The company is seeking a solution that balances cost-efficiency with availability and elasticity.<br>Which EC2 purchasing strategy best meets these requirements in the most cost-effective manner?","options":[{"html":"Use EC2 Spot Instances exclusively with Auto Scaling enabled to match message volume fluctuations and save on compute costs","correct":false},{"html":"Use EC2 Reserved Instances for the baseline workload and configure EC2 Auto Scaling to launch On-Demand Instances for all traffic spikes","correct":false},{"html":"Use Reserved Instances for the baseline level of traffic and configure EC2 Auto Scaling with Spot Instances to handle spikes in message volume","correct":true},{"html":"Purchase EC2 Reserved Instances to match peak capacity and assign all message processing tasks to these instances regardless of load variations","correct":false}],"multi":1,"analysis":"<p>Chọn chiến lược mua EC2 theo đặc tính tải (ổn định + biến động)</p>","answer":"<p>RI phủ baseline ổn định, Spot xử lý phần biến động với giá rẻ hơn On-Demand nhiều.</p>","explain":"<ul><li><b>A. ✗</b> Spot có thể bị thu hồi, rủi ro downtime cho xử lý real-time, liên tục.</li><li><b>B. ✗</b> On-Demand cho spike đắt hơn Spot, không tối ưu chi phí.</li><li><b>C. ✓</b> RI baseline + Spot spike: cân bằng chi phí và khả dụng.</li><li><b>D. ✗</b> RI theo peak capacity khiến lãng phí lúc tải thấp, không co giãn.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> RI phủ peak nghe 'an toàn' nhưng cực kỳ lãng phí vì tải không phải lúc nào cũng peak.</p>","tip":"<p>Baseline ổn định → RI/Savings Plans. Biến động, chịu gián đoạn → Spot. Biến động, không chịu gián đoạn → On-Demand.</p>"},{"id":2,"topic":"Design High-Performing Architectures – EC2 Instance Connect","supplement":false,"stem":"A DevOps team is tasked with enabling secure and temporary SSH access to Amazon EC2 instances for developers during deployments. The team wants to avoid distributing long-term SSH key pairs and instead prefers ephemeral access that can be audited and revoked immediately after the session ends. The team wants direct access via the AWS Management Console.<br>What do you recommend?","options":[{"html":"Use EC2 Instance Connect with Systems Manager Agent disabled, and connect via private IP using an internal proxy endpoint","correct":false},{"html":"Use EC2 Instance Connect to inject a static SSH key and connect via the instance's private IP address directly from the internet","correct":false},{"html":"Use an EC2 Instance Connect Endpoint to reach the instances even though they already have public IP addresses, because Instance Connect requires an endpoint for all SSH sessions","correct":false},{"html":"Use EC2 Instance Connect to inject a temporary public key and establish SSH access using the instance’s public IP address","correct":true}],"multi":1,"analysis":"<p>Phân biệt 3 cách truy cập SSH: Instance Connect / EIC Endpoint / SSM Session Manager</p>","answer":"<p>Có public IP → Instance Connect kết nối trực tiếp qua internet, tiêm public key tạm thời.</p>","explain":"<ul><li><b>A. ✗</b> Instance Connect không hỗ trợ private IP nếu không có SSM Agent + Session Manager.</li><li><b>B. ✗</b> Instance Connect dùng key tạm thời một lần, không dùng static key.</li><li><b>C. ✗</b> Instance đã có public IP thì không cần EIC Endpoint, chỉ thêm overhead/chi phí.</li><li><b>D. ✓</b> Public IP + public key tạm thời do Instance Connect tiêm vào lúc kết nối.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Nhầm EIC Endpoint là bắt buộc cho mọi phiên SSH — thực ra chỉ cần khi KHÔNG có public IP.</p>","tip":"<p>Public IP → EC2 Instance Connect trực tiếp. Private IP, không public IP → EC2 Instance Connect Endpoint hoặc SSM Session Manager (cần SSM Agent).</p>"},{"id":3,"topic":"Design High-Performing Architectures – ElastiCache Redis vs Memcached","supplement":false,"stem":"The engineering team at a weather tracking company wants to enhance the performance of its relational database and is looking for a caching solution that supports geospatial data.<br>As a solutions architect, which of the following solutions will you suggest?","options":[{"html":"Use Amazon ElastiCache for Memcached","correct":false},{"html":"Use AWS Global Accelerator","correct":false},{"html":"Use Amazon DynamoDB Accelerator (DAX)","correct":false},{"html":"Use Amazon ElastiCache for Redis","correct":true}],"multi":1,"analysis":"<p>Chọn dịch vụ cache theo tính năng đặc thù (geospatial)</p>","answer":"<p>Redis có bộ lệnh geospatial dựng sẵn, Memcached thì không.</p>","explain":"<ul><li><b>A. ✗</b> Memcached không hỗ trợ geospatial.</li><li><b>B. ✗</b> Global Accelerator là dịch vụ mạng, không phải cache.</li><li><b>C. ✗</b> DAX chỉ cache cho DynamoDB, không phải RDS.</li><li><b>D. ✓</b> Redis có lệnh geospatial chuyên dụng (tính khoảng cách, tìm trong bán kính).</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Global Accelerator nghe liên quan đến 'tăng tốc' nhưng không phải caching.</p>","tip":"<p>Redis/Valkey: persistence, geospatial, sorted set, pub/sub. Memcached: đơn giản, đa luồng, không có các tính năng này.</p>"},{"id":4,"topic":"Design Secure Architectures – AWS WAF","supplement":false,"stem":"A global media company uses a fleet of Amazon EC2 instances (behind an Application Load Balancer) to power its video streaming application. To improve the performance of the application, the engineering team has also created an Amazon CloudFront distribution with the Application Load Balancer as the custom origin. The security team at the company has noticed a spike in the number and types of SQL injection and cross-site scripting attack vectors on the application.<br>As a solutions architect, which of the following solutions would you recommend as the MOST effective in countering these malicious attacks?","options":[{"html":"Use AWS Firewall Manager with CloudFront distribution","correct":false},{"html":"Use AWS Web Application Firewall (AWS WAF) with Amazon CloudFront distribution","correct":true},{"html":"Use Amazon Route 53 with Amazon CloudFront distribution","correct":false},{"html":"Use AWS Security Hub with Amazon CloudFront distribution","correct":false}],"multi":1,"analysis":"<p>Chọn dịch vụ bảo mật đúng chức năng chặn tấn công lớp ứng dụng</p>","answer":"<p>WAF có rule chuyên biệt để chặn SQL injection và XSS ở web ACL.</p>","explain":"<ul><li><b>A. ✗</b> Firewall Manager chỉ quản lý rule tập trung, không tự chặn SQLi/XSS.</li><li><b>B. ✓</b> WAF gắn vào CloudFront, có rule chặn SQLi/XSS trực tiếp.</li><li><b>C. ✗</b> Route 53 là DNS, không liên quan tới lọc request.</li><li><b>D. ✗</b> Security Hub chỉ tổng hợp finding, không chủ động chặn.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Security Hub/Firewall Manager nghe 'bảo mật' nhưng không trực tiếp chặn request độc hại.</p>","tip":"<p>SQLi/XSS, bot, rate-limit → WAF. DDoS L3/L4 → Shield. Quản lý rule nhiều account → Firewall Manager. Tổng hợp finding → Security Hub.</p>"},{"id":5,"topic":"Design High-Performing Architectures – EBS Fast Snapshot Restore","supplement":false,"stem":"A financial analytics firm runs performance-intensive modeling software on Amazon EC2 instances backed by Amazon EBS volumes. The production data resides on EBS volumes attached to EC2 instances in the same AWS Region where the testing environment is hosted. To maintain data integrity, any changes made during testing must not affect production data. The development team needs to frequently create clones of this production data for simulations. The modeling software requires high and consistent I/O performance, and the firm wants to minimize the time required to provision test data.<br>Which solution should a solutions architect recommend to meet these requirements?","options":[{"html":"Take snapshots of the production EBS volumes. Enable EBS fast snapshot restore on the snapshots. Create new EBS volumes from the snapshots and attach them to EC2 instances in the test environment","correct":true},{"html":"Create Amazon EBS-backed Amazon Machine Images (AMIs) from the production EC2 instances. Launch new EC2 instances in the test environment from the AMIs. Use Amazon EC2 instance store volumes for temporary simulation data","correct":false},{"html":"Create new EBS volumes in the test environment and use AWS Backup to perform a backup job of the production volumes. Restore the backup directly to the test EBS volumes to begin simulations","correct":false},{"html":"Use Amazon EBS io2 volumes with Multi-Attach enabled. Attach the same production EBS volumes to both the production and test EC2 instances simultaneously to avoid cloning delays and ensure high IOPS performance","correct":false}],"multi":1,"analysis":"<p>Clone dữ liệu nhanh, hiệu năng cao, cách ly test khỏi production</p>","answer":"<p>FSR loại bỏ độ trễ 'làm nóng' volume mới tạo từ snapshot, đạt IOPS đầy đủ ngay lập tức.</p>","explain":"<ul><li><b>A. ✓</b> Snapshot + Fast Snapshot Restore: tạo volume mới đạt full performance ngay, không delay khởi tạo, cô lập dữ liệu test khỏi production.</li><li><b>B. ✗</b> AMI dùng để nhân bản instance để khởi động, không tối ưu cho clone dữ liệu lớn lặp lại; instance store mất dữ liệu khi dừng.</li><li><b>C. ✗</b> AWS Backup thiết kế cho backup/compliance, restore chậm hơn so với snapshot + FSR.</li><li><b>D. ✗</b> io2 Multi-Attach dùng chung 1 volume giữa 2 instance, rủi ro ghi đè dữ liệu production.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Multi-Attach nghe như giải pháp nhanh gọn nhưng lại chia sẻ CÙNG một volume, vi phạm yêu cầu cách ly.</p>","tip":"<p>Clone nhanh + hiệu năng đầy đủ ngay = Snapshot + Fast Snapshot Restore. AWS Backup/AMI chậm hơn cho mục đích này.</p>"},{"id":6,"topic":"Design High-Performing Architectures – AWS Global Accelerator","supplement":false,"stem":"An application with global users across AWS Regions had suffered an issue when the Elastic Load Balancing (ELB) in a Region malfunctioned thereby taking down the traffic with it. The manual intervention cost the company significant time and resulted in major revenue loss.<br>What should a solutions architect recommend to reduce internet latency and add automatic failover across AWS Regions?","options":[{"html":"Set up an Amazon Route 53 geoproximity routing policy to route traffic","correct":false},{"html":"Set up AWS Global Accelerator and add endpoints to cater to users in different geographic locations","correct":true},{"html":"Set up AWS Direct Connect as the backbone for each of the AWS Regions where the application is deployed","correct":false},{"html":"Create Amazon S3 buckets in different AWS Regions and configure Amazon CloudFront to pick the nearest edge location to the user","correct":false}],"multi":1,"analysis":"<p>Giảm latency toàn cầu + tự động failover đa Region cho traffic TCP/UDP</p>","answer":"<p>Global Accelerator cung cấp IP tĩnh anycast và tự động điều hướng sang endpoint khỏe khi 1 Region lỗi.</p>","explain":"<ul><li><b>A. ✗</b> Geoproximity định tuyến theo vị trí nhưng không tự động failover nhanh, overhead quản lý cao khi nhiều resource.</li><li><b>B. ✓</b> Global Accelerator: 2 IP tĩnh anycast, tự động failover endpoint lỗi trong vài giây.</li><li><b>C. ✗</b> Direct Connect dùng cho kết nối on-prem, không phục vụ người dùng trực tiếp.</li><li><b>D. ✗</b> S3 + CloudFront chỉ tối ưu nội dung tĩnh, không bao phủ ELB/EC2 cần failover.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Route 53 routing policy nghe hợp lý nhưng không có cơ chế failover nhanh bằng network layer như Global Accelerator.</p>","tip":"<p>Tăng tốc + failover toàn cầu cho TCP/UDP non-HTTP → Global Accelerator. Nội dung tĩnh/cache → CloudFront.</p>"},{"id":7,"topic":"Design Resilient Architectures – SQS + Auto Scaling scaling metric","supplement":false,"stem":"A logistics company runs a two-step job handling process on AWS. The first step quickly receives job submissions from clients, while the second step requires longer processing time to complete each job. Currently, both steps run on separate Amazon EC2 Auto Scaling groups. However, during high-demand hours, the job processing stage falls behind, and there is concern that jobs may be lost due to instance termination during scaling events. A solutions architect needs to design a more scalable and reliable architecture that preserves job data and accommodates fluctuating demand in both stages.<br>Which solution will meet these requirements?","options":[{"html":"Set up two Amazon SQS queues to decouple the job intake and job processing stages respectively. Assign one SQS queue to collect incoming jobs, and another to queue them for processing. Configure the EC2 instances to poll the relevant queue. Scale the Auto Scaling groups based on number of messages in each queue","correct":true},{"html":"Set up two Amazon SQS queues to decouple the job intake and job processing stages respectively. Assign one SQS queue to collect incoming jobs, and another to queue them for processing. Configure the EC2 instances to poll the relevant queue. Scale the Auto Scaling groups based on notifications from each queue","correct":false},{"html":"Configure each Auto Scaling group to maintain its maximum expected size during peak hours by setting a fixed minimum capacity. Monitor CPUUtilization through Amazon CloudWatch to ensure consistent scaling behavior","correct":false},{"html":"Set up a single Amazon SQS queue for both the job intake and job processing stages. Assign the SQS queue to collect incoming jobs as well as processing jobs. Configure all EC2 instances to poll this queue. Scale the Auto Scaling groups based on number of messages in the queue","correct":false}],"multi":1,"analysis":"<p>Decouple 2 giai đoạn xử lý khác tốc độ bằng 2 hàng đợi riêng</p>","answer":"<p>Mỗi giai đoạn có queue riêng, ASG scale theo ApproximateNumberOfMessages của từng queue.</p>","explain":"<ul><li><b>A. ✓</b> 2 queue tách biệt, scale ASG theo số message mỗi queue — đúng pattern decouple + autoscale theo tải thực.</li><li><b>B. ✗</b> SQS không có cơ chế gửi 'notification' khi có message mới để trigger scale.</li><li><b>C. ✗</b> Fixed capacity theo CPU không linh hoạt, không ngừa mất dữ liệu khi instance bị terminate giữa chừng.</li><li><b>D. ✗</b> Gộp 2 loại message khác bản chất (intake nhanh, process chậm) vào 1 queue khó phân biệt, khó scale riêng.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Gộp chung 1 queue nghe đơn giản nhưng làm mất khả năng scale độc lập 2 giai đoạn khác tải.</p>","tip":"<p>SQS không hỗ trợ notification trực tiếp cho producer — scale theo số message trong queue (CloudWatch metric), không phải theo 'notification'.</p>"},{"id":8,"topic":"Design Secure Architectures – Site-to-Site VPN vs Direct Connect","supplement":false,"stem":"A retail company wants to establish encrypted network connectivity between its on-premises data center and AWS Cloud. The company wants to get the solution up and running in the fastest possible time and it should also support encryption in transit.<br>As a solutions architect, which of the following solutions would you suggest to the company?","options":[{"html":"Use AWS Data Sync to establish encrypted network connectivity between the on-premises data center and AWS Cloud","correct":false},{"html":"Use AWS Secrets Manager to establish encrypted network connectivity between the on-premises data center and AWS Cloud","correct":false},{"html":"Use AWS Site-to-Site VPN to establish encrypted network connectivity between the on-premises data center and AWS Cloud","correct":true},{"html":"Use AWS Direct Connect to establish encrypted network connectivity between the on-premises data center and AWS Cloud","correct":false}],"multi":1,"analysis":"<p>Kết nối mã hóa on-prem ↔ AWS, ưu tiên tốc độ triển khai</p>","answer":"<p>Site-to-Site VPN dùng IPSec mã hóa sẵn và lên nhanh, phù hợp yêu cầu 'nhanh nhất + có mã hóa'.</p>","explain":"<ul><li><b>A. ✗</b> DataSync dùng để chuyển dữ liệu, không thiết lập kết nối mạng.</li><li><b>B. ✗</b> Secrets Manager quản lý secret, không liên quan kết nối mạng.</li><li><b>C. ✓</b> Site-to-Site VPN dùng IPSec, mã hóa, thiết lập nhanh (vài giờ).</li><li><b>D. ✗</b> Direct Connect KHÔNG tự mã hóa traffic, và mất vài tuần để thiết lập.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Direct Connect nghe 'xịn' hơn nhưng mặc định KHÔNG mã hóa và chậm thiết lập.</p>","tip":"<p>Cần nhanh + có mã hóa → Site-to-Site VPN. Cần băng thông ổn định, không yêu cầu mã hóa gấp → Direct Connect (phải tự thêm VPN/MACsec để mã hóa).</p>"},{"id":9,"topic":"Design Secure Architectures – VPC routing & NACL for Internet access","supplement":false,"stem":"While troubleshooting, a cloud architect realized that the Amazon EC2 instance is unable to connect to the internet using the Internet Gateway.<br>Which conditions should be met for internet connectivity to be established? (Select two)","options":[{"html":"The instance's subnet is associated with multiple route tables with conflicting configurations","correct":false},{"html":"The route table in the instance’s subnet should have a route to an Internet Gateway","correct":true},{"html":"The instance's subnet is not associated with any route table","correct":false},{"html":"The subnet has been configured to be public and has no access to the internet","correct":false},{"html":"The network access control list (network ACL) associated with the subnet must have rules to allow inbound and outbound traffic","correct":true}],"multi":2,"analysis":"<p>Điều kiện để EC2 ra internet qua Internet Gateway: route + NACL</p>","answer":"<p>Cần route table có route 0.0.0.0/0 → IGW, và NACL (stateless) phải mở cả 2 chiều.</p>","explain":"<ul><li><b>A. ✗</b> Một subnet chỉ gắn với MỘT route table tại một thời điểm, không có khái niệm 'conflict' giữa nhiều route table.</li><li><b>B. ✓</b> Phải có route trỏ tới Internet Gateway thì traffic đi internet mới có đường ra.</li><li><b>C. ✗</b> Subnet luôn có route table (mặc định dùng main route table nếu không gắn route table riêng).</li><li><b>D. ✗</b> Câu phát biểu tự mâu thuẫn: 'subnet public' nghĩa là có đường ra internet.</li><li><b>E. ✓</b> NACL phải cho phép traffic 2 chiều (inbound/outbound) do bản chất stateless.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các phát biểu phủ định/mâu thuẫn (ví dụ 'subnet không gắn route table nào') đánh vào hiểu sai về route table mặc định.</p>","tip":"<p>Checklist internet ra/vào: route table → IGW, NACL 2 chiều, Security Group (stateful, chỉ cần allow 1 chiều), và instance phải có public/Elastic IP.</p>"},{"id":10,"topic":"Design Resilient Architectures – Systems Manager Automation - patch behind ALB","supplement":false,"stem":"A digital media company runs its content rendering service on Amazon EC2 instances that are registered with an Application Load Balancer (ALB) using IP-based target groups. The company relies on AWS Systems Manager to manage and patch these instances regularly. According to new compliance requirements, EC2 instances must be safely removed from production traffic during patching to prevent user disruption and maintain application integrity. However, during the most recent patch cycle, the operations team noticed application failures and API timeouts, even though patching succeeded on the instances. You are asked to suggest a reliable and scalable way to ensure safe patching while preserving service availability.<br>Which solution will best meet the new compliance and operational requirements? (Select two)","options":[{"html":"Configure Systems Manager Maintenance Windows to coordinate patching and instance removal from the ALB during the defined window","correct":true},{"html":"Configure a custom Lambda function triggered by an Amazon EventBridge rule that disables the EC2 instance's network interface during the patching window and re-enables it after patching completes","correct":false},{"html":"Use Amazon CloudWatch Logs Insights to monitor patching success and then manually adjust ALB target group registrations before and after each patch window","correct":false},{"html":"Modify the load balancer configuration to attach EC2 instances using instance ID-based target groups instead of IP-based targets, allowing Systems Manager to directly communicate with instance metadata","correct":false},{"html":"Use AWS Systems Manager Automation with the AWSEC2-PatchLoadBalancerInstance document to manage patching","correct":true}],"multi":2,"analysis":"<p>Patch an toàn instance đứng sau ALB mà không gây downtime</p>","answer":"<p>Document chuyên dụng AWSEC2-PatchLoadBalancerInstance tự động hoá toàn bộ quy trình gỡ–patch–đăng ký lại; Maintenance Windows điều phối lịch chạy nó.</p>","explain":"<ul><li><b>A. ✓</b> Maintenance Windows lên lịch chạy Automation document (bao gồm cả AWSEC2-PatchLoadBalancerInstance) đúng thời điểm, có điều phối gỡ/khôi phục khỏi ALB.</li><li><b>B. ✗</b> Tắt network interface sẽ cắt luôn kết nối tới SSM Agent → patch thất bại hoặc instance kẹt trạng thái lỗi.</li><li><b>C. ✗</b> Theo dõi qua Logs Insights rồi chỉnh tay target group không tự động, dễ sai sót, không scale.</li><li><b>D. ✗</b> Đổi sang instance-ID target group không giải quyết gốc rễ (vấn đề là traffic trong lúc patch, không phải cách SSM giao tiếp).</li><li><b>E. ✓</b> Document AWSEC2-PatchLoadBalancerInstance tự gỡ khỏi ALB, chờ request xong, patch, rồi đăng ký lại.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các giải pháp 'tự chế' (tắt ENI, theo dõi log rồi chỉnh tay) nghe sáng tạo nhưng rủi ro hoặc không scale.</p>","tip":"<p>Patch instance sau ELB an toàn = Automation runbook AWSEC2-PatchLoadBalancerInstance (+ Maintenance Windows để lên lịch).</p>"},{"id":11,"topic":"Design High-Performing Architectures – DynamoDB Global Tables","supplement":false,"stem":"A global e-commerce platform currently operates its order processing system in a single on-premises data center located in Europe. As the company grows its customer base across Asia and North America, it plans to deploy the application across multiple AWS Regions to improve availability and reduce latency. The company requires that updates to the central order database be completed in under one second with global consistency. The application layer will be deployed separately in each Region, but the order management data must remain centrally managed and globally synchronized.<br>Which solution should a solutions architect recommend to meet these requirements?","options":[{"html":"Use Amazon Aurora database with MySQL engine, and configure read-only nodes in other Regions to handle local traffic while routing all write operations to the central Region","correct":false},{"html":"Migrate the order data to Amazon DynamoDB and create a global table. Deploy the application in each Region and connect to the local DynamoDB replica for low-latency access","correct":true},{"html":"Use Amazon RDS for MySQL with a cross-Region read replica. Route all writes to the primary Region and use read replicas for local access in other Regions","correct":false},{"html":"Use Amazon Neptune to store tracking updates as graph data. Deploy clusters in each Region and replicate changes using custom-built Lambda functions and Amazon SQS.","correct":false}],"multi":1,"analysis":"<p>Ghi toàn cầu độ trễ thấp, nhất quán, không cần tự xây replication</p>","answer":"<p>DynamoDB Global Tables cho phép ghi tại local replica ở mỗi Region, tự động đồng bộ 2 chiều.</p>","explain":"<ul><li><b>A. ✗</b> Aurora Global Database chỉ đọc được ở secondary Region, ghi vẫn phải về Region chính → không đạt yêu cầu ghi toàn cầu &lt;1s.</li><li><b>B. ✓</b> Global Tables: multi-active, mỗi Region đọc/ghi local, replicate &lt;1s.</li><li><b>C. ✗</b> RDS cross-Region Read Replica: ghi vẫn tập trung 1 Region, replicate async có độ trễ.</li><li><b>D. ✗</b> Neptune không hỗ trợ multi-Region sẵn, phải tự xây replication phức tạp.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các giải pháp dựa trên RDS/Aurora luôn có một Region 'chính' nhận ghi — không đáp ứng yêu cầu ghi real-time ở mọi Region.</p>","tip":"<p>Cần multi-Region, multi-writer, độ trễ ghi thấp → DynamoDB Global Tables. RDS/Aurora Global DB chỉ multi-Region cho READ.</p>"},{"id":12,"topic":"Design High-Performing Architectures – CloudFront & S3 Transfer Acceleration","supplement":false,"stem":"Reporters at a news agency upload/download video files (about 500 megabytes each) to/from an Amazon S3 bucket as part of their daily work. As the agency has started offices in remote locations, it has resulted in poor latency for uploading and accessing data to/from the given Amazon S3 bucket. The agency wants to continue using a serverless storage solution such as Amazon S3 but wants to improve the performance.<br>As a solutions architect, which of the following solutions do you propose to address this issue? (Select two)","options":[{"html":"Spin up Amazon EC2 instances in each region where the agency has a remote office. Create a daily job to transfer Amazon S3 data into Amazon EBS volumes attached to the Amazon EC2 instances","correct":false},{"html":"Create new Amazon S3 buckets in every region where the agency has a remote office, so that each office can maintain its storage for the media assets","correct":false},{"html":"Use Amazon CloudFront distribution with origin as the Amazon S3 bucket. This would speed up uploads as well as downloads for the video files","correct":true},{"html":"Move Amazon S3 data into Amazon Elastic File System (Amazon EFS) created in a US region, connect to Amazon EFS file system from Amazon EC2 instances in other AWS regions using an inter-region VPC peering connection","correct":false},{"html":"Enable Amazon S3 Transfer Acceleration (Amazon S3TA) for the Amazon S3 bucket. This would speed up uploads as well as downloads for the video files","correct":true}],"multi":2,"analysis":"<p>Tăng tốc upload/download S3 cho văn phòng xa, vẫn giữ serverless</p>","answer":"<p>CloudFront và S3TA đều tận dụng mạng edge toàn cầu của AWS để rút ngắn đường truyền tới S3.</p>","explain":"<ul><li><b>A. ✗</b> Dùng EC2+EBS làm trung gian không còn là giải pháp serverless, thêm vận hành.</li><li><b>B. ✗</b> Yêu cầu lưu trữ tập trung, không phải tạo bucket ở mỗi vùng.</li><li><b>C. ✓</b> CloudFront cache &amp; tăng tốc cả upload/download qua edge location.</li><li><b>D. ✗</b> EFS + VPC peering không phải storage serverless theo đúng yêu cầu đề bài.</li><li><b>E. ✓</b> S3 Transfer Acceleration dùng mạng CloudFront để tăng tốc truyền file lớn khoảng cách xa.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các phương án dùng thêm EC2/EFS nghe hợp lý nhưng vi phạm yêu cầu 'serverless storage'.</p>","tip":"<p>Tăng tốc truy cập S3 từ xa: CloudFront (cache phục vụ) hoặc S3 Transfer Acceleration (đường truyền nhanh hơn tới S3), có thể dùng cùng lúc.</p>"},{"id":13,"topic":"Design Secure Architectures – Transit Gateway vs VPC Peering","supplement":false,"stem":"The infrastructure team at a company maintains 5 different VPCs (let's call these VPCs A, B, C, D, E) for resource isolation. Due to the changed organizational structure, the team wants to interconnect all VPCs together. To facilitate this, the team has set up VPC peering connection between VPC A and all other VPCs in a hub and spoke model with VPC A at the center. However, the team has still failed to establish connectivity between all VPCs.<br>As a solutions architect, which of the following would you recommend as the MOST resource-efficient and scalable solution?","options":[{"html":"Establish VPC peering connections between all VPCs","correct":false},{"html":"Use AWS transit gateway to interconnect the VPCs","correct":true},{"html":"Use a VPC endpoint to interconnect the VPCs","correct":false},{"html":"Use an internet gateway to interconnect the VPCs","correct":false}],"multi":1,"analysis":"<p>Kết nối nhiều VPC hiệu quả, tránh giới hạn non-transitive của Peering</p>","answer":"<p>VPC Peering không transitive (A-B, A-C không suy ra B-C); Transit Gateway giải quyết đúng bài toán hub-and-spoke nhiều VPC.</p>","explain":"<ul><li><b>A. ✗</b> Peering từng cặp là C(n,2) kết nối, không scale khi nhiều VPC.</li><li><b>B. ✓</b> Transit Gateway là hub trung tâm, kết nối nhiều VPC/on-prem qua 1 điểm.</li><li><b>C. ✗</b> VPC Endpoint kết nối tới dịch vụ AWS, không dùng để nối VPC với nhau.</li><li><b>D. ✗</b> Internet Gateway chỉ cho VPC ra internet, không nối VPC với nhau.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Thấy đã có Peering 'kiểu hub-and-spoke' tưởng đã đủ, nhưng Peering không bắc cầu được giữa các VPC spoke với nhau.</p>","tip":"<p>2 VPC → Peering. Nhiều VPC/on-prem, hub-and-spoke → Transit Gateway.</p>"},{"id":14,"topic":"Design High-Performing Architectures – Serverless event-driven sentiment pipeline","supplement":false,"stem":"A streaming service provider collects user experience feedback through embedded feedback forms in their mobile and web apps. Feedback submissions frequently spike to thousands per hour during content launches or service outages. Currently, the feedback is sent via email to the operations team for manual review. The company now wants to automate feedback collection and sentiment analysis so that insights can be generated quickly and stored for a full year for trend analysis.<br>Which solution provides the most scalable and automated approach to meet these requirements?","options":[{"html":"Use Amazon EventBridge to capture feedback events and forward them to an AWS Step Functions workflow. The workflow invokes Lambda functions for validation, calls Amazon Transcribe to convert the text to audio for archival, and stores the results in an Amazon RDS database. Configure a lifecycle policy to remove records after 12 months","correct":false},{"html":"Build a web service on Amazon EC2 that receives feedback data and stores each record in a DynamoDB table. Use the EC2 application to invoke Amazon Comprehend for sentiment detection and write results to a second table. Apply a TTL of 365 days to each table","correct":false},{"html":"Design a RESTful API with Amazon API Gateway that forwards incoming feedback data to an Amazon SQS queue. Set up an AWS Lambda function to process the queue messages, analyze sentiment using Amazon Comprehend, and store results in a DynamoDB table with a 365-day TTL configured on each item","correct":true},{"html":"Route all feedback submissions through Amazon Kinesis Data Streams. Use an AWS Lambda consumer to batch process incoming records, invoke Amazon Translate to detect language and convert input to English, and save the processed content in an Amazon OpenSearch Service index. Configure OpenSearch Index State Management (ISM) policies to delete documents after 12 months","correct":false}],"multi":1,"analysis":"<p>Ghép đúng dịch vụ serverless cho pipeline: ingest → buffer → process → lưu trữ có TTL</p>","answer":"<p>Comprehend là dịch vụ chuyên biệt cho sentiment analysis; SQS đệm traffic đột biến; DynamoDB TTL tự xoá dữ liệu sau 1 năm.</p>","explain":"<ul><li><b>A. ✗</b> Transcribe dùng để chuyển audio→text (ngược lại với yêu cầu), RDS không phù hợp ghi nhiều, dùng Step Functions/EventBridge thừa phức tạp.</li><li><b>B. ✗</b> Chạy trên EC2 để gọi Comprehend thêm vận hành, không serverless hoàn toàn, lại cần bảng DynamoDB thứ hai không cần thiết.</li><li><b>C. ✓</b> API Gateway → SQS đệm → Lambda xử lý + Comprehend phân tích cảm xúc → DynamoDB với TTL 365 ngày: đúng tool cho đúng việc, serverless hoàn toàn.</li><li><b>D. ✗</b> Translate dùng để dịch ngôn ngữ (sai mục đích); OpenSearch thêm overhead không cần thiết cho lưu trữ có cấu trúc đơn giản.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các phương án gài dịch vụ nghe liên quan (Transcribe, Translate) nhưng sai mục đích (chuyển giọng nói, dịch ngôn ngữ) thay vì phân tích cảm xúc.</p>","tip":"<p>Chuyển giọng nói→văn bản: Transcribe. Văn bản→giọng nói: Polly. Dịch ngôn ngữ: Translate. Phân tích cảm xúc văn bản: Comprehend.</p>"},{"id":15,"topic":"Design High-Performing Architectures – CloudWatch Logs Agent + ASG scale-in","supplement":false,"stem":"You have built an application that is deployed with Elastic Load Balancing and an Auto Scaling Group. As a Solutions Architect, you have configured aggressive Amazon CloudWatch alarms, making your Auto Scaling Group (ASG) scale in and out very quickly, renewing your fleet of Amazon EC2 instances on a daily basis. A production bug appeared two days ago, but the team is unable to SSH into the instance to debug the issue, because the instance has already been terminated by the Auto Scaling Group. The log files are saved on the Amazon EC2 instance.<br>How will you resolve the issue and make sure it doesn't happen again?","options":[{"html":"Disable the Termination from the Auto Scaling Group any time a user reports an issue","correct":false},{"html":"Use AWS Lambda to regularly SSH into the Amazon EC2 instances and copy the log files to Amazon S3","correct":false},{"html":"Make a snapshot of the Amazon EC2 instance just before it gets terminated","correct":false},{"html":"Install an Amazon CloudWatch Logs agents on the Amazon EC2 instances to send logs to Amazon CloudWatch","correct":true}],"multi":1,"analysis":"<p>Giữ lại dữ liệu (log) trước khi tài nguyên tạm thời (EC2 trong ASG) bị xoá</p>","answer":"<p>Gửi log ra ngoài instance theo thời gian thực là cách duy nhất đảm bảo không mất log khi ASG scale-in/terminate.</p>","explain":"<ul><li><b>A. ✗</b> Tắt termination làm mất tính co giãn (elastic) của ASG, không phải giải pháp đúng.</li><li><b>B. ✗</b> Dùng Lambda SSH định kỳ vào từng instance để copy log là cách làm thủ công, không thực tế ở quy mô lớn.</li><li><b>C. ✗</b> Snapshot trước khi terminate tốn kém, cồng kềnh chỉ để lấy vài file log.</li><li><b>D. ✓</b> Agent CloudWatch Logs tự động đẩy log sang CloudWatch liên tục, log vẫn còn dù instance đã bị huỷ.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các giải pháp 'chụp lại trước khi xoá' (snapshot) nghe hợp lý nhưng tốn kém và không cần thiết chỉ để lấy log.</p>","tip":"<p>Dữ liệu trên instance có thể bị huỷ bất cứ lúc nào trong ASG → luôn đẩy log ra ngoài (CloudWatch Logs agent), đừng dựa vào instance còn tồn tại.</p>"},{"id":16,"topic":"Design Secure Architectures – EBS Encryption","supplement":false,"stem":"A pharmaceutical company is considering moving to AWS Cloud to accelerate the research and development process. Most of the daily workflows would be centered around running batch jobs on Amazon EC2 instances with storage on Amazon Elastic Block Store (Amazon EBS) volumes. The CTO is concerned about meeting HIPAA compliance norms for sensitive data stored on Amazon EBS.<br>Which of the following options outline the correct capabilities of an encrypted Amazon EBS volume? (Select three)","options":[{"html":"Any snapshot created from the volume is encrypted","correct":true},{"html":"Data moving between the volume and the instance is encrypted","correct":true},{"html":"Any snapshot created from the volume is NOT encrypted","correct":false},{"html":"Data moving between the volume and the instance is NOT encrypted","correct":false},{"html":"Data at rest inside the volume is NOT encrypted","correct":false},{"html":"Data at rest inside the volume is encrypted","correct":true}],"multi":3,"analysis":"<p>Nhận biết toàn bộ phạm vi mã hoá của 1 EBS volume đã bật encryption</p>","answer":"<p>Khi bật mã hoá cho EBS volume, AWS mã hoá cả dữ liệu at-rest, dữ liệu in-transit (volume↔instance) và mọi snapshot/volume tạo từ đó.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: snapshot tạo từ volume đã mã hoá thì cũng được mã hoá.</li><li><b>B. ✓</b> Đúng: dữ liệu di chuyển giữa volume và instance cũng được mã hoá.</li><li><b>C. ✗</b> Sai — phủ định của sự thật (snapshot VẪN được mã hoá).</li><li><b>D. ✗</b> Sai — phủ định của sự thật (dữ liệu di chuyển VẪN được mã hoá).</li><li><b>E. ✗</b> Sai — phủ định của sự thật (dữ liệu tại chỗ VẪN được mã hoá).</li><li><b>F. ✓</b> Đúng: dữ liệu tại chỗ (at rest) trong volume được mã hoá.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đề cố tình đưa ra cặp phát biểu đối nghịch (có/không) cho cùng 1 ý để kiểm tra bạn nhớ đúng chiều.</p>","tip":"<p>EBS volume mã hoá → mã hoá toàn diện: at-rest, in-transit, snapshot, và volume tạo lại từ snapshot đó — dùng key KMS.</p>"},{"id":17,"topic":"Design High-Performing Architectures – Kinesis Data Streams vs Firehose (multi-consumer)","supplement":false,"stem":"A financial services company runs its flagship web application on AWS. The application serves thousands of users during peak hours. The company needs a scalable near-real-time solution to share hundreds of thousands of financial transactions with multiple internal applications. The solution should also remove sensitive details from the transactions before storing the cleansed transactions in a document database for low-latency retrieval.<br>As an AWS Certified Solutions Architect Associate, which of the following would you recommend?","options":[{"html":"Feed the streaming transactions into Amazon Kinesis Data Streams. Leverage AWS Lambda integration to remove sensitive data from every transaction and then store the cleansed transactions in Amazon DynamoDB. The internal applications can consume the raw transactions off the Amazon Kinesis Data Stream","correct":true},{"html":"Persist the raw transactions into Amazon DynamoDB. Configure a rule in Amazon DynamoDB to update the transaction by removing sensitive data whenever any new raw transaction is written. Leverage Amazon DynamoDB Streams to share the transactions data with the internal applications","correct":false},{"html":"Batch process the raw transactions data into Amazon S3 flat files. Use S3 events to trigger an AWS Lambda function to remove sensitive data from the raw transactions in the flat file and then store the cleansed transactions in Amazon DynamoDB. Leverage DynamoDB Streams to share the transactions data with the internal applications","correct":false},{"html":"Feed the streaming transactions into Amazon Kinesis Data Firehose. Leverage AWS Lambda integration to remove sensitive data from every transaction and then store the cleansed transactions in Amazon DynamoDB. The internal applications can consume the raw transactions off the Amazon Kinesis Data Firehose","correct":false}],"multi":1,"analysis":"<p>Near-real-time, nhiều consumer đọc cùng dữ liệu, có bước xử lý (cleanse) ở giữa</p>","answer":"<p>Data Streams cho phép nhiều ứng dụng tiêu thụ độc lập cùng lúc; Lambda tích hợp sẵn làm consumer để làm sạch dữ liệu.</p>","explain":"<ul><li><b>A. ✓</b> Kinesis Data Streams cho phép nhiều consumer đồng thời đọc cùng 1 stream (Lambda cleanse DynamoDB, và app nội bộ đọc raw).</li><li><b>B. ✗</b> DynamoDB không có 'rule' tự update khi có item mới; phải tự dùng trigger/Lambda, kém hiệu quả.</li><li><b>C. ✗</b> Batch qua S3 là xử lý theo lô, không đạt yêu cầu near-real-time.</li><li><b>D. ✗</b> Kinesis Data Firehose chỉ có 1 đích đến, không hỗ trợ nhiều consumer đọc song song.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Firehose dễ bị nhầm với Data Streams nhưng Firehose chỉ delivery tới 1 đích, không hỗ trợ multi-consumer.</p>","tip":"<p>Cần tự xử lý + nhiều consumer + replay → Kinesis Data Streams. Chỉ cần đẩy dữ liệu vào kho đích có sẵn → Kinesis Data Firehose.</p>"},{"id":18,"topic":"Design Secure Architectures – CloudFront + OAC + ACM region requirement","supplement":false,"stem":"A media company operates a web application that enables users to upload photos. These uploads are stored in an Amazon S3 bucket located in the eu-west-2 Region. To enhance performance and provide secure access under a custom domain name, the company wants to integrate Amazon CloudFront for uploads to the S3 bucket. The architecture must support secure HTTPS connections using a custom domain, and the upload process must ensure optimal speed and security.<br>Which combination of actions will fulfill these requirements? (Select two)","options":[{"html":"Request a public certificate from AWS Certificate Manager (ACM) in the eu-west-2 Region and associate it with the CloudFront distribution","correct":false},{"html":"Create a CloudFront distribution with an S3 static website endpoint as the origin and enable upload operations","correct":false},{"html":"Set up Amazon S3 to accept uploads from CloudFront by enabling origin access control (OAC)","correct":true},{"html":"Request a public certificate from AWS Certificate Manager (ACM) in the us-east-1 Region and associate it with the CloudFront distribution","correct":true},{"html":"Set up a custom origin request policy in CloudFront that includes all viewer headers and query strings. Enable S3 Object Ownership to allow CloudFront to assume control of uploaded files via a signed URL","correct":false}],"multi":2,"analysis":"<p>Cấu hình CloudFront HTTPS domain riêng + cho phép ghi ngược vào S3</p>","answer":"<p>OAC hỗ trợ cả đọc/ghi giữa CloudFront và S3; chứng chỉ ACM cho CloudFront bắt buộc ở us-east-1 bất kể Region gốc của S3.</p>","explain":"<ul><li><b>A. ✗</b> ACM cho CloudFront phải nằm ở us-east-1, không phải Region chứa dữ liệu.</li><li><b>B. ✗</b> S3 static website endpoint chỉ hỗ trợ GET/HEAD, không nhận PUT/POST để upload.</li><li><b>C. ✓</b> OAC (Origin Access Control) cho phép CloudFront ghi (upload) an toàn vào S3, thay thế OAI cũ.</li><li><b>D. ✓</b> ACM public certificate dùng cho CloudFront luôn phải tạo ở us-east-1 (N. Virginia).</li><li><b>E. ✗</b> Origin request policy + Object Ownership không tạo ra cơ chế upload qua CloudFront; signed URL dùng cho download, không phải upload.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Chọn tạo chứng chỉ ACM ở Region chứa dữ liệu (vd eu-west-2) — một quy tắc hay bị quên của CloudFront.</p>","tip":"<p>CloudFront + ACM custom domain → chứng chỉ LUÔN ở us-east-1. Cho phép CloudFront ghi vào S3 → OAC (mới, hỗ trợ cả write), không phải OAI (chỉ đọc).</p>"},{"id":19,"topic":"Design Secure Architectures – Security Groups for RDS access","supplement":false,"stem":"An e-commerce company uses a two-tier architecture with application servers in the public subnet and an Amazon RDS MySQL DB in a private subnet. The development team can use a bastion host in the public subnet to access the MySQL database and run queries from the bastion host. However, end-users are reporting application errors. Upon inspecting application logs, the team notices several &quot;could not connect to server: connection timed out&quot; error messages.<br>Which of the following options represent the root cause for this issue?","options":[{"html":"The security group configuration for the application servers does not have the correct rules to allow inbound connections from the database instance","correct":false},{"html":"The security group configuration for the database instance does not have the correct rules to allow inbound connections from the application servers","correct":true},{"html":"The database user credentials (username and password) configured for the application are incorrect","correct":false},{"html":"The database user credentials (username and password) configured for the application do not have the required privilege for the given database","correct":false}],"multi":1,"analysis":"<p>Phân biệt lỗi 'timeout' (network/SG) với lỗi 'access denied' (credentials/quyền)</p>","answer":"<p>'Connection timed out' là dấu hiệu gói tin không tới được DB — do SG của DB chưa cho phép SG của app server.</p>","explain":"<ul><li><b>A. ✗</b> App server không cần nhận inbound từ DB — chiều kết nối ngược lại.</li><li><b>B. ✓</b> SG của DB thiếu rule cho phép inbound từ SG của app server → đúng nguyên nhân gây 'connection timed out'.</li><li><b>C. ✗</b> Sai thông tin đăng nhập gây lỗi 'access denied', không phải 'timeout'.</li><li><b>D. ✗</b> Thiếu quyền trên DB cũng gây lỗi quyền truy cập, không phải timeout kết nối.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các lựa chọn về sai username/password đánh lạc hướng sang lỗi auth, trong khi thông điệp lỗi rõ ràng là timeout (network).</p>","tip":"<p>Timeout → kiểm tra Security Group/NACL/route trước. Access denied → kiểm tra credentials/quyền DB.</p>"},{"id":20,"topic":"Design Secure Architectures – Gateway VPC Endpoint (S3)","supplement":false,"stem":"An organization operates a legacy reporting tool hosted on an Amazon EC2 instance located within a public subnet of a VPC. This tool aggregates scanned PDF reports from field devices and temporarily stores them on an attached Amazon EBS volume. At the end of each day, the tool transfers the accumulated files to an Amazon S3 bucket for archival. A solutions architect identifies that the files are being uploaded over the internet using S3's public endpoint. To improve security and avoid exposing data traffic to the public internet, the architect needs to reconfigure the setup so that uploads to Amazon S3 occur privately without using the public S3 endpoint.<br>Which solution will fulfill these requirements?","options":[{"html":"Provision a dedicated AWS Direct Connect link to route traffic from the VPC to Amazon S3 privately","correct":false},{"html":"Set up a NAT gateway in the public subnet and modify the route table of the EC2 instance's subnet to direct Amazon S3 traffic through the NAT gateway","correct":false},{"html":"Create a gateway VPC endpoint for Amazon S3 in the VPC. Ensure that the EC2 instance’s subnet route table is updated to route S3 traffic through the endpoint. Confirm that appropriate IAM policies are in place to permit access via the VPC endpoint","correct":true},{"html":"Create an S3 access point within the same Region and attach a policy that grants the EC2 instance access. Update the application to use the access point alias to upload data","correct":false}],"multi":1,"analysis":"<p>Truy cập S3 riêng tư (private), không qua internet, không đổi code ứng dụng</p>","answer":"<p>Gateway Endpoint thêm route nội bộ tới S3 qua mạng AWS, miễn phí và không cần internet gateway/NAT.</p>","explain":"<ul><li><b>A. ✗</b> Direct Connect dùng cho kết nối on-prem, không cần thiết và tốn kém cho traffic nội bộ EC2↔S3.</li><li><b>B. ✗</b> NAT Gateway vẫn đưa traffic ra public endpoint của S3, không phải private, vẫn tốn phí NAT.</li><li><b>C. ✓</b> Gateway VPC Endpoint cho S3: route traffic nội bộ, miễn phí, không qua internet.</li><li><b>D. ✗</b> S3 Access Point không đổi đường đi mạng — traffic vẫn qua endpoint công khai nếu không có VPC endpoint.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> NAT Gateway hay bị nhầm là giải pháp 'riêng tư' nhưng thực chất traffic vẫn ra internet (public endpoint của S3).</p>","tip":"<p>EC2 private → S3/DynamoDB riêng tư, miễn phí → Gateway Endpoint. Các dịch vụ AWS khác hoặc on-prem → Interface Endpoint (PrivateLink, có phí).</p>"},{"id":21,"topic":"Design High-Performing Architectures – DynamoDB Global Tables (cost-efficient)","supplement":false,"stem":"A mobile-based e-learning platform is migrating its backend storage layer to Amazon DynamoDB to support a rapidly increasing number of student users and learning transactions. The platform must ensure seamless availability and minimal disruption for a global user base. The DynamoDB design must provide low-latency performance, high availability, and automatic fault tolerance across geographies with the lowest possible operational overhead and cost.<br>Which solution will fulfill these needs in the most cost-efficient manner?","options":[{"html":"Use DynamoDB global tables for automatic multi-Region replication. Enable provisioned capacity mode with auto scaling to optimize cost and ensure consistent availability","correct":true},{"html":"Enable DynamoDB Accelerator (DAX) to reduce response time for read operations. Deploy DAX in one Region, and use scheduled Lambda functions to replicate data to other Regions","correct":false},{"html":"Deploy separate DynamoDB tables in each required AWS Region using on-demand capacity mode. Implement a custom cross-Region replication mechanism by streaming data changes with DynamoDB Streams and processing them through AWS Lambda functions","correct":false},{"html":"Create separate DynamoDB tables in multiple Regions. Use AWS Data Pipeline to synchronize data periodically between Regions to maintain availability","correct":false}],"multi":1,"analysis":"<p>Đa Region, có failover, chi phí tối ưu, overhead vận hành thấp nhất</p>","answer":"<p>Global Tables xử lý replication/multi-writer sẵn có; provisioned mode + auto scaling tránh overprovision so với on-demand.</p>","explain":"<ul><li><b>A. ✓</b> Global Tables tự động replicate đa Region; provisioned + auto scaling tối ưu chi phí theo tải thực tế.</li><li><b>B. ✗</b> DAX chỉ cải thiện tốc độ đọc, không giải quyết ghi/replication/resilience đa Region.</li><li><b>C. ✗</b> Dùng DynamoDB Streams + Lambda tự xây replication: phức tạp, không có conflict resolution, tăng overhead.</li><li><b>D. ✗</b> Data Pipeline đồng bộ định kỳ không real-time, không đảm bảo availability liên tục.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các giải pháp tự xây replication bằng Streams/Lambda/Data Pipeline nghe khả thi nhưng thiếu conflict resolution và tốn vận hành.</p>","tip":"<p>Đa Region, auto, chi phí thấp nhất cho DynamoDB = Global Tables + Provisioned capacity + Auto Scaling (thay vì on-demand nếu tải dự đoán được).</p>"},{"id":22,"topic":"Design High-Performing Architectures – EBS volume types (io1 for DB)","supplement":false,"stem":"A company needs a massive PostgreSQL database and the engineering team would like to retain control over managing the patches, version upgrades for the database, and consistent performance with high IOPS. The team wants to install the database on an Amazon EC2 instance with the optimal storage type on the attached Amazon EBS volume.<br>As a solutions architect, which of the following configurations would you suggest to the engineering team?","options":[{"html":"Amazon EC2 with Amazon EBS volume of Throughput Optimized HDD (st1) type","correct":false},{"html":"Amazon EC2 with Amazon EBS volume of General Purpose SSD (gp2) type","correct":false},{"html":"Amazon EC2 with Amazon EBS volume of Provisioned IOPS SSD (io1) type","correct":true},{"html":"Amazon EC2 with Amazon EBS volume of cold HDD (sc1) type","correct":false}],"multi":1,"analysis":"<p>Chọn loại EBS theo đặc tính workload (IOPS ổn định cho DB)</p>","answer":"<p>io1/io2 cho phép provision IOPS cố định, đáp ứng yêu cầu hiệu năng nhất quán của database lớn.</p>","explain":"<ul><li><b>A. ✗</b> st1 tối ưu cho throughput tuần tự (big data/log), không phải cho database IOPS cao.</li><li><b>B. ✗</b> gp2 phù hợp workload phổ thông, không đáp ứng IOPS bền vững cao cho DB lớn.</li><li><b>C. ✓</b> io1 cung cấp IOPS cố định, ổn định — phù hợp database workload nặng.</li><li><b>D. ✗</b> sc1 là HDD rẻ nhất, hiệu năng thấp, không phù hợp database.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> gp2 'đa dụng' dễ bị chọn nhầm khi đề yêu cầu hiệu năng IOPS cao và nhất quán — gp2 chỉ burst, không đảm bảo bền vững.</p>","tip":"<p>SSD: gp3/gp2 (đa dụng) &lt; io1/io2 (IOPS cao, DB). HDD: st1 (throughput), sc1 (rẻ nhất, ít dùng).</p>"},{"id":23,"topic":"Design High-Performing Architectures – NLB (TCP/UDP) + Global Accelerator","supplement":false,"stem":"A global enterprise is modernizing its hybrid IT infrastructure to improve both availability and network performance. The company operates a TCP-based application hosted on Amazon EC2 instances that are deployed across multiple AWS Regions, while a secondary UDP-based component of the application is hosted in its on-premises data centers. These application components must be accessed by customers around the world with minimal latency and consistent uptime.<br>Which combination of options should a solutions architect implement for the given use case? (Select two)","options":[{"html":"Deploy AWS PrivateLink to connect each on-premises UDP workload to the AWS Regions through interface endpoints exposed by the Network Load Balancers","correct":false},{"html":"Create a Network Load Balancer (NLB) in each Region to handle the EC2-based TCP traffic. For the UDP-based on-premises workload, configure Application Load Balancers in each Region to route to the on-premises endpoints via IP-based target groups","correct":false},{"html":"Set up AWS Direct Connect connections to route all TCP and UDP traffic through a single Region, using static routes and BGP failover","correct":false},{"html":"Create a Network Load Balancer (NLB) in each Region to handle the EC2-based TCP traffic. For the UDP-based on-premises workload, configure NLBs in each Region to route to the on-premises endpoints via IP-based target groups","correct":true},{"html":"Configure an AWS Global Accelerator standard accelerator, and register the TCP-based EC2 workloads behind the load balancers","correct":true}],"multi":2,"analysis":"<p>Kết hợp đúng loại load balancer theo giao thức (TCP/UDP) + tăng tốc toàn cầu</p>","answer":"<p>NLB là load balancer duy nhất hỗ trợ UDP; Global Accelerator tối ưu latency/failover cho phần TCP đa Region.</p>","explain":"<ul><li><b>A. ✗</b> PrivateLink chỉ hỗ trợ TCP, không dùng được cho workload UDP.</li><li><b>B. ✗</b> ALB không hỗ trợ Layer 4 (TCP/UDP) — chỉ xử lý HTTP/HTTPS/WebSocket.</li><li><b>C. ✗</b> Direct Connect không có cơ chế định tuyến toàn cầu thông minh/failover đa Region.</li><li><b>D. ✓</b> NLB hỗ trợ cả TCP và UDP, dùng cho cả EC2 (TCP) và on-prem qua IP target (UDP).</li><li><b>E. ✓</b> Global Accelerator cải thiện hiệu năng/khả dụng cho traffic TCP đa Region, hỗ trợ failover tự động.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Phương án 'nghe hợp lý một nửa' dùng đúng NLB cho TCP nhưng lại ghép sai ALB cho UDP (ALB không hỗ trợ UDP).</p>","tip":"<p>ALB = L7 HTTP/HTTPS. NLB = L4 TCP/UDP/TLS, IP tĩnh, hiệu năng cao. Cần UDP → luôn là NLB.</p>"},{"id":24,"topic":"Design Cost-Optimized Architectures – Direct Connect data transfer cost","supplement":false,"stem":"A retail company maintains an AWS Direct Connect connection to AWS and has recently migrated its data warehouse to AWS. The data analysts at the company query the data warehouse using a visualization tool. The average size of a query returned by the data warehouse is 60 megabytes and the query responses returned by the data warehouse are not cached in the visualization tool. Each webpage returned by the visualization tool is approximately 600 kilobytes.<br>Which of the following options offers the LOWEST data transfer egress cost for the company?","options":[{"html":"Deploy the visualization tool in the same AWS region as the data warehouse. Access the visualization tool over the internet at a location in the same region","correct":false},{"html":"Deploy the visualization tool in the same AWS region as the data warehouse. Access the visualization tool over a Direct Connect connection at a location in the same region","correct":true},{"html":"Deploy the visualization tool on-premises. Query the data warehouse over the internet at a location in the same AWS region","correct":false},{"html":"Deploy the visualization tool on-premises. Query the data warehouse directly over an AWS Direct Connect connection at a location in the same AWS region","correct":false}],"multi":1,"analysis":"<p>Tối thiểu hoá Data Transfer Out (DTO) bằng cách đặt đúng vị trí thành phần</p>","answer":"<p>Đặt visualization tool CÙNG Region với data warehouse giảm lượng dữ liệu phải DTO ra ngoài (chỉ còn webpage 600KB thay vì query 60MB).</p>","explain":"<ul><li><b>A. ✗</b> Qua internet tính phí DTO cao hơn qua Direct Connect, dù cùng Region.</li><li><b>B. ✓</b> Cùng Region + qua Direct Connect: chỉ trả phí DTO cho webpage nhỏ (600KB), rẻ nhất.</li><li><b>C. ✗</b> Đặt tool on-prem khiến mỗi truy vấn 60MB phải DTO ra khỏi AWS — tốn phí hơn nhiều.</li><li><b>D. ✗</b> Vẫn phải trả DTO cho 60MB mỗi truy vấn dù dùng Direct Connect, vì tool nằm ngoài AWS.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Dễ nhầm 'dùng Direct Connect' là đủ để tối ưu, nhưng vị trí triển khai tool mới là yếu tố quyết định lượng DTO.</p>","tip":"<p>DTO cost phụ thuộc vào LƯỢNG dữ liệu rời khỏi AWS, không chỉ phương tiện kết nối — đặt ứng dụng tiêu thụ dữ liệu lớn càng gần nguồn dữ liệu càng tốt.</p>"},{"id":25,"topic":"Design Resilient Architectures – HA web tier + Aurora read replica","supplement":false,"stem":"An enterprise SaaS provider is currently operating a legacy web application hosted on a single Amazon EC2 instance within a public subnet. The same instance also hosts a MySQL database. DNS records for the application are configured through Amazon Route 53. As part of a modernization initiative, the company wants to rearchitect this application for high availability and scalability. In addition, the company wants to improve read performance on the database layer to handle increasing user traffic.<br>Which combination of solutions will meet these requirements? (Select two)","options":[{"html":"Use an Auto Scaling group to deploy EC2 instances across multiple Availability Zones in two AWS Regions. Register the instances in a target group behind an Application Load Balancer to distribute web traffic evenly","correct":false},{"html":"Migrate the existing MySQL database to an Amazon Aurora MySQL cluster. Deploy the primary DB instance and one or more read replicas in different Availability Zones","correct":true},{"html":"Use Amazon CloudFront with Lambda@Edge to serve dynamic content from EC2 instances located in different Regions","correct":false},{"html":"Deploy an additional EC2 instance in a different AWS Region, and configure Amazon Route 53 with a failover routing policy to direct traffic to the secondary instance during primary Region outages","correct":false},{"html":"Use an Auto Scaling group to deploy EC2 instances across multiple Availability Zones within a single Region. Register the instances in a target group behind an Application Load Balancer to distribute web traffic evenly","correct":true}],"multi":2,"analysis":"<p>Nâng cấp kiến trúc single-instance lên HA + scale tự động + tách read traffic cho DB</p>","answer":"<p>ASG đa AZ + ALB xử lý phần compute; Aurora + read replica xử lý phần đọc nhiều mà không ảnh hưởng ghi.</p>","explain":"<ul><li><b>A. ✗</b> ALB/ASG chỉ hoạt động trong 1 Region, không thể trải nhiều Region.</li><li><b>B. ✓</b> Aurora MySQL + read replica khác AZ: tăng khả dụng và hiệu năng đọc.</li><li><b>C. ✗</b> CloudFront + Lambda@Edge không phù hợp cho nội dung động, truy vấn DB liên tục.</li><li><b>D. ✗</b> Thiếu ASG/ALB, không tự scale, cần can thiệp thủ công khi traffic tăng.</li><li><b>E. ✓</b> ASG multi-AZ trong 1 Region + ALB: HA và scale tự động đúng chuẩn.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Phương án 'ASG đa AZ nhưng trải 2 Region' nghe mạnh hơn nhưng thực tế ALB/ASG không multi-Region được.</p>","tip":"<p>ALB và Auto Scaling Group hoạt động trong phạm vi 1 Region (nhiều AZ) — muốn multi-Region phải dùng Route 53/Global Accelerator ở tầng trên.</p>"},{"id":26,"topic":"Design Cost-Optimized Architectures – Snowball Edge migration","supplement":false,"stem":"A media company wants to get out of the business of owning and maintaining its own IT infrastructure. As part of this digital transformation, the media company wants to archive about 5 petabytes of data in its on-premises data center to durable long term storage.<br>As a solutions architect, what is your recommendation to migrate this data in the MOST cost-optimal way?","options":[{"html":"Setup AWS Site-to-Site VPN connection between the on-premises data center and AWS Cloud. Use this connection to transfer the data into Amazon S3 Glacier","correct":false},{"html":"Setup AWS direct connect between the on-premises data center and AWS Cloud. Use this connection to transfer the data into Amazon S3 Glacier","correct":false},{"html":"Transfer the on-premises data into multiple AWS Snowball Edge Storage Optimized devices. Copy the AWS Snowball Edge data into Amazon S3 and create a lifecycle policy to transition the data into Amazon S3 Glacier","correct":true},{"html":"Transfer the on-premises data into multiple AWS Snowball Edge Storage Optimized devices. Copy the AWS Snowball Edge data into Amazon S3 Glacier","correct":false}],"multi":1,"analysis":"<p>Di chuyển khối lượng dữ liệu cực lớn (PB) vào storage rẻ nhất</p>","answer":"<p>Snowball Edge vận chuyển vật lý phù hợp quy mô PB; dữ liệu phải đổ vào S3 trước, sau đó lifecycle mới chuyển tầng xuống Glacier.</p>","explain":"<ul><li><b>A. ✗</b> VPN qua internet với 5PB sẽ rất chậm, không thực tế.</li><li><b>B. ✗</b> Direct Connect tốn kém, mất nhiều tuần thiết lập — không hợp cho dịch chuyển một lần.</li><li><b>C. ✓</b> Snowball Edge → S3 → lifecycle policy chuyển sang Glacier: đúng quy trình được hỗ trợ.</li><li><b>D. ✗</b> Không thể copy trực tiếp dữ liệu từ Snowball Edge vào S3 Glacier — phải qua S3 trước.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Phương án 'copy thẳng vào Glacier' nghe gọn nhưng không được AWS hỗ trợ — Glacier không nhận trực tiếp từ Snowball.</p>","tip":"<p>Snowball Edge luôn đổ dữ liệu vào S3 trước; muốn vào Glacier phải dùng S3 Lifecycle Policy để transition tiếp.</p>"},{"id":27,"topic":"Design Secure Architectures – S3 Bucket Keys (SSE-KMS cost)","supplement":false,"stem":"A digital publishing platform stores large volumes of media assets (such as images and documents) in an Amazon S3 bucket. These assets are accessed frequently during business hours by internal editors and content delivery tools. The company has strict encryption policies and currently uses AWS KMS to handle server-side encryption. The cloud operations team notices that AWS KMS request costs are increasing significantly due to the high frequency of object uploads and accesses. The team is now looking for a way to maintain the same encryption method but reduce the cost of KMS usage, especially for frequent access patterns.<br>Which solution meets the company's encryption and cost optimization goals?","options":[{"html":"Switch to server-side encryption using Amazon S3 managed keys (SSE-S3) to eliminate all AWS KMS-related encryption charges while maintaining the same level of encryption control","correct":false},{"html":"Enable S3 Bucket Keys for server-side encryption with AWS KMS (SSE-KMS) so that new objects use a bucket-level key rather than requesting individual KMS data keys for every object","correct":true},{"html":"Use client-side encryption by generating a local symmetric key and uploading it to Amazon S3 along with each object’s metadata for decryption","correct":false},{"html":"Configure a VPC endpoint for S3 and restrict access to the bucket to traffic originating from the endpoint to avoid additional KMS charges","correct":false}],"multi":1,"analysis":"<p>Giảm chi phí KMS mà vẫn giữ nguyên phương thức mã hoá yêu cầu</p>","answer":"<p>Bucket Key sinh data key cục bộ ở cấp bucket, giảm mạnh số request gọi tới KMS cho từng object.</p>","explain":"<ul><li><b>A. ✗</b> Chuyển sang SSE-S3 loại bỏ KMS hoàn toàn — vi phạm yêu cầu vẫn dùng KMS.</li><li><b>B. ✓</b> S3 Bucket Keys: dùng 1 key cấp bucket, giảm tới 99% số lần gọi KMS mà vẫn là SSE-KMS.</li><li><b>C. ✗</b> Mã hoá client-side và gửi kèm key theo metadata là rủi ro bảo mật nghiêm trọng.</li><li><b>D. ✗</b> VPC endpoint cho S3 tối ưu network/bảo mật, không ảnh hưởng tới phí KMS.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> SSE-S3 'miễn phí KMS' là bẫy vì đổi hẳn phương thức mã hoá, không còn đáp ứng chính sách bắt buộc dùng KMS.</p>","tip":"<p>Vẫn cần SSE-KMS nhưng muốn giảm chi phí request KMS → bật S3 Bucket Keys, không phải đổi sang SSE-S3.</p>"},{"id":28,"topic":"Design Resilient Architectures – CloudWatch detailed monitoring","supplement":false,"stem":"A media streaming company expects a major increase in user activity during the launch of a highly anticipated live event. The streaming platform is deployed on AWS and uses Amazon EC2 instances for the application layer and Amazon RDS for persistent storage. The operations team needs to proactively monitor system performance to ensure a smooth user experience during the event. Their monitoring setup must provide data visibility with intervals of no more than 2 minutes, and the team prefers a solution that is quick to implement and low-maintenance.<br>Which solution should the team implement?","options":[{"html":"Install the CloudWatch agent on all EC2 instances. Configure the agent to collect high-resolution custom metrics and stream them to CloudWatch Logs for analysis via Amazon Athena","correct":false},{"html":"Enable detailed monitoring on all EC2 instances and use Amazon CloudWatch metrics to track performance","correct":true},{"html":"Stream EC2 system logs to an Amazon OpenSearch Service domain for real-time indexing and visualization. Use OpenSearch Dashboards to monitor CPU and memory metrics","correct":false},{"html":"Use Amazon EventBridge to collect EC2 state changes and publish them to Amazon SNS. Subscribe a monitoring dashboard to the SNS topic to visualize metrics","correct":false}],"multi":1,"analysis":"<p>Giám sát hiệu năng nhanh gọn, chi phí vận hành thấp, độ chi tiết theo yêu cầu</p>","answer":"<p>Bật Detailed Monitoring là thao tác bật/tắt đơn giản, cho dữ liệu 1 phút/lần — đáp ứng ngay yêu cầu ≤2 phút mà không cần xây thêm gì.</p>","explain":"<ul><li><b>A. ✗</b> Cài CloudWatch agent + custom metrics + Athena: nhiều việc cấu hình, độ trễ cao hơn, không cần thiết.</li><li><b>B. ✓</b> Detailed
