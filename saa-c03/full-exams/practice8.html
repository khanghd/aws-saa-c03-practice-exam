o nhiều file. <strong>OAC</strong> thay thế OAI.</li>\n</ul>"},{"id":24,"topic":"Design Secure Architectures – AWS WAF","supplement":false,"stem":"<p>A company is hosting its web application in an Auto Scaling group of Amazon EC2 instances behind an Application Load Balancer. Recently, the Solutions Architect identified a series of SQL injection attempts and cross-site scripting attacks to the application, which had adversely affected its production data.</p>\n<p>Which of the following should the Architect implement to mitigate this kind of attack?</p>","options":[{"html":"Using AWS Firewall Manager, set up security rules that block SQL injection and cross-site scripting attacks. Associate the rules to the Application Load Balancer.","correct":false},{"html":"Set up security rules that block SQL injection and cross-site scripting attacks in AWS Web Application Firewall (AWS WAF). Associate the rules to the Application Load Balancer.","correct":true},{"html":"Block all the IP addresses where the SQL injection and cross-site scripting attacks originated using the Network Access Control List.","correct":false},{"html":"Using AWS X-Ray to detect and block SQL injection and cross‑site scripting attacks.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Web app sau ALB bị tấn công <strong>SQL injection</strong> và <strong>XSS</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Giảm thiểu các tấn công <strong>Layer 7</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Set up security rules that block SQL injection and cross-site scripting attacks in AWS Web Application Firewall (AWS WAF). Associate the rules to the Application Load Balancer.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>WAF</strong> kiểm tra nội dung HTTP (header, body, query string, URI), có rule SQLi và XSS; dùng nhanh bằng <strong>AWS Managed Rules</strong>.</li>\n<li>Tạo <strong>Web ACL</strong> và <strong>associate với ALB</strong> → chặn request độc hại trước khi đến EC2.</li>\n</ul>","wrong":"<ul>\n<li><strong>Firewall Manager:</strong> Quản lý <strong>tập trung</strong> rule WAF/Shield/SG cho <strong>nhiều account</strong>; bản thân không phải firewall.</li>\n<li><strong>NACL chặn IP:</strong> Layer 3/4, không đọc được nội dung HTTP; kẻ tấn công dễ đổi IP.</li>\n<li><strong>X-Ray:</strong> Trace/debug, không phải công cụ bảo mật.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Tấn công / nhu cầu</th>\n<th>Dịch vụ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>SQLi, XSS, rate limiting</td>\n<td><strong>WAF</strong></td>\n</tr>\n<tr>\n<td>DDoS</td>\n<td><strong>Shield</strong></td>\n</tr>\n<tr>\n<td>Quản lý WAF/Shield nhiều account</td>\n<td><strong>Firewall Manager</strong></td>\n</tr>\n<tr>\n<td>Lọc FQDN cấp VPC</td>\n<td><strong>Network Firewall</strong></td>\n</tr>\n</tbody>\n</table>"},{"id":25,"topic":"Design Secure Architectures – DataSync + S3 Object Lock","supplement":false,"stem":"<p>An organization stores and manages financial records of various companies in its on-premises data center, which is almost out of space. The management decided to move all of its existing records to a cloud storage service. All future financial records will also be stored in the cloud. For additional security, all records must be prevented from being deleted or overwritten. Once migrated, the records will be accessed less than once a month but must be available immediately if audited, requiring the use of S3 Standard-Infrequent Access.</p>\n<p>Which of the following should be done to meet the above requirement?</p>","options":[{"html":"Use AWS DataSync to move the data. Store all of your data in Amazon S3 and enable object lock.","correct":true},{"html":"Use multi-Region replication to transfer the on‑premises records into Amazon S3 and enable Object Lock.","correct":false},{"html":"Use AWS Storage Gateway to establish hybrid cloud storage. Store all of your data in Amazon EBS and enable object lock.","correct":false},{"html":"Use AWS DataSync to move the data. Store all of your data in Amazon EFS and enable object lock.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Data center sắp hết dung lượng, chuyển hồ sơ tài chính lên cloud.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Migrate</strong> từ on-premises; <strong>không cho xóa/ghi đè</strong> (WORM); dùng <strong>S3 Standard-IA</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Đề đã nói S3 Standard-IA → nơi lưu <strong>bắt buộc là S3</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Use AWS DataSync to move the data. Store all of your data in Amazon S3 and enable object lock.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>DataSync:</strong> di chuyển dữ liệu online từ NFS/SMB/HDFS lên S3, ghi thẳng vào <strong>Standard-IA</strong>.</li>\n<li><strong>S3 Object Lock:</strong> cơ chế <strong>WORM</strong>. <strong>Compliance mode</strong> không ai xóa được, kể cả root; <strong>Governance mode</strong> user đặc biệt bypass được. Object Lock yêu cầu <strong>Versioning</strong>.</li>\n</ul>","wrong":"<ul>\n<li><strong>Multi-Region replication:</strong> Chỉ sao chép <strong>giữa các S3 bucket</strong>, không lấy dữ liệu từ on-premises.</li>\n<li><strong>Storage Gateway + EBS + Object Lock:</strong> <strong>EBS không có Object Lock</strong>.</li>\n<li><strong>DataSync + EFS + Object Lock:</strong> <strong>EFS không có Object Lock</strong>.</li>\n</ul>","tip":"<ul>\n<li><strong>Object Lock chỉ có ở S3</strong> (Glacier có <strong>Vault Lock</strong>).</li>\n<li>Migrate file online → <strong>DataSync</strong>. Hybrid → <strong>Storage Gateway</strong>.</li>\n</ul>"},{"id":26,"topic":"Design Cost-Optimized Architectures – DataSync + Glacier Deep Archive","supplement":false,"stem":"<p>Both historical records and frequently accessed data are stored on an on-premises storage system. The amount of current data is growing at an exponential rate. As the storage's capacity is nearing its limit, the company's Solutions Architect has decided to move the historical records to AWS to free up space for the active data.</p>\n<p>Which of the following architectures deliver the best solution in terms of cost and operational management?</p>","options":[{"html":"Use AWS Storage Gateway to move the historical records from on-premises to AWS. Choose Amazon S3 Glacier Deep Archive to be the destination for the data.","correct":false},{"html":"Use AWS Storage Gateway to move the historical records from on-premises to AWS. Choose Amazon S3 Glacier to be the destination for the data. Modify the S3 lifecycle configuration to move the data from the Standard tier to Amazon S3 Glacier Deep Archive after 30 days.","correct":false},{"html":"Use AWS DataSync to move the historical records from on-premises to AWS. Choose Amazon S3 Glacier Deep Archive to be the destination for the data.","correct":true},{"html":"Use AWS DataSync to move the historical records from on-premises to AWS. Choose Amazon S3 Standard to be the destination for the data. Modify the S3 lifecycle configuration to move the data from the Standard tier to Amazon S3 Glacier Deep Archive after 30 days.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Storage on-premises sắp đầy.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Chuyển dữ liệu lịch sử</strong> lên AWS (migrate một lần), tối ưu <strong>chi phí</strong> và <strong>vận hành</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Dữ liệu lịch sử hiếm khi truy cập → lớp rẻ nhất.</li>\n</ul>","answer":"<ul>\n<li><strong>Use AWS DataSync to move the historical records from on-premises to AWS. Choose Amazon S3 Glacier Deep Archive to be the destination for the data.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>DataSync</strong> chuyên migrate dữ liệu, <strong>ghi thẳng vào bất kỳ storage class nào</strong>, kể cả Deep Archive.</li>\n<li><strong>Glacier Deep Archive</strong> là lớp <strong>rẻ nhất</strong> (lấy dữ liệu 12–48 giờ).</li>\n<li>Ghi thẳng vào Deep Archive → không tốn tiền lưu tạm ở Standard, không cần lifecycle.</li>\n</ul>","wrong":"<ul>\n<li><strong>Storage Gateway → Deep Archive:</strong> Storage Gateway dành cho <strong>hybrid</strong> (on-premises vẫn dùng dữ liệu), không phải migrate một lần.</li>\n<li><strong>Storage Gateway → Glacier + lifecycle từ Standard:</strong> Cùng nhược điểm, lại mâu thuẫn (đích Glacier nhưng lifecycle \"từ Standard\").</li>\n<li><strong>DataSync → Standard rồi lifecycle sau 30 ngày:</strong> Tốn 30 ngày phí Standard + phí transition.</li>\n</ul>","tip":"<ul>\n<li>Migrate file online → <strong>DataSync</strong>. Hybrid → <strong>Storage Gateway</strong>.</li>\n<li>DataSync ghi thẳng vào Deep Archive, không cần đi vòng qua Standard.</li>\n</ul>"},{"id":27,"topic":"Design Secure Architectures – Mã hóa S3 (SSE, client-side)","supplement":false,"stem":"<p>For data privacy, a healthcare company has been asked to comply with the Health Insurance Portability and Accountability Act (HIPAA). The company stores all its backups on an Amazon S3 bucket. It is required that data stored on the S3 bucket must be encrypted.</p>\n<p>What is the best option to do this? (Select TWO.)</p>","options":[{"html":"Enable Server-Side Encryption on an S3 bucket to make use of AES-256 encryption.","correct":true},{"html":"Enable Server-Side Encryption on an S3 bucket to make use of AES-128 encryption.","correct":false},{"html":"Before sending the data to S3 over HTTPS, encrypt the data locally first using your own encryption keys.","correct":true},{"html":"Store the data on Amazon EBS volumes with encryption enabled instead of using S3.","correct":false},{"html":"Store the data in encrypted Amazon EBS snapshots.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Công ty y tế tuân thủ <strong>HIPAA</strong>, backup lưu trên <strong>S3</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Dữ liệu trên S3 <strong>phải được mã hóa</strong>. <strong>Select TWO</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Dữ liệu <strong>phải ở S3</strong> → loại các đáp án EBS.</li>\n</ul>","answer":"<ul>\n<li><strong>Enable Server-Side Encryption on an S3 bucket to make use of AES-256 encryption.</strong></li>\n<li><strong>Before sending the data to S3 over HTTPS, encrypt the data locally first using your own encryption keys.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>SSE:</strong> S3 tự mã hóa khi ghi, giải mã khi đọc; SSE-S3, SSE-KMS, SSE-C đều dùng <strong>AES-256</strong>.</li>\n<li><strong>Client-side encryption:</strong> mã hóa trước khi upload; AWS không thấy dữ liệu gốc; HTTPS bảo vệ khi truyền.</li>\n</ul>","wrong":"<ul>\n<li><strong>AES-128:</strong> S3 SSE <strong>không dùng AES-128</strong>.</li>\n<li><strong>EBS thay cho S3:</strong> Đề yêu cầu S3; EBS gắn với AZ, đắt hơn cho backup.</li>\n<li><strong>EBS snapshot:</strong> Không phải lưu trực tiếp trong S3 bucket.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Kiểu</th>\n<th>Ai quản lý key</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>SSE-S3</td>\n<td>AWS (S3)</td>\n</tr>\n<tr>\n<td>SSE-KMS</td>\n<td>KMS (có audit CloudTrail)</td>\n</tr>\n<tr>\n<td>SSE-C</td>\n<td>Khách hàng gửi key mỗi request (bắt buộc HTTPS)</td>\n</tr>\n<tr>\n<td>Client-side</td>\n<td>Khách hàng tự mã hóa</td>\n</tr>\n</tbody>\n</table>"},{"id":28,"topic":"Design High-Performing Architectures – AWS DMS full load + CDC","supplement":false,"stem":"<p>A company has an on-premises MySQL database that needs to be replicated in Amazon S3 as CSV files. The database will eventually be launched on an Amazon Aurora Serverless cluster and accessed through an Amazon RDS Proxy endpoint to allow the web applications to pool and share database connections. Once data has been fully copied, the ongoing changes to the on-premises database should be continually streamed into the S3 bucket. The company wants a solution that can be implemented with little management overhead yet still highly secure.</p>\n<p>Which ingestion pattern should a solutions architect take?</p>","options":[{"html":"Create a full load and change data capture (CDC) replication task using AWS Database Migration Service (AWS DMS). Add a new Certificate Authority (CA) certificate and create a DMS endpoint with SSL.","correct":true},{"html":"Use AWS Schema Conversion Tool (AWS SCT) to convert MySQL data to CSV files. Set up the AWS Transform MGN to capture ongoing changes from the on-premises MySQL database and send them to S3.","correct":false},{"html":"Set up a full load replication task using AWS Database Migration Service (AWS DMS). Launch a DMS endpoint with SSL using the AWS Network Firewall service.","correct":false},{"html":"Use AWS DataSync to migrate data to S3 and AWS Data Transfer Terminal for ongoing changes. Create your own custom AWS KMS envelope encryption key for the associated DataSync job.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> MySQL on-premises cần replicate sang S3 dạng <strong>CSV</strong>.</li>\n<li><strong>Yêu cầu chính:</strong>\n  1. <strong>Copy toàn bộ</strong> dữ liệu ban đầu → <strong>Full load</strong>.\n  2. <strong>Stream liên tục thay đổi</strong> → <strong>CDC</strong>.\n  3. <strong>Ít công quản lý</strong> và <strong>bảo mật cao</strong>.</li>\n<li><strong>Thông tin gây nhiễu:</strong> Aurora Serverless, RDS Proxy.</li>\n</ul>","answer":"<ul>\n<li><strong>Create a full load and change data capture (CDC) replication task using AWS Database Migration Service (AWS DMS). Add a new Certificate Authority (CA) certificate and create a DMS endpoint with SSL.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>AWS DMS</strong> hỗ trợ task <strong>Full load + CDC</strong> trong một task duy nhất; target S3 ghi ra <strong>CSV</strong> (mặc định) hoặc Parquet.</li>\n<li>Là dịch vụ managed → ít công vận hành.</li>\n<li><strong>Bảo mật:</strong> import <strong>CA certificate</strong> và cấu hình <strong>endpoint dùng SSL</strong> → dữ liệu truyền được mã hóa.</li>\n</ul>","wrong":"<ul>\n<li><strong>SCT + MGN:</strong> SCT chuyển đổi <strong>schema</strong>, không xuất CSV. MGN migrate <strong>cả server</strong>, không capture thay đổi database.</li>\n<li><strong>Chỉ full load + Network Firewall:</strong> Thiếu CDC. Network Firewall không phải cách cấu hình SSL cho DMS endpoint.</li>\n<li><strong>DataSync + Data Transfer Terminal:</strong> DataSync copy <strong>file/object</strong>, không đọc database, không CDC. Data Transfer Terminal là địa điểm vật lý để upload dữ liệu.</li>\n</ul>","tip":"<ul>\n<li>Migrate/replicate database + \"ongoing changes\" → <strong>DMS Full load + CDC</strong>.</li>\n<li>\"Highly secure\" với DMS → <strong>SSL endpoint + CA certificate</strong>.</li>\n</ul>"},{"id":29,"topic":"Design High-Performing Architectures – Route 53 geolocation routing","supplement":false,"stem":"<p>A company has a cryptocurrency exchange portal that is hosted in an Auto Scaling group of EC2 instances behind an Application Load Balancer and is deployed across multiple AWS regions. The users can be found all around the globe, but the majority are from Japan and Sweden. Because of the compliance requirements in these two locations, you want the Japanese users to connect to the servers in the <code>ap-northeast-1</code> Asia Pacific (Tokyo) region, while the Swedish users should be connected to the servers in the <code>eu-west-1</code> EU (Ireland) region.</p>\n<p>Which of the following services would allow you to easily fulfill this requirement?</p>","options":[{"html":"Use Route 53 Geolocation Routing policy.","correct":true},{"html":"Set up an Application Load Balancers that will automatically route the traffic to the proper AWS region.","correct":false},{"html":"Set up a new CloudFront web distribution with the geo-restriction feature enabled.","correct":false},{"html":"Use Route 53 Weighted Routing policy.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Sàn crypto chạy ở nhiều region, người dùng chủ yếu ở <strong>Nhật</strong> và <strong>Thụy Điển</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Vì <strong>compliance</strong>, người dùng Nhật <strong>phải</strong> vào Tokyo, người dùng Thụy Điển <strong>phải</strong> vào Ireland.</li>\n<li><strong>Thông tin cần chú ý:</strong> Quy tắc <strong>cố định theo quốc gia</strong> của người dùng → <strong>Geolocation routing</strong>. Khác Câu 4 (cần \"larger portion\" → Geoproximity).</li>\n</ul>","answer":"<ul>\n<li><strong>Use Route 53 Geolocation Routing policy.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Geolocation routing</strong> chọn resource dựa trên <strong>vị trí địa lý nơi DNS query xuất phát</strong> (châu lục, quốc gia, bang ở Mỹ).</li>\n<li>Tạo record: Japan → endpoint Tokyo; Sweden → endpoint Ireland; thêm record <strong>Default</strong> cho các vị trí còn lại.</li>\n<li>Phù hợp cho <strong>compliance</strong>, bản quyền phân phối nội dung, nội dung theo ngôn ngữ, và chia tải một cách <strong>dự đoán được</strong> (mỗi vị trí luôn đi về cùng một endpoint).</li>\n</ul>","wrong":"<ul>\n<li><strong>ALB tự route sang region phù hợp:</strong> ALB chỉ phân phối traffic <strong>trong một region</strong> (qua nhiều AZ), không định tuyến giữa các region.</li>\n<li><strong>CloudFront geo-restriction:</strong> Chỉ dùng để <strong>chặn/cho phép</strong> người dùng ở một số quốc gia truy cập nội dung, không chọn region backend theo vị trí.</li>\n<li><strong>Weighted routing:</strong> Chia traffic theo tỷ lệ %, không dựa trên vị trí người dùng.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Từ khóa</th>\n<th>Policy</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Người dùng <strong>ở quốc gia X phải</strong> vào region Y, compliance, bản quyền</td>\n<td><strong>Geolocation</strong></td>\n</tr>\n<tr>\n<td>Đẩy <strong>nhiều/ít hơn</strong> traffic về một region theo khoảng cách (bias)</td>\n<td><strong>Geoproximity</strong></td>\n</tr>\n<tr>\n<td>Độ trễ thấp nhất</td>\n<td><strong>Latency</strong></td>\n</tr>\n</tbody>\n</table>"},{"id":30,"topic":"Design Resilient Architectures – Decoupling hybrid (SQS, SWF)","supplement":false,"stem":"<p>A software company has resources hosted in AWS and on-premises servers. You have been requested to create a decoupled architecture for applications which make use of both resources.</p>\n<p>Which of the following options are valid? (Select TWO.)</p>","options":[{"html":"Use SWF to utilize both on-premises servers and EC2 instances for your decoupled application","correct":true},{"html":"Use SQS to utilize both on-premises servers and EC2 instances for your decoupled application","correct":true},{"html":"Use DynamoDB to utilize both on-premises servers and EC2 instances for your decoupled application","correct":false},{"html":"Use RDS to utilize both on-premises servers and EC2 instances for your decoupled application","correct":false},{"html":"Use VPC peering to connect both on-premises servers and EC2 instances for your decoupled application","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Tài nguyên ở cả AWS và on-premises (hybrid).</li>\n<li><strong>Yêu cầu chính:</strong> Kiến trúc <strong>decoupled</strong>. <strong>Select TWO</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Decoupled = giao tiếp qua <strong>trung gian</strong> (queue, workflow).</li>\n</ul>","answer":"<ul>\n<li><strong>Use SWF to utilize both on-premises servers and EC2 instances for your decoupled application</strong></li>\n<li><strong>Use SQS to utilize both on-premises servers and EC2 instances for your decoupled application</strong></li>\n</ul>","explain":"<ul>\n<li><strong>SQS:</strong> producer/consumer không cần biết nhau; truy cập qua API/HTTPS nên on-premises và EC2 đều dùng được.</li>\n<li><strong>SWF:</strong> điều phối workflow; <strong>worker chạy ở bất cứ đâu</strong> (EC2 hay on-premises), chỉ cần gọi API.</li>\n</ul>","wrong":"<ul>\n<li><strong>DynamoDB, RDS:</strong> Là database, không phải cơ chế decouple; dùng chung DB còn làm phụ thuộc chặt hơn.</li>\n<li><strong>VPC peering:</strong> Chỉ nối <strong>VPC với VPC</strong>, không nối on-premises (cần VPN/Direct Connect).</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Từ khóa</th>\n<th>Dịch vụ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>decouple, hàng đợi</td>\n<td><strong>SQS</strong></td>\n</tr>\n<tr>\n<td>pub/sub, fan-out</td>\n<td><strong>SNS</strong></td>\n</tr>\n<tr>\n<td>workflow, worker on-premises (cũ)</td>\n<td><strong>SWF</strong></td>\n</tr>\n<tr>\n<td>workflow serverless (mới)</td>\n<td><strong>Step Functions</strong></td>\n</tr>\n<tr>\n<td>event bus</td>\n<td><strong>EventBridge</strong></td>\n</tr>\n</tbody>\n</table>"},{"id":31,"topic":"Design Cost-Optimized Architectures – Versioning + Object Lock compliance + Lifecycle","supplement":false,"stem":"<p>A solutions architect is designing a secure, cost-effective, and highly available storage solution for a company's data. One of the requirements is to ensure that the previous version of a file is preserved and can be retrieved if a modified version is uploaded. Additionally, the company must comply with strict regulatory requirements that mandate data retention in an immutable state for at least 3 years before being moved to an archive. Once archived, the data will only be accessed once a year.</p>\n<p>How should the solutions architect build the solution?</p>","options":[{"html":"Create a One-Zone-IA bucket with object-level versioning enabled and configure a lifecycle rule that transfers files to Amazon S3 Glacier Deep Archive after 3 years.","correct":false},{"html":"Create an Amazon S3 Standard bucket with object-level versioning enabled and configure a lifecycle rule that transfers files to S3 Glacier Deep Archive after 3 years.","correct":false},{"html":"Create an Amazon S3 Standard bucket and enable S3 Object Lock in governance mode.","correct":false},{"html":"Create an Amazon S3 Standard bucket, enable object-level versioning, and then enable S3 Object Lock in compliance mode. After that, configure a lifecycle rule to move the files to S3 Glacier Deep Archive after 3 years.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Lưu trữ bảo mật, rẻ, highly available.</li>\n<li><strong>Yêu cầu chính:</strong>\n  1. Giữ <strong>phiên bản cũ</strong> → Versioning.\n  2. <strong>Immutable ≥ 3 năm</strong>, quy định nghiêm ngặt → Object Lock <strong>compliance</strong>.\n  3. Sau 3 năm → archive → Lifecycle.\n  4. Truy cập 1 lần/năm → <strong>Deep Archive</strong>.\n  5. Highly available → <strong>không One Zone</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Create an Amazon S3 Standard bucket, enable object-level versioning, and then enable S3 Object Lock in compliance mode. After that, configure a lifecycle rule to move the files to S3 Glacier Deep Archive after 3 years.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>S3 Standard:</strong> ≥ 3 AZ → highly available.</li>\n<li><strong>Versioning:</strong> giữ phiên bản cũ; là <strong>điều kiện bắt buộc</strong> để bật Object Lock.</li>\n<li><strong>Object Lock compliance:</strong> WORM, <strong>không ai</strong> xóa/sửa trong thời gian retention, kể cả root.</li>\n<li><strong>Lifecycle → Deep Archive</strong> sau 3 năm: rẻ nhất.</li>\n</ul>","wrong":"<ul>\n<li><strong>One Zone-IA:</strong> Chỉ 1 AZ; thiếu Object Lock.</li>\n<li><strong>Standard + versioning + lifecycle:</strong> Thiếu Object Lock, phiên bản cũ vẫn xóa được.</li>\n<li><strong>Object Lock governance:</strong> User có <code>s3:BypassGovernanceRetention</code> vẫn xóa được; thiếu lifecycle.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Yêu cầu</th>\n<th>Tính năng</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Giữ phiên bản cũ</td>\n<td><strong>Versioning</strong></td>\n</tr>\n<tr>\n<td>Immutable, strict regulatory</td>\n<td><strong>Object Lock – Compliance</strong></td>\n</tr>\n<tr>\n<td>Immutable, cho phép bypass</td>\n<td><strong>Object Lock – Governance</strong></td>\n</tr>\n<tr>\n<td>Tự chuyển storage class</td>\n<td><strong>Lifecycle</strong></td>\n</tr>\n</tbody>\n</table>"},{"id":32,"topic":"Design Resilient Architectures – SQS priority","supplement":false,"stem":"<p>A company launched a website that accepts high-quality photos and turns the photos into a downloadable video montage. The website offers both a free and a premium account, with the premium account guaranteeing faster processing. All requests by both free and premium members go through a single Amazon SQS queue and are then processed by a group of Amazon EC2 instances that generate the videos. The company needs to ensure that premium users, who paid for the service, have higher priority than free members.</p>\n<p>How should the company re-design its architecture to address this requirement?</p>","options":[{"html":"Create an SQS queue for free members and another one for premium members. Configure your EC2 instances to consume messages from the premium queue first and if it is empty, poll from the free members' SQS queue.","correct":true},{"html":"Use Amazon S3 to store and process the photos and then generate the video montage afterward.","correct":false},{"html":"Use Amazon Kinesis to process the photos and generate the video montage in real-time.","correct":false},{"html":"For the requests made by premium members, set a higher priority in the SQS queue so it will be processed first compared to the requests made by free members.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Request của user free và premium đi chung một SQS queue.</li>\n<li><strong>Yêu cầu chính:</strong> Request của <strong>premium</strong> phải được <strong>ưu tiên</strong> xử lý trước.</li>\n<li><strong>Thông tin cần chú ý:</strong> <strong>SQS không có message priority</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Create an SQS queue for free members and another one for premium members. Configure your EC2 instances to consume messages from the premium queue first and if it is empty, poll from the free members' SQS queue.</strong></li>\n</ul>","explain":"<ul>\n<li>Cách chuẩn để ưu tiên là <strong>tách nhiều queue theo mức ưu tiên</strong>.</li>\n<li>Worker <strong>luôn poll premium queue trước</strong>, chỉ khi trống mới lấy từ free queue.</li>\n</ul>","wrong":"<ul>\n<li><strong>Dùng S3 để xử lý:</strong> S3 là lưu trữ, không xử lý/tạo video, không giải quyết ưu tiên.</li>\n<li><strong>Dùng Kinesis:</strong> Không có cơ chế ưu tiên theo loại user.</li>\n<li><strong>Set priority trong SQS:</strong> <strong>SQS không có tính năng priority cho message</strong> → bẫy.</li>\n</ul>","tip":"<ul>\n<li>\"Priority\" + SQS → <strong>nhiều queue</strong>, consumer poll queue ưu tiên cao trước.</li>\n</ul>"},{"id":33,"topic":"Design High-Performing Architectures – Đặc điểm Amazon EBS","supplement":false,"stem":"<p>A company plans to migrate all of their applications to AWS. The Solutions Architect suggested to store all the data to EBS volumes. The Chief Technical Officer is worried that EBS volumes are not appropriate for the existing workloads due to compliance requirements, downtime scenarios, and IOPS performance.</p>\n<p>Which of the following are valid points in proving that EBS is the best service to use for migration? (Select TWO.)</p>","options":[{"html":"When you create an EBS volume in an Availability Zone, it is automatically replicated on a separate AWS region to prevent data loss due to a failure of any single hardware component.","correct":false},{"html":"EBS volumes support live configuration changes while in production which means that you can modify the volume type, volume size, and IOPS capacity without service interruptions.","correct":true},{"html":"EBS volumes can be attached to any EC2 Instance in any Availability Zone.","correct":false},{"html":"Amazon EBS provides the ability to create snapshots (backups) of any EBS volume and write a copy of the data in the volume to Amazon RDS, where it is stored redundantly in multiple Availability Zones","correct":false},{"html":"An EBS volume is off-instance storage that can persist independently from the life of an instance.","correct":true}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> CTO lo ngại EBS về compliance, downtime, IOPS.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn <strong>hai phát biểu đúng</strong> về EBS.</li>\n<li><strong>Thông tin cần chú ý:</strong> Các đáp án sai ở chi tiết: replicate ở đâu, gắn được vào đâu, snapshot lưu ở đâu.</li>\n</ul>","answer":"<ul>\n<li><strong>EBS volumes support live configuration changes while in production which means that you can modify the volume type, volume size, and IOPS capacity without service interruptions.</strong></li>\n<li><strong>An EBS volume is off-instance storage that can persist independently from the life of an instance.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Elastic Volumes:</strong> đổi size, type, IOPS/throughput khi volume đang dùng, <strong>không downtime</strong>.</li>\n<li><strong>Off-instance storage:</strong> EBS gắn qua mạng; dữ liệu còn khi instance stop (và sau terminate nếu tắt \"Delete on termination\").</li>\n</ul>","wrong":"<ul>\n<li><strong>Replicate sang region khác:</strong> EBS chỉ replicate <strong>trong cùng AZ</strong>.</li>\n<li><strong>Gắn vào EC2 ở bất kỳ AZ:</strong> Chỉ <strong>cùng AZ</strong>.</li>\n<li><strong>Snapshot ghi vào RDS:</strong> Snapshot lưu trên <strong>S3</strong>.</li>\n</ul>","tip":"<ul>\n<li>EBS: replicate trong AZ, gắn cùng AZ, snapshot incremental trên S3, Elastic Volumes, Multi-Attach chỉ io1/io2.</li>\n</ul>"},{"id":34,"topic":"Design Secure Architectures – IAM Role, MFA","supplement":false,"stem":"<p>A Solutions Architect is building a cloud infrastructure where Amazon EC2 instances require access to various AWS services, such as Amazon S3 and Amazon Redshift. The Architect will also need to provide access to system administrators so that the system administrators can deploy and test changes.</p>\n<p>Which configuration should be used to ensure that access to the resources is secured and not compromised? (Select TWO.)</p>","options":[{"html":"Assign an IAM user for each EC2 Instance.","correct":false},{"html":"Enable Multi-Factor Authentication.","correct":true},{"html":"Store the AWS Access Keys in the EC2 instance.","correct":false},{"html":"Assign an IAM role to the EC2 instance.","correct":true},{"html":"Store the AWS Access Keys in ACM.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> EC2 cần truy cập S3, Redshift; admin cần quyền để deploy và test.</li>\n<li><strong>Yêu cầu chính:</strong> Bảo mật truy cập cho <strong>cả máy (EC2)</strong> và <strong>người (admin)</strong>. <strong>Select TWO</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Enable Multi-Factor Authentication.</strong></li>\n<li><strong>Assign an IAM role to the EC2 instance.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>IAM Role cho EC2:</strong> gắn qua <strong>instance profile</strong>, EC2 nhận <strong>temporary credentials</strong> từ STS, tự rotate, không lưu access key.</li>\n<li><strong>MFA cho admin:</strong> thêm lớp xác thực; lộ mật khẩu vẫn không đăng nhập được khi thiếu thiết bị MFA.</li>\n</ul>","wrong":"<ul>\n<li><strong>IAM user cho mỗi EC2:</strong> IAM user dành cho người; dùng cho máy nghĩa là access key dài hạn.</li>\n<li><strong>Lưu access key trên EC2:</strong> Anti-pattern, dễ lộ.</li>\n<li><strong>Lưu access key trong ACM:</strong> ACM chỉ quản lý <strong>SSL/TLS certificate</strong>.</li>\n</ul>","tip":"<ul>\n<li>EC2/Lambda/ECS cần truy cập AWS → <strong>IAM Role</strong>.</li>\n<li>Bảo vệ tài khoản người dùng → <strong>MFA</strong>.</li>\n</ul>"},{"id":35,"topic":"Design High-Performing Architectures – Amazon RDS Proxy","supplement":false,"stem":"<p>A company has a serverless application made up of AWS Amplify, Amazon API Gateway and a Lambda function. The application is connected to an Amazon RDS MySQL database instance inside a private subnet. A Lambda Function URL is also implemented as the dedicated HTTPS endpoint for the function, which has the following value:</p>\n<p><code>https://12june1898pil1pinas.lambda-url.us-west-2.on.aws/</code></p>\n<p>There are times during peak loads when the database throws a \"too many connections\" error preventing the users from accessing the application.</p>\n<p>Which solution could the company take to resolve the issue?</p>","options":[{"html":"Increase the concurrency limit of the Lambda function","correct":false},{"html":"Provision an RDS Proxy between the Lambda function and RDS database instance","correct":true},{"html":"Increase the memory allocation of the Lambda function","correct":false},{"html":"Increase the rate limit of API Gateway","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Ứng dụng serverless: Amplify → API Gateway → <strong>Lambda</strong> → <strong>RDS MySQL</strong> (private subnet).</li>\n<li><strong>Yêu cầu chính:</strong> Khắc phục lỗi <strong>\"too many connections\"</strong> lúc cao điểm.</li>\n<li><strong>Thông tin gây nhiễu:</strong> Amplify, Lambda Function URL (đoạn URL chỉ để làm rối).</li>\n<li><strong>Thông tin cần chú ý:</strong> Lambda scale ra rất nhiều bản chạy song song, mỗi bản mở <strong>một kết nối DB riêng</strong> → cạn kết nối. Cần <strong>connection pooling</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Provision an RDS Proxy between the Lambda function and RDS database instance</strong></li>\n</ul>","explain":"<ul>\n<li><strong>RDS Proxy</strong> duy trì một <strong>pool kết nối \"ấm\"</strong> tới database; Lambda kết nối tới Proxy thay vì kết nối thẳng DB.</li>\n<li>Proxy <strong>tái sử dụng (multiplex)</strong> kết nối, nên hàng nghìn lần gọi Lambda đồng thời chỉ dùng một số lượng kết nối DB hợp lý.</li>\n<li>Thêm lợi ích: failover nhanh hơn cho Multi-AZ (giảm tới ~66%), hỗ trợ <strong>IAM authentication</strong> và lấy credential từ <strong>Secrets Manager</strong>.</li>\n<li>Cách khác là nâng DB lên instance nhiều RAM hơn (số kết nối tối đa phụ thuộc bộ nhớ), nhưng RDS Proxy là giải pháp đúng trọng tâm.</li>\n</ul>","wrong":"<ul>\n<li><strong>Tăng concurrency limit của Lambda:</strong> Nhiều Lambda chạy song song hơn → <strong>càng nhiều kết nối</strong> → lỗi nặng hơn.</li>\n<li><strong>Tăng memory của Lambda:</strong> Chỉ làm function chạy nhanh hơn, không giải quyết vấn đề số kết nối ở DB.</li>\n<li><strong>Tăng rate limit của API Gateway:</strong> Cho phép nhiều request hơn đi vào → cũng làm tăng tải lên DB.</li>\n</ul>","tip":"<ul>\n<li><strong>Lambda + RDS + \"too many connections\"</strong> → <strong>RDS Proxy</strong>.</li>\n<li>RDS Proxy hỗ trợ MySQL, PostgreSQL, MariaDB, SQL Server (RDS và Aurora); không public, chỉ truy cập trong VPC.</li>\n</ul>"},{"id":36,"topic":"Design Secure Architectures – Organizations + IAM Identity Center + SCP","supplement":false,"stem":"<p>A multinational company currently operates multiple AWS accounts to support its operations across various branches and business units. The company needs a more efficient and secure approach in managing its vast AWS infrastructure to avoid costly operational overhead.</p>\n<p>To address this, they plan to transition to a consolidated, multi-account architecture while integrating a centralized corporate directory service for authentication purposes.</p>\n<p>Which combination of options can be used to meet the above requirements? (Select TWO.)</p>","options":[{"html":"Set up a new entity in AWS Organizations and configure its authentication system to utilize AWS Directory Service directly.","correct":false},{"html":"Integrate AWS IAM Identity Center with the corporate directory service for centralized authentication. Configure a service control policy (SCP) to manage the AWS accounts.","correct":true},{"html":"Establish an identity pool through Amazon Cognito and adjust the AWS IAM Identity Center settings to allow Amazon Cognito authentication.","correct":false},{"html":"Utilize AWS CloudTrail to enable centralized logging and monitoring across all AWS accounts.","correct":false},{"html":"Implement AWS Organizations to create a multi-account architecture that provides a consolidated view and centralized management of AWS accounts.","correct":true}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Công ty đa quốc gia có nhiều account.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Multi-account tập trung</strong> + <strong>xác thực qua corporate directory</strong>. <strong>Select TWO</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Rất giống <strong>Câu 62</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Integrate AWS IAM Identity Center with the corporate directory service for centralized authentication. Configure a service control policy (SCP) to manage the AWS accounts.</strong></li>\n<li><strong>Implement AWS Organizations to create a multi-account architecture that provides a consolidated view and centralized management of AWS accounts.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Organizations:</strong> gom account, chia OU, consolidated billing.</li>\n<li><strong>IAM Identity Center:</strong> SSO bằng tài khoản công ty (AD qua AD Connector, hoặc Okta/Entra ID qua SAML + SCIM).</li>\n<li><strong>SCP:</strong> đặt <strong>giới hạn quyền tối đa</strong> (guardrail) cho account/OU.</li>\n</ul>","wrong":"<ul>\n<li><strong>Authentication của Organizations:</strong> Organizations không có hệ thống xác thực.</li>\n<li><strong>Cognito:</strong> Dành cho người dùng app.</li>\n<li><strong>CloudTrail:</strong> Hữu ích cho audit nhưng không giải quyết multi-account hay xác thực.</li>\n</ul>","tip":"<ul>\n<li>Multi-account + corporate directory / SSO → <strong>Organizations + IAM Identity Center</strong>.</li>\n<li>SCP <strong>không cấp quyền</strong>, chỉ giới hạn; không áp dụng cho management account.</li>\n</ul>"},{"id":37,"topic":"Design High-Performing Architectures – VPC IPv6-only subnet","supplement":false,"stem":"<p>A company has multiple VPCs with IPv6 enabled for its suite of web applications. The Solutions Architect attempted to deploy a new Amazon EC2 instance but encountered an error indicating that there were no available IP addresses on the subnet. The VPC has a combination of IPv4 and IPv6 CIDR blocks, but the IPv4 CIDR blocks are nearing exhaustion. The architect needs a solution that will resolve this issue while allowing future scalability.</p>\n<p>How should the Solutions Architect resolve this problem?</p>","options":[{"html":"Set up a new IPv6-only subnet with a large CIDR range. Associate the new subnet with the VPC then launch the instance.","correct":true},{"html":"Ensure that the VPC has IPv6 CIDRs only. Remove any IPv4 CIDRs associated with the VPC.","correct":false},{"html":"Set up a new IPv4 subnet with a larger CIDR range. Associate the new subnet with the VPC and then launch the instance.","correct":false},{"html":"Disable the IPv4 support in the VPC and use the available IPv6 addresses.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> VPC <strong>dual-stack</strong> (IPv4 + IPv6), dải <strong>IPv4 sắp cạn</strong>, launch EC2 báo hết IP.</li>\n<li><strong>Yêu cầu chính:</strong> Giải quyết lỗi <strong>và</strong> đảm bảo <strong>mở rộng lâu dài</strong> (future scalability).</li>\n<li><strong>Thông tin cần chú ý:</strong> VPC đã bật IPv6 → tận dụng không gian địa chỉ IPv6 gần như vô hạn.</li>\n</ul>","answer":"<ul>\n<li><strong>Set up a new IPv6-only subnet with a large CIDR range. Associate the new subnet with the VPC then launch the instance.</strong></li>\n</ul>","explain":"<ul>\n<li>Trong một VPC dual-stack, bạn có thể tạo <strong>subnet chỉ có IPv6 (IPv6-only)</strong>. Instance launch vào subnet này <strong>không tốn địa chỉ IPv4</strong>.</li>\n<li>Không gian IPv6 cực lớn → giải quyết ngay lỗi hết IP và không gặp lại vấn đề trong tương lai.</li>\n<li>IPv4 vẫn giữ cho các dịch vụ hiện có; tài nguyên mới dần chuyển sang IPv6 (lưu ý instance IPv6-only phải là loại <strong>Nitro-based</strong>).</li>\n</ul>","wrong":"<ul>\n<li><strong>VPC chỉ có IPv6, xóa hết IPv4 CIDR:</strong> <strong>Không làm được</strong>. VPC luôn phải có <strong>IPv4 CIDR chính</strong>; không có VPC IPv6-only.</li>\n<li><strong>Tạo subnet IPv4 lớn hơn:</strong> Chỉ là giải pháp tạm; IPv4 có hạn nên sẽ lại cạn → không đạt \"future scalability\".</li>\n<li><strong>Tắt IPv4 support của VPC:</strong> <strong>Không thể</strong> tắt IPv4 của VPC; IPv4 là bắt buộc và tắt sẽ làm hỏng các dịch vụ đang dùng IPv4.</li>\n</ul>","tip":"<ul>\n<li>VPC: <strong>IPv4 bắt buộc</strong>, IPv6 là tùy chọn (dual-stack). <strong>Subnet</strong> thì có thể IPv4-only, dual-stack hoặc <strong>IPv6-only</strong>.</li>\n<li>Hết IPv4 + cần scale lâu dài + VPC đã bật IPv6 → <strong>IPv6-only subnet</strong>.</li>\n<li>Hết IPv4 nhưng muốn giữ IPv4 → thêm <strong>secondary IPv4 CIDR</strong> cho VPC (giải pháp ngắn hạn).</li>\n</ul>"},{"id":38,"topic":"Design Secure Architectures – Rekognition + Interface VPC endpoint","supplement":false,"stem":"<p>A company owns a photo-sharing app that stores user uploads on Amazon S3. There has been an increase in the number of explicit and offensive images being reported. The company currently relies on human efforts to moderate content, and it wants to streamline this process by using Artificial Intelligence to only flag images for review. For added security, any communication with its resources on its Amazon VPC must not traverse the public Internet.</p>\n<p>How can this task be accomplished with the LEAST amount of effort?</p>","options":[{"html":"Use an image classification model in Amazon SageMaker. Set up Amazon GuardDuty and connect it with SageMaker to ensure that all communications do not traverse the public Internet.","correct":false},{"html":"Use AWS Lambda to create custom image moderation logic. Deploy this Lambda function in a public VPC to ensure communication through the public Internet.","correct":false},{"html":"Use Amazon Detective to detect images with graphic nudity or violence in S3. Ensure that all communications made by your AWS resources do not traverse the public Internet via the AWS Audit Manager service.","correct":false},{"html":"Use Amazon Rekognition to detect images with graphic nudity or violence in S3. Create an Interface VPC endpoint for Rekognition with the necessary policies to prevent any traffic from traversing the public Internet.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> App chia sẻ ảnh, kiểm duyệt thủ công.</li>\n<li><strong>Yêu cầu chính:</strong> Dùng <strong>AI flag</strong> ảnh phản cảm; giao tiếp <strong>không qua Internet</strong>; <strong>ít công sức nhất</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> \"Least effort\" → dịch vụ AI <strong>có sẵn</strong>, không tự train.</li>\n</ul>","answer":"<ul>\n<li><strong>Use Amazon Rekognition to detect images with graphic nudity or violence in S3. Create an Interface VPC endpoint for Rekognition with the necessary policies to prevent any traffic from traversing the public Internet.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Rekognition</strong> đã train sẵn; API <strong><code>DetectModerationLabels</code></strong> trả về nhãn nội dung phản cảm kèm confidence.</li>\n<li>Có thể kết hợp <strong>Augmented AI (A2I)</strong> để chuyển ảnh bị flag cho người review.</li>\n<li><strong>Interface VPC Endpoint (PrivateLink)</strong> tạo ENI private trong VPC → traffic không ra Internet; gắn <strong>endpoint policy</strong> để giới hạn quyền.</li>\n</ul>","wrong":"<ul>\n<li><strong>SageMaker + GuardDuty:</strong> Phải tự train model; GuardDuty không định tuyến traffic.</li>\n<li><strong>Lambda tự viết, public VPC:</strong> Tốn công; còn <strong>trái</strong> yêu cầu \"không qua Internet\".</li>\n<li><strong>Detective + Audit Manager:</strong> Detective điều tra sự cố bảo mật; Audit Manager thu thập bằng chứng audit.</li>\n</ul>","tip":"<ul>\n<li>Nội dung phản cảm, khuôn mặt, vật thể trong ảnh/video → <strong>Rekognition</strong>.</li>\n<li>Truy cập dịch vụ AWS không qua Internet → <strong>VPC Endpoint</strong> (Interface cho hầu hết; Gateway chỉ S3/DynamoDB).</li>\n</ul>"},{"id":39,"topic":"Design Resilient Architectures – RDS Multi-AZ failover triggers","supplement":false,"stem":"<p>An online events registration system is hosted in AWS and uses ECS to host its front-end tier and an RDS configured with Multi-AZ for its database tier. What are the events that will make Amazon RDS automatically perform a failover to the standby replica? (Select TWO.)</p>","options":[{"html":"Storage failure on primary","correct":true},{"html":"In the event of Read Replica failure","correct":false},{"html":"Loss of availability in primary Availability Zone","correct":true},{"html":"Compute unit failure on secondary DB instance","correct":false},{"html":"Storage failure on secondary DB instance","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> RDS Multi-AZ.</li>\n<li><strong>Yêu cầu chính:</strong> Sự kiện nào gây <strong>failover tự động</strong>? <strong>Select TWO</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Failover chỉ khi <strong>primary</strong> gặp sự cố.</li>\n</ul>","answer":"<ul>\n<li><strong>Storage failure on primary</strong></li>\n<li><strong>Loss of availability in primary Availability Zone</strong></li>\n</ul>","explain":"<ul>\n<li>Failover xảy ra khi: AZ của primary mất, primary lỗi storage/compute/network, thay đổi instance type, vá OS, reboot with failover.</li>\n<li>Khi failover, RDS <strong>đổi CNAME</strong> sang standby.</li>\n</ul>","wrong":"<ul>\n<li><strong>Read Replica lỗi:</strong> Read Replica không thuộc cơ chế Multi-AZ.</li>\n<li><strong>Lỗi compute/storage trên secondary:</strong> Primary vẫn chạy; RDS chỉ dựng lại standby.</li>\n</ul>","tip":"<ul>\n<li>Lỗi ở <strong>PRIMARY</strong> → failover. Lỗi ở <strong>standby</strong> hoặc <strong>Read Replica</strong> → không failover.</li>\n</ul>"},{"id":40,"topic":"Design Cost-Optimized Architectures – S3 Standard-IA","supplement":false,"stem":"<p>A Solutions Architect created a new Standard-class Amazon S3 bucket to store financial reports that are not frequently accessed but should immediately be available when an auditor requests the reports. To save costs, the Architect changed the storage class of the S3 bucket from Standard to Infrequent Access storage class.</p>\n<p>In S3 Standard – Infrequent Access storage class, which of the following statements are true? (Select TWO.)</p>","options":[{"html":"It automatically moves data to the most cost-effective access tier without any operational overhead.","correct":false},{"html":"It provides high latency and low throughput performance.","correct":false},{"html":"It is designed for data that requires rapid access when needed.","correct":true},{"html":"Ideal to use for data archiving.","correct":false},{"html":"It is designed for data that is accessed less frequently.","correct":true}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Báo cáo tài chính ít truy cập nhưng cần <strong>có ngay</strong> khi audit.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn <strong>hai phát biểu đúng</strong> về S3 Standard-IA.</li>\n</ul>","answer":"<ul>\n<li><strong>It is designed for data that requires rapid access when needed.</strong></li>\n<li><strong>It is designed for data that is accessed less frequently.</strong></li>\n</ul>","explain":"<ul>\n<li>Standard-IA: dữ liệu <strong>ít truy cập</strong>, khi cần lấy <strong>ngay</strong> (ms), throughput cao như Standard.</li>\n<li>Phí lưu rẻ hơn Standard nhưng có <strong>phí retrieval</strong>; tối thiểu <strong>30 ngày</strong>, object tính tối thiểu <strong>128 KB</strong>; lưu trên <strong>≥ 3 AZ</strong>.</li>\n</ul>","wrong":"<ul>\n<li><strong>Tự động chuyển tier:</strong> Đó là <strong>Intelligent-Tiering</strong>.</li>\n<li><strong>High latency, low throughput:</strong> Sai, Standard-IA latency thấp.</li>\n<li><strong>Archiving:</strong> Phù hợp <strong>Glacier</strong>.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Class</th>\n<th>Đặc điểm</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Standard</td>\n<td>Truy cập thường xuyên</td>\n</tr>\n<tr>\n<td>Intelligent-Tiering</td>\n<td>Không biết mẫu truy cập, tự chuyển tier</td>\n</tr>\n<tr>\n<td>Standard-IA</td>\n<td>Ít truy cập, lấy ngay, ≥ 3 AZ</td>\n</tr>\n<tr>\n<td>One Zone-IA</td>\n<td>Như Standard-IA nhưng 1 AZ</td>\n</tr>\n<tr>\n<td>Glacier Instant</td>\n<td>Archive, lấy trong ms</td>\n</tr>\n<tr>\n<td>Glacier Flexible</td>\n<td>Archive, phút đến giờ</td>\n</tr>\n<tr>\n<td>Glacier Deep Archive</td>\n<td>Rẻ nhất, 12–48 giờ</td>\n</tr>\n</tbody>\n</table>"},{"id":41,"topic":"Design Secure Architectures – Kinesis Video Streams + Rekognition + SNS","supplement":false,"stem":"<p>A business has a network of surveillance cameras installed within the premises of its data center. Management wants to leverage Artificial Intelligence to monitor and detect unauthorized personnel entering restricted areas. Should an unauthorized person be detected, the security team must be alerted via SMS.</p>\n<p>Which solution satisfies the requirement?</p>","options":[{"html":"Utilize a custom containerized video processing application on Amazon Elastic Kubernetes Service (Amazon EKS). Integrate AWS App2Container (A2C) and Amazon SageMaker Autopilot to detect unauthorized personnel. Set the phone numbers of the security team as subscribers to an Amazon SNS topic.","correct":false},{"html":"Set up Amazon Managed Service for Prometheus to stream live feeds from the cameras. Use Amazon Fraud Detector to detect unauthorized personnel. Set the phone numbers of the security team as subscribers to an Amazon SNS topic.","correct":false},{"html":"Configure Amazon Elastic Transcoder to stream live feeds from the cameras. Use Amazon Kendra to detect authorized personnel. Set the phone numbers of the security team as subscribers to an Amazon SNS topic.","correct":false},{"html":"Use Amazon Kinesis Video Streams to stream live feeds from the cameras. Use Amazon Rekognition to detect unauthorized personnel. Set the phone numbers of the security team as subscribers to an Amazon SNS topic.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Camera giám sát trong data center.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Stream video</strong>, dùng <strong>AI phát hiện người lạ</strong>, <strong>gửi SMS</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Ba phần → ba dịch vụ: KVS, Rekognition, SNS.</li>\n</ul>","answer":"<ul>\n<li><strong>Use Amazon Kinesis Video Streams to stream live feeds from the cameras. Use Amazon Rekognition to detect unauthorized personnel. Set the phone numbers of the security team as subscribers to an Amazon SNS topic.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Kinesis Video Streams:</strong> nhận video trực tiếp từ camera.</li>\n<li><strong>Rekognition Video:</strong> so khớp khuôn mặt với <strong>face collection</strong> của nhân viên; không khớp → người lạ; kết quả ra Kinesis Data Streams → Lambda.</li>\n<li><strong>SNS:</strong> số điện thoại subscribe bằng <strong>SMS</strong>.</li>\n</ul>","wrong":"<ul>\n<li><strong>EKS + App2Container + SageMaker Autopilot:</strong> Tự xây và train, phức tạp; A2C container hóa app .NET/Java; Autopilot cho dữ liệu dạng bảng.</li>\n<li><strong>Prometheus + Fraud Detector:</strong> Prometheus giám sát metric; Fraud Detector phát hiện gian lận giao dịch.</li>\n<li><strong>Elastic Transcoder + Kendra:</strong> Transcoder chuyển định dạng file video; Kendra là tìm kiếm tài liệu.</li>\n</ul>","tip":"<ul>\n<li><strong>Camera → Kinesis Video Streams → Rekognition → (KDS → Lambda) → SNS (SMS)</strong>.</li>\n</ul>"},{"id":42,"topic":"Design Secure Architectures – Amazon GuardDuty","supplement":false,"stem":"<p>A company has an application that continually sends encrypted documents to Amazon S3. The company requires that the configuration for data access is in line with its strict compliance standards. It should also be alerted if there is any risk of unauthorized access or suspicious access patterns.</p>\n<p>Which step is needed to meet the requirements?</p>","options":[{"html":"Use Amazon Rekognition to monitor and recognize patterns on S3.","correct":false},{"html":"Use Amazon GuardDuty to monitor malicious activity on S3.","correct":true},{"html":"Use Amazon Inspector to alert whenever a security violation is detected on S3.","correct":false},{"html":"Use AWS CloudTrail to monitor and detect access patterns on S3.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Ứng dụng liên tục gửi tài liệu mã hóa lên S3.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Cảnh báo</strong> khi có <strong>truy cập trái phép</strong> hoặc <strong>mẫu truy cập đáng ngờ</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Đây là bài toán <strong>threat detection</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Use Amazon GuardDuty to monitor malicious activity on S3.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>GuardDuty</strong> dùng ML, anomaly detection và threat intelligence.</li>\n<li><strong>S3 Protection</strong> phân tích <strong>CloudTrail data events của S3</strong>: truy cập từ IP độc hại/Tor, tải dữ liệu bất thường, tắt logging đáng ngờ.</li>\n<li>Finding → <strong>EventBridge → SNS</strong> để cảnh báo. Không cần cài agent.</li>\n</ul>","wrong":"<ul>\n<li><strong>Rekognition:</strong> Phân tích ảnh/video.</li>\n<li><strong>Inspector:</strong> Quét <strong>lỗ hổng (CVE)</strong> trên EC2, ECR, Lambda.</li>\n<li><strong>CloudTrail:</strong> <strong>Chỉ ghi log</strong>, không tự phân tích hay cảnh báo.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Từ khóa</th>\n<th>Dịch vụ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>threat detection, suspicious access</td>\n<td><strong>GuardDuty</strong></td>\n</tr>\n<tr>\n<td>dữ liệu nhạy cảm (PII) trong S3</td>\n<td><strong>Macie</strong></td>\n</tr>\n<tr>\n<td>lỗ hổng CVE</td>\n<td><strong>Inspector</strong></td>\n</tr>\n<tr>\n<td>ghi log API</td>\n<td><strong>CloudTrail</strong></td>\n</tr>\n</tbody>\n</table>"},{"id":43,"topic":"Design Resilient Architectures – ALB với gRPC","supplement":false,"stem":"<p>A DevOps Engineer is required to design a cloud architecture in AWS. The Engineer is planning to develop a highly available and fault-tolerant architecture consisting of an Elastic Load Balancer and an Auto Scaling group of EC2 instances deployed across multiple Availability Zones. This will be used by an online accounting application that requires path-based routing, host-based routing, and bi-directional streaming using Remote Procedure Call (gRPC).</p>\n<p>Which configuration will satisfy the given requirement?</p>","options":[{"html":"Configure an Application Load Balancer in front of the auto-scaling group. Select gRPC as the protocol version.","correct":true},{"html":"Configure a Gateway Load Balancer in front of the auto-scaling group. Ensure that the IP Listener Routing uses the GENEVE protocol on port 6081 to allow gRPC response traffic.","correct":false},{"html":"Configure a Network Load Balancer in front of the auto-scaling group. Use a UDP listener for routing.","correct":false},{"html":"Configure a Network Load Balancer in front of the auto-scaling group. Create an AWS Global Accelerator accelerator and set the load balancer as an endpoint.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> ELB + ASG nhiều AZ cho ứng dụng kế toán.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Path-based</strong>, <strong>host-based routing</strong> và <strong>gRPC bi-directional streaming</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Path/host-based là tính năng <strong>Layer 7</strong> → <strong>ALB</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Configure an Application Load Balancer in front of the auto-scaling group. Select gRPC as the protocol version.</strong></li>\n</ul>","explain":"<ul>\n<li>ALB hỗ trợ <strong>path-based</strong> (<code>/api/*</code>) và <strong>host-based</strong> (<code>admin.example.com</code>) routing.</li>\n<li>Target group chọn <strong>protocol version = gRPC</strong>; hỗ trợ unary, client/server streaming và <strong>bi-directional streaming</strong>.</li>\n</ul>","wrong":"<ul>\n<li><strong>GWLB + GENEVE 6081:</strong> Dành cho thiết bị mạng ảo (firewall, IDS/IPS), không có routing Layer 7.</li>\n<li><strong>NLB + UDP:</strong> Layer 4, không path/host routing; gRPC chạy trên HTTP/2 (TCP).</li>\n<li><strong>NLB + Global Accelerator:</strong> Vẫn Layer 4.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>LB</th>\n<th>Layer</th>\n<th>Dùng khi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>ALB</strong></td>\n<td>7</td>\n<td>path/host/header routing, gRPC, WebSocket, WAF</td>\n</tr>\n<tr>\n<td><strong>NLB</strong></td>\n<td>4</td>\n<td>hiệu năng cực cao, IP tĩnh</td>\n</tr>\n<tr>\n<td><strong>GWLB</strong></td>\n<td>3 (GENEVE)</td>\n<td>firewall/IDS/IPS bên thứ ba</td>\n</tr>\n</tbody>\n</table>"},{"id":44,"topic":"Design Resilient Architectures – EC2 Auto Scaling cooldown","supplement":false,"stem":"<p>A commercial bank has a forex trading application. They created an Auto Scaling group of EC2 instances that allow the bank to cope with the current traffic and achieve cost-efficiency. They want the Auto Scaling group to behave in such a way that it will follow a predefined set of parameters before it scales down the number of EC2 instances, which protects the system from unintended slowdown or unavailability.</p>\n<p>Which of the following statements are true regarding the cooldown period? (Select TWO.)</p>","options":[{"html":"Its default value is 600 seconds.","correct":false},{"html":"Its default value is 300 seconds.","correct":true},{"html":"It ensures that the Auto Scaling group does not launch or terminate additional EC2 instances before the previous scaling activity takes effect.","correct":true},{"html":"It ensures that before the Auto Scaling group scales out, the EC2 instances have an ample time to cooldown.","correct":false},{"html":"It ensures that the Auto Scaling group launches or terminates additional EC2 instances without any downtime.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Ứng dụng forex của ngân hàng chạy trên Auto Scaling group.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn <strong>hai phát biểu đúng</strong> về <strong>cooldown period</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Mục tiêu là tránh scale chồng chéo gây chậm hoặc gián đoạn hệ thống.</li>\n</ul>","answer":"<ul>\n<li><strong>Its default value is 300 seconds.</strong></li>\n<li><strong>It ensures that the Auto Scaling group does not launch or terminate additional EC2 instances before the previous scaling activity takes effect.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Cooldown period</strong> là khoảng thời gian chờ sau mỗi lần scaling, trong đó ASG không thực hiện thêm scaling activity.</li>\n<li>Mục đích: cho instance mới launch kịp khởi động và nhận traffic, hoặc instance vừa terminate rời hẳn hệ thống, để metric phản ánh đúng trạng thái mới.</li>\n<li>Không có cooldown, ASG có thể scale liên tục vì metric chưa ổn định → launch thừa (tốn tiền) hoặc terminate quá tay (chậm, gián đoạn).</li>\n<li><strong>Giá trị mặc định: 300 giây (5 phút).</strong></li>\n</ul>","wrong":"<ul>\n<li><strong>600 giây:</strong> Sai, mặc định là 300 giây.</li>\n<li><strong>Cho instance \"nguội\" trước khi scale out:</strong> Hiểu sai chữ \"cooldown\" theo nghĩa đen. Cooldown không liên quan nhiệt độ hay tải của instance.</li>\n<li><strong>Đảm bảo không downtime:</strong> Cooldown không đảm bảo zero downtime, chỉ ngăn scaling chồng chéo.</li>\n</ul>","tip":"<ul>\n<li>Default cooldown = <strong>300 giây</strong>.</li>\n<li>Cooldown áp dụng chủ yếu cho <strong>simple scaling</strong>. Với target tracking và step scaling, AWS khuyến nghị dùng <strong>instance warmup</strong>.</li>\n</ul>"},{"id":45,"topic":"Design Secure Architectures – IAM Role cho EC2","supplement":false,"stem":"<p>A company developed a meal planning application that provides meal recommendations for the week, as well as the food consumption of the users. The application resides on an Amazon EC2 instance, which requires access to various AWS services for its day-to-day operations.</p>\n<p>Which of the following is the best way to allow the EC2 instance to access the Amazon S3 bucket and other AWS services?</p>","options":[{"html":"Use <code>BatchGetSecretValue</code> to retrieve long-term API credentials from AWS Secrets Manager and store them on the EC2 instance.","correct":false},{"html":"Store the API credentials in a bastion host.","correct":false},{"html":"Add the API Credentials in the Security Group and assign it to the EC2 instance.","correct":false},{"html":"Create a role in IAM and assign it to the EC2 instance.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Ứng dụng trên EC2 cần truy cập S3 và dịch vụ AWS khác.</li>\n<li><strong>Yêu cầu chính:</strong> Cách <strong>tốt nhất</strong> (an toàn, best practice).</li>\n<li><strong>Thông tin gây nhiễu:</strong> meal planning, food consumption.</li>\n</ul>","answer":"<ul>\n<li><strong>Create a role in IAM and assign it to the EC2 instance.</strong></li>\n</ul>","explain":"<ul>\n<li>Role gắn qua <strong>instance profile</strong>; EC2 lấy <strong>temporary credentials</strong> từ IMDS, tự rotate.</li>\n<li>SDK/CLI tự dùng credential của role; cấp quyền theo <strong>least privilege</strong>.</li>\n</ul>","wrong":"<ul>\n<li><strong>Lấy credential dài hạn từ Secrets Manager:</strong> Vẫn dài hạn, vẫn lưu trên instance; gọi Secrets Manager vẫn cần Role.</li>\n<li><strong>Lưu trên bastion:</strong> Không giúp ứng dụng, tăng rủi ro.</li>\n<li><strong>Thêm vào Security Group:</strong> SG là firewall, không lưu credential.</li>\n</ul>","tip":"<ul>\n<li>EC2/Lambda/ECS cần truy cập AWS → <strong>IAM Role</strong>.</li>\n<li>Secrets Manager dùng cho <strong>mật khẩu DB, API key bên thứ ba</strong>.</li>\n</ul>"},{"id":46,"topic":"Design High-Performing Architectures – EMR + Redshift","supplement":false,"stem":"<p>A company receives semi-structured and structured data from different sources, which are eventually stored in the Amazon S3 data lake that uses client-side encryption with a custom client-side root key (CSE-Custom). The Solutions Architect plans to use big data processing frameworks to analyze data and access it using various business intelligence tools and standard SQL queries.</p>\n<p>Which of the following provides the MOST high-performing solution that fulfills this requirement?</p>","options":[{"html":"Create an Amazon EC2 instance and store the processed data in Amazon EBS.","correct":false},{"html":"Use AWS Batch jobs to process the data and store the processed data in S3.","correct":false},{"html":"Create an Amazon EMR cluster and store the processed data in Amazon Redshift.","correct":true},{"html":"Use Amazon Managed Service for Apache Flink Studio and store the processed data in Amazon DynamoDB.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Data lake trên S3, dữ liệu mã hóa <strong>CSE-Custom</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Dùng <strong>big data frameworks</strong>, truy cập bằng <strong>BI tools</strong> và <strong>standard SQL</strong>, <strong>hiệu năng cao nhất</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> <strong>EMR (EMRFS)</strong> hỗ trợ đọc dữ liệu CSE-Custom.</li>\n</ul>","answer":"<ul>\n<li><strong>Create an Amazon EMR cluster and store the processed data in Amazon Redshift.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>EMR:</strong> chạy Spark, Hadoop, Hive, Presto; EMRFS hỗ trợ custom encryption materials provider cho CSE-Custom.</li>\n<li><strong>Redshift:</strong> data warehouse, <strong>standard SQL</strong>, kết nối BI tool qua JDBC/ODBC, columnar + MPP → <strong>hiệu năng truy vấn cao</strong>.</li>\n<li>EMR xử lý, Redshift phục vụ SQL/BI.</li>\n</ul>","wrong":"<ul>\n<li><strong>EC2 + EBS:</strong> Tự cài framework; EBS không phải nền tảng SQL/BI.</li>\n<li><strong>Batch + S3:</strong> Không phải big data framework chuyên dụng; vẫn cần dịch vụ khác để truy vấn.</li>\n<li><strong>Flink + DynamoDB:</strong> Flink chuyên streaming; DynamoDB không hỗ trợ standard SQL cho BI.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Từ khóa</th>\n<th>Dịch vụ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>big data frameworks (Spark/Hadoop)</td>\n<td><strong>EMR</strong></td>\n</tr>\n<tr>\n<td>data warehouse, BI, SQL hiệu năng cao</td>\n<td><strong>Redshift</strong></td>\n</tr>\n<tr>\n<td>SQL serverless trực tiếp trên S3</td>\n<td><strong>Athena</strong></td>\n</tr>\n<tr>\n<td>real-time streaming analytics</td>\n<td><strong>Managed Service for Apache Flink</strong></td>\n</tr>\n</tbody>\n</table>"},{"id":47,"topic":"Design High-Performing Architectures – Route 53 + S3 static website","supplement":false,"stem":"<p>A company has a static corporate website hosted in a standard Amazon S3 bucket and a new web domain name that was registered using Amazon Route 53. There is a requirement to integrate these two services in order to successfully launch the corporate website.</p>\n<p>What are the prerequisites when routing traffic using Route 53 to a website that is hosted in an S3 Bucket? (Select TWO.)</p>","options":[{"html":"The record set must be of type \"MX\".","correct":false},{"html":"The S3 bucket must be in the same region as the hosted zone.","correct":false},{"html":"The Cross-Origin Resource Sharing (CORS) option should be enabled in the S3 bucket.","correct":false},{"html":"The S3 bucket name must be the same as the domain name.","correct":true},{"html":"A registered domain name.","correct":true}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Website tĩnh trên S3, domain đăng ký qua Route 53.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Điều kiện tiên quyết</strong> để Route 53 trỏ tới S3 website. <strong>Select TWO</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>The S3 bucket name must be the same as the domain name.</strong></li>\n<li><strong>A registered domain name.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Tên bucket = tên domain</strong> (ví dụ <code>example.com</code>), vì S3 website endpoint dựa vào <strong>Host header</strong> để chọn bucket.</li>\n<li>Cần <strong>domain đã đăng ký</strong>, rồi tạo <strong>Alias A record</strong> trỏ tới S3 website endpoint.</li>\n</ul>","wrong":"<ul>\n<li><strong>MX record:</strong> Dùng cho <strong>mail server</strong>.</li>\n<li><strong>Cùng region với hosted zone:</strong> <strong>Route 53 là dịch vụ global</strong>, hosted zone không thuộc region nào.</li>\n<li><strong>Bật CORS:</strong> Chỉ cần khi trang gọi tài nguyên từ <strong>domain khác</strong>.</li>\n</ul>","tip":"<ul>\n<li>Route 53 + S3 website: <strong>tên bucket = domain</strong>, có <strong>domain đăng ký</strong>, bật <strong>static website hosting</strong>, <strong>Alias A record</strong>.</li>\n</ul>"},{"id":48,"topic":"Design Secure Architectures – AWS Control Tower","supplement":false,"stem":"<p>A company wants to streamline the process of creating multiple AWS accounts within an AWS Organization. Each organization unit (OU) must be able to launch new accounts with preapproved configurations from the security team which will standardize the baselines and network configurations for all accounts in the organization.</p>\n<p>Which solution entails the least amount of effort to implement?</p>","options":[{"html":"Set up an AWS Control Tower Landing Zone. Enable pre-packaged guardrails to enforce policies or detect violations.","correct":true},{"html":"Configure AWS Resource Access Manager (AWS RAM) to launch new AWS accounts as well as standardize the baselines and network configurations for each organization unit","correct":false},{"html":"Set up an AWS Config aggregator on the root account of the organization to enable multi-account, multi-region data aggregation. Deploy conformance packs to standardize the baselines and network configurations for all accounts.","correct":false},{"html":"Centralized the creation of AWS accounts using AWS Systems Manager OpsCenter. Enforce policies and detect violations to all AWS accounts using AWS Security Hub.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Dùng AWS Organizations, cần tạo nhiều account.</li>\n<li><strong>Yêu cầu chính:</strong> Mỗi OU <strong>tạo account mới</strong> theo <strong>cấu hình đã duyệt</strong>, <strong>chuẩn hóa baseline và network</strong>, <strong>ít công sức nhất</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Set up an AWS Control Tower Landing Zone. Enable pre-packaged guardrails to enforce policies or detect violations.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Landing Zone:</strong> dựng sẵn môi trường multi-account chuẩn (OU, Log Archive, Audit, CloudTrail/Config tập trung).</li>\n<li><strong>Account Factory:</strong> tạo account mới theo <strong>template đã duyệt</strong>, gồm cấu hình mạng.</li>\n<li><strong>Guardrails (Controls):</strong> <strong>Preventive</strong> (SCP chặn) và <strong>Detective</strong> (Config rule phát hiện).</li>\n<li>Cấu hình qua console, không tự viết automation.</li>\n</ul>","wrong":"<ul>\n<li><strong>AWS RAM:</strong> Chia sẻ tài nguyên giữa account, <strong>không tạo account</strong>.</li>\n<li><strong>Config aggregator + conformance packs:</strong> Chỉ <strong>giám sát compliance</strong>, không tạo account.</li>\n<li><strong>OpsCenter + Security Hub:</strong> OpsCenter quản lý sự cố vận hành; Security Hub tổng hợp findings. Không tạo account.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Từ khóa</th>\n<th>Dịch vụ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>landing zone, account factory, guardrails, least effort</td>\n<td><strong>Control Tower</strong></td>\n</tr>\n<tr>\n<td>consolidated billing, SCP</td>\n<td><strong>Organizations</strong></td>\n</tr>\n<tr>\n<td>chia sẻ tài nguyên giữa account</td>\n<td><strong>RAM</strong></td>\n</tr>\n<tr>\n<td>compliance cấu hình</td>\n<td><strong>Config</strong></td>\n</tr>\n<tr>\n<td>tổng hợp security findings</td>\n<td><strong>Security Hub</strong></td>\n</tr>\n</tbody>\n</table>"},{"id":49,"topic":"Design High-Performing Architectures – S3 + CloudFront","supplement":false,"stem":"<p>A start-up company that offers an intuitive financial data analytics service has consulted about its AWS architecture. The company has a fleet of Amazon EC2 worker instances that process financial data and then output reports used by its clients. The reports must be stored in a durable storage. The number of files to be stored can grow over time as the start-up company is expanding rapidly overseas, and thus, it also needs a way to distribute the reports faster to clients located across the globe. Although Amazon S3 One Zone-IA saves storage cost, it does not support global distribution.</p>\n<p>Which of the following is a cost-efficient and scalable storage option for this scenario?</p>","options":[{"html":"Use Amazon Redshift as the data storage and Amazon CloudFront as the CDN.","correct":false},{"html":"Use multiple EC2 instance stores for data storage and Amazon ElastiCache as the CDN.","correct":false},{"html":"Use S3 Glacier as the data storage and Amazon ElastiCache as the CDN.","correct":false},{"html":"Use S3 as the data storage and Amazon CloudFront as the CDN.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> EC2 worker xuất file báo cáo cho khách hàng.</li>\n<li><strong>Yêu cầu chính:</strong> Lưu <strong>bền vững</strong>, <strong>scalable</strong>, <strong>phân phối nhanh toàn cầu</strong>, <strong>rẻ</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Use S3 as the data storage and Amazon CloudFront as the CDN.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>S3:</strong> độ bền 11 số 9, dung lượng gần như vô hạn, rẻ.</li>\n<li><strong>CloudFront:</strong> cache tại edge toàn cầu; dùng <strong>signed URL</strong> để chỉ đúng khách hàng tải được.</li>\n</ul>","wrong":"<ul>\n<li><strong>Redshift:</strong> Data warehouse, không dùng lưu file; đắt.</li>\n<li><strong>Instance store + ElastiCache:</strong> Instance store <strong>mất dữ liệu</strong> khi stop/terminate; <strong>ElastiCache không phải CDN</strong>.</li>\n<li><strong>Glacier + ElastiCache:</strong> Glacier lấy chậm; ElastiCache không phải CDN.</li>\n</ul>","tip":"<ul>\n<li>Durable + scalable + rẻ cho file → <strong>S3</strong>. Phân phối toàn cầu → <strong>CloudFront</strong>.</li>\n<li><strong>ElastiCache ≠ CDN</strong>. Instance store = lưu trữ tạm.</li>\n</ul>"},{"id":50,"topic":"Design High-Performing Architectures – AWS Glue ETL","supplement":false,"stem":"<p>An e-commerce company is receiving a large volume of sales data files in .csv format from its external partners on a daily basis. These data files are then stored in an Amazon S3 Bucket for processing and reporting purposes.</p>\n<p>The company wants to create an automated solution to convert these .csv files into Apache Parquet format and store the output of the processed files in a new S3 bucket called \"<code>processed-data-output</code>\". This new solution is meant to enhance the company's data processing and analytics workloads while keeping its operating costs low.</p>\n<p>Which of the following options must be implemented to meet these requirements with the LEAST operational overhead?</p>","options":[{"html":"Utilize an AWS Batch job definition with Bash syntax to convert the .csv files to the Apache Parquet format. Configure the job definition to run automatically whenever a new .csv file is uploaded to the source bucket.","correct":false},{"html":"Integrate Amazon EMR File System (EMRFS) with the source S3 bucket to automatically discover the new data files. Use an Amazon EMR Serverless with Apache Spark to convert the .csv files to the Apache Parquet format and then store the output in the \"<code>processed-data-output</code>\" bucket.","correct":false},{"html":"Use AWS Glue crawler to automatically discover the raw data file in S3 as well as check its corresponding schema. Create a scheduled ETL job in AWS Glue that will convert .csv files to Apache Parquet format and store the output of the processed files in the \"<code>processed-data-output</code>\" bucket.","correct":true},{"html":"Use Amazon S3 event notifications to trigger an AWS Lambda function that converts .csv files to Apache Parquet format using Apache Spark on an Amazon EMR cluster. Save the processed files to the \"<code>processed-data-output</code>\" bucket.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Nhận nhiều file CSV mỗi ngày, lưu S3.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Tự động chuyển CSV → Parquet</strong>, chi phí thấp, <strong>least operational overhead</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Bài toán <strong>ETL serverless</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Use AWS Glue crawler to automatically discover the raw data file in S3 as well as check its corresponding schema. Create a scheduled ETL job in AWS Glue that will convert .csv files to Apache Parquet format and store the output of the processed files in the \"<code>processed-data-output</code>\" bucket.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Glue Crawler</strong> quét S3, nhận diện schema, ghi vào <strong>Data Catalog</strong>.</li>\n<li><strong>Glue ETL job</strong> (Spark serverless) chuyển sang Parquet, ghi bucket đích; chạy theo <strong>lịch</strong> hoặc trigger.</li>\n<li>Không quản lý server/cluster; Data Catalog dùng lại được cho Athena, Redshift Spectrum.</li>\n</ul>","wrong":"<ul>\n<li><strong>Batch + Bash:</strong> Tự viết script; Batch không tự chạy khi có file mới nếu không cấu hình EventBridge.</li>\n<li><strong>EMRFS + EMR Serverless:</strong> EMRFS <strong>không tự phát hiện</strong> file mới; phải tự viết Spark.</li>\n<li><strong>S3 event → Lambda → EMR cluster:</strong> Phải quản lý cluster, phức tạp.</li>\n</ul>","tip":"<ul>\n<li>\"Convert CSV to Parquet\" + \"least overhead\" → <strong>AWS Glue</strong>.</li>\n<li>Big data framework, cần kiểm soát cluster → <strong>EMR</strong>. SQL trên S3 → <strong>Athena</strong>.</li>\n</ul>"},{"id":51,"topic":"Design Secure Architectures – AWS Config","supplement":false,"stem":"<p>A company needs to assess and audit all the configurations in its AWS account. It must enforce strict compliance by tracking all configuration changes made to any of its Amazon S3 buckets. Publicly accessible S3 buckets should also be identified automatically to avoid data breaches. The team also evaluated AWS Systems Manager Inventory for resource tracking, but it cannot monitor S3 bucket configurations or detect public buckets.</p>\n<p>Which of the following options will meet this requirement?</p>","options":[{"html":"Use AWS CloudTrail and review the event history of your AWS account.","correct":false},{"html":"Use AWS Config to set up a rule in your AWS account.","correct":true},{"html":"Use AWS IAM to generate a credential report.","correct":false},{"html":"Use AWS Trusted Advisor to analyze your AWS environment.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần đánh giá và audit <strong>cấu hình</strong> trong account.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Theo dõi mọi thay đổi cấu hình</strong> S3 bucket, <strong>tự động phát hiện bucket public</strong>, thực thi compliance.</li>\n<li><strong>Thông tin cần chú ý:</strong> \"Configuration changes\" + \"compliance\" → <strong>AWS Config</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Use AWS Config to set up a rule in your AWS account.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>AWS Config</strong> ghi lại <strong>lịch sử thay đổi cấu hình</strong> của từng resource.</li>\n<li><strong>Config Rules</strong> tự kiểm tra compliance. Có sẵn managed rule: <code>s3-bucket-public-read-prohibited</code>, <code>s3-bucket-public-write-prohibited</code>.</li>\n<li>Bucket vi phạm bị đánh dấu <strong>NON_COMPLIANT</strong>, có thể gửi thông báo (SNS/EventBridge) hoặc auto-remediation bằng SSM Automation.</li>\n</ul>","wrong":"<ul>\n<li><strong>CloudTrail:</strong> Ghi <strong>API call</strong> (ai làm gì), không đánh giá cấu hình hiện tại hay tự phát hiện bucket public.</li>\n<li><strong>IAM credential report:</strong> Chỉ liệt kê thông tin IAM user và credential.</li>\n<li><strong>Trusted Advisor:</strong> Chỉ đưa <strong>khuyến nghị chung</strong>, không theo dõi lịch sử cấu hình, không thực thi compliance chặt.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Từ khóa</th>\n<th>Dịch vụ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>configuration changes, compliance, audit configurations</td>\n<td><strong>AWS Config</strong></td>\n</tr>\n<tr>\n<td>who made the API call, user activity</td>\n<td><strong>CloudTrail</strong></td>\n</tr>\n<tr>\n<td>cost optimization, best practices</td>\n<td><strong>Trusted Advisor</strong></td>\n</tr>\n</tbody>\n</table>"},{"id":52,"topic":"Design Cost-Optimized Architectures – Tape Gateway + Glacier Deep Archive","supplement":false,"stem":"<p>An organization is currently using a tape backup solution to store its application data on-premises. Plans are in place to use a cloud storage service to preserve the backup data for up to 10 years, which may be accessed about once or twice a year.</p>\n<p>Which of the following is the most cost-effective option to implement this solution?</p>","options":[{"html":"Use Amazon S3 to store the backup data and add a lifecycle rule to transition the current version to S3 Glacier Flexible Retrieval.",
