 dữ liệu lưu trữ (data at rest).</li>\n<li><strong>E. ✗</strong> Chuyển subnet chỉ ảnh hưởng đến khả năng truy cập mạng, không mã hóa được dữ liệu trong EBS/S3.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm các giải pháp bảo mật mạng (Shield, WAF, private subnet) với giải pháp mã hóa dữ liệu — đề bài hỏi về \"storing sensitive data\" (data at rest), không phải network security.</p>","tip":"<p>Bảo vệ dữ liệu nhạy cảm (data at rest) trên AWS → luôn nghĩ đến <strong>encryption</strong> cho đúng loại storage đang dùng (EBS Encryption cho EBS, SSE/CSE cho S3).</p>"},
{"id":52,"topic":"Design Cost-Optimized Architectures – S3 Lifecycle expiration action","supplement":false,"stem":"<p>A company has an e-commerce application that saves the transaction logs to an S3 bucket. You are instructed by the CTO to configure the application to keep the transaction logs for one month for troubleshooting purposes, and then afterward, purge the logs.</p><p>What should you do to accomplish this requirement?</p>","options":[{"html":"Enable CORS on the Amazon S3 bucket which will enable the automatic monthly deletion of data","correct":false},{"html":"Configure the lifecycle configuration rules on the Amazon S3 bucket to purge the transaction logs after a month","correct":true},{"html":"Create a new IAM policy for the Amazon S3 bucket that automatically deletes the logs after a month","correct":false},{"html":"Add a new bucket policy on the Amazon S3 bucket.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Log cần giữ đúng 1 tháng, sau đó tự động xóa.</li>\n<li><strong>Yêu cầu chính:</strong> Cấu hình nào của S3 cho phép tự động xóa object sau 1 khoảng thời gian cố định.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"keep for one month... then purge\" → <strong>Lifecycle expiration action</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Configure the lifecycle configuration rules on the Amazon S3 bucket to purge the transaction logs after a month.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> CORS chỉ cho phép web app ở domain khác gọi tài nguyên S3, không liên quan đến việc tự động xóa dữ liệu.</li>\n<li><strong>B. ✓</strong> Lifecycle rule với expiration action cho phép S3 tự động xóa object sau số ngày chỉ định (ở đây là 30 ngày), đúng yêu cầu.</li>\n<li><strong>C. ✗</strong> IAM policy chỉ kiểm soát quyền hạn ai được làm gì, không có cơ chế tự động xóa object theo thời gian.</li>\n<li><strong>D. ✗</strong> Bucket policy cũng chỉ cấp quyền truy cập, không có chức năng tự động xóa dữ liệu theo lịch.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm các loại policy (IAM, bucket policy) với lifecycle rule — policy chỉ quản lý <strong>quyền truy cập</strong>, còn việc <strong>tự động xóa/transition object theo thời gian</strong> luôn thuộc về Lifecycle configuration.</p>","tip":"<p>Tự động xóa hoặc chuyển storage class của object S3 theo thời gian → luôn dùng <strong>S3 Lifecycle Configuration</strong> (expiration/transition action).</p>"},
{"id":53,"topic":"Design High-Performing Architectures – AWS Glue Job Bookmark","supplement":false,"stem":"<p>A Data Analyst in a financial company is tasked to provide insights on stock market trends to the company's clients. The company uses AWS Glue extract, transform, and load (ETL) jobs in daily report generation, which involves fetching data from an Amazon S3 bucket. The analyst discovered that old data from previous runs were being reprocessed, causing the jobs to take longer to complete.</p><p>Which solution would resolve the issue in the most operationally efficient way?</p>","options":[{"html":"Enable job bookmark for the ETL job.","correct":true},{"html":"Increase the size of the dataset used in the job to speed up the extraction and analysis process.","correct":false},{"html":"Create a Lambda function that removes any data already processed. Then, use Amazon EventBridge (Amazon CloudWatch Events) to trigger this function whenever the ETL job's status switches to SUCCEEDED.","correct":false},{"html":"Parallelize the job by splitting the dataset into smaller partitions and processing them simultaneously using multiple EC2 instances.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> AWS Glue ETL job xử lý lại dữ liệu cũ mỗi lần chạy, gây chậm không cần thiết.</li>\n<li><strong>Yêu cầu chính:</strong> Giải pháp hiệu quả nhất để job chỉ xử lý dữ liệu <strong>mới</strong>, không xử lý lại dữ liệu cũ.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"reprocessing old data\" trong Glue → tính năng có sẵn <strong>Job Bookmark</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Enable job bookmark for the ETL job.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Job Bookmark lưu trạng thái đã xử lý đến đâu, giúp job sau chỉ xử lý dữ liệu mới, tránh reprocessing — đúng tính năng có sẵn, không cần code thêm.</li>\n<li><strong>B. ✗</strong> Tăng kích thước dataset sẽ làm job chạy lâu hơn, làm trầm trọng thêm vấn đề thay vì giải quyết.</li>\n<li><strong>C. ✗</strong> Tự viết Lambda xóa dữ liệu đã xử lý phức tạp hơn, dễ lỗi (vd: job fail phải chạy lại nhưng data đã bị xóa) so với dùng Job Bookmark có sẵn.</li>\n<li><strong>D. ✗</strong> Parallelize chỉ giúp xử lý nhanh hơn <strong>cả dữ liệu cũ lẫn mới</strong>, không giải quyết được gốc rễ là tránh xử lý lại dữ liệu cũ; lại cần thêm tài nguyên EC2 phức tạp.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Các đáp án \"tăng tài nguyên\" hoặc \"song song hóa\" nghe hợp lý để tăng tốc, nhưng không giải quyết đúng gốc rễ vấn đề là tránh xử lý lại dữ liệu cũ — Job Bookmark mới là tính năng đúng mục đích.</p>","tip":"<p>AWS Glue ETL job bị xử lý lại dữ liệu cũ mỗi lần chạy → bật <strong>Job Bookmark</strong> để job chỉ tiếp tục từ chỗ dừng lại.</p>"},
{"id":54,"topic":"Design Secure Architectures – CloudFront OAC + Signed URL/Cookie","supplement":false,"stem":"<p>A company has clients all across the globe that access product files stored in several Amazon S3 buckets, which are behind each of the respective Amazon CloudFront web distributions. The company currently wants to deliver content to a specific client, ensuring that only that client can access the data. At present, all clients can access the S3 buckets directly using an S3 URL or through the CloudFront distribution. The Solutions Architect must serve the private content via CloudFront only, to secure the distribution of files.</p><p>Which combination of actions should the Architect implement to meet the above requirements? (Select TWO.)</p>","options":[{"html":"Create a custom CloudFront function to check and ensure that only their clients can access the files.","correct":false},{"html":"Require the users to access the private content by using special CloudFront signed URLs or signed cookies.","correct":true},{"html":"Restrict access to files in the origin by creating an origin access control (OAC) and giving it permission to read the files in the bucket.","correct":true},{"html":"Enable the Origin Shield feature of the CloudFront distribution to protect the files from unauthorized access.","correct":false},{"html":"Generate an S3 presigned URL to ensure that only the client can access the files. Remove permission to use S3 URLs to read the files for anyone else.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Hiện tại client có thể truy cập S3 trực tiếp bằng S3 URL (bỏ qua CloudFront); công ty muốn chỉ cho phép truy cập <strong>qua CloudFront</strong> và chỉ 1 client cụ thể được xem nội dung.</li>\n<li><strong>Yêu cầu chính:</strong> 2 hành động: (1) chặn truy cập trực tiếp vào S3 origin, (2) giới hạn ai được xem nội dung qua CloudFront.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Chặn truy cập trực tiếp S3 → <strong>OAC</strong>; giới hạn truy cập private content qua CloudFront → <strong>Signed URL/Cookie</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Require the users to access the private content by using special CloudFront signed URLs or signed cookies.</strong></li>\n<li><strong>Restrict access to files in the origin by creating an origin access control (OAC) and giving it permission to read the files in the bucket.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> CloudFront Functions chỉ là hàm JavaScript nhẹ cho các tùy biến request/response ở edge (vd: redirect, header), không phải cơ chế kiểm soát truy cập bảo mật.</li>\n<li><strong>B. ✓</strong> Signed URL/signed cookie đảm bảo chỉ client có URL/cookie hợp lệ (được cấp quyền) mới xem được nội dung qua CloudFront.</li>\n<li><strong>C. ✓</strong> OAC giới hạn S3 bucket chỉ cho phép chính CloudFront distribution đọc file, chặn hoàn toàn truy cập S3 URL trực tiếp.</li>\n<li><strong>D. ✗</strong> Origin Shield là tính năng cải thiện cache hit ratio và giảm tải origin, không phải cơ chế bảo mật truy cập.</li>\n<li><strong>E. ✗</strong> S3 presigned URL không đi qua CloudFront (vẫn truy cập trực tiếp S3), ngược lại với yêu cầu \"serve private content via CloudFront only\"; cũng khó scale khi có nhiều file.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> S3 presigned URL là giải pháp hợp lệ để giới hạn truy cập S3, nhưng đề yêu cầu rõ phải phục vụ <strong>qua CloudFront</strong>, nên presigned URL (đi thẳng S3) không thỏa yêu cầu này.</p>","tip":"<p>Bảo mật nội dung phân phối qua CloudFront: <strong>OAC</strong> để khóa truy cập trực tiếp origin (S3), kết hợp <strong>Signed URL/Cookie</strong> để giới hạn ai được xem nội dung.</p>"},
{"id":55,"topic":"Design High-Performing Architectures – Amazon Data Firehose nạp dữ liệu streaming","supplement":false,"stem":"<p>A data analytics company is setting up an innovative checkout-free grocery store. The Solutions Architect developed a real-time monitoring application that uses smart sensors to collect the items that the customers are getting from the grocery's refrigerators and shelves, then automatically deduct those items from customer accounts. The company wants to analyze the items that are frequently being bought and store the results in Amazon S3 for durable storage to determine the purchase behavior of its customers.</p><p>Which of the following must be used to easily capture, transform, and load streaming data into S3, Amazon OpenSearch Service, and Splunk?</p>","options":[{"html":"Amazon Redshift","correct":false},{"html":"Amazon DynamoDB Streams","correct":false},{"html":"Amazon SQS","correct":false},{"html":"Amazon Data Firehose","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần nạp (load) streaming data vào nhiều đích khác nhau: S3, OpenSearch, Splunk.</li>\n<li><strong>Yêu cầu chính:</strong> Dịch vụ dễ dùng nhất để capture, transform, load streaming data vào đúng 3 đích này.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"capture, transform, and load... into S3, OpenSearch, and Splunk\" → mô tả chính xác chức năng của <strong>Kinesis Data Firehose</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Amazon Data Firehose.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Redshift là data warehouse để phân tích, không phải dịch vụ để \"capture và load\" streaming data vào S3/OpenSearch/Splunk.</li>\n<li><strong>B. ✗</strong> DynamoDB Streams chỉ ghi lại thay đổi trên bảng DynamoDB, không có khả năng transform/load trực tiếp vào S3, OpenSearch, Splunk.</li>\n<li><strong>C. ✗</strong> SQS là hàng đợi tin nhắn đơn giản, không có cơ chế capture/transform/load dữ liệu vào các đích phân tích.</li>\n<li><strong>D. ✓</strong> Data Firehose được thiết kế đúng để capture, transform (qua Lambda), và load streaming data trực tiếp vào S3, Redshift, OpenSearch Service, và Splunk — fully managed, tự scale.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm Kinesis Data Streams với Data Firehose — Data Streams là nơi lưu trữ/đọc record (cần consumer tự xử lý), còn Firehose mới là dịch vụ <strong>tự động load</strong> dữ liệu vào các đích đích danh như S3/OpenSearch/Splunk.</p>","tip":"<p>Cần tự động nạp (load) streaming data vào S3/Redshift/OpenSearch/Splunk mà không cần code consumer → <strong>Amazon Data Firehose</strong>.</p>"},
{"id":56,"topic":"Design High-Performing Architectures – Transcribe + Translate + Comprehend","supplement":false,"stem":"<p>A call center wants to use Artificial Intelligence (AI) to extract insights from audio recordings to assess the quality of its customer service. The calls are available in both English and Hindi. A sentiment analysis report in English must be generated for each recording to assess whether or not the customer had a positive experience. Once the solution is completed, new languages will eventually be supported, such as Arabic, Mandarin, and Spanish.</p><p>How can the solutions architect build the solution without maintaining any machine learning model?</p>","options":[{"html":"Convert audio recordings into text using Amazon Transcribe. Set up Amazon Translate to translate Hindi texts into English and use Amazon Comprehend for sentiment analysis.","correct":true},{"html":"Utilize the Amazon Lex service to convert audio recordings into text. Call the Amazon Translate API to translate Hindi texts into English and use Amazon SageMaker Clarify for sentiment prediction and analysis.","correct":false},{"html":"Transcribe audio recordings into text using Amazon Polly's StartSpeechSynthesisTask operation. Set up Amazon Rekognition to recognize and automatically translate Hindi texts into English. Use the combination of Amazon Fraud Detector and Amazon SageMaker BlazingText algorithm for sentiment analysis.","correct":false},{"html":"Set up Amazon Comprehend to convert audio recordings into text. Use Amazon Kendra to translate Hindi texts into English and utilize the Amazon Detective service to automatically detect negative user behaviors for sentiment analysis.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần pipeline: audio → text → dịch sang English → phân tích sentiment, không muốn tự train/quản lý model ML.</li>\n<li><strong>Yêu cầu chính:</strong> Ghép đúng 3 AI service managed, mỗi service đúng vai trò của nó.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Speech-to-text → <strong>Transcribe</strong>; dịch ngôn ngữ → <strong>Translate</strong>; phân tích cảm xúc văn bản → <strong>Comprehend</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Convert audio recordings into text using Amazon Transcribe. Set up Amazon Translate to translate Hindi texts into English and use Amazon Comprehend for sentiment analysis.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Transcribe (speech-to-text) → Translate (dịch Hindi sang English) → Comprehend (sentiment analysis): đúng vai trò từng service, không cần train model riêng.</li>\n<li><strong>B. ✗</strong> Amazon Lex là dịch vụ chatbot/conversational AI, không chuyển audio thành text như Transcribe; SageMaker Clarify dùng để giải thích/đánh giá model ML, không phải sentiment analysis trực tiếp.</li>\n<li><strong>C. ✗</strong> Amazon Polly chỉ chuyển <strong>text thành audio</strong> (ngược lại hoàn toàn với yêu cầu); Rekognition dùng cho nhận diện hình ảnh, không dịch văn bản; Fraud Detector dùng phát hiện gian lận, không phải sentiment.</li>\n<li><strong>D. ✗</strong> Comprehend dùng để phân tích văn bản (NLP), không chuyển audio thành text; Kendra là dịch vụ tìm kiếm doanh nghiệp, không dịch ngôn ngữ; Detective dùng điều tra bảo mật, không liên quan sentiment.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Các đáp án sai đều cố tình ghép sai vai trò các dịch vụ AI nghe tên gần giống nhau (Polly vs Transcribe, Rekognition vs Translate, Comprehend vs Transcribe) — cần nhớ chính xác chức năng cốt lõi của từng dịch vụ.</p>","tip":"<p>Pipeline AI không cần tự train model: <strong>Transcribe</strong> (speech→text) → <strong>Translate</strong> (dịch ngôn ngữ) → <strong>Comprehend</strong> (phân tích sentiment/NLP).</p>"},
{"id":57,"topic":"Design High-Performing Architectures – Migrate Kubernetes + MongoDB không đổi code","supplement":false,"stem":"<p>A firm has a containerized application that runs on a self-managed Kubernetes cluster. The cluster writes data in an on-premises MongoDB database. A solutions architect is requested to move the service to AWS in order to minimize operational overhead. The firm prohibits any changes to the code.</p><p>Which action meets these objectives?</p>","options":[{"html":"Migrate the cluster to an Amazon Elastic Kubernetes Service (EKS) cluster and the database to an Amazon DocumentDB (with MongoDB compatibility) database.","correct":true},{"html":"Migrate the cluster to an Amazon Elastic Container Service (ECS) cluster using Amazon ECS Anywhere and the database to an Amazon Aurora Serverless database.","correct":false},{"html":"Migrate the cluster to an Amazon Elastic Container Service (ECS) cluster with the images stored in the Amazon Elastic Container Registry (Amazon ECR). Move the database to an Amazon Neptune database","correct":false},{"html":"Migrate the cluster to an Amazon Elastic Kubernetes Service (EKS) cluster using Amazon EKS Anywhere and the database to an Amazon DynamoDB table.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Đang chạy Kubernetes + MongoDB on-premises, muốn chuyển sang AWS, <strong>không được sửa code</strong>, giảm operational overhead.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng cặp dịch vụ Kubernetes-managed + database tương thích MongoDB API (để không phải đổi code).</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"no changes to the code\" + MongoDB → <strong>DocumentDB (MongoDB compatibility)</strong>; Kubernetes → <strong>EKS</strong> (không phải ECS).</li>\n</ul>","answer":"<ul>\n<li><strong>Migrate the cluster to an Amazon Elastic Kubernetes Service (EKS) cluster and the database to an Amazon DocumentDB (with MongoDB compatibility) database.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> EKS chạy Kubernetes chuẩn (tương thích cluster hiện tại); DocumentDB tương thích API MongoDB nên ứng dụng không cần sửa code khi kết nối.</li>\n<li><strong>B. ✗</strong> Aurora Serverless là relational database, MongoDB là NoSQL document — chuyển đổi trực tiếp sẽ đòi hỏi sửa code đáng kể, trái với yêu cầu.</li>\n<li><strong>C. ✗</strong> ECS không chạy Kubernetes gốc; Amazon Neptune là graph database, hoàn toàn khác API với MongoDB, chắc chắn phải sửa code.</li>\n<li><strong>D. ✗</strong> DynamoDB tuy hỗ trợ JSON nhưng có API hoàn toàn khác MongoDB, vẫn phải sửa code để tương thích — vi phạm điều kiện \"no code changes\".</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> DynamoDB hỗ trợ document-like data khiến nhiều người nghĩ nó tương thích MongoDB, nhưng API của 2 dịch vụ hoàn toàn khác nhau — chỉ DocumentDB mới có \"MongoDB compatibility\" thực sự.</p>","tip":"<p>Di chuyển Kubernetes lên AWS mà giữ nguyên hành vi → <strong>EKS</strong>. Di chuyển MongoDB mà không đổi code ứng dụng → <strong>Amazon DocumentDB (MongoDB compatibility)</strong>.</p>"},
{"id":58,"topic":"Design High-Performing Architectures – S3 Object Lambda","supplement":false,"stem":"<p>A web-based application must extract specific data from a large CSV file stored in an Amazon S3 bucket. The application requires filtering or transforming the data dynamically before returning it, ensuring that only the needed data is returned without downloading the entire object.</p><p>Which of the following actions should be implemented to achieve this?</p>","options":[{"html":"Use S3 Object Lambda with a Lambda function that processes the data based on the bucket's name and object's key.","correct":true},{"html":"Use S3 Object Lambda with a Lambda function that processes the data based on the bucket's name.","correct":false},{"html":"Use S3 Object Lambda with a Lambda function that processes the data based on the bucket's name and object's metadata.","correct":false},{"html":"Use S3 Object Lambda with a Lambda function that processes the data based on the bucket's name and object tags.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần filter/transform dữ liệu CSV ngay khi GET từ S3, không tải toàn bộ object về.</li>\n<li><strong>Yêu cầu chính:</strong> Xác định tham số đúng mà Lambda function (trong S3 Object Lambda) cần dùng để xử lý đúng object cần thiết.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Để xác định đúng file cần xử lý, Lambda cần biết <strong>tên bucket</strong> và <strong>object key (tên file)</strong> — không phải metadata hay tag.</li>\n</ul>","answer":"<ul>\n<li><strong>Use S3 Object Lambda with a Lambda function that processes the data based on the bucket's name and object's key.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Object Lambda cần bucket's name + object's key để biết chính xác file nào cần xử lý và áp dụng logic filter/transform lên nội dung thực tế của nó.</li>\n<li><strong>B. ✗</strong> Chỉ có tên bucket thì không đủ để xác định file cụ thể cần xử lý khi bucket có nhiều object.</li>\n<li><strong>C. ✗</strong> Metadata chỉ cung cấp thông tin phụ (kích thước, thời gian sửa...), không phản ánh nội dung thực của file để filter/transform.</li>\n<li><strong>D. ✗</strong> Object tag dùng để phân loại/organize object, không liên quan đến nội dung file cần xử lý động.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Metadata và object tag đều là \"thông tin về object\" nên dễ bị nhầm là đủ để xử lý nội dung — nhưng cả hai đều không phản ánh nội dung thật của file, chỉ có bucket name + object key mới xác định đúng file cần GET và xử lý.</p>","tip":"<p>S3 Object Lambda biến đổi dữ liệu khi GET: Lambda cần biết <strong>bucket's name + object's key</strong> để biết chính xác object nào đang được yêu cầu.</p>"}
,
{"id":59,"topic":"Design High-Performing Architectures – S3 Multipart Upload cho file lớn","supplement":false,"stem":"<p>A document sharing website is using AWS as its cloud infrastructure. Free users can upload a total of 5 GB of data, while premium users can upload as much as 5 TB. The application uploads the user files, which can have a max file size of 1 TB, to an Amazon S3 Bucket. The developers initially tried using an S3 presigned URL for each upload, but that alone doesn't solve the challenges of transferring such large files.</p><p>In this scenario, what is the best way for the application to upload the large files to S3?</p>","options":[{"html":"Use a single PUT request to upload the large file","correct":false},{"html":"Use AWS DataSync","correct":false},{"html":"Use S3 Transfer Acceleration","correct":false},{"html":"Use Multipart Upload","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> File có thể lên tới 1TB, vượt xa giới hạn 1 PUT request đơn (5GB).</li>\n<li><strong>Yêu cầu chính:</strong> Cách upload file cực lớn lên S3 một cách đáng tin cậy.</li>\n<li><strong>Từ khóa cần chú ý:</strong> File &gt; 100MB, đặc biệt lên đến 1TB → bắt buộc dùng <strong>Multipart Upload</strong> (chia nhỏ thành nhiều part).</li>\n</ul>","answer":"<ul>\n<li><strong>Use Multipart Upload.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> 1 PUT request chỉ upload tối đa 5GB; file 1TB chắc chắn fail nếu dùng cách này.</li>\n<li><strong>B. ✗</strong> DataSync dùng để di chuyển dữ liệu giữa storage system (on-premises ↔ AWS, hoặc giữa các AWS storage service), không phải giải pháp cho end-user upload file trực tiếp từ app.</li>\n<li><strong>C. ✗</strong> Transfer Acceleration chỉ tăng tốc độ truyền qua Edge Location, không giải quyết giới hạn kích thước của 1 lần upload — vẫn cần Multipart Upload cho file lớn.</li>\n<li><strong>D. ✓</strong> Multipart Upload chia file lớn thành nhiều part nhỏ, upload song song/độc lập, rồi ghép lại ở S3 — giải pháp chuẩn cho object &gt;100MB, hỗ trợ tối đa đến 5TB.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Transfer Acceleration thường bị nhầm là \"giải pháp cho file lớn\", nhưng nó chỉ tăng tốc đường truyền, không giải quyết được giới hạn kích thước tối đa của 1 PUT request — 2 vấn đề hoàn toàn khác nhau.</p>","tip":"<p>Object S3 &gt; 100MB (đặc biệt file rất lớn) → luôn dùng <strong>Multipart Upload</strong>. Muốn tăng tốc độ truyền (không phải kích thước) → kết hợp thêm Transfer Acceleration.</p>"},
{"id":60,"topic":"Design Cost-Optimized Architectures – EC2 instance lifecycle billing","supplement":false,"stem":"<p>In Amazon EC2, you can manage your instances from the moment you launch them up to their termination. You can flexibly control your computing costs by changing the EC2 instance state.</p><p>Which of the following statements is true regarding EC2 billing? (Select TWO.)</p>","options":[{"html":"You will be billed when your On-Demand instance is in pending state.","correct":false},{"html":"You will be billed when your Reserved instance is in terminated state.","correct":true},{"html":"You will not be billed for any instance usage while an instance is not in the running state.","correct":false},{"html":"You will be billed when your Spot instance is preparing to stop with a stopping state.","correct":false},{"html":"You will be billed when your On-Demand instance is preparing to hibernate with a stopping state.","correct":true}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Kiểm tra hiểu biết chi tiết về billing qua từng trạng thái vòng đời EC2 instance (pending, running, stopping, stopped, terminated).</li>\n<li><strong>Yêu cầu chính:</strong> Chọn 2 phát biểu đúng về billing trong các trạng thái đặc biệt.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"stopping\" để <strong>hibernate</strong> → vẫn bị tính phí (khác với stopping thường); Reserved Instance <strong>terminated</strong> vẫn bị tính phí đến hết term hợp đồng.</li>\n</ul>","answer":"<ul>\n<li><strong>You will be billed when your Reserved instance is in terminated state.</strong></li>\n<li><strong>You will be billed when your On-Demand instance is preparing to hibernate with a stopping state.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Instance ở trạng thái <code>pending</code> (đang khởi động) chưa bị tính phí.</li>\n<li><strong>B. ✓</strong> Reserved Instance đã cam kết trả tiền theo term hợp đồng; dù instance bị terminate, phí vẫn tiếp tục được tính đến hết thời hạn cam kết.</li>\n<li><strong>C. ✗</strong> Sai vì vẫn có ngoại lệ: trạng thái <code>stopping</code> để hibernate vẫn bị tính phí dù chưa ở trạng thái <code>running</code>.</li>\n<li><strong>D. ✗</strong> Spot instance ở trạng thái <code>stopping</code> để dừng bình thường (không hibernate) thì không bị tính phí.</li>\n<li><strong>E. ✓</strong> Khi instance đang <code>stopping</code> để chuẩn bị <strong>hibernate</strong> (lưu lại RAM), AWS vẫn tính phí trong giai đoạn này — khác với stopping thông thường.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ cho rằng \"stopping\" luôn không bị tính phí, nhưng cần phân biệt rõ 2 trường hợp: stopping để <strong>dừng bình thường</strong> (không tính phí) và stopping để <strong>hibernate</strong> (vẫn tính phí).</p>","tip":"<p>EC2 billing: <code>pending</code> không tính phí; <code>stopping</code> để hibernate <strong>vẫn tính phí</strong>; Reserved Instance terminated sớm vẫn bị tính phí đến hết term.</p>"},
{"id":61,"topic":"Design Secure Architectures – Mã hóa dữ liệu S3 cho HIPAA compliance","supplement":false,"stem":"<p>A Solutions Architect is working for a large insurance firm. To maintain compliance with HIPAA laws, all data that is backed up or stored on Amazon S3 needs to be encrypted at rest.</p><p>Which encryption methods can be employed, assuming S3 is being used for storing financial-related data? (Select TWO.)</p>","options":[{"html":"Encrypt the data using your own encryption keys then copy the data to Amazon S3 over HTTPS endpoints.","correct":true},{"html":"Store the data in encrypted EBS snapshots","correct":false},{"html":"Use AWS Shield to protect your data at rest","correct":false},{"html":"Store the data on EBS volumes with encryption enabled instead of using Amazon S3","correct":false},{"html":"Enable SSE on an S3 bucket to make use of AES-256 encryption","correct":true}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần mã hóa dữ liệu tài chính <strong>at rest</strong> trong S3 để đáp ứng HIPAA, nhưng đề vẫn yêu cầu phải <strong>dùng S3</strong> (không phải chuyển sang EBS).</li>\n<li><strong>Yêu cầu chính:</strong> Chọn 2 phương pháp mã hóa đúng, áp dụng được cho dữ liệu lưu trên S3.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"encrypt your own key then copy over HTTPS\" = SSE-C; \"SSE... AES-256\" = SSE-S3; cả hai đều là cách mã hóa hợp lệ cho S3.</li>\n</ul>","answer":"<ul>\n<li><strong>Encrypt the data using your own encryption keys then copy the data to Amazon S3 over HTTPS endpoints.</strong></li>\n<li><strong>Enable SSE on an S3 bucket to make use of AES-256 encryption.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Đây chính là cách hoạt động của Server-Side Encryption với Customer-Provided Keys (SSE-C): khách hàng tự quản lý key, gửi kèm key khi upload qua HTTPS.</li>\n<li><strong>B. ✗</strong> EBS snapshot là cơ chế bảo vệ cho EBS volume, không áp dụng cho dữ liệu lưu trong S3 (đề bài yêu cầu dùng S3).</li>\n<li><strong>C. ✗</strong> AWS Shield bảo vệ chống DDoS ở tầng network, không mã hóa dữ liệu lưu trữ.</li>\n<li><strong>D. ✗</strong> Đề yêu cầu mã hóa dữ liệu <strong>trên S3</strong>, không phải thay thế hoàn toàn bằng EBS — lạc đề.</li>\n<li><strong>E. ✓</strong> SSE (Server-Side Encryption) mặc định dùng thuật toán AES-256 để mã hóa object trước khi lưu lên đĩa trong S3 data center.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Các đáp án về EBS (snapshot, volume encryption) nghe hợp lý vì đều liên quan \"encryption\", nhưng đề bài yêu cầu rõ dữ liệu phải lưu trên <strong>S3</strong>, không phải chuyển sang EBS.</p>","tip":"<p>Mã hóa dữ liệu lưu trên S3: Server-Side (SSE-S3/SSE-KMS/SSE-C, mặc định AES-256) hoặc Client-Side Encryption (tự mã hóa trước khi upload qua HTTPS).</p>"},
{"id":62,"topic":"Design Secure Architectures – SCP chặn sửa AWS Config","supplement":false,"stem":"<p>A company intends to give each of its developers a personal AWS account through AWS Organizations. To enforce regulatory policies, preconfigured AWS Config rules will be set in the new accounts. A solutions architect must see to it that developers are unable to remove or modify any rules in AWS Config.</p><p>Which solution meets the objective with the least operational overhead?</p>","options":[{"html":"Configure an AWS Config rule in the root account to detect if changes to the new account's Config rules are made.","correct":false},{"html":"Set up an AWS Control Tower in the root account to detect if there were any changes to the new account's AWS Config rules. Attach an IAM trust relationship to the IAM User of each developer which prevents any changes in AWS Config.","correct":false},{"html":"Use an IAM Role in the new accounts with an attached IAM trust relationship to disable the access of the root user to AWS Config.","correct":false},{"html":"Add the developers' AWS account to an organization unit (OU). Attach a service control policy (SCP) to the OU that restricts access to AWS Config.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Nhiều account riêng của từng developer trong 1 AWS Organizations, cần <strong>chặn tuyệt đối</strong> (kể cả admin/root) việc sửa Config rule.</li>\n<li><strong>Yêu cầu chính:</strong> Giải pháp chặn quyền (guardrail), không chỉ phát hiện/giám sát thay đổi.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"unable to remove or modify\" (ngăn chặn tuyệt đối) → <strong>Service Control Policy (SCP)</strong> gắn vào OU, áp dụng cả với root user của account thành viên.</li>\n</ul>","answer":"<ul>\n<li><strong>Add the developers' AWS account to an organization unit (OU). Attach a service control policy (SCP) to the OU that restricts access to AWS Config.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> AWS Config rule ở root account chỉ <strong>phát hiện/giám sát</strong> thay đổi, không <strong>ngăn chặn</strong> được developer sửa Config rule.</li>\n<li><strong>B. ✗</strong> Control Tower chủ yếu để setup/governance multi-account, không trực tiếp chặn hành động trên AWS Config; trust relationship chỉ định nghĩa ai được assume role, không chặn hành động cụ thể.</li>\n<li><strong>C. ✗</strong> IAM policy (kể cả qua role) <strong>không áp dụng được lên root user</strong> của account; trust relationship cũng không có chức năng chặn hành động như vậy.</li>\n<li><strong>D. ✓</strong> SCP là guardrail ở cấp OU, giới hạn quyền tối đa cho mọi identity trong account (kể cả root), kể cả khi admin cấp full quyền thì SCP vẫn chặn — đúng yêu cầu ngăn chặn tuyệt đối.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm \"giám sát/phát hiện thay đổi\" (Config rule, Control Tower) với \"ngăn chặn thay đổi\" (SCP) — đề bài yêu cầu rõ \"unable to remove or modify\", tức là phải chặn hành động, không chỉ phát hiện.</p>","tip":"<p>Muốn <strong>ngăn chặn tuyệt đối</strong> hành động của mọi identity (kể cả root) trong 1 account thuộc Organizations → dùng <strong>SCP</strong> gắn vào OU/account, không phải IAM policy hay Config rule giám sát.</p>"},
{"id":63,"topic":"Design High-Performing Architectures – Xử lý Reserved Instance không dùng nữa","supplement":false,"stem":"<p>A large financial firm in the country has an AWS environment that contains several Reserved EC2 instances hosting a web application that has been decommissioned last week. To save costs, you need to stop incurring charges for the Reserved instances as soon as possible.</p><p>What cost-effective steps will you take in this circumstance? (Select TWO.)</p>","options":[{"html":"Go to the AWS Reserved Instance Marketplace and sell the Reserved instances.","correct":true},{"html":"Terminate the Reserved instances as soon as possible to avoid getting billed at the on-demand price when it expires.","correct":true},{"html":"Contact AWS to cancel your AWS subscription.","correct":false},{"html":"Go to the Amazon.com online shopping website and sell the Reserved instances.","correct":false},{"html":"Stop the Reserved instances as soon as possible.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Reserved Instance đã bị decommission nhưng vẫn còn cam kết trả phí reservation; cần ngừng phát sinh chi phí sớm nhất.</li>\n<li><strong>Yêu cầu chính:</strong> 2 hành động cost-effective để xử lý Reserved Instance không còn dùng.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"Stop\" không giải quyết được vấn đề reservation vẫn tính phí; cần <strong>terminate</strong> hoặc <strong>bán lại trên Reserved Instance Marketplace</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Go to the AWS Reserved Instance Marketplace and sell the Reserved instances.</strong></li>\n<li><strong>Terminate the Reserved instances as soon as possible to avoid getting billed at the on-demand price when it expires.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> AWS Reserved Instance Marketplace cho phép bán lại RI chưa dùng hết, thu hồi lại một phần chi phí đã cam kết.</li>\n<li><strong>B. ✓</strong> Terminate instance tránh việc instance tiếp tục chạy ở mức giá On-Demand (đắt hơn) khi Reserved Instance hết hạn mà vẫn còn application chạy bên dưới; cũng tránh phí liên quan (Elastic IP gắn với instance stopped...).</li>\n<li><strong>C. ✗</strong> Không cần hủy toàn bộ tài khoản AWS chỉ vì 1 vài Reserved Instance không dùng nữa — quá cực đoan, không hợp lý.</li>\n<li><strong>D. ✗</strong> Amazon.com (website bán lẻ tiêu dùng) hoàn toàn khác với AWS Reserved Instance Marketplace — không thể bán RI ở đó.</li>\n<li><strong>E. ✗</strong> Instance stopped vẫn có thể bị start lại, và cam kết chi phí Reserved Instance vẫn tiếp tục tính dù instance có đang stop hay không — stop không giải quyết được vấn đề cốt lõi.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Nhiều người nghĩ \"stop instance\" là đủ để ngừng tính phí, nhưng với Reserved Instance, phí reservation vẫn tính dựa theo <strong>cam kết hợp đồng</strong>, không phụ thuộc instance có đang chạy hay không.</p>","tip":"<p>Reserved Instance không còn dùng → <strong>terminate</strong> instance (tránh phí phát sinh khác) và/hoặc <strong>bán lại trên RI Marketplace</strong> để thu hồi phần nào chi phí, không chỉ đơn giản \"stop\".</p>"},
{"id":64,"topic":"Design Resilient Architectures – AWS Backup cho retention 90 ngày","supplement":false,"stem":"<p>A company needs to use Amazon Aurora as the Amazon RDS database engine for its web application. The Solutions Architect has been instructed to implement a 90-day RDS backup retention policy.</p><p>Which of the following options can satisfy the given requirement?</p>","options":[{"html":"Configure RDS to export the automated snapshot automatically to Amazon S3 and create a lifecycle policy to delete the object after 90 days.","correct":false},{"html":"Create an AWS Backup plan to take daily snapshots with a retention period of 90 days.","correct":true},{"html":"Configure an automated backup and set the backup retention period to 90 days.","correct":false},{"html":"Create a daily scheduled event using Amazon EventBridge and AWS Lambda to directly download the RDS automated snapshot to an Amazon S3 bucket. Archive snapshots older than 90 days to Glacier.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần retention backup 90 ngày cho Aurora — vượt quá giới hạn của RDS automated backup thông thường.</li>\n<li><strong>Yêu cầu chính:</strong> Tìm giải pháp hỗ trợ retention &gt; 35 ngày (giới hạn tối đa của automated backup).</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"90-day retention\" vượt giới hạn 35 ngày của automated backup → cần <strong>AWS Backup</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Create an AWS Backup plan to take daily snapshots with a retention period of 90 days.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Không thể tự động export automated snapshot sang S3; việc export phải thực hiện thủ công, không đáp ứng yêu cầu tự động.</li>\n<li><strong>B. ✓</strong> AWS Backup cho phép định nghĩa backup plan với retention tùy chỉnh (ở đây 90 ngày), vượt xa giới hạn 35 ngày của automated backup mặc định.</li>\n<li><strong>C. ✗</strong> Automated backup của RDS chỉ hỗ trợ retention tối đa <strong>35 ngày</strong>, không thể đặt 90 ngày.</li>\n<li><strong>D. ✗</strong> Không thể tải trực tiếp automated snapshot xuống S3; phải copy thành manual snapshot trước — cách làm phức tạp, không cần thiết khi đã có AWS Backup.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Nhiều người tưởng chỉ cần \"tăng retention period\" của automated backup lên 90 ngày là xong, nhưng RDS automated backup chỉ hỗ trợ tối đa <strong>35 ngày</strong> — vượt mức này bắt buộc phải dùng AWS Backup.</p>","tip":"<p>RDS automated backup: retention tối đa <strong>35 ngày</strong>. Cần retention dài hơn (90 ngày, 1 năm...) → dùng <strong>AWS Backup</strong> với backup plan tùy chỉnh.</p>"},
{"id":65,"topic":"Design Cost-Optimized Architectures – Spot Instance cho batch load không ưu tiên","supplement":false,"stem":"<p>A company is hosting EC2 instances that are on non-production environment and processing non-priority batch loads, which can be interrupted at any time.</p><p>What is the best instance purchasing option which can be applied to your EC2 instances in this case?</p>","options":[{"html":"On-Demand Capacity Reservations","correct":false},{"html":"On-Demand Instances","correct":false},{"html":"Spot Instances","correct":true},{"html":"Reserved Instances","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Môi trường non-production, xử lý batch load không ưu tiên, <strong>chịu được gián đoạn bất cứ lúc nào</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn loại instance purchasing option rẻ nhất phù hợp với đặc tính tải này.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"can be interrupted at any time\" → đặc tính kinh điển của <strong>Spot Instance</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Spot Instances.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> On-Demand Capacity Reservation phù hợp cho tải cần đảm bảo capacity ổn định, ngược hoàn toàn với tải có thể gián đoạn bất cứ lúc nào.</li>\n<li><strong>B. ✗</strong> On-Demand là lựa chọn linh hoạt nhưng đắt hơn Spot nhiều, không phải lựa chọn tối ưu chi phí cho tải không ưu tiên.</li>\n<li><strong>C. ✓</strong> Spot Instance tận dụng compute capacity dư thừa với giá rẻ nhất (giảm tới 90% so với On-Demand), phù hợp hoàn hảo cho tải chịu được gián đoạn, không ưu tiên.</li>\n<li><strong>D. ✗</strong> Reserved Instance dành cho tải ổn định, có thể dự đoán trước, đi kèm cam kết dài hạn — không phù hợp cho batch load tạm thời, không ưu tiên.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Reserved Instance thường được xem là \"tiết kiệm nhất\" cho EC2, nhưng chỉ đúng với tải <strong>ổn định, dài hạn, dự đoán được</strong> — với tải gián đoạn, không ưu tiên thì Spot Instance mới là lựa chọn rẻ nhất.</p>","tip":"<p>Batch load không ưu tiên, chịu được gián đoạn bất cứ lúc nào, không SLA → luôn chọn <strong>Spot Instance</strong> để tối ưu chi phí tối đa.</p>"}

];

  done: {},       // qid -> true/false (correct?)
  flags: new Set(),
  perm: {},       // qid -> displayed order of original option indices
  hint: {},
  view: "quiz"
};
const $ = s => document.querySelector(s);

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function perm(q){
  if(!state.perm[q.id]) state.perm[q.id] = $("#optShuffleA").checked ? shuffle(q.options.map((_,i)=>i)) : q.options.map((_,i)=>i);
  return state.perm[q.id];
}
function visible(){
  const f = $("#fFilter").value, t = $("#fTopic").value;
  return state.order.filter(i => {
    const q = Q[i];
    if(t && topicGroup(q.topic) !== t) return false;
    if(f === "todo") return !(q.id in state.done);
    if(f === "bad") return state.done[q.id] === false;
    if(f === "flag") return state.flags.has(q.id);
    if(f === "sup") return q.supplement;
    return true;
  });
}
function topicGroup(t){ return t.split("–")[0].trim(); }

function renderStats(){
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length, bad = vals.length - ok;
  $("#sDone").textContent = `${vals.length}/${Q.length}`;
  $("#sOk").textContent = ok; $("#sBad").textContent = bad;
  $("#sPct").textContent = vals.length ? Math.round(ok*100/vals.length) + "%" : "–";
  $("#prog").style.width = (vals.length*100/Q.length) + "%";
}
function renderGrid(){
  const vis = new Set(visible());
  const cur = state.order[state.pos];
  const g = $("#grid"); g.innerHTML = "";
  Q.forEach((q, i) => {
    const b = document.createElement("button");
    b.className = "cell";
    if(q.id in state.done) b.classList.add(state.done[q.id] ? "ok" : "bad");
    if(state.flags.has(q.id)) b.classList.add("flag");
    if(q.supplement) b.classList.add("sup");
    if(i === cur && state.view === "quiz") b.classList.add("cur");
    if(!vis.has(i)) b.classList.add("dim");
    b.textContent = q.id;
    b.title = q.topic + (q.supplement ? " (câu bổ sung)" : "");
    b.onclick = () => { state.view = "quiz"; state.pos = state.order.indexOf(i); render(); window.scrollTo({top:0,behavior:"smooth"}); };
    g.appendChild(b);
  });
}

function section(cls, title, html, open){
  return `<details class="sec ${cls}" ${open?"open":""}><summary>${title}</summary><div class="body">${html}</div></details>`;
}

function renderQuiz(){
  const main = $("#main");
  const vis = visible();
  if(!vis.length){ main.innerHTML = `<div class="card empty">Không có câu nào khớp bộ lọc hiện tại.</div>`; return; }
  let idx = state.order[state.pos];
  if(!vis.includes(idx)){ idx = vis[0]; state.pos = state.order.indexOf(idx); }
  const q = Q[idx];
  const answered = q.id in state.done;
  const sel = state.sel[q.id] || new Set();
  const p = perm(q);
  const vpos = vis.indexOf(idx);

  let opts = p.map((oi, k) => {
    const o = q.options[oi];
    let cls = "opt" + (q.multi > 1 ? " multi" : "");
    let tag = "";
    if(answered){
      if(o.correct && sel.has(oi)){ cls += " right"; tag = "✓ Đúng"; }
      else if(!o.correct && sel.has(oi)){ cls += " wrong"; tag = "✗ Bạn chọn"; }
      else if(o.correct){ cls += " right missed"; tag = "✓ Đáp án đúng"; }
    } else if(sel.has(oi)) cls += " sel";
    return `<div class="${cls}" data-oi="${oi}" role="${q.multi>1?"checkbox":"radio"}" aria-checked="${sel.has(oi)}" tabindex="0">
      <span class="key">${LETTERS[k]}</span><span class="txt">${o.html}${tag?`<span class="tag">${tag}</span>`:""}</span></div>`;
  }).join("");

  const showExplain = answered && $("#optAuto").checked;
  let after = "";
  if(answered){
    const ok = state.done[q.id];
    after += `<div class="verdict ${ok?"ok":"bad"}">${ok ? "Chính xác!" :"Chưa đúng. Xem đáp án được đánh dấu xanh và phần giải thích bên dưới."}</div>`;
    after += section("s-analysis", "Phân tích đề", q.analysis, showExplain);
    after += section("s-answer", "Đáp án đúng", q.answer, showExplain);
    after += section("s-explain", "Giải thích", q.explain, showExplain);
    after += section("s-wrong", "Vì sao các đáp án khác sai", q.wrong, showExplain);
    after += section("s-tip", "Mẹo thi", q.tip, showExplain);
  } else if(state.hint[q.id]){
    after += `<div class="hint"><h3>Gợi ý · Phân tích đề</h3><div class="body">${q.analysis}</div></div>`;
  }

  const need = q.multi > 1 ? `Chọn ${q.multi} đáp án` : "Chọn 1 đáp án";
  main.innerHTML = `<div class="card ${answered?"locked":""}">
    <div class="qhead">
      <span class="qnum">Câu ${q.id}</span>
      <span class="chip">${q.topic}</span>
      ${q.supplement ? `<span class="chip sup">Câu bổ sung</span>` : ""}
      <span class="chip multi">${need}</span>
      <button class="flagbtn ${state.flags.has(q.id)?"on":""}" id="btnFlag">${state.flags.has(q.id)?"★ Đã đánh dấu":"☆ Đánh dấu"}</button>
    </div>
    <div class="stem">${q.stem}</div>
    <div class="opts">${opts}</div>
    <div class="actions">
      <button class="btn" id="btnPrev" ${vpos<=0?"disabled":""}>← Câu trước</button>
      ${!answered ? `<button class="btn ghost" id="btnHint">${state.hint[q.id]?"Ẩn gợi ý":"Gợi ý: phân tích đề"}</button>` : `<button class="btn ghost" id="btnRetry">Làm lại câu này</button>`}
      <span class="spacer"></span>
      ${!answered ? `<button class="btn primary" id="btnCheck" ${sel.size!==q.multi?"disabled":""}>Kiểm tra</button>` : ""}
      <button class="btn ${answered?"primary":""}" id="btnNext" ${vpos>=vis.length-1?"disabled":""}>Câu sau →</button>
    </div>
    ${after}
    <div class="kbd"><kbd>A</kbd>–<kbd>E</kbd> hoặc <kbd>1</kbd>–<kbd>5</kbd> chọn đáp án · <kbd>Enter</kbd> kiểm tra / sang câu sau · <kbd>←</kbd> <kbd>→</kbd> chuyển câu · <kbd>H</kbd> gợi ý</div>
  </div>`;

  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => toggle(q, +el.dataset.oi);
    el.onkeydown = e => { if(e.key===" "){ e.preventDefault(); toggle(q, +el.dataset.oi); } };
  });
  $("#btnFlag").onclick = () => { state.flags.has(q.id) ? state.flags.delete(q.id) : state.flags.add(q.id); render(); };
  $("#btnPrev").onclick = () => go(-1);
  $("#btnNext").onclick = () => go(1);
  if($("#btnCheck")) $("#btnCheck").onclick = () => check(q);
  if($("#btnHint")) $("#btnHint").onclick = () => { state.hint[q.id] = !state.hint[q.id]; render(); };
  if($("#btnRetry")) $("#btnRetry").onclick = () => { delete state.done[q.id]; state.sel[q.id] = new Set(); delete state.perm[q.id]; render(); };
}

function toggle(q, oi){
  if(q.id in state.done) return;
  const s = state.sel[q.id] || (state.sel[q.id] = new Set());
  if(q.multi === 1){ s.clear(); s.add(oi); }
  else if(s.has(oi)) s.delete(oi);
  else { if(s.size >= q.multi) return; s.add(oi); }
  render();
}
function check(q){
  const s = state.sel[q.id] || new Set();
  if(s.size !== q.multi) return;
  const correct = q.options.every((o, i) => o.correct === s.has(i));
  state.done[q.id] = correct;
  render();
}
function go(d){
  const vis = visible();
  const cur = state.order[state.pos];
  let vp = vis.indexOf(cur);
  vp = Math.max(0, Math.min(vis.length-1, vp + d));
  state.pos = state.order.indexOf(vis[vp]);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderSummary(){
  const groups = {};
  Q.forEach(q => {
    const g = topicGroup(q.topic);
    groups[g] = groups[g] || {n:0, done:0, ok:0, bad:[]};
    groups[g].n++;
    if(q.id in state.done){ groups[g].done++; if(state.done[q.id]) groups[g].ok++; else groups[g].bad.push(q.id); }
  });
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length;
  const wrongIds = Q.filter(q => state.done[q.id] === false).map(q => q.id);
  const rows = Object.entries(groups).sort((a,b)=>b[1].n-a[1].n).map(([g, v]) => {
    const pct = v.done ? Math.round(v.ok*100/v.done) : null;
    return `<tr><td>${g}</td><td class="n">${v.done}/${v.n}</td><td class="n">${pct===null?"–":pct+"%"}</td>
      <td><div class="bar"><i style="width:${pct||0}%"></i></div></td><td>${v.bad.map(id=>`<a href="#" data-q="${id}">${id}</a>`).join(", ")}</td></tr>`;
  }).join("");
  $("#main").innerHTML = `<div class="card summary">
    <h2>Kết quả</h2>
    <p>Đã làm <b>${vals.length}/${Q.length}</b> câu · Đúng <b>${ok}</b> · Sai <b>${vals.length-ok}</b>${vals.length?` · Tỷ lệ đúng <b>${Math.round(ok*100/vals.length)}%</b>`:""}.
    ${vals.length===Q.length ? (ok/Q.length>=0.72 ? " Mức này tương đương ngưỡng đậu (~720/1000)." : " Chưa đạt ngưỡng ~72%, nên ôn lại các câu sai.") : ""}</p>
    ${wrongIds.length ? `<p><button class="btn primary" id="btnReviewBad">Ôn lại ${wrongIds.length} câu sai</button></p>` : ""}
    <table><thead><tr><th>Chủ đề</th><th class="n">Đã làm</th><th class="n">Đúng</th><th></th><th>Câu sai</th></tr></thead><tbody>${rows}</tbody></table>
    <p style="margin-top:14px"><button class="btn" id="btnBack">← Quay lại làm bài</button></p>
  </div>`;
  $("#btnBack").onclick = () => { state.view = "quiz"; render(); };
  if($("#btnReviewBad")) $("#btnReviewBad").onclick = () => {
    $("#fFilter").value = "bad"; $("#fTopic").value = "";
    wrongIds.forEach(id => { delete state.done[id]; state.sel[id] = new Set(); delete state.perm[id]; });
    // keep them findable after reset: mark as flagged review set
    wrongIds.forEach(id => state.flags.add(id));
    $("#fFilter").value = "flag";
    state.view = "quiz"; state.pos = state.order.indexOf(Q.findIndex(q => q.id === wrongIds[0])); render();
  };
  $("#main").querySelectorAll("a[data-q]").forEach(a => a.onclick = e => {
    e.preventDefault(); state.view = "quiz"; $("#fFilter").value = "all"; $("#fTopic").value = "";
    state.pos = state.order.indexOf(Q.findIndex(q => q.id === +a.dataset.q)); render();
  });
}

function render(){
  renderStats(); renderGrid();
  state.view === "summary" ? renderSummary() : renderQuiz();
}

// init
(function(){
  const groups = [...new Set(Q.map(q => topicGroup(q.topic)))].sort();
  groups.forEach(g => { const o = document.createElement("option"); o.value = g; o.textContent = g; $("#fTopic").appendChild(o); });
  $("#fFilter").onchange = $("#fTopic").onchange = () => { state.view = "quiz"; render(); };
  $("#optShuffleQ").onchange = e => {
    const cur = state.order[state.pos];
    state.order = e.target.checked ? shuffle(Q.map((_, i) => i)) : Q.map((_, i) => i);
    state.pos = e.target.checked ? 0 : state.order.indexOf(cur);
    render();
  };
  $("#optShuffleA").onchange = () => { Q.forEach(q => { if(!(q.id in state.done)) delete state.perm[q.id]; }); render(); };
  $("#optAuto").onchange = render;
  $("#btnSummary").onclick = () => { state.view = "summary"; render(); };
  $("#btnReset").onclick = () => {
    if(!Object.keys(state.done).length) return;
    state.sel = {}; state.done = {}; state.hint = {}; state.perm = {}; state.pos = 0; state.view = "quiz";
    $("#fFilter").value = "all"; render();
  };
  $("#btnTheme").onclick = () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  };
  document.addEventListener("keydown", e => {
    if(state.view !== "quiz" || e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    const q = Q[state.order[state.pos]]; if(!q) return;
    const k = e.key.toUpperCase();
    let n = "12345678".indexOf(k); if(n < 0) n = LETTERS.indexOf(k);
    if(k.length === 1 && n >= 0 && n < q.options.length && k !== "H"){ toggle(q, perm(q)[n]); return; }
    if(e.key === "Enter"){ e.preventDefault(); (q.id in state.done) ? go(1) : check(q); }
    else if(e.key === "ArrowRight") go(1);
    else if(e.key === "ArrowLeft") go(-1);
    else if(k === "H" && !(q.id in state.done)){ state.hint[q.id] = !state.hint[q.id]; render(); }
  });
  render();
})();
</script>
</body>
</html>
