<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Test 6 · SAA-C03</title>
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#eef0f5; --text:#1a1d23; --muted:#646c78;
  --border:#dfe3ea; --accent:#3a5bf0; --accent-hover:#2d49d6; --accent-soft:#e8edfe;
  --ok:#1a8f55; --ok-soft:#e4f6ec; --bad:#d13b3b; --bad-soft:#fcebeb; --warn:#b4790a; --warn-soft:#fff3db;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
    --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
    --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
    --shadow:none; --shadow-sm:none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
  --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
  --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
  --shadow:none; --shadow-sm:none;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.65 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .2s ease,color .2s ease;
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);padding:.1em .4em;border-radius:5px}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 56px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
header.top h1{
  font-size:21px;margin:0;letter-spacing:-.015em;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent-hover));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
header.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:7px 14px;min-width:76px;text-align:center;box-shadow:var(--shadow-sm);transition:border-color .15s ease,transform .15s ease}
.stat:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hover));width:0;transition:width .3s ease}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:16px}
.toolbar select,.btn{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 13px;cursor:pointer;transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent}
.toolbar label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.layout{display:grid;grid-template-columns:264px 1fr;gap:18px;align-items:start}
.side{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;position:sticky;top:14px;box-shadow:var(--shadow)}
.side h2{font-size:12.5px;margin:0 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.cell{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;height:32px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums;position:relative;padding:0;transition:border-color .12s ease,transform .12s ease,background .12s ease}
.cell:hover{border-color:var(--accent);transform:translateY(-1px)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell.dim{opacity:.32}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cell.sup{font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--border);background:var(--surface-2)}
.legend .l-ok::before{background:var(--ok-soft);border-color:var(--ok)}
.legend .l-bad::before{background:var(--bad-soft);border-color:var(--bad)}
.legend .l-flag::before{background:var(--warn);border-radius:50%;border:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.qnum{font-weight:700;font-size:17px;letter-spacing:-.01em}
.chip{font-size:12px;padding:3px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;transition:transform .12s ease}
.chip.sup{background:var(--warn-soft);color:var(--warn)}
.chip.multi{background:var(--surface-2);color:var(--muted);font-weight:500}
.flagbtn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:13px;transition:border-color .15s ease,background .15s ease,transform .15s ease}
.flagbtn:hover{border-color:var(--warn);color:var(--warn);transform:translateY(-1px)}
.flagbtn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.stem{line-height:1.7}
.stem p{margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;padding:11px 13px;cursor:pointer;background:var(--surface);transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.opt:hover{border-color:var(--accent);transform:translateX(2px);box-shadow:var(--shadow-sm)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--surface-2);transition:background .15s ease,border-color .15s ease,color .15s ease}
.opt.multi .key{border-radius:7px}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--border);transform:none;box-shadow:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.tag{font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)} .opt.missed .tag{color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .spacer{flex:1}
.verdict{margin:18px 0 6px;padding:11px 15px;border-radius:11px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.hint{margin-top:16px;border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:9px;padding:11px 15px;background:var(--surface-2)}
.hint h3{margin:0 0 6px;font-size:14px;color:var(--warn)}
details.sec{border:1px solid var(--border);border-radius:11px;margin-top:11px;background:var(--surface);transition:border-color .15s ease}
details.sec>summary{cursor:pointer;padding:11px 15px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"›";display:inline-block;transition:transform .15s ease;color:var(--muted);font-size:18px;line-height:1}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec .body{padding:0 16px 14px}
.body p{margin:7px 0}
.body ul,.body ol{margin:7px 0;padding-left:22px}
.body li{margin:4px 0}
.body table{border-collapse:collapse;width:100%;margin:9px 0;font-size:14px;display:block;overflow-x:auto}
.body th,.body td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
.body th{background:var(--surface-2)}
.sec.s-answer{border-left:3px solid var(--ok)}
.sec.s-tip{border-left:3px solid var(--accent)}
.empty{color:var(--muted);text-align:center;padding:44px 10px}
.kbd{font-size:12px;color:var(--muted);margin-top:14px}
.kbd kbd{font-family:inherit;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface-2)}
.summary h2{margin-top:0}
.summary table{border-collapse:collapse;width:100%;font-size:14px}
.summary th,.summary td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left}
.summary td.n{font-variant-numeric:tabular-nums;text-align:right}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s ease}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .grid{grid-template-columns:repeat(10,1fr)}
}
@media (max-width:480px){
  .wrap{padding:14px 16px 40px}
  .card{padding:16px}
  .grid{grid-template-columns:repeat(8,1fr)}
  .stat{min-width:64px;padding:5px 10px}
}
</style>
</head>

    <div>
      <h1>AWS SAA-C03 · Practice Test 6 (65 câu)</h1>
      <div class="sub">Đề tiếng Anh · Giải thích tiếng Việt · Tiến độ chỉ lưu trong phiên đang mở</div>
    <p style="margin:4px 0 0"><a href="../index.html" style="color:var(--accent)">&larr; Về trang luyện đề chính</a></p>

  <div class="progress"><i id="prog"></i></div>

  <div class="toolbar">

        <span class="l-ok">Đúng</span><span class="l-bad">Sai</span><span>Chưa làm</span><span class="l-flag">Đánh dấu</span>

    <main id="main"></main>

<script>
const Q = [{"id":1,"topic":"Design Cost-Optimized Architectures – AWS Budgets Actions","supplement":false,"stem":"An organization has rolled out a multi-account architecture using AWS Control Tower to isolate development environments. Each developer has their own dedicated AWS account to provision and test workloads. However, the company is concerned about unexpected spikes in resource usage and AWS spending from individual developer accounts. The leadership team wants to implement a cost control mechanism that can proactively enforce budget limits, ensure automatic responses to overspending, and require minimal ongoing administrative effort.<br>What is the most efficient solution to meet this goal with the least operational overhead?","options":[{"html":"Use AWS Service Catalog to restrict developers to predefined resource templates with pricing limits. In each developer account, create a scheduled Lambda function that stops all running resources at the end of the day and and restart these resources at the start of next business day","correct":false},{"html":"Deploy an AWS Lambda function to run daily in each developer’s account. Use the function to analyze cost usage reports via the Cost Explorer API. If costs exceed a predefined threshold, the function invokes an AWS Config remediation rule","correct":false},{"html":"Use AWS Cost Explorer to enable detailed usage and cost reports for each developer account. Configure daily usage reports to be emailed to developers. Create dashboards for each developer in Cost Explorer, and require them to monitor their resource consumption and take action if they approach spending thresholds","correct":false},{"html":"Use AWS Budgets to define spending thresholds for each developer’s account. Configure budget alerts to notify developers when actual or forecasted usage exceeds the set limit. Attach Budgets actions to automatically apply a restrictive DenyAll IAM policy to the developer’s primary IAM role when the budget threshold is crossed","correct":true}],"multi":1,"analysis":"<p>Chọn công cụ quản lý chi phí + least overhead</p>","answer":"<p>Budgets đặt ngưỡng (actual/forecast), gửi cảnh báo, và Budgets Actions tự động gắn IAM policy/SCP hoặc dừng EC2/RDS.</p>","explain":"<ul><li><b>A. ✗</b> Không theo dõi số tiền đã tiêu; tắt máy ban đêm không chặn được chi tiêu ban ngày; Lambda ở mỗi account.</li><li><b>B. ✗</b> Tự xây lại những gì Budgets đã có sẵn, overhead cao.</li><li><b>C. ✗</b> Giám sát thụ động, không có cơ chế tự chặn.</li><li><b>D. ✓</b> Ngưỡng + cảnh báo + tự động chặn, hoàn toàn native.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Service Catalog chuẩn hóa 'cái gì được deploy', không kiểm soát 'tốn bao nhiêu tiền'.</p>","tip":"<p>Cost Explorer = xem/phân tích. Budgets = ngưỡng + cảnh báo. Budgets Actions = tự động hành động. Cost Anomaly Detection = phát hiện bất thường bằng ML.</p>"},{"id":2,"topic":"Design High-Performing Architectures – AWS Application Migration Service (MGN)","supplement":false,"stem":"A global logistics provider operates several legacy applications on virtual machines (VMs) within a private data center. Due to accelerated business growth and limited capacity in its existing infrastructure, the provider decides to migrate select applications to AWS. The company opts for a lift-and-shift strategy for its non-mission-critical systems to meet tight migration deadlines. The solution must support rapid migration without requiring extensive application refactoring.<br>Which combination of actions will best support this migration approach? (Select three)","options":[{"html":"Shut down the source virtual machines and immediately provision EC2 replacement instances using manual AMI creation","correct":false},{"html":"Use AWS CloudEndure Disaster Recovery to continuously replicate the VMs to AWS and then promote the target instances for production use","correct":false},{"html":"Perform the initial replication. Launch test instances in AWS to validate the migrated VMs before final cutover","correct":true},{"html":"Use AWS Application Migration Service (MGN). Install the AWS Replication Agent on the source VMs","correct":true},{"html":"Use Amazon EC2 Auto Scaling to automatically re-create the VMs in AWS by launching replacement instances with matching configurations","correct":false},{"html":"Launch a cutover instance after completing testing and confirming that replication is up-to-date","correct":true}],"multi":3,"analysis":"<p>Chọn các bước của một quy trình</p>","answer":"<p>Workflow MGN: cài agent → replicate → test → cutover → finalize.</p>","explain":"<ul><li><b>A. ✗</b> Downtime, thủ công, rủi ro.</li><li><b>B. ✗</b> Công cụ DR (tên cũ, nay là AWS DRS), không phải migration; trùng chức năng với MGN.</li><li><b>C. ✓</b> Bước test trong workflow MGN.</li><li><b>D. ✓</b> Dịch vụ rehost chuẩn.</li><li><b>E. ✗</b> ASG không migrate VM.</li><li><b>F. ✓</b> Bước go-live cuối cùng.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Tên CloudEndure là tên cũ; chọn thêm một công cụ replicate khác là trùng chức năng.</p>","tip":"<p>Rehost → MGN. DR → Elastic Disaster Recovery. DB → DMS (+SCT). File → DataSync. TB–PB, mạng chậm → Snowball.</p>"},{"id":3,"topic":"Design Resilient Architectures – HA multi-tier: ASG + ALB + RDS Multi-AZ","supplement":false,"stem":"A startup wants to create a highly available architecture for its multi-tier application. Currently, the startup manages a single Amazon EC2 instance along with a single Amazon RDS MySQL DB instance. The startup has hired you as an AWS Certified Solutions Architect - Associate to build a solution that meets these requirements while minimizing the underlying infrastructure maintenance effort.<br>What will you recommend?","options":[{"html":"Create an Auto-Scaling group with a desired capacity of a total of two Amazon EC2 instances across two Availability Zones. Configure an Application Load Balancer having a target group of these Amazon EC2 instances. Set up Amazon RDS MySQL DB in a multi-AZ configuration","correct":true},{"html":"Create an Auto-Scaling group with a desired capacity of a total of two Amazon EC2 instances across two Availability Zones. Configure an Application Load Balancer having a target group of these Amazon EC2 instances. Set up a read replica of the Amazon RDS MySQL DB in another Availability Zone","correct":false},{"html":"Provision a second Amazon EC2 instance in another Availability Zone. Provision a second Amazon RDS MySQL DB in another Availabililty Zone. Leverage Amazon Route 53 for equal distribution of incoming traffic to the Amazon EC2 instances. Use a custom script to sync data across the two MySQL DBs","correct":false},{"html":"Create an Auto-Scaling group with a desired capacity of a total of two Amazon EC2 instances in a single Availability Zone. Configure an Application Load Balancer having a target group of these Amazon EC2 instances. Set up Amazon RDS MySQL DB in a multi-AZ configuration","correct":false}],"multi":1,"analysis":"<p>Ghép 2 mảnh: tầng web + tầng DB</p>","answer":"<p>HA tầng web = ASG đa AZ + ALB. HA tầng DB = RDS Multi-AZ.</p>","explain":"<ul><li><b>A. ✓</b> HA cả 2 tầng: EC2 đa AZ + ALB, DB Multi-AZ tự failover.</li><li><b>B. ✗</b> Read replica dùng để scale đọc, không phải giải pháp HA (failover thủ công).</li><li><b>C. ✗</b> Tự đồng bộ DB bằng script, rất tốn công và rủi ro.</li><li><b>D. ✗</b> 1 AZ chết thì cả tầng web chết.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Nhầm Read Replica là giải pháp HA.</p>","tip":"<p>HA = Multi-AZ. Scale đọc = Read Replica. 'Single AZ' trong đáp án → không HA.</p>"},{"id":4,"topic":"Design Cost-Optimized Architectures – Spot persistent request","supplement":false,"stem":"The development team at a company manages a Python based nightly process with a runtime of 30 minutes. The process can withstand any interruptions in its execution and start over again. The process currently runs on the on-premises infrastructure and it needs to be migrated to AWS.<br>Which of the following options do you recommend as the MOST cost-effective solution?","options":[{"html":"Run on a Spot Instance with a persistent request type","correct":true},{"html":"Run on an Application Load Balancer","correct":false},{"html":"Run on Amazon EMR","correct":false},{"html":"Run on AWS Lambda","correct":false}],"multi":1,"analysis":"<p>Chọn mô hình compute theo đặc điểm workload</p>","answer":"<p>Chịu được gián đoạn + rẻ nhất → Spot; job lặp lại → persistent.</p>","explain":"<ul><li><b>A. ✓</b> Rẻ nhất; persistent tự mở lại request khi bị thu hồi.</li><li><b>B. ✗</b> Load balancer không chạy code.</li><li><b>C. ✗</b> Big data cluster, quá nặng và đắt.</li><li><b>D. ✗</b> Quá 15 phút.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Quên giới hạn 15 phút của Lambda.</p>","tip":"<p>Spot có cảnh báo 2 phút. Hủy persistent request không tự terminate instance.</p>"},{"id":5,"topic":"Design Secure Architectures – IAM Group","supplement":false,"stem":"A team has around 200 users, each of these having an IAM user account in AWS. Currently, they all have read access to an Amazon S3 bucket. The team wants 50 among them to have write and read access to the buckets.<br>How can you provide these users access in the least possible time, with minimal changes?","options":[{"html":"Create a group, attach the policy to the group and place the users in the group","correct":true},{"html":"Create a policy and assign it manually to the 50 users","correct":false},{"html":"Update the Amazon S3 bucket policy","correct":false},{"html":"Create an AWS Multi-Factor Authentication (AWS MFA) user with read / write access and link 50 IAM with AWS MFA","correct":false}],"multi":1,"analysis":"<p>Best practice IAM</p>","answer":"<p>Nhiều user cùng quyền → IAM Group.</p>","explain":"<ul><li><b>A. ✓</b> Quản lý quyền theo nhóm, dễ thêm/bớt người.</li><li><b>B. ✗</b> Chạy được nhưng thủ công, khó quản lý.</li><li><b>C. ✗</b> Bucket policy bị giới hạn 20 KB, không scale khi liệt kê nhiều user.</li><li><b>D. ✗</b> MFA là xác thực thêm, không cấp quyền.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> MFA không liên quan tới phân quyền.</p>","tip":"<p>Group không lồng nhau được và không phải principal trong policy. Quy mô lớn/nhiều account → IAM Identity Center.</p>"},{"id":6,"topic":"Design High-Performing Architectures – HA bastion host: NLB","supplement":false,"stem":"The systems administrator at a company wants to set up a highly available architecture for a bastion host solution.<br>As a solutions architect, which of the following options would you recommend as the solution?","options":[{"html":"Create a VPC Endpoint for a fleet of Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group","correct":false},{"html":"Create a public Application Load Balancer that links to Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group","correct":false},{"html":"Create a public Network Load Balancer that links to Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group","correct":true},{"html":"Create an elastic IP address (EIP) and assign it to all Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group","correct":false}],"multi":1,"analysis":"<p>Chọn load balancer theo giao thức</p>","answer":"<p>SSH là TCP → cần load balancer L4 → NLB.</p>","explain":"<ul><li><b>A. ✗</b> VPC endpoint để truy cập dịch vụ AWS riêng tư, không đứng trước EC2.</li><li><b>B. ✗</b> ALB chỉ xử lý HTTP/HTTPS (L7); SSH là TCP cổng 22.</li><li><b>C. ✓</b> NLB xử lý TCP (L4), phân phối SSH tới nhiều bastion.</li><li><b>D. ✗</b> Một EIP chỉ gắn được vào MỘT instance tại một thời điểm.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Nghĩ một EIP gắn được cho nhiều instance.</p>","tip":"<p>HTTP/HTTPS → ALB. TCP/UDP/TLS, IP tĩnh → NLB. Appliance bảo mật → GWLB. Thực tế hiện nay nên dùng Session Manager hoặc EC2 Instance Connect Endpoint thay cho bastion.</p>"},{"id":7,"topic":"Design Resilient Architectures – Route 53 private hosted zone","supplement":false,"stem":"The engineering team at an e-commerce company wants to set up a custom domain for internal usage such as internaldomainexample.com. The team wants to use the private hosted zones feature of Amazon Route 53 to accomplish this.<br>Which of the following settings of the VPC need to be enabled? (Select two)","options":[{"html":"enableDnsDomain","correct":false},{"html":"enableDnsHostnames","correct":true},{"html":"enableDnsSupport","correct":true},{"html":"enableVpcSupport","correct":false},{"html":"enableVpcHostnames","correct":false}],"multi":2,"analysis":"<p>Recall tên thuộc tính</p>","answer":"<p>Private hosted zone cần VPC bật enableDnsHostnames và enableDnsSupport.</p>","explain":"<ul><li><b>A. ✗</b> Không tồn tại.</li><li><b>B. ✓</b> Đúng.</li><li><b>C. ✓</b> Đúng.</li><li><b>D. ✗</b> Không tồn tại.</li><li><b>E. ✗</b> Không tồn tại.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Tên bịa nghe rất giống tên thật (enableDnsDomain).</p>","tip":"<p>Hai thuộc tính DNS của VPC đều bắt đầu bằng 'enableDns': Support (dùng Route 53 Resolver) và Hostnames (gán DNS hostname cho instance).</p>"},{"id":8,"topic":"Design High-Performing Architectures – CloudFront + S3 Transfer Acceleration","supplement":false,"stem":"A global photography startup hosts a static image-sharing site on an Amazon S3 bucket. The website allows users from different parts of the world to upload, view, and download photos through their mobile devices. As the platform has gained popularity, users have started experiencing latency issues, especially when uploading and downloading images. The team needs a solution to enhance global performance but wants to implement it with minimal development effort and without redesigning the application.<br>Which solution will most effectively address the performance issues with the least operational overhead?","options":[{"html":"Create multiple S3 buckets in different Regions and replicate image data based on user location. Configure CloudFront to upload and download from the nearest bucket","correct":false},{"html":"Migrate the website from S3 to Amazon EC2 instances in multiple Regions. Use an Application Load Balancer with AWS Global Accelerator to distribute global traffic and reduce latency","correct":false},{"html":"Deploy an Amazon CloudFront distribution with the S3 bucket as the origin to improve download speeds. Enable S3 Transfer Acceleration to reduce upload latency for global users","correct":true},{"html":"Enable AWS Global Accelerator on the S3 bucket to accelerate both uploads and downloads. Reconfigure the website to route requests through the accelerator","correct":false}],"multi":1,"analysis":"<p>Tách 2 chiều: download và upload</p>","answer":"<p>Download → CloudFront. Upload xa → S3 Transfer Acceleration.</p>","explain":"<ul><li><b>A. ✗</b> Phức tạp: replication, logic chọn bucket.</li><li><b>B. ✗</b> Thiết kế lại toàn bộ, trái 'minimal effort'.</li><li><b>C. ✓</b> CloudFront tăng tốc tải xuống, Transfer Acceleration tăng tốc tải lên; đều bật dễ dàng.</li><li><b>D. ✗</b> Global Accelerator không nhận S3 làm endpoint trực tiếp.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Global Accelerator nghe hợp lý nhưng không hỗ trợ S3.</p>","tip":"<p>GA endpoint: ALB, NLB, EC2, Elastic IP. Upload file lớn → kết hợp Multipart Upload.</p>"},{"id":9,"topic":"Design Cost-Optimized Architectures – S3 Lifecycle → Standard-IA","supplement":false,"stem":"A research firm archives experimental datasets generated by automated laboratory equipment. Each dataset is about 10 MB in size and is initially accessed frequently for analysis within the first month. After this period, the access rate drops significantly, but the data must remain immediately retrievable if needed. Due to compliance policies, each dataset must be retained in AWS storage for exactly 4 years before deletion. The firm currently stores the data in Amazon S3 Standard storage and wants to minimize costs without compromising data availability or retrieval speed.<br>Which solution meets these requirements most cost-effectively?","options":[{"html":"Set up an S3 Lifecycle configuration to transfer all datasets to S3 One Zone-Infrequent Access (S3 One Zone-IA) after 30 days, and permanently delete them 4 years after creation","correct":false},{"html":"Define an S3 Lifecycle policy that transitions datasets to S3 Glacier Instant Retrieval 30 days after creation and schedules the deletion of each object exactly 4 years after its creation","correct":false},{"html":"Configure an S3 Lifecycle policy to migrate datasets to S3 Glacier Flexible Retrieval after 30 days and delete them automatically 4 years after creation","correct":false},{"html":"Define an S3 Lifecycle policy that transitions datasets to S3 Standard-Infrequent Access (S3 Standard-IA) 30 days after creation and schedules the deletion of each object exactly 4 years after its creation","correct":true}],"multi":1,"analysis":"<p>Chọn storage class theo vòng đời</p>","answer":"<p>Lọc tốc độ (loại Glacier Flexible) → lọc độ bền (loại One Zone-IA) → so chi phí theo tần suất.</p>","explain":"<ul><li><b>A. ✗</b> Chỉ 1 AZ, rủi ro với dữ liệu không tạo lại được.</li><li><b>B. ✗</b> Truy xuất tức thì, lưu rẻ hơn nhưng phí retrieval cao; đề chọn IA vì dữ liệu vẫn được truy cập thỉnh thoảng (đáp án gây tranh cãi).</li><li><b>C. ✗</b> Truy xuất phút → giờ, vi phạm 'immediately'.</li><li><b>D. ✓</b> Tức thì, đa AZ, phí retrieval thấp.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Glacier IR vs Standard-IA phụ thuộc tần suất truy cập; đề không nói rõ.</p>","tip":"<p>~1 lần/tháng → Standard-IA. ~1 lần/quý → Glacier IR. Thời gian tối thiểu: IA 30 ngày, Glacier IR/Flexible 90 ngày, Deep Archive 180 ngày.</p>"},{"id":10,"topic":"Design Cost-Optimized Architectures – Redshift cold data → S3 + Athena","supplement":false,"stem":"Your company has created a data warehouse using Amazon Redshift that is used to analyze data from Amazon S3. From the usage pattern, you have detected that after 30 days, the data is rarely queried in Amazon Redshift and it's not &quot;hot data&quot; anymore. You would like to preserve the SQL querying capability on your data and get the queries started immediately. Also, you want to adopt a pricing model that allows you to save the maximum amount of cost on Amazon Redshift.<br>What do you recommend? (Select two)","options":[{"html":"Migrate the Amazon Redshift underlying storage to Amazon S3 IA","correct":false},{"html":"Analyze the cold data with Amazon Athena","correct":true},{"html":"Move the data to Amazon S3 Glacier Deep Archive after 30 days","correct":false},{"html":"Create a smaller Amazon Redshift Cluster with the cold data","correct":false},{"html":"Move the data to Amazon S3 Standard IA after 30 days","correct":true}],"multi":2,"analysis":"<p>Ghép 2 mảnh: lưu ở đâu + query bằng gì</p>","answer":"<p>Lưu cold data ở S3 Standard-IA, query bằng Athena.</p>","explain":"<ul><li><b>A. ✗</b> Storage của Redshift không có storage class kiểu S3.</li><li><b>B. ✓</b> Query SQL trực tiếp trên S3, serverless, trả theo query.</li><li><b>C. ✗</b> Deep Archive mất nhiều giờ để lấy dữ liệu, không query ngay được.</li><li><b>D. ✗</b> Vẫn phải trả tiền cluster, không giảm chi phí đáng kể.</li><li><b>E. ✓</b> Rẻ, truy xuất tức thì.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Chọn Deep Archive vì rẻ nhất mà quên 'queries started immediately'.</p>","tip":"<p>Thực tế còn có Redshift Spectrum (query S3 từ Redshift). Athena = serverless SQL trên S3.</p>"},{"id":11,"topic":"Design Secure Architectures – Cognito Identity Pool + VPC Endpoint","supplement":false,"stem":"An edtech startup runs its course-management platform inside a private subnet in a VPC on AWS. The application uses Amazon Cognito user pools for authentication. Now, the team wants to extend the application so that authenticated users can upload and access personal course-related documents in Amazon S3. The solution must ensure scalable, fine-grained and secure access control to the S3 bucket and maintain private network architecture for the application.<br>Which combination of steps will enable secure S3 integration for this workload? (Select two)","options":[{"html":"Create an Amazon S3 VPC endpoint in the VPC where the application is hosted to enable private connectivity between the application and S3","correct":true},{"html":"Create an Amazon Cognito identity pool to allow federated identities. Use it to generate temporary AWS credentials that grant S3 access when users successfully authenticate","correct":true},{"html":"Attach an S3 bucket policy that allows access only if requests include a custom HTTP header containing a valid Cognito user ID","correct":false},{"html":"Use the existing Amazon Cognito user pool to directly grant users permission to upload and download objects in the S3 bucket","correct":false},{"html":"Configure an AWS Lambda function that proxies user uploads to S3. Invoke the Lambda function after each user login to isolate the S3 access","correct":false}],"multi":2,"analysis":"<p>2 yêu cầu tách biệt: quyền truy cập + mạng</p>","answer":"<p>Identity Pool giải quyết quyền (credential tạm thời, fine-grained). VPC Endpoint giải quyết mạng private.</p>","explain":"<ul><li><b>A. ✓</b> Private subnet gọi S3 không cần Internet/NAT (Gateway Endpoint, miễn phí).</li><li><b>B. ✓</b> Đổi token lấy credential tạm thời gắn IAM role; dùng biến ${cognito-identity.amazonaws.com:sub} để giới hạn theo prefix.</li><li><b>C. ✗</b> Header do client tự gửi, giả mạo được; S3 chỉ tin chữ ký IAM (SigV4).</li><li><b>D. ✗</b> User pool chỉ xác thực, không cấp quyền IAM.</li><li><b>E. ✗</b> Tăng độ trễ, chi phí, giới hạn payload; không native.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Quên chi tiết 'private subnet' ở đầu đề; tin vào cơ chế dựa trên header do client gửi.</p>","tip":"<p>User Pool = đăng nhập. Identity Pool = lấy credential AWS. Private subnet + S3/DynamoDB → Gateway Endpoint.</p>"},{"id":12,"topic":"Design Resilient Architectures – SQS priority queues","supplement":false,"stem":"A social media application lets users upload photos and perform image editing operations. The application offers two classes of service: pro and lite. The product team wants the photos submitted by pro users to be processed before those submitted by lite users. Photos are uploaded to Amazon S3 and the job information is sent to Amazon SQS.<br>As a solutions architect, which of the following solutions would you recommend?","options":[{"html":"Create one Amazon SQS standard queue. Set the visibility timeout of the pro photos to zero. Set up Amazon EC2 instances to prioritize visibility settings so pro photos are processed first","correct":false},{"html":"Create two Amazon SQS standard queues: one for pro and one for lite. Set the lite queue to use short polling and the pro queue to use long polling","correct":false},{"html":"Create two Amazon SQS standard queues: one for pro and one for lite. Set up Amazon EC2 instances to prioritize polling for the pro queue over the lite queue","correct":true},{"html":"Create two Amazon SQS FIFO queues: one for pro and one for lite. Set the lite queue to use short polling and the pro queue to use long polling","correct":false}],"multi":1,"analysis":"<p>Pattern priority với SQS</p>","answer":"<p>SQS không có priority; tách queue và consumer poll queue ưu tiên trước.</p>","explain":"<ul><li><b>A. ✗</b> Visibility 0 gây xử lý trùng; không tạo ưu tiên.</li><li><b>B. ✗</b> Polling chỉ ảnh hưởng cách chờ/chi phí, không tạo ưu tiên.</li><li><b>C. ✓</b> Pattern priority chuẩn: logic ưu tiên trong consumer.</li><li><b>D. ✗</b> Như trên; FIFO chỉ giữ thứ tự trong 1 queue.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Nửa đầu (tách 2 queue) đúng nên cả đáp án trông đúng.</p>","tip":"<p>Long polling chờ tối đa 20 giây, giảm gọi rỗng. Message tối đa 1 MiB từ 08/2025 (đề cũ ghi 256 KB); lớn hơn thì dùng Extended Client + S3.</p>"},{"id":13,"topic":"Design Resilient Architectures – ElastiCache for Memcached","supplement":false,"stem":"An e-commerce application uses a relational database that runs several queries that perform joins on multiple tables. The development team has found that these queries are slow and expensive, therefore these are a good candidate for caching. The application needs to use a caching service that supports multi-threading.<br>As a solutions architect, which of the following services would you recommend for the given use case?","options":[{"html":"AWS Global Accelerator","correct":false},{"html":"Amazon DynamoDB Accelerator (DAX)","correct":false},{"html":"Amazon ElastiCache for Memcached","correct":true},{"html":"Amazon ElastiCache for Redis","correct":false}],"multi":1,"analysis":"<p>Từ khóa → dịch vụ</p>","answer":"<p>'Multi-threading' là từ khóa của Memcached.</p>","explain":"<ul><li><b>A. ✗</b> Dịch vụ mạng, không phải cache.</li><li><b>B. ✗</b> DAX chỉ dùng cho DynamoDB.</li><li><b>C. ✓</b> Đa luồng, đơn giản, scale ngang.</li><li><b>D. ✗</b> Theo đề: Redis (lõi xử lý lệnh) đơn luồng.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Global Accelerator có chữ 'Accelerator' nhưng không phải cache.</p>","tip":"<p>Redis/Valkey: persistence, replication, Multi-AZ, backup, pub/sub, sorted set (leaderboard). Memcached: đa luồng, đơn giản, không persistence. (Bản Redis/Valkey mới có enhanced I/O threads, nhưng đề vẫn coi Memcached là đáp án.)</p>"},{"id":14,"topic":"Design Cost-Optimized Architectures – EFS Infrequent Access","supplement":false,"stem":"A big data analytics company is looking to archive the on-premises data into a POSIX compliant file storage system on AWS Cloud. The archived data would be accessed for just about a week in a year.<br>As a solutions architect, which of the following AWS services would you recommend as the MOST cost-optimal solution?","options":[{"html":"Amazon S3 Standard","correct":false},{"html":"Amazon S3 Standard-IA","correct":false},{"html":"Amazon EFS Infrequent Access","correct":true},{"html":"Amazon EFS Standard","correct":false}],"multi":1,"analysis":"<p>Lọc theo loại storage → so chi phí</p>","answer":"<p>Từ khóa POSIX loại S3. Còn lại EFS, dữ liệu ít truy cập nên chọn lớp IA.</p>","explain":"<ul><li><b>A. ✗</b> S3 là object storage, không phải file system POSIX.</li><li><b>B. ✗</b> Vẫn là object storage, không đáp ứng POSIX.</li><li><b>C. ✓</b> File system POSIX, giá lưu trữ thấp cho dữ liệu ít truy cập.</li><li><b>D. ✗</b> Đúng loại storage nhưng giá lưu trữ cao, dành cho dữ liệu truy cập thường xuyên.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Thấy 'archive' là nghĩ ngay S3, quên mất yêu cầu POSIX.</p>","tip":"<p>POSIX/NFS/Linux shared file system → EFS. Windows SMB → FSx for Windows. HPC → FSx for Lustre. Đáp án của đề có từ trước khi có EFS Archive; hiện nay dữ liệu truy cập ~1 tuần/năm hợp với EFS Archive hơn (nếu đáp án có).</p>"},{"id":15,"topic":"Design Resilient Architectures – SQS Delay Queue","supplement":false,"stem":"An IT company is using Amazon Simple Queue Service (Amazon SQS) queues for decoupling the various components of application architecture. As the consuming components need additional time to process Amazon Simple Queue Service (Amazon SQS) messages, the company wants to postpone the delivery of new messages to the queue for a few seconds.<br>As a solutions architect, which of the following solutions would you suggest to the company?","options":[{"html":"Use visibility timeout to postpone the delivery of new messages to the queue for a few seconds","correct":false},{"html":"Use delay queues to postpone the delivery of new messages to the queue for a few seconds","correct":true},{"html":"Use dead-letter queues to postpone the delivery of new messages to the queue for a few seconds","correct":false},{"html":"Use Amazon SQS FIFO queues to postpone the delivery of new messages to the queue for a few seconds","correct":false}],"multi":1,"analysis":"<p>Từ khóa → tính năng</p>","answer":"<p>'Postpone delivery of new messages' = Delay queue.</p>","explain":"<ul><li><b>A. ✗</b> Ẩn message SAU khi đã được nhận, chống xử lý trùng.</li><li><b>B. ✓</b> Ẩn message mới TRƯỚC lần nhận đầu tiên (0 giây–15 phút).</li><li><b>C. ✗</b> Cô lập message lỗi nhiều lần.</li><li><b>D. ✗</b> Thứ tự + exactly-once.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Visibility timeout cũng 'ẩn message' nhưng ở thời điểm khác.</p>","tip":"<p>Delay tối đa 15 phút; Visibility tối đa 12 giờ (mặc định 30 giây); Retention tối đa 14 ngày (mặc định 4 ngày).</p>"},{"id":16,"topic":"Design Secure Architectures – Amazon GuardDuty","supplement":false,"stem":"During a review, a security team has flagged concerns over an Amazon EC2 instance querying IP addresses used for cryptocurrency mining. The Amazon EC2 instance does not host any authorized application related to cryptocurrency mining.<br>Which AWS service can be used to protect the Amazon EC2 instances from such unauthorized behavior in the future?","options":[{"html":"AWS Shield Advanced","correct":false},{"html":"Amazon GuardDuty","correct":true},{"html":"AWS Web Application Firewall (AWS WAF)","correct":false},{"html":"AWS Firewall Manager","correct":false}],"multi":1,"analysis":"<p>Chọn dịch vụ bảo mật theo hành vi + chiều traffic</p>","answer":"<p>Traffic đi RA từ instance bị chiếm quyền → GuardDuty (VPC Flow Logs, DNS logs, CloudTrail).</p>","explain":"<ul><li><b>A. ✗</b> Chống DDoS.</li><li><b>B. ✓</b> Có finding CryptoCurrency:EC2/BitcoinTool.B dựa trên threat intel.</li><li><b>C. ✗</b> Chỉ kiểm tra request HTTP đi VÀO web app.</li><li><b>D. ✗</b> Chỉ quản lý rule tập trung, không phát hiện.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> WAF chỉ áp dụng cho traffic HTTP đi vào.</p>","tip":"<p>Inspector = CVE. Macie = PII trong S3. Detective = điều tra. Security Hub = tổng hợp. Chặn outbound: Network Firewall / DNS Firewall.</p>"},{"id":17,"topic":"Design Resilient Architectures – S3 vs EBS for shared documents","supplement":false,"stem":"A company is developing a document management application on AWS. The application runs on Amazon EC2 instances in multiple Availability Zones (AZs). The company requires the document store to be highly available and the documents need to be returned immediately when requested. The engineering team has configured the application to use Amazon Elastic Block Store (Amazon EBS) to store the documents but the team is willing to consider other options to meet the availability requirement.<br>As a solutions architect, which of the following will you recommend?","options":[{"html":"Create snapshots for the Amazon EBS volumes regularly and then build new volumes using those snapshots in additional Availability Zones","correct":false},{"html":"Set up Amazon EBS as the Amazon EC2 instance root volume and then configure the application to use Amazon S3 Glacier as the document store","correct":false},{"html":"Set up Amazon EBS as the Amazon EC2 instance root volume and then configure the application to use Amazon S3 as the document store","correct":true},{"html":"Provision at least three Provisioned IOPS Amazon Instance Store volumes for the Amazon EC2 instances and then mount these volumes to multiple Amazon EC2 instances","correct":false}],"multi":1,"analysis":"<p>Chọn storage theo HA + chia sẻ + tốc độ</p>","answer":"<p>EBS chỉ nằm trong 1 AZ. Cần dùng chung đa AZ + truy xuất tức thì → S3.</p>","explain":"<ul><li><b>A. ✗</b> Snapshot là backup, không phải HA real-time.</li><li><b>B. ✗</b> Glacier (Flexible/Deep Archive) truy xuất mất phút → giờ.</li><li><b>C. ✓</b> S3 lưu trên nhiều AZ, mọi instance đều truy cập được, độ trễ mili-giây.</li><li><b>D. ✗</b> Instance store tạm thời, không mount chung được; 'Provisioned IOPS instance store' không tồn tại.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> EBS snapshot trông giống giải pháp HA nhưng chỉ là backup.</p>","tip":"<p>Nhiều EC2 đa AZ dùng chung: document/object → S3; cần POSIX/mount → EFS.</p>"},{"id":18,"topic":"Design High-Performing Architectures – Instance Store","supplement":false,"stem":"The engineering team at a startup is evaluating the most optimal block storage volume type for the Amazon EC2 instances hosting its flagship application. The storage volume should support very low latency but it does not need to persist the data when the instance terminates. As a solutions architect, you have proposed using Instance Store volumes to meet these requirements.<br>Which of the following would you identify as the key characteristics of the Instance Store volumes? (Select two)","options":[{"html":"Instance store is reset when you stop or terminate an instance. Instance store data is preserved during hibernation","correct":false},{"html":"If you create an Amazon Machine Image (AMI) from an instance, the data on its instance store volumes isn't preserved","correct":true},{"html":"You can specify instance store volumes for an instance when you launch or restart it","correct":false},{"html":"An instance store is a network storage type","correct":false},{"html":"You can't detach an instance store volume from one instance and attach it to a different instance","correct":true}],"multi":2,"analysis":"<p>Chọn đặc điểm đúng; câu đúng một nửa</p>","answer":"<p>Instance store gắn vật lý, tạm thời; chỉ reboot là giữ dữ liệu.</p>","explain":"<ul><li><b>A. ✗</b> Nửa sau sai: hibernate = stop nên instance store bị reset.</li><li><b>B. ✓</b> Đúng.</li><li><b>C. ✗</b> Nửa sau sai: chỉ chỉ định được lúc launch.</li><li><b>D. ✗</b> Sai: gắn vật lý, không phải network.</li><li><b>E. ✓</b> Đúng: ổ gắn vật lý trên host.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Câu 'vế đầu đúng, vế sau sai'.</p>","tip":"<p>Reboot giữ. Stop/Hibernate/Terminate/hỏng host/AMI đều mất. Dùng cho cache, buffer, scratch.</p>"},{"id":19,"topic":"Design High-Performing Architectures – Elastic Fabric Adapter","supplement":false,"stem":"A biotechnology company has multiple High Performance Computing (HPC) workflows that quickly and accurately process and analyze genomes for hereditary diseases. The company is looking to migrate these workflows from their on-premises infrastructure to AWS Cloud.<br>As a solutions architect, which of the following networking components would you recommend on the Amazon EC2 instances running these HPC workflows?","options":[{"html":"Elastic Network Adapter (ENA)","correct":false},{"html":"Elastic Fabric Adapter (EFA)","correct":true},{"html":"Elastic Network Interface (ENI)","correct":false},{"html":"Elastic IP Address (EIP)","correct":false}],"multi":1,"analysis":"<p>4 cái tên na ná nhau</p>","answer":"<p>HPC → EFA.</p>","explain":"<ul><li><b>A. ✗</b> Enhanced networking nhưng không có OS-bypass.</li><li><b>B. ✓</b> ENA + OS-bypass cho MPI/NCCL, độ trễ cực thấp giữa các node.</li><li><b>C. ✗</b> Card mạng ảo cơ bản.</li><li><b>D. ✗</b> IP public tĩnh.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> ENA đúng hướng 'hiệu năng cao' nhưng chưa tốt nhất cho HPC.</p>","tip":"<p>HPC stack: EFA + Cluster Placement Group + FSx for Lustre + ParallelCluster/Batch.</p>"},{"id":20,"topic":"Design High-Performing Architectures – Caching for DynamoDB","supplement":false,"stem":"A company uses Amazon DynamoDB as a data store for various kinds of customer data, such as user profiles, user events, clicks, and visited links. Some of these use-cases require a high request rate (millions of requests per second), low predictable latency, and reliability. The company now wants to add a caching layer to support high read volumes.<br>As a solutions architect, which of the following AWS services would you recommend as a caching layer for this use-case? (Select two)","options":[{"html":"Amazon ElastiCache","correct":true},{"html":"Amazon OpenSearch Service","correct":false},{"html":"Amazon DynamoDB Accelerator (DAX)","correct":true},{"html":"Amazon Relational Database Service (Amazon RDS)","correct":false},{"html":"Amazon Redshift","correct":false}],"multi":2,"analysis":"<p>Chọn dịch vụ cache</p>","answer":"<p>DAX (chuyên DynamoDB) và ElastiCache (đa dụng).</p>","explain":"<ul><li><b>A. ✓</b> Cache in-memory, đặt trước RDS hoặc DynamoDB được.</li><li><b>B. ✗</b> Search/analytics, không phải cache.</li><li><b>C. ✓</b> Cache chuyên cho DynamoDB, micro-giây, API tương thích.</li><li><b>D. ✗</b> Database quan hệ, không phải cache.</li><li><b>E. ✗</b> Data warehouse.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> —</p>","tip":"<p>DynamoDB + ít sửa code → DAX. RDS → ElastiCache.</p>"},{"id":21,"topic":"Design Secure Architectures – AWS Managed Microsoft AD","supplement":false,"stem":"A company needs an Active Directory service to run directory-aware workloads in the AWS Cloud and it should also support configuring a trust relationship with any existing on-premises Microsoft Active Directory.<br>Which AWS Directory Service is the best fit for this requirement?","options":[{"html":"AWS Directory Service for Microsoft Active Directory (AWS Managed Microsoft AD)","correct":true},{"html":"AWS Transit Gateway","correct":false},{"html":"Active Directory Connector","correct":false},{"html":"Simple Active Directory (Simple AD)","correct":false}],"multi":1,"analysis":"<p>Chọn loại Directory Service</p>","answer":"<p>Cần AD trên cloud + trust → Managed Microsoft AD.</p>","explain":"<ul><li><b>A. ✓</b> AD thật trên AWS, hỗ trợ trust với AD on-prem.</li><li><b>B. ✗</b> Dịch vụ mạng, không phải AD.</li><li><b>C. ✗</b> Chỉ là proxy chuyển request về AD on-prem, không chạy workload AD trên cloud.</li><li><b>D. ✗</b> AD nhỏ, không hỗ trợ trust, MFA, schema extension.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> AD Connector nghe như 'kết nối với on-prem' nhưng không tạo trust.</p>","tip":"<p>Dùng AD on-prem sẵn có, không lưu gì trên cloud → AD Connector. AD nhỏ, rẻ, không trust → Simple AD.</p>"},{"id":22,"topic":"Design Secure Architectures – S3 Storage Lens","supplement":false,"stem":"A global financial services provider operates data analytics workloads across multiple AWS Regions. The company stores regulated datasets in Amazon S3 buckets and requires visibility into security and compliance configurations. As part of a new audit initiative, the compliance team must identify all S3 buckets across the environment that do not have versioning enabled. The solution must scale across all Regions and accounts with minimal manual intervention.<br>Which solution will meet these requirements with the LEAST operational overhead?","options":[{"html":"Create a centralized Amazon S3 Multi-Region Access Point for all buckets. Use this access point to perform versioning checks programmatically by inspecting objects' metadata from each bucket","correct":false},{"html":"Configure an AWS CloudTrail trail across all Regions. Create an Amazon EventBridge rule that filters for PutBucketVersioning and DeleteBucketVersioning API calls. Trigger an AWS Lambda function to analyze the bucket configurations and generate a report of unversioned buckets","correct":false},{"html":"Enable Amazon S3 Storage Lens with advanced metrics and recommendations. Use the per-bucket dashboard to filter and view versioning status across Regions and identify all buckets that do not have versioning enabled","correct":true},{"html":"Enable IAM Access Analyzer for all Regions. Review the analyzer reports to identify S3 buckets without versioning enabled and configure IAM policies to restrict access to such buckets","correct":false}],"multi":1,"analysis":"<p>Audit trạng thái hiện tại trên quy mô lớn</p>","answer":"<p>Cần 'current state' của mọi bucket → Storage Lens (hoặc AWS Config + Aggregator).</p>","explain":"<ul><li><b>A. ✗</b> MRAP là endpoint truy cập dữ liệu, không phải công cụ audit.</li><li><b>B. ✗</b> Chỉ thấy THAY ĐỔI; bucket chưa từng bật versioning không có sự kiện nào nên bị bỏ sót; tự viết code.</li><li><b>C. ✓</b> Dashboard toàn tổ chức, lọc theo bucket.</li><li><b>D. ✗</b> Access Analyzer xét quyền truy cập, không xét versioning.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Event-driven chỉ phát hiện thay đổi, không cho biết trạng thái đang có.</p>","tip":"<p>CloudTrail = ai làm gì, khi nào. Config = tài nguyên đang cấu hình ra sao (rule s3-bucket-versioning-enabled + Aggregator). Metric versioning của Storage Lens có ở bản free.</p>"},{"id":23,"topic":"Design Resilient Architectures – Aurora Serverless","supplement":false,"stem":"The engineering team at an IT company is deploying an Online Transactional Processing (OLTP) application that needs to support relational queries. The application will have unpredictable spikes of usage that the team does not know in advance.<br>Which database would you recommend using?","options":[{"html":"Amazon DynamoDB with On-Demand Capacity","correct":false},{"html":"Amazon DynamoDB with Provisioned Capacity and Auto Scaling","correct":false},{"html":"Amazon ElastiCache","correct":false},{"html":"Amazon Aurora Serverless","correct":true}],"multi":1,"analysis":"<p>Lọc theo loại DB → theo khả năng scale</p>","answer":"<p>'Relational' loại DynamoDB và ElastiCache; 'unpredictable' → Serverless.</p>","explain":"<ul><li><b>A. ✗</b> Scale tốt nhưng là NoSQL, không query quan hệ (join).</li><li><b>B. ✗</b> NoSQL.</li><li><b>C. ✗</b> Cache, không phải DB quan hệ.</li><li><b>D. ✓</b> Quan hệ, tự scale theo tải.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> DynamoDB on-demand khớp 'unpredictable' nhưng sai 'relational'.</p>","tip":"<p>Aurora Serverless v2 scale theo ACU, hiện có thể scale về 0.</p>"},{"id":24,"topic":"Design Resilient Architectures – EC2 User Data","supplement":false,"stem":"A systems administration team has a requirement to run certain custom scripts only once during the launch of the Amazon Elastic Compute Cloud (Amazon EC2) instances that host their application.<br>Which of the following represents the best way of configuring a solution for this requirement with minimal effort?","options":[{"html":"Update Amazon EC2 instance configuration to ensure that the custom scripts, added as user data scripts, are run only during the boot process","correct":false},{"html":"Use AWS CLI to run the user data scripts only once while launching the instance","correct":false},{"html":"Run the custom scripts as instance metadata scripts on the Amazon EC2 instances","correct":false},{"html":"Run the custom scripts as user data scripts on the Amazon EC2 instances","correct":true}],"multi":1,"analysis":"<p>Phân biệt khái niệm dễ nhầm</p>","answer":"<p>User data mặc định chạy đúng một lần khi launch, với quyền root.</p>","explain":"<ul><li><b>A. ✗</b> Thừa, vì mặc định đã chạy một lần. Cấu hình thêm chỉ cần khi muốn chạy ở MỌI lần boot.</li><li><b>B. ✗</b> Đáp án gây nhiễu.</li><li><b>C. ✗</b> Metadata chỉ để đọc thông tin instance, không chạy script.</li><li><b>D. ✓</b> Mặc định user data chỉ chạy một lần ở lần boot đầu tiên.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Metadata và user data đều ở 169.254.169.254 nên dễ nhầm.</p>","tip":"<p>User data = việc làm khi khởi tạo. Metadata = thông tin về instance (ID, IP, credential role). Nên dùng IMDSv2.</p>"},{"id":25,"topic":"Design Resilient Architectures – CloudFront private content","supplement":false,"stem":"A digital media streaming company wants to use Amazon CloudFront to distribute its content only to its service subscribers. As a solutions architect, which of the following solutions would you suggest to deliver restricted content to the bona fide end users? (Select two)","options":[{"html":"Use Amazon CloudFront signed URLs","correct":true},{"html":"Forward HTTPS requests to the origin server by using the ECDSA or RSA ciphers","correct":false},{"html":"Require HTTPS for communication between Amazon CloudFront and your S3 origin","correct":false},{"html":"Use Amazon CloudFront signed cookies","correct":true},{"html":"Require HTTPS for communication between Amazon CloudFront and your custom origin","correct":false}],"multi":2,"analysis":"<p>Phân quyền truy cập (authorization) vs mã hóa đường truyền</p>","answer":"<p>Bài toán là 'ai được xem'. Chỉ Signed URL / Signed Cookie kiểm soát được người truy cập ở chặng viewer → CloudFront.</p>","explain":"<ul><li><b>A. ✓</b> Cấp quyền cho từng file, có thời hạn hết hạn.</li><li><b>B. ✗</b> Đáp án gây nhiễu: cipher không phải cơ chế phân quyền.</li><li><b>C. ✗</b> HTTPS chỉ mã hóa đường truyền, không phân biệt ai được xem.</li><li><b>D. ✓</b> Cấp quyền cho nhiều file cùng lúc / không đổi URL hiện có.</li><li><b>E. ✗</b> Giống đáp án đầu: mã hóa, không phải phân quyền.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Nhầm HTTPS/TLS (bảo mật đường truyền) với kiểm soát truy cập.</p>","tip":"<p>1 file → Signed URL. Nhiều file / giữ nguyên URL → Signed Cookie. Chặn truy cập thẳng S3 → OAC. Chặn theo quốc gia → Geo Restriction.</p>"},{"id":26,"topic":"Design Secure Architectures – Control Tower + VPC Sharing (RAM)","supplement":false,"stem":"A digital media firm is scaling its cloud footprint and wants to isolate development, testing, and production workloads using separate AWS accounts. It also wants a centralized approach to managing networking infrastructure such as subnets and gateways, without repeating configurations in every account. Additionally, the solution must enforce security best practices—like mandatory logging and guardrails—when new accounts are created. The firm prefers a low-maintenance, governance-driven setup.<br>Which solution best meets these goals while minimizing operational overhead?","options":[{"html":"Use AWS Control Tower to launch accounts. Deploy separate VPCs in each workload account and centralize security inspection by using Gateway Load Balancers to route traffic through a shared security appliance","correct":false},{"html":"Use AWS Control Tower to create and govern accounts. Deploy a centralized VPC in a shared networking account and share its subnets across workload accounts using AWS Resource Access Manager (AWS RAM)","correct":true},{"html":"Use AWS Organizations to create new accounts and a shared networking account with a central VPC. Share the VPC subnets via AWS RAM and rely on service control policies (SCPs) to enforce guardrails manually","correct":false},{"html":"Use AWS Service Catalog to define pre-approved VPC templates. Launch one VPC per workload account from the catalog, and enforce networking guardrails using AWS Config conformance packs","correct":false}],"multi":1,"analysis":"<p>Ghép 2 mảnh: governance + network</p>","answer":"<p>Control Tower (landing zone, controls, log archive) + VPC Sharing qua RAM.</p>","explain":"<ul><li><b>A. ✗</b> Lặp VPC; GWLB giải bài toán inspection, không phải tập trung hạ tầng mạng.</li><li><b>B. ✓</b> Governance tự động + mạng tập trung.</li><li><b>C. ✗</b> Mạng đúng, nhưng 'manually' và thiếu logging tự động.</li><li><b>D. ✗</b> Vẫn N VPC; Service Catalog không tạo account, không tự bật logging.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đáp án đúng một mảnh, sai một mảnh.</p>","tip":"<p>SCP = giới hạn. Config = phát hiện. Control Tower = Organizations + landing zone + controls tự động.</p>"},{"id":27,"topic":"Design Resilient Architectures – Amazon MQ","supplement":false,"stem":"A company is experiencing stability issues with their cluster of self-managed RabbitMQ message brokers and the company now wants to explore an alternate solution on AWS.<br>As a solutions architect, which of the following AWS services would you recommend that can provide support for quick and easy migration from RabbitMQ?","options":[{"html":"Amazon Simple Notification Service (Amazon SNS)","correct":false},{"html":"Amazon SQS FIFO (First-In-First-Out)","correct":false},{"html":"Amazon MQ","correct":true},{"html":"Amazon Simple Queue Service (Amazon SQS) Standard","correct":false}],"multi":1,"analysis":"<p>Migration giữ nguyên công nghệ</p>","answer":"<p>Đang dùng RabbitMQ/ActiveMQ, muốn chuyển nhanh → Amazon MQ.</p>","explain":"<ul><li><b>A. ✗</b> Pub/sub, không tương thích giao thức RabbitMQ.</li><li><b>B. ✗</b> Phải viết lại code.</li><li><b>C. ✓</b> Broker managed cho ActiveMQ và RabbitMQ, giữ nguyên giao thức (AMQP, MQTT, STOMP…).</li><li><b>D. ✗</b> Phải viết lại code.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> —</p>","tip":"<p>Ứng dụng mới, cloud-native → SQS/SNS. Ứng dụng cũ dùng giao thức chuẩn (JMS, AMQP, MQTT) → Amazon MQ.</p>"},{"id":28,"topic":"Design Resilient Architectures – ELB cannot span Regions","supplement":false,"stem":"A startup uses a fleet of Amazon EC2 servers to manage its CRM application. These Amazon EC2 servers are behind Elastic Load Balancing (ELB). Which of the following configurations are NOT allowed for Elastic Load Balancing?","options":[{"html":"Use the Elastic Load Balancing to distribute traffic for four Amazon EC2 instances. All the four instances are deployed in Availability Zone B of us-west-1 region","correct":false},{"html":"Use the Elastic Load Balancing to distribute traffic for four Amazon EC2 instances. All the four instances are deployed across two Availability Zones of us-east-1 region","correct":false},{"html":"Use the Elastic Load Balancing to distribute traffic for four Amazon EC2 instances. All the four instances are deployed in Availability Zone A of us-east-1 region","correct":false},{"html":"Use the Elastic Load Balancing to distribute traffic for four Amazon EC2 instances. Two of these instances are deployed in Availability Zone A of us-east-1 region and the other two instances are deployed in Availability Zone B of us-west-1 region","correct":true}],"multi":1,"analysis":"<p>Câu hỏi phủ định (NOT allowed)</p>","answer":"<p>ELB là dịch vụ trong 1 Region.</p>","explain":"<ul><li><b>A. ✗</b> Hợp lệ (1 AZ).</li><li><b>B. ✗</b> Hợp lệ (đa AZ).</li><li><b>C. ✗</b> Hợp lệ (1 AZ).</li><li><b>D. ✓</b> Không hợp lệ: ELB không phân phối traffic giữa các Region.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đọc lướt bỏ qua chữ NOT.</p>","tip":"<p>Phân phối đa Region → Route 53 (latency/geo/failover routing) hoặc Global Accelerator.</p>"},{"id":29,"topic":"Design Cost-Optimized Architectures – Spot Instances vs Spot Fleet","supplement":false,"stem":"A software engineering intern at a company is documenting the features offered by Amazon EC2 Spot instances and Spot fleets.<br>Can you help the intern by selecting the correct options that identify the key characteristics of these two types of Spot entities? (Select two)","options":[{"html":"Spot fleets are spare EC2 capacity that can save you up 90% off of On-Demand prices. Spot fleets are usually interrupted by Amazon EC2 for capacity requirements with a 2-minute notification","correct":false},{"html":"Spot fleets allow you to request Amazon EC2 Spot instances for 1 to 6 hours at a time to avoid being interrupted","correct":false},{"html":"Spot instances are spare Amazon EC2 capacity that can save you up 90% off of On-Demand prices. Spot instances can be interrupted by Amazon EC2 for capacity requirements with a 2-minute notification","correct":true},{"html":"A Spot fleet can consist of a set of Spot Instances and optionally On-Demand Instances that are launched to meet your target capacity","correct":true},{"html":"A Spot fleet can only consist of a set of Spot Instances that are launched to meet your target capacity","correct":false}],"multi":2,"analysis":"<p>Phân biệt khái niệm gần nhau</p>","answer":"<p>Spot Instance = capacity dư, rẻ, bị thu hồi với cảnh báo 2 phút. Spot Fleet = tập Spot (+ On-Demand tùy chọn) để đạt target capacity.</p>","explain":"<ul><li><b>A. ✗</b> Gán đặc điểm của Spot Instance cho Spot Fleet; Fleet là tập hợp instance, không phải 'capacity'.</li><li><b>B. ✗</b> Đó là Spot Blocks, đã ngừng (deprecated).</li><li><b>C. ✓</b> Đúng.</li><li><b>D. ✓</b> Đúng: Fleet gồm Spot và có thể thêm On-Demand.</li><li><b>E. ✗</b> Sai: có thể có On-Demand.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Tráo chủ ngữ (Instance ↔ Fleet) và chữ 'only'.</p>","tip":"<p>Câu có 'only' thường sai. Spot Blocks đã bị bỏ. Hiện nay AWS khuyên dùng EC2 Fleet hoặc ASG mixed instances.</p>"},{"id":30,"topic":"Design Cost-Optimized Architectures – Savings Plans","supplement":false,"stem":"A technology startup has stabilized its cloud infrastructure after a successful product launch. The backend services are now running at a predictable rate with minimal scaling events. The application architecture includes workloads running on Amazon EC2, AWS Lambda functions for asynchronous processing, container workloads on AWS Fargate, and machine learning inference models deployed with Amazon SageMaker. The company is now focusing on reducing long-term operational expenses without redesigning its architecture. The company wants to apply long-term pricing discounts with the least administrative overhead and the broadest service coverage possible using the fewest number of savings plans.<br>Which combination of savings plans will satisfy these requirements? (Select two)","options":[{"html":"Purchase an EC2 Instance Savings Plan that covers EC2 and containerized tasks on Amazon ECS running with Fargate launch type","correct":false},{"html":"Purchase a SageMaker Savings Plan that applies discounted pricing to SageMaker training, inference, and notebook instances","correct":true},{"html":"Subscribe to a hybrid deployment discount plan that includes discounts for both AWS and on-premises Kubernetes workloads","correct":false},{"html":"Create a Reserved Instance for each EC2 instance and subscribe to AWS Support to monitor Reserved Instance utilization monthly","correct":false},{"html":"Purchase a Compute Savings Plan that provides cost savings for usage across EC2, Fargate, and Lambda services","correct":true}],"multi":2,"analysis":"<p>Ghép plan để phủ đủ dịch vụ</p>","answer":"<p>Compute SP phủ EC2/Fargate/Lambda; SageMaker SP phủ SageMaker. 2 plan phủ đủ 4 dịch vụ.</p>","explain":"<ul><li><b>A. ✗</b> EC2 Instance SP chỉ áp dụng EC2 (gắn family + Region), không áp dụng Fargate.</li><li><b>B. ✓</b> SageMaker không nằm trong Compute SP, cần plan riêng.</li><li><b>C. ✗</b> Không tồn tại.</li><li><b>D. ✗</b> RI chỉ cho EC2, quản lý từng RI; AWS Support không giảm chi phí.</li><li><b>E. ✓</b> Phủ EC2 + Fargate + Lambda, linh hoạt nhất.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Mô tả EC2 Instance SP 'bao gồm Fargate' là sai.</p>","tip":"<p>Compute SP ~66%, linh hoạt nhất. EC2 Instance SP ~72%, gắn family + Region. SageMaker SP ~64%.</p>"},{"id":31,"topic":"Design Secure Architectures – AWS VPN CloudHub","supplement":false,"stem":"A media company has its corporate headquarters in Los Angeles with an on-premises data center using an AWS Direct Connect connection to the AWS VPC. The branch offices in San Francisco and Miami use AWS Site-to-Site VPN connections to connect to the AWS VPC. The company is looking for a solution to have the branch offices send and receive data with each other as well as with their corporate headquarters.<br>As a solutions architect, which of the following AWS services would you recommend addressing this use-case?","options":[{"html":"AWS VPN CloudHub","correct":true},{"html":"Software VPN","correct":false},{"html":"VPC Endpoint","correct":false},{"html":"VPC Peering connection","correct":false}],"multi":1,"analysis":"<p>Chọn dịch vụ kết nối theo topology</p>","answer":"<p>Nhiều site on-prem cần nói chuyện với nhau qua AWS → VPN CloudHub.</p>","explain":"<ul><li><b>A. ✓</b> Hub-and-spoke qua VGW, các site nói chuyện với nhau.</li><li><b>B. ✗</b> Chỉ nối mạng on-prem với VPC.</li><li><b>C. ✗</b> Truy cập dịch vụ AWS riêng tư.</li><li><b>D. ✗</b> Nối 2 VPC, không liên quan chi nhánh.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> —</p>","tip":"<p>Nhiều VPC + on-prem quy mô lớn → Transit Gateway. Nhiều chi nhánh, chi phí thấp → VPN CloudHub.</p>"},{"id":32,"topic":"Design Secure Architectures – Direct Connect Public VIF","supplement":false,"stem":"A global enterprise maintains a hybrid cloud environment and wants to transfer large volumes of data between its on-premises data center and Amazon S3 for backup and analytics workflows. The company has already established a Direct Connect (DX) connection to AWS and wants to ensure high-bandwidth, low-latency, and secure private connectivity without traversing the public internet. The architecture must be designed to access Amazon S3 directly from on-premises systems using this DX connection.<br>Which configuration should the network engineering team implement to allow direct access to Amazon S3 from the on-premises data center using Direct Connect?","options":[{"html":"Configure a VPN connection over the public internet to AWS and route S3 traffic through the tunnel instead of using Direct Connect","correct":false},{"html":"Provision a Public Virtual Interface (Public VIF) on the Direct Connect connection to access Amazon S3 public IP addresses from the on-premises data center","correct":true},{"html":"Use a Private Virtual Interface (Private VIF) on the Direct Connect connection and create a VPC endpoint to route traffic to S3 over the private network","correct":false},{"html":"Use a Transit Gateway with Direct Connect Gateway to route on-premises traffic through a VPC and then to Amazon S3 using private IP addressing","correct":false}],"multi":1,"analysis":"<p>Chọn loại VIF theo đích đến</p>","answer":"<p>S3 là dịch vụ public → Public VIF, đi trực tiếp qua DX.</p>","explain":"<ul><li><b>A. ✗</b> Đi qua Internet, vi phạm yêu cầu.</li><li><b>B. ✓</b> Truy cập dịch vụ public của AWS qua đường DX riêng.</li><li><b>C. ✗</b> Private VIF dành cho tài nguyên VPC; Gateway Endpoint không dùng được từ on-prem.</li><li><b>D. ✗</b> Đi vòng qua VPC, phức tạp; TGW/DXGW dành cho nhiều VPC.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> TGW/DXGW nghe 'enterprise' nhưng đi vòng, không 'directly'.</p>","tip":"<p>Thực tế: Private/Transit VIF + S3 Interface Endpoint (PrivateLink) cũng truy cập S3 từ on-prem bằng IP private. Đề có 'directly' + Public VIF → chọn Public VIF.</p>"},{"id":33,"topic":"Design Resilient Architectures – Single-instance HA","supplement":false,"stem":"You are deploying a critical monolith application that must be deployed on a single web server, as it hasn't been created to work in distributed mode. Still, you want to make sure your setup can automatically recover from the failure of an Availability Zone (AZ).<br>Which of the following options should be combined to form the MOST cost-efficient solution? (Select three)","options":[{"html":"Create an auto-scaling group that spans across 2 Availability Zones, which min=1, max=1, desired=1","correct":true},{"html":"Create an elastic IP address (EIP) and use the Amazon EC2 user-data script to attach it","correct":true},{"html":"Assign an Amazon EC2 Instance Role to perform the necessary API calls","correct":true},{"html":"Create an Application Load Balancer and a target group with the instance(s) of the Auto Scaling Group","correct":false},{"html":"Create an auto-scaling group that spans across 2 Availability Zones, which min=1, max=2, desired=2","correct":false},{"html":"Create a Spot Fleet request","correct":false}],"multi":3,"analysis":"<p>Chọn 3 mảnh tạo thành chuỗi phụ thuộc</p>","answer":"<p>ASG 1/1/1 tự dựng lại instance → instance mới cần IP cố định (EIP qua user data) → script cần quyền (IAM role).</p>","explain":"<ul><li><b>A. ✓</b> Luôn đúng 1 instance; AZ chết thì tạo lại ở AZ khác.</li><li><b>B. ✓</b> IP cố định; instance mới tự gắn EIP khi boot.</li><li><b>C. ✓</b> Script gắn EIP cần quyền ec2:AssociateAddress.</li><li><b>D. ✗</b> Chạy được nhưng trả tiền ALB chỉ để trỏ vào 1 máy, không cost-efficient.</li><li><b>E. ✗</b> Desired=2 tạo 2 instance, vi phạm 'single server'.</li><li><b>F. ✗</b> Spot có thể bị thu hồi, không hợp với ứng dụng critical.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> ALB đúng về kỹ thuật nhưng sai tiêu chí cost. Đáp án nhắc 'API calls' là mảnh phụ trợ cho một đáp án khác.</p>","tip":"<p>Single-instance HA rẻ nhất = ASG 1/1/1 multi-AZ + EIP qua user data + instance role.</p>"},{"id":34,"topic":"Design High-Performing Architectures – IAM Identity Center","supplement":false,"stem":"A healthcare startup is deploying an AWS-based analytics platform that processes sensitive patient records. The application backend uses Amazon RDS for structured data and Amazon S3 for storing medical files. S3 Event Notifications trigger AWS Lambda for real-time data classification and alerting. The startup uses AWS IAM Identity Center to manage federated access from their enterprise directory. Development, operations, and compliance teams require granular and secure access to RDS and S3 resources, based strictly on their job roles. The company must follow the principle of least privilege while minimizing manual administrative work.<br>Which solution should the company implement to meet these requirements with the least operational overhead?","options":[{"html":"Use AWS Organizations to group team accounts under a single organizational unit (OU). Attach Service Control Policies (SCPs) to the OU that define access boundaries for Amazon RDS and Amazon S3 based on each team’s responsibilities. Assign users to accounts and let SCPs enforce the required access","correct":false},{"html":"Use AWS IAM Identity Center integrated with the organization’s directory. Define permission sets with least-privilege policies for Amazon RDS and Amazon S3. Assign users to groups based on their team roles and map those groups to the appropriate permission sets","correct":true},{"html":"Create an IAM identity provider that integrates with the company's IdP (e.g., Azure AD or Okta). Use SAML federation to grant access to IAM roles that are manually assigned to each user. Create and maintain inline IAM policies for each role to access RDS and S3","correct":false},{"html":"Create individual IAM users for each team member. Attach role-based IAM policies granting permissions to RDS and S3 based on team roles. Use AWS IAM Access Analyzer to monitor for unused permissions and rotate access keys periodically","correct":false}],"multi":1,"analysis":"<p>Quản lý quyền cho nhân viên (workforce) đa account</p>","answer":"<p>Identity Center + permission sets + group từ directory là cách native, scale tốt, least privilege.</p>","explain":"<ul><li><b>A. ✗</b> SCP không cấp quyền, chỉ giới hạn quyền tối đa.</li><li><b>B. ✓</b> Tập trung, theo group, credential tạm thời, đổi group là đổi quyền.</li><li><b>C. ✗</b> Làm được nhưng thủ công: tự tạo role, gán tay, duy trì inline policy.</li><li><b>D. ✗</b> Quản lý user và access key thủ công, overhead cao.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Nghĩ SCP cấp quyền được. SCP chỉ là guardrail.</p>","tip":"<p>Nhân viên → IAM Identity Center. Người dùng cuối của app → Cognito. IAM user + access key gần như luôn sai khi đề nói 'least overhead'.</p>"},{"id":35,"topic":"Design Secure Architectures – S3 client-side encryption","supplement":false,"stem":"A company helps its customers legally sign highly confidential contracts. To meet the strong industry requirements, the company must ensure that the signed contracts are encrypted using the company's proprietary algorithm. The company is now migrating to AWS Cloud using Amazon Simple Storage Service (Amazon S3) and would like you, the solution architect, to advise them on the encryption scheme to adopt.<br>What do you recommend?","options":[{"html":"Server-side encryption with AWS KMS keys (SSE-KMS)","correct":false},{"html":"Client Side Encryption","correct":true},{"html":"Server-side encryption with Amazon S3 managed keys (SSE-S3)","correct":false},{"html":"Server-side encryption with customer-provided keys (SSE-C)","correct":false}],"multi":1,"analysis":"<p>Ai mã hóa? Ai quản lý khóa?</p>","answer":"<p>Mọi SSE đều do S3 thực hiện bằng AES-256; thuật toán riêng → Client-side.</p>","explain":"<ul><li><b>A. ✗</b> S3 mã hóa AES-256, khóa trong KMS.</li><li><b>B. ✓</b> Tự mã hóa trước khi upload, dùng thuật toán bất kỳ.</li><li><b>C. ✗</b> S3 mã hóa AES-256, S3 quản lý khóa.</li><li><b>D. ✗</b> Bạn cấp khóa nhưng S3 vẫn mã hóa bằng AES-256.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> SSE-C 'customer-provided' chỉ là khóa, không phải thuật toán.</p>","tip":"<p>Audit/rotate key → SSE-KMS. Không muốn AWS lưu key → SSE-C. Mã hóa 2 lớp → DSSE-KMS. HSM riêng → CloudHSM.</p>"},{"id":36,"topic":"Design Resilient Architectures – NAT Gateway HA","supplement":false,"stem":"A healthcare company runs a fleet of Amazon EC2 instances in two private subnets (named PR1 and PR2) across two Availability Zones (AZs) named A1 and A2. The Amazon EC2 instances need access to the internet for operating system patch management and third-party software maintenance. To facilitate this, the engineering team at the company wants to set up two Network Address Translation gateways (NAT gateways) in a highly available configuration.<br>Which of the following options would you suggest?","options":[{"html":"Set up a total of two NAT gateways. NAT gateway N1 should be set up in private subnet PR1 in Availability Zone A1. NAT gateway N2 should be set up in private subnet PR2 in Availability Zone A2","correct":false},{"html":"Set up a total of two NAT gateways. Both NAT gateways N1 and N2 should be set up in a single public subnet PU1 in any of the Availability Zones A1 or A2","correct":false},{"html":"Set up a total of one NAT gateway. NAT gateway N1 should be set up in public subnet PU1 in any of the Availability Zones A1 or A2","correct":false},{"html":"Set up a total of two NAT gateways. NAT gateway N1 should be set up in public subnet PU1 in Availability Zone A1. NAT gateway N2 should be set up in public subnet PU2 in Availability Zone A2","correct":true}],"multi":1,"analysis":"<p>Đặt thành phần mạng đúng chỗ</p>","answer":"<p>Với NAT Gateway kiểu zonal (mô hình trong đề): phải ở public subnet + EIP + route tới IGW; HA = 1 NAT mỗi AZ.</p>","explain":"<ul><li><b>A. ✗</b> Private subnet không có route ra IGW, NAT không ra Internet được.</li><li><b>B. ✗</b> Cùng 1 AZ: AZ chết thì cả 2 cùng chết.</li><li><b>C. ✗</b> Single point of failure.</li><li><b>D. ✓</b> Public subnet, mỗi AZ một NAT; route của private subnet trỏ tới NAT cùng AZ.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đáp án đúng 2/3 tiêu chí (số lượng, số AZ) nhưng sai loại subnet.</p>","tip":"<p>Từ 11/2025 có thêm Regional NAT Gateway (1 gateway/VPC, tự trải các AZ, không cần public subnet); đề cũ vẫn theo mô hình zonal. NAT Gateway không gắn SG; NAT instance phải tắt source/dest check. IPv6 → Egress-only IGW.</p>"},{"id":37,"topic":"Design High-Performing Architectures – AWS Batch + Step Functions + S3","supplement":false,"stem":"A media company is modernizing its legacy image processing application by migrating it from an on-premises environment to AWS. The application handles a high volume of image transformation jobs, generating large output files. To support rapid growth, the company wants a cloud-native solution that automatically scales, minimizes manual intervention, and avoids managing servers or infrastructure. The team also wants to improve workflow automation to handle task sequencing and job state transitions.<br>Which solution best meets these requirements while ensuring the least operational overhead?","options":[{"html":"Deploy Amazon Elastic Kubernetes Service (Amazon EKS) with self-managed EC2 worker nodes for image processing. Use Amazon SQS to queue jobs and store processed outputs in Amazon EBS volumes","correct":false},{"html":"Use Amazon EC2 Auto Scaling groups with a static fleet of instances for image processing. Trigger each job through Step Functions and store results on attached EBS volumes","correct":false},{"html":"Use AWS Batch to process image jobs. Orchestrate the workflow using AWS Step Functions and store output files in Amazon S3","correct":true},{"html":"Use a combination of AWS Lambda functions and EC2 Spot Instances for processing. Store processed images in Amazon FSx","correct":false}],"multi":1,"a
