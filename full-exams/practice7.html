<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Test 7 · SAA-C03</title>
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#eef0f5; --text:#1a1d23; --muted:#646c78;
  --border:#dfe3ea; --accent:#3a5bf0; --accent-hover:#2d49d6; --accent-soft:#e8edfe;
  --ok:#1a8f55; --ok-soft:#e4f6ec; --bad:#d13b3b; --bad-soft:#fcebeb; --warn:#b4790a; --warn-soft:#fff3db;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
    --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
    --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
    --shadow:none; --shadow-sm:none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
  --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
  --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
  --shadow:none; --shadow-sm:none;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.65 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .2s ease,color .2s ease;
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);padding:.1em .4em;border-radius:5px}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 56px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
header.top h1{
  font-size:21px;margin:0;letter-spacing:-.015em;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent-hover));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
header.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:7px 14px;min-width:76px;text-align:center;box-shadow:var(--shadow-sm);transition:border-color .15s ease,transform .15s ease}
.stat:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hover));width:0;transition:width .3s ease}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:16px}
.toolbar select,.btn{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 13px;cursor:pointer;transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent}
.toolbar label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.layout{display:grid;grid-template-columns:264px 1fr;gap:18px;align-items:start}
.side{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;position:sticky;top:14px;box-shadow:var(--shadow)}
.side h2{font-size:12.5px;margin:0 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.cell{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;height:32px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums;position:relative;padding:0;transition:border-color .12s ease,transform .12s ease,background .12s ease}
.cell:hover{border-color:var(--accent);transform:translateY(-1px)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell.dim{opacity:.32}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cell.sup{font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--border);background:var(--surface-2)}
.legend .l-ok::before{background:var(--ok-soft);border-color:var(--ok)}
.legend .l-bad::before{background:var(--bad-soft);border-color:var(--bad)}
.legend .l-flag::before{background:var(--warn);border-radius:50%;border:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.qnum{font-weight:700;font-size:17px;letter-spacing:-.01em}
.chip{font-size:12px;padding:3px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;transition:transform .12s ease}
.chip.sup{background:var(--warn-soft);color:var(--warn)}
.chip.multi{background:var(--surface-2);color:var(--muted);font-weight:500}
.flagbtn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:13px;transition:border-color .15s ease,background .15s ease,transform .15s ease}
.flagbtn:hover{border-color:var(--warn);color:var(--warn);transform:translateY(-1px)}
.flagbtn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.stem{line-height:1.7}
.stem p{margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;padding:11px 13px;cursor:pointer;background:var(--surface);transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.opt:hover{border-color:var(--accent);transform:translateX(2px);box-shadow:var(--shadow-sm)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--surface-2);transition:background .15s ease,border-color .15s ease,color .15s ease}
.opt.multi .key{border-radius:7px}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--border);transform:none;box-shadow:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.tag{font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)} .opt.missed .tag{color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .spacer{flex:1}
.verdict{margin:18px 0 6px;padding:11px 15px;border-radius:11px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.hint{margin-top:16px;border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:9px;padding:11px 15px;background:var(--surface-2)}
.hint h3{margin:0 0 6px;font-size:14px;color:var(--warn)}
details.sec{border:1px solid var(--border);border-radius:11px;margin-top:11px;background:var(--surface);transition:border-color .15s ease}
details.sec>summary{cursor:pointer;padding:11px 15px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"›";display:inline-block;transition:transform .15s ease;color:var(--muted);font-size:18px;line-height:1}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec .body{padding:0 16px 14px}
.body p{margin:7px 0}
.body ul,.body ol{margin:7px 0;padding-left:22px}
.body li{margin:4px 0}
.body table{border-collapse:collapse;width:100%;margin:9px 0;font-size:14px;display:block;overflow-x:auto}
.body th,.body td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
.body th{background:var(--surface-2)}
.sec.s-answer{border-left:3px solid var(--ok)}
.sec.s-tip{border-left:3px solid var(--accent)}
.empty{color:var(--muted);text-align:center;padding:44px 10px}
.kbd{font-size:12px;color:var(--muted);margin-top:14px}
.kbd kbd{font-family:inherit;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface-2)}
.summary h2{margin-top:0}
.summary table{border-collapse:collapse;width:100%;font-size:14px}
.summary th,.summary td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left}
.summary td.n{font-variant-numeric:tabular-nums;text-align:right}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s ease}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .grid{grid-template-columns:repeat(10,1fr)}
}
@media (max-width:480px){
  .wrap{padding:14px 16px 40px}
  .card{padding:16px}
  .grid{grid-template-columns:repeat(8,1fr)}
  .stat{min-width:64px;padding:5px 10px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>AWS SAA-C03 · Practice Test 7 (65 câu)</h1>
      <div class="sub">Đề tiếng Anh · Giải thích tiếng Việt · Tiến độ chỉ lưu trong phiên đang mở</div>
    <p style="margin:4px 0 0"><a href="../index.html" style="color:var(--accent)">&larr; Về trang luyện đề chính</a></p>
    </div>
    <div class="stats">
      <div class="stat"><b id="sDone">0</b><span>Đã làm</span></div>
      <div class="stat ok"><b id="sOk">0</b><span>Đúng</span></div>
      <div class="stat bad"><b id="sBad">0</b><span>Sai</span></div>
      <div class="stat"><b id="sPct">–</b><span>Tỷ lệ đúng</span></div>
    </div>
  </header>
  <div class="progress"><i id="prog"></i></div>

  <div class="toolbar">
    <select id="fFilter" aria-label="Lọc câu hỏi">
      <option value="all">Tất cả câu</option>
      <option value="todo">Chưa làm</option>
      <option value="bad">Làm sai</option>
      <option value="flag">Đã đánh dấu</option>
    </select>
    <select id="fTopic" aria-label="Lọc theo chủ đề"><option value="">Mọi chủ đề</option></select>
    <label><input type="checkbox" id="optShuffleQ"> Xáo câu hỏi</label>
    <label><input type="checkbox" id="optShuffleA"> Xáo đáp án</label>
    <label><input type="checkbox" id="optAuto" checked> Hiện giải thích sau khi kiểm tra</label>
    <span style="flex:1"></span>
    <button class="btn" id="btnSummary">Xem kết quả</button>
    <button class="btn ghost" id="btnReset">Làm lại</button>
    <button class="btn ghost" id="btnTheme" title="Đổi giao diện sáng/tối">◐</button>
  </div>

  <div class="layout">
    <aside class="side">
      <h2>Danh sách câu</h2>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span class="l-ok">Đúng</span><span class="l-bad">Sai</span><span>Chưa làm</span><span class="l-flag">Đánh dấu</span>
      </div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<script>
const Q = [{"id":1,"topic":"Design High-Performing Architectures – dạng bài so sánh các dịch vụ lưu trữ của AWS (Amazon FSx, Amazon EFS, Amazon S3, Amazon...","supplement":false,"stem":"An AI-powered Forex trading application consumes thousands of data sets to train its machine learning model. The application’s workload requires a high-performance, parallel hot storage to process the training datasets concurrently. It also needs cost-effective cold storage to archive those datasets that yield low profit.<br><br>Which of the following Amazon storage services should the developer use?","options":[{"html":"Use Amazon FSx For Windows File Server and Amazon S3 for hot and cold storage respectively.","correct":false},{"html":"Use Amazon Elastic File System and Amazon S3 for hot and cold storage respectively.","correct":false},{"html":"Use Amazon FSx For Lustre and Amazon S3 for hot and cold storage respectively.","correct":true},{"html":"Use Amazon FSx For Lustre and the Provisioned IOPS SSD (io1) volumes of Amazon EBS for hot and cold storage respectively.","correct":false}],"multi":1,"analysis":"<p>Đây là dạng bài so sánh các dịch vụ lưu trữ của AWS (Amazon FSx, Amazon EFS, Amazon S3, Amazon EBS) để chọn ra cặp giải pháp phù hợp cho hot storage (hiệu năng cao, xử lý song song) và cold storage (chi phí thấp, lưu trữ lâu dài) — một dạng câu hỏi storage tiering rất phổ biến trong SAA-C03.</p>","answer":"<p>Hot storage là nơi lưu dữ liệu được truy cập thường xuyên, còn cold storage là nơi lưu dữ liệu ít được truy cập; dữ liệu càng &quot;lạnh&quot; thì chi phí lưu trữ càng rẻ nhưng chi phí truy xuất khi cần lại càng cao. Amazon FSx For Lustre là một hệ thống file hiệu năng cao, dựa trên Lustre - một parallel file system mã nguồn mở phổ biến, lưu dữ liệu trải trên nhiều network file server để tối đa hóa hiệu năng và giảm bottleneck, rất phù hợp cho yêu cầu hot storage xử lý song song các training dataset. Amazon S3 là object storage với nhiều storage tier khác nhau (frequently accessed, infrequently accessed, rarely accessed) và hỗ trợ cold storage thông qua Amazon S3 Glacier / Glacier Deep Archive, phù hợp để lưu trữ các dataset ít sinh lời với chi phí thấp. Do đó, kết hợp Amazon FSx For Lustre (hot) và Amazon S3 (cold) đáp ứng đầy đủ cả hai yêu cầu của đề bài.</p>","explain":"<p>- Use Amazon FSx For Lustre and the Provisioned IOPS SSD (io1) volumes of Amazon EBS: các volume Provisioned IOPS SSD (io1) của EBS được thiết kế chủ yếu cho hot data trong các workload I/O-intensive, không phải cho cold storage. EBS có loại &quot;Cold HDD&quot; nhưng giá của nó đắt hơn nhiều so với S3 Glacier / Glacier Deep Archive nên không phù hợp để lưu trữ dữ liệu archive.</p><p>- Use Amazon Elastic File System and Amazon S3: Amazon EFS hỗ trợ truy cập đồng thời (concurrent access) nhưng không có hiệu năng cao như yêu cầu của các workload machine learning.</p><p>- Use Amazon FSx For Windows File Server and Amazon S3: Amazon FSx For Windows File Server không phải là một parallel file system như Lustre nên không đáp ứng được yêu cầu hot storage hiệu năng cao, xử lý song song.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/fsx/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/fsx/</a></li><li><a href=\"https://docs.aws.amazon.com/whitepapers/latest/cost-optimization-storage-optimization/aws-storage-services.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/whitepapers/latest/cost-optimization-storage-optimization/aws-storage-services.html</a></li><li><a href=\"https://aws.amazon.com/blogs/startups/picking-the-right-data-store-for-your-workload/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/blogs/startups/picking-the-right-data-store-for-your-workload/</a></li></ul>"},{"id":2,"topic":"Design High-Performing Architectures – yêu cầu chọn kiến trúc xử lý bursty traffic (lưu lượng tăng đột biến trong vài giây) kế...","supplement":false,"stem":"A startup is using Amazon RDS to store data from a web application. Most of the time, the application has low user activity but it receives bursts of traffic within seconds whenever there is a new product announcement. The Solutions Architect needs to create a solution that will allow users around the globe to access the data using an API.<br><br>What should the Solutions Architect do meet the above requirement?","options":[{"html":"Create an API using Amazon API Gateway and use AWS Lambda to handle the bursts of traffic in seconds.","correct":true},{"html":"Create an API using Amazon API Gateway and use Amazon Elastic Beanstalk with Auto Scaling to handle the bursts of traffic in seconds.","correct":false},{"html":"Create an API using Amazon API Gateway and use an Auto Scaling group of Amazon EC2 instances to handle the bursts of traffic in seconds.","correct":false},{"html":"Create an API using Amazon API Gateway and use the Amazon ECS cluster with Service Auto Scaling to handle the bursts of traffic in seconds.","correct":false}],"multi":1,"analysis":"<p>Dạng bài yêu cầu chọn kiến trúc xử lý bursty traffic (lưu lượng tăng đột biến trong vài giây) kết hợp với việc cung cấp API toàn cầu — kiểm tra khả năng so sánh tốc độ scale của AWS Lambda so với các cơ chế Auto Scaling truyền thống (EC2, Elastic Beanstalk, ECS).</p>","answer":"<p>AWS Lambda cho phép chạy code mà không cần cấp phát hay quản lý server, tự động scale với tính sẵn sàng cao. Khi một function được gọi, Lambda khởi tạo instance để xử lý; nếu có thêm request đến trong lúc event đầu đang xử lý, Lambda khởi tạo thêm instance khác để xử lý đồng thời, và tiếp tục route các request mới đến instance có sẵn hoặc tạo thêm instance khi cần. Với một đợt burst traffic ban đầu, concurrency của function trong một Region có thể đạt mức 500-3000 tùy theo Region. Yêu cầu của đề bài gồm hai phần: cung cấp API để truy cập dữ liệu (dùng Amazon API Gateway) và xử lý burst traffic trong vài giây (dùng AWS Lambda, vì Lambda có thể hấp thụ các đợt burst traffic hợp lý trong khoảng 15-30 phút). Lambda có thể scale nhanh hơn Auto Scaling thông thường của EC2, Elastic Beanstalk hay ECS vì đây là dịch vụ nhẹ hơn (lightweight hơn); Lambda chạy code trên hàng nghìn EC2 instance do AWS quản lý (có thể đã đang chạy sẵn) chỉ trong vài giây, nhanh hơn nhiều so với quá trình Auto Scaling phải khởi chạy EC2 instance mới (mất vài phút). Một cách khác là over-provision compute capacity nhưng sẽ tốn chi phí đáng kể. Vì vậy, kết hợp AWS Lambda và Amazon API Gateway là lựa chọn tốt nhất.</p>","explain":"<p>- Create an API using Amazon API Gateway and use the Amazon ECS cluster with Service Auto Scaling: AWS Lambda là lựa chọn tốt hơn Amazon ECS vì có thể xử lý burst traffic trong vài giây thay vì vài phút.</p><p>- Create an API using Amazon API Gateway and use Amazon Elastic Beanstalk with Auto Scaling: tương tự, Auto Scaling có độ trễ vài phút vì phải khởi chạy EC2 instance mới để Elastic Beanstalk sử dụng.</p><p>- Create an API using Amazon API Gateway and use an Auto Scaling group of Amazon EC2 instances: thời gian Auto Scaling của EC2 cấp phát tài nguyên mới mất đến vài phút, trong khi đề bài yêu cầu xử lý burst traffic trong vài giây.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/blogs/startups/from-0-to-100-k-in-seconds-instant-scale-with-aws-lambda/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/blogs/startups/from-0-to-100-k-in-seconds-instant-scale-with-aws-lambda/</a></li><li><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/invocation-scaling.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/lambda/latest/dg/invocation-scaling.html</a></li></ul>"},{"id":3,"topic":"Design High-Performing Architectures – kiểm tra cách bảo vệ backend khỏi traffic spike bằng các tính năng throttling/caching c...","supplement":false,"stem":"A cryptocurrency trading platform is using an API built in AWS Lambda and API Gateway. Due to the recent news and rumors about the upcoming price surge of Bitcoin, Ethereum and other cryptocurrencies, it is expected that the trading platform would have a significant increase in site visitors and new users in the coming days ahead.<br><br>In this scenario, how can you protect the backend systems of the platform from traffic spikes?","options":[{"html":"Move the Lambda function in a VPC.","correct":false},{"html":"Use CloudFront in front of the API Gateway to act as a cache.","correct":false},{"html":"Switch from using AWS Lambda and API Gateway to a more scalable and highly available architecture using EC2 instances, ELB, and Auto Scaling.","correct":false},{"html":"Enable throttling limits and result caching in API Gateway.","correct":true}],"multi":1,"analysis":"<p>Dạng bài kiểm tra cách bảo vệ backend khỏi traffic spike bằng các tính năng throttling/caching của Amazon API Gateway, đồng thời phân biệt API Gateway với các dịch vụ không liên quan trực tiếp đến việc kiểm soát rate của request.</p>","answer":"<p>Amazon API Gateway cung cấp throttling ở nhiều cấp độ, bao gồm global và theo từng service call, với giới hạn có thể cấu hình cho cả rate tiêu chuẩn và burst. Ví dụ, có thể đặt rate limit 1.000 request/giây cho một method cụ thể trong REST API, đồng thời cho phép burst 2.000 request/giây trong vài giây. API Gateway theo dõi số lượng request mỗi giây; nếu vượt giới hạn, request sẽ nhận phản hồi HTTP 429, và các client SDK do API Gateway sinh ra sẽ tự động retry khi gặp phản hồi này. Ngoài ra, có thể cấu hình cache cho API Gateway bằng cách cấp phát dung lượng cache (tính bằng GB) cho một stage cụ thể, giúp cải thiện hiệu năng và giảm traffic đến backend; cache settings cho phép kiểm soát cách xây dựng cache key và thời gian sống (TTL) của dữ liệu lưu cho mỗi method, cùng với các management API để invalidate cache theo từng stage. Vì vậy, bật throttling limit và result caching trong API Gateway là giải pháp đúng để bảo vệ backend khỏi traffic spike.</p>","explain":"<p>- Switch from using AWS Lambda and API Gateway to a more scalable and highly available architecture using EC2 instances, ELB, and Auto Scaling: không cần thiết phải chuyển đổi toàn bộ ứng dụng sang dịch vụ khác.</p><p>- Use CloudFront in front of the API Gateway to act as a cache: CloudFront chỉ giúp tăng tốc độ phân phối nội dung, mang lại trải nghiệm độ trễ tốt hơn cho người dùng, nhưng không hỗ trợ nhiều cho việc bảo vệ backend.</p><p>- Move the Lambda function in a VPC: phương án này không liên quan đến yêu cầu của đề bài; VPC chỉ là mạng riêng ảo nơi bạn triển khai các dịch vụ AWS, không giúp kiểm soát traffic spike.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/api-gateway/faqs/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/api-gateway/faqs/</a></li></ul>"},{"id":4,"topic":"Design High-Performing Architectures – chọn phương pháp truyền dữ liệu nhanh nhất lên Amazon S3 từ nhiều địa điểm trên toàn cầ...","supplement":false,"stem":"A company collects atmospheric data such as temperature, air pressure, and humidity from different countries. Each site location is equipped with various weather instruments and a high-speed Internet connection. The average collected data in each location is around 500 GB and will be analyzed by a weather forecasting application hosted in Northern Virginia. The Solutions Architect must determine the fastest way to aggregate all the data. An AWS Direct Connect Partner would be too slow for a one-time aggregation.<br><br>Which of the following options can satisfy the given requirement?","options":[{"html":"Enable Transfer Acceleration in the destination bucket and upload the collected data using Multipart Upload.","correct":true},{"html":"Upload the data to the closest Amazon S3 bucket. Set up a cross-region replication and copy the objects to the destination bucket.","correct":false},{"html":"Use AWS DataSync to transfer large amounts of data.","correct":false},{"html":"Set up an AWS Site-to-Site VPN connection.","correct":false}],"multi":1,"analysis":"<p>Dạng bài chọn phương pháp truyền dữ liệu nhanh nhất lên Amazon S3 từ nhiều địa điểm trên toàn cầu (one-time data transfer/aggregation), kiểm tra hiểu biết về Amazon S3 Transfer Acceleration, Multipart Upload và các giải pháp truyền dữ liệu khác của AWS.</p>","answer":"<p>Amazon S3 là dịch vụ lưu trữ object với độ bền, tính sẵn sàng, hiệu năng, bảo mật cao và khả năng mở rộng gần như không giới hạn với chi phí thấp. Vì ứng dụng dự báo thời tiết đặt tại N. Virginia, dữ liệu cần được truyền vào cùng Region đó. Amazon S3 Transfer Acceleration giúp tăng tốc độ truyền nội dung đến/từ S3 lên tới 50-500% đối với việc truyền các object lớn ở khoảng cách xa. Multipart Upload cho phép tải lên một object dưới dạng nhiều phần (part); sau khi tất cả các phần được tải lên, S3 sẽ ghép lại thành một object hoàn chỉnh. Đây là cách nhanh nhất để tổng hợp toàn bộ dữ liệu từ các địa điểm khác nhau, vì vậy kết hợp Transfer Acceleration và Multipart Upload là giải pháp đúng.</p>","explain":"<p>- Upload the data to the closest Amazon S3 bucket. Set up a cross-region replication and copy the objects to the destination bucket: việc replicate object sang bucket đích thường mất khoảng 15 phút, trong khi yêu cầu của đề bài là tổng hợp dữ liệu theo cách nhanh nhất.</p><p>- Use AWS DataSync to transfer large amounts of data: DataSync yêu cầu cấu hình location nguồn và đích, và đối với nguồn on-premises còn cần một DataSync agent; điều này chỉ làm tăng thêm công sức cấu hình cho một lần truyền dữ liệu one-time từ nhiều địa điểm toàn cầu, và không phải là phương pháp upload trực tiếp nhanh nhất cho tình huống này.</p><p>- Set up an AWS Site-to-Site VPN connection: không cần thiết lập VPN connection trong trường hợp này; Site-to-Site VPN chỉ dùng để thiết lập kết nối an toàn giữa mạng on-premises và một Amazon VPC, và đây cũng không phải cách nhanh nhất để truyền dữ liệu. Phải sử dụng Amazon S3 Transfer Acceleration.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/replication.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/dev/replication.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/transfer-acceleration.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/dev/transfer-acceleration.html</a></li></ul>"},{"id":5,"topic":"Design Secure Architectures – phân biệt các dịch vụ AWS liên quan đến bảo mật/tuân thủ (AWS Artifact, IAM, AWS Securi...","supplement":false,"stem":"A business has recently migrated its applications to AWS. The audit team must be able to assess whether the services the company is using meet common security and regulatory standards. A solutions architect needs to provide the team with a report of all compliance-related documents for their account.<br><br>Which action should a solutions architect consider?","options":[{"html":"Use AWS Identity and Access Management to retrieve the required compliance reports for the account.","correct":false},{"html":"Use AWS Artifact to view the security reports as well as other AWS compliance-related information.","correct":true},{"html":"Access all AWS security compliance reports through AWS Security Hub.","correct":false},{"html":"Run an Amazon Inspector assessment job to download all of the AWS compliance-related information.","correct":false}],"multi":1,"analysis":"<p>Dạng bài phân biệt các dịch vụ AWS liên quan đến bảo mật/tuân thủ (AWS Artifact, IAM, AWS Security Hub, Amazon Inspector) để chọn đúng dịch vụ cung cấp các báo cáo compliance có sẵn.</p>","answer":"<p>AWS Artifact là nguồn tài nguyên trung tâm cho các thông tin liên quan đến compliance, cung cấp quyền truy cập theo yêu cầu (on-demand) vào các báo cáo bảo mật và tuân thủ của AWS cùng một số thỏa thuận trực tuyến. Các báo cáo có trong AWS Artifact bao gồm Service Organization Control (SOC) reports, Payment Card Industry (PCI) reports, và các chứng nhận từ các tổ chức công nhận (accreditation bodies) trên nhiều khu vực địa lý và lĩnh vực tuân thủ, xác nhận việc triển khai và hiệu quả hoạt động của các biện pháp kiểm soát bảo mật của AWS. Các thỏa thuận có trong AWS Artifact gồm Business Associate Addendum (BAA) và Nondisclosure Agreement (NDA). Tất cả tài khoản AWS đều có quyền truy cập AWS Artifact; root user và IAM user có quyền admin có thể tải tất cả audit artifact khả dụng cho tài khoản của họ sau khi đồng ý các điều khoản liên quan, còn IAM user không có quyền admin cần được cấp quyền truy cập AWS Artifact thông qua IAM permissions. Vì vậy, AWS Artifact là lựa chọn đúng để cung cấp báo cáo compliance cho đội audit.</p>","explain":"<p>- Run an Amazon Inspector assessment job to download all of the AWS compliance-related information: Amazon Inspector chỉ là công cụ bảo mật để phát hiện lỗ hổng trong các workload AWS, không phải là nơi lưu trữ báo cáo compliance; nên dùng AWS Artifact có sẵn các báo cáo này thay vì chạy Inspector.</p><p>- Use AWS Identity and Access Management to retrieve the required compliance reports for the account: IAM chỉ là dịch vụ kiểm soát quyền truy cập vào tài nguyên AWS thông qua user, role và permission; IAM không lưu trữ, tạo ra hay cung cấp quyền truy cập báo cáo tuân thủ bảo mật.</p><p>- Access all AWS security compliance reports through AWS Security Hub: AWS Security Hub chỉ cung cấp một cái nhìn tổng quan toàn diện về các cảnh báo bảo mật ưu tiên cao và tình trạng bảo mật (security posture) trên các tài khoản AWS, không phải là nơi chứa báo cáo compliance.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/artifact/getting-started/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/artifact/getting-started/</a></li><li><a href=\"https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html</a></li></ul>"},{"id":6,"topic":"Design Secure Architectures – yêu cầu phân biệt các phương pháp mã hóa của Amazon S3 (client-side encryption với clie...","supplement":false,"stem":"An online medical system hosted in AWS stores sensitive Personally Identifiable Information (PII) of the users in an Amazon S3 bucket. Both the master keys and the unencrypted data should never be sent to AWS to comply with the strict compliance and regulatory requirements of the company.<br><br>Which S3 encryption technique should the Architect use?","options":[{"html":"Use S3 client-side encryption with a client-side master key.","correct":true},{"html":"Use S3 client-side encryption with an AWS KMS key.","correct":false},{"html":"Use S3 server-side encryption with an AWS KMS key.","correct":false},{"html":"Use S3 server-side encryption with customer provided key.","correct":false}],"multi":1,"analysis":"<p>Dạng bài yêu cầu phân biệt các phương pháp mã hóa của Amazon S3 (client-side encryption với client-side master key, client-side encryption với AWS KMS key, server-side encryption với KMS key, server-side encryption với customer-provided key - SSE-C) dựa trên yêu cầu nghiêm ngặt rằng cả master key lẫn dữ liệu chưa mã hóa đều không được gửi lên AWS.</p>","answer":"<p>Client-side encryption là việc mã hóa dữ liệu trước khi gửi lên Amazon S3. Có hai cách để thực hiện client-side encryption: dùng AWS KMS key, hoặc dùng client-side master key. Khi dùng client-side master key, master key và dữ liệu chưa mã hóa của bạn không bao giờ được gửi lên AWS - bạn phải tự quản lý an toàn các encryption key này vì nếu mất key sẽ không thể giải mã dữ liệu. Cơ chế hoạt động: khi upload, S3 encryption client sinh ngẫu nhiên một symmetric key dùng một lần (data encryption key) để mã hóa dữ liệu của từng object (mỗi object có một data key riêng); client mã hóa data key này bằng master key do bạn cung cấp, rồi upload data key đã mã hóa cùng với material description dưới dạng object metadata (x-amz-meta-x-amz-key); khi download, client dùng material description để xác định master key cần dùng để giải mã data key, sau đó dùng data key để giải mã object. Vì cả master key và dữ liệu thô đều không được gửi lên AWS, phương pháp này đáp ứng đúng yêu cầu của đề bài.</p>","explain":"<p>- Use S3 client-side encryption with an AWS KMS key: khi dùng client-side encryption với KMS key, bạn phải cung cấp AWS KMS key identifier (KeyId) cho AWS, trong khi đề bài yêu cầu rằng cả master key và dữ liệu chưa mã hóa đều không được gửi lên AWS.</p><p>- Use S3 server-side encryption with an AWS KMS key: đề bài yêu cầu dữ liệu chưa mã hóa không được gửi lên AWS, tức là phải dùng client-side encryption để mã hóa dữ liệu trước khi gửi lên; ngoài ra, master key dùng trong SSE-KMS được upload và quản lý bởi AWS, vi phạm trực tiếp yêu cầu không được gửi master key.</p><p>- Use S3 server-side encryption with customer provided key: tương tự, cần dùng client-side encryption thay vì server-side encryption trong tình huống này. Với SSE-C, bạn cung cấp encryption key như một phần của request upload object lên S3, và S3 sẽ quản lý cả việc mã hóa (khi ghi vào đĩa) lẫn giải mã (khi truy cập object) bằng key đó - nghĩa là dữ liệu vẫn được gửi ở dạng chưa mã hóa lên AWS trước khi được mã hóa phía server.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingEncryption.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingEncryption.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingClientSideEncryption.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingClientSideEncryption.html</a></li></ul>"},{"id":7,"topic":"Design Resilient Architectures – kiểm tra kiến thức về tính sẵn sàng cao (high availability) của Amazon RDS, cụ thể là p...","supplement":false,"stem":"An application that records weather data every minute is deployed in a fleet of Amazon EC2 Spot instances and uses a MySQL RDS database instance. Currently, there is only one Amazon RDS instance running in one Availability Zone. The database needs to be improved to ensure high availability by enabling synchronous data replication to another RDS instance.<br><br>Which of the following performs synchronous data replication in RDS?","options":[{"html":"RDS Read Replica","correct":false},{"html":"RDS DB instance running as a Multi-AZ deployment","correct":true},{"html":"Amazon CloudFront running as a Multi-AZ deployment","correct":false},{"html":"Amazon DynamoDB Read Replica","correct":false}],"multi":1,"analysis":"<p>Dạng bài kiểm tra kiến thức về tính sẵn sàng cao (high availability) của Amazon RDS, cụ thể là phân biệt giữa Multi-AZ deployment (đồng bộ - synchronous) và Read Replica (bất đồng bộ - asynchronous), cùng với việc loại trừ các khái niệm không tồn tại ở các dịch vụ khác.</p>","answer":"<p>Khi bạn tạo hoặc chỉnh sửa DB instance để chạy dưới dạng Multi-AZ deployment, Amazon RDS tự động cấp phát và duy trì một standby replica đồng bộ (synchronous) ở một Availability Zone khác. Các cập nhật trên DB instance của bạn được replicate đồng bộ qua các Availability Zone đến standby để giữ cho cả hai luôn đồng bộ và bảo vệ các cập nhật dữ liệu mới nhất khỏi sự cố của DB instance. Vì vậy, RDS DB instance chạy dưới dạng Multi-AZ deployment chính là giải pháp thực hiện replication đồng bộ.</p>","explain":"<p>- RDS Read Replica: Read Replica chủ yếu cung cấp replication bất đồng bộ (asynchronous) chứ không phải đồng bộ.</p><p>- Amazon DynamoDB Read Replica: DynamoDB không có tính năng Read Replica; DynamoDB thường dùng global tables để replicate dữ liệu trên nhiều AWS Region.</p><p>- Amazon CloudFront running as a Multi-AZ deployment: CloudFront cũng không có tính năng Read Replica; CloudFront chỉ cache nội dung tại các edge location chứ không thực hiện replication dữ liệu trong database.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/rds/details/multi-az/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/rds/details/multi-az/</a></li><li><a href=\"https://aws.amazon.com/rds/features/multi-az/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/rds/features/multi-az/</a></li></ul>"},{"id":8,"topic":"Design High-Performing Architectures – so sánh database quan hệ (relational) với NoSQL để chọn giải pháp phù hợp khi ứng dụng ...","supplement":false,"stem":"A company is in the process of migrating their applications to AWS. One of their systems requires a database that can scale globally and handle frequent schema changes. The application should not have any downtime or performance issues whenever there is a schema change in the database. It should also provide a low latency response to high-traffic queries.<br><br>Which is the most suitable database solution to use to achieve this requirement?","options":[{"html":"An Amazon RDS instance in Multi-AZ Deployments configuration","correct":false},{"html":"An Amazon Aurora database with Read Replicas","correct":false},{"html":"Amazon DynamoDB","correct":true},{"html":"Redshift","correct":false}],"multi":1,"analysis":"<p>Dạng bài so sánh database quan hệ (relational) với NoSQL để chọn giải pháp phù hợp khi ứng dụng cần schema linh hoạt, thay đổi thường xuyên mà không gây downtime, và cần đáp ứng truy vấn với độ trễ thấp khi traffic cao - đây là dạng &quot;chọn giữa relational và NoSQL database&quot; kinh điển trong SAA-C03.</p>","answer":"<p>Schema có thể hiểu là &quot;cấu trúc&quot; hay &quot;mô hình&quot; của dữ liệu trong database. Vì đề bài yêu cầu schema thay đổi thường xuyên, cần chọn một database có cách thêm/bớt loại dữ liệu linh hoạt, không cứng nhắc. Database quan hệ (relational) có schema cứng nhắc, nhiều ràng buộc về loại dữ liệu được chèn vào, phù hợp cho các truy vấn phức tạp trên nhiều bảng có quan hệ chặt chẽ, nhưng không phù hợp khi cần schema linh hoạt. Ngược lại, NoSQL không cứng nhắc như vậy vì có thể dễ dàng thêm/bớt row hoặc phần tử trong table/collection, đồng thời có schema linh hoạt hơn vì có thể lưu dữ liệu phân cấp phức tạp (hierarchical data) trong một item duy nhất, không như relational database phải thay đổi nhiều bảng liên quan. Do đó, NoSQL database như DynamoDB là lựa chọn tốt nhất; khi doanh nghiệp cần phản hồi độ trễ thấp cho các truy vấn có traffic cao, việc sử dụng hệ thống NoSQL thường hợp lý cả về mặt kỹ thuật lẫn kinh tế. Amazon DynamoDB giải quyết các vấn đề giới hạn khả năng mở rộng của hệ thống quan hệ bằng cách tránh chúng: bạn thiết kế schema sao cho các truy vấn quan trọng và phổ biến nhất chạy nhanh và tiết kiệm chi phí nhất, cấu trúc dữ liệu được tùy chỉnh theo yêu cầu cụ thể của use case. Relational database không scale tốt vì: chuẩn hóa dữ liệu và lưu trên nhiều bảng cần nhiều truy vấn để ghi vào đĩa; thường phát sinh chi phí hiệu năng của hệ thống giao dịch tuân thủ ACID; sử dụng các join tốn kém để ghép lại kết quả truy vấn. Trong khi đó, DynamoDB scale tốt vì: tính linh hoạt về schema cho phép lưu dữ liệu phân cấp phức tạp trong một item duy nhất (DynamoDB không hoàn toàn &quot;schemaless&quot; vì bản chất schema chỉ là mô hình/cấu trúc dữ liệu); thiết kế composite key cho phép lưu các item liên quan gần nhau trên cùng một bảng.</p>","explain":"<p>- An Amazon RDS instance in Multi-AZ Deployments configuration: đây là một loại relational database, không phù hợp với yêu cầu schema thay đổi linh hoạt.</p><p>- An Amazon Aurora database with Read Replicas: tương tự, đây cũng là một loại relational database.</p><p>- Redshift: Redshift chủ yếu được dùng cho các hệ thống OLAP (phân tích dữ liệu), không phù hợp cho yêu cầu của đề bài.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-general-nosql-design.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-general-nosql-design.html</a></li><li><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-relational-modeling.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-relational-modeling.html</a></li><li><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/SQLtoNoSQL.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/SQLtoNoSQL.html</a></li></ul>"},{"id":9,"topic":"Design Resilient Architectures – về bảo vệ dữ liệu trên Amazon S3 khỏi việc xóa nhầm (accidental deletion), kiểm tra kiế...","supplement":false,"stem":"A company has 3 DevOps engineers that are handling its software development and infrastructure management processes. One of the engineers accidentally deleted a file hosted in Amazon S3 which has caused disruption of service.<br><br>What can the DevOps engineers do to prevent this from happening again?","options":[{"html":"Enable S3 Versioning and Multi-Factor Authentication Delete on the bucket.","correct":true},{"html":"Create an IAM bucket policy that disables delete operation.","correct":false},{"html":"Use S3 Infrequently Accessed storage to store the data.","correct":false},{"html":"Set up a signed URL for all users.","correct":false}],"multi":1,"analysis":"<p>Dạng bài về bảo vệ dữ liệu trên Amazon S3 khỏi việc xóa nhầm (accidental deletion), kiểm tra kiến thức về S3 Versioning kết hợp MFA Delete so với các giải pháp không liên quan trực tiếp (storage class, signed URL, bucket policy chặn hẳn delete).</p>","answer":"<p>Để tăng cường bảo vệ dữ liệu và tuân theo best practice về bảo mật object lưu trữ, AWS khuyến nghị triển khai các biện pháp phòng ngừa việc xóa nhầm. Để tránh xóa nhầm trong một Amazon S3 bucket, bạn có thể: bật Versioning, và bật MFA (Multi-Factor Authentication) Delete. Versioning là cách lưu nhiều phiên bản (variant) của một object trong cùng một bucket, cho phép bạn lưu giữ, truy xuất và khôi phục mọi phiên bản của mọi object đã lưu trong bucket, giúp dễ dàng khôi phục sau các hành động vô ý của người dùng hoặc lỗi ứng dụng. Nếu bật MFA Delete, hệ thống sẽ yêu cầu xác thực bổ sung cho các thao tác: thay đổi trạng thái versioning của bucket, hoặc xóa vĩnh viễn một phiên bản của object. Do đó, bật S3 Versioning và MFA Delete trên bucket là giải pháp đúng.</p>","explain":"<p>- Use S3 Infrequently Accessed storage to store the data: việc chuyển storage class sang S3 Infrequent Access không giúp giảm thiểu việc xóa nhầm.</p><p>- Set up a signed URL for all users: signed URL giúp kiểm soát quyền truy cập vào nội dung tốt hơn, nên tính năng này chủ yếu liên quan đến việc truy cập hơn là việc xóa dữ liệu.</p><p>- Create an IAM bucket policy that disables delete operation: nếu tạo bucket policy ngăn hoàn toàn việc xóa, những người dùng khác sẽ không thể xóa các object cần xóa một cách hợp lệ. Mục tiêu ở đây chỉ là ngăn việc xóa nhầm, không phải vô hiệu hóa hoàn toàn thao tác xóa.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"http://docs.aws.amazon.com/AmazonS3/latest/dev/Versioning.html\" target=\"_blank\" rel=\"noopener noreferrer\">http://docs.aws.amazon.com/AmazonS3/latest/dev/Versioning.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/MultiFactorAuthenticationDelete.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/MultiFactorAuthenticationDelete.html</a></li></ul>"},{"id":10,"topic":"Design Secure Architectures – chọn giải pháp chống lại request bất hợp pháp từ các IP liên tục thay đổi (dynamic IP) ...","supplement":false,"stem":"A company hosted an e-commerce website on an Auto Scaling group of Amazon EC2 instances behind an Application Load Balancer. The Solutions Architect noticed that the website is receiving a high number of illegitimate external requests from multiple systems with frequently changing IP addresses. To address the performance issues, the Solutions Architect must implement a solution that would block these requests while having minimal impact on legitimate traffic.<br><br>Which of the following options fulfills this requirement?","options":[{"html":"Create a rate-based rule in AWS WAF and associate the web ACL to an Application Load Balancer.","correct":true},{"html":"Create a regular rule in AWS WAF and associate the web ACL to an Application Load Balancer.","correct":false},{"html":"Create a private connection using AWS PrivateLink to block the offending requests.","correct":false},{"html":"Create a custom network ACL and associate it with the subnet of the Application Load Balancer to block the offending requests.","correct":false}],"multi":1,"analysis":"<p>Dạng bài chọn giải pháp chống lại request bất hợp pháp từ các IP liên tục thay đổi (dynamic IP) mà không ảnh hưởng nhiều đến traffic hợp lệ, kiểm tra hiểu biết về AWS WAF rate-based rule so với regular rule, NACL, và AWS PrivateLink.</p>","answer":"<p>AWS WAF tích hợp chặt chẽ với Amazon CloudFront, Application Load Balancer (ALB), Amazon API Gateway và AWS AppSync - các dịch vụ thường được khách hàng AWS dùng để phân phối nội dung cho website và ứng dụng của họ. Khi dùng AWS WAF với CloudFront, các rule chạy tại tất cả AWS Edge Location trên toàn cầu, gần người dùng cuối, nên bảo mật không đánh đổi hiệu năng - các request bị chặn sẽ dừng lại trước khi đến web server. Khi dùng AWS WAF với các dịch vụ theo vùng (regional) như ALB, API Gateway, AppSync, các rule chạy trong Region và có thể bảo vệ cả tài nguyên internet-facing lẫn tài nguyên nội bộ. Một rate-based rule theo dõi tốc độ request từ mỗi địa chỉ IP nguồn và kích hoạt hành động của rule đối với các IP có tốc độ vượt quá giới hạn (tính theo số request trong khoảng 5 phút); loại rule này cho phép tạm thời chặn request từ một IP đang gửi quá nhiều request. Dựa trên đề bài, yêu cầu là giới hạn số request từ các nguồn bất hợp pháp mà không ảnh hưởng đến request hợp lệ; để thực hiện điều này, ta dùng AWS WAF web ACL với loại rule rate-based (thay vì regular). Sau khi tạo web ACL, có thể gắn nó với ALB; khi điều kiện của rule được kích hoạt, AWS WAF sẽ áp dụng hành động chặn cho các request tiếp theo từ IP đó cho đến khi tốc độ request giảm xuống dưới giới hạn.</p>","explain":"<p>- Create a regular rule in AWS WAF and associate the web ACL to an Application Load Balancer: regular rule chỉ khớp theo statement được định nghĩa trong rule; nếu cần thêm giới hạn rate, phải dùng rate-based rule thay vì regular rule.</p><p>- Create a custom network ACL and associate it with the subnet of the Application Load Balancer to block the offending requests: mặc dù NACL có thể giúp chặn traffic đến, nhưng phương án này không thể giới hạn số lượng request từ một IP đang thay đổi liên tục.</p><p>- Create a private connection using AWS PrivateLink to block the offending requests: đây chỉ là dịch vụ networking cung cấp kết nối riêng tư giữa các VPC và dịch vụ AWS, không phải giải pháp lọc request; nó không thể kiểm tra traffic HTTP, theo dõi tốc độ request hay chặn IP độc hại.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based.html</a></li><li><a href=\"https://aws.amazon.com/waf/faqs/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/waf/faqs/</a></li></ul>"},{"id":11,"topic":"Design Secure Architectures – đọc hiểu và phân tích một IAM policy JSON (dạng dùng trong CloudFormation template) để ...","supplement":false,"stem":"A newly hired Solutions Architect is assigned to manage a set of CloudFormation templates that are used in the company’s cloud architecture in AWS. The Architect accessed the templates and tried to analyze the configured IAM policy for an S3 bucket.<br><pre class=\"code\">{\n&quot;Version&quot;: &quot;2012-10-17&quot;,\n&quot;Statement&quot;: [\n{\n&quot;Effect&quot;: &quot;Allow&quot;,\n&quot;Action&quot;: [\n&quot;s3:Get*&quot;,\n&quot;s3:List*&quot;\n],\n&quot;Resource&quot;: &quot;*&quot;\n},\n{\n&quot;Effect&quot;: &quot;Allow&quot;,\n&quot;Action&quot;: &quot;s3:PutObject&quot;,\n&quot;Resource&quot;: &quot;arn:aws:s3:::boracay/*&quot;\n}\n]\n}</pre>What does the above IAM policy allow? (Select THREE.)","options":[{"html":"An IAM user with this IAM policy is allowed to read objects in the boracay S3 bucket but not allowed to list the objects in the bucket.","correct":false},{"html":"An IAM user with this IAM policy is allowed to read objects from the boracay S3 bucket.","correct":true},{"html":"An IAM user with this IAM policy is allowed to read and delete objects from the boracay S3 bucket.","correct":false},{"html":"An IAM user with this IAM policy is allowed to read objects from all S3 buckets owned by the account.","correct":true},{"html":"An IAM user with this IAM policy is allowed to write objects into the boracay S3 bucket.","correct":true},{"html":"An IAM user with this IAM policy is allowed to change access rights for the boracay S3 bucket.","correct":false}],"multi":3,"analysis":"<p>Dạng bài đọc hiểu và phân tích một IAM policy JSON (dạng dùng trong CloudFormation template) để xác định chính xác các quyền (permission) mà policy đó cấp cho user - kỹ năng đọc IAM policy statement rất quan trọng trong SAA-C03.</p>","answer":"<p>Trong AWS, bạn quản lý quyền truy cập bằng cách tạo policy và gắn chúng vào các identity (user, group, role) hoặc tài nguyên AWS; policy là một object định nghĩa quyền khi được gắn với một identity hoặc resource, và AWS sẽ đánh giá các policy này khi một IAM principal thực hiện request để quyết định cho phép hay từ chối. IAM policy định nghĩa quyền cho hành động bất kể phương thức thực hiện (console, CLI hay API). Dựa trên policy được cho, statement đầu tiên cho phép s3:Get* và s3:List* trên Resource &quot;*&quot; (tức tất cả bucket thuộc tài khoản), nghĩa là user được phép đọc (get) và liệt kê (list) object từ mọi bucket S3 thuộc tài khoản. Statement thứ hai cho phép s3:PutObject trên bucket boracay, nghĩa là user được phép ghi (put/write) object vào bucket boracay. Vì vậy, policy này cho phép: đọc object từ tất cả bucket S3 thuộc tài khoản; ghi object vào bucket boracay; và đọc object từ bucket boracay (vì bucket boracay cũng nằm trong phạm vi Resource &quot;*&quot; của statement đầu).</p>","explain":"<p>- An IAM user with this IAM policy is allowed to change access rights for the boracay S3 bucket: policy này không có statement nào cho phép thay đổi quyền truy cập (access rights) của bucket.</p><p>- An IAM user with this IAM policy is allowed to read objects in the boracay S3 bucket but not allowed to list the objects in the bucket: sai vì trong policy có action s3:List*, cho phép user liệt kê (list) object trong bucket.</p><p>- An IAM user with this IAM policy is allowed to read and delete objects from the boracay S3 bucket: mặc dù user có thể đọc object từ bucket, nhưng policy không có action nào cho phép xóa (delete) object.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/API/RESTObjectOps.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/API/RESTObjectOps.html</a></li><li><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html</a></li></ul>"},{"id":12,"topic":"Design Secure Architectures – kiểm tra khái niệm CORS (Cross-origin resource sharing) trên Amazon S3 khi JavaScript t...","supplement":false,"stem":"A Solutions Architect is hosting a website in an Amazon S3 bucket named examplecorp-site. The users load the website using the following URL: http://examplecorp-site.s3-website-us-east-1.amazonaws.com. A new requirement has been introduced to add JavaScript on the webpages to make authenticated HTTP GET requests against the same bucket using the S3 API endpoint (examplecorp-site.s3.amazonaws.com). However, upon testing, the web browser blocks JavaScript from allowing those requests.<br><br>Which of the following options is the MOST suitable solution to implement for this scenario?","options":[{"html":"Enable Cross-Zone Load Balancing.","correct":false},{"html":"Enable Cross-Region Replication (CRR).","correct":false},{"html":"Enable cross-account access.","correct":false},{"html":"Enable Cross-origin resource sharing (CORS) configuration in the bucket.","correct":true}],"multi":1,"analysis":"<p>Dạng bài kiểm tra khái niệm CORS (Cross-origin resource sharing) trên Amazon S3 khi JavaScript trên trang web bị trình duyệt chặn do gọi sang một origin/endpoint khác, đồng thời loại trừ các khái niệm &quot;Cross-...&quot; dễ gây nhầm lẫn khác (Cross-Zone Load Balancing, Cross-Region Replication, cross-account access).</p>","answer":"<p>Cross-origin resource sharing (CORS) định nghĩa cách mà các ứng dụng web client được load từ một domain có thể tương tác với tài nguyên ở một domain khác. Với CORS, bạn có thể xây dựng các ứng dụng web client-side phong phú với Amazon S3 và cho phép có chọn lọc việc truy cập cross-origin vào tài nguyên S3 của mình. Trong tình huống đề bài, website được host tại endpoint http://examplecorp-site.s3-website-us-east-1.amazonaws.com, và muốn dùng JavaScript trên các trang này để gửi request GET/PUT có xác thực đến cùng bucket nhưng qua S3 API endpoint (examplecorp-site.s3.amazonaws.com). Trình duyệt thông thường sẽ chặn JavaScript thực hiện các request này do khác origin, nhưng với CORS, bạn có thể cấu hình bucket để cho phép tường minh (explicitly enable) các cross-origin request từ origin website của mình. Vì vậy, bật cấu hình CORS trên bucket là giải pháp phù hợp nhất.</p>","explain":"<p>- Enable cross-account access: đây chỉ là một tính năng của IAM, không phải của Amazon S3, và không liên quan đến việc chặn request JavaScript do khác origin.</p><p>- Enable Cross-Zone Load Balancing: Cross-Zone Load Balancing chỉ được dùng trong ELB, không áp dụng cho S3.</p><p>- Enable Cross-Region Replication (CRR): CRR là cấu hình ở cấp bucket cho phép tự động sao chép object một cách bất đồng bộ (asynchronous) giữa các bucket ở các AWS Region khác nhau, không liên quan đến việc cho phép JavaScript gọi cross-origin.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"http://docs.aws.amazon.com/AmazonS3/latest/dev/cors.html\" target=\"_blank\" rel=\"noopener noreferrer\">http://docs.aws.amazon.com/AmazonS3/latest/dev/cors.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/ManageCorsUsing.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/dev/ManageCorsUsing.html</a></li></ul>"},{"id":13,"topic":"Design Secure Architectures – xử lý hotlinking/chống đánh cắp nội dung (content theft) trên Amazon S3 khi biện pháp d...","supplement":false,"stem":"A travel photo-sharing website is using Amazon S3 to serve high-quality photos to visitors. After a few days, it was discovered that other travel websites are linking to and using these photos. This has resulted in financial losses for the business. The team initially applied PutBucketPolicy with referrer restrictions, but found that referrer headers can be spoofed, rendering this approach insufficient.<br><br>What is the MOST effective method to mitigate this issue?","options":[{"html":"Use Amazon CloudFront distributions for your photos.","correct":false},{"html":"Block the IP addresses of the offending websites using NACL.","correct":false},{"html":"Move the high-quality photos to Amazon WorkDocs to serve them privately.","correct":false},{"html":"Configure your S3 bucket to remove public read access and use pre-signed URLs with expiry dates.","correct":true}],"multi":1,"analysis":"<p>Dạng bài xử lý hotlinking/chống đánh cắp nội dung (content theft) trên Amazon S3 khi biện pháp dựa trên referrer header không còn hiệu quả vì có thể bị giả mạo, kiểm tra kiến thức về pre-signed URL so với các giải pháp không phù hợp (CloudFront, NACL, WorkDocs).</p>","answer":"<p>Trong Amazon S3, mặc định tất cả object đều ở chế độ private, chỉ chủ sở hữu object mới có quyền truy cập. Tuy nhiên, chủ sở hữu object có thể chia sẻ object với người khác bằng cách tạo pre-signed URL, sử dụng thông tin xác thực (security credentials) của chính mình, để cấp quyền tải xuống trong một khoảng thời gian giới hạn. Khi tạo pre-signed URL cho object, bạn phải cung cấp security credentials, chỉ định tên bucket, object key, phương thức HTTP (GET để tải xuống) và thời gian hết hạn; pre-signed URL chỉ có hiệu lực trong khoảng thời gian được chỉ định đó. Bất kỳ ai nhận được pre-signed URL đều có thể truy cập object đó. Vì vậy, để ngăn các website khác hotlink ảnh của mình, giải pháp hiệu quả nhất là cấu hình bucket S3 gỡ bỏ quyền truy cập công khai (public read access) và sử dụng pre-signed URL có thời hạn để phân phối ảnh cho người dùng hợp lệ.</p>","explain":"<p>- Use Amazon CloudFront distributions for your photos: CloudFront chủ yếu là dịch vụ content delivery network giúp tăng tốc độ phân phối nội dung đến khách hàng, bản thân nó không ngăn được việc các website khác hotlink trực tiếp vào ảnh nếu object vẫn công khai.</p><p>- Block the IP addresses of the offending websites using NACL: việc chặn IP bằng NACL không hiệu quả vì chỉ cần đổi IP address là có thể dễ dàng vượt qua cấu hình này.</p><p>- Move the high-quality photos to Amazon WorkDocs to serve them privately: WorkDocs chỉ là dịch vụ tạo, lưu trữ và cộng tác nội dung (content creation, storage, collaboration) được quản lý toàn phần, không phải dịch vụ phù hợp để lưu trữ nội dung tĩnh; WorkDocs thường được dùng để tạo, chỉnh sửa và chia sẻ tài liệu phục vụ cộng tác, không phải để phân phối dữ liệu object như Amazon S3.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/ShareObjectPreSignedURL.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/dev/ShareObjectPreSignedURL.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/ObjectOperations.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/dev/ObjectOperations.html</a></li></ul>"},{"id":14,"topic":"Design High-Performing Architectures – dạng bài kiểm tra khả năng chọn giải pháp scale read traffic cho cơ sở dữ liệu quan hệ ...","supplement":false,"stem":"An e-commerce company runs a highly scalable web application that depends on an Amazon Aurora database. As the number of users increases, the read replica faces difficulties keeping up with the increasing read traffic, causing performance bottlenecks during peak periods.<br><br>Which of the following will resolve the issue with the most cost-effective solution?","options":[{"html":"Increase the size of the Aurora DB cluster.","correct":false},{"html":"Use automatic scaling for the Aurora read replica using Aurora Auto Scaling.","correct":true},{"html":"Set up a read replica that can operate across different regions.","correct":false},{"html":"Implement read scaling with Aurora Global Database.","correct":false}],"multi":1,"analysis":"<p>Đây là dạng bài kiểm tra khả năng chọn giải pháp scale read traffic cho cơ sở dữ liệu quan hệ (Amazon Aurora) sao cho tối ưu chi phí, thay vì chỉ đơn thuần tăng cấu hình tĩnh.</p>","answer":"<p>Amazon Aurora là dịch vụ cơ sở dữ liệu quan hệ trên cloud, có tính sẵn sàng cao và khả năng mở rộng tốt. Aurora Auto Scaling tự động điều chỉnh capacity của read replica trong Aurora DB cluster dựa trên workload thực tế, nên không cần can thiệp thủ công. Nhờ đó, hệ thống có thể mở rộng động để xử lý lượng read traffic tăng đột biến vào giờ cao điểm, đồng thời chỉ phải trả thêm chi phí cho tài nguyên bổ sung khi thực sự cần, giúp tránh lãng phí do over-provisioning hay under-provisioning. Đây là giải pháp cost-effective nhất để giải quyết tình trạng read replica không theo kịp traffic trong kịch bản này.</p>","explain":"<p>- Increase the size of the Aurora DB cluster: Việc tăng kích thước cluster một cách tĩnh (cố định) sẽ khiến công ty phải trả chi phí liên tục cho capacity lớn hơn, ngay cả khi tài nguyên đó không được sử dụng hết trong giờ thấp điểm, nên không kinh tế.</p><p>- Set up a read replica that can operate across different regions: Giải pháp này tạo read replica ở region khác giúp phân tán tải và tăng tính sẵn sàng theo vùng địa lý, nhưng phát sinh thêm chi phí truyền dữ liệu giữa các region (inter-region data replication), trong khi vấn đề ở đây là hiệu năng read replica trong cùng region hiện tại, không liên quan đến cross-region availability.</p><p>- Implement read scaling with Aurora Global Database: Aurora Global Database được thiết kế chủ yếu cho ứng dụng phân tán toàn cầu, cho phép một database Aurora trải rộng trên nhiều AWS Region. Giải pháp này làm tăng độ phức tạp và chi phí (do hạ tầng và data transfer) nên không phù hợp và không tối ưu chi phí cho vấn đề scale read trong một region.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Integrating.AutoScaling.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Integrating.AutoScaling.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html</a></li></ul>"},{"id":15,"topic":"Design Secure Architectures – dạng bài kết hợp hai yêu cầu bảo mật trên Amazon S3: (1) giới hạn truy cập dữ liệu chỉ ...","supplement":false,"stem":"A government agency plans to store confidential tax documents on AWS. Due to the sensitive information in the files, the Solutions Architect must restrict the data access requests made to the storage solution to a specific Amazon VPC only. The solution should also prevent the files from being deleted or overwritten to meet the regulatory requirement of having a write-once-read-many (WORM) storage model.<br><br>Which combination of the following options should the Architect implement? (Select TWO.)","options":[{"html":"Set up a new Amazon S3 bucket to store the tax documents and integrate it with AWS Network Firewall. Configure the Network Firewall to only accept data access requests from a specific VPC.","correct":false},{"html":"Store the tax documents in the Amazon S3 Glacier Instant Retrieval storage class. Use the PutBucketPolicy API to apply a bucket policy that restricts access requests to a specific VPC.","correct":false},{"html":"Configure an Amazon S3 Access Point for the S3 bucket to restrict data access to a particular VPC only.","correct":true},{"html":"Enable Object Lock but disable Object Versioning on the new Amazon S3 bucket to comply with the write-once-read-many (WORM) storage model requirement.","correct":false},{"html":"Create a new Amazon S3 bucket with the S3 Object Lock feature enabled. Store the documents in the bucket and set the Legal Hold option for object retention.","correct":true}],"multi":2,"analysis":"<p>Đây là dạng bài kết hợp hai yêu cầu bảo mật trên Amazon S3: (1) giới hạn truy cập dữ liệu chỉ từ một VPC cụ thể, và (2) đảm bảo mô hình lưu trữ write-once-read-many (WORM) để tuân thủ quy định.</p>","answer":"<p>Amazon S3 Access Point là endpoint mạng có tên riêng gắn vào bucket, cho phép thực hiện các thao tác như GetObject, PutObject. Mỗi access point có policy và network control riêng, có thể cấu hình để chỉ chấp nhận request đến từ một VPC cụ thể, qua đó giới hạn truy cập dữ liệu S3 vào một mạng riêng (private network). Đây chính là cách đúng để giới hạn data access requests vào một VPC cụ thể.\n\nSong song đó, S3 Object Lock cho phép lưu trữ object theo mô hình WORM (write-once-read-many), ngăn object bị xóa hoặc ghi đè trong một khoảng thời gian cố định hoặc vĩnh viễn, đáp ứng yêu cầu tuân thủ quy định. Trước khi khóa object, phải bật S3 Object Lock cho bucket (có thể bật ngay khi tạo bucket hoặc bật cho bucket đã tồn tại); một khi đã bật thì không thể tắt Object Lock, và Object Versioning (bắt buộc đi kèm Object Lock) cũng không thể tắt. Với yêu cầu bài toán, cần tạo bucket mới bật S3 Object Lock và sử dụng Legal Hold để giữ object retention.\n\nDo đó, đáp án đúng là tạo S3 Access Point giới hạn truy cập theo VPC, kết hợp với bucket bật S3 Object Lock và dùng Legal Hold.</p>","explain":"<p>- Set up a new Amazon S3 bucket... integrate it with AWS Network Firewall: Không thể dùng AWS Network Firewall để trực tiếp giới hạn data access request đến một S3 bucket theo VPC cụ thể; phải dùng Amazon S3 Access Point cho mục đích này. AWS Network Firewall thường được tích hợp với VPC, không phải với S3 bucket.</p><p>- Store the tax documents in the Amazon S3 Glacier Instant Retrieval storage class... PutBucketPolicy: Amazon S3 Glacier Instant Retrieval chỉ là storage class lưu trữ archive chi phí thấp nhất cho dữ liệu ít truy cập, không liên quan đến yêu cầu WORM hay giới hạn VPC ở đây; ngoài ra dùng bucket policy để giới hạn truy cập theo VPC kém hiệu quả hơn so với dùng S3 Access Point.</p><p>- Enable Object Lock but disable Object Versioning: Mặc dù Object Lock cung cấp WORM storage, Object Versioning bắt buộc phải được bật thì Object Lock mới hoạt động; thực tế bạn không thể tắt thủ công Object Versioning một khi đã chọn Object Lock, nên phương án này không khả thi.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-points.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-points.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html</a></li></ul>"},{"id":16,"topic":"Design Resilient Architectures – về chiến lược migration (rehost/replatform/refactor) cho ứng dụng .NET và database Orac...","supplement":false,"stem":"An online learning company hosts its Microsoft .NET e-Learning application on a Windows Server in its on-premises data center. The application uses an Oracle Database Standard Edition as its backend database.<br><br>The company wants a high-performing solution to migrate this workload to the AWS cloud to take advantage of the cloud’s high availability. The migration process should minimize development changes, and the environment should be easier to manage.<br><br>Which of the following options should be implemented to meet the company requirements? (Select TWO.)","options":[{"html":"Refactor the application to .NET Core and run it as a serverless container service using Amazon Elastic Kubernetes Service (Amazon EKS) with AWS Fargate.","correct":false},{"html":"Rehost the on-premises .NET application to an AWS Elastic Beanstalk Multi-AZ environment which runs in multiple Availability Zones.","correct":true},{"html":"Provision and replatform the application to Amazon Elastic Container Service (Amazon ECS) with Amazon EC2 worker nodes. Use the Windows Server Amazon Machine Image (AMI) and deploy the .NET application using to the ECS cluster via the ECS Anywhere service.","correct":false},{"html":"Perform a homogeneous migration by moving the Oracle database to Amazon RDS for Oracle in a Multi-AZ deployment using AWS Database Migration Service (AWS DMS).","correct":true},{"html":"Use AWS Transform MGN to migrate the on-premises Oracle database server to a new Amazon EC2 instance.","correct":false}],"multi":2,"analysis":"<p>Dạng bài về chiến lược migration (rehost/replatform/refactor) cho ứng dụng .NET và database Oracle lên AWS, yêu cầu tối thiểu hóa thay đổi code và dễ quản lý.</p>","answer":"<p>Đối với database, dùng AWS Database Migration Service (AWS DMS) để thực hiện homogeneous migration (di chuyển cùng loại engine) từ Oracle on-premises sang Amazon RDS for Oracle ở chế độ Multi-AZ. AWS DMS hỗ trợ migrate relational database vào AWS Cloud, có thể thực hiện one-time migration và đồng bộ liên tục thay đổi (ongoing replication).\n\nĐối với ứng dụng .NET, AWS Elastic Beanstalk giúp giảm độ phức tạp quản lý mà không giới hạn khả năng kiểm soát: chỉ cần upload ứng dụng, Elastic Beanstalk tự động xử lý việc cấp phát capacity, load balancing, scaling, và application health monitoring. Elastic Beanstalk hỗ trợ .NET và đặc biệt phù hợp cho ứng dụng ASP.NET chạy trên IIS. Rehost ứng dụng .NET on-premises lên môi trường Elastic Beanstalk Multi-AZ (chạy nhiều Availability Zone) cho phép tận dụng tính sẵn sàng cao của cloud mà không cần thay đổi code.\n\nDo đó, đáp án đúng là kết hợp AWS DMS (migrate Oracle sang RDS for Oracle Multi-AZ) và rehost ứng dụng .NET lên Elastic Beanstalk Multi-AZ.</p>","explain":"<p>- Refactor the application to .NET Core... Amazon EKS with AWS Fargate: Phương án này đòi hỏi thay đổi code đáng kể (refactor) để chuyển ứng dụng thành serverless container application, trong khi đề bài yêu cầu tối thiểu hóa development changes. Rehost lên Elastic Beanstalk Multi-AZ là lựa chọn phù hợp hơn vì không cần thay đổi code.</p><p>- Provision and replatform the application to Amazon ECS with EC2 worker nodes... ECS Anywhere: Phương án này khả thi về mặt kỹ thuật nhưng không được khuyến nghị vì công ty vẫn phải tự quản lý các EC2 instance bên dưới ECS cluster; dùng Elastic Beanstalk sẽ tốt hơn vì nó tự lo việc cấp phát tài nguyên. Ngoài ra, kiểu migration replatform này vẫn đòi hỏi development changes đáng kể, không phù hợp với yêu cầu đề bài.</p><p>- Use AWS Transform MGN to migrate the on-premises Oracle database server to a new Amazon EC2 instance: Amazon RDS vốn đã hỗ trợ trực tiếp database Oracle chuẩn, nên nên dùng AWS DMS để migrate database thay vì dùng AWS Transform MGN để chuyển nguyên database server sang EC2 instance.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html</a></li><li><a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/create_deploy_NET.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/create_deploy_NET.html</a></li><li><a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/Welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/Welcome.html</a></li></ul>"},{"id":17,"topic":"Design Secure Architectures – chọn dịch vụ AWS phù hợp để phát hiện/phân loại dữ liệu nhạy cảm (PII) và cảnh báo vi p...","supplement":false,"stem":"A government entity is conducting a population and housing census in the city. Each household’s information uploaded to its online portal is stored in encrypted files in Amazon S3. The government assigned its Solutions Architect to set compliance policies that verify data containing personally identifiable information (PII) in a manner that meets its compliance standards. It should also be alerted if there are potential policy violations with the privacy of its S3 buckets, beyond the object listing that S3 Inventory provides.<br><br>Which of the following should the Architect implement to satisfy this requirement?","options":[{"html":"Set up and configure Amazon Kendra to monitor malicious activity on their S3 data","correct":false},{"html":"Set up and configure Amazon Fraud Detector to send out alert notifications whenever a security violation is detected on their S3 data.","correct":false},{"html":"Set up and configure Amazon Macie to monitor their S3 data.","correct":true},{"html":"Set up and configure Amazon Polly to scan for usage patterns on S3 data","correct":false}],"multi":1,"analysis":"<p>Dạng bài chọn dịch vụ AWS phù hợp để phát hiện/phân loại dữ liệu nhạy cảm (PII) và cảnh báo vi phạm chính sách bảo mật trên Amazon S3.</p>","answer":"<p>Amazon Macie là dịch vụ bảo mật dùng machine learning (ML-powered) giúp tự động phát hiện (discover), phân loại (classify) và bảo vệ dữ liệu nhạy cảm lưu trên Amazon S3, bao gồm personally identifiable information (PII). Macie sinh ra hai loại finding: policy finding (báo cáo chi tiết về khả năng vi phạm chính sách hoặc vấn đề bảo mật/quyền riêng tư của một S3 bucket, được tạo ra trong quá trình Macie liên tục giám sát dữ liệu S3) và sensitive data finding (báo cáo về dữ liệu nhạy cảm phát hiện được trong object S3 khi chạy sensitive data discovery job). Vì vậy, Amazon Macie đáp ứng cả hai yêu cầu: xác minh dữ liệu PII tuân thủ quy định và cảnh báo khi có khả năng vi phạm chính sách bảo mật/quyền riêng tư của S3 bucket, vượt ra ngoài phạm vi chỉ liệt kê object mà S3 Inventory cung cấp.</p>","explain":"<p>- Set up and configure Amazon Polly to scan for usage patterns on S3 data: Amazon Polly chỉ là dịch vụ chuyển văn bản thành giọng nói (text-to-speech), không có khả năng quét usage pattern hay giám sát dữ liệu S3.</p><p>- Set up and configure Amazon Kendra to monitor malicious activity on their S3 data: Amazon Kendra chỉ là dịch vụ tìm kiếm doanh nghiệp (enterprise search), giúp thêm khả năng tìm kiếm nội dung cho ứng dụng, không dùng để giám sát hoạt động độc hại trên S3 bucket.</p><p>- Set up and configure Amazon Fraud Detector to send out alert notifications whenever a security violation is detected: Amazon Fraud Detector là dịch vụ quản lý dùng để phát hiện các hoạt động gian lận (fraud), không kiểm tra dữ liệu S3 chứa PII như Amazon Macie.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/macie/latest/userguide/what-is-macie.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/macie/latest/userguide/what-is-macie.html</a></li><li><a href=\"https://aws.amazon.com/macie/faq/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/macie/faq/</a></li><li><a href=\"https://docs.aws.amazon.com/macie/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/macie/index.html</a></li></ul>"},{"id":18,"topic":"Design Resilient Architectures – về kiến trúc message fanout pattern - gửi một sự kiện S3 đến nhiều subscriber (nhiều te...","supplement":false,"stem":"A company is using Amazon S3 to store frequently accessed data. When an object is created or deleted, the S3 bucket will send an event notification to the Amazon SQS queue. A solutions architect needs to create a solution that will notify the development and operations team about the created or deleted objects.<br><br>Which of the following would satisfy this requirement?","options":[{"html":"Set up another SQS queue for the other team. Grant S3 permission to send a notification to the second SQS queue.","correct":false},{"html":"Create an Amazon SNS topic and configure two SQS queues to subscribe to the topic. Grant S3 permission to send notifications to SNS and update the bucket to use the new SNS topic.","correct":true},{"html":"Create a new Amazon SNS FIFO topic for the other team. Grant S3 permission to send the notification to the second SNS topic.","correct":false},{"html":"Set up an Amazon SNS topic and configure two SQS queues to poll the SNS topic. Grant S3 permission to send notifications to SNS and update the bucket to use the new SNS topic.","correct":false}],"multi":1,"analysis":"<p>Dạng bài về kiến trúc message fanout pattern - gửi một sự kiện S3 đến nhiều subscriber (nhiều team/queue) bằng Amazon SNS và Amazon SQS.</p>","answer":"<p>Amazon S3 event notification chỉ có thể publish đến một destination duy nhất (Amazon SNS topic, Amazon SQS queue, hoặc AWS Lambda) cho mỗi cấu hình, và được delivery theo kiểu &quot;at least once, to one destination only&quot; - không thể gắn trực tiếp hai hoặc nhiều SNS topic/SQS queue cho cùng một S3 event notification. Để gửi notification đến nhiều subscriber (ví dụ cả team development và operations), cần áp dụng message fanout pattern: tạo một Amazon SNS topic, sau đó cấu hình hai Amazon SQS queue subscribe vào topic đó. Khi SNS nhận được event, nó sẽ publish message đồng thời đến cả hai subscriber. Vì vậy, phải cấu hình S3 gửi notification đến SNS (thay vì trực tiếp đến SQS như hiện tại), rồi để hai SQS queue subscribe vào SNS topic đó.</p>","explain":"<p>- Set up another SQS queue for the other team. Grant S3 permission to send a notification to the second SQS queue: S3 event notification chỉ cho phép cấu hình 1 SQS hoặc SNS tại một thời điểm cho mỗi loại event; không thể gắn thêm một SQS queue thứ hai trực tiếp. Muốn gửi đến nhiều subscriber phải dùng message fanout pattern với SNS và SQS.</p><p>- Create a new Amazon SNS FIFO topic for the other team. Grant S3 permission to send the notification to the second SNS topic: Tương tự, S3 chỉ cho phép 1 SQS hoặc SNS tại một thời điểm. Ngoài ra, cả SNS FIFO topic lẫn SQS FIFO queue đều không cần thiết trong kịch bản này, vì các dịch vụ FIFO được dùng để đảm bảo thứ tự message nghiêm ngặt và loại bỏ message trùng lặp (deduplication), không phải là yêu cầu ở đây.</p><p>- Set up an Amazon SNS topic and configure two SQS queues to poll the SNS topic: Không thể &quot;poll&quot; (kéo dữ liệu) từ Amazon SNS; thay vào đó mỗi SQS queue phải subscribe vào SNS topic để nhận message, không phải chủ động poll topic.</p>","wrong":"","tip"
