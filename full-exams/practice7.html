:"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/ways-to-add-notification-config-to-bucket.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/dev/ways-to-add-notification-config-to-bucket.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/NotificationHowTo.html#notification-how-to-overview\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/dev/NotificationHowTo.html#notification-how-to-overview</a></li><li><a href=\"https://docs.aws.amazon.com/sns/latest/dg/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/sns/latest/dg/welcome.html</a></li></ul>"},{"id":19,"topic":"Design Secure Architectures – thiết kế network cho phép outbound-only IPv6 traffic (chặn inbound initiation từ Intern...","supplement":false,"stem":"A payment processing company plans to migrate its on-premises application to an Amazon EC2 instance. An IPv6 CIDR block is attached to the company’s Amazon VPC. Strict security policy mandates that the production VPC must only allow outbound communication over IPv6 between the instance and the internet but should prevent the internet from initiating an inbound IPv6 connection. The new architecture should also allow traffic flow inspection and traffic filtering.<br><br>What should a solutions architect do to meet these requirements?","options":[{"html":"Launch the EC2 instance to a private subnet and attach AWS PrivateLink interface endpoint to the VPC to control outbound IPv6 communication to the internet. Use Amazon GuardDuty to set up the required rules for traffic inspection and traffic filtering.","correct":false},{"html":"Launch the EC2 instance to a public subnet and attach an Internet Gateway to the VPC to allow outbound IPv6 communication to the internet. Use Traffic Mirroring to set up the required rules for traffic inspection and traffic filtering.","correct":false},{"html":"Launch the EC2 instance to a private subnet and attach an Egress-Only Internet Gateway to the VPC to allow outbound IPv6 communication to the internet. Use AWS Network Firewall to set up the required rules for traffic inspection and traffic filtering.","correct":true},{"html":"Launch the EC2 instance to a private subnet and attach a NAT Gateway to the VPC to allow outbound IPv6 communication to the internet. Use AWS Firewall Manager to set up the required rules for traffic inspection and traffic filtering.","correct":false}],"multi":1,"analysis":"<p>Dạng bài thiết kế network cho phép outbound-only IPv6 traffic (chặn inbound initiation từ Internet) kết hợp với khả năng traffic inspection/filtering trong VPC.</p>","answer":"<p>Egress-only internet gateway (EIGW) là thành phần VPC có khả năng mở rộng theo chiều ngang, dự phòng (redundant) và sẵn sàng cao, cho phép outbound communication qua IPv6 từ instance trong VPC ra Internet, đồng thời ngăn Internet chủ động khởi tạo (initiate) kết nối IPv6 đến instance đó. Vì địa chỉ IPv6 là globally unique và mặc định public, nếu muốn instance truy cập Internet nhưng ngăn tài nguyên trên Internet chủ động kết nối ngược lại, cần dùng egress-only internet gateway. Instance nên được đặt trong private subnet.\n\nĐể đáp ứng yêu cầu traffic flow inspection và traffic filtering, dùng AWS Network Firewall - dịch vụ quản lý giúp triển khai các biện pháp bảo vệ mạng cho VPC, tự động scale theo traffic. AWS Network Firewall có stateful firewall (theo dõi connection, nhận diện protocol để enforce policy), intrusion prevention system (IPS) để phát hiện/chặn khai thác lỗ hổng bằng signature-based detection, và web filtering để chặn traffic đến các URL xấu đã biết.\n\nVì vậy, đáp án đúng là triển khai EC2 instance trong private subnet, gắn Egress-Only Internet Gateway để cho phép outbound IPv6, và dùng AWS Network Firewall để traffic inspection/filtering.</p>","explain":"<p>- Launch the EC2 instance to a private subnet and attach AWS PrivateLink interface endpoint... Use Amazon GuardDuty: AWS PrivateLink (VPC Endpoint) chỉ giúp kết nối riêng tư từ VPC đến AWS service như thể chúng nằm trong VPC, không có khả năng kiểm soát outbound IPv6 communication ra Internet. Amazon GuardDuty cũng không có tính năng traffic inspection hay traffic filtering.</p><p>- Launch the EC2 instance to a public subnet and attach an Internet Gateway... Use Traffic Mirroring: Internet Gateway không giới hạn hay kiểm soát kết nối outbound IPv6, và quan trọng hơn, nó cho phép mọi loại traffic (kể cả inbound) khởi tạo kết nối đến EC2 instance - vi phạm yêu cầu ngăn Internet chủ động kết nối inbound. Traffic Mirroring chỉ là tính năng VPC để sao chép network traffic từ network interface, không dùng để filter hay inspect traffic.</p><p>- Launch the EC2 instance to a private subnet and attach a NAT Gateway... Use AWS Firewall Manager: Mặc dù NAT Gateway có tính năng NAT64 để dịch địa chỉ IPv6 sang IPv4, nó không ngăn được inbound IPv6 traffic đến EC2 instance; phải dùng egress-only internet gateway cho mục đích đó. Ngoài ra, AWS Firewall Manager không có khả năng traffic inspection hay traffic filtering.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/egress-only-internet-gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/vpc/latest/userguide/egress-only-internet-gateway.html</a></li><li><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html</a></li><li><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html</a></li></ul>"},{"id":20,"topic":"Design Secure Architectures – phân biệt các cơ chế bảo vệ private content trên Amazon CloudFront (Signed URL vs Signe...","supplement":false,"stem":"A company has a web application that uses Amazon CloudFront to distribute its images, videos, and other static content stored in its Amazon S3 bucket to users around the world. The company has recently introduced a new member-only access feature for some of its high-quality media files. There is a requirement to provide access to multiple private media files only to paying subscribers without having to change the current URLs.<br><br>Which of the following is the most suitable solution to implement to satisfy this requirement?","options":[{"html":"Use Signed Cookies to control who can access the private files in your CloudFront distribution by modifying your application to determine whether a user should have access to your content. For members, send the required Set-Cookie headers to the viewer which will unlock the content only to them.","correct":true},{"html":"Create a Signed URL with a custom policy which only allows the members to see the private files.","correct":false},{"html":"Configure your CloudFront distribution to use Match Viewer as its Origin Protocol Policy which will automatically match the user request. This will allow access to the private content if the request is a paying member and deny it if it is not a member.","correct":false},{"html":"Configure your CloudFront distribution to use Field-Level Encryption to protect your private data and only allow access to members.","correct":false}],"multi":1,"analysis":"<p>Dạng bài phân biệt các cơ chế bảo vệ private content trên Amazon CloudFront (Signed URL vs Signed Cookies vs Field-Level Encryption).</p>","answer":"<p>Để phục vụ private content an toàn qua CloudFront, có thể yêu cầu người dùng truy cập bằng CloudFront signed URL hoặc signed cookies. Cả hai đều cho phép kiểm soát ai được truy cập nội dung. Khi cần cung cấp quyền truy cập cho nhiều file bị giới hạn (ví dụ nhiều file HLS của một video, hoặc toàn bộ nội dung trong khu vực subscriber của website) và không muốn thay đổi URL hiện tại, nên dùng signed cookies thay vì signed URL. Với kịch bản này, ứng dụng sẽ xác định user có nên được truy cập nội dung hay không, rồi gửi header Set-Cookie tương ứng để unlock nội dung chỉ cho thành viên trả phí (paying subscribers) mà không cần thay đổi URL hiện tại.</p>","explain":"<p>- Create a Signed URL with a custom policy which only allows the members to see the private files: Signed URL chủ yếu dùng để cấp quyền truy cập từng file riêng lẻ, trong khi đề bài yêu cầu không được thay đổi URL hiện tại và cần truy cập nhiều file - đây là trường hợp phù hợp hơn với Signed Cookies.</p><p>- Configure your CloudFront distribution to use Match Viewer as its Origin Protocol Policy: Match Viewer chỉ là Origin Protocol Policy cấu hình CloudFront giao tiếp với origin bằng HTTP hoặc HTTPS tùy theo protocol của viewer request; nó không liên quan gì đến việc kiểm soát quyền truy cập theo thành viên trả phí.</p><p>- Configure your CloudFront distribution to use Field-Level Encryption: Field-Level Encryption chỉ giúp mã hóa an toàn các thông tin nhạy cảm do người dùng gửi lên (upload) đến web server, không cung cấp cơ chế cấp quyền tải xuống (download) nhiều private file.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-choosing-signed-urls-cookies.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-choosing-signed-urls-cookies.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-cookies.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-cookies.html</a></li></ul>"},{"id":21,"topic":"Design Resilient Architectures – thiết kế kiến trúc event-driven dựa trên thay đổi dữ liệu trong DynamoDB (change data c...","supplement":false,"stem":"A popular social network is hosted in AWS and is using a Amazon DynamoDB table as its database. There is a requirement to implement a ‘follow’ feature where users can subscribe to certain updates made by a particular user and be notified via email.<br><br>Which of the following is the most suitable solution to implement to meet the requirement?","options":[{"html":"Create an AWS Lambda function that uses DynamoDB Streams Amazon Kinesis Adapter which will fetch data from the DynamoDB Streams endpoint. Set up an Amazon SNS Topic that will notify the subscribers via email when there is an update made by a particular user.","correct":false},{"html":"Using the Amazon Kinesis Client Library (KCL), write an application that leverages on DynamoDB Streams Kinesis Adapter that will fetch data from the DynamoDB Streams endpoint. When there are updates made by a particular user, notify the subscribers via email using Amazon SNS.","correct":false},{"html":"Enable DynamoDB Stream and create an AWS Lambda trigger, as well as the IAM role which contains all of the permissions that the Lambda function will need at runtime. The data from the stream record will be processed by the Lambda function which will then publish a message to Amazon SNS Topic that will notify the subscribers via email.","correct":true},{"html":"Set up a DAX cluster to access the source DynamoDB table. Create a new DynamoDB trigger and an AWS Lambda function. For every update made in the user data, the trigger will send data to the Lambda function which will then notify the subscribers via email using Amazon SNS.","correct":false}],"multi":1,"analysis":"<p>Dạng bài thiết kế kiến trúc event-driven dựa trên thay đổi dữ liệu trong DynamoDB (change data capture) để kích hoạt notification.</p>","answer":"<p>DynamoDB Streams là luồng thông tin có thứ tự về các thay đổi (modification) đối với item trong bảng DynamoDB; khi bật stream trên bảng, DynamoDB sẽ ghi lại mọi thay đổi dữ liệu. Amazon DynamoDB tích hợp với AWS Lambda, cho phép tạo trigger - đoạn code tự động phản hồi khi có sự kiện trong DynamoDB Streams. Sau khi bật DynamoDB Streams, bạn gắn stream ARN với một Lambda function và tạo IAM role chứa đầy đủ permission mà Lambda cần khi chạy; ngay khi item trong bảng bị thay đổi, một record mới xuất hiện trong stream, AWS Lambda polls stream và tự động gọi (invoke) Lambda function để xử lý - ví dụ publish message đến Amazon SNS Topic để thông báo cho subscriber qua email khi có cập nhật từ một user cụ thể.</p>","explain":"<p>- Using the Amazon Kinesis Client Library (KCL), write an application that leverages on DynamoDB Streams Kinesis Adapter...: Đây là một giải pháp hợp lệ về mặt kỹ thuật nhưng thiếu bước quan trọng là phải bật (enable) DynamoDB Streams trước. Chỉ khi có DynamoDB Streams Kinesis Adapter, ứng dụng dùng KCL mới có thể gọi API đến đúng endpoint của DynamoDB Streams; nhớ rằng tính năng DynamoDB Stream không được bật mặc định.</p><p>- Create an AWS Lambda function that uses DynamoDB Streams Amazon Kinesis Adapter...: Tương tự phương án trên, phải bật thủ công DynamoDB Streams trước khi có thể dùng endpoint của nó.</p><p>- Set up a DAX cluster to access the source DynamoDB table...: Amazon DynamoDB Accelerator (DAX) chủ yếu dùng để cải thiện đáng kể hiệu năng đọc (read performance) trong bộ nhớ (in-memory) của database, không phải để capture chuỗi thay đổi dữ liệu theo thứ tự thời gian (time-ordered item-level modifications); cần dùng DynamoDB Streams cho mục đích này.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html</a></li><li><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.Lambda.Tutorial.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.Lambda.Tutorial.html</a></li></ul>"},{"id":22,"topic":"Design Resilient Architectures – tối ưu hiệu năng và độ sẵn sàng cho CloudFront distribution toàn cầu, xử lý vấn đề auth...","supplement":false,"stem":"A popular social media website uses a Amazon CloudFront web distribution to serve static content to millions of users around the globe. Recently, the website has received a number of complaints about long login times. Additionally, there are instances where users encounter HTTP 504 errors. The manager has instructed the team to significantly reduce login time and further optimize the system.<br><br>Which of the following options should be used together to set up a cost-effective solution that improves the application’s performance? (Select TWO.)","options":[{"html":"Establish multiple Amazon VPCs in different AWS regions and configure a transit VPC to interconnect all of your resources. To handle the requests faster, set up AWS Lambda functions in each region with the AWS Serverless Application Model (SAM) service.","correct":false},{"html":"Configure your origin to add a Cache-Control max-age directive to your objects, and specify the longest practical value for max-age to increase the cache hit ratio of your CloudFront distribution.","correct":false},{"html":"Deploy your application to multiple AWS regions to accommodate your users around the world. Set up a Route 53 record with latency routing policy to route incoming traffic to the region that provides the best latency to the user.","correct":false},{"html":"Implement an origin failover by creating an origin group that includes two origins. Assign one as the primary origin and the other as secondary, which enables CloudFront to automatically switch to if the primary origin encounters specific HTTP status code failure responses.","correct":true},{"html":"Customize the content that the CloudFront web distribution delivers to your users using Lambda@Edge, which allows your AWS Lambda functions to execute the authentication process in AWS locations closer to the users.","correct":true}],"multi":2,"analysis":"<p>Dạng bài tối ưu hiệu năng và độ sẵn sàng cho CloudFront distribution toàn cầu, xử lý vấn đề authentication chậm và lỗi HTTP 504 một cách tiết kiệm chi phí.</p>","answer":"<p>Lambda@Edge cho phép chạy Lambda function để tùy biến nội dung mà CloudFront phân phối, thực thi function tại các AWS location gần viewer hơn (tại edge), giúp giảm thời gian xử lý authentication cho người dùng toàn cầu mà không cần tự quản lý server. Đồng thời, để giảm lỗi HTTP 504 (thường do origin gặp sự cố), có thể thiết lập origin failover bằng cách tạo origin group gồm hai origin: một origin chính (primary) và một origin phụ (secondary) mà CloudFront sẽ tự động chuyển sang khi origin chính gặp các mã lỗi HTTP cụ thể. Kết hợp Lambda@Edge (giảm thời gian login) và origin failover (giảm lỗi 504) là giải pháp cải thiện hiệu năng với chi phí hợp lý.</p>","explain":"<p>- Establish multiple Amazon VPCs in different AWS regions and configure a transit VPC...: Việc thiết lập nhiều VPC ở nhiều region kết nối qua transit VPC tuy khả thi về kỹ thuật nhưng kéo theo chi phí setup và duy trì cao hơn đáng kể; dùng Lambda@Edge là lựa chọn tiết kiệm chi phí hơn.</p><p>- Configure your origin to add a Cache-Control max-age directive... increase the cache hit ratio: Tăng cache hit ratio của CloudFront distribution không liên quan đến vấn đề chính trong kịch bản này, vốn là authentication chậm đối với người dùng toàn cầu, chứ không phải caching static object.</p><p>- Deploy your application to multiple AWS regions... Route 53 record with latency routing policy: Giải pháp này tuy có thể giải quyết vấn đề hiệu năng nhưng kéo theo chi phí triển khai đáng kể do phải deploy ứng dụng ra nhiều AWS region, trong khi đề bài yêu cầu một giải pháp cải thiện hiệu năng với chi phí tối thiểu.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/high_availability_origin_failover.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/high_availability_origin_failover.html</a></li><li><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/lambda-edge.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/lambda/latest/dg/lambda-edge.html</a></li></ul>"},{"id":23,"topic":"Design Resilient Architectures – kiểm tra kiến thức về default termination policy của Auto Scaling group khi scale-in, x...","supplement":false,"stem":"A suite of web applications is hosted in an Auto Scaling group of Amazon EC2 instances across three Availability Zones and is configured with default settings. There is an Application Load Balancer that forwards the request to the respective target group on the URL path. The scale-in policy has been triggered due to the low number of incoming traffic to the application.<br><br>Which EC2 instance will be the first one to be terminated by the Auto Scaling group?","options":[{"html":"The instance will be randomly selected by the Auto Scaling group","correct":false},{"html":"The EC2 instance which has been running for the longest time","correct":false},{"html":"The EC2 instance launched from the oldest launch template.","correct":true},{"html":"The EC2 instance which has the least number of user sessions","correct":false}],"multi":1,"analysis":"<p>Dạng bài kiểm tra kiến thức về default termination policy của Auto Scaling group khi scale-in, xác định instance nào bị terminate trước.</p>","answer":"<p>Theo default termination policy, Auto Scaling group thực hiện theo thứ tự: (1) nếu instance nằm ở nhiều Availability Zone, chọn AZ có nhiều instance nhất và có ít nhất một instance không được bảo vệ khỏi scale-in; nếu có nhiều AZ bằng số lượng instance, chọn AZ có instance dùng launch template cũ nhất; (2) xác định instance không được bảo vệ nào trong AZ đã chọn dùng launch template cũ nhất - nếu chỉ có một instance như vậy thì terminate nó; (3) nếu có nhiều instance thỏa điều kiện trên, chọn instance gần đến giờ billing tiếp theo nhất để terminate (tối ưu chi phí sử dụng EC2); (4) nếu vẫn có nhiều instance như vậy, chọn ngẫu nhiên một trong số đó. Theo quy tắc này, instance được launch từ launch template cũ nhất sẽ là instance đầu tiên bị terminate (trước khi xét đến các tiêu chí khác như billing hour).</p>","explain":"<p>- The EC2 instance which has the least number of user sessions: Số lượng user session không phải là yếu tố mà Amazon EC2 Auto Scaling group xem xét khi quyết định instance nào bị terminate trong một sự kiện scale-in.</p><p>- The EC2 instance which has been running for the longest time: Thời gian instance đã chạy (running duration) không phải là yếu tố chính mà Auto Scaling group xem xét khi chọn instance để terminate trong scale-in.</p><p>- The instance will be randomly selected by the Auto Scaling group: Auto Scaling group không chọn ngẫu nhiên instance để terminate ngay từ đầu; việc chọn ngẫu nhiên chỉ xảy ra ở bước cuối cùng khi có nhiều instance thỏa mãn tất cả các tiêu chí trước đó (ví dụ cùng gần giờ billing tiếp theo).</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-instance-termination.html#default-termination-policy\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-instance-termination.html#default-termination-policy</a></li><li><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-instance-termination.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-instance-termination.html</a></li></ul>"},{"id":24,"topic":"Design Secure Architectures – phân biệt giữa hai retention mode của S3 Object Lock (governance vs compliance) và giữa...","supplement":false,"stem":"A medical records company is planning to store sensitive clinical trial data in an Amazon S3 repository with the object-level versioning feature enabled. The Solutions Architect is tasked with ensuring that no object can be overwritten or deleted by any user for a period of one year only. To meet the strict compliance requirements, the root user of the company’s AWS account must also be restricted from making any changes to an object in the S3 bucket. Backup Vault Lock offers similar immutability, but the company requires object-level protection in S3.<br><br>Which of the following is the most secure way of storing the data in S3?","options":[{"html":"Enable S3 Object Lock in compliance mode with a legal hold of one year.","correct":false},{"html":"Enable S3 Object Lock in compliance mode with a retention period of one year.","correct":true},{"html":"Enable S3 Object Lock in governance mode with a legal hold of one year.","correct":false},{"html":"Enable S3 Object Lock in governance mode with a retention period of one year.","correct":false}],"multi":1,"analysis":"<p>Dạng bài phân biệt giữa hai retention mode của S3 Object Lock (governance vs compliance) và giữa retention period với legal hold, để chọn cấu hình WORM chặt nhất kể cả với root user.</p>","answer":"<p>S3 Object Lock cho phép lưu object theo mô hình WORM, ngăn object bị xóa/ghi đè trong một khoảng thời gian cố định hoặc vĩnh viễn. Phải bật Object Lock khi tạo bucket; một khi đã bật thì không thể tắt Object Lock hay suspend versioning. Object Lock có hai retention mode: governance mode và compliance mode. Trong compliance mode, một object version đã được bảo vệ không thể bị ghi đè hay xóa bởi bất kỳ user nào, kể cả root user của tài khoản AWS; retention mode cũng không thể bị thay đổi và retention period không thể bị rút ngắn. Compliance mode đảm bảo object version không thể bị ghi đè/xóa trong suốt thời gian retention period. Vì yêu cầu đề bài là hạn chế ngay cả root user, và cần khóa trong một khoảng thời gian cố định (một năm) chứ không phải vô thời hạn như legal hold, nên đáp án đúng là Object Lock ở compliance mode với retention period một năm.</p>","explain":"<p>- Enable S3 Object Lock in governance mode with a retention period of one year: Trong governance mode, user thông thường không thể ghi đè/xóa object hoặc thay đổi lock setting trừ khi có permission đặc biệt, nhưng user có quyền truy cập root AWS account vẫn có thể thực hiện các thay đổi đó; cần dùng compliance mode để hạn chế cả root user.</p><p>- Enable S3 Object Lock in governance mode with a legal hold of one year: Không thể đặt một khoảng thời gian cụ thể (ví dụ một năm) cho legal hold - chỉ có &quot;retention period&quot; mới cho phép đặt thời hạn; legal hold sẽ tiếp tục hạn chế user thay đổi object ngay cả sau khi retention period một năm đã hết. Ngoài ra, governance mode vẫn cho phép root user chỉnh sửa object và ghi đè các cấu hình hiện có.</p><p>- Enable S3 Object Lock in compliance mode with a legal hold of one year: Dù việc chọn compliance mode là đúng hướng, vẫn không thể đặt thời hạn một năm cho legal hold, vì legal hold hoạt động độc lập với retention period và không có khái niệm &quot;thời hạn&quot; đi kèm.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-overview.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-overview.html</a></li></ul>"},{"id":25,"topic":"Design Resilient Architectures – chọn giải pháp disaster recovery đa vùng (multi-region) cho relational database đáp ứng...","supplement":false,"stem":"A Solutions Architect is designing a highly available relational database solution to mitigate the risk of a multi-region failure. The database must meet a Recovery Point Objective (RPO) of 1 second and a Recovery Time Objective (RTO) of less than 1 minute. The architect needs a disaster recovery plan that enables automatic cross-region replication with minimal data loss and rapid recovery in the event of a failure, which is a requirement beyond the regional high availability provided by Amazon RDS Multi-AZ.<br><br>Which AWS solution best fulfills this requirement?","options":[{"html":"RDS for PostgreSQL with cross-region read replicas","correct":false},{"html":"Amazon Aurora Global Database","correct":true},{"html":"Amazon DynamoDB Global table","correct":false},{"html":"Amazon Timestream for Analytics","correct":false}],"multi":1,"analysis":"<p>Dạng bài chọn giải pháp disaster recovery đa vùng (multi-region) cho relational database đáp ứng RPO/RTO cụ thể, vượt ngoài khả năng Multi-AZ của Amazon RDS.</p>","answer":"<p>Amazon Aurora Global Database được thiết kế cho ứng dụng phân tán toàn cầu, cho phép một database Aurora trải rộng trên nhiều AWS Region. Nó nhân bản (replicate) dữ liệu mà không ảnh hưởng đến hiệu năng database, cho phép đọc dữ liệu cục bộ (local read) với độ trễ thấp ở mỗi region, và cung cấp khả năng disaster recovery khi xảy ra sự cố ở toàn bộ một region. Aurora Global Database hỗ trợ storage-based replication với độ trễ dưới 1 giây; khi có sự cố ngoài kế hoạch, một trong các secondary region được chỉ định có thể được promote lên read/write trong vòng chưa đầy 1 phút (tính năng Cross-Region Disaster Recovery). Vì vậy, Aurora Global Database đáp ứng chính xác yêu cầu RPO 1 giây và RTO dưới 1 phút.</p>","explain":"<p>- RDS for PostgreSQL with cross-region read replicas: Giải pháp này có thể hỗ trợ disaster recovery nhưng không đáp ứng được yêu cầu RPO/RTO trong kịch bản, vì replication lag của cross-region read replica có thể mất vài phút, không thể đạt RPO 1 giây.</p><p>- Amazon DynamoDB Global table: Tuy hỗ trợ bảng được nhân bản đầy đủ (fully replicated) đa vùng với độ trễ thấp, DynamoDB Global table phù hợp hơn cho workload NoSQL, không phải cho relational database như yêu cầu đề bài.</p><p>- Amazon Timestream for Analytics: Đây chủ yếu là dịch vụ time series database serverless, thường dùng cho ứng dụng IoT và vận hành (operational), không phải giải pháp relational database disaster recovery phù hợp cho kịch bản này.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/rds/aurora/global-database/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/rds/aurora/global-database/</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html</a></li></ul>"},{"id":26,"topic":"Design Resilient Architectures – chọn chiến lược triển khai (deployment strategy) cho API Gateway nhằm giảm gián đoạn ch...","supplement":false,"stem":"An e-commerce company utilizes a regional Amazon API Gateway to host its public REST APIs. The API Gateway endpoint is accessed through a custom domain name set up with an Amazon Route 53 alias record. To support continuous improvement, the company intends to launch a new version of its APIs with enhanced features and performance optimizations.<br><br>How can the company reduce customer disruption and ensure MINIMAL data loss during the update process in the MOST cost-effective way?","options":[{"html":"Implement a blue-green deployment strategy for the API Gateway, deploying the latest version of the APIs to the green environment. Route some user traffic to it, validate the new APIs, and once thoroughly validated, promote the green environment to production.","correct":false},{"html":"Modify the existing API Gateway with the updated version of the APIs, but keep the same custom domain name for the new API Gateway by using the import-to-update operation in either overwrite or merge mode.","correct":false},{"html":"Create a new API Gateway with the updated version of the APIs in OpenAPI JSON or YAML file format, but keep the same custom domain name for the new API Gateway.","correct":false},{"html":"Implement a canary release deployment strategy for the API Gateway. Deploy the latest version of the APIs to a canary stage and direct a portion of the user traffic to this stage. Verify the new APIs. Gradually increase the traffic percentage, monitor for any issues, and, if successful, promote the canary stage to production.","correct":true}],"multi":1,"analysis":"<p>Dạng bài chọn chiến lược triển khai (deployment strategy) cho API Gateway nhằm giảm gián đoạn cho khách hàng và giảm thiểu mất dữ liệu khi ra mắt phiên bản API mới, với chi phí tối ưu.</p>","answer":"<p>Amazon API Gateway là dịch vụ được quản lý hoàn toàn (fully managed), đóng vai trò cổng vào (front door) cho API. Canary release deployment strategy cho phép release phiên bản API mới đến một canary stage và chỉ dẫn một phần traffic người dùng đến stage này để kiểm thử trong môi trường có kiểm soát; nếu phiên bản mới hoạt động tốt, có thể tăng dần tỷ lệ traffic, theo dõi vấn đề phát sinh, và cuối cùng promote canary stage thành production. Cách tiếp cận này giúp phát hiện sự cố trước khi ảnh hưởng đến toàn bộ người dùng, giảm thiểu gián đoạn và mất dữ liệu, đồng thời không yêu cầu duy trì song song hai môi trường đầy đủ như blue-green, nên tiết kiệm chi phí hơn.</p>","explain":"<p>- Create a new API Gateway with the updated version of the APIs in OpenAPI JSON or YAML file format, but keep the same custom domain name: Việc nâng cấp lên một API Gateway mới trong khi vẫn giữ nguyên custom domain name thường dẫn đến downtime và sự nhầm lẫn trong lúc chuyển đổi, do độ trễ lan truyền DNS (DNS propagation delay), có thể ảnh hưởng tiêu cực đến người dùng và thậm chí gây mất dữ liệu.</p><p>- Modify the existing API Gateway with the updated version of the APIs... import-to-update operation in either overwrite or merge mode: Sử dụng thao tác import-to-update ở chế độ overwrite hoặc merge có thể không cung cấp đủ sự cô lập (isolation) và kiểm soát để kiểm thử phiên bản API mới; nếu có sự cố trong quá trình cập nhật, có thể dẫn đến mất dữ liệu trên API Gateway hiện tại, ảnh hưởng đồng thời đến tất cả khách hàng.</p><p>- Implement a blue-green deployment strategy for the API Gateway...: Trong blue-green deployment, cả môi trường blue (hiện tại) và green (đã cập nhật) đều phải được cấp phát và duy trì song song, làm tăng độ phức tạp và chi phí triển khai - vi phạm yêu cầu về chi phí được nêu rõ trong đề bài. Ngoài ra, việc chuyển một phần traffic sang môi trường green có thể gây ra vấn đề cho chính những người dùng đó nếu phiên bản API mới còn lỗi hoặc có vấn đề hiệu năng chưa được phát hiện.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/apigateway/latest/developerguide/welcome.html</a></li><li><a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/canary-release.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/apigateway/latest/developerguide/canary-release.html</a></li><li><a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-import-api-update.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-import-api-update.html</a></li></ul>"},{"id":27,"topic":"Design Resilient Architectures – dạng bài so sánh các giải pháp lưu trữ hybrid cloud (Storage Gateway, DataSync, EBS) để...","supplement":false,"stem":"A company has a hybrid cloud architecture that connects its on-premises data center and cloud infrastructure in AWS. It requires a durable storage backup for its corporate documents stored on-premises and a local cache that provides low-latency access to recently accessed data to reduce data egress charges. The documents must be stored on and retrieved from AWS via the Server Message Block (SMB) protocol. These files must be immediately accessible within minutes for six months and archived for another decade to meet data compliance.<br><br>Which of the following is the best and most cost-effective approach to implement in this scenario?","options":[{"html":"Launch a new file gateway that connects to your on-premises data center using AWS Storage Gateway. Upload the documents to the file gateway and set up a lifecycle policy to move the data into Glacier for data archival.","correct":true},{"html":"Launch a new tape gateway that connects to your on-premises data center using AWS Storage Gateway. Upload the documents to the tape gateway and set up a lifecycle policy to move the data into Glacier for archival.","correct":false},{"html":"Use AWS DataSync to transfer all files from the on-premises network directly to an Amazon S3 bucket, and set up a lifecycle policy to move the data into Glacier for archival.","correct":false},{"html":"Establish a Direct Connect connection to integrate your on-premises network to your VPC. Upload the documents on Amazon EBS Volumes and use a lifecycle policy to automatically move the EBS snapshots to an Amazon S3 bucket, and then later to Glacier for archival.","correct":false}],"multi":1,"analysis":"<p>Đây là dạng bài so sánh các giải pháp lưu trữ hybrid cloud (Storage Gateway, DataSync, EBS) để chọn kiến trúc tối ưu chi phí, có cache truy cập nhanh và hỗ trợ giao thức file chia sẻ (SMB) kết hợp với lưu trữ lâu dài/archival.</p>","answer":"<p>File Gateway hỗ trợ giao diện file vào Amazon S3, kết hợp giữa dịch vụ và virtual appliance. Nhờ đó bạn có thể lưu trữ và truy xuất object trong S3 bằng các giao thức file tiêu chuẩn như NFS (version 3, 4.1) và SMB (version 2, 3). Gateway được triển khai tại on-premises dưới dạng VM chạy trên VMware ESXi, Microsoft Hyper-V, hoặc KVM. Với file gateway, bạn có thể truy cập trực tiếp dữ liệu trong Amazon S3 từ bất kỳ ứng dụng/dịch vụ AWS Cloud nào, và quản lý dữ liệu S3 bằng lifecycle policy, cross-region replication, versioning. Có thể xem file gateway như một file system mount lên S3.\n\nAWS Storage Gateway hỗ trợ các storage class: S3 Standard, S3 Standard-IA, S3 One Zone-IA và Glacier. Khi tạo/cập nhật file share, bạn có thể chọn storage class, và nên dùng Lifecycle Policy để chuyển dữ liệu sang Glacier thay vì ghi trực tiếp vào S3-IA/One Zone-IA (đặc biệt nếu dữ liệu có thể bị cập nhật/xóa trong vòng 30 ngày).\n\nDo đó, đáp án đúng là: launch a new file gateway, upload documents vào file gateway, và dùng lifecycle policy để chuyển dữ liệu vào Glacier.</p>","explain":"<p>- Tape gateway + lifecycle policy chuyển vào Glacier: mặc dù tape gateway cung cấp backup archival bền vững và tiết kiệm chi phí trong Glacier, nhưng không đáp ứng yêu cầu truy xuất ngay trong vài phút, và không duy trì local cache để giảm độ trễ/chi phí egress. File gateway vẫn là lựa chọn tốt hơn.</p><p>- Direct Connect + lưu trên EBS Volumes, lifecycle policy chuyển EBS snapshot sang S3 rồi Glacier: EBS kém bền (durable) hơn S3, và lưu trực tiếp vào S3 sẽ tiết kiệm chi phí hơn. Một giải pháp thay thế là dùng Direct Connect kết hợp Storage Gateway (file gateway) để có kết nối dedicated, thông lượng cao — nhưng phương án này dùng EBS nên vẫn sai.</p><p>- Dùng AWS DataSync để chuyển toàn bộ file từ on-premises sang S3 trực tiếp, kèm lifecycle policy chuyển vào Glacier: DataSync chủ yếu là dịch vụ di chuyển dữ liệu hàng loạt (bulk transfer), không cung cấp local caching cho truy cập dữ liệu gần đây với độ trễ thấp. Thiếu caching sẽ khiến công ty tốn chi phí egress cao hơn, làm phương án này kém tối ưu chi phí hơn.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/object-lifecycle-mgmt.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/dev/object-lifecycle-mgmt.html</a></li><li><a href=\"https://docs.aws.amazon.com/storagegateway/latest/userguide/StorageGatewayConcepts.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/storagegateway/latest/userguide/StorageGatewayConcepts.html</a></li></ul>"},{"id":28,"topic":"Design High-Performing Architectures – dạng bài chọn dịch vụ lưu trữ file phù hợp khi migrate ứng dụng Windows (SharePoint) từ...","supplement":false,"stem":"A company plans to migrate its on-premises workload to AWS. The current architecture is composed of a Microsoft SharePoint server that uses a Windows shared file storage. The Solutions Architect needs to use a cloud storage solution that is highly available and can be integrated with Active Directory for access control and authentication, and must be accessible from on-premises via a direct connection.<br><br>Which of the following options can satisfy the given requirement?","options":[{"html":"Provision an Amazon FSx for Windows File Server file system and join it to an AWS Active Directory domain.","correct":true},{"html":"Launch an Amazon EC2 Windows Server to mount a new Amazon S3 bucket as a file volume.","correct":false},{"html":"Create a file system using Amazon EFS and join it to an Active Directory domain.","correct":false},{"html":"Create a Network File System (NFS) file share using AWS Storage Gateway.","correct":false}],"multi":1,"analysis":"<p>Đây là dạng bài chọn dịch vụ lưu trữ file phù hợp khi migrate ứng dụng Windows (SharePoint) từ on-premises lên AWS, yêu cầu tích hợp Active Directory để xác thực/kiểm soát truy cập và hỗ trợ giao thức SMB.</p>","answer":"<p>Amazon FSx for Windows File Server cung cấp dịch vụ lưu trữ file được quản lý toàn phần (fully managed), độ tin cậy cao và có thể mở rộng, truy cập qua giao thức SMB tiêu chuẩn ngành. Dịch vụ này được xây dựng trên nền Windows Server, cung cấp nhiều tính năng quản trị như user quota, end-user file restore, và tích hợp Microsoft Active Directory (AD). FSx có thể truy cập từ Windows, Linux, macOS. Amazon FSx tích hợp với Active Directory theo hai cách: AWS Managed Microsoft AD hoặc Self-managed Microsoft AD, cho phép người dùng dùng chính identity hiện có để truy cập hệ thống file và kiểm soát quyền truy cập từng file/folder. (Lưu ý: sau khi tạo cấu hình Active Directory cho một file system thì không thể thay đổi, nhưng có thể tạo file system mới từ backup để đổi cấu hình AD.)\n\nDo đó, đáp án đúng là: Provision an Amazon FSx for Windows File Server file system and join it to an AWS Active Directory domain.</p>","explain":"<p>- Tạo file system bằng Amazon EFS và join vào Active Directory domain: Amazon EFS không hỗ trợ hệ điều hành Windows, chỉ hỗ trợ Linux. Phải dùng Amazon FSx for Windows File Server để đáp ứng yêu cầu.</p><p>- Launch EC2 Windows Server để mount một S3 bucket mới làm file volume: không thể tích hợp Amazon S3 với Active Directory hiện có để cung cấp xác thực và kiểm soát truy cập.</p><p>- Tạo NFS file share bằng AWS Storage Gateway: NFS file share chủ yếu dùng cho hệ thống Linux, trong khi yêu cầu là Windows shared file storage. Cần dùng SMB file share (hỗ trợ Windows OS và cấu hình Active Directory), ví dụ qua Amazon FSx for Windows File Server.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/fsx/latest/WindowsGuide/aws-ad-integration-fsxW.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/fsx/latest/WindowsGuide/aws-ad-integration-fsxW.html</a></li><li><a href=\"https://aws.amazon.com/fsx/windows/faqs/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/fsx/windows/faqs/</a></li><li><a href=\"https://docs.aws.amazon.com/storagegateway/latest/userguide/CreatingAnSMBFileShare.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/storagegateway/latest/userguide/CreatingAnSMBFileShare.html</a></li></ul>"},{"id":29,"topic":"Design Secure Architectures – Bài kiểm tra kiến thức về quản lý đa tài khoản AWS (multi-account) và chia sẻ tài nguyê...","supplement":false,"stem":"A global IT company with offices around the world has multiple AWS accounts. To improve efficiency and drive costs down, the Chief Information Officer (CIO) wants to set up a solution that centrally manages their AWS resources. This will allow them to procure AWS resources centrally and share resources such as AWS Transit Gateways, AWS License Manager configurations, or Amazon Route 53 Resolver rules across their various accounts.<br><br>As the Solutions Architect, which combination of options should you implement in this scenario? (Select TWO.)","options":[{"html":"Consolidate all of the company's accounts using AWS Organizations.","correct":true},{"html":"Use the AWS Resource Access Manager (RAM) service to easily and securely share your resources with your AWS accounts.","correct":true},{"html":"Use the AWS Identity and Access Management service to set up cross-account access that will easily and securely share your resources with your AWS accounts.","correct":false},{"html":"Use AWS Control Tower to easily and securely share your resources with your AWS accounts.","correct":false},{"html":"Consolidate all of the company's accounts using AWS ParallelCluster.","correct":false}],"multi":2,"analysis":"<p>Bài kiểm tra kiến thức về quản lý đa tài khoản AWS (multi-account) và chia sẻ tài nguyên tập trung giữa các account — phân biệt AWS Organizations, AWS RAM, IAM cross-account, Control Tower, ParallelCluster.</p>","answer":"<p>AWS Resource Access Manager (RAM) là dịch vụ cho phép chia sẻ tài nguyên AWS một cách dễ dàng và an toàn với bất kỳ AWS account nào hoặc trong AWS Organization, bao gồm AWS Transit Gateways, Subnets, AWS License Manager configurations và Amazon Route 53 Resolver rules. RAM giúp loại bỏ việc tạo tài nguyên trùng lặp ở nhiều account, giảm overhead vận hành. Bạn có thể tạo tài nguyên tập trung trong môi trường multi-account và dùng RAM để chia sẻ qua 3 bước đơn giản: tạo Resource Share, chỉ định resource, chỉ định account. RAM không mất thêm phí.\n\nAWS Organizations là dịch vụ quản lý account cho phép hợp nhất nhiều AWS account vào một tổ chức do bạn tạo và quản lý tập trung, tạo member account, mời account hiện có tham gia, nhóm các account và áp dụng policy-based controls.\n\nDo đó, kết hợp đúng là: Consolidate các account bằng AWS Organizations, và dùng AWS Resource Access Manager (RAM) để chia sẻ tài nguyên.</p>","explain":"<p>- Dùng AWS IAM để thiết lập cross-account access chia sẻ tài nguyên: dù có thể dùng IAM để ủy quyền truy cập tài nguyên ở các account khác nhau, nhưng việc này rất tốn công vì phải thiết lập cross-account access thủ công cho từng account. Giải pháp tốt hơn là dùng AWS RAM.</p><p>- Dùng AWS Control Tower để chia sẻ tài nguyên: Control Tower chỉ đơn giản là cách dễ nhất để thiết lập và quản trị một môi trường multi-account mới, an toàn — không phải dịch vụ phù hợp để chia sẻ tài nguyên giữa các account hay trong Organization. Cần dùng AWS RAM.</p><p>- Consolidate các account bằng AWS ParallelCluster: AWS ParallelCluster chỉ là công cụ quản lý cluster mã nguồn mở, giúp triển khai và quản lý cụm High-Performance Computing (HPC) trên AWS — không liên quan đến việc hợp nhất account. Phù hợp hơn là dùng AWS Organizations.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/ram/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/ram/</a></li><li><a href=\"https://docs.aws.amazon.com/ram/latest/userguide/shareable.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/ram/latest/userguide/shareable.html</a></li></ul>"},{"id":30,"topic":"Design Resilient Architectures – Bài kiểm tra kiến thức bảo vệ dữ liệu trong Amazon S3 khỏi xóa/ghi đè nhầm — các tính n...","supplement":false,"stem":"There was an incident in a production environment where user data stored in an Amazon S3 bucket was accidentally deleted by a Junior DevOps Engineer. The issue was escalated to management, and after a few days, an instruction was given to improve the security and protection of AWS resources.<br><br>What combination of the following options will protect the S3 objects in the bucket from both accidental deletion and overwriting? (Select TWO.)","options":[{"html":"Disallow S3 Delete using an IAM bucket policy","correct":false},{"html":"Enable S3 Intelligent-Tiering","correct":false},{"html":"Enable Multi-Factor Authentication Delete","correct":true},{"html":"Provide access to S3 data strictly through pre-signed URL only","correct":false},{"html":"Enable Versioning","correct":true}],"multi":2,"analysis":"<p>Bài kiểm tra kiến thức bảo vệ dữ liệu trong Amazon S3 khỏi xóa/ghi đè nhầm — các tính năng Versioning, MFA Delete, bucket policy, pre-signed URL, Intelligent-Tiering.</p>","answer":"<p>Kết hợp Versioning và MFA (Multi-Factor Authentication) Delete giúp bảo vệ và khôi phục object S3 khỏi việc xóa hoặc ghi đè nhầm. Versioning cho phép giữ nhiều phiên bản của một object trong cùng bucket; bucket bật versioning cho phép khôi phục object sau khi bị xóa/ghi đè nhầm, bảo toàn, truy xuất và khôi phục mọi phiên bản của object, giúp phục hồi sau cả hành động người dùng vô ý lẫn lỗi ứng dụng.\n\nNgoài ra có thể bật thêm MFA Delete để yêu cầu xác thực bổ sung cho các thao tác: thay đổi trạng thái versioning của bucket, hoặc xóa vĩnh viễn một phiên bản object. MFA Delete yêu cầu hai hình thức xác thực: security credentials của bạn, và chuỗi ghép gồm serial number hợp lệ, dấu cách, và mã 6 chữ số hiển thị trên thiết bị xác thực được duyệt.\n\nDo đó, đáp án đúng là: Enable Versioning và Enable Multi-Factor Authentication Delete.</p>","explain":"<p>- Provide access to S3 data strictly through pre-signed URL only: pre-signed URL chỉ cấp quyền truy cập object được chỉ định trong URL, hữu ích khi khách hàng upload lên S3 bucket, nhưng không giúp ngăn chặn việc xóa nhầm.</p><p>- Disallow S3 Delete using an IAM bucket policy: vẫn cần cho phép người dùng xóa object trong bucket khi cần, mục tiêu chỉ là ngăn xóa nhầm chứ không phải chặn hoàn toàn. Disallow S3 Delete bằng IAM bucket policy sẽ chặn luôn mọi thao tác xóa hợp lệ trên bucket.</p><p>- Enable S3 Intelligent-Tiering: S3 Intelligent-Tiering không giúp ích gì trong tình huống này — nó chỉ tối ưu chi phí lưu trữ theo tần suất truy cập, không liên quan đến bảo vệ khỏi xóa/ghi đè.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/Versioning.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/dev/Versioning.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html</a></li></ul>"},{"id":31,"topic":"Design Resilient Architectures – Bài kiểm tra kiến thức về giám sát (monitoring) EC2 với Amazon CloudWatch — phân biệt m...","supplement":false,"stem":"A company has a cloud architecture composed of Linux and Windows Amazon EC2 instances that process high volumes of financial data 24 hours a day, 7 days a week. To ensure high availability of the systems, the Solutions Architect must create a solution that enables monitoring of memory and disk utilization metrics for all instances.<br><br>Which of the following is the most suitable monitoring solution to implement?","options":[{"html":"Install the Amazon CloudWatch agent to all the EC2 instances that gather the memory and disk utilization data. View the custom metrics in the CloudWatch console.","correct":true},{"html":"Use Amazon Inspector and install the Inspector agent to all EC2 instances.","correct":false},{"html":"Enable the Enhanced Monitoring option in EC2 and install Amazon CloudWatch agent to all the EC2 instances to be able to view the memory and disk utilization in the CloudWatch dashboard.","correct":false},{"html":"Use the default Amazon CloudWatch configuration to EC2 instances where the memory and disk utilization metrics are already available. Install the AWS Systems Manager (SSM) Agent on all the EC2 instances and enable AWS Systems Manager Inventory to track instance configuration and metadata.","correct":false}],"multi":1,"analysis":"<p>Bài kiểm tra kiến thức về giám sát (monitoring) EC2 với Amazon CloudWatch — phân biệt metric mặc định vs custom metric cần cài CloudWatch agent, cũng như phân biệt với Enhanced Monitoring (RDS) và Amazon Inspector.</p>","answer":"<p>Amazon CloudWatch cung cấp sẵn EC2 Metrics để giám sát CPU utilization, Network utilization, Disk performance, Disk Reads/Writes. Tuy nhiên với các chỉ số sau thì cần chuẩn bị custom metric bằng script Perl hoặc shell script khác vì không có sẵn: Memory utilization, Disk swap utilization, Disk space utilization, Page file utilization, Log collection.\n\nCó một CloudWatch agent đa nền tảng (multi-platform) có thể cài trên cả instance Linux và Windows. Bạn có thể dùng một agent duy nhất để thu thập cả system metrics và log file từ EC2 instance và server on-premises. Agent này hỗ trợ cả Windows Server và Linux, cho phép chọn các metric cần thu thập, kể cả sub-resource metric như per-CPU core. Nên dùng agent mới này thay vì các monitoring script cũ để thu thập metric và log.\n\nDo đó, đáp án đúng là: Install the Amazon CloudWatch agent to all the EC2 instances that gather the memory and disk utilization data. View the custom metrics in the CloudWatch console.</p>","explain":"<p>- Dùng cấu hình CloudWatch mặc định (cho rằng memory/disk utilization đã có sẵn), cài SSM Agent và bật Systems Manager Inventory: memory và disk utilization không có sẵn trong cấu hình CloudWatch mặc định — các metric này không được CloudWatch thu thập tự nhiên và cần cài CloudWatch agent trên từng instance. Hơn nữa, AWS Systems Manager Inventory chỉ thu thập metadata/cấu hình instance (ứng dụng đã cài, thông tin OS...), không thu thập hay báo cáo performance metric như memory/disk utilization.</p><p>- Enable Enhanced Monitoring option trong EC2 và cài CloudWatch agent: Enhanced Monitoring chỉ là tính năng của Amazon RDS, không phải của EC2. Theo mặc định, Enhanced Monitoring metrics chỉ được lưu 30 ngày trong CloudWatch Logs.</p><p>- Dùng Amazon Inspector và cài Inspector agent trên các EC2 instance: Amazon Inspector chủ yếu là dịch vụ đánh giá bảo mật tự động, kiểm tra khả năng truy cập mạng và tình trạng bảo mật của ứng dụng — không cung cấp custom metric để theo dõi memory/disk utilization của từng EC2 instance.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/monitoring_ec2.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/monitoring_ec2.html</a></li><li><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/mon-scripts.html#using_put_script\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/mon-scripts.html#using_put_script</a></li></ul>"},{"id":32,"topic":"Design Cost-Optimized Architectures – Bài kiểm tra phân biệt các loại dynamic scaling policy của Auto Scaling group (simple s...","supplement":false,"stem":"A company hosted a web application in an Auto Scaling group of EC2 instances. The IT manager is concerned about the over-provisioning of the resources that can cause higher operating costs. A Solutions Architect has been instructed to create a cost-effective solution without affecting the performance of the application.<br><br>Which dynamic scaling policy should be used to satisfy this requirement?","options":[{"html":"Use simple scaling.","correct":false},{"html":"Use target tracking scaling.","correct":true},{"html":"Use suspend and resume scaling.","correct":false},{"html":"Use scheduled scaling.","correct":false}],"multi":1,"analysis":"<p>Bài kiểm tra phân biệt các loại dynamic scaling policy của Auto Scaling group (simple scaling, step scaling, target tracking, scheduled, suspend/resume) để chọn phương án tối ưu chi phí mà không ảnh hưởng hiệu năng.</p>","answer":"<p>Auto Scaling group là tập hợp các EC2 instance được xem như một nhóm logic để tự động scale và quản lý, hỗ trợ health check replacement và scaling policy. Step scaling và simple scaling đều yêu cầu tạo CloudWatch alarm, chỉ định ngưỡng cao/thấp, và xác định số lượng instance thêm/bớt hoặc kích thước chính xác. Điểm khác biệt chính của step scaling là có step adjustment thay đổi theo mức độ breach của alarm. Vấn đề chính của simple scaling là sau khi một scaling activity bắt đầu, policy phải chờ scaling activity/health check replacement hoàn tất và cooldown period hết hạn mới phản hồi alarm tiếp theo — cooldown giúp tránh khởi tạo thêm scaling activity trước khi tác động của hoạt động trước đó thể hiện rõ.\n\nVới target tracking scaling policy, bạn có thể tăng/giảm capacity hiện tại của group dựa trên giá trị mục tiêu (target value) của một metric cụ thể. Policy này giúp giải quyết vấn đề over-provisioning tài nguyên: nó thêm/bớt capacity để giữ metric ở gần giá trị mục tiêu, đồng thời tự điều chỉnh theo thay đổi của load pattern.\n\nDo đó, đáp án đúng là: Use target tracking scaling.</p>","explain":"<p>- Use simple scaling: phải chờ cooldown period hoàn tất mới có thể kích hoạt thêm scaling activity. Target tracking hoặc step scaling có thể kích hoạt scaling activity ngay lập tức mà không cần chờ cooldown hết hạn.</p><p>- Use scheduled scaling: policy này chủ yếu dùng cho traffic pattern có thể dự đoán trước (predictable). Cần dùng target tracking scaling để tối ưu chi phí hạ tầng mà không ảnh hưởng hiệu năng.</p><p>- Use suspend and resume scaling: loại này dùng để tạm dừng các scaling activity được kích hoạt bởi scaling policy và scheduled action, không phải giải pháp scaling để tối ưu chi phí.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html</a></li><li><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/AutoScalingGroup.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/AutoScalingGroup.html</a></li></ul>"},{"id":33,"topic":"Design Secure Architectures – Bài kiểm tra kiến thức bảo mật Amazon EKS — mã hóa secret trong etcd key-value store bằ...","supplement":false,"stem":"A company has recently migrated its microservices-based application to Amazon Elastic Kubernetes Service (Amazon EKS). As part of the migration, the company must ensure that all sensitive configuration data and credentials, such as database passwords and API keys, are stored securely and encrypted within the Amazon EKS cluster’s etcd key-value store.<br><br>What is the most suitable solution to meet the company’s requirements?","options":[{"html":"Use Amazon EKS default options and the Amazon Elastic Block Store (Amazon EBS) Container Storage Interface (CSI) driver as an add-on to securely store sensitive data within the Amazon EKS cluster.","correct":false},{"html":"Use AWS Secrets Manager with a new AWS KMS key to securely manage and store sensitive data within the EKS cluster's etcd key-value store.","correct":false},{"html":"Enable secret encryption with a new AWS KMS key on an existing Amazon EKS cluster to encrypt sensitive data stored in the EKS cluster's etcd key-value store.","correct":true},{"html":"Enable default Amazon EBS volume encryption for the account with a new AWS KMS key to ensure encryption of sensitive data within the Amazon EKS cluster.","correct":false}],"multi":1,"analysis":"<p>Bài kiểm tra kiến thức bảo mật Amazon EKS — mã hóa secret trong etcd key-value store bằng AWS KMS, phân biệt với Secrets Manager, EBS encryption và EBS CSI driver.</p>","answer":"<p>Việc bật secret encryption với một AWS KMS key mới trên cluster EKS hiện có là yếu tố then chốt để bảo mật dữ liệu nhạy cảm lưu trong etcd key-value store của cluster. Amazon EKS là dịch vụ chạy và quản lý ứng dụng containerized, lưu trữ dữ liệu cấu hình và secret... trong một distributed data store (etcd). Mặc định các secret này không được mã hóa, tiềm ẩn rủi ro bảo mật. Tích hợp AWS KMS với Amazon EKS cho phép mã hóa các secret này, tận dụng khả năng quản lý khóa mã hóa và kiểm soát việc sử dụng khóa trên các dịch vụ/ứng dụng AWS.\n\nQuá trình này gồm việc tạo một AWS KMS key dành riêng cho cluster EKS và cấu hình cluster để mã hóa secret trước khi lưu vào etcd, đảm bảo toàn bộ thông tin nhạy cảm trong etcd được mã hóa at rest.\n\nDo đó, đáp án đúng là: Enable secret encryption with a new AWS KMS key on an existing Amazon EKS cluster to encrypt sensitive data stored in the EKS cluster's etcd key-value store.</p>","explain":"<p>- Use AWS Secrets Manager with a new AWS KMS key để quản lý và lưu trữ dữ liệu nhạy cảm trong etcd key-value store: Secrets Manager là công cụ mạnh để quản lý secret nhưng không trực tiếp giải quyết việc mã hóa dữ liệu bên trong etcd của cluster EKS. Secrets Manager thiên về quản lý và truy xuất secret hơn là mã hóa dữ liệu trong etcd.</p><p>- Enable default Amazon EBS volume encryption cho account với một AWS KMS key mới: EBS volume encryption chỉ đảm bảo dữ liệu at rest trong EBS volume được mã hóa. EBS volume chủ yếu dùng làm persistent storage cho worker node, không liên quan trực tiếp đến việc lưu trữ dữ liệu cấu hình/credential nhạy cảm trong etcd key-value store của EKS cluster.</p><p>- Use Amazon EKS default options và EBS CSI driver như add-on để lưu trữ dữ liệu nhạy cảm: EBS CSI driver cho phép dùng EBS volume làm persistent storage cho ứng dụng Kubernetes chạy trên EKS — cung cấp persistent storage an toàn nhưng không giải quyết yêu cầu lưu trữ an toàn dữ liệu nhạy cảm trong etcd key-value store của cluster.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html</a></li><li><a href=\"https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/\" target=\"_blank\" rel=\"noopener noreferrer\">https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/</a></li><li><a href=\"https://docs.aws.amazon.com/eks/latest/userguide/enable-kms.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/eks/latest/userguide/enable-kms.html</a></li></ul>"},{"id":34,"topic":"Design High-Performing Architectures – Bài kiểm tra chọn dịch vụ lưu trữ file được quản lý (managed), có tính sẵn sàng cao (hi...","supplement":false,"stem":"A company has a web application that uses Internet Information Services (IIS) for Windows Server. A file share is used to store the application data on the network-attached storage of the company’s on-premises data center. To achieve a highly available system, the company plans to migrate the application and file share to AWS. The team considered using Logical Volume Management (LVM) stripe on Amazon EC2, but this approach would not provide a managed, highly available SMB file service.<br><br>Which of the following can be used to fulfill this requirement?","options":[{"html":"Migrate the existing file share configuration to Amazon EBS.","correct":false},{"html":"Migrate the existing file share configuration to Amazon FSx for Windows File Server.","correct":true},{"html":"Migrate the existing file share configuration to AWS Storage Gateway.","correct":false},{"html":"Migrate the existing file share configuration to Amazon EFS.","correct":false}],"multi":1,"analysis":"<p>Bài kiểm tra chọn dịch vụ lưu trữ file được quản lý (managed), có tính sẵn sàng cao (highly available) để thay thế LVM stripe trên EC2 khi migrate ứng dụng Windows (IIS) có dùng file share SMB.</p>","answer":"<p>Amazon FSx for Windows File Server cung cấp Windows file server được quản lý toàn phần (fully managed), dựa trên nền file system Windows gốc (native). FSx for Windows File Server có đầy đủ tính năng, hiệu năng và khả năng tương thích để dễ dàng lift-and-shift ứng dụng doanh nghiệp lên AWS Cloud. Có thể truy cập từ Windows, Linux, macOS, hàng nghìn compute instance/device có thể truy cập đồng thời.\n\nTrong tình huống này cần migrate cấu hình file share hiện có lên cloud — trong các lựa chọn, Amazon FSx là phù hợp nhất. File share là một folder cụ thể trong file system (gồm cả subfolder) được chia sẻ cho compute instance qua giao thức SMB; để migrate cấu hình file share từ on-premises, cần migrate file sang Amazon FSx trước khi migrate cấu hình file share.\n\nDo đó, đáp án đúng là: Migrate the existing file share configuration to Amazon FSx for Windows File Server.</p>","explain":"<p>- Migrate the existing file share configuration to AWS Storage Gateway: AWS Storage Gateway chủ yếu dùng để tích hợp mạng on-premises với AWS, không phải để migrate ứng dụng. Dùng file share trong Storage Gateway nghĩa là vẫn giữ hệ thống on-premises, không migrate hoàn toàn.</p><p>- Migrate the existing file share configuration to Amazon EFS: đề bài nêu rõ công ty đang dùng file share chạy trên Windows server, trong khi Amazon EFS chỉ hỗ trợ khối lượng công việc (workload) trên Linux.</p><p>- Migrate the existing file share configuration to Amazon EBS: EBS chủ yếu dùng làm block storage cho EC2 instance, không phải shared file system. File share là một folder cụ thể trong file system truy cập qua giao thức SMB, mà Amazon EBS không hỗ trợ giao thức SMB.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://aws.amazon.com/fsx/windows/faqs/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/fsx/windows/faqs/</a></li><li><a href=\"https://docs.aws.amazon.com/fsx/latest/WindowsGuide/migrate-file-share-config-to-fsx.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/fsx/latest/WindowsGuide/migrate-file-share-config-to-fsx.html</a></li></ul>"},{"id":35,"topic":"Design High-Performing Architectures – Bài kiểm tra chọn kiến trúc event-driven ETL ít operational overhead nhất để tự động ch...","supplement":false,"stem":"A retail company receives raw .csv data files into its Amazon S3 bucket from multiple sources on an hourly basis, with an average file size of 2 GB. The bucket is managed using S3 Access Grants for fine‑grained access control.<br><br>An automated process must be implemented to convert these .csv files into the more efficient Apache Parquet format and store the converted files in another S3 bucket. Additionally, the conversion process must be automatically initiated each time a new file is uploaded into the S3 bucket.<br><br>Which of the following options must be implemented to meet these requirements with the LEAST operational overhead?","options":[{"html":"Create an ETL (Extract, Transform, Load) job and a Data Catalog table in AWS Glue. Configure the Glue crawler to run on a schedule to check for new files in the S3 bucket every hour and convert them to Parquet format.","correct":false},{"html":"Utilize an AWS Glue extract, transform, and load (ETL) job to process and convert the .csv files to Apache Parquet format and then store the output files into the target S3 bucket. Configure an Amazon EventBridge rule to trigger the Glue job on S3 Object Created events.","correct":true},{"html":"Use an AWS Lambda function triggered by an S3 Object Created event to convert the .csv files to Parquet format. Use the AWS Transfer Family with SFTP service to move the output files to the target S3 bucket.","correct":false},{"html":"Set up an Apache Spark job running in an Amazon EC2 instance and create an Amazon EventBridge rule to monitor S3 Object Created events in the S3 bucket. Configure AWS Lambda to invoke the Spark job for every new .csv file added via a Function URL.","correct":false}],"multi":1,"analysis":"<p>Bài kiểm tra chọn kiến trúc event-driven ETL ít operational overhead nhất để tự động chuyển đổi file .csv thành Parquet ngay khi có file mới upload vào S3 — so sánh AWS Glue + EventBridge, Glue crawler theo lịch, Lambda + Transfer Family, Spark trên EC2.</p>","answer":"<p>AWS Glue là dịch vụ ETL mạnh mẽ, giúp di chuyển dữ liệu dễ dàng giữa các kho dữ liệu khác nhau. Bằng AWS Glue, bạn có thể tạo và quản lý ETL job để chuyển dữ liệu từ nhiều nguồn như Amazon S3, Amazon RDS, Amazon Redshift, đồng thời biến đổi (transform) dữ liệu theo yêu cầu. Một ưu điểm quan trọng của AWS Glue là khả năng tự động discovery và mapping schema, giúp xử lý hiệu quả dữ liệu từ nhiều nguồn có schema khác nhau. Glue job có thể được kích hoạt tự động bằng Amazon EventBridge rule hoặc AWS Lambda function khi có sự kiện S3 Object Created, tạo ra một luồng xử lý dữ liệu event-driven và tự động.\n\nApache Parquet là định dạng lưu trữ columnar, mang lại hiệu suất và hiệu quả xử lý cao hơn cho big data, với tỷ lệ nén cao và thời gian truy vấn nhanh hơn, đồng thời tương thích với nhiều framework xử lý dữ liệu như Spark, Hive, Hadoop. Dùng AWS Glue và các dịch vụ AWS khác, bạn có thể dễ dàng chuyển file .csv sang định dạng Parquet hiệu quả hơn và lưu vào S3 bucket.\n\nDo đó, đáp án đúng là: Utilize an AWS Glue ETL job to process and convert the .csv files to Apache Parquet format and store output files in target S3 bucket, với Amazon EventBridge rule trigger Glue job khi có S3 Object Created event.</p>","explain":"<p>- Dùng AWS Lambda function kích hoạt bởi S3 Object Created event để convert .csv sang Parquet, và dùng AWS Transfer Family với SFTP để chuyển file output sang target S3 bucket: cách này có thể hoạt động nhưng không hiệu quả khi xử lý khối lượng dữ liệu lớn. Lambda function có giới hạn thời gian chạy tối đa, nên việc convert file lớn (trung bình 2GB) có thể gây timeout. Dùng AWS Transfer Family với SFTP để chuyển file sang target bucket cũng không cần thiết. Hơn nữa, do Lambda có giới hạn bộ nhớ, việc đọc dữ liệu phải chuyển qua data stream — tốn nhiều công sức hơn so với chỉ dùng AWS Glue.</p><p>- Chạy Apache Spark job trên một EC2 instance, dùng EventBridge rule theo dõi S3 Object Created events, và Lambda invoke Spark job qua Function URL cho mỗi file .csv mới: chạy Spark trên EC2 thường đòi hỏi tự provisioning, monitoring và bảo trì thủ công, tốn thời gian và chi phí. Việc dùng EventBridge để trigger Spark job qua Function URL cũng làm tăng độ phức tạp và điểm có thể xảy ra lỗi — phương án này tạo ra độ phức tạp và operational overhead không cần thiết.</p><p>- Tạo ETL job và Data Catalog table trong AWS Glue, cấu hình Glue crawler chạy theo lịch (mỗi giờ) để kiểm tra file mới và convert sang Parquet: dù việc tạo ETL job bằng AWS Glue là đúng hướng, việc trigger job theo lịch thay vì được kích hoạt tự động ngay khi có file mới upload là không lý tưởng — kém hiệu quả hơn so với dùng S3 event trigger để khởi động quá trình convert ngay lập tức.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-format-parquet-home.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/glue/latest/dg/aws-glue-programming-etl-format-parquet-home.html</a></li><li><a href=\"https://docs.aws.amazon.com/glue/latest/dg/starting-workflow-eventbridge.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/glue/latest/dg/starting-workflow-eventbridge.html</a></li><li><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventBridge.html</a></li><li><a href=\"https://aws.amazon.com/blogs/big-data/build-a-serverless-event-driven-workflow-with-aws-glue-and-amazon-eventbridge/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/blogs/big-data/build-a-serverless-event-driven-workflow-with-aws-glue-and-amazon-eventbridge/</a></li></ul>"},{"id":36,"topic":"Design High-Performing Architectures – Bài kiểm tra kiến thức thiết kế partition key cho DynamoDB để phân bổ đều I/O (tránh \"h...","supplement":false,"stem":"A Docker application, which is running on an Amazon ECS cluster behind a load balancer, is heavily using Amazon DynamoDB. The application requires improved database performance by distributing the workload evenly and utilizing the provisioned throughput efficiently. Currently, the table’s write capacity units (WCU) are unevenly consumed due to key distribution.<br><br>Which of the following should be implemented for the DynamoDB table?","options":[{"html":"Avoid using a primary key that combines both a partition key and a sort key.","correct":false},{"html":"Use partition keys with high-cardinality attributes, which have a large number of distinct values for each item.","correct":true},{"html":"Reduce the number of partition keys in the DynamoDB table.","correct":false},{"html":"Use partition keys with low-cardinality attributes, which have a small number of distinct values for each item.","correct":false}],"multi":1,"analysis":"<p>Bài kiểm tra kiến thức thiết kế partition key cho DynamoDB để phân bổ đều I/O (tránh &quot;hot partition&quot;), liên quan đến khái niệm cardinality của partition key.</p>","answer":"<p>Phần partition key trong primary key của bảng quyết định các logical partition nơi dữ liệu bảng được lưu trữ, từ đó ảnh hưởng đến các physical partition bên dưới. Dung lượng I/O được cấp phát (provisioned) cho bảng được chia đều giữa các physical partition này. Vì vậy, một thiết kế partition key không phân bổ đều I/O request có thể tạo ra các &quot;hot&quot; partition gây throttling và sử dụng capacity được cấp phát không hiệu quả.\n\nViệc sử dụng hiệu quả provisioned throughput của bảng phụ thuộc không chỉ vào workload pattern của từng item mà còn vào thiết kế partition key. Không nhất thiết phải truy cập tất cả giá trị partition key để đạt hiệu quả cao, nhưng nguyên tắc chung là: càng nhiều giá trị partition key riêng biệt (distinct) mà workload truy cập, các request càng được trải đều hơn trên không gian phân vùng — tức sử dụng provisioned throughput hiệu quả hơn khi tỷ lệ giá trị partition key được truy cập trên tổng số giá trị partition key tăng lên.\n\nDo đó, đáp án đúng là: Use partition keys with high-cardinality attributes, which have a large number of distinct values for each item.</p>","explain":"<p>- Reduce the number of partition keys in the DynamoDB table: thay vì giảm, bạn nên thêm nhiều giá trị partition key hơn để phân bổ đều I/O request và tránh &quot;hot&quot; partition, từ đó cải thiện hiệu năng.</p><p>- Use partition keys with low-cardinality attributes, which have a small number of distinct values for each item: đây chính là điều ngược lại với đáp án đúng — càng ít giá trị partition key riêng biệt thì request càng ít được trải đều trên không gian phân vùng, làm giảm hiệu năng.</p><p>- Avoid using a primary key that combines both a partition key and a sort key: composite primary key (partition key + sort key) thực chất giúp bảng có nhiều phân vùng hơn, từ đó cải thiện hiệu năng — nên được sử dụng chứ không phải tránh.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-uniform-load.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-uniform-load.html</a></li><li><a href=\"https://aws.amazon.com/blogs/database/choosing-the-right-dynamodb-partition-key/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/blogs/database/choosing-the-right-dynamodb-partition-key/</a></li></ul>"},{"id":37,"topic":"Design Secure Architectures – Bài kiểm tra kiến thức về temporary credentials/identity federation trong IAM — thiết l...","supplement":false,"stem":"A tech company that you are working for has undertaken a Total Cost Of Ownership (TCO) analysis evaluating the use of Amazon S3 versus acquiring more storage hardware. The result was that all 1200 employees would be granted access to use Amazon S3 for the storage of their personal documents.<br><br>Which of the following will you need to consider so you can set up a solution that incorporates a single sign-on feature from your corporate AD or LDAP directory and also restricts access for each individual user to a designated user folder in an S3 bucket? (Select TWO.)","options":[{"html":"Set up a Federation proxy or an Identity provider, and use AWS Security Token Service to generate temporary tokens.","correct":true},{"html":"Use 3rd party Single Sign-On solutions such as Atlassian Crowd, OKTA, OneLogin and many others.","correct":false},{"html":"Set up a matching IAM user for each of the 1200 users in your corporate directory that needs access to a folder in the S3 bucket.","correct":false},{"html":"Configure an IAM role and an IAM Policy to access the bucket.","correct":true},{"html":"Map each individual user to a designated user folder in S3 using Amazon WorkDocs to access their personal documents.","correct":false}],"multi":2,"analysis":"<p>Bài kiểm tra kiến thức về temporary credentials/identity federation trong IAM — thiết lập single sign-on (SSO) từ AD/LDAP doanh nghiệp kết hợp IAM role để giới hạn quyền truy cập từng user vào folder riêng trong S3 bucket.</p>","answer":"<p>Đây là một trong những tình huống phổ biến cần dùng temporary credentials trong AWS. Temporary credentials hữu ích trong các tình huống liên quan đến identity federation, delegation, cross-account access và IAM role. Trong ví dụ này gọi là enterprise identity federation, vì cần thiết lập khả năng single sign-on (SSO).\n\nTrong enterprise identity federation, bạn có thể xác thực người dùng trong mạng của tổ chức, sau đó cấp cho họ quyền truy cập AWS mà không cần tạo identity AWS mới hay yêu cầu họ đăng nhập bằng username/password riêng — đây chính là cách tiếp cận SSO cho temporary access. AWS STS hỗ trợ các chuẩn mở như SAML 2.0, cho phép dùng Microsoft AD FS để tận dụng Microsoft Active Directory hiện có, hoặc dùng SAML 2.0 để tự quản lý giải pháp federation identity người dùng của riêng bạn.\n\nDo đó, đáp án đúng là: Set up a Federation proxy/Identity provider và dùng AWS STS để tạo temporary token, kết hợp Configure an IAM role and an IAM Policy to access the bucket.</p>","explain":"<p>- Use 3rd party Single Sign-On solutions như Atlassian Crowd, OKTA, OneLogin...: không nhất thiết phải dùng giải pháp bên thứ ba để cung cấp quyền truy cập — AWS đã cung cấp sẵn các công cụ cần thiết cho tình huống này.</p><p>- Map each individual user to a designated user folder in S3 using Amazon WorkDocs: không có cách trực tiếp để tích hợp Amazon S3 với Amazon WorkDocs cho tình huống này. Amazon WorkDocs chỉ đơn giản là dịch vụ quản lý toàn phần cho tạo, lưu trữ và cộng tác nội dung, cho phép tạo/sửa/chia sẻ nội dung và truy cập từ bất kỳ đâu trên bất kỳ thiết bị nào — không phục vụ việc map user vào folder riêng trong S3.</p><p>- Set up a matching IAM user for each of the 1200 users in your corporate directory: việc tạo nhiều IAM user như vậy là không cần thiết. Hơn nữa, yêu cầu là tích hợp với AD/LDAP directory hiện có, nên IAM User không phù hợp với tiêu chí này.</p>","wrong":"","tip":"<p><b>Tài liệu tham khảo:</b></p><ul><li><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_saml.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_saml.html</a></li><li><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_oidc.html\" target=\"_blank\" rel=\"noopener noreferrer\">https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_oidc.html</a></li><li><a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/iam-s3-user-specific-folder/\" target=\"_blank\" rel=\"noopener noreferrer\">https://aws.amazon.com/premiumsupport/knowledge-center/iam-s3-user-specific-folder/</a></li></ul>"},{"id":38,"topic":"Design Cost-Optimized Architectures – Bài kiểm tra phân biệt các loại scaling policy (scheduled, dynamic theo CPU/Memory, pre...","supplement":false,"stem":"A tech company has a CRM application hosted on an Auto Scaling group of On-Demand EC2 instances with different instance types and sizes. The application is extensively used during office hours from 9 in the morning to 5 in the afternoon. Their users are complaining that the performance of the application is slow during the start of the day but then works normally after a couple of hours.<br><br>Which of the following is the MOST operationally efficient solution to implement to ensure the application works properly at the beginning of the day?","options":[{"html":"Configure a Scheduled scaling policy for the Auto Scaling group to launch new instances before the start of the day.","correct":true},{"html":"Configure a Dynamic scaling policy for the Auto Scaling group to launch new instances based on the Memory utilization.","correct":false},{"html":"Configure a Dynamic scaling policy for the Auto Scaling group to launch new instances based on the CPU utilization.","correct":false},{"html":"Configure a Predictive scaling policy for the Auto Scaling group to automatically adjust the number of Amazon EC2 instances","correct":false}],"multi":1,"analysis":"<p>Bài kiểm tra phân biệt các loại scaling policy (scheduled, dynamic theo CPU/Memory, predictive) để chọn phương án hiệu quả vận hành nhất khi traffic có pattern dự đoán được (giờ hành chính) và Auto Scaling group gồm nhiều loại/kích thước instance khác nhau.</p>","answer":"<p>Scaling theo lịch (scheduled scaling) cho phép scale ứng dụng để đáp ứng các thay đổi tải có thể dự đoán trước.
