<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Test 4 · SAA-C03</title>
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#eef0f5; --text:#1a1d23; --muted:#646c78;
  --border:#dfe3ea; --accent:#3a5bf0; --accent-hover:#2d49d6; --accent-soft:#e8edfe;
  --ok:#1a8f55; --ok-soft:#e4f6ec; --bad:#d13b3b; --bad-soft:#fcebeb; --warn:#b4790a; --warn-soft:#fff3db;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
    --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
    --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
    --shadow:none; --shadow-sm:none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
  --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
  --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
  --shadow:none; --shadow-sm:none;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.65 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .2s ease,color .2s ease;
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);padding:.1em .4em;border-radius:5px}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 56px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
header.top h1{
  font-size:21px;margin:0;letter-spacing:-.015em;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent-hover));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
header.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:7px 14px;min-width:76px;text-align:center;box-shadow:var(--shadow-sm);transition:border-color .15s ease,transform .15s ease}
.stat:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hover));width:0;transition:width .3s ease}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:16px}
.toolbar select,.btn{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 13px;cursor:pointer;transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent}
.toolbar label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.layout{display:grid;grid-template-columns:264px 1fr;gap:18px;align-items:start}
.side{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;position:sticky;top:14px;box-shadow:var(--shadow)}
.side h2{font-size:12.5px;margin:0 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.cell{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;height:32px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums;position:relative;padding:0;transition:border-color .12s ease,transform .12s ease,background .12s ease}
.cell:hover{border-color:var(--accent);transform:translateY(-1px)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell.dim{opacity:.32}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cell.sup{font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--border);background:var(--surface-2)}
.legend .l-ok::before{background:var(--ok-soft);border-color:var(--ok)}
.legend .l-bad::before{background:var(--bad-soft);border-color:var(--bad)}
.legend .l-flag::before{background:var(--warn);border-radius:50%;border:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.qnum{font-weight:700;font-size:17px;letter-spacing:-.01em}
.chip{font-size:12px;padding:3px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;transition:transform .12s ease}
.chip.sup{background:var(--warn-soft);color:var(--warn)}
.chip.multi{background:var(--surface-2);color:var(--muted);font-weight:500}
.flagbtn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:13px;transition:border-color .15s ease,background .15s ease,transform .15s ease}
.flagbtn:hover{border-color:var(--warn);color:var(--warn);transform:translateY(-1px)}
.flagbtn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.stem{line-height:1.7}
.stem p{margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;padding:11px 13px;cursor:pointer;background:var(--surface);transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.opt:hover{border-color:var(--accent);transform:translateX(2px);box-shadow:var(--shadow-sm)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--surface-2);transition:background .15s ease,border-color .15s ease,color .15s ease}
.opt.multi .key{border-radius:7px}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--border);transform:none;box-shadow:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.tag{font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)} .opt.missed .tag{color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .spacer{flex:1}
.verdict{margin:18px 0 6px;padding:11px 15px;border-radius:11px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.hint{margin-top:16px;border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:9px;padding:11px 15px;background:var(--surface-2)}
.hint h3{margin:0 0 6px;font-size:14px;color:var(--warn)}
details.sec{border:1px solid var(--border);border-radius:11px;margin-top:11px;background:var(--surface);transition:border-color .15s ease}
details.sec>summary{cursor:pointer;padding:11px 15px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"›";display:inline-block;transition:transform .15s ease;color:var(--muted);font-size:18px;line-height:1}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec .body{padding:0 16px 14px}
.body p{margin:7px 0}
.body ul,.body ol{margin:7px 0;padding-left:22px}
.body li{margin:4px 0}
.body table{border-collapse:collapse;width:100%;margin:9px 0;font-size:14px;display:block;overflow-x:auto}
.body th,.body td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
.body th{background:var(--surface-2)}
.sec.s-answer{border-left:3px solid var(--ok)}
.sec.s-tip{border-left:3px solid var(--accent)}
.empty{color:var(--muted);text-align:center;padding:44px 10px}
.kbd{font-size:12px;color:var(--muted);margin-top:14px}
.kbd kbd{font-family:inherit;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface-2)}
.summary h2{margin-top:0}
.summary table{border-collapse:collapse;width:100%;font-size:14px}
.summary th,.summary td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left}
.summary td.n{font-variant-numeric:tabular-nums;text-align:right}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s ease}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .grid{grid-template-columns:repeat(10,1fr)}
}
@media (max-width:480px){
  .wrap{padding:14px 16px 40px}
  .card{padding:16px}
  .grid{grid-template-columns:repeat(8,1fr)}
  .stat{min-width:64px;padding:5px 10px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>AWS SAA-C03 · Practice Test 4 (65 câu)</h1>
      <div class="sub">Đề tiếng Anh · Giải thích tiếng Việt · Tiến độ chỉ lưu trong phiên đang mở</div>
    <p style="margin:4px 0 0"><a href="../index.html" style="color:var(--accent)">&larr; Về trang luyện đề chính</a></p>
    </div>
    <div class="stats">
      <div class="stat"><b id="sDone">0</b><span>Đã làm</span></div>
      <div class="stat ok"><b id="sOk">0</b><span>Đúng</span></div>
      <div class="stat bad"><b id="sBad">0</b><span>Sai</span></div>
      <div class="stat"><b id="sPct">–</b><span>Tỷ lệ đúng</span></div>
    </div>
  </header>
  <div class="progress"><i id="prog"></i></div>

  <div class="toolbar">
    <select id="fFilter" aria-label="Lọc câu hỏi">
      <option value="all">Tất cả câu</option>
      <option value="todo">Chưa làm</option>
      <option value="bad">Làm sai</option>
      <option value="flag">Đã đánh dấu</option>
    </select>
    <select id="fTopic" aria-label="Lọc theo chủ đề"><option value="">Mọi chủ đề</option></select>
    <label><input type="checkbox" id="optShuffleQ"> Xáo câu hỏi</label>
    <label><input type="checkbox" id="optShuffleA"> Xáo đáp án</label>
    <label><input type="checkbox" id="optAuto" checked> Hiện giải thích sau khi kiểm tra</label>
    <span style="flex:1"></span>
    <button class="btn" id="btnSummary">Xem kết quả</button>
    <button class="btn ghost" id="btnReset">Làm lại</button>
    <button class="btn ghost" id="btnTheme" title="Đổi giao diện sáng/tối">◐</button>
  </div>

  <div class="layout">
    <aside class="side">
      <h2>Danh sách câu</h2>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span class="l-ok">Đúng</span><span class="l-bad">Sai</span><span>Chưa làm</span><span class="l-flag">Đánh dấu</span>
      </div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<script>
const Q = [{"id":1,"topic":"Design Secure Architectures – IAM Authentication for Lambda-to-RDS","supplement":false,"stem":"A company runs a popular dating website on the AWS Cloud. As a Solutions Architect, you've designed the architecture of the website to follow a serverless pattern on the AWS Cloud using Amazon API Gateway and AWS Lambda. The backend uses an Amazon RDS PostgreSQL database. Currently, the application uses a username and password combination to connect the AWS Lambda function to the Amazon RDS database.<br>You would like to improve the security at the authentication level by leveraging short-lived credentials. What will you choose? (Select two)","options":[{"html":"Attach an AWS Identity and Access Management (IAM) role to AWS Lambda","correct":true},{"html":"Use IAM authentication from AWS Lambda to Amazon RDS PostgreSQL","correct":true},{"html":"Restrict the Amazon RDS database security group to the AWS Lambda's security group","correct":false},{"html":"Deploy AWS Lambda in a VPC","correct":false},{"html":"Embed a credential rotation logic in the AWS Lambda, retrieving them from SSM","correct":false}],"multi":2,"analysis":"<p>Phân biệt 'tăng bảo mật nói chung' với 'đổi cơ chế authentication' cụ thể</p>","answer":"<p>IAM database authentication (gắn với IAM role trên Lambda) thay hẳn mật khẩu tĩnh bằng token ngắn hạn do AWS sinh ra.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: cần gắn IAM role cho Lambda thì mới có danh tính để IAM database authentication sinh token xác thực.</li><li><b>B. ✓</b> Đúng: IAM authentication sinh token tạm thời (15 phút) thay cho mật khẩu cố định — đúng yêu cầu 'short-lived credentials'.</li><li><b>C. ✗</b> Thắt chặt Security Group tăng bảo mật mạng nhưng KHÔNG thay đổi cơ chế xác thực (vẫn dùng user/password).</li><li><b>D. ✗</b> Deploy Lambda trong VPC chỉ ảnh hưởng tới network path, không liên quan tới authentication.</li><li><b>E. ✗</b> Tự xây logic rotate credential qua SSM là over-engineering khi RDS đã hỗ trợ sẵn IAM authentication.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Deploy Lambda trong VPC hay thắt chặt Security Group đều 'nghe' tăng bảo mật nhưng không đụng tới lớp authentication mà đề yêu cầu.</p>","tip":"<p>Câu hỏi về 'authentication/short-lived credentials' cho RDS → luôn nghĩ tới IAM database authentication, không phải network control (SG/VPC).</p>"},{"id":2,"topic":"Design High-Performing Architectures – AWS Lambda best practices","supplement":false,"stem":"The engineering team at an e-commerce company has been tasked with migrating to a serverless architecture. The team wants to focus on the key points of consideration when using AWS Lambda as a backbone for this architecture.<br>As a Solutions Architect, which of the following options would you identify as correct for the given requirement? (Select three)","options":[{"html":"Serverless architecture and containers complement each other but you cannot package and deploy AWS Lambda functions as container images","correct":false},{"html":"If you intend to reuse code in more than one AWS Lambda function, you should consider creating an AWS Lambda Layer for the reusable code","correct":true},{"html":"By default, AWS Lambda functions always operate from an AWS-owned VPC and hence have access to any public internet address or public AWS APIs. Once an AWS Lambda function is VPC-enabled, it will need a route through a Network Address Translation gateway (NAT gateway) in a public subnet to access public resources","correct":true},{"html":"The bigger your deployment package, the slower your AWS Lambda function will cold-start. Hence, AWS suggests packaging dependencies as a separate package from the actual AWS Lambda package","correct":false},{"html":"AWS Lambda allocates compute power in proportion to the memory you allocate to your function. AWS, thus recommends to over provision your function time out settings for the proper performance of AWS Lambda functions","correct":false},{"html":"Since AWS Lambda functions can scale extremely quickly, it's a good idea to deploy a Amazon CloudWatch Alarm that notifies your team when function metrics such as ConcurrentExecutions or Invocations exceeds the expected threshold","correct":true}],"multi":3,"analysis":"<p>Chọn đúng phát biểu True/False về best practice của Lambda</p>","answer":"<p>3 phát biểu đúng là: dùng Layer cho code dùng chung, VPC-enable cần NAT để ra public, và dùng CloudWatch Alarm theo dõi scale đột biến.</p>","explain":"<ul><li><b>A. ✗</b> Sai: Lambda HOÀN TOÀN có thể đóng gói và triển khai dưới dạng container image.</li><li><b>B. ✓</b> Đúng: nên tách code dùng chung thành Lambda Layer để gọn deployment package.</li><li><b>C. ✓</b> Đúng: Lambda mặc định chạy từ VPC do AWS quản lý, chỉ cần NAT gateway khi VPC-enable và cần ra tài nguyên public.</li><li><b>D. ✗</b> Sai: AWS đóng gói TẤT CẢ dependency chung 1 gói duy nhất, không khuyến nghị tách rời như phát biểu.</li><li><b>E. ✗</b> Sai: AWS khuyến nghị đặt timeout SÁT với thời gian chạy thực tế, không phải 'over-provision' timeout.</li><li><b>F. ✓</b> Đúng: nên đặt CloudWatch Alarm theo dõi ConcurrentExecutions/Invocations vì Lambda có thể scale rất nhanh.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Phát biểu 'tách dependency riêng để giảm cold-start' nghe hợp lý về mặt tối ưu nhưng SAI về thực tế đóng gói của Lambda — một dạng phủ định tinh vi.</p>","tip":"<p>Với câu 'chọn phát biểu ĐÚNG', luôn kiểm tra xem phát biểu có đảo ngược sự thật kỹ thuật (vd dependency tách riêng, time-out over-provision) hay không trước khi chọn.</p>"},{"id":3,"topic":"Design Resilient Architectures – ElastiCache Redis Multi-AZ for DR","supplement":false,"stem":"A media company uses Amazon ElastiCache Redis to enhance the performance of its Amazon RDS database layer. The company wants a robust disaster recovery strategy for its caching layer that guarantees minimal downtime as well as minimal data loss while ensuring good application performance.<br>Which of the following solutions will you recommend to address the given use-case?","options":[{"html":"Schedule manual backups using Redis append-only file (AOF)","correct":false},{"html":"Schedule daily automatic backups at a time when you expect low resource utilization for your cluster","correct":false},{"html":"Opt for Multi-AZ configuration with automatic failover functionality to help mitigate failure","correct":true},{"html":"Add read-replicas across multiple availability zones (AZs) to reduce the risk of potential data loss because of failure","correct":false}],"multi":1,"analysis":"<p>Chọn chiến lược DR cho ElastiCache cân bằng downtime + data loss + performance</p>","answer":"<p>Multi-AZ tự động failover sang node khoẻ mạnh nên downtime và mất dữ liệu đều ở mức thấp nhất, không cần thao tác thủ công.</p>","explain":"<ul><li><b>A. ✗</b> AOF giúp chống mất dữ liệu phần nào nhưng không chống được lỗi phần cứng của node cache.</li><li><b>B. ✗</b> Backup hàng ngày có thể mất tới gần 1 ngày dữ liệu nếu sự cố xảy ra trước lần backup kế tiếp.</li><li><b>C. ✓</b> Multi-AZ với automatic failover cho downtime thấp nhất và mất dữ liệu thấp nhất trong các lựa chọn.</li><li><b>D. ✗</b> Read replica giúp giảm tải đọc, không phải giải pháp fault-tolerance hoàn chỉnh khi node chính lỗi.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> AOF và read-replica đều 'có vẻ' liên quan đến chống mất dữ liệu nhưng không giải quyết được trường hợp lỗi phần cứng của node chính.</p>","tip":"<p>DR cho ElastiCache ưu tiên downtime+data loss thấp nhất → Multi-AZ automatic failover; AOF/backup chỉ hỗ trợ khôi phục thủ công, chậm hơn.</p>"},{"id":4,"topic":"Design High-Performing Architectures – AWS Global Accelerator static IP whitelisting","supplement":false,"stem":"A company uses Application Load Balancers in multiple AWS Regions. The Application Load Balancers receive inconsistent traffic that varies throughout the year. The engineering team at the company needs to allow the IP addresses of the Application Load Balancers in the on-premises firewall to enable connectivity.<br>Which of the following represents the MOST scalable solution with minimal configuration changes?","options":[{"html":"Develop an AWS Lambda script to get the IP addresses of the Application Load Balancers in different Regions. Configure the on-premises firewall's rule to allow the IP addresses of the Application Load Balancers","correct":false},{"html":"Set up a Network Load Balancer in one Region. Register the private IP addresses of the Application Load Balancers in different Regions with the Network Load Balancer. Configure the on-premises firewall's rule to allow the Elastic IP address attached to the Network Load Balancer","correct":false},{"html":"Set up AWS Global Accelerator. Register the Application Load Balancers in different Regions to the AWS Global Accelerator. Configure the on-premises firewall's rule to allow static IP addresses associated with the AWS Global Accelerator","correct":true},{"html":"Migrate all Application Load Balancers in different Regions to the Network Load Balancers. Configure the on-premises firewall's rule to allow the Elastic IP addresses of all the Network Load Balancers","correct":false}],"multi":1,"analysis":"<p>Whitelist firewall on-prem cho hạ tầng đa Region, thay đổi càng ít càng tốt</p>","answer":"<p>Global Accelerator cung cấp 2 IP tĩnh cố định bất kể số Region/endpoint phía sau, nên chỉ cấu hình firewall một lần.</p>","explain":"<ul><li><b>A. ✗</b> Phải liên tục cập nhật firewall mỗi khi IP của ALB đổi — không ổn định, nhiều vận hành.</li><li><b>B. ✗</b> NLB chỉ hoạt động trong 1 Region, không thể đại diện cho ALB ở nhiều Region khác nhau.</li><li><b>C. ✓</b> Global Accelerator cấp 2 IP tĩnh anycast — chỉ cần cấu hình firewall 1 lần duy nhất cho mọi Region.</li><li><b>D. ✗</b> Đổi hết ALB sang NLB vẫn cần cấu hình lại firewall cho nhiều NLB khác nhau, không giảm được số IP cần allow.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Giải pháp tự viết Lambda lấy IP ALB nghe 'tự động hoá' nhưng vẫn phải sửa firewall liên tục mỗi khi IP thay đổi — không scalable.</p>","tip":"<p>Cần IP tĩnh ổn định để whitelist firewall cho hạ tầng đa Region/đổi liên tục → Global Accelerator, không phải tự động lấy IP bằng script.</p>"},{"id":5,"topic":"Design Resilient Architectures – Disaster Recovery - Warm Standby","supplement":false,"stem":"A financial services firm has traditionally operated with an on-premise data center and would like to create a disaster recovery strategy leveraging the AWS Cloud.<br>As a Solutions Architect, you would like to ensure that a scaled-down version of a fully functional environment is always running in the AWS cloud, and in case of a disaster, the recovery time is kept to a minimum. Which disaster recovery strategy is that?","options":[{"html":"Backup and Restore","correct":false},{"html":"Multi Site","correct":false},{"html":"Warm Standby","correct":true},{"html":"Pilot Light","correct":false}],"multi":1,"analysis":"<p>Phân biệt 4 mức DR theo mức độ 'đang chạy sẵn' trên cloud</p>","answer":"<p>Warm Standby = bản scaled-down NHƯNG đầy đủ chức năng và luôn bật, đúng khớp với mô tả đề bài.</p>","explain":"<ul><li><b>A. ✗</b> Backup and Restore là chiến lược chậm nhất, không có môi trường nào chạy sẵn trên cloud.</li><li><b>B. ✗</b> Multi Site chạy active-active đầy đủ cả 2 nơi — mạnh hơn mức 'scaled-down' mà đề yêu cầu.</li><li><b>C. ✓</b> Warm Standby đúng định nghĩa: môi trường thu nhỏ nhưng LUÔN chạy sẵn trên cloud.</li><li><b>D. ✗</b> Pilot Light chỉ giữ lõi hệ thống (lõi dữ liệu), chưa phải 'bản thu nhỏ đầy đủ chức năng' đang chạy.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Multi Site và Pilot Light đều liên quan DR nhưng lệch mức: Multi Site mạnh/tốn hơn hẳn yêu cầu, Pilot Light yếu hơn (chỉ lõi, chưa 'đầy đủ chức năng').</p>","tip":"<p>4 mức DR tăng dần theo RTO/chi phí: Backup &amp; Restore &lt; Pilot Light &lt; Warm Standby &lt; Multi-Site Active/Active. 'Scaled-down nhưng luôn chạy, đủ chức năng' = Warm Standby.</p>"},{"id":6,"topic":"Design Resilient Architectures – VPC Peering - cost-effective VPC interconnect","supplement":false,"stem":"A small rental company had 5 employees, all working under the same AWS cloud account. These employees deployed their applications built for various functions- including billing, operations, finance, etc. Each of these employees has been operating in their own VPC. Now, there is a need to connect these VPCs so that the applications can communicate with each other.<br>Which of the following is the MOST cost-effective solution for this use-case?","options":[{"html":"Use a VPC peering connection","correct":true},{"html":"Use a Network Address Translation gateway (NAT gateway)","correct":false},{"html":"Use an Internet Gateway","correct":false},{"html":"Use an AWS Direct Connect connection","correct":false}],"multi":1,"analysis":"<p>Chọn giải pháp rẻ nhất để nối vài VPC trong cùng 1 account</p>","answer":"<p>Với số lượng VPC nhỏ (5 VPC), VPC Peering là cách rẻ và đơn giản nhất, không phát sinh phí giờ chạy.</p>","explain":"<ul><li><b>A. ✓</b> VPC Peering kết nối trực tiếp giữa các VPC, không tính phí hạ tầng theo giờ, chỉ tính phí data transfer.</li><li><b>B. ✗</b> NAT Gateway dùng cho private subnet ra internet, không phải để nối 2 VPC với nhau.</li><li><b>C. ✗</b> Internet Gateway chỉ cho VPC ra internet, không phục vụ kết nối VPC-VPC.</li><li><b>D. ✗</b> Direct Connect dùng để nối on-premises với AWS, quá tốn kém và dư thừa cho việc nối vài VPC trong cùng account.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Direct Connect nghe 'chuyên nghiệp' nhưng được thiết kế cho kết nối on-prem, hoàn toàn sai mục đích và đắt đỏ không cần thiết ở đây.</p>","tip":"<p>Số VPC ít (&lt;10), cùng tổ chức → VPC Peering là lựa chọn rẻ nhất; nhiều VPC hơn mới cần Transit Gateway.</p>"},{"id":7,"topic":"Design Cost-Optimized Architectures – S3 encryption - KMS customer managed key rotation","supplement":false,"stem":"An e-commerce analytics company is preparing to archive several years of transaction records and customer analytics reports in Amazon S3 for long-term storage. To meet compliance requirements, the archived data must be encrypted at rest. Additionally, the solution must be cost-effective and ensure that key rotation occurs automatically every 12 months to comply with the company’s internal data governance policy.<br>Which solution will meet these requirements with the least operational overhead?","options":[{"html":"Use Amazon S3 server-side encryption with S3-managed keys (SSE-S3). Upload data with default encryption enabled. Rely on the built-in key management and rotation behavior of SSE-S3","correct":false},{"html":"Use AWS Key Management Service (KMS) to create a customer managed key with automatic rotation enabled. Configure the S3 bucket’s default encryption to use the customer managed key. Migrate the data to the S3 bucket","correct":true},{"html":"Encrypt the data locally using client-side encryption libraries and upload the encrypted files to S3. Create a KMS key with imported key material and configure key rotation settings","correct":false},{"html":"Use AWS CloudHSM to generate encryption keys. Configure S3 to use these custom encryption keys via client-side encryption and rotate the keys annually using an on-premises key management workflow","correct":false}],"multi":1,"analysis":"<p>Mã hoá bắt buộc + rotate key tự động định kỳ, ít thao tác vận hành nhất</p>","answer":"<p>Customer managed key trong KMS với automatic rotation đáp ứng đúng cả 2 tiêu chí: mã hoá và rotate hàng năm tự động.</p>","explain":"<ul><li><b>A. ✗</b> SSE-S3 dùng key do AWS quản lý, không thể cấu hình/kiểm chứng chu kỳ rotate theo yêu cầu compliance 12 tháng.</li><li><b>B. ✓</b> KMS customer managed key bật automatic rotation: AWS tự rotate mỗi năm, không cần thao tác thủ công, vẫn audit được qua CloudTrail.</li><li><b>C. ✗</b> Key nhập từ ngoài vào (imported key material) KHÔNG hỗ trợ automatic rotation — phải tự rotate và re-import thủ công.</li><li><b>D. ✗</b> CloudHSM đòi hỏi tự quản lý hạ tầng khoá, backup, rotation thủ công — ngược với yêu cầu 'ít vận hành nhất'.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> SSE-S3 'miễn phí, đơn giản' nhưng không kiểm soát/audit được chu kỳ rotate — không đáp ứng yêu cầu compliance cụ thể về rotation.</p>","tip":"<p>Cần rotate key tự động, có thể audit, theo chu kỳ cụ thể → KMS customer managed key + automatic rotation, không phải SSE-S3 hay key tự import.</p>"},{"id":8,"topic":"Design Secure Architectures – Direct Connect primary + Site-to-Site VPN backup","supplement":false,"stem":"A company wants to adopt a hybrid cloud infrastructure where it uses some AWS services such as Amazon S3 alongside its on-premises data center. The company wants a dedicated private connection between the on-premise data center and AWS. In case of failures though, the company needs to guarantee uptime and is willing to use the public internet for an encrypted connection.<br>What do you recommend? (Select two)","options":[{"html":"Use AWS Direct Connect connection as a backup connection","correct":false},{"html":"Use AWS Site-to-Site VPN as a backup connection","correct":true},{"html":"Use AWS Site-to-Site VPN as a primary connection","correct":false},{"html":"Use Egress Only Internet Gateway as a backup connection","correct":false},{"html":"Use AWS Direct Connect connection as a primary connection","correct":true}],"multi":2,"analysis":"<p>Ghép đúng vai trò Primary/Backup cho 2 dịch vụ kết nối hybrid</p>","answer":"<p>Direct Connect (riêng tư, hiệu năng cao) đóng vai trò primary; Site-to-Site VPN (qua internet, có mã hoá) đóng vai trò backup khi Direct Connect gặp sự cố.</p>","explain":"<ul><li><b>A. ✗</b> Sai vai trò: Direct Connect là lựa chọn tốt cho PRIMARY (riêng tư, hiệu năng cao), dùng làm backup thì lãng phí không cần thiết.</li><li><b>B. ✓</b> Đúng: VPN qua internet công cộng, mã hoá sẵn (IPSec), phù hợp làm phương án dự phòng khi Direct Connect lỗi.</li><li><b>C. ✗</b> Đề yêu cầu kết nối riêng tư (dedicated) làm chính — VPN qua internet không nên là primary.</li><li><b>D. ✗</b> Egress-Only IGW chỉ dùng cho IPv6 outbound ra internet, không kết nối được on-prem với AWS.</li><li><b>E. ✓</b> Đúng: Direct Connect là kết nối riêng tư, dành riêng — đúng vai trò primary theo yêu cầu đề bài.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Đảo ngược vai trò — dùng Direct Connect làm backup (tốn kém, dư thừa) hoặc VPN làm primary (không đúng yêu cầu 'dedicated') đều là bẫy đánh vào việc đọc lướt đề.</p>","tip":"<p>Khi đề có cặp 'kết nối riêng tư + phương án dự phòng qua internet': riêng tư/dedicated luôn là Primary, VPN qua internet luôn là Backup.</p>"},{"id":9,"topic":"Design High-Performing Architectures – Amazon Neptune graph database","supplement":false,"stem":"The development team at a social media company wants to handle some complicated queries such as &quot;What are the number of likes on the videos that have been posted by friends of a user A?&quot;.<br>As a solutions architect, which of the following AWS database services would you suggest as the BEST fit to handle such use cases?","options":[{"html":"Amazon Aurora","correct":false},{"html":"Amazon Neptune","correct":true},{"html":"Amazon Redshift","correct":false},{"html":"Amazon OpenSearch Service","correct":false}],"multi":1,"analysis":"<p>Nhận diện use-case 'quan hệ nhiều tầng' (graph) để chọn đúng loại database</p>","answer":"<p>Câu hỏi về mối quan hệ giữa các thực thể (user-friend-like) là bài toán graph điển hình, đúng sở trường của Neptune.</p>","explain":"<ul><li><b>A. ✗</b> Aurora là relational database, không tối ưu cho truy vấn quan hệ nhiều tầng (bạn của bạn...).</li><li><b>B. ✓</b> Neptune là graph database chuyên biệt, xử lý truy vấn quan hệ phức tạp với độ trễ mili-giây.</li><li><b>C. ✗</b> Redshift là data warehouse cho phân tích khối lượng lớn, không phải cho truy vấn quan hệ mạng xã hội thời gian thực.</li><li><b>D. ✗</b> OpenSearch chuyên cho tìm kiếm/log analytics, không phải mô hình dữ liệu đồ thị (graph).</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Aurora/Redshift đều là database 'mạnh' nhưng không có mô hình dữ liệu đồ thị để xử lý truy vấn nhiều tầng quan hệ hiệu quả.</p>","tip":"<p>Câu hỏi có từ khoá 'mối quan hệ', 'bạn của bạn', 'mạng liên kết' → nghĩ ngay tới Amazon Neptune (graph database).</p>"},{"id":10,"topic":"Design Secure Architectures – RDS SSL/TLS for data-in-transit","supplement":false,"stem":"A retail company uses AWS Cloud to manage its technology infrastructure. The company has deployed its consumer-focused web application on Amazon EC2-based web servers and uses Amazon RDS PostgreSQL database as the data store. The PostgreSQL database is set up in a private subnet that allows inbound traffic from selected Amazon EC2 instances. The database also uses AWS Key Management Service (AWS KMS) for encrypting data at rest.<br>Which of the following steps would you recommend to facilitate end-to-end security for the data-in-transit while accessing the database?","options":[{"html":"Configure Amazon RDS to use SSL for data in transit","correct":true},{"html":"Use IAM authentication to access the database instead of the database user's access credentials","correct":false},{"html":"Create a new network access control list (network ACL) that blocks SSH from the entire Amazon EC2 subnet into the database","correct":false},{"html":"Create a new security group that blocks SSH from the selected Amazon EC2 instances into the database","correct":false}],"multi":1,"analysis":"<p>Chọn đúng cơ chế bảo vệ cho ĐÚNG lớp bảo mật được hỏi (in-transit)</p>","answer":"<p>SSL/TLS là cơ chế trực tiếp mã hoá dữ liệu khi di chuyển giữa EC2 và RDS, đúng với yêu cầu 'data-in-transit'.</p>","explain":"<ul><li><b>A. ✓</b> Bật SSL/TLS mã hoá trực tiếp kết nối application↔RDS — đúng trọng tâm 'data-in-transit'.</li><li><b>B. ✗</b> IAM authentication chỉ thay cách xác thực (không cần password), không tự động mã hoá đường truyền.</li><li><b>C. ✗</b> Không thể SSH vào RDS instance — NACL chặn SSH là phương án không liên quan (distractor).</li><li><b>D. ✗</b> Tương tự, Security Group chặn SSH vào RDS cũng là distractor vì RDS vốn không hỗ trợ SSH.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các lựa chọn chặn SSH vào RDS là bẫy hoàn toàn vô nghĩa — RDS không phải là máy chủ SSH được.</p>","tip":"<p>Mã hoá dữ liệu khi di chuyển (in-transit) tới RDS → bật SSL/TLS; mã hoá lúc nghỉ (at-rest) → KMS; đổi cách đăng nhập → IAM authentication (khác mục đích).</p>"},{"id":11,"topic":"Design Secure Architectures – VPC troubleshooting - IGW route + SG ping","supplement":false,"stem":"A company has recently created a new department to handle their services workload. An IT team has been asked to create a custom VPC to isolate the resources created in this new department. They have set up the public subnet and internet gateway (IGW). However, they are not able to ping the Amazon EC2 instances with elastic IP address (EIP) launched in the newly created VPC.<br>As a Solutions Architect, the team has requested your help. How will you troubleshoot this scenario? (Select two)","options":[{"html":"Check if the route table is configured with internet gateway","correct":true},{"html":"Contact AWS support to map your VPC with subnet","correct":false},{"html":"Create a secondary internet gateway to attach with public subnet and move the current internet gateway to private and write route tables","correct":false},{"html":"Check if the security groups allow ping from the source","correct":true},{"html":"Disable Source / Destination check on the Amazon EC2 instance","correct":false}],"multi":2,"analysis":"<p>Troubleshoot kết nối internet cơ bản: route table + security group</p>","answer":"<p>Hai điều kiện bắt buộc để ping một EC2 có EIP thành công là route trỏ IGW và SG cho phép ICMP — thiếu 1 trong 2 là tắc nghẽn.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: route table của subnet phải có route trỏ tới Internet Gateway thì traffic ra/vào internet mới đi được.</li><li><b>B. ✗</b> Không có khái niệm 'liên hệ AWS support để map VPC với subnet' — subnet vốn thuộc VPC theo cấu hình của bạn.</li><li><b>C. ✗</b> Không tồn tại 'secondary Internet Gateway' — mỗi VPC chỉ gắn được 1 IGW.</li><li><b>D. ✓</b> Đúng: Security Group (stateful) phải cho phép traffic ICMP (ping) thì request mới được chấp nhận.</li><li><b>E. ✗</b> Source/Destination check chỉ liên quan tới NAT/router instance, không ảnh hưởng tới việc ping một EC2 bình thường.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Disable Source/Destination check nghe liên quan tới networking nhưng thực chất chỉ áp dụng cho instance đóng vai trò NAT/router, không áp dụng ở đây.</p>","tip":"<p>Checklist EC2 không ping/kết nối được: route table → IGW, Security Group cho phép traffic, NACL 2 chiều, và instance có public/Elastic IP.</p>"},{"id":12,"topic":"Design Secure Architectures – ALB SSL SNI for multiple domains","supplement":false,"stem":"A CRM web application was written as a monolith in PHP and is facing scaling issues because of performance bottlenecks. The CTO wants to re-engineer towards microservices architecture and expose their application from the same load balancer, linked to different target groups with different URLs: checkout.mycorp.com, www.mycorp.com, yourcorp.com/profile and yourcorp.com/search. The CTO would like to expose all these URLs as HTTPS endpoints for security purposes.<br>As a solutions architect, which of the following would you recommend as a solution that requires MINIMAL configuration effort?","options":[{"html":"Change the Elastic Load Balancing (ELB) SSL Security Policy","correct":false},{"html":"Use Secure Sockets Layer certificate (SSL certificate) with SNI","correct":true},{"html":"Use an HTTP to HTTPS redirect","correct":false},{"html":"Use a wildcard Secure Sockets Layer certificate (SSL certificate)","correct":false}],"multi":1,"analysis":"<p>Phục vụ nhiều domain khác nhau bằng 1 load balancer, ít cấu hình nhất</p>","answer":"<p>SNI cho phép ALB chọn đúng chứng chỉ theo tên miền trong mỗi request, nên có thể gắn nhiều chứng chỉ cho nhiều domain khác nhau trên cùng 1 listener.</p>","explain":"<ul><li><b>A. ✗</b> Đổi SSL Security Policy chỉ ảnh hưởng cipher/protocol được hỗ trợ, không giải quyết việc phục vụ nhiều domain.</li><li><b>B. ✓</b> SNI cho phép gắn nhiều chứng chỉ (nhiều domain khác nhau) vào CÙNG một listener của ALB, cấu hình đơn giản nhất.</li><li><b>C. ✗</b> Redirect HTTP→HTTPS không tạo ra nhiều HTTPS endpoint cho các domain khác nhau.</li><li><b>D. ✗</b> Wildcard certificate chỉ phủ các subdomain cùng pattern, không phủ được domain khác hẳn (vd yourcorp.com khác mycorp.com).</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Wildcard certificate nghe như giải quyết được 'nhiều domain' nhưng chỉ bao phủ các subdomain cùng gốc, không bao phủ domain gốc khác (yourcorp.com khác mycorp.com).</p>","tip":"<p>Nhiều domain KHÁC NHAU (không cùng gốc) trên 1 load balancer → SNI (multiple certs/listener). Nhiều subdomain CÙNG gốc → wildcard certificate.</p>"},{"id":13,"topic":"Design Cost-Optimized Architectures – Storage Gateway Cached Volumes","supplement":false,"stem":"A healthcare provider is experiencing rapid data growth in its on-premises servers due to increased patient imaging and record retention requirements. The organization wants to extend its storage capacity to AWS in a way that preserves quick access to critical records, including from its local file systems. The company must optimize bandwidth usage during migration and avoid any retrieval fees or delays when accessing the data in the cloud. The provider wants a hybrid cloud solution that requires minimal application reconfiguration, allows frequent local access to key datasets, and ensures that cloud storage costs remain predictable without paying extra for data retrieval.<br>Which AWS solution best meets these requirements?","options":[{"html":"Deploy AWS Storage Gateway using cached volumes. Store frequently accessed data locally, while writing all primary data asynchronously to Amazon S3","correct":true},{"html":"Set up Amazon S3 Standard-Infrequent Access (S3 Standard-IA) as the primary storage tier. Configure the on-premises file server to replicate changes to the S3 bucket using AWS DataSync for asynchronous updates","correct":false},{"html":"Deploy AWS Storage Gateway using stored volumes. Retain the full dataset on-premises and asynchronously back up point-in-time snapshots to Amazon S3. Configure applications to read from the local volume and recover data from the cloud if needed","correct":false},{"html":"Implement Amazon FSx for Windows File Server and configure on-premises servers to mount the file system using a VPN connection. Store all primary data in FSx and use it as the central NAS replacement","correct":false}],"multi":1,"analysis":"<p>Phân biệt 2 kiểu Storage Gateway: Cached Volumes vs Stored Volumes</p>","answer":"<p>Cached Volumes lưu phần lớn dữ liệu trên S3 và chỉ cache phần hay truy cập cục bộ — tối ưu đúng cả băng thông, chi phí và tốc độ truy cập.</p>","explain":"<ul><li><b>A. ✓</b> Cached Volumes: dữ liệu chính nằm trên S3, chỉ cache phần hay dùng tại chỗ — đúng yêu cầu tối ưu băng thông + truy cập nhanh local.</li><li><b>B. ✗</b> S3 Standard-IA tính phí retrieval mỗi lần truy cập, vi phạm yêu cầu 'không phát sinh phí retrieval'.</li><li><b>C. ✗</b> Stored Volumes vẫn giữ TOÀN BỘ dữ liệu tại chỗ, S3 chỉ là nơi backup — không giảm được nhu cầu lưu trữ local như đề cần.</li><li><b>D. ✗</b> FSx qua VPN gây độ trễ cao và không tối ưu băng thông vì mọi I/O đều phải đi qua mạng.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Stored Volumes rất dễ nhầm với Cached Volumes: Stored giữ TOÀN BỘ dữ liệu ở local (chỉ backup sang S3), ngược hẳn với yêu cầu mở rộng dung lượng lên cloud.</p>","tip":"<p>Muốn local lưu ít, cloud (S3) là nguồn chính → Cached Volumes. Muốn local giữ toàn bộ, cloud chỉ để backup → Stored Volumes.</p>"},{"id":14,"topic":"Design Resilient Architectures – S3 Multipart Upload for large files","supplement":false,"stem":"A digital media company needs to manage uploads of around 1 terabyte each from an application being used by a partner company.<br>As a Solutions Architect, how will you handle the upload of these files to Amazon S3?","options":[{"html":"Use Amazon S3 Versioning","correct":false},{"html":"Use AWS Direct Connect to provide extra bandwidth","correct":false},{"html":"Use multi-part upload feature of Amazon S3","correct":true},{"html":"Use AWS Snowball","correct":false}],"multi":1,"analysis":"<p>Upload file lớn (&gt;100MB, đặc biệt &gt;5GB) lên S3 hiệu quả</p>","answer":"<p>Multi-part upload là tính năng built-in của S3, cho phép chia nhỏ, upload song song và retry từng phần khi file rất lớn (1TB).</p>","explain":"<ul><li><b>A. ✗</b> S3 Versioning quản lý phiên bản object, không liên quan đến cách upload file lớn.</li><li><b>B. ✗</b> Direct Connect mất hàng tuần để thiết lập, không phải giải pháp cho một nhu cầu upload file (dù lớn) qua ứng dụng.</li><li><b>C. ✓</b> Multi-part upload là tính năng S3 có sẵn, chia nhỏ file để upload song song/phục hồi khi lỗi — đúng chuẩn cho file 1TB.</li><li><b>D. ✗</b> Snowball dùng để chuyển dữ liệu VẬT LÝ số lượng lớn (TB-PB) một lần, không phù hợp cho luồng upload liên tục từ ứng dụng của đối tác.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Snowball nghe hợp lý cho 'dữ liệu lớn' nhưng đó là giải pháp vận chuyển vật lý một lần, không phải cho luồng upload liên tục qua ứng dụng.</p>","tip":"<p>File &gt; 100MB nên dùng multi-part upload; file &gt; 5GB thì BẮT BUỘC phải dùng multi-part upload khi tải lên S3.</p>"},{"id":15,"topic":"Design High-Performing Architectures – NLB cross-zone load balancing disabled","supplement":false,"stem":"Amazon Route 53 is configured to route traffic to two Network Load Balancer nodes belonging to two Availability Zones (AZs): AZ-A and AZ-B. Cross-zone load balancing is disabled. AZ-A has four targets and AZ-B has six targets.<br>Which of the below statements is true about traffic distribution to the target instances from Amazon Route 53?","options":[{"html":"Each of the four targets in AZ-A receives 10% of the traffic","correct":false},{"html":"Each of the six targets in AZ-B receives 10% of the traffic","correct":false},{"html":"Each of the four targets in AZ-A receives 8% of the traffic","correct":false},{"html":"Each of the four targets in AZ-A receives 12.5% of the traffic","correct":true}],"multi":1,"analysis":"<p>Tính phần trăm traffic khi cross-zone load balancing bị TẮT</p>","answer":"<p>Khi tắt cross-zone, mỗi node LB (50% traffic tổng) chỉ chia cho các target TRONG CÙNG AZ của nó: 50%/4 = 12.5% cho mỗi target AZ-A.</p>","explain":"<ul><li><b>A. ✗</b> Sai số: mỗi node LB nhận 50% traffic, chia cho 4 target trong AZ-A ra 12.5%, không phải 10%.</li><li><b>B. ✗</b> Sai số: 50% chia cho 6 target ở AZ-B ra 8.3%, không phải 10%.</li><li><b>C. ✗</b> Sai số: AZ-A nhận 12.5%/target chứ không phải 8% (8% là số đúng của AZ-B làm tròn).</li><li><b>D. ✓</b> Đúng: mỗi load balancer node nhận 50% traffic, chia đều cho 4 target trong AZ-A cùng node đó = 12.5%/target.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các đáp án đều dùng số liệu đúng của AZ khác hoặc làm tròn sai để đánh lừa phép tính (8% thực chất là của AZ-B, không phải AZ-A).</p>","tip":"<p>Cross-zone TẮT: mỗi AZ coi như độc lập 50% traffic/số AZ, rồi chia tiếp cho SỐ TARGET TRONG AZ ĐÓ (không phải tổng số target 2 AZ).</p>"},{"id":16,"topic":"Design Secure Architectures – IAM resource-based policy (role trust policy)","supplement":false,"stem":"A systems administrator is creating IAM policies and attaching them to IAM identities. After creating the necessary identity-based policies, the administrator is now creating resource-based policies.<br>Which is the only resource-based policy that the IAM service supports?","options":[{"html":"Trust policy","correct":true},{"html":"Access control list (ACL)","correct":false},{"html":"AWS Organizations Service Control Policies (SCP)","correct":false},{"html":"Permissions boundary","correct":false}],"multi":1,"analysis":"<p>Phân biệt các loại policy: identity-based, resource-based, SCP, permissions boundary</p>","answer":"<p>IAM role vừa là identity vừa là resource, nên cần trust policy (resource-based) để xác định ai được assume role đó — đây là loại duy nhất IAM hỗ trợ.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: trust policy gắn vào IAM role là loại resource-based policy DUY NHẤT mà dịch vụ IAM hỗ trợ.</li><li><b>B. ✗</b> ACL là resource-based policy nhưng thuộc về S3/WAF/VPC, không phải của dịch vụ IAM.</li><li><b>C. ✗</b> SCP thuộc AWS Organizations, giới hạn quyền tối đa cho account/OU, không phải resource-based policy của IAM.</li><li><b>D. ✗</b> Permissions boundary là một dạng managed policy giới hạn quyền tối đa của identity, không phải resource-based policy.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> ACL, SCP, permissions boundary đều là các loại policy hợp lệ trong AWS nhưng KHÔNG thuộc phạm vi 'resource-based policy của dịch vụ IAM'.</p>","tip":"<p>Resource-based policy của riêng IAM = trust policy (trên role). ACL (S3/VPC/WAF), SCP (Organizations), permissions boundary (identity) đều là khái niệm khác.</p>"},{"id":17,"topic":"Design High-Performing Architectures – AWS CloudFormation for reusable IaC templates","supplement":false,"stem":"You started a new job as a solutions architect at a company that has both AWS experts and people learning AWS. Recently, a developer misconfigured a newly created Amazon RDS database which resulted in a production outage.<br>How can you ensure that Amazon RDS specific best practices are incorporated into a reusable infrastructure template to be used by all your AWS users?","options":[{"html":"Store your recommendations in a custom AWS Trusted Advisor rule","correct":false},{"html":"Use AWS CloudFormation to manage Amazon RDS databases","correct":true},{"html":"Attach an IAM policy to interns preventing them from creating an Amazon RDS database","correct":false},{"html":"Create an AWS Lambda function which sends emails when it finds misconfigured Amazon RDS databases","correct":false}],"multi":1,"analysis":"<p>Chuẩn hoá best-practice thành hạ tầng tái sử dụng (IaC) thay vì chặn/giám sát từng người</p>","answer":"<p>CloudFormation cho phép đóng gói best practice RDS vào 1 template dùng chung, đảm bảo mọi người tạo RDS đều đúng chuẩn ngay từ đầu.</p>","explain":"<ul><li><b>A. ✗</b> Trusted Advisor chỉ đưa ra khuyến nghị, không tạo được template hạ tầng tái sử dụng.</li><li><b>B. ✓</b> CloudFormation cho phép mô hình hoá best practice thành template IaC, tái sử dụng cho mọi người dùng — đúng yêu cầu.</li><li><b>C. ✗</b> Chặn 1 nhóm người (interns) không giải quyết gốc rễ: vẫn cần cách để MỌI người dùng đúng cấu hình chuẩn.</li><li><b>D. ✗</b> Lambda gửi email khi phát hiện lỗi là cách phản ứng SAU khi sự cố đã xảy ra, không phải tạo template chuẩn trước.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Giải pháp 'chặn quyền intern' nghe như ngăn được lỗi nhưng chỉ xử lý 1 nhóm nhỏ, không giải quyết bài toán 'template tái sử dụng cho MỌI người dùng'.</p>","tip":"<p>Yêu cầu 'reusable infrastructure template' luôn trỏ tới Infrastructure as Code (CloudFormation/CDK/Terraform), không phải policy chặn quyền hay cảnh báo phản ứng.</p>"},{"id":18,"topic":"Design Resilient Architectures – Elastic Beanstalk Golden AMI + user data","supplement":false,"stem":"Your company is deploying a website running on AWS Elastic Beanstalk. The website takes over 45 minutes for the installation and contains both static as well as dynamic files that must be generated during the installation process.<br>As a Solutions Architect, you would like to bring the time to create a new instance in your AWS Elastic Beanstalk deployment to be less than 2 minutes. Which of the following options should be combined to build a solution for this requirement? (Select two)","options":[{"html":"Use Amazon EC2 user data to customize the dynamic installation parts at boot time","correct":true},{"html":"Use AWS Elastic Beanstalk deployment caching feature","correct":false},{"html":"Create a Golden Amazon Machine Image (AMI) with the static installation components already setup","correct":true},{"html":"Store the installation files in Amazon S3 so they can be quickly retrieved","correct":false},{"html":"Use Amazon EC2 user data to install the application at boot time","correct":false}],"multi":2,"analysis":"<p>Rút ngắn thời gian khởi tạo instance: tách phần tĩnh (AMI) và phần động (user data)</p>","answer":"<p>Golden AMI dựng sẵn phần tĩnh giúp bỏ qua bước cài đặt nặng; user data chỉ xử lý phần cấu hình động còn lại — tổng thời gian còn vài phút.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: dùng user data chỉ để tuỳ biến phần ĐỘNG lúc boot, không cài đặt lại toàn bộ.</li><li><b>B. ✗</b> 'Elastic Beanstalk deployment caching feature' là tên tính năng BỊA, không tồn tại trong AWS.</li><li><b>C. ✓</b> Đúng: Golden AMI dựng sẵn các thành phần TĨNH, instance khởi động gần như tức thì từ AMI đó.</li><li><b>D. ✗</b> Lưu file cài đặt trên S3 giúp tải nhanh hơn nhưng vẫn phải chạy cài đặt tốn ~45 phút, không giải quyết gốc vấn đề.</li><li><b>E. ✗</b> Dùng user data để cài ĐẶT TOÀN BỘ ứng dụng lúc boot vẫn mất ~45 phút như cũ, không đạt mục tiêu &lt;2 phút.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> 'AWS Elastic Beanstalk deployment caching feature' là cái tên nghe rất hợp lý nhưng hoàn toàn không tồn tại — một dạng bẫy tên dịch vụ bịa đặt.</p>","tip":"<p>Giảm thời gian khởi tạo instance nặng cài đặt: tách phần KHÔNG đổi vào Golden AMI, phần CÓ đổi xử lý bằng user data lúc boot.</p>"},{"id":19,"topic":"Design High-Performing Architectures – AWS DMS - S3 to Kinesis Data Streams bridge","supplement":false,"stem":"A Big Data analytics company writes data and log files in Amazon S3 buckets. The company now wants to stream the existing data files as well as any ongoing file updates from Amazon S3 to Amazon Kinesis Data Streams.<br>As a Solutions Architect, which of the following would you suggest as the fastest possible way of building a solution for this requirement?","options":[{"html":"Amazon S3 bucket actions can be directly configured to write data into Amazon Simple Notification Service (Amazon SNS). Amazon SNS can then be used to send the updates to Amazon Kinesis Data Streams","correct":false},{"html":"Leverage AWS Database Migration Service (AWS DMS) as a bridge between Amazon S3 and Amazon Kinesis Data Streams","correct":true},{"html":"Configure Amazon EventBridge events for the bucket actions on Amazon S3. An AWS Lambda function can then be triggered from the Amazon EventBridge event that will send the necessary data to Amazon Kinesis Data Streams","correct":false},{"html":"Leverage Amazon S3 event notification to trigger an AWS Lambda function for the file create event. The AWS Lambda function will then send the necessary data to Amazon Kinesis Data Streams","correct":false}],"multi":1,"analysis":"<p>Bắc cầu dữ liệu giữa 2 dịch vụ AWS mà không cần code tự viết, nhanh nhất</p>","answer":"<p>AWS DMS hỗ trợ sẵn S3 là nguồn và Kinesis Data Streams là đích, xử lý cả full load lẫn CDC mà không cần phát triển thêm.</p>","explain":"<ul><li><b>A. ✗</b> S3 không thể ghi trực tiếp vào SNS, và SNS cũng không gửi trực tiếp được tới Kinesis Data Streams.</li><li><b>B. ✓</b> DMS hỗ trợ sẵn S3 làm source và Kinesis làm target, cả dữ liệu cũ (full load) lẫn thay đổi mới (CDC) mà không cần code tự viết.</li><li><b>C. ✗</b> Cần bật CloudTrail object-level + tự viết Lambda để đẩy dữ liệu — nhiều công sức phát triển hơn hẳn.</li><li><b>D. ✗</b> Tương tự, dùng S3 event notification + Lambda tự viết tốn nhiều công sức phát triển hơn dùng tính năng có sẵn của DMS.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Các phương án dùng EventBridge/S3 event + Lambda nghe khả thi nhưng đòi hỏi viết code tuỳ biến — chậm hơn nhiều so với dùng tính năng có sẵn của DMS.</p>","tip":"<p>Cần 'bắc cầu' dữ liệu giữa 2 dịch vụ AWS nhanh nhất, ít code nhất → kiểm tra xem AWS DMS có hỗ trợ sẵn cặp nguồn/đích đó không trước khi nghĩ tới Lambda tự viết.</p>"},{"id":20,"topic":"Design Secure Architectures – S3 Object Lock Compliance + Glacier Vault Lock","supplement":false,"stem":"A financial services company is implementing two separate data retention policies to comply with regulatory standards:<br>Policy A: Critical transaction records must be immediately available for audit and must not be deleted or overwritten for 7 years.<br>Policy B: Archived compliance data must be stored in a low-cost, long-term storage solution and locked from deletion or modification for at least 10 years.<br>As a solutions architect, which combination of AWS features should you recommend to enforce these policies effectively?","options":[{"html":"Use Amazon S3 Standard storage class with S3 Lifecycle policies for Policy A, and S3 Glacier Flexible Retrieval for Policy B","correct":false},{"html":"Use Amazon S3 Glacier Vault Lock for both policies to reduce storage costs while enforcing retention","correct":false},{"html":"Use Amazon S3 Object Lock in Compliance mode for Policy A, and S3 Glacier Vault Lock for Policy B","correct":true},{"html":"Use Amazon S3 Object Lock in Governance mode for both policies to ensure data cannot be deleted prematurely","correct":false}],"multi":1,"analysis":"<p>Ghép đúng cơ chế WORM cho 2 policy có đặc tính truy cập khác nhau (nhanh vs lưu trữ dài hạn)</p>","answer":"<p>Object Lock Compliance phù hợp dữ liệu cần truy cập tức thời và bất biến tuyệt đối (Policy A); Vault Lock phù hợp dữ liệu archive giá rẻ, khoá dài hạn (Policy B).</p>","explain":"<ul><li><b>A. ✗</b> Lifecycle Policy chỉ chuyển tầng lưu trữ, KHÔNG ngăn được xoá/ghi đè — không đáp ứng yêu cầu bất biến (immutable).</li><li><b>B. ✗</b> Vault Lock chỉ dành cho Glacier (lưu trữ dài hạn), không phù hợp cho Policy A cần truy cập ngay lập tức để audit.</li><li><b>C. ✓</b> Đúng: Object Lock Compliance mode cho Policy A (truy cập nhanh + bất biến tuyệt đối), Vault Lock cho Policy B (lưu trữ rẻ, khoá dài hạn).</li><li><b>D. ✗</b> Governance mode vẫn cho phép user có quyền đặc biệt ghi đè/xoá — không đạt mức 'khoá chặt' mà cả 2 policy yêu cầu.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Lifecycle Policy hay bị nhầm là công cụ 'khoá' dữ liệu nhưng thực chất chỉ quản lý chuyển tầng lưu trữ/tự xoá theo thời gian, không ngăn xoá thủ công.</p>","tip":"<p>Cần WORM + truy cập ngay → S3 Object Lock (Compliance = tuyệt đối, Governance = có thể bypass). Cần WORM cho archive giá rẻ dài hạn → Glacier Vault Lock.</p>"},{"id":21,"topic":"Design Resilient Architectures – Route 53 TTL propagation delay","supplement":false,"stem":"A company has migrated its application from a monolith architecture to a microservices based architecture. The development team has updated the Amazon Route 53 simple record to point &quot;myapp.mydomain.com&quot; from the old Load Balancer to the new one.<br>The users are still not redirected to the new Load Balancer. What has gone wrong in the configuration?","options":[{"html":"The health checks are failing","correct":false},{"html":"The CNAME Record is misconfigured","correct":false},{"html":"The Alias Record is misconfigured","correct":false},{"html":"The Time To Live (TTL) is still in effect","correct":true}],"multi":1,"analysis":"<p>Thay đổi DNS record nhưng chưa có hiệu lực ngay — nghĩ tới TTL cache</p>","answer":"<p>DNS resolver cache giá trị cũ theo TTL đã cấu hình; record đã đổi nhưng user vẫn thấy giá trị cũ cho tới khi TTL hết hạn.</p>","explain":"<ul><li><b>A. ✗</b> Simple record không có health check, nên đây không phải nguyên nhân.</li><li><b>B. ✗</b> Đề không nói dùng CNAME record, đây là phương án đánh lạc hướng.</li><li><b>C. ✗</b> Đề không nói dùng Alias record, đây cũng là phương án đánh lạc hướng.</li><li><b>D. ✓</b> Đúng: TTL cũ vẫn còn hiệu lực trong cache của resolver, nên user vẫn nhận địa chỉ cũ cho tới khi TTL hết hạn.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> CNAME/Alias/health check đều là khái niệm Route 53 hợp lệ nhưng không liên quan gì tới tình huống 'vừa đổi record, DNS cũ vẫn còn hiệu lực'.</p>","tip":"<p>Đổi DNS record nhưng traffic chưa chuyển ngay → luôn nghĩ tới TTL cache trước; giảm TTL xuống thấp (vd 300s) TRƯỚC khi đổi record quan trọng.</p>"},{"id":22,"topic":"Design Secure Architectures – Direct Connect Gateway multi-Region transitive routing","supplement":false,"stem":"A global pharmaceutical company operates a hybrid cloud network. Its primary AWS workloads run in the us-west-2 Region, connected to its on-premises data center via an AWS Direct Connect connection. After acquiring a biotech firm headquartered in Europe, the company must integrate the biotech’s workloads, which are hosted in several VPCs in the eu-central-1 Region and connected to the biotech's on-premises facility through a separate Direct Connect link. All CIDR blocks are non-overlapping, and the business requires full connectivity between both data centers and all VPCs across the two Regions. The company also wants a scalable solution that minimizes manual network configuration and long-term operational overhead.<br>Which solution will best meet these requirements?","options":[{"html":"Establish inter-Region VPC peering between each VPC in the us-west-2 and eu-central-1 Regions. Use static routing tables in each VPC to define peer relationships and enable cross-Region communication","correct":false},{"html":"Deploy EC2-based VPN appliances in each VPC. Configure a full mesh VPN topology between all VPCs and data centers using CloudHub-style routing across Regions","correct":false},{"html":"Create private VIFs (virtual interfaces) in each Region and associate them directly with foreign-region VPCs using routing table entries and BGP. Use VPC endpoints in each account to forward cross-Region traffic","correct":false},{"html":"Connect both Direct Connect links to a shared Direct Connect gateway. Attach each Region's virtual private gateway (VGW) to the Direct Connect gateway, enabling transitive routing between the VPCs and the on-premises networks across Regions","correct":true}],"multi":1,"analysis":"<p>Kết nối transitive đa Region + on-prem với ít vận hành thủ công nhất</p>","answer":"<p>Direct Connect Gateway là global resource duy nhất cho phép nối nhiều VGW (nhiều Region) với nhiều kết nối Direct Connect, tạo transitive routing sẵn có.</p>","explain":"<ul><li><b>A. ✗</b> VPC Peering không transitive: phải peer từng cặp thủ công, và on-prem không thể 'đi nhờ' qua VPC đã peer để tới VPC khác.</li><li><b>B. ✗</b> Tự dựng VPN appliance full-mesh trên EC2 cực kỳ phức tạp: tự quản lý key, failover, scale — ngược hẳn yêu cầu ít vận hành.</li><li><b>C. ✗</b> Private VIF chỉ gắn được với VGW/Transit Gateway CÙNG Region, không thể gắn trực tiếp với VPC ở Region khác.</li><li><b>D. ✓</b> Đúng: Direct Connect Gateway là tài nguyên global, gắn được VGW của nhiều Region, cho phép routing xuyên Region/on-prem mà không cần tự dựng VPN/peering.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> VPC Peering 'nghe' giải quyết được việc nối VPC nhưng non-transitive — không nối được on-prem Region này với VPC ở Region kia qua trung gian.</p>","tip":"<p>Cần nối nhiều Direct Connect link + nhiều VGW/VPC xuyên Region, ít thao tác tay nhất → Direct Connect Gateway, không phải VPC Peering hay VIF riêng lẻ.</p>"},{"id":23,"topic":"Design High-Performing Architectures – AWS Transit Gateway hub-and-spoke","supplement":false,"stem":"A Pharmaceuticals company is looking for a simple solution to connect its VPCs and on-premises networks through a central hub.<br>As a Solutions Architect, which of the following would you suggest as the solution that requires the LEAST operational overhead?","options":[{"html":"Use AWS Transit Gateway to connect the Amazon VPCs to the on-premises networks","correct":true},{"html":"Use Transit VPC Solution to connect the Amazon VPCs to the on-premises networks","correct":false},{"html":"Partially meshed VPC peering can be used to connect the Amazon VPCs to the on-premises networks","correct":false},{"html":"Fully meshed VPC peering can be used to connect the Amazon VPCs to the on-premises networks","correct":false}],"multi":1,"analysis":"<p>Chọn mô hình hub-and-spoke ít vận hành nhất cho nhiều VPC + on-prem</p>","answer":"<p>Transit Gateway là dịch vụ managed, chỉ cần 1 attachment cho mỗi VPC/on-prem, không cần tự quản lý appliance như Transit VPC.</p>","explain":"<ul><li><b>A. ✓</b> Transit Gateway là hub quản lý hoàn toàn bởi AWS, chỉ cần 1 kết nối mỗi VPC/on-prem tới hub — ít vận hành nhất.</li><li><b>B. ✗</b> Transit VPC đòi hỏi tự dựng và quản lý EC2 appliance làm hub — nhiều vận hành hơn Transit Gateway managed.</li><li><b>C. ✗</b> VPC Peering không kết nối được on-premises, và peering từng phần vẫn thiếu kết nối đầy đủ.</li><li><b>D. ✗</b> VPC Peering không hỗ trợ on-premises; peering đầy đủ (full mesh) còn tốn nhiều kết nối quản lý hơn (C(n,2)).</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Transit VPC nghe giống Transit Gateway về tên gọi nhưng là giải pháp CŨ dựa trên EC2 appliance tự quản lý — tốn vận hành hơn nhiều.</p>","tip":"<p>Transit Gateway (managed, AWS vận hành) luôn ưu tiên hơn Transit VPC (tự quản EC2 appliance) khi tiêu chí là ít vận hành nhất.</p>"},{"id":24,"topic":"Design Resilient Architectures – ECS/EKS with Fargate for serverless container orchestration","supplement":false,"stem":"An IT company has a large number of clients opting to build their application programming interface (API) using Docker containers. To facilitate the hosting of these containers, the company is looking at various orchestration services available with AWS.<br>As a Solutions Architect, which of the following solutions will you suggest? (Select two)","options":[{"html":"Use Amazon Elastic Container Service (Amazon ECS) with Amazon EC2 for serverless orchestration of the containerized services","correct":false},{"html":"Use Amazon SageMaker for serverless orchestration of the containerized services","correct":false},{"html":"Use Amazon EMR for serverless orchestration of the containerized services","correct":false},{"html":"Use Amazon Elastic Container Service (Amazon ECS) with AWS Fargate for serverless orchestration of the containerized services","correct":true},{"html":"Use Amazon Elastic Kubernetes Service (Amazon EKS) with AWS Fargate for serverless orchestration of the containerized services","correct":true}],"multi":2,"analysis":"<p>Nhận diện đúng DANH MỤC dịch vụ (container orchestration) trước khi chọn tính serverless hay không</p>","answer":"<p>Chỉ ECS và EKS là dịch vụ orchestration container; kết hợp với Fargate thì cả hai đều trở thành serverless, không cần quản lý EC2.</p>","explain":"<ul><li><b>A. ✗</b> ECS với EC2 vẫn phải tự quản lý instance — không phải serverless.</li><li><b>B. ✗</b> SageMaker là dịch vụ machine learning, hoàn toàn không phải orchestration cho container API.</li><li><b>C. ✗</b> EMR là dịch vụ xử lý Big Data (Hadoop/Spark), không phải trình điều phối container.</li><li><b>D. ✓</b> Đúng: ECS + Fargate là orchestration serverless, không cần quản lý EC2 bên dưới.</li><li><b>E. ✓</b> Đúng: EKS + Fargate cũng serverless hoá việc chạy Pod mà không cần quản lý node EC2.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> SageMaker và EMR là các dịch vụ AWS phổ biến nhưng hoàn toàn SAI DANH MỤC (ML và Big Data), không phải orchestration container — một dạng bẫy chọn sai nhóm dịch vụ.</p>","tip":"<p>Khi đề hỏi về orchestration container, chỉ xét ECS/EKS; muốn 'serverless' thì luôn đi kèm Fargate (không phải EC2 launch type).</p>"},{"id":25,"topic":"Design Resilient Architectures – ALB host-based routing wildcard rule","supplement":false,"stem":"A development team has configured Elastic Load Balancing for host-based routing. The idea is to support multiple subdomains and different top-level domains.<br>The rule *.example.com matches which of the following?","options":[{"html":"example.test.com","correct":false},{"html":"test.example.com","correct":true},{"html":"EXAMPLE.COM","correct":false},{"html":"example.com","correct":false}],"multi":1,"analysis":"<p>Hiểu đúng cú pháp wildcard host-based routing của ALB</p>","answer":"<p>Dấu * trong *.example.com khớp với bất kỳ chuỗi ký tự nào đứng trước '.example.com', nên chỉ test.example.com thoả điều kiện.</p>","explain":"<ul><li><b>A. ✗</b> example.test.com không khớp pattern *.example.com (phần cuối khác example.com).</li><li><b>B. ✓</b> Đúng: test.example.com có dạng &lt;bất kỳ&gt;.example.com, khớp đúng pattern wildcard.</li><li><b>C. ✗</b> EXAMPLE.COM không có phần subdomain đứng trước, không khớp pattern *.example.com.</li><li><b>D. ✗</b> example.com (không có subdomain) không khớp pattern *.example.com — dấu * yêu cầu có ít nhất 1 ký tự trước dấu chấm.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> example.com (không có subdomain) rất dễ bị nhầm là khớp, nhưng rule *.example.com yêu cầu PHẢI CÓ phần đứng trước dấu chấm.</p>","tip":"<p>Rule *.example.com chỉ khớp SUBDOMAIN (có ký tự trước .example.com), không khớp chính domain gốc example.com.</p>"},{"id":26,"topic":"Design High-Performing Architectures – EC2 Cluster Placement Group for HPC","supplement":false,"stem":"An IT company runs a high-performance computing (HPC) workload on AWS. The workload requires high network throughput and low-latency network performance along with tightly coupled node-to-node communications. The Amazon EC2 instances are properly sized for compute and storage capacity and are launched using default options.<br>Which of the following solutions can be used to improve the performance of the workload?","options":[{"html":"Select a cluster placement group while launching Amazon EC2 instances","correct":true},{"html":"Select an Elastic Inference accelerator while launching Amazon EC2 instances","correct":false},{"html":"Select the appropriate capacity reservation while launching Amazon EC2 instances","correct":false},{"html":"Select dedicated instance tenancy while launching Amazon EC2 instances","correct":false}],"multi":1,"analysis":"<p>Cải thiện network performance cho workload HPC tightly-coupled</p>","answer":"<p>Cluster placement group gom các instance vào cùng phân đoạn mạng băng thông cao trong 1 AZ — đúng nhu cầu throughput cao, latency thấp của HPC.</p>","explain":"<ul><li><b>A. ✓</b> Đúng: Cluster placement group đặt các instance gần nhau trong cùng AZ, đạt throughput cao và độ trễ thấp cho giao tiếp node-to-node.</li><li><b>B. ✗</b> Elastic Inference tăng tốc suy luận deep learning bằng GPU, không liên quan tới network throughput của HPC.</li><li><b>C. ✗</b> Capacity Reservation chỉ đảm bảo CÓ capacity sẵn sàng, không cải thiện hiệu năng mạng.</li><li><b>D. ✗</b> Dedicated tenancy chỉ cô lập phần cứng cho compliance, không cải thiện network performance.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Capacity Reservation và Dedicated Tenancy đều liên quan tới 'cấu hình lúc launch EC2' nhưng hoàn toàn không ảnh hưởng tới hiệu năng mạng.</p>","tip":"<p>Workload cần network throughput cao + latency thấp giữa các node → Cluster Placement Group (khác Spread: chống correlated failure; khác Partition: cho hệ phân tán lớn).</p>"},{"id":27,"topic":"Design Resilient Architectures – RDS Read Replicas for read scaling","supplement":false,"stem":"A company has developed a popular photo-sharing website using a serverless pattern on the AWS Cloud using Amazon API Gateway and AWS Lambda. The backend uses an Amazon RDS PostgreSQL database. The website is experiencing high read traffic and the AWS Lambda functions are putting an increased read load on the Amazon RDS database.<br>The architecture team is planning to increase the read throughput of the database, without changing the application's core logic. As a Solutions Architect, what do you recommend?","options":[{"html":"Use Amazon DynamoDB","correct":false},{"html":"Use Amazon RDS Multi-AZ feature","correct":false},{"html":"Use Amazon RDS Read Replicas","correct":true},{"html":"Use Amazon ElastiCache","correct":false}],"multi":1,"analysis":"<p>Tăng read throughput mà không đổi logic ứng dụng hiện có</p>","answer":"<p>Read Replica là tính năng có sẵn của RDS, chỉ cần trỏ bớt truy vấn đọc sang replica, không đòi hỏi viết lại logic nghiệp vụ.</p>","explain":"<ul><li><b>A. ✗</b> Chuyển sang DynamoDB đòi hỏi viết lại toàn bộ tầng dữ liệu — vi phạm yêu cầu 'không đổi logic ứng dụng'.</li><li><b>B. ✗</b> Multi-AZ phục vụ high availability/failover, standby không phục vụ đọc trực tiếp — không tăng read throughput.</li><li><b>C. ✓</b> Đúng: Read Replica tăng read throughput ngay, hầu như không cần sửa logic ứng dụng (chỉ trỏ bớt truy vấn đọc sang endpoint replica).</li><li><b>D. ✗</b> ElastiCache cần thêm logic cache ở tầng ứng dụng — tức là phải sửa 'core logic' mà đề yêu cầu giữ nguyên.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> ElastiCache và DynamoDB đều giải quyết được vấn đề đọc nhiều, nhưng cả hai đều yêu cầu SỬA LOGIC ứng dụng — vi phạm điều kiện ràng buộc của đề.</p>","tip":"<p>Tăng read throughput mà 'không đổi core logic' → luôn nghĩ Read Replica trước; cache (ElastiCache/DAX) đòi hỏi refactor application logic nhiều hơn.</p>"},{"id":28,"topic":"Design High-Performing Architectures – ElastiCache Redis geospatial caching layer","supplement":false,"stem":"A ride-hailing startup has launched a mobile app that matches passengers with nearby drivers based on real-time GPS coordinates. The application backend uses an Amazon RDS for PostgreSQL instance with read replicas to store the latitude and longitude of drivers and passengers. As the service scales, the backend experiences performance bottlenecks during peak hours, especially when thousands of updates and reads occur per second to keep location data current. The company expects its user base to double in the next few months and needs a high-performance, scalable solution that can handle frequent write and read operations with minimal latency.<br>What do you recommend?","options":[{"html":"Migrate the location data to Amazon OpenSearch Service and use its geospatial indexing features to retrieve and store coordinates in near real-time. Visualize tracking data using OpenSearch Dashboards","correct":false},{"html":"Place an Amazon ElastiCache for Redis cluster in front of the PostgreSQL database. Modify the application to cache recent location reads and updates in Redis, using a TTL-based eviction strategy","correct":true},{"html":"Create a read-replica Auto Scaling policy for the PostgreSQL database to dynamically add replicas during peak load. Distribute traffic evenly using an RDS proxy with failover configuration","correct":false},{"html":"Enable Multi-AZ deployment for the primary RDS instance to improve write resilience and fault tolerance. Use Multi-AZ standby failover to distribute reads during peak hours","correct":false}],"multi":1,"analysis":"<p>Giảm tải read/write tần suất cao cho dữ liệu có tính 'ngắn hạn' (vị trí GPS luôn đổi)</p>","answer":"<p>Redis xử lý geospatial native, tốc độ dưới mili-giây, và TTL phù hợp bản chất dữ liệu vị trí liên tục đổi mới, giảm tải trực tiếp lên RDS.</p>","explain":"<ul><li><b>A. ✗</b> OpenSearch có geospatial query nhưng không tối ưu cho ghi/đọc tần suất cực cao theo kiểu transactional, dễ giảm hiệu năng cluster.</li><li><b>B. ✓</b> Đúng: Redis có sẵn lệnh geospatial (GEOADD, GEORADIUS...), độ trễ dưới mili-giây, TTL tự dọn dữ liệu cũ — khớp hoàn hảo use-case.</li><li><b>C. ✗</b> Thêm Read Replica tự động/RDS proxy chỉ giúp phần đọc, không giảm được áp lực GHI liên tục — vốn là nút thắt chính.</li><li><b>D. ✗</b> Multi-AZ cải thiện khả năng chịu lỗi, KHÔNG cải thiện hiệu năng/độ trễ đọc-ghi theo thời gian thực.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Read Replica Auto Scaling nghe như giải pháp scale đúng hướng nhưng chỉ xử lý phần ĐỌC, bỏ qua áp lực GHI liên tục mới là nút thắt chính của bài toán.</p>","tip":"<p>Dữ liệu cập nhật cực nhanh, có thể hết hạn (TTL), cần cả đọc lẫn ghi độ trễ thấp → ElastiCache Redis (có geospatial), không phải OpenSearch hay thêm Read Replica.</p>"},{"id":29,"topic":"Design Cost-Optimized Architectures – ElastiCache in front of Aurora for repeated reads","supplement":false,"stem":"A transportation logistics company runs a shipment tracking application on Amazon EC2 instances with an Amazon Aurora MySQL database cluster. The application is experiencing rapid growth due to increased demand from mobile app users querying package delivery statuses. Although the compute layer (EC2) has remained stable, the Aurora DB cluster is under growing read pressure, especially from frequent repeated queries about package locations and delivery history. The company added an Aurora read replica, which temporarily alleviated the load, but read traffic continues to spike as user queries grow. The company wants to reduce the repeated reads pressure on the DB cluster.<br>Which solution will best meet these requirements in a cost-effective manner?","options":[{"html":"Enable Aurora Serverless v2 for the DB cluster to automatically scale read and write capacity in response to usage spikes. Route all traffic through the cluster endpoint","correct":false},{"html":"Add another Aurora read replica to distribute the increasing read load across more read nodes. Adjust the application to perform client-side load balancing across the read replicas","correct":false},{"html":"Integrate Amazon ElastiCache for Redis between the application and Aurora. Cache frequently accessed query results in Redis to reduce the number of identical read requests hitting the database","correct":true},{"html":"Convert the Aurora MySQL DB cluster into a multi-writer setup using Aurora global database. Allow concurrent writes from multiple application nodes across Regions","correct":false}],"multi":1,"analysis":"<p>Giảm chi phí cho tải đọc LẶP LẠI (idempotent reads) bằng cache thay vì mở rộng hạ tầng DB</p>","answer":"<p>Redis cache kết quả truy vấn hay lặp lại, giảm trực tiếp lượng request chạm tới Aurora, rẻ hơn và hiệu quả hơn thêm Read Replica.</p>","explain":"<ul><li><b>A. ✗</b> Aurora Serverless v2 tối ưu cho tải biến động thất thường, không phải cho tải đọc lặp lại cao liên tục — không giải quyết đúng gốc rễ.</li><li><b>B. ✗</b> Thêm Read Replica tốn thêm chi phí liên tục, và các truy vấn GIỐNG HỆT NHAU vẫn lặp lại hit vào DB mỗi lần.</li><li><b>C. ✓</b> Đúng: cache kết quả truy vấn lặp lại trong Redis giảm trực tiếp số lần hit DB, rẻ hơn nhiều so với mở thêm replica.</li><li><b>D. ✗</b> Multi-writer/global database giải quyết bài toán GHI đa Region, hoàn toàn sai hướng so với vấn đề ĐỌC lặp lại của đề.</li></ul>","wrong":"<p><b>Bẫy thường gặp:</b> Thêm Read Replica 'nghe hợp lý' để chia tải đọc nhưng không giải quyết gốc rễ: truy vấn GIỐNG NHAU vẫn lặp đi lặp lại chạm DB, gây lãng phí chi phí.</p>","tip":"<p>Khi bài toán là truy vấn LẶP LẠI giống hệt nhau (không phải lượng truy vấn khác nhau tăng tuyến tính) → ưu tiên cache (ElastiCache) trước khi nghĩ tới thêm Read Replica.</p>"},{"id":30,"topic":"Design Resilient Architectures – DynamoDB for low-latency serverless NoSQL","supplement":false,"stem":"A ride-sharing company wants to improve the ride-tracking system that stores GPS coordinates for all rides. The engineering team at the company is looking for a NoSQL database that has single-digit millisecond latency, can scale horizontally, and is serverless, so that they can perform high-frequency lookups reliably.<br>As a Solutions Architect, which database do you recommend for their requirements?","options":[{"html":"Amazon Relational Database Service (Amazon RDS)","correct":false},{"html":"Amazon ElastiCache","correct":false},{"html":"Amazon DynamoDB","correct":true},{"html":"Amazon Neptune","correct":false}],"multi":1,"analysis":"<p>Chọn NoSQL serverless, độ trễ thấp, scale ngang cho use-case lookup tần suất cao</p>","answer":"<p>DynamoD
