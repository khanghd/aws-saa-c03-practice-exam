{"id":22,"topic":"Design Resilient Architectures – DNS hostname cho EC2 trong VPC","supplement":false,"stem":"<p>A company launched an EC2 instance in the newly created VPC. They noticed that the generated instance does not have an associated DNS hostname.</p><p>Which of the following options could be a valid reason for this issue?</p>","options":[{"html":"Amazon Route 53 is not enabled.","correct":false},{"html":"The DNS resolution and DNS hostname of the VPC configuration should be enabled.","correct":true},{"html":"The security group of the EC2 instance needs to be modified.","correct":false},{"html":"The newly created VPC has an invalid CIDR block.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> EC2 instance trong VPC mới tạo (non-default) không nhận được DNS hostname tự động.</li>\n<li><strong>Yêu cầu chính:</strong> Xác định nguyên nhân đúng — liên quan đến thuộc tính cấu hình của chính VPC.</li>\n<li><strong>Từ khóa cần chú ý:</strong> VPC non-default cần bật cả 2 thuộc tính <strong>DNS resolution</strong> và <strong>DNS hostnames</strong> để instance có public DNS hostname.</li>\n</ul>","answer":"<ul>\n<li><strong>The DNS resolution and DNS hostname of the VPC configuration should be enabled.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Route 53 là dịch vụ DNS riêng biệt, không cần \"enable\" để VPC gán hostname cho instance — đây là thuộc tính của chính VPC.</li>\n<li><strong>B. ✓</strong> VPC non-default mặc định có thể chưa bật 2 thuộc tính DNS resolution và DNS hostnames; nếu thiếu, instance (dù có public IP) vẫn không được gán public DNS hostname.</li>\n<li><strong>C. ✗</strong> Security Group chỉ lọc traffic (firewall), không liên quan gì đến việc gán DNS hostname cho instance.</li>\n<li><strong>D. ✗</strong> AWS luôn validate CIDR block hợp lệ khi tạo VPC, nên trường hợp \"invalid CIDR\" gần như không xảy ra.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nghĩ đến Route 53 khi thấy từ \"DNS\", nhưng việc gán hostname cho EC2 instance trong VPC là thuộc tính cấu hình của <strong>VPC</strong> (DNS resolution + DNS hostnames), không liên quan đến Route 53.</p>","tip":"<p>EC2 trong VPC không có public DNS hostname → kiểm tra 2 thuộc tính VPC: <strong>DNS resolution</strong> và <strong>DNS hostnames</strong> phải được bật, kèm theo instance phải có public IPv4.</p>"},
{"id":23,"topic":"Design High-Performing Architectures – EBS io1 IOPS theo kích thước volume","supplement":false,"stem":"<p>A company has a High Performance Computing (HPC) cluster that is composed of EC2 Instances with Provisioned IOPS (io1) volume to process transaction-intensive, low-latency workloads. The Solutions Architect must maintain high IOPS while keeping the latency down by setting the optimal queue length for the volume. The size of each volume is 10 GiB.</p><p>Which of the following is the MOST suitable configuration that the Architect should set up?</p>","options":[{"html":"Set the IOPS to 500 then maintain a low queue length.","correct":true},{"html":"Set the IOPS to 400 then maintain a low queue length.","correct":false},{"html":"Set the IOPS to 600 then maintain a high queue length.","correct":false},{"html":"Set the IOPS to 800 then maintain a low queue length.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> io1 volume 10 GiB, tỷ lệ tối đa IOPS:dung lượng = 50:1 → IOPS tối đa = 10 × 50 = 500.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng mức IOPS tối đa cho phép + chiến lược queue length đúng cho transaction-intensive workload (nhạy cảm latency).</li>\n<li><strong>Từ khóa cần chú ý:</strong> Ứng dụng nhạy cảm latency (transaction-intensive) → <strong>queue length thấp</strong>; workload throughput-intensive mới cần queue length cao.</li>\n</ul>","answer":"<ul>\n<li><strong>Set the IOPS to 500 then maintain a low queue length.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> 10 GiB × 50 = 500 IOPS tối đa cho phép; dùng tối đa IOPS cho phép và giữ queue length thấp giúp giảm latency cho workload transaction-intensive.</li>\n<li><strong>B. ✗</strong> 400 IOPS vẫn hợp lệ nhưng không tận dụng hết khả năng tối đa (500) của volume.</li>\n<li><strong>C, D. ✗</strong> 600 và 800 IOPS vượt quá giới hạn tối đa 500 cho volume 10 GiB (vi phạm tỷ lệ 50:1); ngoài ra option C còn sai thêm ở việc dùng queue length cao (chỉ phù hợp cho throughput-intensive, không phải latency-sensitive).</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ quên công thức \"IOPS tối đa = dung lượng (GiB) × 50\" nên chọn nhầm mức IOPS vượt giới hạn cho phép của volume.</p>","tip":"<p>io1: IOPS tối đa = dung lượng (GiB) × 50 (tối đa 64.000 IOPS). Workload nhạy cảm latency (transaction-intensive) → <strong>queue length thấp</strong>. Throughput-intensive (HDD st1/sc1) → queue length cao.</p>"},
{"id":24,"topic":"Design Secure Architectures – AWS Config kiểm tra password policy","supplement":false,"stem":"<p>A new company policy requires IAM users to change their passwords' minimum length to 12 characters. After a random inspection, you found out that there are still employees who do not follow the policy.</p><p>How can you automatically check and evaluate whether the current password policy for an account complies with the company password policy?</p>","options":[{"html":"Create a rule in the Amazon CloudWatch event. Build an event pattern to match events on IAM. Set the event name to \"ChangePassword\" in the event pattern. Configure SNS to send notifications to you whenever a user has made changes to his password.","correct":false},{"html":"Create a Scheduled Lambda Function that will run a custom script to check compliance against changes made to the passwords periodically.","correct":false},{"html":"Configure AWS Config to trigger an evaluation that will check the compliance for a user's password periodically.","correct":true},{"html":"Create a CloudTrail trail. Filter the result by setting the attribute to \"Event Name\" and lookup value to \"ChangePassword\". This easily gives you the list of users who have made changes to their passwords.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần kiểm tra <strong>tự động, định kỳ</strong> xem password policy của account có tuân thủ chuẩn công ty (12 ký tự) hay không.</li>\n<li><strong>Yêu cầu chính:</strong> Giải pháp đánh giá compliance của <strong>cấu hình</strong> (không phải chỉ log sự kiện đổi password).</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"automatically check and evaluate compliance\" → managed rule <code>IAM_PASSWORD_POLICY</code> của <strong>AWS Config</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Configure AWS Config to trigger an evaluation that will check the compliance for a user's password periodically.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Chỉ cho biết <em>ai</em> đã đổi password, không kiểm tra được password đó có đạt độ dài tối thiểu theo policy hay không.</li>\n<li><strong>B. ✗</strong> AWS Config đã tích hợp sẵn với Lambda để đánh giá rule, không cần tự viết Lambda function riêng; đồng thời Lambda không thể tự lập lịch mà không qua EventBridge.</li>\n<li><strong>C. ✓</strong> AWS Config có managed rule <code>IAM_PASSWORD_POLICY</code>, tự động đánh giá định kỳ xem password policy hiện tại của account có khớp với chuẩn yêu cầu (độ dài tối thiểu...) hay không.</li>\n<li><strong>D. ✗</strong> CloudTrail chỉ ghi lại <em>sự kiện</em> ai đổi password, không đánh giá được nội dung/độ dài password đó có tuân thủ chính sách hay không.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> CloudTrail và CloudWatch Events đều có thể \"biết ai đã đổi password\", nhưng đó chỉ là log sự kiện — không đánh giá được việc password có <strong>tuân thủ policy</strong> (độ dài tối thiểu) hay không, đây là việc riêng của AWS Config.</p>","tip":"<p>Đánh giá <strong>compliance cấu hình</strong> (không chỉ log sự kiện) của resource/policy theo quy định công ty → luôn dùng <strong>AWS Config managed rule</strong>.</p>"},
{"id":25,"topic":"Design High-Performing Architectures – Transit Gateway liên vùng (inter-region peering)","supplement":false,"stem":"<p>A company has hundreds of VPCs with multiple VPN connections to their data centers spanning 5 AWS Regions. As the number of its workloads grows, the company must be able to scale its networks across multiple accounts and VPCs to keep up. A Solutions Architect is tasked to interconnect all of the company's on-premises networks, VPNs, and VPCs into a single gateway, which includes support for inter-region peering across multiple AWS regions.</p><p>Which of the following is the BEST solution that the architect should set up to support the required interconnectivity?</p>","options":[{"html":"Set up an AWS Direct Connect Gateway to achieve inter-region VPC access to all of the AWS resources and on-premises data centers. Set up a link aggregation group (LAG) to aggregate multiple connections at a single AWS Direct Connect endpoint in order to treat them as a single, managed connection. Launch a virtual private gateway in each VPC and then create a public virtual interface for each AWS Direct Connect connection to the Direct Connect Gateway.","correct":false},{"html":"Set up an AWS Transit Gateway in each region to interconnect all networks within it. Then, route traffic between the transit gateways through a peering connection.","correct":true},{"html":"Enable inter-region VPC peering that allows peering relationships to be established between multiple VPCs across different AWS regions. Set up a networking configuration that ensures that the traffic will always stay on the global AWS backbone and never traverse the public Internet.","correct":false},{"html":"Set up an AWS VPN CloudHub for inter-region VPC access and a Direct Connect gateway for the VPN connections to the on-premises data centers. Create a virtual private gateway in each VPC, then create a private virtual interface for each AWS Direct Connect connection to the Direct Connect gateway.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Hàng trăm VPC, nhiều VPN, trải 5 region, cần gom vào <strong>1 gateway trung tâm</strong> có hỗ trợ <strong>inter-region peering</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn mô hình hub-and-spoke có khả năng mở rộng và liên kết nhiều region.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"single gateway... inter-region peering across multiple AWS regions\" → <strong>Transit Gateway</strong> mỗi region + <strong>Transit Gateway peering</strong> giữa các region.</li>\n</ul>","answer":"<ul>\n<li><strong>Set up an AWS Transit Gateway in each region to interconnect all networks within it. Then, route traffic between the transit gateways through a peering connection.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Direct Connect Gateway chỉ hỗ trợ private virtual interface (không phải public); LAG chỉ gộp nhiều kết nối vật lý tại 1 DX endpoint, không giải quyết bài toán liên kết hàng trăm VPC đa region.</li>\n<li><strong>B. ✓</strong> Transit Gateway đóng vai trò hub tại mỗi region, kết nối VPC/VPN/DX tại chỗ; Transit Gateway Peering Connection liên kết các hub này xuyên region — đúng mô hình \"single gateway\" + inter-region.</li>\n<li><strong>C. ✗</strong> VPC Peering thông thường không bắc cầu (non-transitive), phải thiết lập thủ công từng cặp VPC — không khả thi và không quản lý tập trung được khi có hàng trăm VPC.</li>\n<li><strong>D. ✗</strong> VPN CloudHub chỉ dành cho kết nối VPN, không quản lý được VPC; không đáp ứng yêu cầu gom tất cả vào 1 gateway duy nhất.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> VPC Peering nghe đơn giản và trực tiếp, nhưng với số lượng hàng trăm VPC đa region thì việc quản lý từng cặp peering riêng lẻ cực kỳ phức tạp — Transit Gateway mới là giải pháp hub-and-spoke có thể scale.</p>","tip":"<p>Kết nối hàng trăm VPC/VPN/on-premises đa region vào 1 gateway trung tâm, dễ mở rộng → <strong>Transit Gateway</strong> (mỗi region) + <strong>Transit Gateway Peering</strong> (liên region).</p>"},
{"id":26,"topic":"Design Secure Architectures – AWS Control Tower cho multi-account","supplement":false,"stem":"<p>A startup is planning to set up and govern a secure, compliant, multi-account AWS environment in preparation for its upcoming projects. The IT Manager requires the solution to have a dashboard for continuous detection of policy non-conformance and non-compliant resources across the enterprise, as well as to comply with the AWS multi-account strategy best practices.</p><p>Which of the following offers the easiest way to fulfill this task?</p>","options":[{"html":"Use AWS Service Catalog to launch new AWS member accounts. Configure AWS Service Catalog Launch Constraints to continuously track configuration changes and monitor non-compliant resources. Set up a Multi-Account Multi-Region Data Aggregator to monitor compliance data for rules and accounts in an aggregated view","correct":false},{"html":"Use AWS Control Tower to launch a landing zone to automatically provision and configure new accounts through an Account Factory. Utilize the AWS Control Tower dashboard to monitor provisioned accounts across your enterprise. Set up preventive and detective guardrails for policy enforcement.","correct":true},{"html":"Launch new AWS member accounts using the AWS CloudFormation StackSets. Use AWS Config to continuously track the configuration changes and set rules to monitor non-compliant resources. Set up a Multi-Account Multi-Region Data Aggregator to monitor compliance data for rules and accounts in an aggregated view","correct":false},{"html":"Establish connectivity to AWS through an AWS Direct Connect Partner to securely link on-premises environments to the new AWS accounts. Use AWS Organizations to manage and govern multiple accounts. Set up AWS Config to monitor non-compliant resources across the enterprise.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần thiết lập multi-account AWS theo best practices, có dashboard theo dõi compliance, <strong>dễ dùng nhất</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn dịch vụ \"all-in-one\" cho multi-account governance, tích hợp sẵn dashboard + guardrail.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"easiest way\" + \"dashboard for policy non-conformance\" + \"multi-account best practices\" → <strong>AWS Control Tower</strong> (đóng gói sẵn Organizations, Service Catalog, Identity Center, guardrail, dashboard).</li>\n</ul>","answer":"<ul>\n<li><strong>Use AWS Control Tower to launch a landing zone to automatically provision and configure new accounts through an Account Factory. Utilize the AWS Control Tower dashboard to monitor provisioned accounts across your enterprise. Set up preventive and detective guardrails for policy enforcement.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Service Catalog chỉ quản lý catalog các sản phẩm/template để triển khai nhất quán, không có chức năng phát hiện resource không compliant.</li>\n<li><strong>B. ✓</strong> Control Tower tự động dựng landing zone, Account Factory tạo account chuẩn hóa, dashboard theo dõi toàn bộ account/OU, guardrail (preventive/detective) enforce policy — đúng \"easiest way\" vì tích hợp sẵn mọi thứ trong 1 dịch vụ.</li>\n<li><strong>C. ✗</strong> Phải tự cấu hình CloudFormation StackSets + AWS Config + Data Aggregator riêng lẻ, tốn nhiều thời gian/công sức hơn nhiều so với Control Tower có sẵn.</li>\n<li><strong>D. ✗</strong> Direct Connect Partner chỉ là nhà cung cấp kết nối mạng, không liên quan đến account governance/compliance; thiếu landing zone, Account Factory, guardrail theo yêu cầu.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Các đáp án tự ghép CloudFormation StackSets + AWS Config nghe có vẻ \"linh hoạt, tùy biến\" nhưng lại đòi hỏi tự cấu hình nhiều thành phần — trong khi Control Tower đã đóng gói sẵn tất cả cho đúng use case multi-account governance.</p>","tip":"<p>Thiết lập + quản trị multi-account AWS theo best practices một cách <strong>dễ dàng, nhanh nhất</strong> → <strong>AWS Control Tower</strong> (landing zone + Account Factory + guardrail + dashboard).</p>"},
{"id":27,"topic":"Design Secure Architectures – CloudFront OAC cho private S3 content","supplement":false,"stem":"<p>A Solutions Architect is working for a large global media company with multiple office locations all around the world. The Architect is instructed to build a system to distribute training videos to all employees.</p><p>Using Amazon CloudFront, what method would be used to serve content that is stored in Amazon S3 but not publicly accessible from S3 directly?</p>","options":[{"html":"Create a web ACL in AWS WAF to block any public S3 access and attach it to the CloudFront distribution.","correct":false},{"html":"Create an S3 bucket policy that lists the CloudFront distribution ID as the principal and the target bucket as the Amazon Resource Name (ARN).","correct":false},{"html":"Create an Origin Access Control (OAC) for CloudFront and grant access to the objects in your S3 bucket to that OAC.","correct":true},{"html":"Create an Identity and Access Management (IAM) user for CloudFront and grant access to the objects in your S3 bucket to that IAM user.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> S3 bucket chứa video private, chỉ muốn truy cập <strong>qua CloudFront</strong>, không cho truy cập S3 URL trực tiếp.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng cơ chế hiện đại của CloudFront để truy cập S3 origin private.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Cơ chế chuẩn hiện tại là <strong>Origin Access Control (OAC)</strong> (thay thế OAI cũ), không phải IAM user hay WAF.</li>\n</ul>","answer":"<ul>\n<li><strong>Create an Origin Access Control (OAC) for CloudFront and grant access to the objects in your S3 bucket to that OAC.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> AWS WAF bảo vệ khỏi các lỗ hổng web phổ biến (SQLi, XSS...), không có chức năng hạn chế truy cập S3 origin.</li>\n<li><strong>B. ✗</strong> Không thể dùng trực tiếp CloudFront distribution ID làm principal trong bucket policy; phải định nghĩa CloudFront service làm Principal kèm Condition giới hạn theo distribution.</li>\n<li><strong>C. ✓</strong> OAC là cơ chế chuẩn để CloudFront được cấp quyền đọc object trong S3 bucket, đồng thời chặn truy cập trực tiếp qua S3 URL — đúng giải pháp của AWS cho bài toán private content.</li>\n<li><strong>D. ✗</strong> Không thể tạo IAM user riêng gắn trực tiếp cho 1 CloudFront distribution cụ thể theo cách này.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nghĩ cần tạo IAM user hoặc dùng distribution ID trực tiếp trong policy, nhưng AWS đã chuẩn hóa cơ chế này thành <strong>Origin Access Control (OAC)</strong> — không cần tự custom IAM principal.</p>","tip":"<p>CloudFront truy cập S3 origin private (chặn truy cập S3 URL trực tiếp) → dùng <strong>Origin Access Control (OAC)</strong>, cơ chế chuẩn hiện tại thay cho OAI cũ.</p>"},
{"id":28,"topic":"Design Resilient Architectures – EKS Cluster Autoscaler","supplement":false,"stem":"<p>A solutions architect is tasked with designing a scalable infrastructure solution for a business that runs uses Amazon Elastic Kubernetes Service (Amazon EKS) to execute container applications. Since the company's workload varies throughout the day, they want to make sure that its underlying infrastructure automatically scales in and out in response to demand.</p><p>Which of the following would meet the requirements with the LEAST amount of operational overhead?</p>","options":[{"html":"Integrate an edge-optimized API endpoint in Amazon API Gateway with Amazon EKS to manage and expose APIs for the containerized applications running on EKS.","correct":false},{"html":"Set up CloudWatch alarms for CPU utilization or request count to monitor the relevant metrics of the container applications running on Amazon EKS.","correct":false},{"html":"Use a combination of Kubernetes Metrics and Kubernetes Cluster Autoscaler to manage the number of nodes.","correct":true},{"html":"Use Amazon EC2 Auto Scaling Groups with custom scaling policies to manage the scaling of EKS worker nodes.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> EKS cluster cần tự scale in/out node theo tải, <strong>ít operational overhead nhất</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn giải pháp autoscaling được thiết kế riêng, tối ưu cho Kubernetes/EKS.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"LEAST operational overhead\" cho EKS → <strong>Kubernetes Cluster Autoscaler</strong> (tích hợp sẵn, tối ưu cho Kubernetes) thay vì tự cấu hình ASG + custom policy.</li>\n</ul>","answer":"<ul>\n<li><strong>Use a combination of Kubernetes Metrics and Kubernetes Cluster Autoscaler to manage the number of nodes.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> API Gateway edge-optimized endpoint dùng để expose API tới client ở gần CloudFront PoP, hoàn toàn không liên quan đến việc scale node của EKS.</li>\n<li><strong>B. ✗</strong> CloudWatch alarm chỉ giám sát metric, tự nó không có khả năng tự động scale cluster nếu không kết hợp thêm hành động khác.</li>\n<li><strong>C. ✓</strong> Cluster Autoscaler được thiết kế riêng cho Kubernetes, tự động điều chỉnh số node dựa trên pod pending/scheduling, tích hợp mượt với ASG bên dưới — ít cấu hình thủ công hơn so với tự viết custom scaling policy.</li>\n<li><strong>D. ✗</strong> Dùng ASG với custom scaling policy tự viết đòi hỏi nhiều cấu hình/quản lý hơn, không tối ưu cho đặc thù workload Kubernetes như Cluster Autoscaler.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> ASG với custom policy nghe có vẻ \"kiểm soát tốt hơn\", nhưng đề yêu cầu <strong>ít overhead nhất</strong> — Cluster Autoscaler đã được tối ưu sẵn riêng cho Kubernetes nên luôn ít công sức cấu hình hơn.</p>","tip":"<p>Auto scale node cho EKS cluster theo pod demand, ít overhead nhất → <strong>Kubernetes Cluster Autoscaler</strong> (không phải tự viết ASG custom policy).</p>"},
{"id":29,"topic":"Design High-Performing Architectures – Babelfish + SCT/DMS migrate sang Aurora PostgreSQL","supplement":false,"stem":"<p>An organization uses a Microsoft SQL Server database to support its suite of applications. The organization plans to transition to an Amazon Aurora PostgreSQL database while minimizing application code modifications.</p><p>Which combination of actions will achieve these objectives? (Select TWO.)</p>","options":[{"html":"Use AWS Glue to transform the SQL queries from the applications for compatibility with Aurora PostgreSQL.","correct":false},{"html":"Use Amazon Kinesis Data Streams for real-time data replication to Aurora PostgreSQL.","correct":false},{"html":"Use AWS AppConfig to manage configuration updates during the migration.","correct":false},{"html":"Turn on Babelfish on Aurora PostgreSQL to allow applications to continue using existing SQL queries","correct":true},{"html":"Use AWS Schema Conversion Tool (AWS SCT) to convert the database schema and AWS Database Migration Service (AWS DMS) to migrate the data.","correct":true}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Migrate từ SQL Server sang Aurora PostgreSQL, <strong>giảm tối đa thay đổi code ứng dụng</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn 2 hành động: (1) chuyển schema + data, (2) giữ tương thích câu lệnh T-SQL hiện có.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Chuyển schema/data → <strong>SCT + DMS</strong>; giữ app chạy được với T-SQL cũ mà không sửa code → <strong>Babelfish</strong> (translation layer T-SQL → PostgreSQL).</li>\n</ul>","answer":"<ul>\n<li><strong>Turn on Babelfish on Aurora PostgreSQL to allow applications to continue using existing SQL queries.</strong></li>\n<li><strong>Use AWS Schema Conversion Tool (AWS SCT) to convert the database schema and AWS Database Migration Service (AWS DMS) to migrate the data.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> AWS Glue là dịch vụ ETL cho dữ liệu, không phải công cụ chuyển đổi cú pháp SQL của ứng dụng.</li>\n<li><strong>B. ✗</strong> Kinesis Data Streams dùng cho ingest/replicate dữ liệu streaming thời gian thực, không giải quyết việc chuyển schema hay tương thích câu lệnh SQL.</li>\n<li><strong>C. ✗</strong> AppConfig quản lý thay đổi cấu hình ứng dụng một cách an toàn, không liên quan đến chuyển đổi schema/SQL compatibility.</li>\n<li><strong>D. ✓</strong> Babelfish đóng vai trò translation layer, dịch T-SQL (SQL Server) sang PostgreSQL ngay trong Aurora, giúp app chạy gần như không cần sửa code.</li>\n<li><strong>E. ✓</strong> SCT chuyển đổi schema từ SQL Server sang PostgreSQL; DMS thực hiện di chuyển dữ liệu thực tế — kết hợp 2 công cụ đúng chuẩn cho quá trình migrate.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> AWS Glue dễ bị nhầm là công cụ \"transform\" phù hợp vì tên gọi liên quan ETL, nhưng Glue transform <strong>dữ liệu</strong> cho phân tích, không transform <strong>cú pháp SQL query</strong> của ứng dụng.</p>","tip":"<p>Migrate SQL Server → Aurora PostgreSQL, giữ nguyên code: chuyển schema+data bằng <strong>SCT + DMS</strong>; giữ tương thích T-SQL mà không sửa code → bật <strong>Babelfish</strong>.</p>"},
{"id":30,"topic":"Design Cost-Optimized Architectures – Giảm data transfer cost khi convert dữ liệu S3","supplement":false,"stem":"<p>A company has stored 200 TB of backup files in Amazon S3. The files are in a vendor-proprietary format. The Solutions Architect needs to use the vendor's proprietary file conversion software to retrieve files from an S3 bucket, convert the files to an industry-standard format, and re-upload the converted files to S3. The solution must minimize the data transfer costs.</p><p>Which of the following options can satisfy the given requirement?</p>","options":[{"html":"Use AWS DataSync to copy the data to an on-premises server. Install the file conversion software on the server. Transform the data and re-upload it to S3.","correct":false},{"html":"Deploy the Amazon EC2 instance in the same Region as S3. Install the file conversion software on the instance. Perform data transformation and re-upload it to S3.","correct":true},{"html":"Deploy the Amazon EC2 instance in a different Region. Install the file conversion software on the instance. Perform data transformation and re-upload it to S3.","correct":false},{"html":"Install the file conversion software in S3. Use S3 Batch Operations to perform data transformation.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần tải 200TB từ S3 về, convert bằng software của vendor, upload lại — số lượng dữ liệu lớn nên chi phí data transfer rất quan trọng.</li>\n<li><strong>Yêu cầu chính:</strong> Giảm thiểu chi phí data transfer khi retrieve/re-upload khối lượng dữ liệu lớn.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Data transfer giữa EC2 và S3 <strong>trong cùng Region</strong> là <strong>miễn phí</strong> — đây là chìa khóa để chọn đáp án.</li>\n</ul>","answer":"<ul>\n<li><strong>Deploy the Amazon EC2 instance in the same Region as S3. Install the file conversion software on the instance. Perform data transformation and re-upload it to S3.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> DataSync đưa dữ liệu ra khỏi AWS về on-premises rồi lại upload lại — phát sinh thêm chi phí data transfer ra/vào AWS không cần thiết.</li>\n<li><strong>B. ✓</strong> EC2 cùng Region với S3: data transfer giữa EC2 và S3 trong cùng Region hoàn toàn miễn phí — tối ưu chi phí nhất cho khối lượng 200TB.</li>\n<li><strong>C. ✗</strong> EC2 ở Region khác sẽ phát sinh phí inter-region data transfer khi retrieve và re-upload 200TB — tốn kém hơn nhiều.</li>\n<li><strong>D. ✗</strong> Không thể cài đặt phần mềm bên thứ ba trực tiếp vào S3; S3 Batch Operations chỉ thực thi các operation có sẵn (copy, restore, tag...), không tích hợp được với conversion software của vendor.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nghĩ đặt EC2 ở Region nào cũng được miễn là xử lý xong, nhưng quên rằng data transfer <strong>giữa Region khác nhau</strong> bị tính phí, trong khi <strong>cùng Region</strong> giữa EC2-S3 thì miễn phí — với 200TB thì chênh lệch chi phí rất lớn.</p>","tip":"<p>Xử lý dữ liệu lớn giữa EC2 và S3, muốn giảm chi phí data transfer → luôn đặt <strong>EC2 trong cùng Region</strong> với S3 bucket (data transfer EC2↔S3 cùng Region = miễn phí).</p>"}
,
{"id":31,"topic":"Design High-Performing Architectures – NLB cho UDP + DynamoDB key-value","supplement":false,"stem":"<p>A startup plans to develop a multiplayer game that uses UDP as the protocol for communication between clients and game servers. The data of the users will be stored in a key-value store. As the Solutions Architect, you need to implement a solution that will distribute the traffic across a number of servers.</p><p>Which of the following could help you achieve this requirement?</p>","options":[{"html":"Distribute the traffic using Network Load Balancer and store the data in Amazon Aurora.","correct":false},{"html":"Distribute the traffic using Network Load Balancer and store the data in Amazon DynamoDB.","correct":true},{"html":"Distribute the traffic using Application Load Balancer and store the data in Amazon DynamoDB.","correct":false},{"html":"Distribute the traffic using Application Load Balancer and store the data in Amazon RDS.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Game dùng <strong>UDP</strong> (Layer 4), dữ liệu dạng <strong>key-value</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng loại load balancer hỗ trợ UDP + đúng loại database key-value.</li>\n<li><strong>Từ khóa cần chú ý:</strong> UDP chỉ được hỗ trợ bởi <strong>Network Load Balancer</strong> (Layer 4), không phải ALB (chỉ hỗ trợ HTTP/HTTPS - Layer 7); key-value store → <strong>DynamoDB</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Distribute the traffic using Network Load Balancer and store the data in Amazon DynamoDB.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> NLB đúng cho UDP, nhưng Aurora là relational database, không phải key-value store như yêu cầu.</li>\n<li><strong>B. ✓</strong> NLB hỗ trợ UDP traffic (dùng flow hash để route nhất quán theo source/destination); DynamoDB hỗ trợ mô hình key-value lẫn document — đúng cả 2 yêu cầu.</li>\n<li><strong>C. ✗</strong> ALB hoạt động ở Layer 7 (HTTP/HTTPS), <strong>không hỗ trợ UDP</strong> — sai ngay từ phần load balancer.</li>\n<li><strong>D. ✗</strong> Sai cả 2: ALB không hỗ trợ UDP, và RDS (relational) không phải key-value store phù hợp.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ quên rằng Application Load Balancer <strong>chỉ hỗ trợ traffic Layer 7 (HTTP/HTTPS)</strong>, hoàn toàn không xử lý được UDP — với UDP/TCP thuần (Layer 4) luôn phải dùng Network Load Balancer.</p>","tip":"<p>UDP traffic (Layer 4) → chỉ <strong>Network Load Balancer</strong> hỗ trợ (ALB không hỗ trợ UDP). Key-value/document store → <strong>DynamoDB</strong>.</p>"},
{"id":32,"topic":"Design High-Performing Architectures – AWS Config + EventBridge xóa IAM access key cũ","supplement":false,"stem":"<p>A company has a team of developers that provisions its own resources on the AWS cloud. The developers use IAM user access keys to automate resource provisioning and application testing processes in AWS. To ensure proper security compliance, the security team wants to automate the process of deactivating and deleting any IAM user access key that is over 90 days old.</p><p>Which solution will meet these requirements with the LEAST operational effort?</p>","options":[{"html":"Create a custom AWS Config rule to check the max-age of IAM access keys. Use Amazon EventBridge Scheduler to invoke an AWS Batch job every 24 hours to delete all non-compliant access keys.","correct":false},{"html":"Create an Amazon EventBridge rule to filter IAM user access keys older than 90 days. Define a target to invoke an AWS Lambda function to deactivate and delete the old access keys.","correct":false},{"html":"Use the AWS Config managed rule to check if the IAM user access keys are not rotated within 90 days. Create an Amazon EventBridge rule for the non-compliant keys, and define a target to invoke a custom AWS Lambda function to deactivate and delete the keys.","correct":true},{"html":"Create an Amazon EventBridge rule to filter IAM user access keys older than 90 days. Schedule an AWS Batch job that runs every 24 hours to delete all the specified access keys.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần tự động vô hiệu hóa + xóa IAM access key quá 90 ngày, <strong>ít công sức nhất</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Dùng managed rule có sẵn (không tự viết custom rule) để check tuổi key, rồi remediate bằng Lambda qua EventBridge.</li>\n<li><strong>Từ khóa cần chú ý:</strong> EventBridge <strong>không</strong> tự biết được \"tuổi\" của access key — phải thông qua <strong>AWS Config managed rule</strong> để đánh giá rồi mới trigger EventBridge.</li>\n</ul>","answer":"<ul>\n<li><strong>Use the AWS Config managed rule to check if the IAM user access keys are not rotated within 90 days. Create an Amazon EventBridge rule for the non-compliant keys, and define a target to invoke a custom AWS Lambda function to deactivate and delete the keys.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Tạo custom Config rule là thừa vì đã có managed rule có sẵn cho access key rotation; dùng AWS Batch để xóa key cũng phức tạp hơn cần thiết so với 1 Lambda đơn giản.</li>\n<li><strong>B. ✗</strong> EventBridge không có khả năng tự lọc trực tiếp IAM access key theo tuổi (không có event chứa thông tin này) — phải thông qua AWS Config trước.</li>\n<li><strong>C. ✓</strong> Dùng managed rule có sẵn của Config để đánh giá tuổi key; khi phát hiện non-compliant, EventBridge nhận event đó và trigger Lambda đơn giản để deactivate/delete — ít công sức nhất, tận dụng tối đa dịch vụ managed.</li>\n<li><strong>D. ✗</strong> Tương tự B, EventBridge không trực tiếp lọc được access key theo tuổi; dùng AWS Batch cũng không cần thiết so với Lambda.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nghĩ EventBridge có thể trực tiếp \"filter access key older than 90 days\", nhưng EventBridge chỉ phản ứng theo event — phải có AWS Config managed rule đánh giá compliance trước, rồi event non-compliant đó mới được EventBridge bắt và xử lý.</p>","tip":"<p>Đánh giá compliance của resource (tuổi access key, cấu hình...) rồi tự động remediate → <strong>AWS Config managed rule</strong> (đánh giá) + <strong>EventBridge rule</strong> (bắt sự kiện non-compliant) + <strong>Lambda</strong> (remediation).</p>"},
{"id":33,"topic":"Design Secure Architectures – ALB redirect HTTP sang HTTPS","supplement":false,"stem":"<p>A company has an Application Load Balancer (ALB) that accepts HTTP and HTTPS traffic on ports 80 and 443, respectively. Recently, the company associated a new domain for its website, and they want to ensure that all HTTP traffic for this new domain is automatically redirected to HTTPS to improve security.</p><p>Which ALB configuration should be done to satisfy the requirement?</p>","options":[{"html":"Create a new HTTP listener on port 80 and add a redirect action to the HTTPS protocol on port 443.","correct":false},{"html":"Configure the existing on port 443 and add a redirect action to HTTP on port 80.","correct":false},{"html":"Configure the existing HTTP listener to redirect traffic to port 443.","correct":true},{"html":"Create a new ALB listener on port 443 and configure it to redirect HTTP traffic to HTTPS.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> ALB đã có sẵn listener HTTP (80) và HTTPS (443); cần redirect HTTP → HTTPS cho domain mới.</li>\n<li><strong>Yêu cầu chính:</strong> Cấu hình đúng trên listener <strong>đã tồn tại</strong> (không tạo listener trùng port).</li>\n<li><strong>Từ khóa cần chú ý:</strong> Mỗi port chỉ có <strong>1 listener duy nhất</strong> trên ALB — không thể tạo thêm listener mới trùng port 80 hoặc 443 đã tồn tại.</li>\n</ul>","answer":"<ul>\n<li><strong>Configure the existing HTTP listener to redirect traffic to port 443.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Không thể tạo listener HTTP mới trên port 80 vì đã có listener tồn tại ở port đó — chỉ cần sửa listener hiện có, không tạo mới.</li>\n<li><strong>B. ✗</strong> Đi ngược lại yêu cầu — redirect HTTPS về HTTP là làm giảm bảo mật, trái với mục tiêu đề bài.</li>\n<li><strong>C. ✓</strong> Chỉ cần chỉnh sửa rule của listener HTTP (80) đã có sẵn, thêm redirect action trỏ sang port 443 — đơn giản, đúng chuẩn, không vi phạm giới hạn 1 listener/port.</li>\n<li><strong>D. ✗</strong> Không thể tạo listener mới trên port 443 vì đã có listener HTTPS tồn tại ở đó.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nghĩ cần \"tạo mới\" listener để redirect, nhưng ALB chỉ cho phép <strong>1 listener/port</strong> — khi listener đã tồn tại ở port đó, chỉ có thể chỉnh sửa rule của listener hiện có.</p>","tip":"<p>ALB chỉ có 1 listener cho mỗi port. Muốn redirect HTTP→HTTPS khi listener port 80 đã tồn tại → chỉnh sửa (không tạo mới) rule của listener đó để trỏ sang port 443.</p>"},
{"id":34,"topic":"Design Resilient Architectures – S3 Cross-Region Replication chống region outage","supplement":false,"stem":"<p>A financial firm is designing an application architecture for its online trading platform that must have high availability and fault tolerance. Their Solutions Architect configured the application to use an Amazon S3 bucket located in the us-east-1 region to store large amounts of intraday financial data. The stored financial data in the bucket must not be affected even if there is an outage in one of the Availability Zones or if there's a regional service failure.</p><p>What should the Architect do to avoid any costly service disruptions and ensure data durability?</p>","options":[{"html":"Create a Lifecycle Policy to regularly backup the S3 bucket to Amazon Glacier.","correct":false},{"html":"Enable Cross-Region Replication.","correct":true},{"html":"Copy the S3 bucket to an EBS-backed EC2 instance.","correct":false},{"html":"Create a new S3 bucket in another region and configure Cross-Account Access to the bucket located in us-east-1.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> S3 bucket chỉ nằm trong 1 region (us-east-1); cần chịu được cả AZ outage lẫn <strong>toàn bộ region outage</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Dữ liệu phải khả dụng ngay cả khi mất cả region.</li>\n<li><strong>Từ khóa cần chú ý:</strong> S3 vốn đã tự replicate dữ liệu qua nhiều AZ <strong>trong cùng region</strong>; muốn chịu được mất cả region → cần <strong>Cross-Region Replication (CRR)</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Enable Cross-Region Replication.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Glacier chỉ là storage class khác trong <strong>cùng region</strong> (trừ khi tự cấu hình CRR riêng), không tự động bảo vệ khỏi regional outage.</li>\n<li><strong>B. ✓</strong> CRR tự động sao chép object sang bucket ở region khác; nếu region nguồn gặp sự cố toàn vùng, dữ liệu vẫn truy cập được từ region đích.</li>\n<li><strong>C. ✗</strong> EBS kém bền vững hơn S3 nhiều, và vẫn chỉ nằm trong 1 AZ/region — không giải quyết được vấn đề regional failure.</li>\n<li><strong>D. ✗</strong> Cross-Account Access chỉ cấp quyền truy cập cho account khác, không tự động <strong>replicate dữ liệu</strong> sang bucket/region khác.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm \"S3 đã rất durable rồi, không cần làm gì thêm\" — nhưng độ bền (durability 99.999999999%) của S3 chỉ đảm bảo trong phạm vi <strong>1 region</strong>; muốn chịu được mất cả region phải chủ động bật CRR.</p>","tip":"<p>S3 bucket chỉ tồn tại trong 1 region; muốn chịu được <strong>regional outage</strong> (không chỉ AZ outage) → bật <strong>Cross-Region Replication (CRR)</strong>.</p>"},
{"id":35,"topic":"Design High-Performing Architectures – Kinesis Data Streams đảm bảo thứ tự, không mất, không trùng","supplement":false,"stem":"<p>A company plans to develop a custom messaging service that will be used to train an AI for an automatic response feature. The service is expected to receive thousands of messages per day, all of which will be processed by an Amazon EMR cluster. It is crucial that none of the messages are lost, no duplicates are produced, and that the messages are processed in EMR in the same order as arrival.</p><p>Which of the following options can satisfy the given requirement?</p>","options":[{"html":"Create an Amazon Data Firehose to handle the messages.","correct":false},{"html":"Set up an Amazon SNS Topic to handle the messages.","correct":false},{"html":"Set up an Amazon SQS standard queue and configure a dead-letter queue (DLQ) to handle failed messages.","correct":false},{"html":"Create an Amazon Kinesis Data Stream to collect the messages.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần đảm bảo <strong>3 điều kiện đồng thời</strong>: không mất message, không trùng lặp, và đúng thứ tự khi đến EMR.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn dịch vụ messaging/streaming đảm bảo cả 3 tiêu chí này.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"same order as arrival\" + \"durable\" + nguồn single-producer dạng stream → <strong>Kinesis Data Streams</strong> (ordering theo sequence number trong shard, durable, replicate đa AZ).</li>\n</ul>","answer":"<ul>\n<li><strong>Create an Amazon Kinesis Data Stream to collect the messages.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Data Firehose đảm bảo delivery đáng tin cậy nhưng <strong>không đảm bảo thứ tự</strong> xử lý message.</li>\n<li><strong>B. ✗</strong> SNS là pub-sub, không đảm bảo thứ tự lẫn tránh trùng lặp cho khối lượng message lớn.</li>\n<li><strong>C. ✗</strong> SQS Standard Queue chỉ đảm bảo at-least-once (có thể trùng) và không đảm bảo thứ tự; DLQ chỉ xử lý message lỗi, không thay đổi được 2 vấn đề cốt lõi này.</li>\n<li><strong>D. ✓</strong> Kinesis Data Streams gán sequence number cho mỗi record trong shard, đảm bảo thứ tự xử lý đúng; dữ liệu được replicate đa AZ nên không mất; phù hợp cho throughput cao khi kết hợp consumer trên EMR.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> SQS Standard là lựa chọn messaging quen thuộc nên hay bị chọn nhầm, nhưng nó không đảm bảo thứ tự và có thể sinh trùng lặp — chỉ Kinesis Data Streams (theo shard) mới đáp ứng được cả 3 yêu cầu: không mất, không trùng, đúng thứ tự.</p>","tip":"<p>Cần đồng thời: không mất message + không trùng + đúng thứ tự xử lý, khối lượng lớn → <strong>Kinesis Data Streams</strong> (không phải SQS Standard, SNS, hay Firehose).</p>"},
{"id":36,"topic":"Design Cost-Optimized Architectures – SSE-KMS cho envelope encryption + audit trail","supplement":false,"stem":"<p>A company is looking to store its confidential financial files in AWS, which are accessed every week. The Architect was instructed to set up the storage system, which uses envelope encryption and automates key rotation. It should also provide an audit trail that shows who used the encryption key and by whom for security purposes.</p><p>Which combination of actions should the Architect implement to satisfy the requirement in the most cost-effective way? (Select TWO.)</p>","options":[{"html":"Use Amazon S3 Glacier Deep Archive to store the data.","correct":false},{"html":"Configure Server-Side Encryption with AWS KMS Keys (SSE-KMS).","correct":true},{"html":"Configure Server-Side Encryption with Amazon S3-Managed Keys (SSE-S3).","correct":false},{"html":"Use Amazon S3 to store the data.","correct":true},{"html":"Configure Server-Side Encryption with Customer-Provided Keys (SSE-C).","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> File được truy cập <strong>hàng tuần</strong> (không phải archive dài hạn), cần envelope encryption, rotation tự động, và <strong>audit trail</strong> (ai dùng key, lúc nào).</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng storage class (không phải Glacier vì access thường xuyên) + đúng loại SSE có audit trail.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Chỉ <strong>SSE-KMS</strong> mới cung cấp audit trail qua CloudTrail (ai dùng key, khi nào); SSE-S3/SSE-C không có tính năng này.</li>\n</ul>","answer":"<ul>\n<li><strong>Use Amazon S3 to store the data.</strong></li>\n<li><strong>Configure Server-Side Encryption with AWS KMS Keys (SSE-KMS).</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Glacier Deep Archive là lưu trữ lạnh, không phù hợp vì file được truy cập hàng tuần (frequent access).</li>\n<li><strong>B. ✓</strong> SSE-KMS dùng envelope encryption (KMS key mã hóa data key), hỗ trợ automatic key rotation, và cung cấp audit trail đầy đủ qua AWS CloudTrail về việc sử dụng key.</li>\n<li><strong>C. ✗</strong> SSE-S3 cũng rotate key tự động nhưng <strong>không</strong> cung cấp audit trail chi tiết qua CloudTrail như SSE-KMS.</li>\n<li><strong>D. ✓</strong> S3 Standard là storage class phù hợp cho dữ liệu truy cập hàng tuần, kết hợp SSE-KMS để đáp ứng đủ yêu cầu.</li>\n<li><strong>E. ✗</strong> SSE-C có thể hỗ trợ rotation tùy chỉnh ở phía khách hàng nhưng không cung cấp audit trail về việc dùng key như SSE-KMS.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> SSE-S3 và SSE-C đều hỗ trợ encryption hợp lệ nên dễ bị nhầm là đáp án đúng, nhưng chỉ <strong>SSE-KMS</strong> mới đáp ứng được yêu cầu \"audit trail cho thấy ai đã dùng key, lúc nào\" qua CloudTrail.</p>","tip":"<p>Cần envelope encryption + audit trail chi tiết (ai dùng key, khi nào) cho S3 → luôn chọn <strong>SSE-KMS</strong> (không phải SSE-S3 hay SSE-C).</p>"},
{"id":37,"topic":"Design High-Performing Architectures – AWS MGN cho lift-and-shift","supplement":false,"stem":"<p>A company hosts all its applications on its data center on the US East Coast. Most of the workloads are legacy applications that are hosted on individual virtual machines running in Linux and Windows operating systems. The company plans to migrate all of its VM workloads to the AWS cloud. To minimize changes in the applications during the migration process, it has been decided that the company will use a “lift-and-shift” strategy. The company also wants to minimize downtime during the migration process.</p><p>Which of the following options should the Solutions Architect implement for this scenario?</p>","options":[{"html":"Utilize AWS DataSync to migrate the application workloads to AWS. Deploy the AWS DataSync VM on the on-premises data center. Once replication is completed, launch Amazon EC2 instances based on the created AMIs.","correct":false},{"html":"Install the AWS Replication Agent on each of the on-premises VMs to continuously replicate the servers to AWS. Use AWS Migration Service (AWS MGN) to launch test instances and perform cutover once testing is completed.","correct":true},{"html":"Export the on-premises VMs and upload the images to an Amazon S3 bucket. Use VM Import/Export service to import the images and launch them as Amazon EC2 instances.","correct":false},{"html":"Use the AWS Application Discovery Service for lift-and-shift migrations. Deploy the AWS Application Discovery Agent to the on-premises data center to start the replication process. After the replication task is completed, launch Amazon EC2 instances based on the created AMIs.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần lift-and-shift VM workload lên AWS, <strong>ít thay đổi app, ít downtime nhất</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng dịch vụ migration chuyên biệt cho lift-and-shift, có continuous replication + test trước khi cutover.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"lift-and-shift\" + \"minimize downtime\" → <strong>AWS Application Migration Service (MGN)</strong>, dùng Replication Agent liên tục đồng bộ server.</li>\n</ul>","answer":"<ul>\n<li><strong>Install the AWS Replication Agent on each of the on-premises VMs to continuously replicate the servers to AWS. Use AWS Migration Service (AWS MGN) to launch test instances and perform cutover once testing is completed.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> DataSync dùng để chuyển dữ liệu/file, không phải để migrate/sync toàn bộ Virtual Machine như yêu cầu lift-and-shift.</li>\n<li><strong>B. ✓</strong> MGN là dịch vụ chính thức AWS khuyến nghị cho lift-and-shift: Replication Agent đồng bộ liên tục server nguồn, cho phép test không gián đoạn trước, rồi cutover với downtime tối thiểu.</li>\n<li><strong>C. ✗</strong> Export/import VM thủ công tốn nhiều thời gian, dữ liệu dễ lỗi thời nếu có thay đổi sau khi export — downtime lớn.</li>\n<li><strong>D. ✗</strong> Application Discovery Service chỉ dùng để theo dõi/khám phá trạng thái migration trên Migration Hub, không thực hiện migration thực tế.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Application Discovery Service nghe có vẻ liên quan đến \"migration\" nên dễ bị chọn nhầm, nhưng nó chỉ là công cụ <strong>theo dõi/khảo sát</strong>, không thực hiện việc replicate/di chuyển VM thực tế như MGN.</p>","tip":"<p>Lift-and-shift VM on-premises lên AWS, ít downtime nhất → <strong>AWS Application Migration Service (MGN)</strong> với Replication Agent + test trước khi cutover.</p>"},
{"id":38,"topic":"Design Cost-Optimized Architectures – Nơi lưu trữ chứng chỉ SSL/TLS public","supplement":false,"stem":"<p>A web application runs on an Auto Scaling group of Amazon EC2 instances deployed across multiple Availability Zones and is fronted by an Application Load Balancer. To enhance security, an SSL/TLS solution is required, and a certificate has been obtained from a third-party certificate authority (CA).</p><p>Which services can the SSL/TLS certificate be securely imported into for use with the application? (Select TWO.)</p>","options":[{"html":"Use a custom client-side root key (CSE-C) encryption to securely store the SSL/TLS certificate","correct":false},{"html":"An Amazon S3 bucket configured with server-side encryption with customer-provided encryption keys (SSE-C)","correct":false},{"html":"A private Amazon S3 bucket with versioning enabled","correct":false},{"html":"AWS IAM certificate store","correct":true},{"html":"AWS Certificate Manager","correct":true}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Đã có certificate từ CA bên thứ ba, cần import vào dịch vụ AWS để gắn lên listener của ALB.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn 2 nơi lưu trữ certificate hợp lệ, tích hợp được với ELB.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Chỉ có <strong>ACM</strong> (khuyến nghị hiện tại) và <strong>IAM certificate store</strong> (giải pháp cũ/legacy) mới tích hợp trực tiếp được với load balancer.</li>\n</ul>","answer":"<ul>\n<li><strong>AWS Certificate Manager.</strong></li>\n<li><strong>AWS IAM certificate store.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Đây chỉ là cách tự mã hóa/lưu file, không phải dịch vụ quản lý certificate — AWS service không thể trực tiếp dùng certificate được mã hóa kiểu này cho SSL termination.</li>\n<li><strong>B. ✗</strong> SSE-C chỉ mã hóa dữ liệu lưu trong S3 (data at rest), không có cơ chế tích hợp với load balancer để dùng làm SSL certificate.</li>\n<li><strong>C. ✗</strong> S3 chỉ là object storage; versioning giúp khôi phục file, nhưng certificate lưu ở đây vẫn chỉ là file thường, không gắn được trực tiếp vào ALB.</li>\n<li><strong>D. ✓</strong> IAM certificate store là giải pháp lưu certificate kiểu cũ (legacy) nhưng vẫn tương thích với một số service, bao gồm việc gắn vào load balancer.</li>\n<li><strong>E. ✓</strong> ACM là dịch vụ chuẩn, khuyến nghị để import/issue certificate và gắn trực tiếp vào ALB, CloudFront, API Gateway.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Các phương án liên quan S3 (SSE-C, versioning) nghe có vẻ \"bảo mật certificate\" hợp lý, nhưng S3 chỉ là object storage thuần — không có cơ chế tích hợp certificate với ELB như ACM hay IAM certificate store.</p>","tip":"<p>Import certificate SSL/TLS từ CA bên thứ 3 để dùng với ELB/CloudFront → <strong>AWS Certificate Manager</strong> (khuyến nghị) hoặc <strong>IAM certificate store</strong> (legacy).</p>"},
{"id":39,"topic":"Design Secure Architectures – Cấp quyền public read cho S3 object","supplement":false,"stem":"<p>A media company needs to configure an Amazon S3 bucket to serve static assets for the public-facing web application. Which methods ensure that all of the objects uploaded to the S3 bucket can be read publicly all over the Internet? (Select TWO.)</p>","options":[{"html":"Create an IAM role to set the objects inside the S3 bucket to public read.","correct":false},{"html":"Grant public read access to the object when uploading it using the S3 Console.","correct":true},{"html":"Configure the S3 bucket policy to set all objects to public read.","correct":true},{"html":"Configure the cross-origin resource sharing (CORS) of the S3 bucket to allow objects to be publicly accessible from all domains.","correct":false},{"html":"Do nothing. Amazon S3 objects are already public by default.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Muốn mọi object trong bucket đọc được công khai trên toàn Internet.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn 2 cách hợp lệ để cấp public read access cho object S3.</li>\n<li><strong>Từ khóa cần chú ý:</strong> S3 mặc định <strong>private</strong>; cấp public read qua <strong>bucket policy</strong> (áp dụng cho mọi object) hoặc cấp quyền <strong>lúc upload từng object</strong> qua Console/permission.</li>\n</ul>","answer":"<ul>\n<li><strong>Grant public read access to the object when uploading it using the S3 Console.</strong></li>\n<li><strong>Configure the S3 bucket policy to set all objects to public read.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> IAM role chỉ cấp quyền cho identity (user/service) thực hiện hành động, bản thân nó không thể trực tiếp đổi permission của object S3 thành public.</li>\n<li><strong>B. ✓</strong> Khi upload, bạn có thể chọn \"grant public read access\" cho object đó ngay trong Console — object sẽ công khai ngay sau khi upload.</li>\n<li><strong>C. ✓</strong> Bucket policy (resource-based policy) có thể áp dụng cho toàn bộ object trong bucket, cấp quyền đọc công khai đồng loạt mà không cần set riêng từng object.</li>\n<li><strong>D. ✗</strong> CORS chỉ kiểm soát việc web app ở domain này được gọi tài nguyên ở domain khác hay không, không liên quan đến việc public hóa object cho mọi người trên Internet.</li>\n<li><strong>E. ✗</strong> Sai hoàn toàn — mặc định mọi resource S3 đều <strong>private</strong>, chỉ account sở hữu mới truy cập được.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> CORS nghe liên quan đến \"truy cập từ nơi khác\" nên dễ bị nhầm với việc public hóa object, nhưng CORS chỉ kiểm soát cross-origin request của trình duyệt giữa các domain, khác hoàn toàn với việc set quyền public read.</p>","tip":"<p>S3 mặc định private. Cấp public read cho object → <strong>bucket policy</strong> (áp dụng hàng loạt) hoặc <strong>cấp quyền từng object lúc upload</strong> qua Console/API.</p>"},
{"id":40,"topic":"Design Secure Architectures – S3 Object Lock Compliance mode cho audit log 5 năm","supplement":false,"stem":"<p>A Solutions Architect is designing a monitoring application that generates audit logs of all operational activities of the company's cloud infrastructure. The IT Security and Compliance team mandates that the application retain the logs for 5 years before the data can be deleted.</p><p>How can the Architect meet the above requirement?</p>","options":[{"html":"Store the audit logs in an Amazon EBS volume and then take EBS snapshots every month.","correct":false},{"html":"Store the audit logs in an Amazon S3 bucket with versioning and S3 Object Lock enabled in Compliance mode.","correct":true},{"html":"Store the audit logs in an Amazon EFS volume and use Network File System version 4 (NFSv4) file-locking mechanism.","correct":false},{"html":"Store the audit logs in an Amazon S3 bucket and enable Multi-Factor Authentication Delete (MFA Delete) on the S3 bucket.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Audit log bắt buộc giữ đủ 5 năm, <strong>không ai được xóa/sửa</strong> trong thời gian đó (kể cả root user).</li>\n<li><strong>Yêu cầu chính:</strong> Chọn cơ chế WORM (write-once-read-many) chặn tuyệt đối việc xóa/ghi đè trong khoảng thời gian chỉ định.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Chặn tuyệt đối, kể cả root → <strong>S3 Object Lock, Compliance mode</strong> (không phải MFA Delete — vẫn có thể bị xóa nếu có đủ quyền MFA).</li>\n</ul>","answer":"<ul>\n<li><strong>Store the audit logs in an Amazon S3 bucket with versioning and S3 Object Lock enabled in Compliance mode.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Ai có quyền truy cập EBS/snapshot vẫn có thể xóa/sửa dữ liệu hoặc xóa snapshot — không đảm bảo WORM.</li>\n<li><strong>B. ✓</strong> Object Lock Compliance mode đảm bảo object không thể bị xóa/ghi đè bởi <strong>bất kỳ ai</strong>, kể cả root user, trong suốt retention period đã đặt (ở đây là 5 năm) — đúng yêu cầu khắt khe nhất.</li>\n<li><strong>C. ✗</strong> NFSv4 file-locking có thể bị override, không đảm bảo tính toàn vẹn dữ liệu tuyệt đối như Object Lock.</li>\n<li><strong>D. ✗</strong> MFA Delete chỉ yêu cầu thêm xác thực MFA khi xóa — nếu ai đó có đủ quyền + MFA thì vẫn xóa/sửa được log, không đáp ứng yêu cầu WORM tuyệt đối.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> MFA Delete nghe \"an toàn hơn\" vì cần thêm bước xác thực, nhưng về bản chất vẫn có thể xóa được nếu có đủ quyền — chỉ <strong>Object Lock Compliance mode</strong> mới chặn tuyệt đối kể cả root user.</p>","tip":"<p>Cần WORM tuyệt đối (không ai xóa/sửa được, kể cả root) trong 1 khoảng thời gian cố định → <strong>S3 Object Lock, Compliance mode</strong> (yêu cầu bật Versioning trước).</p>"}
,
{"id":41,"topic":"Design Cost-Optimized Architectures – Fault tolerance qua 3 AZ (cost-effective)","supplement":false,"stem":"<p>A web application requires a minimum of six Amazon Elastic Compute Cloud (EC2) instances running at all times. You are tasked to deploy the application to three availability zones in the EU Ireland region (eu-west-1a, eu-west-1b, and eu-west-1c). It is required that the system is fault-tolerant up to the loss of one Availability Zone.</p><p>Which of the following setup is the most cost-effective solution which also maintains the fault-tolerance of your system?</p>","options":[{"html":"2 instances in eu-west-1a, 2 instances in eu-west-1b, and 2 instances in eu-west-1c","correct":false},{"html":"6 instances in eu-west-1a, 6 instances in eu-west-1b, and no instances in eu-west-1c","correct":false},{"html":"3 instances in eu-west-1a, 3 instances in eu-west-1b, and 3 instances in eu-west-1c","correct":true},{"html":"6 instances in eu-west-1a, 6 instances in eu-west-1b, and 6 instances in eu-west-1c","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần tối thiểu 6 instance chạy luôn luôn, kể cả mất 1 AZ, với chi phí <strong>thấp nhất</strong> trong số các lựa chọn thỏa mãn.</li>\n<li><strong>Yêu cầu chính:</strong> Tìm phương án vừa đủ (không dư thừa) để đạt fault tolerance với số instance ít nhất.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"most cost-effective\" → tìm phương án có <strong>tổng số instance nhỏ nhất</strong> trong các lựa chọn vẫn đáp ứng ≥6 instance khi mất 1 AZ.</li>\n</ul>","answer":"<ul>\n<li><strong>3 instances in eu-west-1a, 3 instances in eu-west-1b, and 3 instances in eu-west-1c.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> 2+2+2=6; mất 1 AZ → chỉ còn 4 instance, dưới mức tối thiểu 6 — không đạt fault tolerance dù rẻ nhất.</li>\n<li><strong>B. ✗</strong> 6+6+0=12; mất 1 trong 2 AZ có 6 instance → còn đúng 6, đạt yêu cầu nhưng tổng 12 instance tốn kém hơn phương án C (tổng 9).</li>\n<li><strong>C. ✓</strong> 3+3+3=9; mất bất kỳ AZ nào → còn 3+3=6, đúng vừa đủ mức tối thiểu — đây là phương án ít instance nhất (rẻ nhất) vẫn đạt fault tolerance.</li>\n<li><strong>D. ✗</strong> 6+6+6=18; dù an toàn tuyệt đối nhưng tốn kém nhất (gấp đôi phương án C) mà không cần thiết.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Phương án D (18 instance) đạt fault tolerance tối đa nên dễ bị chọn nhầm là \"an toàn nhất\", nhưng đề hỏi phương án <strong>cost-effective nhất mà vẫn đạt fault tolerance</strong> — không phải phương án an toàn tuyệt đối.</p>","tip":"<p>Khi có nhiều phương án đều đạt fault tolerance, luôn chọn phương án có <strong>tổng số resource ít nhất</strong> (rẻ nhất) trong số đó.</p>"},
{"id":42,"topic":"Design Resilient Architectures – CloudWatch Alarm action tự restart EC2","supplement":false,"stem":"<p>A company has a web application hosted in AWS cloud where the application logs are sent to Amazon CloudWatch. Lately, the web application has been encountering some errors which can be resolved simply by restarting the instance.</p><p>What will you do to automatically restart the EC2 instances whenever the same application error occurs?</p>","options":[{"html":"First, look at the existing CloudWatch logs for keywords related to the application error to create a custom metric. Then, create a CloudWatch alarm for that custom metric which invokes an action to restart the EC2 instance.","correct":true},{"html":"First, look at the existing Flow logs for keywords related to the application error to create a custom metric. Then, create a CloudWatch alarm for that custom metric which calls a Lambda function that invokes an action to restart the EC2 instance.","correct":false},{"html":"First, look at the existing CloudWatch logs for keywords related to the application error to create a custom metric. Then, create an alarm in Amazon SNS for that custom metric which invokes an action to restart the EC2 instance.","correct":false},{"html":"First, look at the existing Flow logs for keywords related to the application error to create a custom metric. Then, create a CloudWatch alarm for that custom metric which invokes an action to restart the EC2 instance.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> App log (không phải network log) chứa từ khóa lỗi; cần tự động restart EC2 khi lỗi đó xuất hiện.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng nguồn log (application log, không phải VPC Flow Logs) + đúng công cụ tạo alarm action (CloudWatch Alarm, không phải SNS).</li>\n<li><strong>Từ khóa cần chú ý:</strong> Flow Logs chỉ ghi lại traffic <strong>network</strong> của VPC/ENI, không chứa log <strong>ứng dụng</strong>; CloudWatch Alarm (không phải SNS) mới có khả năng invoke action \"reboot instance\".</li>\n</ul>","answer":"<ul>\n<li><strong>First, look at the existing CloudWatch logs for keywords related to the application error to create a custom metric. Then, create a CloudWatch alarm for that custom metric which invokes an action to restart the EC2 instance.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> CloudWatch Logs chứa log ứng dụng; tạo metric filter dựa trên từ khóa lỗi, rồi gắn CloudWatch Alarm với action \"Reboot this instance\" — đúng cơ chế native có sẵn.</li>\n<li><strong>B. ✗</strong> Flow Logs chỉ ghi traffic mạng (IP, port, byte...), không chứa nội dung lỗi ứng dụng để tạo custom metric từ đó.</li>\n<li><strong>C. ✗</strong> Không thể tạo \"alarm\" trong Amazon SNS — SNS chỉ là đích nhận thông báo, bản thân alarm action (reboot/stop/recover) chỉ tồn tại trong CloudWatch Alarm.</li>\n<li><strong>D. ✗</strong> Sai cả 2: vẫn dùng Flow Logs (không chứa lỗi ứng dụng) y như B.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Flow Logs và CloudWatch Logs đều là \"log\" trên AWS nên dễ nhầm, nhưng Flow Logs chỉ ghi network traffic (VPC), còn log lỗi ứng dụng (application log) phải nằm trong CloudWatch Logs do chính app gửi lên.</p>","tip":"<p>Tự động reboot/stop/terminate EC2 khi gặp điều kiện cụ thể → dùng <strong>CloudWatch Alarm Action</strong> (không phải tạo alarm trong SNS). Log lỗi ứng dụng → nằm trong <strong>CloudWatch Logs</strong>, không phải Flow Logs (chỉ ghi network traffic).</p>"},
{"id":43,"topic":"Design Cost-Optimized Architectures – S3 One Zone-IA theo prefix + Glacier","supplement":false,"stem":"<p>A few easily reproducible files must be stored in AWS without concerns about storage capacity. During the first month, all files will be accessed frequently, but after that period, access will become infrequent. Older files will only be accessed by developers, and no specific retrieval time requirement is defined. However, files under a specific <code>finance-reports</code> prefix in the Amazon S3 bucket will be used for post-processing that requires millisecond retrieval time.</p><p>Given these conditions, which of the following options would be the most cost-effective solution for the storage requirements?</p>","options":[{"html":"Store the files in S3, then after a month, change the storage class of the finance-reports prefix to S3 Standard-Infrequent Access (Standard-IA) while the remaining go to Glacier using a lifecycle policy.","correct":false},{"html":"Store the files in S3, then after a month, change the storage class of the finance-reports prefix to S3 One Zone-Infrequent Access (One-Zone IA), while the remaining go to Glacier using a lifecycle policy.","correct":true},{"html":"Store the files in S3, then after a month, change the storage class of the bucket to S3 Standard-Infrequent Access (Standard-IA) using a lifecycle policy.","correct":false},{"html":"Store the files in S3, then after a month, change the storage class of the bucket to S3 Intelligent-Tiering using a lifecycle policy.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> File <strong>dễ tái tạo lại</strong> (easily reproducible, chịu được rủi ro mất dữ liệu tạm thời); file thuộc prefix <code>finance-reports</code> cần retrieval <strong>mili-giây</strong>, các file khác thì không yêu cầu thời gian retrieval cụ thể.</li>\n<li><strong>Yêu cầu chính:</strong> Phân loại theo prefix: phần cần truy cập nhanh → storage class rẻ nhất vẫn có millisecond access; phần còn lại → archive giá rẻ nhất.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"easily reproducible\" + cần millisecond access → <strong>One Zone-IA</strong> (rẻ hơn Standard-IA vì chỉ lưu 1 AZ, chấp nhận được vì dữ liệu dễ tái tạo); phần còn lại không cần millisecond → <strong>Glacier</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Store the files in S3, then after a month, change the storage class of the finance-reports prefix to S3 One Zone-Infrequent Access (One-Zone IA), while the remaining go to Glacier using a lifecycle policy.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Standard-IA vẫn còn đắt hơn One Zone-IA; vì file dễ tái tạo nên chấp nhận rủi ro mất 1 AZ để đổi lấy chi phí thấp hơn là hợp lý.</li>\n<li><strong>B. ✓</strong> Prefix <code>finance-reports</code> cần millisecond access → One Zone-IA đáp ứng được với chi phí thấp hơn Standard-IA (do file dễ tái tạo nên chấp nhận chỉ lưu 1 AZ); các file khác không cần SLA retrieval cụ thể → chuyển hẳn sang Glacier giá rẻ nhất.</li>\n<li><strong>C. ✗</strong> Standard-IA đắt hơn One Zone-IA không cần thiết, lại áp dụng cho toàn bộ bucket thay vì phân loại theo prefix.</li>\n<li><strong>D. ✗</strong> Intelligent-Tiering phù hợp khi pattern truy cập <strong>không dự đoán được</strong>; ở đây pattern đã rõ ràng (1 tháng đầu frequent, sau đó infrequent) nên chuyển class trực tiếp qua lifecycle policy tiết kiệm hơn.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Intelligent-Tiering nghe \"thông minh, tối ưu tự động\" nên dễ bị chọn nhầm, nhưng nó chỉ hiệu quả khi access pattern <strong>không đoán trước được</strong> — ở đây pattern đã biết rõ nên dùng lifecycle policy chuyển class trực tiếp sẽ rẻ hơn.</p>","tip":"<p>File dễ tái tạo (chấp nhận rủi ro mất dữ liệu 1 AZ) + cần truy cập nhanh → <strong>S3 One Zone-IA</strong> (rẻ hơn Standard-IA). Access pattern đã biết rõ theo thời gian → dùng <strong>Lifecycle Policy</strong> trực tiếp, không cần Intelligent-Tiering.</p>"},
{"id":44,"topic":"Design High-Performing Architectures – DataSync qua Direct Connect service endpoint","supplement":false,"stem":"<p>An organization plans to use an AWS Direct Connect connection to establish a dedicated connection between its on-premises network and AWS. The organization needs to launch a fully managed solution that will automate and accelerate the replication of data to and from various AWS storage services.</p><p>Which of the following solutions would you recommend?</p>","options":[{"html":"Use an AWS DataSync agent to rapidly move the data over the Internet.","correct":false},{"html":"Use an AWS Storage Gateway file gateway to store and retrieve files directly using the SMB file system protocol.","correct":false},{"html":"Use an AWS Storage Gateway tape gateway to store data on virtual tape cartridges and asynchronously copy your backups to AWS.","correct":false},{"html":"Use an AWS DataSync agent to rapidly move the data over a service endpoint.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Đã có Direct Connect (kết nối private), cần dịch vụ tự động + tăng tốc replicate dữ liệu đến nhiều loại AWS storage.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng dịch vụ (DataSync) + đúng đường kết nối (qua Direct Connect service endpoint, không qua Internet).</li>\n<li><strong>Từ khóa cần chú ý:</strong> Đã dùng Direct Connect (private) → kết nối DataSync phải đi qua <strong>service endpoint của Direct Connect</strong>, không phải Internet công cộng.</li>\n</ul>","answer":"<ul>\n<li><strong>Use an AWS DataSync agent to rapidly move the data over a service endpoint.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Dùng Internet đi ngược lại mục đích thiết lập Direct Connect (kết nối private, không qua Internet công cộng).</li>\n<li><strong>B, C. ✗</strong> Storage Gateway (file/tape gateway) dùng cho hybrid cloud storage lâu dài, không phải để \"tăng tốc replicate dữ liệu\" linh hoạt đến nhiều loại storage như yêu cầu — DataSync mới đúng mục đích \"automate and accelerate\" này.</li>\n<li><strong>D. ✓</strong> DataSync agent kết nối qua Direct Connect service endpoint (kết nối private, programmatic) thay vì qua Internet — tận dụng đúng hạ tầng DX đã có sẵn.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ chọn nhầm Storage Gateway vì cũng liên quan \"hybrid storage\", nhưng Storage Gateway chủ yếu để duy trì truy cập storage kiểu hybrid lâu dài, không phải để \"accelerate replication\" dữ liệu như DataSync.</p>","tip":"<p>Tự động + tăng tốc replicate dữ liệu đến nhiều AWS storage service → <strong>AWS DataSync</strong>. Khi đã có Direct Connect, kết nối DataSync phải qua <strong>service endpoint</strong> (không qua Internet).</p>"},
{"id":45,"topic":"Design Secure Architectures – ACM public certificate cho ALB","supplement":false,"stem":"<p>A company has several web applications with users all around the world. Each application is hosted in an Auto Scaling group of EC2 instances in multiple AZs behind an Application Load Balancer (ALB). All applications have their own fully qualified domain name. For added security, the applications must use a publicly trusted SSL certificate.</p><p>Which solution will meet this requirement with the LEAST operational overhead?</p>","options":[{"html":"Use OpenSSL to generate a self-signed certificate. Import the SSL/TLS certificate to the AWS Certificate Manager (ACM) and associate it with the HTTPS listener of the ALBs","correct":false},{"html":"Issue an SSL/TLS certificate using the AWS Certificate Manager Private Certificate Authority. Associate the new certificate on the HTTPS listener of the ALBs.","correct":false},{"html":"Launch a self-hosted certificate authority (CA) using the Let's Encrypt tool in an Amazon EC2 instance. Utilize the built-in ISRG Root X1 trusted root CA certificate. Generate a new SSL/TLS certificate using the certbot CLI utility. Associate the new certificate on the HTTPS listener of the ALBs.","correct":false},{"html":"Use the AWS Certificate Manager (ACM) to generate a public SSL/TLS certificate. Associate the new SSL/TLS certificate on the HTTPS listener of the ALBs.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần chứng chỉ SSL <strong>publicly trusted</strong> (không phải private/internal), ít operational overhead nhất.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn cách tạo certificate tự động, được AWS quản lý renewal, và đúng loại \"public trusted\".</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"publicly trusted\" → <strong>ACM public certificate</strong> (tự renew), không phải ACM Private CA (chỉ trusted nội bộ) hay self-signed/Let's Encrypt (phải tự quản lý renewal).</li>\n</ul>","answer":"<ul>\n<li><strong>Use the AWS Certificate Manager (ACM) to generate a public SSL/TLS certificate. Associate the new SSL/TLS certificate on the HTTPS listener of the ALBs.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Self-signed certificate không phải \"publicly trusted\"; phải tự tạo, tự quản lý, và tự reimport mỗi khi hết hạn (ACM không tự renew certificate tự ký) — nhiều overhead.</li>\n<li><strong>B. ✗</strong> ACM Private CA chỉ tạo certificate <strong>private</strong>, chỉ được tin cậy nội bộ tổ chức, không phải \"publicly trusted\" như yêu cầu.</li>\n<li><strong>C. ✗</strong> Phải tự host CA, tự chạy certbot, tự renew bằng tay — rất nhiều operational overhead so với dùng ACM có sẵn.</li>\n<li><strong>D. ✓</strong> ACM public certificate miễn phí, được các trình duyệt/thiết bị tin cậy công khai, tự động renew khi gắn với ALB — đúng \"LEAST operational overhead\".</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> ACM Private CA cũng là dịch vụ của ACM nên dễ bị nhầm là đáp án đúng, nhưng \"Private\" CA chỉ tạo certificate <strong>không được tin cậy công khai</strong> — hoàn toàn khác với yêu cầu \"publicly trusted\" của đề.</p>","tip":"<p>Cần certificate <strong>publicly trusted</strong>, tự động renew, ít overhead nhất → <strong>ACM public certificate</strong> (không phải ACM Private CA, vốn chỉ dùng nội bộ).</p>"},
{"id":46,"topic":"Design Secure Architectures – API Gateway custom domain + ACM cùng region","supplement":false,"stem":"<p>A company has a regional API Gateway in the us-east-2 region that serves as a proxy to a backend service. Clients connect to the service using the invoke URL of the API stage. To improve usability, the company wants to associate a custom domain name (api.example.com) with the API. Moreover, the domain name must support HTTPS to ensure secure connections. The company has an existing hosted zone for its domain on Amazon Route 53.</p><p>Which of the following would be the next step to achieve the company's objective?</p>","options":[{"html":"Import an existing public certificate for api.example.com into AWS Certificate Manager (ACM) in the us-east-2. In Route 53, create a CNAME record for api.example.com that points to the invoke URL of the API Gateway stage.","correct":false},{"html":"Request a public certificate in the us-east-1 region for api.example.com using AWS Certificate Manager (ACM). Create a regional API Gateway domain name and associate it with api.example.com and the ACM certificate. In Route 53, create an alias record for api.example.com that points to the API Gateway domain name.","correct":false},{"html":"Request a public certificate in the us-east-2 region for api.example.com using AWS Certificate Manager (ACM). Create a regional API Gateway domain name and associate it with api.example.com and the ACM certificate. In Route 53, create an alias record for api.example.com that points to the API Gateway domain name.","correct":true},{"html":"Use the AWS Certificate Manager Private Certificate Authority (ACM PCA) to generate a private certificate for api.example.com. Override the invoke URL using stage variables.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> API Gateway loại <strong>Regional</strong> (us-east-2), cần custom domain name hỗ trợ HTTPS.</li>\n<li><strong>Yêu cầu chính:</strong> Request certificate đúng region, tạo custom domain name trên API Gateway, rồi trỏ Route 53 alias record.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Với Regional API Gateway, certificate phải request/import <strong>cùng region</strong> với API (khác với Edge-optimized luôn cần ACM ở us-east-1).</li>\n</ul>","answer":"<ul>\n<li><strong>Request a public certificate in the us-east-2 region for api.example.com using AWS Certificate Manager (ACM). Create a regional API Gateway domain name and associate it with api.example.com and the ACM certificate. In Route 53, create an alias record for api.example.com that points to the API Gateway domain name.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Không thể chỉ trỏ CNAME trực tiếp đến invoke URL để có custom domain với HTTPS — phải dùng tính năng Custom Domain Name của API Gateway kèm certificate hợp lệ.</li>\n<li><strong>B. ✗</strong> Request certificate ở sai region (us-east-1); với Regional API Gateway certificate phải nằm cùng region với API (us-east-2), không phải luôn luôn us-east-1 như Edge-optimized.</li>\n<li><strong>C. ✓</strong> Request certificate đúng region (us-east-2, cùng region với Regional API Gateway), tạo custom domain name gắn với certificate đó, rồi Route 53 alias record trỏ đến API Gateway domain name — đúng quy trình chuẩn.</li>\n<li><strong>D. ✗</strong> Private certificate chỉ tin cậy nội bộ, không đủ cho truy cập public qua Internet; stage variable không liên quan đến việc gán custom domain.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Nhiều người quen với rule \"ACM certificate cho CloudFront luôn phải ở us-east-1\" rồi áp dụng nhầm sang API Gateway Regional — với Regional endpoint, certificate phải cùng region với chính API đó.</p>","tip":"<p>API Gateway <strong>Edge-optimized</strong>: certificate luôn ở us-east-1 (vì dùng CloudFront). API Gateway <strong>Regional</strong>: certificate phải cùng region với API đó.</p>"},
