<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Test 9 · SAA-C03</title>
<style>
:root{
  --bg:#f6f7fb; --surface:#ffffff; --surface-2:#eef0f5; --text:#1a1d23; --muted:#646c78;
  --border:#dfe3ea; --accent:#3a5bf0; --accent-hover:#2d49d6; --accent-soft:#e8edfe;
  --ok:#1a8f55; --ok-soft:#e4f6ec; --bad:#d13b3b; --bad-soft:#fcebeb; --warn:#b4790a; --warn-soft:#fff3db;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
    --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
    --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
    --shadow:none; --shadow-sm:none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#1a1d24; --surface-2:#22262f; --text:#e9ebef; --muted:#9aa2b1;
  --border:#2e333d; --accent:#8aa6ff; --accent-hover:#a6bcff; --accent-soft:#1f2a44;
  --ok:#53d591; --ok-soft:#163327; --bad:#ff8585; --bad-soft:#3a1d1f; --warn:#f2bb57; --warn-soft:#3a2d13;
  --shadow:none; --shadow-sm:none;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font:15px/1.65 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .2s ease,color .2s ease;
}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em;background:var(--surface-2);padding:.1em .4em;border-radius:5px}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 56px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
header.top h1{
  font-size:21px;margin:0;letter-spacing:-.015em;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent-hover));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
header.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:7px 14px;min-width:76px;text-align:center;box-shadow:var(--shadow-sm);transition:border-color .15s ease,transform .15s ease}
.stat:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--muted)}
.stat.ok b{color:var(--ok)} .stat.bad b{color:var(--bad)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:6px 0 16px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-hover));width:0;transition:width .3s ease}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:16px}
.toolbar select,.btn{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 13px;cursor:pointer;transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent}
.toolbar label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
.layout{display:grid;grid-template-columns:264px 1fr;gap:18px;align-items:start}
.side{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;position:sticky;top:14px;box-shadow:var(--shadow)}
.side h2{font-size:12.5px;margin:0 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.cell{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;height:32px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums;position:relative;padding:0;transition:border-color .12s ease,transform .12s ease,background .12s ease}
.cell:hover{border-color:var(--accent);transform:translateY(-1px)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);outline-offset:1px}
.cell.dim{opacity:.32}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cell.sup{font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--border);background:var(--surface-2)}
.legend .l-ok::before{background:var(--ok-soft);border-color:var(--ok)}
.legend .l-bad::before{background:var(--bad-soft);border-color:var(--bad)}
.legend .l-flag::before{background:var(--warn);border-radius:50%;border:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:var(--shadow)}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.qnum{font-weight:700;font-size:17px;letter-spacing:-.01em}
.chip{font-size:12px;padding:3px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;transition:transform .12s ease}
.chip.sup{background:var(--warn-soft);color:var(--warn)}
.chip.multi{background:var(--surface-2);color:var(--muted);font-weight:500}
.flagbtn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:13px;transition:border-color .15s ease,background .15s ease,transform .15s ease}
.flagbtn:hover{border-color:var(--warn);color:var(--warn);transform:translateY(-1px)}
.flagbtn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.stem{line-height:1.7}
.stem p{margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:9px;margin:16px 0}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:11px;padding:11px 13px;cursor:pointer;background:var(--surface);transition:border-color .15s ease,background .15s ease,transform .15s ease,box-shadow .15s ease}
.opt:hover{border-color:var(--accent);transform:translateX(2px);box-shadow:var(--shadow-sm)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .key{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--surface-2);transition:background .15s ease,border-color .15s ease,color .15s ease}
.opt.multi .key{border-radius:7px}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:var(--border);transform:none;box-shadow:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.tag{font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap}
.opt.right .tag{color:var(--ok)} .opt.wrong .tag{color:var(--bad)} .opt.missed .tag{color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .spacer{flex:1}
.verdict{margin:18px 0 6px;padding:11px 15px;border-radius:11px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.hint{margin-top:16px;border:1px solid var(--border);border-left:3px solid var(--warn);border-radius:9px;padding:11px 15px;background:var(--surface-2)}
.hint h3{margin:0 0 6px;font-size:14px;color:var(--warn)}
details.sec{border:1px solid var(--border);border-radius:11px;margin-top:11px;background:var(--surface);transition:border-color .15s ease}
details.sec>summary{cursor:pointer;padding:11px 15px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"›";display:inline-block;transition:transform .15s ease;color:var(--muted);font-size:18px;line-height:1}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec .body{padding:0 16px 14px}
.body p{margin:7px 0}
.body ul,.body ol{margin:7px 0;padding-left:22px}
.body li{margin:4px 0}
.body table,.stem table{border-collapse:collapse;width:100%;margin:9px 0;font-size:14px;display:block;overflow-x:auto}
.body th,.body td,.stem th,.stem td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
.body th,.stem th{background:var(--surface-2)}
.sec.s-answer{border-left:3px solid var(--ok)}
.sec.s-tip{border-left:3px solid var(--accent)}
.empty{color:var(--muted);text-align:center;padding:44px 10px}
.kbd{font-size:12px;color:var(--muted);margin-top:14px}
.kbd kbd{font-family:inherit;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface-2)}
.summary h2{margin-top:0}
.summary table{border-collapse:collapse;width:100%;font-size:14px}
.summary th,.summary td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left}
.summary td.n{font-variant-numeric:tabular-nums;text-align:right}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s ease}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .grid{grid-template-columns:repeat(10,1fr)}
}
@media (max-width:480px){
  .wrap{padding:14px 16px 40px}
  .card{padding:16px}
  .grid{grid-template-columns:repeat(8,1fr)}
  .stat{min-width:64px;padding:5px 10px}
}
</style>
</head>

    <p style="margin:4px 0 0"><a href="../index.html" style="color:var(--accent)">&larr; Về trang luyện đề chính</a></p>
    </div>

      </div>

    <main id="main"></main>

<script>
const Q = [
{"id":1,"topic":"Design Resilient Architectures – RDS storage autoscaling","supplement":false,"stem":"<p>A production MySQL database hosted on Amazon RDS is running out of disk storage. The management has consulted its solutions architect to increase the disk space without impacting the database performance.</p><p>How can the solutions architect satisfy the requirement with the LEAST operational overhead?</p>","options":[{"html":"Change the <code>default_storage_engine</code> of the DB instance's parameter group to MyISAM.","correct":false},{"html":"Modify the DB instance storage type to Provisioned IOPS.","correct":false},{"html":"Modify the DB instance settings and enable storage autoscaling.","correct":true},{"html":"Increase the allocated storage for the DB instance.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> DB RDS sắp hết dung lượng đĩa, cần tăng storage mà không ảnh hưởng hiệu năng.</li>\n<li><strong>Yêu cầu chính:</strong> Giải pháp có <strong>ít operational overhead nhất</strong>.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"LEAST operational overhead\" → cần cơ chế tự động, không phải thao tác thủ công lặp lại.</li>\n</ul>","answer":"<ul>\n<li><strong>Modify the DB instance settings and enable storage autoscaling.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> MyISAM chỉ là storage engine của MySQL, không liên quan đến dung lượng đĩa.</li>\n<li><strong>B. ✗</strong> Provisioned IOPS cải thiện hiệu năng I/O, không giải quyết việc hết dung lượng lưu trữ.</li>\n<li><strong>C. ✓</strong> RDS Storage Auto Scaling tự động tăng dung lượng khi gần chạm ngưỡng, không downtime, không cần người can thiệp mỗi lần — đúng \"LEAST overhead\".</li>\n<li><strong>D. ✗</strong> Tăng storage thủ công vẫn giải quyết được vấn đề trước mắt nhưng đòi hỏi theo dõi và can thiệp lặp lại mỗi khi gần đầy.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> \"Increase the allocated storage\" nghe có vẻ đúng vì cũng tăng được dung lượng, nhưng đó là thao tác thủ công một lần, không tự động — không đáp ứng \"LEAST operational overhead\" như Auto Scaling.</p>","tip":"<p>Thấy \"LEAST operational overhead\" + nhu cầu co giãn dung lượng theo thời gian → ưu tiên tính năng auto scaling/tự động thay vì thao tác thủ công.</p>"},
{"id":2,"topic":"Design Resilient Architectures – SQS decoupling cho Auto Scaling","supplement":false,"stem":"<p>A manufacturing company has EC2 instances running in AWS. The EC2 instances are configured with Auto Scaling. There are a lot of requests being lost because of too much load on the servers. The Auto Scaling is launching new EC2 instances to take the load accordingly yet, there are still some requests that are being lost.</p><p>Which of the following is the MOST suitable solution that you should implement to avoid losing recently submitted requests?</p>","options":[{"html":"Set up Amazon Aurora Serverless for on-demand, auto-scaling configuration of your EC2 Instances and also enable Amazon Aurora Parallel Query feature for faster analytical queries over your current data.","correct":false},{"html":"Use larger instances for your application with an attached Elastic Fabric Adapter (EFA).","correct":false},{"html":"Use an Amazon SQS queue to decouple the application components and scale-out the EC2 instances based upon the ApproximateNumberOfMessages metric in Amazon CloudWatch.","correct":true},{"html":"Replace the Auto Scaling group with a cluster placement group to achieve a low-latency network performance necessary for tightly-coupled node-to-node communication.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> EC2 + Auto Scaling vẫn mất request dù đã scale-out, do request xử lý trực tiếp, không có buffer.</li>\n<li><strong>Yêu cầu chính:</strong> Không mất request khi tải tăng đột biến, trước khi Auto Scaling kịp phản ứng.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"losing recently submitted requests\" → cần một lớp đệm (queue) để giữ request lại thay vì để nó rớt.</li>\n</ul>","answer":"<ul>\n<li><strong>Use an Amazon SQS queue to decouple the application components and scale-out the EC2 instances based upon the ApproximateNumberOfMessages metric in Amazon CloudWatch.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Aurora Serverless là auto-scaling cho database, không phải cho EC2 compute; Parallel Query chỉ tăng tốc query phân tích.</li>\n<li><strong>B. ✗</strong> Instance lớn hơn + EFA cải thiện hiệu năng mạng/tính toán nhưng không ngăn mất dữ liệu khi có spike vượt khả năng xử lý tức thời.</li>\n<li><strong>C. ✓</strong> SQS giữ request trong queue (durable), decouple producer/consumer; Auto Scaling scale theo backlog (ApproximateNumberOfMessages) để xử lý dần, không request nào bị rớt.</li>\n<li><strong>D. ✗</strong> Cluster placement group chỉ cải thiện độ trễ mạng giữa các instance, không thay thế được việc cần Auto Scaling để thêm capacity.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nghĩ \"instance mạnh hơn\" hoặc \"network tốt hơn\" sẽ giải quyết được tình trạng mất request, nhưng vấn đề gốc là thiếu buffer để hấp thụ spike — chỉ SQS mới giải quyết triệt để.</p>","tip":"<p>Request bị mất khi tải tăng đột biến dù đã Auto Scaling → luôn nghĩ đến SQS làm lớp đệm (buffer) giữa producer và consumer.</p>"},
{"id":3,"topic":"Design Resilient Architectures – Kinesis retention period","supplement":false,"stem":"<p>A company installed sensors to track the number of people who visit the park. The data is sent every day to an Amazon Kinesis stream with default settings for processing, in which a consumer is configured to process the data every other day. The employee noticed that the Amazon S3 bucket is not receiving all of the data that is being sent to the Kinesis stream. The employee checked the sensors to see if its properly sending the data to Kinesis and verified that the data is indeed sent every day.</p><p>What could be the reason for this?</p>","options":[{"html":"Your AWS account was hacked and someone has deleted some data in your Kinesis stream.","correct":false},{"html":"There is a problem in the sensors. They probably had some intermittent connection hence, the data is not sent to the stream.","correct":false},{"html":"By default, the data records are only accessible for 24 hours from the time they are added to a Kinesis stream.","correct":true},{"html":"An AWS Batch jobs consumer processed the data, but it missed records because batch jobs are not designed for streaming sources.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Sensor gửi data mỗi ngày vào Kinesis, nhưng consumer chỉ đọc 2 ngày/lần → dữ liệu bị thiếu ở S3.</li>\n<li><strong>Yêu cầu chính:</strong> Xác định nguyên nhân gốc rễ của việc mất dữ liệu.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"consumer processes every other day\" + Kinesis mặc định → liên tưởng đến <strong>retention period</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>By default, the data records are only accessible for 24 hours from the time they are added to a Kinesis stream.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Không có bằng chứng nào về việc tài khoản bị hack; đây là suy đoán không dựa trên dữ kiện đề bài.</li>\n<li><strong>B. ✗</strong> Đề bài đã xác nhận sensor hoạt động bình thường và gửi dữ liệu đều đặn mỗi ngày.</li>\n<li><strong>C. ✓</strong> Kinesis Data Streams mặc định lưu record 24 giờ; consumer đọc 2 ngày/lần nên record của ngày đầu đã hết hạn và bị loại bỏ trước khi được đọc.</li>\n<li><strong>D. ✗</strong> AWS Batch không phải là consumer tiêu chuẩn của Kinesis; đây không phải nguyên nhân được đề cập hay phù hợp với bối cảnh.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ đổ lỗi cho sensor hoặc bảo mật khi thấy mất dữ liệu, nhưng cần đọc kỹ thông số kỹ thuật mặc định của dịch vụ (retention period) trước khi suy đoán nguyên nhân bên ngoài.</p>","tip":"<p>Kinesis Data Streams: retention mặc định <strong>24 giờ</strong>, tối đa <strong>8760 giờ (365 ngày)</strong>. Consumer đọc chậm hơn retention → mất dữ liệu.</p>"},
{"id":4,"topic":"Design Resilient Architectures – EC2 không truy cập được Internet","supplement":false,"stem":"<p>A Solutions Architect for a global news company is configuring a fleet of EC2 instances in a subnet that currently is in a VPC with an Internet gateway attached. All of these EC2 instances can be accessed from the Internet. The architect launches another subnet and deploys an EC2 instance in it, however, the architect is not able to access the EC2 instance from the Internet.</p><p>What could be the possible reasons for this issue? (Select TWO.)</p>","options":[{"html":"The Amazon EC2 instance is not a member of the same Auto Scaling group.","correct":false},{"html":"The Amazon EC2 instance does not have a public IP address associated with it.","correct":true},{"html":"The route table is not configured properly to send traffic from the EC2 instance to the Internet through the Internet gateway.","correct":true},{"html":"The Amazon EC2 instance does not have an attached Elastic Fabric Adapter (EFA).","correct":false},{"html":"The route table is not configured properly to send traffic from the EC2 instance to the Internet through the customer gateway (CGW).","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Subnet cũ truy cập Internet bình thường; subnet mới không truy cập được dù VPC đã có Internet Gateway.</li>\n<li><strong>Yêu cầu chính:</strong> Tìm 2 nguyên nhân khả dĩ khiến EC2 trong subnet mới không ra được Internet.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Để instance truy cập Internet cần đủ 2 điều kiện: <strong>public/Elastic IP</strong> và <strong>route table trỏ đến Internet Gateway</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>The Amazon EC2 instance does not have a public IP address associated with it.</strong></li>\n<li><strong>The route table is not configured properly to send traffic from the EC2 instance to the Internet through the Internet gateway.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Auto Scaling group không ảnh hưởng đến khả năng kết nối Internet của instance.</li>\n<li><strong>B. ✓</strong> Không có public/Elastic IP thì dù có IGW, instance vẫn không thể được truy cập từ Internet (và ngược lại ra ngoài).</li>\n<li><strong>C. ✓</strong> Subnet mới có thể chưa được associate với route table có route <code>0.0.0.0/0 → igw</code>, nên vẫn là subnet private dù VPC có IGW.</li>\n<li><strong>D. ✗</strong> EFA chỉ tăng tốc mạng cho khối lượng HPC/machine learning, không liên quan đến việc truy cập Internet cơ bản.</li>\n<li><strong>E. ✗</strong> Customer Gateway (CGW) dùng cho VPN, không phải để ra Internet công cộng — route đúng phải trỏ đến Internet Gateway.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Nhiều người chỉ nghĩ đến route table mà quên rằng instance cũng cần có public IP; phải kiểm tra <strong>cả hai</strong> điều kiện.</p>","tip":"<p>EC2 ra được Internet cần đủ 2 thứ: (1) <strong>public/Elastic IP</strong>, (2) <strong>route table của subnet có route đến Internet Gateway</strong>. Thiếu 1 trong 2 là không kết nối được.</p>"},
{"id":5,"topic":"Design Secure Architectures – Cross-account S3 object ownership","supplement":false,"stem":"<p>A company uses multiple AWS accounts consolidated under AWS Organizations. The company needs to copy multiple Amazon S3 objects to an S3 bucket in a different owned AWS account. The Solutions Architect must configure permissions to enable this transfer while ensuring the destination account owns the copied objects rather than the source account.</p><p>How can the Architect accomplish this requirement?</p>","options":[{"html":"Configure cross-account permissions in S3 by creating an IAM customer-managed policy that allows an IAM user or role to copy objects from the source bucket in one account to the destination bucket in the other account. Then attach the policy to the IAM user or role that you want to use to copy objects between accounts.","correct":true},{"html":"Connect the two S3 buckets from two different AWS accounts to Amazon WorkDocs. Set up cross-account access to integrate the two S3 buckets. Use the WorkDocs console to copy the objects from one account to the other with modified object ownership assigned to the destination account.","correct":false},{"html":"Enable the Requester Pays feature in the source S3 bucket. The fees would be waived through Consolidated Billing since both AWS accounts are part of the organization.","correct":false},{"html":"Set up cross-origin resource sharing (CORS) in S3 by creating a bucket policy that includes AmazonS3FullAccess and allows an IAM user or role to copy objects from the source bucket in one account to the destination bucket in the other account.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Copy object S3 giữa 2 account khác nhau, nhưng muốn account <strong>đích</strong> sở hữu object sau khi copy (không phải account nguồn).</li>\n<li><strong>Yêu cầu chính:</strong> Cấu hình permission để thực hiện cross-account copy mà object ownership thuộc về account đích.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Mặc định, object thuộc về account thực hiện upload → muốn account đích sở hữu, chính account đích phải là bên thực hiện copy.</li>\n</ul>","answer":"<ul>\n<li><strong>Configure cross-account permissions in S3 by creating an IAM customer-managed policy... Then attach the policy to the IAM user or role that you want to use to copy objects between accounts.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> Gắn bucket policy ở nguồn cho phép account đích đọc, và IAM policy ở account đích cho phép copy; vì chính IAM user/role của account đích thực hiện thao tác copy nên object mới sẽ thuộc sở hữu account đích.</li>\n<li><strong>B. ✗</strong> Amazon WorkDocs dùng để cộng tác/chỉnh sửa tài liệu, không có cơ chế tích hợp trực tiếp với S3 bucket của account khác để copy object.</li>\n<li><strong>C. ✗</strong> Requester Pays chỉ liên quan đến việc ai trả phí data transfer, không giải quyết vấn đề permission hay ownership.</li>\n<li><strong>D. ✗</strong> CORS chỉ cho phép web app ở domain này gọi tài nguyên ở domain khác, không liên quan đến truy cập cross-account; đồng thời \"AmazonS3FullAccess\" trong bucket policy là cách dùng sai.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm rằng chỉ cần set ACL <code>bucket-owner-full-control</code> là đủ, nhưng ACL khó quản lý ở quy mô lớn — best practice là cấp quyền cross-account để chính account đích thực hiện copy.</p>","tip":"<p>Muốn account đích sở hữu object sau khi copy cross-account → để <strong>IAM user/role của account đích</strong> là bên thực hiện lệnh copy, không phải account nguồn.</p>"}
,
{"id":6,"topic":"Design Resilient Architectures – Chuyển sang Aurora Serverless v2","supplement":false,"stem":"<p>An online registration system hosted in an Amazon EKS cluster stores data to a db.t4g.medium Amazon Aurora DB cluster that runs an engine version compatible with Aurora Serverless v2. The database performs well during regular hours but is unable to handle the traffic surge that occurs during flash sales. A solutions architect must move the database to Aurora Serverless v2 while minimizing downtime and the impact on the operation of the application.</p><p>Which change should be taken to meet the objective?</p>","options":[{"html":"Modify the existing writer instance in place to change its instance class to Serverless.","correct":false},{"html":"Take a snapshot of the DB cluster. Use the snapshot to create a new Aurora DB cluster.","correct":false},{"html":"Use AWS Database Migration Service (AWS DMS) to migrate to a new Aurora Serverless v2 database.","correct":false},{"html":"Add an Aurora Serverless v2 reader to the cluster. Fail over to the reader to make it the writer.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cluster Aurora provisioned đã tương thích Serverless v2, cần chuyển sang Serverless v2 nhưng giảm tối đa downtime.</li>\n<li><strong>Yêu cầu chính:</strong> Chuyển đổi writer instance sang Serverless v2 mà không đổi endpoint, ít downtime nhất.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"minimizing downtime\" + cluster đã tương thích → AWS có quy trình switchover chính thức bằng reader + failover.</li>\n</ul>","answer":"<ul>\n<li><strong>Add an Aurora Serverless v2 reader to the cluster. Fail over to the reader to make it the writer.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Không có thao tác \"modify instance class to Serverless tại chỗ\"; quy trình chính thức của AWS là thêm reader Serverless v2 rồi failover.</li>\n<li><strong>B. ✗</strong> Snapshot + tạo cluster mới đòi hỏi dừng ứng dụng, downtime dài hơn nhiều so với failover trong cùng cluster.</li>\n<li><strong>C. ✗</strong> DMS cần cluster đích riêng, full load + replication rồi cutover — phức tạp và vẫn cần tạm dừng ghi khi chuyển đổi, không cần thiết khi có cách đơn giản hơn.</li>\n<li><strong>D. ✓</strong> Thêm instance Serverless v2 làm reader vào cùng cluster, rồi failover để nó trở thành writer — endpoint không đổi, downtime chỉ là khoảng thời gian failover ngắn.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Nghe \"migrate sang Serverless\" dễ nghĩ ngay đến DMS hoặc tạo cluster mới, nhưng vì cluster đã tương thích Serverless v2 sẵn, AWS hỗ trợ chuyển đổi tại chỗ qua reader + failover.</p>","tip":"<p>Chuyển writer provisioned sang Serverless v2 trong cùng cluster: thêm <strong>reader Serverless v2</strong> → <strong>failover</strong> để nó thành writer, không cần cluster mới.</p>"},
{"id":7,"topic":"Design High-Performing Architectures – DynamoDB DAX + API Gateway caching","supplement":false,"stem":"<p>A company currently has an Augment Reality (AR) mobile game that has a serverless backend. It is using a DynamoDB table which was launched using the AWS CLI to store all the user data and information gathered from the players and a Lambda function to pull the data from DynamoDB. The game is being used by millions of users each day to read and store data.</p><p>How would you design the application to improve its overall performance and make it more scalable while keeping the costs low? (Select TWO)</p>","options":[{"html":"Use AWS IAM Identity Center to authenticate users and have them directly access DynamoDB using single sign-on. Manually set the provisioned read and write capacity to a higher RCU and WCU.","correct":false},{"html":"Use API Gateway in conjunction with Lambda and turn on the caching on frequently accessed data and enable DynamoDB global replication.","correct":true},{"html":"Enable DynamoDB Accelerator (DAX) and ensure that the Auto Scaling is enabled and increase the maximum provisioned read and write capacity.","correct":true},{"html":"Since Auto Scaling is enabled by default, the provisioned read and write capacity will adjust automatically. Also enable DynamoDB Accelerator (DAX) to improve the performance from milliseconds to microseconds.","correct":false},{"html":"Configure CloudFront with DynamoDB as the origin; cache frequently accessed data on the client device using ElastiCache.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> DynamoDB table tạo bằng CLI (Auto Scaling KHÔNG bật mặc định), hàng triệu user đọc/ghi mỗi ngày.</li>\n<li><strong>Yêu cầu chính:</strong> Cải thiện hiệu năng, khả năng mở rộng, nhưng vẫn giữ chi phí thấp.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Table tạo qua CLI → Auto Scaling <strong>không</strong> tự bật; cần cache ở nhiều lớp (API Gateway, DAX).</li>\n</ul>","answer":"<ul>\n<li><strong>Use API Gateway in conjunction with Lambda and turn on the caching on frequently accessed data and enable DynamoDB global replication.</strong></li>\n<li><strong>Enable DynamoDB Accelerator (DAX) and ensure that the Auto Scaling is enabled and increase the maximum provisioned read and write capacity.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> IAM Identity Center chỉ quản lý truy cập đăng nhập, không cải thiện hiệu năng/khả năng mở rộng; set RCU/WCU thủ công cố định gây tốn kém khi tải thấp.</li>\n<li><strong>B. ✓</strong> API Gateway cache giảm tải cho Lambda/DynamoDB với dữ liệu hay truy cập; global replication giúp đọc nhanh hơn ở nhiều vùng.</li>\n<li><strong>C. ✓</strong> DAX là in-memory cache cho DynamoDB, giảm độ trễ từ ms xuống µs; kết hợp Auto Scaling + tăng max capacity giúp hệ thống co giãn theo tải mà không lãng phí khi tải thấp.</li>\n<li><strong>D. ✗</strong> Sai dữ kiện: table tạo bằng AWS CLI thì Auto Scaling <strong>không</strong> được bật mặc định.</li>\n<li><strong>E. ✗</strong> CloudFront không thể dùng trực tiếp DynamoDB làm origin; đây là sự kết hợp không tồn tại/không khả thi.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Đáp án D nghe hợp lý vì nhắc đến DAX đúng, nhưng tiền đề \"Auto Scaling enabled by default\" là <strong>sai</strong> đối với table tạo qua CLI — luôn đọc kỹ chi tiết cách table được tạo.</p>","tip":"<p>DynamoDB tạo qua CLI/SDK → Auto Scaling KHÔNG mặc định bật, phải tự cấu hình. Muốn giảm độ trễ đọc cực nhanh → DAX.</p>"},
{"id":8,"topic":"Design Cost-Optimized Architectures – S3 Gateway Endpoint","supplement":false,"stem":"<p>A company is hosting an application on EC2 instances that regularly pushes and fetches data in Amazon S3. Due to a change in compliance, the instances need to be moved on a private subnet. Along with this change, the company wants to lower the data transfer costs by configuring its AWS resources.</p><p>How can this be accomplished in the MOST cost-efficient manner?</p>","options":[{"html":"Set up an AWS Transit Gateway to access Amazon S3.","correct":false},{"html":"Create an Amazon S3 gateway endpoint to enable a connection between the instances and Amazon S3.","correct":true},{"html":"Set up a NAT Gateway in the public subnet to connect to Amazon S3.","correct":false},{"html":"Create an Amazon S3 interface endpoint to enable a connection between the instances and Amazon S3.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> EC2 chuyển vào private subnet nhưng vẫn cần truy cập S3, muốn chi phí thấp nhất.</li>\n<li><strong>Yêu cầu chính:</strong> Kết nối private subnet với S3 với chi phí tối ưu.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"MOST cost-efficient\" + S3 → <strong>Gateway Endpoint</strong> (miễn phí) thay vì NAT Gateway hay Interface Endpoint (tính phí giờ).</li>\n</ul>","answer":"<ul>\n<li><strong>Create an Amazon S3 gateway endpoint to enable a connection between the instances and Amazon S3.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Transit Gateway dùng để kết nối nhiều VPC/on-premises qua một hub trung tâm, không phải giải pháp tối ưu chi phí để truy cập S3.</li>\n<li><strong>B. ✓</strong> Gateway Endpoint cho S3 <strong>miễn phí</strong>, chỉ cần thêm route trong route table, không cần NAT hay Internet Gateway.</li>\n<li><strong>C. ✗</strong> NAT Gateway tính phí theo giờ kể cả khi idle, tốn kém hơn Gateway Endpoint.</li>\n<li><strong>D. ✗</strong> Interface Endpoint tính phí theo giờ cho mỗi endpoint được provision, trong khi Gateway Endpoint miễn phí cho cùng mục đích với S3.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Interface Endpoint cũng giải quyết được kết nối nhưng KHÔNG miễn phí như Gateway Endpoint — với S3/DynamoDB luôn ưu tiên Gateway Endpoint nếu có.</p>","tip":"<p>S3 và DynamoDB hỗ trợ <strong>Gateway Endpoint miễn phí</strong>; các service khác thường chỉ có Interface Endpoint (tính phí theo giờ).</p>"},
{"id":9,"topic":"Design Resilient Architectures – Lambda VPC ENI throttling","supplement":false,"stem":"<p>A company is using Amazon VPC that has a CIDR block of 10.31.0.0/27 that is connected to the on-premises data center. There was a requirement to create a Lambda function that will process massive amounts of cryptocurrency transactions every minute and then store the results to EFS. After setting up the serverless architecture and connecting the Lambda function to the VPC, the Solutions Architect noticed an increase in invocation errors with EC2 error types such as EC2ThrottledException at certain times of the day.</p><p>Which of the following are the possible causes of this issue? (Select TWO.)</p>","options":[{"html":"Your VPC does not have a NAT gateway.","correct":false},{"html":"The Lambda function is placed in a VPC subnet with limited IP address capacity.","correct":true},{"html":"Your Lambda function exceeds the VPC quota for Elastic Network Interfaces (ENIs) or available IP addresses in the subnet.","correct":true},{"html":"The attached IAM execution role of your function does not have the necessary permissions to access the resources of your VPC.","correct":false},{"html":"The associated security group of your function does not allow outbound connections.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> VPC CIDR rất nhỏ (<code>/27</code> = 32 IP), Lambda trong VPC cần tạo ENI để kết nối EFS, lỗi <code>EC2ThrottledException</code> chỉ xảy ra vào một số thời điểm.</li>\n<li><strong>Yêu cầu chính:</strong> Tìm 2 nguyên nhân khả dĩ gây lỗi throttle khi scale.</li>\n<li><strong>Từ khóa cần chú ý:</strong> CIDR nhỏ + lỗi \"chỉ xảy ra lúc cao điểm\" → liên quan đến <strong>giới hạn ENI/IP</strong> khi Lambda cần scale.</li>\n</ul>","answer":"<ul>\n<li><strong>Your Lambda function exceeds the VPC quota for Elastic Network Interfaces (ENIs) or available IP addresses in the subnet.</strong></li>\n<li><strong>The Lambda function is placed in a VPC subnet with limited IP address capacity.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Thiếu NAT Gateway ảnh hưởng đến truy cập Internet, không gây ra lỗi throttle dạng <code>EC2ThrottledException</code>, và lỗi chỉ xảy ra không liên tục chứng tỏ không phải vấn đề khả dụng.</li>\n<li><strong>B. ✓</strong> CIDR <code>/27</code> chỉ có 32 địa chỉ IP; khi Lambda cần scale để xử lý nhiều transaction cùng lúc, subnet hết IP để cấp cho ENI mới.</li>\n<li><strong>C. ✓</strong> Mỗi Lambda cần ENI trong VPC; nếu vượt quota ENI hoặc hết IP khả dụng trong subnet, request bị throttle với lỗi dạng EC2ThrottledException.</li>\n<li><strong>D. ✗</strong> Nếu thiếu quyền IAM, lỗi sẽ thuộc dạng <code>EC2AccessDeniedException</code> và xảy ra liên tục, không phải thỉnh thoảng như mô tả.</li>\n<li><strong>E. ✗</strong> Nếu security group chặn outbound thì Lambda sẽ fail hoàn toàn ngay từ đầu, không phải lỗi gián đoạn chỉ ở giờ cao điểm.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Thấy lỗi liên quan \"EC2\" dễ nghĩ ngay đến NAT Gateway hay quyền IAM, nhưng Lambda trong VPC tạo ENI đứng sau — vấn đề thực sự nằm ở số lượng ENI/IP khả dụng trong subnet nhỏ.</p>","tip":"<p>Lambda trong VPC cần ENI riêng để hoạt động; subnet nhỏ (CIDR hẹp) hoặc vượt quota ENI → lỗi throttle khi scale. Luôn để subnet đủ rộng cho Lambda trong VPC.</p>"},
{"id":10,"topic":"Design Secure Architectures – Security Group + NACL cho port 443","supplement":false,"stem":"<p>A company hosted a web application on a Linux Amazon EC2 instance in the public subnet that uses a non-default network ACL. The instance uses a default security group and has an attached Elastic IP address. The network ACL is configured to block all inbound and outbound traffic. The Solutions Architect must allow incoming traffic on port 443 to access the application from any source.</p><p>Which combination of steps will accomplish this requirement? (Select TWO.)</p>","options":[{"html":"In the Network ACL, update the rule to allow outbound TCP connection on port 32768 - 65535 to destination 0.0.0.0/0","correct":false},{"html":"In the Security Group, add a new rule to allow TCP connection on port 443 from source 0.0.0.0/0","correct":true},{"html":"In the Network ACL, update the rule to allow inbound TCP connection on port 443 from source 0.0.0.0/0 and outbound TCP connection on port 32768 - 65535 to destination 0.0.0.0/0","correct":true},{"html":"In the Network ACL, update the rule to allow both inbound and outbound TCP connection on port 443 from source 0.0.0.0/0 and to destination 0.0.0.0/0","correct":false},{"html":"In the Security Group, create a new rule to allow TCP connection on port 443 to destination 0.0.0.0/0","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> NACL non-default đang chặn toàn bộ traffic (inbound lẫn outbound); Security Group dùng mặc định (cho phép mọi outbound).</li>\n<li><strong>Yêu cầu chính:</strong> Mở port 443 inbound cho mọi nguồn.</li>\n<li><strong>Từ khóa cần chú ý:</strong> NACL là <strong>stateless</strong> → phải mở cả inbound port 443 <strong>và</strong> outbound ephemeral port (32768-65535) cho traffic trả về; Security Group là <strong>stateful</strong> → chỉ cần mở inbound.</li>\n</ul>","answer":"<ul>\n<li><strong>In the Security Group, add a new rule to allow TCP connection on port 443 from source 0.0.0.0/0.</strong></li>\n<li><strong>In the Network ACL, update the rule to allow inbound TCP connection on port 443 from source 0.0.0.0/0 and outbound TCP connection on port 32768 - 65535 to destination 0.0.0.0/0.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Chỉ mở outbound ephemeral port mà thiếu inbound 443 thì vẫn không có traffic đi vào được.</li>\n<li><strong>B. ✓</strong> Security Group là stateful, chỉ cần thêm inbound rule cho port 443; outbound response được tự động cho phép.</li>\n<li><strong>C. ✓</strong> NACL là stateless nên phải khai báo rõ cả inbound (443) và outbound (ephemeral port 32768-65535) để traffic phản hồi được đi ra.</li>\n<li><strong>D. ✗</strong> NACL chỉ mở outbound port 443 thì traffic phản hồi (dùng ephemeral port phía client) vẫn bị chặn.</li>\n<li><strong>E. ✗</strong> Security Group mặc định đã cho phép toàn bộ outbound; thêm rule outbound 443 là thừa, không cần thiết.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Nhầm lẫn giữa cơ chế <strong>stateful</strong> (Security Group) và <strong>stateless</strong> (NACL) — NACL luôn cần khai báo cả 2 chiều, đặc biệt là outbound ephemeral port cho traffic trả về.</p>","tip":"<p>Security Group: stateful, chỉ cần 1 chiều. NACL: stateless, luôn cần khai báo <strong>inbound port dịch vụ</strong> + <strong>outbound ephemeral port (thường 1024-65535)</strong>.</p>"}
,
{"id":11,"topic":"Design High-Performing Architectures – S3 event notification","supplement":false,"stem":"<p>A company is storing its financial reports and regulatory documents in an Amazon S3 bucket. To comply with the IT audit, they tasked their Solutions Architect to track all new objects added to the bucket as well as the removed ones. It should also track whether a versioned object is permanently deleted. The Architect must configure Amazon S3 to publish notifications for these events to a queue for post-processing and to an Amazon SNS topic that will notify the Operations team.</p><p>Which of the following is the MOST suitable solution that the Architect should implement?</p>","options":[{"html":"Create a new Amazon SNS topic and Amazon MQ. Add an S3 event notification configuration on the bucket to publish s3:ObjectAdded:* and s3:ObjectRemoved:* event types to SQS and SNS.","correct":false},{"html":"Create a new Amazon SNS topic and Amazon SQS queue. Add an S3 event notification configuration on the bucket to publish s3:ObjectCreated:* and s3:ObjectRemoved:Delete event types to SQS and SNS.","correct":true},{"html":"Create a new Amazon SNS topic and Amazon SQS queue. Add an S3 event notification configuration on the bucket to publish s3:ObjectCreated:* and ObjectRemoved:DeleteMarkerCreated event types to SQS and SNS.","correct":false},{"html":"Create a new Amazon SNS topic and Amazon MQ. Add an S3 event notification configuration on the bucket to publish s3:ObjectCreated:* and ObjectRemoved:DeleteMarkerCreated event types to SQS and SNS.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần theo dõi object mới được thêm, object bị xóa, và trường hợp object có version bị xóa <strong>vĩnh viễn</strong> trong S3.</li>\n<li><strong>Yêu cầu chính:</strong> Gửi notification đến cả SQS (xử lý tiếp) và SNS (báo team Operations).</li>\n<li><strong>Từ khóa cần chú ý:</strong> S3 chỉ hỗ trợ SNS, SQS, Lambda làm đích notification (không phải Amazon MQ); \"permanently deleted\" → sự kiện <code>s3:ObjectRemoved:Delete</code>, không phải <code>DeleteMarkerCreated</code>.</li>\n</ul>","answer":"<ul>\n<li><strong>Create a new Amazon SNS topic and Amazon SQS queue. Add an S3 event notification configuration on the bucket to publish s3:ObjectCreated:* and s3:ObjectRemoved:Delete event types to SQS and SNS.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Amazon MQ không phải là đích hợp lệ cho S3 event notification; ngoài ra không tồn tại event type <code>s3:ObjectAdded:*</code> (phải là <code>s3:ObjectCreated:*</code>).</li>\n<li><strong>B. ✓</strong> SNS + SQS là 2 đích hợp lệ; <code>s3:ObjectCreated:*</code> bắt mọi object mới, <code>s3:ObjectRemoved:Delete</code> bắt đúng sự kiện object (hoặc version) bị xóa vĩnh viễn.</li>\n<li><strong>C. ✗</strong> <code>ObjectRemoved:DeleteMarkerCreated</code> chỉ kích hoạt khi tạo delete marker (xóa mềm cho versioned object), không phải khi object bị xóa vĩnh viễn.</li>\n<li><strong>D. ✗</strong> Mắc cả 2 lỗi: dùng Amazon MQ (không hợp lệ) và event <code>DeleteMarkerCreated</code> (sai ngữ nghĩa với yêu cầu \"permanently deleted\").</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm <code>DeleteMarkerCreated</code> (xóa mềm, tạo delete marker) với việc object bị xóa vĩnh viễn — đề bài yêu cầu rõ \"permanently deleted\" nên phải dùng <code>ObjectRemoved:Delete</code>.</p>","tip":"<p>S3 event notification chỉ gửi đến <strong>SNS, SQS, Lambda</strong> (không có Amazon MQ). Xóa vĩnh viễn version → <code>ObjectRemoved:Delete</code>; tạo delete marker → <code>DeleteMarkerCreated</code>.</p>"},
{"id":12,"topic":"Design Resilient Architectures – EC2 vCPU-based On-Demand limit","supplement":false,"stem":"<p>You are automating the creation of EC2 instances in your VPC. Hence, you wrote a python script to trigger the Amazon EC2 API to request 50 EC2 instances in a single Availability Zone. However, you noticed that after 20 successful requests, subsequent requests failed.</p><p>What could be a reason for this issue and how would you resolve it?</p>","options":[{"html":"By default, AWS allows you to provision a maximum of 20 instances per region. Select a different region and retry the failed request.","correct":false},{"html":"There is a vCPU-based On-Demand Instance limit per region which is why subsequent requests failed. Just submit the limit increase form to AWS and retry the failed requests once approved.","correct":true},{"html":"There was an issue with the Amazon EC2 API. Just resend the requests and these will be provisioned successfully.","correct":false},{"html":"By default, AWS allows you to provision a maximum of 20 instances per Availability Zone. Select a different Availability Zone and retry the failed request.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Request 50 EC2 instance nhưng chỉ 20 request đầu thành công, các request sau đều fail.</li>\n<li><strong>Yêu cầu chính:</strong> Xác định nguyên nhân và cách khắc phục.</li>\n<li><strong>Từ khóa cần chú ý:</strong> Giới hạn số lượng On-Demand instance được tính theo <strong>vCPU</strong> và theo <strong>region</strong> (không phải theo AZ, không phải cố định 20 instance).</li>\n</ul>","answer":"<ul>\n<li><strong>There is a vCPU-based On-Demand Instance limit per region which is why subsequent requests failed. Just submit the limit increase form to AWS and retry the failed requests once approved.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Không có giới hạn cố định \"20 instance/region\"; giới hạn thực tế dựa trên tổng số vCPU được phép sử dụng.</li>\n<li><strong>B. ✓</strong> AWS giới hạn On-Demand theo tổng vCPU mỗi region; khi vượt ngưỡng, request tiếp theo bị từ chối cho đến khi được cấp limit increase.</li>\n<li><strong>C. ✗</strong> Đây không phải lỗi của EC2 API; nguyên nhân là do chạm giới hạn vCPU, gửi lại request sẽ tiếp tục fail nếu chưa tăng limit.</li>\n<li><strong>D. ✗</strong> Giới hạn vCPU được tính theo <strong>region</strong>, không phải theo Availability Zone; đổi AZ không giải quyết được vấn đề.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Đề bài không nói rõ loại instance nên nhiều người nghĩ giới hạn là \"20 instance\" cố định; thực chất giới hạn luôn được tính theo <strong>vCPU</strong>, số lượng instance cụ thể tùy vào loại instance đang dùng.</p>","tip":"<p>On-Demand EC2 limit = giới hạn theo <strong>vCPU/region</strong>, không phải theo số instance hay theo AZ. Vượt ngưỡng → nộp \"limit increase request form\".</p>"},
{"id":13,"topic":"Design Secure Architectures – Bastion host security group","supplement":false,"stem":"<p>A large financial firm needs to set up a Linux bastion host to allow access to the Amazon EC2 instances running in their VPC. For security purposes, only the clients connecting from the corporate external public IP address 175.45.116.100 should have SSH access to the host.</p><p>Which is the best option that can meet the customer's requirement?</p>","options":[{"html":"Security Group Inbound Rule: Protocol – UDP, Port Range – 22, Source 175.45.116.100/32","correct":false},{"html":"Network ACL Inbound Rule: Protocol – UDP, Port Range – 22, Source 175.45.116.100/32","correct":false},{"html":"Security Group Inbound Rule: Protocol – TCP. Port Range – 22, Source 175.45.116.100/32","correct":true},{"html":"Network ACL Inbound Rule: Protocol – TCP, Port Range-22, Source 175.45.116.100/0","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Bastion host chỉ cho phép SSH từ đúng 1 IP public cụ thể.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng loại firewall (Security Group hay NACL), đúng protocol (SSH dùng TCP), đúng CIDR (/32 = 1 IP).</li>\n<li><strong>Từ khóa cần chú ý:</strong> SSH = TCP port 22; bảo mật ở mức instance → <strong>Security Group</strong>; <code>/32</code> = chỉ 1 địa chỉ IP, <code>/0</code> = toàn bộ dải mạng.</li>\n</ul>","answer":"<ul>\n<li><strong>Security Group Inbound Rule: Protocol – TCP. Port Range – 22, Source 175.45.116.100/32.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> SSH dùng giao thức TCP, không phải UDP.</li>\n<li><strong>B. ✗</strong> Sai cả protocol (UDP thay vì TCP) lẫn loại firewall (NACL hoạt động ở mức subnet, không phù hợp khi chỉ cần bảo vệ 1 instance).</li>\n<li><strong>C. ✓</strong> Đúng protocol TCP, đúng port 22, đúng Security Group (áp dụng ở mức instance), và <code>/32</code> giới hạn chính xác 1 IP nguồn.</li>\n<li><strong>D. ✗</strong> <code>/0</code> nghĩa là cho phép toàn bộ dải IP (0.0.0.0/0), trái với yêu cầu chỉ cho phép đúng 1 IP cụ thể.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Nhầm <code>/32</code> (1 địa chỉ IP) với <code>/0</code> (toàn bộ mạng) trong CIDR notation — đây là lỗi rất dễ mắc khi đọc nhanh.</p>","tip":"<p>CIDR: <code>/32</code> = đúng 1 IP, <code>/0</code> = mọi IP. Bảo mật riêng 1 EC2 instance → dùng <strong>Security Group</strong>, không dùng NACL (NACL áp dụng cho cả subnet).</p>"},
{"id":14,"topic":"Design Secure Architectures – NACL rule evaluation order","supplement":false,"stem":"<p>A company has launched multiple Amazon EC2 instances inside a private subnet of a VPC. The Solutions Architect is reviewing the Network ACL (NACL) rules associated with that subnet to ensure security. The current Inbound Rules for the NACL are configured as follows:</p><table><tr><th>Rule #</th><th>Type</th><th>Protocol</th><th>Port Range</th><th>Source</th><th>Allow/Deny</th></tr><tr><td>100</td><td>ALL Traffic</td><td>ALL</td><td>ALL</td><td>0.0.0.0/0</td><td>ALLOW</td></tr><tr><td>101</td><td>Custom TCP</td><td>TCP</td><td>4000</td><td>110.238.109.37/32</td><td>DENY</td></tr><tr><td>*</td><td>ALL Traffic</td><td>ALL</td><td>ALL</td><td>0.0.0.0/0</td><td>DENY</td></tr></table><p>A computer with the IP address 110.238.109.37 attempts to send a request to one of the EC2 instances in this subnet.</p><p>What will happen to the incoming request based on the NACL rules?</p>","options":[{"html":"Initially, it will be allowed and then after a while, the connection will be denied.","correct":false},{"html":"Initially, it will be denied and then after a while, the connection will be allowed.","correct":false},{"html":"It will be allowed.","correct":true},{"html":"It will be denied.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> NACL có Rule #100 (ALLOW ALL) đứng trước Rule #101 (DENY port 4000 từ đúng IP 110.238.109.37).</li>\n<li><strong>Yêu cầu chính:</strong> Request từ IP đó sẽ bị allow hay deny?</li>\n<li><strong>Từ khóa cần chú ý:</strong> NACL xử lý rule theo <strong>số thứ tự tăng dần</strong>, dừng lại ngay khi gặp rule đầu tiên khớp — không đánh giá tiếp các rule sau.</li>\n</ul>","answer":"<ul>\n<li><strong>It will be allowed.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> NACL không có khái niệm \"stateful\" theo thời gian như security group; một khi request khớp rule, quyết định là cuối cùng, không có \"ban đầu rồi sau đó\".</li>\n<li><strong>B. ✗</strong> Tương tự, NACL không đánh giá lại hay đổi quyết định theo thời gian.</li>\n<li><strong>C. ✓</strong> Rule #100 (số nhỏ hơn) được đánh giá trước và khớp với mọi traffic (ALL/0.0.0.0/0) → ALLOW ngay lập tức; Rule #101 (deny) không bao giờ được xét tới.</li>\n<li><strong>D. ✗</strong> Sai vì Rule #100 đứng trước và đã cho phép toàn bộ traffic trước khi NACL kịp xét đến Rule #101.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Thấy có rule DENY đúng IP là vội kết luận bị chặn — nhưng NACL đánh giá theo <strong>thứ tự số rule tăng dần</strong> và dừng ngay khi khớp, rule số nhỏ hơn (100) luôn được ưu tiên xét trước rule số lớn hơn (101).</p>","tip":"<p>NACL: luôn xét rule theo thứ tự <strong>số tăng dần</strong>, dừng lại ở rule đầu tiên khớp. Đặt rule DENY cụ thể phải có số nhỏ hơn rule ALLOW tổng quát thì mới có tác dụng.</p>"},
{"id":15,"topic":"Design High-Performing Architectures – AWS Fargate trên EKS","supplement":false,"stem":"<p>A new online banking platform has been re-designed to have a microservices architecture in which complex applications are decomposed into smaller, independent services. The new platform uses Kubernetes, and the application containers are optimally configured for running small, decoupled services.</p><p>The new solution should remove the need to provision and manage servers, allow resources to be specified and paid for per application, and improve security through application isolation by design.</p><p>Which of the following is the MOST suitable solution to implement to launch this new platform on AWS?</p>","options":[{"html":"Use Amazon ECS to run the Kubernetes cluster on AWS Fargate.","correct":false},{"html":"Host the application in Amazon EMR Serverless and Amazon EBS storage with the fast snapshot restore feature enabled.","correct":false},{"html":"Use AWS Fargate on Amazon EKS with Kubernetes Cluster Autoscaler to run the containerized banking platform.","correct":true},{"html":"Deploy an Amazon EKS Cluster on AWS Outposts with Kubernetes Cluster Autoscaler and sync any orphaned pods with Amazon AppFlow.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Nền tảng dùng Kubernetes, muốn serverless (không quản lý server), trả phí theo resource từng app, cô lập bảo mật theo thiết kế.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng dịch vụ compute serverless chạy được Kubernetes.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"Kubernetes\" → phải dùng <strong>EKS</strong> (ECS không chạy Kubernetes); serverless cho container → <strong>Fargate</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Use AWS Fargate on Amazon EKS with Kubernetes Cluster Autoscaler to run the containerized banking platform.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Amazon ECS dùng cho container Docker theo API riêng của AWS, không chạy được Kubernetes cluster — cần EKS thay vì ECS.</li>\n<li><strong>B. ✗</strong> EMR Serverless dành cho xử lý big data (Spark, Hive...), không phù hợp để chạy ứng dụng Kubernetes microservices; fast snapshot restore của EBS cũng không liên quan.</li>\n<li><strong>C. ✓</strong> EKS chạy Kubernetes chuẩn; Fargate loại bỏ việc quản lý server, trả phí theo task/pod, cô lập mỗi task trong kernel riêng; Cluster Autoscaler giúp co giãn node theo nhu cầu pod.</li>\n<li><strong>D. ✗</strong> EKS trên Outposts vẫn cần duy trì phần cứng vật lý tại chỗ (không serverless); AppFlow chỉ dùng để tích hợp SaaS, không liên quan đến pod của Kubernetes.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm ECS và EKS khi đề chỉ nói \"container\"; nhưng đề bài nói rõ \"uses Kubernetes\" nên bắt buộc phải là <strong>EKS</strong>.</p>","tip":"<p>Chạy Kubernetes chuẩn trên AWS → <strong>EKS</strong> (không phải ECS). Muốn serverless cho container (EKS hoặc ECS) → <strong>Fargate</strong>.</p>"},
{"id":16,"topic":"Design Resilient Architectures – AWS Storage Gateway File Gateway","supplement":false,"stem":"<p>A company plans to use a durable storage service to store on-premises database backups to the AWS Cloud. To move the backup data, the company needs a service that can store and retrieve objects via standard file storage protocols for quick recovery.</p><p>Which of the following options will meet this requirement?</p>","options":[{"html":"Use the AWS Storage Gateway file gateway to store all the backup data in Amazon S3.","correct":true},{"html":"Use the AWS Storage Gateway volume gateway to store the backup data and directly access it using Amazon S3 API actions.","correct":false},{"html":"Use Amazon EBS volumes to store all the backup data and attach it to an Amazon EC2 instance.","correct":false},{"html":"Use AWS DataSync to directly transfer the backup data to Amazon S3 Glacier.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần lưu backup database on-premises lên AWS, nhưng vẫn truy cập qua <strong>giao thức file storage chuẩn</strong> (NFS/SMB) để phục hồi nhanh.</li>\n<li><strong>Yêu cầu chính:</strong> Dịch vụ cho phép lưu/đọc object qua file protocol chuẩn, lưu trữ bền vững.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"standard file storage protocols\" (NFS/SMB) + \"durable\" → <strong>File Gateway</strong> của Storage Gateway, dùng S3 làm backend.</li>\n</ul>","answer":"<ul>\n<li><strong>Use the AWS Storage Gateway file gateway to store all the backup data in Amazon S3.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✓</strong> File Gateway expose S3 bucket như một NFS/SMB file share, cho phép ứng dụng on-premises dùng file protocol chuẩn mà không cần sửa đổi, dữ liệu vẫn lưu bền vững trên S3.</li>\n<li><strong>B. ✗</strong> Volume Gateway hoạt động ở mức block storage (iSCSI), không truy cập trực tiếp bằng S3 API như option mô tả.</li>\n<li><strong>C. ✗</strong> EBS không bền vững (durable) bằng S3 và không hỗ trợ trực tiếp giao thức file NFS/SMB.</li>\n<li><strong>D. ✗</strong> DataSync chủ yếu dùng để di chuyển dữ liệu một lần/định kỳ, không cung cấp truy cập liên tục qua file protocol; S3 Glacier cũng không phù hợp cho \"quick recovery\".</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm Volume Gateway với File Gateway — Volume Gateway hoạt động ở mức <strong>block (iSCSI)</strong>, còn File Gateway mới hoạt động ở mức <strong>file (NFS/SMB)</strong> và dùng S3 API phía sau.</p>","tip":"<p>Cần giao thức file chuẩn (NFS/SMB) để truy cập dữ liệu lưu trên S3 → <strong>AWS Storage Gateway – File Gateway</strong>.</p>"},
{"id":17,"topic":"Design Resilient Architectures – Route 53 Active-Active Failover","supplement":false,"stem":"<p>A company is setting up a cloud architecture for an international money transfer service to be deployed in AWS which will have thousands of users around the globe. The service should be available 24/7 to avoid any business disruption and should be resilient enough to handle the outage of an entire AWS region. To meet this requirement, the Solutions Architect has deployed their AWS resources to multiple AWS Regions. He needs to use Route 53 and configure it to set all of the resources to be available all the time as much as possible. When a resource becomes unavailable, Route 53 should detect that it's unhealthy and stop including it when responding to queries.</p><p>Which of the following is the most fault-tolerant routing configuration that the Solutions Architect should use in this scenario?</p>","options":[{"html":"Configure an Active-Passive Failover with Multiple Primary and Secondary Resources.","correct":false},{"html":"Configure an Active-Passive Failover with Weighted Records.","correct":false},{"html":"Configure an Active-Active Failover with Weighted routing policy.","correct":true},{"html":"Configure an Active-Active Failover with One Primary and One Secondary Resource.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Muốn <strong>tất cả</strong> resource đa vùng đều available cùng lúc phần lớn thời gian, Route 53 tự loại bỏ resource unhealthy.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn đúng kiểu failover routing.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"all resources available all the time\" → <strong>Active-Active</strong> (không có khái niệm primary/secondary); Active-Passive chỉ dùng khi có resource dự phòng đứng yên chờ.</li>\n</ul>","answer":"<ul>\n<li><strong>Configure an Active-Active Failover with Weighted routing policy.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Active-Passive dùng khi muốn 1 nhóm resource chính hoạt động, nhóm phụ chỉ đứng chờ (standby) — không phù hợp vì đề muốn mọi resource đều active.</li>\n<li><strong>B. ✗</strong> Vẫn là Active-Passive, sai khái niệm tương tự option A.</li>\n<li><strong>C. ✓</strong> Active-Active cho phép mọi record cùng tên/loại active đồng thời (dùng routing policy khác failover, ví dụ weighted); Route 53 tự loại record unhealthy khỏi response.</li>\n<li><strong>D. ✗</strong> Active-Active không có khái niệm \"one primary, one secondary\" — đó là đặc trưng của Active-Passive.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Thấy từ \"failover\" là nghĩ ngay Active-Passive, nhưng Active-Active cũng dùng health check để failover — khác biệt nằm ở việc có hay không khái niệm primary/secondary.</p>","tip":"<p>Muốn <strong>mọi</strong> resource active cùng lúc, tự động loại bỏ resource unhealthy → <strong>Active-Active Failover</strong>. Muốn resource dự phòng chỉ chạy khi primary down → <strong>Active-Passive</strong>.</p>"},
{"id":18,"topic":"Design High-Performing Architectures – Lambda container image + ephemeral storage","supplement":false,"stem":"<p>A solutions architect is designing an infrastructure for a serverless application. The application is packaged as a Docker image stored in Amazon Elastic Container Registry (Amazon ECR) and must be deployed on a fully managed serverless compute service. Additionally, the application requires 5 GB of ephemeral storage for temporary data processing.</p><p>Which deployment option meets these requirements?</p>","options":[{"html":"Deploy the application to an Amazon ECS cluster that uses AWS Fargate tasks.","correct":false},{"html":"Deploy the application in an AWS Lambda function with Container image support. Set the function's storage to 5 GB.","correct":true},{"html":"Deploy the application Amazon ECS cluster with Amazon EC2 worker nodes and attach a 5 GB Amazon EBS volume.","correct":false},{"html":"Deploy the application in an AWS Lambda function with Container image support. Attach an Amazon Elastic File System (Amazon EFS) volume to the function.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> App đóng gói Docker image trong ECR, cần compute <strong>fully managed serverless</strong>, cần 5GB storage <strong>tạm thời</strong> (ephemeral) cho xử lý dữ liệu.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn dịch vụ serverless hỗ trợ container image + cấu hình ephemeral storage phù hợp.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"ephemeral storage\" (tạm thời, không cần giữ lại) ≠ EFS (persistent); Lambda hỗ trợ container image và cấu hình storage tạm thời lên đến 10GB.</li>\n</ul>","answer":"<ul>\n<li><strong>Deploy the application in an AWS Lambda function with Container image support. Set the function's storage to 5 GB.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> ECS với Fargate tuy không quản lý EC2 nhưng vẫn phải cấu hình service, task definition, cluster — không \"fully serverless\" đơn giản bằng Lambda cho use case này.</li>\n<li><strong>B. ✓</strong> Lambda hỗ trợ container image (tới 10GB), và có thể cấu hình ephemeral storage lên đến 10GB — đúng với nhu cầu 5GB tạm thời, không cần quản lý server.</li>\n<li><strong>C. ✗</strong> Dùng EC2 worker node là trái với yêu cầu \"serverless\" rõ ràng trong đề.</li>\n<li><strong>D. ✗</strong> EFS cung cấp storage <strong>bền vững (persistent)</strong>, không phù hợp với nhu cầu storage <strong>tạm thời (ephemeral)</strong> chỉ dùng trong lúc hàm chạy; cũng tăng thêm độ phức tạp không cần thiết.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Thấy \"cần thêm storage\" cho Lambda dễ nghĩ ngay đến gắn EFS, nhưng khi yêu cầu là <strong>ephemeral/tạm thời</strong> thì chỉ cần tăng <code>/tmp</code> storage có sẵn của Lambda (tối đa 10GB), không cần EFS.</p>","tip":"<p>Lambda hỗ trợ container image (tối đa 10GB) và ephemeral storage <code>/tmp</code> cấu hình được tới 10GB. EFS chỉ cần khi dữ liệu phải <strong>tồn tại lâu dài/chia sẻ</strong> giữa các lần invoke.</p>"},
{"id":19,"topic":"Design Secure Architectures – SNI Custom SSL trên ALB","supplement":false,"stem":"<p>A travel company has a suite of web applications hosted in an Auto Scaling group of On-Demand EC2 instances behind an Application Load Balancer that handles traffic from various web domains such as i-love-manila.com, i-love-boracay.com, i-love-cebu.com and many others. To improve security and lessen the overall cost, you are instructed to secure the system by allowing multiple domains to serve SSL traffic without the need to reauthenticate and reprovision your certificate everytime you add a new domain. This migration from HTTP to HTTPS will help improve their SEO and Google search ranking.</p><p>Which of the following is the most cost-effective solution to meet the above requirement?</p>","options":[{"html":"Use a wildcard certificate to handle multiple sub-domains and different domains.","correct":false},{"html":"Create a new CloudFront web distribution and configure it to serve HTTPS requests using dedicated IP addresses in order to associate your alternate domain names with a dedicated IP address in each CloudFront edge location.","correct":false},{"html":"Add a Subject Alternative Name (SAN) for each additional domain to your certificate.","correct":false},{"html":"Upload all SSL certificates of the domains in the ALB using the console and bind multiple certificates to the same secure listener on your load balancer. ALB will automatically choose the optimal TLS certificate for each client using Server Name Indication (SNI).","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Nhiều domain khác nhau (không phải subdomain của cùng 1 domain) đều chạy sau cùng 1 ALB, muốn phục vụ SSL mà không phải reauthenticate mỗi khi thêm domain mới.</li>\n<li><strong>Yêu cầu chính:</strong> Giải pháp cost-effective nhất để host nhiều chứng chỉ SSL cho nhiều domain khác nhau trên cùng 1 listener.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"different domains\" (không phải subdomain) + \"không reauthenticate mỗi lần thêm domain\" → <strong>SNI trên ALB</strong>, miễn phí.</li>\n</ul>","answer":"<ul>\n<li><strong>Upload all SSL certificates of the domains in the ALB using the console and bind multiple certificates to the same secure listener on your load balancer. ALB will automatically choose the optimal TLS certificate for each client using Server Name Indication (SNI).</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Wildcard certificate chỉ bao phủ các subdomain của <strong>cùng một domain gốc</strong> (vd: <code>*.example.com</code>), không áp dụng được cho nhiều domain hoàn toàn khác nhau.</li>\n<li><strong>B. ✗</strong> Dùng dedicated IP trên CloudFront tốn thêm phí hàng tháng — không phải lựa chọn cost-effective nhất.</li>\n<li><strong>C. ✗</strong> SAN đúng về mặt kỹ thuật nhưng vẫn phải reauthenticate/reprovision certificate mỗi khi thêm domain mới — vi phạm đúng yêu cầu đề bài.</li>\n<li><strong>D. ✓</strong> SNI cho phép gắn nhiều certificate vào cùng 1 secure listener của ALB, ALB tự chọn certificate phù hợp dựa trên hostname của client — hoàn toàn miễn phí và không cần reprovision khi thêm domain.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> SAN là giải pháp hợp lệ về mặt kỹ thuật nhưng vẫn yêu cầu reissue certificate mỗi khi thêm domain — không thỏa điều kiện \"without reauthenticate/reprovision\" trong đề.</p>","tip":"<p>Nhiều domain khác nhau (không phải subdomain) dùng chung ALB, không muốn tái cấp chứng chỉ mỗi lần thêm domain → <strong>SNI Custom SSL</strong> (miễn phí trên ALB).</p>"},
{"id":20,"topic":"Design High-Performing Architectures – Cluster Placement Group cho HPC","supplement":false,"stem":"<p>A company deployed a high-performance computing (HPC) cluster that spans multiple Amazon EC2 instances across multiple Availability Zones and processes various wind simulation models. Currently, the Solutions Architect is experiencing application slowdowns, and upon further investigation, it was discovered that this was due to latency issues. Even when using AWS ParallelCluster, a placement group is needed for optimal inter‑node latency.</p><p>Which is the MOST suitable solution that the Solutions Architect should implement to provide low-latency network performance necessary for tightly-coupled node-to-node communication of the HPC cluster?</p>","options":[{"html":"Set up a spread placement group across multiple Availability Zones in multiple AWS Regions.","correct":false},{"html":"Set up AWS Direct Connect connections across multiple Availability Zones for increased bandwidth throughput and more consistent network experience.","correct":false},{"html":"Set up a cluster placement group within a single Availability Zone in the same AWS Region.","correct":true},{"html":"Use EC2 Dedicated Instances with elastic inference accelerator","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cluster HPC tightly-coupled (node cần giao tiếp với nhau liên tục, độ trễ thấp) đang bị chậm do latency.</li>\n<li><strong>Yêu cầu chính:</strong> Chọn placement strategy phù hợp cho latency thấp giữa các node.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"tightly-coupled node-to-node communication\" → đúng use case của <strong>Cluster placement group</strong> (chỉ trong 1 AZ, 1 Region).</li>\n</ul>","answer":"<ul>\n<li><strong>Set up a cluster placement group within a single Availability Zone in the same AWS Region.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Placement group không thể trải nhiều Region; spread placement group cũng không phải chiến lược dùng để giảm latency giữa các node tính toán.</li>\n<li><strong>B. ✗</strong> Direct Connect dùng cho kết nối hybrid on-premises–AWS, không dùng để giảm latency nội bộ giữa các instance trong cùng VPC.</li>\n<li><strong>C. ✓</strong> Cluster placement group đặt các instance gần nhau về mặt vật lý trong cùng 1 AZ, mang lại network latency thấp và throughput cao nhất — đúng chuẩn cho HPC tightly-coupled.</li>\n<li><strong>D. ✗</strong> Dedicated Instance chỉ là tùy chọn billing/cô lập phần cứng, không liên quan đến latency; elastic inference accelerator dùng cho ML inference, không liên quan HPC networking.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Dễ nhầm giữa 3 loại placement group: <strong>Cluster</strong> (latency thấp, cùng AZ), <strong>Partition</strong> (ứng dụng phân tán lớn như Hadoop/Cassandra), <strong>Spread</strong> (giảm correlated failure, trải phần cứng khác nhau).</p>","tip":"<p>HPC tightly-coupled, cần latency thấp giữa node → <strong>Cluster Placement Group</strong> (bắt buộc trong 1 AZ, 1 Region).</p>"}
,
{"id":21,"topic":"Design High-Performing Architectures – DDoS mitigation (loại trừ)","supplement":false,"stem":"<p>A Solutions Architect working for a startup is designing a High Performance Computing (HPC) application which is publicly accessible for their customers. The startup founders want to mitigate distributed denial-of-service (DDoS) attacks on their application.</p><p>Which of the following options are not suitable to be implemented in this scenario? (Select TWO.)</p>","options":[{"html":"Use an Application Load Balancer with Auto Scaling groups for your EC2 instances. Prevent direct Internet traffic to your Amazon RDS database by deploying it to a new private subnet.","correct":false},{"html":"Use Dedicated EC2 instances to ensure that each instance has the maximum performance possible.","correct":true},{"html":"Add multiple Elastic Fabric Adapters (EFA) to each EC2 instance to increase the network bandwidth.","correct":true},{"html":"Use an Amazon CloudFront service for distributing both static and dynamic content.","correct":false},{"html":"Use AWS Shield and AWS WAF.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Cần tìm các giải pháp <strong>KHÔNG</strong> phù hợp để giảm thiểu DDoS (câu hỏi phủ định).</li>\n<li><strong>Yêu cầu chính:</strong> Loại trừ 2 lựa chọn không liên quan đến chống DDoS.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"NOT suitable\" — Dedicated Instance và thêm EFA chỉ cải thiện <strong>hiệu năng</strong>, không phải cơ chế chống DDoS.</li>\n</ul>","answer":"<ul>\n<li><strong>Use Dedicated EC2 instances to ensure that each instance has the maximum performance possible.</strong></li>\n<li><strong>Add multiple Elastic Fabric Adapters (EFA) to each EC2 instance to increase the network bandwidth.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. (hợp lệ, không chọn)</strong> ALB + Auto Scaling + RDS private subnet là kỹ thuật chống DDoS hợp lệ (phân tán tải, ẩn DB khỏi Internet).</li>\n<li><strong>B. ✓ (không phù hợp)</strong> Dedicated Instance chỉ là tùy chọn billing/cô lập phần cứng vật lý, không có cơ chế giảm thiểu DDoS.</li>\n<li><strong>C. ✓ (không phù hợp)</strong> EFA tăng băng thông mạng cho HPC/ML, không phải giải pháp DDoS; ngoài ra mỗi EC2 chỉ gắn được 1 EFA.</li>\n<li><strong>D. (hợp lệ, không chọn)</strong> CloudFront phân tán traffic qua edge location, giúp hấp thụ và giảm tải tấn công DDoS ở layer 3/4/7.</li>\n<li><strong>E. (hợp lệ, không chọn)</strong> AWS Shield + WAF là dịch vụ chuyên biệt để chống DDoS và các exploit web phổ biến.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> Câu hỏi phủ định (\"NOT suitable\") rất dễ đọc nhầm, chọn luôn các đáp án đúng về mặt kỹ thuật (CloudFront, Shield/WAF, ALB) thay vì đáp án không liên quan đến DDoS.</p>","tip":"<p>Luôn đọc kỹ xem câu hỏi là \"chọn đáp án đúng\" hay \"chọn đáp án KHÔNG phù hợp\" — đây là dạng bẫy thường gặp trong đề thi.</p>"},
{"id":22,"topic":"Design Cost-Optimized Architectures – EC2 Spot cho tác vụ gián đoạn được","supplement":false,"stem":"<p>The media company that you are working for has a video transcoding application running on Amazon EC2. Each EC2 instance polls a queue to find out which video should be transcoded, and then runs a transcoding process. If this process is interrupted, the video will be transcoded by another instance based on the queuing system. This application has a large backlog of videos which need to be transcoded. Your manager would like to reduce this backlog by adding more EC2 instances, however, these instances are only needed until the backlog is reduced.</p><p>In this scenario, which type of Amazon EC2 instance is the most cost-effective type to use?</p>","options":[{"html":"Dedicated instances","correct":false},{"html":"Spot instances","correct":true},{"html":"Reserved instances","correct":false},{"html":"On-demand instances","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Xử lý transcoding dùng queue, chịu được gián đoạn (instance bị tắt thì video được xử lý lại bởi instance khác); chỉ cần capacity tạm thời để giảm backlog.</li>\n<li><strong>Yêu cầu chính:</strong> Loại instance tiết kiệm chi phí nhất cho tải tạm thời, chịu được gián đoạn.</li>\n<li><strong>Từ khóa cần chú ý:</strong> \"interrupted... transcoded by another instance\" + \"only needed until backlog is reduced\" → đúng đặc tính của <strong>Spot Instance</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Spot instances.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> Dedicated Instance không phải là \"spare compute capacity\" giá rẻ, không liên quan đến yêu cầu tiết kiệm chi phí cho tải tạm thời.</li>\n<li><strong>B. ✓</strong> Spot Instance tận dụng compute capacity dư thừa với giá rẻ hơn On-Demand tới 90%; ứng dụng đã thiết kế chịu được gián đoạn (queue-based retry) nên rất phù hợp.</li>\n<li><strong>C. ✗</strong> Reserved Instance phù hợp cho tải ổn định, dài hạn — không hợp với nhu cầu chỉ dùng tạm thời để giảm backlog.</li>\n<li><strong>D. ✗</strong> On-Demand là lựa chọn hợp lệ nhưng đắt hơn Spot nhiều, không phải lựa chọn tiết kiệm chi phí nhất.</li>\n</ul>","wrong":"<p><strong>Bẫy thường gặp:</strong> On-Demand nghe \"an toàn\" vì không bị gián đoạn, nhưng đề đã nói rõ ứng dụng chịu được gián đoạn → Spot luôn rẻ hơn và phù hợp hơn trong trường hợp này.</p>","tip":"<p>Tải có thể gián đoạn, không cần SLA liên tục, chỉ cần tạm thời/batch → <strong>Spot Instance</strong> luôn là lựa chọn rẻ nhất.</p>"},
{"id":23,"topic":"Design Resilient Architectures – Auto Scaling trải nhiều AZ","supplement":false,"stem":"<p>A major TV network has a web application running on eight Amazon T3 EC2 instances behind an application load balancer. The number of requests that the application processes are consistent and do not experience spikes. A Solutions Architect must configure an Auto Scaling group for the instances to ensure that the application is running at all times.</p><p>Which of the following options can satisfy the given requirements?</p>","options":[{"html":"Deploy four EC2 instances with Auto Scaling in one region and four in another region behind an Amazon Elastic Load Balancer.","correct":false},{"html":"Deploy eight EC2 instances with Auto Scaling in one Availability Zone behind an Amazon Elastic Load Balancer.","correct":false},{"html":"Deploy two EC2 instances with Auto Scaling in four regions behind an Amazon Elastic Load Balancer.","correct":false},{"html":"Deploy four EC2 instances with Auto Scaling in one Availability Zone and four in another availability zone in the same region behind an Amazon Elastic Load Balancer.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> 8 EC2 instance cần chạy liên tục (high availability), tải ổn định không có spike.</li>\n<li><strong>Yêu cầu chính:</strong> Thiết kế Auto Scaling group chịu lỗi tốt khi 1 AZ gặp sự cố.</li>\n<li><strong>Từ khóa cần chú ý:</strong> ELB chỉ hoạt động trong <strong>1 region</strong> (không trải nhiều region); muốn HA thì trải instance qua <strong>nhiều AZ trong cùng region</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Deploy four EC2 instances with Auto Scaling in one Availability Zone and four in another availability zone in the same region behind an Amazon Elastic Load Balancer.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>A. ✗</strong> ELB chỉ hoạt động trong phạm vi 1 Region, không thể cân bằng tải giữa 2 Region khác nhau.</li>\n<li><strong>B. ✗</strong> Đặt cả
