"correct":false},{"html":"Use AWS Data Transfer Terminal to physically transfer the backup data into Amazon S3 Glacier Flexible Retrieval.","correct":false},{"html":"Use AWS Storage Gateway to backup the data directly to Amazon S3 Glacier Flexible Retrieval.","correct":false},{"html":"Use AWS Storage Gateway to backup the data and transition it to Amazon S3 Glacier Deep Archive.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Đang dùng <strong>tape backup</strong> on-premises.</li>\n<li><strong>Yêu cầu chính:</strong> Lưu trên cloud <strong>tới 10 năm</strong>, truy cập <strong>1–2 lần/năm</strong>, <strong>rẻ nhất</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> \"Tape\" → <strong>Tape Gateway</strong>; lưu rất lâu → <strong>Deep Archive</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Use AWS Storage Gateway to backup the data and transition it to Amazon S3 Glacier Deep Archive.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Tape Gateway</strong> tạo <strong>Virtual Tape Library (VTL)</strong>; phần mềm backup giữ nguyên, ghi lên băng ảo trên S3.</li>\n<li>Khi <strong>eject/archive</strong>, băng ảo chuyển xuống <strong>Glacier Flexible Retrieval</strong> hoặc <strong>Deep Archive</strong>.</li>\n<li><strong>Deep Archive</strong> rẻ nhất cho dữ liệu 7–10 năm, lấy 12–48 giờ là chấp nhận được.</li>\n</ul>","wrong":"<ul>\n<li><strong>S3 + lifecycle sang Flexible Retrieval:</strong> Chưa giải quyết đưa dữ liệu từ hệ thống tape; Flexible đắt hơn Deep Archive.</li>\n<li><strong>Data Transfer Terminal:</strong> Chuyển một lần, không phải backup liên tục.</li>\n<li><strong>Storage Gateway → Flexible Retrieval:</strong> Đúng hướng nhưng không rẻ nhất.</li>\n</ul>","tip":"<ul>\n<li>Tape, VTL, giữ phần mềm backup → <strong>Tape Gateway</strong>.</li>\n<li>7–10 năm, 1–2 lần/năm → <strong>Glacier Deep Archive</strong>.</li>\n<li>Loại Storage Gateway: <strong>S3 File</strong> (NFS/SMB→S3), <strong>FSx File</strong> (SMB→FSx), <strong>Volume</strong> (iSCSI), <strong>Tape</strong> (VTL).</li>\n</ul>"},{"id":53,"topic":"Design Secure Architectures – Chống DDoS (CloudFront + WAF rate-based)","supplement":false,"stem":"<p>A company plans to conduct a network security audit. The web application is hosted on an Auto Scaling group of EC2 Instances with an Application Load Balancer in front to evenly distribute the incoming traffic. A Solutions Architect has been tasked to enhance the security posture of the company's cloud infrastructure and minimize the impact of DDoS attacks on its resources.</p>\n<p>Which of the following is the most effective solution that should be implemented?</p>","options":[{"html":"Configure Amazon CloudFront distribution and set Application Load Balancer as the origin. Create a rate-based web ACL rule using AWS WAF and associate it with Amazon CloudFront.","correct":true},{"html":"Configure Amazon CloudFront distribution and set a Network Load Balancer as the origin. Use Amazon GuardDuty to block suspicious hosts based on its security findings. Set up a custom AWS Lambda function that processes the security logs and invokes Amazon SNS for notification.","correct":false},{"html":"Configure Amazon CloudFront distribution and set a Network Load Balancer as the origin. Use VPC Flow Logs to monitor abnormal traffic patterns. Set up a custom AWS Lambda function that processes the flow logs and invokes Amazon SNS for notification.","correct":false},{"html":"Configure Amazon CloudFront distribution and set an Application Load Balancer as the origin. Create a security group rule and deny all the suspicious addresses. Use Amazon SNS for notification.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> ALB + ASG, chuẩn bị audit bảo mật.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Giảm thiểu DDoS</strong>, hiệu quả nhất.</li>\n<li><strong>Thông tin cần chú ý:</strong> Đang dùng ALB → không cần đổi NLB; cần <strong>rate limiting tự động</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Configure Amazon CloudFront distribution and set Application Load Balancer as the origin. Create a rate-based web ACL rule using AWS WAF and associate it with Amazon CloudFront.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>CloudFront</strong> hấp thụ traffic tại edge, có <strong>Shield Standard</strong> miễn phí chống DDoS Layer 3/4.</li>\n<li><strong>WAF rate-based rule</strong> tự chặn IP gửi quá nhiều request → chống <strong>HTTP flood (Layer 7)</strong> ngay tại edge.</li>\n</ul>","wrong":"<ul>\n<li><strong>NLB + GuardDuty + Lambda:</strong> Đổi NLB không cần; GuardDuty <strong>chỉ phát hiện</strong>, không chặn.</li>\n<li><strong>NLB + VPC Flow Logs + Lambda:</strong> Flow Logs chỉ ghi log, chỉ gửi thông báo.</li>\n<li><strong>Security Group deny:</strong> <strong>SG không có rule deny</strong>; chặn IP thủ công không hiệu quả với DDoS.</li>\n</ul>","tip":"<ul>\n<li>DDoS L3/4 → <strong>Shield Standard</strong>. HTTP flood L7 → <strong>WAF rate-based</strong>. Nâng cao → <strong>Shield Advanced</strong>.</li>\n<li>Mẫu chuẩn: <strong>Route 53 → CloudFront + WAF → ALB → ASG</strong>.</li>\n</ul>"},{"id":54,"topic":"Design Secure Architectures – AWS Network Firewall, kiến trúc 3 tầng","supplement":false,"stem":"<p>A solutions architect is designing a three-tier website that will be hosted on an Amazon EC2 Auto Scaling group fronted by an Internet-facing Application Load Balancer (ALB). The website will persist data to an Amazon Aurora Serverless DB cluster, which will also be used for generating monthly reports.</p>\n<p>The company requires a network topology that follows a layered approach to reduce the impact of misconfigured security groups or network access lists. Web filtering must also be enabled to automatically stop traffic to known malicious URLs and to immediately drop requests coming from blacklisted fully qualified domain names (FQDNs).</p>\n<p>Which network topology provides the minimum resources needed for the website to work?</p>","options":[{"html":"Set up an Application Load Balancer deployed in a public subnet, then host the Auto Scaling Group of EC2 instances and the Aurora Serverless DB cluster in private subnets. Launch an AWS Network Firewall with the appropriate firewall policy to automatically stop traffic to known malicious URLs and drop requests coming from blacklisted FQDNs. Reroute your Amazon VPC network traffic through the firewall endpoints.","correct":true},{"html":"Set up an Auto Scaling group of EC2 instances behind an Application Load Balancer with an Aurora Serverless DB cluster to store application data. Deploy all resources in a public subnet. Configure host-based routing to the Application Load Balancer to stop traffic to known malicious URLs and drop requests from blacklisted FQDNs.","correct":false},{"html":"Set up an Application Load Balancer in front of an Auto Scaling group of EC2 instances with an Aurora Serverless DB cluster to persist data. Launch a NAT Gateway in a public subnet to restrict external services from initiating a connection to the EC2 instances and immediately drop requests from unauthorized FQDNs. Deploy all other resources in private subnets.","correct":false},{"html":"Set up an Application Load Balancer and a NAT Gateway deployed in public subnets. Launch the Auto Scaling Group of EC2 instances and Aurora Serverless DB cluster in private subnets. Directly integrate the AWS Network Firewall with the Application Load Balancer to automatically stop traffic to known malicious URLs and drop requests coming from blacklisted FQDNs.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Website 3 tầng: ALB → EC2 Auto Scaling → Aurora Serverless.</li>\n<li><strong>Yêu cầu chính:</strong></li>\n<li>Bảo mật <strong>nhiều lớp</strong> (layered).</li>\n<li><strong>Web filtering</strong> chặn URL độc hại, drop request từ <strong>FQDN</strong> trong blacklist.</li>\n<li><strong>Tài nguyên tối thiểu</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Lọc theo <strong>FQDN ở cấp VPC</strong> → <strong>AWS Network Firewall</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Set up an Application Load Balancer deployed in a public subnet, then host the Auto Scaling Group of EC2 instances and the Aurora Serverless DB cluster in private subnets. Launch an AWS Network Firewall with the appropriate firewall policy to automatically stop traffic to known malicious URLs and drop requests coming from blacklisted FQDNs. Reroute your Amazon VPC network traffic through the firewall endpoints.</strong></li>\n</ul>","explain":"<ul>\n<li>ALB ở <strong>public subnet</strong>; EC2 và Aurora ở <strong>private subnet</strong>.</li>\n<li><strong>Network Firewall</strong> thêm một lớp bảo vệ ngoài SG/NACL; stateful rule lọc theo <strong>domain list</strong> chặn URL/FQDN độc hại.</li>\n<li>Phải <strong>sửa route table</strong> để traffic đi qua <strong>firewall endpoint</strong>.</li>\n<li>Không có NAT Gateway vì website không cần EC2 chủ động ra Internet → tài nguyên tối thiểu.</li>\n</ul>","wrong":"<ul>\n<li><strong>Tất cả ở public subnet + host-based routing:</strong> Kém an toàn; host-based routing chỉ để <strong>định tuyến</strong>, không lọc URL độc hại.</li>\n<li><strong>NAT Gateway để chặn FQDN:</strong> NAT Gateway chỉ cho private subnet ra Internet, <strong>không lọc</strong> được gì.</li>\n<li><strong>Tích hợp Network Firewall trực tiếp với ALB:</strong> Network Firewall <strong>không gắn trực tiếp vào ALB</strong> (thứ gắn với ALB là <strong>WAF</strong>). NAT Gateway thừa.</li>\n</ul>","tip":"<ul>\n<li>Lọc <strong>domain/FQDN ở cấp VPC</strong>, IPS/IDS → <strong>Network Firewall</strong> + sửa route table.</li>\n<li>SQLi, XSS, rate limiting ở tầng HTTP → <strong>WAF</strong> (gắn ALB, CloudFront, API Gateway).</li>\n</ul>"},{"id":55,"topic":"Design Resilient Architectures – ENI failover","supplement":false,"stem":"<p>A company is running a dashboard application on a Spot EC2 instance inside a private subnet. The dashboard is reachable via a domain name that maps to the private IPv4 address of the instance's network interface. A solutions architect needs to increase network availability by allowing the traffic flow to resume in another instance if the primary instance is terminated.</p>\n<p>Which solution accomplishes these requirements?</p>","options":[{"html":"Attach an elastic IP address to the instance's primary network interface and point its IP address to the application's domain name. Automatically move the EIP to a secondary instance if the primary instance becomes unavailable using the AWS Transit Gateway.","correct":false},{"html":"Set up AWS Transfer for FTPS service in Implicit FTPS mode to automatically disable the <code>source/destination</code> checks on the instance's primary elastic network interface and reassociate it to another instance.","correct":false},{"html":"Use the AWS Network Firewall to detach the instance's primary elastic network interface and move it to a new instance upon failure.","correct":false},{"html":"Create a secondary elastic network interface and point its private IPv4 address to the application's domain name. Attach the new network interface to the primary instance. If the instance goes down, move the secondary network interface to another instance.","correct":true}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Spot EC2 trong <strong>private subnet</strong>, domain trỏ <strong>private IP</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Instance bị terminate → traffic chuyển sang instance khác.</li>\n<li><strong>Thông tin cần chú ý:</strong> Private → không dùng EIP; <strong>primary ENI không detach được</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Create a secondary elastic network interface and point its private IPv4 address to the application's domain name. Attach the new network interface to the primary instance. If the instance goes down, move the secondary network interface to another instance.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Secondary ENI</strong> detach/attach được sang instance khác <strong>cùng AZ</strong>; <strong>private IP đi theo ENI</strong>.</li>\n<li>DNS vẫn trỏ đúng IP → không cần sửa DNS.</li>\n</ul>","wrong":"<ul>\n<li><strong>EIP + Transit Gateway:</strong> EIP là IP public; TGW không chuyển EIP.</li>\n<li><strong>Transfer for FTPS:</strong> Dịch vụ truyền file.</li>\n<li><strong>Network Firewall:</strong> Lọc traffic, không detach ENI.</li>\n</ul>","tip":"<ul>\n<li>IP private cố định chuyển giữa instance → <strong>secondary ENI</strong> (cùng AZ).</li>\n<li>IP public cố định → <strong>Elastic IP</strong>.</li>\n</ul>"},{"id":56,"topic":"Design High-Performing Architectures – NLB + Elastic IP","supplement":false,"stem":"<p>A company has developed public APIs hosted in Amazon EC2 instances behind an Elastic Load Balancer. The APIs will be used by various clients from respective on-premises data centers. A Solutions Architect received a report that the web service clients can only access trusted IP addresses whitelisted on the web service's firewalls.</p>\n<p>What should be done to accomplish the above requirement?</p>","options":[{"html":"Associate an Elastic IP address to a Network Load Balancer.","correct":true},{"html":"Associate an Elastic IP address to an Application Load Balancer.","correct":false},{"html":"Create an Amazon CloudFront distribution whose origin points to the private IP addresses of your web servers.","correct":false},{"html":"Configure General Purpose SSD volumes on the load balancer nodes to provide static IP addresses.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Public API trên EC2 sau load balancer, client gọi từ on-premises.</li>\n<li><strong>Yêu cầu chính:</strong> Firewall của client <strong>chỉ cho đi ra IP đã whitelist</strong> → API cần <strong>IP tĩnh</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Load balancer nào hỗ trợ IP tĩnh?</li>\n</ul>","answer":"<ul>\n<li><strong>Associate an Elastic IP address to a Network Load Balancer.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>NLB</strong> gắn được <strong>Elastic IP</strong> cho từng AZ → IP cố định, client đưa vào whitelist.</li>\n<li>NLB hoạt động ở Layer 4, hiệu năng cao, độ trễ thấp.</li>\n</ul>","wrong":"<ul>\n<li><strong>EIP cho ALB:</strong> <strong>ALB không hỗ trợ EIP</strong>, IP thay đổi khi scale (cần Global Accelerator hoặc NLB phía trước nếu muốn IP tĩnh).</li>\n<li><strong>CloudFront trỏ private IP:</strong> CloudFront không trỏ trực tiếp private IP; IP edge là dải lớn, thay đổi.</li>\n<li><strong>SSD trên node load balancer:</strong> Vô nghĩa, SSD là ổ đĩa.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Nhu cầu</th>\n<th>Giải pháp</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Load balancer có IP tĩnh</td>\n<td><strong>NLB + EIP</strong></td>\n</tr>\n<tr>\n<td>IP tĩnh toàn cầu (anycast)</td>\n<td><strong>Global Accelerator</strong></td>\n</tr>\n<tr>\n<td>Routing Layer 7</td>\n<td><strong>ALB</strong> (không có IP tĩnh)</td>\n</tr>\n</tbody>\n</table>"},{"id":57,"topic":"Design High-Performing Architectures – CloudFront cho download toàn cầu","supplement":false,"stem":"<p>A global company has deployed numerous AWS Outposts servers in various remote locations worldwide. These servers frequently need to download software updates consisting of multiple files from an S3 bucket in the <code>us-west-2</code> region. The company is experiencing significant delays in distributing these updates across all servers.</p>\n<p>What solution would most effectively reduce the deployment latency while minimizing operational overhead?</p>","options":[{"html":"Set up AWS Global Accelerator to route traffic from Outposts servers to the nearest AWS edge location, then use private VIF connections to access the S3 bucket in <code>us-west-2</code>.","correct":false},{"html":"Set up an Amazon CloudFront distribution with the <code>us-west-2</code> S3 bucket as the primary origin and create a secondary origin in another region, implementing a <code>CachingDisabled</code> cache policy. Use signed URLs for downloads.","correct":false},{"html":"Create an Amazon CloudFront distribution with the <code>us-west-2</code> S3 bucket as the origin. Use signed URLs for software downloads.","correct":true},{"html":"Use Amazon S3 Transfer Acceleration on the existing S3 bucket and have the Outposts servers use the Transfer Acceleration endpoint for downloads.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Nhiều server Outposts toàn cầu tải bản cập nhật từ <strong>một bucket ở <code>us-west-2</code></strong>.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Giảm latency</strong> khi download, <strong>ít công vận hành</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Bài toán <strong>download cùng một bộ file</strong> ở nhiều nơi → phù hợp <strong>cache</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Create an Amazon CloudFront distribution with the <code>us-west-2</code> S3 bucket as the origin. Use signed URLs for software downloads.</strong></li>\n</ul>","explain":"<ul>\n<li>CloudFront cache file tại <strong>edge location</strong>; server ở gần tải từ edge → latency giảm mạnh.</li>\n<li><strong>Signed URL</strong> đảm bảo chỉ client hợp lệ mới tải được; kết hợp <strong>OAC</strong> để bucket chỉ cho CloudFront đọc.</li>\n</ul>","wrong":"<ul>\n<li><strong>Global Accelerator + private VIF:</strong> Không cache; private VIF thuộc <strong>Direct Connect</strong>, phức tạp, tốn kém.</li>\n<li><strong>CloudFront + <code>CachingDisabled</code> + secondary origin:</strong> Tắt cache làm mất lợi ích chính; đồng bộ hai bucket tốn công.</li>\n<li><strong>Transfer Acceleration:</strong> Tối ưu chủ yếu cho <strong>upload</strong>, không cache.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Tình huống</th>\n<th>Giải pháp</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Nhiều người download cùng nội dung toàn cầu</td>\n<td><strong>CloudFront</strong></td>\n</tr>\n<tr>\n<td>Upload file lớn từ xa lên S3</td>\n<td><strong>Transfer Acceleration</strong></td>\n</tr>\n<tr>\n<td>TCP/UDP, IP tĩnh</td>\n<td><strong>Global Accelerator</strong></td>\n</tr>\n</tbody>\n</table>"},{"id":58,"topic":"Design Cost-Optimized Architectures – Chuyển dữ liệu vật lý (Data Transfer Terminal)","supplement":false,"stem":"<p>A company has a requirement to move an 80 TB data warehouse to the cloud. It would take 2 months to transfer the data based on the current bandwidth allocation.</p>\n<p>Which option is the most cost-effective for quick data upload to AWS?</p>","options":[{"html":"AWS Data Transfer Terminal","correct":true},{"html":"AWS Storage Gateway Volume Gateway","correct":false},{"html":"AWS Direct Connect","correct":false},{"html":"AWS DataSync","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Data warehouse <strong>80 TB</strong>, qua mạng mất <strong>2 tháng</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> Upload <strong>nhanh</strong> và <strong>rẻ nhất</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Dữ liệu lớn + mạng chậm → <strong>chuyển vật lý</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>AWS Data Transfer Terminal</strong></li>\n</ul>","explain":"<ul>\n<li>Data Transfer Terminal là <strong>địa điểm vật lý</strong> của AWS có kết nối tốc độ rất cao.</li>\n<li>Mang thiết bị lưu trữ đến, upload thẳng lên AWS → 80 TB trong vài giờ thay vì 2 tháng.</li>\n<li>Trả phí theo thời gian sử dụng, không đầu tư hạ tầng mạng.</li>\n<li>Đề cũ: đáp án dạng này thường là <strong>Snowball</strong> (AWS ngừng nhận khách mới cho Snowball từ 2025).</li>\n</ul>","wrong":"<ul>\n<li><strong>Volume Gateway:</strong> Vẫn đi qua đường mạng hiện tại.</li>\n<li><strong>Direct Connect:</strong> Thiết lập lâu, chi phí cao, không đáng cho một lần chuyển.</li>\n<li><strong>DataSync:</strong> Vẫn bị giới hạn băng thông hiện tại.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Tình huống</th>\n<th>Giải pháp</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>TB→PB, mạng chậm, chuyển một lần</td>\n<td><strong>Data Transfer Terminal</strong> / <strong>Snowball</strong> (đề cũ)</td>\n</tr>\n<tr>\n<td>Truyền online</td>\n<td><strong>DataSync</strong></td>\n</tr>\n<tr>\n<td>Kết nối riêng lâu dài</td>\n<td><strong>Direct Connect</strong></td>\n</tr>\n<tr>\n<td>Hybrid</td>\n<td><strong>Storage Gateway</strong></td>\n</tr>\n</tbody>\n</table>"},{"id":59,"topic":"Design Resilient Architectures – CloudWatch + SNS","supplement":false,"stem":"<p>A company has a top priority requirement to monitor certain database metrics and send email notifications to the Operations team if any issues occur.</p>\n<p>Which combination of AWS services can accomplish this requirement? (Select TWO.)</p>","options":[{"html":"Amazon Simple Email Service","correct":false},{"html":"Amazon EC2 Instance with a running Berkeley Internet Name Domain (BIND) Server.","correct":false},{"html":"Amazon CloudWatch","correct":true},{"html":"Amazon Simple Notification Service (SNS)","correct":true},{"html":"Amazon Simple Queue Service (SQS)","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Giám sát metric database.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Monitor metric</strong> + <strong>gửi email</strong> khi có sự cố. <strong>Select TWO</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Amazon CloudWatch</strong></li>\n<li><strong>Amazon Simple Notification Service (SNS)</strong></li>\n</ul>","explain":"<ul>\n<li><strong>CloudWatch</strong> thu thập metric (CPU, FreeStorageSpace, connections...) và tạo <strong>Alarm</strong> theo ngưỡng.</li>\n<li>Alarm chuyển sang <code>ALARM</code> → publish vào <strong>SNS topic</strong> → team Operations subscribe bằng <strong>email</strong>.</li>\n<li>Luồng: <strong>Metric → Alarm → SNS → Email</strong>, không cần code.</li>\n</ul>","wrong":"<ul>\n<li><strong>SES:</strong> Gửi email <strong>từ ứng dụng</strong>; CloudWatch Alarm không tích hợp trực tiếp với SES.</li>\n<li><strong>EC2 chạy BIND:</strong> BIND là <strong>DNS server</strong>.</li>\n<li><strong>SQS:</strong> Hàng đợi message, không gửi email.</li>\n</ul>","tip":"<ul>\n<li>\"Monitor + email notification\" → <strong>CloudWatch + SNS</strong>.</li>\n<li>Email hàng loạt/giao dịch cho khách hàng → <strong>SES</strong>.</li>\n</ul>"},{"id":60,"topic":"Design Resilient Architectures – VPC peering, Direct Connect, VPN backup","supplement":false,"stem":"<p>A media company has two VPCs: VPC-1 and VPC-2 with peering connection between each other. VPC-1 only contains private subnets, while VPC-2 only contains public subnets. The company uses a single AWS Direct Connect connection and a virtual interface to connect its on-premises network with VPC-1.</p>\n<p>Which of the following options increases the fault tolerance of the connection to VPC-1? (Select TWO.)</p>","options":[{"html":"Use the AWS VPN CloudHub to create a new Direct Connect connection and private virtual interface in the same region as VPC-2.","correct":false},{"html":"Establish a separate Direct Connect connection and private virtual interface in the same AWS Region as VPC-2.","correct":false},{"html":"Establish a hardware VPN over the Internet between VPC-1 and the on-premises network.","correct":true},{"html":"Establish a separate Direct Connect connection and private virtual interface in the same AWS region as VPC-1.","correct":true},{"html":"Establish a hardware VPN over the Internet between VPC-2 and the on-premises network.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> VPC-1 (private) và VPC-2 (public) <strong>peering</strong> với nhau. On-premises nối với <strong>VPC-1</strong> qua <strong>một</strong> Direct Connect.</li>\n<li><strong>Yêu cầu chính:</strong> Tăng <strong>fault tolerance</strong> cho kết nối <strong>tới VPC-1</strong>. <strong>Select TWO</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> <strong>VPC peering không hỗ trợ edge-to-edge (transitive) routing</strong> → kết nối dự phòng phải <strong>kết thúc trực tiếp ở VPC-1</strong>, không đi vòng qua VPC-2.</li>\n</ul>","answer":"<ul>\n<li><strong>Establish a hardware VPN over the Internet between VPC-1 and the on-premises network.</strong></li>\n<li><strong>Establish a separate Direct Connect connection and private virtual interface in the same AWS region as VPC-1.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>VPN qua Internet tới VPC-1:</strong> đường dự phòng rẻ, dựng nhanh; nếu Direct Connect lỗi, traffic chuyển sang VPN (mẫu \"VPN as backup to DX\").</li>\n<li><strong>Thêm một Direct Connect + private VIF tới VPC-1:</strong> dự phòng cấp phần cứng/đường truyền, băng thông và độ ổn định như đường chính.</li>\n<li>Cả hai đều <strong>gắn trực tiếp vào VPC-1</strong>, nên không bị giới hạn bởi peering.</li>\n<li>Vì sao không dùng VPC-2: nếu VPC-2 có VPN hoặc DX, tài nguyên ở VPC-1 <strong>không thể dùng ké</strong> kết nối đó qua peering (không có edge-to-edge routing).</li>\n</ul>","wrong":"<ul>\n<li><strong>VPN CloudHub tạo Direct Connect cho VPC-2:</strong> CloudHub dùng để nối <strong>nhiều site on-premises</strong> với nhau qua VGW, không tạo DX; và kết nối ở VPC-2 không giúp VPC-1.</li>\n<li><strong>Direct Connect + VIF ở VPC-2:</strong> Không dùng được cho VPC-1 qua peering.</li>\n<li><strong>Hardware VPN tới VPC-2:</strong> Cùng lý do, peering không chuyển tiếp traffic VPN sang VPC-1.</li>\n</ul>","tip":"<ul>\n<li><strong>VPC peering không transitive</strong>, không cho dùng chung IGW, NAT, VPN, DX, gateway endpoint của VPC kia.</li>\n<li>Dự phòng cho Direct Connect: <strong>thêm DX thứ hai</strong> (độ sẵn sàng cao nhất) hoặc <strong>Site-to-Site VPN backup</strong> (rẻ).</li>\n<li>Cần nhiều VPC dùng chung kết nối on-premises → <strong>Transit Gateway</strong> hoặc <strong>Direct Connect Gateway</strong>.</li>\n</ul>"},{"id":61,"topic":"Design Secure Architectures – AWS Secrets Manager","supplement":false,"stem":"<p>An application is hosted in AWS Fargate and uses RDS database in Multi-AZ Deployments configuration with several Read Replicas. A Solutions Architect was instructed to ensure that all of their database credentials, API keys, and other secrets are encrypted and rotated on a regular basis to improve data security. The application should also use the latest version of the encrypted credentials when connecting to the RDS database.</p>\n<p>Which of the following is the MOST appropriate solution to secure the credentials?</p>","options":[{"html":"Store the database credentials, API keys, and other secrets in AWS KMS.","correct":false},{"html":"Store the database credentials, API keys, and other secrets to AWS ACM.","correct":false},{"html":"Use AWS Secrets Manager to store and encrypt the database credentials, API keys, and other secrets. Enable automatic rotation for all of the credentials.","correct":true},{"html":"Store the database credentials, API keys, and other secrets to Systems Manager Parameter Store each with a <code>SecureString</code> data type. The credentials are automatically rotated by default.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Fargate + RDS Multi-AZ + Read Replicas.</li>\n<li><strong>Yêu cầu chính:</strong> Secret được <strong>mã hóa</strong>, <strong>rotate định kỳ</strong>, ứng dụng dùng <strong>bản mới nhất</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> Mã hóa + rotate + bản mới nhất → <strong>Secrets Manager</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Use AWS Secrets Manager to store and encrypt the database credentials, API keys, and other secrets. Enable automatic rotation for all of the credentials.</strong></li>\n</ul>","explain":"<ul>\n<li>Mã hóa bằng <strong>KMS</strong>; <strong>tự động rotate</strong> (có sẵn Lambda rotation cho RDS, Aurora, Redshift, DocumentDB).</li>\n<li><code>GetSecretValue</code> luôn trả phiên bản <code>AWSCURRENT</code>.</li>\n<li>Với ECS/Fargate: khai báo trường <code>secrets</code> trong task definition.</li>\n</ul>","wrong":"<ul>\n<li><strong>KMS:</strong> Quản lý <strong>encryption key</strong>, không lưu credential.</li>\n<li><strong>ACM:</strong> Quản lý <strong>SSL/TLS certificate</strong>.</li>\n<li><strong>Parameter Store SecureString, rotate mặc định:</strong> Parameter Store <strong>không có rotate tự động</strong>.</li>\n</ul>","tip":"<ul>\n<li>\"Rotate\" + \"credentials/secrets\" → <strong>Secrets Manager</strong>.</li>\n<li>Cấu hình/secret đơn giản, không rotate, rẻ → <strong>Parameter Store</strong>.</li>\n</ul>"},{"id":62,"topic":"Design Secure Architectures – Organizations + IAM Identity Center (AD Connector)","supplement":false,"stem":"<p>A startup has multiple AWS accounts that are assigned to its development teams. Since the company is projected to grow rapidly, the management wants to consolidate all of its AWS accounts into a multi-account setup. To simplify the login process on the AWS accounts, the management wants to utilize its existing directory service for user authentication</p>\n<p>Which combination of actions should a solutions architect recommend to meet these requirements? (Select TWO.)</p>","options":[{"html":"On the master account, use AWS Organizations to create a new organization with all features turned on. Enable the organization's external authentication and point it to use the company's directory service.","correct":false},{"html":"On the master account, use AWS Organizations to create a new organization with all features turned on. Invite the child accounts to this new organization.","correct":true},{"html":"Configure AWS IAM Identity Center (AWS Single Sign-On) for the organization and integrate it with the company's directory service using the Active Directory Connector","correct":true},{"html":"Create an identity pool on Amazon Cognito and configure it to use the company's directory service. Configure AWS IAM Identity Center (AWS Single Sign-On) to accept Cognito authentication.","correct":false},{"html":"Create Service Control Policies (SCP) in the organization to manage the child accounts. Configure AWS IAM Identity Center (AWS Single Sign-On) to use AWS Directory Service.","correct":false}],"multi":2,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Nhiều account cho các team, công ty tăng trưởng nhanh.</li>\n<li><strong>Yêu cầu chính:</strong> Gom account (multi-account) + đăng nhập bằng <strong>directory sẵn có</strong>. <strong>Select TWO</strong>.</li>\n<li><strong>Thông tin cần chú ý:</strong> \"<strong>Existing</strong> directory\" → dùng AD đang có, không tạo mới.</li>\n</ul>","answer":"<ul>\n<li><strong>On the master account, use AWS Organizations to create a new organization with all features turned on. Invite the child accounts to this new organization.</strong></li>\n<li><strong>Configure AWS IAM Identity Center (AWS Single Sign-On) for the organization and integrate it with the company's directory service using the Active Directory Connector</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Organizations (all features):</strong> tạo từ management account, mời account cũ; all features để dùng SCP và Identity Center.</li>\n<li><strong>IAM Identity Center + AD Connector:</strong> SSO vào mọi account; AD Connector là <strong>proxy</strong> tới AD on-premises, không đồng bộ user lên AWS.</li>\n</ul>","wrong":"<ul>\n<li><strong>External authentication của Organizations:</strong> <strong>Không tồn tại</strong>.</li>\n<li><strong>Cognito Identity Pool:</strong> Dành cho người dùng app; Identity Center không dùng Cognito.</li>\n<li><strong>SCP + \"AWS Directory Service\":</strong> SCP không liên quan đăng nhập; có thể hiểu là tạo directory mới; thiếu bước tạo organization.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Nhu cầu</th>\n<th>Giải pháp</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Gom account, SCP</td>\n<td><strong>Organizations</strong></td>\n</tr>\n<tr>\n<td>SSO nhân viên</td>\n<td><strong>IAM Identity Center</strong></td>\n</tr>\n<tr>\n<td>Dùng AD on-premises sẵn có</td>\n<td><strong>AD Connector</strong></td>\n</tr>\n<tr>\n<td>AD managed trên AWS</td>\n<td><strong>AWS Managed Microsoft AD</strong></td>\n</tr>\n</tbody>\n</table>"},{"id":63,"topic":"Design Secure Architectures – Bastion host","supplement":false,"stem":"<p>A company is running a multi-tier web application farm in a virtual private cloud (VPC) that is not connected to their corporate network. They are connecting to the VPC over the Internet to manage the fleet of Amazon EC2 instances running in both the public and private subnets. The Solutions Architect has added a bastion host with Microsoft Remote Desktop Protocol (RDP) access to the application instance security groups, but the company wants to further limit administrative access to all of the instances in the VPC.</p>\n<p>Which of the following bastion host deployment options will meet this requirement?</p>","options":[{"html":"Deploy a Windows Bastion host with an Elastic IP address in the private subnet, and restrict RDP access to the bastion from only the corporate public IP addresses.","correct":false},{"html":"Deploy a Windows Bastion host on the corporate network that has RDP access to all EC2 instances in the VPC.","correct":false},{"html":"Deploy a Windows Bastion host with an Elastic IP address in the public subnet and allow RDP access to bastion only from the corporate IP addresses.","correct":true},{"html":"Deploy a Windows Bastion host with an Elastic IP address in the public subnet and allow SSH access to the bastion from anywhere.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> VPC <strong>không kết nối mạng công ty</strong>, admin quản lý qua Internet bằng <strong>RDP</strong>.</li>\n<li><strong>Yêu cầu chính:</strong> <strong>Giới hạn thêm</strong> quyền truy cập quản trị.</li>\n<li><strong>Thông tin cần chú ý:</strong> Không có VPN → bastion phải ở <strong>public subnet</strong>; giới hạn → chỉ <strong>IP công ty</strong>.</li>\n</ul>","answer":"<ul>\n<li><strong>Deploy a Windows Bastion host with an Elastic IP address in the public subnet and allow RDP access to bastion only from the corporate IP addresses.</strong></li>\n</ul>","explain":"<ul>\n<li>Bastion ở <strong>public subnet</strong>, gắn <strong>EIP</strong>.</li>\n<li>SG của bastion chỉ cho <strong>RDP (3389)</strong> từ <strong>IP public của công ty</strong>.</li>\n<li>SG của instance ứng dụng chỉ cho RDP <strong>từ SG của bastion</strong>.</li>\n</ul>","wrong":"<ul>\n<li><strong>Bastion ở private subnet:</strong> Private subnet không có route ra IGW → không truy cập được từ Internet.</li>\n<li><strong>Bastion trên mạng công ty:</strong> VPC không kết nối mạng công ty.</li>\n<li><strong>SSH từ mọi nơi:</strong> Windows dùng RDP; mở 0.0.0.0/0 trái yêu cầu.</li>\n</ul>","tip":"<ul>\n<li>Bastion chuẩn: <strong>public subnet + EIP + SG chỉ cho IP công ty</strong>.</li>\n<li>SSH = 22, RDP = 3389.</li>\n<li>Hiện đại: <strong>Session Manager</strong> hoặc <strong>EC2 Instance Connect Endpoint</strong> thay bastion.</li>\n</ul>"},{"id":64,"topic":"Design Resilient Architectures – Route 53 failover sang static website","supplement":false,"stem":"<p>A company has a dynamic web app written in MEAN stack that is going to be launched in the next month. There is a probability that the traffic will be quite high in the first couple of weeks. In the event of a load failure, how can you set up DNS failover to a static website?</p>","options":[{"html":"Enable failover to an application hosted in an on-premises data center.","correct":false},{"html":"Duplicate the exact application architecture in another region and configure DNS weight-based routing.","correct":false},{"html":"Use Route 53 with the failover option to a static S3 website bucket or CloudFront distribution.","correct":true},{"html":"Add more servers in case the application fails.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> Web app động (MEAN stack), traffic có thể rất cao lúc ra mắt.</li>\n<li><strong>Yêu cầu chính:</strong> Khi quá tải và lỗi → <strong>DNS failover</strong> sang <strong>static website</strong>.</li>\n<li><strong>Thông tin gây nhiễu:</strong> MEAN stack.</li>\n</ul>","answer":"<ul>\n<li><strong>Use Route 53 with the failover option to a static S3 website bucket or CloudFront distribution.</strong></li>\n</ul>","explain":"<ul>\n<li><strong>Failover routing:</strong> Primary → ứng dụng chính; Secondary → <strong>S3 static website</strong> (có thể đặt CloudFront phía trước).</li>\n<li>Health check phát hiện primary unhealthy → Route 53 trả về secondary.</li>\n<li>S3/CloudFront gần như không quá tải, hiển thị trang \"đang bảo trì\" thay cho trang lỗi.</li>\n</ul>","wrong":"<ul>\n<li><strong>Failover sang on-premises:</strong> Đề yêu cầu static website; on-premises khó chịu tải lớn.</li>\n<li><strong>Nhân bản region + weighted:</strong> Tốn kém; weighted là chia tỷ lệ, không phải failover.</li>\n<li><strong>Thêm server:</strong> Không phải DNS failover.</li>\n</ul>","tip":"<table>\n<thead>\n<tr>\n<th>Policy</th>\n<th>Mục đích</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Failover</strong></td>\n<td>Active-passive, DR</td>\n</tr>\n<tr>\n<td><strong>Weighted</strong></td>\n<td>Chia theo tỷ lệ</td>\n</tr>\n<tr>\n<td><strong>Latency</strong></td>\n<td>Region có latency thấp nhất</td>\n</tr>\n<tr>\n<td><strong>Geolocation</strong></td>\n<td>Theo vị trí người dùng</td>\n</tr>\n<tr>\n<td><strong>Multivalue</strong></td>\n<td>Trả nhiều IP healthy</td>\n</tr>\n</tbody>\n</table>"},{"id":65,"topic":"Design Resilient Architectures – RDS Multi-AZ failover","supplement":false,"stem":"<p>An accounting application uses an Amazon RDS database configured with RDS Multi-AZ to improve availability. What would happen to RDS if the primary database instance fails?</p>","options":[{"html":"A new database instance is created in the standby Availability Zone.","correct":false},{"html":"The primary database instance will reboot.","correct":false},{"html":"The canonical name record (CNAME) is switched from the primary to standby instance.","correct":true},{"html":"The IP address of the primary DB instance is switched to the standby DB instance.","correct":false}],"multi":1,"analysis":"<ul>\n<li><strong>Bối cảnh:</strong> RDS Multi-AZ.</li>\n<li><strong>Yêu cầu chính:</strong> Điều gì xảy ra khi <strong>primary bị lỗi</strong>?</li>\n<li><strong>Thông tin cần chú ý:</strong> Ứng dụng kết nối qua <strong>DNS endpoint</strong> (CNAME).</li>\n</ul>","answer":"<ul>\n<li><strong>The canonical name record (CNAME) is switched from the primary to standby instance.</strong></li>\n</ul>","explain":"<ul>\n<li>Multi-AZ duy trì <strong>standby</strong> ở AZ khác, replicate <strong>đồng bộ</strong>.</li>\n<li>Khi primary lỗi, AWS <strong>đổi CNAME</strong> sang standby và promote standby lên primary.</li>\n<li>Ứng dụng <strong>không phải sửa connection string</strong>. Thời gian failover thường <strong>60–120 giây</strong>.</li>\n</ul>","wrong":"<ul>\n<li><strong>Tạo instance mới:</strong> Standby đã tồn tại sẵn; chỉ sau failover RDS mới tạo standby mới.</li>\n<li><strong>Primary reboot:</strong> Multi-AZ chuyển sang standby thay vì chờ reboot.</li>\n<li><strong>Chuyển IP:</strong> Hai AZ là hai subnet khác nhau, <strong>không dùng chung IP</strong> được; failover dựa vào DNS.</li>\n</ul>","tip":"<ul>\n<li><strong>Multi-AZ failover = đổi CNAME</strong>, endpoint không đổi.</li>\n<li>Multi-AZ: HA, replicate đồng bộ. <strong>Read Replica</strong>: scale read, bất đồng bộ.</li>\n</ul>"}];
const LETTERS = "ABCDEFGH";
const state = {
  order: Q.map((_, i) => i),
  pos: 0,
  sel: {},        // qid -> Set of original option idx
  done: {},       // qid -> true/false (correct?)
  flags: new Set(),
  perm: {},       // qid -> displayed order of original option indices
  hint: {},
  view: "quiz"
};
const $ = s => document.querySelector(s);

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function perm(q){
  if(!state.perm[q.id]) state.perm[q.id] = $("#optShuffleA").checked ? shuffle(q.options.map((_,i)=>i)) : q.options.map((_,i)=>i);
  return state.perm[q.id];
}
function visible(){
  const f = $("#fFilter").value, t = $("#fTopic").value;
  return state.order.filter(i => {
    const q = Q[i];
    if(t && topicGroup(q.topic) !== t) return false;
    if(f === "todo") return !(q.id in state.done);
    if(f === "bad") return state.done[q.id] === false;
    if(f === "flag") return state.flags.has(q.id);
    if(f === "sup") return q.supplement;
    return true;
  });
}
function topicGroup(t){ return t.split("–")[0].trim(); }

function renderStats(){
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length, bad = vals.length - ok;
  $("#sDone").textContent = `${vals.length}/${Q.length}`;
  $("#sOk").textContent = ok; $("#sBad").textContent = bad;
  $("#sPct").textContent = vals.length ? Math.round(ok*100/vals.length) + "%" : "–";
  $("#prog").style.width = (vals.length*100/Q.length) + "%";
}
function renderGrid(){
  const vis = new Set(visible());
  const cur = state.order[state.pos];
  const g = $("#grid"); g.innerHTML = "";
  Q.forEach((q, i) => {
    const b = document.createElement("button");
    b.className = "cell";
    if(q.id in state.done) b.classList.add(state.done[q.id] ? "ok" : "bad");
    if(state.flags.has(q.id)) b.classList.add("flag");
    if(q.supplement) b.classList.add("sup");
    if(i === cur && state.view === "quiz") b.classList.add("cur");
    if(!vis.has(i)) b.classList.add("dim");
    b.textContent = q.id;
    b.title = q.topic + (q.supplement ? " (câu bổ sung)" : "");
    b.onclick = () => { state.view = "quiz"; state.pos = state.order.indexOf(i); render(); window.scrollTo({top:0,behavior:"smooth"}); };
    g.appendChild(b);
  });
}

function section(cls, title, html, open){
  return `<details class="sec ${cls}" ${open?"open":""}><summary>${title}</summary><div class="body">${html}</div></details>`;
}

function renderQuiz(){
  const main = $("#main");
  const vis = visible();
  if(!vis.length){ main.innerHTML = `<div class="card empty">Không có câu nào khớp bộ lọc hiện tại.</div>`; return; }
  let idx = state.order[state.pos];
  if(!vis.includes(idx)){ idx = vis[0]; state.pos = state.order.indexOf(idx); }
  const q = Q[idx];
  const answered = q.id in state.done;
  const sel = state.sel[q.id] || new Set();
  const p = perm(q);
  const vpos = vis.indexOf(idx);

  let opts = p.map((oi, k) => {
    const o = q.options[oi];
    let cls = "opt" + (q.multi > 1 ? " multi" : "");
    let tag = "";
    if(answered){
      if(o.correct && sel.has(oi)){ cls += " right"; tag = "✓ Đúng"; }
      else if(!o.correct && sel.has(oi)){ cls += " wrong"; tag = "✗ Bạn chọn"; }
      else if(o.correct){ cls += " right missed"; tag = "✓ Đáp án đúng"; }
    } else if(sel.has(oi)) cls += " sel";
    return `<div class="${cls}" data-oi="${oi}" role="${q.multi>1?"checkbox":"radio"}" aria-checked="${sel.has(oi)}" tabindex="0">
      <span class="key">${LETTERS[k]}</span><span class="txt">${o.html}${tag?`<span class="tag">${tag}</span>`:""}</span></div>`;
  }).join("");

  const showExplain = answered && $("#optAuto").checked;
  let after = "";
  if(answered){
    const ok = state.done[q.id];
    after += `<div class="verdict ${ok?"ok":"bad"}">${ok ? "Chính xác!" :"Chưa đúng. Xem đáp án được đánh dấu xanh và phần giải thích bên dưới."}</div>`;
    after += section("s-analysis", "Phân tích đề", q.analysis, showExplain);
    after += section("s-answer", "Đáp án đúng", q.answer, showExplain);
    after += section("s-explain", "Giải thích", q.explain, showExplain);
    after += section("s-wrong", "Vì sao các đáp án khác sai", q.wrong, showExplain);
    after += section("s-tip", "Mẹo thi", q.tip, showExplain);
  } else if(state.hint[q.id]){
    after += `<div class="hint"><h3>Gợi ý · Phân tích đề</h3><div class="body">${q.analysis}</div></div>`;
  }

  const need = q.multi > 1 ? `Chọn ${q.multi} đáp án` : "Chọn 1 đáp án";
  main.innerHTML = `<div class="card ${answered?"locked":""}">
    <div class="qhead">
      <span class="qnum">Câu ${q.id}</span>
      <span class="chip">${q.topic}</span>
      ${q.supplement ? `<span class="chip sup">Câu bổ sung</span>` : ""}
      <span class="chip multi">${need}</span>
      <button class="flagbtn ${state.flags.has(q.id)?"on":""}" id="btnFlag">${state.flags.has(q.id)?"★ Đã đánh dấu":"☆ Đánh dấu"}</button>
    </div>
    <div class="stem">${q.stem}</div>
    <div class="opts">${opts}</div>
    <div class="actions">
      <button class="btn" id="btnPrev" ${vpos<=0?"disabled":""}>← Câu trước</button>
      ${!answered ? `<button class="btn ghost" id="btnHint">${state.hint[q.id]?"Ẩn gợi ý":"Gợi ý: phân tích đề"}</button>` : `<button class="btn ghost" id="btnRetry">Làm lại câu này</button>`}
      <span class="spacer"></span>
      ${!answered ? `<button class="btn primary" id="btnCheck" ${sel.size!==q.multi?"disabled":""}>Kiểm tra</button>` : ""}
      <button class="btn ${answered?"primary":""}" id="btnNext" ${vpos>=vis.length-1?"disabled":""}>Câu sau →</button>
    </div>
    ${after}
    <div class="kbd"><kbd>A</kbd>–<kbd>E</kbd> hoặc <kbd>1</kbd>–<kbd>5</kbd> chọn đáp án · <kbd>Enter</kbd> kiểm tra / sang câu sau · <kbd>←</kbd> <kbd>→</kbd> chuyển câu · <kbd>H</kbd> gợi ý</div>
  </div>`;

  main.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => toggle(q, +el.dataset.oi);
    el.onkeydown = e => { if(e.key===" "){ e.preventDefault(); toggle(q, +el.dataset.oi); } };
  });
  $("#btnFlag").onclick = () => { state.flags.has(q.id) ? state.flags.delete(q.id) : state.flags.add(q.id); render(); };
  $("#btnPrev").onclick = () => go(-1);
  $("#btnNext").onclick = () => go(1);
  if($("#btnCheck")) $("#btnCheck").onclick = () => check(q);
  if($("#btnHint")) $("#btnHint").onclick = () => { state.hint[q.id] = !state.hint[q.id]; render(); };
  if($("#btnRetry")) $("#btnRetry").onclick = () => { delete state.done[q.id]; state.sel[q.id] = new Set(); delete state.perm[q.id]; render(); };
}

function toggle(q, oi){
  if(q.id in state.done) return;
  const s = state.sel[q.id] || (state.sel[q.id] = new Set());
  if(q.multi === 1){ s.clear(); s.add(oi); }
  else if(s.has(oi)) s.delete(oi);
  else { if(s.size >= q.multi) return; s.add(oi); }
  render();
}
function check(q){
  const s = state.sel[q.id] || new Set();
  if(s.size !== q.multi) return;
  const correct = q.options.every((o, i) => o.correct === s.has(i));
  state.done[q.id] = correct;
  render();
}
function go(d){
  const vis = visible();
  const cur = state.order[state.pos];
  let vp = vis.indexOf(cur);
  vp = Math.max(0, Math.min(vis.length-1, vp + d));
  state.pos = state.order.indexOf(vis[vp]);
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderSummary(){
  const groups = {};
  Q.forEach(q => {
    const g = topicGroup(q.topic);
    groups[g] = groups[g] || {n:0, done:0, ok:0, bad:[]};
    groups[g].n++;
    if(q.id in state.done){ groups[g].done++; if(state.done[q.id]) groups[g].ok++; else groups[g].bad.push(q.id); }
  });
  const vals = Object.values(state.done);
  const ok = vals.filter(Boolean).length;
  const wrongIds = Q.filter(q => state.done[q.id] === false).map(q => q.id);
  const rows = Object.entries(groups).sort((a,b)=>b[1].n-a[1].n).map(([g, v]) => {
    const pct = v.done ? Math.round(v.ok*100/v.done) : null;
    return `<tr><td>${g}</td><td class="n">${v.done}/${v.n}</td><td class="n">${pct===null?"–":pct+"%"}</td>
      <td><div class="bar"><i style="width:${pct||0}%"></i></div></td><td>${v.bad.map(id=>`<a href="#" data-q="${id}">${id}</a>`).join(", ")}</td></tr>`;
  }).join("");
  $("#main").innerHTML = `<div class="card summary">
    <h2>Kết quả</h2>
    <p>Đã làm <b>${vals.length}/${Q.length}</b> câu · Đúng <b>${ok}</b> · Sai <b>${vals.length-ok}</b>${vals.length?` · Tỷ lệ đúng <b>${Math.round(ok*100/vals.length)}%</b>`:""}.
    ${vals.length===Q.length ? (ok/Q.length>=0.72 ? " Mức này tương đương ngưỡng đậu (~720/1000)." : " Chưa đạt ngưỡng ~72%, nên ôn lại các câu sai.") : ""}</p>
    ${wrongIds.length ? `<p><button class="btn primary" id="btnReviewBad">Ôn lại ${wrongIds.length} câu sai</button></p>` : ""}
    <table><thead><tr><th>Chủ đề</th><th class="n">Đã làm</th><th class="n">Đúng</th><th></th><th>Câu sai</th></tr></thead><tbody>${rows}</tbody></table>
    <p style="margin-top:14px"><button class="btn" id="btnBack">← Quay lại làm bài</button></p>
  </div>`;
  $("#btnBack").onclick = () => { state.view = "quiz"; render(); };
  if($("#btnReviewBad")) $("#btnReviewBad").onclick = () => {
    $("#fFilter").value = "bad"; $("#fTopic").value = "";
    wrongIds.forEach(id => { delete state.done[id]; state.sel[id] = new Set(); delete state.perm[id]; });
    // keep them findable after reset: mark as flagged review set
    wrongIds.forEach(id => state.flags.add(id));
    $("#fFilter").value = "flag";
    state.view = "quiz"; state.pos = state.order.indexOf(Q.findIndex(q => q.id === wrongIds[0])); render();
  };
  $("#main").querySelectorAll("a[data-q]").forEach(a => a.onclick = e => {
    e.preventDefault(); state.view = "quiz"; $("#fFilter").value = "all"; $("#fTopic").value = "";
    state.pos = state.order.indexOf(Q.findIndex(q => q.id === +a.dataset.q)); render();
  });
}

function render(){
  renderStats(); renderGrid();
  state.view === "summary" ? renderSummary() : renderQuiz();
}

// init
(function(){
  const groups = [...new Set(Q.map(q => topicGroup(q.topic)))].sort();
  groups.forEach(g => { const o = document.createElement("option"); o.value = g; o.textContent = g; $("#fTopic").appendChild(o); });
  $("#fFilter").onchange = $("#fTopic").onchange = () => { state.view = "quiz"; render(); };
  $("#optShuffleQ").onchange = e => {
    const cur = state.order[state.pos];
    state.order = e.target.checked ? shuffle(Q.map((_, i) => i)) : Q.map((_, i) => i);
    state.pos = e.target.checked ? 0 : state.order.indexOf(cur);
    render();
  };
  $("#optShuffleA").onchange = () => { Q.forEach(q => { if(!(q.id in state.done)) delete state.perm[q.id]; }); render(); };
  $("#optAuto").onchange = render;
  $("#btnSummary").onclick = () => { state.view = "summary"; render(); };
  $("#btnReset").onclick = () => {
    if(!Object.keys(state.done).length) return;
    state.sel = {}; state.done = {}; state.hint = {}; state.perm = {}; state.pos = 0; state.view = "quiz";
    $("#fFilter").value = "all"; render();
  };
  $("#btnTheme").onclick = () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  };
  document.addEventListener("keydown", e => {
    if(state.view !== "quiz" || e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    const q = Q[state.order[state.pos]]; if(!q) return;
    const k = e.key.toUpperCase();
    let n = "12345678".indexOf(k); if(n < 0) n = LETTERS.indexOf(k);
    if(k.length === 1 && n >= 0 && n < q.options.length && k !== "H"){ toggle(q, perm(q)[n]); return; }
    if(e.key === "Enter"){ e.preventDefault(); (q.id in state.done) ? go(1) : check(q); }
    else if(e.key === "ArrowRight") go(1);
    else if(e.key === "ArrowLeft") go(-1);
    else if(k === "H" && !(q.id in state.done)){ state.hint[q.id] = !state.hint[q.id]; render(); }
  });
  render();
})();
</script>
</body>
</html>
